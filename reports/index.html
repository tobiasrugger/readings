<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Report &middot; Mr. Toby</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2320;--muted:#56605b;--dark:#26302b;--pine:#1F4D3D;--pine-lt:#e7f0ec;--paper:#f4f2ec;
  --green:#1f7a4d;--green-bg:#dff2e6;--gold:#9a6a12;--gold-bg:#fdf0d5;--grey:#8a918d;--red:#b5304a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.45}
.hide{display:none!important}
button,select,input{font:inherit}
.top{background:var(--pine);color:#fff;border-bottom:4px solid #0f2a20}
.top .in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{margin:0;font-size:1.3rem;font-weight:900;flex:1}
.top a{color:#fff;font-weight:800}
.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 60px}
.box{background:#fff;border:2px solid var(--dark);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.18);padding:14px 18px;margin-bottom:16px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.controls div>label{display:block;font-weight:900;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
select,input[type=password]{border:2px solid var(--dark);border-radius:10px;padding:8px 10px;background:#fff}
.btn{background:var(--pine);color:#fff;border:2px solid #0f2a20;border-bottom-width:4px;border-radius:10px;padding:8px 16px;font-weight:900;cursor:pointer}
.btn.ghost{background:#fff;color:var(--pine)}
.tog{display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer}
.tog input{width:20px;height:20px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sum div{border:2px solid var(--dark);border-radius:10px;padding:6px 14px;font-weight:900;background:#fff}
.sum b{font-size:1.4rem;margin-right:6px}
.sum .g{background:var(--green-bg)} .sum .y{background:var(--gold-bg)}
h2{margin:0 0 4px;font-size:1.5rem;font-weight:900}
.sub{color:var(--muted);font-weight:700;margin:0 0 10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:1rem}
th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:3px solid var(--dark);padding:8px 8px}
td{border-bottom:1.5px solid #c9cfcb;padding:9px 8px;vertical-align:middle}
tr:nth-child(even) td{background:#f8f7f3}
td.nm{font-weight:900;font-size:1.08rem;white-space:nowrap}
td.nm small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.now{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:900;color:#fff;background:var(--grey);border-radius:6px;padding:1px 6px;vertical-align:middle}
.big{font-weight:900;font-size:1.15rem}
.bar{display:inline-block;width:90px;height:10px;border:1.5px solid var(--dark);border-radius:6px;overflow:hidden;vertical-align:middle;margin-left:8px;background:#fff}
.bar i{display:block;height:100%;background:var(--green)}
.chk{font-size:1.5rem;font-weight:900;color:var(--green)}
.half{font-size:1.3rem;font-weight:900;color:var(--gold)}
.none{color:var(--grey);font-weight:800}
.chip{display:inline-block;border:2px solid var(--dark);border-radius:8px;padding:0 7px;margin:1px 3px 1px 0;font-weight:900;font-size:.85rem;background:#fff}
.chip.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.chip.go{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.chip.no{color:var(--grey);border-color:#b9bfbb}
.muted{color:var(--muted);font-size:.85rem}
.foot{color:var(--muted);font-size:.9rem;margin-top:10px}
.gate{max-width:380px;margin:70px auto;text-align:center}
.gate input{width:100%;margin:10px 0}
.err{color:var(--red);font-weight:800}
body.classview .priv{display:none}
@media print{
  .top,.box.controls-box,.noprint{display:none!important}
  body{background:#fff;font-size:13px}
  .box{box-shadow:none;border:1.5px solid #000;padding:8px 10px}
  td{padding:5px 6px} tr:nth-child(even) td{background:#f3f3f3}
}
</style>
</head>
<body>
<div class="top"><div class="in"><h1>Class Report</h1><a href="../assign/">Push an activity &rarr;</a></div></div>

<div class="gate box" id="gate">
  <h2>Teacher only</h2>
  <input type="password" id="pw" placeholder="Password">
  <button class="btn" id="pwGo">Open</button>
  <p class="err" id="pwErr"></p>
</div>

<div class="wrap hide" id="main">
  <div class="box controls-box">
    <div class="controls">
      <div><label for="selPer">Period</label>
        <select id="selPer"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
      <div><label for="selText">Text</label>
        <select id="selText"></select></div>
      <label class="tog"><input type="checkbox" id="cv"> Class view (checkmarks only, no emails or %)</label>
      <button class="btn ghost" id="reload">Refresh</button>
      <button class="btn" onclick="window.print()">Print</button>
    </div>
    <p class="muted" style="margin:10px 0 0">Everyone who has ever chosen this period on any page is listed, merged across email spellings. &ldquo;now P5&rdquo; means their profile says a different period today.</p>
  </div>

  <div class="box">
    <h2 id="title">Loading&hellip;</h2>
    <p class="sub" id="when"></p>
    <div class="sum" id="sum"></div>
    <div class="tablewrap" style="margin-top:12px">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"><tr><td>Loading&hellip;</td></tr></tbody>
      </table>
    </div>
    <p class="foot" id="foot"></p>
  </div>
</div>

<script>
var SUPA_URL = "https://lhmwtfyceilgndpygivj.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU";
var PASSWORD = "galileo2026";

/* One entry per text. guide = the reading page's table and its guide_keys; vocab = vocab_work set slugs; write = write_work slug. */
var TEXTS = {
  landlady: { name: "The Landlady", guide: { table: "landlady_responses", keys: { landlady: "Main", landlady_easy: "Easier", landlady_hard: "Harder" } },
              vocab: ["landlady-1", "landlady-2", "landlady-3", "landlady-4"], write: "write/landlady" },
  telltale: { name: "The Tell-Tale Heart", guide: { table: "telltale_responses", keys: { telltale: "Main" } },
              vocab: ["telltale-1"], write: "write/telltale" },
  omelas:   { name: "The Ones Who Walk Away from Omelas", guide: { table: "omelas_responses", keys: { omelas: "Main", omelas_easy: "Easier", omelas_hard: "Harder" } },
              vocab: ["omelas-1", "omelas-2", "omelas-3", "omelas-4"], write: null }
};

/* Every table where a student types their period. Missing tables are skipped quietly. */
var ROSTER_TABLES = ["students", "landlady_responses", "telltale_responses", "omelas_responses", "write_work", "vocab_work",
  "launch_plus", "reel_views", "song_work", "say_work", "find_someone", "verb_practice", "unit_responses", "arrival_responses",
  "toolkit_work", "psych_work", "manzanar_work", "seedfolks_work"];

function H(){ return { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY }; }
function get(path){
  return fetch(SUPA_URL + "/rest/v1/" + path, { headers: H() })
    .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}
/* page through a table so a big one is not cut off at 1000 rows */
function getAll(path){
  var out = [], size = 1000;
  function page(from){
    return fetch(SUPA_URL + "/rest/v1/" + path, { headers: Object.assign(H(), { Range: from + "-" + (from + size - 1), "Range-Unit": "items" }) })
      .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
      .then(function(rows){
        if(!rows) return out.length ? out : null;
        out = out.concat(rows);
        return rows.length === size ? page(from + size) : out;
      });
  }
  return page(0);
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function per(v){ var m = String(v == null ? "" : v).match(/[1-7]/); return m ? m[0] : ""; }
var ALIAS = {};
function canon(e){
  e = String(e || "").trim().toLowerCase().replace("@s.sfusd.edu", "@sfusd.edu");
  return ALIAS[e] || e;
}
function when(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate();
}
function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }

/* ---------- gate ---------- */
function openMain(){ document.getElementById("gate").classList.add("hide"); document.getElementById("main").classList.remove("hide"); load(); }
document.getElementById("pwGo").onclick = function(){
  if(document.getElementById("pw").value === PASSWORD){ try{ sessionStorage.setItem("gal_teacher", "1"); }catch(e){} openMain(); }
  else document.getElementById("pwErr").textContent = "Wrong password.";
};
document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key === "Enter") document.getElementById("pwGo").click(); });

/* ---------- controls ---------- */
var qs = new URLSearchParams(location.search);
var selText = document.getElementById("selText");
Object.keys(TEXTS).forEach(function(k){ var o = document.createElement("option"); o.value = k; o.textContent = TEXTS[k].name; selText.appendChild(o); });
if(qs.get("text") && TEXTS[qs.get("text")]) selText.value = qs.get("text");
if(qs.get("period")) document.getElementById("selPer").value = per(qs.get("period")) || "3";
document.getElementById("selPer").onchange = draw;
selText.onchange = load;
document.getElementById("reload").onclick = load;
document.getElementById("cv").onchange = function(){ document.body.classList.toggle("classview", this.checked); draw(); };

/* ---------- load ---------- */
var D = null;
function rosterRows(t){
  /* try the usual column names; fall back to everything */
  return get(t + "?select=email,period,student_name,updated_at").then(function(r){
    if(r) return r;
    return get(t + "?select=email,period,name").then(function(r2){
      if(r2) return r2;
      return get(t + "?select=email,period");
    });
  }).then(function(r){ return { table: t, rows: r || [] }; });
}
function load(){
  var T = TEXTS[selText.value];
  document.getElementById("title").textContent = "Loading\u2026";
  var keys = Object.keys(T.guide.keys);
  Promise.all([
    getAll("student_aliases?select=alias_email,email"),
    get("students?select=email,first_name,last_name,period"),
    Promise.all(ROSTER_TABLES.map(rosterRows)),
    get(T.guide.table + "?select=email,student_name,period,guide_key,answered,total,submitted,updated_at,vocab_check:payload->vocab_check&guide_key=in.(" + keys.join(",") + ")")
      .then(function(r){ return r || get(T.guide.table + "?select=*&guide_key=in.(" + keys.join(",") + ")").then(function(a){
        return (a || []).map(function(x){ x.vocab_check = x.payload && x.payload.vocab_check; return x; }); }); }),
    T.vocab.length ? get("vocab_work?select=email,set_slug,scores,turned_in,updated_at&set_slug=in.(" + T.vocab.join(",") + ")") : Promise.resolve([]),
    T.write ? get("write_work?select=email,score,max_score,turned_in,updated_at&slug=eq." + encodeURIComponent(T.write)) : Promise.resolve([])
  ]).then(function(r){
    ALIAS = {};
    (r[0] || []).forEach(function(a){ if(a.alias_email && a.email) ALIAS[String(a.alias_email).toLowerCase().replace("@s.sfusd.edu", "@sfusd.edu")] = String(a.email).toLowerCase().replace("@s.sfusd.edu", "@sfusd.edu"); });
    D = { T: T, students: r[1] || [], roster: r[2], guide: r[3], vocab: r[4] || [], write: r[5] || [], at: new Date() };
    draw();
  });
}

/* ---------- build the class ---------- */
function build(P){
  var S = {};                      /* canonical email -> student */
  function S_(e){ e = canon(e); if(!e || e.indexOf("@") < 0 || /@test\.local$/.test(e)) return null; return S[e] || (S[e] = { email: e, names: {}, periods: {}, profile: "", first: "", last: "" }); }
  D.students.forEach(function(s){
    var x = S_(s.email); if(!x) return;
    x.first = s.first_name || ""; x.last = s.last_name || ""; x.profile = per(s.period);
    if(x.profile) x.periods[x.profile] = 1;
  });
  D.roster.forEach(function(t){
    t.rows.forEach(function(row){
      var p = per(row.period); if(!p) return;
      var x = S_(row.email); if(!x) return;
      x.periods[p] = 1;
      var nm = (row.student_name || row.name || "").trim();
      if(nm) x.names[nm] = (x.names[nm] || 0) + 1;
    });
  });
  /* work for this text also counts as "chose this period" */
  (D.guide || []).forEach(function(g){ var x = S_(g.email); if(x && per(g.period)) x.periods[per(g.period)] = 1; });

  var list = Object.keys(S).map(function(k){ return S[k]; }).filter(function(x){ return x.periods[P]; });
  list.forEach(function(x){
    var nm = (x.first + " " + x.last).trim();
    if(!nm){ var best = "", n = 0; Object.keys(x.names).forEach(function(k){ if(x.names[k] > n){ n = x.names[k]; best = k; } }); nm = best; }
    x.name = nm || x.email.split("@")[0];
    var parts = x.name.split(/\s+/); x.sortKey = (x.last || parts[parts.length - 1] || "").toLowerCase() + " " + x.name.toLowerCase();
    x.guide = null; x.vocab = {}; x.write = null; x.vc = null;
  });
  var byE = {}; list.forEach(function(x){ byE[x.email] = x; });
  (D.guide || []).forEach(function(g){
    var x = byE[canon(g.email)]; if(!x) return;
    var p = pct(g.answered || 0, g.total || 0);
    /* keep the version with the most work, a turned-in one first */
    var cur = x.guide;
    if(!cur || (g.submitted && !cur.submitted) || (!!g.submitted === !!cur.submitted && p > cur.p)) x.guide = { p: p, a: g.answered || 0, t: g.total || 0, submitted: !!g.submitted, key: g.guide_key, at: g.updated_at };
    if(g.vocab_check && (!x.vc || g.vocab_check.score > x.vc.score)) x.vc = g.vocab_check;
  });
  D.vocab.forEach(function(v){
    var x = byE[canon(v.email)]; if(!x) return;
    var s = v.scores || {}, n = s.total_words || 0;
    var p = n ? Math.min(100, pct((s.match || 0) + (s.mc || 0) + (s.cloze || 0) + (s.spell || 0), 4 * n)) : 0;
    var cur = x.vocab[v.set_slug];
    if(!cur || (v.turned_in && !cur.done) || p > cur.p) x.vocab[v.set_slug] = { p: p, done: !!v.turned_in || (cur && cur.done) };
  });
  D.write.forEach(function(w){
    var x = byE[canon(w.email)]; if(!x) return;
    var p = pct(w.score || 0, w.max_score || 0);
    if(!x.write || p > x.write.p) x.write = { p: p, s: w.score || 0, m: w.max_score || 0, done: !!w.turned_in };
  });
  list.sort(function(a, b){ return a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0; });
  return list;
}

/* ---------- draw ---------- */
function draw(){
  if(!D) return;
  var P = document.getElementById("selPer").value, T = D.T, cv = document.getElementById("cv").checked;
  var list = build(P);
  document.getElementById("title").textContent = "Period " + P + " \u00b7 " + T.name;
  document.getElementById("when").textContent = "As of " + D.at.toLocaleDateString() + " " + D.at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + " \u00b7 " + list.length + " students";
  var nIn = 0, nGo = 0, nNo = 0;
  list.forEach(function(x){ if(x.guide && x.guide.submitted) nIn++; else if(x.guide && x.guide.a) nGo++; else nNo++; });
  document.getElementById("sum").innerHTML =
    '<div class="g"><b>' + nIn + '</b>turned in</div><div class="y"><b>' + nGo + '</b>started</div><div><b>' + nNo + '</b>not started</div>';

  var head = '<tr><th>#</th><th>Student</th><th>Reading guide</th><th>Turned in</th>';
  if(!cv) head += '<th>Word check</th>';
  if(T.vocab.length) head += '<th>Word practice</th>';
  if(T.write) head += '<th>Writing Ladder</th>';
  if(!cv) head += '<th>Last</th>';
  document.getElementById("thead").innerHTML = head + '</tr>';

  var h = "";
  list.forEach(function(x, i){
    var g = x.guide;
    h += '<tr><td class="muted">' + (i + 1) + '</td>';
    h += '<td class="nm">' + esc(x.name) +
         (x.profile && x.profile !== P ? '<span class="now priv">now P' + esc(x.profile) + '</span>' : '') +
         '<small class="priv">' + esc(x.email) + '</small></td>';
    /* reading guide */
    if(!g || !g.a) h += '<td><span class="none">&mdash;</span></td>';
    else if(cv) h += '<td>' + (g.p >= 100 ? '<span class="chk">\u2713</span>' : '<span class="half">\u25D0</span>') + '</td>';
    else h += '<td><span class="big">' + g.p + '%</span><span class="bar"><i style="width:' + g.p + '%"></i></span>' +
              '<div class="muted">' + g.a + ' of ' + g.t + (T.guide.keys[g.key] !== "Main" ? ' \u00b7 ' + T.guide.keys[g.key] + ' page' : '') + '</div></td>';
    h += '<td>' + (g && g.submitted ? '<span class="chk">\u2713</span>' : '<span class="none">&mdash;</span>') + '</td>';
    if(!cv) h += '<td>' + (x.vc ? '<b>' + x.vc.score + '/' + x.vc.total + '</b>' : '<span class="none">&mdash;</span>') + '</td>';
    if(T.vocab.length){
      h += '<td>' + T.vocab.map(function(slug, k){
        var v = x.vocab[slug], lab = T.vocab.length > 1 ? (k + 1) : "Set";
        if(!v) return '<span class="chip no">' + lab + '</span>';
        if(v.done || v.p >= 100) return '<span class="chip done">' + lab + ' \u2713</span>';
        return '<span class="chip go">' + lab + (cv ? ' \u25D0' : ' ' + v.p + '%') + '</span>';
      }).join("") + '</td>';
    }
    if(T.write){
      var w = x.write;
      h += '<td>' + (!w || !w.s ? '<span class="none">&mdash;</span>' :
           (w.done ? '<span class="chk">\u2713</span> ' : '') + (cv ? (w.done ? '' : '<span class="half">\u25D0</span>') : '<b>' + w.p + '%</b>')) + '</td>';
    }
    if(!cv) h += '<td class="muted">' + when(g && g.at) + '</td>';
    h += '</tr>';
  });
  document.getElementById("tbody").innerHTML = h || '<tr><td colspan="8">Nobody has chosen period ' + esc(P) + ' yet.</td></tr>';
  document.getElementById("foot").innerHTML = cv
    ? '\u2713 = finished &middot; \u25D0 = started &middot; &mdash; = not yet'
    : 'Reading guide % = questions answered out of the questions on the page when the student last saved (the number the gradebook gets). A student who finished an older version will see the new questions when they reopen the page; nothing they wrote is lost. ' + (T.vocab.length > 1 ? 'Word practice chips are the ' + T.vocab.length + ' vocab sets, in order.' : '');;
}

try{ if(sessionStorage.getItem("gal_teacher") === "1") openMain(); }catch(e){}
</script>
</body>
</html>
