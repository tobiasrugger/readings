<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Student data · one page per student</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* T-392 · readings/studentdata/ — one teacher page per student: that student's own line from every dashboard. */
:root{--pine:#1b4332;--pine2:#2d6a4f;--moss:#40916c;--sage:#95d5b2;--paper:#f4f5f2;--ink:#1f2421;--muted:#5c6b62;--line:#dfe4dd;--box:#2b3a31;--gold:#d4a017;--rust:#b5451b;--blue:#2f6fd6;
 --plum:#5B2A6E;--lilac-2:#E2D3EA;--know:#2F8A5B;--know-bg:#DDF1E5;--miss:#C0453A;--idk:#9C8FA3}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45}
#bar{background:var(--pine);color:#fff;padding:10px 16px 10px 150px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bar .brand{font-weight:800;font-size:1.02rem;margin-right:6px}
#bar select,#bar button,#bar a,#bar input{font-family:inherit;font-size:.85rem;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;text-decoration:none;cursor:pointer}
#bar select option{color:var(--ink)}
#bar input::placeholder{color:rgba(255,255,255,.7)}
#bar .sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:16px}
.muted{color:var(--muted)}
/* ---- the student line at the top ---- */
#who{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
#who h1{margin:0;font-size:1.5rem;font-weight:800}
#who a.em{color:var(--blue);font-weight:700}
#who .per{color:#8b948f;font-size:1.15rem;font-weight:700}
#who .crs{color:var(--blue);font-size:1.2rem;font-weight:800}
#who .kind{font-size:.75rem;font-weight:800;background:#fff1bf;border:1.5px solid #8a6a00;border-radius:999px;padding:1px 9px}
#glance{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
#glance .g{background:#fff;border:2px solid var(--box);border-radius:10px;padding:5px 12px;font-size:.85rem;box-shadow:0 2px 0 rgba(0,0,0,.12)}
#glance .g b{font-size:1.05rem;color:var(--pine2)}
#glance a.g{color:var(--pine);font-weight:800;text-decoration:none}
/* ---- one section = one dashboard's row ---- */
.sec{background:#fff;border:2px solid var(--box);border-radius:12px;margin:0 0 16px;box-shadow:0 3px 0 rgba(0,0,0,.14);overflow:hidden}
.sec.moved{animation:flash 1s ease-out}
@keyframes flash{from{box-shadow:0 0 0 4px var(--gold)}to{box-shadow:0 3px 0 rgba(0,0,0,.14)}}
@media(prefers-reduced-motion:reduce){.sec.moved{animation:none}}
.sh{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:2px solid var(--box);background:#eef3ee}
.sh h2{margin:0;font-size:1.08rem;font-weight:800;flex:1}
.sh .ns{font-size:.85rem;color:var(--muted);font-weight:700}
.sec.slim .sh{border-bottom:none;background:#fff}
@media(max-width:600px){.sh{flex-wrap:wrap}.sh h2{flex-basis:100%}.sh a.open{margin-right:auto}}
.sh a.open{font-size:.8rem;font-weight:800;color:var(--pine2);white-space:nowrap}
.mv{display:flex;gap:4px;align-items:center}
.mv button{border:1.5px solid var(--box);background:#fff;border-radius:7px;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--pine)}
.mv button.s{width:26px;height:26px}
.mv button.b{width:34px;height:34px}
.mv button:hover:not(:disabled){background:var(--sage)}
.mv button:disabled{opacity:.3;cursor:default}
.mv button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.sb{overflow-x:auto;padding:4px 6px 8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;color:var(--muted);font-weight:800;white-space:nowrap}
tr:last-child td{border-bottom:none}
.empty{padding:10px 12px;color:var(--muted);font-size:.9rem}
/* Launch Plus row (same look as launch-plus/dashboard.html) */
.parts{display:flex;gap:3px}
.pt{width:28px;height:22px;border-radius:5px;font-size:.68rem;font-weight:800;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);background:#fff}
.pt.ok{background:var(--pine2);color:#fff;border-color:var(--pine2)}
.pt.part{background:var(--sage);color:var(--pine);border-color:var(--sage)}
.score{font-weight:800}.score.lo{color:var(--rust)}.score.mid{color:var(--gold)}.score.hi{color:var(--pine2)}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 8px}
.tag.in{background:var(--pine2);color:#fff}.tag.no{background:var(--line);color:var(--muted)}
.wr{font-size:.86rem;white-space:pre-wrap;background:#fafbf8;border-left:4px solid var(--sage);padding:6px 10px;margin:4px 0;border-radius:0 8px 8px 0}
.wr b{display:block;font-size:.7rem;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--pine2);font-weight:800;font-size:.8rem;padding:2px 8px}
/* Daily Basics row (same look as basics/dashboard.html) */
.cell{display:inline-block;min-width:40px;text-align:center;border-radius:6px;padding:2px 4px;font-weight:800;font-size:.8rem}
.cell.hi{background:#d8f0e2;color:var(--pine)}.cell.mid{background:#fff1bf;color:#6b5200}.cell.lo{background:#fbeae5;color:#8a2f10}.cell.none{color:#c4ccc6}
th.day,td.day{text-align:center;font-size:.7rem}
.strip{display:flex;gap:2px;justify-content:center;margin-top:3px}
.lv{font-style:normal;font-size:.68rem;font-weight:800;border:1.5px solid #c9d1cb;border-radius:5px;padding:0 3px;color:#9aa59e;background:#fff;line-height:1.4}
.lv sub{font-size:.58rem;margin-left:1px}
.lv.open{border-style:dotted;color:#5c6b62}.lv.half{border:1.5px dashed #d4a017;color:#7a5c00}.lv.done{background:#d8f0e2;border-color:#2d6a4f;color:#1b4332}.lv.paper{background:#fff1bf;border-color:#8a6a00;color:#5c4400}
/* Vocab Pre-Assessment row (same look as vocab/pre/dashboard.html) */
.meter{display:inline-block;width:80px;height:10px;border-radius:5px;background:var(--lilac-2);vertical-align:middle;overflow:hidden;margin-right:7px}
.meter i{display:block;height:100%;background:var(--plum)}
.sq{display:inline-block;width:16px;height:16px;border-radius:3px;margin:0 2px 2px 0;vertical-align:-3px}
.sq.k{background:var(--know)}.sq.m{background:var(--miss)}.sq.i{background:var(--idk)}.sq.e0{background:#e6e1ea}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:.76rem;font-weight:700}
.pill.done{background:var(--know-bg);color:var(--know)}.pill.going{background:#FBEFD2;color:#8A6310}
.cls{font-size:.75rem;color:var(--muted)}
/* gradebook list */
.band{display:inline-block;min-width:30px;text-align:center;font-weight:800;border-radius:6px;padding:1px 6px;font-size:.8rem}
.b45,.b4{background:#d8f0e2;color:var(--pine)}.b3{background:#e8f3ee;color:var(--pine2)}.b2{background:#fff1bf;color:#6b5200}.b1,.b0{background:#fbeae5;color:#8a2f10}
#gbf{font-family:inherit;font-size:.85rem;padding:5px 9px;border:2px solid var(--line);border-radius:8px;margin:6px 6px 2px}
/* picker (no student chosen) */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pbox{background:#fff;border:2px solid var(--box);border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.14);padding:8px 12px}
.pbox h3{margin:2px 0 6px;font-size:1rem}
.pbox a{display:block;color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:6px;font-weight:700}
.pbox a:hover{background:var(--sage)}
.pbox a small{color:var(--muted);font-weight:400}
#gate{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;z-index:50}
#gate .box{background:#fff;border:2px solid var(--box);border-radius:14px;padding:22px;width:min(92vw,360px);box-shadow:0 3px 0 rgba(0,0,0,.14)}
#gate input{font-family:inherit;font-size:1rem;width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;margin:10px 0}
.btn{font-family:inherit;font-size:.92rem;font-weight:800;cursor:pointer;border-radius:9px;padding:9px 16px;border:none;background:var(--pine2);color:#fff}
#msg{min-height:1.2em}
@media(max-width:700px){#bar{padding-left:16px;padding-top:52px}}
</style>
<script src="/readings/grade04.js"></script>
</head>
<body>
<div id="gate"><div class="box"><h2 style="margin:0 0 4px">Student data</h2><div class="muted" style="font-size:.85rem">Dashboard password</div><input id="pw" type="password"><button class="btn" style="width:100%" id="pwGo">Open</button><div id="pwErr" style="color:var(--rust);font-size:.85rem;min-height:1.2em"></div></div></div>
<div id="bar">
  <span class="brand">Student data</span>
  <select id="selPer" aria-label="Period"><option value="">All periods</option><option value="1">Period 1</option><option value="3">Period 3</option><option value="4">Period 4</option><option value="5">Period 5</option><option value="6">Period 6</option><option value="2">Period 2</option><option value="7">Period 7</option></select>
  <select id="selStu" aria-label="Student"></select>
  <button id="prev" title="Previous student in this period">◀</button><button id="next" title="Next student in this period">▶</button>
  <span class="sp"></span>
  <button id="reload">↻ Refresh</button>
  <a href="./" id="allStu">All students</a>
</div>
<main>
  <div id="msg" class="muted"></div>
  <div id="view"></div>
</main>
<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PASSWORD='galileo2026';
/* Courses by period, 2026-27: ELD 101 = 1, 4, 6 · ELD 103 = 3, 5. A students.course value wins when it is set. */
var COURSE_BY_PERIOD={'1':'ELD 101','4':'ELD 101','6':'ELD 101','3':'ELD 103','5':'ELD 103'};
/* Launch Plus lessons — the same list as launch-plus/dashboard.html (keep in step when a lesson is added). */
var LESSONS=[
 {u:'u1-l1',n:'Lesson 1 · People at School',say:'people-at-school'},
 {u:'u1-l1x',n:'Lesson 1 · Extras',say:'people-at-school-2',parts:[['K','Capitals',1],['M','Match',2],['P','Who?',3],['Z','Where?',4]]},
 {u:'u1-l2',n:'Lesson 2 · Introductions',say:'introductions',parts:[['S','Story',1],['R','Read again (Dalia)',2],['F','Fix',3],['B','Bigger',4],['Z','Which phrase',5],['W','Write',6]]},
 {u:'u1-l3',n:'Lesson 3 · From A to Z',say:'from-a-to-z'},
 {u:'u1-l3x',n:'Lesson 3 · Extras',say:'from-a-to-z',parts:[['K','Capitals',1],['M','Next letter',2],['P','Big or small',3],['Z','ABC order',4]]},
 {u:'u1-l4',n:'Lesson 4 · 0 to 100',say:'zero-to-one-hundred'},
 {u:'u1-l5',n:'Lesson 5 · About Me',say:'about-me'},
 {u:'ts-1',n:'Topic Sentences · Set 1',table:'topic_sentence',parts:[['C','Choose',2],['W','Write',3]]},
 {u:'ts-2',n:'Topic Sentences · Set 2',table:'topic_sentence',parts:[['C','Choose',2],['W','Write',3]]},
 {u:'ts-3',n:'Topic Sentences · Set 3',table:'topic_sentence',parts:[['C','Choose',2],['W','Write',3]]},
 {u:'rev-1',n:'Fix the Paragraph · 1 Capitals',table:'revise',parts:[['A','Para 1',1],['B','Para 2',2],['C','Para 3',3]]},
 {u:'rev-2',n:'Fix the Paragraph · 2 Capitals & periods',table:'revise',parts:[['A','Para 1',1],['B','Para 2',2],['C','Para 3',3]]},
 {u:'rev-3',n:'Fix the Paragraph · 3 Run-ons',table:'revise',parts:[['A','Para 1',1],['B','Para 2',2],['C','Para 3',3]]},
 {u:'rev-4',n:'Fix the Paragraph · 4 Add details',table:'revise',parts:[['A','Para 1',1],['B','Para 2',2],['C','Para 3',3]]},
 {u:'rev-5',n:'Fix the Paragraph · 5 He/she -s',table:'revise',parts:[['A','Para 1',1],['B','Para 2',2],['C','Para 3',3]]},
 {u:'rev-6',n:'Fix the Paragraph · 6 Past tense',table:'revise',parts:[['A','Para 1',1],['B','Para 2',2],['C','Para 3',3]]},
 {u:'wit-101',n:'Sentence Work · ELD 101',table:'wit',parts:[['S','Sort',1],['C','Scramble',2],['F','Sentence or fragment?',3],['B','Because, but, so',5],['W','Write',4]]},
 {u:'wit-103',n:'Sentence Work · ELD 103',table:'wit',parts:[['S','Sort',1],['C','Scramble',2],['F','Sentence or fragment?',3],['B','Because, but, so',5],['W','Write',4]]}
];
var ROSTER=[],STU=null,D={},ORDER=[],ORDER_KEY='studentdata_order';

function $(i){return document.getElementById(i);}
function H(p){var h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};if(p)h.Prefer=p;return h;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function key(e){return String(e||'').trim().toLowerCase().split('@')[0];}
function get(path){return fetch(SUPA_URL+'/rest/v1/'+path,{headers:H()}).then(function(r){return r.ok?r.json():Promise.reject(new Error(path.split('?')[0]+' '+r.status));});}
function soft(path){return get(path).catch(function(){return [];});}
function when(t){if(!t)return '';var d=new Date(t);if(isNaN(d))return '';var m=(Date.now()-d)/60000;if(m<60)return Math.max(0,Math.round(m))+' min ago';if(m<1440)return Math.round(m/60)+' h ago';return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function band(p){return (window.GAL04&&GAL04.band)?GAL04.band(p):(p==null?null:p>=95?4.5:p>=76?4:p>=56?3:p>=36?2:p>=15?1:0);}
function bandHTML(p,title){var b=band(p);if(b==null)return '<span class="muted">—</span>';return '<span class="band b'+String(b).replace('.','')+'" title="'+esc(title||'')+'">'+b+'</span>';}
function nameOf(s){var n=((s.first_name||'')+' '+(s.last_name||'')).trim();return n||s.name||s.email;}
function courseOf(s){if(s.course)return /103/.test(s.course)?'ELD 103':/101/.test(s.course)?'ELD 101':s.course;return COURSE_BY_PERIOD[String(s.period||'')]||'';}

/* ---------- password ---------- */
function tryPw(){if($('pw').value===PASSWORD){try{sessionStorage.setItem('dash_ok','1');}catch(e){}openApp();}else $('pwErr').textContent='Not the right password.';}
$('pwGo').onclick=tryPw;$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});

/* ---------- roster ---------- */
function loadRoster(){
  return get('students?select=email,name,first_name,last_name,period,roster_order,course,kind,home_language&limit=2000')
   .catch(function(){return soft('students?select=email,name,first_name,last_name,period,roster_order&limit=2000');})
   .then(function(rows){
    var by={};(rows||[]).forEach(function(r){var k=key(r.email);if(!k)return;var o=by[k]||{};
      ['email','name','first_name','last_name','period','roster_order','course','kind','home_language'].forEach(function(f){if(r[f]!=null&&r[f]!==''&&(o[f]==null||o[f]===''))o[f]=r[f];});
      if(/@s\.sfusd\.edu$/i.test(r.email||''))o.email=r.email;o.k=k;by[k]=o;});
    ROSTER=Object.keys(by).map(function(k){return by[k];});
    ROSTER.sort(function(a,b){var pa=+a.period||99,pb=+b.period||99;if(pa!==pb)return pa-pb;var ra=a.roster_order!=null?+a.roster_order:9999,rb=b.roster_order!=null?+b.roster_order:9999;if(ra!==rb)return ra-rb;return nameOf(a).localeCompare(nameOf(b));});
   });
}
function hiddenKind(s){return s.kind&&s.kind!=='student';}
function fillPicker(){
  var pd=$('selPer').value,list=ROSTER.filter(function(s){return !pd||String(s.period)===pd;});
  $('selStu').innerHTML='<option value="">— choose a student —</option>'+list.map(function(s){return '<option value="'+esc(s.k)+'"'+(STU&&STU.k===s.k?' selected':'')+'>'+esc(nameOf(s))+(pd?'':' · P'+esc(s.period||'?'))+(hiddenKind(s)?' ('+esc(s.kind)+')':'')+'</option>';}).join('');
}
function neighbours(){var pd=STU?String(STU.period||''):'';var list=ROSTER.filter(function(s){return String(s.period||'')===pd&&!hiddenKind(s);});var i=-1;list.forEach(function(s,j){if(STU&&s.k===STU.k)i=j;});return {prev:i>0?list[i-1]:null,next:i>=0&&i<list.length-1?list[i+1]:null};}
function go(k){var u=location.pathname+(k?'?u='+encodeURIComponent(k):'');try{history.pushState(null,'',u);}catch(e){}route();}
$('selPer').onchange=function(){fillPicker();if(!STU)renderPicker();};
$('selStu').onchange=function(){go(this.value);};
$('prev').onclick=function(){var n=neighbours();if(n.prev)go(n.prev.k);};
$('next').onclick=function(){var n=neighbours();if(n.next)go(n.next.k);};
$('reload').onclick=function(){route(true);};
$('allStu').onclick=function(e){e.preventDefault();go('');};
window.addEventListener('popstate',function(){route();});

function renderPicker(){
  STU=null;document.title='Student data · all students';$('msg').textContent='';fillPicker();
  var pd=$('selPer').value,by={};ROSTER.forEach(function(s){if(pd&&String(s.period)!==pd)return;var p=s.period||'?';(by[p]=by[p]||[]).push(s);});
  var html='<p class="muted" style="margin:4px 0 12px">Pick a student. Each page shows that student’s own line from every dashboard.</p><div class="pgrid">'+
   Object.keys(by).sort(function(a,b){return (+a||99)-(+b||99);}).map(function(p){return '<div class="pbox"><h3>Period '+esc(p)+' <span class="muted" style="font-weight:600">'+esc(COURSE_BY_PERIOD[p]||'')+'</span></h3>'+
    by[p].map(function(s){return '<a href="?u='+encodeURIComponent(s.k)+'" data-k="'+esc(s.k)+'">'+esc(nameOf(s))+(hiddenKind(s)?' <small>('+esc(s.kind)+')</small>':'')+' <small>'+esc(s.k)+'</small></a>';}).join('')+'</div>';}).join('')+'</div>';
  $('view').innerHTML=html;
  Array.prototype.forEach.call($('view').querySelectorAll('a[data-k]'),function(a){a.onclick=function(e){e.preventDefault();go(a.getAttribute('data-k'));};});
}

/* ---------- section order: shared by every student page, saved in gal_settings so it follows Mr. Toby to any computer ---------- */
function loadOrder(){
  try{var c=JSON.parse(localStorage.getItem(ORDER_KEY)||'null');if(Array.isArray(c))ORDER=c;}catch(e){}
  return soft('gal_settings?key=eq.'+ORDER_KEY+'&select=value').then(function(rows){var v=rows&&rows[0]&&rows[0].value;if(v&&Array.isArray(v.order)){ORDER=v.order;try{localStorage.setItem(ORDER_KEY,JSON.stringify(ORDER));}catch(e){}}});
}
function saveOrder(){
  try{localStorage.setItem(ORDER_KEY,JSON.stringify(ORDER));}catch(e){}
  fetch(SUPA_URL+'/rest/v1/gal_settings?on_conflict=key',{method:'POST',headers:H('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{key:ORDER_KEY,value:{order:ORDER},updated_at:new Date().toISOString()}])})
   .then(function(r){if(!r.ok)throw new Error(r.status);}).catch(function(){$('msg').textContent='Order kept on this computer only (could not reach gal_settings).';});
}
/* default places: lessons in book order, then Basics, Pre-Assessments, Story Reel, the whole gradebook */
function defaultRank(id){if(id.indexOf('lp:')===0){var i=0;LESSONS.forEach(function(l,j){if('lp:'+l.u===id)i=j;});return i;}return {basics:100,pre:101,reel:102,gb:200}[id]||150;}
function orderSections(ids){
  /* a section the order has never seen goes where its default rank puts it among the known ones */
  var known=ORDER.filter(function(x){return ids.indexOf(x)>=0;}),fresh=ids.filter(function(x){return known.indexOf(x)<0;});
  fresh.sort(function(a,b){return defaultRank(a)-defaultRank(b);}).forEach(function(f){var r=defaultRank(f),at=known.length;for(var i=0;i<known.length;i++){if(ORDER.indexOf(known[i])<0)continue;if(defaultRank(known[i])>r){at=i;break;}}known.splice(at,0,f);});
  return known;
}
function move(id,how){
  var ids=Array.prototype.map.call($('view').querySelectorAll('.sec'),function(s){return s.getAttribute('data-id');});
  /* keep sections this student doesn't show in their old places */
  var full=ORDER.slice();ids.forEach(function(x){if(full.indexOf(x)<0)full.push(x);});
  var vis=full.filter(function(x){return ids.indexOf(x)>=0;}),i=vis.indexOf(id);if(i<0)return;
  var j=how==='top'?0:how==='bottom'?vis.length-1:how==='up'?Math.max(0,i-1):Math.min(vis.length-1,i+1);if(j===i)return;
  vis.splice(i,1);vis.splice(j,0,id);
  var slots=[];full.forEach(function(x,k){if(ids.indexOf(x)>=0)slots.push(k);});slots.forEach(function(k,n){full[k]=vis[n];});
  ORDER=full;saveOrder();

var LV=['A','B','C'];

  $('view').innerHTML='<div id="who"><h1>'+esc(nameOf(s))+'</h1><a class="em" href="mailto:'+esc(em)+'">'+esc(em)+'</a><span class="per">Period '+esc(s.period||'?')+'</span><span class="crs">'+esc(course)+'</span>'+(hiddenKind(s)?'<span class="kind">'+esc(s.kind)+'</span>':'')+'</div>'+
   '<div id="glance"><span class="g">Gradebook average <b>'+(avg==null?'—':avg+'%')+'</b> '+(avg==null?'':bandHTML(avg))+'</span><span class="g"><b>'+gb.length+'</b> '+(gb.length===1?'activity':'activities')+'</span><span class="g">Last active <b>'+(when(last)||'—')+'</b></span>'+(s.home_language?'<span class="g">Language <b>'+esc(s.home_language)+'</b></span>':'')+
   '<a class="g" href="../student/?view=teacher&email='+encodeURIComponent(em)+'" target="_blank" rel="noopener">My Page as '+esc((s.first_name||nameOf(s)).split(' ')[0])+' sees it ↗</a></div>'+
   ids.map(function(id){var x=byId[id];return secHTML(x.id,x.title,x.link,x.body);}).join('');
  /* remember every id seen, so the order covers it */
  var changed=false;ids.forEach(function(id){if(ORDER.indexOf(id)<0){var i=ids.indexOf(id),after=ids[i-1],at=after!=null?ORDER.indexOf(after)+1:0;ORDER.splice(at,0,id);changed=true;}});
  if(changed)try{localStorage.setItem(ORDER_KEY,JSON.stringify(ORDER));}catch(e){}
  paintMoveButtons();bindGb();
}
$('view').addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.mv button');if(!b)return;move(b.closest('.sec').getAttribute('data-id'),b.getAttribute('data-how'));});

function route(force){
  var k=key(new URLSearchParams(location.search).get('u')||new URLSearchParams(location.search).get('email')||'');
  if(!k){renderPicker();return;}
  STU=ROSTER.filter(function(s){return s.k===k;})[0]||{k:k,email:k+'@s.sfusd.edu'};
  if(STU.period&&!$('selPer').value)$('selPer').value=String(STU.period);
  fillPicker();
  $('msg').textContent='Loading '+nameOf(STU)+'…';$('view').innerHTML='';
  loadStudent(k).then(function(){$('msg').textContent='';renderStudent();})
   .catch(function(e){$('msg').innerHTML='<span style="color:var(--rust);font-weight:800">Could not load this student ('+esc(e.message)+'). Tap ↻ Refresh.</span>';});
}
function openApp(){$('gate').style.display='none';$('msg').textContent='Loading the roster…';Promise.all([loadRoster(),loadOrder()]).then(function(){route();}).catch(function(e){$('msg').textContent='Could not load the roster ('+e.message+').';});}
(function(){var ok=false;try{ok=sessionStorage.getItem('dash_ok')==='1';}catch(e){}if(ok)openApp();else $('pw').focus();})();
</script>
