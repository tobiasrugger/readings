<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Builder: Find Someone Who</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script>
window.GAL_META={title:'Question Builder: Find Someone Who',unit:'ELD 103 Questions',skills:['question-forms','present-perfect','negation-and-questions']};
window.GAL_SCORE=0;window.GAL_MAX=20;
</script>
<style>
:root{--ink:#22232e;--line:#2b2b38;--paper:#fbf6ec;--card:#fff;--green:#1f8a4c;--green2:#e3f6ea;--red:#c0392b;--amber:#b36b00;--amber2:#fff3d6;--blue:#2d5fb8;--blue2:#e6efff;--shadow:3px 4px 0 rgba(0,0,0,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.5}
button,select,input,textarea{font-family:inherit;font-size:1rem}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 60px}
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin:0 0 16px;display:flow-root}
.box h2{margin:0 0 8px;font-size:1.3rem;font-weight:900}
.box h3{margin:0 0 6px;font-size:1.1rem;font-weight:900}
.pic{float:right;width:min(42%,230px);margin:0 0 8px 14px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;line-height:0}
.pic svg{width:100%;height:auto;display:block}
.dir{margin:4px 0 8px;color:#444;font-weight:600}
.dir .tr{display:block;color:var(--blue);font-weight:700;font-size:.95rem}
.dir .tr:empty{display:none}
.btn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,.15)}
.btn.go{background:var(--green);color:#fff;border-color:#13582f}
.btn.big{font-size:1.15rem;padding:11px 20px}
.btn.blue{background:var(--blue);color:#fff;border-color:#1b3d78}
.say{border:2px solid var(--line);background:#fff6d6;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.05rem;line-height:1;vertical-align:middle;flex:none;padding:0}
.say.sm{width:30px;height:30px;font-size:.85rem}
/* gate */
.gate{position:fixed;inset:0;background:rgba(34,35,46,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;overflow:auto}
.gbox{background:#fff;border:3px solid var(--line);border-radius:16px;box-shadow:6px 6px 0 rgba(0,0,0,.3);max-width:470px;width:100%;padding:18px 20px}
.gbox h2{margin:4px 0 2px;font-size:1.45rem;font-weight:900}
.gpic{border:2px solid var(--line);border-radius:10px;overflow:hidden;line-height:0;margin-bottom:6px}
.gpic svg{width:100%;height:auto}
.gbox label{display:block;font-weight:800;margin:8px 0 2px}
.gbox input,.gbox select{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:9px;background:#fff}
.row{display:flex;gap:10px}.row>div{flex:1}
.gerr{color:var(--red);font-weight:800;min-height:1.3em;margin-top:6px}
/* top bar + menu */
.top{position:sticky;top:0;z-index:20;background:#22232e;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.top h1{font-size:1.1rem;margin:0;font-weight:900}
.top .sp{flex:1}
.top select{border-radius:8px;border:2px solid #fff;padding:4px 6px}
.top .saved{font-size:.85rem;opacity:.85}
.top .who{font-weight:800;font-size:.9rem}
.top a{color:#ffe08a;font-weight:800;font-size:.85rem}
.menu{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 12px;scrollbar-width:thin}
.tile{flex:none;width:62px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;padding:0;position:relative;box-shadow:2px 2px 0 rgba(0,0,0,.14);overflow:hidden}
.tile .th{display:block;height:42px;line-height:0;overflow:hidden}
.tile .th svg{width:100%;height:auto;display:block;margin-top:-4px}
.tile .nm{display:block;font-weight:900;font-size:.85rem;padding:1px 0;border-top:2px solid var(--line)}
.tile.wide{width:84px}
.tile.wide .th{display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:#fff6d6}
.tile.on{outline:3px solid var(--blue);outline-offset:1px}
.tile.done .nm{background:var(--green);color:#fff}
.tile.next{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:2px 2px 0 rgba(0,0,0,.14),0 0 0 0 rgba(31,138,76,.6)}50%{box-shadow:2px 2px 0 rgba(0,0,0,.14),0 0 0 6px rgba(31,138,76,0)}}
.bar{height:12px;border:2px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.barl{font-weight:800;font-size:.9rem;margin-bottom:10px}
/* prompt */
.fsw{font-weight:800;color:var(--amber);font-size:.95rem;margin:0}
.prompt{font-size:1.45rem;font-weight:900;line-height:1.35;margin:2px 0 8px}
.tw{cursor:pointer;border-bottom:2px dotted #8a8fa8}
.tw:hover{background:#fff3c4}
.ptr{color:var(--blue);font-weight:700;margin:4px 0}
.num{display:inline-block;background:var(--line);color:#fff;border-radius:8px;padding:0 9px;font-weight:900;margin-right:6px}
/* answer */
.two{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
@media (max-width:720px){.two{grid-template-columns:1fr}.pic{width:min(44%,190px)}.prompt{font-size:1.2rem}}
textarea.ans{width:100%;min-height:74px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1.25rem;font-weight:700;resize:vertical;background:#fffef8}
textarea.ans:focus{outline:3px solid #9cc0ff}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.helper{border:2px solid var(--line);border-radius:12px;background:var(--blue2);padding:10px 12px}
.helper .hpic{border:2px solid var(--line);border-radius:8px;overflow:hidden;line-height:0;margin-bottom:8px;background:#fff}.helper .hpic svg{width:100%;height:auto}
.helper .hl{font-weight:900;margin:0 0 4px}
.helper .ex{display:flex;gap:8px;align-items:center;font-weight:700}
.pp{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pp span{background:#fff;border:2px solid var(--line);border-radius:8px;padding:1px 7px;font-weight:800;font-size:.85rem;cursor:pointer}
.pp span b{color:var(--green)}
.hint{border:2px solid var(--amber);background:var(--amber2);border-radius:12px;padding:10px 12px;margin-top:12px;display:flex;gap:10px;align-items:flex-start}
.hint .ht{flex:1;font-weight:700}
.hint .htr{color:var(--blue);font-weight:700;margin-top:4px}
.hint .htr:empty{display:none}
.model{border:2px dashed var(--green);background:var(--green2);border-radius:12px;padding:10px 12px;margin-top:10px;display:flex;gap:10px;align-items:center}
.model .mt{flex:1;font-weight:900;font-size:1.15rem}
.hist{list-style:none;padding:0;margin:12px 0 0}
.hist li{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-weight:700}
.hist .x{color:var(--red);font-weight:900}
.hist .x+span{color:#7a2a20;text-decoration:line-through;text-decoration-color:rgba(192,57,43,.5)}
.hist .ok{color:var(--green);font-weight:900}
.win{border:2px solid var(--green);background:var(--green2);border-radius:12px;padding:12px 14px;margin-top:12px}
.win .wq{font-size:1.3rem;font-weight:900;display:flex;gap:10px;align-items:center}
.win .marks{font-weight:900;font-size:1.2rem}
.win .marks .x{color:var(--red)}.win .marks .ok{color:var(--green)}
/* worked example */
.steps{list-style:none;padding:0;margin:6px 0 0;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed #bbb;font-weight:700}
.steps li:before{counter-increment:s;content:counter(s);background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.chip{display:inline-block;border:2px solid var(--line);border-radius:8px;padding:0 7px;margin:1px 2px;background:#fff;font-weight:900}
.chip.h{background:#ffe08a}.chip.y{background:#cfe3ff}.chip.e{background:#ffd3e0}.chip.p{background:#c9f0d6}.chip.q{background:#eee}
/* intro patterns */
.pats{clear:both;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.pat{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fbfbff}
.pat .pl{font-weight:900;margin-bottom:4px}
.pat .pe{display:flex;gap:8px;align-items:center;font-weight:700}
/* summary */
.list{list-style:none;padding:0;margin:0}
.list li{border-bottom:2px dashed #c9c2b0;padding:8px 0;display:flex;gap:10px;align-items:center}
.list .lp{font-size:.85rem;color:#666;font-weight:700}
.list .lq{font-size:1.2rem;font-weight:900}
.list.bigtext .lq{font-size:1.6rem}
.list .lno{font-weight:900;background:var(--line);color:#fff;border-radius:8px;min-width:34px;text-align:center;padding:2px 0;flex:none}
.list .todo{color:var(--amber);font-weight:800}
.navr{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
/* tip */
#wtip{position:fixed;z-index:60;background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;max-width:290px;display:none}
#wtip .w{font-weight:900;font-size:1.1rem}
#wtip .eq{font-weight:900;text-decoration:underline;font-size:1.15rem;color:var(--blue)}
#wtip .eq.none{color:#888}
#wtip .tr2{margin-top:4px}
.fw{position:fixed;width:8px;height:8px;border-radius:50%;z-index:80;pointer-events:none;animation:boom 1.1s ease-out forwards}
@keyframes boom{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.lion{cursor:pointer}
@media print{.top,.menu,.bar,.barl,.navr,.noprint,.gate{display:none!important}.box{box-shadow:none}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gbox" id="gateForm" autocomplete="on">
    <div class="gpic" id="gatePic"></div>
    <h2>Question Builder</h2>
    <p class="dir" data-dir="Sign in to start. Your work saves by itself."><span class="en">Sign in to start. Your work saves by itself.</span><span class="tr"></span></p>
    <div class="row">
      <div><label for="gFirst">First name</label><input id="gFirst" required></div>
      <div><label for="gLast">Last name</label><input id="gLast" required></div>
    </div>
    <label for="gEmail">School email</label>
    <input id="gEmail" type="email" placeholder="name@s.sfusd.edu" required>
    <div class="row">
      <div><label for="gPeriod">Period</label><select id="gPeriod"><option value="">Choose…</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
      <div><label for="gLang">My language</label><select id="gLang"><option value="">Choose…</option></select></div>
    </div>
    <div class="gerr" id="gErr"></div>
    <button class="btn go big" type="submit" style="width:100%;margin-top:6px">Start</button>
  </form>
</div>

<div class="top">
  <h1>Question Builder: Find Someone Who</h1>
  <span class="sp"></span>
  <select id="lang" aria-label="My language"></select>
  <span class="saved" id="saved"></span>
  <span class="who" id="who"></span>
  <a href="dashboard.html">Teacher</a>
</div>

<div class="wrap">
  <nav class="menu" id="menu" aria-label="Questions"></nav>
  <div class="bar"><i id="barI"></i></div>
  <div class="barl" id="barL"></div>
  <main id="stage"></main>
</div>
<div id="wtip" role="dialog"></div>
<script>
/* ================= drawings (original SVG, 200x160) ================= */
var ART=(function(){
function wrap(inner,label){return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+label+'">'+inner+'</svg>';}

  if(m==='sleep'){f+='<path d="M-7,-77 q3,2 6,0 M1,-77 q3,2 6,0" stroke="#3a2a20" stroke-width="1.4" fill="none"/><path d="M-3,-69 q3,1.5 6,0" stroke="#7a3b2e" stroke-width="1.3" fill="none"/>';return f;}

  f+='<ellipse cx="-4.5" cy="-77" rx="'+ey+'" ry="'+(ey+.4)+'" fill="#2a1d16"/><ellipse cx="4.5" cy="-77" rx="'+ey+'" ry="'+(ey+.4)+'" fill="#2a1d16"/><circle cx="-4" cy="-77.8" r=".6" fill="#fff"/><circle cx="5" cy="-77.8" r=".6" fill="#fff"/>';
  if(m==='smile'||!m)f+='<path d="M-4.5,-70 q4.5,4 9,0" stroke="#7a3b2e" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M-8.5,-82 q3,-2 6,-.5 M2.5,-82.5 q3,-1.5 6,.5" stroke="#3a2a20" stroke-width="1.2" fill="none"/>';
  if(m==='big')f+='<path d="M-5,-71 q5,7 10,0 z" fill="#7a2e26"/><path d="M-3.5,-70.6 h7" stroke="#fff" stroke-width="1.2"/><path d="M-8.5,-83 q3,-2.5 6,-.5 M2.5,-83.5 q3,-2 6,.5" stroke="#3a2a20" stroke-width="1.2" fill="none"/>';
  if(m==='frown')f+='<path d="M-4.5,-68.5 q4.5,-3.5 9,0" stroke="#7a3b2e" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M-8.5,-83.5 l6,2 M8.5,-83.5 l-6,2" stroke="#3a2a20" stroke-width="1.6"/>';

  return f;}
function hairBack(st,hc){if(st==='long')return '<path d="M-12,-80 Q-15,-55 -10,-52 L10,-52 Q15,-55 12,-80Z" fill="'+hc+'"/>';if(st==='hijab')return '<path d="M-15,-78 Q-17,-50 0,-50 Q17,-50 15,-78Z" fill="'+hc+'"/>';return '';}

  if(st==='cap')return '<path d="M-12,-80 Q-12,-93 0,-93 Q12,-93 12,-80Z" fill="'+hc+'"/><path d="M8,-81 h12 v3 h-12z" fill="'+hc+'"/>';
  if(st==='hat')return '<rect x="-15" y="-84" width="30" height="3" rx="1.5" fill="'+hc+'"/><path d="M-10,-84 Q-10,-96 0,-96 Q10,-96 10,-84Z" fill="'+hc+'"/><rect x="-10" y="-87" width="20" height="2.5" fill="#6b4a2a"/>';

  return '';}
function arms(p,sh,sk){var a='',L,R;
  L=[-17,-33];R=[17,-33];
  if(p==='up'){L=[-21,-88];R=[21,-88];}
  if(p==='wave'){R=[22,-86];}
  if(p==='point'){R=[30,-56];}
  if(p==='hold'){L=[-7,-44];R=[7,-44];}

  function arm(sx,e,el){var mx=(sx+e[0])/2+(el||0),my=(-56+e[1])/2;return '<path d="M'+sx+',-56 Q'+mx+','+my+' '+e[0]+','+e[1]+'" stroke="'+sh+'" stroke-width="6.5" fill="none" stroke-linecap="round"/><circle cx="'+e[0]+'" cy="'+e[1]+'" r="3.3" fill="'+sk+'"/>';}

function P(x,y,o){o=o||{};var s=o.s||1,sk=o.skin||'#e3b083',sh=o.shirt||'#4a7bc4',pa=o.pants||'#33415c',hc=o.hc||'#2b1d14',st=o.hair||'short';

  var t=a.match(/\byou (?:ever |still |really )?(has|knows|wants|thinks|feels|disagrees|remembers|tries|lives|likes|is|was|does)\b/);
  if(t)return {ok:false,code:'third',hint:'After <b>you</b>, the verb has no -s: <b>'+THIRD[t[1]]+'</b>, not '+t[1]+'.'};

  if(!/^[A-Z]/.test(s))return {ok:false,code:'cap',hint:'Start the question with a capital letter: <b>'+Need+'</b> …'};
  var caps=[['english','English'],['august','August'],['san francisco','San Francisco'],['billy','Billy'],[' ai ',' AI ']];

  return {ok:true};
}

  return sharedLoaded[l];}
var queue=[],active=0;
function pump(){while(active<3&&queue.length){var j=queue.shift();active++;j().then(function(){active--;pump();},function(){active--;pump();});}}
function tr(text,ctx){
  if(!lang||!text)return Promise.resolve(null);
  var l=lang,src=ctx?text+'|'+ctx:text,key=l+'|'+src;
  if(trCache[key])return trCache[key];

      var words=String(text).trim().split(/\s+/).length;
      var u=PROXY+'?action=translate&mode='+(words<=3?'word':'sentence')+'&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent(ctx||'')+'&lang='+encodeURIComponent(l);
      return fetch(u).then(function(r){return r.json();}).then(function(j){var t=(j&&j.ok&&j.translation)?j.translation:null;
        if(t&&t.equiv){shared[l][src]=t;fetch(SUPA_URL+'/rest/v1/song_tr?on_conflict=slug,lang,src',{method:'POST',headers:H('resolution=merge-duplicates,return=minimal'),body:JSON.stringify({slug:TR_SLUG,lang:l,src:src,equiv:t.equiv||'',meaning:t.meaning||'',note:t.note||''})}).catch(function(){});}
        res(t);}).catch(function(){delete trCache[key];res(null);});

}

  var s=it(x.n);if(s.done)return;
  var r=checkQ(x,val);s.tries.push(val);
  if(r.ok){s.done=true;s.final=val;s.codes.push('ok');s.draft='';s.at=new Date().toISOString();dirty=true;render();speak(val);save();}
  else{s.codes.push(r.code);s.lastHint=r.hint;s.draft=val;dirty=true;
    $('fb').innerHTML=fbHtml(x);var hh=document.querySelector('.hist');var host=$('fb').parentNode;if(hh)hh.remove();host.insertAdjacentHTML('beforeend',histHtml(x));translateDirs();ta.focus();score();}
}
function saveDraft(){var ta=$('ans');if(ta&&typeof cur==='number')it(cur).draft=ta.value;}

/* ---------- score + save ---------- */
function score(){window.GAL_SCORE=doneCount();window.GAL_MAX=ITEMS.length;return window.GAL_SCORE;}
/* Load before save: nothing is written until a read of this student's row has come back OK
   (an empty answer = new student, fine). Otherwise a failed read could overwrite work done on another Chromebook. */
var loaded=false;
function save(){
  if(!me)return Promise.resolve();score();
  if(!loaded){$('saved').textContent='⚠ Can\u2019t reach the server — your work is not saved yet';return Promise.resolve();}
  var row={email:me.email,set_slug:SET,name:me.first+' '+me.last,period:String(me.period),lang:lang,answers:work,score:window.GAL_SCORE,max_score:window.GAL_MAX,done:doneCount(),updated_at:new Date().toISOString()};
  if(window.GAL_SCORE===ITEMS.length&&!turnedSent&&!work.turnedIn){row.turned_in=true;work.turnedIn=true;row.answers=work;}
  $('saved').textContent='Saving…';
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,set_slug',{method:'POST',headers:H('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([row])})
    .then(function(r){if(r&&r.ok){dirty=false;if(row.turned_in)turnedSent=true;$('saved').textContent='Saved ✓';}else{$('saved').textContent='Not saved — will retry';if(row.turned_in)work.turnedIn=false;}})
    .catch(function(){$('saved').textContent='Offline — will retry';if(row.turned_in)work.turnedIn=false;});
}
function loadWork(){
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=answers,turned_in&email=eq.'+encodeURIComponent(me.email)+'&set_slug=eq.'+encodeURIComponent(SET),{headers:H()})
   .then(function(r){if(!r.ok)throw new Error('load '+r.status);return r.json();})
   .then(function(rows){
     if(rows&&rows[0]){var d=rows[0].answers||{};
       /* merge item by item: keep whatever this browser already finished, add what the server has */
       Object.keys(d.items||{}).forEach(function(k){var mine=work.items[k],srv=d.items[k];if(!mine||(!mine.done&&(srv.done||(srv.tries||[]).length>=(mine.tries||[]).length)))work.items[k]=srv;});
       if(d.started)work.started=d.started;if(rows[0].turned_in){work.turnedIn=true;turnedSent=true;}}
     loaded=true;return true;})
   .catch(function(){$('saved').textContent='⚠ Can\u2019t reach the server — your work is not saved yet';return false;});
}
function loadUntilOk(first){return loadWork().then(function(ok){if(ok){if(!first)render();return;}setTimeout(function(){loadUntilOk(false);},first?3000:20000);});}

/* ---------- sign-in ---------- */
(function(){
  var sel=$('gLang'),top=$('lang');
  LANGS.forEach(function(l){var o=document.createElement('option');o.value=l;o.textContent=l;sel.appendChild(o);top.appendChild(o.cloneNode(true));});
  $('gatePic').innerHTML=ART.S.head();
  try{var rem=normLang(localStorage.getItem('vocab_lang'));if(rem)sel.value=rem;}catch(e){}
  try{var prev=JSON.parse(localStorage.getItem('eld_signin')||'null');if(prev){$('gFirst').value=prev.first||'';$('gLast').value=prev.last||'';$('gEmail').value=prev.alias||prev.email||'';$('gPeriod').value=prev.period||'';}}catch(e){}
  sel.addEventListener('change',function(){lang=this.value;translateDirs();});
})();
function canonEmail(raw){var e=String(raw||'').trim().toLowerCase();if(!/^[a-z0-9._+-]+@(s\.)?sfusd\.edu$/.test(e))return null;return {canon:e.split('@')[0]+'@sfusd.edu',alias:e};}
$('gateForm').addEventListener('submit',function(ev){
  ev.preventDefault();
  var first=$('gFirst').value.trim(),last=$('gLast').value.trim(),em=canonEmail($('gEmail').value),per=$('gPeriod').value,lg=$('gLang').value,err=$('gErr');
  err.textContent='';
  if(!first||!last){err.textContent='Type your first and last name.';return;}
  if(!em){err.textContent='Use your school email: name@s.sfusd.edu';return;}
  if(!per){err.textContent='Choose your period.';return;}
  if(!lg){err.textContent='Choose your language.';return;}
  me={first:first,last:last,email:em.canon,alias:em.alias,period:per};
  try{localStorage.setItem('eld_signin',JSON.stringify(me));localStorage.setItem('gal_student_email',me.email);}catch(e){}
  setLang(lg);
  $('who').textContent=first+' '+last+' · P'+per;
  $('gate').style.display='none';
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:H('resolution=ignore-duplicates,return=minimal'),body:JSON.stringify([{email:me.email,first_name:first,last_name:last,period:per}])}).catch(function(){});
  if(em.alias!==em.canon)fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:H('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{alias_email:em.alias,email:em.canon}])}).catch(function(){});
  loadUntilOk(true).then(function(){if(!work.started){work.started=new Date().toISOString();dirty=true;}cur='intro';render();setInterval(function(){saveDraft();if(dirty&&loaded)save();},20000);});
});
function setLang(l){
  lang=normLang(l)||l;$('lang').value=lang;$('gLang').value=lang;
  try{localStorage.setItem('vocab_lang',lang);}catch(e){}
  loadShared(lang);translateDirs();work.lang=lang;dirty=true;
}
$('lang').addEventListener('change',function(){setLang(this.value);});
window.addEventListener('beforeunload',function(){saveDraft();if(dirty&&me&&loaded)save();});
</script>
