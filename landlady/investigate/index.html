<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Landlady — Investigate the Tea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:wght@600;700&family=Caveat:wght@500;700&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2016;--paper:#f6efe0;--card:#fffaf0;--wood:#7a5233;--red:#b0281e;--green:#2f7a45;--amber:#c8781f;--blue:#2f5a7a;--line:2px solid #2b2016;--shadow:4px 4px 0 rgba(43,32,22,.28)}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.55;color:var(--ink);background:#e9dfca}
h1,h2,h3{font-family:Lora,Georgia,serif;line-height:1.2;margin:.2em 0 .4em}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.12rem}
button{font-family:inherit;font-size:1rem;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#f3ecd9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px}
.top .ttl{font-family:Lora,serif;font-weight:700;font-size:1.05rem;margin-right:auto}
.top a.back{background:#2f7a45;color:#fff;font-weight:800;text-decoration:none;padding:7px 14px;border-radius:8px;border:2px solid #fff;font-size:1rem}
.top select{font-size:.95rem;padding:4px;border-radius:6px}
.top .who,.top .saved{font-size:.85rem;color:#e6dcc4}
.wrap{max-width:980px;margin:0 auto;padding:14px 12px 80px}
.box{background:var(--card);border:var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin:0 0 18px;display:flow-root}
.box.dark{background:#2b2420;color:#f3ecd9;border-color:#000}
.scene{border:var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin:0 0 18px;background:#4a3b2c;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.fig{float:right;width:min(44%,240px);margin:0 0 10px 16px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;line-height:0}
.fig svg{width:100%;height:auto;display:block}
.dir{margin:.2em 0 .7em;color:#4a4036;font-weight:600}
.dir .tr{display:block;color:#2f5a7a;font-weight:700;margin-top:2px}
.dir .tr:empty{display:none}
.say,.trb{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;font-size:.9rem;vertical-align:middle;line-height:1.4}
.say:hover,.trb:hover{background:#fdf0d0}
.trline{display:block;color:#2f5a7a;font-weight:700;margin:4px 0 0;font-size:.98rem}
.trline:empty{display:none}
.tw{cursor:pointer;border-bottom:2px dotted #a89a80}
.tw:hover{background:#fdf0c8}
.k{font-weight:800;border-bottom:3px solid var(--amber)}
/* menu */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:0 0 18px}
.tile{background:var(--card);border:var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;color:var(--ink)}
.tile svg{width:100%;height:auto;border-radius:8px;border:1.5px solid #8a7a62;display:block}
.tile b{font-family:Lora,serif;font-size:1.02rem}
.tile .cnt{font-size:.85rem;font-weight:800;color:#6b5c46}
.tile.on{outline:4px solid var(--amber)}
.tile.full{border-color:var(--green);background:#eaf4ec}
.tile.full .cnt::after{content:" ✓";color:var(--green)}
.tile.lock{opacity:.55;cursor:not-allowed}
.tile.next{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 6px rgba(200,120,31,.45)}}
/* questions */
.q{border:var(--line);border-radius:12px;background:#fff;padding:12px 14px;margin:14px 0;box-shadow:var(--shadow);display:flow-root}
.q .stem{font-weight:800;margin:0 0 8px}
.tagq{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;background:var(--ink);color:#fff;border-radius:5px;padding:1px 7px;margin-right:6px;vertical-align:middle}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--ink);background:#fbf7ee;border-radius:10px;padding:8px 12px;text-align:left;font-weight:700;position:relative}
.opt:hover{background:#fdf0d0}
.opt.no{border-color:var(--red);background:#fbe9e6;color:#7a1a12}
.opt.no::after{content:" ✗";color:var(--red);font-weight:900}
.opt.yes{border-color:var(--green);background:#e2f2e6;color:#1a5a30}
.opt.yes::after{content:" ✓";color:var(--green);font-weight:900}
.opt.sel{outline:3px solid var(--blue);background:#e6eef6}
.opt[disabled]{cursor:default}
.fb{margin-top:8px;font-weight:700}
.fb .quip{display:flex;gap:8px;align-items:center;color:#7a1a12}
.fb .hint{color:#4a4036;margin-top:4px}
.fb.ok{color:var(--green)}
.parrot{width:38px;height:38px;flex:none}
/* shelf */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.shelf{grid-template-columns:repeat(2,1fr);gap:10px}.fig{float:none;width:100%;margin:0 0 10px}.note .fig{float:right;width:34%;margin:0 0 6px 10px}
 .menu{grid-template-columns:repeat(3,1fr);gap:6px}.tile{padding:5px;gap:3px}.tile b{font-size:.78rem}.tile .cnt{font-size:.72rem}.tile svg{max-height:70px;object-fit:contain}
 .bcard{padding:5px}.bcard .bopts .opt{font-size:.8rem;padding:4px 6px}.sniff{font-size:.85rem}.smell{font-size:.88rem}}
.bcard{border:var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px}
.bcard .pic{line-height:0;border-radius:8px;overflow:hidden;border:1.5px solid #8a7a62;background:#5c4a36}
.bcard .pic svg{width:100%;height:auto}
.wsp{opacity:0}
.sniffed .wsp{animation:rise 2.4s ease-out 1}
@keyframes rise{0%{opacity:0;transform:translate(0,10px)}30%{opacity:.9}100%{opacity:0;transform:translate(0,-26px)}}
.sniff{border:2px solid var(--ink);background:#f3c34a;border-radius:10px;font-weight:800;padding:6px}
.smell{background:#f6efe0;border:2px dashed #8a7a62;border-radius:8px;padding:6px 8px;font-weight:700;min-height:2.2em}
.bopts .opt{font-size:.9rem;padding:5px 8px}
.bopts.locked{opacity:.45;pointer-events:none}
/* book + notebook */
.entry{border:var(--line);border-radius:10px;background:#fbf4e2;padding:12px 14px;margin:0 0 14px;box-shadow:var(--shadow);display:flow-root}
.entry h3{margin-top:0}
.entry dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.entry dt{font-weight:800;color:#6b4a2c}
.entry dd{margin:0}
.entry .fig{width:min(40%,200px)}
.note{font-family:Caveat,cursive;font-size:1.55rem;line-height:1.35;color:#2a2a5a;background:repeating-linear-gradient(#fdfbf4 0 34px,#c9d6e8 34px 36px);border:var(--line);border-left:10px solid #a8261c;border-radius:6px;padding:10px 16px 12px 22px;margin:0 0 14px;box-shadow:var(--shadow);display:flow-root}
.note .date{font-family:Nunito,sans-serif;font-size:.8rem;font-weight:800;color:#8a7a62;display:block}
.note .fig{width:min(36%,150px);border-color:#c9d6e8;background:#fdfbf4}
.note .say,.note .trb{font-family:Nunito,sans-serif}
.note .trline{font-family:Nunito,sans-serif;font-size:1rem}
/* words */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wcard{border:var(--line);border-radius:10px;background:#fff;padding:8px;box-shadow:var(--shadow);display:flow-root}
.wcard .wp{line-height:0;border:1.5px solid #8a7a62;border-radius:8px;overflow:hidden;margin-bottom:6px}
.wcard .wp svg{width:100%;height:auto}
.wcard .ww{font-size:1.25rem;font-weight:800}
.wcard .wt{display:block;margin-top:4px}
.equiv{font-weight:800;text-decoration:underline;color:#2f5a7a}
.equiv.none{color:#8a8a8a}
textarea{width:100%;min-height:7em;font-family:inherit;font-size:1.02rem;border:2px solid var(--ink);border-radius:10px;padding:10px;line-height:1.5}
.wc{font-size:.85rem;color:#6b5c46;font-weight:700}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:8px 16px;font-weight:800}
.btn.alt{background:#fff;color:var(--ink)}
.btn.green{background:var(--green);border-color:#1a4a28}
.lvl{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin:0 0 8px}
.lvl button{border:0;background:#fff;padding:5px 12px;font-weight:800}
.lvl button.on{background:var(--ink);color:#fff}
.frame{background:#f6efe0;border:2px dashed #8a7a62;border-radius:8px;padding:8px 10px;margin:6px 0;font-weight:600}
.bank span{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;margin:3px;background:#fff;font-weight:700}
.navr{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.tip{position:absolute;z-index:60;background:#fff;border:var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;max-width:280px;font-size:.98rem}
.tip b{font-size:1.1rem}
.gate{position:fixed;inset:0;background:rgba(34,28,20,.86);display:flex;align-items:center;justify-content:center;z-index:80;padding:14px;overflow:auto}
.gbox{background:var(--card);border:3px solid #000;border-radius:14px;max-width:440px;width:100%;padding:16px 18px;box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.gbox label{display:block;font-weight:800;margin:8px 0 2px}
.gbox input,.gbox select{width:100%;font-size:1rem;padding:8px;border:2px solid var(--ink);border-radius:8px;font-family:inherit}
.gbox .row{display:flex;gap:8px}.gbox .row>div{flex:1}
.gerr{color:var(--red);font-weight:800;min-height:1.2em}
.gpic{line-height:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:8px}
.gpic svg{width:100%;height:auto}
.fw{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:90;animation:fw 1.1s ease-out forwards}
@keyframes fw{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.flick{animation:flick 1.2s ease-in-out infinite alternate;transform-origin:85px 128px}
@keyframes flick{to{transform:scaleY(.9) scaleX(1.04)}}
.steam path{animation:st 3s ease-in-out infinite}
@keyframes st{50%{opacity:.3;transform:translateY(-3px)}}
.cup{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cup .pic{width:150px;line-height:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#f3ecd9}
.newtag{display:inline-block;background:#a8261c;color:#fff;font-size:.72rem;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media print{.top,.menu,.gate{display:none!important}}
</style>
</head>
<body>
<div class="top noprint">
  <span class="ttl">🔎 Investigate the tea</span>
  <a class="back" href="/readings/landlady/">← Back to The Landlady story</a>
  <select id="lang" aria-label="Language" translate="no"><option value="">Language…</option></select>
  <span class="who" id="who" translate="no"></span><span class="saved" id="saved"></span>
</div>

<div class="gate" id="gate">
  <form class="gbox" id="gateForm" autocomplete="on">
    <div class="gpic" id="gatePic"></div>
    <h2 style="margin:0">Detective, sign in</h2>
    <div class="row"><div><label for="gFirst">First name</label><input id="gFirst" autocomplete="given-name"></div>
    <div><label for="gLast">Last name</label><input id="gLast" autocomplete="family-name"></div></div>
    <label for="gEmail">School email</label><input id="gEmail" type="email" placeholder="name@s.sfusd.edu" autocomplete="email">
    <div class="row"><div><label for="gPeriod">Period</label><select id="gPeriod"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
    <div><label for="gLang">Language</label><select id="gLang" translate="no"><option value="">Choose…</option></select></div></div>
    <p class="gerr" id="gErr"></p>
    <button class="btn green" type="submit" style="width:100%">Open the case file</button>
  </form>
</div>

<div class="wrap" id="app" translate="no"></div>
<div class="tip" id="wtip" style="display:none" translate="no"></div>
<script>
/* ---------- drawings (all original SVG) ---------- */
var ART={};
function S(vb,inner,label){return '<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+label+'">'+inner+'</svg>';}
ART.lion=function(x,y,s){return '<g class="lion" transform="translate('+x+','+y+') scale('+(s||1)+')" style="cursor:pointer"><rect x="-8" y="8" width="16" height="4" rx="1" fill="#6b5436"/><circle r="9" fill="#c8781f"/><g fill="#a85a12"><circle cx="-7" cy="-5" r="3.2"/><circle cx="7" cy="-5" r="3.2"/><circle cx="-8" cy="3" r="3.2"/><circle cx="8" cy="3" r="3.2"/><circle cx="0" cy="-9" r="3.2"/><circle cx="0" cy="8" r="3.2"/></g><circle r="6" fill="#f0b552"/><circle cx="-2.2" cy="-1.5" r=".9" fill="#222"/><circle cx="2.2" cy="-1.5" r=".9" fill="#222"/><path d="M-1.2,1 h2.4 l-1.2,1.3z" fill="#5a2a10"/></g>';};

/* the parlour at night — opens the case */
ART.parlour=function(){
 var wp='';for(var x=10;x<640;x+=34)for(var y=14;y<170;y+=30)wp+='<g transform="translate('+(x+((y/30)%2?17:0))+','+y+')" fill="#7d6a4f" opacity=".35"><circle r="2.4"/><path d="M0 3 q-4 6 0 10 q4 -4 0 -10" /></g>';
 return S('0 0 640 280',
 '<rect width="640" height="280" fill="#4a3b2c"/><rect width="640" height="200" fill="#5c4a36"/>'+wp+
 '<rect x="0" y="196" width="640" height="10" fill="#3b2c1e"/><rect x="0" y="206" width="640" height="74" fill="#6e4a2e"/>'+
 '<g stroke="#5a3a22" stroke-width="2">'+[220,236,252,268].map(function(y){return '<path d="M0 '+y+'h640"/>';}).join('')+'</g>'+
 /* rug */'<ellipse cx="330" cy="246" rx="190" ry="26" fill="#8c2f2a"/><ellipse cx="330" cy="246" rx="170" ry="20" fill="none" stroke="#d8a54a" stroke-width="3" stroke-dasharray="6 5"/>'+
 /* window */'<g transform="translate(470 34)"><rect width="120" height="130" fill="#1c2438" stroke="#2b2016" stroke-width="8"/><path d="M60 0v130M0 65h120" stroke="#2b2016" stroke-width="5"/><circle cx="92" cy="28" r="12" fill="#efe6c2"/><circle cx="96" cy="25" r="11" fill="#1c2438"/><g fill="#fff" opacity=".8"><circle cx="24" cy="20" r="1.4"/><circle cx="40" cy="46" r="1"/><circle cx="104" cy="92" r="1.2"/><circle cx="18" cy="100" r="1"/></g><path d="M-10 -6 q30 30 0 150" fill="#7b2a2a"/><path d="M130 -6 q-30 30 0 150" fill="#7b2a2a"/><path d="M-10 -6 q22 30 2 150" fill="#932f2f" opacity=".7"/></g>'+
 /* fireplace */'<g transform="translate(40 70)"><rect width="170" height="132" fill="#e6dccb" stroke="#2b2016" stroke-width="3"/><rect x="-12" y="-14" width="194" height="16" fill="#cfc3ad" stroke="#2b2016" stroke-width="3"/><rect x="30" y="34" width="110" height="98" fill="#1d1612"/><path d="M30 34 q55 -30 110 0" fill="#1d1612"/>'+
 '<g class="flick"><path d="M58 128 q-6 -30 14 -52 q-2 22 12 30 q4 -26 20 -40 q-4 30 10 44 q8 -14 6 -28 q14 22 2 46z" fill="#e8742a"/><path d="M70 128 q0 -20 12 -32 q2 16 10 20 q4 -12 12 -18 q0 20 -4 30z" fill="#f6c14a"/></g>'+
 '<rect x="44" y="126" width="84" height="6" fill="#3a2a1c"/><rect x="50" y="118" width="70" height="9" rx="4" fill="#5b3b20"/>'+
 /* clock on mantel */'<g transform="translate(140 -36)"><rect x="-14" y="0" width="28" height="22" rx="3" fill="#6b4a2c" stroke="#2b2016" stroke-width="2"/><circle cx="0" cy="11" r="7.5" fill="#f3ecd9"/><path d="M0 11V6M0 11h4" stroke="#2b2016" stroke-width="1.4"/></g>'+
 /* jar on mantel */'<g transform="translate(36 -40)"><rect x="-10" y="0" width="20" height="26" rx="5" fill="#cfe0e3" opacity=".75" stroke="#2b2016" stroke-width="1.6"/><rect x="-11" y="-4" width="22" height="6" rx="2" fill="#6b5436"/><path d="M-4 12 q4 -8 8 0 q-4 6 -8 0" fill="#c8781f"/><path d="M0 12 l-6 -5 M0 12 l6 -5" stroke="#3b2c1e" stroke-width="1"/></g></g>'+
 /* dachshund on rug, sleeping too still */'<g transform="translate(150 222)"><ellipse cx="0" cy="8" rx="56" ry="6" fill="#000" opacity=".2"/><path d="M-48 2 q4 -18 30 -18 h44 q22 0 28 10 q14 -2 18 8 q-2 8 -14 8 h-96 q-12 0 -10 -8z" fill="#a86a34"/><path d="M-36 -10 h56" stroke="#c4874a" stroke-width="5" stroke-linecap="round"/><path d="M58 -4 q8 0 16 6" stroke="#5a3418" stroke-width="7" stroke-linecap="round"/><path d="M60 0 q-2 12 -12 12" fill="#5a3418"/><circle cx="66" cy="0" r="1.6" fill="#1a120c"/><path d="M-48 2 q-14 0 -18 -8" stroke="#a86a34" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M-30 10 v6 M-14 10 v6 M28 10 v6 M42 10 v6" stroke="#5a3418" stroke-width="5" stroke-linecap="round"/></g>'+
 /* armchair */'<g transform="translate(270 112)"><rect x="0" y="0" width="110" height="80" rx="18" fill="#3f5a3c" stroke="#2b2016" stroke-width="3"/><rect x="-12" y="34" width="28" height="64" rx="10" fill="#4d6c48" stroke="#2b2016" stroke-width="3"/><rect x="94" y="34" width="28" height="64" rx="10" fill="#4d6c48" stroke="#2b2016" stroke-width="3"/><rect x="12" y="54" width="86" height="34" rx="8" fill="#5c7a56" stroke="#2b2016" stroke-width="3"/><path d="M28 10 l6 6 m20 -6 l6 6 m20 -6 l6 6" stroke="#2b3d29" stroke-width="2"/><rect x="-6" y="96" width="8" height="12" fill="#2b2016"/><rect x="108" y="96" width="8" height="12" fill="#2b2016"/></g>'+
 /* side table + teacup */'<g transform="translate(410 150)"><ellipse cx="0" cy="0" rx="38" ry="9" fill="#7a5233" stroke="#2b2016" stroke-width="2.5"/><rect x="-4" y="6" width="8" height="46" fill="#5a3a22"/><path d="M-20 54 h40" stroke="#5a3a22" stroke-width="6" stroke-linecap="round"/><ellipse cx="0" cy="-4" rx="20" ry="4" fill="#f3ecd9" stroke="#2b2016" stroke-width="1.5"/><path d="M-11 -18 h22 l-3 13 q-8 4 -16 0z" fill="#f3ecd9" stroke="#2b2016" stroke-width="1.6"/><path d="M11 -15 q7 0 6 6 q-2 4 -7 3" fill="none" stroke="#2b2016" stroke-width="1.6"/><path d="M-6 -16 h12" stroke="#4a8a82" stroke-width="2.4"/><g class="steam" stroke="#e8e0cc" stroke-width="1.8" fill="none" opacity=".8"><path d="M-3 -22 q-5 -8 0 -14 q5 -6 0 -12"/><path d="M4 -22 q-5 -8 0 -14 q5 -6 0 -12"/></g></g>'+
 /* parrot in cage */'<g transform="translate(560 172)"><path d="M0 0 v36 M-16 38 h32" stroke="#2b2016" stroke-width="4"/><g transform="translate(0 -70)"><path d="M-26 70 q0 -78 26 -78 q26 0 26 78z" fill="none" stroke="#b28b3a" stroke-width="2.5"/><g stroke="#b28b3a" stroke-width="1.4">'+[-18,-9,0,9,18].map(function(x){return '<path d="M'+x+' 70 V'+(-4+Math.abs(x)*0.9)+'"/>';}).join('')+'</g><path d="M-28 70 h56" stroke="#8a6a2a" stroke-width="4"/><path d="M-14 42 h28" stroke="#6b4a2c" stroke-width="3"/><g transform="translate(0 26)"><path d="M-6 16 q-6 -14 2 -26 q10 -6 12 6 q2 12 -4 20z" fill="#3e9a4a"/><path d="M-4 16 q-2 14 -8 22" stroke="#2f7a3a" stroke-width="5" stroke-linecap="round"/><circle cx="3" cy="-6" r="6" fill="#4fb35c"/><path d="M8 -6 q6 0 4 6 q-3 -2 -5 -1z" fill="#e2b33a"/><circle cx="4" cy="-7" r="1.6" fill="#fff"/><circle cx="4.3" cy="-7" r=".8" fill="#111"/><path d="M-6 0 q-2 -10 4 -12" stroke="#d24a3a" stroke-width="3" fill="none"/></g></g></g>'+
 /* magnifying glass on rug */'<g transform="translate(470 250) rotate(-20)"><circle r="14" fill="#cfe6ee" opacity=".55" stroke="#b28b3a" stroke-width="4"/><rect x="12" y="-3" width="30" height="7" rx="3" fill="#5a3a22"/><path d="M-7 -6 q4 -4 9 -3" stroke="#fff" stroke-width="2" fill="none"/></g>',
 'A Victorian parlour at night: a fire burning in the fireplace, a dachshund lying very still on the red rug, a green armchair, a steaming teacup on a small table, a green parrot in a cage by the moonlit window, and a magnifying glass on the rug.');};

    var n=optCount(id),o,pos,tries=0;

function speak(text,rate){

}

var shared={},sharedLoaded={},trCache={},queue=[],active=0;
function loadShared(l){if(!l)return Promise.resolve();if(sharedLoaded[l])return sharedLoaded[l];shared[l]={};
  sharedLoaded[l]=fetch(SUPA_URL+'/rest/v1/song_tr?select=src,equiv,meaning,note&slug=eq.'+TR_SLUG+'&lang=eq.'+encodeURIComponent(l),{headers:H()})

  return sharedLoaded[l];}
function pump(){while(active<3&&queue.length){var j=queue.shift();active++;j().then(function(){active--;pump();},function(){active--;pump();});}}
function tr(text,ctx){
  if(!lang||!text)return Promise.resolve(null);
  var l=lang,src=ctx?text+'|'+ctx:text,key=l+'|'+src;
  if(trCache[key])return trCache[key];
  trCache[key]=loadShared(l).then(function(){
    if(shared[l]&&shared[l][src])return shared[l][src];
    return new Promise(function(res){queue.push(function(){
      var words=String(text).trim().split(/\s+/).length;
      var u=PROXY+'?action=translate&mode='+(words<=3?'word':'sentence')+'&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent(ctx||'')+'&lang='+encodeURIComponent(l);
      return fetch(u).then(function(r){return r.json();}).then(function(j){var t=(j&&j.ok&&j.translation)?j.translation:null;
        if(t&&t.equiv){shared[l][src]=t;fetch(SUPA_URL+'/rest/v1/song_tr?on_conflict=slug,lang,src',{method:'POST',headers:H('resolution=merge-duplicates,return=minimal'),body:JSON.stringify({slug:TR_SLUG,lang:l,src:src,equiv:t.equiv||'',meaning:t.meaning||'',note:t.note||''})}).catch(function(){});}
        res(t);}).catch(function(){delete trCache[key];res(null);});
    });pump();});
  });
  return trCache[key];
}

function answer(id,i){var s=it(id);if(s.done)return;
  if(s.tries.indexOf(i)===-1)s.tries.push(i);else return;
  if(i===correctIdx(id)){s.done=true;s.at=new Date().toISOString();}
  touch();var y=window.scrollY;render();window.scrollTo(0,y);
  if(work.items.A4&&work.items.A4.done&&!work.turnedIn)save();
}
function checkClues(){var s=it('A3'),sel=(s.sel||[]).slice().sort();
  s.tries.push(sel.slice());
  var right=sel.filter(function(i){return CLUES[i].ok;}).length,wrong=sel.length-right;
  if(sel.length!==3){s.msg='Choose exactly three clues. You have '+sel.length+'.';}
  else if(right===3){s.done=true;s.msg='';s.at=new Date().toISOString();}
  else{s.msg=(wrong===1?'One of your clues':'Some of your clues')+' does not prove anything about the tea. Ask: does this clue tell us what was IN the cup?';
    s.bad=(s.bad||[]);sel.forEach(function(i){if(!CLUES[i].ok&&s.bad.indexOf(i)===-1)s.bad.push(i);});s.sel=sel.filter(function(i){return CLUES[i].ok;});}
  touch();var y=window.scrollY;render();window.scrollTo(0,y);}
function checkReport(){var s=it('A4'),t=(s.text||'').toLowerCase(),n=t.trim().split(/\s+/).filter(Boolean).length,min=(work.level==='hard')?40:25;
  s.tries.push(n);
  if(n<min)s.msg='Write a little more. You have '+n+' words; aim for at least '+min+'.';
  else if(!/cyanide/.test(t))s.msg='Your report never names the poison. Which entry in the poison book matches the tea?';
  else if(!/almond/.test(t))s.msg='Give your strongest clue. What did the tea taste and smell like?';
  else if(!/arsenic/.test(t))s.msg='The police will ask: why not arsenic? Explain using the poison book or her notebook.';
  else if(!/because|so|therefore|since/.test(t))s.msg='Connect your clues to your answer with because, so or therefore.';
  else{s.done=true;s.msg='';s.at=new Date().toISOString();}
  touch();var y=window.scrollY;render();window.scrollTo(0,y);if(s.done)save();}

function save(){
  if(!me)return Promise.resolve();

   .catch(function(){$('saved').textContent='Offline — will retry';});

   .then(function(r){if(!r.ok)throw new Error('load '+r.status);return r.json();})
   .then(function(rows){
     if(rows&&rows[0]&&rows[0].payload&&rows[0].payload.work){var d=rows[0].payload.work;
       Object.keys(d.items||{}).forEach(function(k){var mine=work.items[k],srv=d.items[k];if(!mine||(!mine.done&&(srv.done||(srv.tries||[]).length>=(mine.tries||[]).length)))work.items[k]=srv;});
       Object.keys(d.orders||{}).forEach(function(k){work.orders[k]=d.orders[k];});

       if(rows[0].submitted)work.turnedIn=true;}
     loaded=true;return true;})
   .catch(function(){$('saved').textContent='⚠ Can’t reach the server — your work is not saved yet';return false;});
