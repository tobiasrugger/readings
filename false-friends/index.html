*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 Nunito,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 60px}
#login{max-width:440px;margin:6vh auto;background:var(--card);border-radius:20px;padding:28px 26px;border:1px solid var(--line)}
#login h1{margin:0 0 6px;font-size:36px;font-weight:900;line-height:1.1}
#login h1 .a{color:var(--a)} #login h1 .b{color:var(--b)} #login h1 .c{color:var(--c)}
#login p{margin:0 0 18px;color:var(--muted)}
#login label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
#login input,#login select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#login .err{color:var(--no);font-size:15px;min-height:22px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%;margin-top:18px;font-size:19px}
.btn.green{background:var(--g);color:#fff}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.brand{font-weight:900;font-size:20px}
.who{color:var(--muted);font-size:15px}
.spacer{flex:1}
.bar select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:15px}
.home{color:var(--muted);text-decoration:none;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px}
#btn-dir{padding:7px 12px;font-size:15px;box-shadow:none;border-radius:9px}
#btn-dir.on{background:var(--c);color:var(--card);border-color:var(--c)}
#dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
#dot.saving{background:var(--b-b)} #dot.saved{background:var(--ok)} #dot.err{background:var(--no)}
#acts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.act{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-size:16px;white-space:nowrap}
.act.on{background:var(--c);border-color:var(--c);color:var(--card)}
.act .ck{color:var(--ok);font-weight:900;margin-left:4px} .act.on .ck{color:var(--card)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 4px;font-size:26px;font-weight:900}
.lede{margin:0 0 16px;color:var(--muted);font-size:16px}
.dirtr{display:block;font-size:16px;color:var(--ink);margin-top:4px;font-weight:400}
.dirtr[dir=rtl]{text-align:right}
.tr{text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
/* filter chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:15px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.mine{border-color:var(--g);color:var(--g)} .chip.mine.on{background:var(--g);color:#fff}
/* group + cards */
.grp{margin-top:22px}
.grp h3{margin:0 0 10px;font-size:20px;font-weight:900;color:var(--fc)}
.grp.k0{--fc:var(--a);--ft:var(--a-t)} .grp.k1{--fc:var(--b);--ft:var(--b-t)} .grp.k2{--fc:var(--c);--ft:var(--c-t)} .grp.k3{--fc:var(--g);--ft:var(--g-t)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ff{background:var(--ft);border:2px solid var(--fc);border-radius:18px;padding:16px;position:relative}
.ff .w{font-size:34px;font-weight:900;color:var(--fc);line-height:1.1;overflow-wrap:anywhere}
.ff .in{font-size:14px;color:var(--muted);margin-bottom:6px}
.ff .looks,.ff .means{margin-top:8px;font-size:16px;line-height:1.4}
.ff .looks s{color:var(--no);text-decoration:line-through}
.ff .means b{color:var(--fc);font-size:19px}
.ff .funny{margin-top:10px;padding-top:8px;border-top:1px dashed var(--fc);font-size:15px;color:var(--ink)}
.ff .spk{position:absolute;top:10px;right:10px;background:var(--card);border:1.5px solid var(--fc);border-radius:999px;padding:3px 10px;font-size:15px}
.ff .by{font-size:13px;color:var(--muted);margin-top:8px}
.ff.mine{box-shadow:0 0 0 3px var(--g)}
/* quiz */
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 16px}
.prog i{display:block;height:100%;background:var(--c);width:0;transition:width .2s}
.qword{font-size:46px;font-weight:900;text-align:center;color:var(--a);line-height:1.1;overflow-wrap:anywhere}
.qin{text-align:center;color:var(--muted);font-size:16px}
.qlooks{text-align:center;font-size:19px;margin:10px 0 16px}
.opts{display:grid;grid-template-columns:1fr;gap:10px;max-width:520px;margin:0 auto}
.opt{background:var(--c-t);border:2px solid var(--c);color:var(--c);border-radius:14px;padding:12px 14px;font-size:19px;font-weight:700;text-align:left;box-shadow:0 4px 0 var(--c);transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c)}
.opt.ok{background:var(--ok-t);border-color:var(--ok);color:var(--ok);box-shadow:none}
.opt.no{background:var(--no-t);border-color:var(--no);color:var(--no);box-shadow:none;animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{text-align:center;min-height:50px;margin-top:14px;font-size:18px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.cnt{color:var(--muted);font-size:15px;text-align:center;margin-top:8px}
.summary{text-align:center}
.score{font-size:64px;font-weight:900;color:var(--c);line-height:1}
/* add form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.form label{display:block;font-size:14px;color:var(--muted);margin-bottom:3px}
.form input,.form select,.form textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.form .full{grid-column:1/-1}
.form textarea{min-height:60px;resize:vertical}
.thanks{background:var(--ok-t);color:var(--ok);border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:700}
.empty{color:var(--muted);font-size:16px;padding:12px 0}
footer{color:var(--muted);text-align:center;margin-top:30px;font-size:14px}
#pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,92vw);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50}
#pop button{position:absolute;top:6px;right:10px;background:none;border:0;font-size:24px}
#pop .src{font-weight:700;margin-right:30px} #pop .dst{font-size:22px;margin-top:4px} #pop .mean{color:var(--muted);font-size:15px;margin-top:4px}
[dir=rtl]{text-align:right}
@media (max-width:560px){ .form{grid-template-columns:1fr} .qword{font-size:36px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

var voice=null, Q=null, wallRows=null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function headers(extra){ var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; if(extra) for(var k in extra) h[k]=extra[k]; return h; }
function setDot(c){ $('dot').className=c; }
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    if(/^\s*I[.!?,]?\s*$/.test(text)) text='eye';
    var u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
    if(!voice){ var vs=speechSynthesis.getVoices(), i;
      for(i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang) && /female|samantha|zira|aria|jenny|google us english/i.test(vs[i].name)){ voice=vs[i]; break; } }
      if(!voice) for(i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang)){ voice=vs[i]; break; } } }
    if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function T(text){ return '<button class="tr" data-tr="'+esc(text)+'">'+esc(text)+'</button>'; }
function bestFor(ak){ var r=S.scores[UNIT+'-'+ak]; return r && r.best>=Math.ceil(r.total*0.8) ? r : null; }
function isMine(it){ var m=myNames(S.lang); return it.langs.some(function(l){ return m.indexOf(l)>=0; }); }

/* ---------------- nav ---------------- */
function renderNav(){
  var h='';
  ACTS.forEach(function(a){
    var b = SCORED.indexOf(a.k)>=0 ? bestFor(a.k) : null;
    h += '<button class="act'+(a.k===S.act?' on':'')+'" data-actk="'+a.k+'">'+a.t+(b?'<span class="ck">✓</span>':'')+'</button>';
  });
  $('acts').innerHTML=h;
}
function go(ak){ S.act=ak; renderNav(); renderStage(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderStage(){
  Q=null; $('pop').classList.add('hidden');
  if(S.act==='cards') return renderCards();
  if(S.act==='guess') return startGuess();
  if(S.act==='wall') return renderWall();
  if(S.act==='add') return renderAdd();
}

/* ---------------- cards ---------------- */
function card(it, extra){
  return '<div class="ff'+(extra&&extra.mine?' mine':'')+'"><div class="in">'+esc(it.l)+'</div><div class="w">'+esc(it.w)+'</div>'+
    (/^[A-Za-zÀ-ÿ' ]+$/.test(it.w)?'<button class="spk" data-say="'+esc(it.w)+'">🔊</button>':'')+
    '<div class="looks">looks like <s>'+esc(it.looks)+'</s></div>'+
    '<div class="means">really means <b>'+T(it.means)+'</b></div>'+
    '<div class="funny">'+T(it.fun)+'</div>'+
    (extra&&extra.by?'<div class="by">— '+esc(extra.by)+'</div>':'')+'</div>';
}
function renderCards(){
  var mineCount=ALL.filter(isMine).length;
  var h='<div class="panel"><h2>Same word, different meaning</h2>'+
    '<p class="lede">Every language has words that look like a word in another language but mean something very different. Read the funny mistakes. Tap any underlined text to see it in your language.</p>'+
    '<div class="chips">'+(mineCount?'<button class="chip mine'+(S.filter==='mine'?' on':'')+'" data-filter="mine">My language ('+mineCount+')</button>':'')+
    '<button class="chip'+(S.filter==='all'?' on':'')+'" data-filter="all">All</button>'+
    ALL_LANGS.map(function(l){ return '<button class="chip'+(S.filter===l?' on':'')+'" data-filter="'+esc(l)+'">'+esc(l)+'</button>'; }).join('')+'</div>';
  var f = S.filter; if(f==='mine' && !mineCount) f='all';
  var any=false;
  GROUPS.forEach(function(g,gi){
    var items=g.items.filter(function(it){ return f==='all' || (f==='mine' ? isMine(it) : it.langs.indexOf(f)>=0); });
    if(!items.length) return; any=true;
    h += '<div class="grp k'+(gi%4)+'"><h3>'+esc(g.g)+'</h3><div class="cards">'+items.map(function(it){ return card(it,{mine:f==='all'&&isMine(it)}); }).join('')+'</div></div>';
  });
  if(!any) h += '<div class="empty">No cards for this language yet. Add one!</div>';
  h += '<div class="row"><button class="btn green" data-actk="add">+ Add a false friend from your language</button></div></div>';
  $('stage').innerHTML=h;
}

/* ---------------- guess ---------------- */
function startGuess(){
  var mine=ALL.filter(isMine), rest=ALL.filter(function(it){ return !isMine(it); });
  var pool=shuffle(mine).concat(shuffle(rest)).slice(0,10);
  Q={items:pool.map(function(it){
      var wrong=shuffle(ALL.filter(function(o){ return o!==it && o.means!==it.means; })).slice(0,2).map(function(o){ return o.means; });
      return {it:it, ans:it.means, opts:shuffle([it.means].concat(wrong))};
    }), i:0, correct:0, missed:[], answered:false};
  renderGuess();
}
function renderGuess(){
  var q=Q.items[Q.i], it=q.it;
  var h='<div class="panel"><h2>Guess</h2><p class="lede">Read the word. What does it really mean? Tap your guess.</p>'+
    '<div class="prog"><i style="width:'+Math.round(100*Q.i/Q.items.length)+'%"></i></div>'+
    '<div class="qin">'+esc(it.l)+'</div><div class="qword">'+esc(it.w)+'</div>'+
    '<div class="qlooks">It looks like '+esc(it.looks)+'. But it really means…</div>'+
    '<div class="opts">'+q.opts.map(function(o){ return '<button class="opt" data-opt="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'</div>'+
    '<div class="fb" id="fb"></div><div class="row" id="nextRow"></div><div class="cnt">'+(Q.i+1)+' / '+Q.items.length+'</div></div>';
  $('stage').innerHTML=h;
}
function answer(chosen){
  Q.answered=true;
  var q=Q.items[Q.i], ok=(chosen===q.ans), fb=$('fb');
  if(ok) Q.correct++; else Q.missed.push({ans:q.it.w+' = '+q.ans, said:chosen});
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
    b.disabled=true;
    if(b.getAttribute('data-opt')===q.ans) b.classList.add('ok'); else if(b.getAttribute('data-opt')===chosen) b.classList.add('no');
  });
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✓ Yes! ':'✗ ')+'<b>'+esc(q.it.w)+'</b> = '+esc(q.ans)+'<div style="font-size:15px;color:var(--muted);margin-top:6px">'+T(q.it.fun)+'</div>';
  $('nextRow').innerHTML='<button class="btn" data-next="1">'+(Q.i+1<Q.items.length?'Next →':'Finish')+'</button>';
  var n=document.querySelector('[data-next]'); if(n) n.focus();
}
function nextQ(){ Q.i++; Q.answered=false; if(Q.i>=Q.items.length) return showSummary(); renderGuess(); }
function showSummary(){
  var c=Q.correct, t=Q.items.length, pct=c/t;
  var msg = pct===1 ? 'Perfect!' : pct>=0.8 ? 'Great work!' : pct>=0.6 ? 'Good. Try again.' : 'Keep practicing.';
  var h='<div class="panel summary"><h2>'+msg+'</h2><div class="score">'+c+' / '+t+'</div><p class="lede" style="margin:0 auto">correct</p>';
  h += '<div class="row"><button class="btn soft" data-again="1">Again</button><button class="btn" data-actk="wall">Class wall →</button></div></div>';
  $('stage').innerHTML=h;
  saveResult('guess', c, t, Q.missed);
}

/* ---------------- class wall + add yours ---------------- */
function loadWall(){
  setDot('saving');
  return rawFetch(SUPA_URL+'/rest/v1/'+WALL+'?approved=eq.true&select=id,name,period,word,lang,looks_like,really_means,funny&order=created_at.desc&limit=200',{headers:headers()})
    .then(function(r){ return r.ok?r.json():[]; }).then(function(rows){ setDot('saved'); wallRows=rows||[]; return wallRows; })
    .catch(function(){ setDot('err'); wallRows=[]; return wallRows; });
}
function renderWall(){
  $('stage').innerHTML='<div class="panel"><h2>Class wall</h2><p class="lede">False friends from students in our class. Tap any underlined text to see it in your language.</p><div class="empty" id="wallBody">Loading…</div>'+
    '<div class="row"><button class="btn green" data-actk="add">+ Add yours</button></div></div>';
  loadWall().then(function(rows){
    var body=$('wallBody'); if(!body) return;
    if(!rows.length){ body.textContent='Nothing here yet. Be the first!'; return; }
    body.className='cards';
    body.innerHTML=rows.map(function(r){ return card({l:r.lang, w:r.word, looks:r.looks_like, means:r.really_means, fun:r.funny||''},{by:(r.name||'')+(r.period?' · '+r.period:'')}); }).join('');
  });
}
function renderAdd(){
  var langOpts=LANGS.map(function(l){ return l[0]; }).concat(['English','Japanese','Portuguese','Italian','Polish','Czech','German','Persian','Other']);
  var h='<div class="panel"><h2>Add a false friend</h2><p class="lede">Do you know a word in your language that looks like a word in another language but means something different? Tell us. Mr. Toby checks it, then it goes on the class wall.</p>'+
    '<div class="form">'+
    '<div><label for="fWord">The word</label><input id="fWord" placeholder="embarazada" autocomplete="off"></div>'+
    '<div><label for="fLang">Its language</label><select id="fLang">'+langOpts.map(function(l){ return '<option'+(l===S.lang?' selected':'')+'>'+esc(l)+'</option>'; }).join('')+'</select></div>'+
    '<div class="full"><label for="fLooks">It looks like (which language, which word)</label><input id="fLooks" placeholder="English &quot;embarrassed&quot;" autocomplete="off"></div>'+
    '<div class="full"><label for="fMeans">It really means (in English)</label><input id="fMeans" placeholder="pregnant" autocomplete="off"></div>'+
    '<div class="full"><label for="fFun">The funny mistake (optional)</label><textarea id="fFun" placeholder="A man says &quot;I am pregnant&quot;…"></textarea></div>'+
    '</div><div class="err" id="addErr" style="color:var(--no);min-height:22px;font-size:15px"></div>'+
    '<div class="row"><button class="btn green" data-submit="1">Send to Mr. Toby</button></div><div id="addDone"></div></div>';
  $('stage').innerHTML=h;
}
function submitAdd(){
  var word=$('fWord').value.trim(), lang=$('fLang').value, looks=$('fLooks').value.trim(), means=$('fMeans').value.trim(), fun=$('fFun').value.trim(), err=$('addErr');
  if(!word) return err.textContent='Type the word.';
  if(!looks) return err.textContent='What does it look like?';
  if(!means) return err.textContent='What does it really mean?';
  err.textContent=''; setDot('saving');
  var row={email:S.email, name:S.name, period:S.period, word:word, lang:lang, looks_like:looks, really_means:means, funny:fun||null, approved:false};
  rawFetch(SUPA_URL+'/rest/v1/'+WALL,{method:'POST',headers:headers({'Prefer':'return=minimal'}),body:JSON.stringify([row])})
    .then(function(r){
      if(!r.ok){ setDot('err'); err.textContent='Could not send. Try again.'; return; }
      setDot('saved');
      $('addDone').innerHTML='<div class="thanks">✓ Sent! Mr. Toby will check it and put it on the wall.</div><div class="cards" style="margin-top:12px">'+card({l:lang,w:word,looks:looks,means:means,fun:fun},{by:S.name})+'</div>';
      ['fWord','fLooks','fMeans','fFun'].forEach(function(id){ $(id).value=''; });
      saveResult('add', 1, 1, []);
    }).catch(function(){ setDot('err'); err.textContent='Could not send. Try again.'; });
}

/* ---------------- save ---------------- */
var registered=false;
/* gradebook: Guess best (of 10) + 1 for a false friend of their own (read by track.js) */
function publishScore(){
  var sc=0, mx=0; ['guess','add'].forEach(function(k){ var r=S.scores[UNIT+'-'+k]; if(r && r.total){ sc+=r.best||0; mx+=r.total; } });
  if(mx){ window.GAL_SCORE=sc; window.GAL_MAX=mx; }
}
function saveResult(ak, correct, total, missed){
  var key=UNIT+'-'+ak, prev=S.scores[key]||{best:0,attempts:0};
  var rec={best:Math.max(prev.best||0,correct), total:total, correct:correct, attempts:(prev.attempts||0)+1};
  S.scores[key]=rec; renderNav(); publishScore(); setDot('saving');
  var when=new Date().toISOString();
  var row={email:S.email, name:S.name, period:S.period, activity:key, unit:UNIT, correct:correct, total:total, best:rec.best, attempts:rec.attempts, turned_in:true,
    detail:{lang:S.lang, missed:missed.slice(0,20)}, updated_at:when};
  rawFetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,activity',{method:'POST',headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(row)})
    .then(function(r){ if(r.ok) setDot('saved'); else { setDot('err'); r.text().then(function(t){ console.warn('save failed',r.status,t); }); } })
    .catch(function(e){ setDot('err'); console.warn(e); });
  var post=function(path, body, prefer){ return rawFetch(SUPA_URL+'/rest/v1/'+path,{method:'POST',headers:headers({'Prefer':prefer||'return=minimal'}),body:JSON.stringify(body)}).catch(function(){}); };
  var reg = registered ? Promise.resolve() : post('activities?on_conflict=slug',[{slug:SLUG, title:'False Friends: funny mistakes between languages', unit:'Tricky Words', url:PAGE_URL, skills:['vocabulary'], sort_order:611}],'resolution=merge-duplicates,return=minimal').then(function(){ registered=true; });
  reg.then(function(){
    post('activity_attempts',[{email:S.email, slug:SLUG, score:correct, max_score:total, detail:{path:location.pathname, source:'page', task:ak, unit:UNIT}, completed_at:when}]);
  });
}
/* autosave every 20 s: an unfinished Guess round goes in as in-progress */
var lastAuto='';
function autosave(){
  if(!S.email || !Q) return;
  var key=UNIT+'-guess', prev=S.scores[key]||{best:0,attempts:0}, sig=key+'|'+Q.i+'|'+Q.correct; if(sig===lastAuto) return; lastAuto=sig;
  rawFetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,activity',{method:'POST',headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify({email:S.email, name:S.name, period:S.period, activity:key, unit:UNIT, correct:Q.correct, total:Q.items.length, best:prev.best||0, attempts:prev.attempts||0, turned_in:false, detail:{lang:S.lang, in_progress:Q.i}, updated_at:new Date().toISOString()})}).catch(function(){});
}
setInterval(autosave, 20000);
function loadScores(){
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?email=eq.'+encodeURIComponent(S.email)+'&activity=like.'+encodeURIComponent(UNIT+'-%')+'&turned_in=eq.true&select=activity,best,total,correct,attempts',{headers:headers()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ (rows||[]).forEach(function(r){ S.scores[r.activity]={best:r.best,total:r.total,correct:r.correct,attempts:r.attempts}; }); publishScore(); })
    .catch(function(){});
}

/* ---------------- login ---------------- */
var EMAIL_RE=/^[^@\s]+@(s\.)?sfusd\.edu$/;
function canonical(email){ return email.trim().toLowerCase().split('@')[0]+'@s.sfusd.edu'; }
function registerStudent(typed){
  var canon=S.email;
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify([{email:canon, name:S.name, first_name:S.first||null, last_name:S.last||null, updated_at:new Date().toISOString()}])}).catch(function(){});
  if(typed!==canon){
    fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:headers({'Prefer':'resolution=ignore-duplicates,return=minimal'}),
      body:JSON.stringify([{alias_email:typed, canonical_email:canon}])}).catch(function(){});
  }
}

/* ---------------- tap-to-translate ---------------- */
var trCache={};
function translate(text){
  var key=S.lang+'|'+text;
  if(trCache[key]) return popup(text, trCache[key].equiv, trCache[key].meaning);
  popup(text,'…','');
  var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('A simple English sentence or word meaning for a beginner. Translate it plainly.')+'&lang='+encodeURIComponent(S.lang);
  rawFetch(url).then(function(r){ return r.json(); }).then(function(d){
    if(d&&d.ok&&d.translation){ trCache[key]=d.translation; popup(text,d.translation.equiv,d.translation.meaning); }
    else popup(text,'Translation is not available right now.','');
  }).catch(function(){ popup(text,'Translation is not available right now.',''); });
}
function popup(src,dst,mean){
  var p=$('pop'); p.classList.remove('hidden'); var rtl=RTL.test(S.lang);
  p.innerHTML='<button aria-label="Close" data-closepop="1">×</button><div class="src">'+esc(src)+'</div><div class="dst" dir="'+(rtl?'rtl':'ltr')+'">'+esc(dst)+'</div>'+(mean?'<div class="mean" dir="'+(rtl?'rtl':'ltr')+'">'+esc(mean)+'</div>':'');
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  var t=e.target.closest ? e.target.closest('button, .tr') : null; if(!t) return;
  var d=function(k){ return t.getAttribute('data-'+k); };
  if(d('closepop')){ $('pop').classList.add('hidden'); return; }
  if(d('say')){ speak(d('say')); return; }
  if(d('tr')){ translate(d('tr')); return; }
  if(d('actk')) return go(d('actk'));
  if(d('filter')){ S.filter=d('filter'); return renderCards(); }
  if(d('submit')) return submitAdd();
  if(d('again')) return renderStage();
  if(Q){
    if(d('opt')!=null && !Q.answered) return answer(d('opt'));
    if(d('next')) return nextQ();
  }
});

/* ---------------- boot ---------------- */

  if(window.speechSynthesis) speechSynthesis.onvoiceschanged=function(){ voice=null; };
})();

/* ============ Galileo standard: directions in L1 + quiet browser-translation canary ============ */
(function(){
  function hd(pref){ var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; if(pref) h['Prefer']=pref; return h; }
  var DIR_ON=true, SENT={}, dcache={};
  try{ DIR_ON = localStorage.getItem('ff_dir')!=='0'; }catch(e){}
  function tr(text, lang){
    var key=lang+'|'+text; if(dcache[key]) return Promise.resolve(dcache[key]);
    var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('Directions for a beginner English student. Translate plainly and simply.')+'&lang='+encodeURIComponent(lang);
    return rawFetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      var t=d.translation.equiv||d.translation.meaning||''; if(t) dcache[key]=t; return t||null;
    }).catch(function(){return null;});
  }
  function logReveal(k, lang){
    if(!S.email) return; var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    rawFetch(SUPA_URL+'/rest/v1/instruction_reveals',{method:'POST',headers:hd('return=minimal'),body:JSON.stringify([{email:S.email, set_slug:SLUG, activity:k, lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=S.lang, list=document.querySelectorAll('#stage .lede');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!p.getAttribute('data-en')){
        var en=(p.textContent||'').replace(out?out.textContent:'','').trim();
        p.setAttribute('data-en',en); p.setAttribute('translate','yes'); p.setAttribute('data-dir',S.act);
      }
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||''; if(!en) return;
      out.setAttribute('dir', RTL.test(lang)?'rtl':'ltr'); out.textContent='…';
      tr(en,lang).then(function(t){ out.textContent=t||''; if(t) logReveal(k,lang); });
    });
  }
  var dirBtn=$('btn-dir');
  dirBtn.classList.toggle('on',DIR_ON);
  dirBtn.addEventListener('click',function(){ DIR_ON=!DIR_ON; try{ localStorage.setItem('ff_dir',DIR_ON?'1':'0'); }catch(e){} dirBtn.classList.toggle('on',DIR_ON); showDirections(); });
  var pend=null;
  new MutationObserver(function(){ if(pend) return; pend=setTimeout(function(){ pend=null; showDirections(); },120); }).observe($('stage'),{childList:true});

  var EXPECT=(dirBtn.textContent||'').trim(), TR_SENT='';
  function detectTranslation(){
    var got=(dirBtn.textContent||'').trim(), observed=(got&&got!==EXPECT)?got:'';
    var cls=document.documentElement.className||'';
    if(!observed && !/translated/.test(cls)) return null;
    return {observed:observed, html_lang:document.documentElement.lang||'', html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation(); if(!d||!S.email) return;
    var sig=d.observed+'|'+d.html_lang; if(sig===TR_SENT) return; TR_SENT=sig;
    rawFetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{method:'POST',headers:hd('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:S.email, set_slug:SLUG, translated:true, observed:d.observed, html_lang:d.html_lang, html_class:d.html_class, updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation,20000); setTimeout(checkTranslation,4000);
})();
</script>
<script src="/readings/track.js"></script>
</body>
