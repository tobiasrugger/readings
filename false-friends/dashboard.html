<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>False Friends · Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2640;--muted:#5b6784;--bg:#eef2f8;--card:#fff;--line:#d3dbe9;--g:#1d7f53;--g-t:#dff3e8;--no:#b93a2e;--no-t:#fbe5e1;--b:#a86400;--b-t:#fff0d6}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf5;--muted:#a3adc4;--bg:#141a28;--card:#1e2638;--line:#34405a;--g:#6fd6a3;--g-t:#173a2b;--no:#ff9a8f;--no-t:#44211d;--b:#ffc56a;--b-t:#3d2f17}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Nunito,system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:900;margin:0 0 4px} .sub{color:var(--muted);margin:0 0 16px}
#gate{max-width:380px;margin:10vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:56px;resize:vertical}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--ink);color:var(--card);cursor:pointer;font:inherit}
.btn.ok{background:var(--g);color:#fff} .btn.no{background:var(--no-t);color:var(--no)} .btn.soft{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.item.pending{border-left:5px solid var(--b)}
.item.approved{border-left:5px solid var(--g)}
.meta{color:var(--muted);font-size:14px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px} .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.msg{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:20px 0}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div id="gate">
  <h1>False Friends</h1><p class="sub">Teacher review</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="row"><button class="btn" id="go">Open</button><span class="msg" id="gateMsg"></span></div>
</div>
<div id="app" style="display:none">
  <h1>False Friends — submissions</h1>
  <p class="sub">Approve, fix the wording, or delete. Approved cards appear on the students' Class wall. <a href="./" style="color:var(--muted)">Student page</a></p>
  <div class="tabs"><button class="tab on" data-f="pending">Pending <span id="nP"></span></button><button class="tab" data-f="approved">Approved <span id="nA"></span></button><button class="tab" data-f="all">All</button><button class="tab" id="reload">↻</button></div>
  <div id="list"></div>
</div>
</div>
<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var WALL='false_friends', PW='galileo2026', rows=[], filter='pending';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hd(p){ var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; if(p) h['Prefer']=p; return h; }
function load(){
  $('list').innerHTML='<div class="empty">Loading…</div>';
  return fetch(SUPA_URL+'/rest/v1/'+WALL+'?select=*&order=created_at.desc&limit=500',{headers:hd()}).then(function(r){ return r.ok?r.json():[]; })
    .then(function(rs){ rows=rs||[]; render(); }).catch(function(){ $('list').innerHTML='<div class="empty">Could not load.</div>'; });
}
function render(){
  var p=rows.filter(function(r){ return !r.approved; }).length, a=rows.length-p;
  $('nP').textContent='('+p+')'; $('nA').textContent='('+a+')';
  var vis=rows.filter(function(r){ return filter==='all' || (filter==='pending' ? !r.approved : r.approved); });
  if(!vis.length){ $('list').innerHTML='<div class="empty">Nothing here.</div>'; return; }
  $('list').innerHTML=vis.map(function(r){
    return '<div class="item '+(r.approved?'approved':'pending')+'" data-id="'+r.id+'">'+
      '<div class="meta">'+esc(r.name||r.email)+(r.period?' · '+esc(r.period):'')+' · '+new Date(r.created_at).toLocaleDateString()+(r.approved?' · <b style="color:var(--g)">on the wall</b>':' · <b style="color:var(--b)">pending</b>')+'</div>'+
      '<div class="grid"><div><label>Word</label><input data-k="word" value="'+esc(r.word)+'"></div><div><label>Language</label><input data-k="lang" value="'+esc(r.lang)+'"></div>'+
      '<div class="full"><label>Looks like</label><input data-k="looks_like" value="'+esc(r.looks_like)+'"></div>'+
      '<div class="full"><label>Really means</label><input data-k="really_means" value="'+esc(r.really_means)+'"></div>'+
      '<div class="full"><label>Funny mistake</label><textarea data-k="funny">'+esc(r.funny||'')+'</textarea></div></div>'+
      '<div class="row">'+(r.approved?'<button class="btn soft" data-act="unapprove">Take off wall</button>':'<button class="btn ok" data-act="approve">✓ Approve + put on wall</button>')+
      '<button class="btn soft" data-act="save">Save edits</button><button class="btn no" data-act="delete">Delete</button><span class="msg" data-msg="1"></span></div></div>';
  }).join('');
}
function fieldsOf(el){ var o={}; el.querySelectorAll('[data-k]').forEach(function(i){ o[i.getAttribute('data-k')]=i.value.trim()||null; }); return o; }
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  if(t.id==='go'){ if($('pw').value===PW){ $('gate').style.display='none'; $('app').style.display=''; load(); } else $('gateMsg').textContent='Nope.'; return; }
  if(t.id==='reload') return load();
  if(t.getAttribute('data-f')){ filter=t.getAttribute('data-f'); document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on',x===t); }); return render(); }
  var act=t.getAttribute('data-act'); if(!act) return;
  var el=t.closest('.item'), id=el.getAttribute('data-id'), msg=el.querySelector('[data-msg]');
  var body=fieldsOf(el);
  if(act==='approve') body.approved=true; if(act==='unapprove') body.approved=false;
  if(act==='delete'){ if(!confirm('Delete this submission?')) return;
    return fetch(SUPA_URL+'/rest/v1/'+WALL+'?id=eq.'+id,{method:'DELETE',headers:hd('return=minimal')}).then(function(r){ if(r.ok){ rows=rows.filter(function(x){ return String(x.id)!==String(id); }); render(); } else msg.textContent='Delete failed.'; }); }
  msg.textContent='Saving…';
  fetch(SUPA_URL+'/rest/v1/'+WALL+'?id=eq.'+id,{method:'PATCH',headers:hd('return=representation'),body:JSON.stringify(body)})
    .then(function(r){ return r.ok?r.json():null; }).then(function(d){
      if(!d||!d[0]){ msg.textContent='Save failed.'; return; }
      rows=rows.map(function(x){ return String(x.id)===String(id)?d[0]:x; }); render();
    }).catch(function(){ msg.textContent='Save failed.'; });
});
$('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') $('go').click(); });
</script>
<script src="https://tobiasrugger.github.io/readings/grade04.js"></script>
</body>
</html>
