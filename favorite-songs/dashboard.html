<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher dashboard — Our Favorite Songs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#12241D; --pine:#1F4D3D; --pine2:#2F6B54; --pine-ghost:#E4EDE8;
  --cream:#FBF6EA; --paper:#FFFFFF;
  --amber:#E8A33D; --rose:#E0527F; --sky:#4E9BB9; --grape:#7C5CBF;
  --line:#1F4D3D; --ok:#2E7D4F; --no:#C0392B;
  --shadow:4px 4px 0 rgba(31,77,61,.16);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--cream);color:var(--ink);
  font-size:17px;line-height:1.55}
h1,h2,h3,h4,.dsp,button,.pill,.tab{font-family:Fredoka,Nunito,sans-serif}
h1{font-size:2.1rem;line-height:1.05;margin:0}
h2{font-size:1.45rem;margin:0 0 .2em}
h3{font-size:1.15rem;margin:0 0 .3em}
a{color:var(--pine)}
.wrap{max-width:920px;margin:0 auto;padding:0 18px 90px}

/* ---------- header ---------- */
.top{background:var(--pine);color:var(--cream);padding:22px 18px 26px;position:relative;overflow:hidden}
.top .wrap{padding-bottom:0}
.eq{display:flex;align-items:flex-end;gap:4px;height:34px;margin-bottom:12px}
.eq i{display:block;width:7px;background:var(--amber);border-radius:3px 3px 0 0;height:30%}
.eq i:nth-child(2n){background:var(--rose)}
.eq i:nth-child(3n){background:var(--sky)}
@media (prefers-reduced-motion:no-preference){
  .eq i{animation:bounce 1.1s ease-in-out infinite}
}
@keyframes bounce{0%,100%{height:22%}50%{height:100%}}
.top p.sub{margin:.5em 0 0;color:#CFE3D8;font-size:1rem;max-width:60ch}
.crumb{display:inline-block;margin-bottom:10px;color:#BCD6C9;text-decoration:none;font-weight:700;font-size:.9rem}
.crumb:hover{color:#fff}

/* ---------- cards ---------- */
.card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:20px;
  box-shadow:var(--shadow);margin:22px 0}
.card.tint{background:#F4FAF6}
.note{background:#FFF7E4;border:2px dashed var(--amber);border-radius:14px;padding:14px 16px;margin:16px 0}
.step{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;
  border-radius:50%;background:var(--pine);color:var(--cream);font-family:Fredoka;font-weight:600;
  margin-right:10px;font-size:.95rem;padding:0 8px}
.hd{display:flex;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px}

/* ---------- buttons ---------- */
button,.btn{font-size:1rem;font-weight:600;border-radius:999px;border:2px solid var(--pine);
  background:var(--pine);color:var(--cream);padding:9px 18px;cursor:pointer;text-decoration:none;
  display:inline-block}
button:hover,.btn:hover{background:var(--pine2)}
button.ghost,.btn.ghost{background:transparent;color:var(--pine)}
button.ghost:hover{background:var(--pine-ghost)}
button.amber{background:var(--amber);border-color:#B87C22;color:#3A2604}
button.amber:hover{background:#F2B657}
button.big{font-size:1.15rem;padding:13px 26px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,
.opt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button[disabled]{opacity:.5;cursor:default}

/* ---------- form ---------- */
label{display:block;font-weight:700;margin:14px 0 5px}
input[type=text],input[type=url],textarea,select{width:100%;font-family:Nunito;font-size:1rem;
  padding:10px 12px;border:2px solid #9BB3A8;border-radius:11px;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--pine)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 220px}
.frame{font-style:italic;color:#5B6F66;font-size:.95rem;margin:4px 0}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid #9BB3A8;background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;
  cursor:pointer;font-size:.95rem;user-select:none}
.chip:hover{border-color:var(--pine)}
.chip[aria-pressed=true]{background:var(--pine);color:var(--cream);border-color:var(--pine)}
.chip.mood[aria-pressed=true]{background:var(--rose);border-color:#B33A62;color:#fff}
.chip.inst[aria-pressed=true]{background:var(--sky);border-color:#2F7A97;color:#fff}

/* ---------- level switch ---------- */
.levels{display:flex;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;
  padding:4px;width:max-content;margin:18px 0}
.levels button{border:none;background:transparent;color:var(--pine);padding:7px 16px;font-size:.95rem}
.levels button[aria-pressed=true]{background:var(--amber);color:#3A2604}
body[data-level=easy] .lvl-std,body[data-level=easy] .lvl-chal{display:none}
body[data-level=std] .lvl-easy,body[data-level=std] .lvl-chal{display:none}
body[data-level=chal] .lvl-easy,body[data-level=chal] .lvl-std{display:none}
body[data-level=chal] #bank{display:none}

/* ---------- vocab grid ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.vcard{border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px;text-align:center;
  cursor:pointer}
.vcard .em{font-size:2.2rem;line-height:1.1}
.vcard .w{font-family:Fredoka;font-weight:600;font-size:1.2rem;color:var(--pine)}
.vcard .d{font-size:.9rem;color:#41564C}
.vcard .tr{font-size:1rem;color:var(--grape);font-weight:700;min-height:1.2em;margin-top:4px}
.vcard:hover{background:#F4FAF6}

/* ---------- matching ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.match{grid-template-columns:1fr}}
.opt{border:2px solid #9BB3A8;background:#fff;border-radius:12px;padding:11px 12px;cursor:pointer;
  font-weight:700;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center;
  gap:8px}
.opt.big{font-size:1.8rem}
.opt[aria-pressed=true]{border-color:var(--amber);background:#FFF3DC}
.opt.paired{background:var(--pine-ghost);border-color:var(--pine);border-style:dashed}
.opt.right{background:#E3F5E9;border-color:var(--ok)}
.opt.wrong{background:#FBE6E3;border-color:var(--no)}
.opt .tag{font-size:.75rem;background:var(--pine);color:#fff;border-radius:6px;padding:1px 6px}

/* ---------- sort buckets ---------- */
.bucket{border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;min-height:90px}
.bucket h4{margin:0 0 6px;color:var(--pine);font-size:1rem}
.bucket .drop{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.bwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

/* ---------- cloze ---------- */
.cloze li{margin:10px 0}
.cloze input{width:170px;display:inline-block;padding:6px 10px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.bank span{background:#fff;border:2px solid #9BB3A8;border-radius:999px;padding:4px 12px;font-weight:700;
  font-size:.92rem}

/* ---------- feedback ---------- */
.score{font-family:Fredoka;font-weight:600;margin-left:10px}
.ok{color:var(--ok)} .bad{color:var(--no)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--pine);
  color:var(--cream);padding:11px 20px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.toast.show{opacity:1}

/* ---------- id bar ---------- */
.idbar{position:sticky;top:0;z-index:50;background:var(--cream);border-bottom:2px solid var(--line);
  padding:10px 18px}
.idbar .inner{max-width:920px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.idbar input,.idbar select{flex:1 1 150px;padding:7px 10px;font-size:.95rem}
.idbar .who{font-weight:800;color:var(--pine)}
.idbar .idnote{flex:1 1 100%;font-size:.84rem;font-weight:700;color:#6B7F75;line-height:1.3}
.idbar .idnote.warn{color:#B26A00}
.idbar .idnote.good{color:#1F4D3D}

/* ---------- print ---------- */
@media print{
  body{background:#fff;font-size:12pt}
  .top,.idbar,.levels,.noprint,button{display:none !important}
  .card{break-inside:avoid;box-shadow:none;margin:10px 0}
  a{color:#000;text-decoration:none}
}

</style>
</head>

<div class="wrap">

<script>

/* ============ shared kit ============ */
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TRANS_URL='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
var LANGS=['Spanish','Chinese','Cantonese','Arabic','Vietnamese','Tagalog','Russian','Portuguese','French','Japanese','Korean','Burmese'];

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function keyify(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toast(msg){var t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

function sbHeaders(extra){
  var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
async function sbUpsert(table,row,conflict){
  var url=SUPA_URL+'/rest/v1/'+table+(conflict?'?on_conflict='+conflict:'');
  var r=await fetch(url,{method:'POST',headers:sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify(row)});
  if(!r.ok){console.warn('upsert',table,r.status,await r.text());}
  return r.ok;
}
async function sbInsert(table,row){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table,{method:'POST',
    headers:sbHeaders({'Prefer':'return=representation'}),body:JSON.stringify(row)});
  if(!r.ok){console.warn('insert',table,r.status,await r.text());return null;}
  var j=await r.json();return j&&j[0]?j[0]:null;
}
async function sbSelect(table,qs){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs,{headers:sbHeaders()});
  if(!r.ok){console.warn('select',table,r.status);return [];}
  return await r.json();
}
async function sbDelete(table,qs){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs,{method:'DELETE',headers:sbHeaders()});
  return r.ok;
}

/* ---- translation (Apps Script proxy) ---- */
var _trCache={};
async function translateWord(word,meaning,lang){
  var ck=lang+'|'+word;
  if(_trCache[ck])return _trCache[ck];
  var u=TRANS_URL+'?action=translate&idiom='+encodeURIComponent(word)
      +'&meaning='+encodeURIComponent(meaning||'')+'&lang='+encodeURIComponent(lang);
  var r=await fetch(u);
  var j=await r.json();
  if(j&&j.ok&&j.translation){_trCache[ck]=j.translation;return j.translation;}
  throw new Error('translation failed');
}

/* ---- who am I (school email is the identifier) ---- */
var ME={email:'',name:'',period:''};
function loadMe(){
  try{var m=JSON.parse(localStorage.getItem('galileo_song_me')||'{}');
    ME.email=String(m.email||'').trim().toLowerCase();
    ME.name=m.name||'';ME.period=m.period||'';}catch(e){}
}
function saveMe(){try{localStorage.setItem('galileo_song_me',JSON.stringify(ME));}catch(e){}}
function meKey(){return String(ME.email||'').trim().toLowerCase();}
function emailOK(s){return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(s||'').trim());}
function meReady(){return !!(emailOK(ME.email)&&ME.name&&ME.name.trim().length>1&&ME.period);}
function meMissing(){
  if(!emailOK(ME.email))return 'Type your school email at the top (it ends with @sfusd.edu).';
  if(!(ME.name&&ME.name.trim().length>1))return 'Type your name at the top so the class knows whose song it is.';
  if(!ME.period)return 'Choose your class period at the top.';
  return '';
}

function idBarHTML(){
  var opts=['1','2','3','4','5','6','7'].map(function(p){
    return '<option value="'+p+'">Period '+p+'</option>';}).join('');
  return '<div class="idbar noprint"><div class="inner">'
    +'<span class="who">School email</span>'
    +'<input type="email" id="meEmail" placeholder="you@sfusd.edu" autocomplete="email" '
      +'inputmode="email" spellcheck="false" autocapitalize="none" style="flex:2 1 210px">'
    +'<input type="text" id="meName" placeholder="Your name (shown on the mixtape)" autocomplete="off">'
    +'<select id="mePeriod"><option value="">Class period&hellip;</option>'+opts+'</select>'
    +'<span class="idnote" id="idNote"></span>'
    +'</div></div>';
}
function idNote(){
  var el=$('#idNote'); if(!el)return;
  var v=String(ME.email||'').trim();
  if(!v){el.textContent='Your work saves to your school email, so you can finish on any computer.';
    el.className='idnote';return;}
  if(!emailOK(v)){el.textContent='That is not a whole email address yet.';el.className='idnote warn';return;}
  if(!/@sfusd\.edu$/i.test(v)){el.textContent='Careful \u2014 school emails end with @sfusd.edu.';
    el.className='idnote warn';return;}
  el.textContent='\u2713 '+v+(ME.period?(' \u00b7 Period '+ME.period):'');el.className='idnote good';
}
function wireIdBar(onChange){
  loadMe();
  var e=$('#meEmail'),n=$('#meName'),p=$('#mePeriod');
  if(!e||!n||!p)return;
  e.value=ME.email;n.value=ME.name;p.value=ME.period;
  function sync(){ME.email=String(e.value||'').trim().toLowerCase();
    ME.name=n.value;ME.period=p.value;saveMe();idNote();}
  function notify(){sync();if(onChange)onChange();}
  ['input','change','blur'].forEach(function(ev){
    e.addEventListener(ev,ev==='input'?sync:notify);
    n.addEventListener(ev,ev==='input'?sync:notify);
  });
  p.addEventListener('change',notify);
  idNote();
}

/* ---- youtube helpers ---- */
function ytId(url){
  if(!url)return '';
  var m=String(url).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m?m[1]:'';
}
function ytThumb(url){var id=ytId(url);return id?'https://img.youtube.com/vi/'+id+'/mqdefault.jpg':'';}
function firstUrl(s){var m=String(s||'').match(/https?:\/\/[^\s<>"'\)\]]+/);return m?m[0]:'';}

var PW='galileo2026', TAB='songs', PERIOD='', ROWS=[], VROWS=[], CROWS=[], TROWS=[];

function gate(){
  var ok=sessionStorage.getItem('galileo_song_dash')==='1';
  $('#gate').style.display=ok?'none':'block';
  $('#app').style.display=ok?'block':'none';
  if(ok)load();
}
async function load(){
  $('#body').innerHTML='<p class="frame">Loading…</p>';
  var f=PERIOD?('&class_period=eq.'+encodeURIComponent(PERIOD)):'';
  ROWS=await sbSelect('song_entries','select=*'+f+'&order=class_period.asc,student_name.asc');
  VROWS=await sbSelect('song_vocab_progress','select=*'+f+'&order=class_period.asc,student_name.asc');
  CROWS=await sbSelect('song_comments','select=*'+(PERIOD?('&class_period=eq.'+encodeURIComponent(PERIOD)):'')+'&order=created_at.desc');
  TROWS=await sbSelect('song_votes','select=*'+f+'&order=created_at.desc');
  draw();
}
function done(e){
  var need=['song_title','song_url','why_like','first_heard','main_idea','fav_line','fav_line_why'];
  var n=need.filter(function(k){return e[k]&&String(e[k]).trim();}).length;
  return n+'/'+need.length;
}
function drawSongs(){
  if(!ROWS.length)return '<p>No songs yet.</p>';
  return '<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem">'
   +'<tr style="background:#1F4D3D;color:#FBF6EA;text-align:left">'
   +['Per','Student','School email','Song','Artist','Link','Done','In','\u2605','',''].map(function(h){
       return '<th style="padding:7px 9px">'+h+'</th>';}).join('')+'</tr>'
   +ROWS.map(function(e,i){
     return '<tr style="border-bottom:1px solid #CFDCD5;background:'+(i%2?'#F4FAF6':'#fff')+'">'
      +'<td style="padding:7px 9px">'+esc(e.class_period)+'</td>'
      +'<td style="padding:7px 9px"><strong>'+esc(e.student_name)+'</strong></td>'
      +'<td style="padding:7px 9px;font-size:.85rem;color:#41564C">'+esc(e.email||'—')+'</td>'
      +'<td style="padding:7px 9px">'+esc(e.song_title||'')+'</td>'
      +'<td style="padding:7px 9px">'+esc(e.artist||'')+'</td>'
      +'<td style="padding:7px 9px">'+(e.song_url?'<a href="'+esc(e.song_url)+'" target="_blank" rel="noopener">open</a>':'—')+'</td>'
      +'<td style="padding:7px 9px">'+done(e)+'</td>'
      +'<td style="padding:7px 9px">'+(e.turned_in?'✓':'')+'</td>'
      +'<td style="padding:7px 9px"><button class="ghost exBtn" data-id="'+e.id+'" data-v="'
        +(e.is_example?'0':'1')+'" title="Show this entry to every class as a model" '
        +'style="padding:3px 9px;font-size:.85rem'+(e.is_example?';background:#E8A33D;border-color:#B87C22':'')
        +'">'+(e.is_example?'★':'☆')+'</button></td>'
      +'<td style="padding:7px 9px"><button class="ghost seeBtn" data-id="'+e.id+'" style="padding:3px 10px;font-size:.85rem">read</button></td>'
      +'<td style="padding:7px 9px"><button class="ghost delEntry" data-id="'+e.id+'" style="padding:3px 10px;font-size:.85rem;border-color:#C0392B;color:#C0392B">del</button></td>'
      +'</tr>';}).join('')+'</table></div>';
}
function drawVocab(){
  if(!VROWS.length)return '<p>No lesson work yet.</p>';
  return VROWS.map(function(v){
    var sc=v.scores||{},keys=Object.keys(sc);
    var bits=keys.map(function(k){return k.replace(/_/g,' ')+': '+sc[k].got+'/'+sc[k].tot;}).join(' · ');
    var w=v.writing||{};var wt=Object.keys(w).map(function(k){return w[k];}).filter(Boolean).join('\n');
    return '<div class="card" style="margin:12px 0"><strong>'+esc(v.student_name||'(no name)')+'</strong>'
      +' · Period '+esc(v.class_period)+' · <em>'+esc(v.lesson)+'</em> · '+esc(v.level||'')
      +(v.turned_in?' · <span class="ok">turned in ✓</span>':'')
      +'<div style="font-size:.9rem;color:#41564C;margin-top:4px">'+esc(bits||'no scores yet')+'</div>'
      +(wt?'<div style="margin-top:8px;white-space:pre-wrap;background:#F4FAF6;padding:10px;border-radius:10px">'+esc(wt)+'</div>':'')
      +'</div>';}).join('');
}
function rosterKey(){return 'galileo_song_roster_'+(PERIOD||'all');}
function getRoster(){
  try{return JSON.parse(localStorage.getItem(rosterKey())||'[]');}catch(e){return [];}
}
function setRoster(list){
  try{localStorage.setItem(rosterKey(),JSON.stringify(list));}catch(e){}
}
function parseRoster(txt){
  var out=[],seen={};
  String(txt||'').split(/[\s,;]+/).forEach(function(x){
    x=x.trim().toLowerCase();
    if(x.indexOf('@')<1)return;
    if(seen[x])return; seen[x]=1; out.push(x);
  });
  return out;
}
function drawMissing(){
  var roster=getRoster();
  var head='<div class="card" style="margin:12px 0">'
    +'<h3 style="margin-top:0">Your class list</h3>'
    +'<p>Paste your students\' school emails here \u2014 straight out of Synergy or a Google Group is '
    +'fine, spaces, commas or line breaks all work. It is saved in this browser, one list per period.</p>'
    +'<textarea id="rosterBox" style="min-height:110px" placeholder="student1@sfusd.edu\nstudent2@sfusd.edu">'
    +esc(roster.join('\n'))+'</textarea>'
    +'<p><button id="rosterSave">Save class list</button> '
    +'<button class="ghost" id="rosterClear">Clear</button></p></div>';
  if(!roster.length)return head+'<p>Paste a list above and this tab will show you who has not turned in.</p>';

  var live=ROWS.filter(function(r){return !r.is_example;});
  var byEmail={};
  live.forEach(function(r){if(r.email)byEmail[String(r.email).toLowerCase()]=r;});
  var vocab={};
  VROWS.forEach(function(v){if(v.email){vocab[String(v.email).toLowerCase()]=vocab[String(v.email).toLowerCase()]||{};
    vocab[String(v.email).toLowerCase()][v.lesson]=v;}});

  var rows=roster.map(function(em){
    var e=byEmail[em], vv=vocab[em]||{};
    return {email:em,entry:e,sound:!!vv.sound,feelings:!!vv.feelings};
  });
  var nothing=rows.filter(function(r){return !r.entry;});
  var started=rows.filter(function(r){return r.entry&&!r.entry.turned_in;});
  var inYet=rows.filter(function(r){return r.entry&&r.entry.turned_in;});

  function chunk(title,list,tone,render){
    if(!list.length)return '';
    return '<div class="card" style="margin:12px 0;border-left:8px solid '+tone+'">'
      +'<h3 style="margin-top:0">'+title+' ('+list.length+')</h3>'
      +'<div style="display:flex;flex-wrap:wrap;gap:8px">'+list.map(render).join('')+'</div></div>';
  }
  var extra=live.filter(function(r){return r.email&&roster.indexOf(String(r.email).toLowerCase())<0;});

  return head
   +'<div style="display:flex;gap:12px;flex-wrap:wrap;margin:12px 0">'
     +[['On the list',roster.length],['Turned in',inYet.length],
       ['Started, not in',started.length],['Nothing yet',nothing.length]].map(function(c){
       return '<div style="flex:1 1 130px;background:#fff;border:2px solid #1F4D3D;border-radius:14px;padding:10px 14px">'
         +'<div style="font-family:Fredoka;font-size:1.6rem;color:#1F4D3D;line-height:1.1">'+c[1]+'</div>'
         +'<div style="font-size:.85rem;font-weight:700;color:#41564C">'+c[0]+'</div></div>';}).join('')
   +'</div>'
   +chunk('Nothing yet',nothing,'#C0392B',function(r){
      return '<span style="background:#FBEAE7;border-radius:8px;padding:4px 10px;font-size:.9rem">'
        +esc(r.email)+(r.sound||r.feelings?' <em style="color:#41564C">(did a word lesson)</em>':'')+'</span>';})
   +chunk('Started but not turned in',started,'#E8A33D',function(r){
      return '<span style="background:#FCF3E3;border-radius:8px;padding:4px 10px;font-size:.9rem">'
        +esc(r.entry.student_name||r.email)+' \u2014 '+done(r.entry)+'</span>';})
   +chunk('Turned in',inYet,'#1F4D3D',function(r){
      return '<span style="background:#EAF4EE;border-radius:8px;padding:4px 10px;font-size:.9rem">'
        +esc(r.entry.student_name||r.email)+'</span>';})
   +(extra.length?chunk('Turned in but not on your list',extra,'#57709e',function(r){
      return '<span style="background:#EEF1F8;border-radius:8px;padding:4px 10px;font-size:.9rem">'
        +esc(r.student_name||'')+' \u00b7 '+esc(r.email)+'</span>';}):'');
}

function slugify(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,24)||'song';
}
function drawPick(){
  var live=ROWS.filter(function(r){return !r.is_example;});
  if(!live.length)return '<p>No songs yet, so there is nothing to vote on.</p>';
  var tally={};
  TROWS.forEach(function(v){tally[v.entry_id]=(tally[v.entry_id]||0)+1;});
  var rank=live.slice().sort(function(a,b){return (tally[b.id]||0)-(tally[a.id]||0);});
  var voted=TROWS.length;
  var top=tally[rank[0].id]||1;
  return '<div class="card" style="margin:12px 0"><h3 style="margin-top:0">Which song should the class study?</h3>'
    +'<p>'+voted+' vote'+(voted===1?'':'s')+' so far'+(PERIOD?(' in period '+esc(PERIOD)):' across all periods')
    +'. One vote per student, and they can change it.</p></div>'
    +rank.slice(0,12).map(function(e){
      var v=tally[e.id]||0, w=Math.round(100*v/top);
      return '<div class="card" style="margin:10px 0;padding:12px">'
        +'<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap">'
          +'<strong style="font-size:1.05rem">'+(esc(e.song_title)||'(no title)')+'</strong>'
          +'<span style="font-family:Fredoka;font-size:1.2rem;color:#1F4D3D">'+v+'</span></div>'
        +'<div style="font-size:.9rem;color:#41564C">'+esc(e.artist||'')
          +(e.song_language?' \u00b7 '+esc(e.song_language):'')+' \u00b7 chosen by '+esc(e.student_name||'')+'</div>'
        +'<div style="height:12px;background:#E4EDE8;border-radius:8px;overflow:hidden;margin:6px 0">'
          +'<div style="height:100%;width:'+w+'%;background:#E8A33D"></div></div>'
        +(e.song_url?'<a href="'+esc(e.song_url)+'" target="_blank" rel="noopener">open the song \u2197</a> ':'')
        +'<button class="ghost pickBtn" data-slug="'+esc(slugify(e.song_title))+'" '
          +'data-title="'+esc(e.song_title||'')+'" data-artist="'+esc(e.artist||'')+'" '
          +'style="padding:3px 12px;font-size:.85rem;margin-left:8px">make this the class song</button>'
        +'</div>';}).join('');
}

function drawComments(){
  if(!CROWS.length)return '<p>No comments yet.</p>';
  return CROWS.map(function(c){
    return '<div class="card" style="margin:10px 0;padding:12px">'
      +'<strong>'+esc(c.author_name)+'</strong> · Period '+esc(c.class_period)+' · '
      +new Date(c.created_at).toLocaleString()
      +(c.hidden?' · <span class="bad">hidden</span>':'')
      +'<div style="margin-top:6px">'+esc(c.body)+'</div>'
      +'<button class="ghost hideCmt" data-id="'+c.id+'" data-h="'+(c.hidden?'0':'1')+'" style="margin-top:8px;padding:3px 12px;font-size:.85rem">'
      +(c.hidden?'show again':'hide from students')+'</button> '
      +'<button class="ghost delCmt" data-id="'+c.id+'" style="margin-top:8px;padding:3px 12px;font-size:.85rem;border-color:#C0392B;color:#C0392B">delete</button>'
      +'</div>';}).join('');
}
function draw(){
  $$('#tabs button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.t===TAB));});
  $('#body').innerHTML = TAB==='songs'?drawSongs()
    :TAB==='vocab'?drawVocab()
    :TAB==='comments'?drawComments()
    :TAB==='missing'?drawMissing()
    :drawPick();
}
function csv(){
  var cols=['class_period','student_name','email','song_title','artist','song_url','lyrics_url','song_language',
    'speed','volume','voice','instruments','moods','why_like','first_heard','main_idea','fav_line',
    'fav_line_why','turned_in','updated_at'];
  var out=[cols.join(',')];
  ROWS.filter(function(r){return !r.is_example;}).forEach(function(r){
    out.push(cols.map(function(c){
      var v=r[c];if(Array.isArray(v))v=v.join('; ');
      return '"'+String(v==null?'':v).replace(/"/g,'""').replace(/\n/g,' ')+'"';}).join(','));});
  var blob=new Blob([out.join('\n')],{type:'text/csv'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='favorite-songs'+(PERIOD?'-period'+PERIOD:'')+'.csv';a.click();
}

document.addEventListener('DOMContentLoaded',function(){
  gate();
  $('#pwBtn').addEventListener('click',function(){
    if($('#pw').value.trim()===PW){sessionStorage.setItem('galileo_song_dash','1');gate();}
    else toast('Wrong password.');
  });
  $('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('#pwBtn').click();});
  $$('#tabs button').forEach(function(b){b.addEventListener('click',function(){TAB=b.dataset.t;draw();});});
  $('#per').addEventListener('change',function(){PERIOD=$('#per').value;load();});
  $('#csvBtn').addEventListener('click',csv);
  $('#reload').addEventListener('click',load);
  $('#body').addEventListener('click',async function(e){
    var s=e.target.closest('.seeBtn');
    if(s){
      var r=ROWS.filter(function(x){return x.id===s.dataset.id;})[0];if(!r)return;
      alert(r.student_name+' — '+(r.song_title||'')+'\n\n'
        +'WHY: '+(r.why_like||'—')+'\n\nFIRST HEARD: '+(r.first_heard||'—')
        +'\n\nMAIN IDEA: '+(r.main_idea||'—')+'\n\nFAVORITE LINE: '+(r.fav_line||'—')
        +'\nWHY: '+(r.fav_line_why||'—'));return;
    }
    var ex=e.target.closest('.exBtn');
    if(ex){
      await fetch(SUPA_URL+'/rest/v1/song_entries?id=eq.'+ex.dataset.id,{method:'PATCH',
        headers:sbHeaders({'Prefer':'return=minimal'}),
        body:JSON.stringify({is_example:ex.dataset.v==='1'})});
      toast(ex.dataset.v==='1'?'Now shown to every class as a model.':'No longer a model.');
      load();return;}
    var rs=e.target.closest('#rosterSave');
    if(rs){setRoster(parseRoster($('#rosterBox').value));toast('Class list saved.');draw();return;}
    var rc=e.target.closest('#rosterClear');
    if(rc){setRoster([]);toast('Class list cleared.');draw();return;}
    var pk=e.target.closest('.pickBtn');
    if(pk){
      var sl=pk.dataset.slug;
      alert('Class song: '+pk.dataset.title+' \u2014 '+pk.dataset.artist+'\n\n'
        +'Build the analysis page with this slug:\n\n    var SLUG = \''+sl+'\';\n\n'
        +'1. Copy your song-analysis template into readings/songs/'+sl+'.html\n'
        +'2. Change SLUG at the top of the file to '+sl+'\n'
        +'3. Open the page and paste the lyrics into the in-page box \u2014 they go to song_lyrics.\n'
        +'4. Add the card to the readings hub.');
      return;}
    var d=e.target.closest('.delEntry');
    if(d){if(!confirm('Delete this song entry? This cannot be undone.'))return;
      await sbDelete('song_entries','id=eq.'+d.dataset.id);load();return;}
    var h=e.target.closest('.hideCmt');
    if(h){
      await fetch(SUPA_URL+'/rest/v1/song_comments?id=eq.'+h.dataset.id,{method:'PATCH',
        headers:sbHeaders({'Prefer':'return=minimal'}),body:JSON.stringify({hidden:h.dataset.h==='1'})});
      load();return;}
    var dc=e.target.closest('.delCmt');
    if(dc){if(!confirm('Delete this comment?'))return;
      await sbDelete('song_comments','id=eq.'+dc.dataset.id);load();return;}
  });
});

</script>
<script src="/readings/track.js"></script>
