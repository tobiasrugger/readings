<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Practice &middot; Mr. Toby</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1F4D3D;--pine-dk:#163a2d;--pine-dp:#0f2a20;--pine-lt:#e7f0ec;
  --paper:#fbfaf6;--card:#fff;--field:#f4f7f5;
  --ink:#1d2320;--muted:#5f6b66;--line:#dfe3e0;--line-dk:#c3ccc7;
  --green:#1c7a3e;--green-bg:#e0f2e6;--red:#b5304a;--red-bg:#fbdde4;
  --gold:#b8842c;--gold-bg:#fdf4e3;--plum:#5a4a8a;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 70px}
h1,h2{margin:0 0 10px;font-weight:900;color:var(--pine)}
.hide{display:none!important}
a{color:var(--pine)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:20px;margin-bottom:16px;box-shadow:0 2px 0 var(--line)}
.btn{background:var(--pine);color:#fff;border:0;border-bottom:3px solid var(--pine-dp);
  border-radius:11px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer}
.btn:hover{background:var(--pine-dk)}.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn:disabled{background:var(--line-dk);border-bottom-color:var(--muted);cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--pine);border:2px solid var(--pine);border-bottom:3px solid var(--pine)}
.btn.sm{padding:7px 14px;font-size:.9rem;border-radius:9px}
input,select{font:inherit;padding:11px 12px;border:2px solid var(--line-dk);border-radius:11px;
  width:100%;background:var(--field);color:var(--ink)}
input:focus,select:focus{outline:0;border-color:var(--pine);background:#fff;box-shadow:0 0 0 4px rgba(31,77,61,.14)}
label{display:block;font-weight:800;font-size:.88rem;color:var(--pine);margin:0 0 5px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}

.hero{background:linear-gradient(135deg,var(--pine-dk),var(--pine));color:#fff;border-radius:var(--r);
  padding:20px;margin-bottom:16px;border-bottom:5px solid var(--pine-dp)}
.hero h1{color:#fff;margin:0;font-size:1.55rem}
.hero .sub{opacity:.92;font-weight:700;font-size:.92rem;margin-top:4px}

/* bilingual directions: English on top, translation directly underneath */
.dir{background:var(--pine-lt);border:1.5px solid var(--line-dk);border-left:7px solid var(--pine);
  border-radius:11px;padding:12px 16px;margin-bottom:16px}
.dir .en{font-weight:800;color:var(--pine)}
.dir .tr{color:var(--muted);font-weight:700;margin-top:3px}

.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--pine);width:0;transition:width .25s}
.counter{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;color:var(--muted)}

.prompt{font-size:1.45rem;font-weight:800;line-height:1.5;margin:6px 0 18px;color:var(--ink)}
.blank{display:inline-block;min-width:96px;border-bottom:4px solid var(--pine);
  text-align:center;font-weight:900;color:var(--pine);padding:0 8px}
.blank.filled{border-bottom-color:var(--green);color:var(--green)}
.blank.bad{border-bottom-color:var(--red);color:var(--red)}

.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{background:#fff;border:2px solid var(--line-dk);border-bottom:4px solid var(--line-dk);
  border-radius:12px;padding:12px 24px;font:inherit;font-weight:800;font-size:1.1rem;
  cursor:pointer;color:var(--ink)}
.choice:hover{border-color:var(--pine);background:var(--pine-lt)}
.choice.pick{background:var(--pine);color:#fff;border-color:var(--pine-dp)}
.choice:disabled{opacity:.5;cursor:not-allowed}

.fb{border-radius:11px;padding:13px 16px;margin-top:16px;font-weight:700;border:1.5px solid}
.fb.ok{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.fb.no{background:var(--gold-bg);color:var(--gold);border-color:var(--gold)}
.fb.rev{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.fb b{font-weight:900}

.done-score{font-size:3.2rem;font-weight:900;color:var(--pine);line-height:1}
.skillrow{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff}
.skillrow b{font-weight:800}
.v{display:inline-block;min-width:60px;text-align:center;padding:3px 10px;border-radius:9px;font-weight:900}
.v.g{background:var(--green-bg);color:var(--green)}
.v.y{background:var(--gold-bg);color:var(--gold)}
.v.r{background:var(--red-bg);color:var(--red)}
.note{color:var(--muted);font-size:.92rem}
.msg{padding:12px 15px;border-radius:11px;font-weight:700;margin-bottom:14px}
.msg.err{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red)}
.msg.ok{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green)}
.langbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ucard{display:block;background:#fff;border:1.5px solid var(--line);
  border-bottom:4px solid var(--pine);border-radius:13px;padding:16px 18px;
  margin-bottom:12px;text-decoration:none;color:var(--ink)}
.ucard:hover{background:var(--pine-lt);border-color:var(--pine)}
.ucard h3{margin:0;font-size:1.15rem;font-weight:900;color:var(--pine)}
.ucard .m{font-size:.88rem;color:var(--muted);font-weight:700;margin-top:4px}
.ucard .sk{display:inline-block;background:var(--pine-lt);color:var(--pine);
  border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:800;margin:6px 6px 0 0}
.langbar select{width:auto;min-width:170px;padding:7px 10px;font-size:.9rem}

#btn-dir.on,#btn-tap.on{background:#1F4D3D;color:#fff}
.dirtr{display:block;margin-top:4px;color:#2f6f57;font-weight:700}
.dirtr:empty{display:none}
body.tap-on .wt-tap{cursor:pointer;border-bottom:1px dotted #8aa79a}
body.tap-on .wt-tap:hover{background:#eef5f1}
.wt-bub{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:6px;
  background:#1F4D3D;color:#fff;font-size:.85em;font-weight:700}
</style>
</head>
<span id="canary" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden">the quick brown fox jumps over the lazy dog</span>
<body>
<div class="wrap">

<!-- ========== MENU (no ?u= chosen) ========== -->
<div id="menu" class="hide">
  <div class="hero">
    <h1>Grammar Practice</h1>
    <div class="sub">Mr. Toby &middot; Galileo Academy</div>
  </div>
  <p class="note" style="margin-top:0">Choose what you want to practice.</p>
  <div id="menuList"></div>
  <p style="margin-top:22px"><a href="../" style="font-weight:800">&larr; All readings</a></p>
</div>

<!-- ========== SIGN IN ========== -->
<div id="signin" class="card">
  <h1 id="unitTitle">Grammar Practice</h1>
  <p class="note" style="margin-top:0">Mr. Toby &middot; Galileo Academy</p>
  <div id="siMsg"></div>
  <div class="field"><label>My name</label><input id="inName" placeholder="First and last name"></div>
  <div class="grid2">
    <div class="field"><label>My school email</label>
      <input id="inEmail" placeholder="name@sfusd.edu" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>Period</label>
      <select id="inPeriod"><option value="">Choose your period</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
  </div>
  <div class="field"><label>My language</label><select id="inLang"></select></div>
  <button class="btn" onclick="signIn()">Start</button>
  <p id="siErr" class="note" style="color:var(--red);font-weight:800"></p>
</div>

<!-- ========== QUIZ ========== -->
<div id="quiz" class="hide">
  <div class="hero">
    <h1 id="qTitle">Grammar Practice</h1>
    <div class="sub" id="qWho"></div>
  </div>

  <div class="langbar">
    <label style="margin:0">Language</label>
    <select id="qLang" onchange="changeLang()"></select>
    <button class="btn ghost sm" onclick="signOut()">Not me</button>
  </div>

  <div class="dir" id="dirBox"></div>

  <div class="counter"><span id="cCount"></span><span id="cScore"></span></div>
  <div class="bar"><i id="cBar"></i></div>

  <div class="card" translate="no" data-tap="1">
    <div class="prompt" translate="no" data-tap="1" id="promptBox" translate="no"></div>
    <div class="choices" id="choiceBox" translate="no"></div>
    <div id="fbBox"></div>
    <div style="margin-top:18px">
      <button id="btn-dir" title="Show the directions in your language">Directions</button><button id="btn-tap" title="Tap any word for its meaning">Tap words</button><button class="btn" id="btnCheck" onclick="check()" disabled>Check</button>
      <button class="btn hide" id="btnNext" onclick="next()">Next</button>
    </div>
  </div>
</div>

<!-- ========== DONE ========== -->
<div id="done" class="hide">
  <div class="hero"><h1>Finished!</h1><div class="sub" id="dWho"></div></div>
  <div class="card" translate="no" data-tap="1" style="text-align:center">
    <div class="done-score" id="dScore"></div>
    <p class="note" id="dSub"></p>
  </div>
  <div class="card" translate="no" data-tap="1">
    <h2>What you practiced</h2>
    <div id="dSkills"></div>
  </div>
  <div id="saveMsg"></div>
  <p style="text-align:center">
    <button class="btn ghost" onclick="again()">Try again</button>
    <a class="btn" href="../student/" style="text-decoration:none;display:inline-block">My page</a>
  </p>
</div>

</div>

<script src="items.js"></script>
<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';

var LANGS=[['es','Espa\u00f1ol (Spanish)'],['zh-TW','\u7cb5\u8a9e (Cantonese)'],['zh-CN','\u666e\u901a\u8bdd (Mandarin)'],
 ['ar','\u0627\u0644\u0639\u0631\u0628\u064a\u0629 (Arabic)'],['ary','\u0627\u0644\u062f\u0627\u0631\u062c\u0629 (Darija)'],
 ['vi','Ti\u1ebfng Vi\u1ec7t (Vietnamese)'],['ru','\u0420\u0443\u0441\u0441\u043a\u0438\u0439 (Russian)'],
 ['ur','\u0627\u0631\u062f\u0648 (Urdu)'],['tl','Tagalog'],['fr','Fran\u00e7ais (French)'],
 ['ko','\ud55c\uad6d\uc5b4 (Korean)'],['hi','\u0939\u093f\u0928\u094d\u0926\u0940 (Hindi)'],
 ['so','Soomaali (Somali)'],['ne','\u0928\u0947\u092a\u093e\u0932\u0940 (Nepali)'],['th','\u0e44\u0e17\u0e22 (Thai)']];

function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(x){var h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
  if(x)for(var k in x)h[k]=x[k];return h;}
function clean(e){return String(e||'').trim().toLowerCase();}

/* ---------- which unit ---------- */
var qs=new URLSearchParams(location.search);
var WANT=qs.get('u');
var UNIT=UNITS.filter(function(x){return x.slug===WANT;})[0]||null;
var MENU=!UNIT;
if(!UNIT)UNIT=UNITS[0];
var SLUG='grammar/'+UNIT.slug;

var ME={name:'',email:'',period:'',lang:''};
var IDX=0, ANS=[], TRIES=0, PICK=null;

/* ---------- boot ---------- */
function nicely(s){return String(s).replace(/-/g,' ');}
function showMenu(){
  $('signin').classList.add('hide');
  $('menu').classList.remove('hide');
  $('menuList').innerHTML=UNITS.map(function(u){
    return '<a class="ucard" href="?u='+encodeURIComponent(u.slug)+'">'+
      '<h3>'+esc(u.title)+'</h3>'+
      '<div class="m">'+u.items.length+' questions &middot; two tries on each one</div>'+
      (u.skills||[]).map(function(k){return '<span class="sk">'+esc(nicely(k))+'</span>';}).join('')+
      '</a>';
  }).join('');
}

(function boot(){
  if(MENU){showMenu();return;}
  $('unitTitle').textContent=UNIT.title;
  $('qTitle').textContent=UNIT.title;
  document.title=UNIT.title+' \u00b7 Mr. Toby';
  var ps='<option value="">&mdash; choose &mdash;</option>';
  for(var p=1;p<=7;p++)ps+='<option value="'+p+'">Period '+p+'</option>';
  $('inPeriod').innerHTML=ps;
  var ls='<option value="">English only</option>'+LANGS.map(function(l){
    return '<option value="'+l[0]+'">'+l[1]+'</option>';}).join('');
  $('inLang').innerHTML=ls; $('qLang').innerHTML=ls;
  try{
    var e=localStorage.getItem('gal_student_email'); if(e)$('inEmail').value=e;
    var n=localStorage.getItem('gal_student_name'); if(n)$('inName').value=n;
    var p=localStorage.getItem('gal_student_period'); if(p)$('inPeriod').value=p;
    var lg=localStorage.getItem('gal_student_lang'); if(lg)$('inLang').value=lg;
  }catch(err){}
})();

/* ---------- sign in ---------- */
function signIn(){
  var name=$('inName').value.trim();
  var raw=$('inEmail').value.trim();
  var email=clean(raw);
  var period=$('inPeriod').value;
  var err=$('siErr');
  if(!name){err.textContent='Please type your name.';return;}
  var t=email.match(/^test[\s_-]*([a-z0-9]*)$/i);
  if(t)email='test'+(t[1]||'')+'@test.local';
  else if(!/^[^@\s]+@(s\.)?sfusd\.edu$/.test(email)){
    err.textContent='Please use your school email ending in @sfusd.edu';return;}
  if(!period){err.textContent='Please choose your period.';return;}
  err.textContent='';

  // canonical form: s.sfusd.edu and sfusd.edu are the same person
  var canon=email.indexOf('@test.local')>-1?email:email.replace('@s.sfusd.edu','@sfusd.edu');
  ME={name:name,email:canon,period:period,lang:$('inLang').value};
  try{
    localStorage.setItem('gal_student_email',canon);
    localStorage.setItem('gal_student_name',name);
    localStorage.setItem('gal_student_period',period);
    localStorage.setItem('gal_student_lang',ME.lang);
  }catch(e){}

  if(canon!==email){
    fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',
      headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify([{alias_email:email,email:canon}])}).catch(function(){});
  }
  var parts=name.split(/\s+/);
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',
    headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify([{email:canon,first_name:parts.shift()||null,
      last_name:parts.length?parts.join(' '):null,period:period,
      updated_at:new Date().toISOString()}])}).catch(function(){});

  $('signin').classList.add('hide');
  $('quiz').classList.remove('hide');
  $('qWho').textContent=name+' \u00b7 Period '+period;
  $('qLang').value=ME.lang;
  IDX=0;ANS=[];
  showDirections();
  render();
}
function signOut(){
  try{localStorage.removeItem('gal_student_email');}catch(e){}
  location.reload();
}

/* ---------- bilingual directions through the proxy ---------- */
function pickText(d){
  if(d==null)return '';
  if(typeof d==='string')return d.trim();
  if(typeof d==='object'){
    var keys=['translation','text','result','output','idiom','meaning'];
    for(var i=0;i<keys.length;i++){
      if(d[keys[i]]!=null){var v=pickText(d[keys[i]]); if(v)return v;}
    }
    for(var k in d){
      if(typeof d[k]==='string'&&d[k].trim())return d[k].trim();
    }
  }
  return '';
}

function showDirections(){
  var en=UNIT.directions;
  $('dirBox').innerHTML='<div class="en">'+esc(en)+'</div>';
  if(!ME.lang)return;
  var url=PROXY+'?action=translate&idiom='+encodeURIComponent(en)+
    '&meaning=&lang='+encodeURIComponent(ME.lang);
  fetch(url).then(function(r){return r.json();}).then(function(d){
    if(!d||d.ok===false)return;
    var out=pickText(d);
    if(out&&out!==en)
      $('dirBox').innerHTML='<div class="en">'+esc(en)+'</div>'+
        '<div class="tr" translate="no">'+esc(out)+'</div>';
  }).catch(function(){});
}
function changeLang(){ME.lang=$('qLang').value;
  try{localStorage.setItem('gal_student_lang',ME.lang);}catch(e){}
  showDirections();}

/* ---------- render one item ---------- */
function render(){
  var it=UNIT.items[IDX];
  TRIES=0;PICK=null;
  $('cCount').textContent='Question '+(IDX+1)+' of '+UNIT.items.length;
  var right=ANS.filter(function(a){return a.correct;}).length;
  $('cScore').textContent=right+' correct';
  $('cBar').style.width=Math.round(100*IDX/UNIT.items.length)+'%';
  $('promptBox').innerHTML=promptHtml(it,'');
  $('choiceBox').innerHTML=it.choices.map(function(c){
    return '<button class="choice" data-c="'+esc(c)+'" onclick="pick(this)">'+esc(c)+'</button>';}).join('');
  $('fbBox').innerHTML='';
  $('btnCheck').classList.remove('hide');$('btnCheck').disabled=true;
  $('btnNext').classList.add('hide');
}
function promptHtml(it,word,cls){
  var b='<span class="blank '+(cls||'')+'">'+(word?esc(word):'&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>';
  return esc(it.prompt).replace('___',b);
}
function pick(btn){
  if(btn.disabled)return;
  PICK=btn.getAttribute('data-c');
  var all=$('choiceBox').querySelectorAll('.choice');
  for(var i=0;i<all.length;i++)all[i].classList.remove('pick');
  btn.classList.add('pick');
  $('promptBox').innerHTML=promptHtml(UNIT.items[IDX],PICK,'filled');
  $('btnCheck').disabled=false;
}

/* ---------- check, with a second try like Quill ---------- */
function check(){
  var it=UNIT.items[IDX];
  if(PICK==null)return;
  TRIES++;
  var ok=clean(PICK)===clean(it.answer);
  if(ok){
    $('promptBox').innerHTML=promptHtml(it,PICK,'filled');
    $('fbBox').innerHTML='<div class="fb ok"><b>Well done!</b> '+it.why+'</div>';
    finishItem(true);
  }else if(TRIES===1){
    $('promptBox').innerHTML=promptHtml(it,PICK,'bad');
    $('fbBox').innerHTML='<div class="fb no"><b>Not quite.</b> Look at the sentence again and try one more time.</div>';
    $('btnCheck').disabled=true;PICK=null;
    var all=$('choiceBox').querySelectorAll('.choice');
    for(var i=0;i<all.length;i++)all[i].classList.remove('pick');
  }else{
    $('promptBox').innerHTML=promptHtml(it,it.answer,'filled');
    $('fbBox').innerHTML='<div class="fb rev">The answer is <b>'+esc(it.answer)+'</b>. '+it.why+'</div>';
    finishItem(false);
  }
}
function finishItem(correct){
  ANS.push({skill:UNIT.items[IDX].skill,correct:correct,tries:TRIES});
  $('btnCheck').classList.add('hide');
  $('btnNext').classList.remove('hide');
  var all=$('choiceBox').querySelectorAll('.choice');
  for(var i=0;i<all.length;i++)all[i].disabled=true;
  var right=ANS.filter(function(a){return a.correct;}).length;
  $('cScore').textContent=right+' correct';
}
function next(){
  IDX++;
  if(IDX>=UNIT.items.length)finish(); else render();
}

/* ---------- finish and save ---------- */
function finish(){
  $('quiz').classList.add('hide');
  $('done').classList.remove('hide');
  var right=ANS.filter(function(a){return a.correct;}).length;
  var total=UNIT.items.length;
  var pct=Math.round(100*right/total);
  $('dWho').textContent=ME.name+' \u00b7 '+UNIT.title;
  $('dScore').textContent=right+' / '+total;
  $('dSub').textContent=pct+'% correct';

  var by={};
  ANS.forEach(function(a){
    if(!by[a.skill])by[a.skill]={n:0,d:0};
    by[a.skill].d++; if(a.correct)by[a.skill].n++;
  });
  $('dSkills').innerHTML=Object.keys(by).map(function(k){
    var s=by[k],p=Math.round(100*s.n/s.d);
    var c=p>=80?'g':p>=60?'y':'r';
    return '<div class="skillrow"><b>'+esc(nice(k))+'</b>'+
      '<span class="v '+c+'">'+s.n+' / '+s.d+'</span></div>';}).join('');

  save(right,total,by);
}
function nice(s){return String(s).replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});}

function save(right,total,by){
  var now=new Date().toISOString();
  var act=[{slug:SLUG,title:UNIT.title,unit:'Grammar Practice',
    url:'https://tobiasrugger.github.io/readings/grammar/?u='+UNIT.slug,
    max_score:total,skills:UNIT.skills,sort_order:500}];
  var attempt=[{email:ME.email,slug:SLUG,score:right,max_score:total,
    detail:{source:'grammar',unit:UNIT.slug,period:ME.period,
      answers:ANS.map(function(a){return {skill:a.skill,correct:a.correct,tries:a.tries};})},
    completed_at:now}];
  var skillRows=Object.keys(by).map(function(k){
    return {email:ME.email,slug:SLUG,skill:k,n:by[k].n,d:by[k].d,completed_at:now};});

  function post(table,body,pref){
    return fetch(SUPA_URL+'/rest/v1/'+table,{method:'POST',
      headers:H({Prefer:pref||'return=minimal'}),body:JSON.stringify(body)});
  }
  post('activities?on_conflict=slug',act,'resolution=merge-duplicates,return=minimal')
    .then(function(){return post('activity_attempts',attempt);})
    .then(function(){return post('skill_attempts',skillRows);})
    .then(function(){$('saveMsg').innerHTML='<div class="msg ok">Your work was saved.</div>';})
    .catch(function(){$('saveMsg').innerHTML=
      '<div class="msg err">Your work did not save. Tell Mr. Toby.</div>';});
}
function again(){IDX=0;ANS=[];$('done').classList.add('hide');
  $('quiz').classList.remove('hide');$('saveMsg').innerHTML='';render();}
</script>
<script src="/readings/track.js"></script>

<script>
/* ============ Galileo standard: identity, directions, tap words, canary ============ */
(function(){
  /* some pages in this family define SLUG, some do not */
  var PAGE_SLUG=(typeof SLUG!=='undefined'&&SLUG)?SLUG:'grammar';
  var CANON_DOMAIN='@s.sfusd.edu', ROSTER=[];
  /* some pages in this repo never defined these */
  var SUPA_URL=(typeof window.SUPA_URL!=='undefined')?window.SUPA_URL:'https://lhmwtfyceilgndpygivj.supabase.co';
  var SUPA_KEY=(typeof window.SUPA_KEY!=='undefined')?window.SUPA_KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
  var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
  function ME_(){ return (typeof student!=='undefined'&&student&&student.email)?student:((window.ME&&ME.email)?ME:null); }
  window.cleanMail=function(x){ return String(x||'').trim().toLowerCase(); };
  window.localPart=function(e){ return cleanMail(e).split('@')[0]; };
  window.validMail=function(e){ return /^[^@\s]+@(s\.)?sfusd\.edu$/.test(cleanMail(e)); };
  window.canonMail=function(raw){
    var lp=localPart(raw), i;
    for(i=0;i<ROSTER.length;i++){ if(localPart(ROSTER[i].email)===lp) return cleanMail(ROSTER[i].email); }
    return lp+CANON_DOMAIN;
  };
  function head(pref){
    var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
    if(pref) h['Prefer']=pref; return h;
  }
  window.recordAlias=function(alias, canon){
    if(!alias||alias===canon) return;
    fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{
      method:'POST', headers:head('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{alias_email:alias, email:canon}])}).catch(function(){});
  };
  window.seedStudent=function(name,email,period){
    fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{
      method:'POST', headers:head('resolution=ignore-duplicates,return=minimal'),
      body:JSON.stringify([{email:email, name:name, period:period}])}).catch(function(){});
  };
  fetch(SUPA_URL+'/rest/v1/students?select=name,email,period&order=name',{headers:head()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ ROSTER=rows||[]; }).catch(function(){});

  /* prefill from a sign-in anywhere else on the site */
  try{
    var saved=JSON.parse(localStorage.getItem('grammar_student')||'null');
    if(saved&&saved.email){
      if(document.getElementById('inName')) document.getElementById('inName').value=saved.name||'';
      if(document.getElementById('inEmail')) document.getElementById('inEmail').value=saved.email;
      if(saved.period&&document.getElementById('inPeriod')) document.getElementById('inPeriod').value=String(saved.period);
    } else {
      var g=localStorage.getItem('gal_student_email');
      if(g&&document.getElementById('inEmail')) document.getElementById('inEmail').value=g;
    }
  }catch(e){}

  /* ---------- translate through the proxy ---------- */
  var tcache={};
  function tr(text, lang){
    var key=text+'|'+lang;
    if(tcache[key]) return Promise.resolve(tcache[key]);
    var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning=&lang='+encodeURIComponent(lang);
    return fetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      tcache[key]=d.translation; return d.translation;
    }).catch(function(){return null;});
  }

  /* ---------- directions in the student's language ---------- */
  var DIR_ON=false, SENT={};
  try{ DIR_ON=localStorage.getItem('song_dir')==='1'; }catch(e){}
  function logReveal(k, lang){
    if(!ME_()) return;
    var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    fetch(SUPA_URL+'/rest/v1/instruction_reveals',{
      method:'POST', headers:head('return=minimal'),
      body:JSON.stringify([{email:ME_().email, set_slug:PAGE_SLUG, activity:k, lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=document.getElementById('inLang').value;
    var list=document.querySelectorAll('[data-dir]');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||'';
      out.textContent='…';
      tr(en, lang).then(function(t){
        out.textContent=t?(t.equiv||t.meaning||''):'';
        if(out.textContent) logReveal(k, lang);
      });
    });
  }
  var dirBtn=document.getElementById('btn-dir');
  if(dirBtn){
    dirBtn.classList.toggle('on', DIR_ON);
    dirBtn.addEventListener('click',function(){
      DIR_ON=!DIR_ON;
      try{ localStorage.setItem('song_dir', DIR_ON?'1':'0'); }catch(e){}
      dirBtn.classList.toggle('on', DIR_ON);
      showDirections();
    });
  }
  var langSel=document.getElementById('inLang');
  if(langSel) langSel.addEventListener('change', function(){ if(DIR_ON) showDirections(); });
  if(DIR_ON) setTimeout(showDirections, 600);

  /* ---------- tap any word ---------- */
  var TAP_ON=false;
  try{ TAP_ON=localStorage.getItem('song_tap')==='1'; }catch(e){}
  function wrapWords(root){
    if(root.getAttribute('data-wrapped')) return;
    root.setAttribute('data-wrapped','1');
    var walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes=[], n;
    while((n=walker.nextNode())) if(n.nodeValue.trim()) nodes.push(n);
    nodes.forEach(function(node){
      if(node.parentNode.closest('textarea,input,button,select,.wt-tap')) return;
      var frag=document.createDocumentFragment();
      node.nodeValue.split(/(\s+)/).forEach(function(piece){
        if(!piece.trim()){ frag.appendChild(document.createTextNode(piece)); return; }
        var s=document.createElement('span');
        s.className='wt-tap'; s.textContent=piece;
        frag.appendChild(s);
      });
      node.parentNode.replaceChild(frag, node);
    });
  }
  function tapTargets(){ return document.querySelectorAll('[data-tap]'); }
  function setTap(on){
    TAP_ON=on;
    try{ localStorage.setItem('song_tap', on?'1':'0'); }catch(e){}
    document.body.classList.toggle('tap-on', on);
    var b=document.getElementById('btn-tap');
    if(b) b.classList.toggle('on', on);
    if(on) Array.prototype.forEach.call(tapTargets(), wrapWords);
  }
  var tapBtn=document.getElementById('btn-tap');
  if(tapBtn) tapBtn.addEventListener('click', function(){ setTap(!TAP_ON); });
  document.addEventListener('click', function(ev){
    if(!TAP_ON) return;
    var s=ev.target.closest('.wt-tap'); if(!s) return;
    var lang=document.getElementById('inLang').value;
    if(!lang){ document.getElementById('inLang').focus(); return; }
    var word=(s.textContent||'').replace(/[^A-Za-zÀ-ÿ'’-]/g,'');
    if(!word) return;
    var old=s.getAttribute('data-shown');
    if(old){ s.removeAttribute('data-shown'); var t=s.querySelector('.wt-bub'); if(t) t.remove(); return; }
    var bub=document.createElement('span'); bub.className='wt-bub'; bub.textContent='…';
    s.appendChild(bub); s.setAttribute('data-shown','1');
    tr(word, lang).then(function(t){ bub.textContent=t?(t.equiv||t.meaning||'?'):'?'; });
  });
  if(TAP_ON) setTimeout(function(){ setTap(true); }, 400);

  /* ---------- quiet browser-translation canary ---------- */
  var CANARY='the quick brown fox jumps over the lazy dog', TR_SENT='';
  function detectTranslation(){
    var c=document.querySelector('#canary');
    var got=c?(c.textContent||'').trim().toLowerCase():'';
    var cls=document.documentElement.className||'';
    var drift=(c&&got!==CANARY)?got:'';
    if(!drift&&!/translated|notranslate-off/.test(cls)) return null;
    return {observed:drift, html_lang:document.documentElement.lang||'', html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation();
    if(!d||!ME_()) return;
    var sig=d.observed+'|'+d.html_lang;
    if(sig===TR_SENT) return;
    TR_SENT=sig;
    fetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{
      method:'POST', headers:head('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:ME_().email, set_slug:PAGE_SLUG, translated:true,
        observed:d.observed, html_lang:d.html_lang, html_class:d.html_class,
        updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation, 20000);
  setTimeout(checkTranslation, 4000);
})();
</script>
