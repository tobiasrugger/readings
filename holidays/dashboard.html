id": "pk7", "pic": "w_neighbor", "o": ["neighbor", "ghost", "ancestor", "skeleton"], "hint": {"A": "This person lives next to you. 🏠🏠", "B": "A person who lives next to you."}}, {"t": "pick", "id": "pk8", "pic": "w_remember", "o": ["remember", "forget", "celebrate", "knock"], "hint": {"A": "She thinks about her grandmother. 💭", "B": "She thinks about a person from the past."}}]}]}, {"id": "halloween", "emoji": "🎃", "title": {"A": "Halloween", "B": "Reading A: Where Halloween came from"}, "art": "h_trick", "dir": {"A": "Read. Tap 🔊 to listen. Tap a word to see it in your language.", "B": "Read it once without stopping. Then read it again. Tap any word to hear it and see it in your language."}, "chunks": [{"title": {"A": "🔥 Long ago", "B": "Samhain"}, "scene": "h_samhain", "items": [{"t": "p", "text": {"A": "Long ago, people lived in Ireland 🇮🇪. On October 31 they had a holiday. It was called Samhain.", "B": "More than two thousand years ago, the Celtic people lived in Ireland, Scotland, and northern France. Their year ended on October 31. They called that night Samhain (say it: SAH-win). The Celts believed that on Samhain the door between the world of the living and the world of the dead opened, and spirits could walk on the earth for one night."}}, {"t": "p", "text": {"A": "They thought ghosts 👻 came back that night. They were afraid. 😨 So they made big fires 🔥. They wore masks 🎭. A ghost saw the mask and went away.", "B": "People were afraid, so they did two things. They lit huge bonfires on the hills, and they wore masks and animal skins. If a spirit saw a person in a mask, the spirit would think that person was another ghost and leave them alone. That is the oldest reason for Halloween costumes."}}, {"t": "mc", "id": "ha1", "q": {"A": "Why did people wear masks?", "B": "Why did the Celts wear masks on Samhain?"}, "o": [{"A": "So the ghosts went away.", "B": "So the spirits would think they were ghosts and leave them alone."}, {"A": "To go to school.", "B": "To win a prize."}, {"A": "Because it was cold.", "B": "Because it was very cold."}, {"A": "To eat candy.", "B": "To get candy."}], "hint": {"A": "Read the last sentence again. 🎭👻", "B": "Look at paragraph 2: what did the spirit think?"}}]}, {"title": {"A": "🚪 The name and the little cake", "B": "All Hallows' Eve"}, "pic": "w_knock", "items": [{"t": "p", "text": {"A": "Later, November 1 was a church day ⛪. The night before had a long name: All Hallows' Eve. People said it fast. It became Halloween!", "B": "Later the Catholic Church made November 1 All Saints' Day, a day to honor the holy dead, and November 2 All Souls' Day. The night before All Saints' Day was called All Hallows' Eve. Over hundreds of years, \"All Hallows' Eve\" wore down into one short word: Halloween."}}, {"t": "p", "text": {"A": "Poor people went to every door 🚪. They sang for the family's dead people. The family gave them a little cake 🍰. Children did it too. They told a joke 😄 and got food.", "B": "In England and Ireland, poor people walked from door to door on those days. They sang or prayed for the family's dead relatives, and the family gave them a small cake called a soul cake. This was called souling. In Scotland, children in costume went from house to house and performed a song, a poem, or a joke to get food or coins. This was called guising. Notice that the children had to do something first. The \"trick\" in \"trick or treat\" is what is left of that job."}}, {"t": "mc", "id": "ha2", "q": {"A": "Where does the word Halloween come from?", "B": "Where does the word \"Halloween\" come from?"}, "o": [{"A": "All Hallows' Eve, said fast", "B": "All Hallows' Eve, worn down into one word"}, {"A": "a kind of candy", "B": "the name of a candy company"}, {"A": "a ghost's name", "B": "the name of a famous ghost"}, {"A": "a pumpkin", "B": "an old word for pumpkin"}], "hint": {"A": "Read the first paragraph again.", "B": "Read the first paragraph of this part again."}}]}, {"title": {"A": "🚢 A new country", "B": "Coming to America"}, "pic": "h_turnip", "items": [{"t": "p", "text": {"A": "In 1845 the potatoes 🥔 in Ireland died. People were hungry. Many people moved to the United States 🇺🇸. They brought Halloween with them.", "B": "In the 1840s a disease destroyed the potato crop in Ireland. More than a million people died and more than a million left. Many came to the United States. They brought Halloween the way every immigrant brings holidays — folded up in the suitcase, next to the clothes."}}, {"t": "p", "text": {"A": "In Ireland, people cut faces in turnips. In America there were many pumpkins 🎃. Pumpkins are big and easy to cut. So people cut faces in pumpkins.", "B": "They also brought the story of Stingy Jack, a man who tricked the devil twice and then could not enter heaven or hell. He had to walk in the dark forever with one hot coal inside a carved turnip. In Ireland people carved ugly faces into turnips and beets and put them in the window. In America there were pumpkins everywhere, and pumpkins are big and soft and easy to cut. The jack-o'-lantern was born in a new country, like the people who made it."}}, {"t": "mc", "id": "ha3", "q": {"A": "Why did many Irish people move to the United States?", "B": "Why did more than a million people leave Ireland in the 1840s?"}, "o": [{"A": "They had no food.", "B": "The potato crop died and people were hungry."}, {"A": "They wanted pumpkins.", "B": "They wanted to grow pumpkins."}, {"A": "For a vacation.", "B": "They wanted a vacation."}, {"A": "To see ghosts.", "B": "They were afraid of ghosts."}], "hint": {"A": "Look for the word hungry. 🥔", "B": "What happened to the potatoes?"}}]}, {"title": {"A": "🍬 Halloween today", "B": "Halloween today"}, "scene": "h_trick", "items": [{"t": "p", "text": {"A": "Today, Halloween is a fun night. Children wear costumes 🧛. They knock on doors 🚪. They say \"Trick or treat!\" Neighbors give them candy 🍬.", "B": "Souling and guising slowly turned into trick-or-treating. The words \"trick or treat\" appeared in American newspapers in the 1920s and 1930s, and after 1945 the custom spread to almost every neighborhood in the country."}}, {"t": "p", "text": {"A": "It is not a religious day now. People laugh at ghosts and skeletons 💀, so they are not afraid.", "B": "Today Halloween in the United States is not a religious day. It is a night for costumes, candy, decorations, and scary movies, and Americans spend billions of dollars on it. But under the plastic skeletons the old idea is still there. At the end of October, when the nights get long and the leaves die, people think about the dead — and then they laugh at them, so they will not be afraid."}}]}, {"title": {"A": "✅ True or false?", "B": "True or false?"}, "items": [{"t": "tf", "id": "tfa1", "q": {"A": "Halloween started in the United States.", "B": "Halloween started in the United States."}, "a": false, "hint": {"A": "Where did people live long ago? 🇮🇪", "B": "Read the first part again: where did Samhain start?"}}, {"t": "tf", "id": "tfa2", "q": {"A": "People wore masks to hide from ghosts.", "B": "People first wore masks to hide from spirits."}, "a": true, "hint": {"A": "Look at part 1. 🎭", "B": "Look at part 1 again."}}, {"t": "tf", "id": "tfa3", "q": {"A": "In Ireland, people cut faces in pumpkins.", "B": "The first jack-o'-lanterns were pumpkins."}, "a": false, "hint": {"A": "What did they cut in Ireland?", "B": "What did people carve in Ireland?"}}, {"t": "tf", "id": "tfa4", "q": {"A": "Irish people brought Halloween to the United States.", "B": "Irish immigrants brought Halloween to the United States."}, "a": true, "hint": {"A": "Look at part 3. 🚢", "B": "Look at part 3 again."}}, {"t": "tf", "id": "tfa5", "q": {"A": "Today Halloween is a church day.", "B": "Today Halloween in the United States is mostly a religious day."}, "a": false, "hint": {"A": "Read part 4 again.", "B": "Read the last part again."}}]}]}, {"id": "muertos", "emoji": "💀", "title": {"A": "Día de los Muertos", "B": "Reading B: Día de los Muertos"}, "art": "h_ofrenda", "dir": {"A": "Read. Tap 🔊 to listen. Tap a word to see it in your language.", "B": "Same job: read once, then read again. Tap any word to hear it and see it in your language."}, "chunks": [{"title": {"A": "📅 Two days", "B": "Two days, two histories"}, "pic": "h_aztec", "items": [{"t": "p", "text": {"A": "Día de los Muertos means Day of the Dead. It is in Mexico 🇲🇽. It is on November 1 and November 2. People remember their family who died.", "B": "Día de los Muertos means \"Day of the Dead.\" It is not one day. It is November 1 and November 2 — and in many families the work starts weeks before."}}, {"t": "p", "text": {"A": "It comes from two old traditions: the first people of Mexico, and the Spanish church ⛪. They became one holiday.", "B": "The holiday is a mix of two histories. For thousands of years, Indigenous peoples in Mexico — the Nahua, the Purépecha, the Maya, the Zapotec and others — kept the bones and the memory of their ancestors close, and held a festival for the dead. When the Spanish came in the 1500s, they brought All Saints' Day and All Souls' Day with them. The two traditions did not replace each other. They grew together, like two trees planted in one hole."}}, {"t": "mc", "id": "mu1", "q": {"A": "How many days is Día de los Muertos?", "B": "When is Día de los Muertos?"}, "o": [{"A": "two days", "B": "November 1 and November 2"}, {"A": "one day", "B": "only October 31"}, {"A": "one week", "B": "the whole month of October"}, {"A": "one hour", "B": "one night in December"}], "hint": {"A": "Look for the numbers 1 and 2.", "B": "Read the first paragraph again."}}]}, {"title": {"A": "🕯️ The ofrenda", "B": "The ofrenda"}, "scene": "h_ofrenda", "items": [{"t": "p", "text": {"A": "Families build an altar in the house. It is called an ofrenda. They put photos 🖼️ of the dead person on it.", "B": "The center of the holiday is the ofrenda, the altar a family builds inside the house. It has levels, like steps. The family puts photographs of the people who died on it, and then the things those people loved: a favorite food, a bottle of soda, a guitar, a baseball, a pack of cigarettes."}}, {"t": "p", "text": {"A": "They put the person's favorite food 🍲. They put water 💧, because the spirit is thirsty. They put candles 🕯️. The candles show the way home.", "B": "There is water, because the spirit is thirsty after a long walk. There is salt. There are candles, one for each soul, to show the way."}}, {"t": "p", "text": {"A": "They put many orange flowers 🌼. In English they are marigolds. They smell strong. People say the dead follow the smell home.", "B": "And there are flowers — cempasúchil, the orange marigold. Families make a path of orange petals from the street to the altar. The color is loud and the smell is strong, and people say the dead follow it home."}}, {"t": "mc", "id": "mu2", "q": {"A": "Why is there water on the ofrenda?", "B": "Why do families put water on the ofrenda?"}, "o": [{"A": "The spirit is thirsty.", "B": "The spirit is thirsty after a long walk."}, {"A": "For the flowers.", "B": "To keep the flowers alive."}, {"A": "To clean the photo.", "B": "To clean the photographs."}, {"A": "For the cat.", "B": "For the family's pets."}], "hint": {"A": "Look for the word thirsty. 💧", "B": "Read the second paragraph of this part again."}}]}, {"title": {"A": "🍞 Bread and sugar skulls", "B": "Food and paper"}, "pic": "h_pan", "items": [{"t": "p", "text": {"A": "They eat a sweet bread. It is called pan de muerto 🍞. They make skulls from sugar 💀. They write a name on the skull.", "B": "The food is part of the language of the day: pan de muerto, a sweet bread with bones of dough on top, and sugar skulls with a name written on the forehead — sometimes the name of a living friend, as a joke. Papel picado, cut paper flags, move in the air above the table; people say the movement means the spirits are already in the room."}}]}, {"title": {"A": "🪦 At the cemetery", "B": "At the cemetery"}, "scene": "h_cemetery", "items": [{"t": "p", "text": {"A": "November 1 is for children who died. November 2 is for adults. Families go to the cemetery. They clean the grave. They put flowers on it.", "B": "November 1 is for the children who died. People call them angelitos, little angels. November 2 is for the adults. Families go to the cemetery, clean the graves, pull the weeds, paint the stone, put down flowers — and then they stay. They eat there. They play music. They tell stories about the dead person, including the embarrassing ones, and they laugh."}}, {"t": "p", "text": {"A": "Then they stay all night 🌙. They eat. They play music 🎶. They tell funny stories 😄. The day is not sad. It is a welcome.", "B": "This is the part that surprises visitors: it is not a sad day. The sadness is real, but the holiday is a welcome, not a funeral. Mexicans often say a person dies three times — when the body stops, when the body is buried, and when the last person says their name for the last time. Día de los Muertos exists to push that third death far away."}}, {"t": "p", "text": {"A": "Día de los Muertos is not \"Mexican Halloween.\" They are two different holidays.", "B": "It is also not \"Mexican Halloween.\" The dates are close and both have skeletons, but the two holidays came from different places and do different work. One says be afraid and then laugh. The other says come home, we cooked for you."}}, {"t": "mc", "id": "mu3", "q": {"A": "At the cemetery, families are…", "B": "How do families act at the cemetery?"}, "o": [{"A": "happy — they eat, sing, and tell stories", "B": "They stay, eat, play music, and laugh at stories."}, {"A": "quiet and afraid", "B": "They are quiet and afraid of ghosts."}, {"A": "there for five minutes", "B": "They leave after five minutes."}, {"A": "wearing Halloween costumes", "B": "They wear Halloween costumes."}], "hint": {"A": "Read the second paragraph again. 🎶", "B": "What do they do after they clean the graves?"}}]}, {"title": {"A": "✅ True or false?", "B": "True or false?"}, "items": [{"t": "tf", "id": "tfb1", "q": {"A": "Día de los Muertos is one day.", "B": "Día de los Muertos is only one day."}, "a": false, "hint": {"A": "Count the days. 1, 2…", "B": "Look at the dates again."}}, {"t": "tf", "id": "tfb2", "q": {"A": "Families put water on the altar for the spirit.", "B": "Families put water on the altar because the spirit is thirsty."}, "a": true, "hint": {"A": "Look at the ofrenda part. 💧", "B": "Read the ofrenda part again."}}, {"t": "tf", "id": "tfb3", "q": {"A": "Marigolds help the dead find the house.", "B": "Marigolds help the dead find the house."}, "a": true, "hint": {"A": "What do the dead follow? 🌼", "B": "What do the dead follow home?"}}, {"t": "tf", "id": "tfb4", "q": {"A": "Families are sad and quiet at the cemetery.", "B": "Families are quiet and sad at the cemetery."}, "a": false, "hint": {"A": "Do they play music? 🎶", "B": "Read the cemetery part again."}}, {"t": "tf", "id": "tfb5", "q": {"A": "The holiday comes from Mexico and from Spain.", "B": "The holiday comes from Indigenous Mexican traditions and Catholic traditions together."}, "a": true, "hint": {"A": "Look at part 1.", "B": "Read the first part again."}}]}]}, {"id": "origins", "emoji": "🏛️", "title": {"A": "Where it came from", "B": "Where Día de los Muertos came from"}, "art": "h_aztec", "dir": {"A": "Guess first. Then read. Then check your guess.", "B": "Make a guess first. Then read, find the evidence, and decide if your guess was right."}, "chunks": [{"title": {"A": "🤔 Guess first", "B": "Make a claim"}, "pic": "h_mix", "items": [{"t": "p", "text": {"A": "Long ago, the Spanish came to Mexico. They were Catholic ⛪. The people of Mexico had their own holiday for the dead. The two holidays mixed.", "B": "The Day of the Dead mixes an indigenous tradition with a Catholic one. The Spanish conquerors were Catholic."}}, {"t": "chips", "id": "or_claimpick", "q": {"A": "Guess: were the Spanish happy 😀 or angry 😠 about the mix?", "B": "Guess: were the conquerors happy or angry that the two traditions mixed?"}, "o": ["😀 happy", "😠 angry", "🤷 not sure"]}, {"t": "write", "id": "or_claim1", "q": {"A": "Why? Write one sentence.", "B": "Say why."}, "frame": {"A": "I think they were ___ because ___.", "B": "I think the conquerors were ______ because ______."}, "min": 4, "rows": 2}]}, {"title": {"A": "🏠 Long ago in Mexico", "B": "Before the Spanish came"}, "pic": "h_houses", "items": [{"t": "p", "text": {"A": "Long ago, the people of Mexico did not have cemeteries. They put the dead under their houses 🏠. The dead stayed close. This allowed for their veneration.", "B": "Most Mesoamerican peoples shared one idea about death. They did not have cemeteries the way we do now. Instead, they buried the dead directly under their homes. This kept the dead close and allowed for their veneration."}}, {"t": "p", "text": {"A": "The tombs were open. Families visited the dead often. They gave them gifts 🎁.", "B": "Because tombs were not sealed, people often visited the dead and regularly gave them offerings."}}, {"t": "mc", "id": "or_ven", "q": {"A": "Guess from the reading: veneration means…", "B": "Use context clues — do not translate. Veneration probably means…"}, "o": [{"A": "respect and honor ❤️", "B": "great respect and honor"}, {"A": "fear 😨", "B": "great fear"}, {"A": "cooking 🍲", "B": "cooking for the family"}, {"A": "forgetting", "B": "forgetting about someone"}], "hint": {"A": "The dead stayed close. Families visited and gave gifts. Is that love or fear?", "B": "The dead were kept close and given offerings. What feeling does that show?"}}, {"t": "mc", "id": "or_tomb", "q": {"A": "Guess: a tomb is…", "B": "Use context clues. A tomb is probably…"}, "o": [{"A": "a place for a dead body", "B": "a place where a dead body is kept"}, {"A": "a kitchen", "B": "a kitchen"}, {"A": "a school", "B": "a school"}, {"A": "a river", "B": "a river"}], "hint": {"A": "What is under the house?", "B": "What were the families visiting?"}}]}, {"title": {"A": "✨ Three souls", "B": "Three souls"}, "pic": "h_souls", "items": [{"t": "p", "text": {"A": "The Aztecs believed a person had three souls. A soul could go far away. Or it could stay and help the family 👨‍👩‍👧.", "B": "The Aztecs, one major group of Mesoamericans, believed that a person had three souls. Each soul could travel to an afterlife far away, or it could stay behind on Earth and give strength to its family. Part of a person could go, and part could stay to watch over the people they loved."}}, {"t": "p", "text": {"A": "The Aztecs left food for the dead 🍲. They burned incense. They made ofrendas. People still do these things today!", "B": "The Aztecs built many rituals to honor the souls who stayed. Many of them, such as leaving food for a dead relative, burning incense, and making an ofrenda, are still part of the Day of the Dead today."}}, {"t": "mc", "id": "or_souls", "q": {"A": "How many souls did the Aztecs believe a person has?", "B": "According to the Aztecs, how many souls does a person have?"}, "o": [{"A": "three", "B": "three"}, {"A": "one", "B": "one"}, {"A": "two", "B": "two"}, {"A": "ten", "B": "ten"}], "hint": {"A": "Look at the first sentence.", "B": "Read the first sentence again."}}]}, {"title": {"A": "⛪ + 🏛️ The mix", "B": "Mestizaje — mixing"}, "pic": "h_mix", "items": [{"t": "p", "text": {"A": "Then the Spanish came. They had two church days for the dead: November 1 and November 2. They told the people of Mexico: do your holiday on the same days. The two holidays mixed. In Spanish, mixing is called mestizaje.", "B": "The Spanish encouraged the indigenous peoples to practice their rituals for the dead on the same days as the Catholic holidays All Saints' Day and All Souls' Day, November 1 and 2. Through this, and in other ways, the two religions mixed, and the mixture became the rituals and pictures we see on the Day of the Dead. It is still changing today."}}, {"t": "mc", "id": "ev1", "q": {"A": "Which sentence shows what the Spanish wanted?", "B": "Which sentence is the best evidence for what the Spanish wanted?"}, "o": [{"A": "\"Do your holiday on the same days.\"", "B": "\"The Spanish encouraged the indigenous peoples to practice their rituals for the dead on the same days as the Catholic holidays.\""}, {"A": "\"They put the dead under their houses.\"", "B": "\"They buried the dead directly under their homes.\""}, {"A": "\"A person had three souls.\"", "B": "\"A person had three souls.\""}, {"A": "\"People still do these things today.\"", "B": "\"It is still changing today.\""}], "hint": {"A": "Which sentence talks about the Spanish? ⛪", "B": "Which sentence says what the Spanish did?"}}, {"t": "write", "id": "or_claim2", "q": {"A": "Look at your guess. Do you change it?", "B": "Look at your first claim. Do you still think the same thing? Why or why not?"}, "frame": {"A": "Now I think the Spanish were ___ because ___.", "B": "In my own words: ______. Now I think ______ because ______."}, "min": 5, "rows": 3}]}, {"title": {"A": "🇲🇽 Spanish words inside English", "B": "Spanish words inside English"}, "items": [{"t": "match", "id": "sp", "q": "", "hint": {"A": "Look at the readings again.", "B": "Look back at the readings."}, "pairs": [[{"A": "an offering on a table", "B": "an offering"}, "ofrenda"], [{"A": "the orange flower", "B": "flower of the dead (the marigold)"}, "flor de muertos"], [{"A": "cut paper flags", "B": "cut tissue-paper art"}, "papel picado"], [{"A": "the sweet bread", "B": "the special sweet bread"}, "pan de muerto"], [{"A": "mixing two cultures", "B": "the mixing of two cultures"}, "mestizaje"]]}]}]}, {"id": "compare", "emoji": "⚖️", "title": {"A": "Same and different", "B": "Put the two holidays side by side"}, "art": "h_venn", "dir": {"A": "Tap a card. Then tap Halloween, Both, or Día de los Muertos.", "B": "Sort each fact: Halloween only, both holidays, or Día de los Muertos only."}, "chunks": [{"title": {"A": "🎃 or 💀 or both?", "B": "Sort the facts"}, "pic": "h_venn", "items": [{"t": "sort", "id": "vn", "buckets": [{"A": "🎃 Halloween", "B": "Halloween only"}, {"A": "🎃💀 Both", "B": "Both"}, {"A": "💀 Día de los Muertos", "B": "Día de los Muertos only"}], "hint": {"A": "Read the card again. Is it October 31, November 1 and 2, or both? 📅", "B": "Think: only Halloween, only Día de los Muertos, or both?"}, "items": [[{"A": "October 31", "B": "on October 31"}, 0], [{"A": "November 1 and 2", "B": "on November 1 and 2"}, 2], [{"A": "skeletons and skulls 💀", "B": "skeletons and skulls"}, 1], [{"A": "candy at the door 🍬", "B": "children get candy at the door"}, 0], [{"A": "an ofrenda in the house", "B": "an ofrenda in the house"}, 2], [{"A": "marigolds 🌼", "B": "marigolds lead the dead home"}, 2], [{"A": "costumes 🎭", "B": "costumes and masks"}, 0], [{"A": "people think about the dead", "B": "people think about the dead"}, 1], [{"A": "it started long ago", "B": "it is more than 500 years old"}, 1], [{"A": "pumpkins 🎃", "B": "jack-o'-lanterns"}, 0]]}]}, {"title": {"A": "✍️ Your idea", "B": "Is it \"Mexican Halloween\"?"}, "pic": "h_grammar", "items": [{"t": "write", "id": "q_notmexhall", "q": {"A": "Is Día de los Muertos \"Mexican Halloween\"?", "B": "Some people call Día de los Muertos \"Mexican Halloween.\" Is that right? Use both and but."}, "frame": {"A": "No, because Halloween is ___, but Día de los Muertos is ___.", "B": "Both holidays ______, but ______."}, "bank": {"A": ["both", "but", "happy", "scary", "family", "candy", "November"], "B": ["both", "but", "while", "however", "similar to", "different from"]}, "min": 8, "rows": 3}]}]}, {"id": "world1", "emoji": "🌏", "title": {"A": "Around the world 1", "B": "Around the world: Asia"}, "art": "h_globe", "dir": {"A": "Read each card. Answer one question.", "B": "Almost every country has a day for the dead. Read each card, then answer its question."}, "chunks": [{"title": {"A": "Qingming · China 🇨🇳", "B": "Qingming — China 🇨🇳"}, "pic": "c_china", "items": [{"t": "p", "text": {"A": "In April, families go to the cemetery. They clean the graves 🧹. They bring food and tea. They burn paper money 💵 for the ancestors.", "B": "In early April, families go to the cemetery for Qingming — Tomb-Sweeping Day. They sweep the stone, pull the weeds, and set out food, tea, and rice wine. Then they burn paper money and paper houses so the ancestors have what they need on the other side. In the seventh lunar month, the gates open for the Hungry Ghost Festival, and people leave food outside for spirits who have no family left."}}, {"t": "mc", "id": "wc1", "q": {"A": "What do they burn for the ancestors?", "B": "What do families burn at Qingming, and why?"}, "o": [{"A": "paper money", "B": "paper money and paper houses, so the ancestors have what they need"}, {"A": "pumpkins", "B": "pumpkins, to scare the ghosts"}, {"A": "marigolds", "B": "marigolds, to show the way"}, {"A": "candy", "B": "candy, for the children"}], "hint": {"A": "Read the last sentence. 💵", "B": "Read the third sentence again."}}]}, {"title": {"A": "Đám giỗ and Vu Lan · Vietnam 🇻🇳", "B": "Đám giỗ and Vu Lan — Vietnam 🇻🇳"}, "pic": "c_vietnam", "items": [{"t": "p", "text": {"A": "Many homes have an ancestor altar. It has photos, fruit 🍊, and incense. On the day a person died, the family cooks their favorite food and eats together.", "B": "Most Vietnamese homes have a bàn thờ — an ancestor altar with photographs, fruit, and incense. On the death anniversary, đám giỗ, the family cooks the dead person's favorite dishes, invites every relative, and eats together in front of the altar. During Vu Lan, in the seventh lunar month, people burn paper clothes and give rice porridge to wandering souls."}}, {"t": "mc", "id": "wc2", "q": {"A": "What does the family do on đám giỗ?", "B": "What happens on đám giỗ?"}, "o": [{"A": "cook the person's favorite food", "B": "The family cooks the dead person's favorite dishes and eats together."}, {"A": "go trick-or-treating", "B": "Children go trick-or-treating."}, {"A": "fly a big kite", "B": "They fly a giant kite."}, {"A": "walk a cow", "B": "They walk a cow through the street."}], "hint": {"A": "Look for the word cooks. 🍲", "B": "Read the second sentence again."}}]}, {"title": {"A": "Obon · Japan 🇯🇵", "B": "Obon — Japan 🇯🇵"}, "pic": "c_japan", "items": [{"t": "p", "text": {"A": "In August, families clean the grave. They hang lanterns 🏮 to help the spirits come home. People dance in a circle 💃.", "B": "In August, families clean the family grave and hang lanterns to guide the spirits home. In the town square people dance bon odori in a circle. At the end of Obon, they float paper lanterns down a river — tōrō nagashi — to walk the spirits back out again."}}, {"t": "mc", "id": "wc3", "q": {"A": "Where do people dance?", "B": "How do people dance bon odori?"}, "o": [{"A": "in a circle", "B": "in a circle, in the town square"}, {"A": "in the cemetery", "B": "alone, in the cemetery"}, {"A": "on a boat", "B": "on a boat"}, {"A": "at school", "B": "in a line, at school"}], "hint": {"A": "Read the last sentence. 💃", "B": "Read the second sentence again."}}]}, {"title": {"A": "Chuseok · Korea 🇰🇷", "B": "Chuseok — Korea 🇰🇷"}, "pic": "c_korea", "items": [{"t": "p", "text": {"A": "At harvest time, families go home. They cut the grass on the graves. They set a table with rice, fruit, and fish for the ancestors. Then they eat rice cakes.", "B": "Chuseok comes at the harvest moon in September or October. Families travel home, cut the grass on their ancestors' graves, and set a table with the first rice, fruit, and fish of the year for the ancestors. This is called charye. Then everyone eats songpyeon — small rice cakes shaped like a half moon."}}, {"t": "mc", "id": "wc4", "q": {"A": "What do families do at the graves?", "B": "What do families do at their ancestors' graves on Chuseok?"}, "o": [{"A": "cut the grass", "B": "They cut the grass."}, {"A": "fly kites", "B": "They fly kites."}, {"A": "dance", "B": "They dance in a circle."}, {"A": "burn paper houses", "B": "They burn paper houses."}], "hint": {"A": "Read the second sentence. ✂️🌿", "B": "Read the second sentence again."}}]}, {"title": {"A": "Phi Ta Khon · Thailand 🇹🇭", "B": "Phi Ta Khon — Thailand 🇹🇭"}, "pic": "c_thailand", "items": [{"t": "p", "text": {"A": "In September, families bring food to the temple for their ancestors. In one town, young people wear tall masks 🎭. They dance and joke like ghosts.", "B": "In September, families carry food to the temple for their ancestors on Sat Thai, and make krayasat — a sticky sweet of rice, sesame, and peanuts. In the town of Dan Sai, the Phi Ta Khon festival fills the street with young people in tall painted masks made from rice steamers and coconut leaves. They dance and joke as the ghosts."}}, {"t": "mc", "id": "wc5", "q": {"A": "Where do families bring food?", "B": "Where do families carry food on Sat Thai?"}, "o": [{"A": "to the temple", "B": "to the temple"}, {"A": "to the river", "B": "to the river"}, {"A": "to school", "B": "to school"}, {"A": "to the beach", "B": "to the beach"}], "hint": {"A": "Read the first sentence. 🛕", "B": "Read the first sentence again."}}]}, {"title": {"A": "Undás · Philippines 🇵🇭", "B": "Undás — Philippines 🇵🇭"}, "pic": "c_philippines", "items": [{"t": "p", "text": {"A": "On November 1, families go to the cemetery. They bring food, chairs, and games 🃏. They stay all day and all night.", "B": "On November 1, families come to the cemetery with food, chairs, card games, and sometimes a tent, and stay the whole day and night with their dead. In some provinces an old custom called pangangaluluwa sends children to sing at the door in the voice of the souls, and the neighbors give them food or coins."}}, {"t": "mc", "id": "wc6", "q": {"A": "How long do families stay?", "B": "How long do families stay at the cemetery on Undás?"}, "o": [{"A": "all day and all night", "B": "the whole day and night"}, {"A": "five minutes", "B": "five minutes"}, {"A": "one hour", "B": "one hour"}, {"A": "one week", "B": "one week"}], "hint": {"A": "Read the last sentence. 🌙", "B": "Read the first sentence again."}}]}, {"title": {"A": "Gai Jatra · Nepal 🇳🇵", "B": "Gai Jatra — Nepal 🇳🇵"}, "pic": "c_nepal", "items": [{"t": "p", "text": {"A": "In August, families who lost someone walk a cow 🐄 in the street. Children wear costumes. The day is full of jokes 😄.", "B": "At Gai Jatra in August, every family that lost someone during the year walks a cow through the street, because the cow leads the soul. Children dress in costumes, and the whole day is full of comedy and jokes — the joke is the medicine. During Tihar, children go house to house singing Deusi and Bhailo, and every neighbor gives them sweets, fruit, and money."}}, {"t": "mc", "id": "wc7", "q": {"A": "Why do families walk a cow?", "B": "Why do families walk a cow at Gai Jatra?"}, "o": [{"A": "The cow leads the soul.", "B": "because the cow leads the soul"}, {"A": "The cow is hungry.", "B": "because the cow is hungry"}, {"A": "To sell it.", "B": "to sell it at the market"}, {"A": "For milk.", "B": "to get milk"}], "hint": {"A": "Look for the word because.", "B": "Look for the word because."}}]}]}, {"id": "world2", "emoji": "🌍", "title": {"A": "Around the world 2", "B": "Around the world: more countries"}, "art": "c_guatemala", "dir": {"A": "Read each card. Answer one question.", "B": "Read each card, then answer its question. Then write a card about your own country."}, "chunks": [{"title": {"A": "Pitru Paksha · India and Nepal 🇮🇳🇳🇵", "B": "Pitru Paksha — India and Nepal 🇮🇳🇳🇵"}, "pic": "c_india", "items": [{"t": "p", "text": {"A": "For sixteen days, Hindu families honor their ancestors. They give rice balls and water. They put food outside for the crows 🐦‍⬛.", "B": "For sixteen days in September or October, Hindu families honor their ancestors with offerings of rice balls, water, and sesame seeds. Many families cook the dead person's favorite food and put it outside for the crows, because people say crows carry the food to the ancestors. In Nepal, these days are called Sorha Shraddha."}}, {"t": "mc", "id": "wc8", "q": {"A": "How many days is Pitru Paksha?", "B": "How long does Pitru Paksha last?"}, "o": [{"A": "sixteen days", "B": "sixteen days"}, {"A": "one day", "B": "one day"}, {"A": "two days", "B": "two days"}, {"A": "one month", "B": "one month"}], "hint": {"A": "Read the first sentence. 🔢", "B": "Read the first sentence again."}}]}, {"title": {"A": "Shab-e-Barat · Pakistan 🇵🇰", "B": "Shab-e-Barat — Pakistan 🇵🇰"}, "pic": "c_pakistan", "items": [{"t": "p", "text": {"A": "On the Night of Forgiveness, many Muslim families visit graves and pray 🙏. At home they make sweets and share them with neighbors.", "B": "On the night of Shab-e-Barat, the Night of Forgiveness, many Muslim families in South Asia visit the graves of their relatives and pray for them. At home they cook halwa and other sweets and share them with neighbors and people who are poor. In many cities, children light candles and small fireworks."}}, {"t": "mc", "id": "wc9", "q": {"A": "Who do families share sweets with?", "B": "Who do families share halwa with?"}, "o": [{"A": "neighbors and poor people", "B": "neighbors and people who are poor"}, {"A": "only their cat", "B": "only their pets"}, {"A": "nobody", "B": "nobody — they eat it all"}, {"A": "the teacher", "B": "their teachers"}], "hint": {"A": "Read the second sentence. 🍮", "B": "Read the second sentence again."}}]}, {"title": {"A": "Eid and Garangao · Arab and Muslim countries 🌙", "B": "Eid and Garangao — Arab and Muslim countries 🌙"}, "pic": "c_qatar", "items": [{"t": "p", "text": {"A": "On Eid morning, many families go to the graves to pray. Children wear new clothes and get money and sweets. In Qatar, children go door to door with bags 🛍️.", "B": "On the morning of Eid, many families go first to the graves to pray for their dead, and then home to eat. Children wear new clothes and collect eidiya — money — and sweets from every adult they visit. In Qatar, Bahrain, Kuwait, and Oman, children go door to door in the middle of Ramadan on Garangao night with cloth bags, singing, and come home full of candy and nuts."}}, {"t": "mc", "id": "wc10", "q": {"A": "What do children get on Eid?", "B": "What is eidiya?"}, "o": [{"A": "money and sweets", "B": "money that children collect, with sweets"}, {"A": "pumpkins", "B": "a kind of pumpkin"}, {"A": "a cow", "B": "a cow costume"}, {"A": "a kite", "B": "a giant kite"}], "hint": {"A": "Read the second sentence. 💵🍬", "B": "Read the second sentence again."}}]}, {"title": {"A": "Radonitsa · Russia and Ukraine 🇷🇺🇺🇦", "B": "Radonitsa — Russia and Ukraine 🇷🇺🇺🇦"}, "pic": "c_russia", "items": [{"t": "p", "text": {"A": "After Easter, families go to the cemetery. They bring painted eggs 🥚 and sweet bread. They eat next to the grave.", "B": "Nine days after Orthodox Easter, families go to the cemetery with painted eggs and sweet Easter bread. They clean the grave, say \"Christ is risen\" to the dead, and eat a small meal next to them. Before they go home, they leave an egg or some bread on the grave. Radonitsa comes from the word for joy."}}, {"t": "mc", "id": "wc11", "q": {"A": "What do they leave on the grave?", "B": "What do families leave on the grave before they go home?"}, "o": [{"A": "an egg or some bread", "B": "an egg or some bread"}, {"A": "a pumpkin", "B": "a carved pumpkin"}, {"A": "a kite", "B": "a kite"}, {"A": "candy", "B": "a bag of candy"}], "hint": {"A": "Look for the word leave.", "B": "Read the fourth sentence again."}}]}, {"title": {"A": "Giant kites · Guatemala 🇬🇹", "B": "Giant kites — Guatemala 🇬🇹"}, "pic": "c_guatemala", "items": [{"t": "p", "text": {"A": "On November 1, people fly giant kites 🪁 in the cemetery. The kites carry messages to the dead.", "B": "On November 1 in Sumpango and Santiago Sacatepéquez, people spend months building barriletes gigantes — kites of paper and bamboo up to twenty meters across, pain     h+="<tr><td class='nm' data-i='"+ROWS.indexOf(r)+"'>"+esc(r.name)+(r.egg?" 🦁":"")+"</td><td>"+esc(r.period)+"</td><td class='g'>"+grade04(s)+"</td><td>"+s.ok+" / "+s.max+"</td><td>"+(s.ok?Math.round(100*s.first/s.ok):0)+"%</td><td>"+s.miss+"</td>";
    U.screens.forEach(function(sc){ var p=scrProg(r,sc.id); var c=p[1]&&p[0]>=p[1]?"s2":(p[0]?"s1":"s0"); h+="<td><span class='sc "+c+"'>"+p[0]+"/"+p[1]+"</span></td>"; });
    h+="<td>"+(r.lvl||"A")+"</td><td>"+(r.submitted?"✓":"")+"</td><td>"+esc(String(r.updated||"").slice(5,16).replace("T"," "))+"</td></tr>";
  });
  document.getElementById("roster").innerHTML=h+"</tbody></table>";
}
function optText(it,k){ if(it.t==="tf") return k===0?"True":"False"; if(!it.o) return String(k); var o=it.o[k]; return typeof o==="string"?o:strip(L(o)); }
function openStu(r){
  var s=stats(r), h="<button type='button' id='pclose' style='float:right;font-weight:900;border:2px solid #23202e;border-radius:10px;padding:5px 12px;background:#fff;cursor:pointer'>Close</button>";
  h+="<h2 style='margin:0;color:var(--acc)'>"+esc(r.name)+"</h2><p>"+esc(r.email)+" · period "+esc(r.period)+" · "+s.ok+"/"+s.max+" · grade "+grade04(s)+" · first try "+s.first+" · misses "+s.miss+(r.egg?" · found Leo 🦁":"")+"</p>";
  U.screens.forEach(function(sc,i){
    h+="<h3>"+(i+1)+" "+sc.emoji+" "+esc(strip(L(sc.title)))+"</h3>";
    WR.filter(function(w){return w.s===sc.id;}).forEach(function(w){ var v=r.v2.w[w.id]; if(Array.isArray(v)) v="Fears: "+v.slice().sort(function(a,b){return a-b;}).join(", "); h+="<div class='it'><b>"+esc(w.q)+"</b><div class='wr'>"+(v?esc(v):"<span class='no'>(blank)</span>")+"</div></div>"; });
    ITEMS.filter(function(x){return x.s===sc.id;}).forEach(function(it){
      var a=r.v2.ans[it.id]; var st=!a?"<span class='no'>not yet</span>":(a.ok?(a.tries?"<span class='late'>✓ after "+a.tries+" miss"+(a.tries>1?"es":"")+"</span>":"<span class='ok'>✓ first try</span>"):"<span class='no'>"+a.tries+" miss"+(a.tries>1?"es":"")+", not yet</span>");
      var ms=a&&a.miss&&a.miss.length?" <span class='miss'>chose: "+a.miss.map(function(k){ return esc(typeof k==="number"?optText(it,k):k); }).join(" · ")+"</span>":"";
      h+="<div class='it'>"+esc(it.q)+" — "+st+ms+"</div>";
    });
    var chips=[]; sc.chunks.forEach(function(c){ (c.items||[]).forEach(function(it){ if(it.t==="chips"){ var v=r.v2.w[it.id]; if(v!=null){ var t=Array.isArray(v)?v.map(function(k){return L(it.o[k]);}).join(", "):L(it.o[v]); chips.push("<b>"+esc(strip(L(it.q)))+"</b> "+esc(t)); } } }); });
    if(chips.length) h+="<div class='it'>"+chips.join("<br>")+"</div>";
  });
  var ex=r.v2.extra||{};
  if(ex.of){ h+="<h3>🕯️ Ofrenda</h3><div class='it'>For: <b>"+esc(ex.of.who)+"</b><br>Things: "+esc((ex.of.slots||[]).filter(Boolean).join(", "))+"<div class='wr'>"+esc(ex.of.why||"")+"</div></div>"; }
  if(ex.drawing) h+="<h3>🎨 Drawing</h3><img alt='student drawing' src='"+ex.drawing+"' style='width:240px;border:2px solid #23202e;border-radius:10px'>";
  if(ex.ws_best) h+="<div class='it'>🔎 Word search: "+ex.ws_best+" words found</div>";
  var rec=(r.v2.extra||{}).rec||{}, rk=Object.keys(rec);
  if(rk.length){ h+="<h3>🎙️ Said the words aloud</h3><div class='it'>"+rk.map(function(w){ var x=rec[w]; return (x.ok?"<span class='ok'>✓</span> ":"<span class='no'>…</span> ")+"<b>"+esc(w)+"</b>"+(x.heard?" <span class='miss' style='color:#5b5870'>heard “"+esc(x.heard)+"”</span>":"")+" · "+x.tries+" tr"+(x.tries>1?"ies":"y"); }).join("<br>")+"</div>"; }
  if(r.v1){ h+="<h3>Earlier version (before the screens)</h3>"; for(var k in r.v1){ if(String(r.v1[k]).length>25) h+="<div class='it'><b>"+esc(k)+"</b><div class='wr'>"+esc(r.v1[k])+"</div></div>"; } }
  document.getElementById("pin").innerHTML=h; document.getElementById("panel").style.display="block";
  document.getElementById("pclose").onclick=function(){ document.getElementById("panel").style.display="none"; };
}
function bar(l,n,t){ var p=t?Math.round(100*n/t):0; return "<div class='crow'><span>"+esc(l)+"</span><span class='cb'><span style='width:"+p+"%'></span></span><span>"+n+"</span></div>"; }
function renderClass(){
  var rs=vis(), h="<h2 style='margin-top:0'>Class view — "+rs.length+" students</h2>";
  U.screens.forEach(function(sc){ sc.chunks.forEach(function(c){ (c.items||[]).forEach(function(it){
    if(it.t==="chips"){ h+="<h3>"+esc(strip(L(it.q)))+"</h3>"; it.o.forEach(function(o,k){ var n=rs.filter(function(r){ var v=r.v2.w[it.id]; return Array.isArray(v)?v.indexOf(k)>=0:v===k; }).length; h+=bar(strip(L(o)),n,rs.length); }); }
    if(it.t==="nums"){ var cnt={}, nn=0; rs.forEach(function(r){ var v=r.v2.w[it.id]; if(Array.isArray(v)&&v.length){ nn++; v.forEach(function(k){ cnt[k]=(cnt[k]||0)+1; }); } });
      if(nn){ h+="<h3>"+esc(strip(L(it.qA||it.q)))+"</h3>"; Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).forEach(function(k){ h+=bar("Fear "+k,cnt[k],nn); }); } }
    if(it.t==="text"){ var vals={}; rs.forEach(function(r){ var v=String(r.v2.w[it.id]||"").trim(); if(v){ v=v.charAt(0).toUpperCase()+v.slice(1).toLowerCase(); vals[v]=(vals[v]||0)+1; } }); h+="<h3>"+esc(strip(L(it.q)))+"</h3>"; Object.keys(vals).sort(function(a,b){return vals[b]-vals[a];}).forEach(function(v){ h+=bar(v,vals[v],rs.length); }); }
  }); }); });
  h+="<h3>Hardest items (most misses)</h3>";
  var mc=ITEMS.map(function(it){ var m=0; rs.forEach(function(r){ var a=r.v2.ans[it.id]; if(a) m+=a.tries||0; }); return [it,m]; }).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  mc.forEach(function(x){ h+=bar(x[0].q.slice(0,60),x[1],Math.max(1,mc[0][1])); });
  document.getElementById("classv").innerHTML=h;
}
