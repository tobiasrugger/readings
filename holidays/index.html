         (U.egg === sid && ci === s.chunks.length - 1 ? '<button type="button" class="leo" aria-label="a tiny lion">' + U.art.leo + "</button>" : "") + "</section>";
  });
  if(useSide) h += '</div><aside class="sidep" id="sidep" data-side="' + s.side + '"></aside></div><button type="button" class="sidebtn" id="sidebtn">📋 ' + (s.sideLabel || U.sideLabel || "List") + "</button>";
  h += '<div class="foot"><button type="button" class="navb" data-go="home">☰ Menu</button><span class="fcount" id="fcount"></span>' +
       (i < U.screens.length - 1 ? '<button type="button" class="navb next" data-go="' + U.screens[i+1].id + '">Next: ' + U.screens[i+1].emoji + " " + L(U.screens[i+1].title) + " →</button>"
                                 : '<button type="button" class="navb next" id="finishBtn">I am finished ✓</button>') + "</div>";
  return h + "</div>";
}
function updateFooter(){
  var f = $("fcount"); if(!f) return;
  var p = screenProgress(cur); f.textContent = p.done + " / " + p.tot + " done";
}

function go(sid){
  if(sid !== "home" && !U.screens.some(function(s){ return s.id === sid; })) sid = "home";
  cur = sid; ST.seen[sid] = true;
  var m = $("main");
  lastPos = [];
  m.innerHTML = sid === "home" ? renderHome() : renderScreen(sid);
  if(location.hash.replace("#","") !== sid) history.pushState(null, "", "#" + sid);
  var ws = m.querySelectorAll(".widget"); for(var i=0;i<ws.length;i++){ var fn = U.widgets && U.widgets[ws[i].getAttribute("data-wg")]; if(fn) fn(ws[i], API); }
  var sp = $("sidep"); if(sp && U.sides && U.sides[sp.getAttribute("data-side")]) sp.innerHTML = U.sides[sp.getAttribute("data-side")](API);
  var sd = m.querySelectorAll(".side"); for(var j=0;j<sd.length;j++){ var fs = U.sides && U.sides[sd[j].getAttribute("data-side")]; if(fs) sd[j].innerHTML = fs(API); }
  fillDirs(); fillCardTr(); updateFooter(); publishScore();
  window.scrollTo(0, 0);
  var nb = document.querySelectorAll("#tabs button"); for(var k=0;k<nb.length;k++) nb[k].classList.toggle("on", nb[k].getAttribute("data-go") === sid);
}
window.addEventListener("popstate", function(){ if(student && loaded) go(location.hash.replace("#","") || "home"); });

function fillCardTr(){
  var ts = document.querySelectorAll(".wtr[data-tr]");
  for(var i=0;i<ts.length;i++){
    var w = ts[i].getAttribute("data-tr"), g = U.gloss[w];
    var v = (LANG !== "none" && g && g.t && g.t[LANG]) ? g.t[LANG] : "";
    ts[i].innerHTML = v ? '<b class="eq">' + esc(v) + "</b>" : '<b class="eq none">' + esc(w) + "</b>";
    if(RTL[LANG]) ts[i].setAttribute("dir","rtl"); else ts[i].removeAttribute("dir");
  }
}

/* ---------- interaction ---------- */
function answer(id, ok, oi){
  var a = ST.ans[id] || { tries: 0, miss: [] };
  if(a.ok) return a;
  if(ok){ a.ok = true; a.at = new Date().toISOString(); }
  else { a.tries++; if(oi != null && a.miss.indexOf(oi) < 0) a.miss.push(oi); }
  ST.ans[id] = a; queueSave();
  return a;
}
function findItem(id){
  var f = null;
  U.screens.forEach(function(s){ s.chunks.forEach(function(c){ (c.items||[]).forEach(function(it){ if(it.id === id) f = it; }); }); });
  return f;
}
function rerenderQ(id){
  var el = document.querySelector('[data-q="' + id + '"]'); var it = findItem(id); if(!el || !it) return;
  lastPos = []; var tmp = document.createElement("div"); tmp.innerHTML = itemHTML(it); el.replaceWith(tmp.firstChild);
  updateFooter();
}
var sortSel = null;
document.addEventListener("click", function(e){
  var t = e.target;
  var sp = t.closest(".spk, .wpic"); if(sp){ e.stopPropagation(); say(sp.getAttribute("data-say")); if(!t.closest(".scard")) return; }
  var g = t.closest("[data-go]"); if(g){ go(g.getAttribute("data-go")); return; }
  if(t.closest("#finishBtn")){ finish(); return; }
  if(t.closest(".trretry")){ var dd = t.closest(".dir"), en2 = dd.getAttribute("data-en"); delete TRFAIL[en2]; dd._q = null; t.closest(".dtr").textContent = "…"; trQ.push({ text: en2, lang: LANG }); trPump(); return; }
  var lv = t.closest(".lvb"); if(lv){ LVL = lv.getAttribute("data-l"); applyLevel(); go(cur); queueSave(); return; }
  if(t.closest(".leo")){ fireworks(); toast(ST.egg ? "Leo again! 🦁" : "You found Leo the Galileo lion! 🦁"); if(!ST.egg){ ST.egg = new Date().toISOString(); queueSave(); } return; }
  var op = t.closest(".q .opt:not(.chip)");
  if(op && !op.disabled){
    var q = op.closest(".q"), id = q.getAttribute("data-q"), it = findItem(id), oi = +op.getAttribute("data-o");
    var correct = it.t === "tf" ? (it.a ? 0 : 1) : 0;
    answer(id, oi === correct, oi); rerenderQ(id);
    if(oi === correct) say(it.t === "tf" ? (oi === 0 ? "True" : "False") : (it.t === "cloze" ? L(it.q).replace("___", it.a[0]) : strip(L(it.o[0]))));
    return;
  }
  var nb = t.closest(".nums .num, .nums .fearpick");
  if(nb){
    var nq = nb.closest(".nums"), nid = nq.getAttribute("data-nums"), k = +nb.getAttribute("data-n"), arr2 = ST.w[nid] || [];
    var at = arr2.indexOf(k); if(at >= 0) arr2.splice(at, 1); else arr2.push(k); ST.w[nid] = arr2;
    nb.classList.toggle("on", arr2.indexOf(k) >= 0);
    var fk = nb.querySelector(".fk4"); if(fk) fk.textContent = arr2.indexOf(k) >= 0 ? "✓" : "";
    if(!nb.classList.contains("fearpick")) nq.querySelector(".numsel").innerHTML = numSel(arr2);
    if(at < 0 && U.onNum) U.onNum(k, API);
    U.screens.forEach(function(sc){ sc.chunks.forEach(function(c){ (c.items || []).forEach(function(it3){
      if(it3.t === "write" && it3.from === nid){ var fr = document.querySelector('[data-fr="' + it3.id + '"]'); if(fr) fr.innerHTML = dynFrame(it3); }
    }); }); });
    queueSave(); return;
  }
  if(t.closest("#sidebtn")){ var p2 = $("sidep"); p2.classList.toggle("open"); return; }
  if(t.closest(".sidep .sclose")){ $("sidep").classList.remove("open"); return; }
  var ch = t.closest(".chips .opt");
  if(ch){
    var cq = ch.closest(".chips"), cid = cq.getAttribute("data-ch"), cit = findItem(cid), ci = +ch.getAttribute("data-c");
    if(cit.multi){ var arr = ST.w[cid] || []; var k = arr.indexOf(ci); if(k >= 0) arr.splice(k,1); else arr.push(ci); ST.w[cid] = arr; }
    else ST.w[cid] = ci;
    var bs = cq.querySelectorAll(".opt"); for(var i=0;i<bs.length;i++){ var on = cit.multi ? ST.w[cid].indexOf(i) >= 0 : ST.w[cid] === i; bs[i].classList.toggle("on", on); }
    queueSave(); return;
  }
  var mo = t.closest(".match .opt");
  if(mo && !mo.disabled){
    var row = mo.closest(".mrow"), mid = mo.closest(".match").getAttribute("data-match"), mi = +row.getAttribute("data-mi"), oj = +mo.getAttribute("data-mo");
    var mit = findItem(mid), a = answer(mid + "_" + mi, oj === mi, oj);
    var fb = row.querySelector(".fb");
    if(oj === mi){
      var bs2 = row.querySelectorAll(".opt"); for(var b=0;b<bs2.length;b++){ bs2[b].disabled = true; }
      mo.classList.add("right"); mo.innerHTML = "✓ " + mo.innerHTML; row.classList.add("solved"); fb.innerHTML = ""; say(strip(L(mit.pairs[mi][1])));
    } else {
      if(IS101){ mo.classList.add("gone"); mo.disabled = true; } else { mo.classList.add("bad"); mo.innerHTML = "✗ " + mo.innerHTML.replace(/^✗ /,""); }
      fb.innerHTML = quip(mid + mi, a.tries) + (mit.hint ? '<span class="hint">💡 ' + L(mit.hint) + "</span>" : "");
    }
    updateFooter(); return;
  }
  var sc = t.closest(".scard");
  if(sc && !sc.classList.contains("placed")){
    var box = sc.closest(".sort");
    var all = box.querySelectorAll(".scard"); for(var x=0;x<all.length;x++) all[x].classList.remove("sel");
    sc.classList.add("sel"); sortSel = sc; return;
  }
  var bin = t.closest(".bucket");
  if(bin && sortSel && bin.closest(".sort") === sortSel.closest(".sort")){
    var sbox = bin.closest(".sort"), sid = sbox.getAttribute("data-sort"), si = +sortSel.getAttribute("data-si");
    var want = +sortSel.getAttribute("data-b"), got = +bin.querySelector(".bin").getAttribute("data-bin"), sit = findItem(sid);
    var res = answer(sid + "_" + si, want === got, got), sfb = sbox.querySelector(".fb");
    if(want === got){ sortSel.classList.remove("sel"); sortSel.classList.add("placed"); bin.querySelector(".bin").appendChild(sortSel); sfb.innerHTML = '<span class="good">✓</span>'; }
    else { sortSel.classList.add("shake"); setTimeout(function(c){ return function(){ c.classList.remove("shake"); }; }(sortSel), 500); sfb.innerHTML = quip(sid + si, res.tries) + '<span class="hint">💡 ' + L(sit.hint || "Read the card again.") + "</span>"; }
    sortSel = null; updateFooter(); return;
  }
  var cc = t.closest("[data-clchk]");
  if(cc){
    var clid = cc.getAttribute("data-clchk"), inp = document.querySelector('[data-cl="' + clid + '"]'), cit2 = findItem(clid);
    var val = norm(inp.value); if(!val) return;
    var ok2 = cit2.a.some(function(x){ return norm(x) === val; });
    var a2 = ST.ans[clid] || { tries: 0, miss: [] }; a2.v = inp.value; ST.ans[clid] = a2;
    answer(clid, ok2, null); if(!ok2){ ST.ans[clid].miss.push(inp.value); }
    rerenderQ(clid); return;
  }
  var rb = t.closest(".recb");
  if(rb){ recWord(rb); return; }
  var pb = t.closest(".recplay");
  if(pb){ var pr = (ST.extra.rec || {})[pb.getAttribute("data-play")]; var src = (pb._url) || (pr && pr.path && window.GS ? GS.audioUrl(pr.path) : ""); if(src){ new Audio(src).play(); } return; }
  var bw = t.closest(".bw");
  if(bw){ var ta = document.querySelector('[data-w="' + bw.getAttribute("data-to") + '"]'); ta.value = (ta.value ? ta.value.replace(/\s*$/," ") : "") + bw.getAttribute("data-ins") + " "; ta.dispatchEvent(new Event("input", { bubbles:true })); ta.focus(); return; }
  var rv = t.closest(".rv");
  if(rv){ var rb = $("rv_" + rv.getAttribute("data-rv")); rb.hidden = !rb.hidden; ST.extra["rv_" + rv.getAttribute("data-rv")] = !rb.hidden; queueSave(); return; }
});
document.addEventListener("input", function(e){
  var w = e.target.getAttribute && e.target.getAttribute("data-w");
  if(w){ ST.w[w] = e.target.value; var c = document.querySelector('[data-wc="' + w + '"]'); if(c){ var it = findItem(w); c.textContent = words(e.target.value) + " words" + (it && it.min ? " · write at least " + it.min : ""); } queueSave(); }
});
document.addEventListener("keydown", function(e){ if(e.key === "Enter" && e.target.classList && e.target.classList.contains("blank")){ var b = document.querySelector('[data-clchk="' + e.target.getAttribute("data-cl") + '"]'); if(b) b.click(); } });

/* ---------- record yourself saying a word (speak-core.js: mic + matching + saving) ---------- */
var recCtl = null;
function recWord(btn){
  var w = btn.getAttribute("data-rec"), msg = document.querySelector('[data-recmsg="' + w + '"]'), card = btn.closest(".wcard");
  if(!window.GS || !GS.record){ msg.textContent = "The microphone is still loading. Try again in a moment."; return; }
  if(recCtl){ recCtl.stop(); return; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  btn.classList.add("live"); msg.textContent = "Listening… say: " + w;
  recCtl = GS.record({ maxMs: 5000, onDone: function(res){
    recCtl = null; btn.classList.remove("live");
    if(res.error === "nomic" || res.error === "not-allowed"){ msg.textContent = "The page can't use the microphone. Ask Mr. Toby."; return; }
    var best = GS.bestMatch(res.alts || [], [w]), ok = best.score >= 0.6;
    if(!ok && !GS.canRecognize && res.blob && res.secs > 0.6){ ok = true; best.heard = "(recorded — Mr. Toby will listen)"; }
    ST.extra.rec = ST.extra.rec || {}; var r = ST.extra.rec[w] || { tries: 0 }; r.tries++;
    if(ok) r.ok = true; r.heard = best.heard || ""; r.score = Math.round(best.score * 100) / 100; ST.extra.rec[w] = r;
    if(res.blob){ var pl = document.querySelector('[data-play="' + w + '"]'); if(pl){ pl._url = URL.createObjectURL(res.blob); pl.hidden = false; } }
    msg.innerHTML = ok ? "✓ I heard you say it." : (best.heard ? 'I heard "' + esc(best.heard) + '". Try again — say: <b>' + esc(w) + "</b>" : "I didn't hear you. Tap the red button and say: <b>" + esc(w) + "</b>");
    card.classList.toggle("recok", !!r.ok);
    if(student){
      var row = { activity: U.slug + "-words", item_id: w, email: student.email, speaker_name: student.name, period: student.period, device_email: student.email,
                  target_text: w, said_text: best.heard || "", transcript: (res.alts && res.alts[0] && res.alts[0].t) || "", alternatives: res.alts || [],
                  match_score: best.score, attempt_no: r.tries, accepted: ok, practice: false };
      GS.saveAttempt(row, res.blob);
      if(res.blob){ setTimeout(function(){ /* audio path is set on the row by saveAttempt */ if(row.audio_path){ r.path = row.audio_path; queueSave(); } }, 4000); }
    }
    queueSave(); updateFooter();
  } });
}

/* ---------- finish + turn in ---------- */
function finish(){
  var s = score(), left = U.screens.filter(function(x){ var p = screenProgress(x.id); return p.done < p.tot; });
  var h = '<div class="box donebox">' + art(U.homeArt) + "<h2>" + (left.length ? "Almost there!" : "You did it! 🎉") + "</h2><p>Score: <b>" + s.score + " / " + s.max + "</b></p>";
  if(left.length) h += "<p>Not finished yet:</p><p>" + left.map(function(x){ return '<button type="button" class="navb" data-go="' + x.id + '">' + x.emoji + " " + L(x.title) + "</button>"; }).join(" ") + "</p>";
  h += '<p><button type="button" class="navb next" id="turnIn2">Turn in my work</button></p><p class="note">When you turn it in, go to Google Classroom for the next activity, or ask Mr. Toby.</p></div>';
  $("main").innerHTML = h; cur = "finish"; window.scrollTo(0,0);
  $("turnIn2").addEventListener("click", turnIn);
}
function turnIn(){ save(true, function(ok){ toast(ok ? "Turned in ✓ Go to Google Classroom for the next activity, or ask Mr. Toby." : "It did not send. Check the wifi and try again."); if(ok) fireworks(); }); }

/* ---------- toast + fireworks ---------- */
function toast(m){ var t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 3800); }
function fireworks(){
  var c = ["#f2b134","#e8833a","#d9648a","#9b6bd6","#4f93c9","#3f9e73"];
  for(var i=0;i<46;i++){ var d = document.createElement("i"); d.className = "spark"; d.style.left = (30 + Math.random()*40) + "vw"; d.style.top = (30 + Math.random()*30) + "vh";
    d.style.background = c[i % c.length]; d.style.setProperty("--dx", (Math.random()*60-30) + "vw"); d.style.setProperty("--dy", (Math.random()*50-35) + "vh");
    document.body.appendChild(d); setTimeout(function(x){ return function(){ x.remove(); }; }(d), 1400); }
}

/* ---------- API for widgets ---------- */
var API = { ST: function(){ return ST; }, save: queueSave, saveNow: save, esc: esc, say: say, spk: spk, L: L, art: function(n){ return U.art[n] || ""; },
            student: function(){ return student; }, hdr: hdr, SUPA_URL: SUPA_URL, TABLE: TABLE, lang: function(){ return LANG; }, level: function(){ return LVL; },
            answer: answer, quip: quip, toast: toast, fireworks: fireworks, is101: IS101, fillDirs: function(){ fillDirs(); }, refresh: function(){ refreshTiles(); updateFooter(); } };
window.ENGINE = API;

/* ---------- boot ---------- */
function boot(){
  var sel = $("lang"), gl = $("gLang");
  [sel, gl].forEach(function(s, i){
    var h = i === 0 ? '<option value="none">English only</option>' : '<option value="">Choose your language</option>';
    U.langs.forEach(function(l){ h += '<option value="' + l[0] + '">' + l[1] + "</option>"; });
    s.innerHTML = h;
  });
  try{ var vl = localStorage.getItem("vocab_lang"); if(vl) gl.value = vl; var em = localStorage.getItem("gal_student_email"); if(em) $("gEmail").value = em; }catch(e){}
  sel.addEventListener("change", function(){ setLang(sel.value); queueSave(); });
  $("gGo").addEventListener("click", signIn);
  ["gName","gEmail"].forEach(function(x){ $(x).addEventListener("keydown", function(e){ if(e.key === "Enter") signIn(); }); });
  $("turnIn").addEventListener("click", function(){ if(student) finish(); });
  var tb = "";
  tb += '<button type="button" data-go="home">☰</button>';
  U.screens.forEach(function(s, i){ tb += '<button type="button" data-go="' + s.id + '" title="' + esc(strip(L(s.title))) + '">' + (i+1) + "</button>"; });
  $("tabs").innerHTML = tb;
  SCORED = allScored();
  /* quiet canary: tab titles are translatable and known; drift = an outside translator */
  var EXPECT = U.screens.map(function(s){ return strip(L(s.title)); }), sent = "";
  setInterval(function(){
    if(!student) return;
    var obs = "", ts = document.querySelectorAll(".tname");
    for(var i=0;i<ts.length && i<EXPECT.length;i++){ var got = (ts[i].textContent || "").replace(/^\S+\s/,"").trim(); if(got && got !== EXPECT[i]){ obs = got; break; } }
    var cls = document.documentElement.className || "";
    if(!obs && !/translated/.test(cls)) return;
    var sig = obs + "|" + document.documentElement.lang; if(sig === sent) return; sent = sig;
    fetch(SUPA_URL + "/rest/v1/page_translation?on_conflict=email,set_slug", { method:"POST", headers: hdr({ "Prefer":"resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([{ email: student.email, set_slug: U.slug, translated: true, observed: obs, html_lang: document.documentElement.lang || "", html_class: cls, updated_at: new Date().toISOString() }]) }).catch(function(){});
  }, 15000);
}
boot();
})();
