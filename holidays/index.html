<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghosts, Candy, and Remembering — Mr. Toby's ELD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1d2b;--line:#23202e;--paper:#f6f1e7;--card:#fff;--acc:#6b3f8f;--acc2:#e8833a;--soft:#f3ecfb;--good:#2f7d4f;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:18px;line-height:1.55}
body[data-level="A"]{font-size:19px}
button{font-family:inherit;color:inherit}
#bar{position:sticky;top:0;z-index:50;background:var(--acc);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;box-shadow:0 2px 0 var(--line)}
#bar .brand{font-weight:900;font-size:1.05rem;margin-right:4px}
#bar select{font-family:inherit;font-size:.95rem;font-weight:700;border-radius:10px;border:2px solid #fff;padding:5px 8px;background:#fff;color:var(--ink);max-width:190px}
#bar select option{color:#1f1d2b;background:#fff}
.lvwrap{display:flex;border:2px solid #fff;border-radius:999px;overflow:hidden}
.lvb{border:none;background:transparent;color:#fff;font-weight:800;padding:5px 12px;cursor:pointer;font-size:.92rem}
.lvb.on{background:#fff;color:var(--acc)}
#bar .sp{flex:1}
#who{font-weight:700;font-size:.9rem;opacity:.9}
#saveNote{font-size:.82rem;font-weight:700;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.18)}
#saveNote.bad{background:#fde3e1;color:var(--bad)}
#turnIn{background:#fff;color:var(--acc);border:none;border-radius:10px;font-weight:900;padding:6px 12px;cursor:pointer}
#progwrap{height:7px;background:rgba(0,0,0,.12)}
#prog{height:7px;background:var(--acc2);width:0;transition:width .4s}
#tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 10px 0}
#tabs button{min-width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.18)}
#tabs button.on{background:var(--acc);color:#fff}
#main{max-width:980px;margin:0 auto;padding:14px 14px 80px}
.box{display:flow-root;background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 rgba(0,0,0,.2);padding:16px 18px;margin:0 0 20px;position:relative}
.box h3{margin:0 0 10px;font-size:1.25rem;color:var(--acc);font-weight:900}
.pic{float:right;width:min(40%,270px);margin:2px 0 12px 16px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pic svg,.scene svg,.tart svg,.pickpic svg,.wpic svg{display:block;width:100%;height:auto}
.scene{border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:0 auto 14px;max-width:640px}
.bx{display:flow-root}
.dir{font-weight:800;color:#3d3a52;background:var(--soft);border-left:6px solid var(--acc2);border-radius:0 10px 10px 0;padding:8px 12px;margin:0 0 12px}
.dir .dtr{display:block;font-weight:700;color:#5b4a1f;margin-top:4px;font-size:.95em}
.dir .dtr[dir="rtl"]{text-align:right}
.spk{border:2px solid var(--line);background:#fff;border-radius:10px;font-size:.9rem;padding:1px 6px;cursor:pointer;vertical-align:1px;box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.para{margin:0 0 12px}
.frame{font-weight:700;background:#fff8e6;border:2px dashed #c9a14a;border-radius:10px;padding:8px 12px}
.note{color:#5b5870;font-weight:700;font-size:.92em}
.q{border-top:2px dashed #d6d1c4;padding:12px 0 6px;margin-top:6px;clear:none}
.box .bx > .q:first-child{border-top:none}
.qstem{font-weight:800;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.tf .opt{min-width:110px;justify-content:center}
.opt{display:inline-flex;align-items:center;gap:6px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.18);transition:opacity .3s}
.opt:hover:not([disabled]){background:var(--soft)}
.opt.right{background:#e3f5ea;border-color:var(--good);color:#17402a}
.opt.gone{opacity:.32;text-decoration:line-through;box-shadow:none;cursor:default}
.opt.bad{background:#fdecea;border-color:var(--bad);color:#7a1c16}
.opt.chip.on{background:var(--acc);color:#fff}
.opt.sm{padding:5px 10px;font-size:.95rem}
.mk{color:var(--good)} .mk.x{color:var(--bad)} s.was{color:var(--bad);font-weight:700;font-size:.9em}
.fb{min-height:6px;margin-top:6px}
.fb .good{color:var(--good);font-weight:800}
.quip{display:block;font-weight:700;color:#3a3750}
.quip b{color:var(--qc)}
.hint{display:block;font-weight:700;color:#7a5a12;background:#fff4d6;border-radius:8px;padding:4px 10px;margin-top:4px}
.pickpic{max-width:340px;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 10px;background:#fff}
input.blank{font-family:inherit;font-size:1rem;font-weight:700;border:none;border-bottom:2.5px solid var(--line);width:9em;padding:2px 6px;margin:0 4px;background:#fffdf6}
input.blank:disabled{border-color:var(--good);color:#17402a;background:#e3f5ea}
.chk{border:2px solid var(--line);background:var(--acc);color:#fff;border-radius:10px;font-weight:800;padding:3px 10px;cursor:pointer;margin-left:6px}
input.line{width:100%;font-family:inherit;font-size:1rem;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;font-family:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:10px;line-height:1.5}
.wc{text-align:right;font-weight:800;color:#6b6880;font-size:.85rem;margin:2px 0 0}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.bw{border:2px solid var(--line);background:#fff8e6;border-radius:999px;padding:3px 10px;font-weight:800;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.wcard{border:2px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 rgba(0,0,0,.18);background:#fff;padding:0 0 8px;overflow:hidden}
.wpic{border-bottom:2px solid var(--line);cursor:pointer;background:#fbf6ea}
.wline{margin:8px 10px 4px;font-size:.98rem}
.ww{font-size:1.25rem;text-transform:none}
.wtr{margin:0 10px;font-size:1.05rem}
.recrow{display:flex;align-items:center;gap:8px;margin:8px 10px 0;padding-top:8px;border-top:2px dashed #e2ddd0}
.recb{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:2px 2px 0 rgba(0,0,0,.2)}
.recb .dot{width:20px;height:20px;border-radius:50%;background:#dd3b33}
.recb.live{animation:pulse 1s infinite}
.recb.live .dot{border-radius:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(221,59,51,.5)}50%{box-shadow:0 0 0 10px rgba(221,59,51,0)}}
.recmsg{font-weight:700;font-size:.88rem;color:#3a3750;flex:1}
.recplay{border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:900;cursor:pointer;padding:3px 9px}
.wcard.recok{border-color:var(--good)}
.wcard.recok .recmsg{color:var(--good)}
.gap{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--line)}
.filled{color:var(--good);border-bottom:2.5px solid var(--good)}
.trretry{border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:800;cursor:pointer;padding:1px 8px;font-size:.85rem}
.bankw{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;padding:4px 2px;border-bottom:1px dashed #e2ddd0}
.bankw svg{width:52px;height:auto;border:1.5px solid var(--line);border-radius:6px;display:block}
.bankw b{font-size:1rem}
.bankw .bt{display:block;font-size:.8rem;color:#5b4a1f;font-weight:700}
.eq{text-decoration:underline;text-decoration-thickness:2px}
.eq.none{color:#8c8a99}
.sort .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bucket{border:2px solid var(--line);border-radius:12px;min-height:110px;background:#fdfaf2;cursor:pointer}
.bucket .bh{font-weight:900;text-align:center;padding:6px;border-bottom:2px solid var(--line);background:var(--soft);border-radius:10px 10px 0 0}
.bucket.b1 .bh{background:#fff1d2} .bucket.b2 .bh{background:#e9e3f7}
.bin{display:flex;flex-direction:column;gap:6px;padding:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.scard{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer;text-align:left;box-shadow:2px 2px 0 rgba(0,0,0,.18)}
.scard.sel{outline:4px solid var(--acc2)}
.scard.placed{background:#e3f5ea;border-color:var(--good);cursor:default;box-shadow:none}
.scard.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.mrow{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:8px;align-items:start;padding:10px 0;border-top:2px dashed #d6d1c4}
.mrow:first-child{border-top:none}
.mrow .ml{font-weight:800}
.mrow .mopts{display:flex;flex-wrap:wrap;gap:6px}
.mrow .fb{grid-column:1/-1}
.rv{border:2px solid var(--line);background:var(--soft);font-weight:800;border-radius:12px;padding:6px 12px;cursor:pointer;margin-top:8px}
.rvbox{border-left:6px solid var(--acc);background:#faf8ff;padding:8px 14px;margin-top:8px;border-radius:0 10px 10px 0}
.scrhead{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.scrhead h2{margin:0;font-size:1.6rem;font-weight:900}
.snum{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.navb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.2);font-size:1rem}
.navb.next{background:var(--acc);color:#fff}
.fcount{font-weight:800;color:#5b5870}
.homebox h1{margin:0 0 4px;font-size:2rem;font-weight:900;color:var(--acc)}
.homebox .sub{font-weight:700;color:#4a475e;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.tile{position:relative;border:2px solid var(--line);border-radius:16px;background:#fff;padding:0 0 10px;cursor:pointer;text-align:left;box-shadow:4px 4px 0 rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-2px)}
.tile.full{border-color:var(--good)}
.tart{display:block;border-bottom:2px solid var(--line);background:#fbf6ea}
.tname{display:block;font-weight:900;font-size:1.05rem;padding:8px 10px 4px}
.tprog{display:block;height:8px;margin:2px 10px;background:#ece7db;border-radius:6px;overflow:hidden}
.tprog span{display:block;height:8px;background:var(--good)}
.tcount{font-size:.82rem;font-weight:800;color:#6b6880;padding:2px 10px 0}
.tnum{position:absolute;top:8px;left:8px;background:var(--acc);color:#fff;border:2px solid var(--line);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;z-index:2}
.tck{position:absolute;top:8px;right:8px;background:var(--good);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;z-index:2;border:2px solid var(--line)}
.leo{position:absolute;right:8px;bottom:6px;width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;opacity:.85}
.leo svg{width:100%;height:100%}
.donebox{text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:14px;transition:transform .3s;z-index:300;max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.spark{position:fixed;width:10px;height:10px;border-radius:50%;z-index:400;animation:spark 1.3s ease-out forwards;pointer-events:none}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
#gate{position:fixed;inset:0;z-index:500;background:rgba(25,22,40,.94);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
#gate .card{background:#fff;border:3px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:22px 24px;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
#gate .gpic{margin:-4px 0 8px}
#gate h2{margin:0 0 4px;font-size:1.5rem;color:var(--acc)}
#gate label{display:block;font-weight:900;font-size:.88rem;margin:10px 0 3px}
#gate input,#gate select{width:100%;font-family:inherit;font-size:1rem;padding:9px 11px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#gate select option{color:#1f1d2b;background:#fff}
#gGo{margin-top:14px;width:100%;border:2px solid var(--line);background:var(--acc);color:#fff;font-weight:900;font-size:1.1rem;padding:10px;border-radius:12px;cursor:pointer}
#gErr{color:var(--bad);font-weight:800;min-height:1.2em;margin-top:6px}
.hasside{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,34%);grid-template-areas:"h h" "b s";gap:0 16px}
.hasside > h3{grid-area:h}
.hasside > .bx{grid-area:b}
.hasside > .side{grid-area:s;position:sticky;top:110px;align-self:start;max-height:calc(100vh - 130px);overflow:auto;border:2px solid var(--line);border-radius:12px;background:#fbf9ff;padding:10px 12px;font-size:.88rem}

.withside{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.sidep{position:sticky;top:104px;max-height:calc(100vh - 120px);overflow:auto;background:#fff;border:2px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 rgba(0,0,0,.2);padding:10px 12px;font-size:.86rem}
.sidep h4{margin:0 0 6px;color:var(--acc);font-size:1rem}
.sidep ol{margin:0;padding-left:1.7em}
.sidep li{margin:0 0 6px;padding:2px 4px;border-radius:6px}
.sidep li.flash{background:#fff1c2;outline:2px solid var(--acc2)}
.sidep .sclose{display:none}
.sidebtn{display:none}
.numgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;max-width:420px}
.num{border:2px solid var(--line);background:#fff;border-radius:9px;font-weight:900;padding:5px 0;cursor:pointer;box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.num.on{background:var(--acc);color:#fff}
.numsel{font-size:.9rem;margin:6px 0 0;color:#3a3750}
.fear4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.fearpick{display:grid;grid-template-columns:40px 1fr 22px;gap:8px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:.95rem;box-shadow:2px 2px 0 rgba(0,0,0,.18)}
.fearpick .fe4{font-size:1.7rem;line-height:1}
.fearpick .fk4{font-weight:900;color:#fff}
.fearpick.on{background:var(--acc);color:#fff;border-color:var(--line)}
@media (max-width:900px){
  .withside{display:block}
  .sidep{display:none;position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:58vh;z-index:120}
  .sidep.open{display:block}
  .sidep .sclose{display:block;float:right;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:900;cursor:pointer}
  .sidebtn{display:block;position:fixed;right:12px;bottom:14px;z-index:110;border:2px solid var(--line);background:var(--acc2);color:#fff;font-weight:900;border-radius:999px;padding:10px 16px;box-shadow:3px 3px 0 rgba(0,0,0,.3);font-size:1rem}
}
@media (max-width:760px){
  body{font-size:17px}
  .pic{width:42%;margin-left:10px}
  .hasside{display:block}
  .hasside > .side{position:sticky;top:96px;max-height:38vh;margin-bottom:10px;z-index:5}
  .mrow{grid-template-columns:1fr}
  #bar select{max-width:140px}
  .scrhead h2{font-size:1.3rem}
}

.rulebox{border:2px solid var(--line);border-radius:12px;background:#fff8e6;padding:8px 14px;margin:0 0 10px;font-weight:700;line-height:1.7}
.crow{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 34px;gap:8px;align-items:center;margin:4px 0;font-weight:700}
.cb{height:14px;background:#ece7db;border-radius:8px;overflow:hidden;border:1.5px solid var(--line)}
.cb span{display:block;height:100%;background:var(--acc2)}
#chartOut h4{margin:12px 0 2px}
.ofpal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:0 0 12px}
.ofo{border:2px solid var(--line);border-radius:12px;background:#fff;padding:4px;cursor:pointer;font-weight:800;font-size:.82rem;box-shadow:2px 2px 0 rgba(0,0,0,.18)}
.ofo svg{width:44px;height:44px;display:block;margin:0 auto}
.ofo.sel{outline:4px solid var(--acc2);background:#fff8e6}
.ofaltar{position:relative;max-width:520px;margin:0 auto 14px;padding:14px 10px;background:#5b3f7a;border:2px solid var(--line);border-radius:14px}
.oftier{display:flex;justify-content:center;gap:10px;margin:8px auto;padding:8px;background:#e9dcc3;border:2px solid var(--line);border-radius:6px}
.oftier.t0{width:52%} .oftier.t1{width:76%} .oftier.t2{width:100%}
.ofslot{width:62px;height:62px;border:2.5px dashed #a8692c;border-radius:10px;background:#fffaf0;font-size:1.6rem;font-weight:900;color:#a8692c;cursor:pointer;padding:4px}
.ofslot.full{border-style:solid;border-color:var(--line)}
.ofslot svg{width:100%;height:100%}
.wsw{overflow-x:auto}
table.ws{border-collapse:collapse;margin:6px auto;user-select:none}
table.ws td{width:2.2em;height:2.2em;text-align:center;font-weight:900;border:1.5px solid #d6d1c4;cursor:pointer;font-size:1.05rem}
table.ws td.first{outline:3px solid var(--acc2);outline-offset:-3px}
table.ws td.hit{background:#fbe1b8}
.wsl{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-weight:900;margin:6px 0}
.wsl .done{text-decoration:line-through;color:#9a97ad}
.drow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.swc{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swc.on{outline:3px solid var(--acc2);outline-offset:2px}
#pad{display:block;width:100%;max-width:440px;aspect-ratio:1/1;margin:6px auto;border:2px solid var(--line);border-radius:12px;touch-action:none;background:#fdf6e8}
</style>
</head>
<body data-level="A" data-course="101">

", "o": ["knock", "sleep", "cook", "dance"], "hint": {"A": "You do this on a door. ✊🚪", "B": "It is what your hand does on a door."}}, {"t": "pick", "id": "pk6", "pic": "w_ancestor", "o": ["ancestor", "neighbor", "teacher", "doctor"], "hint": {"A": "Your family, long ago. 👵👴", "B": "A person in your family who lived long ago."}}, {"t": "pick", "id": "pk7", "pic": "w_neighbor", "o": ["neighbor", "ghost", "ancestor", "skeleton"], "hint": {"A": "This person lives next to you. 🏠🏠", "B": "A person who lives next to you."}}, {"t": "pick", "id": "pk8", "pic": "w_remember", "o": ["remember", "forget", "celebrate", "knock"], "hint": {"A": "She thinks about her grandmother. 💭", "B": "She thinks about a person from the past."}}]}]}, {"id": "halloween", "emoji": "🎃", "title": {"A": "Halloween", "B": "Reading A: Where Halloween came from"}, "art": "h_trick", "dir": {"A": "Read. Tap 🔊 to listen. Tap a word to see it in your language.", "B": "Read it once without stopping. Then read it again. Tap any word to hear it and see it in your language."}, "chunks": [{"title": {"A": "🔥 Long ago", "B": "Samhain"}, "scene": "h_samhain", "items": [{"t": "p", "text": {"A": "Long ago, people lived in Ireland 🇮🇪. On October 31 they had a holiday. It was called Samhain.", "B": "More than two thousand years ago, the Celtic people lived in Ireland, Scotland, and northern France. Their year ended on October 31. They called that night Samhain (say it: SAH-win). The Celts believed that on Samhain the door between the world of the living and the world of the dead opened, and spirits could walk on the earth for one night."}}, {"t": "p", "text": {"A": "They thought ghosts 👻 came back that night. They were afraid. 😨 So they made big fires 🔥. They wore masks 🎭. A ghost saw the mask and went away.", "B": "People were afraid, so they did two things. They lit huge bonfires on the hills, and they wore masks and animal skins. If a spirit saw a person in a mask, the spirit would think that person was another ghost and leave them alone. That is the oldest reason for Halloween costumes."}}, {"t": "mc", "id": "ha1", "q": {"A": "Why did people wear masks?", "B": "Why did the Celts wear masks on Samhain?"}, "o": [{"A": "So the ghosts went away.", "B": "So the spirits would think they were ghosts and leave them alone."}, {"A": "To go to school.", "B": "To win a prize."}, {"A": "Because it was cold.", "B": "Because it was very cold."}, {"A": "To eat candy.", "B": "To get candy."}], "hint": {"A": "Read the last sentence again. 🎭👻", "B": "Look at paragraph 2: what did the spirit think?"}}]}, {"title": {"A": "🚪 The name and the little cake", "B": "All Hallows' Eve"}, "pic": "w_knock", "items": [{"t": "p", "text": {"A": "Later, November 1 was a church day ⛪. The night before had a long name: All Hallows' Eve. People said it fast. It became Halloween!", "B": "Later the Catholic Church made November 1 All Saints' Day, a day to honor the holy dead, and November 2 All Souls' Day. The night before All Saints' Day was called All Hallows' Eve. Over hundreds of years, \"All Hallows' Eve\" wore down into one short word: Halloween."}}, {"t": "p", "text": {"A": "Poor people went to every door 🚪. They sang for the family's dead people. The family gave them a little cake 🍰. Children did it too. They told a joke 😄 and got food.", "B": "In England and Ireland, poor people walked from door to door on those days. They sang or prayed for the family's dead relatives, and the family gave them a small cake called a soul cake. This was called souling. In Scotland, children in costume went from house to house and performed a song, a poem, or a joke to get food or coins. This was called guising. Notice that the children had to do something first. The \"trick\" in \"trick or treat\" is what is left of that job."}}, {"t": "mc", "id": "ha2", "q": {"A": "Where does the word Halloween come from?", "B": "Where does the word \"Halloween\" come from?"}, "o": [{"A": "All Hallows' Eve, said fast", "B": "All Hallows' Eve, worn down into one word"}, {"A": "a kind of candy", "B": "the name of a candy company"}, {"A": "a ghost's name", "B": "the name of a famous ghost"}, {"A": "a pumpkin", "B": "an old word for pumpkin"}], "hint": {"A": "Read the first paragraph again.", "B": "Read the first paragraph of this part again."}}]}, {"title": {"A": "🚢 A new country", "B": "Coming to America"}, "pic": "h_turnip", "items": [{"t": "p", "text": {"A": "In 1845 the potatoes 🥔 in Ireland died. People were hungry. Many people moved to the United States 🇺🇸. They brought Halloween with them.", "B": "In the 1840s a disease destroyed the potato crop in Ireland. More than a million people died and more than a million left. Many came to the United States. They brought Halloween the way every immigrant brings holidays — folded up in the suitcase, next to the clothes."}}, {"t": "p", "text": {"A": "In Ireland, people cut faces in turnips. In America there were many pumpkins 🎃. Pumpkins are big and easy to cut. So people cut faces in pumpkins.", "B": "They also brought the story of Stingy Jack, a man who tricked the devil twice and then could not enter heaven or hell. He had to walk in the dark forever with one hot coal inside a carved turnip. In Ireland people carved ugly faces into turnips and beets and put them in the window. In America there were pumpkins everywhere, and pumpkins are big and soft and easy to cut. The jack-o'-lantern was born in a new country, like the people who made it."}}, {"t": "mc", "id": "ha3", "q": {"A": "Why did many Irish people move to the United States?", "B": "Why did more than a million people leave Ireland in the 1840s?"}, "o": [{"A": "They had no food.", "B": "The potato crop died and people were hungry."}, {"A": "They wanted pumpkins.", "B": "They wanted to grow pumpkins."}, {"A": "For a vacation.", "B": "They wanted a vacation."}, {"A": "To see ghosts.", "B": "They were afraid of ghosts."}], "hint": {"A": "Look for the word hungry. 🥔", "B": "What happened to the potatoes?"}}]}, {"title": {"A": "🍬 Halloween today", "B": "Halloween today"}, "scene": "h_trick", "items": [{"t": "p", "text": {"A": "Today, Halloween is a fun night. Children wear costumes 🧛. They knock on doors 🚪. They say \"Trick or treat!\" Neighbors give them candy 🍬.", "B": "Souling and guising slowly turned into trick-or-treating. The words \"trick or treat\" appeared in American newspapers in the 1920s and 1930s, and after 1945 the custom spread to almost every neighborhood in the country."}}, {"t": "p", "text": {"A": "It is not a religious day now. People laugh at ghosts and skeletons 💀, so they are not afraid.", "B": "Today Halloween in the United States is not a religious day. It is a night for costumes, candy, decorations, and scary movies, and Americans spend billions of dollars on it. But under the plastic skeletons the old idea is still there. At the end of October, when the nights get long and the leaves die, people think about the dead — and then they laugh at them, so they will not be afraid."}}]}, {"title": {"A": "✅ True or false?", "B": "True or false?"}, "items": [{"t": "tf", "id": "tfa1", "q": {"A": "Halloween started in the United States.", "B": "Halloween started in the United States."}, "a": false, "hint": {"A": "Where did people live long ago? 🇮🇪", "B": "Read the first part again: where did Samhain start?"}}, {"t": "tf", "id": "tfa2", "q": {"A": "People wore masks to hide from ghosts.", "B": "People first wore masks to hide from spirits."}, "a": true, "hint": {"A": "Look at part 1. 🎭", "B": "Look at part 1 again."}}, {"t": "tf", "id": "tfa3", "q": {"A": "In Ireland, people cut faces in pumpkins.", "B": "The first jack-o'-lanterns were pumpkins."}, "a": false, "hint": {"A": "What did they cut in Ireland?", "B": "What did people carve in Ireland?"}}, {"t": "tf", "id": "tfa4", "q": {"A": "Irish people brought Halloween to the United States.", "B": "Irish immigrants brought Halloween to the United States."}, "a": true, "hint": {"A": "Look at part 3. 🚢", "B": "Look at part 3 again."}}, {"t": "tf", "id": "tfa5", "q": {"A": "Today Halloween is a church day.", "B": "Today Halloween in the United States is mostly a religious day."}, "a": false, "hint": {"A": "Read part 4 again.", "B": "Read the last part again."}}]}]}, {"id": "muertos", "emoji": "💀", "title": {"A": "Día de los Muertos", "B": "Reading B: Día de los Muertos"}, "art": "h_ofrenda", "dir": {"A": "Read. Tap 🔊 to listen. Tap a word to see it in your language.", "B": "Same job: read once, then read again. Tap any word to hear it and see it in your language."}, "chunks": [{"title": {"A": "📅 Two days", "B": "Two days, two histories"}, "pic": "h_aztec", "items": [{"t": "p", "text": {"A": "Día de los Muertos means Day of the Dead. It is in Mexico 🇲🇽. It is on November 1 and November 2. People remember their family who died.", "B": "Día de los Muertos means \"Day of the Dead.\" It is not one day. It is November 1 and November 2 — and in many families the work starts weeks before."}}, {"t": "p", "text": {"A": "It comes from two old traditions: the first people of Mexico, and the Spanish church ⛪. They became one holiday.", "B": "The holiday is a mix of two histories. For thousands of years, Indigenous peoples in Mexico — the Nahua, the Purépecha, the Maya, the Zapotec and others — kept the bones and the memory of their ancestors close, and held a festival for the dead. When the Spanish came in the 1500s, they brought All Saints' Day and All Souls' Day with them. The two traditions did not replace each other. They grew together, like two trees planted in one hole."}}, {"t": "mc", "id": "mu1", "q": {"A": "How many days is Día de los Muertos?", "B": "When is Día de los Muertos?"}, "o": [{"A": "two days", "B": "November 1 and November 2"}, {"A": "one day", "B": "only October 31"}, {"A": "one week", "B": "the whole month of October"}, {"A": "one hour", "B": "one night in December"}], "hint": {"A": "Look for the numbers 1 and 2.", "B": "Read the first paragraph again."}}]}, {"title": {"A": "🕯️ The ofrenda", "B": "The ofrenda"}, "scene": "h_ofrenda", "items": [{"t": "p", "text": {"A": "Families build an altar in the house. It is called an ofrenda. They put photos 🖼️ of the dead person on it.", "B": "The center of the holiday is the ofrenda, the altar a family builds inside the house. It has levels, like steps. The family puts photographs of the people who died on it, and then the things those people loved: a favorite food, a bottle of soda, a guitar, a baseball, a pack of cigarettes."}}, {"t": "p", "text": {"A": "They put the person's favorite food 🍲. They put water 💧, because the spirit is thirsty. They put candles 🕯️. The candles show the way home.", "B": "There is water, because the spirit is thirsty after a long walk. There is salt. There are candles, one for each soul, to show the way."}}, {"t": "p", "text": {"A": "They put many orange flowers 🌼. In English they are marigolds. They smell strong. People say the dead follow the smell home.", "B": "And there are flowers — cempasúchil, the orange marigold. Families make a path of orange petals from the street to the altar. The color is loud and the smell is strong, and people say the dead follow it home."}}, {"t": "mc", "id": "mu2", "q": {"A": "Why is there water on the ofrenda?", "B": "Why do families put water on the ofrenda?"}, "o": [{"A": "The spirit is thirsty.", "B": "The spirit is thirsty after a long walk."}, {"A": "For the flowers.", "B": "To keep the flowers alive."}, {"A": "To clean the photo.", "B": "To clean the photographs."}, {"A": "For the cat.", "B": "For the family's pets."}], "hint": {"A": "Look for the word thirsty. 💧", "B": "Read the second paragraph of this part again."}}]}, {"title": {"A": "🍞 Bread and sugar skulls", "B": "Food and paper"}, "pic": "h_pan", "items": [{"t": "p", "text": {"A": "They eat a sweet bread. It is called pan de muerto 🍞. They make skulls from sugar 💀. They write a name on the skull.", "B": "The food is part of the language of the day: pan de muerto, a sweet bread with bones of dough on top, and sugar skulls with a name written on the forehead — sometimes the name of a living friend, as a joke. Papel picado, cut paper flags, move in the air above the table; people say the movement means the spirits are already in the room."}}]}, {"title": {"A": "🪦 At the cemetery", "B": "At the cemetery"}, "scene": "h_cemetery", "items": [{"t": "p", "text": {"A": "November 1 is for children who died. November 2 is for adults. Families go to the cemetery. They clean the grave. They put flowers on it.", "B": "November 1 is for the children who died. People call them angelitos, little angels. November 2 is for the adults. Families go to the cemetery, clean the graves, pull the weeds, paint the stone, put down flowers — and then they stay. They eat there. They play music. They tell stories about the dead person, including the embarrassing ones, and they laugh."}}, {"t": "p", "text": {"A": "Then they stay all night 🌙. They eat. They play music 🎶. They tell funny stories 😄. The day is not sad. It is a welcome.", "B": "This is the part that surprises visitors: it is not a sad day. The sadness is real, but the holiday is a welcome, not a funeral. Mexicans often say a person dies three times — when the body stops, when the body is buried, and when the last person says their name for the last time. Día de los Muertos exists to push that third death far away."}}, {"t": "p", "text": {"A": "Día de los Muertos is not \"Mexican Halloween.\" They are two different holidays.", "B": "It is also not \"Mexican Halloween.\" The dates are close and both have skeletons, but the two holidays came from different places and do different work. One says be afraid and then laugh. The other says come home, we cooked for you."}}, {"t": "mc", "id": "mu3", "q": {"A": "At the cemetery, families are…", "B": "How do families act at the cemetery?"}, "o": [{"A": "happy — they eat, sing, and tell stories", "B": "They stay, eat, play music, and laugh at stories."}, {"A": "quiet and afraid", "B": "They are quiet and afraid of ghosts."}, {"A": "there for five minutes", "B": "They leave after five minutes."}, {"A": "wearing Halloween costumes", "B": "They wear Halloween costumes."}], "hint": {"A": "Read the second paragraph again. 🎶", "B": "What do they do after they clean the graves?"}}]}, {"title": {"A": "✅ True or false?", "B": "True or false?"}, "items": [{"t": "tf", "id": "tfb1", "q": {"A": "Día de los Muertos is one day.", "B": "Día de los Muertos is only one day."}, "a": false, "hint": {"A": "Count the days. 1, 2…", "B": "Look at the dates again."}}, {"t": "tf", "id": "tfb2", "q": {"A": "Families put water on the altar for the spirit.", "B": "Families put water on the altar because the spirit is thirsty."}, "a": true, "hint": {"A": "Look at the ofrenda part. 💧", "B": "Read the ofrenda part again."}}, {"t": "tf", "id": "tfb3", "q": {"A": "Marigolds help the dead find the house.", "B": "Marigolds help the dead find the house."}, "a": true, "hint": {"A": "What do the dead follow? 🌼", "B": "What do the dead follow home?"}}, {"t": "tf", "id": "tfb4", "q": {"A": "Families are sad and quiet at the cemetery.", "B": "Families are quiet and sad at the cemetery."}, "a": false, "hint": {"A": "Do they play music? 🎶", "B": "Read the cemetery part again."}}, {"t": "tf", "id": "tfb5", "q": {"A": "The holiday comes from Mexico and from Spain.", "B": "The holiday comes from Indigenous Mexican traditions and Catholic traditions together."}, "a": true, "hint": {"A": "Look at part 1.", "B": "Read the first part again."}}]}]}, {"id": "origins", "emoji": "🏛️", "title": {"A": "Where it came from", "B": "Where Día de los Muertos came from"}, "art": "h_aztec", "dir": {"A": "Guess first. Then read. Then check your guess.", "B": "Make a guess first. Then read, find the evidence, and decide if your guess was right."}, "chunks": [{"title": {"A": "🤔 Guess first", "B": "Make a claim"}, "pic": "h_mix", "items": [{"t": "p", "text": {"A": "Long ago, the Spanish came to Mexico. They were Catholic ⛪. The people of Mexico had their own holiday for the dead. The two holidays mixed.", "B": "The Day of the Dead mixes an indigenous tradition with a Catholic one. The Spanish conquerors were Catholic."}}, {"t": "chips", "id": "or_claimpick", "q": {"A": "Guess: were the Spanish happy 😀 or angry 😠 about the mix?", "B": "Guess: were the conquerors happy or angry that the two traditions mixed?"}, "o": ["😀 happy", "😠 angry", "🤷 not sure"]}, {"t": "write", "id": "or_claim1", "q": {"A": "Why? Write one sentence.", "B": "Say why."}, "frame": {"A": "I think they were ___ because ___.", "B": "I think the conquerors were ______ because ______."}, "min": 4, "rows": 2}]}, {"title": {"A": "🏠 Long ago in Mexico", "B": "Before the Spanish came"}, "pic": "h_houses", "items": [{"t": "p", "text": {"A": "Long ago, the people of Mexico did not have cemeteries. They put the dead under their houses 🏠. The dead stayed close. This allowed for their veneration.", "B": "Most Mesoamerican peoples shared one idea about death. They did not have cemeteries the way we do now. Instead, they buried the dead directly under their homes. This kept the dead close and allowed for their veneration."}}, {"t": "p", "text": {"A": "The tombs were open. Families visited the dead often. They gave them gifts 🎁.", "B": "Because tombs were not sealed, people often visited the dead and regularly gave them offerings."}}, {"t": "mc", "id": "or_ven", "q": {"A": "Guess from the reading: veneration means…", "B": "Use context clues — do not translate. Veneration probably means…"}, "o": [{"A": "respect and honor ❤️", "B": "great respect and honor"}, {"A": "fear 😨", "B": "great fear"}, {"A": "cooking 🍲", "B": "cooking for the family"}, {"A": "forgetting", "B": "forgetting about someone"}], "hint": {"A": "The dead stayed close. Families visited and gave gifts. Is that love or fear?", "B": "The dead were kept close and given offerings. What feeling does that show?"}}, {"t": "mc", "id": "or_tomb", "q": {"A": "Guess: a tomb is…", "B": "Use context clues. A tomb is probably…"}, "o": [{"A": "a place for a dead body", "B": "a place where a dead body is kept"}, {"A": "a kitchen", "B": "a kitchen"}, {"A": "a school", "B": "a school"}, {"A": "a river", "B": "a river"}], "hint": {"A": "What is under the house?", "B": "What were the families visiting?"}}]}, {"title": {"A": "✨ Three souls", "B": "Three souls"}, "pic": "h_souls", "items": [{"t": "p", "text": {"A": "The Aztecs believed a person had three souls. A soul could go far away. Or it could stay and help the family 👨‍👩‍👧.", "B": "The Aztecs, one major group of Mesoamericans, believed that a person had three souls. Each soul could travel to an afterlife far away, or it could stay behind on Earth and give strength to its family. Part of a person could go, and part could stay to watch over the people they loved."}}, {"t": "p", "text": {"A": "The Aztecs left food for the dead 🍲. They burned incense. They made ofrendas. People still do these things today!", "B": "The Aztecs built many rituals to honor the souls who stayed. Many of them, such as leaving food for a dead relative, burning incense, and making an ofrenda, are still part of the Day of the Dead today."}}, {"t": "mc", "id": "or_souls", "q": {"A": "How many souls did the Aztecs believe a person has?", "B": "According to the Aztecs, how many souls does a person have?"}, "o": [{"A": "three", "B": "three"}, {"A": "one", "B": "one"}, {"A": "two", "B": "two"}, {"A": "ten", "B": "ten"}], "hint": {"A": "Look at the first sentence.", "B": "Read the first sentence again."}}]}, {"title": {"A": "⛪ + 🏛️ The mix", "B": "Mestizaje — mixing"}, "pic": "h_mix", "items": [{"t": "p", "text": {"A": "Then the Spanish came. They had two church days for the dead: November 1 and November 2. They told the people of Mexico: do your holiday on the same days. The two holidays mixed. In Spanish, mixing is called mestizaje.", "B": "The Spanish encouraged the indigenous peoples to practice their rituals for the dead on the same days as the Catholic holidays All Saints' Day and All Souls' Day, November 1 and 2. Through this, and in other ways, the two religions mixed, and the mixture became the rituals and pictures we see on the Day of the Dead. It is still changing today."}}, {"t": "mc", "id": "ev1", "q": {"A": "Which sentence shows what the Spanish wanted?", "B": "Which sentence is the best evidence for what the Spanish wanted?"}, "o": [{"A": "\"Do your holiday on the same days.\"", "B": "\"The Spanish encouraged the indigenous peoples to practice their rituals for the dead on the same days as the Catholic holidays.\""}, {"A": "\"They put the dead under their houses.\"", "B": "\"They buried the dead directly under their homes.\""}, {"A": "\"A person had three souls.\"", "B": "\"A person had three souls.\""}, {"A": "\"People still do these things today.\"", "B": "\"It is still changing today.\""}], "hint": {"A": "Which sentence talks about the Spanish? ⛪", "B": "Which sentence says what the Spanish did?"}}, {"t": "write", "id": "or_claim2", "q": {"A": "Look at your guess. Do you change it?", "B": "Look at your first claim. Do you still think the same thing? Why or why not?"}, "frame": {"A": "Now I think the Spanish were ___ because ___.", "B": "In my own words: ______. Now I think ______ because ______."}, "min": 5, "rows": 3}]}, {"title": {"A": "🇲🇽 Spanish words inside English", "B": "Spanish words inside English"}, "items": [{"t": "match", "id": "sp", "q": "", "hint": {"A": "Look at the readings again.", "B": "Look back at the readings."}, "pairs": [[{"A": "an offering on a table", "B": "an offering"}, "ofrenda"], [{"A": "the orange flower", "B": "flower of the dead (the marigold)"}, "flor de muertos"], [{"A": "cut paper flags", "B": "cut tissue-paper art"}, "papel picado"], [{"A": "the sweet bread", "B": "the special sweet bread"}, "pan de muerto"], [{"A": "mixing two cultures", "B": "the mixing of two cultures"}, "mestizaje"]]}]}]}, {"id": "compare", "emoji": "⚖️", "title": {"A": "Same and different", "B": "Put the two holidays side by side"}, "art": "h_venn", "dir": {"A": "Tap a card. Then tap Halloween, Both, or Día de los Muertos.", "B": "Sort each fact: Halloween only, both holidays, or Día de los Muertos only."}, "chunks": [{"title": {"A": "🎃 or 💀 or both?", "B": "Sort the facts"}, "pic": "h_venn", "items": [{"t": "sort", "id": "vn", "buckets": [{"A": "🎃 Halloween", "B": "Halloween only"}, {"A": "🎃💀 Both", "B": "Both"}, {"A": "💀 Día de los Muertos", "B": "Día de los Muertos only"}], "hint": {"A": "Read the card again. Is it October 31, November 1 and 2, or both? 📅", "B": "Think: only Halloween, only Día de los Muertos, or both?"}, "items": [[{"A": "October 31", "B": "on October 31"}, 0], [{"A": "November 1 and 2", "B": "on November 1 and 2"}, 2], [{"A": "skeletons and skulls 💀", "B": "skeletons and skulls"}, 1], [{"A": "candy at the door 🍬", "B": "children get candy at the door"}, 0], [{"A": "an ofrenda in the house", "B": "an ofrenda in the house"}, 2], [{"A": "marigolds 🌼", "B": "marigolds lead the dead home"}, 2], [{"A": "costumes 🎭", "B": "costumes and masks"}, 0], [{"A": "people think about the dead", "B": "people think about the dead"}, 1], [{"A": "it started long ago", "B": "it is more than 500 years old"}, 1], [{"A": "pumpkins 🎃", "B": "jack-o'-lanterns"}, 0]]}]}, {"title": {"A": "✍️ Your idea", "B": "Is it \"Mexican Halloween\"?"}, "pic": "h_grammar", "items": [{"t": "write", "id": "q_notmexhall", "q": {"A": "Is Día de los Muertos \"Mexican Halloween\"?", "B": "Some people call Día de los Muertos \"Mexican Halloween.\" Is that right? Use both and but."}, "frame": {"A": "No, because Halloween is ___, but Día de los Muertos is ___.", "B": "Both holidays ______, but ______."}, "bank": {"A": ["both", "but", "happy", "scary", "family", "candy", "November"], "B": ["both", "but", "while", "however", "similar to", "different from"]}, "min": 8, "rows": 3}]}]}, {"id": "world1", "emoji": "🌏", "title": {"A": "Around the world 1", "B": "Around the world: Asia"}, "art": "h_globe", "dir": {"A": "Read each card. Answer one question.", "B": "Almost every country has a day for the dead. Read each card, then answer its question."}, "chunks": [{"title": {"A": "Qingming · China 🇨🇳", "B": "Qingming — China 🇨🇳"}, "pic": "c_china", "items": [{"t": "p", "text": {"A": "In April, families go to the cemetery. They clean the graves 🧹. They bring food and tea. They burn paper money 💵 for the ancestors.", "B": "In early April, families go to the cemetery for Qingming — Tomb-Sweeping Day. They sweep the stone, pull the weeds, and set out food, tea, and rice wine. Then they burn paper money and paper houses so the ancestors have what they need on the other side. In the seventh lunar month, the gates open for the Hungry Ghost Festival, and people leave food outside for spirits who have no family left."}}, {"t": "mc", "id": "wc1", "q": {"A": "What do they burn for the ancestors?", "B": "What do families burn at Qingming, and why?"}, "o": [{"A": "paper money", "B": "paper money and paper houses, so the ancestors have what they need"}, {"A": "pumpkins", "B": "pumpkins, to scare the ghosts"}, {"A": "marigolds", "B": "marigolds, to show the way"}, {"A": "candy", "B": "candy, for the children"}], "hint": {"A": "Read the last sentence. 💵", "B": "Read the third sentence again."}}]}, {"title": {"A": "Đám giỗ and Vu Lan · Vietnam 🇻🇳", "B": "Đám giỗ and Vu Lan — Vietnam 🇻🇳"}, "pic": "c_vietnam", "items": [{"t": "p", "text": {"A": "Many homes have an ancestor altar. It has photos, fruit 🍊, and incense. On the day a person died, the family cooks their favorite food and eats together.", "B": "Most Vietnamese homes have a bàn thờ — an ancestor altar with photographs, fruit, and incense. On the death anniversary, đám giỗ, the family cooks the dead person's favorite dishes, invites every relative, and eats together in front of the altar. During Vu Lan, in the seventh lunar month, people burn paper clothes and give rice porridge to wandering souls."}}, {"t": "mc", "id": "wc2", "q": {"A": "What does the family do on đám giỗ?", "B": "What happens on đám giỗ?"}, "o": [{"A": "cook the person's favorite food", "B": "The family cooks the dead person's favorite dishes and eats together."}, {"A": "go trick-or-treating", "B": "Children go trick-or-treating."}, {"A": "fly a big kite", "B": "They fly a giant kite."}, {"A": "walk a cow", "B": "They walk a cow through the street."}], "hint": {"A": "Look for the word cooks. 🍲", "B": "Read the second sentence again."}}]}, {"title": {"A": "Obon · Japan 🇯🇵", "B": "Obon — Japan 🇯🇵"}, "pic": "c_japan", "items": [{"t": "p", "text": {"A": "In August, families clean the grave. They hang lanterns 🏮 to help the spirits come home. People dance in a circle 💃.", "B": "In August, families clean the family grave and hang lanterns to guide the spirits home. In the town square people dance bon odori in a circle. At the end of Obon, they float paper lanterns down a river — tōrō nagashi — to walk the spirits back out again."}}, {"t": "mc", "id": "wc3", "q": {"A": "Where do people dance?", "B": "How do people dance bon odori?"}, "o": [{"A": "in a circle", "B": "in a circle, in the town square"}, {"A": "in the cemetery", "B": "alone, in the cemetery"}, {"A": "on a boat", "B": "on a boat"}, {"A": "at school", "B": "in a line, at school"}], "hint": {"A": "Read the last sentence. 💃", "B": "Read the second sentence again."}}]}, {"title": {"A": "Chuseok · Korea 🇰🇷", "B": "Chuseok — Korea 🇰🇷"}, "pic": "c_korea", "items": [{"t": "p", "text": {"A": "At harvest time, families go home. They cut the grass on the graves. They set a table with rice, fruit, and fish for the ancestors. Then they eat rice cakes.", "B": "Chuseok comes at the harvest moon in September or October. Families travel home, cut the grass on their ancestors' graves, and set a table with the first rice, fruit, and fish of the year for the ancestors. This is called charye. Then everyone eats songpyeon — small rice cakes shaped like a half moon."}}, {"t": "mc", "id": "wc4", "q": {"A": "What do families do at the graves?", "B": "What do families do at their ancestors' graves on Chuseok?"}, "o": [{"A": "cut the grass", "B": "They cut the grass."}, {"A": "fly kites", "B": "They fly kites."}, {"A": "dance", "B": "They dance in a circle."}, {"A": "burn paper houses", "B": "They burn paper houses."}], "hint": {"A": "Read the second sentence. ✂️🌿", "B": "Read the second sentence again."}}]}, {"title": {"A": "Phi Ta Khon · Thailand 🇹🇭", "B": "Phi Ta Khon — Thailand 🇹🇭"}, "pic": "c_thailand", "items": [{"t": "p", "text": {"A": "In September, families bring food to the temple for their ancestors. In one town, young people wear tall masks 🎭. They dance and joke like ghosts.", "B": "In September, families carry food to the temple for their ancestors on Sat Thai, and make krayasat — a sticky sweet of rice, sesame, and peanuts. In the town of Dan Sai, the Phi Ta Khon festival fills the street with young people in tall painted masks made from rice steamers and coconut leaves. They dance and joke as the ghosts."}}, {"t": "mc", "id": "wc5", "q": {"A": "Where do families bring food?", "B": "Where do families carry food on Sat Thai?"}, "o": [{"A": "to the temple", "B": "to the temple"}, {"A": "to the river", "B": "to the river"}, {"A": "to school", "B": "to school"}, {"A": "to the beach", "B": "to the beach"}], "hint": {"A": "Read the first sentence. 🛕", "B": "Read the first sentence again."}}]}, {"title": {"A": "Undás · Philippines 🇵🇭", "B": "Undás — Philippines 🇵🇭"}, "pic": "c_philippines", "items": [{"t": "p", "text": {"A": "On November 1, families go to the cemetery. They bring food, chairs, and games 🃏. They stay all day and all night.", "B": "On November 1, families come to the cemetery with food, chairs, card games, and sometimes a tent, and stay the whole day and night with their dead. In some provinces an old custom called pangangaluluwa sends children to sing at the door in the voice of the souls, and the neighbors give them food or coins."}}, {"t": "mc", "id": "wc6", "q": {"A": "How long do families stay?", "B": "How long do families stay at the cemetery on Undás?"}, "o": [{"A": "all day and all night", "B": "the whole day and night"}, {"A": "five minutes", "B": "five minutes"}, {"A": "one hour", "B": "one hour"}, {"A": "one week", "B": "one week"}], "hint": {"A": "Read the last sentence. 🌙", "B": "Read the first sentence again."}}]}, {"title": {"A": "Gai Jatra · Nepal 🇳🇵", "B": "Gai Jatra — Nepal 🇳🇵"}, "pic": "c_nepal", "items": [{"t": "p", "text": {"A": "In August, families who lost someone walk a cow 🐄 in the street. Children wear costumes. The day is full of jokes 😄.", "B": "At Gai Jatra in August, every family that lost someone during the year walks a cow through the street, because the cow leads the soul. Children dress in costumes, and the whole day is full of comedy and jokes — the joke is the medicine. During Tihar, children go house to house singing Deusi and Bhailo, and every neighbor gives them sweets, fruit, and money."}}, {"t": "mc", "id": "wc7", "q": {"A": "Why do families walk a cow?", "B": "Why do families walk a cow at Gai Jatra?"}, "o": [{"A": "The cow leads the soul.", "B": "because the cow leads the soul"}, {"A": "The cow is hungry.", "B": "because the cow is hungry"}, {"A": "To sell it.", "B": "to sell it at the market"}, {"A": "For milk.", "B": "to get milk"}], "hint": {"A": "Look for the word because.", "B": "Look for the word because."}}]}]}, {"id": "world2", "emoji": "🌍", "title": {"A": "Around the world 2", "B": "Around the world: more countries"}, "art": "c_guatemala", "dir": {"A": "Read each card. Answer one question.", "B": "Read each card, then answer its question. Then write a card about your own country."}, "chunks": [{"title": {"A": "Pitru Paksha · India and Nepal 🇮🇳🇳🇵", "B": "Pitru Paksha — India and Nepal 🇮🇳🇳🇵"}, "pic": "c_india", "items": [{"t": "p", "text": {"A": "For sixteen days, Hindu families honor their ancestors. They give rice balls and water. They put food outside for the crows 🐦‍⬛.", "B": "For sixteen days in September or October, Hindu families honor their ancestors with offerings of rice balls, water, and sesame seeds. Many families cook the dead person's favorite food and put it outside for the crows, because people say crows carry the food to the ancestors. In Nepal, these days are called Sorha Shraddha."}}, {"t": "mc", "id": "wc8", "q": {"A": "How many days is Pitru Paksha?", "B": "How long does Pitru Paksha last?"}, "o": [{"A": "sixteen days", "B": "sixteen days"}, {"A": "one day", "B": "one day"}, {"A": "two days", "B": "two days"}, {"A": "one month", "B": "one month"}], "hint": {"A": "Read the first sentence. 🔢", "B": "Read the first sentence again."}}]}, {"title": {"A": "Shab-e-Barat · Pakistan 🇵🇰", "B": "Shab-e-Barat — Pakistan 🇵🇰"}, "pic": "c_pakistan", "items": [{"t": "p", "text": {"A": "On the Night of Forgiveness, many Muslim families visit graves and pray 🙏. At home they make sweets and share them with neighbors.", "B": "On the night of Shab-e-Barat, the Night of Forgiveness, many Muslim families in South Asia visit the graves of their relatives and pray for them. At home they cook halwa and other sweets and share them with neighbors and people who are poor. In many cities, children light candles and small fireworks."}}, {"t": "mc", "id": "wc9", "q": {"A": "Who do families share sweets with?", "B": "Who do families share halwa with?"}, "o": [{"A": "neighbors and poor people", "B": "neighbors and people who are poor"}, {"A": "only their cat", "B": "only their pets"}, {"A": "nobody", "B": "nobody — they eat it all"}, {"A": "the teacher", "B": "their teachers"}], "hint": {"A": "Read the second sentence. 🍮", "B": "Read the second sentence again."}}]}, {"title": {"A": "Eid and Garangao · Arab and Muslim countries 🌙", "B": "Eid and Garangao — Arab and Muslim countries 🌙"}, "pic": "c_qatar", "items": [{"t": "p", "text": {"A": "On Eid morning, many families go to the graves to pray. Children wear new clothes and get money and sweets. In Qatar, children go door to door with bags 🛍️.", "B": "On the morning of Eid, many families go first to the graves to pray for their dead, and then home to eat. Children wear new clothes and collect eidiya — money — and sweets from every adult they visit. In Qatar, Bahrain, Kuwait, and Oman, children go door to door in the middle of Ramadan on Garangao night with cloth bags, singing, and come home full of candy and nuts."}}, {"t": "mc", "id": "wc10", "q": {"A": "What do children get on Eid?", "B": "What is eidiya?"}, "o": [{"A": "money and sweets", "B": "money that children collect, with sweets"}, {"A": "pumpkins", "B": "a kind of pumpkin"}, {"A": "a cow", "B": "a cow costume"}, {"A": "a kite", "B": "a giant kite"}], "hint": {"A": "Read the second sentence. 💵🍬", "B": "Read the second sentence again."}}]}, {"title": {"A": "Radonitsa · Russia and Ukraine 🇷🇺🇺🇦", "B": "Radonitsa — Russia and Ukraine 🇷🇺🇺🇦"}, "pic": "c_russia", "items": [{"t": "p", "text": {"A": "After Easter, families go to the cemetery. They bring painted eggs 🥚 and sweet bread. They eat next to the grave.", "B": "Nine days after Orthodox Easter, families go to the cemetery with painted eggs and sweet Easter bread. They clean the grave, say \"Christ is risen\" to the dead, and eat a small meal next to them. Before they go home, they leave an egg or some bread on the grave. Radonitsa comes from the word for joy."}}, {"t": "mc", "id": "wc11", "q": {"A": "What do they leave on the grave?", "B": "What do families leave on the grave before they go home?"}, "o": [{"A": "an egg or some bread", "B": "an egg or some bread"}, {"A": "a pumpkin", "B": "a carved pumpkin"}, {"A": "a kite", "B": "a kite"}, {"A": "candy", "B": "a bag of candy"}], "hint": {"A": "Look for the word leave.", "B": "Read the fourth sentence again."}}]}, {"title": {"A": "Giant kites · Guatemala 🇬🇹", "B": "Giant kites — Guatemala 🇬🇹"}, "pic": "c_guatemala", "items": [{"t": "p", "text": {"A": "On November 1, people fly giant kites 🪁 in the cemetery. The kites carry messages to the dead.", "B": "On November 1 in Sumpango and Santiago Sacatepéquez, people spend months building barriletes gigantes — kites of paper and bamboo up to twenty meters across, painted with messages. They fly them in the cemetery, above the graves. The kite carries the message up, and the noise of the paper moves the spirits."}}, {"t": "mc", "id": "wc12", "q": {"A": "What do the kites carry?", "B": "What does the kite carry up?"}, "o": [{"A": "messages", "B": "the message"}, {"A": "candy", "B": "candy"}, {"A": "children", "B": "children"}, {"A": "water", "B": "water"}], "hint": {"A": "Read the last sentence. ✉️", "B": "Read the last sentence again."}}]}, {"title": {"A": "Fèt Gede · Haiti 🇭🇹", "B": "Fèt Gede — Haiti 🇭🇹"}, "pic": "c_haiti", "items": [{"t": "p", "text": {"A": "On November 1 and 2, people in Haiti go to the cemetery in black, purple, and white. They light candles. The spirits love jokes, so the day is loud and funny 😄.", "B": "On November 1 and 2, people in Haiti celebrate the Gede, the spirits of the dead. Crowds in black, purple, and white clothes walk to the cemetery. They clean graves, light candles, and bring food and drink. The Gede spirits love jokes, so the day is loud, funny, and full of dancing — even at the grave."}}, {"t": "mc", "id": "wc13", "q": {"A": "Why is the day loud and funny?", "B": "Why is Fèt Gede loud and funny?"}, "o": [{"A": "The spirits love jokes.", "B": "because the Gede spirits love jokes"}, {"A": "It is a birthday.", "B": "because it is a birthday"}, {"A": "It is a sports game.", "B": "because there is a sports game"}, {"A": "Everyone is angry.", "B": "because everyone is angry"}], "hint": {"A": "Look for the word so.", "B": "Look for the word so."}}]}, {"title": {"A": "✍️ Your country", "B": "A card about your country"}, "pic": "h_family", "items": [{"t": "write", "id": "qw4", "q": {"A": "Write a card about your country. 3 sentences.", "B": "Write a new card about your own country, like the ones above."}, "frame": {"A": "In ___, people ___. They ___. It is ___ (happy / sad).", "B": "In my country, ______. Families ______. The day feels ______ because ______."}, "min": 10, "rows": 4}]}]}, {"id": "grammar", "emoji": "✏️", "title": {"A": "Grammar", "B": "Grammar for talking about traditions"}, "art": "h_grammar", "dir": {"A": "Choose the right word.", "B": "Choose the right word. Read the rule box first."}, "chunks": [{"title": {"A": "Every year: people light / she lights", "B": "A. Simple present: what people do every year"}, "pic": "w_candle", "items": [{"t": "html", "html": {"A": "<div class=\"rulebox\">👨‍👩‍👧 people, they, we, I → <b>light</b><br>👩 she, he, my mother → <b>lights</b></div>", "B": "<div class=\"rulebox\">Traditions use the simple present. <b>I / you / we / they / people</b> → <b>light</b>. <b>He / she / it / my family</b> → <b>lights</b>.</div>"}}, {"t": "mc", "id": "ga1", "q": {"A": "Every year, people ___ candles. 🕯️", "B": "Every year, people ___ candles on the altar."}, "o": ["light", "lights", "lighting", "to light"], "hint": {"A": "people = many → no -s", "B": "People is plural: no -s."}}, {"t": "mc", "id": "ga2", "q": {"A": "My mother ___ pan de muerto. 🍞", "B": "My grandmother ___ pan de muerto every November."}, "o": ["makes", "make", "making", "to make"], "hint": {"A": "my mother = she → -s", "B": "My grandmother = she → add -s."}}, {"t": "mc", "id": "ga3", "q": {"A": "Children ___ costumes. 🎭", "B": "On October 31, children ___ costumes."}, "o": ["wear", "wears", "wearing", "to wear"], "hint": {"A": "children = many → no -s", "B": "Children is plural."}}, {"t": "mc", "id": "ga4", "q": {"A": "My family ___ the grave. 🧹", "B": "My family ___ the grave every April."}, "o": ["cleans", "clean", "cleaning", "to clean"], "hint": {"A": "my family = it → -s", "B": "My family is one group → -s."}}]}, {"t   writtenIds().forEach(function(x){ if(x.s === sid){ tot++; if(x.nums ? (ST.w[x.id] && ST.w[x.id].length) : words(ST.w[x.id]) >= x.min) done++; } });
  var scr = U.screens.filter(function(s){ return s.id === sid; })[0];
  SCORED.forEach(function(x){ if(x.s === sid && x.rec){ var r = (ST.extra.rec || {})[x.id.slice(4)]; if(r && r.ok) done++; } });
  if(scr && scr.doneWhen && ST.extra[scr.doneWhen]) { tot++; done++; }
  else if(scr && scr.doneWhen){ tot++; }
  if(tot === 0) return { done: ST.seen[sid] ? 1 : 0, tot: 1 };
  return { done: done, tot: tot };
}
function publishScore(){
  var s = score();
  window.GAL_SCORE = s.score; window.GAL_MAX = s.max;
  var p = $("prog"); if(p) p.style.width = (s.max ? Math.round(100 * s.score / s.max) : 0) + "%";
  var n = $("scoreNote"); if(n) n.textContent = s.score + " / " + s.max;

/* ---------- save / load (Supabase only — student work never goes to localStorage) ---------- */
var saving = false, lastScoreLogged = -1, saveTimer = null;
function setStatus(t, cls){ var e = $("saveNote"); if(e){ e.textContent = t; e.className = cls || ""; } }
function collect(){
  var p = {}; for(var k in oldPayload) p[k] = oldPayload[k];
  var s = score();
  ST.lvl = LVL;
  p.v2 = ST;
  p.meta = { score: s.score, max: s.max, first: s.first, level: LVL, lang: LANG,
             answered: Object.keys(ST.ans).filter(function(k){ return ST.ans[k].ok; }).length + Object.keys(ST.w).filter(function(k){ return words(ST.w[k]) > 0; }).length,
             total: SCORED.length + writtenIds().length,
             words: Object.keys(ST.w).reduce(function(a,k){ return a + words(ST.w[k]); }, 0) };
  return p;
}
function save(submit, cb){
  if(!student || !loaded) { if(cb) cb(false); return; }
  if(saving){ dirty = true; if(cb) cb(false); return; }
  saving = true; dirty = false; setStatus("Saving…", "wait");
  var pay = collect(), s = publishScore();
  var row = { email: student.email, student_name: student.name, period: student.period, guide_key: U.guide, lang: LANG,
              payload: pay, answered: pay.meta.answered, total: pay.meta.total, score: s.score, max_score: s.max,
              updated_at: new Date().toISOString() };
  if(submit){ row.submitted = true; row.submitted_at = new Date().toISOString(); ST.submitted = true; }
  fetch(SUPA_URL + "/rest/v1/" + TABLE + "?on_conflict=email,guide_key", { method:"POST", headers: hdr({ "Prefer":"resolution=merge-duplicates,return=minimal" }), body: JSON.stringify([row]) })
    .then(function(r){
      saving = false;
      if(!r.ok) throw new Error("save " + r.status);
      setStatus("Saved ✓", "ok");
      if(s.score !== lastScoreLogged && window.GAL_logAttempt){ lastScoreLogged = s.score; try{ window.GAL_logAttempt({ score: s.score, max: s.max }); }catch(e){} }
      if(cb) cb(true);
      if(dirty) queueSave();
    }).catch(function(){ saving = false; dirty = true; setStatus("Can't reach the server — your work is still here. Trying again…", "bad"); if(cb) cb(false); });
}
function queueSave(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(function(){ save(false); }, 2500); publishScore(); refreshTiles(); }
setInterval(function(){ if(dirty) save(false); }, 20000);

function altEmail(e){ var lp = e.split("@")[0]; return [lp + "@sfusd.edu", lp + "@s.sfusd.edu"]; }
function load(cb){
  var ems = altEmail(student.email);
  var u = SUPA_URL + "/rest/v1/" + TABLE + "?select=email,payload,updated_at&guide_key=eq." + encodeURIComponent(U.guide) + "&email=in.(" + ems.map(encodeURIComponent).join(",") + ")";
  setStatus("Loading your work…", "wait");
  fetch(u, { headers: hdr() }).then(function(r){ if(!r.ok) throw new Error("load " + r.status); return r.json(); }).then(function(rows){
    rows = rows || [];
    rows.sort(function(a,b){ return String(a.updated_at) < String(b.updated_at) ? -1 : 1; });
    oldPayload = {};
    var merged = fresh();
    rows.forEach(function(r){
      var p = r.payload || {};
      for(var k in p) if(k !== "v2") oldPayload[k] = p[k];
      var v = p.v2; if(!v) return;
      ["ans","ord","w","seen","extra"].forEach(function(k){ for(var x in (v[k]||{})) merged[k][x] = v[k][x]; });
      if(v.egg) merged.egg = v.egg; if(v.lvl) merged.lvl = v.lvl; if(v.submitted) merged.submitted = true;
    });
    ST = merged; LVL = ST.lvl || "A"; loaded = true;
    setStatus(rows.length ? "Welcome back ✓" : "Ready", "ok");
    if(rows.some(function(r){ return r.email !== student.email; })) dirty = true;
    cb();
  }).catch(function(){
    setStatus("Can't reach the server. Trying again in 20 seconds…", "bad");
    setTimeout(function(){ load(cb); }, 20000);
  });
}

/* ---------- sign-in ---------- */
function cleanMail(x){ return String(x||"").trim().toLowerCase(); }
function canon(e){ return cleanMail(e).split("@")[0] + "@sfusd.edu"; }
function signIn(){
  var name = $("gName").value.trim(), raw = cleanMail($("gEmail").value), per = $("gPeriod").value, lg = $("gLang").value, err = $("gErr");
  if(name.split(/\s+/).length < 2){ err.textContent = "Write your first and last name."; return; }
  if(!/^[^@\s]+@(s\.)?sfusd\.edu$/.test(raw)){ err.textContent = "Use your school email (it ends with sfusd.edu)."; return; }
  if(!per){ err.textContent = "Choose your class period."; return; }
  if(!lg){ err.textContent = "Choose your language."; return; }
  var em = canon(raw);
  student = { name: name, email: em, period: per };
  try{ localStorage.setItem(U.slug + "_student", JSON.stringify(student)); localStorage.setItem("gal_student_email", em); localStorage.setItem("vocab_lang", lg); }catch(e){}
  if(raw !== em) fetch(SUPA_URL + "/rest/v1/student_aliases?on_conflict=alias_email", { method:"POST", headers: hdr({ "Prefer":"resolution=merge-duplicates,return=minimal" }), body: JSON.stringify([{ alias_email: raw, email: em }]) }).catch(function(){});
  fetch(SUPA_URL + "/rest/v1/students?on_conflict=email", { method:"POST", headers: hdr({ "Prefer":"resolution=ignore-duplicates,return=minimal" }), body: JSON.stringify([{ email: em, name: name, period: per }]) }).catch(function(){});
  setLang(lg);
