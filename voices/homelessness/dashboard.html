function draw(){var R=rows();var h='<tr><th>Student</th><th>P</th><th>Lang</th><th>Level</th><th>Warm-up</th><th>Words</th><th>Voices</th><th>Decode</th><th>Whose idea</th><th>Opinions</th><th>Letter</th><th>Score</th><th>0\u20134</th><th>Updated</th></tr>';
  R.forEach(function(r,i){var a=r.answers||{};var L=a.letter||{};var s=r._s;var pct=Math.round(100*s/MAX);
   h+='<tr class="stu" data-i="'+i+'"><td><b>'+esc(r.name)+'</b><br><span class="muted">'+esc(r.email)+'</span></td><td>'+esc(r.period)+'</td><td>'+esc(r.lang||'')+'</td><td>'+esc(a.lvl||'')+'</td>'
    +'<td class="'+(a.warm?'full':'none')+'">'+(a.warm?'\u2713':'')+'</td>'+cell(cnt(a.w),12,misses(a,'w-'))+cell(cnt(a.vc),6,misses(a,'vc-'))+cell(cnt(a.dc),6,misses(a,'d-'))+cell(cnt(a.who),6,misses(a,'who-'))
    +'<td class="'+(opDone(a)?'full':'none')+'">'+(opDone(a)?'\u2713':Object.keys(a.op||{}).length+'/6')+'</td>'
    +'<td class="'+(L.turned?'full':'none')+'">'+(L.turned?'\u2713 '+wc(letterText(a))+' w':(L.to?'drafting':''))+'</td><td><b>'+s+'</b>/'+MAX+' ('+pct+'%)</td><td><b>'+band(pct)+'</b></td><td class="muted">'+esc(String(r.updated_at||'').slice(5,16).replace('T',' '))+'</td></tr>';});
  $('tbl').innerHTML=h;var turned=R.filter(function(r){return r.answers&&r.answers.letter&&r.answers.letter.turned;}).length;
  $('stats').textContent=R.length+' students \u00B7 '+turned+' letters turned in \u00B7 a student signed in with both email spellings shows as one row. Tap a row for details.';
  [].forEach.call(document.querySelectorAll('tr.stu'),function(tr){tr.onclick=function(){detail(R[+tr.dataset.i]);};});
  wall(R);ops(R);hard(R);}
function detail(r){var a=r.answers||{};var d=$('det');var ms=[];for(var k in (a.miss||{}))if((a.miss[k]||[]).length)ms.push(k+': '+a.miss[k].join(', '));
  d.style.display='block';d.innerHTML='<h3>'+esc(r.name)+' \u00B7 P'+esc(r.period)+'</h3><p><b>Warm-up pick:</b> '+esc(a.warm||'\u2014')+'</p><p><b>Favorite idea:</b> '+esc(a.fav&&a.fav.id?VBY[a.fav.id].name:'\u2014')+' \u2014 '+esc(a.fav?a.fav.because:'')+'</p>'
   +'<p><b>Opinions:</b> '+VOICES.map(function(v){return esc(v.name)+': '+((a.op||{})[v.id]||'\u2014');}).join(' \u00B7 ')+'</p><p><b>Wrong first picks</b> (kept for you; the student never saw the answer):</p><div class="detail muted">'+esc(ms.join('\n')||'none')+'</div>'
   +'<p><b>Letter</b> '+(a.letter&&a.letter.to?'to '+esc(VBY[a.letter.to].name):'')+':</p><div class="letter">'+esc(letterText(a)||(a.letter&&a.letter.mode==='free'?a.letter.free:'')||'\u2014')+'</div>'
   +(a.browserTr?'<p class="miss">Browser translation was switched on during this session.</p>':'');d.scrollIntoView({behavior:'smooth'});}
function wall(R){var h='';R.forEach(function(r){var a=r.answers||{};var L=a.letter||{};if(!L.turned)return;var v=VBY[L.to]||{};var nm=String(r.name||'').split(' ');
  h+='<div class="letter"><b>To the Editor:</b><p class="re">Re: '+esc(v.name||'')+'</p><p>'+esc(letterText(a))+'</p><p class="sig">'+esc(nm[0]+' '+(nm[1]||'').charAt(0)+'.')+' \u00B7 Period '+esc(r.period)+'</p></div>';});
  $('wall').innerHTML=h||'<div class="box">No letters turned in yet for this period.</div>';}
function ops(R){var h='<h3>What the class thinks</h3><p class="muted">\uD83D\uDC4D convincing \u00B7 \uD83E\uDD14 not sure \u00B7 \uD83D\uDC4E not convincing. Good for a projector discussion: no names.</p>';
  VOICES.forEach(function(v){var c={yes:0,maybe:0,no:0},fav=0;R.forEach(function(r){var a=r.answers||{};var o=(a.op||{})[v.id];if(o)c[o]++;if(a.fav&&a.fav.id===v.id)fav++;});var t=c.yes+c.maybe+c.no||1;
   h+='<p><b>'+esc(v.side)+'</b> <span class="muted">('+esc(v.name)+' \u00B7 favorite of '+fav+')</span></p><div class="obar">'+(c.yes?'<span style="width:'+(100*c.yes/t)+'%;background:#1f7a45">\uD83D\uDC4D '+c.yes+'</span>':'')+(c.maybe?'<span style="width:'+(100*c.maybe/t)+'%;background:#a8701f">\uD83E\uDD14 '+c.maybe+'</span>':'')+(c.no?'<span style="width:'+(100*c.no/t)+'%;background:#b3261e">\uD83D\uDC4E '+c.no+'</span>':'')+'</div>';});
  var w={};R.forEach(function(r){var x=(r.answers||{}).warm;if(x)w[x]=(w[x]||0)+1;});h+='<h3>Warm-up: \u201cYou are the mayor. What do you do first?\u201d</h3><p>'+(['shelters','homes','rent','police'].map(function(k){return k+': <b>'+(w[k]||0)+'</b>';}).join(' \u00B7 '))+'</p>';
  $('ops').innerHTML=h;}
function hard(R){var m={};R.forEach(function(r){var a=r.answers||{};for(var k in (a.miss||{})){var n=(a.miss[k]||[]).length;if(n){m[k]=m[k]||{n:0,s:0};m[k].n+=n;m[k].s++;}}});
  var ks=Object.keys(m).sort(function(a,b){return m[b].s-m[a].s;});
  $('hard').innerHTML='<h3>Items students missed first</h3><table><tr><th>Item</th><th>Students who missed it first</th><th>Total wrong picks</th></tr>'+ks.map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+m[k].s+'</td><td>'+m[k].n+'</td></tr>';}).join('')+'</table>';}
</script>
