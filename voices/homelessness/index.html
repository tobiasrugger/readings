<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>window.SG_TABLES=['voices_work'];</script>
<script src="/readings/saveguard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Answers Whom? Homelessness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Source+Serif+4:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#26313f;--bg:#efe9dd;--paper:#fff;--good:#1f7a45;--bad:#b3261e;--accent:#3f6b8a;--muted:#5a6470}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
button{font-family:inherit}
.muted{color:var(--muted);font-weight:600}
/* gate */
#gate{position:fixed;inset:0;background:#2c3a4d;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:auto}
#gate form{background:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 #111;border-radius:16px;padding:22px;max-width:440px;width:100%}
#gate h1{margin:0 0 4px;font-size:26px}
#gate label{display:block;font-weight:800;margin-top:10px;font-size:16px}
#gate input,#gate select{width:100%;font:inherit;font-size:17px;padding:9px 11px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:#111}
#gate button{margin-top:16px;width:100%;font-size:19px;font-weight:900;padding:12px;border-radius:12px;border:2px solid var(--ink);background:#1f7a45;color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
#gmsg{color:var(--bad);font-weight:800;min-height:22px;margin-top:8px}
.gpic{border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:10px}
/* top bar */
#top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.12);padding:8px 12px}
.trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.trow h1{font-size:19px;margin:0;font-weight:900;flex:1;min-width:180px}
#who,#saved{font-size:14px;font-weight:700;color:var(--muted)}
#langSel{font:inherit;font-size:15px;padding:5px 8px;border:2px solid var(--ink);border-radius:9px;background:#fff;color:#111}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--ink);background:#f6f2e8;border-radius:999px;padding:5px 12px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink)}
.chip small{font-weight:900;margin-left:2px}
.chip.on{background:var(--ink);color:#fff}
.chip.full{background:#d7efdc;border-color:var(--good)}.chip.full.on{background:var(--good);color:#fff}
.chip.next{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,.8)}50%{box-shadow:0 0 0 7px rgba(217,164,65,0)}}
.pwrap{height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin-top:8px;overflow:hidden;position:relative}
#pbar{height:100%;background:linear-gradient(90deg,#3f8a5a,#5fae6a);width:0;transition:width .3s}
#ptxt{font-size:12px;font-weight:800}
#srvbar{display:none;background:#b3261e;color:#fff;font-weight:900;padding:10px 14px;text-align:center;border-bottom:3px solid #6b120d}
main{max-width:980px;margin:0 auto;padding:14px 12px 80px}
/* boxes */
.box{display:flow-root;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:14px;padding:14px 16px;margin:0 0 18px}
.box h2{margin:2px 0 8px;font-size:24px;font-weight:900}
.box h3{margin:2px 0 8px;font-size:20px;font-weight:900}
.panel{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:14px;overflow:hidden;margin-bottom:18px;background:#fff;line-height:0}
.panel svg{width:100%;height:auto;display:block}
.pic{float:right;width:min(42%,320px);margin:0 0 10px 14px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;line-height:0}
.pic.sm{width:min(34%,220px)}.pic.xs{width:min(30%,150px)}
.pic svg{width:100%;height:auto;display:block}
.dir{background:#fff7dc;border:2px solid #8a6a1f;border-radius:10px;padding:7px 10px;margin:6px 0 10px;font-weight:700;font-size:16px}
.dtr{font-weight:600;color:#5b4a14;margin-top:3px;font-size:16px}
.read{font-size:19px;line-height:1.65;margin:8px 0}
.say{border:2px solid var(--ink);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;padding:1px 5px;vertical-align:middle;line-height:1.2}
.say.sm{font-size:13px}
.w{border-bottom:3px dotted #c4702b;cursor:pointer;font-weight:700}
.w.kw{color:#9a4a12}
.pn{display:inline-block;min-width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;text-align:center;font-size:13px;font-weight:900;line-height:20px;margin-right:6px;background:#f6f2e8}
/* options */
.opts{display:grid;gap:8px;margin:8px 0}
.opt{text-align:left;border:2px solid var(--ink);background:#fff;border-radius:11px;padding:10px 12px;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.opt:hover:not([disabled]){background:#fff7dc}
.opt.ok{background:#d7efdc;border-color:var(--good);color:#0f4d2a}
.opt.no{background:#fbe1de;border-color:var(--bad);color:#7a1a14;opacity:.8}
.opt .mk{float:right;font-size:20px}
.fb{min-height:6px;font-weight:800}
.good{color:var(--good)}
.lionq{display:inline-block;background:#fff3e0;border:2px solid #b0701f;border-radius:10px;padding:4px 10px;margin-top:4px}
.hint{margin-top:6px;background:#eef5ff;border:2px solid #2c5f9e;border-radius:10px;padding:6px 10px;font-weight:700}
.think{color:#4a3a8a}
.big{border:2px solid var(--ink);background:#1f7a45;color:#fff;font-weight:900;font-size:18px;border-radius:12px;padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.sm2{border:2px solid var(--ink);background:#fff;font-weight:800;font-size:16px;border-radius:10px;padding:8px 14px;cursor:pointer}
.foot{text-align:right;margin:4px 0 20px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin:10px 0 18px;flex-wrap:wrap}
.qnav .big{margin-left:auto}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:18px}
.wcard{margin:0;padding:10px}
.wpic{border:2px solid var(--ink);border-radius:9px;overflow:hidden;line-height:0;margin-bottom:8px}.wpic svg{width:100%;height:auto}
.wword{font-size:23px}
.wtr{min-height:22px;margin:4px 0}
.eq{text-decoration:underline;font-size:18px}.eq.grey{color:#777}.trm{color:#555;font-size:15px}
.wsent{font-size:16px;color:#333}
.qpic{width:min(320px,100%);border:2px solid var(--ink);border-radius:10px;overflow:hidden;line-height:0;margin:6px 0}.qpic svg{width:100%;height:auto}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:900;cursor:pointer}
.dot.d{background:#d7efdc;border-color:var(--good)}.dot.cur{outline:3px solid #d9a441}
/* voices */
.mapwrap{border:2px solid var(--ink);border-radius:10px;background:#f8f6f0;overflow-x:auto}
.tmap{width:100%;min-width:560px;height:auto;display:block}
.lvl{display:inline-flex;border:2px solid var(--ink);border-radius:11px;overflow:hidden;margin-top:10px}
.lvl button{border:0;background:#fff;font-weight:900;font-size:16px;padding:7px 14px;cursor:pointer}
.lvl button.on{background:var(--ink);color:#fff}
.vhead{margin-bottom:6px}
.vk{display:inline-block;color:#fff;font-weight:900;font-size:13px;border-radius:7px;padding:2px 8px;margin-bottom:4px}
.vn{font-size:24px}
.vm{color:var(--muted);font-weight:700;font-size:15px}
.vans{font-weight:800;margin-top:4px}
.vtitle{font-family:'Source Serif 4',serif;font-style:italic;font-size:18px;margin-top:4px}
.inside .mini{display:flow-root;border:2px solid var(--ink);border-radius:11px;padding:8px 10px;margin:8px 0;background:#fbfaf6}
.inside .mini p{margin:4px 0 0}
blockquote{font-family:'Source Serif 4',Georgia,serif;font-size:22px;line-height:1.45;margin:8px 0;padding:10px 14px;border-left:6px solid var(--ink);background:#f6f2e8;border-radius:0 10px 10px 0}
.ctx{margin:6px 0;font-weight:700}
.qq{margin:10px 0 4px}
/* sides */
.idea{position:relative;padding-left:58px}
.inum{position:absolute;left:12px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;text-align:center;line-height:34px}
.itext{font-size:20px;font-weight:800;margin:4px 0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.thumb{color:var(--ink);border:3px solid var(--c);background:#fff;border-radius:11px;padding:4px;cursor:pointer;position:relative;text-align:center}
.thumb .tp{display:block;line-height:0;border-radius:7px;overflow:hidden}.thumb svg{width:100%;height:auto}
.thumb .tn{display:block;font-weight:800;font-size:14px;margin-top:3px}
.thumb[disabled]{color:var(--ink);cursor:default}.thumb.ok{background:#d7efdc;outline:3px solid var(--good)}.thumb.no{opacity:.55;background:#fbe1de}
.thumb .mk{position:absolute;top:4px;right:6px;font-size:22px;background:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;border:2px solid var(--ink)}
.thumb.ok .mk{color:var(--good)}.thumb.no .mk{color:var(--bad)}
.ops{display:flex;gap:8px;flex-wrap:wrap}
.opb{border:2px solid var(--ink);background:#fff;border-radius:11px;padding:8px 12px;font-weight:800;font-size:16px;cursor:pointer}
.opb.on{background:#e7defa;border-color:#4a3a8a}
select#favsel,.frame select{font:inherit;font-size:16px;padding:8px;border:2px solid var(--ink);border-radius:10px;max-width:100%;background:#fff;color:#111}
textarea{width:100%;font:inherit;font-size:17px;padding:10px;border:2px solid var(--ink);border-radius:10px;resize:vertical;min-height:58px}
.lab{display:block;font-weight:800;margin:10px 0 4px}
.count{font-weight:800;margin-top:6px}
details.help{margin-top:8px;border:2px dashed #8a6a1f;border-radius:10px;padding:6px 10px;background:#fffdf4}
details.help summary{cursor:pointer;font-weight:800}
.paper{background:#fffdf6;border:2px solid var(--ink);border-radius:8px;padding:16px 18px;font-family:'Source Serif 4',Georgia,serif;font-size:19px;line-height:1.6;margin:8px 0 12px}
.paper .re{font-style:italic;color:#444}.paper .sig{margin-bottom:0}
/* pop */
#pop{display:none;position:absolute;z-index:40;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:13px;padding:10px 12px;width:min(320px,92vw)}
#pop .x{position:absolute;right:6px;top:6px;border:2px solid var(--ink);background:#fff;border-radius:8px;cursor:pointer;font-weight:900}
#pop .ppic{border:2px solid var(--ink);border-radius:9px;overflow:hidden;line-height:0;margin:18px 0 6px}#pop .ppic svg{width:100%;height:auto}
#pop .pw b{font-size:21px}
.ptr{margin-top:6px}
#fw{display:none;position:fixed;inset:0;pointer-events:none;z-index:60}
#fw i{position:absolute;width:9px;height:9px;border-radius:50%;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
ul.tlist{display:none;list-style:none;padding:0;margin:8px 0 0}ul.tlist li{margin:6px 0}ul.tlist .tnode{width:100%;text-align:left;border:3px solid;border-radius:10px;background:#fff;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--ink)}
#canary{position:absolute;left:-9999px}
@media (max-width:620px){.mapwrap .tmap{display:none}.mapwrap{border:0;background:none}#chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chip{white-space:nowrap}ul.tlist{display:block}.trow h1{font-size:16px}body{font-size:17px}.pic{width:46%}.pic.sm{width:40%}.box{padding:12px}.box h2{font-size:21px}.read{font-size:18px}.idea{padding-left:14px}.inum{position:static;margin-bottom:6px}blockquote{font-size:19px}}
</style>
</head>
<body>
<span id="canary" aria-hidden="true">Reading</span>
<div id="gate">
 <form id="gform" autocomplete="on">
  <div class="gpic" id="gpic"></div>
  <h1>Who answers whom?</h1>
  <div class="muted">Homelessness: six voices and your letter back</div>
  <label for="gfirst">First name</label><input id="gfirst" autocomplete="given-name">
  <label for="glast">Last name</label><input id="glast" autocomplete="family-name">
  <label for="gemail">School email</label><input id="gemail" type="email" placeholder="name@s.sfusd.edu" autocomplete="email">
  <label for="gper">Period</label><select id="gper"><option value="">Choose…</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
  <label for="galStdLang">Your language / Tu idioma / 你的语言 / لغتك</label><select id="galStdLang" translate="no"></select>
  <button type="submit" id="gstart">Start</button>
  <div id="gmsg"></div>
 </form>
</div>
<div id="app" style="display:none">
 <div id="top">
  <div class="trow"><h1>Who answers whom? · Homelessness</h1><span id="who"></span><span id="saved"></span><select id="langSel" translate="no" aria-label="Language"></select></div>
  <div id="chips"></div>
  <div class="trow" style="gap:8px"><div class="pwrap" style="flex:1"><div id="pbar"></div></div><span id="ptxt"></span></div>
 </div>
 <div id="srvbar" role="alert"></div>
 <main id="screen"></main>
</div>
<div id="pop" translate="no"></div>
<div id="fw"></div>
<script>
/* ===== ART: original layered flat SVG, muted palette. No words in pictures that answer a question. ===== */
var INK='#26313f';
function S(w,h,body,label){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+(label||'')+'" xmlns="http://www.w3.org/2000/svg">'+body+'</svg>';}
function sky(w,h,a,b){return '<defs><linearGradient id="sk'+a.slice(1)+b.slice(1)+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="'+w+'" height="'+h+'" fill="url(#sk'+a.slice(1)+b.slice(1)+')"/>';}
function mountains(w,y,c1,c2){return '<path d="M0 '+y+' L'+(w*.12)+' '+(y-38)+' L'+(w*.2)+' '+(y-22)+' L'+(w*.34)+' '+(y-58)+' L'+(w*.46)+' '+(y-30)+' L'+(w*.6)+' '+(y-64)+' L'+(w*.74)+' '+(y-26)+' L'+(w*.88)+' '+(y-48)+' L'+w+' '+(y-20)+' L'+w+' '+(y+10)+' L0 '+(y+10)+'Z" fill="'+c1+'"/>'
 +'<path d="M'+(w*.34)+' '+(y-58)+' L'+(w*.31)+' '+(y-46)+' L'+(w*.335)+' '+(y-48)+' L'+(w*.355)+' '+(y-44)+' L'+(w*.37)+' '+(y-50)+'Z M'+(w*.6)+' '+(y-64)+' L'+(w*.565)+' '+(y-50)+' L'+(w*.59)+' '+(y-52)+' L'+(w*.61)+' '+(y-47)+' L'+(w*.635)+' '+(y-54)+'Z M'+(w*.88)+' '+(y-48)+' L'+(w*.86)+' '+(y-40)+' L'+(w*.885)+' '+(y-41)+' L'+(w*.9)+' '+(y-38)+'Z" fill="'+c2+'"/>';}
function grain(x,y,w,h,c,n){var s='',r=7;for(var i=0;i<n;i++){r=(r*9301+49297)%233280;var px=x+(r/233280)*w;r=(r*9301+49297)%233280;var py=y+(r/233280)*h;s+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+(0.6+(i%3)*0.4)+'" fill="'+c+'"/>';}return s;}
function tinyHouse(x,y,wall,trim,door,n){
 return '<g transform="translate('+x+' '+y+')">'
 +'<rect x="0" y="22" width="70" height="56" fill="'+wall+'" stroke="'+INK+'" stroke-width="1.5"/>'
 +'<path d="M-6 24 L35 0 L76 24 Z" fill="'+trim+'" stroke="'+INK+'" stroke-width="1.5"/>'
 +'<path d="M2 30 H68 M2 40 H68 M2 50 H68 M2 60 H68 M2 70 H68" stroke="#000" stroke-opacity=".08"/>'
 +'<rect x="8" y="40" width="20" height="38" fill="'+door+'" stroke="'+INK+'" stroke-width="1.3"/><circle cx="24" cy="60" r="1.6" fill="#e7c76a"/>'
 +'<rect x="11" y="44" width="14" height="9" fill="#cfe3ef" stroke="'+INK+'" stroke-width=".8"/>'
 +'<rect x="38" y="36" width="22" height="18" fill="#cfe3ef" stroke="'+INK+'" stroke-width="1.3"/><path d="M49 36 V54 M38 45 H60" stroke="'+INK+'" stroke-width=".9"/>'
 +'<rect x="31" y="36" width="6" height="18" fill="#b9733f" stroke="'+INK+'" stroke-width=".8"/><path d="M32 38 L36 52" stroke="#7a4a26" stroke-width=".8"/>'
 +'<rect x="-4" y="78" width="40" height="5" fill="#9aa3ad" stroke="'+INK+'" stroke-width="1"/>'
 +'<path d="M36 78 h10 v5 h-10 M40 83 v6 h12 v-6" fill="#b98a55" stroke="'+INK+'" stroke-width="1"/>'
 +'<rect x="52" y="64" width="9" height="9" fill="#2f3a46"/><text x="56.5" y="71" font-size="6" fill="#fff" text-anchor="middle" font-family="Nunito,sans-serif">'+n+'</text>'
 +'</g>';}
var ART={};
/* ---- opening scene: a village of tiny homes under the mountains (lion hidden on a roof) ---- */
ART.scene=function(){return S(640,250,
 sky(640,250,'#b9d3e3','#eef3ef')
 +'<circle cx="560" cy="44" r="20" fill="#f5dc95"/><circle cx="560" cy="44" r="28" fill="#f5dc95" opacity=".25"/>'
 +'<path d="M70 50 q12 -10 26 0 q14 -8 22 4 h-48z M300 34 q10 -8 22 0 q12 -6 18 4 h-40z" fill="#fff" opacity=".85"/>'
 +mountains(640,128,'#8ea2b3','#f4f7fa')
 +'<rect x="20" y="70" width="110" height="80" fill="#a9adb2" stroke="'+INK+'" stroke-width="1.4"/>'
 +(function(){var s='';for(var r=0;r<3;r++)for(var c=0;c<5;c++)s+='<rect x="'+(28+c*20)+'" y="'+(78+r*22)+'" width="12" height="14" fill="'+((r+c)%3?'#d8e3ea':'#f1d48c')+'" stroke="'+INK+'" stroke-width=".7"/>';return s;})()
 +'<rect x="520" y="62" width="110" height="88" fill="#bfb6a6" stroke="'+INK+'" stroke-width="1.4"/>'
 +(function(){var s='';for(var r=0;r<3;r++)for(var c=0;c<4;c++)s+='<rect x="'+(530+c*25)+'" y="'+(70+r*25)+'" width="14" height="16" fill="'+((r*c)%2?'#f1d48c':'#d8e3ea')+'" stroke="'+INK+'" stroke-width=".7"/>';return s;})()
 +'<rect x="0" y="150" width="640" height="100" fill="#c9bfae"/>'+grain(0,152,640,96,'#9c907c',260)
 +tinyHouse(60,92,'#7a8f6e','#4b5a63','#efe6d4','38')
 +tinyHouse(190,96,'#9b4f3e','#3f4a55','#f6efe2','39')
 +tinyHouse(330,94,'#3f6b8a','#2f3a46','#f7f2e6','40')
 +tinyHouse(462,98,'#c9a24a','#4b5a63','#efe6d4','41')

/* ---------- answer order: shuffled once, stored per student; right answer never in the same slot 4 times running ---------- */
var GROUP_LAST={};
function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function orderFor(qid,right,others,group){if(ST.ord[qid])return ST.ord[qid];var g=GROUP_LAST[group]||[];var o,tries=0;
  do{o=shuffled([right].concat(others));tries++;}while(tries<30&&g.length>=3&&g.slice(-3).every(function(p){return p===o.indexOf(right);}));
  ST.ord[qid]=o;(GROUP_LAST[group]=GROUP_LAST[group]||[]).push(o.indexOf(right));DIRTY=true;return o;}
function noteGroup(group,qid,right){(GROUP_LAST[group]=GROUP_LAST[group]||[]).push(ST.ord[qid].indexOf(right));}
function pickOthers(seed,pool,n){var a=shuffled(pool);return a.slice(0,n);}

function letterText(){var L=ST.letter,v=VBY[L.to];if(!v)return '';if(L.mode==='free')return L.free;var f=L.f;
  var st={agree:'I agree with',disagree:'I disagree with',partly:'I partly agree with'}[f.stance]||'';
  return [v.name+' says that '+(f.say||'___')+'.',(st?st+' '+(v.id==='whitehouse'?'this plan':(v.name.split(' ').pop()))+' because '+(f.because||'___')+'.':''),'In San Francisco, I see '+(f.see||'___')+'.','So I think cities should '+(f.should||'___')+'.'].filter(Boolean).join(' ');}
function letterWords(){var L=ST.letter;if(L.mode==='free')return wc(L.free);var f=L.f;return wc([f.say,f.because,f.see,f.should].join(' '))+(L.to?6:0);}
function rWrite(){var L=ST.letter;var v=VBY[L.to];
  var h='<div class="box">'+pic('write')+'<h2>'+sp('Write back')+' Write back: your letter to the editor</h2>'+dir('Newspapers print letters from readers. Write one. Answer ONE writer by name. Your letter goes on the class wall.')
   +'<p class="qq">'+sp('Step 1. Who are you answering?')+' <b>Step 1. Who are you answering?</b></p>'+thumbs('data-to',L.to)+'</div>';
  if(!v)return h;
  h+='<div class="box"><p class="qq">'+sp('Step 2. How do you want to write?')+' <b>Step 2. How do you want to write?</b> <span class="muted">(both count the same)</span></p><div class="lvl"><button type="button" class="'+(L.mode==='frame'?'on':'')+'" data-mode="frame">With sentence frames</button><button type="button" class="'+(L.mode==='free'?'on':'')+'" data-mode="free">On my own</button></div>';
  if(L.mode==='frame'){h+='<div class="frame" translate="no">'
    +'<label class="lab">'+esc(v.name)+' says that \u2026 <span class="muted">(their idea, in your own words)</span></label><textarea data-f="say" rows="2">'+esc(L.f.say)+'</textarea>'
    +'<label class="lab">I \u2026</label><select data-f="stance"><option value="">choose\u2026</option><option value="agree"'+(L.f.stance==='agree'?' selected':'')+'>agree</option><option value="disagree"'+(L.f.stance==='disagree'?' selected':'')+'>disagree</option><option value="partly"'+(L.f.stance==='partly'?' selected':'')+'>partly agree</option></select>'
    +'<label class="lab">\u2026 because \u2026</label><textarea data-f="because" rows="2">'+esc(L.f.because)+'</textarea>'
    +'<label class="lab">In San Francisco, I see \u2026 <span class="muted">(what you notice in the city \u2014 not your private life)</span></label><textarea data-f="see" rows="2">'+esc(L.f.see)+'</textarea>'
    +'<label class="lab">So I think cities should \u2026</label><textarea data-f="should" rows="2">'+esc(L.f.should)+'</textarea></div>';}
  else{h+='<label class="lab">To the Editor:</label><textarea id="freebox" rows="9" translate="no">'+esc(L.free)+'</textarea>'
    +'<details class="help"><summary>See sentence starters</summary><p translate="no">In \u201c'+esc(v.title||'his essay')+'\u201d \u2026 / '+esc(v.name)+' argues that \u2026 / I agree that \u2026, but \u2026 / One thing '+esc(v.name.split(' ')[0])+' forgets is \u2026 / In San Francisco, \u2026 / For example, \u2026 / That is why cities should \u2026</p></details>';}
  h+='<div class="count" id="lcount"></div></div>';
  h+='<div class="box letter"><h3>'+sp('Your letter')+' Your letter</h3><div class="paper" translate="no"><b>To the Editor:</b><p class="re">Re: '+esc(v.name)+(v.title?', '+esc(v.title):'')+'</p><p id="lbody">'+esc(letterText())+'</p><p class="sig">'+esc(ME?ME.first+' '+(ME.last||'').charAt(0)+'.':'')+'<br>Galileo Academy, San Francisco</p></div>'
   +'<button type="button" class="big" id="turnin">'+(L.turned?'\u2713 On the class wall \u2014 send my changes':'Turn in \u2014 put it on the class wall')+'</button><div class="fb" id="tfb">'+(L.turned?'<span class="good">\u2713 Turned in. Mr. Toby can show it on the projector.</span>':'')+'</div></div>';
  return h;}
function countLetter(){var n=letterWords();var c=$('lcount');if(c)c.innerHTML='<b>'+n+'</b> words '+(n>=40?'<span class="good">\u2713 ready to turn in</span>':'\u00B7 at least 40 to turn in');var b=$('lbody');if(b)b.textContent=letterText();}

/* ---------- events ---------- */
function bindScreen(){countLetter();var fc=$('favcount');if(fc)fc.textContent=wc(ST.fav.because)+' words'+(wc(ST.fav.because)>=8?' \u2713':' \u00B7 at least 8');}
document.addEventListener('click',function(e){var t=e.target.closest('button,.w,.tnode,#lion');if(!t){var p=$('pop');if(p&&!e.target.closest('#pop'))p.style.display='none';return;}
  if(t.id==='lion'||t.closest&&t.closest('#lion')){ST.lion=true;mark();boom();return;}
  if(t.classList.contains('w')){openPop(t);return;}
  if(t.classList.contains('x')){$('pop').style.display='none';return;}
  if(t.hasAttribute('data-say')){speak(t.getAttribute('data-say'),t.classList.contains('slow')?0.7:0.9);return;}
  if(t.classList.contains('tnode')){ST.vi=VOICES.map(function(v){return v.id;}).indexOf(t.getAttribute('data-voice'));mark();render();return;}
  var a;
  if((a=t.getAttribute('data-go'))){go(a);return;}
  if((a=t.getAttribute('data-lvl'))){ST.lvl=a;mark();render();return;}
  if((a=t.getAttribute('data-warm'))){ST.warm=a;mark();render();return;}
  if(t.hasAttribute('data-wq')){ST.wq=+t.getAttribute('data-wq');mark();render();var c=$('wcheck');if(c)c.scrollIntoView({block:'start'});return;}
  if(t.hasAttribute('data-vi')){ST.vi=+t.getAttribute('data-vi');mark();render();window.scrollTo(0,0);return;}
  if((a=t.getAttribute('data-op'))){ST.op[a]=t.getAttribute('data-v');mark();rerenderKeep();return;}
  if((a=t.getAttribute('data-who'))){var wid=findWho(t);answer('who-'+wid,a,ST.who,wid);rerenderKeep();return;}
  if((a=t.getAttribute('data-to'))){ST.letter.to=a;mark();rerenderKeep();return;}
  if((a=t.getAttribute('data-mode'))){ST.letter.mode=a;mark();rerenderKeep();return;}
  if(t.id==='turnin'){var n=letterWords();if(n<40){$('tfb').innerHTML='<span class="lionq">\uD83E\uDD81 Almost! Write at least 40 words \u2014 you have '+n+'.</span>';return;}
    ST.letter.turned=true;ST.letter.at=new Date().toISOString();ST.letter.text=letterText();mark();save(true);rerenderKeep();return;}
  if(t.classList.contains('opt')&&!t.classList.contains('warmopt')){var box=t.closest('.opts');var q=box.getAttribute('data-q');var k=t.getAttribute('data-k');
    var bucket=q.indexOf('w-')===0?ST.w:q.indexOf('vc-')===0?ST.vc:ST.dc;var right=q.indexOf('w-')===0?q.slice(2):q.indexOf('vc-')===0?q.slice(3):'r';
    answer(q,k,bucket,right);rerenderKeep();return;}
});
function findWho(t){var idea=t.closest('.idea');var n=[].indexOf.call(document.querySelectorAll('.idea'),idea);return ST.ord.sides[n];}
function rerenderKeep(){var y=window.scrollY;render();window.scrollTo(0,y);}
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='favwhy'){ST.fav.because=t.value;mark();bindScreen();return;}
  if(t.getAttribute&&t.getAttribute('data-f')){ST.letter.f[t.getAttribute('data-f')]=t.value;mark();countLetter();return;}
  if(t.id==='freebox'){ST.letter.free=t.value;mark();countLetter();return;}
  if(t.tagName==='TEXTAREA'){t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px';}});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='favsel'){ST.fav.id=t.value;mark();bindScreen();return;}
  if(t.getAttribute&&t.getAttribute('data-f')==='stance'){ST.letter.f.stance=t.value;mark();countLetter();return;}
  if(t.id==='langSel'){ST.lang=t.value;try{localStorage.setItem('vocab_lang',t.value);}catch(x){}mark();[].forEach.call(document.querySelectorAll('.dtr'),function(b){b.removeAttribute('data-l');});paintDirs();paintWordTr();return;}});
function boom(){var f=$('fw');f.innerHTML='';for(var i=0;i<60;i++){var s=document.createElement('i');s.style.left=(40+Math.random()*20)+'%';s.style.top='55%';s.style.background=['#c9862f','#c0392b','#2c6fd1','#5d7f45','#f4d35e'][i%5];
  s.style.setProperty('--dx',(Math.random()*600-300)+'px');s.style.setProperty('--dy',(-Math.random()*420-60)+'px');f.appendChild(s);}f.style.display='block';setTimeout(function(){f.style.display='none';},1800);}

/* ---------- server: LOAD FIRST, then save ---------- */
function lp(e){return String(e||'').trim().toLowerCase().split('@')[0];}
function bar(msg){var b=$('srvbar');if(!msg){b.style.display='none';return;}b.textContent=msg;b.style.display='block';}
function load(){var list='("'+lp(ME.email)+'@sfusd.edu","'+lp(ME.email)+'@s.sfusd.edu")';
  return fetch(SUPA+'/rest/v1/'+TABLE+'?select=*&set_slug=eq.'+SET_SLUG+'&email=in.'+encodeURIComponent(list),{headers:HDR})
  .then(function(r){if(!r.ok)throw new Error('load '+r.status);return r.json();})
  .then(function(rows){var best=null;(rows||[]).forEach(function(r){if(!best||JSON.stringify(r.answers||{}).length>JSON.stringify(best.answers||{}).length)best=r;});
    var keepLang=ST.lang;if(best&&best.answers){var d=fresh();for(var k in best.answers)d[k]=best.answers[k];ST=d;}
    if(keepLang)ST.lang=keepLang;LOADED=true;bar('');$('langSel').value=ST.lang||'';render();})
  .catch(function(){LOADED=false;bar('\u26A0 Can\u2019t reach the server \u2014 your work is NOT being saved yet. Trying again\u2026');setTimeout(load,5000);});}
function save(force){if(!LOADED||!ME)return;if(!DIRTY&&!force)return;if(SAVING&&!force)return;SAVING=true;DIRTY=false;score();
  var row={email:ME.email,set_slug:SET_SLUG,name:ME.first+' '+ME.last,period:String(ME.period),level:ST.lvl,lang:ST.lang,answers:ST,turned_in:!!ST.letter.turned,updated_at:new Date().toISOString()};
  var done=false;var wd=setTimeout(function(){if(!done)bar('\u26A0 Can\u2019t reach the server \u2014 your last changes are not saved yet. Keep working; it will keep trying.');},8000);
  fetch(SUPA+'/rest/v1/'+TABLE+'?on_conflict=email,set_slug',{method:'POST',headers:Object.assign({},HDR,{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(row)})
  .then(function(r){done=true;clearTimeout(wd);SAVING=false;if(!r.ok){DIRTY=true;bar('\u26A0 Saving failed \u2014 trying again soon.');return;}bar('');$('saved').textContent='\u2713 saved '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});})
  .catch(function(){done=true;clearTimeout(wd);SAVING=false;DIRTY=true;bar('\u26A0 Can\u2019t reach the server \u2014 your last changes are not saved yet. Keep working; it will keep trying.');});}
setInterval(function(){save(false);},20000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save(false);});

/* ---------- sign-in ---------- */
function fillLangs(sel,first){sel.innerHTML='<option value="">'+first+'</option>'+LANGOPTS.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>';}).join('');}
function startUp(){fillLangs($('galStdLang'),'Choose your language');fillLangs($('langSel'),'\uD83C\uDF10 Language');
  try{var v=localStorage.getItem('vocab_lang');if(v&&LANGNAME[v])$('galStdLang').value=v;}catch(e){}
  $('gform').addEventListener('submit',function(e){e.preventDefault();var f=$('gfirst').value.trim(),l=$('glast').value.trim(),em=$('gemail').value.trim().toLowerCase(),p=$('gper').value,lg=$('galStdLang').value;
    var msg=$('gmsg');if(!f||!l){msg.textContent='Please write your first and last name.';return;}
    if(!/^[^@\s]+@(s\.)?sfusd\.edu$/.test(em)){msg.textContent='Use your school email: name@s.sfusd.edu';return;}
    if(!p){msg.textContent='Choose your period.';return;}if(!lg){msg.textContent='Please choose your language.';return;}
    ME={first:f,last:l,email:lp(em)+'@sfusd.edu',typed:em,period:p};
    try{localStorage.setItem('gal_student_email',ME.email);localStorage.setItem('gal_student_name',f+' '+l);localStorage.setItem('gal_student_period',p);localStorage.setItem('vocab_lang',lg);}catch(x){}
    ST.lang=lg;$('langSel').value=lg;$('gate').style.display='none';$('app').style.display='block';$('who').textContent=f+' \u00B7 P'+p;render();load();});
  try{var n=localStorage.getItem('gal_student_name')||'';var em2=localStorage.getItem('gal_student_email')||'';var pp=localStorage.getItem('gal_student_period')||'';
    if(n&&!$('gfirst').value){var parts=n.split(' ');$('gfirst').value=parts.shift();$('glast').value=parts.join(' ');}if(em2&&!$('gemail').value)$('gemail').value=em2;if(pp)$('gper').value=pp;}catch(e){}
  var c=$('canary');try{new MutationObserver(function(){if(c.textContent!=='Reading')ST.browserTr=true;}).observe(c,{childList:true,characterData:true,subtree:true});}catch(e){}}
document.addEventListener('DOMContentLoaded',startUp);

document.addEventListener('DOMContentLoaded',function(){document.getElementById('gpic').innerHTML=ART.scene().replace('id="lion"','');});
</script>
