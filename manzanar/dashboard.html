<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Dashboard — Manzanar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#f4f1e8;color:#22301f;font-size:18px;line-height:1.65}
.bar{position:sticky;top:0;z-index:60;background:#1f4d38;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.bar h1{font-size:18px;margin:0;flex:1 1 180px;font-weight:800;letter-spacing:.2px}
.bar button,.bar select{font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:7px 11px;background:#e8dfc8;color:#1f4d38;cursor:pointer}
.bar button:hover{background:#fff}
.bar .on{background:#f0a830;color:#3a2400}
#dot{width:11px;height:11px;border-radius:50%;background:#7b8a7b;display:inline-block;margin-left:4px}
#dot.saving{background:#f0a830}
#dot.saved{background:#7ddc7d}
#dot.err{background:#e05a4a}
#who{font-size:13px;opacity:.9;font-weight:700}
.wrap{max-width:860px;margin:0 auto;padding:22px 18px 90px}
h2{font-size:26px;margin:34px 0 8px;color:#1f4d38;border-bottom:3px solid #d8cba8;padding-bottom:5px}
h3{font-size:20px;margin:24px 0 6px;color:#3a5c46}
.card{background:#fff;border:1px solid #ded3b8;border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.read{background:#fffdf6;border-left:6px solid #1f4d38}
.read p{margin:0 0 14px}
.note{background:#fdf3dd;border-left:6px solid #f0a830}
.warn{background:#fdeae7;border-left:6px solid #e05a4a}
.q{margin:14px 0}
.q .num{font-weight:800;color:#1f4d38;margin-right:6px}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:17px;padding:9px 11px;border:2px solid #cdbf9e;border-radius:9px;background:#fffdf6;line-height:1.5}
textarea:focus,input:focus{outline:0;border-color:#1f4d38;background:#fff}
textarea{min-height:74px;resize:vertical}
.opts label{display:block;background:#fffdf6;border:2px solid #cdbf9e;border-radius:9px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts label:hover{border-color:#1f4d38}
.opts input{margin-right:9px;transform:scale(1.25)}
.frame{font-style:italic;color:#5c6b58;font-size:16px;margin:2px 0 4px}
b.g{background:#ffeec2;border-bottom:2px dotted #c98a10;cursor:pointer;padding:0 2px;border-radius:3px;font-weight:700}
#gloss{position:fixed;z-index:200;max-width:330px;background:#22301f;color:#fff;padding:12px 14px;border-radius:11px;font-size:15px;line-height:1.5;box-shadow:0 6px 22px rgba(0,0,0,.35);display:none}
#gloss .w{font-weight:800;color:#ffd77a;font-size:17px}
#gloss .t{margin-top:7px;padding-top:7px;border-top:1px solid #4b5c47;color:#cfe6cd}
#gloss .x{float:right;cursor:pointer;opacity:.7;font-weight:800}
.chunk{counter-reset:none}
.part{display:inline-block;background:#1f4d38;color:#fff;font-size:13px;font-weight:800;padding:3px 11px;border-radius:20px;margin-bottom:6px}
.easy-only{display:none}
body.lvl-easy .easy-only{display:block}
body.lvl-easy .hard-only{display:none}
body.lvl-easy span.easy-only,body.lvl-easy b.easy-only{display:inline}
.wordbank{background:#eef3ea;border:2px dashed #8fae95;border-radius:10px;padding:10px 14px;font-weight:700;color:#2c4b36}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:16px}
th,td{border:1px solid #cdbf9e;padding:7px 9px;text-align:left;vertical-align:top}
th{background:#e8dfc8;color:#1f4d38}
.overlay{position:fixed;inset:0;background:rgba(24,38,28,.96);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fffdf6;border-radius:16px;padding:26px;max-width:430px;width:100%}
.box h2{margin-top:0;border:0}
.box label{display:block;font-weight:800;margin:12px 0 4px;color:#1f4d38}
.box select{width:100%;font-family:inherit;font-size:17px;padding:9px;border:2px solid #cdbf9e;border-radius:9px;background:#fff}
.btn{display:inline-block;background:#1f4d38;color:#fff;border:0;border-radius:10px;padding:11px 20px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;margin-top:16px}
.btn:hover{background:#2c6b4c}
.btn.alt{background:#f0a830;color:#3a2400}
.hublist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:18px 0}
a.tile{display:block;background:#fff;border:1px solid #ded3b8;border-left:7px solid #1f4d38;border-radius:12px;padding:15px 17px;text-decoration:none;color:#22301f}
a.tile:hover{border-left-color:#f0a830;box-shadow:0 3px 12px rgba(0,0,0,.1)}
a.tile b{display:block;font-size:19px;color:#1f4d38;margin-bottom:3px}
a.tile span{font-size:15px;color:#5c6b58}
.scorebox{background:#1f4d38;color:#fff;border-radius:12px;padding:16px 20px;font-size:20px;font-weight:800}
.ok{color:#1c7a3e;font-weight:800}
.no{color:#c0392b;font-weight:800}
@media print{
 .bar,.overlay,.noprint,#gloss{display:none!important}
 body{background:#fff;font-size:12.5pt;line-height:1.45}
 .wrap{max-width:100%;padding:0}
 .card{break-inside:avoid;box-shadow:none;border:1px solid #999;margin:9px 0;padding:10px 12px}
 h2{font-size:16pt;margin:14px 0 5px;page-break-after:avoid}
 h3{font-size:13pt;margin:10px 0 3px;page-break-after:avoid}
 textarea{min-height:56px;border:1px solid #666;background:#fff}
 input[type=text]{border:0;border-bottom:1px solid #666;border-radius:0;background:#fff}
 b.g{background:0 0;border-bottom:1px dotted #666}
 a.tile{border:1px solid #999}
 .pb{page-break-before:always}
}
</style>
</head><body class="lvl-easy">
<div class="bar"><h1>Manzanar · Teacher Dashboard</h1><button onclick="loadAll()">Refresh</button><button onclick="exportCSV()">Export CSV</button><button onclick="window.print()">Print</button></div>
<div class="overlay" id="login"><div class="box">
<h2>Teacher Dashboard</h2>
<label for="pw">Password</label>
<input type="text" id="pw" onkeydown="if(event.key==='Enter')go()">
<button class="btn" onclick="go()">Open</button>
<p id="err" style="color:#c0392b;font-weight:700"></p>
</div></div>
<div class="wrap">
<div class="card noprint"><b>Filter:</b>
<select id="pagefilter" onchange="render()" style="font-family:inherit;font-size:16px;padding:6px 9px;border:2px solid #cdbf9e;border-radius:8px">
<option value="all">All pages</option>
<option value="ch1">Chapter 1</option><option value="ch2">Chapter 2</option>
<option value="movie">Movie Guide</option><option value="grammar">Grammar</option>
<option value="assessment">Assessment</option>
</select>
&nbsp; <input type="text" id="search" placeholder="search a name" oninput="render()" style="width:190px;display:inline-block">
</div>
<div id="summary"></div>
<div id="out"></div>
<div id="detail"></div>
</div>

<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE='manzanar_work';
var KEYS={"ch1": {"v1": "harbor", "v2": "contract", "v3": "suspicious", "v4": "dignity", "v5": "citizen", "v6": "crew", "q1": "b", "q2": "c", "q5": "c", "q6": "b", "q9": "b", "q10": "b", "q15": "b", "q16": "b", "q19": "b", "q20": "c", "g1": "went", "g2": "came", "g3": "waved", "g4": "wore", "g5": "burned", "g6": "knew", "g7": "cried", "g8": "saw", "g9": "fight", "g10": "know", "g11": "explain"}, "ch2": {"q1": "b", "q2": "b", "q4": "b", "q5": "b", "q8": "b", "q9": "b", "q15": "b", "q16": "b", "q19": "c", "g1": "we", "g2": "us", "g3": "they", "g4": "them", "g5": "me", "g6": "he", "g7": "her", "g8": "she"}, "movie": {"m1": "b", "m2": "b", "m3": "b", "m4": "b", "m5": "b", "m6": "b", "m7": "b", "m8": "b", "m9": "b", "m10": "b", "m11": "b", "m12": "b"}, "grammar": {"p1": "went", "p2": "took", "p3": "wore", "p4": "cried", "p5": "left", "p6": "slept", "p7": "built", "p8": "felt", "p9": "gave", "p10": "saw", "n1": "fight", "n2": "know", "n3": "explain", "n4": "speak", "n5": "have", "n6": "help", "pr1": "we", "pr2": "us", "pr3": "they", "pr4": "them", "pr5": "me", "pr6": "he", "pr7": "her", "pr8": "she", "pr9": "him", "pr10": "us", "t1": "there were", "t2": "there was", "t3": "there was", "t4": "there were", "t5": "there was", "c1": "because", "c2": "so", "c3": "because", "c4": "so"}, "assessment": {"a1": "contract", "a2": "suspicious", "a3": "dignity", "a4": "citizen", "a5": "horizon", "a6": "barracks", "a7": "barbed wire", "a8": "remove", "a9": "crew", "a10": "inu", "b1": "b", "b2": "b", "b3": "b", "b4": "b", "b5": "b", "b6": "b", "b7": "b", "b8": "c", "b9": "b", "b10": "b", "b11": "b", "b12": "b", "c1": "went", "c2": "cried", "c3": "fight", "c4": "speak", "c5": "we", "c6": "us", "c7": "them", "c8": "there were", "c9": "there was", "c10": "because"}};
var PAGE_NAMES={"ch1": "Chapter 1", "ch2": "Chapter 2", "movie": "Movie Guide", "grammar": "Grammar", "assessment": "Assessment"};
var ROWS=[];
function H(){return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};}
function $(id){return document.getElementById(id);}
function go(){
  if($('pw').value!=='galileo2026'){ $('err').textContent='Wrong password.'; return; }
  $('login').style.display='none'; loadAll();
}
function score(page,data){
  var key=KEYS[page]; if(!key) return null;
  var right=0,total=0,blank=0;
  for(var k in key){
    total++;
    var v=data?data[k]:undefined;
    if(v===undefined||v===''){ blank++; continue; }
    if(String(v).trim().toLowerCase()===String(key[k]).trim().toLowerCase()) right++;
  }
  return {right:right,total:total,blank:blank};
}
function loadAll(){
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=*&order=name.asc',{headers:H()})
   .then(function(r){return r.json();})
   .then(function(rows){
     ROWS=rows.filter(function(r){ return r.email && r.email.indexOf('teacher@')!==0; });
     render();
   }).catch(function(e){ $('out').innerHTML='<div class="card warn">Could not load. Is the table created?</div>'; });
}
function render(){
  var pf=$('pagefilter').value, q=($('search').value||'').toLowerCase();
  var byStu={};
  for(var i=0;i<ROWS.length;i++){
    var r=ROWS[i];
    if(pf!=='all' && r.page!==pf) continue;
    if(q && (r.name||'').toLowerCase().indexOf(q)<0 && (r.email||'').toLowerCase().indexOf(q)<0) continue;
    if(!byStu[r.email]) byStu[r.email]={name:r.name||r.email,email:r.email,pages:{}};
    byStu[r.email].pages[r.page]=r;
  }
  var names=Object.keys(byStu).sort(function(a,b){ return (byStu[a].name||'').localeCompare(byStu[b].name||''); });
  var pages = pf==='all' ? ['ch1','ch2','movie','grammar','assessment'] : [pf];
  var h='<table><tr><th>Student</th>';
  for(var p=0;p<pages.length;p++) h+='<th>'+PAGE_NAMES[pages[p]]+'</th>';
  h+='<th>Open</th></tr>';
  var totalTurned=0, totalCells=0;
  for(var n=0;n<names.length;n++){
    var s=byStu[names[n]];
    h+='<tr><td><b>'+esc(s.name)+'</b><br><span style="font-size:13px;color:#5c6b58">'+esc(s.email)+'</span></td>';
    for(var p2=0;p2<pages.length;p2++){
      totalCells++;
      var r3=s.pages[pages[p2]];
      if(!r3){ h+='<td style="color:#aaa">\u2014</td>'; continue; }
      if(r3.turned_in) totalTurned++;
      var sc=score(pages[p2], r3.data);
      var cell = r3.turned_in ? '<span class="ok">turned in</span>' : '<span style="color:#c9800f;font-weight:800">working</span>';
      if(sc && sc.total) cell += '<br>'+sc.right+'/'+sc.total+' <span style="font-size:12px;color:#777">('+sc.blank+' blank)</span>';
      var w=countWords(r3.data);
      if(w) cell += '<br><span style="font-size:12px;color:#777">'+w+' words written</span>';
      h+='<td>'+cell+'</td>';
    }
    h+='<td><button onclick="detail(\''+s.email+'\')" style="font-family:inherit;font-weight:800;border:0;background:#1f4d38;color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer">see work</button></td></tr>';
  }
  h+='</table>';
  $('out').innerHTML='<div class="card">'+h+'</div>';
  $('summary').innerHTML='<div class="card"><b>'+names.length+'</b> students &#183; <b>'+totalTurned+'</b> of '+totalCells+' assignments turned in</div>';
}
function countWords(d){
  if(!d) return 0; var w=0;
  for(var k in d){ var v=d[k]; if(typeof v==='string' && v.length>12){ w+=v.trim().split(/\s+/).length; } }
  return w;
}
function esc(s){ return String(s||'').replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function detail(email){
  var rs=ROWS.filter(function(r){return r.email===email;});
  var h='<h2>'+esc(rs[0].name||email)+'</h2>';
  for(var i=0;i<rs.length;i++){
    var r=rs[i], key=KEYS[r.page]||{};
    h+='<div class="card"><h3>'+(PAGE_NAMES[r.page]||r.page)+' <span style="font-size:13px;font-weight:400;color:#777">saved '+String(r.updated_at).slice(0,16).replace('T',' ')+'</span></h3><table>';
    var d=r.data||{};
    var ks=Object.keys(d).sort();
    for(var j=0;j<ks.length;j++){
      var k=ks[j], v=d[k], mark='';
      if(key[k]!==undefined){
        mark = (String(v).trim().toLowerCase()===String(key[k]).trim().toLowerCase())
          ? ' <span class="ok">\u2713</span>' : ' <span class="no">\u2717 (key: '+esc(key[k])+')</span>';
      }
      h+='<tr><td style="width:90px;font-weight:800">'+esc(k)+'</td><td>'+esc(v)+mark+'</td></tr>';
    }
    h+='</table></div>';
  }
  h+='<button class="btn noprint" onclick="document.getElementById(\'detail\').innerHTML=\'\'">close</button>';
  $('detail').innerHTML=h;
  window.scrollTo(0,document.getElementById('detail').offsetTop-70);
}
function exportCSV(){
  var lines=[['name','email','page','turned_in','score','total','updated_at','all_answers'].join(',')];
  for(var i=0;i<ROWS.length;i++){
    var r=ROWS[i], sc=score(r.page,r.data)||{right:'',total:''};
    var ans=JSON.stringify(r.data||{}).replace(/"/g,'""');
    lines.push(['"'+(r.name||'')+'"','"'+r.email+'"',r.page,r.turned_in?'yes':'no',sc.right,sc.total,
                '"'+String(r.updated_at).slice(0,16)+'"','"'+ans+'"'].join(','));
  }
  var b=new Blob([lines.join('\n')],{type:'text/csv'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='manzanar_work.csv'; a.click();
}
</script><script src="/readings/track.js"></script>
</body></html>
