 text:{

function trWord(word,ctx,lang,cb){

/* ======================= SCORE + PROGRESS ======================= */
function prob(){var w=ST.A.w;return ST.level==='A'?((w.pa||'').trim()&&(w.pb||'').trim()?'She wants to '+w.pa.trim()+', but '+w.pb.trim()+'.':''):(w.prob||'');}
function probOK(){return wc(prob())>=6;}
function adviceText(){var w=ST.A.w;if(ST.level!=='A')return w.text||'';
  var f=L.adviceA,a=w.a||[];if(!a.some(function(x){return (x||'').trim();}))return '';
  return 'Dear '+L.writer+',\n'+f.map(function(s,i){return s+' '+(a[i]||'').trim().replace(/\.$/,'')+'.';}).join(' ')+'\nGood luck!\n— '+(ST.first||'');}
var RX_ADV=/\b(should|could|might|ought to|if i were you|why don[’']?t you|i suggest|i recommend|try to|it might help|you can)\b/i;
var RX_WHY=/\b(because|since|so that|that way|this way|so you|that is why|then you)\b/i;
var RX_RISK=/\b(however|on the other hand|but if|risk|might not|could be hard|the problem is|be careful)\b/i;
function checks(){
  var w=ST.A.w,lv=ST.level,c=[];
  if(lv==='A'){var a=w.a||[],own=a.reduce(function(n,x){return n+wc(x);},0);
    c.push({k:'all',t:'Finish all four sentences.',ok:a.filter(function(x){return wc(x)>=2;}).length===4});
    c.push({k:'own',t:'Use at least 12 of your own words (now: '+own+').',ok:own>=12});
    c.push({k:'why',t:'Give a real reason after “because” (3 words or more).',ok:wc(a[1])>=3});
  }else{var t=w.text||'',n=wc(t);
    c.push({k:'len',t:'Write at least '+L.minWords[lv]+' words (now: '+n+').',ok:n>=L.minWords[lv]});
    c.push({k:'adv',t:'Give advice: should, could, might, if I were you…',ok:RX_ADV.test(t)});
    c.push({k:'why',t:'Explain why: because, so that, that way…',ok:RX_WHY.test(t)});
    if(lv==='C')c.push({k:'risk',t:'Name one risk or the other side: however, on the other hand, but if…',ok:RX_RISK.test(t),extra:true});
  }
  return c;
}
function cmpOK(){var w=ST.A.w;return ST.level==='A'?(w.cA||[]).filter(function(x){return wc(x)>=2;}).length===3:wc(w.cmp)>=15;}
function itemPts(r){return r&&r.ok?(r.m&&r.m.length?1:2):0;}
function compDone(){return L.comp.every(function(q){return ST.A.q[q.id]&&ST.A.q[q.id].ok;});}
function vocabItems(){var p=L.vocab.map(function(v,i){return{id:'p'+(i+1),w:v.w,kind:'p'};}),f=L.fill.map(function(x){return{id:x.id,w:x.w,kind:'f',s:x.s,hint:x.hint};});return{p:p,f:f};}
function vocabDone(){var it=vocabItems();return it.p.concat(it.f).every(function(x){return ST.A.v[x.id]&&ST.A.v[x.id].ok;});}
function stepDone(n){var w=ST.A.w;
  if(n===1)return probOK();if(n===2)return !!w.sent;if(n===3)return cmpOK();if(n===4)return compDone();if(n===5)return vocabDone();if(n===6)return ST.A.vote!=='none'||ST.turned;return false;}
function locked(n){return (n===3||n===6)&&!ST.A.w.sent;}
function score(){
  var s=0,w=ST.A.w;
  if(probOK())s+=2;
  if(w.sent){checks().filter(function(c){return !c.extra;}).forEach(function(c){if(c.ok)s+=2;});}
  if(cmpOK())s+=2;
  L.comp.forEach(function(q){s+=itemPts(ST.A.q[q.id]);});
  var it=vocabItems();it.p.concat(it.f).forEach(function(x){s+=itemPts(ST.A.v[x.id]);});
  return s;
}
function answered(){var n=0;if(probOK())n++;if(ST.A.w.sent)n++;if(cmpOK())n++;
  Object.keys(ST.A.q).forEach(function(k){if(ST.A.q[k].ok)n++;});Object.keys(ST.A.v).forEach(function(k){if(ST.A.v[k].ok)n++;});return n;}
function refresh(){
  window.GAL_SCORE=score();window.GAL_MAX=44;
  var done=0;for(var i=1;i<=6;i++)if(stepDone(i))done++;
  $('prog').querySelector('i').style.width=Math.round(done/6*100)+'%';
  $('progT').textContent=done+' of 6 steps done';
  $('scoreT').textContent='Score '+window.GAL_SCORE+' / 44';
  renderSteps();
}

function mcWire(root,store,onRight,hints,why){
  root.querySelectorAll('.q').forEach(function(qd){
    var id=qd.dataset.q,fb=qd.querySelector('.fb');

     :'<div class="vsent" translate="no" data-ctx="'+esc(x.s)+'">'+richS(x.s.replace('____','*____*')).replace('<span class="w v" data-v="____">____</span>','<span class="blank">&nbsp;</span>')+' <button class="sspk" type="button" data-say="'+esc(x.s)+'">🔊</button></div><span translate="no">Which word fits?</span>';
  var dots=it.map(function(y,j){var r=ST.A.v[y.id];return '<button type="button" class="chip" data-vj="'+j+'" style="'+(j===i?'background:var(--plum);color:#fff;':'')+(r&&r.ok?'border-color:var(--good)':'')+'">'+(j+1)+(r&&r.ok?' ✓':'')+'</button>';}).join('');
  box.innerHTML=(kind==='p'?'<h3>Practice 1 · Picture → word</h3>'+D('Look at the picture. Choose the word it shows.'):'<h3>Practice 2 · Word in a new sentence</h3>'+D('Read the sentence. Choose the word that fits the blank.'))+
   '<div class="chips">'+dots+'</div>'+mcHTML(x.id,stem,opts,ord,rec,0)+
   '<div class="row" style="margin-top:10px"><button class="btn" type="button" data-vnext="1">Next →</button></div>';
  mcWire(box,ST.A.v,function(){refresh();},function(id){var v=vocabOf(x.w);return kind==='p'?['Look at the left side, the one WITHOUT the red X. What is happening there?','The word means: '+v.d]:[x.hint,'The word means: '+v.d];},function(){return '';});
  box.querySelectorAll('[data-vj]').forEach(function(b){b.onclick=function(){vi[kind]=+b.dataset.vj;ST.dirty=true;round(kind);dirs(box);};});
  box.querySelector('[data-vnext]').onclick=function(){var r=ST.A.v[x.id];if(!r||!r.ok){var fb=box.querySelector('.fb');fb.className='fb show try';fb.textContent='Choose the right word first.';return;}
    var nx=it.findIndex(function(y,j){return j>i&&!(ST.A.v[y.id]&&ST.A.v[y.id].ok);});if(nx<0)nx=it.findIndex(function(y){return !(ST.A.v[y.id]&&ST.A.v[y.id].ok);});
    if(nx<0){box.querySelector('.fb').className='fb show ok';box.querySelector('.fb').innerHTML='<b>✓ All done in this practice!</b>';return;}vi[kind]=nx;ST.dirty=true;round(kind);dirs(box);};
}

/* ======================= 6. CLASS WALL ======================= */
function myId(){return hash(String(ST.email).split('@')[0]).toString(36);}
var WALL=[];
function anon(t){return String(t||'').replace(/\n\s*[—-]\s*[^\n]*$/,'').trim();}
function r6(){
  $('s6').innerHTML='<div class="box"><div class="pic">'+ART.cork()+'</div><h2>Class wall</h2>'+D('Here is the advice from your class. Read it to a partner. Then vote for the best advice (not your own).')+
   '<div class="row" style="clear:both"><button class="btn ghost" type="button" id="wallR">↻ Show new advice</button><span class="wc" id="wallN"></span></div><div class="wall" id="wall"></div></div>'+
   '<div class="box"><h3>Turn in</h3>'+D('When you finish all six steps, turn in your work to Mr. Toby. You can keep working after you turn in.')+
   '<div id="tiMsg" class="note" style="display:none"></div><div class="row"><button class="btn go" type="button" id="turnIn">'+(ST.turned?'✓ Turned in — turn in again':'Turn in')+'</button></div></div>';
  $('wallR').onclick=loadWall;$('turnIn').onclick=turnIn;
  drawWall();loadWall();
}
function loadWall(){
  if(!ST.period)return;
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=email,period,level,answers,updated_at&slug=eq.'+encodeURIComponent(L.slug)+'&period=eq.'+encodeURIComponent(ST.period),{headers:H})
  .then(function(r){return r.ok?r.json():[];}).then(function(rows){
    var seen={};WALL=[];(rows||[]).forEach(function(r){var lp=String(r.email||'').split('@')[0];if(seen[lp])return;var a=r.answers||{};if(!(a.w&&a.w.sent&&a.w.text))return;seen[lp]=1;WALL.push({id:hash(lp).toString(36),text:anon(a.w.text),level:r.level,vote:a.vote||'none'});});
    drawWall();
  }).catch(function(){$('wallN')&&($('wallN').textContent='Could not load the wall right now.');});
}
function drawWall(){
  var el=$('wall');if(!el)return;var me=myId();
  if(!WALL.some(function(n){return n.id===me;})&&ST.A.w.sent)WALL.unshift({id:me,text:anon(ST.A.w.text),level:ST.level,vote:ST.A.vote});
  WALL.forEach(function(n){if(n.id===me)n.vote=ST.A.vote;});
  var votes={};WALL.forEach(function(n){if(n.vote&&n.vote!=='none')votes[n.vote]=(votes[n.vote]||0)+1;});
  $('wallN').textContent=WALL.length+' letter'+(WALL.length===1?'':'s')+' from Period '+ST.period;
  el.innerHTML=WALL.map(function(n,i){var mine=n.id===me,txt=String(n.text);
    return '<div class="note2'+(mine?' mine':'')+'" data-ctx="'+esc(txt.slice(0,300))+'"><div class="nh">'+(mine?'Your advice':'Advice #'+(i+1))+' · Level '+esc(n.level||'')+'</div><div translate="no">'+esc(txt).replace(/([A-Za-zÀ-ÿ’'\-]+)/g,'<span class="w">$1</span>').replace(/\n/g,'<br>')+'</div>'+
     '<div class="row"><button class="sspk" type="button" data-say="'+esc(txt)+'">🔊 Listen</button>'+(mine?'<span class="wc">❤ '+(votes[n.id]||0)+'</span>':'<button type="button" class="vote'+(ST.A.vote===n.id?' on':'')+'" data-vote="'+n.id+'">❤ Best advice'+(ST.A.vote!=='none'?' · '+(votes[n.id]||0):'')+'</button>')+'</div></div>';}).join('')||'<p>No advice yet. Check again soon!</p>';
  el.querySelectorAll('[data-vote]').forEach(function(b){b.onclick=function(){ST.A.vote=ST.A.vote===b.dataset.vote?'none':b.dataset.vote;ST.dirty=true;push(true);drawWall();refresh();};});
}
function turnIn(){
  var miss=[];for(var i=1;i<=5;i++)if(!stepDone(i))miss.push(STEPS[i-1][0]+'. '+STEPS[i-1][1]);
  var m=$('tiMsg');
  if(!ST.A.w.sent){m.style.display='block';m.textContent='Send your advice to the Lion first (step 2).';return;}
  ST.turned=true;ST.forceTurn=true;ST.dirty=true;push(true);
  m.style.display='block';m.innerHTML=miss.length?'Turned in. Mr. Toby can see it. You can still finish: <b>'+esc(miss.join(' · '))+'</b> — your score will update.':'✓ Turned in. Great work! Score '+window.GAL_SCORE+' / 44.';
  $('turnIn').textContent='✓ Turned in — turn in again';
}

/* ======================= SAVE / LOAD (load first, then save) ======================= */
function setDot(c){$('dot').className=c||'';}
var watchdog=null;
function loadRow(cb){
  ST.loaded=false;setDot('');
  clearTimeout(watchdog);watchdog=setTimeout(function(){if(!ST.loaded){$('srvbar').classList.add('show');setDot('err');}},8000);
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=*&email=eq.'+encodeURIComponent(ST.email)+'&slug=eq.'+encodeURIComponent(L.slug),{headers:H})
  .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
  .then(function(rows){
    rows=(rows||[]).slice().sort(function(a,b){return JSON.stringify(b).length-JSON.stringify(a).length;});
    var row=rows[0];
    if(row){var a=row.answers||{};
      ['q','v','ord'].forEach(function(k){if(a[k]&&typeof a[k]==='object')ST.A[k]=a[k];});
      if(a.w&&typeof a.w==='object'){for(var k in a.w)ST.A.w[k]=a.w[k];}
      if(a.vote)ST.A.vote=a.vote;if(a.taps)ST.A.taps=a.taps;if(a.wtab)ST.A.wtab=a.wtab;if(a.vi)ST.A.vi=a.vi;
      if(row.level)ST.level=row.level;ST.turned=!!row.turned_in;ST.loggedScore=row.turned_in?row.score:null;
    }
    ST.loaded=true;clearTimeout(watchdog);$('srvbar').classList.remove('show');setDot('on');cb&&cb();
  }).catch(function(){$('srvbar').classList.add('show');setDot('err');setTimeout(function(){loadRow(cb);},5000);});
}
function body(){
  var sc=score(),b={email:ST.email,slug:L.slug,name:ST.name,period:ST.period,level:ST.level,lang:ST.lang,
    answers:{w:ST.A.w,q:ST.A.q,v:ST.A.v,ord:ST.A.ord,vote:ST.A.vote,taps:ST.A.taps,wtab:ST.A.wtab,vi:ST.A.vi},
    answered:answered(),score:sc,max_score:44,updated_at:new Date().toISOString()};
  /* turned_in rides along only at turn-in, or when a turned-in score changed (so the gradebook gets the new score) */
  if(ST.forceTurn||(ST.turned&&ST.loggedScore!==sc)){b.turned_in=true;}
  return b;
}
var saving=false;
function push(force){
  if(!ST.loaded||!ST.email)return;
  if(!ST.dirty&&!force)return;
  if(saving){ST.dirty=true;return;}
  saving=true;ST.dirty=false;var b=body(),turning=!!b.turned_in;
  var sw=setTimeout(function(){if(saving){$('srvbar').classList.add('show');setDot('err');}},8000);
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,slug',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([b])})
  .then(function(r){saving=false;clearTimeout(sw);if(!r.ok)throw new Error('save '+r.status);setDot('on');$('srvbar').classList.remove('show');
    if(turning){ST.forceTurn=false;ST.loggedScore=b.score;}})
  .catch(function(){saving=false;clearTimeout(sw);ST.dirty=true;setDot('err');});
}
setInterval(function(){push(false);},20000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')push(false);});

/* ======================= SIGN-IN ======================= */
function fillLangs(sel,first){sel.innerHTML='<option value="">'+first+'</option>'+LANGS.map(function(l){return '<option value="'+l[0]+'">'+l[1]+(l[1]!==l[0]?' ('+l[0]+')':'')+'</option>';}).join('');}
fillLangs($('gLang'),'— choose your language —');fillLangs($('lang'),'My language');
$('gLion').innerHTML=ART.lion();$('mLion').innerHTML=ART.lion();
(function prefill(){
  $('gFirst').value=lsGet('gal_student_first');$('gLast').value=lsGet('gal_student_last');
  if(!$('gFirst').value&&lsGet('gal_student_name')){var p=lsGet('gal_student_name').split(' ');$('gFirst').value=p.shift()||'';$('gLast').value=p.join(' ');}
  $('gEmail').value=lsGet('gal_student_email');$('gPeriod').value=lsGet('gal_student_period')||lsGet('gal_period');

})();
['gFirst','gLast','gEmail'].forEach(function(id){$(id).addEventListener('keydown',function(e){if(e.key==='Enter')$('gGo').click();});});
$('gGo').onclick=function(){
  var f=$('gFirst').value.trim(),l=$('gLast').value.trim(),raw=$('gEmail').value.trim().toLowerCase(),p=$('gPeriod').value,lg=$('gLang').value,err=$('gErr');
  if(!f){err.textContent='Type your first name.';return;}
  if(!l){err.textContent='Type your last name.';return;}

  if(!p){err.textContent='Choose your period.';return;}
  if(!lg){err.textContent='Choose your language.';return;}
  var c=canon(raw);
  ST.email=c;ST.first=f;ST.last=l;ST.name=f+' '+l;ST.period=p;setLang(lg);
  lsSet('gal_student_email',c);lsSet('gal_student_first',f);lsSet('gal_student_last',l);lsSet('gal_student_name',ST.name);lsSet('gal_student_period',p);lsSet('gal_period',p);
  if(raw!==c)fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{alias_email:raw,email:c}])}).catch(function(){});
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:hdr('resolution=ignore-duplicates,return=minimal'),body:JSON.stringify([{email:c,first_name:f,last_name:l,period:p}])}).catch(function(){});
  $('gate').style.display='none';
  $('who').innerHTML=esc(f)+' · P'+esc(p)+' · <a href="#" id="chg">change</a>';
  $('chg').onclick=function(e){e.preventDefault();$('gate').style.display='flex';};
  $('main').style.opacity='.5';
  loadRow(function(){$('main').style.opacity='';setLevelUI();go(stepDone(1)?(ST.A.w.sent?firstOpen():2):1);});
};
function firstOpen(){for(var i=1;i<=6;i++)if(!stepDone(i)&&!locked(i))return i;return 6;}
function setLang(lg){ST.lang=lg;$('lang').value=lg;$('gLang').value=lg;lsSet('vocab_lang',lg);lsSet('eld103_lang',lg);dirs();if(ST.step===5&&$('s5').classList.contains('on'))fillCardTr($('s5'));ST.dirty=true;}
$('lang').onchange=function(){setLang(this.value);document.querySelectorAll('.ptr').forEach(function(o){o.hidden=true;});};
function setLevelUI(){$('lvl').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.l===ST.level);});$('mSub').textContent='Level '+ST.level+' · '+L.title;}
$('lvl').addEventListener('click',function(e){var b=e.target.closest('[data-l]');if(!b||b.dataset.l===ST.level)return;ST.level=b.dataset.l;ST.dirty=true;setLevelUI();go(ST.step);});
setLevelUI();dirs($('gate'));
$('gLang').addEventListener('change',function(){ST.lang=this.value;dirs($('gate'));});

/* ======================= EASTER EGG ======================= */
function fireworks(x,y){var cs=['#e0701f','#4a2a7a','#f2c14e','#1d7a46','#c0221a','#2f6fd1'];
  for(var i=0;i<46;i++){(function(i){var d=document.createElement('div');d.className='spark';d.style.background=cs[i%cs.length];d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);
   var a=Math.random()*Math.PI*2,v=80+Math.random()*160,dx=Math.cos(a)*v,dy=Math.sin(a)*v;
   d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx+'px,'+(dy+120)+'px) rotate(540deg)',opacity:0}],{duration:1300+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=function(){d.remove();};})(i);}
  speak('Roar! You found the lion!');
}
