*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 Nunito,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 70px}
#login{max-width:440px;margin:5vh auto;background:var(--card);border-radius:20px;padding:26px 24px;border:1px solid var(--line)}
#login h1{margin:0 0 4px;font-size:32px;font-weight:900;line-height:1.1;color:var(--p)}
#login p{margin:0 0 16px;color:var(--muted)}
#login label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
#login input,#login select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#login .err{color:var(--no);font-size:15px;min-height:22px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--ink);color:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.green{background:var(--g);color:#fff}
.btn.wide{width:100%;margin-top:18px;font-size:19px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0}
.brand{font-weight:900;font-size:20px}
.brand small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.who{color:var(--muted);font-size:14px}
.spacer{flex:1}
.bar select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:15px}
.home{color:var(--muted);text-decoration:none;font-size:14px;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px}
.back{background:var(--g);color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:9px 14px;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#btn-dir{padding:7px 12px;font-size:14px;box-shadow:none;border-radius:9px}
#btn-dir.on{background:var(--b);color:var(--card);border-color:var(--b)}
#dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
#dot.saving{background:var(--o)} #dot.saved{background:var(--ok)} #dot.err{background:var(--no)}
#steps{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.step{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:15px;white-space:nowrap}
.step.on{background:var(--p);border-color:var(--p);color:#fff}
.step .ck{color:var(--ok);font-weight:900;margin-left:4px} .step.on .ck{color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.panel h2{margin:0 0 4px;font-size:25px;font-weight:900}
.lede{margin:0 0 14px;color:var(--muted);font-size:16px}
.dirtr{display:block;font-size:16px;color:var(--ink);margin-top:4px;font-weight:400}
.dirtr[dir=rtl]{text-align:right}
.tr{text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.bookcall{display:flex;gap:12px;align-items:center;background:var(--sun);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-weight:800}
.bookcall .pg{background:var(--card);border-radius:10px;padding:6px 12px;font-size:22px;font-weight:900;color:var(--p);white-space:nowrap}
.bookcall svg{width:40px;height:40px;flex:none}
.spk{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;font-size:15px;flex:none}

.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kid{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kid .flag{width:72px;height:48px;margin:0 auto 6px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1.5px var(--line)}
.kid .flag svg{width:100%;height:100%;display:block}
.kid .nm{font-weight:900;font-size:18px}
.kid .pl{font-size:13px;color:var(--muted)}
/* items: one picture, four captions */
.item{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.item.done{border-color:var(--g)}
.item .top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.item .pic{width:120px;flex:none;text-align:center}
.item .pic .flag{width:84px;height:56px;margin:0 auto 4px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1.5px var(--line)} .item .pic .flag svg{width:100%;height:100%;display:block}
.item .pic .nm{font-weight:900}
.item .pic .ico{width:84px;height:84px;margin:0 auto;color:var(--p)} .item .pic .ico svg{width:100%;height:100%}
.item .q{flex:1;min-width:200px;font-size:19px;font-weight:700}
.item .q .l1{display:block;font-size:14px;color:var(--muted);font-weight:400;margin-top:2px}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cap{display:flex;gap:8px;align-items:center;text-align:left;background:var(--b-t);border:2px solid var(--b);color:var(--ink);border-radius:12px;padding:9px 10px;font-size:16px;font-weight:700;box-shadow:0 3px 0 var(--b)}
.cap .ci{width:34px;height:34px;flex:none;color:var(--b)} .cap .ci svg{width:100%;height:100%}
.cap:active{transform:translateY(2px);box-shadow:0 1px 0 var(--b)}
.cap.ok{background:var(--g-t);border-color:var(--g);box-shadow:none} .cap.ok .ci{color:var(--g)}
.cap.no{background:var(--no-t);border-color:var(--no);box-shadow:none;animation:shake .3s;opacity:.7}
.cap:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:8px;min-height:24px;font-size:16px}
.fb.ok{color:var(--ok);font-weight:800} .fb.no{color:var(--no)}
.quip{display:inline-block;border-left:4px solid var(--qc,#5b6b7c);padding:2px 10px;border-radius:0 8px 8px 0;background:var(--bg);color:var(--ink)}
.quip b{color:var(--qc);margin-right:4px}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--g);width:0;transition:width .3s}
.count{font-weight:900;font-size:17px;text-align:right}
/* and you */
.me h3{margin:14px 0 6px;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:6px;align-items:center;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 12px;font-size:16px;font-weight:700}

.mic.live{animation:pulse 1s infinite;background:#b31f1f}
.mic:disabled{opacity:.4}
@keyframes pulse{50%{transform:scale(1.08)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.verdict{font-weight:900;min-height:24px;margin-top:6px} .verdict.ok{color:var(--ok)} .verdict.try{color:var(--o)}

.res .r{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.res .r .ci{width:30px;height:30px;color:var(--p);flex:none} .res .r .ci svg{width:100%;height:100%}

.hint{font-size:14px;color:var(--muted)}
.check{list-style:none;padding:0;margin:0 0 14px}

.check li b{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--card)}

#leo svg{width:100%;height:100%}
#fw{position:fixed;inset:0;pointer-events:none;z-index:80}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:14px;padding:12px 18px;font-weight:900;font-size:20px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,92vw);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50}

[dir=rtl]{text-align:right}
@media (max-width:560px){ .caps{grid-template-columns:1fr} .cols{grid-template-columns:1fr} .item .pic{width:100px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

function popup(src,dst,mean){var p=$('pop'),rtl=RTL.test(ST.lang);p.classList.remove('hidden');p.innerHTML='<button aria-label="Close" data-closepop="1">\u00d7</button><div class="src">'+esc(src)+'</div><div class="dst" dir="'+(rtl?'rtl':'ltr')+'">'+esc(dst)+'</div>'+(mean?'<div class="mean" dir="'+(rtl?'rtl':'ltr')+'">'+esc(mean)+'</div>':'');}

/* ---------------- fireworks ---------------- */
function fireworks(){var c=$('fw');c.classList.remove('hidden');c.width=innerWidth;c.height=innerHeight;var ctx=c.getContext('2d');if(!ctx){c.classList.add('hidden');return;}
 var parts=[],cols=['#e07a1f','#6a3d9a','#1d7f53','#f6c27a','#2c5bc4','#ffffff'],t0=Date.now();
 for(var b=0;b<4;b++){var cx=c.width*(0.2+0.6*Math.random()),cy=c.height*(0.2+0.4*Math.random());for(var i=0;i<60;i++){var a=Math.random()*6.283,v=2+Math.random()*5;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[i%cols.length],l:60+Math.random()*40});}}
 (function tick(){ctx.clearRect(0,0,c.width,c.height);var alive=0;parts.forEach(function(p){if(p.l<=0)return;alive++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.vx*=0.99;p.l--;ctx.globalAlpha=Math.min(1,p.l/30);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);});if(alive&&Date.now()-t0<4000)requestAnimationFrame(tick);else c.classList.add('hidden');})();}

/* ---------------- events ---------------- */
document.addEventListener('click',function(e){
 var t=e.target.closest?e.target.closest('button,.tr'):null;if(!t)return;var d=function(k){return t.getAttribute('data-'+k);};
 if(t.id==='leo'){fireworks();toast(ST.egg?'Leo again! \ud83e\udd81':'You found Leo the lion! \ud83e\udd81');if(!ST.egg){ST.egg=true;dirty=true;save();}return;}
 if(d('closepop')){$('pop').classList.add('hidden');return;}
 if(d('say')){say(d('say'),t);return;}
 if(d('tr')){translate(d('tr'));return;}
 if(d('step'))return go(d('step'));
 if(d('pick')!=null)return pick(d('pick'),+d('k'));
 if(d('now')){ST.me.now=d('now');ST.rec={};dirty=true;publishScore();save();return renderMe();}
 if(d('then')){ST.me.then=d('then');ST.rec={};dirty=true;publishScore();save();return renderMe();}
 if(d('turnin'))return turnIn();
});

/* ---------------- boot ---------------- */
(function(){
 $('leo').innerHTML=LEO;
 var opts='<option value="">Choose\u2026</option>'+LANGS.map(function(l){return '<option value="'+l[0]+'">'+esc(l[1])+'</option>';}).join('');
 $('inLang').innerHTML=opts;$('langSel').innerHTML=opts.replace('<option value="">Choose\u2026</option>','');
 try{var se=localStorage.getItem('gal_student_email');if(se)$('inEmail').value=se;var sf=localStorage.getItem('gal_student_first'),sl2=localStorage.getItem('gal_student_last'),sn=localStorage.getItem('gal_student_name');
  if(sf||sl2){$('inFirst').value=sf||'';$('inLast').value=sl2||'';}else if(sn){var ps=sn.split(/\s+/);$('inFirst').value=ps[0]||'';$('inLast').value=ps.slice(1).join(' ');}
  var sp=localStorage.getItem('gal_student_period');if(sp)$('inPeriod').value=String(sp).replace(/\D/g,'');
  var sl=localStorage.getItem('vocab_lang')||localStorage.getItem('gal_student_l1');if(sl&&LANGS.some(function(l){return l[0]===sl;}))$('inLang').value=sl;}catch(e){}
 $('btnStart').addEventListener('click',function(){
  var f=$('inFirst').value.trim(),l=$('inLast').value.trim(),e=$('inEmail').value.trim().toLowerCase(),p=$('inPeriod').value,lg=$('inLang').value,err=$('loginErr');
  if(!f)return err.textContent='Please type your first name.';if(!l)return err.textContent='Please type your last name.';
  if(!EMAIL_RE.test(e))return err.textContent='Use your school email: name@s.sfusd.edu';if(!p)return err.textContent='Choose your class period.';if(!lg)return err.textContent='Choose your language.';
  err.textContent='';var canon=canonical(e);if(ST.email&&ST.email!==canon){ST.A={};ST.me={now:'',then:'',sees:''};ST.rec={};ST.turnedIn=false;}
  ST.first=f;ST.last=l;ST.name=f+' '+l;ST.email=canon;ST.period=p;ST.lang=lg;
  try{localStorage.setItem('gal_student_email',canon);localStorage.setItem('gal_student_name',ST.name);localStorage.setItem('gal_student_first',f);localStorage.setItem('gal_student_last',l);localStorage.setItem('gal_student_period',p);localStorage.setItem('gal_student_l1',lg);localStorage.setItem('vocab_lang',lg);}catch(ex){}
  registerStudent(e);$('whoLbl').textContent=ST.name+' \u00b7 Period '+p;$('langSel').value=ST.lang;
  $('login').classList.add('hidden');$('app').classList.remove('hidden');buildItems();renderNav();$('stage').innerHTML='<div class="panel"><h2>Loading\u2026</h2></div>';
  load().then(function(){publishScore();renderNav();renderStage();});
 });
 $('langSel').addEventListener('change',function(){ST.lang=this.value;try{localStorage.setItem('gal_student_l1',ST.lang);localStorage.setItem('vocab_lang',ST.lang);}catch(e){}wQueue=[];renderStage();});
})();

/* ============ Galileo standard: directions in L1 + quiet browser-translation canary ============ */
(function(){
 var DIR_ON=true,SENT={},dcache={};try{DIR_ON=localStorage.getItem('book_dir')!=='0';}catch(e){}
 function tr(text,lang){var key=lang+'|'+text;if(dcache[key])return Promise.resolve(dcache[key]);
  return rawFetch(PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('Directions for a beginner English student. Translate plainly and simply.')+'&lang='+encodeURIComponent(lang)).then(function(r){return r.json();}).then(function(d){if(!d||!d.ok||!d.translation)return null;var t=d.translation.equiv||d.translation.meaning||'';if(t)dcache[key]=t;return t||null;}).catch(function(){return null;});}
 function logReveal(k,lang){if(!ST.email)return;var sig=k+'|'+lang;if(SENT[sig])return;SENT[sig]=true;rawFetch(SUPA_URL+'/rest/v1/instruction_reveals',{method:'POST',headers:hdr('return=minimal'),body:JSON.stringify([{email:ST.email,set_slug:SLUG,activity:k,lang:lang}])}).catch(function(){});}
 function showDirections(){var lang=ST.lang,list=document.querySelectorAll('#stage .lede');
  Array.prototype.forEach.call(list,function(p){var out=p.querySelector('.dirtr');
   if(!p.getAttribute('data-en')){var en=(p.textContent||'').replace(out?out.textContent:'','').trim();p.setAttribute('data-en',en);p.setAttribute('translate','yes');p.setAttribute('data-dir',ST.step);}
   if(!out){out=document.createElement('span');out.className='dirtr';p.appendChild(out);}
   if(!DIR_ON||!lang){out.textContent='';return;}var k=p.getAttribute('data-dir'),en=p.getAttribute('data-en')||'';if(!en)return;
   out.setAttribute('dir',RTL.test(lang)?'rtl':'ltr');out.textContent='\u2026';tr(en,lang).then(function(t){out.textContent=t||'';if(t)logReveal(k,lang);});});}
 var dirBtn=$('btn-dir');dirBtn.classList.toggle('on',DIR_ON);dirBtn.addEventListener('click',function(){DIR_ON=!DIR_ON;try{localStorage.setItem('book_dir',DIR_ON?'1':'0');}catch(e){}dirBtn.classList.toggle('on',DIR_ON);showDirections();});
 var pend=null;new MutationObserver(function(){if(pend)return;pend=setTimeout(function(){pend=null;showDirections();},120);}).observe($('stage'),{childList:true});
 var EXPECT=(dirBtn.textContent||'').trim(),TR_SENT='';
 function detect(){var got=(dirBtn.textContent||'').trim(),observed=(got&&got!==EXPECT)?got:'',cls=document.documentElement.className||'';if(!observed&&!/translated/.test(cls))return null;return {observed:observed,html_lang:document.documentElement.lang||'',html_class:cls};}
 function checkTranslation(){var d=detect();if(!d||!ST.email)return;var sig=d.observed+'|'+d.html_lang;if(sig===TR_SENT)return;TR_SENT=sig;rawFetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{email:ST.email,set_slug:SLUG,translated:true,observed:d.observed,html_lang:d.html_lang,html_class:d.html_class,updated_at:new Date().toISOString()}])}).catch(function(){});}
 window.checkTranslation=checkTranslation;setInterval(checkTranslation,20000);setTimeout(checkTranslation,4000);
})();
</script>
