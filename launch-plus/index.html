<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Launch Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--pine:#1b4332;--pine2:#2d6a4f;--moss:#40916c;--sage:#95d5b2;--paper:#f4f5f2;--card:#fff;--ink:#1f2421;--muted:#5c6b62;--line:#dfe4dd;--gold:#d4a017}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.6}
#bar{background:var(--pine);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
#bar .brand{font-weight:800;font-size:1.05rem}
#bar .brand small{display:block;font-weight:600;font-size:.78rem;opacity:.8}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px}
a.lesson{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--moss);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:inherit}
a.lesson:hover{border-color:var(--moss)}
a.lesson .n{font-weight:800;font-size:1.05rem}
a.lesson .d{font-size:.88rem;color:var(--muted)}
a.lesson .go{margin-left:auto;font-weight:800;color:var(--pine2);white-space:nowrap}
.book{font-size:.82rem;color:var(--pine2);margin-top:3px}
.book b{font-weight:800}
.soon{opacity:.5;border-left-color:var(--line)}
.soon .go{color:var(--muted)}
</style>
</head>
<body>
<div id="bar"><div class="brand">Launch Plus<small>ELD 101 · stretch practice</small></div></div>
<main>
<h2>Unit 1</h2>
<div id="list"></div>
</main>
<script>
var LESSONS=[
 {u:'u1-l1',n:'Lesson 1 · People at School',d:'Read · Fix · Bigger words · Zoom in · Write · Record',live:true,
  book:'Book: Lesson 1 <b>pp. 6–9</b> (school, students, teacher, friends) + Lesson 6 <b>pp. 64–67</b> (the jobs). Do the book pages first, then this.'},
 {u:'u1-l2',n:'Lesson 2 · Introductions',d:'Read · Fix · Bigger words · Zoom in · Write · Record',live:true,
  book:'Book: Lesson 2 <b>pp. 16–21</b> (words + How to Introduce Yourself). Do the book pages first, then this. Book p. 28 (Write a Note) after.'}
];
document.getElementById('list').innerHTML=LESSONS.map(function(l){
 return l.live?'<a class="lesson" href="'+l.u+'/"><div><div class="n">'+l.n+'</div><div class="d">'+l.d+'</div></div><span class="go">Start →</span></a>'
  :'<div class="lesson soon" style="display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-left:7px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px"><div><div class="n">'+l.n+'</div><div class="d">'+l.d+'</div></div><span class="go">soon</span></div>';
}).join('');
</script>
</body>
</html>
