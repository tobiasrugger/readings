<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Weekend: Word Game</title>
<meta name="build" content="launch-plus/weekend/game T-199 2026-11-02 · T-206 no die · T-222 no exit link, all verb forms · T-225 simple setup">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#23302b;--pine:#1f4536;--pine2:#2d6a4f;--cream:#f7f1e3;--purple:#864D9E;--purple2:#6a3a80;--orange:#F8981F;--muted:#4f5d55;--ok:#2f9e44}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,Arial,sans-serif;font-size:18px;line-height:1.4;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
.btn{font-family:inherit;font-weight:900;font-size:1.15rem;border:0;border-radius:14px;padding:14px 26px;cursor:pointer;background:var(--pine2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn.orange{background:var(--orange);color:#2b1b35}
.btn.go{background:var(--ok)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.say{border:2px solid var(--pine2);background:#fff;color:var(--pine2);border-radius:50%;width:42px;height:42px;font-size:1.15rem;cursor:pointer;flex:none;display:inline-grid;place-items:center;vertical-align:middle}
.tr{color:var(--purple2);font-weight:800;font-size:1.05rem}
.tr[dir=rtl]{direction:rtl}
.box{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 rgba(35,48,43,.22)}
.screen{display:none;min-height:100vh}
.screen.on{display:block}

/* ---------- setup ---------- */
#setup.on{background:#fff}
#setup .wrap{max-width:720px;margin:0 auto;padding:28px 16px 30px}
#setup h1{margin:0 0 4px;font-size:2rem;font-weight:900;color:var(--pine)}
.prow{display:flex;gap:12px;align-items:center;margin:12px 0}
.prow input{flex:1;min-width:0;font-family:inherit;font-size:1.35rem;font-weight:800;padding:10px 14px;border:3px solid var(--ink);border-radius:12px}
.prow select{font-family:inherit;font-size:1.05rem;font-weight:700;padding:10px;border:3px solid var(--ink);border-radius:12px;background:#fff;width:150px}
#setupMsg{color:#a3412b;font-weight:800;min-height:1.4em}

/* ---------- game ---------- */
#game{display:none}
#game.on{display:grid;grid-template-columns:1fr 250px;gap:14px;padding:14px;min-height:100vh}
.stage{position:relative;overflow:hidden}
.turn{padding:16px 20px;height:100%;display:flex;flex-direction:column;gap:12px;transition:transform .45s ease,opacity .45s ease}
.turn.out{transform:translateX(-110%);opacity:0}
.turn.in{transform:translateX(110%);opacity:0}
.roundtag{font-weight:900;font-size:.95rem;color:#fff;background:var(--purple);border-radius:10px;padding:4px 12px;align-self:flex-start}
.who{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:900;line-height:1;letter-spacing:-.01em}
.q{display:none;gap:16px;align-items:flex-start}
.q.on{display:flex}
.q .pic{flex:0 0 min(50%,540px);border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff}
.q .pic svg{width:100%;height:auto;display:block}
.q .right{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.prompt{font-size:1.6rem;font-weight:900;line-height:1.2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.word{display:inline-flex;align-items:center;gap:10px;font-size:2.2rem;font-weight:900;background:#fff8e8;border:3px solid var(--ink);border-radius:14px;padding:4px 16px;align-self:flex-start}
.word .lab{font-size:.8rem;font-weight:900;color:#fff;background:var(--ink);border-radius:6px;padding:1px 6px}
.word .lab.past{background:var(--purple)}
.ans{font-family:inherit;font-size:1.7rem;font-weight:800;padding:12px 16px;border:3px solid var(--ink);border-radius:14px;width:100%}
.ans:focus{outline:4px solid var(--orange);outline-offset:1px}
.ans.wob{animation:wob .4s}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:3.2em;font-weight:800;font-size:1.15rem}
.fb .quip{display:flex;gap:10px;align-items:center;background:#f3eefb;border:2px solid var(--purple);border-radius:12px;padding:8px 12px}
.fb .quip svg{width:44px;height:44px;flex:none}
.fb .hint{margin-top:6px;color:var(--purple2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips button{font-family:inherit;font-weight:900;font-size:1.15rem;border:2px solid var(--ink);border-radius:12px;padding:6px 14px;background:#fff;cursor:pointer}
.yes{font-size:2.6rem;font-weight:900;color:var(--ok);display:flex;align-items:center;gap:12px}
.yes small{font-size:1.1rem;color:var(--muted)}

/* ---------- tally ---------- */
.tally{padding:14px;display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:14px}
.tally h3{margin:0;font-size:1.1rem;font-weight:900;color:var(--pine)}
.trow{border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff}
.trow.now{box-shadow:0 0 0 4px var(--orange)}
.trow .nm{font-weight:900;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;gap:6px}
.trow .pts{font-size:1.9rem;font-weight:900;color:var(--ink)}
.trow .stars{font-size:1rem;letter-spacing:1px;min-height:1.2em;word-break:break-all}
.trow.pop .pts{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.5)}}
#egg{width:30px;height:30px;opacity:.5;cursor:pointer;align-self:flex-end}
#egg:hover{opacity:1}

/* ---------- splash ---------- */
#splash .wrap,#final .wrap{max-width:760px;margin:0 auto;padding:30px 16px}
#splash .box,#final .box{padding:24px;text-align:center}
.big1{font-size:2.6rem;font-weight:900;margin:0;color:var(--purple2)}
.example{margin:16px auto;max-width:560px;text-align:left;border:2px dashed var(--purple);border-radius:14px;padding:12px 16px;background:#faf6ff;display:flex;gap:14px;align-items:center}
.example svg{width:140px;flex:none;border:2px solid var(--ink);border-radius:10px}
.example .t{font-weight:800;font-size:1.15rem}
.stand{display:grid;gap:8px;margin:14px auto;max-width:460px}
.stand div{border:2.5px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:900;font-size:1.3rem;display:flex;justify-content:space-between;background:#fff}
.stand div:first-child{background:#ffe08a}
.fw{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:90}

@media (max-width:820px){
 #game.on{grid-template-columns:1fr}
 .tally{position:static;order:-1;flex-direction:row;flex-wrap:wrap}
 .tally h3,#egg{display:none}
 .trow{flex:1;min-width:110px}
 .q.on{flex-direction:column}
 .q .pic{flex:none;width:100%}
 .prow select{width:110px}
}
</style>
</head>

<!-- ============ 1. who is playing ============ -->
<section class="screen on" id="setup"><div class="wrap">
  <h1>Last Weekend: Word Game</h1>
  <div id="prows"></div>
  <div id="setupMsg"></div>
  <button class="btn orange" onclick="startGame()" style="font-size:1.35rem">&#9654; Start</button>
</div></section>

<!-- ============ 2. round splash ============ -->
<section class="screen" id="splash"><div class="wrap"><div class="box" id="splashBox"></div></div></section>

<!-- ============ 3. the game ============ -->
<section id="game">
  <div class="box stage"><div class="turn" id="turn"></div></div>
  <aside class="box tally" id="tally"></aside>
</section>

<!-- ============ 4. the end ============ -->
<section class="screen" id="final"><div class="wrap"><div class="box" id="finalBox"></div></div></section>

 var e=EX[round],h='<p style="margin:0;font-weight:900;color:#4f5d55">ROUND '+(round+1)+' OF 4</p><p class="big1">'+RNAME[round]+'</p>'
  +'<div class="prompt" style="justify-content:center;font-size:1.3rem;margin-top:8px">'+RQ[round][0]+' '+sayBtn(RQ[round][0])+'</div>'
  +'<div class="example">'+ART[e.pic].replace('class="art"','')+'<div class="t"><div style="font-size:.85rem;color:#6a3a80;font-weight:900">EXAMPLE</div>'+e.t+'</div></div>';
 if(round>0)h+=standHTML();
 h+='<button class="btn orange" onclick="beginRound()" style="font-size:1.35rem">&#9654; Start Round '+(round+1)+'</button>';
 document.getElementById('splashBox').innerHTML=h;show('splash');say('Round '+(round+1)+'. '+RNAME[round]);
}
function beginRound(){
 qn=0;turn=0;
 var need=players.length*EACH;deck=[];
 while(deck.length<need)deck=deck.concat(shuffle(PICS));
 deck=deck.slice(0,need);
 show('game');drawTally();newTurn(false);
}

/* ---- one turn ---- */
function newTurn(slide){
 var p=players[turn],box=document.getElementById('turn');
 cur=deck[qn];tries=0;busy=false;
 var h='<span class="roundtag">Round '+(round+1)+' &middot; '+RNAME[round]+' &middot; '+(qn+1)+' of '+deck.length+'</span>'
  +'<div class="who" style="color:'+p.color+'">'+esc(p.name)+'</div>'

  +'<div class="q" id="q"></div>';
 function put(){box.innerHTML=h;drawTally();showQ(p.name+', your turn.');}
 if(slide){box.classList.add('out');setTimeout(function(){box.classList.remove('out');box.classList.add('in');put();void box.offsetWidth;box.classList.remove('in');},450);}
 else put();
}
function trOf(arr,lang){return lang&&LI[lang]!=null?arr[LI[lang]+1]:'';}
function trLine(text,lang){return text?'<div class="tr"'+(lang==='ar'?' dir="rtl"':'')+'>'+text+'</div>':'';}
function showQ(intro){
 busy=false;
 var p=players[turn],c=cur,L=p.lang,q=document.getElementById('q');
 
 var word='';
 if(round===1||round===2)word='<div class="word"><span class="lab">NOW</span>'+c.v+' '+sayBtn(c.v)+'</div>'+trLine(trOf([c.v].concat(VTR[c.v]),L),L);
 if(round===3)word='<div class="word"><span class="lab past">PAST</span>'+c.p+' '+sayBtn(c.p)+'</div>'+trLine(trOf([c.v].concat(VTR[c.v]),L),L);
 q.innerHTML='<div class="pic">'+ART[c.id].replace('class="art"','')+'</div><div class="right">'
  +'<div class="prompt">'+RQ[round][0]+' '+sayBtn(RQ[round][0])+'</div>'+trLine(RQ[round][LI[L]!=null?LI[L]+1:-1],L)
  +word
  +'<input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(round===0?'Type here…':round===2?'Past tense…':'Write a sentence…')+'" onkeydown="if(event.key===\'Enter\')check()">'
  +'<div><button class="btn go" onclick="check()" id="chk">&#10003; Check</button></div>'
  +'<div class="fb" id="fb"></div></div>';
 q.classList.add('on');
 setTimeout(function(){var a=document.getElementById('ans');if(a)a.focus();},60);
 say((intro?intro+' ':'')+RQ[round][0]+(round===1||round===2?' '+c.v:round===3?' '+c.p:''));
}

/* ================= checking ================= */
function norm(s){return String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ').trim();}
function words(s){return norm(s).split(' ').filter(Boolean);}
function hasWord(s,list){var w=words(s);return list.some(function(x){return w.indexOf(x)>=0;});}
function sentenceProblem(raw,need,needName){
 var s=String(raw||'').trim();
 if(words(s).length<3)return 'Write a whole sentence \u2014 three words or more.';
 if(!hasWord(s,need))return 'Use the word <b>'+needName+'</b> in your sentence.';
 if(!/^[A-Z]/.test(s))return 'Start with a <b>capital letter</b>.';
 if(!/[.!?]$/.test(s))return 'End with a <b>period</b> ( . )';
 return '';
}
function judge(raw){
 var c=cur,s=norm(raw);
 if(!s)return {ok:false,msg:'Type your answer first.'};
 if(round===0){ var ok=words(s).some(function(w){return c.k.some(function(k){return w.indexOf(k)===0;});}); return {ok:ok}; }
 if(round===1){ var pr=sentenceProblem(raw,c.f.split(' '),c.v); return {ok:!pr,msg:pr}; }
 if(round===2){ var w=s.replace(/[.!?]/g,'').trim(); return {ok:w===c.p,msg:''}; }
 var pr2=sentenceProblem(raw,[c.p],c.p);
 if(pr2&&words(raw).length>=3&&!hasWord(raw,[c.p])&&hasWord(raw,c.f.split(' ').filter(function(x){return x!==c.p;})))pr2='Use the past: <b>'+c.p+'</b>, not now.';
 return {ok:!pr2,msg:pr2};
}
var QUIPS=['Almost! Look at the picture again.','So close. Try one more time!','Hmm, not yet. You can do it!','Good try! Check your word.','Nope \u2014 but I believe in you!'];
function check(){
 if(busy)return;
 var a=document.getElementById('ans'),fb=document.getElementById('fb'),r=judge(a.value);
 if(r.ok){win();return;}
 if(r.msg==='Type your answer first.'){fb.innerHTML='<div class="hint">'+r.msg+'</div>';return;}
 tries++;
 a.classList.remove('wob');void a.offsetWidth;a.classList.add('wob');
 var cast=CAST[(turn+tries)%CAST.length];
 var h='<div class="quip">'+face(cast)+'<span><b>'+cast[0]+':</b> '+QUIPS[(qn+tries)%QUIPS.length]+'</span></div>';
 h+='<div class="hint">'+hint()+'</div>';
 if(r.msg)h='<div class="quip">'+face(cast)+'<span><b>'+cast[0]+':</b> '+r.msg+'</span></div>';
 else h+=chips();
 fb.innerHTML=h;
 a.focus();
}
function hint(){
 var c=cur;
 if(round===0){
  if(tries===1)return 'What is the person <b>doing</b>? One word is enough.';
  return 'It starts with <b>'+c.ing.charAt(0)+'</b>: '+c.ing.charAt(0)+' '+new Array(c.ing.length).join('_ ');
 }
 if(round===2){
  var irr=[c.v+'ed',c.v+'d',c.v.slice(0,-1)+'ied',c.v+c.v.slice(-1)+'ed'].indexOf(c.p)<0;
  if(tries===1)return irr?'This one is a <b>new word</b> \u2014 not -ed.':'Add <b>-ed</b>.';
  return 'It starts with <b>'+c.p.charAt(0)+'</b>: '+c.p.charAt(0)+' '+new Array(c.p.length).join('_ ');
 }
 return '';
}
function chips(){
 if(tries<3||(round!==0&&round!==2))return '';
 var c=cur,opts;
 if(round===0){var others=shuffle(PICS.filter(function(x){return x.id!==c.id&&x.ing!==c.ing;})).slice(0,2).map(function(x){return x.ing;});opts=[c.ing].concat(others);}
 else{opts=[c.p,c.v+'s',c.v==='read'?'readed':c.v+'ed'];if(opts[2]===c.p)opts[2]=c.v+'ing';}
 opts=shuffle(opts);
 return '<div class="hint">Which one? Tap it, then Check.</div><div class="chips">'+opts.map(function(o){return '<button onclick="document.getElementById(\'ans\').value=\''+o+'\';document.getElementById(\'ans\').focus()">'+o+'</button>';}).join('')+'</div>';
}
function win(){
 busy=true;
 var p=players[turn],first=tries===0;
 if(first){p.score++;p.stars+='\u2605';}
 var fb=document.getElementById('fb');
 fb.innerHTML='<div class="yes">&#10003; '+(first?'+1 '+esc(p.name)+'!':'You got it! <small>(point on the first try)</small>')+'</div>';
 document.getElementById('chk').style.display='none';
 document.getElementById('ans').readOnly=true;
 drawTally(first?turn:-1);
 say(first?'Correct! Plus one.':'Yes! You got it.');
 setTimeout(next,2000);
}
function next(){
 qn++;
 if(qn>=deck.length){round++;if(round>=4)finish();else showSplash();return;}
 turn=(turn+1)%players.length;newTurn(true);
}

/* ================= tally ================= */
function drawTally(pop){
 var t=document.getElementById('tally');
 t.innerHTML='<h3>Points</h3>'+players.map(function(p,i){
  return '<div class="trow'+(i===turn?' now':'')+(i===pop?' pop':'')+'"><div class="nm" style="color:'+p.color+'"><span>'+esc(p.name)+'</span><span class="pts">'+p.score+'</span></div><div class="stars" style="color:'+p.color+'">'+p.stars+'</div></div>';
 }).join('')+'<svg id="egg" viewBox="0 0 64 64" onclick="fireworks()" aria-label="lion">'+LION.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')+'</svg>';
}
function standHTML(){
 var s=players.slice().sort(function(a,b){return b.score-a.score;});
 return '<div class="stand">'+s.map(function(p){return '<div><span style="color:'+p.color+'">'+esc(p.name)+'</span><span>'+p.score+'</span></div>';}).join('')+'</div>';
}
function finish(){
 var s=players.slice().sort(function(a,b){return b.score-a.score;}),top=s[0].score,w=s.filter(function(p){return p.score===top;}).map(function(p){return p.name;});
 document.getElementById('finalBox').innerHTML='<p class="big1">&#127881; '+esc(w.join(' and '))+(w.length>1?' win!':' wins!')+'</p>'+standHTML()
  +'<button class="btn orange" onclick="again()">Play again</button> <button class="btn ghost" onclick="show(\'setup\')">New players</button>';
 show('final');fireworks();say(w.join(' and ')+(w.length>1?' win!':' wins!'));
}
function again(){players.forEach(function(p){p.score=0;p.stars='';});round=0;showSplash();}

/* ================= lion ================= */
var LION='<svg viewBox="0 0 64 64" aria-hidden="true">'
+'<g>'
/* outer mane: big dark tufts */
+'<g fill="#8a3b1f">'+(function(){var s='';for(var i=0;i<9;i++){var a=i*40*Math.PI/180,x=32+Math.cos(a)*21,y=32+Math.sin(a)*21;s+='<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="11" ry="9" transform="rotate('+(i*40)+' '+x.toFixed(1)+' '+y.toFixed(1)+')"/>';}return s;})()+'</g>'
/* inner mane: lighter, offset so the edge reads as fur not petals */
+'<g fill="#d8691f">'+(function(){var s='';for(var i=0;i<9;i++){var a=(i*40+20)*Math.PI/180,x=32+Math.cos(a)*16,y=32+Math.sin(a)*16;s+='<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="9" ry="7.5" transform="rotate('+(i*40+20)+' '+x.toFixed(1)+' '+y.toFixed(1)+')"/>';}return s;})()+'</g>'
/* ears */
+'<circle cx="19" cy="20" r="5.5" fill="#8a3b1f"/><circle cx="19" cy="20" r="2.6" fill="#e8a07a"/>'
+'<circle cx="45" cy="20" r="5.5" fill="#8a3b1f"/><circle cx="45" cy="20" r="2.6" fill="#e8a07a"/>'
/* face */
+'<circle cx="32" cy="33" r="15.5" fill="#f3c98f" stroke="#6b2f16" stroke-width="2"/>'
+'<ellipse cx="25.5" cy="29" rx="2.9" ry="3.4" fill="#2a1a10"/><ellipse cx="38.5" cy="29" rx="2.9" ry="3.4" fill="#2a1a10"/>'
+'<circle cx="26.6" cy="27.8" r="1.1" fill="#fff"/><circle cx="39.6" cy="27.8" r="1.1" fill="#fff"/>'
+'<ellipse cx="32" cy="38.5" rx="9" ry="6.5" fill="#f8ddb8"/>'
+'<path d="M27.5 35.5 h9 l-4.5 4.2z" fill="#6b2f16"/>'
+'<path d="M32 39.7 v3.2 M32 42.9 q-4.5 3.4-8 .4 M32 42.9 q4.5 3.4 8 .4" fill="none" stroke="#6b2f16" stroke-width="2.1" stroke-linecap="round"/>'
+'<path d="M22 36.5 l-8-2 M22 39.5 l-8 1.5 M42 36.5 l8-2 M42 39.5 l8 1.5" stroke="#6b2f16" stroke-width="1.5" stroke-linecap="round"/>'
+'</g></svg>';
function fireworks(){var cols=['#864D9E','#F8981F','#2fb34a','#e63946','#ffd34d'];
 for(var b=0;b<3;b++)(function(b){setTimeout(function(){var cx=innerWidth*(.25+.25*b),cy=innerHeight*(.3+.1*(b%2));
  for(var i=0;i<28;i++){var d=document.createElement('div');d.className='fw';d.style.background=cols[i%5];d.style.left=cx+'px';d.style.top=cy+'px';document.body.appendChild(d);
   var a=i/28*Math.PI*2,r=90+Math.random()*70;
   d.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+(Math.cos(a)*r)+'px,'+(Math.sin(a)*r+30)+'px)',opacity:0}],{duration:1100,easing:'cubic-bezier(.2,.7,.3,1)'});
   setTimeout(function(x){return function(){x.remove();};}(d),1150);}},b*300);})(b);}

renderSetup();
</script>
