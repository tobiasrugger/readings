<style>
:root{
 --purple:#864D9E; --purple2:#6a3a80; --orange:#F8981F; --orange2:#d97d0c;
 --ink:#23302b; --muted:#4f5d55; --pine:#1f4536; --pine2:#2d6a4f;
 --cream:#f7f1e3; --sky:#e8f3ee; --qblue:#bfe4f6; --qgreen:#c9efb8; --gold:#ffe08a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,Arial,sans-serif;font-size:17px;line-height:1.45;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--pine);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.2)}
header h1{font-size:1.3rem;margin:0;font-weight:900}
header .sub{font-size:.8rem;opacity:.85;font-weight:700;display:block}
header .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
header a,header button.hb{color:#fff;text-decoration:none;font-weight:800;font-size:.85rem;font-family:inherit;cursor:pointer;
 background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 12px}
header a.green{background:#3bb273;border-color:#fff;font-size:.95rem}
main{max-width:1180px;margin:0 auto;padding:14px 12px 50px}
.box{background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(35,48,43,.2);padding:14px 16px;margin:0 0 16px}
.box::after{content:"";display:block;clear:both}
.box h2{margin:0 0 6px;font-size:1.12rem;color:var(--pine);font-weight:900}
.pic{float:right;width:min(30%,190px);margin:0 0 8px 14px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.pic svg{width:100%;height:auto;display:block}
.btn{font-family:inherit;font-weight:900;font-size:1rem;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;
 background:var(--pine2);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.orange{background:var(--orange);color:#2b1b35}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.small{font-size:.88rem;padding:8px 13px}
.say{border:2px solid var(--pine2);background:#fff;color:var(--pine2);border-radius:50%;width:40px;height:40px;font-size:1.1rem;cursor:pointer;flex:none;display:inline-grid;place-items:center;vertical-align:middle}
.tr{color:var(--purple2);font-weight:700;font-size:1rem;margin-top:3px}
.tr[dir=rtl]{text-align:right}

/* ---------- setup ---------- */
#setup .rows{display:grid;gap:10px;margin:8px 0 12px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--sky)}
.prow .tok{width:34px;height:34px;flex:none}
.prow input,.prow select{font-family:inherit;font-size:1rem;padding:8px 10px;border:2px solid var(--ink);border-radius:9px;background:#fff}
.prow input{width:160px}
.count{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.count button{font-family:inherit;font-weight:900;font-size:1rem;border:0;padding:9px 16px;cursor:pointer;background:#fff;color:var(--ink)}
.count button.on{background:var(--purple);color:#fff}
.how p{margin:4px 0}

/* ---------- board ---------- */
#boardBox{padding:10px;overflow-x:auto}
.board{display:grid;min-width:740px;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,auto);gap:0;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.sq{position:relative;border:1.5px solid var(--ink);padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 cursor:pointer;min-height:104px;background:#fff;text-align:center}
.sq:hover{outline:3px solid var(--orange);outline-offset:-3px;z-index:2}
.sq svg.art{width:100%;max-width:112px;height:auto;display:block}
.sq .lab{font-weight:900;font-size:.92rem;line-height:1.1;margin-top:2px}
.sq .num{position:absolute;top:2px;left:4px;font-size:.66rem;font-weight:900;color:#7a867f}
.sq.q,.sq.q2{box-shadow:inset 0 0 0 3px var(--purple)}
.sq.q .lab,.sq.q2 .lab{font-size:.84rem}
.sq.start .lab,.sq.finish .lab{font-size:1.2rem;letter-spacing:.03em}
.sq.here{box-shadow:inset 0 0 0 5px var(--ink)}
.toks{position:absolute;right:2px;bottom:2px;width:84px;height:84px;pointer-events:none;z-index:3}
.toks svg{position:absolute;width:32px;height:40px;filter:drop-shadow(0 3px 1.5px rgba(0,0,0,.45))}
.toks svg.hop{animation:hop .26s ease-out}
.toks svg.me{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{margin-bottom:0}50%{margin-bottom:5px}}
.toks .pile{position:absolute;right:0;top:0;background:#23302b;color:#fff;font-size:.62rem;font-weight:900;border-radius:8px;padding:0 5px;z-index:9}
.qbadge{position:absolute;top:3px;right:4px;background:var(--purple);color:#fff;font-weight:900;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.85rem;border:2px solid #fff}
.score{margin:8px 0 2px;display:grid;gap:4px}
.score .r{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px 7px;font-weight:800;font-size:.92rem;text-align:left}
.score .r.now{background:#F8981F;color:#2b1b35}
.score .r svg{width:18px;height:23px;flex:none}
.score .r b{margin-left:auto;font-size:1.05rem}
.pts{display:none;border:2.5px solid var(--ink);border-radius:12px;padding:9px 11px;margin:0 0 10px;background:#fff}
.pts.on{display:block}
.pts .k{font-size:.78rem;font-weight:900;color:var(--pine2);letter-spacing:.06em;margin-bottom:6px}
.got{font-weight:900;color:#2d6a4f;font-size:1.15rem}
.hint2{display:none;font-weight:800;color:#6a3a80;margin-top:6px}
.hint2.on{display:block}
.stand{display:grid;gap:6px;margin:8px 0}
.stand .r{display:flex;gap:8px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:900;font-size:1.1rem}
.stand .r:first-child{background:#ffe08a}
.stand svg{width:24px;height:30px}.stand b{margin-left:auto}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}}
.center{grid-column:2 / 7;grid-row:2 / 6;border:1.5px solid var(--ink);padding:10px 12px;display:grid;grid-template-columns:1fr 210px;gap:10px;align-items:start;background:#fffdf7}
.center h3{margin:0 0 4px;font-size:1.5rem;font-weight:900;line-height:1.15;color:var(--ink)}
.center .frames div{font-size:1.25rem;font-weight:800;margin:4px 0}
.center .frames .no{color:#b0392b}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--orange);margin:0 4px}
.verbs{border:2px solid var(--ink);border-radius:10px;padding:6px 8px;margin-top:8px;background:#fff;font-size:.92rem}
.verbs .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verbs b{color:var(--purple2)}
.verbs h4{margin:2px 0 4px;font-size:.92rem}
.turn{border:2.5px solid var(--ink);border-radius:12px;padding:8px;text-align:center;background:#2b1b35;color:#fff}
.turn .who{font-weight:900;font-size:1.05rem;display:flex;gap:6px;align-items:center;justify-content:center}
.turn .who svg{width:22px;height:28px}
.die{width:96px;height:96px;margin:8px auto;border-radius:18px;position:relative;cursor:pointer;
 background:linear-gradient(150deg,#a063bd,var(--purple) 55%,var(--purple2));
 box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 -6px 0 rgba(0,0,0,.14),inset 0 6px 0 rgba(255,255,255,.22)}
.die.rolling{animation:tumble .62s cubic-bezier(.3,.1,.3,1)}
@keyframes tumble{0%{transform:rotate(0)}25%{transform:rotate(-18deg) scale(1.06)}50%{transform:rotate(16deg) scale(.96)}75%{transform:rotate(-9deg)}100%{transform:rotate(0)}}
.face{position:absolute;inset:9px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.face>span{display:grid;place-items:center}
.pip{display:block;width:19px;height:19px;border-radius:50%;background:var(--orange);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.lion{position:absolute;inset:6px;display:none;place-items:center}.lion svg{width:100%;height:100%}
.die.roar .lion{display:grid;animation:roar .78s ease-out}.die.roar .face{opacity:0}
@keyframes roar{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.12);opacity:1}70%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.turn .msg{font-size:.9rem;font-weight:700;color:#e7d8f2;min-height:2.4em}
#egg{width:26px;height:26px;cursor:pointer;opacity:.55;display:inline-block;vertical-align:middle;margin-left:6px}
#egg:hover{opacity:1}

#veil{position:fixed;inset:0;background:rgba(20,28,24,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#veil.on{display:flex}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 8px 0 rgba(0,0,0,.3);max-width:640px;width:100%;max-height:94vh;overflow:auto;padding:14px 16px}
.card::after{content:"";display:block;clear:both}
.card .pic{width:min(40%,220px)}
.card .step,.card .check{overflow:hidden}
.step{border:2px solid var(--ink);border-radius:12px;padding:9px 11px;margin:0 0 10px;background:var(--sky)}
.step.ans{background:#fff8e8}
.step .k{font-size:.78rem;font-weight:900;color:var(--pine2);letter-spacing:.06em}
.step .big{font-size:1.3rem;font-weight:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step .base{display:inline-block;background:#f3e9f8;color:var(--purple2);border-radius:8px;padding:0 8px;font-weight:900}
.check{border:2.5px solid #2d6a4f;border-radius:12px;padding:9px 11px;background:#eaf7ef;margin:0 0 10px;display:none}
.check.on{display:block}
.check .big{font-size:1.25rem;font-weight:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check .neg{color:#8f2f22}
.check .v{color:var(--purple2);text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--orange)}
.snd{display:inline-block;font-size:.85rem;font-weight:900;border:2px solid var(--ink);border-radius:20px;padding:1px 9px;background:#fff;margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;clear:both}
.follow{font-size:.95rem;color:var(--muted);font-weight:700;margin:2px 0 10px}

/* fireworks */
.fw{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:90}

@media (max-width:760px){

@media print{

 .toks{display:none}
 .center{grid-template-columns:1fr}
}

var COLORS=[['#e63946','red'],['#ffd23f','yellow'],['#2fb34a','green'],['#2f7de1','blue'],['#ff6fb5','pink']];
var SQCOL=['#fde2c4','#ffd6d6','#fff1b3','#d6f5d1','#cfe9ff','#e9dcff','#ffe0f0','#d4f1ee','#ffe8b8','#e2f0c8','#dcdcff','#ffd9c9','#f6e0ff','#cdeffd','#fff5c2','#d9f7dc','#ffd8e4','#e0e8ff','#fbe6c8','#d7f2f9','#efe0c8','#ffe3a8'];
function token(c){return '<svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 2 a6 6 0 1 1 0 12 a6 6 0 1 1 0-12z M5 28 q0-12 7-13 q7 1 7 13z" fill="'+c+'" stroke="#23302b" stroke-width="1.6"/><circle cx="10" cy="7" r="1.6" fill="#fff" opacity=".7"/></svg>';}
var nPlayers=2,players=[],turn=0,practice=false,busy=false,lastRoll=0;
function renderSetup(){
 document.getElementById('count').innerHTML=[2,3,4,5].map(function(n){return '<button class="'+(n===nPlayers?'on':'')+'" onclick="nPlayers='+n+';renderSetup()">'+n+'</button>';}).join('');
 var rows='';
 for(var i=0;i<nPlayers;i++){
  var keepN=(document.getElementById('pn'+i)||{}).value||'', keepL=(document.getElementById('pl'+i)||{}).value||'zh';
  rows+='<div class="prow"><span class="tok">'+token(COLORS[i][0])+'</span><input id="pn'+i+'" placeholder="Name" value="'+keepN.replace(/"/g,'')+'" maxlength="16">'
   +'<select id="pl'+i+'" aria-label="language" onchange="renderHow()">'+LANGS.map(function(l){return '<option value="'+l[0]+'"'+(l[0]===keepL?' selected':'')+'>'+l[1]+'</option>';}).join('')+'</select></div>';
 }
 document.getElementById('prows').innerHTML=rows;
 renderHow();
}
function renderHow(){
 var l=(document.getElementById('pl0')||{}).value||'zh', h='';
 HOW.en.forEach(function(t,i){h+='<p><b>'+(i+1)+'.</b> '+t+' '+sayBtn(t)+'<div class="tr"'+(l==='ar'?' dir="rtl"':'')+'>'+HOW[l][i]+'</div></p>';});
 document.getElementById('how').innerHTML=h;
}
function startGame(){
 players=[];
 for(var i=0;i<nPlayers;i++){
  var nm=(document.getElementById('pn'+i).value||'').trim()||('Player '+(i+1));
  players.push({name:nm,lang:document.getElementById('pl'+i).value,pos:0,score:0,color:COLORS[i][0]});
 }
 practice=false;turn=0;
 document.getElementById('setup').style.display='none';
 drawBoard();updateTurn(players[0].name+', roll the die!');
 document.getElementById('boardBox').scrollIntoView({behavior:'smooth'});
 say(players[0].name+', it is your turn. Roll the die.');
}
function practiceMode(){practice=true;players=[];drawBoard();document.getElementById('boardBox').scrollIntoView({behavior:'smooth'});}

/* ================= board ================= */
function sqInfo(id){
 if(id==='START')return {cls:'start',lab:'START',art:ART.START};
 if(id==='FINISH')return {cls:'finish',lab:'FINISH',art:ART.FINISH};
 if(id==='AGAIN')return {cls:'again',lab:'Roll again!',art:ART.AGAIN};
 if(id==='Q:sat')return {cls:'q',lab:'What did you do on Saturday?',art:ART.Q};
 if(id==='Q:sun')return {cls:'q',lab:'What did you do on Sunday?',art:ART.Q};
 if(id==='Q:main')return {cls:'q2',lab:'What did you do last weekend?',art:ART.Q};
 return {cls:'',lab:ACT[id].base,art:ART[id]};
}
function drawBoard(){
 var cells=new Array(42),h='';
 PATH.forEach(function(id,i){var rc=cellFor(i);cells[rc[1]*7+rc[0]]=i;});
 PATH.forEach(function(id,i){
  var rc=cellFor(i),inf=sqInfo(id);
  h+='<div class="sq '+inf.cls+'" id="sq'+i+'" style="background:'+SQCOL[i%SQCOL.length]+';grid-column:'+(rc[0]+1)+';grid-row:'+(rc[1]+1)+'" onclick="openCard('+i+',false)" translate="no">'
   +(id.indexOf('Q:')===0?'<span class="qbadge">?</span>':'')
   +(i>0&&i<PATH.length-1?'<span class="num">'+i+'</span>':'')+inf.art+'<div class="lab">'+inf.lab+'</div><div class="toks" id="tk'+i+'"></div></div>';
 });
 h+='<div class="center">'
  +'<div><h3 translate="no">What did you do last weekend? '+sayBtn('What did you do last weekend?')+'</h3>'
  +'<div class="frames" translate="no"><div>I <span class="blank"></span>. '+sayBtn('I blank.')+'</div><div class="no">I didn\u2019t <span class="blank"></span>. '+sayBtn('I didn\u2019t blank.')+'</div>'
  +'<div style="font-size:1rem;font-weight:700;color:#4f5d55">On Saturday, I <span class="blank"></span>. Then I <span class="blank"></span>.</div></div>'
  +'<div class="noprint" style="margin-top:6px"><button class="btn ghost small" onclick="toggleVerbs()">&#128161; Need help? Verb list</button>'
  +'<svg id="egg" viewBox="0 0 64 64" onclick="fireworks()" aria-label="lion">'+LION.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')+'</svg></div>'
  +'<div class="verbs" id="verbs" style="display:none" translate="no"><div class="cols">'
  +'<div><h4>add <b>-ed</b></h4>watch &rarr; <b>watched</b><br>play &rarr; <b>played</b><br>clean &rarr; <b>cleaned</b><br>visit &rarr; <b>visited</b></div>'
  +'<div><h4>a <b>new word</b></h4>go &rarr; <b>went</b><br>eat &rarr; <b>ate</b><br>see &rarr; <b>saw</b><br>do &rarr; <b>did</b><br>sleep &rarr; <b>slept</b></div>'
  +'</div><div style="margin-top:4px">I didn\u2019t + <b>go</b> / <b>eat</b> / <b>play</b> &mdash; no -ed, no new word!</div></div></div>'
  +'<div class="turn noprint" id="turnBox">'+(practice||!players.length
    ?'<div class="who">Practice</div><div class="msg">Tap any square. Say it in the past.</div>'
    :'<div class="who" id="who"></div><div class="die" id="die" onclick="roll()" role="button" aria-label="roll"><div class="face" id="face"></div><div class="lion">'+LION+'</div></div>'
     +'<button class="btn orange" onclick="roll()" id="rollBtn">&#127922; Roll</button><div class="msg" id="msg"></div><div class="score" id="score"></div>')
  +'</div></div>';
 document.getElementById('board').innerHTML=h;
 if(document.getElementById('face'))drawFace(1);
 placeTokens();
}
function toggleVerbs(){var v=document.getElementById('verbs');v.style.display=v.style.display==='none'?'block':'none';}
function placeTokens(hopIdx){
 PATH.forEach(function(id,i){var el=document.getElementById('tk'+i);if(el)el.innerHTML='';});
 document.querySelectorAll('.sq.here').forEach(function(e){e.classList.remove('here');});
 players.forEach(function(p,k){
  /* pieces on the same square pile up, the player whose turn it is on top */
 });
 var at={};players.forEach(function(p,k){(at[p.pos]=at[p.pos]||[]).push(k);});
 Object.keys(at).forEach(function(pos){
  var el=document.getElementById('tk'+pos);if(!el)return;
  var ks=at[pos].sort(function(a,b){return (a===turn)-(b===turn);}),h='';
  ks.forEach(function(k,n){
   var cls=(k===hopIdx?'hop':'')+(k===turn&&!practice?' me':'');
   h+=token(players[k].color).replace('<svg','<svg class="'+cls+'" style="right:'+(n*11)+'px;bottom:'+(n*9)+'px;z-index:'+(n+1)+'"');
  });
  if(ks.length>2)h+='<span class="pile">'+ks.length+'</span>';
  el.innerHTML=h;
 });
 if(players.length&&!practice){var s=document.getElementById('sq'+players[turn].pos);if(s)s.classList.add('here');}
}
function updateTurn(msg){
 var w=document.getElementById('who');if(!w)return;
 var p=players[turn];w.innerHTML=token(p.color)+' '+p.name;
 document.getElementById('msg').textContent=msg||'';
 drawScore();
}
function drawScore(){
 var s=document.getElementById('score');if(!s)return;
 s.innerHTML=players.map(function(p,k){return '<div class="r'+(k===turn?' now':'')+'">'+token(p.color)+p.name+'<b>'+p.score+'</b></div>';}).join('');
}
var awarded=false;
function award(n){
 if(awarded||!players.length||practice)return;awarded=true;
 var p=players[turn];p.score+=n;drawScore();
 var g=document.getElementById('ptsBox');if(g)g.innerHTML='<div class="got">+'+n+' for '+p.name+'! &#11088; Score: '+p.score+'</div>';
 say('Plus '+n+'. Nice!');
}
function notYet(){
 var h=document.getElementById('hint2');if(h)h.classList.add('on');
 var c=document.getElementById('chk');if(c)c.classList.remove('on');
 var b=document.getElementById('chkBtn');if(b)b.style.display='';
 var pb=document.getElementById('ptsBox');if(pb&&c)pb.classList.remove('on');
}

/* ================= dice ================= */

+'<g>'

+'</g></svg>';
var PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawFace(n){var c='',on=PIPS[n];for(var i=0;i<9;i++)c+='<span>'+(on.indexOf(i)>=0?'<span class="pip"></span>':'')+'</span>';document.getElementById('face').innerHTML=c;}
function roll(){
 if(busy||practice||!players.length)return;busy=true;
 var die=document.getElementById('die'),n=1+Math.floor(Math.random()*6);lastRoll=n;
 die.classList.remove('rolling','roar');void die.offsetWidth;die.classList.add('rolling');
 var spin=setInterval(function(){drawFace(1+Math.floor(Math.random()*6));},80);
 setTimeout(function(){
  clearInterval(spin);drawFace(n);die.classList.remove('rolling');
  if(n===1){die.classList.add('roar');setTimeout(function(){die.classList.remove('roar');},800);}
  setTimeout(function(){say(String(n));},n===1?820:100);
  setTimeout(function(){move(n);},n===1?1300:700);
 },620);
}
function move(n){
 var p=players[turn],target=Math.min(p.pos+n,PATH.length-1),k=turn;
 (function step(){
  if(p.pos<target){p.pos++;placeTokens(k);setTimeout(step,300);}
  else{busy=false;openCard(p.pos,true);}
 })();
}
function nextTurn(again){
 closeCard();
 if(!again)turn=(turn+1)%players.length;
 placeTokens();
 var p=players[turn];
 updateTurn(p.name+(again?', roll again!':', roll the die!'));
 say(p.name+(again?', roll again!':', it is your turn.'));
}
function backOne(){
 var p=players[turn];if(p.pos>0)p.pos--;placeTokens(turn);
 closeCard();setTimeout(function(){openCard(p.pos,true,true);},350);
}

/* ================= landing card ================= */
function trLine(obj,lang){if(!obj||!lang||!obj[lang])return '';return '<div class="tr"'+(lang==='ar'?' dir="rtl"':'')+'>'+obj[lang]+'</div>';}
function openCard(i,landed,retry){
 if(busy&&!landed)return;
 var id=PATH[i],inf=sqInfo(id),p=landed&&players.length?players[turn]:null,lang=p?p.lang:((document.getElementById('pl0')||{}).value||'zh');
 var h='';awarded=false;
 var scoring=!!(landed&&p&&!practice);
 function ptsBox(label,n,on){return scoring?'<div class="pts'+(on?' on':'')+'" id="ptsBox"><div class="k">'+label+'</div><button class="btn" onclick="award('+n+')">&#10003; Yes! +'+n+'</button> <button class="btn ghost" onclick="notYet()">Not yet</button></div>':'';}
 var next=landed?'<button class="btn orange" onclick="nextTurn()">Next player &#9654;</button>':'<button class="btn" onclick="closeCard()">Close</button>';
 if(id==='FINISH'&&landed){p.score+=3;drawScore();
  var st=players.slice().sort(function(a,b){return b.score-a.score;}),top=st[0].score,win=st.filter(function(x){return x.score===top;}).map(function(x){return x.name;});
  h='<div class="pic">'+ART.FINISH+'</div><h2 style="font-size:1.4rem;margin:4px 0">'+p.name+' got to FINISH first! +3</h2>'
   +'<div class="step"><div class="k">GAME OVER &middot; MOST POINTS WINS</div><div class="stand">'
   +st.map(function(x){return '<div class="r">'+token(x.color)+x.name+'<b>'+x.score+'</b></div>';}).join('')+'</div>'
   +'<div class="big">&#127881; '+win.join(' and ')+(win.length>1?' win!':' wins!')+'</div></div>'
   +'<div class="step ans"><div class="k">EVERYONE: TELL TWO THINGS</div><div class="big">First, I ____. Then, I ____. '+sayBtn('First, I blank. Then, I blank.')+'</div></div>'
   +'<div class="row"><button class="btn orange" onclick="newGame()">Play again</button></div>';
  show(h);fireworks();say(win.join(' and ')+(win.length>1?' win!':' wins!'));return;}
 if(id==='START'||id==='FINISH'){h='<div class="pic">'+inf.art+'</div><h2>'+inf.lab+'</h2><p>Roll the die and move. Every square is something you <b>did</b>.</p><div class="row">'+next+'</div>';show(h);return;}
 if(id==='AGAIN'){h='<div class="pic">'+ART.AGAIN+'</div><h2 style="font-size:1.5rem">Roll again! '+sayBtn('Roll again!')+'</h2>'
   +'<div class="step"><div class="k">QUICK! BEFORE YOU ROLL</div><div class="big">Say one thing you did yesterday. '+sayBtn('Say one thing you did yesterday.')+'</div><div class="big" style="font-size:1.05rem">Yesterday, I ____.</div></div>'
   +ptsBox('FRIENDS: DID THEY SAY IT IN THE PAST?',1,true)
   +'<div class="hint2" id="hint2">Hint: use a past verb &mdash; went, ate, played, watched. Say it again!</div>'
   +'<div class="row">'+(landed?'<button class="btn orange" onclick="nextTurn(true)">&#127922; Roll again</button>':'<button class="btn" onclick="closeCard()">Close</button>')+'</div>';show(h);if(landed)say('Roll again!');return;}
 if(id.indexOf('Q:')===0){
  var Q=id==='Q:sat'?SATQ:id==='Q:sun'?SUNQ:MAINQ, day=id==='Q:sat'?'On Saturday, ':id==='Q:sun'?'On Sunday, ':'Last weekend, ';
  h='<div class="pic">'+ART.Q+'</div>'+(p?'<div class="k" style="font-weight:900;color:#6a3a80">'+p.name.toUpperCase()+'</div>':'')
   +'<div class="step"><div class="k">1 &middot; A FRIEND ASKS</div><div class="big">'+Q.en+' '+sayBtn(Q.en)+'</div>'+trLine(Q,lang)+'</div>'
   +'<div class="step ans"><div class="k">2 &middot; YOU ANSWER &mdash; ANYTHING TRUE!</div><div class="big">'+day+'I ____. '+sayBtn(day+'I blank.')+'</div>'
   +'<div class="big" style="font-size:1.05rem">Then, I ____. I didn\u2019t ____.</div></div>'
   +'<div class="follow">Friend, ask more: '+FUNQ.en+' '+sayBtn(FUNQ.en)+trLine(FUNQ,lang)+'</div>'
   +ptsBox('3 &middot; FRIENDS: WAS IT A WHOLE SENTENCE IN THE PAST?',2,true)
   +'<div class="hint2" id="hint2">Hint: start with the day, then a past verb: '+day+'I went&hellip; / I played&hellip; Say it again!</div>'
   +'<div class="row"><button class="btn ghost" onclick="toggleVerbsCard()">&#128161; Verb list</button>'+next+'</div><div id="cardVerbs"></div>';
  show(h);if(landed)setTimeout(function(){say(Q.en);},250);return;
 }
 var a=ACT[id],pos='I <span class="v">'+a.v+'</span>'+(a.rest?' '+a.rest:'')+'.',posT='I '+a.v+(a.rest?' '+a.rest:'')+'.',negT='I didn\u2019t '+a.neg+'.';
 h='<div class="pic">'+inf.art+'</div>'+(p?'<div class="k" style="font-weight:900;color:#6a3a80">'+p.name.toUpperCase()+(retry?' &middot; TRY IT HERE':'')+'</div>':'')
  +'<div class="step"><div class="k">1 &middot; A FRIEND ASKS</div><div class="big">What did you do last weekend? '+sayBtn('What did you do last weekend?')+'</div>'+trLine(MAINQ,lang)+'</div>'
  +'<div class="step ans"><div class="k">2 &middot; YOU ANSWER IN THE PAST</div><div class="big">I ____ '+(a.rest||'')+'. <span class="base">'+a.base.split(' ')[0]+' &rarr; ?</span></div>'
  +'<div style="font-size:.95rem;color:#4f5d55;font-weight:700;margin-top:3px">Say it out loud first. Then tap Check.</div></div>'
  +'<div class="check" id="chk"><div class="k">CHECK</div><div class="big">'+pos+' '+sayBtn(posT)
  +(a.kind==='reg'?' <span class="snd">-ed sounds like /'+a.snd+'/</span>':' <span class="snd">new word: '+a.base.split(' ')[0]+' &rarr; '+a.v+'</span>')+'</div>'
  +(a.note?'<div style="font-weight:800;color:#6a3a80">'+a.note+'</div>':'')
  +trLine(a.tr,lang)
  +'<div class="big neg" style="font-size:1.08rem;margin-top:6px">Not true? '+negT+' '+sayBtn(negT)+'</div></div>'
  +ptsBox('3 &middot; DID YOU SAY IT RIGHT?',1,false)
  +'<div class="hint2" id="hint2">'+(a.kind==='reg'?'Hint: add <b>-ed</b> to <b>'+a.base.split(' ')[0]+'</b>.':'Hint: <b>'+a.base.split(' ')[0]+'</b> changes to a new word. Look at the Verb list.')+' Say the whole sentence again, then Check.</div>'
  +'<div class="follow">Friend, ask more: '+FUNQ.en+' '+sayBtn(FUNQ.en)+trLine(FUNQ,lang)+'</div>'
  +'<div class="row"><button class="btn ghost small" onclick="toggleVerbsCard()">&#128161; Verb list</button><button class="btn" id="chkBtn" onclick="doCheck()">&#10003; Check</button>'+next+'</div><div id="cardVerbs"></div>';
 show(h);if(landed)setTimeout(function(){say('What did you do last weekend?');},250);
}
function doCheck(){document.getElementById('chk').classList.add('on');var b=document.getElementById('chkBtn');if(b)b.style.display='none';
 var pb=document.getElementById('ptsBox');if(pb&&!awarded)pb.classList.add('on');}
function toggleVerbsCard(){var d=document.getElementById('cardVerbs');d.innerHTML=d.innerHTML?'':document.getElementById('verbs').outerHTML.replace('style="display:none"','').replace('id="verbs"','');}
function show(h){document.getElementById('card').innerHTML=h;document.getElementById('veil').classList.add('on');}
function closeCard(){document.getElementById('veil').classList.remove('on');}
function newGame(){closeCard();players.forEach(function(p){p.pos=0;p.score=0;});turn=0;placeTokens();updateTurn(players[0].name+', roll the die!');}

/* ================= lion easter egg ================= */

 var cols=['#864D9E','#F8981F','#2a9d8f','#e74c3c','#ffd34d'];
 for(var b=0;b<3;b++)(function(b){setTimeout(function(){
  var cx=window.innerWidth*(.25+.25*b),cy=window.innerHeight*(.3+.1*(b%2));
  for(var i=0;i<26;i++){var d=document.createElement('div');d.className='fw';d.style.background=cols[i%5];d.style.left=cx+'px';d.style.top=cy+'px';document.body.appendChild(d);
