<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Someone Who · Class wall</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2640;--muted:#5b6784;--bg:#f3eee4;--card:#fff;--line:#dcd6c8;--p:#6a3d9a;--p-t:#efe6f7;--o:#e07a1f;--o-t:#fdebd9;--g:#1d7f53;--g-t:#dff3e8;--b:#2c5bc4;--b-t:#e3ebfd;--no:#b93a2e}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf5;--muted:#a3adc4;--bg:#161a24;--card:#1f2535;--line:#36405a;--p:#c9a4ea;--p-t:#332648;--o:#ffb067;--o-t:#44301b;--g:#6fd6a3;--g-t:#173a2b;--b:#9dbaff;--b-t:#20305a}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.45 Nunito,system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:14px 18px 40px}
h1{font-size:28px;font-weight:900;margin:0} .sub{color:var(--muted);margin:2px 0 12px;font-size:15px}
#gate{max-width:380px;margin:10vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
input,select{padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:800;background:var(--ink);color:var(--card);cursor:pointer;font:inherit}
.btn.soft{background:var(--card);border:1.5px solid var(--line);color:var(--ink)} .btn.on{background:var(--o);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;color:var(--ink);font-weight:800}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.msg{color:var(--muted);font-size:14px}
/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.bq{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.bq.bold{border-color:var(--o)}
.bq .ico{width:64px;height:64px;flex:none;color:var(--p)} .bq.bold .ico{color:var(--o)} .bq .ico svg{width:100%;height:100%}
.bq .f{font-size:17px;color:var(--muted)} .bq .q{font-size:24px;font-weight:900;line-height:1.25;color:var(--b)}
.bq .a{font-size:16px;color:var(--muted);margin-top:4px}
.big .bq .q{font-size:30px} .big .bq .f{font-size:19px}
/* results */
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.r{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.r .t{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}
.r .t .ico{width:40px;height:40px;color:var(--p);flex:none} .r .t .ico svg{width:100%;height:100%}
.r .t .n{margin-left:auto;font-size:34px;font-weight:900;color:var(--p)}
.r .bar2{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.r .bar2 i{display:block;height:100%;background:var(--p)}
.r .names{font-size:15px;color:var(--muted)}
.r .x{font-size:14px;color:var(--ink);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-width:150px}
.stat b{display:block;font-size:28px;font-weight:900;color:var(--p)} .stat span{font-size:13px;color:var(--muted)}
/* students */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{background:var(--p-t);font-weight:800}
.ok{color:var(--g);font-weight:900}
audio{height:30px;vertical-align:middle;max-width:220px}
.empty{color:var(--muted);padding:16px 0}
@media (max-width:600px){.bq{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<div id="gate"><h1>Find Someone Who</h1><p class="sub">Teacher wall</p><input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="width:100%"><div class="bar" style="margin-top:10px"><button class="btn" id="go">Open</button><span class="msg" id="gateMsg"></span></div></div>
<div id="app" style="display:none">
  <div class="bar">
    <div><h1>Find Someone Who</h1><div class="sub" id="setSub"></div></div>
    <span style="flex:1"></span>
    <label>Set <select id="setSel"></select></label>
    <label>Period <select id="perSel"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label>
    <button class="btn soft" id="boldBtn" title="Switch the bold questions on for this period">Bold questions: off</button>
    <button class="btn soft" id="bigBtn">Big text</button>
    <a class="btn soft" id="stuLink" href="./" target="_blank" style="text-decoration:none">Student page ↗</a>
  </div>
  <div class="tabs"><button class="tab on" data-v="board">Board</button><button class="tab" data-v="results">Live results</button><button class="tab" data-v="students">Students</button><button class="tab" data-v="rec">Recordings</button><span class="msg" id="upd" style="align-self:center;margin-left:8px"></span></div>
  <div id="view" style="margin-top:14px"></div>
</div>
</div>
<script src="/readings/launch-plus/find/sets.js"></script>
<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE='find_someone',SETTINGS='find_settings',PW='galileo2026',BUCKET='fluency-recordings';
var q=function(k){return (location.search.match(new RegExp('[?&]'+k+'=([^&]+)'))||[])[1]||'';};
var setKey=q('set')||'u1-l1', period=q('period')||'1', view='board', big=false, bold=false, rows=[], recs=[], timer=null;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hd(p){var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};if(p)h['Prefer']=p;return h;}
function first(n){return String(n||'').trim().split(/\s+/)[0]||'';}
function SET(){return window.FIND_SETS[setKey]||window.FIND_SETS['u1-l1'];}
function prompts(){return bold?SET().core.concat(SET().bold):SET().core.slice();}
var ICON=window.FIND_ICONS||{};
function icon(id){ return ICON[id]||''; }

function loadAll(){
  var a=fetch(SUPA_URL+'/rest/v1/'+TABLE+'?set_slug=eq.'+encodeURIComponent(setKey)+'&period=eq.'+encodeURIComponent(period)+'&select=email,name,answers,turned_in,updated_at&order=updated_at.desc',{headers:hd()}).then(function(r){return r.ok?r.json():[];}).then(function(x){rows=x||[];});
  var b=fetch(SUPA_URL+'/rest/v1/'+SETTINGS+'?set_slug=eq.'+encodeURIComponent(setKey)+'&period=eq.'+encodeURIComponent(period)+'&select=bold',{headers:hd()}).then(function(r){return r.ok?r.json():[];}).then(function(x){bold=!!(x&&x[0]&&x[0].bold);});
  var c=fetch(SUPA_URL+'/rest/v1/speaking_attempts?activity=eq.'+encodeURIComponent('find-'+setKey)+'&period=eq.'+encodeURIComponent(period)+'&accepted=eq.true&select=email,speaker_name,partner_name,role,item_id,target_text,transcript,match_score,audio_path,created_at&order=created_at.desc&limit=300',{headers:hd()}).then(function(r){return r.ok?r.json():[];}).then(function(x){recs=x||[];});
  return Promise.all([a,b,c]).then(function(){ $('upd').textContent='Updated '+new Date().toLocaleTimeString(); render(); }).catch(function(){ $('upd').textContent='Could not load.'; });
}
function tally(){
  var P=prompts(),T={},X={}; P.forEach(function(p){T[p.id]={};X[p.id]=[];});
  rows.forEach(function(r){ var A=(r.answers&&r.answers.A)||{}; for(var id in A){ if(!T[id]||!A[id]||!A[id].who)continue; var k=first(A[id].who).toLowerCase(); if(k)T[id][k]=first(A[id].who); if(A[id].x)X[id].push(first(A[id].who)+': '+A[id].x); } });
  return {T:T,X:X};
}
function render(){
  var S=SET(); $('setSub').textContent=S.lesson+' \u00b7 '+S.title+' \u00b7 Period '+period;
  $('boldBtn').textContent='Bold questions: '+(bold?'ON':'off'); $('boldBtn').className='btn soft'+(bold?' on':'');
  $('stuLink').href='./?set='+encodeURIComponent(setKey);
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-v')===view);});
  var v=$('view'); v.className=big?'big':'';
  if(view==='board'){
    v.innerHTML='<p class="sub">Project this. Students ask the whole question \u2014 not \u201cyou?\u201d</p><div class="board">'+prompts().map(function(p){ var isB=S.bold.indexOf(p)>=0;
      return '<div class="bq'+(isB?' bold':'')+'"><div class="ico">'+icon(p.id)+'</div><div><div class="f">Find someone who '+esc(p.find)+'</div><div class="q">'+esc(p.ask)+'</div><div class="a">\u2192 \u201c'+esc(p.yes)+'\u201d</div></div></div>'; }).join('')+'</div>';
    return;
  }
  if(view==='results'){
    var t=tally(), P=prompts(), max=1; P.forEach(function(p){var n=Object.keys(t.T[p.id]).length;if(n>max)max=n;});
    var sorted=P.slice().sort(function(a,b){return Object.keys(t.T[b.id]).length-Object.keys(t.T[a.id]).length;});
    var started=rows.length, done=rows.filter(function(r){return r.turned_in;}).length, found=0; rows.forEach(function(r){var A=(r.answers&&r.answers.A)||{}; for(var k in A)if(A[k]&&A[k].who)found++;});
    var top=sorted[0], rare=sorted.filter(function(p){return Object.keys(t.T[p.id]).length>0;}).slice(-1)[0];
    v.innerHTML='<div class="stats"><div class="stat"><b>'+started+'</b><span>students started</span></div><div class="stat"><b>'+found+'</b><span>names written</span></div><div class="stat"><b>'+recs.filter(function(r){return r.role==="report";}).length+'</b><span>report-backs recorded</span></div><div class="stat"><b>'+done+'</b><span>turned in</span></div>'+
      (top&&Object.keys(t.T[top.id]).length?'<div class="stat"><b style="font-size:18px">'+esc(top.find)+'</b><span>most common</span></div>':'')+(rare&&rare!==top?'<div class="stat"><b style="font-size:18px">'+esc(rare.find)+'</b><span>rarest (so far)</span></div>':'')+'</div>'+
      '<div class="res">'+sorted.map(function(p){ var names=Object.keys(t.T[p.id]).map(function(k){return t.T[p.id][k];}),n=names.length;
        return '<div class="r"><div class="t"><span class="ico">'+icon(p.id)+'</span><span>'+esc(p.find)+'</span><span class="n">'+n+'</span></div><div class="bar2"><i style="width:'+Math.round(100*n/max)+'%"></i></div><div class="names">'+(n?esc(names.join(', ')):'nobody yet')+'</div>'+(t.X[p.id].length?'<div class="x">'+esc(t.X[p.id].slice(0,6).join(' \u00b7 '))+'</div>':'')+'</div>'; }).join('')+'</div>';
    return;
  }
  if(view==='students'){
    var P2=prompts();
    v.innerHTML=rows.length?'<table><tr><th>Student</th><th>Found</th><th>Said the questions</th><th>Reported back</th><th>Turned in</th><th>Last save</th></tr>'+rows.map(function(r){ var A=(r.answers&&r.answers.A)||{},W=(r.answers&&r.answers.warm)||{},R=(r.answers&&r.answers.rec)||{},f=0,w=0,rc=0; for(var k in A)if(A[k]&&A[k].who)f++; for(k in W)if(W[k]&&W[k].ok)w++; for(k in R)if(R[k]&&R[k].ok)rc++;
      return '<tr><td><b>'+esc(r.name||r.email)+'</b><br><span class="msg">'+esc(r.email)+'</span></td><td>'+f+' / '+P2.length+'</td><td>'+w+'</td><td>'+rc+'</td><td>'+(r.turned_in?'<span class="ok">\u2713</span>':'')+'</td><td class="msg">'+new Date(r.updated_at).toLocaleTimeString()+'</td></tr>'; }).join('')+'</table>':'<div class="empty">Nobody in period '+esc(period)+' has started this set yet.</div>';
    return;
  }
  if(view==='rec'){
    var rr=recs.filter(function(r){return r.role==='report';});
    v.innerHTML=rr.length?'<table><tr><th>Who</th><th>Said</th><th>About</th><th>Listen</th><th>Match</th></tr>'+rr.map(function(r){ return '<tr><td><b>'+esc(first(r.speaker_name)||r.email)+'</b></td><td>'+esc(r.target_text)+'<br><span class="msg">heard: '+esc(r.transcript||'')+'</span></td><td>'+esc(r.partner_name||'')+'</td><td>'+(r.audio_path?'<audio controls preload="none" src="'+SUPA_URL+'/storage/v1/object/public/'+BUCKET+'/'+esc(r.audio_path)+'"></audio>':'<span class="msg">no audio</span>')+'</td><td>'+Math.round((r.match_score||0)*100)+'%</td></tr>'; }).join('')+'</table>':'<div class="empty">No report-backs yet for period '+esc(period)+'.</div>';
  }
}
function setBold(on){
  fetch(SUPA_URL+'/rest/v1/'+SETTINGS+'?on_conflict=set_slug,period',{method:'POST',headers:hd('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{set_slug:setKey,period:period,bold:on,updated_at:new Date().toISOString()}])})
    .then(function(r){ if(r.ok){bold=on;render();} else $('upd').textContent='Could not save the setting.'; }).catch(function(){ $('upd').textContent='Could not save the setting.'; });
}
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t)return;
  if(t.id==='go'){ if($('pw').value===PW){ $('gate').style.display='none'; $('app').style.display=''; start(); } else $('gateMsg').textContent='Nope.'; return; }
  if(t.id==='boldBtn'){ if(confirm((bold?'Switch OFF':'Switch ON')+' the bold questions for period '+period+'?')) setBold(!bold); return; }
  if(t.id==='bigBtn'){ big=!big; t.classList.toggle('on',big); render(); return; }
  if(t.getAttribute('data-v')){ view=t.getAttribute('data-v'); render(); }
});
$('pw').addEventListener('keydown',function(e){ if(e.key==='Enter')$('go').click(); });
$('setSel').addEventListener('change',function(){ setKey=this.value; history.replaceState(null,'','?set='+setKey+'&period='+period); loadAll(); });
$('perSel').addEventListener('change',function(){ period=this.value; history.replaceState(null,'','?set='+setKey+'&period='+period); loadAll(); });
function start(){
  $('setSel').innerHTML=Object.keys(window.FIND_SETS).map(function(k){return '<option value="'+k+'"'+(k===setKey?' selected':'')+'>'+esc(window.FIND_SETS[k].title)+' ('+k+')</option>';}).join('');
  $('perSel').value=period; loadAll(); timer=setInterval(loadAll,8000);
}
</script>
</body>
</html>
