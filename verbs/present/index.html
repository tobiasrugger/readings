<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbs: be, have, and -s — Mr. Toby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2640; --muted:#5b6784; --bg:#eef2f8; --card:#ffffff; --line:#d3dbe9;
  --i:#7a3f8f;  --i-t:#f4e9f8;           /* I -> am */
  --s3:#a86400; --s3-b:#f0a52a; --s3-t:#fff0d6;  /* he / she / it -> is, has, -s */
  --pl:#2c5bc4; --pl-t:#e3ebfd;           /* you / we / they -> are, have, base verb */
  --ok:#1d7f53; --ok-t:#dff3e8; --no:#b93a2e; --no-t:#fbe5e1;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e8ecf5; --muted:#a3adc4; --bg:#141a28; --card:#1e2638; --line:#34405a;
    --i:#d7a6ea; --i-t:#3a2944; --s3:#ffc56a; --s3-b:#f0a52a; --s3-t:#3d2f17;
    --pl:#9dbaff; --pl-t:#20305a; --ok:#6fd6a3; --ok-t:#173a2b; --no:#ff9a8f; --no-t:#44211d;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 Lexend,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pl);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{max-width:440px;margin:6vh auto;background:var(--card);border-radius:20px;padding:28px 26px;border:1px solid var(--line)}
#login h1{font-size:34px;line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.5px}
#login h1 .a{color:var(--i)} #login h1 .b{color:var(--s3)} #login h1 .c{color:var(--pl)}
#login p{margin:0 0 18px;color:var(--muted)}
#login label{display:block;font-weight:500;margin:14px 0 5px}
#login input,#login select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
#login .err{color:var(--no);font-size:15px;min-height:22px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%;margin-top:18px;font-size:19px}

/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.brand{font-weight:800;font-size:22px;letter-spacing:-.3px}
.who{color:var(--muted);font-size:15px}
.spacer{flex:1}
.bar select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);font-size:15px}
#dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
#dot.saving{background:var(--s3-b)} #dot.saved{background:var(--ok)} #dot.err{background:var(--no)}

/* ---------- unit + activity nav ---------- */
#units{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0 12px}
.unit{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;line-height:1.2}
.unit .n{font-weight:800;font-size:13px;color:var(--muted)}
.unit .t{display:block;font-weight:700;font-size:16px;margin:2px 0}
.unit .p{font-size:12.5px;color:var(--muted)}
.unit.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.unit.on .n,.unit.on .p{color:inherit;opacity:.8}
@media (max-width:760px){#units{grid-template-columns:repeat(3,1fr)}}
#acts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:16px;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:3px}
.grp small{font-size:12.5px;color:var(--muted);padding-left:2px}
.grp div{display:flex;gap:5px;flex-wrap:wrap}
.act{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;font-size:15px;white-space:nowrap}
.act.on{background:var(--pl);border-color:var(--pl);color:var(--card)}
.act .ck{color:var(--ok);font-weight:800;margin-left:4px}
.act.on .ck{color:var(--card)}

/* ---------- stage ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 4px;font-size:28px;line-height:1.15;letter-spacing:-.3px}
.lede{color:var(--muted);margin:0 0 16px;max-width:62ch}
.tr{cursor:pointer;border-bottom:1.5px dotted var(--muted)}
.i-c{color:var(--i)} .s3-c{color:var(--s3)} .pl-c{color:var(--pl)}
.end{color:var(--s3);background:var(--s3-t);border-radius:4px;padding:0 2px;font-weight:800}

/* conjugation chart: the page's main device */
.chart{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 18px}
.chart.two{grid-template-columns:1fr 1fr}
.fam{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fam .lab{font-size:14px;font-weight:500}
.fam-i{background:var(--i-t);color:var(--i)} .fam-s3{background:var(--s3-t);color:var(--s3)} .fam-pl{background:var(--pl-t);color:var(--pl)}
.pair{border:0;background:var(--card);color:var(--ink);border-radius:11px;padding:9px 12px;font-size:24px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.pair b{font-weight:800}
.fam-i .pair b{color:var(--i)} .fam-s3 .pair b{color:var(--s3)} .fam-pl .pair b{color:var(--pl)}
.pair .spk{font-size:16px;opacity:.5}
@media (max-width:640px){.chart,.chart.two{grid-template-columns:1fr}}

.rules{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
.rules li{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:19px}
.rules li .x{color:var(--muted);font-size:15px}

.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ex{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;text-align:center}
.ex .sent{font-size:18px}
.tbl{border-collapse:collapse;margin:6px 0 18px;font-size:20px}
.tbl td{padding:6px 16px;border-bottom:1px solid var(--line)}
.tbl td:first-child{color:var(--muted)}
.note{border-left:4px solid var(--s3-b);background:var(--s3-t);border-radius:0 12px 12px 0;padding:10px 14px;margin:0 0 16px}
.note.wrong{border-color:var(--no);background:var(--no-t)}
h3{margin:18px 0 8px;font-size:20px}

/* picture scene: person + the thing they have, overlapping at the hand */
.scene{display:inline-flex;align-items:flex-end;font-size:84px;line-height:1;min-height:92px}
.scene .obj{font-size:.56em;margin-left:-.28em;margin-bottom:.06em;filter:drop-shadow(0 2px 1px rgba(0,0,0,.15))}
.scene.sm{font-size:50px;min-height:56px}

/* question card */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:15px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--no)} .dots i.cur{background:var(--ink)}
.q{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
@media (max-width:640px){.q{grid-template-columns:1fr;justify-items:center;text-align:center}}
.qpic{display:flex;justify-content:center}
.sentence{font-size:32px;line-height:1.35;font-weight:500}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--ink);text-align:center;color:var(--muted)}
.fill{font-weight:800;padding:0 4px;border-radius:6px}
.base{font-size:20px;color:var(--muted);font-weight:400;white-space:nowrap}
.tools{display:flex;gap:6px;margin-top:8px}
.tool{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:3px 10px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.opt{min-width:110px;font-size:24px;font-weight:700;padding:12px 20px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok-t);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.no{background:var(--no-t);border-color:var(--no);color:var(--no);box-shadow:0 4px 0 var(--no)}
.opt[disabled]{cursor:default}
.writebox{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.writebox input{font-size:26px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;width:220px;background:var(--bg)}
.bank{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{border:1.5px dashed var(--muted);border-radius:10px;padding:4px 12px;background:transparent;font-size:18px}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;font-size:18px}
.fb.ok{background:var(--ok-t);color:var(--ok)} .fb.no{background:var(--no-t);color:var(--no)}
.fb .full{display:block;color:var(--ink);font-size:22px;margin-top:4px}
.nextrow{margin-top:14px;display:flex;gap:10px}
.keystrip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;font-size:15px}
.keystrip span{border-radius:8px;padding:3px 10px}
.keystrip .k-i{background:var(--i-t);color:var(--i)} .keystrip .k-s3{background:var(--s3-t);color:var(--s3)} .keystrip .k-pl{background:var(--pl-t);color:var(--pl)}

/* build */
.line{min-height:62px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tok{font-size:22px;padding:8px 14px;border-radius:11px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line)}
.tok.used{visibility:hidden}

/* flashcards */
.flip{margin:10px auto;max-width:440px;min-height:250px;border-radius:20px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;width:100%;text-align:center}
.flip .big{font-size:40px;font-weight:700;line-height:1.2}
.flip .hint{font-size:14px;color:var(--muted)}
.flip.back{background:var(--card);border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.flip.turn{animation:turn .28s ease}}
@keyframes turn{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* match + sort */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col{display:flex;flex-direction:column;gap:8px}
.mt{font-size:21px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:center;box-shadow:0 3px 0 var(--line)}
.mt.sel{border-color:var(--pl);background:var(--pl-t)}
.mt.done{visibility:hidden}
.mt.shake,.bin.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;min-height:50px}
.bins{display:grid;gap:10px}
.bin{border:2px solid var(--line);border-radius:16px;padding:10px;min-height:120px;background:var(--bg);text-align:left}
.bin .bh{font-size:22px;font-weight:800;display:block;margin-bottom:6px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin .in span{background:var(--card);border-radius:8px;padding:2px 9px;font-size:16px}

.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.summary{text-align:center;padding:10px 0}
.summary .scorebig{font-size:54px;font-weight:800;margin:4px 0}
.missed{text-align:left;max-width:520px;margin:12px auto;padding:0;list-style:none}
.missed li{background:var(--no-t);border-radius:10px;padding:7px 12px;margin-bottom:6px}
.missed li s{color:var(--no)}

#pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,92vw);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#pop .src{color:var(--muted);font-size:14px}
#pop .dst{font-size:22px;margin:4px 0}
#pop .mean{font-size:15px;color:var(--muted)}
#pop button{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px}
.allverbs{color:var(--muted);text-decoration:none;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:5px 10px}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:26px}
@media print{.bar,#units,#acts,footer{display:none}.panel{border:0}}
</style>
</head>

<div class="wrap">

<!-- ================= LOGIN ================= -->
<section id="login">
  <h1><span class="a">am</span> <span class="b">is</span> <span class="c">are</span></h1>
  <p>Practice verbs: to be, to have, and he / she / it + -s.</p>
  <label for="inName">Your name</label>
  <input id="inName" autocomplete="name" placeholder="First and last name">

    <option value="">Choose…</option>
    <option>Period 1</option><option>Period 2</option><option>Period 3</option>
    <option>Period 4</option><option>Period 5</option><option>Period 6</option>
  </select>
  <label for="inLang">Your language</label>
  <select id="inLang"></select>
  <div class="err" id="loginErr"></div>
  <button class="btn wide" id="btnStart">Start</button>
</section>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="bar">
    <a class="allverbs" href="../">All verbs</a>

    <span id="dot" title="Saving status"></span>

      <option value="chal">Challenge</option>

  </header>
  <nav id="units"></nav>
  <nav id="acts"></nav>
  <main id="stage"></main>
  <footer>Mr. Toby</footer>
</div>

</div>
<div id="pop" class="hidden"></div>

  {k:'flash', t:'Flashcards',     g:'Memorize'},
  {k:'match', t:'Match',          g:'Memorize'},
  {k:'choose',t:'Choose',         g:'Practice'},
  {k:'write', t:'Write',          g:'Practice'},
  {k:'sort',  t:'Sort',           g:'Practice'},
  {k:'rw',    t:'Right or wrong', g:'Practice'},
  {k:'build', t:'Build',          g:'Practice'},
  {k:'speed', t:'Speed round',    g:'Drill'}
];
var SCORED = ACTS.filter(function(a){ return a.k!=='learn'; });

/* ---------- conjugation ---------- */
var ES_END = /(ch|sh|ss|s|x|z|o)$/;
function addS(v){
  if(v==='have') return 'has';
  if(v==='be') return 'is';
  if(ES_END.test(v)) return v+'es';
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+'ies';
  return v+'s';
}
function conj(v,g){
  if(v==='be') return g==='i' ? 'am' : g==='s3' ? 'is' : 'are';
  return g==='s3' ? addS(v) : v;
}
function fam(v,g){ return (v==='be' && g==='i') ? 'i' : (g==='s3' ? 's3' : 'pl'); }
function markEnd(v,a){
  if(v==='be' || v==='have' || a===v) return esc(a);
  if(a.indexOf(v)===0) return esc(v)+'<span class="end">'+esc(a.slice(v.length))+'</span>';
  return esc(a.slice(0,-3))+'<span class="end">ies</span>';
}
function why(it){
  var v=it.pr.v, g=it.s.g, a=it.ans, who=it.s.t, like=it.s.like ? ' = '+it.s.like : '';
  if(v==='be'){
    if(g==='i') return 'I → am.';
    if(g==='s3') return who+like+' → is. He, she, it → is.';
    return who+like+' → are. You, we, they → are.';
  }
  if(g!=='s3') return who+like+' → '+a+'. I, you, we, they → no -s.';
  if(v==='have') return who+like+' → has. He, she, it → has.';
  var m = v.match(ES_END);
  if(m) return v+' ends in "'+m[1]+'" → add -es: '+a+'.';
  return 'He, she, it → add -s: '+a+'.';
}

/* =========================================================
   STATE + HELPERS

var S = {name:'', email:'', period:'', lang:'none', level:'std', unit:'be', act:'learn', scores:{}};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function unit(){ for(var i=0;i<UNITS.length;i++) if(UNITS[i].k===S.unit) return UNITS[i]; return UNITS[0]; }
function nItems(){ return S.level==='easy' ? 8 : S.level==='chal' ? 12 : 10; }
function persist(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} }
function norm(s){ return String(s||'').toLowerCase().replace(/[.!?]/g,'').replace(/\s+/g,' ').trim(); }

var voice = null;
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.85;
    if(!voice){ var vs=speechSynthesis.getVoices(); for(var i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang)){ voice=vs[i]; break; } } }
    if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- items ---------- */
function makeItem(pr){
  var s, key;
  if(pr.f===IT){ key='it'; s={t:'It', g:'s3', emo:pr.it}; }
  else{
    var s3 = pr.f.filter(function(k){ return SUBJ[k].g==='s3'; });
    var other = pr.f.filter(function(k){ return SUBJ[k].g!=='s3'; });
    key = (s3.length && (!other.length || Math.random()<.5)) ? pick(s3) : pick(other);
    s = {t:SUBJ[key].t, g:SUBJ[key].g, emo:pick(SUBJ[key].emo)};
    if(S.level==='chal' && Math.random()<.45){
      var ns = NOUNS.filter(function(n){ return pr.f.indexOf(n.like)>-1 && SUBJ[n.like].g===s.g; });
      if(ns.length){ var n=pick(ns); s={t:n.t, g:SUBJ[n.like].g, emo:n.emo, like:n.like}; }
    }
  }
  var ans = conj(pr.v, s.g);
  return {s:s, pr:pr, ans:ans, full:s.t+' '+ans+' '+pr.r+'.'};
}
function genItems(n){
  var bank = unit().bank, out=[], seen={}, order=shuffle(bank), guard=0, lastG='';
  while(out.length<n && guard<400){
    guard++;
    var pr = order[out.length % order.length];
    if(guard>order.length*2) pr = pick(bank);
    var it = makeItem(pr);
    if(seen[it.full] || (it.s.g===lastG && Math.random()<.5)) continue;
    seen[it.full]=1; lastG=it.s.g; out.push(it);
  }
  return out;
}
function wrongForm(v){
  if(ES_END.test(v)) return v+'s';
  if(/ee$/.test(v)) return v+'ing';
  if(/e$/.test(v)) return v.slice(0,-1)+'ing';
  return v+'es';
}
function optionPool(it){
  var v=it.pr.v, u=S.unit;
  if(u==='behave') return ['am','is','are','have','has'];
  if(v==='be') return ['am','is','are'];
  if(v==='have') return S.level==='chal' ? ['have','has','haves'] : ['have','has'];
  return [v, addS(v), wrongForm(v)];
}
function options(it, count){
  var pool = optionPool(it), a = it.ans;
  var n = count || (S.level==='easy' ? 2 : S.level==='std' ? 3 : pool.length);
  var others = shuffle(pool.filter(function(x){ return x!==a; })).slice(0, Math.max(1,n-1));
  if(S.level==='easy' && S.unit==='behave'){ // easier: be vs have, same person
    others = [it.pr.v==='be' ? conj('have',it.s.g) : conj('be',it.s.g)];
  }
  return shuffle(others.concat([a]));
}

/* ---------- small render pieces ---------- */
function scene(it, sm){
  var who = it.s.emo || '', obj = it.pr.p;
  if(!who && !obj) return '';
  return '<div class="scene'+(sm?' sm':'')+'" aria-hidden="true">'+(who?'<span class="pp">'+who+'</span>':'')+(obj?'<span class="obj">'+obj+'</span>':'')+'</div>';
}
function showsBase(){ return S.unit==='s' || S.unit==='es' || S.unit==='all'; }
function sentenceHTML(it, fillWith, fillCls){
  var mid = fillWith!=null
    ? '<span class="fill '+(fillCls||'')+'">'+esc(fillWith)+'</span>'
    : '<span class="blank">?</span>';
  var base = (fillWith==null && showsBase()) ? ' <span class="base">('+esc(it.pr.v)+')</span>' : '';
  return '<span>'+esc(it.s.t)+'</span> '+mid+base+' '+esc(it.pr.r)+'.';
}
function fullColored(it){
  var f = fam(it.pr.v, it.s.g);
  return esc(it.s.t)+' <b class="'+f+'-c">'+markEnd(it.pr.v, it.ans)+'</b> '+esc(it.pr.r)+'.';
}
function tools(text){
  return '<div class="tools"><button class="tool" data-say="'+esc(text)+'">🔊 Listen</button>'+
    (S.lang!=='none' ? '<button class="tool" data-tr="'+esc(text)+'">🌐 '+esc(S.lang)+'</button>' : '')+'</div>';
}
function keyStrip(){
  if(S.level==='chal') return '';
  var u=S.unit;
  if(u==='be') return '<div class="keystrip"><span class="k-i">I am</span><span class="k-s3">he, she, it is</span><span class="k-pl">you, we, they are</span></div>';
  if(u==='have') return '<div class="keystrip"><span class="k-pl">I, you, we, they have</span><span class="k-s3">he, she, it has</span></div>';
  if(u==='behave') return '<div class="keystrip"><span class="k-i">I am</span><span class="k-s3">he, she, it is / has</span><span class="k-pl">you, we, they are / have</span></div>';
  return '<div class="keystrip"><span class="k-pl">I, you, we, they play</span><span class="k-s3">he, she, it plays</span>'+(u==='s'?'':'<span class="k-s3">ch, sh, s, x, o → -es: watches, goes</span>')+'</div>';
}
function T(text){ return '<span class="tr" data-tr="'+esc(text)+'">'+esc(text)+'</span>'; }

function bestFor(uk, ak){ return S.scores[uk+'-'+ak]; }
function renderNav(){
  var h='';
  UNITS.forEach(function(u){
    var done = SCORED.filter(function(a){ return bestFor(u.k,a.k); }).length;
    h += '<button class="unit'+(u.k===S.unit?' on':'')+'" data-unit="'+u.k+'"><span class="n">'+u.n+'</span>'+
         '<span class="t">'+esc(u.t)+'</span><span class="p">'+esc(u.p)+(done?' &nbsp;'+done+'/'+SCORED.length:'')+'</span></button>';
  });
  $('units').innerHTML = h;
  var groups = {}, order=[];
  ACTS.forEach(function(a){ if(!groups[a.g]){ groups[a.g]=[]; order.push(a.g); } groups[a.g].push(a); });
  h='';
  order.forEach(function(g){
    h += '<div class="grp"><small>'+g+'</small><div>';
    groups[g].forEach(function(a){
      var b = bestFor(S.unit,a.k);
      h += '<button class="act'+(a.k===S.act?' on':'')+'" data-actk="'+a.k+'">'+a.t+(b?'<span class="ck">✓</span>':'')+'</button>';
    });
    h += '</div></div>';
  });
  $('acts').innerHTML = h;
}
function go(uk, ak){
  stopTimer();
  if(uk) S.unit=uk;
  if(ak) S.act=ak;
  persist(); renderNav(); renderStage();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderStage(){
  stopTimer(); Q=null; F=null; M=null; SO=null;
  $('pop').classList.add('hidden');
  var a=S.act;
  if(a==='learn') return renderLearn();
  if(a==='flash') return startFlash();
  if(a==='match') return startMatch();
  if(a==='sort')  return startSort();
  if(a==='speed') return speedIntro();
  return startQuiz(a);
}

/* =========================================================
   QUIZ ENGINE: choose, write, rw (right or wrong), build, speed
   ========================================================= */
var Q = null, timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
var TITLES = {
  choose:['Choose the verb','Look at the picture. Tap the right word.'],
  write:['Write the verb','Look at the picture. Type the missing word.'],
  rw:['Right or wrong?','Read the sentence. Is the verb right?'],
  build:['Build the sentence','Tap the words in order. One word is extra.'],
  speed:['Speed round','Answer as many as you can in 60 seconds.']
};
function startQuiz(mode){
  var n = mode==='speed' ? 80 : nItems();
  Q = {mode:mode, items:genItems(n), i:0, right:0, done:false, answered:false, marks:[], missed:[], left:60, total:0};
  if(mode==='rw') Q.items.forEach(function(it){
    it.shown = Math.random()<.5 ? it.ans : pick(optionPool(it).filter(function(x){ return x!==it.ans; }));
  });
  if(mode==='build') Q.items.forEach(function(it){
    var words = it.s.t.split(' ').concat([it.ans]).concat((it.pr.r+'.').split(' '));
    var extra = pick(optionPool(it).filter(function(x){ return x!==it.ans; }));
    it.target = words.join(' ');
    it.tokens = shuffle(words.concat([extra]));
    it.placed = [];
  });
  renderQ();
}
function renderQ(){
  var it = Q.items[Q.i], m=Q.mode, h='<div class="panel">';
  h += '<h2>'+TITLES[m][0]+'</h2><p class="lede">'+TITLES[m][1]+'</p>'+keyStrip();
  if(m==='speed'){
    h += '<div class="qhead"><span class="timer" id="timer">'+Q.left+'</span><span>Correct: <b>'+Q.right+'</b></span></div>';
  } else {
    h += '<div class="qhead"><span>'+(Q.i+1)+' of '+Q.items.length+'</span><span class="dots">'+
      Q.items.map(function(_,k){ return '<i class="'+(Q.marks[k]===true?'ok':Q.marks[k]===false?'no':k===Q.i?'cur':'')+'"></i>'; }).join('')+'</span></div>';
  }
  h += '<div class="q"><div class="qpic">'+scene(it)+'</div><div>';
  if(m==='rw') h += '<div class="sentence">'+sentenceHTML(it, it.shown)+'</div>';
  else if(m==='build') h += '<div class="sentence base">'+(showsBase()?'Verb: '+esc(it.pr.v):'&nbsp;')+'</div>';
  else h += '<div class="sentence">'+sentenceHTML(it)+'</div>';
  h += '</div></div>';

  if(m==='choose' || m==='speed'){
    var ops = options(it, m==='speed' ? (S.level==='chal'?3:2) : 0);
    h += '<div class="opts">'+ops.map(function(o){ return '<button class="opt" data-opt="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'</div>';
  } else if(m==='write'){
    h += '<div class="writebox"><input id="wIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn" data-check="1">Check</button></div>';
    if(S.level==='easy') h += '<div class="bank">'+options(it).map(function(o){ return '<button class="chip" data-chip="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'</div>';
  } else if(m==='rw'){
    h += '<div class="opts"><button class="opt" data-rw="1">✓ Right</button><button class="opt" data-rw="0">✗ Wrong</button></div>';
  } else if(m==='build'){
    h += '<div class="line" id="bLine">'+it.placed.map(function(ti,pos){ return '<button class="tok" data-unplace="'+pos+'">'+esc(it.tokens[ti])+'</button>'; }).join('')+'</div>'+
      '<div class="pool">'+it.tokens.map(function(tk,ti){ return '<button class="tok'+(it.placed.indexOf(ti)>-1?' used':'')+'" data-place="'+ti+'">'+esc(tk)+'</button>'; }).join('')+'</div>'+
      '<div class="nextrow"><button class="btn" data-check="1">Check</button></div>';
  }
  h += '<div id="fbox"></div></div>';
  $('stage').innerHTML = h;
  var w=$('wIn'); if(w) w.focus();
}
function answer(ok, given){
  if(Q.answered) return;
  Q.answered = true;
  var it = Q.items[Q.i];
  Q.marks[Q.i] = ok;
  if(ok) Q.right++; else Q.missed.push({full:it.full, given:given});
  if(Q.mode==='speed'){
    Q.total = (Q.total||0)+1;
    var b = document.querySelector('[data-opt="'+cssEsc(given)+'"]');
    if(b) b.classList.add(ok?'ok':'no');
    var c = document.querySelector('[data-opt="'+cssEsc(it.ans)+'"]'); if(c && !ok) c.classList.add('ok');
    var myQ = Q;
    setTimeout(function(){ if(Q!==myQ || Q.done) return; Q.i++; if(Q.i>=Q.items.length) Q.items=Q.items.concat(genItems(40)); Q.answered=false; renderQ(); }, ok?250:1000);
    return;
  }
  document.querySelectorAll('.opt').forEach(function(b){
    b.disabled = true;
    var val = b.getAttribute('data-opt');
    if(val===it.ans) b.classList.add('ok');
    else if(val===given) b.classList.add('no');
  });
  var wi=$('wIn'); if(wi) wi.disabled=true;
  document.querySelectorAll('[data-place],[data-unplace],[data-rw],[data-chip]').forEach(function(b){ b.disabled=true; });
  var fb = '<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Yes!':'Not quite.')+'</b> '+esc(why(it))+
    '<span class="full">'+fullColored(it)+'</span>'+tools(it.full)+'</div>'+
    '<div class="nextrow"><button class="btn" id="btnNext" data-next="1">'+(Q.i+1<Q.items.length?'Next':'See my score')+'</button></div>';
  $('fbox').innerHTML = fb;
  speak(it.full);
  var nb=$('btnNext'); if(nb) nb.focus();
}
function cssEsc(s){ return String(s).replace(/"/g,'\\"'); }
function nextQ(){
  if(Q.i+1 >= Q.items.length) return finishQuiz();
  Q.i++; Q.answered=false; renderQ();
}
function finishQuiz(){
  stopTimer();
  Q.done = true;
  var total = Q.mode==='speed' ? (Q.total||0) : Q.items.length;
  showSummary(Q.mode, Q.right, total, Q.missed);
}

/* speed round */
function speedIntro(){
  var best = bestFor(S.unit,'speed');
  $('stage').innerHTML = '<div class="panel summary"><h2>Speed round</h2><p class="lede" style="margin:8px auto">60 seconds. Tap fast. Wrong answers show the right word.</p>'+
    (best?'<p>Your best: <b>'+best.best+'</b> correct</p>':'')+
    '<button class="btn" data-speedgo="1" style="font-size:22px;margin-top:10px">Start 60 seconds</button></div>';
}
function speedStart(){
  startQuiz('speed');
  timerId = setInterval(function(){
    Q.left--;
    var t=$('timer'); if(t) t.textContent = Q.left;
    if(Q.left<=0 && !Q.done) finishQuiz();
  }, 1000);
}

/* =========================================================
   FLASHCARDS
   ========================================================= */
var F = null;
function startFlash(){
  var u=S.unit, cards=[];
  if(u==='be' || u==='have'){
    ['I','you','he','she','it','we','they'].forEach(function(k){
      var v=u, a=conj(v,SUBJ[k].g);
      cards.push({front:'<div class="scene sm">'+SUBJ[k].emo[0]+'</div><div class="big">'+esc(k)+' + '+u+'</div>',
        back:'<div class="big"><span class="'+fam(v,SUBJ[k].g)+'-c">'+esc(SUBJ[k].t)+' '+esc(a)+'</span></div>', say:SUBJ[k].t+' '+a});
    });
  } else {
    genItems(u==='behave'?10:12).forEach(function(it){
      var front = scene(it,true)+'<div class="big">'+esc(it.s.t)+' + '+(u==='behave'?'?':esc(it.pr.v))+'</div><div class="hint">… '+esc(it.pr.r)+'</div>';
      cards.push({front:front, back:scene(it,true)+'<div class="big">'+fullColored(it)+'</div>', say:it.full});
    });
  }
  F = {queue:shuffle(cards), total:cards.length, firstTry:0, seen:{}, flipped:false};
  renderFlash();
}
function renderFlash(){
  if(!F.queue.length) return showSummary('flash', F.firstTry, F.total, []);
  var c = F.queue[0];
  $('stage').innerHTML = '<div class="panel"><h2>Flashcards</h2><p class="lede">Say the answer out loud. Then tap the card to check.</p>'+
    '<div class="qhead"><span>'+(F.total-F.queue.length)+' of '+F.total+' learned</span></div>'+
    '<button class="flip'+(F.flipped?' back turn':'')+'" data-flip="1">'+(F.flipped?c.back:c.front)+'<span class="hint">'+(F.flipped?'':'Tap to turn over')+'</span></button>'+
    (F.flipped?'<div class="nextrow" style="justify-content:center"><button class="btn soft" data-fl="again">Practice again</button><button class="btn" data-fl="got">I knew it</button></div>':'')+
    '</div>';
}

/* =========================================================
   MATCH
   ========================================================= */
var M = null;
function startMatch(){
  var u=S.unit, pairs=[];
  if(u==='be' || u==='have'){
    ['I','you','he','she','it','we','they'].forEach(function(k){ pairs.push({l:k, r:conj(u,SUBJ[k].g)}); });
  } else {
    genItems(7).forEach(function(it){
      pairs.push({l: u==='behave' ? it.s.t+' … '+it.pr.r : it.s.t+' + '+it.pr.v, r:it.ans});
    });
  }
  M = {pairs:pairs, left:shuffle(pairs.map(function(p,i){ return i; })), right:shuffle(pairs.map(function(p,i){ return i; })),
       doneL:{}, doneR:{}, sel:null, errors:0, matched:0};
  renderMatch();
}
function renderMatch(){
  var h = '<div class="panel"><h2>Match</h2><p class="lede">Tap a word on the left, then its verb on the right.</p>'+keyStrip()+'<div class="cols"><div class="col">';
  M.left.forEach(function(i){
    h += '<button class="mt'+(M.doneL[i]?' done':'')+(M.sel===i?' sel':'')+'" data-ml="'+i+'">'+esc(M.pairs[i].l)+'</button>';
  });
  h += '</div><div class="col">';
  M.right.forEach(function(i){
    h += '<button class="mt'+(M.doneR[i]?' done':'')+'" data-mr="'+i+'">'+esc(M.pairs[i].r)+'</button>';
  });
  h += '</div></div><p class="qhead" style="margin-top:12px">Mistakes: '+M.errors+'</p></div>';
  $('stage').innerHTML = h;
}

/* =========================================================
   SORT
   ========================================================= */
var SO = null;
function startSort(){
  var u=S.unit, bins, tiles=[];
  var subs = ['I','you','he','she','it','we','they'].map(function(k){ return {t:SUBJ[k].t, g:SUBJ[k].g}; })
    .concat(shuffle(NOUNS).slice(0,5).map(function(n){ return {t:n.t, g:SUBJ[n.like].g}; }));
  if(u==='be'){
    bins=['am','is','are'];
    subs.forEach(function(s){ tiles.push({t:s.t, b:conj('be',s.g)}); });
  } else if(u==='have'){
    bins=['have','has'];
    subs.forEach(function(s){ tiles.push({t:s.t, b:conj('have',s.g)}); });
  } else if(u==='behave'){
    bins=['She is …','She has …'];
    shuffle(BE.filter(function(p){ return p.f===ALLP || p.f===SG; })).slice(0,6).forEach(function(p){ tiles.push({t:p.r, b:bins[0]}); });
    shuffle(HAVE.filter(function(p){ return p.f===ALLP; })).slice(0,6).forEach(function(p){ tiles.push({t:p.r, b:bins[1]}); });
  } else if(u==='s'){
    bins=['… play soccer.','… plays soccer.'];
    subs.forEach(function(s){ tiles.push({t:s.t, b: s.g==='s3' ? bins[1] : bins[0]}); });
  } else {
    bins=['add -s','add -es'];
    var verbs = u==='es'
      ? ['watch','wash','fix','go','do','teach','catch','miss','relax','finish','see','play','talk','eat']
      : ['watch','wash','fix','go','do','catch','see','play','talk','eat','read','like','drink','walk'];
    verbs.forEach(function(v){ tiles.push({t:v, b: ES_END.test(v) ? bins[1] : bins[0]}); });
  }
  SO = {bins:bins, tiles:shuffle(tiles).map(function(t,i){ t.id=i; return t; }), placed:{}, sel:null, errors:0};
  renderSort();
}
function renderSort(){
  var left = SO.tiles.filter(function(t){ return !SO.placed[t.id]; });
  if(!left.length){
    var total = SO.tiles.length;
    return showSummary('sort', Math.max(0,total-SO.errors), total, []);
  }
  var lede = (S.unit==='es'||S.unit==='all') ? 'Tap a verb, then tap its box. Look at the last letters.' : 'Tap a word, then tap the box where it goes.';
  var h = '<div class="panel"><h2>Sort</h2><p class="lede">'+lede+'</p>'+keyStrip()+'<div class="tiles">';
  left.forEach(function(t){ h += '<button class="mt'+(SO.sel===t.id?' sel':'')+'" data-st="'+t.id+'">'+esc(t.t)+'</button>'; });
  h += '</div><div class="bins" style="grid-template-columns:repeat('+SO.bins.length+',1fr)">';
  SO.bins.forEach(function(b,bi){
    var inside = SO.tiles.filter(function(t){ return SO.placed[t.id] && t.b===b; });
    h += '<button class="bin" data-bin="'+bi+'"><span class="bh">'+esc(b)+'</span><span class="in">'+inside.map(function(t){ return '<span>'+esc(t.t)+'</span>'; }).join('')+'</span></button>';
  });
  h += '</div><p class="qhead" style="margin-top:12px">Mistakes: '+SO.errors+'</p></div>';
  $('stage').innerHTML = h;
}

/* =========================================================
   SUMMARY + SAVE
   ========================================================= */
function showSummary(ak, correct, total, missed){
  var pct = total ? Math.round(100*correct/total) : 0;
  var msg = ak==='speed' ? (correct>=20?'Fast and correct!':correct>=10?'Good speed. Try to beat it!':'Keep going. Try again!')
          : pct>=90 ? 'Excellent!' : pct>=70 ? 'Good work!' : 'Practice again. You can do it.';
  var nextAct = null;
  for(var i=0;i<ACTS.length-1;i++) if(ACTS[i].k===ak) nextAct = ACTS[i+1].k;
  var h = '<div class="panel summary"><h2>'+msg+'</h2>'+
    '<div class="scorebig" id="verb_score">'+correct+' / '+total+'</div>'+
    '<p class="lede" style="margin:0 auto">'+(ak==='speed'?'correct answers in 60 seconds':'correct')+'</p>';
  if(missed.length){
    h += '<h3>Practice these</h3><ul class="missed">'+missed.slice(0,12).map(function(x){
      return '<li><s>'+esc(x.given)+'</s> → '+esc(x.full)+'</li>'; }).join('')+'</ul>';
  }
  h += '<div class="nextrow" style="justify-content:center;margin-top:18px"><button class="btn soft" data-again="1">Try again</button>'+
    (nextAct ? '<button class="btn" data-goact="'+nextAct+'">Next: '+ACTS.filter(function(a){return a.k===nextAct;})[0].t+'</button>'
             : (S.unit!=='all' ? '<button class="btn" data-nextunit="1">Next unit</button>' : ''))+'</div></div>';
  $('stage').innerHTML = h;
  window.GAL_SCORE = correct; window.GAL_MAX = total;
  saveResult(ak, correct, total, missed);
}
function headers(extra){
  var h = {'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY, 'Content-Type':'application/json'};
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function setDot(c){ var d=$('dot'); if(d) d.className=c||''; }
function saveResult(ak, correct, total, missed){
  var key = S.unit+'-'+ak, prev = S.scores[key] || {best:0, attempts:0};
  var rec = {best:Math.max(prev.best||0, correct), total:total, correct:correct, attempts:(prev.attempts||0)+1};
  S.scores[key] = rec; persist(); renderNav();
  setDot('saving');
  var row = {
    email:S.email, name:S.name, period:S.period, activity:key, unit:S.unit,
    correct:correct, total:total, best:rec.best, attempts:rec.attempts, turned_in:true,
    detail:{level:S.level, lang:S.lang, missed:missed.slice(0,20)},
    updated_at:new Date().toISOString()
  };
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,activity', {
    method:'POST', headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}), body:JSON.stringify(row)
  }).then(function(r){
    if(r.ok) setDot('saved'); else { setDot('err'); r.text().then(function(t){ console.warn('save failed', r.status, t); }); }
  }).catch(function(e){ setDot('err'); console.warn(e); });
}
function loadScores(){
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?email=eq.'+encodeURIComponent(S.email)+'&select=activity,best,total,correct,attempts', {headers:headers()})
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){ (rows||[]).forEach(function(r){ S.scores[r.activity] = {best:r.best, total:r.total, correct:r.correct, attempts:r.attempts}; }); })
    .catch(function(){});
}

/* =========================================================
   LOGIN + IDENTITY
   ========================================================= */
var EMAIL_RE = /^[^@\s]+@(s\.)?sfusd\.edu$/;
function canonical(email){ return email.trim().toLowerCase().split('@')[0]+'@s.sfusd.edu'; }
function registerStudent(typed){
  var canon = S.email, parts = S.name.split(/\s+/);
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email', {
    method:'POST', headers:headers({'Prefer':'resolution=ignore-duplicates,return=minimal'}),
    body:JSON.stringify([{email:canon, first_name:parts[0]||null, last_name:parts.slice(1).join(' ')||null}])
  }).catch(function(){});
  if(typed!==canon){
    fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email', {
      method:'POST', headers:headers({'Prefer':'resolution=ignore-duplicates,return=minimal'}),
      body:JSON.stringify([{alias_email:typed, canonical_email:canon}])
    }).catch(function(){});
  }
}

/* =========================================================
   TRANSLATION POPOVER
   ========================================================= */
var trCache = {};
function translate(text){
  if(S.lang==='none'){ popup(text, 'Choose your language at the top of the page.', ''); return; }
  var key = S.lang+'|'+text;
  if(trCache[key]) return popup(text, trCache[key].equiv, trCache[key].meaning);
  popup(text, '…', '');
  var url = PROXY+'?action=translate&idiom='+encodeURIComponent(text)+
    '&meaning='+encodeURIComponent('A simple English sentence or grammar rule for beginner students learning verbs. Translate it plainly.')+
    '&lang='+encodeURIComponent(S.lang);
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ok && d.translation){ trCache[key]=d.translation; popup(text, d.translation.equiv, d.translation.meaning); }
    else popup(text, 'Translation is not available right now.', '');
  }).catch(function(){ popup(text, 'Translation is not available right now.', ''); });
}
function popup(src, dst, mean){
  var p=$('pop'); p.classList.remove('hidden');
  var rtl = /Arabic|Darija|Urdu/.test(S.lang);
  p.innerHTML = '<button aria-label="Close" data-closepop="1">×</button><div class="src">'+esc(src)+'</div>'+
    '<div class="dst" dir="'+(rtl?'rtl':'ltr')+'">'+esc(dst)+'</div>'+(mean?'<div class="mean" dir="'+(rtl?'rtl':'ltr')+'">'+esc(mean)+'</div>':'');
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('button, .tr') : null;
  if(!t) return;
  var d = function(k){ return t.getAttribute('data-'+k); };

  if(d('closepop')){ $('pop').classList.add('hidden'); return; }
  if(d('say')){ speak(d('say')); return; }
  if(d('tr')){ translate(d('tr')); return; }
  if(d('unit')) return go(d('unit'), 'learn');
  if(d('actk')) return go(null, d('actk'));
  if(d('goact')) return go(null, d('goact'));
  if(d('nextunit')){ for(var i=0;i<UNITS.length-1;i++) if(UNITS[i].k===S.unit) return go(UNITS[i+1].k,'learn'); return; }
  if(d('again')) return renderStage();
  if(d('speedgo')) return speedStart();

  /* quiz */
  if(Q && !Q.done){
    var it = Q.items[Q.i];
    if(d('opt')!=null && !Q.answered) return answer(d('opt')===it.ans, d('opt'));
    if(d('rw')!=null && !Q.answered){ var saysRight = d('rw')==='1', isRight = it.shown===it.ans, okRw = saysRight===isRight;
      answer(okRw, isRight ? 'said it was wrong' : it.s.t+' '+it.shown+' '+it.pr.r+'.');
      t.classList.add(okRw?'ok':'no'); return; }
    if(d('chip')!=null){ var w=$('wIn'); if(w){ w.value=d('chip'); w.focus(); } return; }
    if(d('next')) return nextQ();
    if(d('check') && !Q.answered){
      if(Q.mode==='write'){ var v=$('wIn').value; if(!v.trim()) return $('wIn').focus(); return answer(norm(v)===norm(it.ans), v.trim()); }
      if(Q.mode==='build'){ var got = it.placed.map(function(ti){ return it.tokens[ti]; }).join(' '); if(!got) return; return answer(norm(got)===norm(it.target), got); }
    }
    if(d('place')!=null && !Q.answered){ var ti=+d('place'); if(it.placed.indexOf(ti)<0){ it.placed.push(ti); speak(it.tokens[ti]); renderQ(); } return; }
    if(d('unplace')!=null && !Q.answered){ it.placed.splice(+d('unplace'),1); renderQ(); return; }
  }
  /* flashcards */
  if(F && d('flip')){ if(!F.flipped){ F.flipped=true; speak(F.queue[0].say); renderFlash(); } else { F.flipped=false; renderFlash(); } return; }
  if(F && d('fl')){
    var c = F.queue.shift();
    if(d('fl')==='got'){ if(!F.seen[c.say]) F.firstTry++; }
    else { F.seen[c.say]=1; F.queue.splice(Math.min(F.queue.length,3),0,c); }
    F.flipped=false; renderFlash(); return;
  }
  /* match */
  if(M && d('ml')!=null){ M.sel = +d('ml'); renderMatch(); return; }
  if(M && d('mr')!=null){
    var ri = +d('mr');
    if(M.sel==null){ t.classList.add('shake'); return; }
    if(M.pairs[ri].r === M.pairs[M.sel].r){
      M.doneL[M.sel]=1; M.doneR[ri]=1; M.matched++;
      speak(M.pairs[M.sel].l.replace(' + ',' ').replace(' … ',' ')+' '+M.pairs[ri].r);
      M.sel=null;
      if(M.matched===M.pairs.length){ var tot=M.pairs.length; return showSummary('match', Math.max(0,tot-M.errors), tot, []); }
    } else { M.errors++; renderMatch(); var b=document.querySelector('[data-mr="'+ri+'"]'); if(b) b.classList.add('shake'); return; }
    renderMatch(); return;
  }
  /* sort */
  if(SO && d('st')!=null){ SO.sel=+d('st'); renderSort(); return; }
  if(SO && d('bin')!=null){
    if(SO.sel==null) return;
    var tile = SO.tiles[SO.sel], bin = SO.bins[+d('bin')];
    if(tile.b===bin){ SO.placed[tile.id]=1; SO.sel=null; renderSort(); }
    else { SO.errors++; renderSort(); var bb=document.querySelector('[data-bin="'+d('bin')+'"]'); if(bb) bb.classList.add('shake'); }
    return;
  }
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' || !Q || Q.done) return;
  if(Q.answered && Q.mode!=='speed'){ e.preventDefault(); nextQ(); }
  else if(Q.mode==='write' && document.activeElement && document.activeElement.id==='wIn'){ e.preventDefault(); var b=document.querySelector('[data-check]'); if(b) b.click(); }
});

function boot(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('whoLbl').textContent = S.name+', '+S.period;
  $('langSel').value = S.lang;
  $('levelSel').value = S.level;
  renderNav(); renderStage();
}
document.addEventListener('DOMContentLoaded', function(){
  var opts = LANGS.map(function(l){ return '<option value="'+l[0]+'">'+esc(l[1])+(l[0]!=='none'&&l[1]!==l[0]?' ('+l[0]+')':'')+'</option>'; }).join('');
  $('inLang').innerHTML = opts; $('langSel').innerHTML = opts;
  try{
    var c = JSON.parse(localStorage.getItem(LSKEY)||'null');
    if(c && c.email){
      $('inName').value=c.name||''; $('inEmail').value=c.email||''; $('inPeriod').value=c.period||''; $('inLang').value=c.lang||'none';
      S.level=c.level||'std'; S.unit=c.unit||'be'; S.act=c.act||'learn'; S.scores=c.scores||{};
    } else {
      var saved = localStorage.getItem('gal_student_email'); if(saved) $('inEmail').value = saved;
    }
  }catch(e){}

  $('btnStart').addEventListener('click', function(){
    var n=$('inName').value.trim(), em=$('inEmail').value.trim().toLowerCase(), p=$('inPeriod').value;
    if(!n){ $('loginErr').textContent='Write your name.'; return $('inName').focus(); }
    if(!EMAIL_RE.test(em)){ $('loginErr').textContent='Use your school email: name@s.sfusd.edu'; return $('inEmail').focus(); }
    if(!p){ $('loginErr').textContent='Choose your class period.'; return $('inPeriod').focus(); }
    var canon = canonical(em);
    if(S.email && S.email!==canon) S.scores = {};
    S.name=n; S.email=canon; S.period=p; S.lang=$('inLang').value;
    try{ localStorage.setItem('gal_student_email', canon); }catch(e){}
    persist();
    registerStudent(em);
    $('btnStart').textContent='Loading…';
    loadScores().then(function(){ persist(); boot(); });
  });
  ['inName','inEmail'].forEach(function(id){ $(id).addEventListener('keydown', function(e){ if(e.key==='Enter') $('btnStart').click(); }); });
  $('langSel').addEventListener('change', function(){ S.lang=$('langSel').value; persist(); if(S.act==='learn') renderStage(); });
  $('levelSel').addEventListener('change', function(){ S.level=$('levelSel').value; persist(); renderStage(); });
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged = function(){ voice=null; };
});
