<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verb drills — Mr. Toby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2640;--muted:#5b6784;--bg:#eef2f8;--card:#fff;--line:#d3dbe9;
  --s3:#a86400;--s3-b:#f0a52a;--s3-t:#fff0d6;         /* the form that changes */
  --pl:#2c5bc4;--pl-t:#e3ebfd;                        /* the plain form        */
  --pa:#0f7b74;--pa-t:#dcf3f1;                        /* past tense            */
  --ok:#1d7f53;--ok-t:#dff3e8;--no:#b93a2e;--no-t:#fbe5e1;
}
@media (prefers-color-scheme: dark){:root{--ink:#e8ecf5;--muted:#a3adc4;--bg:#141a28;--card:#1e2638;--line:#34405a;--s3:#ffc56a;--s3-t:#3d2f17;--pl:#9dbaff;--pl-t:#20305a;--pa:#6fd6cc;--pa-t:#173a38;--ok:#6fd6a3;--ok-t:#173a2b;--no:#ff9a8f;--no-t:#44211d}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 Lexend,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pl);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 60px}
.hidden{display:none!important}

#login{max-width:440px;margin:6vh auto;background:var(--card);border-radius:20px;padding:28px 26px;border:1px solid var(--line)}
#login h1{font-size:34px;line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.5px}
#login h1 .a{color:var(--pl)} #login h1 .b{color:var(--s3)} #login h1 .c{color:var(--pa)}
#login p{margin:0 0 18px;color:var(--muted)}
#login label{display:block;font-weight:500;margin:14px 0 5px}
#login input,#login select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
#login .err{color:var(--no);font-size:15px;min-height:22px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%;margin-top:18px;font-size:19px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.allverbs{color:var(--muted);text-decoration:none;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:5px 10px}
#backLesson{display:none;background:#1d7f53;color:#fff;text-decoration:none;font-weight:700;font-size:16px;border-radius:11px;padding:8px 16px;box-shadow:0 3px 0 #145f3e}
.brand{font-weight:800;font-size:21px;letter-spacing:-.3px}
.who{color:var(--muted);font-size:15px}
.spacer{flex:1}
.bar select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);font-size:15px}
#btn-dir{padding:7px 12px;font-size:15px;box-shadow:none;border-radius:9px}
#btn-dir.on{background:var(--pl);color:var(--card);border-color:var(--pl)}
#dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
#dot.saving{background:var(--s3-b)}#dot.saved{background:var(--ok)}#dot.err{background:var(--no)}

#modes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mode{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:6px 15px;font-size:15px}
.mode.on{background:var(--pl);border-color:var(--pl);color:var(--card)}
.mode .ck{color:var(--ok);font-weight:800;margin-left:4px}
.mode.on .ck{color:var(--card)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 4px;font-size:27px;letter-spacing:-.3px}
.lede{color:var(--muted);margin:0 0 16px;max-width:64ch}
.dirtr{display:block;font-size:15px;color:var(--muted);margin-top:4px;font-weight:400}
.dirtr[dir=rtl]{text-align:right}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:15px;gap:10px;flex-wrap:wrap}

/* ---------- set picker ---------- */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.setcard{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--line)}
.setcard h3{margin:0 0 4px;font-size:19px}
.setcard .t{display:inline-block;font-size:13px;border-radius:999px;padding:2px 9px;margin-bottom:6px}
.t-present{background:var(--pl-t);color:var(--pl)}.t-past{background:var(--pa-t);color:var(--pa)}.t-prog{background:var(--s3-t);color:var(--s3)}
.setcard p{margin:0;color:var(--muted);font-size:14px}

/* ---------- grids ---------- */
.gridwrap{overflow-x:auto;padding-bottom:4px}
table.grid{border-collapse:collapse;min-width:100%}
table.grid th,table.grid td{padding:7px 12px;text-align:left;white-space:nowrap;font-size:20px}
table.grid th{font-size:14px;color:var(--muted);font-weight:500;border-bottom:1.5px solid var(--line)}
table.grid td.sub{color:var(--muted);font-size:17px;padding-right:0}
table.grid tr.chg td{background:var(--s3-t)}
table.grid tr.chg td.sub{color:var(--s3)}
table.grid .f{font-weight:700}
table.grid tr.chg .f{color:var(--s3)}
td.irr .f{color:var(--pa)}
input.cell{width:7.2em;padding:5px 8px;border:2px solid var(--line);border-radius:9px;background:var(--bg);font-size:19px}
input.cell.wide{width:10em}
input.cell.ok{border-color:var(--ok);background:var(--ok-t);color:var(--ok)}
input.cell.no{border-color:var(--no);background:var(--no-t);color:var(--no)}
.fix{display:block;font-size:14px;color:var(--ok);font-weight:700}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1.5px dashed var(--muted);border-radius:10px;padding:4px 12px;background:transparent;font-size:17px}
.chip.used{opacity:.35}

/* ---------- choose ---------- */
.scene{float:right;width:190px;margin:0 0 10px 18px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:6px}
.scene svg{display:block;width:100%;height:auto}
@media (max-width:560px){.scene{float:none;width:168px;margin:0 auto 10px}}
.vpic{width:62px;height:46px;vertical-align:middle}
.vpic svg{width:62px;height:46px}
td .vpic{margin-right:6px}
.sentence{font-size:32px;line-height:1.35;font-weight:500;margin:10px 0}
.blank{display:inline-block;min-width:3.6em;border-bottom:3px solid var(--ink);text-align:center;color:var(--muted)}
.base{font-size:20px;color:var(--muted);font-weight:400}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.opt{min-width:110px;font-size:23px;font-weight:700;padding:11px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok-t);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.no{background:var(--no-t);border-color:var(--no);color:var(--no);box-shadow:0 4px 0 var(--no)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}.dots i.cur{background:var(--ink)}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;font-size:18px}
.fb.ok{background:var(--ok-t);color:var(--ok)}.fb.no{background:var(--no-t);color:var(--no)}
.fb .full{display:block;color:var(--ink);font-size:22px;margin-top:4px}
.nextrow{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.tool{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:3px 10px;font-size:14px}

/* ---------- negatives ---------- */
.negrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line);font-size:21px}
.negrow .long{min-width:9em}
.negrow.chg .long{color:var(--s3)}
.negrow .eq{color:var(--muted)}

/* ---------- verb table ---------- */
table.vt{border-collapse:collapse;width:100%;min-width:720px}
table.vt th{font-size:14px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--line)}
table.vt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.vt td.v{font-size:20px;font-weight:600;white-space:nowrap}
table.vt input.sent{width:100%;min-width:200px;padding:7px 9px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.trcell{min-width:120px;font-size:17px}
.trcell[dir=rtl]{text-align:right}

.summary{text-align:center;padding:10px 0}
.summary .scorebig{font-size:52px;font-weight:800;margin:4px 0}
.missed{text-align:left;max-width:560px;margin:12px auto;padding:0;list-style:none}
.missed li{background:var(--no-t);border-radius:10px;padding:7px 12px;margin-bottom:6px}
.missed li s{color:var(--no)}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:26px}
@media (max-width:640px){.sentence{font-size:26px}table.grid th,table.grid td{font-size:18px;padding:6px 8px}}
</style>
</head>
<body>
<div class="wrap">

<section id="login">
  <h1><span class="a">play</span> <span class="b">plays</span> <span class="c">played</span></h1>
  <p>Verb drills: write the right form, every person, every tense.</p>
  <label for="inName">Your name</label>
  <input id="inName" autocomplete="name" placeholder="First and last name">
  <label for="inEmail">School email</label>
  <input id="inEmail" type="email" autocomplete="email" placeholder="name@s.sfusd.edu">
  <label for="inPeriod">Class period</label>
  <select id="inPeriod">
    <option value="">Choose…</option>
    <option>Period 1</option><option>Period 2</option><option>Period 3</option>
    <option>Period 4</option><option>Period 5</option><option>Period 6</option><option>Period 7</option>
  </select>
  <label for="inLang">Your language</label>
  <select id="inLang"></select>
  <div class="err" id="loginErr"></div>
  <button class="btn wide" id="btnStart">Start</button>
</section>

<div id="app" class="hidden">
  <header class="bar">
    <a class="allverbs" href="../">All verbs</a>
    <a id="backLesson" href="#"></a>
    <span class="brand" id="brand">Verb drills</span>
    <span id="dot" title="Saving status"></span>
    <span class="who" id="whoLbl"></span>
    <span class="spacer"></span>
    <button class="btn soft" id="btn-dir" title="Show the directions in your language">Directions</button>
    <select id="setSel" aria-label="Verb list"></select>
    <select id="levelSel" aria-label="Level">
      <option value="easy">Easier</option>
      <option value="std">Standard</option>
      <option value="chal">Challenge</option>
    </select>
    <select id="langSel" aria-label="Language"></select>
  </header>
  <nav id="modes"></nav>
  <main id="stage"></main>
  <footer>Mr. Toby</footer>
</div>

</div>

<script src="../conjugation.js"></script>
<script src="../verbpics.js"></script>
<script>
/* ===================== config ===================== */
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE='verb_practice', PAGE_SLUG='verbs/drill';
var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
var LSKEY='verbdrill_v1';
var rawFetch = window.fetch.bind(window);
var LANGS=[['none','English only'],['Spanish','Español'],['Cantonese','廣東話'],['Mandarin','中文 (普通话)'],
  ['Arabic','العربية'],['Darija','الدارجة'],['Vietnamese','Tiếng Việt'],['Russian','Русский'],
  ['Urdu','اردو'],['Tagalog','Tagalog'],['French','Français'],['Korean','한국어'],
  ['Hindi','हिन्दी'],['Somali','Soomaali'],['Nepali','नेपाली'],['Thai','ไทย']];
var MODES=[{k:'grid',t:'Grid'},{k:'choose',t:'Choose'},{k:'neg',t:"Negatives"},{k:'table',t:'Verb table'}];

var S={name:'',email:'',period:'',lang:'none',level:'std',set:'',mode:'grid',scores:{}};
var G=null;          /* current grid     */
var Q=null;          /* current choose   */
var N=null;          /* current negatives*/
var TB=null;         /* current table    */
var autosaveId=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function persist(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function theSet(){ return CONJ.set(S.set) || CONJ.SETS[0]; }
function tenseOf(){ return theSet().tense; }
function count(){ return S.level==='easy'?6:S.level==='chal'?12:9; }
function nOpts(){ return S.level==='easy'?2:S.level==='chal'?4:3; }
function shuffle(a){ return CONJ.shuffle(a); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function someVerbs(n){ var v=shuffle(theSet().verbs); var out=[]; while(out.length<n) out=out.concat(v); return out.slice(0,n); }

var voice=null;
function speak(t){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(t).replace(/\bI\b/g,'eye'));
    u.lang='en-US'; u.rate=.85;
    if(!voice){var vs=speechSynthesis.getVoices();for(var i=0;i<vs.length;i++){if(/en-US/.test(vs[i].lang)){voice=vs[i];break}}}
    if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===================== nav ===================== */
function bestFor(mk){ return S.scores[S.set+'-'+mk]; }
function renderNav(){
  var st=theSet();
  $('brand').textContent=st.title;
  $('setSel').value=st.id;
  $('modes').innerHTML = MODES.map(function(m){
    return '<button class="mode'+(m.k===S.mode?' on':'')+'" data-mode="'+m.k+'">'+m.t+(bestFor(m.k)?'<span class="ck">✓</span>':'')+'</button>';
  }).join('');
}
function render(){
  stopAutosave(); G=null; Q=null; N=null; TB=null;
  renderNav();
  if(S.mode==='grid') return renderGrid();
  if(S.mode==='choose') return startChoose();
  if(S.mode==='neg') return renderNeg();
  return renderTable();
}
function go(mode){ S.mode=mode; persist(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ===================== 1. GRID =====================
   present / progressive -> the person paradigm (I play, he plays…)
   past                  -> the forms grid (play, played, didn't play)      */
function renderGrid(){
  var st=theSet(), tense=st.tense;
  var blanks = S.level==='easy'?5:S.level==='chal'?12:8;
  G = (tense==='past') ? buildFormsGrid(blanks) : buildPersonGrid(blanks);
  drawGrid();
}
function buildPersonGrid(blanks){
  var verbs=someVerbs(3), tense=tenseOf();
  var p=CONJ.paradigm(verbs,tense);
  var slots=[];
  p.rows.forEach(function(r,ri){ r.cells.forEach(function(c,ci){ slots.push(ri+'.'+ci); }); });
  var chosen={}; shuffle(slots).slice(0,blanks).forEach(function(s){ chosen[s]= (S.level==='chal'&&Math.random()<.25) ? 'subject' : 'verb'; });
  return {kind:'persons', data:p, blank:chosen, checked:false};
}
function buildFormsGrid(blanks){
  var rows=Math.min(theSet().verbs.length, S.level==='easy'?6:S.level==='chal'?10:8);
  var f=CONJ.formsGrid(someVerbs(rows), 'past');
  var slots=[];
  f.rows.forEach(function(r,ri){ r.cells.forEach(function(c,ci){ if(!c.fixed) slots.push(ri+'.'+ci); }); });
  var chosen={}; shuffle(slots).slice(0,Math.min(blanks,slots.length)).forEach(function(s){ chosen[s]='verb'; });
  /* every row needs at least the past form blank at Standard and up */
  if(S.level!=='easy') f.rows.forEach(function(r,ri){ chosen[ri+'.1']='verb'; });
  return {kind:'forms', data:f, blank:chosen, checked:false};
}
function cellInput(key, value, wide){
  return '<input class="cell'+(wide?' wide':'')+'" data-k="'+key+'" value="'+esc(value||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="missing word">';
}
function drawGrid(){
  var st=theSet(), tense=st.tense, h='<div class="panel">';
  var lede = G.kind==='persons'
    ? 'Fill in the missing words. Every line is the same verb with a different person.'
    : 'Fill in the missing past tense forms. Watch for the irregular verbs.';
  h+='<h2>Grid</h2><p class="lede">'+lede+'</p>';
  h+='<div class="gridwrap"><table class="grid">';
  if(G.kind==='persons'){
    h+='<tr><th></th>'+G.data.cols.map(function(c){return '<th>'+esc(c.base)+'</th>'}).join('')+'</tr>';
    G.data.rows.forEach(function(r,ri){
      var chg = r.cells[0].changes;
      h+='<tr class="'+(chg?'chg':'')+'">';
      h+='<td class="sub">'+esc(r.person.t)+'</td>';
      r.cells.forEach(function(c,ci){
        var k=ri+'.'+ci, b=G.blank[k];
        if(!b) h+='<td>'+esc(c.subject)+' <span class="f">'+esc(c.answer)+'</span></td>';
        else if(b==='subject') h+='<td>'+cellInput(k,'')+' <span class="f">'+esc(c.answer)+'</span>'+fixSlot(k)+'</td>';
        else h+='<td>'+esc(c.subject)+' '+cellInput(k,'')+fixSlot(k)+'</td>';
      });
      h+='</tr>';
    });
  } else {
    h+='<tr>'+G.data.cols.map(function(c){return '<th>'+esc(c.label)+'</th>'}).join('')+'</tr>';
    G.data.rows.forEach(function(r,ri){
      h+='<tr>';
      r.cells.forEach(function(c,ci){
        var k=ri+'.'+ci;
        if(c.fixed){
          var gp=(window.VERBPIC?VERBPIC.get(c.answer):'');
          h+='<td class="sub">'+(gp?'<span class="vpic" aria-hidden="true">'+gp+'</span>':'')+esc(c.answer)+'</td>';
        }
        else if(G.blank[k]) h+='<td>'+cellInput(k,'',ci===2)+fixSlot(k)+'</td>';
        else h+='<td'+(r.irregular?' class="irr"':'')+'><span class="f">'+esc(c.answer)+'</span></td>';
      });
      h+='</tr>';
    });
  }
  h+='</table></div>';
  if(S.level==='easy'){
    h+='<div class="bank">'+shuffle(answerList()).map(function(a){return '<button class="chip" data-chip="'+esc(a)+'">'+esc(a)+'</button>'}).join('')+'</div>';
  }
  h+='<div class="nextrow"><button class="btn" data-gcheck="1">Check</button><button class="btn soft" data-again="1">New grid</button></div></div>';
  $('stage').innerHTML=h;
  var f=document.querySelector('input.cell'); if(f) f.focus();
}
function fixSlot(k){ return '<span class="fix" data-fix="'+k+'"></span>'; }
function answerList(){
  var out=[];
  eachBlank(function(k,want){ out.push(want); });
  return out;
}
function eachBlank(fn){
  Object.keys(G.blank).forEach(function(k){
    var p=k.split('.'), ri=+p[0], ci=+p[1], cell=G.data.rows[ri].cells[ci];
    var want = G.blank[k]==='subject' ? cell.subject : cell.answer;
    fn(k, want, cell, G.blank[k]);
  });
}
function checkGrid(){
  if(G.checked) return;
  var right=0, total=0, missed=[];
  eachBlank(function(k, want, cell, kind){
    total++;
    var el=document.querySelector('input.cell[data-k="'+k+'"]'); if(!el) return;
    var typed=el.value, ok;
    if(kind==='subject') ok = typed.trim().toLowerCase()===String(want).toLowerCase();
    else ok = CONJ.accepts(cell.base, cell.personKey, cell.tense||tenseOf(), {neg:cell.neg}, typed)
           || typed.trim().toLowerCase()===String(want).toLowerCase();
    el.classList.add(ok?'ok':'no'); el.disabled=true;
    if(ok) right++;
    else{
      var fx=document.querySelector('[data-fix="'+k+'"]'); if(fx) fx.textContent=want;
      missed.push({full:(cell.subject?cell.subject+' ':'')+want, given:typed.trim()||'(blank)'});
    }
  });
  G.checked=true;
  document.querySelectorAll('.chip').forEach(function(c){ c.disabled=true; });
  finish('grid', right, total, missed, true);
}

/* ===================== 2. CHOOSE ===================== */
function startChoose(){
  var tense=tenseOf(), items=[], verbs=someVerbs(count());
  verbs.forEach(function(b){
    var p=pick(CONJ.PERSONS).k;
    var neg = S.level==='chal' ? Math.random()<.35 : S.level==='std' ? Math.random()<.2 : false;
    items.push(CONJ.choiceItem(b,p,tense,{neg:neg},nOpts()));
  });
  Q={items:items,i:0,right:0,answered:false,marks:[],missed:[]};
  drawChoose();
}
function drawChoose(){
  var it=Q.items[Q.i];
  var h='<div class="panel"><h2>Choose</h2><p class="lede">Tap the right form of the verb.</p>';
  h+='<div class="qhead"><span>'+(Q.i+1)+' of '+Q.items.length+'</span><span class="dots">'+
     Q.items.map(function(_,k){return '<i class="'+(Q.marks[k]===true?'ok':Q.marks[k]===false?'no':k===Q.i?'cur':'')+'"></i>'}).join('')+'</span></div>';
  var pic=(window.VERBPIC?VERBPIC.get(it.base):'');
  if(pic) h+='<div class="scene" aria-hidden="true">'+pic+'</div>';
  h+='<div class="sentence" translate="no">'+esc(it.subject)+' <span class="blank">?</span> <span class="base">('+esc(it.base)+(it.neg?', not':'')+')</span></div>';
  h+='<div class="opts">'+it.options.map(function(o){return '<button class="opt" data-opt="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div>';
  h+='<div id="fbox"></div></div>';
  $('stage').innerHTML=h;
}
function answerChoose(given){
  if(Q.answered) return; Q.answered=true;
  var it=Q.items[Q.i], ok=given===it.answer;
  Q.marks[Q.i]=ok; if(ok) Q.right++; else Q.missed.push({full:it.full,given:given});
  document.querySelectorAll('.opt').forEach(function(b){
    b.disabled=true; var v=b.getAttribute('data-opt');
    if(v===it.answer) b.classList.add('ok'); else if(v===given) b.classList.add('no');
  });
  $('fbox').innerHTML='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Yes!':'Not quite.')+'</b> '+esc(whyChoose(it))+
    '<span class="full" translate="no">'+esc(it.full)+'</span></div>'+
    '<div class="nextrow"><button class="btn" id="btnNext" data-next="1">'+(Q.i+1<Q.items.length?'Next':'See my score')+'</button>'+
    '<button class="tool" data-say="'+esc(it.full)+'">🔊 Listen</button></div>';
  speak(it.full);
  var n=$('btnNext'); if(n) n.focus();
}
function whyChoose(it){
  var t=it.tense, p=CONJ.person(it.personKey), v=CONJ.verb(it.base);
  if(it.neg){
    if(t==='past') return "Past negative is always: didn't + "+v.b+".";
    if(t==='prog') return p.t+' → '+CONJ.form(it.base,it.personKey,'prog',{neg:1}).split(' ')[0]+' + '+v.ing+'.';
    return p.g==='s3' ? "He, she, it → doesn't + "+v.b+'.' : "I, you, we, they → don't + "+v.b+'.';
  }
  if(t==='past') return v.irregular ? v.b+' is irregular: '+v.past+'.' : v.b+' + -ed → '+v.past+'.';
  if(t==='prog') return p.t+' → '+CONJ.form(it.base,it.personKey,'prog').split(' ')[0]+' + '+v.ing+'.';
  if(v.b==='be') return p.t+' → '+CONJ.form('be',it.personKey,'present')+'.';
  return p.g==='s3' ? 'He, she, it → '+v.s+'.' : 'I, you, we, they → '+v.b+'.';
}

function renderNeg(){
  var tense=tenseOf(), base=pick(theSet().verbs.filter(function(v){return v!=='be'}).concat(['be']));
  var rows=CONJ.negatives(base,tense);
  var typed = S.level!=='easy';
  N={base:base,tense:tense,rows:rows,typed:typed,checked:false};
  var h='<div class="panel"><h2>Negatives</h2>'+
    '<p class="lede">'+(typed?'Write the short form. He does not = He doesn\'t.':'Tap the short form that matches.')+'</p>';
  h+='<div translate="no">';
  rows.forEach(function(r,i){
    h+='<div class="negrow'+(r.changes?' chg':'')+'"><span class="long">'+esc(r.long)+'</span><span class="eq">=</span>';
    if(typed) h+=cellInput('n'+i,'',true)+'<span class="fix" data-fix="n'+i+'"></span>';
    else{
      var opts=shuffle([r.short].concat(shuffle(rows.filter(function(x){return x.short!==r.short})).slice(0,1).map(function(x){return x.short})));
      h+='<span class="opts" style="margin:0">'+opts.map(function(o){return '<button class="opt" style="font-size:19px;padding:6px 12px;min-width:0" data-neg="'+i+'" data-val="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</span>';
    }
    h+='</div>';
  });
  h+='</div><div class="nextrow">'+(typed?'<button class="btn" data-ncheck="1">Check</button>':'')+
     '<button class="btn soft" data-again="1">Another verb</button></div></div>';
  $('stage').innerHTML=h;
  N.marks={}; N.right=0;
}
function checkNeg(){
  if(N.checked) return; N.checked=true;
  var right=0,total=N.rows.length,missed=[];
  N.rows.forEach(function(r,i){
    var el=document.querySelector('input.cell[data-k="n'+i+'"]'); if(!el) return;
    var ok=CONJ.accepts(N.base,r.person.k,N.tense,{neg:1},el.value.replace(new RegExp('^'+r.person.t+'\\s*','i'),''))
      || el.value.trim().toLowerCase()===r.short.toLowerCase();
    el.classList.add(ok?'ok':'no'); el.disabled=true;
    if(ok) right++; else{
      var fx=document.querySelector('[data-fix="n'+i+'"]'); if(fx) fx.textContent=r.short;
      missed.push({full:r.long+' = '+r.short, given:el.value.trim()||'(blank)'});
    }
  });
  finish('neg', right, total, missed, true);
}
function answerNegTap(i, val){
  if(N.marks[i]!=null) return;
  var r=N.rows[i], ok=val===r.short;
  N.marks[i]=ok; if(ok) N.right++;
  document.querySelectorAll('[data-neg="'+i+'"]').forEach(function(b){
    b.disabled=true; var v=b.getAttribute('data-val');
    if(v===r.short) b.classList.add('ok'); else if(v===val) b.classList.add('no');
  });
  if(Object.keys(N.marks).length===N.rows.length){
    var missed=N.rows.filter(function(x,i2){return N.marks[i2]===false}).map(function(x){return {full:x.long+' = '+x.short, given:'wrong choice'}});
    finish('neg', N.right, N.rows.length, missed, true);
  }
}

/* ===================== 4. VERB TABLE =====================
   The paper worksheet, digital: verb -> form -> translation -> sentence.   */
function tableTarget(){
  var t=tenseOf();
  return t==='past' ? {label:'Past tense verb', get:function(b){return CONJ.verb(b).past}}
       : t==='prog' ? {label:'He is …', get:function(b){return CONJ.form(b,'he','prog')}}
       : {label:'He / she / it', get:function(b){return CONJ.form(b,'he','present')}};
}
function renderTable(){
  var tgt=tableTarget(), verbs=someVerbs(Math.min(theSet().verbs.length, count()));
  TB={verbs:verbs, tgt:tgt, sent:{}, checked:false};
  var h='<div class="panel"><h2>Verb table</h2>'+
    '<p class="lede">Write the verb form. Tap Translate to see the verb in your language. Then write one sentence with it.</p>'+
    '<div class="gridwrap"><table class="vt"><tr><th>Verb</th><th>'+esc(tgt.label)+'</th><th>Translate</th><th>Sentence</th></tr>';
  verbs.forEach(function(b,i){
    var vp=(window.VERBPIC?VERBPIC.get(b):'');
    h+='<tr><td class="v" translate="no">'+(vp?'<span class="vpic" aria-hidden="true">'+vp+'</span>':'')+esc(b)+'</td>'+
       '<td>'+cellInput('t'+i,'')+'<span class="fix" data-fix="t'+i+'"></span></td>'+
       '<td><button class="tool" data-trv="'+esc(b)+'" data-i="'+i+'">🌐</button> <span class="trcell" id="tr'+i+'"></span></td>'+
       '<td><input class="sent" data-sent="'+i+'" placeholder="Write a sentence with '+esc(b)+'" autocomplete="off"></td></tr>';
  });

  $('stage').innerHTML=h;
  startAutosave();
}
function collectSentences(){
  var out=[];
  if(!TB) return out;
  document.querySelectorAll('[data-sent]').forEach(function(el){
    var i=+el.getAttribute('data-sent'), v=el.value.trim();
    if(v) out.push({verb:TB.verbs[i], sentence:v});
  });
  return out;
}
function checkTable(){
  if(TB.checked) return;
  var right=0,total=TB.verbs.length,missed=[];
  TB.verbs.forEach(function(b,i){
    var el=document.querySelector('input.cell[data-k="t'+i+'"]'); if(!el) return;
    var want=TB.tgt.get(b);
    var ok = tenseOf()==='past' ? CONJ.accepts(b,'I','past',{},el.value) : el.value.trim().toLowerCase()===want.toLowerCase();
    el.classList.add(ok?'ok':'no'); el.disabled=true;
    if(ok) right++; else{
      var fx=document.querySelector('[data-fix="t'+i+'"]'); if(fx) fx.textContent=want;
      missed.push({full:b+' → '+want, given:el.value.trim()||'(blank)'});
    }
  });
  TB.checked=true;
  finish('table', right, total, missed, true, {sentences:collectSentences()});
}
function startAutosave(){
  stopAutosave();
  autosaveId=setInterval(function(){
    if(!TB) return;
    var s=collectSentences(); if(!s.length) return;
    save('table', null, null, [], false, {sentences:s});
  },20000);
}
function stopAutosave(){ if(autosaveId){ clearInterval(autosaveId); autosaveId=null; } }

/* translation of one verb, via the Apps Script proxy */
var trCache={};
function translateVerb(base, i){
  var out=$('tr'+i); if(!out) return;
  if(S.lang==='none'){ out.textContent='Choose your language at the top.'; return; }
  out.setAttribute('dir', /Arabic|Darija|Urdu/.test(S.lang)?'rtl':'ltr');
  var key=S.lang+'|'+base;
  if(trCache[key]){ out.innerHTML=trCache[key]; return; }
  out.textContent='…';
  var url=PROXY+'?action=translate&mode='+(String(base||'').trim().split(/\s+/).length<=3?'word':'sentence')+'&idiom='+encodeURIComponent(base)+
    '&meaning='+encodeURIComponent('A common English verb in its base form, for a beginner student. Give the plain dictionary translation.')+
    '&lang='+encodeURIComponent(S.lang);
  rawFetch(url).then(function(r){return r.json()}).then(function(d){
    var html;
    if(d&&d.ok&&d.translation&&d.translation.equiv) html='<b><u>'+esc(d.translation.equiv)+'</u></b>';
    else html='<b><u style="color:var(--muted)">'+esc(base)+'</u></b>';
    if(d&&d.ok&&d.translation&&d.translation.meaning) html+=' <span style="color:var(--muted);font-size:14px">'+esc(d.translation.meaning)+'</span>';
    trCache[key]=html; out.innerHTML=html;
  }).catch(function(){ out.textContent='—'; });
}

/* ===================== scoring + saving ===================== */
function finish(mode, right, total, missed, keepScreen, extra){
  save(mode, right, total, missed, true, extra);
  var pct=total?Math.round(100*right/total):0;
  var msg=pct>=90?'Excellent!':pct>=70?'Good work!':'Practice again. You can do it.';
  var box=document.createElement('div');
  box.className='panel summary'; box.style.marginTop='14px';
  var h='<h2>'+msg+'</h2><div class="scorebig" id="drill_score">'+right+' / '+total+'</div>';
  if(missed.length) h+='<ul class="missed">'+missed.slice(0,14).map(function(m){return '<li><s>'+esc(m.given)+'</s> → '+esc(m.full)+'</li>'}).join('')+'</ul>';
  h+='<div class="nextrow" style="justify-content:center"><button class="btn soft" data-again="1">Try again</button>'+
     (nextMode()?'<button class="btn" data-mode="'+nextMode()+'">Next: '+modeTitle(nextMode())+'</button>':'')+'</div>';
  box.innerHTML=h;
  $('stage').appendChild(box);
  box.scrollIntoView({behavior:'smooth',block:'end'});
  window.GAL_SCORE=right; window.GAL_MAX=total;
}
function nextMode(){ for(var i=0;i<MODES.length-1;i++) if(MODES[i].k===S.mode) return MODES[i+1].k; return null; }
function modeTitle(k){ for(var i=0;i<MODES.length;i++) if(MODES[i].k===k) return MODES[i].t; return k; }
function headers(extra){
  var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function setDot(c){ var d=$('dot'); if(d) d.className=c||''; }
function save(mode, right, total, missed, done, extra){
  var key=S.set+'-'+mode, prev=S.scores[key]||{best:0,attempts:0};
  var rec = (right==null) ? prev : {best:Math.max(prev.best||0,right), total:total, correct:right, attempts:(prev.attempts||0)+1};
  if(right!=null){ S.scores[key]=rec; persist(); renderNav(); }
  setDot('saving');
  var detail={level:S.level, lang:S.lang, tense:tenseOf(), set:S.set, missed:(missed||[]).slice(0,20)};
  if(extra) for(var k in extra) detail[k]=extra[k];
  var row={email:S.email,name:S.name,period:S.period,activity:key,unit:S.set,
    correct:(right==null?prev.correct||0:right), total:(total==null?prev.total||0:total),
    best:rec.best||0, attempts:rec.attempts||1, turned_in:!!done, detail:detail,
    updated_at:new Date().toISOString()};
  rawFetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,activity',{
    method:'POST',headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(row)
  }).then(function(r){ if(r.ok) setDot('saved'); else { setDot('err'); r.text().then(function(t){console.warn('save failed',r.status,t)}); } })
   .catch(function(e){ setDot('err'); console.warn(e); });
}
function loadScores(){
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?email=eq.'+encodeURIComponent(S.email)+'&select=activity,best,total,correct,attempts',{headers:headers()})
    .then(function(r){ return r.ok?r.json():[] })
    .then(function(rows){ (rows||[]).forEach(function(r){ S.scores[r.activity]={best:r.best,total:r.total,correct:r.correct,attempts:r.attempts} }); })
    .catch(function(){});
}
var EMAIL_RE=/^[^@\s]+@(s\.)?sfusd\.edu$/;

function registerStudent(typed){

/* ===================== events ===================== */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('button'):null; if(!t) return;
  var d=function(k){return t.getAttribute('data-'+k)};
  if(d('say')) return speak(d('say'));
  if(d('setgo')){ S.set=d('setgo'); S.mode='grid'; persist(); history.replaceState(null,'','?set='+S.set); render(); return; }
  if(d('mode')) return go(d('mode'));
  if(d('again')) return render();
  if(d('chip')!=null){
    var f=document.querySelector('input.cell:not([disabled])[value=""], input.cell:not([disabled])');
    var empty=null;
    document.querySelectorAll('input.cell:not([disabled])').forEach(function(el){ if(!empty && !el.value.trim()) empty=el; });
    var target=empty||f; if(target){ target.value=d('chip'); target.focus(); t.classList.add('used'); }
    return;
  }
  if(d('gcheck')) return checkGrid();
  if(d('ncheck')) return checkNeg();
  if(d('tcheck')) return checkTable();
  if(d('trv')) return translateVerb(d('trv'), +d('i'));
  if(d('neg')!=null) return answerNegTap(+d('neg'), d('val'));
  if(d('opt')!=null && Q && !Q.answered) return answerChoose(d('opt'));
  if(d('next')){
    if(Q.i+1>=Q.items.length){ return finish('choose',Q.right,Q.items.length,Q.missed,true); }
    Q.i++; Q.answered=false; drawChoose(); return;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(Q && Q.answered){ var n=$('btnNext'); if(n){ e.preventDefault(); n.click(); } return; }
  var el=document.activeElement;
  if(el && el.classList && el.classList.contains('cell')){
    e.preventDefault();
    var list=Array.prototype.filter.call(document.querySelectorAll('input.cell'),function(x){return !x.disabled});
    var i=list.indexOf(el);
    if(i>-1 && i<list.length-1) list[i+1].focus();
    else{ var b=document.querySelector('[data-gcheck],[data-ncheck],[data-tcheck]'); if(b) b.click(); }
  }
});

  function tr(text,lang){
    var key=lang+'|'+text;
    if(dcache[key]) return Promise.resolve(dcache[key]);
    var url=PROXY+'?action=translate&mode='+(String(text||'').trim().split(/\s+/).length<=3?'word':'sentence')+'&idiom='+encodeURIComponent(text)+
      '&meaning='+encodeURIComponent('Directions for a beginner English student. Translate plainly and simply.')+'&lang='+encodeURIComponent(lang);
    return rawFetch(url).then(function(r){return r.json()}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      var t=d.translation.equiv||d.translation.meaning||''; if(t) dcache[key]=t; return t||null;
    }).catch(function(){return null});
  }
  function logReveal(k,lang){
    if(!S.email) return;
    var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    rawFetch(SUPA_URL+'/rest/v1/instruction_reveals',{method:'POST',headers:hd('return=minimal'),
      body:JSON.stringify([{email:S.email,set_slug:PAGE_SLUG,activity:k,lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=S.lang, list=document.querySelectorAll('#stage .lede');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!p.getAttribute('data-en')){
        var en=(p.textContent||'').replace(out?out.textContent:'','').trim();
        p.setAttribute('data-en',en); p.setAttribute('translate','yes');
        p.setAttribute('data-dir',S.set+'-'+S.mode);
      }
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang||lang==='none'){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||'';
      if(!en) return;
      out.setAttribute('dir',RTL.test(lang)?'rtl':'ltr');
      out.textContent='…';
      tr(en,lang).then(function(t){ out.textContent=t||''; if(t) logReveal(k,lang); });
    });
  }
  var dirBtn=document.getElementById('btn-dir');
  dirBtn.classList.toggle('on',DIR_ON);
  dirBtn.addEventListener('click',function(){
    DIR_ON=!DIR_ON; try{ localStorage.setItem('verbs_dir',DIR_ON?'1':'0'); }catch(e){}
    dirBtn.classList.toggle('on',DIR_ON); showDirections();
  });
  var langSel=document.getElementById('langSel');
  if(langSel) langSel.addEventListener('change',function(){ setTimeout(showDirections,50); });
  var pend=null;
  new MutationObserver(function(){ if(pend) return; pend=setTimeout(function(){ pend=null; showDirections(); },120); })
    .observe(document.getElementById('stage'),{childList:true});

  var EXPECT=(dirBtn.textContent||'').trim(), TR_SENT='';
  function detectTranslation(){
    var got=(dirBtn.textContent||'').trim(), observed=(got&&got!==EXPECT)?got:'';
    var cls=document.documentElement.className||'';
    if(!observed&&!/translated/.test(cls)) return null;
    return {observed:observed,html_lang:document.documentElement.lang||'',html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation(); if(!d||!S.email) return;
    var sig=d.observed+'|'+d.html_lang; if(sig===TR_SENT) return; TR_SENT=sig;
    rawFetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{
      method:'POST',headers:hd('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:S.email,set_slug:PAGE_SLUG,translated:true,observed:d.observed,
        html_lang:d.html_lang,html_class:d.html_class,updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation,20000); setTimeout(checkTranslation,4000);
})();
</script>
<script src="/readings/track.js"></script>
</body>
</html>
