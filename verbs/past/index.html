<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Past tense: was, -ed, went, didn't — Mr. Toby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2640; --muted:#5b6784; --bg:#eef2f8; --card:#ffffff; --line:#d3dbe9;
  --i:#7a3f8f;  --i-t:#f4e9f8;           /* I -> am */
  --s3:#a86400; --s3-b:#f0a52a; --s3-t:#fff0d6;  /* he / she / it -> is, has, -s */
  --pl:#2c5bc4; --pl-t:#e3ebfd;           /* you / we / they -> are, have, base verb */
  --ok:#1d7f53; --ok-t:#dff3e8; --no:#b93a2e; --no-t:#fbe5e1;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e8ecf5; --muted:#a3adc4; --bg:#141a28; --card:#1e2638; --line:#34405a;
    --i:#d7a6ea; --i-t:#3a2944; --s3:#ffc56a; --s3-b:#f0a52a; --s3-t:#3d2f17;
    --pl:#9dbaff; --pl-t:#20305a; --ok:#6fd6a3; --ok-t:#173a2b; --no:#ff9a8f; --no-t:#44211d;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 Lexend,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pl);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{max-width:440px;margin:6vh auto;background:var(--card);border-radius:20px;padding:28px 26px;border:1px solid var(--line)}
#login h1{font-size:34px;line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.5px}
#login h1 .a{color:var(--i)} #login h1 .b{color:var(--s3)} #login h1 .c{color:var(--pl)}
#login p{margin:0 0 18px;color:var(--muted)}
#login label{display:block;font-weight:500;margin:14px 0 5px}
#login input,#login select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
#login .err{color:var(--no);font-size:15px;min-height:22px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%;margin-top:18px;font-size:19px}

/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.brand{font-weight:800;font-size:22px;letter-spacing:-.3px}
.who{color:var(--muted);font-size:15px}
.spacer{flex:1}
.bar select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);font-size:15px}
#dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
#dot.saving{background:var(--s3-b)} #dot.saved{background:var(--ok)} #dot.err{background:var(--no)}

/* ---------- unit + activity nav ---------- */
#units{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0 12px}
.unit{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;line-height:1.2}
.unit .n{font-weight:800;font-size:13px;color:var(--muted)}
.unit .t{display:block;font-weight:700;font-size:16px;margin:2px 0}
.unit .p{font-size:12.5px;color:var(--muted)}
.unit.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.unit.on .n,.unit.on .p{color:inherit;opacity:.8}
@media (max-width:760px){#units{grid-template-columns:repeat(3,1fr)}}
#acts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:16px;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:3px}
.grp small{font-size:12.5px;color:var(--muted);padding-left:2px}
.grp div{display:flex;gap:5px;flex-wrap:wrap}
.act{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;font-size:15px;white-space:nowrap}
.act.on{background:var(--pl);border-color:var(--pl);color:var(--card)}
.act .ck{color:var(--ok);font-weight:800;margin-left:4px}
.act.on .ck{color:var(--card)}

/* ---------- stage ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 4px;font-size:28px;line-height:1.15;letter-spacing:-.3px}
.lede{color:var(--muted);margin:0 0 16px;max-width:62ch}
.tr{cursor:pointer;border-bottom:1.5px dotted var(--muted)}
.i-c{color:var(--i)} .s3-c{color:var(--s3)} .pl-c{color:var(--pl)}
.end{color:var(--s3);background:var(--s3-t);border-radius:4px;padding:0 2px;font-weight:800}

/* conjugation chart: the page's main device */
.chart{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 18px}
.chart.two{grid-template-columns:1fr 1fr}
.fam{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fam .lab{font-size:14px;font-weight:500}
.fam-i{background:var(--i-t);color:var(--i)} .fam-s3{background:var(--s3-t);color:var(--s3)} .fam-pl{background:var(--pl-t);color:var(--pl)}
.pair{border:0;background:var(--card);color:var(--ink);border-radius:11px;padding:9px 12px;font-size:24px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.pair b{font-weight:800}
.fam-i .pair b{color:var(--i)} .fam-s3 .pair b{color:var(--s3)} .fam-pl .pair b{color:var(--pl)}
.pair .spk{font-size:16px;opacity:.5}
@media (max-width:640px){.chart,.chart.two{grid-template-columns:1fr}}

.rules{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
.rules li{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:19px}
.rules li .x{color:var(--muted);font-size:15px}

.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ex{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;text-align:center}
.ex .sent{font-size:18px}
.tbl{border-collapse:collapse;margin:6px 0 18px;font-size:20px}
.tbl td{padding:6px 16px;border-bottom:1px solid var(--line)}
.tbl td:first-child{color:var(--muted)}
.note{border-left:4px solid var(--s3-b);background:var(--s3-t);border-radius:0 12px 12px 0;padding:10px 14px;margin:0 0 16px}
.note.wrong{border-color:var(--no);background:var(--no-t)}
h3{margin:18px 0 8px;font-size:20px}

/* picture scene: person + the thing they have, overlapping at the hand */
.scene{display:inline-flex;align-items:flex-end;font-size:84px;line-height:1;min-height:92px}
.scene .obj{font-size:.56em;margin-left:-.28em;margin-bottom:.06em;filter:drop-shadow(0 2px 1px rgba(0,0,0,.15))}
.scene.sm{font-size:50px;min-height:56px}

/* question card */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:15px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--no)} .dots i.cur{background:var(--ink)}
.q{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
@media (max-width:640px){.q{grid-template-columns:1fr;justify-items:center;text-align:center}}
.qpic{display:flex;justify-content:center}
.sentence{font-size:32px;line-height:1.35;font-weight:500}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--ink);text-align:center;color:var(--muted)}
.fill{font-weight:800;padding:0 4px;border-radius:6px}
.base{font-size:20px;color:var(--muted);font-weight:400;white-space:nowrap}
.tools{display:flex;gap:6px;margin-top:8px}
.tool{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:3px 10px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.opt{min-width:110px;font-size:24px;font-weight:700;padding:12px 20px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok-t);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.no{background:var(--no-t);border-color:var(--no);color:var(--no);box-shadow:0 4px 0 var(--no)}
.opt[disabled]{cursor:default}
.writebox{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.writebox input{font-size:26px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;width:220px;background:var(--bg)}
.bank{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{border:1.5px dashed var(--muted);border-radius:10px;padding:4px 12px;background:transparent;font-size:18px}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;font-size:18px}
.fb.ok{background:var(--ok-t);color:var(--ok)} .fb.no{background:var(--no-t);color:var(--no)}
.fb .full{display:block;color:var(--ink);font-size:22px;margin-top:4px}
.nextrow{margin-top:14px;display:flex;gap:10px}
.keystrip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;font-size:15px}
.keystrip span{border-radius:8px;padding:3px 10px}
.keystrip .k-i{background:var(--i-t);color:var(--i)} .keystrip .k-s3{background:var(--s3-t);color:var(--s3)} .keystrip .k-pl{background:var(--pl-t);color:var(--pl)}

/* build */
.line{min-height:62px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tok{font-size:22px;padding:8px 14px;border-radius:11px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line)}
.tok.used{visibility:hidden}

/* flashcards */
.flip{margin:10px auto;max-width:440px;min-height:250px;border-radius:20px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;width:100%;text-align:center}
.flip .big{font-size:40px;font-weight:700;line-height:1.2}
.flip .hint{font-size:14px;color:var(--muted)}
.flip.back{background:var(--card);border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.flip.turn{animation:turn .28s ease}}
@keyframes turn{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* match + sort */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col{display:flex;flex-direction:column;gap:8px}
.mt{font-size:21px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:center;box-shadow:0 3px 0 var(--line)}
.mt.sel{border-color:var(--pl);background:var(--pl-t)}
.mt.done{visibility:hidden}
.mt.shake,.bin.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;min-height:50px}
.bins{display:grid;gap:10px}
.bin{border:2px solid var(--line);border-radius:16px;padding:10px;min-height:120px;background:var(--bg);text-align:left}
.bin .bh{font-size:22px;font-weight:800;display:block;margin-bottom:6px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin .in span{background:var(--card);border-radius:8px;padding:2px 9px;font-size:16px}

.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.summary{text-align:center;padding:10px 0}
.summary .scorebig{font-size:54px;font-weight:800;margin:4px 0}
.missed{text-align:left;max-width:520px;margin:12px auto;padding:0;list-style:none}
.missed li{background:var(--no-t);border-radius:10px;padding:7px 12px;margin-bottom:6px}
.missed li s{color:var(--no)}

#pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,92vw);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#pop .src{color:var(--muted);font-size:14px}
#pop .dst{font-size:22px;margin:4px 0}
#pop .mean{font-size:15px;color:var(--muted)}
#pop button{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:26px}
@media print{.bar,#units,#acts,footer{display:none}.panel{border:0}}
/* ---------- past-tense additions ---------- */
:root{ --pa:#0f7b74; --pa-t:#dcf3f1; }
@media (prefers-color-scheme: dark){ :root{ --pa:#6fd6cc; --pa-t:#173a38; } }
.pa-c{color:var(--pa)}
.fam-pa{background:var(--pa-t);color:var(--pa)} .fam-pa .pair b{color:var(--pa)}
.keystrip .k-pa{background:var(--pa-t);color:var(--pa)}
#login h1 .a{color:var(--s3)} #login h1 .b{color:var(--pa)} #login h1 .c{color:var(--pl)}
.allverbs{color:var(--muted);text-decoration:none;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:5px 10px}
.dir-tr{display:block;color:var(--muted);font-size:.9em;margin-top:2px}
.opt{font-size:22px}
@media (max-width:640px){ .bins{grid-template-columns:1fr 1fr!important} .opt{font-size:19px;min-width:0} }
.bin .bh{font-size:19px}
.tbl .pv{font-weight:800;color:var(--pa)}
.patgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:8px 0 18px}
.patbox{background:var(--bg);border-radius:14px;padding:10px 14px}
.patbox h4{margin:0 0 4px;font-size:17px}
.patbox .tbl{font-size:19px;margin:0}
.patbox .tbl td{padding:4px 10px}
.snd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 18px}
@media (max-width:640px){.snd{grid-template-columns:1fr}}
.snd div{background:var(--bg);border-radius:14px;padding:10px 12px}
.snd b{display:block;font-size:20px;margin-bottom:4px}
/* story */
.story{font-size:21px;line-height:2.25;max-width:70ch}
.story input{font:inherit;font-size:19px;border:0;border-bottom:2.5px solid var(--ink);background:var(--bg);padding:0 6px;border-radius:6px 6px 0 0;text-align:center;color:var(--ink)}
.story input.ok{background:var(--ok-t);color:var(--ok);border-color:var(--ok)}
.story input.no{background:var(--no-t);color:var(--no);border-color:var(--no)}
.story .h{color:var(--muted);font-size:16px;white-space:nowrap}
.story .fix{color:var(--ok);font-weight:700;font-size:16px;margin-left:3px}
.yourturn{margin-top:22px;border-top:1.5px solid var(--line);padding-top:14px}
.yourturn textarea{width:100%;min-height:170px;font:inherit;font-size:18px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.found{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.found span{background:var(--pa-t);color:var(--pa);border-radius:8px;padding:2px 10px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= LOGIN ================= -->
<section id="login">
  <h1><span class="a">was</span> <span class="b">walked</span> <span class="c">went</span></h1>
  <p>Practice the past tense: was and were, -ed verbs, irregular verbs, and did.</p>
  <label for="inName">Your name</label>
  <input id="inName" autocomplete="name" placeholder="First and last name">
  <label for="inEmail">School email</label>
  <input id="inEmail" type="email" autocomplete="email" placeholder="name@s.sfusd.edu">
  <label for="inPeriod">Class period</label>
  <select id="inPeriod">
    <option value="">Choose…</option>
    <option>Period 1</option><option>Period 2</option><option>Period 3</option>
    <option>Period 4</option><option>Period 5</option><option>Period 6</option><option>Period 7</option>
  </select>
  <label for="inLang">Your language</label>
  <select id="inLang"></select>
  <div class="err" id="loginErr"></div>
  <button class="btn wide" id="btnStart">Start</button>
</section>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="bar">
    <a class="allverbs" href="../">All verbs</a>
    <span class="brand">Past tense</span>
    <span id="dot" title="Saving status"></span>
    <span class="who" id="whoLbl"></span>
    <span class="spacer"></span>
    <select id="levelSel" aria-label="Level">
      <option value="easy">Easier</option>
      <option value="std">Standard</option>
      <option value="chal">Challenge</option>
    </select>
    <select id="langSel" aria-label="Language"></select>
  </header>
  <nav id="units"></nav>
  <nav id="acts"></nav>
  <main id="stage"></main>
  <footer>Mr. Toby</footer>
</div>

</div>
<div id="pop" class="hidden"></div>

};

];

/* =========================================================
   REGULAR -ED
   ========================================================= */
var DBL = {stop:1, plan:1, shop:1, drop:1, jog:1, hug:1, chat:1, hop:1, skip:1};
function edRule(v){
  if(DBL[v]) return 'dbl';
  if(/e$/.test(v)) return 'd';
  if(/[^aeiou]y$/.test(v)) return 'ied';
  return 'ed';
}
function regPast(v){
  var r = edRule(v);
  if(r==='dbl') return v+v.slice(-1)+'ed';

  if(r==='ied') return v.slice(0,-1)+'ied';

}

function pickSubj(pr){

  var key = pick(pr.f);
  var s = {t:SUBJ[key].t, g:SUBJ[key].g, emo:pick(SUBJ[key].emo), key:key};
  if(S.level==='chal' && Math.random()<.4){
    var ns = NOUNS.filter(function(n){ return pr.f.indexOf(n.like)>-1; });
    if(ns.length){ var n=pick(ns); s={t:n.t, g:SUBJ[n.like].g, emo:n.emo, key:n.like, like:n.like}; }
  }
  return s;
}
function finish(it){
  it.full = (it.pre ? it.pre+' ' : '') + it.ans + ' ' + it.post;
  return it;
}
function genWas(){
  var pr = pick(WASB), s = pickSubj(pr), tm = pick(pr.tm||TIMES);
  var neg = S.level!=='easy' && Math.random() < (S.level==='chal' ? .4 : .3);
  var w = s.g==='pl' ? 'were' : 'was';
  var ans = neg ? (w==='was' ? "wasn't" : "weren't") : w;
  var pres = s.key==='I' ? 'am' : s.g==='pl' ? 'are' : 'is';
  var like = s.like ? ' '+s.t+' = '+s.like+'.' : '';
  var why = (w==='was' ? 'I, he, she, it → was.' : 'You, we, they → were.') + like + (neg ? ' '+w+' + not = '+ans+'.' : '');
  return finish({kind:'was', fam:(w==='was'?'s3':'pl'), emo:s.emo, obj:pr.p, pre:s.t, ans:ans, post:pr.r+' '+tm+'.',
    hint:(neg?'(not)':''), pool:(neg ? ["wasn't","weren't","didn't"] : ['was','were',pres]), alts:(neg?[w+' not']:[]),
    why:why, v:'be', past:w});
}
function verbWhy(pr){
  var v=pr.v, a=pr.past;
  if(!pr.reg){
    if(v===a) return v+' is irregular: it does not change. '+v+' → '+a+'.'+(v==='read'?' Say it like "red".':'');
    return v+' is irregular: '+v+' → '+a+'. No -ed.';
  }
  var r = edRule(v);
  if(r==='d') return v+' ends in e → add -d: '+a+'.';
  if(r==='ied') return v+' ends in consonant + y → change y to i, add -ed: '+a+'.';
  if(r==='dbl') return v+': one vowel + one consonant at the end → double it, add -ed: '+a+'.';
  return v+' + -ed → '+a+'.';
}
function genVerb(list){
  var pr = pick(list), s = pickSubj(pr), tm = pick(pr.tm||TIMES), v = pr.v, a = pr.past;
  var pool = pr.reg ? [a, v, edWrong(v)] : [a, v, regPast(v)];
  if(S.level==='chal') pool.push(addS(v));
  pool = uniq(pool);
  if(pool.length<3) pool.push(addS(v));
  var why = verbWhy(pr) + (S.level==='easy' ? ' Same for every person.' : '');
  return finish({kind:(pr.reg?'ed':'irr'), emo:s.emo, obj:pr.p, pre:s.t, ans:a, post:pr.r+' '+tm+'.',
    hint:'('+v+')', pool:uniq(pool), alts:[], why:why, v:v, past:a});
}
function genDid(){
  var list = irrList().concat(ED);
  var pr = pick(list), s = pickSubj(pr), tm = pick(pr.tm||TIMES), v = pr.v, a = pr.past;
  var diff = a!==v;
  if(Math.random()<.5){
    return finish({kind:'neg', emo:s.emo, obj:pr.p, pre:s.t, ans:"didn't "+v, post:pr.r+' '+tm+'.', hint:'(not '+v+')',
      pool:uniq(["didn't "+v, "didn't "+a, "not "+a, "don't "+v]), alts:['did not '+v],
      why:"After didn't, use the base verb: didn't "+v+'.'+(diff?" Not didn't "+a+'.':''), v:v, past:a});
  }
  var sub = lowerSubj(s.t);
  var doW = s.g==='s3' ? 'Does' : 'Do', beW = s.g==='pl' ? 'Were' : 'Was';
  return finish({kind:'q', emo:s.emo, obj:pr.p, pre:'', ans:'Did '+sub+' '+v, post:pr.r+' '+tm+'?', hint:'('+sub+', '+v+')',
    pool:uniq(['Did '+sub+' '+v, 'Did '+sub+' '+a, doW+' '+sub+' '+v, beW+' '+sub+' '+a]), alts:[],
    why:'Question: Did + person + base verb. Did '+sub+' '+v+'?'+(diff?' Not '+a+'.':''), v:v, past:a});
}
function genMix(){
  var r = Math.random();

  if(r<.45) return genVerb(ED);

}
function genItem(){
  var u = S.unit;

function genItems(n){
  var out=[], seen={}, guard=0;

    seen[it.full]=1; out.push(it);

}

function verbTable(list){
  return '<table class="tbl" translate="no">'+list.map(function(p){
    return '<tr><td>'+esc(p.v)+'</td><td class="pv">'+(p.reg?markPast(p.v,p.past):esc(p.past))+'</td><td><button class="tool" data-say="'+esc(p.v+', '+p.past)+'">🔊</button></td></tr>';
  }).join('')+'</table>';
}
function dedupe(list){ var seen={}; return list.filter(function(p){ if(seen[p.v]) return false; seen[p.v]=1; return true; }); }
function patternBoxes(list){
  var h='<div class="patgrid">';
  PATS.forEach(function(pt){
    var vs = dedupe(list.filter(function(p){ return p.pat===pt[0]; }));
    if(!vs.length) return;
    h += '<div class="patbox"><h4>'+esc(pt[1])+'</h4>'+verbTable(vs)+'</div>';
  });
  return h+'</div>';
}

/* =========================================================
   QUIZ ENGINE: choose, write, rw, build, speed
   ========================================================= */
var Q = null, timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
var TITLES = {
  choose:['Choose the verb','Read the sentence. Tap the right past tense verb.'],
  write:['Write the verb','Read the sentence. Type the missing words.'],
  rw:['Right or wrong?','Read the sentence. Is the verb right?'],
  build:['Build the sentence','Tap the words in order. One word is extra.'],
  speed:['Speed round','Answer as many as you can in 60 seconds.']
};
function startQuiz(mode){
  var n = mode==='speed' ? 80 : nItems();
  Q = {mode:mode, items:genItems(n), i:0, right:0, done:false, answered:false, marks:[], missed:[], left:60, total:0};
  if(mode==='rw') Q.items.forEach(function(it){
    it.shown = Math.random()<.5 ? it.ans : pick(it.pool.filter(function(x){ return x!==it.ans; }));
  });
  if(mode==='build') Q.items.forEach(prepBuild);
  renderQ();
}
function prepBuild(it){
  var words = it.full.split(' ');
  var low = words.map(function(w){ return norm(w); });
  var extra = null;
  shuffle(it.pool.filter(function(x){ return x!==it.ans; })).some(function(opt){
    return opt.split(' ').some(function(w){
      if(low.indexOf(norm(w))<0){ extra = w; return true; }
      return false;
    });
  });
  it.target = it.full;
  it.tokens = shuffle(words.concat(extra ? [extra] : []));
  it.placed = [];
}
function renderQ(){
  var it = Q.items[Q.i], m=Q.mode, h='<div class="panel">';
  h += '<h2>'+TITLES[m][0]+'</h2>'+lede(TITLES[m][1])+keyStrip();
  if(m==='speed'){
    h += '<div class="qhead"><span class="timer" id="timer">'+Q.left+'</span><span>Correct: <b>'+Q.right+'</b></span></div>';
  } else {
    h += '<div class="qhead"><span>'+(Q.i+1)+' of '+Q.items.length+'</span><span class="dots">'+
      Q.items.map(function(_,k){ return '<i class="'+(Q.marks[k]===true?'ok':Q.marks[k]===false?'no':k===Q.i?'cur':'')+'"></i>'; }).join('')+'</span></div>';
  }
  h += '<div class="q" translate="no"><div class="qpic">'+scene(it)+'</div><div>';
  if(m==='rw') h += '<div class="sentence">'+sentenceHTML(it, it.shown)+'</div>';
  else if(m==='build') h += '<div class="sentence base">'+(it.hint ? 'Verb: '+esc(it.hint.replace(/[()]/g,'')) : '&nbsp;')+'</div>';
  else h += '<div class="sentence">'+sentenceHTML(it)+'</div>';
  h += '</div></div>';

  if(m==='choose' || m==='speed'){
    var ops = options(it, m==='speed' ? (S.level==='chal'?3:2) : 0);
    h += '<div class="opts" translate="no">'+ops.map(function(o){ return '<button class="opt" data-opt="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'</div>';
  } else if(m==='write'){
    var wide = it.ans.length>8 ? ' style="width:300px"' : '';
    h += '<div class="writebox" translate="no"><input id="wIn"'+wide+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn" data-check="1">Check</button></div>';
    if(S.level==='easy') h += '<div class="bank" translate="no">'+options(it).map(function(o){ return '<button class="chip" data-chip="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'</div>';
  } else if(m==='rw'){
    h += '<div class="opts"><button class="opt" data-rw="1">✓ Right</button><button class="opt" data-rw="0">✗ Wrong</button></div>';
  } else if(m==='build'){
    h += '<div class="line" id="bLine" translate="no">'+it.placed.map(function(ti,pos){ return '<button class="tok" data-unplace="'+pos+'">'+esc(it.tokens[ti])+'</button>'; }).join('')+'</div>'+
      '<div class="pool" translate="no">'+it.tokens.map(function(tk,ti){ return '<button class="tok'+(it.placed.indexOf(ti)>-1?' used':'')+'" data-place="'+ti+'">'+esc(tk)+'</button>'; }).join('')+'</div>'+
      '<div class="nextrow"><button class="btn" data-check="1">Check</button></div>';
  }
  h += '<div id="fbox"></div></div>';
  $('stage').innerHTML = h;
  fillDirs();
  var w=$('wIn'); if(w) w.focus();
}
function accepted(it, val){
  var v = norm(val);
  return [it.ans].concat(it.alts||[]).some(function(a){ return norm(a)===v; });
}
function answer(ok, given){
  if(Q.answered) return;
  Q.answered = true;
  var it = Q.items[Q.i];
  Q.marks[Q.i] = ok;
  if(ok) Q.right++; else Q.missed.push({full:it.full, given:given});
  if(Q.mode==='speed'){
    Q.total = (Q.total||0)+1;
    var b = document.querySelector('[data-opt="'+cssEsc(given)+'"]');
    if(b) b.classList.add(ok?'ok':'no');
    var c = document.querySelector('[data-opt="'+cssEsc(it.ans)+'"]'); if(c && !ok) c.classList.add('ok');
    var myQ = Q;
    setTimeout(function(){ if(Q!==myQ || Q.done) return; Q.i++; if(Q.i>=Q.items.length) Q.items=Q.items.concat(genItems(40)); Q.answered=false; renderQ(); }, ok?250:1000);
    return;
  }
  document.querySelectorAll('.opt').forEach(function(b){
    b.disabled = true;
    var val = b.getAttribute('data-opt');
    if(val===it.ans) b.classList.add('ok');
    else if(val===given) b.classList.add('no');
  });
  var wi=$('wIn'); if(wi) wi.disabled=true;
  document.querySelectorAll('[data-place],[data-unplace],[data-rw],[data-chip]').forEach(function(b){ b.disabled=true; });
  var fb = '<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Yes!':'Not quite.')+'</b> '+esc(it.why)+
    '<span class="full" translate="no">'+fullColored(it)+'</span>'+tools(it.full)+'</div>'+
    '<div class="nextrow"><button class="btn" id="btnNext" data-next="1">'+(Q.i+1<Q.items.length?'Next':'See my score')+'</button></div>';
  $('fbox').innerHTML = fb;
  speak(it.full);
  var nb=$('btnNext'); if(nb) nb.focus();
}
function cssEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"'); }
function nextQ(){
  if(Q.i+1 >= Q.items.length) return finishQuiz();
  Q.i++; Q.answered=false; renderQ();
}
function finishQuiz(){
  stopTimer();
  Q.done = true;
  var total = Q.mode==='speed' ? (Q.total||0) : Q.items.length;
  showSummary(Q.mode, Q.right, total, Q.missed);
}
function speedIntro(){
  var best = bestFor(S.unit,'speed');
  $('stage').innerHTML = '<div class="panel summary"><h2>Speed round</h2>'+lede('60 seconds. Tap fast. Wrong answers show the right word.','margin:8px auto')+
    (best?'<p>Your best: <b>'+best.best+'</b> correct</p>':'')+
    '<button class="btn" data-speedgo="1" style="font-size:22px;margin-top:10px">Start 60 seconds</button></div>';
  fillDirs();
}
function speedStart(){
  startQuiz('speed');
  timerId = setInterval(function(){
    Q.left--;
    var t=$('timer'); if(t) t.textContent = Q.left;
    if(Q.left<=0 && !Q.done) finishQuiz();
  }, 1000);
}

/* =========================================================
   FLASHCARDS
   ========================================================= */
var F = null;
function verbPool(){
  var u=S.unit;
  if(u==='ed') return dedupe(ED);
  if(u==='irr1') return dedupe(IRR1);
  if(u==='irr2') return dedupe(IRR2);
  return dedupe(ED.concat(irrList()));
}
function flashCount(){ return S.level==='easy' ? 8 : S.level==='chal' ? 12 : 10; }
function startFlash(){
  var u=S.unit, cards=[];
  if(u==='was'){
    ['I','you','he','she','it','we','they'].forEach(function(k){
      var w = SUBJ[k].g==='pl' ? 'were' : 'was';
      cards.push({front:'<div class="scene sm">'+SUBJ[k].emo[0]+'</div><div class="big">'+esc(k)+' + be</div><div class="hint">yesterday</div>',
        back:'<div class="big"><span class="'+(w==='was'?'s3':'pl')+'-c">'+esc(SUBJ[k].t)+' '+w+'</span></div>', say:SUBJ[k].t+' '+w});
    });
  } else if(u==='did'){
    shuffle(dedupe(irrList()).filter(function(p){ return p.past!==p.v && p.f!==IT; })).slice(0,flashCount()).forEach(function(pr){
      var it = genVerb([pr]);
      var neg = it.pre+" didn't "+it.v+' '+it.post;
      cards.push({front:scene(it,true)+'<div class="big" style="font-size:30px">'+fullColored(it)+'</div><div class="hint">Make it negative</div>',
        back:scene(it,true)+'<div class="big" style="font-size:30px">'+esc(it.pre)+' <b class="s3-c">didn\'t '+esc(it.v)+'</b> '+esc(it.post)+'</div>', say:neg});
    });
  } else {
    shuffle(verbPool()).slice(0,flashCount()).forEach(function(pr){
      var it = genVerb([pr]);
      cards.push({front:'<div class="big">'+esc(pr.v)+'</div><div class="hint">yesterday → ?</div>',
        back:'<div class="big">'+esc(pr.v)+' → <b class="pa-c">'+(pr.reg?markPast(pr.v,pr.past):esc(pr.past))+'</b></div>'+scene(it,true)+'<div class="sent">'+fullColored(it)+'</div>',
        say:pr.v+', '+pr.past+'. '+it.full});
    });
  }
  F = {queue:shuffle(cards), total:cards.length, firstTry:0, seen:{}, flipped:false};
  renderFlash();
}
function renderFlash(){
  if(!F.queue.length) return showSummary('flash', F.firstTry, F.total, []);
  var c = F.queue[0];
  $('stage').innerHTML = '<div class="panel"><h2>Flashcards</h2>'+lede('Say the answer out loud. Then tap the card to check.')+
    '<div class="qhead"><span>'+(F.total-F.queue.length)+' of '+F.total+' learned</span></div>'+
    '<button class="flip'+(F.flipped?' back turn':'')+'" data-flip="1" translate="no">'+(F.flipped?c.back:c.front)+'<span class="hint">'+(F.flipped?'':'Tap to turn over')+'</span></button>'+
    (F.flipped?'<div class="nextrow" style="justify-content:center"><button class="btn soft" data-fl="again">Practice again</button><button class="btn" data-fl="got">I knew it</button></div>':'')+
    '</div>';
  fillDirs();
}

/* =========================================================
   MATCH
   ========================================================= */
var M = null;
function startMatch(){
  var u=S.unit, pairs=[];
  if(u==='was'){
    ['I','you','he','she','it','we','they'].forEach(function(k){ pairs.push({l:k, r:(SUBJ[k].g==='pl'?'were':'was')}); });
  } else if(u==='did'){
    shuffle(dedupe(irrList()).filter(function(p){ return p.past!==p.v; })).slice(0,7).forEach(function(p){ pairs.push({l:'I '+p.past, r:"I didn't "+p.v}); });
  } else {
    shuffle(verbPool()).slice(0,7).forEach(function(p){ pairs.push({l:p.v, r:p.past}); });
  }
  M = {pairs:pairs, left:shuffle(pairs.map(function(p,i){ return i; })), right:shuffle(pairs.map(function(p,i){ return i; })),
       doneL:{}, doneR:{}, sel:null, errors:0, matched:0};
  renderMatch();
}
function renderMatch(){
  var ld = S.unit==='did' ? 'Tap a sentence on the left, then the same sentence with didn\'t.' : S.unit==='was' ? 'Tap a word on the left, then its past verb on the right.' : 'Tap a verb on the left, then its past form on the right.';
  var h = '<div class="panel"><h2>Match</h2>'+lede(ld)+keyStrip()+'<div class="cols" translate="no"><div class="col">';
  M.left.forEach(function(i){
    h += '<button class="mt'+(M.doneL[i]?' done':'')+(M.sel===i?' sel':'')+'" data-ml="'+i+'">'+esc(M.pairs[i].l)+'</button>';
  });
  h += '</div><div class="col">';
  M.right.forEach(function(i){
    h += '<button class="mt'+(M.doneR[i]?' done':'')+'" data-mr="'+i+'">'+esc(M.pairs[i].r)+'</button>';
  });
  h += '</div></div><p class="qhead" style="margin-top:12px">Mistakes: '+M.errors+'</p></div>';
  $('stage').innerHTML = h;
  fillDirs();
}

/* =========================================================
   SORT
   ========================================================= */
var SO = null;
function startSort(){
  var u=S.unit, bins, tiles=[], lede_='Tap a word, then tap the box where it goes.';
  if(u==='was'){
    bins=['was','were'];
    var subs = ['I','you','he','she','it','we','they'].map(function(k){ return {t:SUBJ[k].t, g:SUBJ[k].g}; })
      .concat(shuffle(NOUNS).slice(0,5).map(function(n){ return {t:n.t, g:SUBJ[n.like].g}; }));
    subs.forEach(function(s){ tiles.push({t:s.t, b:(s.g==='pl'?'were':'was')}); });
  } else if(u==='ed'){
    var vs = dedupe(ED).filter(function(p){ return p.f!==IT; });
    if(S.level==='chal'){
      bins=['sounds like t','sounds like d','sounds like id'];
      lede_='Say each verb out loud. Tap it, then tap the sound at the end.';
      ['t','d','id'].forEach(function(snd, bi){
        shuffle(vs.filter(function(p){ return edSound(p.v)===snd; })).slice(0,4).forEach(function(p){ tiles.push({t:p.past, b:bins[bi]}); });
      });
    } else {
      bins=['+ ed','+ d','y → ied','double + ed'];
      lede_='Tap a verb, then tap its spelling rule.';
      ['ed','d','ied','dbl'].forEach(function(r, bi){
        shuffle(vs.filter(function(p){ return edRule(p.v)===r; })).slice(0,S.level==='easy'?2:3).forEach(function(p){ tiles.push({t:p.v, b:bins[bi]}); });
      });
    }
  } else if(u==='irr2'){
    bins=['-ought / -aught','-ew','o + e','no change'];
    lede_ = S.level==='easy' ? 'Tap a verb, then tap its pattern.' : 'Tap a verb. Think of the past. Then tap its pattern.';
    var sets = [['buy','think','bring','teach','catch','fight'],['know','fly','grow','throw','draw'],['write','speak','drive','ride','choose','break','wake','wear'],['put','cut','hit','read']];
    var all = dedupe(IRR1.concat(IRR2));
    sets.forEach(function(vs2, bi){
      shuffle(vs2).slice(0,3).forEach(function(v){
        var p = all.filter(function(x){ return x.v===v; })[0];
        tiles.push({t:(S.level==='easy' ? v+' → '+p.past : v), b:bins[bi]});
      });
    });
  } else if(u==='did'){
    bins=['✓ Right','✗ Wrong'];
    lede_='Tap a sentence. Is it right or wrong?';
    shuffle(dedupe(irrList()).filter(function(p){ return p.past!==p.v && p.f!==IT; })).slice(0,6).forEach(function(p, k){
      var sub = pick(['I','You','He','She','We','They']), sl = lowerSubj(sub);
      if(k%2===0){
        tiles.push({t:sub+" didn't "+p.v+'.', b:bins[0]});
        tiles.push({t:sub+" didn't "+p.past+'.', b:bins[1]});
      } else {
        tiles.push({t:'Did '+sl+' '+p.v+'?', b:bins[0]});
        tiles.push({t:'Did '+sl+' '+p.past+'?', b:bins[1]});
      }
    });
  } else {
    bins=['regular: -ed','irregular'];
    lede_='Tap a verb. Does the past use -ed, or is it irregular?';
    var reg = shuffle(dedupe(ED).filter(function(p){ return p.f!==IT; })).slice(0,7);
    var irr = shuffle(dedupe(u==='irr1' ? IRR1 : irrList())).slice(0,7);
    reg.forEach(function(p){ tiles.push({t:p.v, b:bins[0]}); });
    irr.forEach(function(p){ tiles.push({t:p.v, b:bins[1]}); });
  }
  SO = {bins:bins, tiles:shuffle(tiles).map(function(t,i){ t.id=i; return t; }), placed:{}, sel:null, errors:0, lede:lede_};
  renderSort();
}
function renderSort(){
  var left = SO.tiles.filter(function(t){ return !SO.placed[t.id]; });
  if(!left.length){
    var total = SO.tiles.length;
    return showSummary('sort', Math.max(0,total-SO.errors), total, []);
  }
  var h = '<div class="panel"><h2>Sort</h2>'+lede(SO.lede)+keyStrip()+'<div class="tiles" translate="no">';
  left.forEach(function(t){ h += '<button class="mt'+(SO.sel===t.id?' sel':'')+'" data-st="'+t.id+'">'+esc(t.t)+'</button>'; });
  h += '</div><div class="bins" translate="no" style="grid-template-columns:repeat('+SO.bins.length+',1fr)">';
  SO.bins.forEach(function(b,bi){
    var inside = SO.tiles.filter(function(t){ return SO.placed[t.id] && t.b===b; });
    h += '<button class="bin" data-bin="'+bi+'"><span class="bh">'+esc(b)+'</span><span class="in">'+inside.map(function(t){ return '<span>'+esc(t.t)+'</span>'; }).join('')+'</span></button>';
  });
  h += '</div><p class="qhead" style="margin-top:12px">Mistakes: '+SO.errors+'</p></div>';
  $('stage').innerHTML = h;
  fillDirs();
}

/* =========================================================
   STORY (Mix unit): read + fill the past tense, then write
   [base|answer] marks a blank
   ========================================================= */
var STORIES = {
  short: {title:'Lina\'s first day',
    text:'Last Monday, Lina [go|went] to her new school in San Francisco. She [be|was] nervous. She [take|took] the bus with her brother. At school, she [meet|met] her teacher, Mr. Toby. He [be|was] very friendly. In class, the students [play|played] a name game. Lina [not know|didn\'t know] many words, but she [try|tried] her best. At lunch, she [eat|ate] a sandwich and [talk|talked] to a new friend. After school, she [walk|walked] home. She [be|was] tired, but she [feel|felt] happy.',
    prompt:{easy:'Write 3 sentences about yesterday. What did you do?', std:'Write 5 sentences about last weekend. What did you do? Where did you go?'}},
  long: {title:'My first week',
    text:'Two years ago, my family [move|moved] to the United States. First, we [fly|flew] from Guatemala to Los Angeles. The flight [be|was] very long, and my little sister [cry|cried] for three hours. Then we [take|took] a bus to San Francisco. We [not have|didn\'t have] an apartment yet, so we [stay|stayed] with my uncle for two months. On my first day of school, I [not understand|didn\'t understand] the teacher at all. I [be|was] scared, and I [not say|didn\'t say] anything. After that, a girl from Mexico [sit|sat] next to me. She [help|helped] me with my schedule and [show|showed] me the cafeteria. Finally, at the end of the day, my mom [ask|asked] me, "[you, like|Did you like] your new school?" I [think|thought] for a moment and [say|said], "Yes, I did."',
    prompt:{chal:'Write a paragraph of 8 sentences or more about an important day in your life. Use First, Then, After that, and Finally. Use was and were, -ed verbs, irregular verbs, and didn\'t.'}}
};
var ST = null;
function parseStory(text){
  var parts=[], re=/\[([^|\]]+)\|([^\]]+)\]/g, last=0, m;
  while((m=re.exec(text))){
    if(m.index>last) parts.push({t:text.slice(last,m.index)});
    var a=m[2], alts=[];
    if(/^didn't /.test(a)) alts.push('did not '+a.slice(7));
    parts.push({h:m[1], a:a, alts:alts});
    last = re.lastIndex;
  }
  if(last<text.length) parts.push({t:text.slice(last)});
  return parts;
}
function startStory(){
  var st = S.level==='chal' ? STORIES.long : STORIES.short;
  ST = {st:st, parts:parseStory(st.text), checked:false, right:0, total:0, missed:[], lastFocus:null};
  renderStory();
}
function storyFull(){
  return ST.parts.map(function(p){ return p.t!=null ? p.t : p.a; }).join('');
}
function renderStory(){
  var h = '<div class="panel"><h2>'+esc(ST.st.title)+'</h2>'+lede('Read the story. Write each verb in the past tense.')+keyStrip();
  if(S.level==='easy'){
    var bank = shuffle(ST.parts.filter(function(p){ return p.a; }).map(function(p){ return p.a; }));
    h += '<div class="bank" translate="no">'+bank.map(function(w){ return '<button class="chip" data-sbank="'+esc(w)+'">'+esc(w)+'</button>'; }).join('')+'</div>'+lede('Tap a blank, then tap a word.');
  }
  h += '<div class="story" translate="no">';
  var bi=0;
  ST.parts.forEach(function(p){
    if(p.t!=null){ h += esc(p.t); return; }
    var w = / /.test(p.a) ? 13 : 8;
    h += '<input data-sb="'+bi+'" style="width:'+w+'ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Past tense of '+esc(p.h)+'"> <span class="h">('+esc(p.h)+')</span><span class="fix" id="fix'+bi+'"></span>';
    bi++;
  });
  h += '</div><div class="nextrow"><button class="btn" data-scheck="1">Check my story</button></div><div id="sres"></div>';
  var pr = ST.st.prompt[S.level] || ST.st.prompt.std;
  h += '<div class="yourturn"><h3>Your turn</h3>'+lede(pr)+
    '<textarea id="myWrite" translate="no" placeholder="Last Saturday, I…"></textarea>'+
    '<div class="nextrow"><button class="btn soft" data-wcheck="1">Check my verbs</button><button class="btn" data-wsave="1">Save my writing</button></div><div id="wres"></div></div>';
  h += '</div>';
  $('stage').innerHTML = h;
  fillDirs();
}
function checkStory(){
  var blanks = ST.parts.filter(function(p){ return p.a; });
  var right=0, missed=[];
  blanks.forEach(function(p, i){
    var inp = document.querySelector('[data-sb="'+i+'"]'), val = inp.value;
    var ok = [p.a].concat(p.alts).some(function(a){ return norm(a)===norm(val); });
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
    $('fix'+i).textContent = ok ? '' : ' '+p.a;
    if(ok) right++; else missed.push({full:p.h+' → '+p.a, given:val.trim()||'(blank)'});
  });
  ST.checked=true; ST.right=right; ST.total=blanks.length; ST.missed=missed;
  var full = storyFull();
  $('sres').innerHTML = '<div class="fb '+(right===blanks.length?'ok':'no')+'"><b id="verb_score">'+right+' / '+blanks.length+'</b> correct. '+
    (missed.length ? 'The right answers are in green. Fix them and check again.' : 'Every verb is right!')+tools(full)+'</div>';
  window.GAL_SCORE = right; window.GAL_MAX = blanks.length;
  saveResult('story', right, blanks.length, missed, {writing:($('myWrite')||{}).value||''});
}

/* writing check: find past verbs, catch didn't + past */
var PAST_SET = {}, PAST2BASE = {};
ED.concat(IRR1).concat(IRR2).forEach(function(p){ PAST_SET[p.past]=1; if(p.past!==p.v) PAST2BASE[p.past]=p.v; });
['was','were',"wasn't","weren't",'did',"didn't"].forEach(function(w){ PAST_SET[w]=1; });
function checkWriting(){
  var text = ($('myWrite').value||'').replace(/[’‘`]/g,"'");
  if(!text.trim()){ $('wres').innerHTML = '<div class="fb no">Write your sentences first.</div>'; return; }
  var words = text.toLowerCase().match(/[a-z']+/g) || [], found = [], seen={};
  words.forEach(function(w){
    if((PAST_SET[w] || (/^[a-z]{3,}ed$/.test(w) && w!=='need' && w!=='bed' && w!=='red')) && !seen[w]){ seen[w]=1; found.push(w); }
  });
  var probs = [], re = /\b(didn't|did not|didnt)\s+([a-z]+)/gi, m;
  while((m=re.exec(text))){ var w2=m[2].toLowerCase(); if(PAST2BASE[w2] || (/ed$/.test(w2) && w2.length>4)) probs.push(m[0]+' → '+m[0].replace(/\S+$/, PAST2BASE[w2]||w2.replace(/ed$/,''))); }
  var re2 = /\bdid\s+(i|you|he|she|it|we|they)\s+([a-z]+)/gi;
  while((m=re2.exec(text))){ var w3=m[2].toLowerCase(); if(PAST2BASE[w3]) probs.push(m[0]+' → '+m[0].replace(/\S+$/, PAST2BASE[w3])); }
  var sentences = (text.match(/[.!?](\s|$)/g)||[]).length;
  var h = '<div class="fb '+(probs.length?'no':'ok')+'">'+
    '<b>'+found.length+' past tense verb'+(found.length===1?'':'s')+'</b> in '+sentences+' sentence'+(sentences===1?'':'s')+'.'+
    '<div class="found" translate="no">'+found.map(function(w){ return '<span>'+esc(w)+'</span>'; }).join('')+'</div>'+
    (probs.length ? 'Check these: after did and didn\'t, use the base verb.<ul class="missed" translate="no" style="margin:8px 0 0">'+probs.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul>' : '')+
    '</div>';
  $('wres').innerHTML = h;
}
function saveWriting(){
  var text = ($('myWrite').value||'').trim();
  if(!text){ $('wres').innerHTML = '<div class="fb no">Write your sentences first.</div>'; return; }
  if(!ST.checked){ $('wres').innerHTML = '<div class="fb no">Check your story first, then save.</div>'; return; }
  var key = S.unit+'-story', rec = S.scores[key] || {best:ST.right, total:ST.total, correct:ST.right, attempts:1};
  upsertRow(key, rec, {level:S.level, lang:S.lang, missed:ST.missed.slice(0,20), writing:text});
  $('wres').innerHTML = '<div class="fb ok">Saved. Mr. Toby can read it.</div>';
}

function showSummary(ak, correct, total, missed){
  var pct = total ? Math.round(100*correct/total) : 0;
  var msg = ak==='speed' ? (correct>=20?'Fast and correct!':correct>=10?'Good speed. Try to beat it!':'Keep going. Try again!')
          : pct>=90 ? 'Excellent!' : pct>=70 ? 'Good work!' : 'Practice again. You can do it.';
  var list = actsFor(S.unit), nextAct = null;
  for(var i=0;i<list.length-1;i++) if(list[i].k===ak) nextAct = list[i+1];
  var h = '<div class="panel summary"><h2>'+msg+'</h2>'+
    '<div class="scorebig" id="verb_score">'+correct+' / '+total+'</div>'+
    '<p class="lede" style="margin:0 auto">'+(ak==='speed'?'correct answers in 60 seconds':'correct')+'</p>';
  if(missed.length){
    h += '<h3>Practice these</h3><ul class="missed" translate="no">'+missed.slice(0,12).map(function(x){
      return '<li><s>'+esc(x.given)+'</s> → '+esc(x.full)+'</li>'; }).join('')+'</ul>';
  }
  h += '<div class="nextrow" style="justify-content:center;margin-top:18px"><button class="btn soft" data-again="1">Try again</button>'+
    (nextAct ? '<button class="btn" data-goact="'+nextAct.k+'">Next: '+nextAct.t+'</button>'
             : (S.unit!=='pmix' ? '<button class="btn" data-nextunit="1">Next unit</button>' : ''))+'</div></div>';
  $('stage').innerHTML = h;
  window.GAL_SCORE = correct; window.GAL_MAX = total;
  saveResult(ak, correct, total, missed);
}
function headers(extra){

  return h;
}
function setDot(c){ var d=$('dot'); if(d) d.className=c||''; }
function saveResult(ak, correct, total, missed, more){
  var key = S.unit+'-'+ak, prev = S.scores[key] || {best:0, attempts:0};
  var rec = {best:Math.max(prev.best||0, correct), total:total, correct:correct, attempts:(prev.attempts||0)+1};
  S.scores[key] = rec; persist(); renderNav();
  var detail = {level:S.level, lang:S.lang, missed:missed.slice(0,20)};

function upsertRow(key, rec, detail){

    correct:rec.correct, total:rec.total, best:rec.best, attempts:rec.attempts, turned_in:true,
    detail:detail, updated_at:new Date().toISOString()

  }).then(function(r){

  }).catch(function(e){ setDot('err'); console.warn(e); });

function loadScores(){

/* =========================================================

var trCache = {};
function fetchTr(text, meaning){
  var key = S.lang+'|'+text;
  if(trCache[key]) return Promise.resolve(trCache[key]);
  var url = PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent(meaning)+'&lang='+encodeURIComponent(S.lang);
  return fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ok && d.translation){ trCache[key]=d.translation; return d.translation; }
    throw new Error('no translation');
  });
}
function isRtl(){ return /Arabic|Darija|Urdu/.test(S.lang); }
function translate(text){
  if(S.lang==='none'){ popup(text, 'Choose your language at the top of the page.', ''); return; }
  popup(text, '…', '');
  fetchTr(text, 'A simple English sentence or grammar rule for beginner students learning the past tense. Translate it plainly.')
    .then(function(t){ popup(text, t.equiv, t.meaning); })
    .catch(function(){ popup(text, 'Translation is not available right now.', ''); });
}
function fillDirs(){
  if(S.lang==='none') return;
  document.querySelectorAll('[data-dir]').forEach(function(el){
    var src = el.getAttribute('data-dir');
    el.setAttribute('dir', isRtl()?'rtl':'ltr');
    fetchTr(src, 'Instructions for a student activity. Translate plainly and briefly.')
      .then(function(t){ el.textContent = t.equiv; })
      .catch(function(){ el.textContent = ''; });
  });
}
function popup(src, dst, mean){
  var p=$('pop'); p.classList.remove('hidden');
  var rtl = isRtl();
  p.innerHTML = '<button aria-label="Close" data-closepop="1">×</button><div class="src">'+esc(src)+'</div>'+
    '<div class="dst" dir="'+(rtl?'rtl':'ltr')+'">'+esc(dst)+'</div>'+(mean?'<div class="mean" dir="'+(rtl?'rtl':'ltr')+'">'+esc(mean)+'</div>':'');
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('focusin', function(e){
  if(ST && e.target && e.target.getAttribute && e.target.getAttribute('data-sb')!=null) ST.lastFocus = e.target;
});
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('button, .tr') : null;
  if(!t) return;
  var d = function(k){ return t.getAttribute('data-'+k); };

  if(d('closepop')){ $('pop').classList.add('hidden'); return; }
  if(d('say')){ speak(d('say')); return; }
  if(d('tr')){ translate(d('tr')); return; }
  if(d('unit')) return go(d('unit'), 'learn');
  if(d('actk')) return go(null, d('actk'));
  if(d('goact')) return go(null, d('goact'));
  if(d('nextunit')){ for(var i=0;i<UNITS.length-1;i++) if(UNITS[i].k===S.unit) return go(UNITS[i+1].k,'learn'); return; }
  if(d('again')) return renderStage();
  if(d('speedgo')) return speedStart();

  /* story */
  if(ST){
    if(d('scheck')) return checkStory();
    if(d('wcheck')) return checkWriting();
    if(d('wsave')) return saveWriting();
    if(d('sbank')!=null){
      var target = ST.lastFocus;
      if(!target || target.value) target = [].slice.call(document.querySelectorAll('[data-sb]')).filter(function(x){ return !x.value; })[0];
      if(target){ target.value = d('sbank'); target.classList.remove('ok','no'); var nxt=[].slice.call(document.querySelectorAll('[data-sb]')).filter(function(x){ return !x.value; })[0]; if(nxt){ nxt.focus(); ST.lastFocus=nxt; } }
      return;
    }
  }
  /* quiz */
  if(Q && !Q.done){
    var it = Q.items[Q.i];
    if(d('opt')!=null && !Q.answered) return answer(d('opt')===it.ans, d('opt'));
    if(d('rw')!=null && !Q.answered){ var saysRight = d('rw')==='1', isRight = it.shown===it.ans, okRw = saysRight===isRight;
      answer(okRw, isRight ? 'said it was wrong' : (it.pre?it.pre+' ':'')+it.shown+' '+it.post);
      t.classList.add(okRw?'ok':'no'); return; }
    if(d('chip')!=null){ var w=$('wIn'); if(w){ w.value=d('chip'); w.focus(); } return; }
    if(d('next')) return nextQ();
    if(d('check') && !Q.answered){
      if(Q.mode==='write'){ var v=$('wIn').value; if(!v.trim()) return $('wIn').focus(); return answer(accepted(it, v), v.trim()); }
      if(Q.mode==='build'){ var got = it.placed.map(function(ti){ return it.tokens[ti]; }).join(' '); if(!got) return; return answer(norm(got)===norm(it.target), got); }
    }
    if(d('place')!=null && !Q.answered){ var ti=+d('place'); if(it.placed.indexOf(ti)<0){ it.placed.push(ti); speak(it.tokens[ti]); renderQ(); } return; }
    if(d('unplace')!=null && !Q.answered){ it.placed.splice(+d('unplace'),1); renderQ(); return; }
  }
  /* flashcards */
  if(F && d('flip')){ if(!F.flipped){ F.flipped=true; speak(F.queue[0].say); renderFlash(); } else { F.flipped=false; renderFlash(); } return; }
  if(F && d('fl')){
    var c = F.queue.shift();
    if(d('fl')==='got'){ if(!F.seen[c.say]) F.firstTry++; }
    else { F.seen[c.say]=1; F.queue.splice(Math.min(F.queue.length,3),0,c); }
    F.flipped=false; renderFlash(); return;
  }
  /* match */
  if(M && d('ml')!=null){ M.sel = +d('ml'); renderMatch(); return; }
  if(M && d('mr')!=null){
    var ri = +d('mr');
    if(M.sel==null){ t.classList.add('shake'); return; }
    if(M.pairs[ri].r === M.pairs[M.sel].r){
      M.doneL[M.sel]=1; M.doneR[ri]=1; M.matched++;
      speak(S.unit==='was' ? M.pairs[M.sel].l+' '+M.pairs[ri].r : M.pairs[M.sel].l+', '+M.pairs[ri].r);
      M.sel=null;
      if(M.matched===M.pairs.length){ var tot=M.pairs.length; return showSummary('match', Math.max(0,tot-M.errors), tot, []); }
    } else { M.errors++; renderMatch(); var b=document.querySelector('[data-mr="'+ri+'"]'); if(b) b.classList.add('shake'); return; }
    renderMatch(); return;
  }
  /* sort */
  if(SO && d('st')!=null){ SO.sel=+d('st'); if(S.unit==='ed' && S.level==='chal') speak(SO.tiles[SO.sel].t); renderSort(); return; }
  if(SO && d('bin')!=null){
    if(SO.sel==null) return;
    var tile = SO.tiles[SO.sel], bin = SO.bins[+d('bin')];
    if(tile.b===bin){ SO.placed[tile.id]=1; SO.sel=null; renderSort(); }
    else { SO.errors++; renderSort(); var bb=document.querySelector('[data-bin="'+d('bin')+'"]'); if(bb) bb.classList.add('shake'); }
    return;
  }
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' || !Q || Q.done) return;
  if(Q.answered && Q.mode!=='speed'){ e.preventDefault(); nextQ(); }
  else if(Q.mode==='write' && document.activeElement && document.activeElement.id==='wIn'){ e.preventDefault(); var b=document.querySelector('[data-check]'); if(b) b.click(); }

  $('whoLbl').textContent = S.name+', '+S.period;
  $('langSel').value = S.lang;
  $('levelSel').value = S.level;
  if(!UNITS.some(function(u){ return u.k===S.unit; })) S.unit='was';
  if(!actsFor(S.unit).some(function(a){ return a.k===S.act; })) S.act='learn';
  renderNav(); renderStage();
}
document.addEventListener('DOMContentLoaded', function(){
  var opts = LANGS.map(function(l){ return '<option value="'+l[0]+'">'+esc(l[1])+(l[0]!=='none'&&l[1]!==l[0]?' ('+l[0]+')':'')+'</option>'; }).join('');
  $('inLang').innerHTML = opts; $('langSel').innerHTML = opts;
  try{
    var c = JSON.parse(localStorage.getItem(LSKEY)||'null');
    if(c && c.email){
      $('inName').value=c.name||''; $('inEmail').value=c.email||''; $('inPeriod').value=c.period||''; $('inLang').value=c.lang||'none';
      S.level=c.level||'std'; S.unit=c.unit||'was'; S.act=c.act||'learn'; S.scores=c.scores||{};
    } else {
      var p = JSON.parse(localStorage.getItem(LSKEY_PRESENT)||'null');   // carry name, period, language over from present tense
      if(p && p.email){ $('inName').value=p.name||''; $('inEmail').value=p.email||''; $('inPeriod').value=p.period||''; $('inLang').value=p.lang||'none'; S.level=p.level||'std'; }
      else { var saved = localStorage.getItem('gal_student_email'); if(saved) $('inEmail').value = saved; }
    }
  }catch(e){}

  $('btnStart').addEventListener('click', function(){
    var n=$('inName').value.trim(), em=$('inEmail').value.trim().toLowerCase(), p=$('inPeriod').value;
    if(!n){ $('loginErr').textContent='Write your name.'; return $('inName').focus(); }
    if(!EMAIL_RE.test(em)){ $('loginErr').textContent='Use your school email: name@s.sfusd.edu'; return $('inEmail').focus(); }
    if(!p){ $('loginErr').textContent='Choose your class period.'; return $('inPeriod').focus(); }
    var canon = canonical(em);
    if(S.email && S.email!==canon) S.scores = {};
    S.name=n; S.email=canon; S.period=p; S.lang=$('inLang').value;
    try{ localStorage.setItem('gal_student_email', canon); }catch(e){}
    persist();
    registerStudent(em);
    $('btnStart').textContent='Loading…';
    loadScores().then(function(){ persist(); boot(); });
  });
  ['inName','inEmail'].forEach(function(id){ $(id).addEventListener('keydown', function(e){ if(e.key==='Enter') $('btnStart').click(); }); });
  $('langSel').addEventListener('change', function(){ S.lang=$('langSel').value; persist(); refreshLang(); });
  $('levelSel').addEventListener('change', function(){ S.level=$('levelSel').value; persist(); renderStage(); });
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged = function(){ voice=null; };
});

</script>
<script src="/readings/track.js"></script>
</body>
