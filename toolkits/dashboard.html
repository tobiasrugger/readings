<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolkits &mdash; Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1f4d3d; --pine-dk:#163a2d; --pine-lt:#e7f0ec;
  --paper:#fbfaf6; --card:#fff; --ink:#1d2320; --muted:#6b7370; --line:#dfe3e0;
  --gold:#b8842c; --gold-lt:#fdf4e3; --rose:#a14a4a; --rose-lt:#fbecec;
  --sky:#2f6d8f; --sky-lt:#e6f0f5; --plum:#5a4a8a; --plum-lt:#eae7f5; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;font-size:17px;padding-bottom:80px}

/* SIGN IN */
#signin{position:fixed;inset:0;background:var(--pine);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px}
.signin-card{background:var(--card);border-radius:16px;padding:30px 28px;max-width:420px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.signin-card h1{font-size:23px;margin-bottom:4px;color:var(--pine)}
.signin-card p.sub{color:var(--muted);font-size:15px;margin-bottom:18px}
.signin-card label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
.signin-card input,.signin-card select{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:9px;font-family:inherit;font-size:16px;background:#fff}
.signin-card input:focus,.signin-card select:focus{outline:none;border-color:var(--pine)}
.signin-card button{width:100%;margin-top:20px;padding:13px;background:var(--pine);color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer}
.signin-card button:hover{background:var(--pine-dk)}
.signin-card button.skip{background:#fff;color:var(--pine);border:2px solid var(--pine);margin-top:10px;font-size:15px;padding:10px}
#signin-err{color:var(--rose);font-size:14px;font-weight:700;margin-top:10px;min-height:20px}

/* TOOLBAR */
#bar{position:sticky;top:0;z-index:400;background:var(--pine);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#bar .ttl{font-weight:800;font-size:17px;margin-right:auto}
#bar .ttl a{color:#fff;text-decoration:none;opacity:.75;font-weight:700}
#bar .ttl a:hover{opacity:1}
#bar select,#bar button{font-family:inherit;font-size:14px;font-weight:700;border-radius:8px;padding:7px 11px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
#bar select option{color:#000}
#bar button:hover{background:rgba(255,255,255,.28)}
#bar button.turnin{background:var(--gold);border-color:var(--gold)}
#bar button.on{background:#fff;color:var(--pine)}
#who{font-size:13px;opacity:.9;cursor:pointer;text-decoration:underline}
.dot{width:10px;height:10px;border-radius:50%;background:#8aa39a;display:inline-block}
.dot.saving{background:#e0a33c}.dot.ok{background:#63c48b}.dot.err{background:#e06060}
#savetxt{font-size:12px;opacity:.85}

/* LAYOUT */
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
.hero{background:var(--pine);color:#fff;padding:32px 18px 34px;margin-bottom:22px}
.hero .kit{font-size:14px;font-weight:800;opacity:.7;margin-bottom:6px}
.hero h1{font-size:33px;line-height:1.15;font-weight:800;margin-bottom:10px}
.hero p{font-size:17px;opacity:.92;max-width:56ch}
.hero .by{margin-top:16px;font-size:14px;opacity:.75}
h2.sec{font-size:23px;font-weight:800;color:var(--pine);margin:38px 0 4px;padding-top:10px;border-top:3px solid var(--pine)}
h2.sec .n{display:inline-block;background:var(--pine);color:#fff;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;font-size:15px;margin-right:8px;vertical-align:2px}
p.secsub{color:var(--muted);margin-bottom:16px;font-size:15px}
h3{font-size:19px;font-weight:800;margin:24px 0 6px;color:var(--pine-dk)}

/* TABS */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 4px;border-bottom:2px solid var(--line);padding-bottom:0}
.tabs button{font-family:inherit;font-size:15px;font-weight:800;padding:9px 15px;border:2px solid var(--line);border-bottom:none;background:#fff;color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;position:relative;top:2px}
.tabs button.on{color:var(--pine);border-color:var(--pine);background:var(--pine-lt)}
.tabpane{display:none}
.tabpane.on{display:block}

/* GRAMMAR TABLE */
.gt{width:100%;border-collapse:collapse;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0;font-size:16px}
.gt th{background:var(--pine);color:#fff;text-align:left;padding:9px 11px;font-size:14px;font-weight:800}
.gt td{border-top:1px solid var(--line);padding:9px 11px;vertical-align:middle}
.gt tr:nth-child(even) td{background:#fcfcfa}
.gt .k{font-weight:800;color:var(--pine-dk);white-space:nowrap}
.gt .ex{color:var(--muted);font-size:15px}
.gt .mlcell{padding:5px 8px;width:22%}
.ml{width:100%;border:1.5px dashed var(--gold);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:15px;background:var(--gold-lt)}
.ml:focus{outline:none;border-style:solid;background:#fff}
.mlnote{font-size:14px;color:var(--muted);font-style:italic;margin:6px 0 0}

/* PRONOUN / PERSON ICON */
.pfig{width:34px;height:34px;color:var(--pine);vertical-align:middle;flex-shrink:0}

/* SPEAK */
.spk{background:none;border:none;cursor:pointer;color:var(--sky);padding:2px 4px;line-height:1;vertical-align:middle}
.spk svg{width:19px;height:19px;display:block}
.spk:hover{color:var(--pine)}

/* GLOSSARY */
.g{border-bottom:2px dotted var(--gold);cursor:pointer;font-weight:700}
#tip{display:none;position:absolute;z-index:500;max-width:300px;background:var(--pine-dk);color:#fff;border-radius:10px;padding:11px 13px;font-size:15px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#tip .w{font-weight:800;margin-bottom:3px}
#tip .tr{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.25);font-weight:700}
#tip .tr.load{opacity:.6;font-style:italic;font-weight:400}

/* QUESTION BLOCKS */
.q{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--pine);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.q .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:20px;margin-bottom:7px}
.tag.sci{background:var(--sky-lt);color:var(--sky)}
.tag.hist{background:var(--gold-lt);color:var(--gold)}
.tag.math{background:var(--plum-lt);color:var(--plum)}
.tag.arts{background:var(--rose-lt);color:var(--rose)}
.tag.talk{background:var(--pine-lt);color:var(--pine)}
.q .qt{font-weight:700;margin-bottom:9px}
.q .hint{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:8px}
textarea{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-family:inherit;font-size:16px;line-height:1.55;resize:vertical;background:#fffdf8}
textarea:focus{outline:none;border-color:var(--pine);background:#fff}
input.line{border:none;border-bottom:2px solid var(--pine);background:#fffdf8;font-family:inherit;font-size:16px;padding:3px 6px;min-width:120px;border-radius:4px 4px 0 0}
input.line:focus{outline:none;background:var(--gold-lt)}
input.line.short{min-width:80px;width:110px}

/* FILL ROWS */
.frow{padding:10px 0;border-bottom:1px solid var(--line);line-height:2.3}
.frow:last-child{border-bottom:none}
.frow .num{font-weight:800;color:var(--pine);margin-right:6px}
.frow select{padding:5px 8px;border:1.5px solid var(--gold);border-radius:7px;font-family:inherit;font-size:16px;background:var(--gold-lt);font-weight:700}
.frow select:focus{outline:none;border-color:var(--pine)}
.mk{font-size:19px;font-weight:800;margin-left:6px}
.mk.y{color:#2f8f5b}.mk.n{color:var(--rose)}

/* WORD BANK / CHIPS */
.wordbank{background:var(--pine-lt);border-radius:var(--r);padding:12px 15px;margin:12px 0;line-height:2.1}
.wordbank b{display:block;font-size:14px;color:var(--pine);margin-bottom:4px}
.chip{display:inline-block;background:#fff;border:1.5px solid var(--pine);border-radius:20px;padding:3px 13px;margin:3px 5px 3px 0;font-size:15px;font-weight:700;cursor:pointer;user-select:none}
.chip.sel{background:var(--pine);color:#fff}
.chip.used{opacity:.35;text-decoration:line-through}

/* VENN */
.venn{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.vlab{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.vlab input{flex:1;min-width:130px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:15px;font-weight:700}
.vzones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vz{min-height:120px;border:2.5px solid var(--pine);padding:9px;cursor:pointer;background:#fcfdfc}
.vz.left{border-radius:60px 8px 8px 60px;border-right-style:dashed}
.vz.mid{border-radius:8px;border-left:none;border-right:none;background:var(--pine-lt)}
.vz.right{border-radius:8px 60px 60px 8px;border-left-style:dashed}
.vz .zt{font-size:12px;font-weight:800;color:var(--pine);text-align:center;margin-bottom:6px}
.vz.arm{box-shadow:inset 0 0 0 3px var(--gold)}
.vz .item{display:block;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:3px 8px;margin:4px 0;font-size:14px;font-weight:700;cursor:pointer}
.vz .item:hover{border-color:var(--rose);color:var(--rose)}
.vadd{display:flex;gap:7px;margin-top:10px}
.vadd input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:15px}
.vadd button{border:none;background:var(--pine);color:#fff;border-radius:8px;padding:7px 15px;font-family:inherit;font-weight:800;cursor:pointer}
@media(max-width:560px){.vzones{grid-template-columns:1fr}.vz,.vz.left,.vz.right{border-radius:8px;border-style:solid}}

/* FRAME BOX */
.frames{background:var(--gold-lt);border:1.5px solid var(--gold);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.frames .f{margin:9px 0;font-weight:700}
.frames .e{color:var(--muted);font-style:italic;font-weight:400;font-size:15px;margin-left:12px;display:block}
.note{background:var(--pine-lt);border-radius:var(--r);padding:13px 16px;margin:14px 0;font-size:15px}
.note b{color:var(--pine)}
.warn{background:var(--rose-lt);border-left:5px solid var(--rose);border-radius:var(--r);padding:13px 16px;margin:14px 0;font-size:15px}

/* CARD GRID (hub) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:16px 0}
.card{display:block;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--pine);border-radius:var(--r);padding:15px 16px;text-decoration:none;color:inherit}
.card:hover{border-left-color:var(--gold);box-shadow:0 5px 18px rgba(0,0,0,.07)}
.card .n{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.card h4{font-size:18px;font-weight:800;color:var(--pine-dk);margin:2px 0 5px}
.card p{font-size:14px;color:var(--muted);line-height:1.5}

.btn{padding:11px 20px;border:none;border-radius:9px;background:var(--pine);color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
.btn.ghost{background:#fff;color:var(--pine);border:2px solid var(--pine)}
.score{margin-left:10px;font-weight:800}
footer{text-align:center;color:var(--muted);font-size:14px;padding:36px 18px 10px}
footer a{color:var(--pine)}
.printhead{display:none}

@media print{
  @page{margin:1.4cm}
  body{background:#fff;font-size:11.5pt;padding-bottom:0}
  #bar,#signin,#tip,.btn,.noprint,.spk,.tabs{display:none!important}
  .hero{background:#fff;color:#000;padding:0 0 8px;margin-bottom:10px;border-bottom:3px solid #000}
  .hero h1{font-size:20pt}.hero p{font-size:10.5pt}
  .printhead{display:block;border-bottom:1px solid #000;padding-bottom:5px;margin-bottom:14px;font-size:10.5pt}
  .wrap{max-width:100%;padding:0}
  .q,.venn,.frames,.gt tr,.note{break-inside:avoid;page-break-inside:avoid}
  h2.sec{break-after:avoid;page-break-after:avoid;font-size:14pt}
  .tabpane{display:block!important}
  textarea{border:none;border-bottom:1px solid #999;border-radius:0;min-height:0;background:#fff;overflow:visible;resize:none}
  input.line{background:#fff}
  .vz{min-height:150px}
}
body.blank textarea,body.blank input,body.blank select{color:transparent!important}
body.blank .vz .item{color:transparent!important}

.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:13px 15px;margin:16px 0}
.ctrl select,.ctrl input{padding:8px 11px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:15px;background:#fff}
.ctrl label{font-weight:800;font-size:14px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--pine-lt);border-radius:var(--r);padding:11px 18px;text-align:center;min-width:110px}
.stat b{display:block;font-size:26px;color:var(--pine);line-height:1.2}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
table.d{width:100%;border-collapse:collapse;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:15px}
table.d th{background:var(--pine);color:#fff;text-align:left;padding:9px 11px;font-size:13px;cursor:pointer}
table.d td{border-top:1px solid var(--line);padding:9px 11px;vertical-align:top}
table.d tr.r:hover td{background:var(--gold-lt)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
.pill.in{background:#dff3e6;color:#2f8f5b}
.pill.wip{background:var(--gold-lt);color:var(--gold)}
.det{background:#fcfcfa;padding:0}
.det .inner{padding:14px 18px}
.ans{margin:9px 0;border-left:3px solid var(--line);padding-left:11px}
.ans .k{font-size:12px;font-weight:800;color:var(--muted)}
.ans .v{white-space:pre-wrap}
.vn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:9px 0}
.vn div{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px}
.vn div b{display:block;font-size:12px;color:var(--pine);margin-bottom:5px}
.vn span{display:block;font-size:14px}
#gate{position:fixed;inset:0;background:var(--pine);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px}
</style>
</head>
<body>

<div id="gate">
  <div class="signin-card">
    <h1>Teacher dashboard</h1>
    <p class="sub">English Toolkits &middot; student work</p>
    <label for="pw">Password</label>
    <input id="pw" type="password">
    <div id="gerr" style="color:var(--rose);font-weight:700;font-size:14px;min-height:20px;margin-top:8px"></div>
    <button id="go">Open</button>
  </div>
</div>

<div id="bar">
  <span class="ttl">Toolkits &middot; Teacher dashboard</span>
  <button id="btn-csv">Download CSV</button>
  <button id="btn-refresh">Refresh</button>
</div>

<div class="wrap" style="max-width:1100px;padding-top:18px">

<div class="ctrl">
  <label>Assignment</label>
  <select id="f-sec"><option value="toolkit1_practice">Toolkit 1 practice (pronouns)</option><option value="toolkit2_practice">Toolkit 2 practice (be/have/do)</option><option value="toolkit3_practice">Toolkit 3 practice (compare/contrast)</option><option value="lesson1">Lesson 1 - Describing yourself</option><option value="lesson2">Lesson 2 - Describing a classmate</option><option value="lesson3">Lesson 3 - Describing a character</option><option value="lesson3b">Lesson 3b - Venn diagrams</option><option value="lesson4">Lesson 4 - Compare & contrast 1</option><option value="lesson5">Lesson 5 - Compare & contrast 2</option><option value="toolkit1">Toolkit 1 sheet (ML notes)</option><option value="toolkit2">Toolkit 2 sheet (ML notes)</option><option value="toolkit3">Toolkit 3 sheet (ML notes)</option></select>
  <label>Period</label>
  <select id="f-per">
    <option value="">All</option>
    <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option>
  </select>
  <label>Show</label>
  <select id="f-st"><option value="">Everyone</option><option value="in">Turned in</option><option value="wip">Not turned in</option></select>
  <input id="f-q" placeholder="Search a name">
</div>

<div class="stats" id="stats"></div>
<div id="tbl"></div>

<footer>Mr. Toby &middot; <a href="index.html">Back to toolkits</a></footer>
</div>

<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE='toolkit_work';
var PW='galileo2026';
var rows=[], open_=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

$('go').addEventListener('click',gate);
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')gate();});
function gate(){
  if($('pw').value!==PW){$('gerr').textContent='Wrong password.';return;}
  sessionStorage.setItem('tk_dash','1');
  $('gate').style.display='none'; fetchRows();
}
if(sessionStorage.getItem('tk_dash')==='1'){$('gate').style.display='none';}

function fetchRows(){
  var sec=$('f-sec').value;
  var url=SUPA_URL+'/rest/v1/'+TABLE+'?section=eq.'+encodeURIComponent(sec)+'&select=*&order=name.asc';
  $('tbl').innerHTML='<p style="color:var(--muted)">Loading...</p>';
  fetch(url,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}})
    .then(function(r){return r.json();})
    .then(function(d){rows=Array.isArray(d)?d:[];render();})
    .catch(function(e){$('tbl').innerHTML='<p style="color:var(--rose)">Could not load. Check the table name and that the table exists.</p>';});
}

function filtered(){
  var per=$('f-per').value, st=$('f-st').value, q=$('f-q').value.trim().toLowerCase();
  return rows.filter(function(r){
    if(per && String(r.period)!==per) return false;
    if(st==='in' && !r.submitted) return false;
    if(st==='wip' && r.submitted) return false;
    if(q && (r.name||'').toLowerCase().indexOf(q)<0 && (r.email||'').toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function countAnswers(p){
  if(!p) return 0;
  var n=0, a=p.answers||{};
  for(var k in a){ if(a[k] && String(a[k]).trim()) n++; }
  var v=p.venn||{};
  for(var id in v){ n+=(v[id].L||[]).length+(v[id].M||[]).length+(v[id].R||[]).length; }
  return n;
}
function render(){
  var f=filtered();
  var inn=f.filter(function(r){return r.submitted;}).length;
  $('stats').innerHTML=
    '<div class="stat"><b>'+f.length+'</b><span>students started</span></div>'+
    '<div class="stat"><b>'+inn+'</b><span>turned in</span></div>'+
    '<div class="stat"><b>'+(f.length-inn)+'</b><span>still working</span></div>';
  if(!f.length){$('tbl').innerHTML='<p style="color:var(--muted)">Nobody has started this one yet.</p>';return;}
  var h='<table class="d"><tr><th>Name</th><th>Period</th><th>Answers</th><th>Status</th><th>Last saved</th></tr>';
  f.forEach(function(r,i){
    var d=r.updated_at?new Date(r.updated_at):null;
    h+='<tr class="r" data-i="'+i+'"><td><b>'+esc(r.name)+'</b><br><span style="font-size:12px;color:var(--muted)">'+esc(r.email)+'</span></td>'+
       '<td>'+esc(r.period)+'</td><td>'+countAnswers(r.payload)+'</td>'+
       '<td>'+(r.submitted?'<span class="pill in">turned in</span>':'<span class="pill wip">working</span>')+'</td>'+
       '<td style="font-size:13px;color:var(--muted)">'+(d?d.toLocaleString():'')+'</td></tr>'+
       '<tr class="det" id="d'+i+'" style="display:none"><td colspan="5"><div class="inner">'+detail(r)+'</div></td></tr>';
  });
  h+='</table>';
  $('tbl').innerHTML=h;
  $('tbl').addEventListener('click',function(e){
    var tr=e.target.closest('tr.r'); if(!tr)return;
    var d=$('d'+tr.getAttribute('data-i'));
    d.style.display=(d.style.display==='none')?'table-row':'none';
  });
}
function detail(r){
  var p=r.payload||{}, a=p.answers||{}, v=p.venn||{}, h='';
  var keys=Object.keys(a).sort();
  keys.forEach(function(k){
    if(!a[k]||!String(a[k]).trim())return;
    h+='<div class="ans"><div class="k">'+esc(k)+'</div><div class="v">'+esc(a[k])+'</div></div>';
  });
  Object.keys(v).forEach(function(id){
    var o=v[id];
    h+='<div class="ans"><div class="k">Venn: '+esc(id)+'</div><div class="vn">'+
       '<div><b>ONLY LEFT</b>'+(o.L||[]).map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'+
       '<div><b>BOTH</b>'+(o.M||[]).map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'+
       '<div><b>ONLY RIGHT</b>'+(o.R||[]).map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'+
       '</div></div>';
  });
  return h||'<p style="color:var(--muted)">Nothing typed yet.</p>';
}

['f-per','f-st'].forEach(function(id){$(id).addEventListener('change',render);});
$('f-q').addEventListener('input',render);
$('f-sec').addEventListener('change',fetchRows);
$('btn-refresh').addEventListener('click',fetchRows);
$('btn-csv').addEventListener('click',function(){
  var f=filtered(), keys={};
  f.forEach(function(r){var a=(r.payload||{}).answers||{};Object.keys(a).forEach(function(k){keys[k]=1;});});
  var cols=['name','email','period','submitted','updated_at'].concat(Object.keys(keys).sort());
  var out=[cols.join(',')];
  f.forEach(function(r){
    var a=(r.payload||{}).answers||{};
    out.push(cols.map(function(c){
      var v=(c in r)?r[c]:(a[c]||'');
      return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    }).join(','));
  });
  var b=new Blob([out.join('\n')],{type:'text/csv'});
  var u=URL.createObjectURL(b), l=document.createElement('a');
  l.href=u; l.download=$('f-sec').value+'.csv'; l.click(); URL.revokeObjectURL(u);
});
if(sessionStorage.getItem('tk_dash')==='1') fetchRows();
</script>
