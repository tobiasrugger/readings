<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Galileo Readings</title>
<!-- T-415 (Nov 15 2026): GitHub Pages shows this file for ANY missing address under /readings/.
     1) If the address is only a little wrong (".../index.html/", "//", wrong capitals, a stray
        "/index" or ".html" missing), it checks the fixed address exists and goes there quietly,
        keeping ?search and #part.  2) Otherwise it shows a friendly "page not found" screen. -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1f2a24; --green:#1f7a4d; --line:#e0f2e8; --cream:#fffaf0; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Nunito',system-ui,sans-serif; background:#f4efe4; color:var(--ink);
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  #finding{ font-size:1.15rem; font-weight:700; color:#55625a; }
  #box{ display:none; max-width:620px; width:100%; background:var(--cream); border:2px solid var(--ink);
        border-radius:16px; box-shadow:0 6px 0 rgba(0,0,0,.18); padding:24px 26px; }
  #box::after{ content:""; display:block; clear:both; }
  #lion{ float:right; width:190px; height:auto; margin:0 0 10px 16px; }
  h1{ font-size:1.7rem; margin:.1em 0 .35em; }
  p{ font-size:1.08rem; line-height:1.45; margin:.4em 0; }
  .addr{ font-family:monospace; font-size:.9rem; background:#fff; border:2px solid #b9b2a2; border-radius:8px;
         padding:6px 9px; overflow-wrap:anywhere; display:block; overflow:hidden; margin:.2em 0 .6em; }
  .row{ clear:both; display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:8px; position:relative; }
  .btn{ font:inherit; font-weight:800; text-decoration:none; border-radius:12px; padding:12px 18px; cursor:pointer;
        border:2px solid var(--ink); background:#fff; color:var(--ink); font-size:1.02rem; }
  .btn.go{ background:var(--green); border-color:var(--green); color:#fff; font-size:1.12rem; }
  .next{ clear:both; font-weight:800; color:var(--green); margin-top:14px; }
  .arrow{ flex:none; animation:nudge 1.6s ease-in-out infinite; }
  @keyframes nudge{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(3px); } }
  @media (prefers-reduced-motion:reduce){ .arrow{ animation:none; } }
  @media (max-width:520px){ #lion{ width:130px; } h1{ font-size:1.4rem; } }
</style>
</head>
<body>
<div id="finding">Finding your page…</div>

<div id="box" role="main">
  <svg id="lion" viewBox="0 0 220 220" aria-hidden="true">
    <!-- floor shadow -->
    <ellipse cx="110" cy="205" rx="78" ry="9" fill="#d8cdb6"/>
    <!-- body -->
    <path d="M58 200 C52 150 70 122 110 120 C150 122 168 150 162 200 Z" fill="#e3a640"/>
    <path d="M84 200 C82 166 92 146 110 145 C128 146 138 166 136 200 Z" fill="#f2c56d"/>
    <!-- tail -->
    <path d="M160 186 C190 182 196 160 186 150" fill="none" stroke="#c98a2a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="186" cy="146" r="8" fill="#8a4f1c"/>
    <!-- mane -->
    <g fill="#9a5520">
      <circle cx="110" cy="80" r="58"/>
    </g>
    <g fill="#b8682a">
      <circle cx="68" cy="58" r="16"/><circle cx="152" cy="58" r="16"/><circle cx="58" cy="90" r="16"/>
      <circle cx="162" cy="90" r="16"/><circle cx="74" cy="122" r="15"/><circle cx="146" cy="122" r="15"/>
      <circle cx="92" cy="34" r="15"/><circle cx="128" cy="34" r="15"/><circle cx="110" cy="136" r="14"/>
    </g>
    <!-- face -->
    <ellipse cx="110" cy="84" rx="38" ry="40" fill="#f0b552"/>
    <circle cx="80" cy="54" r="10" fill="#f0b552"/><circle cx="140" cy="54" r="10" fill="#f0b552"/>
    <circle cx="80" cy="54" r="5" fill="#d98f3a"/><circle cx="140" cy="54" r="5" fill="#d98f3a"/>
    <!-- puzzled brows + eyes -->
    <path d="M90 70 l14 -4" stroke="#5b3413" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M118 64 l13 6" stroke="#5b3413" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="97" cy="80" r="5.5" fill="#2b1a0c"/><circle cx="124" cy="80" r="5.5" fill="#2b1a0c"/>
    <circle cx="99" cy="78" r="1.8" fill="#fff"/><circle cx="126" cy="78" r="1.8" fill="#fff"/>
    <!-- muzzle -->
    <ellipse cx="110" cy="102" rx="17" ry="12" fill="#fbe3b0"/>
    <path d="M103 95 h14 l-7 7 z" fill="#4a2a10"/>
    <path d="M110 102 v4 M102 110 q8 -4 16 0" stroke="#4a2a10" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g fill="#c98a2a"><circle cx="97" cy="104" r="1.3"/><circle cx="93" cy="100" r="1.3"/><circle cx="123" cy="104" r="1.3"/><circle cx="127" cy="100" r="1.3"/></g>
    <!-- map held in paws -->
    <g transform="rotate(-8 112 168)">
      <path d="M72 150 l26 -6 l26 6 l26 -6 v40 l-26 6 l-26 -6 l-26 6 z" fill="#fdf6e3" stroke="#6b5a3a" stroke-width="2"/>
      <path d="M98 144 v40 M124 150 v40" stroke="#c9b892" stroke-width="1.6"/>
      <path d="M80 176 q14 -20 30 -8 t28 -14" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
      <path d="M134 152 l6 6 M140 152 l-6 6" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
      <text x="84" y="166" font-size="13" font-weight="800" fill="#1f7a4d" font-family="Nunito,sans-serif">?</text>
    </g>
    <ellipse cx="74" cy="168" rx="11" ry="9" fill="#f0b552"/><ellipse cx="148" cy="164" rx="11" ry="9" fill="#f0b552"/>
    <!-- question marks -->
    <text x="172" y="40" font-size="30" font-weight="800" fill="#1f7a4d" font-family="Nunito,sans-serif">?</text>
    <text x="22" y="46" font-size="22" font-weight="800" fill="#1f7a4d" opacity=".7" font-family="Nunito,sans-serif">?</text>
  </svg>

  <h1>Oops, this page isn't here.</h1>
  <p>The lion looked everywhere, but this address doesn't go to a page:</p>
  <div class="addr" id="addr"></div>
  <p>Maybe the link has a small mistake. Go back to all the readings and pick your activity there.</p>

  <div class="next" id="nextLine">Next: tap “All readings”</div>
  <div class="row">
    <svg class="arrow" width="30" height="24" viewBox="0 0 26 22" aria-hidden="true"><path d="M2 8 h12 V2 l10 9 l-10 9 v-6 H2 z" fill="#1f7a4d"/></svg>
    <a class="btn go" id="goHome" href="/readings/">All readings →</a>
    <a class="btn" href="/readings/student/">My Page</a>
    <button class="btn" type="button" id="goBack">← Back</button>
  </div>
</div>

<script src="/readings/icon.js"></script>
<script>
(function(){
  var path = location.pathname, tail = location.search + location.hash;
  document.getElementById("addr").textContent = location.href;
  document.getElementById("goBack").onclick = function(){ history.back(); };

  function show(){ document.getElementById("finding").style.display = "none"; document.getElementById("box").style.display = "block"; }

  /* Candidate fixes, most likely first. Each one is only used if the server says it exists. */
  function cands(p){
    var out = [], add = function(x){ if(x && x !== p && out.indexOf(x) < 0) out.push(x); };
    var a = p.replace(/\/{2,}/g, "/");                           // //  → /
    var b = a.replace(/(\.html?)\/.*$/i, "$1");                   // page.html/anything → page.html
    var c = b.replace(/\/index\.html?$/i, "/");                   // .../index.html → .../
    add(c); add(b); add(a);
    add(c.replace(/\/index\/?$/i, "/"));                          // .../index → .../
    if(!/\.[a-z0-9]+$/i.test(a) && !/\/$/.test(a)) add(a + ".html");  // page → page.html
    var low = c.toLowerCase(); add(low);                          // wrong capitals
    if(!/\/$/.test(low) && !/\.[a-z0-9]+$/i.test(low)) add(low + "/");
    return out.filter(function(x){ return /^\/readings(\/|$)/.test(x); });
  }

  var list = cands(path);
  if(!list.length || !window.fetch){ show(); return; }

  var i = 0, timer = setTimeout(show, 4000);                     // never leave a student on "Finding…"
  (function next(){
    if(i >= list.length){ clearTimeout(timer); show(); return; }
    var u = list[i++];
    fetch(u, { method:"HEAD", cache:"no-store" }).then(function(r){
      if(r.ok && !/\/404\.html$/.test(r.url || "")){ clearTimeout(timer); location.replace(u + tail); }
      else next();
    }).catch(next);
  })();
})();
</script>
</body>
</html>
