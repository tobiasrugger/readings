<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Practice 1 · Seedfolks · Mr. Toby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2a2f; --page:#dfe8ee; --paper:#ffffff; --bean:#1e8c45; --bean2:#27a356; --leaf:#e3f4e6;
  --soil:#7a4f2c; --gold:#f2b632; --sky:#eef6fb; --muted:#4c5f66;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--page);color:var(--ink);font-size:17px;line-height:1.45;padding-bottom:96px}
button,select,input{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- sign-in ---------- */
#gate{position:fixed;inset:0;z-index:200;background:#1b2a2f;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
#gate .box{background:#fff;border:3px solid #000;border-radius:16px;box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:24px 22px;max-width:420px;width:100%}
#gate h2{margin:0 0 4px;font-size:1.5rem;font-weight:900}
#gate p.sub{margin:0 0 10px;color:var(--muted);font-size:.95rem}
#gate label{display:block;font-weight:800;font-size:.85rem;margin:10px 0 4px}
#gate input,#gate select{width:100%;font-size:1rem;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
#gate .row2{display:flex;gap:10px}#gate .row2>div{flex:1}
#gate .go{width:100%;margin-top:16px;padding:13px;border:2px solid #000;border-radius:12px;background:var(--bean);color:#fff;font-weight:900;font-size:1.1rem}
#gate .err{color:#b3261e;font-weight:800;font-size:.9rem;margin-top:8px;min-height:1.2em}
#gate .gart{float:right;width:96px;margin:0 0 6px 10px}

/* ---------- top bar ---------- */
#bar{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;border-bottom:3px solid #000}
#bar .ttl{font-weight:900;font-size:1.05rem;margin-right:6px}
#bar .parts{display:flex;gap:6px;flex-wrap:wrap}
#bar .pt{border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem}
#bar .pt.on{background:#fff;color:var(--ink)}
#bar .sp{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#bar label{font-size:.8rem;font-weight:800}
#bar select{border:2px solid #fff;border-radius:8px;background:#fff;color:var(--ink);font-weight:800;padding:4px 6px}
#dot{width:12px;height:12px;border-radius:50%;background:#8a9a9f;display:inline-block}
#dot.ok{background:#6ee59a}#dot.saving{background:var(--gold)}#dot.err{background:#ff8a7a}
#savetxt,#who{font-size:.8rem;font-weight:700;opacity:.9}
#neterr{display:none;background:#b3261e;color:#fff;font-weight:800;text-align:center;padding:8px;border-bottom:2px solid #000}
#trwarn{display:none;background:#fff3c4;color:#5a4300;font-weight:800;text-align:center;padding:6px;border-bottom:2px solid #000}

/* ---------- slide ---------- */
#deck{max-width:1320px;margin:0 auto;padding:14px 14px 0}
.slide.anim{animation:slideIn .28s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
.counter{font-weight:900;font-size:.9rem;color:var(--muted);margin:0 0 8px}

.dirgrid{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.db{position:relative;background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 rgba(27,42,47,.22);padding:0 0 10px;min-height:96px;display:flex;flex-direction:column;overflow:hidden}
.db .hd{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 6px;color:#fff;font-weight:800;font-size:.82rem;min-height:30px}
.db.en .hd{padding-left:12px}
.db.long .tx{font-size:.93rem}
.db.en.long .tx{font-size:clamp(1.02rem,1.35vw,1.22rem)}
.db .tx bdi{unicode-bidi:isolate}
.db .hd select{font-weight:800;font-size:.78rem;border:1.5px solid #fff;border-radius:7px;background:rgba(255,255,255,.95);color:var(--ink);padding:1px 3px;max-width:118px}
.db .tx{padding:8px 12px 2px;font-size:1rem;font-weight:600}
.db .tx[dir=rtl]{text-align:right;font-size:1.08rem}
.db .ear{margin-left:auto;border:1.5px solid #fff;background:#fff;border-radius:7px;font-size:.9rem;padding:0 6px;line-height:1.5}
.db.mine{outline:4px solid var(--gold);outline-offset:-1px}
.db.mine .hd select{outline:3px solid var(--gold)}
.db.mine .hd::after{content:'★ mine';order:2;font-size:.72rem;background:var(--gold);color:#000;border-radius:6px;padding:0 5px;margin-left:4px}
.db.en{border:4px solid #000;box-shadow:5px 5px 0 rgba(0,0,0,.3)}
.db.en .hd{background:#000}
.db.en .tx{font-size:clamp(1.12rem,1.55vw,1.42rem);font-weight:900;line-height:1.35}
.db.lead{background:var(--sky);border-style:solid;align-items:center;justify-content:center;flex-direction:row;padding:6px 8px;gap:6px}
.lead svg{width:96px;height:96px;flex:0 0 auto}
.bubble{position:relative;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:.95rem;max-width:180px}
.bubble::before{content:'';position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.lead .waves{opacity:0;transition:opacity .2s}
.lead.talk .waves{opacity:1;animation:wv .6s infinite alternate}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(3px)}}
.miniplay{margin:8px 0 0 10px;background:var(--bean);color:#fff;border:2px solid #000;border-radius:999px;padding:6px 16px;font-weight:900;font-size:1.05rem;box-shadow:0 3px 0 #0d4f25}
.typing{color:var(--muted);font-style:italic;font-weight:600}

/* ---------- stage ---------- */
.stage{background:#fff;border:3px solid #000;border-radius:16px;box-shadow:6px 6px 0 rgba(0,0,0,.25);padding:16px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.stage::after{content:'';display:block;clear:both}
.playcol{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;gap:10px}
.play{width:132px;height:132px;border-radius:50%;background:var(--bean);border:4px solid #000;box-shadow:0 6px 0 #0d4f25;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .1s}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #0d4f25}
.play svg{width:60px;height:60px;margin-left:8px}
.play.talk::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:4px solid var(--bean2);animation:ring 1s infinite}
@keyframes ring{from{opacity:1;transform:scale(.92)}to{opacity:0;transform:scale(1.18)}}
.playlbl{font-weight:900;font-size:1.15rem}
.rep{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:7px 10px;font-weight:800;font-size:.9rem;text-align:center;line-height:1.25}
.rep small{display:block;font-weight:600;color:var(--muted)}
.anscol{flex:1 1 360px;min-width:260px}
.instr{font-size:1.35rem;font-weight:900;margin:2px 0 10px}
.line{min-height:110px;display:flex;align-items:center;justify-content:center;border:3px dashed #8fa3aa;border-radius:14px;background:#fbfdfc;padding:10px;text-align:center}
.line .blank{font-size:3.2rem;font-weight:900;color:#9fb0b6;letter-spacing:.08em}
.line .ans{font-size:clamp(2.4rem,6vw,4.6rem);font-weight:900;color:var(--bean);line-height:1.1;animation:pop .35s ease-out;letter-spacing:.01em}
.line .ans.sent{font-size:clamp(1.9rem,4.4vw,3.3rem)}
.line.shown{border-style:solid;border-color:var(--bean);background:var(--leaf)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.cap1{text-decoration:underline;text-decoration-thickness:6px;text-decoration-color:#2457a6;text-underline-offset:8px}
.note{font-weight:800;color:var(--muted);margin:8px 0 0;font-size:1rem}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.check{background:#2457a6;color:#fff;border:3px solid #000;border-radius:14px;padding:10px 26px;font-size:1.25rem;font-weight:900;box-shadow:0 5px 0 #12305e}
.check:active{transform:translateY(3px);box-shadow:0 2px 0 #12305e}
.check[disabled]{opacity:.45;cursor:default}
.ear2{border:2px solid var(--ink);background:#fff;border-radius:10px;font-size:1.1rem;padding:3px 9px;font-weight:800}
.self{margin-top:12px;border:2px solid var(--ink);border-radius:12px;background:#fffbea;padding:10px 12px}
.self .q{font-weight:900;font-size:1.05rem}
.self .q2{font-weight:700;color:var(--muted);margin:2px 0 8px}
.yes{background:var(--bean);color:#fff;border:2px solid #000;border-radius:12px;padding:8px 16px;font-weight:900;font-size:1.05rem}
.notyet{background:#fff;color:var(--ink);border:2px solid #000;border-radius:12px;padding:8px 16px;font-weight:900;font-size:1.05rem}
.okmark{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:var(--bean);font-size:1.15rem}
.fixmsg{margin-top:8px;font-weight:800;color:#5b3a00}
.artcol{flex:0 0 240px}
.art{border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 rgba(0,0,0,.18);padding:4px;display:block}
.art svg{width:100%;height:auto;display:block}
.artcol .cap{font-weight:800;text-align:center;margin-top:4px;font-size:.95rem}
.hidden{display:none !important}
.aloudline{min-height:70px;padding:4px 10px}
.aloudline .ans{font-size:clamp(2rem,5vw,3.4rem)}
/* lift the sitewide tap hint above the slide buttons */
.gal-listen-hint{bottom:92px !important}

/* picture slides */
.picbox{flex:1 1 380px;max-width:470px;border:3px solid #000;border-radius:12px;background:#fff;padding:6px;box-shadow:4px 4px 0 rgba(0,0,0,.22)}
.picbox img{width:100%;height:auto;display:block;border-radius:6px}
.picbox .lbl{font-weight:900;font-size:1.3rem;margin:4px 4px 0}
.picbox .credit{font-size:.78rem;color:var(--muted);margin:0 4px}
.models{list-style:none;padding:0;margin:8px 0 0}
.models li{border:2px solid var(--bean);background:var(--leaf);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:1.3rem;font-weight:900;color:#145e30;display:flex;gap:8px;align-items:center;animation:pop .35s ease-out}

/* circle slides */
.circ{position:relative;display:inline-block}
.circ svg.ring{position:absolute;left:50%;top:50%;width:1.6em;height:1.6em;transform:translate(-50%,-50%);overflow:visible;pointer-events:none}
.circ svg.ring ellipse{fill:none;stroke:#d64545;stroke-width:5;stroke-dasharray:200;stroke-dashoffset:200;animation:draw .8s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* spell aloud */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.chip{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:1.05rem}
.chip.on{background:var(--ink);color:#fff}
.chip.done::after{content:' ✓';color:var(--bean2)}
.own{display:flex;gap:6px;align-items:center}
.own input{border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:1rem;width:170px}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.letters span{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:64px;border:3px solid var(--bean);background:#fff;border-radius:10px;font-size:2.4rem;font-weight:900;color:var(--bean);animation:pop .3s ease-out both}
.letters span.gap{border:0;background:none;min-width:22px}

/* intro + end */
.introgrid{display:flex;flex-wrap:wrap;gap:18px;align-items:center;width:100%}
.introart{flex:1 1 320px;max-width:460px}
.bigq{font-size:1.4rem;font-weight:900}
.endlist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.endlist button{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:5px 10px;font-weight:800}
.turnin{background:var(--bean);color:#fff;border:3px solid #000;border-radius:14px;padding:12px 30px;font-size:1.3rem;font-weight:900;box-shadow:0 5px 0 #0d4f25}
.members{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:1rem;width:100%;max-width:520px}

/* bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:3px solid #000;display:flex;align-items:center;gap:12px;padding:10px 14px}
#nav .nb{border:3px solid #000;border-radius:14px;padding:10px 22px;font-size:1.2rem;font-weight:900;background:#fff;color:var(--ink)}
#nav .nb.next{background:var(--ink);color:#fff;margin-left:auto}
#nav .nb.next.pulse{animation:pls 1.4s infinite}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(242,182,50,.9)}50%{box-shadow:0 0 0 9px rgba(242,182,50,0)}}
#nav .nb[disabled]{opacity:.35;cursor:default}
#prog{flex:1;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#prog i{display:block;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer}
#prog i.ok{background:var(--bean2)}#prog i.cur{background:var(--gold);transform:scale(1.25)}

/* lion + fireworks */
.lion{cursor:pointer}
.fw{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:300}

@media (max-width:980px){
  .dirgrid{grid-template-columns:1fr 1fr}
  .db.en{grid-column:1 / -1}
  .playcol{flex-basis:100%;flex-direction:row;justify-content:center}
  .artcol{flex:1 1 100%;max-width:300px;margin:0 auto}
}
@media (max-width:520px){
  .dirgrid{grid-template-columns:1fr}
  #nav .nb{padding:8px 12px;font-size:1rem}
  .play{width:104px;height:104px}
}
</style>
</head>
<body>

<!-- ===================== SIGN-IN ===================== -->
<div id="gate">
  <div class="box" translate="no">
    <span class="gart" id="gateArt"></span>
    <h2>Quiz Practice</h2>
    <p class="sub">Seedfolks · group practice. I am your group leader today.</p>
    <div class="row2">
      <div><label for="gfirst">First name</label><input id="gfirst" autocomplete="given-name"></div>
      <div><label for="glast">Last name</label><input id="glast" autocomplete="family-name"></div>
    </div>
    <label for="gmail">School email</label>
    <input id="gmail" type="email" placeholder="name@s.sfusd.edu" autocomplete="email">
    <div class="row2">
      <div><label for="gper">Period</label>
        <select id="gper"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
      <div><label for="glang">Your language</label><select id="glang"></select></div>
    </div>
    <label for="gmembers">Who is in your group? (optional)</label>
    <input id="gmembers" placeholder="Names of the other students">
    <button class="go" id="gbtn" type="button">Start</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<div id="neterr">⚠ Can’t reach the server — your work is not saved yet. Keep going; it will try again.</div>
<div id="trwarn">Please turn off the browser’s page translation — this page already shows your language.</div>

<div id="bar">
  <span class="ttl">Quiz Practice · Seedfolks</span>
  <div class="parts" id="parts"></div>
  <div class="sp">
    <label for="lang">My language</label>
    <select id="lang"></select>
    <span id="dot"></span><span id="savetxt"></span>
    <span id="who"></span>
  </div>
</div>

<main id="deck"></main>

<nav id="nav">
  <button class="nb" id="back" type="button">← Back</button>
  <div id="prog" aria-label="Slides"></div>
  <button class="nb next" id="next" type="button">Next →</button>
</nav>

<span id="canary" style="position:absolute;left:-9999px;top:0" aria-hidden="true">Hello friend</span>

/* ======================================================================
   SPEECH
   ====================================================================== */
var VOICE=null;
function pickVoice(){
  try{
    var vs=speechSynthesis.getVoices()||[];
    var pref=['Google US English','Samantha','Microsoft Aria','Microsoft Jenny','Alex'];
    for(var i=0;i<pref.length;i++){for(var j=0;j<vs.length;j++){if(vs[j].name.indexOf(pref[i])===0){VOICE=vs[j];return;}}}
    for(var k=0;k<vs.length;k++){if(/^en[-_]US/i.test(vs[k].lang)){VOICE=vs[k];return;}}
    for(var m=0;m<vs.length;m++){if(/^en/i.test(vs[m].lang)){VOICE=vs[m];return;}}
  }catch(e){}
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
var LN={a:'ay',b:'bee',c:'see',d:'dee',e:'E',f:'eff',g:'gee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zee'};
function letterSay(ch){
  var lo=ch.toLowerCase(); if(!LN[lo]) return ch;
  return (ch!==lo?'capital ':'')+LN[lo];
}
/* text for the ear: blanks are "blank", a lone I is "eye" */
function forEar(t){
  return String(t).replace(/[“”"]?_{2,}[“”"]?/g,' blank ').replace(/\bI\b(?=[\s.,!?]|$)/g,'eye').replace(/\s+/g,' ').trim();
}
var speakToken=0;
function stopTalk(){speakToken++;try{speechSynthesis.cancel();}catch(e){}setTalking(false);}
/* parts: array of {t:text, gap:ms after, rate, lang} */
function speakSeq(parts,done){
  stopTalk(); var my=++speakToken; var i=0;
  if(!window.speechSynthesis){if(done)done();return;}
  setTalking(true);
  function next(){
    if(my!==speakToken) return;
    if(i>=parts.length){setTalking(false);if(done)done();return;}
    var p=parts[i++]; var u=new SpeechSynthesisUtterance(p.t);
    if(p.lang&&!/^en/.test(p.lang)){u.lang=p.lang;}else{if(VOICE)u.voice=VOICE;u.lang='en-US';}
    u.rate=p.rate||0.85;
    var fired=false;
    function after(){if(fired)return;fired=true;setTimeout(next,p.gap||0);}
    u.onend=after;u.onerror=after;
    /* Chrome can drop onend; fall back on a length-based timer */
    setTimeout(after,Math.max(1600,p.t.length*140/(u.rate||1))+(p.gap||0));
    try{speechSynthesis.speak(u);}catch(e){after();}
  }
  next();
}
function say(t,rate,lang){speakSeq([{t:forEar(t),rate:rate||0.85,lang:lang}]);}
function spellParts(word,slow){
  var out=[],gap=slow?1100:650,r=slow?0.6:0.8;
  for(var i=0;i<word.length;i++){
    var c=word[i];
    if(c===' '){out.push({t:'new word',rate:r,gap:gap});continue;}
    out.push({t:letterSay(c),rate:r,gap:gap});
  }
  return out;
}
var TALKING=false;
function setTalking(on){
  TALKING=on;
  var p=document.querySelector('.play'); if(p)p.classList.toggle('talk',on);
  var l=document.querySelector('.db.lead'); if(l)l.classList.toggle('talk',on);
}

function hdr(pref){var h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};if(pref)h.Prefer=pref;return h;}
function save(){
  if(!ME||!LOADED) return;
  var row=[{email:ME.email,student_name:ME.name,period:ME.period,chapter:CHAPTER,version:VERSION,answers:W,turned_in:!!W.turned,updated_at:new Date().toISOString()}];
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,chapter,version',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify(row)})
   .then(function(r){if(r.ok){DIRTY=false;dot('ok','Saved');$('neterr').style.display='none';}else{dot('err','Not saved');$('neterr').style.display='block';}})
   .catch(function(){dot('err','Offline');$('neterr').style.display='block';});
}

function mergeIn(o){
  if(!o||typeof o!=='object')return;
  Object.keys(o.slides||{}).forEach(function(k){var a=o.slides[k],b=W.slides[k];
    if(!b){W.slides[k]=a;return;}
    b.plays=Math.max(b.plays||0,a.plays||0);b.misses=Math.max(b.misses||0,a.misses||0);b.checked=b.checked||a.checked;b.ok=b.ok||a.ok;});
  Object.keys(o.aloud||{}).forEach(function(k){var a=o.aloud[k],b=W.aloud[k];if(!b){W.aloud[k]=a;return;}b.ok=b.ok||a.ok;b.misses=Math.max(b.misses||0,a.misses||0);});
  if(Array.isArray(o.slots)&&o.slots.length===6)W.slots=o.slots;
  if(o.members&&!W.members)W.members=o.members;
  if(typeof o.cur==='number')W.cur=Math.max(0,Math.min(SLIDES.length-1,o.cur));
  W.lion=W.lion||o.lion; W.turned=W.turned||o.turned;
}
function load(cb){
  dot('saving','Loading…');
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=answers,turned_in&email=eq.'+encodeURIComponent(ME.email)+'&chapter=eq.'+CHAPTER+'&version=eq.'+VERSION,{headers:hdr()})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
   .then(function(rows){
     if(rows&&rows[0]){mergeIn(rows[0].answers);if(rows[0].turned_in)W.turned=true;}
     LOADED=true;$('neterr').style.display='none';dot('ok','Saved');setScore();
     if(DIRTY)save(); cb&&cb();
   })
   .catch(function(){
     $('neterr').style.display='block';dot('err','Not saved');cb&&cb();
     setTimeout(function(){if(!LOADED)load();},15000);
   });
}

/* ======================================================================
   TRANSLATION for languages beyond the six (proxy, 10 s timeout, 3 tries)
   ====================================================================== */
var TCACHE={};
function proxyTr(text,code,cb){
  var L=LBY[code]; var key=code+'|'+text; if(TCACHE[key]){cb(TCACHE[key]);return;}
  var tries=0;
  (function attempt(){
    tries++;
    var ctl=window.AbortController?new AbortController():null; var t=setTimeout(function(){if(ctl)ctl.abort();},10000);
    fetch(PROXY+'?action=translate&mode=sentence&idiom='+encodeURIComponent(text)+'&meaning=&lang='+encodeURIComponent(L?L[2]:code),ctl?{signal:ctl.signal}:{})
     .then(function(r){return r.json();})
     .then(function(d){clearTimeout(t);var tr=d&&d.ok&&d.translation;var out=tr&&(tr.equiv||tr.meaning);
        if(out){TCACHE[key]=out;cb(out);}else if(tries<3)attempt();else cb(null);})
     .catch(function(){clearTimeout(t);if(tries<3)attempt();else cb(null);});
  })();
}
function bidi(txt,rtl){var e=esc(txt);return rtl?e.replace(/“([^”]*)”/g,'<bdi dir="ltr">“$1”</bdi>'):e;}
function dirText(key,code,n){
  var d=DIR[key]||{}; var s=d[code];
  return s?String(s).replace('{n}',n||''):null;
}

    var wa=ART[WORD_ART[cur]]; if(wa)h+='<div class="artcol"><div class="art">'+wa+'</div></div>';
  } else if(s.kind==='end'){
    var got=0,missing=[];GRADED.forEach(function(g){if(W.slides[g.id]&&W.slides[g.id].ok)got++;else missing.push(g);});
    h+='<div class="introgrid"><div class="anscol"><p class="bigq">'+esc(DIR.end.en)+'</p><p class="note">Slides finished: <b>'+got+' of '+GRADED.length+'</b></p>'+
       (missing.length?'<p class="note">Go back and finish these:</p><div class="endlist">'+missing.map(function(g){return '<button type="button" data-goto="'+SLIDES.indexOf(g)+'">'+(SLIDES.indexOf(g)+1)+'. '+esc(g.kind==='pic'?'Picture '+g.n:g.kind==='circle'?(g.target==='cap'?'Circle the capital':'Circle the period'):g.kind==='aloud'?'Spell out loud':(g.ans||''))+'</button>';}).join('')+'</div>':'')+
       '<label class="note" for="members">Who is in your group?</label><br><input class="members" id="members" value="'+esc(W.members)+'" placeholder="Names of the other students"><br><br>'+
       (W.turned?'<p class="okmark">✓ Turned in. Thank you!</p>':'<button class="turnin" type="button" data-turnin="1">Turn in</button>')+'</div>'+
       '<div class="introart art">'+ART.trophy+'</div></div>';
  }
  h+='</section></div>';
  deck.innerHTML=h; LASTID=s.id;
  fillProxySlots(s); fillLine2();
  drawProg(); drawParts();
  $('back').disabled=W.cur===0; $('next').disabled=W.cur===SLIDES.length-1;
  $('next').classList.toggle('pulse',!!(st.ok||s.kind==='intro'));
  var egg=document.getElementById('lionEgg'); if(egg)egg.addEventListener('click',fireworks);
  window.scrollTo(0,0);
}
function ringSVG(){return '<svg class="ring" viewBox="-30 -30 60 60"><ellipse cx="0" cy="0" rx="24" ry="22"/></svg>';}
function lettersHTML(w){
  return '<div class="letters" style="margin-top:10px">'+w.split('').map(function(c,i){return c===' '?'<span class="gap"></span>':'<span style="animation-delay:'+(i*0.12)+'s">'+esc(c)+'</span>';}).join('')+'</div>';
}
function drawProg(){
  $('prog').innerHTML=SLIDES.map(function(s,i){var st=W.slides[s.id];return '<i class="'+(i===W.cur?'cur':(st&&st.ok?'ok':''))+'" data-goto="'+i+'" title="'+(i+1)+'"></i>';}).join('');
}
function drawParts(){
  var cur=SLIDES[W.cur].part;
  $('parts').innerHTML=[1,2,3,4].map(function(p){var first=0;for(var i=0;i<SLIDES.length;i++){if(SLIDES[i].part===p){first=i;break;}}
    return '<button class="pt'+(p===cur?' on':'')+'" type="button" data-goto="'+first+'">'+esc(PARTS[p])+'</button>';}).join('');
}
function bub(t){var b=$('bub');if(b)b.textContent=t;}

/* ---------- what Play says ---------- */
function playFor(s,slow){
  var r=slow?0.6:0.85;
  if(s.kind==='intro'){speakSeq([{t:forEar(DIR[s.dir].en),rate:slow?0.7:0.9}]);return;}
  if(s.kind==='word'){speakSeq([{t:s.ans,rate:r}]);return;}
  if(s.kind==='sent'){speakSeq([{t:s.ans,rate:slow?0.55:0.8}]);return;}
  if(s.kind==='cap'){speakSeq([{t:'capital '+LN[s.ans.toLowerCase()],rate:r}]);return;}
  if(s.kind==='letters'){speakSeq(spellParts(s.spell,slow));return;}
  if(s.kind==='pic'){speakSeq([{t:'Describe picture '+['','one','two','three','four'][s.n]+'.',rate:r}]);return;}
  if(s.kind==='circle'){speakSeq([{t:DIR[s.dir].en,rate:r}]);return;}
  if(s.kind==='aloud'){speakSeq([{t:'Spell the word: '+(W.aloudCur||s.words[0])+'.',rate:r}]);return;}
  if(s.kind==='end'){speakSeq([{t:DIR.end.en,rate:r}]);return;}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,i[data-goto]'); if(!t||!t.closest('#deck,#nav,#bar'))return;
  var s=SLIDES[W.cur], st=S(s.id);
  if(t.hasAttribute('data-goto')){go(+t.getAttribute('data-goto'));return;}
  if(t.hasAttribute('data-play')){st.plays=(st.plays||0)+1;playFor(s,false);bub(bubbleFor(s));touch();return;}
  if(t.hasAttribute('data-repeat')){st.plays=(st.plays||0)+1;st.repeats=(st.repeats||0)+1;playFor(s,true);touch();return;}
  if(t.hasAttribute('data-say-en')){say(String(DIR[s.dir].en).replace('{n}',s.n||''),0.9);return;}
  if(t.hasAttribute('data-say-slot')){var i=+t.getAttribute('data-say-slot'),code=W.slots[i],L=LBY[code];var tx=t.closest('.db').querySelector('.tx').textContent;speakSeq([{t:tx.replace(/_{2,}/g,' '),rate:0.9,lang:L?L[3]:code}]);return;}
  if(t.hasAttribute('data-check')){st.checked=true;touch();render();
    if(s.kind==='word'||s.kind==='sent'||s.kind==='cap')setTimeout(function(){playFor(s,false);},350);
    if(s.kind==='letters')setTimeout(function(){say(s.ans,0.85);},350);
    return;}
  if(t.hasAttribute('data-hear-ans')){if(s.kind==='letters')speakSeq(spellParts(s.ans,false));else playFor(s,false);return;}
  if(t.hasAttribute('data-hear-model')){say(s.models[+t.getAttribute('data-hear-model')],0.85);return;}
  if(t.hasAttribute('data-yes')){st.ok=true;st.at=new Date().toISOString();touch();render();cheer();return;}
  if(t.hasAttribute('data-notyet')){st.misses=(st.misses||0)+1;touch();
    var key=s.kind==='pic'?null:'fix';
    var m=$('fixmsg'); if(m){m.innerHTML=key?esc(DIR.fix.en)+(W.mine&&DIR.fix[W.mine]?'<br><span translate="no" lang="'+W.mine+'">'+esc(DIR.fix[W.mine])+'</span>':''):'Fix your sentence: a capital letter at the start, a period at the end. Then tap 👍.';}
    bub(QUIPS[(st.misses-1)%QUIPS.length]); return;}
  if(t.hasAttribute('data-word')){W.aloudCur=t.getAttribute('data-word');render();say(W.aloudCur,0.85);return;}
  if(t.hasAttribute('data-addown')){var v=($('ownw').value||'').trim().replace(/[^A-Za-z \-']/g,'').slice(0,24);if(v){if(!W.aloud[v])W.aloud[v]={checked:false,ok:false,misses:0};W.aloudCur=v;touch();render();say(v,0.85);}return;}
  if(t.hasAttribute('data-check-aloud')){var w=W.aloudCur||s.words[0];if(!W.aloud[w])W.aloud[w]={checked:false,ok:false,misses:0};W.aloud[w].checked=true;touch();render();speakSeq(spellParts(w,false));return;}
  if(t.hasAttribute('data-yes-aloud')){var w2=W.aloudCur||s.words[0];W.aloud[w2].ok=true;aloudScore();touch();render();cheer();return;}
  if(t.hasAttribute('data-notyet-aloud')){var w3=W.aloudCur||s.words[0];W.aloud[w3].misses=(W.aloud[w3].misses||0)+1;touch();var m2=$('fixmsg');if(m2)m2.textContent='Look at the green letters. Say them again, one at a time.';bub(QUIPS[(W.aloud[w3].misses-1)%QUIPS.length]);return;}
  if(t.hasAttribute('data-turnin')){W.members=($('members')&&$('members').value)||W.members;W.turned=true;touch();save();render();cheer();return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-slotsel')){var i=+t.getAttribute('data-slotsel');W.slots[i]=t.value;touch();render();return;}
  if(t.id==='members'){W.members=t.value;touch();}
});
document.addEventListener('input',function(e){if(e.target.id==='members'){W.members=e.target.value;touch();}});
function aloudScore(){
  var s=SLIDES.filter(function(x){return x.kind==='aloud';})[0];
  var n=Object.keys(W.aloud).filter(function(k){return W.aloud[k].ok;}).length;
  var st=S(s.id); st.checked=n>0; if(n>=3)st.ok=true;
}
var QUIPS=['Almost! Erase it and try one more time.','No problem — everybody fixes things. Try again.','Look closely, letter by letter. You can do it.','Ask your group: “Can you help me, please?”'];
function go(i){i=Math.max(0,Math.min(SLIDES.length-1,i));if(i===W.cur)return;W.cur=i;touch();render();}
$('next').addEventListener('click',function(){go(W.cur+1);});
$('back').addEventListener('click',function(){go(W.cur-1);});
document.addEventListener('keydown',function(e){
  if($('gate').style.display!=='none')return;
  if(/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||'')))return;
  if(e.key==='ArrowRight')go(W.cur+1); else if(e.key==='ArrowLeft')go(W.cur-1);
});

/* ---------- cheers + the lion ---------- */
function cheer(){burst(window.innerWidth/2,window.innerHeight*0.45,18);}
function fireworks(e){W.lion=true;touch();for(var k=0;k<4;k++)(function(k){setTimeout(function(){burst(80+Math.random()*(window.innerWidth-160),80+Math.random()*(window.innerHeight*0.5),28);},k*260);})(k);bub('You found the Galileo lion! 🦁');}
function burst(x,y,n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['#f2b632','#1e8c45','#c62828','#2457a6','#7d3c98'];
  for(var i=0;i<n;i++){var d=document.createElement('div');d.className='fw';d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%cols.length];document.body.appendChild(d);
    var a=Math.random()*Math.PI*2,r=60+Math.random()*120;
    d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+Math.sin(a)*r+'px) scale(.3)',opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=(function(d){return function(){d.remove();};})(d);}
}

/* ---------- "My language" picker ---------- */
function applyMine(code){
  W.mine=code||'';
  try{localStorage.setItem('vocab_lang',code);}catch(e){}
  if(code&&W.slots.indexOf(code)<0){ /* the least-used of the six makes room (this year: Nepali first, then Thai) */
    var drop=W.slots.slice().sort(function(x,y){return GATE_ORDER.indexOf(y)-GATE_ORDER.indexOf(x);})[0];
    W.slots=[code].concat(W.slots.filter(function(c){return c!==drop;}));}
  if($('lang').value!==code)$('lang').value=code;
}
$('lang').addEventListener('change',function(){applyMine(this.value);touch();render();});

/* ======================================================================
   SIGN-IN
   ====================================================================== */
function canon(raw){var m=String(raw||'').trim().toLowerCase();return m.replace(/@s\.sfusd\.edu$/,'@sfusd.edu');}
function validMail(m){return /^[^@\s]+@(s\.)?sfusd\.edu$/.test(String(m||'').trim().toLowerCase());}
(function initGate(){
  var opts=GATE_ORDER.map(function(c){return '<option value="'+c+'">'+esc(LBY[c][1])+' — '+esc(LBY[c][2].replace(/ \(.*\)/,''))+'</option>';}).join('');
  $('glang').innerHTML='<option value="">Choose…</option>'+opts;
  $('lang').innerHTML=GATE_ORDER.map(function(c){return '<option value="'+c+'">'+esc(LBY[c][1])+'</option>';}).join('');
  $('gateArt').innerHTML=ART.lion;
  try{var v=localStorage.getItem('vocab_lang');if(v&&LBY[v])$('glang').value=v;
      var g=localStorage.getItem('gal_student_email');if(g&&!$('gmail').value)$('gmail').value=g;}catch(e){}
})();
$('gbtn').addEventListener('click',function(){
  var f=$('gfirst').value.trim(),l=$('glast').value.trim(),raw=$('gmail').value.trim().toLowerCase(),p=$('gper').value,lg=$('glang').value;
  var err=$('gerr');
  if(!f||!l){err.textContent='Please write your first and last name.';return;}
  if(!validMail(raw)){err.textContent='Please use your school email — it ends with @s.sfusd.edu';return;}
  if(!p){err.textContent='Please choose your period.';return;}
  if(!lg){err.textContent='Please choose your language.';return;}
  var email=canon(raw);
  ME={name:f+' '+l,email:email,period:p};
  if(raw!==email){fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{alias_email:raw,email:email}])}).catch(function(){});}
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:hdr('resolution=ignore-duplicates,return=minimal'),body:JSON.stringify([{email:email,name:ME.name,period:p}])}).catch(function(){});
  try{localStorage.setItem('gal_student_email',email);}catch(e){}
  W.members=$('gmembers').value.trim()||W.members;
  $('gate').style.display='none';
  $('who').textContent=ME.name+' · P'+p;
  load(function(){
    applyMine(lg);
    if($('gmembers').value.trim())W.members=$('gmembers').value.trim();
    render(); touch();
  });
});
$('gmail').addEventListener('keydown',function(e){if(e.key==='Enter')$('gbtn').click();});
