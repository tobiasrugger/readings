<style>
:root{--pine:#1b4332;--pine2:#2d6a4f;--ink:#1f2421;--muted:#4f5d55;--paper:#f4f5f2;--gold:#d4a017;--edge:#2b3a33;--yellow:#fff1bf}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5}
#bar{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#bar .brand{font-weight:900;font-size:1.05rem;margin-right:auto}
#bar .brand small{display:block;font-weight:700;font-size:.72rem;opacity:.85}
#bar a,#bar button,#bar select{font-family:inherit;font-size:.84rem;font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 11px;text-decoration:none;cursor:pointer}
#bar select option{color:#000}
main{max-width:980px;margin:0 auto;padding:14px 14px 80px}
.dir{margin:0 0 4px;font-weight:700}
.dirtr{display:block;color:var(--pine2);font-weight:800}
.dirtr:empty{display:none}
.box{background:#fff;border:2.5px solid var(--edge);border-radius:14px;padding:12px 14px;margin:0 0 16px;box-shadow:0 3px 0 rgba(27,67,50,.2);display:flow-root;break-inside:avoid}
.box h2{margin:0 0 8px;font-size:1.2rem;color:var(--pine);display:flex;gap:8px;align-items:center}
.box svg.fl{float:right;width:150px;height:auto;margin:0 0 8px 14px}
.grid{columns:2;column-gap:16px}
.grid .box{display:inline-block;width:100%}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1.5px solid #c9d1cb;padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.04em;color:var(--muted)}
td.en{font-weight:900;width:46%}
td.en .w{font-size:1.08rem}
td.ex{font-size:.92rem;color:#2d3a33}
.tr{font-weight:800;color:var(--pine2)}
.tr b{text-decoration:underline}
.tr.none b{color:#6b7280}
.tr.ex{font-weight:700;font-size:.88rem;display:block}
.spk{border:1.5px solid #8aa094;background:#fff;border-radius:50%;width:28px;height:28px;font-size:.8rem;cursor:pointer;vertical-align:middle;margin-left:4px;line-height:1}
.pic{font-size:1.5rem;width:44px;text-align:center}
.pic svg{width:42px;height:42px}
.words{columns:2;column-gap:16px}
.wcard{display:flex;gap:8px;align-items:center;border:2px solid var(--edge);border-radius:10px;padding:5px 8px;margin:0 0 7px;break-inside:avoid;background:#fff}
.wcard .w{font-weight:900;font-size:1.08rem}
.wcard .t{font-size:.95rem}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl .btn{font-family:inherit;font-weight:800;font-size:.9rem;border:0;border-radius:10px;padding:9px 14px;background:var(--pine2);color:#fff;cursor:pointer}
.ctl .btn.gold{background:var(--gold);color:#2b1b00}
.ctl .btn.ghost{background:#fff;color:var(--pine);border:2px solid var(--pine2)}
#status{font-size:.85rem;color:var(--muted);font-weight:700}
/* T-338: in Fix mode every translation is a yellow box with ✎; empty ones say "type here" */
.edit .tr[data-fix]{outline:3px solid #e0b100;outline-offset:1px;background:#fff6c7;border-radius:6px;padding:2px 22px 2px 6px;cursor:text;min-width:70px;min-height:1.4em;display:inline-block;position:relative}
.edit .tr[data-fix]::after{content:'\270E';position:absolute;right:5px;top:1px;color:#8a6a00;font-size:.9em}
.edit .tr.none:not([contenteditable="true"]) b,.edit .tr.pending:not([contenteditable="true"]) b{display:none}
.edit .tr.none:not([contenteditable="true"])::before,.edit .tr.pending:not([contenteditable="true"])::before{content:'empty \2014  type here';color:#8a6a00;font-style:italic;font-weight:700}
.edit .tr[contenteditable="true"]{background:#fff;outline-color:#2d6a4f}
#status.editbar{position:fixed;left:10px;right:10px;bottom:10px;z-index:90;background:#1b4332;color:#fff;font-size:1rem;padding:10px 14px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);text-align:center}
#printHead{display:none}
.wcard .lw{display:none}
.lcol{display:none}
/* ===== print: one table copy, three languages (or one) ===== */
@media print{
 @page{size:letter portrait;margin:9mm}
 body{background:#fff;font-size:10.5px;line-height:1.3}
 #bar,.screen,.spk,.tr.ex{display:none !important}
 main{padding:0;max-width:none}
 #printHead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2.5px solid #000;margin:0 0 6px;padding-bottom:3px}
 #printHead b{font-size:1.25rem}
 .box{padding:5px 7px;margin:0 0 6px;border-width:1.8px;box-shadow:none;border-radius:8px}
 .box h2{font-size:.95rem;margin:0 0 3px}
 .box svg.fl{display:none}
 td.en{width:31%}
 td.ex{display:none}
 .lcol{overflow-wrap:anywhere}
 table{table-layout:fixed}
 .grid{columns:2;column-gap:8px}
 td,th{padding:1px 3px;border-bottom-width:1px}
 td.en .w{font-size:.95rem}
 td.ex{font-size:.82rem}
 .pic{width:22px;font-size:.95rem}.pic svg{width:20px;height:20px}
 .tr.one{display:none}
 .lcol{display:table-cell;font-weight:800;font-size:.86rem}
 .words{columns:3;column-gap:6px}
 .wcard{padding:1px 4px;margin:0 0 2px;border-width:1.2px;gap:4px;border-radius:5px}
 .wcard .w{font-size:.9rem}
 .wcard .t{font-size:.8rem}
 .wcard .lw{display:block;font-size:.78rem;font-weight:800}
}
@media (max-width:640px){.grid,.words{columns:1}.box svg.fl{width:96px}}
</style>

];
var LESSON_BOX={
 'u1-l1':{title:'School places',art:'school',rows:null},
 'u1-l2':{title:'Meeting people',art:'hello',rows:[['Hi! / Hello!','Hi, I'+Q+'m Amira.'],['My name is …','My name is Jun.'],['Nice to meet you.','Nice to meet you too.'],['How do you spell that?','How do you spell your name?'],['Can you please repeat that?','Can you please repeat that?']]},
 'u1-l3':{title:'Letters',art:'abc',rows:[['the alphabet','The alphabet has twenty-six letters.'],['vowels: a e i o u','A is a vowel.'],['consonant','B is a consonant.'],['uppercase · lowercase','A is uppercase. a is lowercase.'],['spell','Please spell your name.']]},
 'u1-l4':{title:'Numbers',art:'num',rows:[['one · two · three · four · five','I have five pencils.'],['six · seven · eight · nine · ten','There are ten desks.'],['eleven · twelve · thirteen · fourteen · fifteen','I am fifteen years old.'],['sixteen · seventeen · eighteen · nineteen · twenty','There are twenty students.'],['thirty · forty · fifty','Forty has no U.'],['sixty · seventy · eighty · ninety · one hundred','One hundred is 100.']]},
 'u1-l5':{title:'Countries and languages',art:'globe',rows:[['I am from …','I am from Guatemala.'],['I speak …','I speak Spanish and English.'],['bilingual','Amira is bilingual. She speaks two languages.'],['China · Chinese','Jun is from China. He speaks Chinese.'],['Yemen · Arabic','Amira is from Yemen. She speaks Arabic.'],['Vietnam · Vietnamese','Linh speaks Vietnamese.']]}
};
function lessonBoxes(L){var keys=L?[L]:Object.keys(LESSON_BOX);return keys.map(function(k){var b=JSON.parse(JSON.stringify(LESSON_BOX[k]));b.id='l_'+k;
 if(!b.rows)b.rows=(DATA?DATA.places:[]).map(function(p){var w=(DATA.where.filter(function(x){return x.p===p;})[0]);return [p.replace(/'/g,Q),w?((/👩/.test(w.e)?'She ':'He ')+w.s+'.').replace(/'/g,Q):''];});
 return b;});}
function wordList(L){if(!DATA)return [];var out=[],seen={};
 function add(w,e){w=String(w).replace(/^(a|an|my|our|the) /,'');if(seen[w])return;seen[w]=1;out.push({w:w,e:e});}
 DATA.people.forEach(function(p){if(!L||p.t===L)add(p.n,p.e.split(' ').pop()==='🎓'?p.e:p.e);});
 DATA.things.forEach(function(t){if(!L||t.t===L)add(t.n,t.e);});
 if(!L||L==='u1-l1')DATA.places.forEach(function(p){add(p.replace(/'/g,Q),'🏫');});
 return out;}

/* ---------- translations (shared cache: song_tr, slug basics-ref) ---------- */
var TR={},TEACH={};  /* TR[lang][src]=text */
function key(l,s){return l+'\u0001'+s;}
function cacheLoad(langs,cb){if(!langs.length){cb();return;}
 fetch(SUPA_URL+'/rest/v1/song_tr?slug=eq.'+SLUG+'&lang=in.('+langs.map(function(l){return encodeURIComponent('"'+l+'"');}).join(',')+')&select=lang,src,equiv,note',{headers:H()})
 .then(function(r){return r.ok?r.json():[];}).then(function(rows){(rows||[]).forEach(function(r){TR[r.lang]=TR[r.lang]||{};TR[r.lang][r.src]=r.equiv||'';if(r.note==='teacher')TEACH[key(r.lang,r.src)]=1;});cb();}).catch(function(){cb();});}
function cacheSave(l,s,t,teacher){fetch(SUPA_URL+'/rest/v1/song_tr?on_conflict=slug,lang,src',{method:'POST',headers:H(teacher?'resolution=merge-duplicates,return=minimal':'resolution=ignore-duplicates,return=minimal'),
 body:JSON.stringify([{slug:SLUG,lang:l,src:s,equiv:t,meaning:'',note:teacher?'teacher':'auto',updated_at:new Date().toISOString()}])}).catch(function(){});}
var QUEUE=[],RUNNING=0,MAXRUN=4,PENDING={};
function want(l,s){if(!l||!s)return;TR[l]=TR[l]||{};if(TR[l][s]!=null)return;var k=key(l,s);if(PENDING[k])return;PENDING[k]=1;QUEUE.push([l,s]);pump();}
function pump(){status();while(RUNNING<MAXRUN&&QUEUE.length){var job=QUEUE.shift();RUNNING++;(function(l,s){
 var mode=s.split(/\s+/).length<=3?'word':'sentence';
 fetch(PROXY+'?action=translate&mode='+mode+'&idiom='+encodeURIComponent(s)+'&meaning=&lang='+encodeURIComponent(l)).then(function(r){return r.json();})
 .then(function(d){var t=d&&d.translation?(d.translation.equiv||d.translation.meaning||''):'';TR[l][s]=t;if(t)cacheSave(l,s,t,false);})
 .catch(function(){TR[l][s]='';})
 .then(function(){RUNNING--;delete PENDING[key(l,s)];paint(l,s);pump();});})(job[0],job[1]);}}
function status(){if(EDIT)return;var n=QUEUE.length+RUNNING;$('status').textContent=n?'Translating… '+n+' left':'';} /* T-338: never wipe the Fix-mode help */
function trHTML(l,s,cls){var t=(TR[l]||{})[s];if(t==null){want(l,s);return '<span class="tr pending '+(cls||'')+'" data-l="'+esc(l)+'" data-s="'+esc(s)+'" data-fix="1"><b>…</b></span>';}
 return '<span class="tr '+(cls||'')+(t?'':' none')+'" data-l="'+esc(l)+'" data-s="'+esc(s)+'" data-fix="1"><b>'+esc(t||s)+'</b></span>';}
function paint(l,s){document.querySelectorAll('.tr[data-l]').forEach(function(e){if(e.getAttribute('data-l')===l&&e.getAttribute('data-s')===s){var t=TR[l][s];e.classList.remove('pending');e.classList.toggle('none',!t);e.innerHTML='<b>'+esc(t||s)+'</b>';}});}

/* ---------- render ---------- */
function rowsHTML(b,langs,one){
 return '<table><tbody>'+b.rows.map(function(r){var pic=b.id==='who'?'<td class="pic">'+pronPic(r[2])+'</td>':'';
  return '<tr>'+pic+'<td class="en"><span class="w">'+esc(r[0])+'</span><button class="spk" onclick="speak(this.previousSibling.textContent)" aria-label="Listen">&#128266;</button>'+
   (one?'<br>'+trHTML(one,r[0],'one'):'')+'</td>'+
   langs.map(function(l){return '<td class="lcol">'+trHTML(l,r[0])+'</td>';}).join('')+
   '<td class="ex">'+esc(r[1])+(r[1]?'<button class="spk" onclick="speak(this.previousSibling.textContent)" aria-label="Listen">&#128266;</button>':'')+(one&&r[1]?trHTML(one,r[1],'ex'):'')+'</td></tr>';}).join('')+'</tbody></table>';}
function render(){var L=$('lesson').value,one=lang(),langs=PRINT_LANGS||[];
 var boxes=GRAM.concat(lessonBoxes(L));
 var h='<div class="grid">'+boxes.map(function(b){return '<div class="box"><h2>'+esc(b.title)+'</h2>'+(b.art?ART[b.art]:'')+rowsHTML(b,langs,one)+'</div>';}).join('')+'</div>';
 var ws=wordList(L);
 h+='<div class="box"><h2>Words'+(L?' &middot; '+esc($('lesson').selectedOptions[0].textContent):' &middot; Unit 1')+'</h2>'+ART.school.replace('class="fl"','class="fl screen"')+'<div class="words">'+ws.map(function(w){
  return '<div class="wcard"><span class="pic">'+w.e+'</span><span><span class="w">'+esc(w.w)+'</span><button class="spk" onclick="speak(\''+esc(w.w).replace(/'/g,"\\'")+'\')" aria-label="Listen">&#128266;</button><br>'+
   (one?'<span class="t">'+trHTML(one,w.w,'one')+'</span>':'')+langs.map(function(l){return '<span class="lw">'+trHTML(l,w.w)+'</span>';}).join('')+'</span></div>';}).join('')+'</div></div>';
 $('content').innerHTML=h;
 $('phLesson').textContent=L?$('lesson').selectedOptions[0].textContent:'Unit 1';
 $('phLangs').textContent=langs.join(' · ');
 $('back').href='/readings/basics/'+(L?'?lesson='+L:'');
 if(EDIT){document.body.classList.add('edit');editHelp();}
}
function allStrings(L){var s=[];GRAM.concat(lessonBoxes(L)).forEach(function(b){b.rows.forEach(function(r){s.push(r[0]);if(r[1])s.push(r[1]);});});wordList(L).forEach(function(w){s.push(w.w);});return s;}
function printLangs(ls){ls=ls.filter(Boolean);if(!ls.length){alert('Choose a language at the top first.');return;}
 cacheLoad(ls,function(){PRINT_LANGS=ls;var keep=$('lang').value;$('lang').value='';render();$('lang').value=keep;
  (function wait(n){if((QUEUE.length+RUNNING)>0&&n<240){setTimeout(function(){wait(n+1);},500);return;}window.print();})(0);});}
window.addEventListener('afterprint',function(){PRINT_LANGS=null;render();});

/* ---------- teacher fix ---------- */
var EDIT=false;
function teacherFix(){if(!EDIT){var pw=prompt('Teacher password');if(pw!=='galileo2026')return;}EDIT=!EDIT;document.body.classList.toggle('edit',EDIT);$('fixBtn').textContent=EDIT?'✓ Done fixing':'✎ Fix a translation (teacher)';editHelp();}
function editHelp(){var st=$('status');st.classList.toggle('editbar',EDIT);if(!EDIT){st.textContent='';return;}
 st.textContent=lang()?'✎ Fix mode: click any yellow box, type the right translation, then click away. It is saved for everyone. Empty boxes say “type here”.':'✎ Fix mode: first choose a language in the green bar at the top. Its translations will show as yellow boxes you can click.';}
document.addEventListener('click',function(e){if(!EDIT)return;var t=e.target.closest&&e.target.closest('.tr[data-fix]');if(!t||t.isContentEditable)return;if(t.classList.contains('none')||t.classList.contains('pending'))t.innerHTML='';t.contentEditable='true';t.focus();
 try{var rg=document.createRange();rg.selectNodeContents(t);var sl=getSelection();sl.removeAllRanges();sl.addRange(rg);}catch(x){}
 t.addEventListener('blur',function once(){t.removeEventListener('blur',once);t.contentEditable='false';var l=t.getAttribute('data-l'),s=t.getAttribute('data-s'),v=t.textContent.trim();
  if(v&&v!==(TR[l]||{})[s]){TR[l][s]=v;TEACH[key(l,s)]=1;cacheSave(l,s,v,true);$('status').textContent='✓ Saved: '+s+' → '+v+' — click another yellow box, or ✓ Done fixing.';}paint(l,s);});},true);

/* ---------- directions in the student's language ---------- */
function dirs(){var l=lang();document.querySelectorAll('.dir').forEach(function(p){var o=p.querySelector('.dirtr');if(!o){o=document.createElement('span');o.className='dirtr';p.appendChild(o);}
 if(!l){o.textContent='';return;}var en=p.getAttribute('data-en');var t=(TR[l]||{})[en];if(t!=null){o.textContent=t;return;}
 fetch(PROXY+'?action=translate&mode=sentence&idiom='+encodeURIComponent(en)+'&meaning=&lang='+encodeURIComponent(l)).then(function(r){return r.json();}).then(function(d){o.textContent=d&&d.translation?(d.translation.equiv||d.translation.meaning||''):'';}).catch(function(){});});}

/* ---------- boot: words come from the live Daily Basics pool ---------- */
function boot(){var q=new URLSearchParams(location.search),saved='';try{saved=localStorage.getItem('vocab_lang')||localStorage.getItem('eld103_lang')||'';}catch(e){}
 var l=q.get('lang')||saved;if(l){$('lang').value=l;if($('lang').value!==l)$('lang').value='';}
 if(q.get('lesson'))$('lesson').value=q.get('lesson');
 $('lang').onchange=function(){try{if(lang())localStorage.setItem('vocab_lang',lang());}catch(e){}cacheLoad([lang()].filter(Boolean),function(){render();dirs();});};
 $('lesson').onchange=function(){render();};
 fetch('/readings/basics/index.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(src){
  var m=src.match(/\nvar DATA=\{[\s\S]*?\n\};/);if(m){try{(0,eval)(m[0]);}catch(e){console.error(e);}}
 }).catch(function(){}).then(function(){cacheLoad([lang()].filter(Boolean),function(){render();dirs();});});}
boot();
