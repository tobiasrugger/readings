<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Basics · print &amp; project · Mr. Toby</title>
<meta name="build" content="basics/print T-105 2026-10-22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#23302b;--muted:#5c6b62;--pine:#1f4536;--pine2:#2d6a4f;--cream:#f7f1e3;--line:#8aa094;--gold:#F8981F;--sky:#e8f3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,Arial,sans-serif;font-size:16px;
 padding-top:env(safe-area-inset-top,0px)}
header{background:var(--pine);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:1.14rem;margin:0;font-weight:900}
header small{display:block;font-size:.78rem;opacity:.85;font-weight:700}
header a.home,header a.app{color:#fff;text-decoration:none;font-weight:800;font-size:.8rem;background:rgba(255,255,255,.14);
 border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 12px}
header a.home:hover,header a.app:hover{background:rgba(255,255,255,.26)}
header .sp{margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:16px}
.panel{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:14px 16px;margin:0 0 18px;box-shadow:0 3px 0 rgba(35,48,43,.15)}
.panel h2{margin:0 0 10px;font-size:1rem;color:var(--pine);font-weight:900}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
label.f{font-weight:800;font-size:.86rem;color:var(--muted)}
select,input[type=number],input[type=text]{font-family:inherit;font-size:1rem;font-weight:700;padding:9px 12px;
 border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btn{font-family:inherit;font-weight:800;font-size:1rem;border:0;border-radius:11px;padding:11px 20px;cursor:pointer;
 background:var(--pine2);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.gold{background:var(--gold);color:#2b1b35}
.btn.ghost{background:#fff;color:var(--pine);border:2px solid var(--line);box-shadow:none}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:.9rem;border:2px solid var(--line);
 border-radius:10px;padding:8px 12px;background:#fff;cursor:pointer}
.chk input{width:17px;height:17px}

/* ---------- the sheet ---------- */
#sheet{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:22px 24px}
.sheethead{display:flex;align-items:flex-end;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.sheethead .t{font-size:1.32rem;font-weight:900;color:var(--pine)}
.sheethead .t small{display:block;font-size:.78rem;font-weight:700;color:var(--muted)}
.sheethead .nm{margin-left:auto;font-size:.92rem;font-weight:800;color:var(--muted);text-align:right;line-height:2.1}
.sheethead .nm u{display:inline-block;min-width:168px;border-bottom:2px solid var(--ink);text-decoration:none}
.qlist{column-count:2;column-gap:28px}
.q{break-inside:avoid;page-break-inside:avoid;border:2px solid var(--line);border-radius:10px;padding:9px 11px;margin:0 0 10px;background:#fff}
.q .n{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--pine2);color:#fff;
 font-size:.8rem;font-weight:900;margin-right:7px;vertical-align:1px}
.q .pic{font-size:1.5rem;letter-spacing:2px;margin:0 0 3px}
.q .txt{font-size:1.04rem;font-weight:700;line-height:1.45}
.q .opts{margin-top:6px;font-size:.95rem;font-weight:700;color:var(--muted)}
.q .opts span{display:inline-block;border:1.5px solid var(--line);border-radius:7px;padding:2px 9px;margin:3px 6px 0 0;background:var(--sky)}
.q .blank{display:inline-block;min-width:96px;border-bottom:2.5px solid var(--gold)}
.key{margin-top:16px;border-top:3px dashed var(--ink);padding-top:10px}
.key h3{margin:0 0 6px;font-size:.92rem;color:var(--pine);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.key ol{margin:0;padding-left:20px;column-count:3;column-gap:20px;font-size:.86rem;font-weight:700;color:var(--muted)}
.key li{break-inside:avoid;margin-bottom:2px}
.key b{color:var(--pine)}

/* ---------- projector ---------- */
body.proj header,body.proj .panel{display:none}
body.proj main{max-width:none;padding:0}
body.proj #sheet{border:0;border-radius:0;padding:26px 30px;min-height:100vh}
body.proj .sheethead .nm{display:none}
body.proj .qlist{column-count:3;column-gap:26px}
body.proj .q .txt{font-size:1.5rem}
body.proj .q .opts{font-size:1.25rem}
body.proj .q .pic{font-size:2.1rem}
body.proj .q .n{width:30px;height:30px;font-size:1rem}
body.proj .sheethead .t{font-size:2rem}
#projbar{display:none;position:fixed;right:14px;bottom:14px;gap:8px;z-index:50}
body.proj #projbar{display:flex}

@media print{
 @page{size:letter portrait;margin:12mm}
 body{background:#fff}
 header,.panel,#projbar{display:none !important}
 main{padding:0;max-width:none}
 #sheet{border:0;border-radius:0;padding:0}
 .q{border-color:#555}
 .key{page-break-before:auto}
}
@media (max-width:700px){.qlist{column-count:1}}
</style>
</head>
<body>
<header>
  <a class="home" href="/readings/dashboards/">&#8592; All dashboards</a>
  <div><h1>Daily Basics &mdash; print &amp; project<small>Make a paper sheet, or put the whole set on the board</small></h1></div>
  <span class="sp"></span>
  <a class="app" href="/readings/basics/">Open the tap-through version &rarr;</a>
</header>
<main>

<div class="panel">
  <h2>1 &middot; What goes on the sheet</h2>
  <div class="row">
    <label class="f" for="lesson">Lesson first</label>
    <select id="lesson">
      <option value="">Mixed &mdash; everything</option>
      <option value="u1-l1">u1-l1 &middot; People at School</option>
      <option value="u1-l2">u1-l2 &middot; Introductions</option>
      <option value="u1-l3">u1-l3 &middot; From A to Z</option>
      <option value="u1-l4">u1-l4 &middot; 0 to 100</option>
      <option value="u1-l5">u1-l5 &middot; About Me</option>
    </select>
    <label class="f" for="howmany">How many</label>
    <select id="howmany">
      <option value="12">12 &mdash; one do-now</option>
      <option value="20" selected>20 &mdash; one page</option>
      <option value="30">30 &mdash; front and back</option>
      <option value="40">40 &mdash; a whole packet</option>
    </select>
    <label class="f" for="period">Class</label>
    <input type="text" id="period" placeholder="Period 3" size="9">
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="showOpts" checked> Show the answer choices</label>
    <label class="chk"><input type="checkbox" id="showKey"> Answer key at the end</label>
    <label class="chk"><input type="checkbox" id="showPics" checked> Pictures</label>
  </div>
  <div class="row">
    <button class="btn gold" onclick="build()">&#127922; Make a new sheet</button>
    <button class="btn" onclick="window.print()">&#128424;&#65039; Print</button>
    <button class="btn ghost" onclick="projector(true)">&#128250; Put it on the board</button>
  </div>
  <p id="note" style="margin:4px 0 0;font-size:.86rem;color:var(--muted)"></p>
</div>

<div id="sheet"></div>
</main>

<div id="projbar">
  <button class="btn ghost" onclick="projKey()">Show answers</button>
  <button class="btn" onclick="projector(false)">Done</button>
</div>

<script src="/readings/wit/items.js"></script>
<script>
/* ============================================================
   The pools and the question-maker are NOT copied here.
   They are read out of readings/basics/index.html at load time,
   so this sheet can never drift from the tap-through activity.
   ============================================================ */
var DATA=null, ITEMS=[], ST={A:{},email:'print'}, RND=Math.random, LESSON='', TODAY='';
var SRC_OK=false;

function seed(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
 return function(){h+=0x6D2B79F5;var t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(RND()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function art(n){return /^[aeiou]/i.test(n)?'an':'a';}
function plural(n){return /y$/.test(n)?n.replace(/y$/,'ies'):/(s|sh|ch|x)$/.test(n)?n+'es':n+'s';}
var buildItems=null;

function grab(src,startRe,endStr){
 var m=src.match(startRe); if(!m) return null;
 var i=m.index, j=src.indexOf(endStr,i); if(j<0) return null;
 return src.slice(i,j+endStr.length);
}
function loadSource(cb){
 fetch('/readings/basics/index.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(src){
  var dataSrc=grab(src,/var DATA=\{/,'\n};');
  var fnSrc=grab(src,/function buildItems\(\)\{/,'\n}');
  if(!dataSrc||!fnSrc){cb(false);return;}
  try{
   /* jshint evil:true */
   (0,eval)(dataSrc);                       /* defines DATA */
   buildItems=(0,eval)('('+fnSrc+')');      /* the live question-maker */
   SRC_OK=!!(DATA&&DATA.people&&DATA.where&&buildItems);
   cb(SRC_OK);
  }catch(e){console.error(e);cb(false);}
 }).catch(function(e){console.error(e);cb(false);});
}

/* one run of the live maker = 12 questions; run it with fresh seeds until we have enough */
function makeQuestions(n,lesson){
 LESSON=lesson||'';
 var out=[],seen={},guard=0;
 while(out.length<n && guard++<60){
  TODAY='sheet-'+guard+'-'+Math.random();
  ST.email='sheet'+guard;
  ITEMS=[];
  buildItems();
  ITEMS.forEach(function(it){
   var key=it.q;
   if(seen[key]||out.length>=n)return;
   seen[key]=1;out.push(it);
  });
 }
 return out;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function qHTML(it,i){
 var showOpts=document.getElementById('showOpts').checked;
 var showPics=document.getElementById('showPics').checked;
 var txt=esc(it.q).replace('___','<span class="blank"></span>');
 var h='<div class="q">';
 if(showPics&&it.pic)h+='<div class="pic">'+it.pic+'</div>';
 h+='<div class="txt"><span class="n">'+(i+1)+'</span>'+txt+'</div>';
 if(showOpts)h+='<div class="opts">'+it.o.map(function(o){return '<span>'+esc(o)+'</span>';}).join('')+'</div>';
 return h+'</div>';
}
var LAST=[];
function build(){
 if(!SRC_OK){document.getElementById('sheet').innerHTML='<p style="font-weight:800;color:#b3261e">Could not read the Daily Basics questions from /readings/basics/index.html. Open <a href="/readings/basics/">the tap-through version</a> to check it is up.</p>';return;}
 var n=+document.getElementById('howmany').value;
 var lesson=document.getElementById('lesson').value;
 var cls=document.getElementById('period').value.trim();
 var qs=makeQuestions(n,lesson);
 LAST=qs;
 var names={'':'Mixed','u1-l1':'People at School','u1-l2':'Introductions','u1-l3':'From A to Z','u1-l4':'0 to 100','u1-l5':'About Me'};
 var d=new Date(), ds=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
 var h='<div class="sheethead"><div class="t">Daily Basics<small>'+esc(names[lesson]||lesson)+(cls?' &middot; '+esc(cls):'')+' &middot; '+ds+'</small></div>'
  +'<div class="nm">Name <u></u><br>Date <u></u></div></div>';
 h+='<div class="qlist">'+qs.map(qHTML).join('')+'</div>';
 if(document.getElementById('showKey').checked)h+=keyHTML(qs);
 document.getElementById('sheet').innerHTML=h;
 var msg=qs.length+' questions. Every sheet is different \u2014 press "Make a new sheet" for another one.';
 if(qs.length<n)msg=qs.length+' questions \u2014 that is every different question this pool can make right now'+(lesson?' with '+esc(names[lesson]||lesson)+' first':'')+'. Ask for more items in the pool if you want a longer sheet.';
 document.getElementById('note').textContent=msg;
}
function keyHTML(qs){
 return '<div class="key" id="keybox"><h3>Answer key</h3><ol>'
  +qs.map(function(it){return '<li><b>'+esc(it.o[it.a])+'</b></li>';}).join('')+'</ol></div>';
}
function projector(on){
 document.body.classList.toggle('proj',on);
 if(on&&!LAST.length)build();
 window.scrollTo(0,0);
}
function projKey(){
 var box=document.getElementById('keybox');
 if(box){box.remove();return;}
 document.getElementById('sheet').insertAdjacentHTML('beforeend',keyHTML(LAST));
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')projector(false);});

loadSource(function(ok){
 if(!ok){document.getElementById('note').textContent='Could not read the question pools from the Daily Basics page.';}
 build();
});
</script>
</body>
</html>
