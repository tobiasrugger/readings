<head>

<style>
:root{--ink:#23302b;--muted:#4a5952;--pine:#1f4536;--pine2:#2d6a4f;--cream:#f7f1e3;--line:#8aa094;--gold:#F8981F;--sky:#e8f3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,Arial,sans-serif;font-size:16px;padding-top:env(safe-area-inset-top,0px)}
header{background:var(--pine);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:1.14rem;margin:0;font-weight:900}
header small{display:block;font-size:.78rem;opacity:.85;font-weight:700}
header a.home,header a.app{color:#fff;text-decoration:none;font-weight:800;font-size:.8rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 12px}
header .sp{margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:16px}
.panel{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:14px 16px;margin:0 0 18px;box-shadow:0 3px 0 rgba(35,48,43,.15)}
.panel h2{margin:0 0 10px;font-size:1rem;color:var(--pine);font-weight:900}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
label.f{font-weight:800;font-size:.86rem;color:var(--muted)}
select,input[type=text]{font-family:inherit;font-size:1rem;font-weight:700;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btn{font-family:inherit;font-weight:800;font-size:1rem;border:0;border-radius:11px;padding:11px 20px;cursor:pointer;background:var(--pine2);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);color:#2b1b35}
.btn.ghost{background:#fff;color:var(--pine);border:2px solid var(--line);box-shadow:none}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:.9rem;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;cursor:pointer}
.chk input{width:17px;height:17px}
#note{margin:4px 0 0;font-size:.86rem;color:var(--muted)}
/* ---------- the sheet ---------- */
#sheet{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:20px 22px}
.pg+.pg{margin-top:26px;border-top:3px dashed var(--line);padding-top:18px}
.sheethead{display:flex;align-items:flex-end;gap:14px;border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.sheethead .t{font-size:1.25rem;font-weight:900;color:var(--pine)}
.sheethead .t small{display:block;font-size:.76rem;font-weight:700;color:var(--muted)}
.sheethead .nm{margin-left:auto;font-size:.88rem;font-weight:800;color:var(--muted);text-align:right;line-height:2}
.sheethead .nm u{display:inline-block;min-width:150px;border-bottom:2px solid var(--ink);text-decoration:none}
.scorebox{display:inline-block;border:2.5px solid var(--ink);border-radius:8px;padding:2px 10px;margin-left:8px;color:var(--ink)}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:800;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:0 6px}
.sec{font-size:1rem;font-weight:900;color:#fff;background:var(--pine);border-radius:8px;padding:4px 10px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.sec small{font-weight:700;opacity:.9;font-size:.8rem}
.qlist{column-count:2;column-gap:20px}
.q{break-inside:avoid;page-break-inside:avoid;border:2px solid var(--ink);border-radius:9px;padding:7px 9px;margin:0 0 8px;background:#fff;display:flow-root}
.q .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pine2);color:#fff;font-size:.78rem;font-weight:900;margin-right:6px;vertical-align:1px}
.q .pic{float:right;font-size:1.25rem;letter-spacing:1px;margin:0 0 2px 6px;line-height:1.2}
.q .pic .num{display:inline-block;border:2px solid var(--ink);border-radius:7px;padding:0 7px;font-weight:900;font-size:1.05rem;background:#fff8e1}
.q .txt{font-size:1rem;font-weight:700;line-height:1.4}
.q .sub{font-size:.8rem;font-weight:800;color:var(--muted);margin:0 0 2px}
.q .opts{margin-top:5px;font-size:.92rem;font-weight:700}
.q .opts span{display:inline-block;border:1.5px solid var(--ink);border-radius:7px;padding:1px 8px;margin:3px 5px 0 0}
.q .opts span i{font-style:normal;color:var(--muted);margin-right:4px}
.q .opts.col span{display:block;margin:4px 0 0}
.q .blank{display:inline-block;min-width:80px;border-bottom:2.5px solid var(--ink)}
.q .lb{letter-spacing:.32em;font-weight:900;white-space:nowrap}
.q .wline{display:block;border-bottom:2px solid var(--ink);height:26px;margin-top:4px}
.q .bank{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 0}
.q .bank span{border:1.5px dashed var(--ink);border-radius:6px;padding:0 7px;font-weight:800}
.passage{break-inside:avoid;border:2.5px solid var(--ink);border-radius:9px;padding:8px 10px;margin:0 0 8px;background:#fbfaf3;font-size:1rem;line-height:1.5;font-weight:600}
.passage b{display:block;font-size:.8rem;color:var(--pine)}
.mapbox{break-inside:avoid;margin:0 0 8px}
.mapbox{float:none}.mapbox svg{max-width:260px!important}
.key{margin-top:16px;border-top:3px dashed var(--ink);padding-top:10px}
.key h3{margin:0 0 6px;font-size:.92rem;color:var(--pine);font-weight:900;letter-spacing:.04em}
.key ol{margin:0;padding-left:22px;column-count:3;column-gap:20px;font-size:.88rem;font-weight:700;color:var(--muted)}
.key li{break-inside:avoid;margin-bottom:2px}
.key b{color:var(--pine)}
/* sizes */
#sheet.big .q .txt{font-size:1.18rem}#sheet.big .q .opts{font-size:1.05rem}#sheet.big .qlist{column-count:1}
/* ---------- projector ---------- */
body.proj header,body.proj .panel{display:none}
body.proj main{max-width:none;padding:0}
body.proj #sheet{border:0;border-radius:0;padding:26px 30px;min-height:100vh}
body.proj .sheethead .nm{display:none}
body.proj .qlist{column-count:3;column-gap:26px}
body.proj .q .txt{font-size:1.5rem}
body.proj .q .opts{font-size:1.25rem}
#projbar{display:none;position:fixed;right:14px;bottom:14px;gap:8px;z-index:50}
body.proj #projbar{display:flex}
@media print{
 @page{size:letter portrait;margin:9mm}
 body{background:#fff;font-size:12.5px}
 header,.panel,#projbar{display:none !important}
 main{padding:0;max-width:none}
 #sheet{border:0;border-radius:0;padding:0}
 #sheet:not(.big) .q .txt{font-size:.98rem}
 #sheet:not(.big) .q{padding:5px 7px;margin-bottom:6px}
 .pg+.pg{margin-top:0;border-top:0;padding-top:0}
 .pg.brk{break-before:page;page-break-before:always}
 #sheet.one .q .txt{font-size:.8rem;line-height:1.25}#sheet.one .q .opts{font-size:.72rem;margin-top:2px}#sheet.one .q .opts span{padding:0 5px;margin:1px 3px 0 0}#sheet.one .q{padding:3px 6px;margin-bottom:4px}#sheet.one .q .sub{font-size:.66rem}#sheet.one .q .wline{height:16px}#sheet.one .mapbox svg{max-width:130px!important}#sheet.one .q .pic{display:none}#sheet.one .q .n{width:17px;height:17px;font-size:.66rem}#sheet.one .bank span{font-size:.75rem}#sheet.one .passage{font-size:.8rem;padding:4px 7px;line-height:1.3}#sheet.one .sheethead{padding-bottom:3px;margin-bottom:5px}#sheet.one .sec{padding:2px 8px;margin-bottom:4px;font-size:.85rem}#sheet.one .q .pic{font-size:.95rem}#sheet.one .qlist{column-gap:12px}
 .key{break-before:page;page-break-before:always;border-top:0}
}
@media (max-width:700px){.qlist{column-count:1}}
</style>

<header>
  <a class="home" href="/readings/dashboards/">&#8592; All dashboards</a>
  <div><h1>Daily Basics &mdash; print &amp; project<small>Paper sheets: Warm-up (12) on the front, Stretch (8) on the back &middot; answer key on its own page</small></h1></div>
  <span class="sp"></span>
  <a class="app" href="/readings/basics/dashboard.html#paper">Enter paper scores &rarr;</a>

</header>
<main>
<div class="panel">
  <h2>1 &middot; What goes on the sheet</h2>
  <div class="row">
    <label class="f" for="lesson">Lesson first</label>
    <select id="lesson">
      <option value="">Mixed &mdash; everything</option>
      <option value="u1-l1">u1-l1 &middot; People at School</option>
      <option value="u1-l2">u1-l2 &middot; Introductions</option>
      <option value="u1-l3">u1-l3 &middot; From A to Z</option>
      <option value="u1-l4">u1-l4 &middot; 0 to 100</option>
      <option value="u1-l5">u1-l5 &middot; About Me</option>
    </select>
    <label class="f" for="level">Level</label>
    <select id="level"><option value="A">A &mdash; start here</option><option value="B">B &mdash; harder</option><option value="C">C &mdash; challenge</option></select>
    <label class="f" for="pages">Pages</label>
    <select id="pages">
      <option value="fb">Warm-up front, Stretch back</option>
      <option value="one">Both on one side (small)</option>
      <option value="w">Warm-up only</option>
      <option value="s">Stretch only</option>
    </select>
    <label class="f" for="period">Class</label>
    <input type="text" id="period" placeholder="Period 3" size="8">
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="showOpts" checked> Show the answer choices</label>
    <label class="chk"><input type="checkbox" id="showKey" checked> Answer key (own page)</label>
    <label class="chk"><input type="checkbox" id="showPics" checked> Pictures</label>
    <label class="chk"><input type="checkbox" id="big"> Big print</label>
  </div>
  <div class="row">
    <button class="btn gold" onclick="newSheet()">&#127922; Make a new sheet</button>
    <button class="btn" onclick="window.print()">&#128424;&#65039; Print</button>
    <button class="btn ghost" onclick="projector(true)">&#128250; Put it on the board</button>
    <label class="f" for="code" style="margin-left:auto">Sheet code</label>
    <input type="text" id="code" size="11" placeholder="L3-B-7K2Q" onkeydown="if(event.key==='Enter')fromCode()">
    <button class="btn ghost" onclick="fromCode()">Remake this sheet</button>
  </div>
  <p id="note"></p>
</div>
<div id="sheet"></div>
</main>
<div id="projbar">
  <button class="btn ghost" onclick="projKey()">Show answers</button>
  <button class="btn" onclick="projector(false)">Done</button>
</div>
<script src="/readings/wit/items.js"></script>
<script src="/readings/basics/levels.js"></script>
<script src="/readings/basics/stretch.js"></script>
<script>
/* ============================================================
   T-307. The question-maker is NOT copied here. Every top-level piece it needs
   (DATA, buildItems, buildLevel, the sentence makers, makeStretch, the map) is read
   out of readings/basics/index.html at load time, so paper and screen never drift.
   A sheet code (e.g. L3-B-7K2Q) remakes exactly the same sheet later, key included.
   ============================================================ */
var DATA=null,ITEMS=[],ST={A:{},email:'sheet',items:null,lesson:null},RND=Math.random,LESSON='',TODAY='',LEVEL='A',FOCUS='',dirty=false;
var SRC_OK=false,WANT=['DATA','STAG','buildItems','fragQ','buildLevel','marksOk','fragB','fragC','makeStretch','mapSVG'];
function state(id){if(!ST.A[id])ST.A[id]={tries:0,first:null,done:false};return ST.A[id];}
function seed(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
 return function(){h+=0x6D2B79F5;var t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(RND()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function art(n){return /^[aeiou]/i.test(n)?'an':'a';}
function plural(n){return /y$/.test(n)?n.replace(/y$/,'ies'):/(s|sh|ch|x)$/.test(n)?n+'es':n+'s';}
/* split the page's main script into top-level declarations (each starts at column 0 with "function " or "var ") */
function pieces(js){var out={},lines=js.split('\n'),cur=null,buf=[];
 function flush(){if(cur)out[cur]=(out[cur]||'')+buf.join('\n')+'\n';cur=null;buf=[];}
 lines.forEach(function(L){var m=L.match(/^function\s+([A-Za-z_$][\w$]*)\s*\(/)||L.match(/^var\s+([A-Za-z_$][\w$]*)\s*=/);
  if(m||/^(\/\*|[a-z]+\(|document\.|window\.|\(function)/.test(L)){flush();if(m)cur=m[1];}
  if(cur)buf.push(L);});flush();return out;}
function loadSource(cb){
 fetch('/readings/basics/index.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(src){
  var js=(src.match(/<script>([\s\S]*?var DATA=\{[\s\S]*?)<\/script>/)||[])[1];if(!js){cb(false);return;}
  var P=pieces(js),miss=WANT.filter(function(n){return !P[n];});if(miss.length){console.error('missing',miss);cb(false);return;}
  try{WANT.forEach(function(n){(0,eval)(P[n]);});SRC_OK=!!(window.DATA&&window.buildItems&&window.makeStretch);cb(SRC_OK);}
  catch(e){console.error(e);cb(false);}
 }).catch(function(e){console.error(e);cb(false);});}
var NAMES={'':'Mixed','u1-l1':'People at School','u1-l2':'Introductions','u1-l3':'From A to Z','u1-l4':'0 to 100','u1-l5':'About Me'};
function lessonShort(l){return l?('L'+l.split('-l')[1]):'MX';}
function shortToLesson(s){var m=String(s||'').match(/^L(\d)$/i);return m?'u1-l'+m[1]:'';}
function randCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<4;i++)s+=a.charAt(Math.floor(Math.random()*a.length));return s;}
var CUR={code:'',lesson:'',level:'A'};
function makeSet(code,lesson,level){LESSON=lesson;LEVEL=level;TODAY=code;ST={A:{},email:'sheet',items:null,lesson:null};ITEMS=[];buildItems();return ITEMS.slice();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function plain(h){return String(h).replace(/<button[^>]*>[\s\S]*?<\/button>/g,'').replace(/<\/div>/g,' \u2014 ').replace(/<[^>]+>/g,' ').replace(/\s*\u2014\s*$/,'').replace(/\s+/g,' ').trim();}
function blanks(w){return '<span class="lb">'+String(w).split('').map(function(c){return c===' '?'&nbsp;':'_';}).join(' ')+'</span>';}
function letters(n){return 'abcd'.charAt(n);}
function opts(o,col){return '<div class="opts'+(col?' col':'')+'">'+o.map(function(x,k){return '<span><i>'+letters(k)+'</i>'+esc(x)+'</span>';}).join('')+'</div>';}
function picOf(it,show){if(!show||!it.pic||it.pic==='MAP')return '';return '<div class="pic">'+(/^[0-9 AEIOU]+$/.test(it.pic)?'<span class="num">'+esc(it.pic)+'</span>':it.pic)+'</div>';}
function keyOf(it){if(it.w)return '(their own ending, 3+ words)';if(it.ty==='fix')return it.bad+' \u2192 '+it.o[it.a];if(it.ty==='tiles')return it.full;if(it.ty==='type')return it.ans;return it.o[it.a];}
function qHTML(it,n){var O=document.getElementById('showOpts').checked,P=document.getElementById('showPics').checked;
 var h='<div class="q">'+picOf(it,P),num='<span class="n">'+n+'</span>';
 if(it.ty==='fix'){h+='<div class="sub">Circle the wrong word. Write it right.</div><div class="txt">'+num+esc(it.s)+'</div>'+(O?opts(it.o):'')+'<span class="wline"></span>';}
 else if(it.ty==='tiles'){h+='<div class="sub">'+(it.say?'Make a question.':'Put the words in order. Write the sentence.')+'</div><div class="txt">'+num+(it.say?esc(it.say):'')+'</div>'+
  '<div class="bank">'+it.tl.map(function(w){return '<span>'+esc(w)+'</span>';}).join('')+'</div><span class="wline"></span>';}
 else if(it.ty==='type'){var p=String(it.q).split('___');h+='<div class="sub">Write the word. One letter on each line.</div><div class="txt">'+num+esc(p[0])+blanks(it.ans)+esc(p[1]||'')+'</div>';}
 else if(it.w){h+='<div class="sub">Finish the sentence (3 words or more).</div><div class="txt">'+num+esc(plain(it.q)).replace('___','<span class="blank"></span>')+'</div><span class="wline"></span>';}
 else{var t=esc(plain(it.q)).replace('___','<span class="blank"></span>'),long=it.o.some(function(x){return x.length>22;});
  h+='<div class="txt">'+num+t+'</div>'+(O||it.tag==='SENT.FRAG'||it.tag==='STR.JOIN'||it.tag==='STR.READ'?opts(it.o,long):'');}
 return h+'</div>';}
function header(title,sub,score){var d=new Date(),ds=d.toLocaleDateString(undefined,{month:'short',day:'numeric'}),cls=document.getElementById('period').value.trim();
 return '<div class="sheethead"><div class="t">'+title+'<small>'+esc(NAMES[CUR.lesson]||CUR.lesson)+' &middot; Level '+CUR.level+(cls?' &middot; '+esc(cls):'')+' &middot; '+ds+' &middot; sheet <span class="code">'+CUR.code+'</span></small></div>'+
  '<div class="nm">Name <u></u><br>'+sub+'</div></div>';}
var LAST=[];
function render(){var sheet=document.getElementById('sheet');
 if(!SRC_OK){sheet.innerHTML='<p style="font-weight:800;color:#b3261e">Could not read the Daily Basics questions from /readings/basics/index.html. Open <a href="/readings/basics/">the tap-through version</a> to check it is up.</p>';return;}
 var all=makeSet(CUR.code,CUR.lesson,CUR.level),warm=all.filter(function(x){return x.part===1;}),str=all.filter(function(x){return x.part===2;});
 var mode=document.getElementById('pages').value,P=document.getElementById('showPics').checked;
 sheet.className=document.getElementById('big').checked?'big':(mode==='one'?'one':'');
 var h='',n=0,keyList=[];
 if(mode!=='s'){var mapNeeded=warm.some(function(x){return x.pic==='MAP';});
  h+='<div class="pg">'+header('Daily Basics &middot; Warm-up','Period ____ <span class="scorebox">Warm-up ___ / '+warm.length+'</span>'+(mode==='one'?'<span class="scorebox">Stretch ___ / '+str.length+'</span>':''))+
   '<div class="sec">Warm-up <small>Circle the answer that fits.</small></div>'+(mapNeeded?'<div class="mapbox">'+mapSVG()+'</div>':'')+
   '<div class="qlist">'+warm.map(function(it){n++;keyList.push(keyOf(it));return qHTML(it,n);}).join('')+'</div></div>';}
 if(mode!=='w'){var body='',seen={};
  str.forEach(function(it){if(it.rp&&!seen[it.rid]){seen[it.rid]=1;body+='<div class="passage"><b>Read the story. Then answer.</b>'+esc(it.rp)+'</div>';}n++;keyList.push(keyOf(it));body+=qHTML(it,n);});
  h+='<div class="pg'+(mode==='fb'?' brk':'')+'">'+(mode==='one'?'':header('Daily Basics &middot; Stretch',mode==='s'?'Period ____ <span class="scorebox">Stretch ___ / '+str.length+'</span>':'<span class="scorebox">Stretch ___ / '+str.length+'</span>'))+
   '<div class="sec">Stretch <small>Harder. Write it, fix it, put it in order, read it.</small></div><div class="qlist">'+body+'</div></div>';}
 LAST=keyList;
 if(document.getElementById('showKey').checked)h+=keyHTML();
 sheet.innerHTML=h;
 document.getElementById('code').value=CUR.code;
 document.getElementById('note').textContent='Sheet '+CUR.code+' \u00b7 '+n+' questions. Write the code on your grading list: typing it into "Sheet code" later remakes this exact sheet and key. Scores go in on the Paper scores tab of the Daily Basics dashboard.';
}
function keyHTML(){return '<div class="key" id="keybox"><h3>Answer key &middot; sheet '+CUR.code+' &middot; Level '+CUR.level+' &middot; '+esc(NAMES[CUR.lesson]||'Mixed')+'</h3><ol>'+LAST.map(function(k){return '<li><b>'+esc(k)+'</b></li>';}).join('')+'</ol></div>';}
function newSheet(){var lesson=document.getElementById('lesson').value,level=document.getElementById('level').value;
 CUR={code:lessonShort(lesson)+'-'+level+'-'+randCode(),lesson:lesson,level:level};render();}
function fromCode(){var c=document.getElementById('code').value.trim().toUpperCase(),m=c.match(/^(L\d|MX)-([ABC])-([A-Z0-9]{4})$/);
 if(!m){document.getElementById('note').textContent='A sheet code looks like L3-B-7K2Q.';return;}
 CUR={code:c,lesson:shortToLesson(m[1]),level:m[2]};document.getElementById('lesson').value=CUR.lesson;document.getElementById('level').value=CUR.level;render();}
['pages','showOpts','showKey','showPics','big','period'].forEach(function(id){var e=document.getElementById(id);e.addEventListener('change',render);});
['lesson','level'].forEach(function(id){document.getElementById(id).addEventListener('change',newSheet);});
function projector(on){document.body.classList.toggle('proj',on);window.scrollTo(0,0);}
function projKey(){var box=document.getElementById('keybox');if(box){box.remove();return;}document.getElementById('sheet').insertAdjacentHTML('beforeend',keyHTML());}
document.addEventListener('keydown',function(e){if(e.key==='Escape')projector(false);});
loadSource(function(ok){if(!ok)document.getElementById('note').textContent='Could not read the question pools from the Daily Basics page.';
 var q=new URLSearchParams(location.search);if(q.get('code')){document.getElementById('code').value=q.get('code');fromCode();return;}
 if(q.get('lesson'))document.getElementById('lesson').value=q.get('lesson');if(q.get('level'))document.getElementById('level').value=q.get('level').toUpperCase();
 newSheet();});
</script>
