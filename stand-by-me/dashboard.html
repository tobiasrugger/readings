<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Dashboard — The Body / Stand By Me</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--pine:#1d4536;--pine-mid:#2f6f4e;--pine-pale:#e4ece6;--oxblood:#8f2f26;
        --paper:#f7f4ec;--ink:#20211f;--soft:#5a5f5c;--line:#d7d2c4;--tie:#8a6a4a}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
  header{background:var(--pine);color:#f4f1e4;padding:20px 18px;border-bottom:5px solid var(--tie)}
  header h1{margin:0;font-size:1.5rem;font-weight:800}
  header p{margin:5px 0 0;color:#b9d6c5;font-size:.9rem}
  .wrap{max-width:1250px;margin:0 auto;padding:18px}

  #gate{max-width:380px;margin:70px auto;background:#fff;border:1.5px solid var(--line);
        border-radius:10px;padding:26px;text-align:center}
  #gate h2{margin:0 0 14px;font-size:1.15rem}
  input,select,button{font:inherit}
  input,select{padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff}
  button{background:var(--pine);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:700}
  button:hover{background:var(--pine-mid)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pine-mid);outline-offset:2px}
  button.ghost{background:#fff;color:var(--pine);border:1.5px solid var(--line)}

  .controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
  .controls .grow{flex:1;min-width:150px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--pine-mid);border-radius:8px;padding:10px 13px}
  .stat .n{font-size:1.5rem;font-weight:800;color:var(--pine)}
  .stat .l{font-size:.78rem;color:var(--soft);font-weight:700}

  table{width:100%;border-collapse:collapse;background:#fff;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;font-size:.88rem;border-bottom:1px solid var(--line)}
  th{background:var(--pine-pale);color:var(--pine);font-weight:800;cursor:pointer;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f3f6f3}
  .bar{background:#e8e6dd;border-radius:10px;height:9px;width:110px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar span{display:block;height:100%;background:var(--pine-mid)}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px;background:#e8eef4;color:#38566e}
  .tag.in{background:#e4ece6;color:var(--pine)}
  .tag.no{background:#f6e8e5;color:var(--oxblood)}
  .muted{color:var(--soft)}

  #panel{position:fixed;inset:0;background:rgba(20,24,20,.45);display:none;z-index:90;padding:26px}
  #panel.on{display:block}
  .sheet{max-width:820px;margin:0 auto;background:#fff;border-radius:10px;max-height:100%;
         overflow:auto;padding:22px 26px}
  .sheet h2{margin:0 0 2px;font-size:1.25rem}
  .sheet .sub{color:var(--soft);font-size:.85rem;margin-bottom:16px}
  .ans{border-left:4px solid var(--pine-pale);padding:4px 0 4px 12px;margin-bottom:11px}
  .ans .k{font-size:.76rem;font-weight:800;color:var(--pine);text-transform:none}
  .ans .v{white-space:pre-wrap;font-size:.95rem}
  .closebtn{float:right}
  @media print{ .controls,.stats,#panel{display:none} }
</style>
</head>
<body>

<div id="gate">
  <h2>Teacher dashboard</h2>
  <p class="muted" style="font-size:.85rem">The Body / Stand By Me</p>
  <input id="pw" type="password" placeholder="password" style="width:100%;margin-bottom:10px">
  <button onclick="unlock()" style="width:100%">Open</button>
  <p id="pwmsg" style="color:var(--oxblood);font-size:.85rem;min-height:18px;margin:8px 0 0"></p>
</div>

<div id="app" style="display:none">
  <header>
    <h1>The Body / Stand By Me — student work</h1>
    <p>Reading Guide #1 · Part 1 · Part 1a · Vocabulary &amp; Grammar</p>
  </header>

  <div class="wrap">
    <div class="controls">
      <select id="fpage">
        <option value="">All pages</option>
        <option value="guide-easy">Reading Guide #1 (plain)</option>
        <option value="part1a">Part 1a — King’s text</option>
        <option value="part1">Part 1 — full opening</option>
        <option value="vocab">Vocabulary &amp; Grammar</option>
      </select>
      <select id="fclass"><option value="">All classes</option></select>
      <input id="fsearch" class="grow" placeholder="search name or email">
      <label style="font-size:.85rem"><input type="checkbox" id="fturn" style="vertical-align:-2px"> turned in only</label>
      <button onclick="load()">Refresh</button>
      <button class="ghost" onclick="csv()">Download CSV</button>
    </div>

    <div class="stats" id="stats"></div>
    <table>
      <thead><tr>
        <th onclick="sortBy('name')">Student</th>
        <th onclick="sortBy('class_period')">Class</th>
        <th onclick="sortBy('page')">Page</th>
        <th onclick="sortBy('pct')">Progress</th>
        <th onclick="sortBy('words')">Words</th>
        <th onclick="sortBy('turned_in')">Turned in</th>
        <th onclick="sortBy('updated_at')">Last saved</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
    </table>
    <p class="muted" style="font-size:.8rem;margin-top:10px">Click any row to read everything that student wrote.</p>
  </div>
</div>

<div id="panel" onclick="if(event.target.id==='panel')closePanel()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
var SUPA_URL = 'https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE = 'body_work';
var PW = 'galileo2026';

var PAGE_NAMES = {
  'guide-easy':'Reading Guide #1 (plain)',
  'part1a':'Part 1a — King’s text',
  'part1':'Part 1 — full opening',
  'vocab':'Vocabulary & Grammar'
};
var TOTALS = {'guide-easy':30, 'part1a':28, 'part1':32, 'vocab':58};

var ROWS = [], sortKey = 'updated_at', sortDir = -1;

function unlock(){
  if(document.getElementById('pw').value === PW){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = '';
    load();
  } else {
    document.getElementById('pwmsg').textContent = 'Not that one.';
  }
}
document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });

function headers(){
  return {'apikey':SUPA_KEY, 'Authorization':'Bearer ' + SUPA_KEY};
}

function load(){
  var url = SUPA_URL + '/rest/v1/' + TABLE + '?select=*&order=updated_at.desc';
  fetch(url, {headers: headers()})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(rows){
      ROWS = rows.map(function(r){
        var a = r.answers || {};
        var keys = Object.keys(a).filter(function(k){ return k !== 'nm' && k !== 'cl' && String(a[k]).trim() !== ''; });
        var words = 0;
        for(var i = 0; i < keys.length; i++){
          words += String(a[keys[i]]).trim().split(/\s+/).length;
        }
        r.filled = keys.length;
        r.words = words;
        r.pct = Math.min(100, Math.round(100 * keys.length / (TOTALS[r.page] || 30)));
        r.name = r.name || (a.nm || '');
        r.class_period = r.class_period || (a.cl || '');
        return r;
      });
      fillClasses();
      render();
    })
    .catch(function(err){
      document.getElementById('rows').innerHTML =
        '<tr><td colspan="7" class="muted">Could not load (' + err + '). If this says 404, the body_work table has not been created yet — run schema.sql in Supabase.</td></tr>';
    });
}

function fillClasses(){
  var sel = document.getElementById('fclass'), seen = {}, opts = '<option value="">All classes</option>';
  for(var i = 0; i < ROWS.length; i++){
    var c = ROWS[i].class_period;
    if(c && !seen[c]){ seen[c] = 1; opts += '<option>' + esc(c) + '</option>'; }
  }
  var keep = sel.value;
  sel.innerHTML = opts;
  sel.value = keep;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filtered(){
  var p = document.getElementById('fpage').value;
  var c = document.getElementById('fclass').value;
  var q = document.getElementById('fsearch').value.toLowerCase().trim();
  var t = document.getElementById('fturn').checked;
  return ROWS.filter(function(r){
    if(p && r.page !== p) return false;
    if(c && r.class_period !== c) return false;
    if(t && !r.turned_in) return false;
    if(q && (r.name + ' ' + r.email).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function(a, b){
    var x = a[sortKey], y = b[sortKey];
    if(x == null) x = ''; if(y == null) y = '';
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
}

function sortBy(k){
  sortDir = (sortKey === k) ? -sortDir : -1;
  sortKey = k;
  render();
}

function render(){
  var rows = filtered();
  var students = {}, turned = 0;
  for(var i = 0; i < rows.length; i++){
    students[rows[i].email] = 1;
    if(rows[i].turned_in) turned++;
  }
  document.getElementById('stats').innerHTML =
    stat(Object.keys(students).length, 'students') +
    stat(rows.length, 'pages started') +
    stat(turned, 'turned in') +
    stat(rows.length ? Math.round(rows.reduce(function(s, r){ return s + r.pct; }, 0) / rows.length) + '%' : '—', 'average progress');

  var html = '';
  for(var j = 0; j < rows.length; j++){
    var r = rows[j];
    html += '<tr onclick="openRow(\'' + esc(r.email) + '\',\'' + r.page + '\')">' +
      '<td><b>' + (esc(r.name) || '<span class="muted">no name</span>') + '</b><br><span class="muted" style="font-size:.78rem">' + esc(r.email) + '</span></td>' +
      '<td>' + esc(r.class_period) + '</td>' +
      '<td><span class="tag">' + esc(PAGE_NAMES[r.page] || r.page) + '</span></td>' +
      '<td><span class="bar"><span style="width:' + r.pct + '%"></span></span> ' + r.pct + '%</td>' +
      '<td>' + r.words + '</td>' +
      '<td>' + (r.turned_in ? '<span class="tag in">yes</span>' : '<span class="tag no">no</span>') + '</td>' +
      '<td class="muted">' + String(r.updated_at || '').slice(0, 16).replace('T', ' ') + '</td></tr>';
  }
  document.getElementById('rows').innerHTML = html || '<tr><td colspan="7" class="muted">Nothing matches those filters.</td></tr>';
}
function stat(n, l){ return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }

/* ---------- turn a field key into something readable ---------- */
function label(page, k){
  var m;
  if(k === 'nm') return 'Name';
  if(k === 'cl') return 'Class';
  if((m = k.match(/^q(\d+)ml$/)))  return 'Question ' + m[1] + ' — in their language';
  if((m = k.match(/^q(\d+)v(\d+)$/))) return 'Question ' + m[1] + ' — word ' + (parseInt(m[2], 10) + 1);
  if((m = k.match(/^q(\d+)$/)))    return 'Question ' + m[1];
  if((m = k.match(/^pic(\d+)$/)))  return 'Picture ' + m[1] + ' — word';
  if((m = k.match(/^gml(\d+)$/)))  return 'Sentence ' + m[1] + ' — in their language';
  if((m = k.match(/^gpast(\d+)$/)))return 'Sentence ' + m[1] + ' — past tense';
  if((m = k.match(/^ms(\d+)$/)))   return 'Movie picture ' + m[1] + ' — sentence';
  if((m = k.match(/^mq(\d+)$/)))   return 'Movie picture ' + m[1] + ' — question';
  if((m = k.match(/^dq(\d+)$/)))   return '“Didn’t” question ' + m[1];
  if((m = k.match(/^did(\d+)$/)))  return 'Did / didn’t answer ' + m[1];
  if((m = k.match(/^tml(\d+)$/)))  return 'Translate ' + m[1];
  if((m = k.match(/^tq(\d+)$/)))   return 'Turn into a question ' + m[1];
  if((m = k.match(/^w(\d+)$/)))    return '5 Ws grid ' + m[1];
  return k;
}
function keyOrder(k){
  var m = k.match(/(\d+)/);
  return (m ? parseInt(m[1], 10) : 999) + (/ml$/.test(k) ? 0.3 : 0) + (/v\d+$/.test(k) ? 0.1 : 0);
}

function openRow(email, page){
  var r = null;
  for(var i = 0; i < ROWS.length; i++){
    if(ROWS[i].email === email && ROWS[i].page === page){ r = ROWS[i]; break; }
  }
  if(!r) return;
  var a = r.answers || {};
  var keys = Object.keys(a).filter(function(k){
    return k !== 'nm' && k !== 'cl' && String(a[k]).trim() !== '';
  }).sort(function(x, y){ return keyOrder(x) - keyOrder(y); });

  var h = '<button class="ghost closebtn" onclick="closePanel()">Close</button>';
  h += '<h2>' + (esc(r.name) || esc(r.email)) + '</h2>';
  h += '<p class="sub">' + esc(PAGE_NAMES[r.page] || r.page) + ' · ' + esc(r.class_period) + ' · ' +
       r.filled + ' answers · ' + r.words + ' words · ' +
       (r.turned_in ? 'turned in' : 'not turned in') + '</p>';
  if(!keys.length){ h += '<p class="muted">Nothing written yet.</p>'; }
  for(var j = 0; j < keys.length; j++){
    h += '<div class="ans"><div class="k">' + esc(label(r.page, keys[j])) + '</div><div class="v">' + esc(a[keys[j]]) + '</div></div>';
  }
  document.getElementById('sheet').innerHTML = h;
  document.getElementById('panel').classList.add('on');
}
function closePanel(){ document.getElementById('panel').classList.remove('on'); }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closePanel(); });

function csv(){
  var rows = filtered();
  var lines = ['name,email,class,page,progress,words,turned_in,updated,question,answer'];
  for(var i = 0; i < rows.length; i++){
    var r = rows[i], a = r.answers || {};
    var keys = Object.keys(a).filter(function(k){ return k !== 'nm' && k !== 'cl' && String(a[k]).trim() !== ''; })
                            .sort(function(x, y){ return keyOrder(x) - keyOrder(y); });
    for(var j = 0; j < keys.length; j++){
      lines.push([q(r.name), q(r.email), q(r.class_period), q(PAGE_NAMES[r.page] || r.page),
                  r.pct + '%', r.words, r.turned_in ? 'yes' : 'no',
                  q(String(r.updated_at).slice(0, 16)),
                  q(label(r.page, keys[j])), q(a[keys[j]])].join(','));
    }
  }
  var blob = new Blob([lines.join('\n')], {type:'text/csv'});
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'stand_by_me_work.csv';
  link.click();
}
function q(v){ return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }

['fpage','fclass','fsearch','fturn'].forEach(function(id){
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});
</script>
<script src="/readings/track.js"></script>
</body>
</html>
