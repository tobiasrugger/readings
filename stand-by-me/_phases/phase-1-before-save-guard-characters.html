<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand By Me — Character Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EAE3;
  --panel:#F3F4EE;
  --ink:#22261F;
  --ink-soft:#565C4F;
  --rail:#8A9086;
  --denim:#33566F;
  --denim-lt:#DCE5EC;
  --rust:#8C4A2F;
  --olive:#5A6340;
  --line:#C6C9BE;
  --focus:#33566F;
  --maxw:1080px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
  font-size:19px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,.disp{font-family:Archivo,"Arial Narrow",system-ui,sans-serif;letter-spacing:-.015em;line-height:1.1;margin:0}
h1{font-weight:800;font-size:2.1rem}
h2{font-weight:800;font-size:1.7rem}
h3{font-weight:700;font-size:1.25rem}
h4{font-weight:700;font-size:1.02rem}
p{margin:0 0 .8em}
a{color:var(--denim)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
.topbar{
  background:var(--ink);color:#EFF0EA;
  border-bottom:4px solid var(--rust);
}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:14px 20px;
  display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;justify-content:space-between}
.brand{font-family:Archivo;font-weight:800;font-size:1.45rem;letter-spacing:-.02em;line-height:1}
.brand span{display:block;font-family:"Source Sans 3";font-weight:400;font-size:.78rem;
  letter-spacing:.02em;color:#A9B0A2;margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{font-size:.72rem;color:#A9B0A2}
select,input[type=text]{
  font-family:inherit;font-size:.92rem;padding:6px 9px;
  background:#F3F4EE;color:var(--ink);border:1px solid #555B4E;border-radius:2px;
}
input[type=text]{width:130px}

button{
  font-family:"Source Sans 3";font-size:.92rem;font-weight:600;
  padding:7px 14px;border-radius:2px;cursor:pointer;
  border:1px solid var(--ink);background:var(--panel);color:var(--ink);
}
button:hover{background:#fff}
button.solid{background:var(--denim);border-color:var(--denim);color:#fff}
button.solid:hover{background:#27455a}
button.rust{background:var(--rust);border-color:var(--rust);color:#fff}
button.rust:hover{background:#733a24}
button.ghost{background:transparent;border-color:var(--rail);color:var(--ink-soft)}
button.sm{font-size:.82rem;padding:5px 10px}

/* ---------- rail nav ---------- */
.railnav{background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.railnav-in{max-width:var(--maxw);margin:0 auto;padding:0 20px;position:relative}
.rail-line{position:absolute;left:20px;right:20px;top:31px;height:3px;background:var(--rail)}
.stops{display:flex;gap:0;position:relative;z-index:2;min-width:640px}
.stop{
  flex:1;background:none;border:0;padding:14px 4px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-soft);
  font-family:Archivo;font-weight:700;font-size:.98rem;letter-spacing:-.01em;
}
.stop .dot{width:15px;height:15px;border-radius:50%;background:var(--paper);
  border:3px solid var(--rail);transition:background .15s,border-color .15s}
.stop:hover{color:var(--ink)}
.stop:hover .dot{border-color:var(--denim)}
.stop.on{color:var(--ink)}
.stop.on .dot{background:var(--rust);border-color:var(--rust);width:19px;height:19px}
.stop.util{flex:0 0 auto;padding-left:16px;padding-right:16px;font-size:.9rem}

/* ---------- layout ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:30px 20px 90px}
.view{display:none}
.view.on{display:block}
.prose{max-width:66ch}

/* ---------- character hero ---------- */
.hero{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start;margin-bottom:34px}
.portrait{background:var(--panel);border:1px solid var(--line);aspect-ratio:3/4;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .empty{color:var(--ink-soft);font-size:.85rem;text-align:center;padding:20px;line-height:1.4}
.hero h1{font-size:clamp(2.6rem,7vw,4.4rem);line-height:.92;margin-bottom:2px}
.hero h1 .last{display:block;color:var(--rust)}
.hero .actor{font-size:.95rem;color:var(--ink-soft);margin:10px 0 16px}
.hero .framing{font-size:1.12rem;max-width:46ch}

/* ---------- section shell ---------- */
section.block{margin:0 0 42px}
.block > h2{padding-bottom:8px;border-bottom:3px solid var(--ink);margin-bottom:6px}
.block .sub{color:var(--ink-soft);font-size:.93rem;margin:0 0 18px;max-width:64ch}

/* ---------- the two-column self (the centerpiece) ---------- */
.twocol{border:2px solid var(--ink);background:var(--panel);display:grid;grid-template-columns:1fr 1fr}
.twocol > div{padding:20px 22px}
.twocol > div:first-child{border-right:2px solid var(--ink);background:#EDEDE4}
.twocol h3{margin-bottom:4px}
.twocol h3.says{color:var(--rust)}
.twocol h3.know{color:var(--denim)}
.twocol .hint{font-size:.84rem;color:var(--ink-soft);margin-bottom:12px}

/* ---------- textareas ---------- */
textarea{
  width:100%;font-family:"Source Sans 3";font-size:1rem;line-height:1.7;
  padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:#fff;
  color:var(--ink);resize:vertical;min-height:104px;
}
textarea:focus{border-color:var(--denim)}
.savemark{font-size:.76rem;color:var(--ink-soft);height:1.1em;margin-top:3px}
.savemark.ok{color:var(--olive)}
.savemark.err{color:var(--rust)}

/* ---------- clips ---------- */
.clip{border-top:1px solid var(--line);padding:16px 0}
.clip:first-of-type{border-top:2px solid var(--ink)}
.clip-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.clip-head h4{flex:1 1 auto;min-width:220px}
.time{font-family:Archivo;font-weight:500;font-size:.85rem;color:var(--ink-soft);
  border:1px solid var(--line);padding:1px 7px;border-radius:2px;background:var(--panel)}
.clip .why{font-size:.95rem;color:var(--ink-soft);max-width:64ch;margin:6px 0 0}
.clip .watchfor{margin:8px 0 0;font-size:.95rem}
.clip .watchfor b{font-family:Archivo;font-weight:700}
.player{margin-top:12px;background:#000;aspect-ratio:16/9;max-width:640px}
.player video,.player iframe{width:100%;height:100%;display:block;border:0}

/* ---------- role cards ---------- */
.roles{display:grid;gap:2px;background:var(--line);border:2px solid var(--ink)}
.role{background:var(--panel)}
.role-head{width:100%;display:flex;gap:14px;align-items:baseline;text-align:left;
  background:none;border:0;padding:15px 18px;cursor:pointer;font-family:inherit}
.role-head:hover{background:#fff}
.role-head .rname{font-family:Archivo;font-weight:800;font-size:1.15rem;flex:0 0 128px}
.role-head .rjob{font-size:.93rem;color:var(--ink-soft);flex:1}
.role-head .chev{color:var(--rail);font-size:1.1rem;line-height:1}
.role.open .role-head{background:#fff;border-bottom:1px solid var(--line)}
.role-body{display:none;padding:6px 18px 20px;background:#fff}
.role.open .role-body{display:block}
.role-body .ask{font-size:1.05rem;max-width:62ch;margin-bottom:14px}
.frames{background:var(--denim-lt);border-left:4px solid var(--denim);padding:12px 16px;margin:0 0 16px}
.frames h4{font-size:.88rem;font-weight:700;color:var(--denim);margin-bottom:6px}
.frames ul{margin:0;padding-left:20px}
.frames li{margin:3px 0;font-size:1rem}
.wordbank{font-size:.95rem;color:var(--ink-soft);margin-bottom:14px}
.wordbank b{font-family:Archivo;color:var(--ink)}

/* ---------- ace card ---------- */
.acecard{display:grid;grid-template-columns:190px 1fr;gap:22px;
  background:var(--ink);color:#EFF0EA;padding:22px;border-left:6px solid var(--rust)}
.acecard .portrait{aspect-ratio:1/1;background:#31362D;border-color:#454B40}
.acecard .portrait .empty{color:#8B9184}
.acecard h3{color:#fff;margin-bottom:8px}
.acecard p{font-size:.98rem;color:#D3D6CC;max-width:58ch}
.acecard .gw{border-bottom-color:#7E8676;color:#EFF0EA}

/* ---------- timeline ---------- */
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--line);
  border:2px solid var(--ink)}
.tstop{background:var(--panel);padding:14px}
.tstop h4{margin-bottom:2px}
.tstop .tw{font-size:.82rem;color:var(--ink-soft);margin-bottom:9px}
.tstop textarea{min-height:130px;font-size:.94rem}

/* ---------- seal / reveal ---------- */
.sealbox{border:2px dashed var(--rust);background:#F6EFEA;padding:18px}
.sealed textarea{background:#EDE7E2;color:var(--ink-soft)}
.revealed{border:2px solid var(--olive);background:#EFF2E7;padding:16px 18px;margin-top:14px}
.revealed h4{color:var(--olive);margin-bottom:5px}

/* ---------- glossed words ---------- */
.gw{
  border-bottom:2px dotted var(--denim);cursor:help;
  background:none;border-left:0;border-right:0;border-top:0;padding:0;
  font:inherit;color:inherit;
}
.gw:hover{background:var(--denim-lt)}
#tip{
  position:absolute;z-index:60;max-width:310px;display:none;
  background:var(--ink);color:#F3F4EE;padding:12px 14px;border-radius:3px;
  box-shadow:0 6px 22px rgba(20,24,18,.34);font-size:.95rem;line-height:1.5;
}
#tip .t-word{font-family:Archivo;font-weight:800;font-size:1.02rem;color:#fff;margin-bottom:3px}
#tip .t-def{color:#CFD3C7}
#tip .t-tr{margin-top:7px;padding-top:7px;border-top:1px solid #454B40;
  font-size:1.12rem;font-weight:600;color:#F3F4EE}
#tip .t-tr small{display:block;font-size:.7rem;font-weight:400;color:#8B9184;margin-top:2px}
#tip .t-wait{color:#8B9184;font-style:italic;font-size:.88rem;margin-top:6px}

/* ---------- overview / teacher ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.card{background:var(--panel);border:1px solid var(--line);padding:20px}
.card h3{margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:Archivo;font-weight:700;background:var(--panel)}
.jobs{list-style:none;padding:0;margin:0;border-top:2px solid var(--ink)}
.jobs li{border-bottom:1px solid var(--line);padding:11px 0;display:flex;gap:14px}
.jobs li b{font-family:Archivo;font-weight:800;flex:0 0 128px}
.note{font-size:.9rem;color:var(--ink-soft)}
.pill{display:inline-block;font-size:.76rem;padding:2px 8px;border:1px solid var(--rail);
  border-radius:99px;color:var(--ink-soft);margin-right:5px}
.mediarow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.mediarow input{width:100%}
.mediarow input[type=text]{width:100%}
.stack{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--olive);width:0}

/* ---------- print ---------- */
#printRoot{display:none}
@media print{
  @page{size:letter;margin:0.6in}
  body{background:#fff;color:#000;font-size:12pt;line-height:1.5}
  .topbar,.railnav,main,#tip,.noprint{display:none!important}
  #printRoot{display:block!important}
  .pg{page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .p-head{border-bottom:2.5pt solid #000;padding-bottom:5pt;margin-bottom:4pt;
    display:flex;justify-content:space-between;align-items:baseline}
  .p-head .p-t{font-family:Archivo;font-weight:800;font-size:17pt;line-height:1.05}
  .p-head .p-c{font-family:Archivo;font-weight:700;font-size:10pt}
  .p-sub{font-size:9.5pt;margin-bottom:12pt}
  .p-name{border:1pt solid #000;padding:6pt 8pt;margin-bottom:14pt;font-size:10pt}
  .p-ask{font-size:12.5pt;margin:0 0 8pt;max-width:none}
  .p-frames{border-left:2.5pt solid #000;padding:5pt 0 5pt 10pt;margin:0 0 12pt;font-size:11pt}
  .p-frames div{margin:2pt 0}
  .p-lines{margin-top:6pt}
  .p-lines div{border-bottom:.6pt solid #666;height:26pt}
  .p-2col{display:grid;grid-template-columns:1fr 1fr;border:1.5pt solid #000}
  .p-2col > div{padding:8pt 10pt}
  .p-2col > div:first-child{border-right:1.5pt solid #000}
  .p-2col h4{font-size:11.5pt;margin-bottom:3pt}
  .p-grid5{display:grid;grid-template-columns:repeat(5,1fr);border:1.5pt solid #000;
    border-right:0;min-height:5.2in}
  .p-grid5 > div{border-right:1.5pt solid #000;padding:6pt}
  .p-grid5 h4{font-size:9.5pt;line-height:1.15;margin-bottom:2pt}
  .p-grid5 .tw{font-size:8pt;color:#444}
  .p-gloss{column-count:2;column-gap:22pt;font-size:10pt}
  .p-gloss div{break-inside:avoid;margin-bottom:5pt;padding-bottom:4pt;
    border-bottom:.5pt solid #bbb}
  .p-gloss b{font-family:Archivo;font-size:10.5pt}
  .p-gloss i{font-style:normal;font-weight:600}
  .gw{border:0!important;background:none!important}
  .p-clip{border-bottom:.6pt solid #999;padding:5pt 0;font-size:10.5pt}
  .p-clip b{font-family:Archivo}
  .p-box{border:1.5pt solid #000;padding:8pt 10pt;margin-bottom:10pt}
}

@media (max-width:880px){
  body{font-size:18px}
  .hero{grid-template-columns:1fr;gap:20px}
  .portrait{max-width:280px;aspect-ratio:3/4}
  .grid2{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr 1fr}
  .acecard{grid-template-columns:1fr}
  .acecard .portrait{max-width:200px}
  .role-head{flex-wrap:wrap}
  .role-head .rname{flex:0 0 100%}
}
@media (max-width:600px){
  .twocol{grid-template-columns:1fr}
  .twocol > div:first-child{border-right:0;border-bottom:2px solid var(--ink)}
  .timeline{grid-template-columns:1fr}
}
</style>

var MEDIA = {};   // MEDIA[slug] = {portrait:url, clips:{0:url,...}}

function lsGet(k, fallback){
  try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function loadLocal(){
  MEDIA = lsGet('sbm_media', {});
  var s = lsGet('sbm_student', {});
  STATE.name = s.name || '';
  STATE.period = s.period || '';
  STATE.lang = lsGet('sbm_lang', '');
  STATE.mode = lsGet('sbm_mode', 'both');
  TR = lsGet('sbm_tr', {});
}
function saveStudent(){ lsSet('sbm_student', {name:STATE.name, period:STATE.period}); }

/* ============================================================
   GLOSSING
   ============================================================ */

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* {{word}} or {{shown text|glossary key}} */
function gl(text){
  if(!text) return '';
  var out = '';
  var rest = String(text);
  var re = /\{\{(.+?)\}\}/;
  var m = rest.match(re);
  while(m){
    out += esc(rest.slice(0, m.index));
    var inner = m[1];
    var shown = inner, key = inner;
    var bar = inner.indexOf('|');
    if(bar > -1){ shown = inner.slice(0,bar); key = inner.slice(bar+1); }
    key = key.toLowerCase();
    out += '<button type="button" class="gw" data-term="' + esc(key) + '">' + esc(shown) + '</button>';
    rest = rest.slice(m.index + m[0].length);
    m = rest.match(re);
  }
  out += esc(rest);
  return out;
}
/* plain text version, for print and for the packet */
function plain(text){
  if(!text) return '';
  return String(text).replace(/\{\{(.+?)\}\}/g, function(_, inner){
    var bar = inner.indexOf('|');
    return bar > -1 ? inner.slice(0,bar) : inner;
  });
}

var tipEl = document.getElementById('tip');
var tipTerm = null;

function showTip(btn){
  var term = btn.getAttribute('data-term');
  tipTerm = term;
  var def = GLOSSARY[term] || '';
  var html = '<div class="t-word">' + esc(term) + '</div>';
  if(STATE.mode !== 'tr' && def) html += '<div class="t-def">' + esc(def) + '</div>';
  if(STATE.mode !== 'en' && STATE.lang){
    var t = TR[STATE.lang] && TR[STATE.lang][term];
    if(t){
      html += '<div class="t-tr">' + esc(t) + '<small>' + esc(langLabel(STATE.lang)) + '</small></div>';
    } else {
      html += '<div class="t-wait">Loading translation\u2026</div>';
      fetchTerms([term], STATE.lang, function(){
        if(tipTerm === term && tipEl.style.display === 'block') showTip(btn);
      });
    }
  }
  if(STATE.mode === 'tr' && !STATE.lang){
    html += '<div class="t-def">' + esc(def) + '</div>';
  }
  tipEl.innerHTML = html;
  tipEl.style.display = 'block';
  var r = btn.getBoundingClientRect();
  var top = r.bottom + window.scrollY + 8;
  var left = r.left + window.scrollX;
  var w = tipEl.offsetWidth;
  if(left + w > window.innerWidth - 12) left = window.innerWidth - w - 12;
  if(left < 8) left = 8;
  tipEl.style.top = top + 'px';
  tipEl.style.left = left + 'px';
}
function hideTip(){ tipEl.style.display = 'none'; tipTerm = null; }

document.addEventListener('mouseover', function(e){
  var b = e.target.closest ? e.target.closest('.gw') : null;
  if(b) showTip(b);
});
document.addEventListener('mouseout', function(e){
  var b = e.target.closest ? e.target.closest('.gw') : null;
  if(b && !tipEl.contains(e.relatedTarget)) hideTip();
});
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.gw') : null;
  if(b){ e.preventDefault(); showTip(b); return; }
  if(!tipEl.contains(e.target)) hideTip();
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') hideTip(); });

function langLabel(code){
  for(var i=0;i<LANGS.length;i++){ if(LANGS[i].code === code) return LANGS[i].label; }
  return code;
}

/* ---------- translation via the Apps Script proxy ---------- */

function proxyTranslate(joined, code){
  var url = PROXY_URL + '?text=' + encodeURIComponent(joined) + '&target=' + encodeURIComponent(code);
  return fetch(url).then(function(r){ return r.text(); }).then(function(txt){
    var body = txt;
    try{
      var j = JSON.parse(txt);
      if(typeof j === 'string') body = j;
      else if(j.translation) body = j.translation;
      else if(j.translatedText) body = j.translatedText;
      else if(j.text) body = j.text;
      else if(j.result) body = j.result;
    }catch(e){ /* plain text response is fine */ }
    return body;
  });
}

var SEP = ' ~|~ ';

function fetchTerms(terms, code, done){
  if(!code || !terms.length){ if(done) done(); return; }
  if(!TR[code]) TR[code] = {};
  var need = terms.filter(function(t){ return !TR[code][t]; });
  if(!need.length){ if(done) done(); return; }
  var joined = need.join(SEP);
  proxyTranslate(joined, code).then(function(body){
    var parts = body.split(/\s*~\s*\|\s*~\s*/);
    for(var i=0;i<need.length;i++){
      if(parts[i]) TR[code][need[i]] = parts[i].trim();
    }
    lsSet('sbm_tr', TR);
    if(done) done();
  }).catch(function(err){
    console.warn('translation proxy failed', err);
    if(done) done();
  });
}

/* ============================================================
   SUPABASE
   ============================================================ */

function sbHeaders(extra){
  var h = {'apikey':SUPA_KEY, 'Authorization':'Bearer ' + SUPA_KEY, 'Content-Type':'application/json'};
  if(extra){ for(var k in extra) h[k] = extra[k]; }
  return h;
}

function saveField(fieldKey, content, mark){
  if(!STATE.name){ if(mark) setMark(mark, 'Type your name at the top to save', 'err'); return; }
  var row = {
    student_name: STATE.name,
    period: STATE.period,
    character_slug: STATE.slug,
    field_key: fieldKey,
    content: content,
    updated_at: new Date().toISOString()
  };
  if(mark) setMark(mark, 'Saving\u2026', '');
  var url = SUPA_URL + '/rest/v1/' + TABLE + '?on_conflict=student_name,character_slug,field_key';
  fetch(url, {
    method:'POST',
    headers: sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify(row)
  }).then(function(r){
    if(mark) setMark(mark, r.ok ? 'Saved' : 'Not saved \u2014 check your connection', r.ok ? 'ok' : 'err');
  }).catch(function(){
    if(mark) setMark(mark, 'Not saved \u2014 check your connection', 'err');
  });
}

function loadMine(slug, cb){
  if(!STATE.name){ cb({}); return; }
  var url = SUPA_URL + '/rest/v1/' + TABLE
    + '?student_name=eq.' + encodeURIComponent(STATE.name)
    + '&character_slug=eq.' + encodeURIComponent(slug)
    + '&select=field_key,content';
  fetch(url, {headers: sbHeaders()}).then(function(r){ return r.json(); })
  .then(function(rows){
    var out = {};
    if(Array.isArray(rows)) rows.forEach(function(r){ out[r.field_key] = r.content; });
    cb(out);
  }).catch(function(){ cb({}); });
}

function setMark(el, msg, cls){
  if(!el) return;
  el.textContent = msg;
  el.className = 'savemark' + (cls ? ' ' + cls : '');
  if(cls === 'ok'){ setTimeout(function(){ if(el.textContent === 'Saved') el.textContent = ''; }, 2200); }
}

/* wire a textarea to autosave */
function wire(ta, mark){
  var timer = null;
  ta.addEventListener('input', function(){
    clearTimeout(timer);
    setMark(mark, 'Typing\u2026', '');
    timer = setTimeout(function(){ saveField(ta.getAttribute('data-field'), ta.value, mark); }, 1200);
  });
  ta.addEventListener('blur', function(){
    clearTimeout(timer);
    saveField(ta.getAttribute('data-field'), ta.value, mark);
  });
}

function portraitHTML(slug, idx, hint){
  var m = MEDIA[slug] || {};
  var url = idx === 'portrait' ? m.portrait : (m.extra && m.extra[idx]);
  if(url){
    return '<div class="portrait"><img src="' + esc(url) + '" alt="' + esc(slug) + '"></div>';
  }
  return '<div class="portrait"><div class="empty">' + esc(hint || 'Add a still in the Teacher tab') + '</div></div>';
}

function playerHTML(url){
  if(!url) return '';
  if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(url)){
    return '<div class="player"><video controls preload="metadata" src="' + esc(url) + '"></video></div>';
  }
  var yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  if(yt){
    return '<div class="player"><iframe src="https://www.youtube.com/embed/' + yt[1]
      + '" allowfullscreen title="clip"></iframe></div>';
  }
  return '<div class="player"><iframe src="' + esc(url) + '" allowfullscreen title="clip"></iframe></div>';
}

function taBlock(field, placeholder, minh){
  var h = '<textarea data-field="' + esc(field) + '" placeholder="' + esc(placeholder || '') + '"';
  if(minh) h += ' style="min-height:' + minh + 'px"';
  h += '></textarea><div class="savemark" data-mark="' + esc(field) + '"></div>';
  return h;
}

function framesHTML(list){
  if(!list || !list.length) return '';
  var h = '<div class="frames"><h4>Sentence frames</h4><ul>';
  for(var i=0;i<list.length;i++) h += '<li>' + gl(list[i]) + '</li>';
  return h + '</ul></div>';
}

function hookTextareas(viewName){
  var root = document.getElementById('view-' + viewName);
  var tas = root.querySelectorAll('textarea');
  for(var i=0;i<tas.length;i++){
    var f = tas[i].getAttribute('data-field');
    var mark = root.querySelector('[data-mark="' + f + '"]');
    wire(tas[i], mark);
  }
}

  h += '<div class="bar"><i id="bakeBar"></i></div><div class="savemark" id="bakeMark"></div>';
  h += '<p class="note" style="margin-top:12px">' + Object.keys(GLOSSARY).length + ' words in the glossary.</p></div>';

  /* work viewer */
  h += '<div class="card" translate="no" data-stap="1" style="grid-column:1/-1"><h3 translate="yes" data-sdir="studentwork" data-sen="Student work">Student work</h3>'
    + '<div class="stack" style="margin:12px 0">'
    + '<select id="fChar"><option value="">All characters</option></select>'
    + '<input type="text" id="fPeriod" placeholder="Period" style="width:80px">'
    + '<button class="solid" id="btnLoadWork">Load</button>'
    + '<button class="ghost" id="btnCsv">Download CSV</button></div>'
    + '<div id="workOut" class="note">Nothing loaded yet.</div></div>';

  h += '</div>';
  document.getElementById('view-teacher').innerHTML = h;

  /* fill selects */
  var bl = document.getElementById('bakeLang');
  var fc = document.getElementById('fChar');
  for(var k=1;k<LANGS.length;k++){
    var o = document.createElement('option');
    o.value = LANGS[k].code; o.textContent = LANGS[k].label; bl.appendChild(o);
  }
  for(var n=0;n<CHARACTERS.length;n++){
    var o2 = document.createElement('option');
    o2.value = CHARACTERS[n].slug; o2.textContent = CHARACTERS[n].first; fc.appendChild(o2);
  }

  document.getElementById('btnMedia').onclick = function(){
    var ins = document.querySelectorAll('[data-media]');
    for(var i=0;i<ins.length;i++){
      var parts = ins[i].getAttribute('data-media').split('|');
      var slug = parts[0], what = parts[1];
      if(!MEDIA[slug]) MEDIA[slug] = {};
      if(what === 'portrait'){ MEDIA[slug].portrait = ins[i].value.trim(); }
      else {
        var idx = parseInt(what.replace('clip',''), 10);
        if(!MEDIA[slug].clips) MEDIA[slug].clips = {};
        MEDIA[slug].clips[idx] = ins[i].value.trim();
      }
    }
    lsSet('sbm_media', MEDIA);
    setMark(document.getElementById('mediaMark'), 'Saved', 'ok');
  };

  document.getElementById('btnBake').onclick = function(){
    var code = document.getElementById('bakeLang').value;
    var terms = Object.keys(GLOSSARY);
    var batch = 8, done = 0;
    var bar = document.getElementById('bakeBar');
    var mark = document.getElementById('bakeMark');
    setMark(mark, 'Fetching\u2026', '');
    function step(){
      if(done >= terms.length){
        setMark(mark, 'Done \u2014 ' + Object.keys(TR[code] || {}).length + ' words ready', 'ok');
        return;
      }
      var slice = terms.slice(done, done + batch);
      fetchTerms(slice, code, function(){
        done += batch;
        bar.style.width = Math.min(100, Math.round(done / terms.length * 100)) + '%';
        setTimeout(step, 220);
      });
    }
    step();
  };

  document.getElementById('btnDl').onclick = function(){
    var blob = new Blob([JSON.stringify(TR, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sbm_translations.json';
    a.click();
  };

  var lastRows = [];
  document.getElementById('btnLoadWork').onclick = function(){
    var out = document.getElementById('workOut');
    out.textContent = 'Loading\u2026';
    var url = SUPA_URL + '/rest/v1/' + TABLE + '?select=*&order=student_name.asc';
    var cs = document.getElementById('fChar').value;
    var pd = document.getElementById('fPeriod').value.trim();
    if(cs) url += '&character_slug=eq.' + encodeURIComponent(cs);
    if(pd) url += '&period=eq.' + encodeURIComponent(pd);
    fetch(url, {headers: sbHeaders()}).then(function(r){ return r.json(); }).then(function(rows){
      lastRows = Array.isArray(rows) ? rows : [];
      if(!lastRows.length){ out.textContent = 'No work saved yet for that filter.'; return; }
      var t = '<table><tr><th>Student</th><th>Per</th><th>Character</th><th>Field</th><th>Response</th></tr>';
      for(var i=0;i<lastRows.length;i++){
        var r2 = lastRows[i];
        t += '<tr><td>' + esc(r2.student_name || '') + '</td><td>' + esc(r2.period || '')
          + '</td><td>' + esc(r2.character_slug || '') + '</td><td>' + esc(r2.field_key || '')
          + '</td><td>' + esc(r2.content || '') + '</td></tr>';
      }
      out.innerHTML = t + '</table>';
    }).catch(function(){ out.textContent = 'Could not reach Supabase.'; });
  };

  document.getElementById('btnCsv').onclick = function(){
    if(!lastRows.length) return;
    var lines = ['student,period,character,field,response'];
    for(var i=0;i<lastRows.length;i++){
      var r = lastRows[i];
      var cell = function(v){ return '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"'; };
      lines.push([cell(r.student_name), cell(r.period), cell(r.character_slug),
                  cell(r.field_key), cell(r.content)].join(','));
    }
    var blob = new Blob([lines.join('\n')], {type:'text/csv'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'standbyme_work.csv';
    a.click();
  };
}

/* ============================================================

function lines(n){
  var s = '<div class="p-lines">';
  for(var i=0;i<n;i++) s += '<div></div>';
  return s + '</div>';
}

function pgHead(title, cname){
  return '<div class="p-head"><div class="p-t">' + esc(title) + '</div>'
    + '<div class="p-c">' + esc(cname) + '</div></div>';
}

function nameBox(){
  return '<div class="p-name">Name ______________________________ &nbsp; '
    + 'Period _______ &nbsp; Group ____________________ &nbsp; Job ____________________</div>';
}

function buildPacket(slug){
  var c = ch(slug);
  var cn = c.first + ' ' + c.last;
  var h = '';

  /* cover */
  h += '<div class="pg">' + pgHead('Stand By Me \u2014 Character Study', cn);
  h += '<div class="p-sub">Castle Rock, Oregon, 1959 &nbsp;|&nbsp; played by ' + esc(c.actor) + '</div>';
  h += nameBox();
  h += '<p class="p-ask">' + esc(plain(c.framing)) + '</p>';
  h += '<div class="p-box"><b>Your group\u2019s six jobs</b><br>';
  for(var r=0;r<ROLES.length;r++){
    h += ROLES[r].name + ' \u2014 ' + plain(ROLES[r].job) + '<br>';
  }
  h += '</div>';
  h += '<div class="p-box"><b>Clips we will watch</b><br>';
  for(var i=0;i<c.clips.length;i++){
    h += '<div class="p-clip"><b>' + esc(plain(c.clips[i].t)) + '</b> (' + esc(c.clips[i].time) + ')<br>'
      + esc(plain(c.clips[i].watch)) + '</div>';
  }
  h += '</div></div>';

  /* two column */
  h += '<div class="pg">' + pgHead('Two versions of the same boy', cn);
  h += '<div class="p-sub">Fill the left side first, before you watch closely.</div>';
  h += '<div class="p-2col"><div><h4>What Castle Rock says</h4>'
    + '<div style="font-size:9.5pt;margin-bottom:5pt">Rumors and insults. Not what is true.</div>'
    + lines(13) + '</div><div><h4>What we know</h4>'
    + '<div style="font-size:9.5pt;margin-bottom:5pt">Only what you saw. Name the scene.</div>'
    + lines(13) + '</div></div></div>';

  /* one page per role */
  for(var q=0;q<ROLES.length;q++){
    var role = ROLES[q];
    var d = c.roles[role.key];
    h += '<div class="pg">' + pgHead(role.name, cn);
    h += '<div class="p-sub">' + esc(plain(role.job)) + '</div>';
    h += nameBox();
    h += '<p class="p-ask">' + esc(plain(d.ask)) + '</p>';
    if(d.frames && d.frames.length){
      h += '<div class="p-frames">';
      for(var f=0;f<d.frames.length;f++) h += '<div>' + esc(plain(d.frames[f])) + '</div>';
      h += '</div>';
    }
    if(d.bank) h += '<div style="font-size:10pt;margin-bottom:8pt"><b>Word bank:</b> ' + esc(d.bank) + '</div>';
    h += lines(11) + '</div>';
  }

  /* ace */
  if(c.slug !== 'ace'){
    h += '<div class="pg">' + pgHead('He is going to meet Ace', cn);
    h += '<div class="p-sub">Do not watch the end yet.</div>';
    h += '<div class="p-box">' + esc(plain(ACE_BRIEF)) + '</div>';
    h += '<p class="p-ask">' + esc(c.first) + ' is going to stand in front of this man. What happens?</p>';
    h += '<div class="p-frames"><div>I think ' + esc(c.first) + ' will ___.</div>'
      + '<div>He will not ___ because ___.</div><div>Ace will ___.</div>'
      + '<div>I think this because earlier ' + esc(c.first) + ' ___.</div></div>';
    h += lines(7);
    h += '<p class="p-ask" style="margin-top:14pt">After you watch: what did you get wrong?</p>' + lines(5);
    h += '</div>';
  }

  /* timeline */
  h += '<div class="pg">' + pgHead(c.first + ' across the walk', cn);
  h += '<div class="p-sub">What is he doing? What is he feeling? '
    + 'If he does not change, write that \u2014 that is information too.</div>';
  h += '<div class="p-grid5">';
  for(var s=0;s<STOPS.length;s++){
    h += '<div><h4>' + esc(STOPS[s].t) + '</h4><div class="tw">' + esc(STOPS[s].w) + '</div></div>';
  }
  h += '</div></div>';

  /* 1985 */
  h += '<div class="pg">' + pgHead('1985', cn);
  h += '<div class="p-sub">He is twelve in 1959. Write his adult life before your teacher reads the real ending.</div>';
  h += '<div class="p-frames"><div>In 1985, ' + esc(c.first) + ' is a ___.</div>'
    + '<div>He lives in ___.</div><div>He is ___ because ___.</div></div>';
  h += lines(8);
  h += '<p class="p-ask" style="margin-top:16pt">What the movie tells us:</p>' + lines(4);
  h += '</div>';

  /* glossary */
  h += '<div class="pg">' + pgHead('Words', cn);
  var code = STATE.lang;
  h += '<div class="p-sub">' + (code ? 'English and ' + plain(langLabel(code)) : 'English definitions') + '</div>';
  h += '<div class="p-gloss">';
  var keys = Object.keys(GLOSSARY).sort();
  for(var g=0;g<keys.length;g++){
    var w = keys[g];
    h += '<div><b>' + esc(w) + '</b> \u2014 ' + esc(GLOSSARY[w]);
    if(code && TR[code] && TR[code][w]) h += '<br><i>' + esc(TR[code][w]) + '</i>';
    h += '</div>';
  }
  h += '</div></div>';

  return h;
}

document.getElementById('btnPrint').onclick = function(){
  var slug = (STATE.view === 'character') ? STATE.slug : null;
  var root = document.getElementById('printRoot');
  if(slug){
    root.innerHTML = buildPacket(slug);
  } else {
    var all = '';
    for(var i=0;i<CHARACTERS.length;i++) all += buildPacket(CHARACTERS[i].slug);
    root.innerHTML = all;
  }
  window.print();
};

/* ============================================================
   NAV + BOOT
   ============================================================ */

function renderStops(){
  var el = document.getElementById('stops');
  var h = '<button class="stop util" data-go="overview"><span class="dot"></span>The project</button>';
  for(var i=0;i<CHARACTERS.length;i++){
    h += '<button class="stop" data-go="c:' + CHARACTERS[i].slug + '"><span class="dot"></span>'
      + esc(CHARACTERS[i].first) + '</button>';
  }
  h += '<button class="stop util" data-go="teacher"><span class="dot"></span>Teacher</button>';
  el.innerHTML = h;
  var btns = el.querySelectorAll('.stop');
  for(var b=0;b<btns.length;b++){
    btns[b].onclick = function(){ go(this.getAttribute('data-go')); };
  }
}

function markStops(){
  var btns = document.querySelectorAll('.stop');
  for(var i=0;i<btns.length;i++){
    var g = btns[i].getAttribute('data-go');
    var on = (g === 'overview' && STATE.view === 'overview')
          || (g === 'teacher' && STATE.view === 'teacher')
          || (g === 'c:' + STATE.slug && STATE.view === 'character');
    btns[i].classList.toggle('on', on);
  }
}

function go(target){
  hideTip();
  if(target === 'overview'){ STATE.view = 'overview'; renderOverview(); }
  else if(target === 'teacher'){ STATE.view = 'teacher'; renderTeacher(); }
  else if(target.indexOf('c:') === 0){
    STATE.slug = target.slice(2); STATE.view = 'character'; renderCharacter();
  }
  var views = document.querySelectorAll('.view');
  for(var i=0;i<views.length;i++) views[i].classList.remove('on');
  document.getElementById('view-' + STATE.view).classList.add('on');
  markStops();
  window.scrollTo(0,0);
}

function boot(){
  loadLocal();

  var sl = document.getElementById('selLang');
  for(var i=0;i<LANGS.length;i++){
    var o = document.createElement('option');
    o.value = LANGS[i].code; o.textContent = LANGS[i].label; sl.appendChild(o);
  }
  sl.value = STATE.lang;
  sl.onchange = function(){ STATE.lang = this.value; lsSet('sbm_lang', STATE.lang); hideTip(); };

  var sm = document.getElementById('selMode');
  sm.value = STATE.mode;
  sm.onchange = function(){ STATE.mode = this.value; lsSet('sbm_mode', STATE.mode); hideTip(); };

  var nm = document.getElementById('inName');
  nm.value = STATE.name;
  nm.onchange = function(){
    STATE.name = this.value.trim(); saveStudent();
    if(STATE.view === 'character') renderCharacter();
  };

  var pd = document.getElementById('inPeriod');
  pd.value = STATE.period;
  pd.onchange = function(){ STATE.period = this.value.trim(); saveStudent(); };

  renderStops();
  go('overview');
}

boot();
</script>
