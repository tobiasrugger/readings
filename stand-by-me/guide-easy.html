<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Guide #1 — The Body / Stand By Me</title>
<style>
  :root{
    --ink:#1c2024;
    --paper:#ffffff;
    --rail:#3b4a3f;      /* pine green — signal lamps, Maine woods */
    --rust:#8f4426;      /* oxidized rail steel */
    --band:#e3e6e2;      /* question header bar */
    --line:#9aa3a0;
    --soft:#f4f5f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#dfe2dd;
    color:var(--ink);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.5;
  }

  /* ---------- toolbar ---------- */
  .bar{
    position:sticky;top:0;z-index:50;
    background:var(--rail);color:#fff;
    padding:10px 16px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .bar h1{font-size:16px;margin:0 14px 0 0;font-weight:600;letter-spacing:.2px}
  .bar button{
    font:inherit;font-size:14px;
    background:#fff;color:var(--rail);
    border:none;border-radius:3px;
    padding:7px 12px;cursor:pointer;
  }
  .bar button:hover{background:#ffe9c9}
  .bar button:focus-visible{outline:3px solid #ffd27f;outline-offset:2px}
  .bar .spacer{flex:1}
  .status{font-size:13px;opacity:.85;min-width:90px}

  /* ---------- page ---------- */
  .sheet{
    max-width:8.5in;margin:18px auto 60px;
    background:var(--paper);
    padding:34px 46px 46px;
    box-shadow:0 3px 14px rgba(0,0,0,.18);
  }
  .nameline{
    display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
    border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:26px;
    font-size:15px;
  }
  .nameline label{font-weight:600}
  .nameline input{
    font:inherit;border:none;border-bottom:1px solid var(--line);
    padding:2px 4px;min-width:150px;background:transparent;color:inherit;
  }
  .nameline .teacher{margin-left:auto;font-weight:600}

  .doc-title{text-align:center;margin:0 0 4px;font-size:22px;font-weight:700}
  .doc-sub{text-align:center;margin:0 0 6px;font-size:18px}
  .doc-note{text-align:center;margin:0 0 28px;font-size:14px;color:#5c6560}

  /* ---------- passages ---------- */
  .passage{position:relative;margin:0 0 16px;padding-right:38px}
  .passage p{
    font-family:Georgia,"Times New Roman",serif;
    font-size:17.5px;line-height:1.75;
    text-indent:2em;margin:0 0 10px;
  }
  .gloss{
    font-weight:700;border-bottom:2px dotted var(--rust);cursor:help;
  }
  .speak{
    position:absolute;top:2px;right:0;
    border:1px solid var(--line);background:#fff;border-radius:50%;
    width:30px;height:30px;cursor:pointer;font-size:15px;line-height:1;
    color:var(--rail);
  }
  .speak:hover{background:#eef3ee}

  /* ---------- question boxes ---------- */
  .qrow{display:flex;gap:0;margin:0 0 20px;border:1px solid var(--ink)}
  .qrow > .q{flex:1;border-left:1px solid var(--ink)}
  .qrow > .q:first-child{border-left:none}
  .q{display:flex;flex-direction:column}
  .single{border:1px solid var(--ink);margin:0 0 20px}
  .qhead{
    background:var(--band);border-bottom:1px solid var(--ink);
    padding:6px 10px;font-size:15.5px;font-weight:600;
    display:flex;gap:8px;align-items:flex-start;
  }
  .tag{
    flex:none;font-size:11px;font-weight:700;letter-spacing:.4px;
    color:#fff;background:var(--rail);border-radius:2px;
    padding:3px 6px;margin-top:1px;text-transform:none;
  }
  .tag.infer{background:var(--rust)}
  .tag.predict{background:#5a5f7a}
  .tag.ml{background:#4c6b57}
  .tag.movie{background:#2f3b48}
  .qbody{padding:6px 10px 10px;flex:1;display:flex;flex-direction:column}
  .starter{font-size:13.5px;font-style:italic;color:#4d5551;margin:0 0 4px}
  .mlline{font-size:14px;margin:0 0 6px;display:flex;gap:6px;align-items:center}
  .mlline span{font-weight:600;flex:none}
  .mlline input{
    flex:1;font:inherit;border:none;border-bottom:1px solid var(--line);
    background:transparent;padding:2px 4px;color:inherit;
  }
  textarea{
    font:inherit;font-size:16px;width:100%;
    border:none;background:transparent;color:inherit;
    resize:none;overflow:hidden;padding:2px 2px;
    line-height:30px;
    background-image:repeating-linear-gradient(to bottom,transparent 0 29px,#c9d0cc 29px 30px);
  }
  textarea:focus{outline:2px solid var(--rail);outline-offset:2px;border-radius:2px}
  .vocab-slots{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
  .vocab-slots .mlline span{min-width:104px}

  .ans-print{display:none;white-space:pre-wrap;font-size:16px;
    line-height:30px;
    background-image:repeating-linear-gradient(to bottom,transparent 0 29px,#c9d0cc 29px 30px);}

  .divider{border:none;border-top:2px solid var(--ink);margin:30px 0}
  .chapmark{
    font-size:13px;font-weight:700;color:var(--rust);
    letter-spacing:.5px;margin:26px 0 10px;
  }
  .footmark{text-align:right;font-family:Georgia,serif;font-size:14px;margin-top:26px}

  /* tooltip */
  #tip{
    position:fixed;z-index:99;max-width:260px;display:none;
    background:var(--ink);color:#fff;font-size:14px;line-height:1.35;
    padding:8px 10px;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.3);
  }

  /* ---------- print ---------- */
  @page{margin:0.6in 0.7in}
  @media print{
    body{background:#fff;font-size:12pt}
    .bar,#tip,.speak{display:none !important}
    .sheet{box-shadow:none;margin:0;padding:0;max-width:none}
    .passage p{font-size:12pt;line-height:1.6}
    .qrow,.single{break-inside:avoid;page-break-inside:avoid}
    .passage{break-inside:avoid;page-break-inside:avoid}
    textarea{display:none}
    .ans-print{display:block}
    body.mode-blank .ans-print{color:transparent}
    .qhead{background:#e3e6e2 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .nameline input{border-bottom:1px solid #333}
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Reading Guide #1 · The Body / Stand By Me</h1>
  <button id="btnBlank">Print blank copy</button>
  <button id="btnAns">Print my answers</button>
  <button id="btnBig">Bigger text</button>
  <button id="btnClear">Clear my work</button>
  <span class="spacer"></span>
  <span class="status" id="status">Not saved yet</span>
</div>

<div class="sheet" id="sheet">
  <div class="nameline">
    <label for="nm">Name</label><input id="nm" data-save="nm">
    <label for="cl">Class</label><input id="cl" data-save="cl" style="min-width:80px">
    <span class="teacher">Mr. Toby</span>
  </div>

  <h2 class="doc-title">Reading Guide #1</h2>
  <p class="doc-sub">The Body — Chapter One: “Do You Want to See a Dead Body?”</p>
  <p class="doc-note">Read each part. Then answer the questions in the boxes. Write in English. You can write in your language on the ML line.</p>

  <div id="content"></div>

  <p class="footmark">READING GUIDE #1</p>
</div>

<div id="tip"></div>

<script>
/* ============================================================
   CONTENT — edit here to make Reading Guides #2, #3, #4...
   Passage text is a simplified retelling written for ELD 1.
   Glossary words:  [[word|simple definition]]
   ============================================================ */

var BLOCKS = [

{k:"passage", text:"My name is Gordie Lachance. I was twelve years old. It was the summer of 1959. I lived in a small town in Maine. The town was called Castle Rock. Only 1,300 people lived there. Nothing big ever happened in Castle Rock."},

{k:"qrow", qs:[
  {n:1, tag:"Review", prompt:"<b>Who</b> is the main character? <b>How old</b> is he?", rows:2},
  {n:2, tag:"Review", prompt:"<b>Where</b> does he live?", rows:2}
]},
{k:"qrow", qs:[
  {n:3, tag:"Review", prompt:"<b>When</b> does this story take place?", rows:2},
  {n:4, tag:"Review", prompt:"Is Castle Rock a big city or a small town?", rows:2}
]},

{k:"passage", text:"I had three friends: Chris, Teddy, and Vern. We built a [[treehouse|a small house built in a tree]] in the trees behind a store. The treehouse was old. The [[roof|the top of a house]] leaked when it rained. We played cards there. We told stories there. No adults came inside. It was our place."},

{k:"qrow", qs:[
  {n:5, tag:"Review", prompt:"Who are Gordie’s three friends?", rows:2},
  {n:6, tag:"Infer", tagClass:"infer", prompt:"Make an inference. Why do the boys like the treehouse?", starter:"write: “I infer… because…”", rows:3}
]},
{k:"single", q:{n:7, tag:"ML", tagClass:"ml", prompt:"Write these words in your language.", vocab:["treehouse","roof","adult"], rows:0}},

{k:"passage", text:"That summer was a sad summer for me. My brother Denny died four months before. He died in a car [[accident|when a car crashes and people get hurt]]. Denny was a football star. My parents loved him very much. After Denny died, my parents did not talk to me. My father looked at me, but he did not see me. I was [[invisible|when people cannot see you]]."},

{k:"qrow", qs:[
  {n:8, tag:"Review", prompt:"What happened to Gordie’s brother Denny?", rows:3},
  {n:9, tag:"Infer", tagClass:"infer", prompt:"Make an inference. How does Gordie feel about his parents?", starter:"write: “I infer that he feels… because…”", rows:3}
]},
{k:"single", q:{n:10, tag:"Language", prompt:"“My father looked at me, but he did not see me. I was invisible.”  This means (in English)…", ml:true, rows:3}},

{k:"passage", text:"One hot day in July, Vern ran to the treehouse. He climbed the ladder fast. He could not breathe. His face was red. “You guys want to see a dead body?” he said. We stopped playing cards. Nobody said anything for a long time."},

{k:"qrow", qs:[
  {n:11, tag:"Review", prompt:"What question does Vern ask his friends?", rows:2},
  {n:12, tag:"Predict", tagClass:"predict", prompt:"Make a prediction. What will the boys say to Vern?", starter:"write: “I predict that…”", rows:3}
]},

{k:"passage", text:"Vern told us the story. A boy named Ray Brower was [[missing|lost — nobody can find this person]]. Ray was twelve years old, the same age as us. Three days before, Ray took a bucket and went to pick [[blueberries|small blue fruit that grows in the woods]]. He never came home. The police looked for him in the woods. His mother cried on television. Nobody could find him."},

{k:"qrow", qs:[
  {n:13, tag:"Review", prompt:"Who is Ray Brower? How old is he?", rows:3},
  {n:14, tag:"Review", prompt:"What happened to Ray Brower?", rows:3}
]},
{k:"single", q:{n:15, tag:"ML", tagClass:"ml", prompt:"Write these words in your language.", vocab:["missing","police","body"], rows:0}},

{k:"passage", text:"Vern had a secret. His big brother Billy [[stole|took something that is not yours]] a car with his friend Charlie. They drove far away, near the train tracks. There they saw Ray Brower’s body in the [[woods|a place with many trees; a forest]]. A train hit him. Billy and Charlie were scared. They did not call the police, because the police would ask about the stolen car. Vern hid under the porch and heard everything."},

{k:"qrow", qs:[
  {n:16, tag:"Infer", tagClass:"infer", prompt:"Make an inference. Why didn’t Billy and Charlie call the police?", starter:"write: “I infer… because…”", rows:3},
  {n:17, tag:"Connect", prompt:"Make a connection. Was Vern’s brother a good person or a bad person? Why?", rows:3}
]},

{k:"passage", text:"“We can find the body,” Vern said. “We can walk on the train tracks. It is only twenty miles.” Chris smiled. “We will be on television,” he said. “We will be heroes.” We told our parents a [[lie|when you say something that is not true]]. We said, “We are sleeping at Vern’s house.” We took a little money and a [[canteen|a bottle for water]] of water. Chris took his father’s gun."},

{k:"qrow", qs:[
  {n:18, tag:"Review", prompt:"What is the boys’ plan? Where will they walk?", rows:3},
  {n:19, tag:"Infer", tagClass:"infer", prompt:"Make an inference. Why do the boys want to find the body?", starter:"write: “I infer… because…”", rows:3}
]},
{k:"single", q:{n:20, tag:"Opinion", prompt:"Is this plan a good idea or a bad idea? Write two reasons.", ml:true, rows:4}},

{k:"passage", text:"We started to walk. The sun was very hot. The tracks went out of town, into the woods. We did not know it, but this trip changed our lives. Now I am a man and I am a writer. I still think about that summer. I never had friends later like the friends I had when I was twelve."},

{k:"qrow", qs:[
  {n:21, tag:"Language", prompt:"“I never had friends later like the friends I had when I was twelve.”  This means (in English)…", ml:true, rows:3},
  {n:22, tag:"Predict", tagClass:"predict", prompt:"Make a prediction. What will happen to the boys on the train tracks?", starter:"write: “I predict that…”", rows:3}
]},

{k:"chap", text:"MOVIE CONNECTION — Stand By Me (Rob Reiner, 1986)"},
{k:"qrow", qs:[
  {n:23, tag:"Movie", tagClass:"movie", prompt:"In the movie, what do the four boys look like? Write one sentence about each boy.", rows:5},
  {n:24, tag:"Movie", tagClass:"movie", prompt:"Something in the movie is different from the story. What is different?", rows:5}
]},
{k:"single", q:{n:25, tag:"Predict", tagClass:"predict", prompt:"Make a prediction. What do you think will happen in Chapter 2?", starter:"write: “I predict that…”", rows:6}}
];

/* ============================================================
   RENDER
   ============================================================ */
var TAGCLASS = {Review:"", Infer:"infer", Predict:"predict", ML:"ml", Movie:"movie", Connect:"", Language:"", Opinion:""};

function glossify(raw){
  var out = "";
  var i = 0;
  while(i < raw.length){
    var start = raw.indexOf("[[", i);
    if(start === -1){ out += esc(raw.slice(i)); break; }
    out += esc(raw.slice(i, start));
    var end = raw.indexOf("]]", start);
    var inner = raw.slice(start + 2, end);
    var parts = inner.split("|");
    out += '<span class="gloss" data-def="' + esc(parts[1] || "") + '">' + esc(parts[0]) + '</span>';
    i = end + 2;
  }
  return out;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function plainText(raw){
  return raw.replace(/\[\[([^|\]]+)\|[^\]]*\]\]/g, "$1");
}

function buildQuestion(q){
  var cls = q.tagClass || TAGCLASS[q.tag] || "";
  var h = '<div class="q">';
  h += '<div class="qhead"><span class="tag ' + cls + '">' + esc(q.tag) + '</span>';
  h += '<span>' + q.n + '. ' + q.prompt + '</span></div>';
  h += '<div class="qbody">';
  if(q.starter){ h += '<p class="starter">' + esc(q.starter) + '</p>'; }
  if(q.vocab){
    h += '<div class="vocab-slots">';
    for(var v = 0; v < q.vocab.length; v++){
      var key = "q" + q.n + "v" + v;
      h += '<label class="mlline"><span>' + esc(q.vocab[v]) + ' =</span><input data-save="' + key + '"></label>';
    }
    h += '</div>';
  }
  if(q.ml){
    h += '<label class="mlline"><span>ML:</span><input data-save="q' + q.n + 'ml"></label>';
  }
  if(q.rows > 0){
    h += '<textarea rows="' + q.rows + '" data-save="q' + q.n + '" aria-label="Answer for question ' + q.n + '"></textarea>';
    h += '<div class="ans-print" data-for="q' + q.n + '" style="min-height:' + (q.rows * 30) + 'px"></div>';
  }
  h += '</div></div>';
  return h;
}

function render(){
  var html = "";
  for(var b = 0; b < BLOCKS.length; b++){
    var blk = BLOCKS[b];
    if(blk.k === "passage"){
      html += '<div class="passage"><button class="speak" title="Listen" data-text="' + esc(plainText(blk.text)) + '">&#9658;</button><p>' + glossify(blk.text) + '</p></div>';
    } else if(blk.k === "qrow"){
      html += '<div class="qrow">';
      for(var i = 0; i < blk.qs.length; i++){ html += buildQuestion(blk.qs[i]); }
      html += '</div>';
    } else if(blk.k === "single"){
      html += '<div class="single">' + buildQuestion(blk.q) + '</div>';
    } else if(blk.k === "chap"){
      html += '<p class="chapmark">' + esc(blk.text) + '</p>';
    }
  }
  document.getElementById("content").innerHTML = html;
}
render();

/* ============================================================
   SAVE / RESTORE  (localStorage, with safe fallback)
   ============================================================ */
var KEY = "thebody_rg1_v1";
var memory = {};
var canStore = true;
try { window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t"); }
catch(e){ canStore = false; }

function load(){
  var data = memory;
  if(canStore){
    try{ data = JSON.parse(window.localStorage.getItem(KEY) || "{}"); }catch(e){ data = {}; }
  }
  var fields = document.querySelectorAll("[data-save]");
  for(var i = 0; i < fields.length; i++){
    var k = fields[i].getAttribute("data-save");
    if(data[k]){ fields[i].value = data[k]; }
  }
  autoGrowAll();
  if(!canStore){ setStatus("Saving is off in this preview"); }
}
function save(){
  var data = {};
  var fields = document.querySelectorAll("[data-save]");
  for(var i = 0; i < fields.length; i++){
    data[fields[i].getAttribute("data-save")] = fields[i].value;
  }
  memory = data;
  if(canStore){
    try{ window.localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
  }
  setStatus("Saved " + new Date().toLocaleTimeString());
}
function setStatus(t){ document.getElementById("status").textContent = t; }

var saveTimer = null;
document.addEventListener("input", function(e){
  if(!e.target.hasAttribute || !e.target.hasAttribute("data-save")) return;
  if(e.target.tagName === "TEXTAREA"){ autoGrow(e.target); }
  setStatus("Writing…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
});

function autoGrow(el){
  el.style.height = "auto";
  var min = (parseInt(el.getAttribute("rows"), 10) || 3) * 30;
  el.style.height = Math.max(min, el.scrollHeight) + "px";
}
function autoGrowAll(){
  var t = document.getElementsByTagName("textarea");
  for(var i = 0; i < t.length; i++){ autoGrow(t[i]); }
}
load();

/* ============================================================
   PRINT
   ============================================================ */
function syncPrintAnswers(){
  var t = document.getElementsByTagName("textarea");
  for(var i = 0; i < t.length; i++){
    var target = document.querySelector('[data-for="' + t[i].getAttribute("data-save") + '"]');
    if(target){ target.textContent = t[i].value; }
  }
}
document.getElementById("btnBlank").onclick = function(){
  save();
  document.body.className = "mode-blank";
  syncPrintAnswers();
  window.print();
};
document.getElementById("btnAns").onclick = function(){
  save();
  document.body.className = "mode-answers";
  syncPrintAnswers();
  window.print();
};
window.onbeforeprint = syncPrintAnswers;

document.getElementById("btnClear").onclick = function(){
  if(!window.confirm("Erase all your answers on this guide?")) return;
  var fields = document.querySelectorAll("[data-save]");
  for(var i = 0; i < fields.length; i++){ fields[i].value = ""; }
  memory = {};
  if(canStore){ try{ window.localStorage.removeItem(KEY); }catch(e){} }
  autoGrowAll();
  setStatus("Cleared");
};

var big = false;
document.getElementById("btnBig").onclick = function(){
  big = !big;
  document.body.style.fontSize = big ? "20px" : "17px";
  this.textContent = big ? "Normal text" : "Bigger text";
  autoGrowAll();
};

/* ============================================================
   READ ALOUD + WORD HELP
   ============================================================ */
document.addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest(".speak") : null;
  if(!btn) return;
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(btn.getAttribute("data-text"));
  u.rate = 0.82;
  u.lang = "en-US";
  window.speechSynthesis.speak(u);
});

var tip = document.getElementById("tip");
function showTip(el){
  tip.textContent = el.getAttribute("data-def");
  tip.style.display = "block";
  var r = el.getBoundingClientRect();
  var top = r.bottom + 8;
  if(top > window.innerHeight - 80){ top = r.top - tip.offsetHeight - 8; }
  tip.style.top = top + "px";
  tip.style.left = Math.min(r.left, window.innerWidth - 280) + "px";
}
document.addEventListener("mouseover", function(e){
  if(e.target.classList && e.target.classList.contains("gloss")) showTip(e.target);
});
document.addEventListener("mouseout", function(e){
  if(e.target.classList && e.target.classList.contains("gloss")) tip.style.display = "none";
});
document.addEventListener("click", function(e){
  if(e.target.classList && e.target.classList.contains("gloss")){ showTip(e.target); }
  else if(!e.target.closest || !e.target.closest("#tip")){ tip.style.display = "none"; }
});
</script>

(function(){
  var SUPA_URL = 'https://lhmwtfyceilgndpygivj.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
  var TABLE = 'body_work';
  var PAGE  = 'guide-easy';
  var EMAIL_KEY = 'sbm_student_email';

  var email = "";
  var pushTimer = null;
  var dirty = false;

  /* ---------- bar ---------- */
  var wrap = document.createElement('div');
  wrap.className = 'cl-bar';
  wrap.innerHTML =
    '<b>Save my work:</b>' +
    '<span id="cl-signin"><input id="cl-email" type="email" placeholder="your school email" autocomplete="email">' +
    '<button id="cl-go">Sign in</button></span>' +
    '<span id="cl-who" class="cl-in" style="display:none"></span>' +
    '<button id="cl-turn" class="ghost" style="display:none">Turn in</button>' +
    '<button id="cl-out" class="ghost" style="display:none">Sign out</button>' +
    '<span class="cl-status" id="cl-status">Not signed in \u2014 work is only on this device</span>';

  var anchor = document.querySelector('.bar');
  if(anchor && anchor.parentNode){ anchor.parentNode.insertBefore(wrap, anchor.nextSibling); }
  else { document.body.insertBefore(wrap, document.body.firstChild); }

  var $ = function(id){ return document.getElementById(id); };
  function status(msg, cls){
    var s = $('cl-status');
    s.textContent = msg;
    s.className = 'cl-status' + (cls ? ' ' + cls : '');
  }

  /* ---------- field helpers ---------- */
  function skip(k){
    /* teacher-only fields: movie clip times and image links */
    return /^c\d+[se]$/.test(k) || /^url\d+$/.test(k) || k === '__text' || k === '__lang';
  }
  function collect(){
    var out = {};
    var f = document.querySelectorAll('[data-save]');
    for(var i = 0; i < f.length; i++){
      var k = f[i].getAttribute('data-save');
      if(skip(k)) continue;
      if(f[i].value) out[k] = f[i].value;
    }
    return out;
  }
  function apply(answers){
    if(!answers) return;
    var f = document.querySelectorAll('[data-save]');
    for(var i = 0; i < f.length; i++){
      var k = f[i].getAttribute('data-save');
      if(!(k in answers)) continue;
      f[i].value = answers[k];
      var ev;
      try{ ev = new Event('input', {bubbles:true}); }
      catch(e){ ev = document.createEvent('Event'); ev.initEvent('input', true, false); }
      f[i].dispatchEvent(ev);
    }
  }
  function fieldVal(key){
    var el = document.querySelector('[data-save="' + key + '"]');
    return el ? el.value : "";
  }

  /* ---------- network ---------- */
  function headers(extra){
    var h = {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json'
    };
    if(extra){ for(var k in extra){ h[k] = extra[k]; } }
    return h;
  }

  function pull(){
    var url = SUPA_URL + '/rest/v1/' + TABLE +
      '?select=answers&email=eq.' + encodeURIComponent(email) +
      '&page=eq.' + encodeURIComponent(PAGE);
    return fetch(url, {headers: headers()})
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){ return (rows && rows[0]) ? rows[0].answers : null; });
  }

  function push(turnedIn){
    if(!email) return Promise.resolve();
    var body = [{
      email: email,
      page: PAGE,
      name: fieldVal('nm'),
      class_period: fieldVal('cl'),
      answers: collect(),
      updated_at: new Date().toISOString()
    }];
    if(turnedIn){ body[0].turned_in = true; }
    var url = SUPA_URL + '/rest/v1/' + TABLE + '?on_conflict=email,page';
    return fetch(url, {
      method: 'POST',
      headers: headers({'Prefer': 'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify(body)
    }).then(function(r){
      if(r.ok){
        dirty = false;
        status('Saved ' + new Date().toLocaleTimeString(), 'ok');
      } else {
        status('Could not save to the server \u2014 kept on this device', 'warn');
      }
    }).catch(function(){
      status('Offline \u2014 kept on this device', 'warn');
    });
  }

  function queue(){
    if(!email) return;
    dirty = true;
    status('Writing\u2026');
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){ push(false); }, 1500);
  }

  /* ---------- sign in / out ---------- */
  function signedInUI(){
    $('cl-signin').style.display = 'none';
    $('cl-who').style.display = '';
    $('cl-who').textContent = email;
    $('cl-turn').style.display = '';
    $('cl-out').style.display = '';
  }

  function signIn(addr, silent){
    email = String(addr || "").trim().toLowerCase();
    if(email.indexOf('@') < 1){ status('Please type your full email address', 'warn'); return; }
    try{ window.localStorage.setItem(EMAIL_KEY, email); }catch(e){}
    signedInUI();
    status('Loading your work\u2026');
    pull().then(function(answers){
      if(answers && Object.keys(answers).length){
        apply(answers);
        status('Loaded your saved work', 'ok');
      } else {
        status(silent ? 'Signed in' : 'Signed in \u2014 nothing saved yet', 'ok');
        if(Object.keys(collect()).length){ push(false); }
      }
    }).catch(function(){
      status('Offline \u2014 work is saved on this device', 'warn');
    });
  }

  $('cl-go').onclick = function(){ signIn($('cl-email').value, false); };
  $('cl-email').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ signIn($('cl-email').value, false); }
  });
  $('cl-out').onclick = function(){
    if(dirty){ push(false); }
    try{ window.localStorage.removeItem(EMAIL_KEY); }catch(e){}
    email = "";
    $('cl-signin').style.display = '';
    $('cl-who').style.display = 'none';
    $('cl-turn').style.display = 'none';
    $('cl-out').style.display = 'none';
    status('Signed out');
  };
  $('cl-turn').onclick = function(){
    if(!email) return;
    clearTimeout(pushTimer);
    push(true).then(function(){
      status('Turned in \u2014 you can still make changes', 'ok');
    });
  };

  /* ---------- listeners ---------- */
  document.addEventListener('input', function(e){
    if(e.target && e.target.hasAttribute && e.target.hasAttribute('data-save')){
      if(!skip(e.target.getAttribute('data-save'))){ queue(); }
    }
  });
  window.addEventListener('beforeunload', function(){
    if(dirty && email && navigator.sendBeacon){
      /* best effort flush */
      clearTimeout(pushTimer);
      push(false);
    }
  });

  /* ---------- auto sign-in ---------- */
  var saved = null;
  try{ saved = window.localStorage.getItem(EMAIL_KEY); }catch(e){}
  if(saved){ $('cl-email').value = saved; signIn(saved, true); }
})();
</script>

</body>
</html>
