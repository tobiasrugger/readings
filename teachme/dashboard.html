<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Teach Mr. Toby · Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--paper:#f6efe0;--card:#fffdf7;--green:#2e8b57;--gold:#e8a33d;--blue:#2f6db5;--red:#c0392b;--purple:#7a4fb5;--muted:#5d6170}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:17px}
button{font-family:inherit;cursor:pointer}
#top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:2px solid var(--ink);background:#fff;position:sticky;top:0;z-index:10}
#top .all{border:2px solid var(--ink);border-radius:10px;padding:5px 12px;font-weight:900;text-decoration:none;color:var(--ink);background:#ffd45c}
#top h1{margin:0;font-size:21px;font-weight:900;flex:1}
.tabs button{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:6px 14px;font-weight:900;margin-right:4px}
.tabs button.on{background:var(--ink);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
.box{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:14px 16px;margin:16px 0;display:flow-root}
.box h2{margin:0 0 4px;font-size:22px;font-weight:900}
.wpic{float:right;width:170px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin:0 0 8px 14px;background:#fff}
.wpic svg{display:block;width:100%;height:auto}
.sense{color:var(--muted);font-weight:800}
.sent{font-weight:800;background:#fff6d8;border:2px dashed #c9a24a;border-radius:8px;padding:4px 10px;display:inline-block;margin:6px 0}
.gsent{color:var(--blue);font-weight:700;font-size:15px}
.lang{border-top:2px solid var(--ink);margin-top:10px;padding-top:8px;clear:both}
.lang h3{margin:0 0 6px;font-size:18px;font-weight:900}
.form{display:grid;grid-template-columns:minmax(140px,1.2fr) 1.5fr auto;gap:10px;align-items:start;border:2px solid #cfc6b0;border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff}
.form.v-ok{border-color:var(--green);background:#eef8f1}.form.v-syn{border-color:var(--blue);background:#eef4ff}.form.v-other,.form.v-no{border-color:var(--red);background:#fff1ef}
.fw{font-size:26px;font-weight:900}
.rom{color:var(--purple);font-weight:800}
.back{font-size:15px;color:var(--muted)}
.auto{display:inline-block;border-radius:999px;padding:1px 9px;font-weight:900;font-size:13px;border:2px solid var(--ink);margin:3px 0}
.a-match{background:#bfe8cf}.a-syn{background:#cfe0ff}.a-mixed{background:#ffe6a8}.a-other{background:#ffc9c2}.a-unknown{background:#e6e6e6}.a-wait{background:#fff}
.who{font-size:14px;margin-top:4px}
.who button,.play{border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:0 8px;font-size:13px;font-weight:800;margin:2px 2px 0 0}
.acts{display:flex;flex-direction:column;gap:4px}
.acts button{border:2px solid var(--ink);border-radius:8px;background:#fff;font-weight:800;padding:3px 9px;font-size:14px;text-align:left}
.acts button.on{color:#fff}.acts .b-ok.on{background:var(--green)}.acts .b-syn.on{background:var(--blue)}.acts .b-other.on{background:var(--red)}.acts .b-no.on{background:#555}
.chips button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:4px 12px;margin:3px 3px 0 0;font-weight:800}
.chips button.on{background:var(--blue);color:#fff}
.seed{font-size:13px;color:var(--muted);font-weight:800}
.card{max-width:640px;margin:16px auto}
.card .big{font-size:38px;font-weight:900}
.card .ans{font-size:34px;font-weight:900}
.btn{border:2px solid var(--ink);border-radius:12px;padding:9px 16px;font-size:17px;font-weight:900;background:#fff;box-shadow:3px 3px 0 var(--ink);margin:4px 6px 0 0}
.btn.go{background:var(--green);color:#fff}.btn.no{background:#ffd45c}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1.5px solid #cfc6b0;padding:5px 8px;text-align:left;font-size:15px}
th{background:#efe6cf}
.note{border:2px solid var(--red);background:#ffe9e6;border-radius:10px;padding:8px 12px;font-weight:800;margin:10px 0}
.help{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:10px 14px;margin:10px 0}
#gate{position:fixed;inset:0;background:rgba(43,45,66,.9);display:flex;align-items:center;justify-content:center;z-index:50}

input{font-family:inherit;font-size:17px;padding:7px 10px;border:2px solid var(--ink);border-radius:10px;width:100%}
.legend span{margin-right:10px}
/* ---------- Quiz Mr. Toby (projector) ---------- */

.qsetup .chips button{font-size:17px}

#stage.on{display:flex}

.score{display:flex;gap:10px}
.score .side{border:3px solid var(--ink);border-radius:14px;padding:4px 14px;font-weight:900;font-size:22px;box-shadow:3px 3px 0 var(--ink);text-align:center;min-width:120px}

.qtext{flex:1;min-width:300px;max-width:640px}
.qword{font-size:clamp(46px,7vw,92px);font-weight:900;line-height:1.05}
.qsense{font-size:clamp(18px,2.2vw,26px);color:var(--muted);font-weight:800;margin:4px 0 10px}
.qsent{font-size:clamp(20px,2.6vw,32px);font-weight:800;background:#fff6d8;border:3px dashed #c9a24a;border-radius:12px;padding:6px 14px;display:inline-block}
.qsent .hl{background:#ffd45c;border-radius:6px;padding:0 4px}
.qprompt{font-size:clamp(20px,2.4vw,30px);font-weight:900;margin:14px 0 6px;color:var(--blue)}
.qbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.qbtns button{border:3px solid var(--ink);border-radius:14px;padding:12px 20px;font-size:clamp(18px,2vw,24px);font-weight:900;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.qbtns .ok{background:var(--green);color:#fff}.qbtns .again{background:#ffd45c}.qbtns .show{background:#e6dcff}.qbtns .next{background:var(--blue);color:#fff}
.qbtns button:disabled{opacity:.45}
.qtries{font-weight:900;font-size:20px;margin-top:8px;min-height:28px}
.qquip{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 14px;font-size:clamp(17px,2vw,22px);font-weight:800;margin-top:10px;display:flex;gap:10px;align-items:center}
.qquip .qwho{font-weight:900;font-size:clamp(18px,2.1vw,24px);color:#fff;background:var(--purple);border-radius:999px;padding:2px 12px}
.qans{border:4px solid var(--green);background:#eef8f1;border-radius:16px;padding:10px 16px;margin-top:14px}
.qans .f{font-size:clamp(34px,5vw,64px);font-weight:900;line-height:1.1}
.qans .r{font-size:clamp(22px,3vw,36px);font-weight:900;color:var(--purple)}
.qans .row{margin:4px 0 8px}
.qans .gs{color:var(--blue);font-weight:800;font-size:clamp(16px,1.8vw,22px)}
.qkeys{font-size:13px;color:var(--muted);font-weight:800;padding:4px 18px 10px}
.qend{max-width:760px;margin:30px auto;text-align:center}
.qend .big{font-size:clamp(40px,6vw,70px);font-weight:900}
.qend table{margin-top:10px}
.pop{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:60;animation:pop 1.2s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media(max-width:700px){.form{grid-template-columns:1fr}.wpic{width:120px}}
</style>
</head>

<script>
(function(){

/* set picker: every set in words.js + lp-sets.js */
(function(){var sel=document.getElementById('setSel'), order=(TM.SET_ORDER||Object.keys(TM.SETS)).filter(function(k){return TM.SETS[k];});
 order.forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=TM.SETS[k].title||k;if(k===SET)o.selected=true;sel.appendChild(o);});
 sel.onchange=function(){var u=new URL(location.href);u.searchParams.set('set',sel.value);location.href=u.toString();};

try{if(sessionStorage.getItem('tm_ok')==='1'||new URLSearchParams(location.search).get('pw')===PASSWORD)open();}catch(e){}

var WORK=[], LEX={}, TAB='check', LANGF='', ONLYNEW=false, LEARNLANG='';

 Promise.all([

 ]).then(function(res){

    Object.keys(Ao).forEach(function(w){A[w]=Ao[w];});Object.keys(An).forEach(function(w){A[w]=An[w];});
    var m=JSON.parse(JSON.stringify(newer));m.email=k;m.answers=Object.assign({},newer.answers,{A:A});m.turned_in=!!(r.turned_in||o.turned_in);by[k]=m;});
  WORK=Object.keys(by).map(function(k){return by[k];});

 }).catch(function(e){$('main').innerHTML='<div class="note">Can\u2019t load: '+esc(e.message)+'. If this says 404, the SQL for teachme_work / teachme_lex hasn\u2019t been run yet.</div>';});
}
function saveLex(row){row.updated_at=new Date().toISOString();LEX[lexKey(row.word_id,row.lang,row.form)]=row;
 var body={};['word_id','lang','form','rom','back','auto','verdict','note','src','box','due','seen','updated_at'].forEach(function(k){if(row[k]!==undefined)body[k]=row[k];});
 return fetch(SUPA_URL+'/rest/v1/teachme_lex?on_conflict=word_id,lang,form',{method:'POST',headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)})
 .then(function(r){if(!r.ok)throw new Error(r.status);}).catch(function(){$('msg').innerHTML='<div class="note">A save didn\u2019t go through. Reload and try again.</div>';});}

document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){TAB=b.getAttribute('data-t');document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b);});render();};});
function render(){if(TAB==='check')renderCheck();else if(TAB==='learn')renderLearn();else if(TAB==='quiz')renderQuiz();else renderStudents();}

/* ---------- which language a student's word is in ---------- */
function langOf(r){var d=(r.dialect||(r.answers||{}).dialect||'');if((r.lang==='Mandarin'||r.lang==='Cantonese')&&(d==='Mandarin'||d==='Cantonese'))return d;
 if((r.lang==='Mandarin'||r.lang==='Cantonese')&&d&&d!=='Other')return d; return r.lang;}
function trCode(lang){return (TM.LANGS[lang]||{}).tr||(lang==='Taishanese'||lang==='Fuzhounese'?'zh-CN':'auto');}

/* ---------- collect forms per word/lang ---------- */
function collect(){var out={};
 WORK.forEach(function(r){var L=langOf(r), A=(r.answers||{}).A||{};
  WORDS.forEach(function(w){var a=A[w.id];if(!a)return;['s1','s2'].forEach(function(slot){var s=a[slot];if(!s)return;
    var form=(s.typed||'').trim()||((s.ok!==false)?(s.heard||'').trim():'');
    var key=w.id+'|'+L; out[key]=out[key]||{w:w,lang:L,forms:{},voice:[]};
    var who={name:r.student_name||r.email,period:r.period,email:r.email,audio:s.audio||'',slot:slot,heard:s.heard||'',typed:s.typed||'',ok:s.ok,from:(r.answers||{}).from||'',dialect:r.dialect||''};
    if(form){var f=norm(form);var F=out[key].forms[f]=out[key].forms[f]||{form:form,who:[]};F.who.push(who);}
    else if(s.audio) out[key].voice.push(who);});});});
 return out;}

/* ---------- Google: romanization + back-translation ---------- */
var GQ=[], GBUSY=false;
function gtx(q,sl,tl,dts){var u='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+dts.map(function(d){return '&dt='+d;}).join('')+'&q='+encodeURIComponent(q);
 return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function parse(d){var o={tr:'',srcRom:'',tgtRom:'',dict:[]};if(!d)return o;
 (d[0]||[]).forEach(function(x){if(!x)return;if(typeof x[0]==='string')o.tr+=x[0];if(x[2]&&typeof x[2]==='string')o.tgtRom+=x[2];if(x[3]&&typeof x[3]==='string')o.srcRom+=x[3];});
 (d[1]||[]).forEach(function(p){(p[1]||[]).forEach(function(t){if(o.dict.indexOf(t)<0)o.dict.push(t);});});return o;}
var SENTC={};
function sentTr(w,lang){var k=w.id+'|'+lang;if(SENTC[k])return SENTC[k];var c=trCode(lang);
 SENTC[k]=gtx(w.sent,'en',c==='auto'?'zh-CN':c,['t','rm']).then(parse).catch(function(){return null;});return SENTC[k];}
function analyze(w,lang,form){var k=lexKey(w.id,lang,norm(form)), row=LEX[k];
 if(row&&row.auto) return Promise.resolve(row);
 var c=trCode(lang);
 return Promise.all([gtx(form,c,'en',['t','rm','bd']).then(parse).catch(function(){return null;}),sentTr(w,lang)]).then(function(res){
  var b=res[0], s=res[1]; row=row||{word_id:w.id,lang:lang,form:norm(form),src:'student'};
  if(!b){row.auto='unknown';row.back=null;LEX[k]=row;return row;}
  var back=[b.tr].concat(b.dict).map(function(x){return String(x).toLowerCase().trim();}).filter(function(x,i,a){return x&&a.indexOf(x)===i;});
  row.back={words:back.slice(0,10),sent:s?s.tr:'',sentRom:s?s.tgtRom:''};
  row.rom=b.srcRom||row.rom||'';
  row.auto=verdict(w,lang,form,back,s);
  saveLex(row);return row;});}
function verdict(w,lang,form,back,s){var f=norm(form);
 var seeds=(w.seeds[lang]||w.seeds[lang==='Taishanese'?'Cantonese':lang]||[]).map(function(x){return norm(x[0]);});
 if(seeds.some(function(x){return x===f||(f.length>1&&(x.indexOf(f)>=0||f.indexOf(x)>=0));}))return 'match';
 if(s&&s.tr&&norm(s.tr).indexOf(f)>=0)return 'match';
 function hit(list){return list.some(function(e){e=e.toLowerCase();return back.some(function(b){return b===e||(' '+b+' ').indexOf(' '+e+' ')>=0;});});}
 var same=hit([w.en].concat(w.senseEn)), other=hit(w.otherEn);
 var senseOnly=hit(w.senseEn.filter(function(x){return x!==w.en;}));
 if(same&&!other)return 'syn'; if(same&&other)return senseOnly?'mixed':'other'; if(other)return 'other'; return 'unknown';}
var AUTO_TXT={match:'\u2714 Usual word',syn:'\u2248 Same meaning, other word',mixed:'? Two meanings \u2014 ask them',other:'\u2717 Other meaning of the English word',unknown:'? Computer can\u2019t tell',wait:'\u2026 checking'};

function playPath(p){fetch(SUPA_URL+'/storage/v1/object/sign/'+BUCKET+'/'+p,{method:'POST',headers:H(),body:JSON.stringify({expiresIn:3600})}).then(function(r){return r.json();})
 .then(function(j){new Audio(j.signedURL?SUPA_URL+'/storage/v1'+j.signedURL:SUPA_URL+'/storage/v1/object/public/'+BUCKET+'/'+p).play();});}
function speakIn(text,lang){var code=(TM.LANGS[lang]||{}).sp||'';var short=(code.split('-')[0]==='cmn'?'zh':code.split('-')[0]);
 var vs=speechSynthesis.getVoices(), v=null;
 if(lang==='Cantonese') v=vs.filter(function(x){return /zh[-_]HK|yue/i.test(x.lang);})[0];
 else if(lang==='Mandarin') v=vs.filter(function(x){return /zh[-_]CN/i.test(x.lang);})[0];
 else v=vs.filter(function(x){return x.lang.toLowerCase().indexOf(short)===0;})[0];
 if(v){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=.8;speechSynthesis.speak(u);return;}
 var tl=trCode(lang);if(tl==='auto')tl='zh-CN';
 new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+tl+'&q='+encodeURIComponent(text)).play().catch(function(){alert('No voice for '+lang+' on this computer. Use the students\u2019 recordings.');});}
window.TMD={play:playPath,speak:speakIn};

/* ======================= CHECK ======================= */
function renderCheck(){var C=collect(), langs={};Object.keys(C).forEach(function(k){langs[C[k].lang]=1;});
 var h='<div class="help"><b>How to read this.</b> Each word is ONE meaning, pinned by the picture and sentence. For every word a student said, the computer reads it back into English. '+
  '<span class="auto a-match">\u2714 Usual word</span> <span class="auto a-syn">\u2248 Same meaning, other word</span> (a synonym or a home-dialect word \u2014 usually fine) '+
  '<span class="auto a-mixed">? Two meanings</span> <span class="auto a-other">\u2717 Other meaning</span> (like <i>derecho</i> for \u201cright = correct\u201d). '+
  'Your tap decides; \u2714 and \u2248 words go into <b>My practice</b>.</div>';
 h+='<div class="chips">Language: <button data-l="" class="'+(LANGF?'':'on')+'">All</button>'+Object.keys(langs).sort().map(function(l){return '<button data-l="'+esc(l)+'" class="'+(LANGF===l?'on':'')+'">'+esc(l)+'</button>';}).join('')+
  ' &nbsp; <button id="onlynew" class="'+(ONLYNEW?'on':'')+'">Only ones I haven\u2019t checked</button></div>';
 var todo=[];
 WORDS.forEach(function(w){var any=false, inner='';

var SESSION=null;
function deck(lang){var cards=[];
 WORDS.forEach(function(w){var forms=[];
  (w.seeds[lang]||[]).forEach(function(x){forms.push({form:x[0],rom:x[1],src:'seed'});});
  Object.keys(LEX).forEach(function(k){var r=LEX[k];if(r.word_id===w.id&&r.lang===lang&&r.form!=='*'&&(r.verdict==='ok'||r.verdict==='syn')&&!forms.some(function(f){return norm(f.form)===r.form;}))forms.push({form:r.form,rom:r.rom||'',src:'student',syn:r.verdict==='syn'});});
  if(!forms.length)return;
  var p=LEX[lexKey(w.id,lang,'*')]||{word_id:w.id,lang:lang,form:'*',src:'toby',box:0,seen:0,due:null};
  cards.push({w:w,forms:forms,p:p});});
 return cards;}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function voicesFor(w,lang,form){var out=[];WORK.forEach(function(r){if(langOf(r)!==lang)return;var a=((r.answers||{}).A||{})[w.id]||{};['s1','s2'].forEach(function(sl){var s=a[sl];if(!s||!s.audio)return;
  var f=norm(s.typed||(s.ok!==false?s.heard:'')||'');if(!form||f===norm(form))out.push({name:(r.student_name||'').split(' ')[0],audio:s.audio});});});return out;}

  st.innerHTML=bar+'<div class="qend box"><div class="big">Mr. Toby '+Q.toby+' \u2014 Class '+Q.cls+'</div><p style="font-size:22px;font-weight:800">'+(Q.toby>Q.cls?'Mr. Toby wins this round!':(Q.toby===Q.cls?'A tie!':'The class wins! Teach him again tomorrow.'))+'</p>'+

 }else{

   c.forms.slice(0,3).map(function(f){var rom=f.rom||(LEX[lexKey(w.id,Q.lang,norm(f.form))]||{}).rom||'';var fv=voicesFor(w,Q.lang,f.form);

   '<div class="gs" id="qGs"></div></div>'+(Q.quip?'<div class="qquip"><span class="qwho">'+esc(Q.quip[0])+':</span> '+esc(Q.quip[1])+'</div>':'')+

 else if(k==='ArrowRight'||k===' '||k==='Enter')b=$('qNext');
 if(b&&!b.disabled){e.preventDefault();b.click();}});
function burst(x,y){var cols=['#2e8b57','#e8a33d','#2f6db5','#c0392b','#7a4fb5'];for(var i=0;i<26;i++){var d=document.createElement('div');d.className='pop';var a=Math.random()*Math.PI*2, r=80+Math.random()*120;
 d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%5];d.style.setProperty('--dx',Math.cos(a)*r+'px');d.style.setProperty('--dy',Math.sin(a)*r+'px');(document.fullscreenElement||document.body).appendChild(d);setTimeout(function(e){e.remove();}.bind(null,d),1300);}}

 rows.forEach(function(r){var a=r.answers||{};h+='<tr><td>'+esc(r.student_name||r.email)+'</td><td>'+esc(r.period)+'</td><td>'+esc(r.lang)+(r.dialect?' \u00b7 '+esc(r.dialect):'')+'</td><td>'+esc(a.from||'')+'</td><td>'+(a.score||0)+' / '+(a.max||WORDS.length)+'</td><td>'+(r.turned_in?'\u2714':'')+'</td><td>'+esc((r.updated_at||'').slice(0,10))+(a.bt&&a.bt.on?' \u26a0 browser translate on':'')+'</td></tr>';});
 h+='</table></div>';$('main').innerHTML=h;}
