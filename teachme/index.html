<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teach Mr. Toby</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--paper:#f6efe0;--card:#fffdf7;--green:#2e8b57;--gold:#e8a33d;--blue:#2f6db5;--muted:#5d6170}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:18px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 60px}
.box{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:16px 18px;margin:16px 0;display:flow-root}
.box h2{margin:0 0 8px;font-size:21px;font-weight:900}
.pic{float:right;width:44%;max-width:300px;margin:0 0 10px 14px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;position:relative}
.pic svg{display:block;width:100%;height:auto}
.icon{float:right;width:70px;height:70px;margin:0 0 6px 12px}
.icon svg{width:100%;height:100%}
.dir{font-weight:700}
.tr{display:block;color:var(--blue);font-weight:700;font-size:16px;margin-top:3px}
.tr:empty{display:none}
.hear{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:2px 10px;font-size:16px;margin-left:6px;vertical-align:middle}
.hear:active{transform:translateY(1px)}
.word{font-size:40px;font-weight:900;letter-spacing:.5px}
.def{font-size:18px;margin:4px 0 10px}
.sent{font-size:22px;font-weight:700;background:#fff6d8;border:2px dashed #c9a24a;border-radius:10px;padding:8px 12px;display:inline-block}
.sent .hl{background:#ffd45c;border-bottom:3px solid var(--gold);padding:0 3px;border-radius:4px}
.sent .w{cursor:pointer;border-bottom:1px dotted #999}
.tip{position:absolute;z-index:30;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;box-shadow:3px 3px 0 var(--ink);font-size:16px;max-width:280px}
.tip b{text-decoration:underline}
.mic{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.micbtn{border:3px solid var(--ink);background:#e85d4a;color:#fff;font-size:22px;font-weight:900;border-radius:999px;padding:14px 26px;box-shadow:3px 3px 0 var(--ink)}
.micbtn.small{font-size:17px;padding:9px 18px;background:#7a6fc4}
.micbtn.rec{background:#b8261a;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(232,93,74,.25),3px 3px 0 var(--ink)}}
.heard{border:2px solid var(--ink);border-radius:10px;background:#eef6ff;padding:10px 12px;margin:8px 0}
.heard .big{font-size:30px;font-weight:900}
.yn button{border:2px solid var(--ink);border-radius:10px;padding:6px 14px;font-weight:800;margin:6px 6px 0 0;background:#fff}
.yn button.on{background:var(--green);color:#fff}
input[type=text],input[type=email],select{font-family:inherit;font-size:18px;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;width:100%;background:#fff}
.typed{margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.btn{border:2px solid var(--ink);border-radius:12px;padding:10px 18px;font-size:18px;font-weight:900;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn.go{background:var(--green);color:#fff}
.btn:disabled{opacity:.4}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.hbar{max-width:860px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hbar h1{font-size:22px;margin:0;font-weight:900;flex:1}
.chip{border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:15px;background:#fff}
.dots{max-width:860px;margin:0 auto;padding:0 14px 8px;display:flex;gap:6px;flex-wrap:wrap}
.dot{width:46px;height:38px;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:0;overflow:hidden;position:relative}
.dot svg{width:100%;height:100%}
.dot.cur{outline:3px solid var(--gold);outline-offset:1px}
.dot.done::after{content:'✓';position:absolute;right:1px;bottom:-2px;background:var(--green);color:#fff;font-weight:900;font-size:12px;border-radius:6px;padding:0 3px}
.dot.end{width:auto;padding:0 8px;font-weight:900;font-size:14px}
.quip{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--green);min-height:24px}
.chips button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:5px 12px;margin:4px 4px 0 0;font-weight:800;font-size:16px}
.chips button.on{background:var(--blue);color:#fff}
#gate{position:fixed;inset:0;z-index:100;background:rgba(43,45,66,.88);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
#gate .box{max-width:460px;width:100%;margin:auto}
#gate label{display:block;font-weight:800;margin:10px 0 3px}
.err{color:#b8261a;font-weight:800;min-height:22px}
.notice{border:2px solid #b8261a;background:#ffe9e6;color:#8a1c12;border-radius:10px;padding:8px 12px;font-weight:800;margin:10px 0}
.notice.ok{border-color:var(--green);background:#e6f6ec;color:#1e5e3a}
.list .row{display:flex;align-items:center;gap:10px;border-top:2px solid #e2d9c4;padding:6px 0}
.list .row svg{width:60px;height:48px;border:2px solid var(--ink);border-radius:6px;flex:none}
.list .said{font-weight:900;font-size:20px}
.bar{height:22px;background:#e8e0cc;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--green)}
.lion{position:absolute;width:30px;height:30px;bottom:6px;left:6px;opacity:.85;cursor:pointer;border:0;background:none;padding:0}
.lion svg{width:100%;height:100%}
.fw{position:fixed;width:9px;height:9px;border-radius:50%;z-index:200;pointer-events:none;animation:fw 1.1s ease-out forwards}
@keyframes fw{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.canary{position:absolute;left:-9999px;top:0}
@media (max-width:560px){.pic{float:none;width:100%;max-width:none;margin:0 0 10px}.word{font-size:34px}.sent{font-size:19px}}
</style>
</head>
<body>
<span class="canary" id="canary">Good morning, my friend</span>

<div id="gate">
 <div class="box">
  <div class="icon" id="gateArt"></div>
  <h2>Teach Mr. Toby</h2>
  <div class="dir">Sign in. Then you will teach Mr. Toby words in your language.</div>
  <label for="fn">First name</label><input id="fn" type="text" autocomplete="given-name">
  <label for="ln">Last name</label><input id="ln" type="text" autocomplete="family-name">
  <label for="em">School email</label><input id="em" type="email" placeholder="name@s.sfusd.edu" autocapitalize="off" spellcheck="false">
  <label for="pd">Period</label>
  <select id="pd"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
  <label for="lang">My language</label>
  <select id="lang"><option value="">— choose —</option></select>
  <div class="err" id="gerr"></div>
  <button class="btn go" id="start" style="width:100%">Start</button>
 </div>
</div>

<header>
 <div class="hbar"><h1>Teach Mr. Toby</h1><span class="chip" id="langChip">—</span><span class="chip" id="prog">0 / 12</span></div>
 <div class="dots" id="dots"></div>
</header>

<div class="wrap" translate="no">
 <div id="note"></div>
 <main id="screen"></main>
</div>

<script src="/readings/teachme/words.js"></script>
<script>
(function(){
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
var BUCKET='fluency-recordings', TABLE='teachme_work';
var TM=window.TM, SET=(new URLSearchParams(location.search).get('set'))||'u1';
if(!TM.SETS[SET]) SET='u1';
var WORDS=TM.SETS[SET].words, N=WORDS.length;
window.GAL_META={title:'Teach Mr. Toby',unit:'Launch Plus',skills:['speaking','vocabulary']};
window.GAL_SCORE=0; window.GAL_MAX=N;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(extra){var h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};for(var k in extra)h[k]=extra[k];return h;}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}

var ST={email:'',name:'',period:'',lang:'',dialect:'',from:'',A:{},cur:-1,bt:null};
var LOADED=false, DIRTY=false;

/* ---------- sign-in ---------- */
TM.LANG_ORDER.forEach(function(l){var o=document.createElement('option');o.value=l;o.textContent=l;$('lang').appendChild(o);});
$('gateArt').innerHTML=TM.ART.lion;
(function prefill(){var n=ls('gal_student_name').split(/\s+/);$('fn').value=n[0]||'';$('ln').value=n.slice(1).join(' ');
 $('em').value=ls('gal_student_email');$('pd').value=ls('gal_student_period');var l=ls('vocab_lang');if(TM.LANGS[l])$('lang').value=l;})();
function canon(e){e=String(e||'').trim().toLowerCase();return e.replace(/@s\.sfusd\.edu$/,'@sfusd.edu');}
$('start').onclick=function(){
 var fn=$('fn').value.trim(), ln=$('ln').value.trim(), em=$('em').value.trim().toLowerCase(), pd=$('pd').value, lg=$('lang').value;
 var err='';
 if(!fn||!ln) err='Please write your first and last name.';
 else if(!/^[^@\s]+@(s\.)?sfusd\.edu$/.test(em)) err='Please use your school email. It ends with @s.sfusd.edu';
 else if(!pd) err='Please choose your period.';
 else if(!lg) err='Please choose your language.';
 $('gerr').textContent=err; if(err) return;
 ST.name=fn+' '+ln; ST.email=canon(em); ST.period=pd; ST.lang=lg;
 ls('gal_student_name',ST.name);ls('gal_student_email',ST.email);ls('gal_student_period',pd);ls('gal_student_at',String(Date.now()));ls('vocab_lang',lg);ls('eld103_lang',lg);
 $('gate').style.display='none';
 load();
};

/* ---------- load before save ---------- */
function note(html,ok){$('note').innerHTML=html?'<div class="notice'+(ok?' ok':'')+'">'+html+'</div>':'';}
function load(){
 note('');
 fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=*&email=eq.'+encodeURIComponent(ST.email)+'&set_slug=eq.'+encodeURIComponent(SET),{headers:H()})
 .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
 .then(function(rows){
   var row=rows&&rows[0];
   if(row&&row.answers){var a=row.answers;ST.A=a.A||{};ST.dialect=a.dialect||ST.dialect;ST.from=a.from||'';if(typeof a.cur==='number')ST.cur=a.cur;}
   LOADED=true; afterLoad();
 })
 .catch(function(){note('Mr. Toby\u2019s computer can\u2019t reach the server. Your words will NOT save yet. <button class="btn" id="retry">Try again</button>');var b=$('retry');if(b)b.onclick=load;});
}
function afterLoad(){
 $('langChip').textContent=ST.lang;
 dots(); go(ST.cur<0?-1:Math.min(ST.cur,N));
 setInterval(function(){if(DIRTY)save(false);},20000);
 setInterval(canary,5000);
}
function score(){var n=0;WORDS.forEach(function(w){if(done(w.id))n++;});window.GAL_SCORE=n;$('prog').textContent=n+' / '+N;return n;}
function done(id){var a=ST.A[id];if(!a||!a.s1)return false;var s=a.s1;return !!((s.heard&&s.ok!==false)||s.typed||s.audio);}
function save(turnIn){
 if(!LOADED){return;}
 var n=score();
 var body={email:ST.email,set_slug:SET,student_name:ST.name,period:ST.period,lang:ST.lang,dialect:ST.dialect||null,
   answers:{A:ST.A,dialect:ST.dialect,from:ST.from,cur:ST.cur,score:n,max:N,bt:ST.bt},updated_at:new Date().toISOString()};
 if(turnIn) body.turned_in=true;
 return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,set_slug',{method:'POST',headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)})
 .then(function(r){if(!r.ok)throw new Error(r.status);DIRTY=false;note('');})
 .catch(function(){note('Not saved yet \u2014 the server didn\u2019t answer. It will try again.');});
}
function mark(){DIRTY=true;score();dots();}

/* ---------- browser-translation canary (silent) ---------- */
function canary(){var t=$('canary').textContent;if(t!=='Good morning, my friend'&&!ST.bt){ST.bt={on:true,at:new Date().toISOString(),sample:t.slice(0,60)};DIRTY=true;}}

/* ---------- voice (English) ---------- */
function say(text,rate){try{speechSynthesis.cancel();var t=String(text).replace(/\bI\b/g,'eye');var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||0.85;
 var v=speechSynthesis.getVoices().filter(function(v){return /^en(-|_)US/.test(v.lang);})[0];if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}

/* ---------- translation (directions on by default; tap words) ---------- */
var TRC={};
function tr(text,mode){var key=mode+'|'+ST.lang+'|'+text;if(TRC[key])return Promise.resolve(TRC[key]);
 var u=PROXY+'?action=translate&mode='+mode+'&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent(mode==='word'?text:'')+'&lang='+encodeURIComponent(ST.lang);
 var ctl=('AbortController' in window)?new AbortController():null; var tm=setTimeout(function(){if(ctl)ctl.abort();},9000);
 return fetch(u,ctl?{signal:ctl.signal}:{}).then(function(r){return r.json();}).then(function(j){clearTimeout(tm);var t=j&&j.translation||{};var out=t.equiv||t.meaning||'';TRC[key]=out;return out;}).catch(function(){clearTimeout(tm);return '';});}
function trDirs(root){(root||document).querySelectorAll('[data-dir]').forEach(function(el){var t=el.getAttribute('data-dir');var slot=el.querySelector('.tr');if(!slot)return;
 tr(t,'sentence').then(function(x){slot.textContent=x||'';slot.setAttribute('dir',(TM.LANGS[ST.lang]||{}).dir||'ltr');});});}
var tipEl=null;
function tip(anchor,word){if(tipEl)tipEl.remove();tipEl=document.createElement('div');tipEl.className='tip';tipEl.innerHTML='<span style="color:#888">\u2026</span>';document.body.appendChild(tipEl);
 var r=anchor.getBoundingClientRect();tipEl.style.left=Math.max(6,r.left+scrollX)+'px';tipEl.style.top=(r.bottom+scrollY+6)+'px';
 tr(word,'word').then(function(x){if(!tipEl)return;tipEl.innerHTML=x?'<b>'+esc(x)+'</b>':'<b style="color:#888">'+esc(word)+'</b>';});}
document.addEventListener('click',function(e){var w=e.target.closest('.w');if(w){e.stopPropagation();say(w.textContent);tip(w,w.textContent.replace(/[^A-Za-z'\- ]/g,''));return;}
 var d=e.target.closest('.def[data-tt]');if(d){tip(d,d.getAttribute('data-tt'));return;} if(tipEl&&!e.target.closest('.tip')){tipEl.remove();tipEl=null;}});

/* ---------- speech code for this student ---------- */
function spCode(){var d=ST.dialect, l=ST.lang;
 var map={'Cantonese':'yue-Hant-HK','Mandarin':'cmn-Hans-CN','Egyptian':'ar-EG','Moroccan':'ar-MA','Algerian':'ar-DZ','Tunisian':'ar-TN','Iraqi':'ar-IQ','Syrian / Lebanese':'ar-LB','Saudi / Gulf':'ar-SA','Yemeni':'ar-YE'};
 if(map[d]&&(l==='Mandarin'||l==='Cantonese'||l==='Arabic'||l==='Darija')) return map[d];
 return (TM.LANGS[l]||{}).sp||'';}

/* ---------- screens ---------- */
function dots(){var h='';WORDS.forEach(function(w,i){h+='<button class="dot'+(i===ST.cur?' cur':'')+(done(w.id)?' done':'')+'" data-go="'+i+'" title="'+esc(w.en)+'">'+TM.ART[w.art]+'</button>';});
 h+='<button class="dot end'+(ST.cur===N?' cur':'')+'" data-go="'+N+'">Finish</button>';$('dots').innerHTML=h;
 $('dots').querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(+b.getAttribute('data-go'));};});score();}
var LION_AT=Math.floor(Math.random()*N);
function go(i){ST.cur=i;DIRTY=true;stopRec();if(tipEl){tipEl.remove();tipEl=null;}
 if(i<0)intro(); else if(i>=N)finish(); else wordScreen(i);
 dots();trDirs($('screen'));scrollTo(0,0);}
window.TM_go=go;

function dirP(text,extraHtml){return '<p class="dir" data-dir="'+esc(text)+'">'+(extraHtml||esc(text))+'<span class="tr" translate="yes"></span></p>';}

function intro(){
 var h='<div class="box"><div class="pic">'+TM.ART.intro+'</div><h2>Mr. Toby is learning your language!</h2>'+
  dirP('Mr. Toby wants to learn words in your language. You are the teacher today.')+
  dirP('For each picture: listen to the English word, then say the word in your language.')+
  dirP('If you know two ways to say it, say both. Every way is good.')+'</div>';
 var dl=TM.DIALECTS[ST.lang];
 h+='<div class="box"><div class="icon">'+mapIcon()+'</div><h2>Your language</h2>'+dirP('Which language do you speak at home?')+
  (dl?'<div class="chips" id="dial">'+dl.map(function(d){return '<button data-d="'+esc(d)+'" class="'+(ST.dialect===d?'on':'')+'">'+esc(d)+'</button>';}).join('')+'</div>':'<div class="chips"><button class="on">'+esc(ST.lang)+'</button></div>')+
  dirP('Where are you from? (city or country) \u2014 you can skip this.')+'<input type="text" id="from" value="'+esc(ST.from)+'" placeholder="Guangzhou, Sana\u2019a, Guatemala City\u2026"></div>';
 h+='<div class="nav"><span></span><button class="btn go" id="next">Start \u2192</button></div>';
 $('screen').innerHTML=h;
 var dd=$('dial');if(dd)dd.querySelectorAll('button').forEach(function(b){b.onclick=function(){ST.dialect=b.getAttribute('data-d');dd.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});DIRTY=true;};});
 $('from').oninput=function(){ST.from=this.value.slice(0,80);DIRTY=true;};
 $('next').onclick=function(){go(0);};
}
function mapIcon(){return '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#9ec2d6" stroke="#2b2d42" stroke-width="2.5"/><path d="M14 22q8-6 14 0t6 10q-6 6-2 12-10 2-14-6t-4-16zM38 14q10 2 14 10-4 4-10 2-6 2-6-6zM40 38q8-2 12 4-2 8-10 10-4-6-2-14z" fill="#6f9f5c" stroke="#2b2d42" stroke-width="1.5"/><path d="M44 40l-1-11a6 6 0 1112 0z" fill="#e85d4a" stroke="#2b2d42" stroke-width="1.5"/><circle cx="49" cy="29" r="2.2" fill="#fff"/></svg>';}
function micIcon(){return '<svg viewBox="0 0 64 64"><rect x="6" y="10" width="34" height="44" rx="3" fill="#f6efd9" stroke="#2b2d42" stroke-width="2.5"/><path d="M12 20h22M12 28h22M12 36h16M12 44h20" stroke="#6a8fd1" stroke-width="2"/><rect x="42" y="14" width="14" height="24" rx="7" fill="#e85d4a" stroke="#2b2d42" stroke-width="2.5"/><path d="M38 30q0 12 11 12t11-12M49 42v8M43 52h12" stroke="#2b2d42" stroke-width="2.5" fill="none"/></svg>';}
function twoIcon(){return '<svg viewBox="0 0 64 64"><path d="M4 10h30a4 4 0 014 4v14a4 4 0 01-4 4H16l-8 7v-7H4a4 4 0 01-4-4V14a4 4 0 014-4z" fill="#ffd45c" stroke="#2b2d42" stroke-width="2.5" transform="translate(2 2)"/><path d="M60 30H32a4 4 0 00-4 4v14a4 4 0 004 4h16l8 7v-7h4a4 4 0 004-4V34a4 4 0 00-4-4z" fill="#9fd3b0" stroke="#2b2d42" stroke-width="2.5" transform="translate(-2 0)"/><text x="19" y="27" font-size="13" font-weight="900" text-anchor="middle" fill="#2b2d42">1</text><text x="44" y="47" font-size="13" font-weight="900" text-anchor="middle" fill="#2b2d42">2</text></svg>';}

function sentHtml(w){var parts=w.sent.split(w.hl);var out='';
 function words(t){return t.split(/(\s+)/).map(function(x){return /\S/.test(x)?'<span class="w">'+esc(x)+'</span>':x;}).join('');}
 out=words(parts[0])+'<span class="hl">'+esc(w.hl)+'</span>'+words(parts.slice(1).join(w.hl));return out;}

function slotHtml(w,slot){var a=(ST.A[w.id]||{})[slot]||{};var h='';
 if(a.heard){h+='<div class="heard"><div>Mr. Toby\u2019s computer heard:</div><div class="big" dir="auto">'+esc(a.heard)+'</div>'+
   '<div class="yn" data-dir="Is that right?">Is that right? <button data-ok="1" class="'+(a.ok===true?'on':'')+'">\u2714 Yes</button><button data-ok="0" class="'+(a.ok===false?'on':'')+'">No, not quite</button><span class="tr" translate="yes"></span></div></div>';}
 if(a.audio) h+='<button class="btn" data-play="'+slot+'">\u25b6 Hear my voice</button> ';
 var showType=a.typed||a.ok===false||!a.heard&&a.audio||a.showType;
 h+=showType?'<div class="typed"><input type="text" dir="auto" data-type="'+slot+'" value="'+esc(a.typed||'')+'" placeholder="Type it in your language (optional)"></div>':'<button class="btn" data-showtype="'+slot+'" style="margin-top:6px">\u2328 Type it</button>';
 return h;}

function wordScreen(i){var w=WORDS[i];
 var h='<div class="box"><div class="pic">'+TM.ART[w.art]+(i===LION_AT?'<button class="lion" id="lion" aria-label="lion">'+TM.ART.lion+'</button>':'')+'</div>'+
  '<div><span class="word">'+esc(w.en)+'</span><button class="hear" data-say="'+esc(w.en)+'">\ud83d\udd0a</button></div>'+
  '<div class="def" data-tt="'+esc(w.def)+'">'+esc(w.def)+' <button class="hear" data-say="'+esc(w.def)+'">\ud83d\udd0a</button></div>'+
  '<div class="sent">'+sentHtml(w)+' <button class="hear" data-say="'+esc(w.sent)+'">\ud83d\udd0a</button></div>'+
  dirP('Tap a gray word in the sentence to see it in your language. Tap the meaning to translate it.')+'</div>';
 h+='<div class="box"><div class="icon">'+micIcon()+'</div><h2>Teach Mr. Toby</h2>'+
  dirP('Say the word for THIS picture in your language. Tap the red button, say it, then tap again.','Say <b>'+esc(w.en)+'</b> for THIS picture in '+esc(ST.lang)+'. Tap the red button, say it, then tap again.')+
  '<div class="mic"><button class="micbtn" data-rec="s1">\ud83c\udfa4 Say it</button><span class="quip" id="q_s1"></span></div><div id="slot_s1">'+slotHtml(w,'s1')+'</div></div>';
 h+='<div class="box"><div class="icon">'+twoIcon()+'</div><h2>Another way to say it?</h2>'+
  dirP('Some words have two names. Your family or your city may say it differently. Say the other one here. You can skip this.')+
  '<div class="mic"><button class="micbtn small" data-rec="s2">\ud83c\udfa4 Another way</button><span class="quip" id="q_s2"></span></div><div id="slot_s2">'+slotHtml(w,'s2')+'</div></div>';
 h+='<div class="nav"><button class="btn" id="prev">\u2190 Back</button><button class="btn go" id="next">'+(i===N-1?'Finish \u2192':'Next \u2192')+'</button></div>';
 $('screen').innerHTML=h; wire(w);
 $('prev').onclick=function(){go(i-1);}; $('next').onclick=function(){go(i+1);};
 var li=$('lion');if(li)li.onclick=function(e){e.stopPropagation();fireworks(e.clientX,e.clientY);};
}
function wire(w){var sc=$('screen');
 sc.querySelectorAll('[data-say]').forEach(function(b){b.onclick=function(e){e.stopPropagation();say(b.getAttribute('data-say'));};});
 sc.querySelectorAll('[data-rec]').forEach(function(b){b.onclick=function(){toggleRec(w,b.getAttribute('data-rec'),b);};});
 rewireSlot(w,'s1');rewireSlot(w,'s2');}
function rewireSlot(w,slot){var box=$('slot_'+slot);if(!box)return;
 box.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=function(){var a=get(w.id,slot);a.ok=b.getAttribute('data-ok')==='1';mark();redraw(w,slot);if(a.ok)quip(slot);};});
 box.querySelectorAll('[data-showtype]').forEach(function(b){b.onclick=function(){get(w.id,slot).showType=true;redraw(w,slot);var inp=box.querySelector('input');if(inp)inp.focus();};});
 box.querySelectorAll('[data-type]').forEach(function(inp){inp.oninput=function(){get(w.id,slot).typed=inp.value.slice(0,120);mark();};inp.onchange=function(){save(false);};});
 box.querySelectorAll('[data-play]').forEach(function(b){b.onclick=function(){play(get(w.id,slot));};});
 trDirs(box);}
function redraw(w,slot){$('slot_'+slot).innerHTML=slotHtml(w,slot);rewireSlot(w,slot);}
function get(id,slot){ST.A[id]=ST.A[id]||{};ST.A[id][slot]=ST.A[id][slot]||{};return ST.A[id][slot];}
var QUIPS=['Linh: Mr. Toby is writing that down!','Mateo: Now he can say it too!','Amira: Teacher becomes student!','Jun: He will practice it tonight.','Paolo: Nice! Say it one more time for him?','Linh: You are a good teacher.','Mateo: Mr. Toby says: thank you!'];
function quip(slot){var q=$('q_'+slot);if(q)q.textContent=QUIPS[Math.floor(Math.random()*QUIPS.length)];}

/* ---------- recording + speech recognition ---------- */
var REC=null;
function stopRec(){if(REC&&REC.stop)REC.stop();}
function toggleRec(w,slot,btn){
 if(REC){REC.stop();return;}
 var a=get(w.id,slot), chunks=[], mr=null, rec=null, stream=null, finished=false, heard=null, alts=[];
 btn.classList.add('rec');btn.textContent='\u23f9 Stop';
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition, code=spCode();
 if(SR&&code){try{rec=new SR();rec.lang=code;rec.maxAlternatives=3;rec.interimResults=false;rec.continuous=false;
   rec.onresult=function(e){var r=e.results[0];if(!r)return;heard=r[0].transcript;for(var k=0;k<r.length;k++)alts.push(r[k].transcript);};
   rec.onerror=function(){};rec.start();}catch(e){rec=null;}}
 var t0=Date.now(), timer=setTimeout(function(){if(REC)REC.stop();},7000);
 REC={stop:function(){if(finished)return;finished=true;clearTimeout(timer);try{if(mr&&mr.state!=='inactive')mr.stop();else end();}catch(e){end();}try{if(rec)rec.stop();}catch(e){}}};
 function end(){if(stream)stream.getTracks().forEach(function(t){t.stop();});REC=null;btn.classList.remove('rec');btn.textContent=slot==='s1'?'\ud83c\udfa4 Say it again':'\ud83c\udfa4 Another way';
   setTimeout(function(){ /* recognition result arrives a moment after stop */
     if(heard){a.heard=heard.trim();a.alts=alts.slice(0,3);a.ok=null;a.code=code;} 
     else if(a.heard===undefined){a.heard='';}
     a.at=new Date().toISOString();mark();redraw(w,slot);quip(slot);
     if(chunks.length){upload(new Blob(chunks,{type:'audio/webm'}),w,slot);} else save(false);
   },rec?900:50);}
 if(!navigator.mediaDevices||!window.MediaRecorder){if(!rec){end();note('This computer can\u2019t record. Please type the word instead.');}else setTimeout(function(){if(REC)REC.stop();},5000);return;}
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){stream=s;if(finished){end();return;}
   mr=new MediaRecorder(s);mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};mr.onstop=end;mr.start();})
 .catch(function(){note('The microphone is blocked. Click the \ud83c\udfa4 in the address bar and choose Allow \u2014 or type the word.');if(!rec)REC&&REC.stop();});
}
function upload(blob,w,slot){var a=get(w.id,slot);
 var path='teachme/'+SET+'/'+w.id+'/'+ST.email.replace(/[^a-z0-9]/g,'_')+'_'+slot+'_'+Date.now()+'.webm';
 fetch(SUPA_URL+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'audio/webm'},body:blob})
 .then(function(r){if(!r.ok)throw new Error(r.status);a.audio=path;a.localUrl=null;mark();redraw(w,slot);save(false);})
 .catch(function(){a.localUrl=URL.createObjectURL(blob);mark();save(false);note('Your voice didn\u2019t upload, but your word is saved.');});
 a.localUrl=URL.createObjectURL(blob);
}
function play(a){var src=a.localUrl||(a.audio?SUPA_URL+'/storage/v1/object/public/'+BUCKET+'/'+a.audio:'');if(!src)return;
 var au=new Audio(src);au.play().catch(function(){ /* private bucket: ask for a signed link */
  fetch(SUPA_URL+'/storage/v1/object/sign/'+BUCKET+'/'+a.audio,{method:'POST',headers:H(),body:JSON.stringify({expiresIn:600})}).then(function(r){return r.json();}).then(function(j){if(j.signedURL)new Audio(SUPA_URL+'/storage/v1'+j.signedURL).play();});});}

/* ---------- finish: my words + what my class taught ---------- */
function finish(){var n=score();
 var h='<div class="box"><div class="icon">'+TM.ART.lion+'</div><h2>You taught Mr. Toby '+n+' of '+N+' words!</h2>'+
  dirP('Check your words. Then send them to Mr. Toby. He will practice them and try to say them in class.')+'<div class="list">';
 WORDS.forEach(function(w,i){var a=ST.A[w.id]||{}, s1=a.s1||{}, s2=a.s2||{};
  var said=[s1.typed||(s1.ok!==false&&s1.heard)||'', s2.typed||(s2.ok!==false&&s2.heard)||''].filter(Boolean);
  h+='<div class="row">'+TM.ART[w.art]+'<div style="flex:1"><b>'+esc(w.en)+'</b><div class="said" dir="auto">'+(said.length?esc(said.join(' \u00b7 ')):(s1.audio?'\ud83c\udfa4 (voice only)':'<span style="color:#999">\u2014</span>'))+'</div></div>'+
   (done(w.id)?'<span style="color:#2e8b57;font-weight:900">\u2714</span>':'<button class="btn" data-go2="'+i+'">Do it</button>')+'</div>';});
 h+='</div><div class="nav"><button class="btn" id="prev">\u2190 Back</button><button class="btn go" id="send">Send to Mr. Toby \u2709</button></div><div id="sent"></div></div>';
 h+='<div class="box"><div class="icon">'+mapIcon()+'</div><h2>What your class taught Mr. Toby</h2>'+dirP('These are all the languages in your class.')+'<div id="wall">Loading\u2026</div></div>';
 $('screen').innerHTML=h;
 $('screen').querySelectorAll('[data-go2]').forEach(function(b){b.onclick=function(){go(+b.getAttribute('data-go2'));};});
 $('prev').onclick=function(){go(N-1);};
 $('send').onclick=function(){var p=save(true);if(p)p.then(function(){$('sent').innerHTML='<div class="notice ok">Sent! Mr. Toby has your words. \u2714</div>';fireworks(innerWidth/2,innerHeight/2);});};
 wall();}
function wall(){fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=email,lang,dialect,answers&set_slug=eq.'+SET+'&period=eq.'+encodeURIComponent(ST.period),{headers:H()})
 .then(function(r){return r.json();}).then(function(rows){var by={},kids={},total=0;
   (rows||[]).forEach(function(r){var L=((r.lang==='Mandarin'||r.lang==='Cantonese')&&r.dialect&&r.dialect!=='Other')?r.dialect:r.lang;if(!L)return;
     var A=(r.answers&&r.answers.A)||{},n=0;Object.keys(A).forEach(function(k){var s=A[k].s1||{};if(s.typed||s.heard||s.audio)n++;var t=A[k].s2||{};if(t.typed||t.heard||t.audio)n++;});
     by[L]=(by[L]||0)+n;kids[L]=(kids[L]||0)+1;total+=n;});
   var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a];}), mx=Math.max.apply(null,keys.map(function(k){return by[k];}).concat([1]));
   $('wall').innerHTML='<p style="font-weight:900;font-size:20px">Period '+esc(ST.period)+' taught Mr. Toby <span style="color:#2e8b57">'+total+'</span> words in '+keys.length+' language'+(keys.length===1?'':'s')+'.</p>'+
    keys.map(function(k){return '<div><b>'+esc(k)+'</b> \u00b7 '+kids[k]+' student'+(kids[k]===1?'':'s')+' \u00b7 '+by[k]+' words<div class="bar"><i style="width:'+Math.round(100*by[k]/mx)+'%"></i></div></div>';}).join('');})
 .catch(function(){$('wall').textContent='(Can\u2019t load the class right now.)';});}

/* ---------- lion fireworks ---------- */
function fireworks(x,y){var cols=['#e85d4a','#f6c443','#2e8b57','#2f6db5','#c95b8a'];for(var i=0;i<40;i++){var d=document.createElement('i');d.className='fw';var a=Math.random()*6.283,r=60+Math.random()*120;
 d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%5];d.style.setProperty('--dx',Math.cos(a)*r+'px');d.style.setProperty('--dy',Math.sin(a)*r+'px');document.body.appendChild(d);setTimeout(function(e){e.remove();}.bind(null,d),1200);}}

window.addEventListener('beforeunload',function(){if(DIRTY&&LOADED)save(false);});
})();
