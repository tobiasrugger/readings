<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alphabet · Mr. Toby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2640; --muted:#5b6784; --bg:#eef2f8; --card:#ffffff; --line:#d3dbe9;
  --i:#7a3f8f;  --i-t:#f4e9f8;
  --s3:#a86400; --s3-b:#f0a52a; --s3-t:#fff0d6;
  --pl:#2c5bc4; --pl-t:#e3ebfd;
  --ok:#1d7f53; --ok-t:#dff3e8; --no:#b93a2e; --no-t:#fbe5e1;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e8ecf5; --muted:#a3adc4; --bg:#141a28; --card:#1e2638; --line:#34405a;
    --i:#d7a6ea; --i-t:#3a2944; --s3:#ffc56a; --s3-b:#f0a52a; --s3-t:#3d2f17;
    --pl:#9dbaff; --pl-t:#20305a; --ok:#6fd6a3; --ok-t:#173a2b; --no:#ff9a8f; --no-t:#44211d;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 Lexend,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--pl);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px 60px}

/* ---------- login ---------- */
#login{max-width:440px;margin:6vh auto;background:var(--card);border-radius:20px;padding:28px 26px;border:1px solid var(--line)}
#login h1{margin:0 0 6px;font-size:40px;font-weight:800;line-height:1.1}
#login h1 .a{color:var(--i)} #login h1 .b{color:var(--s3)} #login h1 .c{color:var(--pl)}
#login p{margin:0 0 18px;color:var(--muted)}
#login label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
#login input,#login select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#login .err{color:var(--no);font-size:15px;min-height:22px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%;margin-top:18px;font-size:19px}

/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.brand{font-weight:800;font-size:20px}
.who{color:var(--muted);font-size:15px}
.spacer{flex:1}
.bar select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:15px}
.allverbs{color:var(--muted);text-decoration:none;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px}
#btn-dir{padding:7px 12px;font-size:15px;box-shadow:none;border-radius:9px}
#btn-dir.on{background:var(--pl);color:var(--card);border-color:var(--pl)}
#dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
#dot.saving{background:var(--s3-b)} #dot.saved{background:var(--ok)} #dot.err{background:var(--no)}

/* ---------- activity nav ---------- */
#acts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.act{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-size:16px;white-space:nowrap}
.act.on{background:var(--pl);border-color:var(--pl);color:var(--card)}
.act .ck{color:var(--ok);font-weight:800;margin-left:4px}
.act.on .ck{color:var(--card)}


/* ---------- stage ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 4px;font-size:26px;font-weight:800}
.lede{margin:0 0 16px;color:var(--muted);font-size:16px}
.dirtr{display:block;font-size:16px;color:var(--ink);margin-top:4px;font-weight:400}
.dirtr[dir=rtl]{text-align:right}
.segs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.seg{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:600}
.seg.on{background:var(--i);border-color:var(--i);color:var(--card)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.cnt{color:var(--muted);font-size:15px;text-align:center;margin-top:8px}
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 16px}
.prog i{display:block;height:100%;background:var(--pl);width:0;transition:width .2s}

/* letter tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{background:var(--pl-t);border:2px solid var(--pl);color:var(--pl);border-radius:16px;padding:14px 4px 10px;text-align:center;font-weight:800;box-shadow:0 4px 0 var(--pl);transition:transform .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pl)}
.tile .up{font-size:44px;line-height:1}
.tile .lo{font-size:26px;line-height:1.1;color:var(--muted);font-weight:600;margin-top:4px}
.tile.v{background:var(--s3-t);border-color:var(--s3);color:var(--s3);box-shadow:0 4px 0 var(--s3)}
.tile.lit{background:var(--ok-t);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.key{color:var(--muted);font-size:15px;margin:10px 0 0}
.key b{color:var(--s3)}

/* flashcard */
.flip{display:block;width:100%;min-height:260px;background:var(--bg);border:2px solid var(--line);border-radius:20px;padding:22px;text-align:center}
.flip.back{background:var(--i-t);border-color:var(--i)}
.flip .huge{font-size:140px;font-weight:800;line-height:1;color:var(--i)}
.flip .pair{font-size:120px;font-weight:800;line-height:1;color:var(--i)}
.flip .pair small{font-size:90px;color:var(--muted);font-weight:600}
.flip .hint{display:block;font-size:14px;color:var(--muted);margin-top:14px}

/* quiz bits */
.big-spk{display:block;margin:10px auto;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:14px 34px;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 18px}
.strip span{min-width:52px;height:64px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--ink);background:var(--bg);border-radius:12px;border:2px solid var(--line)}
.strip span.gap{border:3px dashed var(--i);color:var(--i);background:var(--i-t)}
.strip span.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-t)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
.opt{background:var(--i-t);border:2px solid var(--i);color:var(--i);border-radius:14px;padding:10px 6px;font-size:40px;font-weight:800;box-shadow:0 4px 0 var(--i)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--i)}
.opt.ok{background:var(--ok-t);border-color:var(--ok);color:var(--ok);box-shadow:none}
.opt.no{background:var(--no-t);border-color:var(--no);color:var(--no);box-shadow:none;animation:shake .3s}
.opt:disabled{cursor:default}
.fb{text-align:center;min-height:50px;margin-top:14px;font-size:20px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}

/* match */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:520px;margin:0 auto}
.mcol{display:grid;gap:8px}
.mb{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px;font-size:38px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.mb.sel{border-color:var(--i);background:var(--i-t);color:var(--i)}
.mb.ok{border-color:var(--ok);background:var(--ok-t);color:var(--ok);box-shadow:none;opacity:.7}
.mb.no{border-color:var(--no);background:var(--no-t);color:var(--no);animation:shake .3s}
.mb:disabled{cursor:default}

/* type */
.abc{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0}
.abc span{width:40px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:9px;border:2px solid var(--line);font-size:26px;font-weight:800;color:var(--muted);background:var(--bg)}
.abc span.done{border-color:var(--ok);color:var(--ok);background:var(--ok-t)}
.abc span.cur{border-color:var(--i);background:var(--i-t)}
.abc span.bad{border-color:var(--no);background:var(--no-t);color:var(--no);animation:shake .3s}
.tyrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#tyIn{font:800 40px Lexend,system-ui,sans-serif;width:120px;padding:6px 10px;border:2px solid var(--i);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center;text-transform:uppercase}
.timer{font-size:22px;font-weight:700;color:var(--muted)}

.summary{text-align:center}
.score{font-size:64px;font-weight:800;color:var(--pl);line-height:1}
.miss{margin:14px auto 0;max-width:460px;text-align:left}
.miss div{padding:8px 10px;border-bottom:1px solid var(--line);font-size:17px}
footer{color:var(--muted);text-align:center;margin-top:30px;font-size:14px}
#pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,92vw);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;z-index:50}
@media (max-width:520px){ .tiles{grid-template-columns:repeat(4,1fr)} .tile .up{font-size:36px} .flip .huge{font-size:110px} .flip .pair{font-size:90px} .flip .pair small{font-size:66px} .strip span{min-width:42px;height:54px;font-size:32px} .opt{font-size:32px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">

<section id="login">
  <h1><span class="a">Aa</span> <span class="b">Bb</span> <span class="c">Cc</span></h1>
  <p>26 letters. Hear them, find them, write them.</p>
  <label for="inName">Your name</label>
  <input id="inName" autocomplete="name" placeholder="First and last name">
  <label for="inEmail">School email</label>
  <input id="inEmail" type="email" autocomplete="email" placeholder="name@s.sfusd.edu">
  <label for="inPeriod">Class period</label>
  <select id="inPeriod">
    <option value="">Choose…</option>
    <option>Period 1</option><option>Period 2</option><option>Period 3</option>
    <option>Period 4</option><option>Period 5</option><option>Period 6</option><option>Period 7</option>
  </select>
  <label for="inLang">Your language</label>
  <select id="inLang"></select>
  <div class="err" id="loginErr"></div>
  <button class="btn wide" id="btnStart">Start</button>
</section>

<div id="app" class="hidden">
  <header class="bar">
    <a class="allverbs" href="../">Home</a>
    <span class="brand">Alphabet</span>
    <span id="dot" title="Saving status"></span>
    <span class="who" id="whoLbl"></span>
    <span class="spacer"></span>
    <button class="btn soft" id="btn-dir" title="Show the directions in your language">Directions</button>
    <select id="langSel" aria-label="Language"></select>
  </header>
  <nav id="acts" translate="no"></nav>
  <main id="stage" translate="no"></main>
  <footer>Mr. Toby</footer>
</div>

</div>
<div id="pop" class="hidden" translate="no"></div>

<script>
/* ---------------- config ---------------- */
var SUPA_URL = 'https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE = 'verb_practice';       /* same table as verbs/present; unit = 'alphabet' */
var PROXY = 'https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
var LSKEY = 'alphabet_v1';
var rawFetch = window.fetch.bind(window);
var SLUG = 'alphabet';
var PAGE_URL = 'https://tobiasrugger.github.io/readings/alphabet/';
var UNIT = 'alphabet';

var LANGS = [
  ['none','English only'],['Spanish','Español'],['Cantonese','廣東話'],['Mandarin','中文 (普通话)'],
  ['Arabic','العربية'],['Darija','الدارجة'],['Vietnamese','Tiếng Việt'],['Russian','Русский'],
  ['Urdu','اردو'],['Tagalog','Tagalog'],['French','Français'],['Korean','한국어'],
  ['Hindi','हिन्दी'],['Somali','Soomaali'],['Nepali','नेपाली'],['Thai','ไทย']
];
var RTL = /Arabic|Darija|Urdu/;
/* ---------------- state + helpers ---------------- */
var S = {name:'', email:'', period:'', lang:'none', act:'learn', seg:0, scores:{}};
var voice=null, Q=null, F=null, checkedAt=0;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function persist(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} }
function headers(extra){ var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; if(extra) for(var k in extra) h[k]=extra[k]; return h; }
function setDot(c){ $('dot').className=c; }
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    /* a lone "I" makes some voices say "capital I"; "eye" sounds identical */
    if(/^\s*I[.!?,]?\s*$/.test(text)) text='eye';
    if(LETTER_SAY[text]) text=LETTER_SAY[text];
    var u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
    if(!voice){ var vs=speechSynthesis.getVoices(), i;
      for(i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang) && /female|samantha|zira|aria|jenny|google us english/i.test(vs[i].name)){ voice=vs[i]; break; } }
      if(!voice) for(i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang)){ voice=vs[i]; break; } } }
    if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- the letters ---------------- */
var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
var VOWEL = {A:1,E:1,I:1,O:1,U:1};
var SEGS = [['A–G',0,7],['H–N',7,14],['O–T',14,20],['U–Z',20,26],['All',0,26]];
/* letter names the voice can get wrong on its own */
var LETTER_SAY = {I:'eye', A:'ay', Y:'why', Z:'zee', W:'double you', U:'you', R:'are', Q:'cue', H:'aitch'};
function segLetters(){ var g=SEGS[S.seg]||SEGS[4]; return ABC.slice(g[1],g[2]); }
function idx(L){ return ABC.indexOf(L); }

var ACTS = [
  {k:'learn', t:'Learn'},
  {k:'flash', t:'Flashcards'},
  {k:'listen',t:'Listen'},
  {k:'missing',t:'Missing'},
  {k:'next',  t:'Next?'},
  {k:'match', t:'Match'},
  {k:'type',  t:'Type it'}
];
var SCORED = ['listen','missing','next','match','type'];
var TITLES = {
  listen:['Listen','Tap the speaker. Then tap the letter you hear.'],
  missing:['Missing letter','One letter is missing. Tap it.'],
  next:['What comes next?','Which letter comes next? Tap it.'],
  match:['Match','Tap a big letter. Then tap its small letter.'],
  type:['Type the alphabet','Type the letters in order: A, B, C… as fast as you can.']
};
function bestFor(ak){ var r=S.scores[UNIT+'-'+ak]; return r && r.best>=Math.ceil(r.total*0.8) ? r : null; }
var F=null, M=null, TY=null;

/* ---------------- nav ---------------- */
function renderNav(){
  var h='';
  ACTS.forEach(function(a){
    var b = SCORED.indexOf(a.k)>=0 ? bestFor(a.k) : null;
    h += '<button class="act'+(a.k===S.act?' on':'')+'" data-actk="'+a.k+'">'+a.t+(b?'<span class="ck">✓</span>':'')+'</button>';
  });
  $('acts').innerHTML=h;
}
function segBar(){
  var h='<div class="segs">';
  SEGS.forEach(function(g,i){ h+='<button class="seg'+(i===S.seg?' on':'')+'" data-seg="'+i+'">'+g[0]+'</button>'; });
  return h+'</div>';
}
function go(ak){ S.act=ak; persist(); renderNav(); renderStage(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderStage(){
  Q=null; F=null; M=null; if(TY&&TY.tick) clearInterval(TY.tick); TY=null; $('pop').classList.add('hidden');
  var a=S.act;
  if(a==='learn') return renderLearn();
  if(a==='flash') return startFlash();
  if(a==='match') return startMatch();
  if(a==='type') return startType();
  return startQuiz(a);
}

/* ---------------- learn ---------------- */
function renderLearn(){
  var h='<div class="panel"><h2>The alphabet</h2><p class="lede">Tap a letter to hear its name. Say it. Then tap Play all to hear the group in order.</p>'+segBar()+'<div class="tiles">';
  segLetters().forEach(function(L){ h+='<button class="tile'+(VOWEL[L]?' v':'')+'" data-say="'+L+'" data-tile="'+L+'"><div class="up">'+L+'</div><div class="lo">'+L.toLowerCase()+'</div></button>'; });
  h+='</div><p class="key"><b>Gold</b> letters are the vowels: A, E, I, O, U.</p><div class="row"><button class="btn" data-playall="1">▶ Play all</button></div></div>';
  $('stage').innerHTML=h;
}
var playing=false;
function playAll(){
  if(playing) return; playing=true;
  var list=segLetters(), i=0;
  function one(){
    if(i>=list.length || S.act!=='learn'){ playing=false; Array.prototype.forEach.call(document.querySelectorAll('.tile'),function(t){ t.classList.remove('lit'); }); return; }
    var L=list[i++]; Array.prototype.forEach.call(document.querySelectorAll('.tile'),function(t){ t.classList.toggle('lit', t.getAttribute('data-tile')===L); });
    speak(L); setTimeout(one, 950);
  }
  one();
}

/* ---------------- flashcards ---------------- */
function startFlash(){ F={cards:shuffle(segLetters()), i:0, flipped:false}; renderFlash(); }
function renderFlash(){
  var L=F.cards[F.i];
  var front='<div class="huge">'+L+'</div>', back='<div class="pair">'+L+' <small>'+L.toLowerCase()+'</small></div>';
  $('stage').innerHTML='<div class="panel"><h2>Flashcards</h2><p class="lede">Say the letter\'s name. Tap the card to hear it and see the small letter.</p>'+segBar()+
    '<button class="flip'+(F.flipped?' back':'')+'" data-flip="1">'+(F.flipped?back:front)+'<span class="hint">'+(F.flipped?'':'Tap to turn over')+'</span></button>'+
    '<div class="row"><button class="btn soft" data-fprev="1">← Back</button><button class="btn soft" data-say="'+L+'">🔊 Hear it</button><button class="btn" data-fnext="1">Next →</button></div>'+
    '<div class="cnt">'+(F.i+1)+' / '+F.cards.length+'</div></div>';
  if(F.flipped) speak(L);
}

/* ---------------- quizzes: listen / missing / next ---------------- */
function neighbors(L, n){
  /* distractors: look-alikes and sound-alikes first, then alphabet neighbours, then the rest */
  var alike={B:'DPV',D:'BPT',P:'BDT',T:'DPV',E:'IAC',I:'EYA',A:'EIH',G:'JC',J:'GY',C:'SZK',S:'CZ',Z:'CS',M:'NW',N:'MW',U:'WQ',W:'UV',V:'WB',K:'QC',Q:'KU',O:'QU',Y:'IJ',H:'AK',F:'SX',X:'SF',L:'IR',R:'LA'};
  var pool=[], i=idx(L);
  (alike[L]||'').split('').forEach(function(c){ if(c&&pool.indexOf(c)<0) pool.push(c); });
  [-1,1,-2,2,-3,3].forEach(function(d){ var c=ABC[i+d]; if(c&&pool.indexOf(c)<0) pool.push(c); });
  segLetters().forEach(function(c){ if(c!==L&&pool.indexOf(c)<0) pool.push(c); });
  ABC.forEach(function(c){ if(c!==L&&pool.indexOf(c)<0) pool.push(c); });
  return shuffle(pool.slice(0, n+3)).slice(0,n);
}
function genItems(mode){
  var items=[], letters=segLetters();
  if(mode==='listen'){
    var pool=letters.slice(); ['E','I','G','J','B','V'].forEach(function(c){ if(letters.indexOf(c)>=0) pool.push(c); });
    shuffle(pool).slice(0, Math.min(12, pool.length)).forEach(function(L){ items.push({mode:mode, ans:L}); });
  }
  if(mode==='missing'){
    for(var n=0;n<12;n++){
      var span = Math.min(6, letters.length);
      var start = Math.floor(Math.random()*(letters.length-span+1));
      var win = letters.slice(start, start+span), gap = 1+Math.floor(Math.random()*(span-2));
      items.push({mode:mode, ans:win[gap], win:win, gap:gap});
    }
  }
  if(mode==='next'){
    for(var m=0;m<12;m++){
      var before = Math.random()<0.7;
      var st = Math.floor(Math.random()*(letters.length-2));
      var tri = letters.slice(st, st+3);
      items.push({mode:mode, ans: before?tri[2]:tri[0], win:tri, gap: before?2:0});
    }
  }
  return items;
}
function startQuiz(mode){ Q={mode:mode, items:genItems(mode), i:0, correct:0, missed:[], answered:false}; renderQ(); }
function renderQ(){
  var it=Q.items[Q.i], m=Q.mode;
  var h='<div class="panel"><h2>'+TITLES[m][0]+'</h2><p class="lede">'+TITLES[m][1]+'</p>'+segBar()+
    '<div class="prog"><i style="width:'+Math.round(100*Q.i/Q.items.length)+'%"></i></div>';
  if(m==='listen') h+='<button class="big-spk" data-say="'+it.ans+'">🔊 Listen</button>';
  if(it.win) h+='<div class="strip">'+it.win.map(function(L,i){ return i===it.gap ? '<span class="gap" id="gap">?</span>' : '<span>'+L+'</span>'; }).join('')+'</div>';
  var opts = shuffle([it.ans].concat(neighbors(it.ans, 3)));
  h+='<div class="opts">'+opts.map(function(L){ return '<button class="opt" data-opt="'+L+'">'+L+'</button>'; }).join('')+'</div>';
  h+='<div class="fb" id="fb"></div><div class="row" id="nextRow"></div><div class="cnt">'+(Q.i+1)+' / '+Q.items.length+'</div></div>';
  $('stage').innerHTML=h;
  if(m==='listen') setTimeout(function(){ speak(it.ans); }, 300);
}
function answer(ok, chosen){
  Q.answered=true;
  var it=Q.items[Q.i], ans=it.ans, fb=$('fb');
  if(ok) Q.correct++; else Q.missed.push({ans:ans, said:chosen});
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
    b.disabled=true;
    if(b.getAttribute('data-opt')===ans) b.classList.add('ok'); else if(b.getAttribute('data-opt')===chosen&&!ok) b.classList.add('no');
  });
  var gap=$('gap'); if(gap){ gap.textContent=ans; gap.classList.add('ok'); }
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✓ Yes! ':'✗ ')+'<b>'+ans+'</b>'+(it.win?' — '+it.win.map(function(L,i){ return i===it.gap?'<b>'+ans+'</b>':L; }).join(' '):'')+
    (ok?'':'<div style="font-size:16px;color:var(--muted);margin-top:6px">You tapped '+esc(chosen)+'. Hear both: <button class="btn soft" style="padding:4px 10px;font-size:15px;box-shadow:none" data-say="'+esc(chosen)+'">🔊 '+esc(chosen)+'</button> <button class="btn soft" style="padding:4px 10px;font-size:15px;box-shadow:none" data-say="'+ans+'">🔊 '+ans+'</button></div>');
  $('nextRow').innerHTML='<button class="btn" data-next="1">'+(Q.i+1<Q.items.length?'Next →':'Finish')+'</button>';
  speak(it.win ? it.win.map(function(L,i){ return i===it.gap?ans:L; }).join(', ') : ans);
  var n=document.querySelector('[data-next]'); if(n) n.focus();
}
function nextQ(){ Q.i++; Q.answered=false; if(Q.i>=Q.items.length) return showSummary(Q.mode, Q.correct, Q.items.length, Q.missed); renderQ(); }

/* ---------------- match (big ↔ small) ---------------- */
function startMatch(){
  var all=segLetters(), rounds = all.length>7 ? 3 : 1, first=shuffle(all).slice(0,6);
  M={pool:all, used:first.slice(), left:shuffle(first), right:shuffle(first), sel:null, done:{}, round:1, rounds:rounds, total:0, correct:0};
  renderMatch();
}
function renderMatch(){
  var h='<div class="panel"><h2>'+TITLES.match[0]+'</h2><p class="lede">'+TITLES.match[1]+'</p>'+segBar()+'<div class="mcols"><div class="mcol">';
  M.left.forEach(function(L){ h+='<button class="mb'+(M.done[L]?' ok':'')+(M.sel===L?' sel':'')+'" data-ml="'+L+'"'+(M.done[L]?' disabled':'')+'>'+L+'</button>'; });
  h+='</div><div class="mcol">';
  M.right.forEach(function(L){ h+='<button class="mb'+(M.done[L]?' ok':'')+'" data-mr="'+L+'"'+(M.done[L]?' disabled':'')+'>'+L.toLowerCase()+'</button>'; });
  h+='</div></div><div class="fb" id="fb"></div><div class="cnt">Round '+M.round+' / '+M.rounds+'</div></div>';
  $('stage').innerHTML=h;
}
function matchTap(side, L){
  if(side==='L'){ M.sel=L; speak(L); renderMatch(); return; }
  if(!M.sel) return;
  M.total++;
  if(M.sel===L){
    M.correct++; M.done[L]=true; M.sel=null; speak(L); renderMatch();
    if(Object.keys(M.done).length===M.left.length){
      if(M.round<M.rounds){
        M.round++;
        var rest=M.pool.filter(function(c){ return M.used.indexOf(c)<0; });
        var nextSet=shuffle(rest).slice(0,6); if(nextSet.length<6) nextSet=nextSet.concat(shuffle(M.used).slice(0,6-nextSet.length));
        M.used=M.used.concat(nextSet); M.left=shuffle(nextSet); M.right=shuffle(nextSet); M.done={};
        setTimeout(renderMatch, 500);
      } else setTimeout(function(){ showSummary('match', M.correct, M.total, []); }, 500);
    }
  } else {
    var b=document.querySelector('[data-mr="'+L+'"]'); if(b){ b.classList.add('no'); setTimeout(function(){ b.classList.remove('no'); },400); }
    $('fb').className='fb no'; $('fb').textContent='Not '+L.toLowerCase()+'. Try again.';
  }
}

/* ---------------- type the alphabet ---------------- */
function startType(){ TY={pos:0, wrong:0, firstTry:0, t0:null, tick:null, errAt:false}; renderType(); }
function renderType(){
  var h='<div class="panel"><h2>'+TITLES.type[0]+'</h2><p class="lede">'+TITLES.type[1]+'</p>'+
    '<div class="abc">'+ABC.map(function(L,i){ return '<span class="'+(i===0?'cur':'')+'" id="ab'+i+'">·</span>'; }).join('')+'</div>'+
    '<div class="tyrow"><input id="tyIn" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="A"><span class="timer" id="tmr">0.0 s</span></div>'+
    '<div class="fb" id="fb"></div></div>';
  $('stage').innerHTML=h;
  var inp=$('tyIn'); inp.focus();
  inp.addEventListener('input', function(){
    var v=(inp.value||'').toUpperCase().replace(/[^A-Z]/g,''); inp.value='';
    if(!v || TY.pos>=26) return;
    if(!TY.t0){ TY.t0=Date.now(); TY.tick=setInterval(function(){ var t=$('tmr'); if(t) t.textContent=((Date.now()-TY.t0)/1000).toFixed(1)+' s'; },100); }
    var want=ABC[TY.pos], cell=$('ab'+TY.pos);
    if(v===want){
      if(!TY.errAt) TY.firstTry++;
      TY.errAt=false; cell.textContent=want; cell.className='done'; TY.pos++;
      var nx=$('ab'+TY.pos); if(nx) nx.className='cur';
      if(TY.pos>=26){ clearInterval(TY.tick); var secs=((Date.now()-TY.t0)/1000).toFixed(1); $('tmr').textContent=secs+' s'; $('fb').className='fb ok'; $('fb').textContent='✓ All 26 in '+secs+' seconds!'; setTimeout(function(){ showSummary('type', TY.firstTry, 26, [], secs); }, 900); }
    } else {
      TY.wrong++; TY.errAt=true; cell.className='cur bad'; setTimeout(function(){ cell.className='cur'; },400);
      $('fb').className='fb no'; $('fb').innerHTML='Not '+esc(v)+'. '+(TY.pos?'After <b>'+ABC[TY.pos-1]+'</b> comes…?':'The alphabet starts with…?');
      speak(TY.pos?ABC[TY.pos-1]:'A');
    }
  });
}

/* ---------------- summary + save ---------------- */
function showSummary(mode, c, t, missed, secs){
  var pct=c/t, msg = pct===1 ? 'Perfect!' : pct>=0.8 ? 'Great work!' : pct>=0.6 ? 'Good. Try again.' : 'Keep practicing.';
  var h='<div class="panel summary"><h2>'+msg+'</h2><div class="score">'+c+' / '+t+'</div><p class="lede" style="margin:0 auto">'+(mode==='type'?'letters right first try'+(secs?' · '+secs+' s':''):mode==='match'?'matches':'correct')+'</p>';
  if(missed&&missed.length) h+='<div class="miss">'+missed.map(function(m){ return '<div><b>'+m.ans+'</b> <span style="color:var(--muted)">(you tapped '+esc(m.said)+')</span></div>'; }).join('')+'</div>';
  var idxA=0; ACTS.forEach(function(a,i){ if(a.k===mode) idxA=i; }); var nxt=ACTS[idxA+1];
  h+='<div class="row"><button class="btn soft" data-again="1">Again</button>'+(nxt?'<button class="btn" data-actk="'+nxt.k+'">'+esc(nxt.t)+' →</button>':'')+'</div></div>';
  $('stage').innerHTML=h;
  saveResult(mode, c, t, missed||[], secs);
}
var registered=false;
function saveResult(ak, correct, total, missed, secs){
  var key=UNIT+'-'+ak, prev=S.scores[key]||{best:0,attempts:0};
  var rec={best:Math.max(prev.best||0,correct), total:total, correct:correct, attempts:(prev.attempts||0)+1};
  S.scores[key]=rec; persist(); renderNav(); setDot('saving');
  var when=new Date().toISOString();
  var row={email:S.email, name:S.name, period:S.period, activity:key, unit:UNIT, correct:correct, total:total, best:rec.best, attempts:rec.attempts, turned_in:true,
    detail:{lang:S.lang, seg:SEGS[S.seg][0], secs:secs||null, missed:missed.slice(0,20)}, updated_at:when};
  rawFetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,activity',{method:'POST',headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(row)})
    .then(function(r){ if(r.ok) setDot('saved'); else { setDot('err'); r.text().then(function(t){ console.warn('save failed',r.status,t); }); } })
    .catch(function(e){ setDot('err'); console.warn(e); });
  var actT=''; ACTS.forEach(function(a){ if(a.k===ak) actT=a.t; });
  var post=function(path, body, prefer){ return rawFetch(SUPA_URL+'/rest/v1/'+path,{method:'POST',headers:headers({'Prefer':prefer||'return=minimal'}),body:JSON.stringify(body)}).catch(function(){}); };
  var reg = registered ? Promise.resolve() : post('activities?on_conflict=slug',[{slug:SLUG, title:'The alphabet', unit:'Alphabet', url:PAGE_URL, skills:['alphabet'], sort_order:590}],'resolution=merge-duplicates,return=minimal').then(function(){ registered=true; });
  reg.then(function(){
    post('activity_attempts',[{email:S.email, slug:SLUG, score:correct, max_score:total, detail:{path:location.pathname, source:'page', task:ak, task_title:actT, unit:UNIT, seg:SEGS[S.seg][0]}, completed_at:when}]);
    post('skill_attempts',[{email:S.email, slug:SLUG, skill:'alphabet', n:correct, d:total, completed_at:when}]);
  });
}
function loadScores(){
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?email=eq.'+encodeURIComponent(S.email)+'&activity=like.'+encodeURIComponent(UNIT+'-%')+'&select=activity,best,total,correct,attempts',{headers:headers()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ (rows||[]).forEach(function(r){ S.scores[r.activity]={best:r.best,total:r.total,correct:r.correct,attempts:r.attempts}; }); })
    .catch(function(){});
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  var t=e.target.closest ? e.target.closest('button') : null; if(!t) return;
  var d=function(k){ return t.getAttribute('data-'+k); };
  if(d('closepop')){ $('pop').classList.add('hidden'); return; }
  if(d('say')){ speak(d('say')); return; }
  if(d('actk')) return go(d('actk'));
  if(d('again')) return renderStage();
  if(d('seg')!=null){ S.seg=parseInt(d('seg'),10); persist(); return renderStage(); }
  if(d('playall')) return playAll();
  if(F){
    if(d('flip')){ F.flipped=!F.flipped; return renderFlash(); }
    if(d('fnext')){ F.i=(F.i+1)%F.cards.length; F.flipped=false; return renderFlash(); }
    if(d('fprev')){ F.i=(F.i-1+F.cards.length)%F.cards.length; F.flipped=false; return renderFlash(); }
  }
  if(M){ if(d('ml')) return matchTap('L', d('ml')); if(d('mr')) return matchTap('R', d('mr')); }
  if(Q){
    var it=Q.items[Q.i];
    if(d('opt')!=null && !Q.answered) return answer(d('opt')===it.ans, d('opt'));
    if(d('next')) return nextQ();
  }
});

/* ---------------- login ---------------- */
var EMAIL_RE=/^[^@\s]+@(s\.)?sfusd\.edu$/;
function canonical(email){ return email.trim().toLowerCase().split('@')[0]+'@s.sfusd.edu'; }
function registerStudent(typed){
  var canon=S.email, parts=S.name.split(/\s+/);
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify([{email:canon, name:S.name, first_name:parts[0]||null, last_name:parts.slice(1).join(' ')||null, updated_at:new Date().toISOString()}])}).catch(function(){});
  if(typed!==canon){
    fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:headers({'Prefer':'resolution=ignore-duplicates,return=minimal'}),
      body:JSON.stringify([{alias_email:typed, canonical_email:canon}])}).catch(function(){});
  }
}

/* ---------------- boot ---------------- */
(function(){
  var opts=LANGS.map(function(l){ return '<option value="'+l[0]+'">'+esc(l[1])+'</option>'; }).join('');
  $('inLang').innerHTML=opts; $('langSel').innerHTML=opts;
  try{
    var c=JSON.parse(localStorage.getItem(LSKEY)||'null');
    if(c&&c.email){ $('inName').value=c.name||''; $('inEmail').value=c.email; $('inPeriod').value=c.period||''; $('inLang').value=c.lang||'none'; S.scores=c.scores||{}; S.act=c.act||'learn'; S.seg=c.seg||0; }
    else {
      var saved=localStorage.getItem('gal_student_email'); if(saved) $('inEmail').value=saved;
      var sn=localStorage.getItem('gal_student_name'); if(sn) $('inName').value=sn;
      var sp=localStorage.getItem('gal_student_period'); if(sp) $('inPeriod').value=/Period/.test(sp)?sp:'Period '+sp;
      var sl=localStorage.getItem('gal_student_l1'); if(sl && LANGS.some(function(l){ return l[0]===sl; })) $('inLang').value=sl;
    }
  }catch(e){}
  $('btnStart').addEventListener('click', function(){
    var n=$('inName').value.trim(), e=$('inEmail').value.trim().toLowerCase(), p=$('inPeriod').value, err=$('loginErr');
    if(!n) return err.textContent='Please type your name.';
    if(!EMAIL_RE.test(e)) return err.textContent='Use your school email: name@s.sfusd.edu';
    if(!p) return err.textContent='Choose your class period.';
    err.textContent='';
    var canon=canonical(e);
    if(S.email && S.email!==canon) S.scores={};
    S.name=n; S.email=canon; S.period=p; S.lang=$('inLang').value;
    try{ localStorage.setItem('gal_student_email',canon); localStorage.setItem('gal_student_name',n); localStorage.setItem('gal_student_period',p); localStorage.setItem('gal_student_l1',S.lang); }catch(ex){}
    persist(); registerStudent(e);
    $('whoLbl').textContent=n+' · '+p; $('langSel').value=S.lang;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    loadScores().then(function(){ renderNav(); renderStage(); });
    renderNav(); renderStage();
  });
  $('langSel').addEventListener('change', function(){ S.lang=this.value; persist(); try{ localStorage.setItem('gal_student_l1',S.lang); }catch(e){} renderStage(); });
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged=function(){ voice=null; };
})();

/* ============ Galileo standard: directions in L1 + quiet browser-translation canary ============ */
(function(){
  function hd(pref){ var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; if(pref) h['Prefer']=pref; return h; }
  var DIR_ON=true, SENT={}, dcache={};
  try{ DIR_ON = localStorage.getItem('abc_dir')!=='0'; }catch(e){}
  function tr(text, lang){
    var key=lang+'|'+text; if(dcache[key]) return Promise.resolve(dcache[key]);
    var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('Directions for a beginner English student. Translate plainly and simply.')+'&lang='+encodeURIComponent(lang);
    return rawFetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      var t=d.translation.equiv||d.translation.meaning||''; if(t) dcache[key]=t; return t||null;
    }).catch(function(){return null;});
  }
  function logReveal(k, lang){
    if(!S.email) return; var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    rawFetch(SUPA_URL+'/rest/v1/instruction_reveals',{method:'POST',headers:hd('return=minimal'),body:JSON.stringify([{email:S.email, set_slug:SLUG, activity:k, lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=S.lang, list=document.querySelectorAll('#stage .lede');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!p.getAttribute('data-en')){
        var en=(p.textContent||'').replace(out?out.textContent:'','').trim();
        p.setAttribute('data-en',en); p.setAttribute('translate','yes'); p.setAttribute('data-dir',S.act);
      }
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang||lang==='none'){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||''; if(!en) return;
      out.setAttribute('dir', RTL.test(lang)?'rtl':'ltr'); out.textContent='…';
      tr(en,lang).then(function(t){ out.textContent=t||''; if(t) logReveal(k,lang); });
    });
  }
  var dirBtn=$('btn-dir');
  dirBtn.classList.toggle('on',DIR_ON);
  dirBtn.addEventListener('click',function(){ DIR_ON=!DIR_ON; try{ localStorage.setItem('abc_dir',DIR_ON?'1':'0'); }catch(e){} dirBtn.classList.toggle('on',DIR_ON); showDirections(); });
  var pend=null;
  new MutationObserver(function(){ if(pend) return; pend=setTimeout(function(){ pend=null; showDirections(); },120); }).observe($('stage'),{childList:true});

  var EXPECT=(dirBtn.textContent||'').trim(), TR_SENT='';
  function detectTranslation(){
    var got=(dirBtn.textContent||'').trim(), observed=(got&&got!==EXPECT)?got:'';
    var cls=document.documentElement.className||'';
    if(!observed && !/translated/.test(cls)) return null;
    return {observed:observed, html_lang:document.documentElement.lang||'', html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation(); if(!d||!S.email) return;
    var sig=d.observed+'|'+d.html_lang; if(sig===TR_SENT) return; TR_SENT=sig;
    rawFetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{method:'POST',headers:hd('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:S.email, set_slug:SLUG, translated:true, observed:d.observed, html_lang:d.html_lang, html_class:d.html_class, updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation,20000); setTimeout(checkTranslation,4000);
})();
</script>
