<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival English Unit 1 — Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101c17;--card:#1c3129;--edge:#2b4a3c;--text:#eaf1ed;--muted:#93a89d;--pine:#3f9e73;--gold:#d9a441;--red:#e07a6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:16px;line-height:1.55}
#bar{position:sticky;top:0;z-index:50;background:#16261f;border-bottom:1px solid var(--edge);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar b{font-size:1.02rem}
#bar .spacer{flex:1}
button{font-family:inherit;font-weight:800;font-size:.82rem;background:#22392f;color:var(--text);border:1px solid var(--edge);border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--pine)}
button.on{background:var(--pine);color:#0d1a14;border-color:var(--pine)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 70px}
h1{font-size:1.7rem;margin:6px 0 2px;font-weight:800}
.sub{color:var(--muted);font-weight:700;margin:0 0 18px;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:0 0 20px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:11px;padding:12px 14px}
.stat .n{font-size:1.8rem;font-weight:800;letter-spacing:-1px}
.stat .l{color:var(--muted);font-size:.76rem;font-weight:800;letter-spacing:.8px}
table{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card);border-radius:11px;overflow:hidden}
th{background:#22392f;text-align:left;padding:9px 11px;font-size:.74rem;letter-spacing:.8px;color:var(--muted);cursor:pointer;white-space:nowrap}
th:hover{color:var(--text)}
td{padding:9px 11px;border-top:1px solid var(--edge);vertical-align:middle}
tr.row:hover{background:#22392f;cursor:pointer}
.pb{height:8px;background:#12241c;border-radius:5px;overflow:hidden;min-width:90px}
.pb i{display:block;height:100%;background:var(--pine)}
.pill{font-size:.68rem;font-weight:800;letter-spacing:.6px;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.in{background:var(--pine);color:#0d1a14}
.pill.no{background:#33473d;color:var(--muted)}
.pill.easy{background:#3c5a76;color:#e8f1f8}
.pill.hard{background:#6d5426;color:#f7ecd6}
.sc{font-weight:800}
.sc.hi{color:var(--pine)}.sc.mid{color:var(--gold)}.sc.lo{color:var(--red)}
#detail{display:none;background:var(--card);border:1px solid var(--edge);border-radius:13px;padding:18px 20px;margin:18px 0 0}
#detail h2{margin:0 0 3px;font-size:1.35rem}
#detail .meta{color:var(--muted);font-weight:700;font-size:.86rem;margin-bottom:14px}
.item{border-top:1px solid var(--edge);padding:10px 0}
.item .qq{font-weight:700;font-size:.93rem}
.item .lab{font-size:.72rem;font-weight:800;letter-spacing:.7px;color:var(--muted)}
.item .mine{margin-top:4px;font-size:.93rem}
.ok{color:var(--pine);font-weight:800}
.no2{color:var(--red);font-weight:800}
.wr{white-space:pre-wrap;background:#12241c;border:1px solid var(--edge);border-radius:9px;padding:10px 12px;margin-top:5px;font-size:.93rem}
.sect{margin:26px 0 10px;font-size:.76rem;letter-spacing:1.3px;color:var(--pine);font-weight:800;border-bottom:1px solid var(--edge);padding-bottom:6px}
.bars .b{display:grid;grid-template-columns:1fr 58px;gap:10px;align-items:center;padding:4px 0;font-size:.87rem}
.bars .track{height:15px;background:#12241c;border-radius:4px;overflow:hidden;position:relative}
.bars .track i{display:block;height:100%;background:var(--pine)}
.bars .track.warn i{background:var(--red)}
.bars .track span{position:absolute;left:7px;top:-1px;font-size:.76rem;font-weight:800}
#gate{position:fixed;inset:0;z-index:200;background:#0c1611;display:flex;align-items:center;justify-content:center;padding:20px}
#gate .p{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:26px;max-width:360px;width:100%}
#gate h2{margin:0 0 14px}
#gate input{width:100%;font-family:inherit;font-size:1rem;padding:10px 12px;border-radius:9px;border:1px solid var(--edge);background:#12241c;color:var(--text)}
#gate button{width:100%;margin-top:14px;background:var(--pine);color:#0d1a14;border-color:var(--pine);padding:11px}
#gate .e{color:var(--red);font-weight:800;font-size:.85rem;margin-top:8px;display:none}
.empty{color:var(--muted);padding:30px 0;font-weight:700}
@media print{#bar,button,#gate{display:none!important}body{background:#fff;color:#000}table{background:#fff}td,th{border-color:#ccc;color:#000}}
</style>
</head>

<div id="gate"><div class="p">

  <span class="spacer"></span>
  <span id="stamp" style="color:var(--muted);font-size:.8rem;font-weight:700"></span>
  <button id="refresh">Refresh</button>
  <button id="csv">Export CSV</button>
  <button id="print">Print</button>
</div>

<div class="wrap">

</div>

  return 0;
}
function autoIds(){return Object.keys(KEY()).filter(function(id){return KEY()[id].t!=='short'})}
function shortIds(){return Object.keys(KEY()).filter(function(id){return KEY()[id].t==='short'})}

function rowScore(r){
  var a=r.answers||{},s=0;
  autoIds().forEach(function(id){if(itemScore(id,a[id]))s++});
  return s;
}
function rowDone(r){
  var a=r.answers||{},n=0,all=Object.keys(KEY());
  all.forEach(function(id){
    var v=a[id],k=KEY()[id];
    if(v===undefined||v===null||v==='')return;
    if(k.t==='match'){if(Object.keys(v).length>=(k.pairs?k.pairs.length:99))n++}
    else if(k.t==='short'){if(String(v).trim().length>20)n++}
    else n++;
  });
  return Math.round(n/all.length*100);
}

/* ---- fetch ---- */
function load(){
  $('#stamp').textContent='loading…';
  fetch(SUPA_URL+'/rest/v1/'+TABLE()+'?select=*&order=name.asc',{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  }).then(function(r){return r.json()}).then(function(j){
    DATA[TAB]=Array.isArray(j)?j:[];
    $('#stamp').textContent='updated '+new Date().toLocaleTimeString();
    render();
  }).catch(function(){$('#stamp').textContent='could not load';});
}

/* ---- render ---- */
function render(){
  var rows=DATA[TAB];
  $('#ttl').textContent=TAB==='work'?'Unit work':'Unit test';
  $('#sub').textContent=TAB==='work'
    ? 'Six lessons · '+Object.keys(KEY_UNIT).length+' practice items · '+autoIds().length+' auto-scored'
    : 'Parts A–D auto-scored ('+autoIds().length+' points) · Part E scored by you';
  $('#detail').style.display='none';

  var total=autoIds().length;
  var turned=rows.filter(function(r){return r.turned_in});
  var avg=turned.length?Math.round(turned.reduce(function(s,r){return s+rowScore(r)},0)/turned.length):0;
  $('#stats').innerHTML=
     stat(rows.length,'STUDENTS STARTED')
    +stat(turned.length,TAB==='work'?'TURNED IN':'SUBMITTED')
    +stat(avg+' / '+total,'AVERAGE SCORE')
    +stat((total?Math.round(avg/total*100):0)+'%','CLASS AVERAGE')
    +stat(rows.filter(function(r){return r.level==='hard'}).length,'ON HARDER ENGLISH');

  if(!rows.length){$('#tablehost').innerHTML='<div class="empty">No student work yet.</div>';$('#analysis').innerHTML='';return}

  var sorted=rows.slice().sort(function(a,b){
    var k=SORT.k,va,vb;
    if(k==='score'){va=rowScore(a);vb=rowScore(b)}
    else if(k==='done'){va=rowDone(a);vb=rowDone(b)}
    else if(k==='in'){va=a.turned_in?1:0;vb=b.turned_in?1:0}
    else{va=String(a[k]||'').toLowerCase();vb=String(b[k]||'').toLowerCase()}
    return va<vb?-SORT.d:va>vb?SORT.d:0;
  });

  var h='<table><thead><tr>'
   +th('name','Student')+th('level','Level')+th('done','Progress')
   +th('score','Auto score')+th('in',TAB==='work'?'Turned in':'Submitted')
   +th('updated_at','Last saved')+'</tr></thead><tbody>';
  sorted.forEach(function(r){
    var s=rowScore(r),p=rowDone(r),pct=total?s/total:0;
    h+='<tr class="row" data-email="'+esc(r.email)+'">'
      +'<td><b>'+esc(r.name||r.email)+'</b><div style="color:var(--muted);font-size:.78rem">'+esc(r.email)+'</div></td>'
      +'<td><span class="pill '+(r.level==='hard'?'hard':'easy')+'">'+(r.level==='hard'?'HARDER':'EASIER')+'</span></td>'
      +'<td><div class="pb"><i style="width:'+p+'%"></i></div><div style="font-size:.76rem;color:var(--muted)">'+p+'%</div></td>'
      +'<td class="sc '+(pct>=.8?'hi':pct>=.6?'mid':'lo')+'">'+s+' / '+total+'</td>'
      +'<td><span class="pill '+(r.turned_in?'in':'no')+'">'+(r.turned_in?'YES':'not yet')+'</span></td>'
      +'<td style="color:var(--muted);font-size:.82rem">'+(r.updated_at?new Date(r.updated_at).toLocaleString():'')+'</td>'
      +'</tr>';
  });
  h+='</tbody></table>';
  $('#tablehost').innerHTML=h;
  $$('tr.row').forEach(function(tr){tr.onclick=function(){detail(tr.getAttribute('data-email'))}});
  $$('th[data-k]').forEach(function(t){t.onclick=function(){
    var k=t.getAttribute('data-k');SORT.d=(SORT.k===k)?-SORT.d:1;SORT.k=k;render();
  }});
  analysis(rows);
}
function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}
function th(k,t){return '<th data-k="'+k+'">'+t+(SORT.k===k?(SORT.d>0?' ▲':' ▼'):'')+'</th>'}

/* ---- one student ---- */
function detail(email){
  var r=DATA[TAB].filter(function(x){return x.email===email})[0];if(!r)return;
  var a=r.answers||{},K=KEY(),total=autoIds().length,s=rowScore(r);
  var h='<h2>'+esc(r.name||r.email)+'</h2>'
   +'<div class="meta">'+esc(r.email)+' &middot; '+(r.level==='hard'?'Harder English':'Easier English')
   +' &middot; '+s+' / '+total+' auto &middot; '+(r.turned_in?'turned in':'not turned in')
   +(r.updated_at?' &middot; '+new Date(r.updated_at).toLocaleString():'')+'</div>';

  var group='';
  Object.keys(K).forEach(function(id){
    var k=K[id],v=a[id];
    var g=(TAB==='work'?('Lesson '+k.L):('Part '+k.p));
    if(g!==group){group=g;h+='<div class="sect">'+g.toUpperCase()+'</div>'}
    h+='<div class="item"><div class="lab">'+id.toUpperCase()+' &middot; '+k.t+'</div>'
      +'<div class="qq">'+esc(k.q)+'</div>';
    if(k.t==='short'){
      h+='<div class="wr">'+(v?esc(v):'<i style="color:var(--muted)">no answer</i>')+'</div>';
    }else{
      var sc=itemScore(id,v);
      var shown='—';
      if(v!==undefined&&v!==null&&v!==''){
        if(k.t==='mc'||k.t==='listen')shown=k.opts?k.opts[v]:v;
        else if(k.t==='match'){
          shown=Object.keys(v).map(function(L){
            var left=k.pairs[L][0],right=k.pairs[v[L]]?k.pairs[v[L]][1]:'?';
            return (String(v[L])===String(L)?'✓ ':'✗ ')+left+' → '+right;
          }).join('<br>');
        }
        else shown=v;
      }
      h+='<div class="mine"><span class="'+(sc?'ok':'no2')+'">'+(sc?'correct':'incorrect')+'</span> — '+shown+'</div>';
      if(!sc)h+='<div class="mine" style="color:var(--muted)">key: '+esc(k.a)+'</div>';
    }
    h+='</div>';
  });
  $('#detail').innerHTML=h+'<div style="margin-top:16px"><button onclick="document.getElementById(\'detail\').style.display=\'none\'">Close</button></div>';
  $('#detail').style.display='block';
  $('#detail').scrollIntoView({behavior:'smooth'});
}

/* ---- item analysis ---- */
function analysis(rows){
  var K=KEY(),ids=autoIds();
  var attempted=rows.filter(function(r){return r.answers&&Object.keys(r.answers).length});
  if(!attempted.length){$('#analysis').innerHTML='';return}
  var h='<div class="sect">ITEM ANALYSIS &middot; percent of students correct</div><div class="bars">';
  ids.forEach(function(id){
    var n=0,c=0;
    attempted.forEach(function(r){n++;if(itemScore(id,(r.answers||{})[id]))c++});
    var p=n?Math.round(c/n*100):0;
    h+='<div class="b"><div class="track'+(p<60?' warn':'')+'"><i style="width:'+p+'%"></i><span>'
      +esc(id.toUpperCase()+' · '+K[id].q.slice(0,62))+'</span></div><div style="font-weight:800;text-align:right">'+p+'%</div></div>';
  });
  h+='</div>';

  if(TAB==='test'){
    var sk={};
    ids.forEach(function(id){
      var s=K[id].s||'other';sk[s]=sk[s]||{r:0,n:0};
      attempted.forEach(function(r){sk[s].n++;if(itemScore(id,(r.answers||{})[id]))sk[s].r++});
    });
    var names={vocab:'Vocabulary',be:'Verb BE',imperative:'Commands',request:'Asking for things',there:'There is / There are',article:'a / an',preposition:'Prepositions','time-prep':'at / on / in',question:'Question words','function':'What to say',listening:'Listening'};
    h+='<div class="sect">CLASS BY SKILL</div><div class="bars">';
    Object.keys(sk).forEach(function(s){
      var p=sk[s].n?Math.round(sk[s].r/sk[s].n*100):0;
      h+='<div class="b"><div class="track'+(p<60?' warn':'')+'"><i style="width:'+p+'%"></i><span>'+esc(names[s]||s)+'</span></div><div style="font-weight:800;text-align:right">'+p+'%</div></div>';
    });
    h+='</div>';
  }

  var sids=shortIds();
  if(sids.length){
    h+='<div class="sect">WRITING &middot; read and score by hand</div>';
    sids.forEach(function(id){
      h+='<div style="margin:12px 0 6px;font-weight:800">'+esc(K[id].q)+'</div>';
      rows.forEach(function(r){
        var v=(r.answers||{})[id];if(!v||!String(v).trim())return;
        h+='<div class="wr"><b>'+esc(r.name||r.email)+'</b> ('+(r.level==='hard'?'harder':'easier')+')<br>'+esc(v)+'</div>';
      });
    });
  }
  $('#analysis').innerHTML=h;
}

/* ---- csv ---- */
function csv(){
  var rows=DATA[TAB],K=KEY(),ids=Object.keys(K),total=autoIds().length;
  var head=['name','email','level','progress_pct','auto_score','auto_total','turned_in','updated_at'].concat(ids);
  var out=[head.join(',')];
  rows.forEach(function(r){
    var a=r.answers||{};
    var line=[r.name,r.email,r.level,rowDone(r),rowScore(r),total,r.turned_in?'yes':'no',r.updated_at];
    ids.forEach(function(id){
      var v=a[id],k=K[id],cell='';
      if(v===undefined||v===null)cell='';
      else if(k.t==='mc'||k.t==='listen')cell=(k.opts&&k.opts[v]!==undefined)?k.opts[v]:v;
      else if(k.t==='match')cell=Object.keys(v).map(function(L){return L+'>'+v[L]}).join(' ');
      else cell=v;
      line.push(cell);
    });
    out.push(line.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""').replace(/\n/g,' ')+'"'}).join(','));
  });
  var b=new Blob([out.join('\n')],{type:'text/csv'});
  var u=URL.createObjectURL(b),a2=document.createElement('a');
  a2.href=u;a2.download='survival_unit1_'+TAB+'_'+new Date().toISOString().slice(0,10)+'.csv';
  a2.click();URL.revokeObjectURL(u);
}

/* ---- wiring ---- */
$$('.tabb').forEach(function(b){b.onclick=function(){
  $$('.tabb').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');TAB=b.getAttribute('data-tab');load();
}});
$('#refresh').onclick=load;
$('#csv').onclick=csv;
$('#print').onclick=function(){window.print()};
$('#pb').onclick=function(){
  if($('#pw').value===PASS){$('#gate').style.display='none';load()}
  else{$('#pe').style.display='block'}
};
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('#pb').click()});
</script>
