<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brothers in Arms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17222b; --muted:#56636e; --bg:#e6eaee; --card:#fff; --line:#17222b;
  --orange:#e2672a; --orange-soft:#fde6d6; --teal:#14706c; --teal-soft:#d6eeec;
  --ok:#1d8448; --ok-soft:#dcf3e4; --gold:#ffd75e; --plate:#1f4f8f; --plate-ink:#fff;
  --shadow:4px 4px 0 rgba(23,34,43,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
select,input,textarea{font-family:inherit;font-size:17px;color:var(--ink)}
select{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
select option{color:#17222b;background:#fff}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:#17222b;color:#fff;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--orange)}
.top h1{font-size:21px;margin:0 8px 0 0;font-weight:900;letter-spacing:.2px}
.top .sp{flex:1}
.top select{padding:6px 8px;font-size:15px;border-color:#fff}
.lvl{display:flex;border:2px solid #fff;border-radius:999px;overflow:hidden}
.lvl button{background:transparent;border:0;color:#fff;padding:5px 14px;font-weight:800;font-size:15px}
.lvl button.on{background:#fff;color:#17222b}
.who{font-size:14px;opacity:.85}
.saved{font-size:13px;color:#ffd75e;min-width:60px}

/* ---------- chapter street (house-number plates) ---------- */
.street{max-width:1100px;margin:14px auto 0;padding:0 12px}
.plates{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.plate{position:relative;border:3px solid #0e2f57;background:var(--plate);color:#fff;border-radius:9px;min-width:74px;padding:6px 8px 5px;text-align:center;box-shadow:var(--shadow);font-weight:900;line-height:1.1}
.plate::before{content:"";position:absolute;inset:3px;border:1.5px solid rgba(255,255,255,.75);border-radius:6px;pointer-events:none}
.plate .n{font-size:26px;display:block}
.plate .c{font-size:12px;font-weight:800;opacity:.95;display:block}
.plate.done{background:var(--ok);border-color:#0f5a2e}
.plate.cur{transform:translateY(-4px);outline:3px solid var(--orange);outline-offset:2px}
.plate.next{animation:pulse 1.6s ease-in-out infinite}
.plate.after{background:#6b3d8f;border-color:#3f2058;min-width:110px}
.plate .lk{position:absolute;top:-10px;right:-8px;font-size:15px}
@keyframes pulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 6px rgba(226,103,42,.45)}}
.bar{height:12px;border:2px solid var(--line);border-radius:999px;background:#fff;margin:10px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok));width:0;transition:width .4s}
.barlbl{font-size:13px;color:var(--muted);margin-top:3px}

/* ---------- step chips ---------- */
.wrap{max-width:1100px;margin:12px auto 60px;padding:0 12px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.step{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-weight:800;font-size:16px;box-shadow:2px 2px 0 rgba(23,34,43,.15)}
.step.on{background:var(--ink);color:#fff}
.step.ok{background:var(--ok-soft);border-color:var(--ok)}
.step.ok.on{background:var(--ok);color:#fff}
.step .cnt{font-size:12px;font-weight:700;opacity:.8;margin-left:4px}

/* ---------- boxes ---------- */
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin:0 0 16px;display:flow-root}
.box h2{margin:0 0 6px;font-size:23px;font-weight:900}
.box h3{margin:0 0 6px;font-size:19px;font-weight:900}
.dir{margin:0 0 10px;font-size:16px;color:var(--muted);font-weight:700}
.dir .en{display:block}
.dir .tr{display:block;color:var(--teal);font-weight:800}
.dir .tr:empty{display:none}
.pic-r{float:right;width:min(38%,230px);margin:0 0 10px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;cursor:pointer}
.pic-r svg{display:block;width:100%;height:auto}
.scene{position:relative;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#cfd8df;margin:0 0 12px}
.scene img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#fff}
.scene svg{display:block;width:100%;height:auto}
.scene .two{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.scene img{cursor:zoom-in}
.scene.cover svg{filter:blur(1.5px) grayscale(.4);opacity:.6}
.covertxt{position:absolute;left:0;right:0;top:42%;text-align:center;font-weight:900;font-size:22px;z-index:2;padding:0 10px}
.qpic{border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 8px;display:grid;grid-auto-flow:column;gap:2px;background:var(--line)}
.qpic img{display:block;width:100%;max-height:340px;object-fit:contain;background:#fff;cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:120;background:rgba(10,16,22,.88);display:flex;align-items:center;justify-content:center;padding:14px}
.lb img{max-width:100%;max-height:100%;border:3px solid #fff;border-radius:8px;background:#fff}
.lbx{position:absolute;top:10px;right:14px;border:2px solid #fff;background:#17222b;color:#fff;border-radius:50%;width:42px;height:42px;font-size:24px}
.credit{position:absolute;left:8px;bottom:6px;background:rgba(255,255,255,.92);border:1.5px solid var(--line);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:800;z-index:2}
.lion{position:absolute;width:20px;height:20px;padding:0;border:0;background:transparent;opacity:.75;z-index:3}
.lion svg{width:100%;height:100%}

/* ---------- reading ---------- */
.readctl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;box-shadow:2px 2px 0 rgba(23,34,43,.15)}
.btn.big{font-size:19px;padding:10px 18px}
.btn.go{background:var(--ok);color:#fff;border-color:#0f5a2e}
.btn.or{background:var(--orange);color:#fff;border-color:#a8461a}
.btn.on{background:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.para{position:relative;border:2px solid var(--line);border-radius:12px;padding:12px 14px 12px 52px;margin:0 0 12px;background:#fff;display:flow-root;font-size:21px;line-height:1.75}
.para .pn{position:absolute;left:10px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;border:0}
.para .pl{display:block;margin-top:6px;font-size:14px}
.para.flash{animation:flash 1.4s}
@keyframes flash{0%,100%{background:#fff}30%{background:#fff3c4}}
.w{border-radius:4px;cursor:pointer;padding:0 1px}
.w:hover{background:#eef2f5}
.w.kw{border-bottom:3px dotted var(--orange);font-weight:800}
.w.now{background:var(--gold)!important}
.sent-u{text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:3px}
.para .pr{float:right;width:min(32%,180px);margin:0 0 6px 14px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}
.para .pr svg{display:block;width:100%;height:auto}

/* ---------- word cards ---------- */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wcard{border:2px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:2px 2px 0 rgba(23,34,43,.15)}
.wcard .wpic{display:block;width:100%;border:0;padding:0;background:#fff;border-bottom:2px solid var(--line)}
.wcard .wpic svg{display:block;width:100%;height:auto}
.wcard .wb{padding:8px 10px}
.wcard .ww{font-size:21px;font-weight:900;display:block;cursor:pointer}
.wcard .wm{display:block;font-size:15px;color:var(--muted);cursor:pointer}
.wcard .wt{display:block;font-size:17px;margin-top:2px;min-height:1.2em}
.eq{font-weight:900;text-decoration:underline}
.recrow{display:flex;align-items:center;gap:8px;margin-top:6px;border-top:1px solid #d5dbe0;padding-top:6px}
.recb{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.recb .dot{width:18px;height:18px;border-radius:50%;background:#d93a3a}
.recb.live{animation:pulse 1s infinite;background:#fde3e3}
.recmsg{font-size:14px;font-weight:700;color:var(--muted);flex:1}
.recplay{border:2px solid var(--line);border-radius:8px;background:#fff;padding:2px 9px;font-weight:900}
.wcard.recok{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.eq.none{color:#8a96a0}

/* ---------- questions ---------- */
.q{border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;background:#fff;display:flow-root}
.q .qt{font-weight:800;font-size:19px;margin:0 0 8px}
.q.done{border-color:var(--ok);background:#f6fcf8}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;font-weight:700;transition:opacity .4s}
.opt.fade{opacity:.3;cursor:default;text-decoration:line-through;text-decoration-color:#9aa5ae}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right::after{content:" ✓";color:var(--ok);font-weight:900}
.opt.pick{outline:3px solid var(--orange)}
.quip{display:flex;gap:10px;align-items:center;margin:10px 0 0;padding:8px 10px;border:2px dashed var(--teal);border-radius:10px;background:var(--teal-soft);font-weight:700}
.quip .av{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:#fff}
.quip .av svg{width:100%;height:100%}
.quip .hint{display:block;font-weight:600;color:#0d4f4c}
.look{margin:8px 0 0;padding:8px 12px;border-left:5px solid var(--orange);background:#fff8f2;font-size:18px}
.tag{display:inline-block;font-size:12px;font-weight:900;border:2px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;background:#fff7d1}
.chk{color:var(--ok);font-weight:900}
.pred-note{font-size:15px;color:var(--muted);margin-top:6px}

/* ---------- games ---------- */
.tt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tt .col{display:flex;flex-direction:column;gap:8px}
.chip{border:2px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;font-weight:800;text-align:left;transition:opacity .4s}
.chip.sel{outline:3px solid var(--orange);background:var(--orange-soft)}
.chip.ok{background:var(--ok-soft);border-color:var(--ok)}
.chip.used{opacity:.35}
.chip.wob{animation:wob .45s}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-2deg)}75%{transform:translateX(6px) rotate(2deg)}}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:48px;background:#fbfcfd}
.slot .num{width:30px;height:30px;border-radius:50%;background:var(--plate);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.target{outline:3px solid var(--orange)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.thumbs{display:flex;gap:10px;margin-top:6px}
.thumbs button{font-size:18px}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.face{border:2px solid var(--line);border-radius:12px;background:#fff;padding:4px;font-weight:800;font-size:14px;transition:opacity .4s}
.face svg{display:block;width:100%;height:auto}
.face.fade{opacity:.3}
.face.right{background:var(--ok-soft);border-color:var(--ok)}
.cloze{font-size:21px;line-height:2.2}
.blank{display:inline-block;min-width:110px;border:0;border-bottom:3px solid var(--orange);background:#fff7ef;border-radius:6px 6px 0 0;padding:0 8px;font-weight:900;text-align:center}
.blank.target{outline:3px solid var(--orange)}
.blank.ok{border-bottom-color:var(--ok);background:var(--ok-soft)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{border:3px solid var(--line);border-radius:12px 12px 4px 4px;background:#8a5a3b;color:#fff;padding:0;overflow:hidden;font-weight:800;text-align:center;transition:opacity .4s}
.door svg{display:block;width:100%;height:auto;max-height:150px}
.door span{display:block;padding:8px;background:#5c3b26;font-size:17px}
.door.fade{opacity:.3}
.door.right{outline:4px solid var(--ok)}

/* ---------- fix it board ---------- */
.board{background:#f4f7f5;border:3px solid #6d7b72;border-radius:12px;padding:14px;font-size:24px;line-height:2.1;box-shadow:inset 0 0 0 6px #e3e9e5}
.tok{display:inline-block;border:0;background:transparent;font-size:24px;font-weight:700;padding:0 4px;border-radius:6px}
.tok:hover{background:#e3ebe6}
.tok.pick{outline:3px solid var(--orange);background:var(--orange-soft)}
.tok.fixd{background:var(--ok-soft);color:var(--ok);font-weight:900}
.tok.wob{animation:wob .45s;background:#fde3d4}
.punct{margin-left:-6px}
.fixopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ---------- write ---------- */
.frame{font-weight:800;color:var(--teal);margin:4px 0}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.bank button{border:2px solid var(--line);border-radius:8px;background:#fff7d1;padding:3px 10px;font-weight:800;font-size:16px}
textarea{width:100%;min-height:70px;border:2px solid var(--line);border-radius:10px;padding:10px;font-size:19px;resize:none;overflow:hidden;line-height:1.5}
.wc{font-size:14px;color:var(--muted)}
.wc.ok{color:var(--ok);font-weight:800}

/* ---------- footer, popup, gate ---------- */
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.foot .left{font-weight:800;color:var(--muted)}
.pop{position:fixed;z-index:60;max-width:330px;background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:none}
.pop.show{display:block}
.pop .pw{font-size:20px;font-weight:900}
.pop .pt{font-size:19px;margin-top:2px}
.pop .ps{font-size:15px;color:var(--muted);margin-top:6px;border-top:1px solid #d5dbe0;padding-top:6px}
.pop .px{position:absolute;top:4px;right:6px;border:0;background:none;font-size:18px}
.pop .pbtn{margin-top:6px;font-size:14px;padding:4px 10px}
.gate{position:fixed;inset:0;z-index:100;background:#17222b;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.gbox{background:#fff;border:3px solid var(--orange);border-radius:16px;max-width:460px;width:100%;padding:20px 22px;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
.gbox h2{margin:0 0 4px;font-size:26px;font-weight:900}
.gbox label{display:block;font-weight:800;margin:10px 0 3px;font-size:16px}
.gbox input,.gbox select{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 10px;font-size:17px;background:#fff}
.gbox .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gerr{color:#a8461a;font-weight:800;min-height:1.4em;margin-top:6px}
.gbox .gpic{float:right;width:120px;margin:0 0 6px 10px}
.fw{position:fixed;inset:0;pointer-events:none;z-index:90}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17222b;color:#fff;padding:12px 18px;border-radius:12px;border:2px solid var(--gold);font-weight:800;z-index:95;display:none}
.toast.show{display:block}
.lock{border:2px solid var(--line);border-radius:12px;background:#fff7ef;padding:14px;font-weight:800}
.done-banner{border:3px solid var(--ok);background:var(--ok-soft);border-radius:14px;padding:14px 16px;font-weight:800;font-size:19px}
@media (max-width:640px){
  body{font-size:17px}
  .para{font-size:19px;padding-left:46px}
  .pic-r,.para .pr{width:42%}
  .tt{grid-template-columns:1fr}
  .faces{grid-template-columns:repeat(2,1fr)}
  .doors{grid-template-columns:1fr}
  .plate{min-width:58px}.plate .n{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gbox" id="gateForm" autocomplete="on">
    <div class="gpic" id="gatePic"></div>
    <h2>Brothers in Arms</h2>
    <p class="dir" data-dir="Sign in to start. Your work saves by itself."><span class="en">Sign in to start. Your work saves by itself.</span><span class="tr"></span></p>
    <div class="row">
      <div><label for="gFirst">First name</label><input id="gFirst" required></div>
      <div><label for="gLast">Last name</label><input id="gLast" required></div>
    </div>
    <label for="gEmail">School email</label>
    <input id="gEmail" type="email" placeholder="name@s.sfusd.edu" required>
    <div class="row">
      <div><label for="gPeriod">Period</label><select id="gPeriod"><option value="">Choose…</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
      <div><label for="gLang">My language</label><select id="gLang"><option value="">Choose…</option></select></div>
    </div>
    <div class="gerr" id="gErr"></div>
    <button class="btn go big" type="submit" style="width:100%;margin-top:6px">Start reading</button>
  </form>
</div>

<div class="top">
  <h1>Brothers in Arms</h1>
  <div class="lvl" id="lvl"><button type="button" data-l="A">Easier</button><button type="button" data-l="B">Harder</button></div>
  <select id="lang" aria-label="My language"></select>
  <span class="sp"></span>
  <span class="saved" id="saved"></span>
  <span class="who" id="who"></span>
</div>

<div class="street">
  <div class="plates" id="plates"></div>
  <div class="bar"><i id="barI"></i></div>
  <div class="barlbl" id="barL"></div>
</div>

<main class="wrap">
  <div class="steps" id="steps"></div>
  <div id="screen"></div>
</main>

<div class="pop" id="pop" translate="no"><button class="px" type="button" aria-label="Close">×</button><div class="pw" id="popW"></div><div class="pt" id="popT"></div><div class="ps" id="popS"></div></div>
<canvas class="fw" id="fw"></canvas>
<div class="toast" id="toast"></div>
<script src="../track.js"></script>
<script src="/readings/speaking/speak-core.js"></script>
<script>
/* =====================================================================
   DATA — Brothers in Arms (ELD 101 read-aloud, early emerging / SIFE)
   Level A = the colleague's text (mom/dad → mother/father, the ELD 101 rule).
   Level B = the same events with more detail, for high beginners.
   [[phrase]] marks a key word: dotted orange, tap-to-translate with its meaning.
   Never renumber an id: student work is keyed on them.
   ===================================================================== */
var GUIDE_KEY='brothers-in-arms';
var CH=[
/* ---------------------------------------------------------- 1 */
{id:1,title:'Martin and Huero',img:['ch1'],panel:'ch1',lion:{l:'91%',t:'8%'},
 pred:{A:'Look at the picture. Who is this story about?',B:'Look at the picture. Who do you think this story is about?',o:['two brothers','a teacher and her class','a soccer team','a girl and her dog']},
 paras:{
  A:[{t:'My name is Martin Luna. I am 16 years old. I [[live with]] my mother and my [[brother]] Huero. My father does not live with us.',pic:'livewith'},
     {t:'My mother works a lot. I [[take care of]] my brother. My brother Huero is eight years old. I love Huero, and Huero loves me.',pic:'takecare'},
     {t:'My [[friends]] are named Frankie, Chago, and Jesus. Chago and Jesus are 16 years old. Frankie is 19 years old.',pic:'friends'},
     {t:'Frankie [[fights]] a lot. But I like Frankie.',pic:'fights'}],
  B:[{t:'My name is Martin Luna, and I am 16 years old. I [[live with]] my mother and my little [[brother]], Huero, in a small house. My father does not live with us.',pic:'livewith'},
     {t:'My mother works a lot, so I [[take care of]] my brother after school. Huero is eight years old. I love Huero, and Huero loves me. He follows me everywhere.',pic:'takecare'},
     {t:'My best [[friends]] are Frankie, Chago, and Jesus. Chago and Jesus are 16, like me. Frankie is older. He is 19 years old.',pic:'friends'},

/* ---------- props ---------- */
function sky(w,h,top,bot){var id='sk'+Math.round(Math.random()*1e6);return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+top+'"/><stop offset="1" stop-color="'+bot+'"/></linearGradient></defs><rect width="'+w+'" height="'+h+'" fill="url(#'+id+')"/>';}
function cloud(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')" fill="#fff" opacity=".9"><ellipse cx="0" cy="0" rx="18" ry="9"/><ellipse cx="14" cy="-5" rx="13" ry="10"/><ellipse cx="-12" cy="-3" rx="11" ry="8"/></g>';}
function house(x,y,w,h,wall,roof,door){
  var g='<g transform="translate('+x+','+y+')">';
  g+='<rect x="0" y="'+(-h)+'" width="'+w+'" height="'+h+'" fill="'+wall+'" stroke="'+INK+'" stroke-width="1.2"/>';
  for(var i=1;i<h/8;i++) g+='<line x1="0" y1="'+(-h+i*8)+'" x2="'+w+'" y2="'+(-h+i*8)+'" stroke="rgba(0,0,0,.07)"/>';
  g+='<rect x="'+(w*.62)+'" y="'+(-h)+'" width="'+(w*.38)+'" height="'+h+'" fill="rgba(0,0,0,.08)"/>';
  g+='<path d="M-6,'+(-h)+' L'+(w/2)+','+(-h-h*.45)+' L'+(w+6)+','+(-h)+' Z" fill="'+roof+'" stroke="'+INK+'" stroke-width="1.2"/>';
  g+='<path d="M'+(w/2)+','+(-h-h*.45)+' L'+(w+6)+','+(-h)+' L'+(w/2)+','+(-h)+'Z" fill="rgba(0,0,0,.15)"/>';
  g+='<rect x="'+(w*.4)+'" y="'+(-h*.55)+'" width="'+(w*.2)+'" height="'+(h*.55)+'" fill="'+(door||'#6b4228')+'" stroke="'+INK+'"/><circle cx="'+(w*.56)+'" cy="'+(-h*.28)+'" r="1.4" fill="#e8c35a"/>';
  g+='<rect x="'+(w*.1)+'" y="'+(-h*.75)+'" width="'+(w*.2)+'" height="'+(h*.25)+'" fill="#bfe0f2" stroke="'+INK+'"/><line x1="'+(w*.2)+'" y1="'+(-h*.75)+'" x2="'+(w*.2)+'" y2="'+(-h*.5)+'" stroke="'+INK+'" stroke-width=".7"/>';
  g+='<rect x="'+(w*.7)+'" y="'+(-h*.75)+'" width="'+(w*.2)+'" height="'+(h*.25)+'" fill="#bfe0f2" stroke="'+INK+'"/><line x1="'+(w*.8)+'" y1="'+(-h*.75)+'" x2="'+(w*.8)+'" y2="'+(-h*.5)+'" stroke="'+INK+'" stroke-width=".7"/>';
  g+='<rect x="'+(w*.34)+'" y="-3" width="'+(w*.32)+'" height="3" fill="#9a9086" stroke="'+INK+'" stroke-width=".6"/>';
  return g+'</g>';
}
function bike(x,y,s,c){

   '<g stroke="#9aa5ae" stroke-width=".7"><line x1="-16" y1="-20" x2="-16" y2="0"/><line x1="-26" y1="-10" x2="-6" y2="-10"/><line x1="16" y1="-20" x2="16" y2="0"/><line x1="6" y1="-10" x2="26" y2="-10"/></g>'+
   '<path d="M-16,-10 L-3,-10 L8,-24 L-8,-24 Z M8,-24 L16,-10 M-3,-10 L-8,-26" fill="none" stroke="'+c+'" stroke-width="3" stroke-linejoin="round"/>'+
   '<path d="M8,-24 L10,-31 L15,-32" fill="none" stroke="'+INK+'" stroke-width="2.4" stroke-linecap="round"/><rect x="-13" y="-29" width="10" height="3.4" rx="1.6" fill="'+INK+'"/><circle cx="-3" cy="-10" r="2.4" fill="'+INK+'"/></g>';

  g+='<path d="M-44,-8 L-44,-22 Q-44,-27 -38,-28 L-26,-29 L-14,-42 Q-11,-45 -6,-45 L18,-45 Q23,-45 27,-40 L36,-29 L44,-27 Q48,-26 48,-21 L48,-8 Z" fill="'+c+'" stroke="'+INK+'" stroke-width="1.4"/>';

function tree(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')"><rect x="-4" y="-34" width="8" height="34" fill="#7a5233" stroke="'+INK+'" stroke-width=".8"/><circle cx="0" cy="-48" r="20" fill="#4f8d4a" stroke="'+INK+'" stroke-width=".8"/><circle cx="-12" cy="-40" r="12" fill="#5e9f57"/><circle cx="10" cy="-56" r="10" fill="#6aac62"/><circle cx="8" cy="-38" r="9" fill="#447e40"/></g>';}

function boxes(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')"><rect x="-30" y="-24" width="30" height="24" fill="#c99a62" stroke="'+INK+'"/><path d="M-30,-24 L0,-24 M-15,-24 L-15,-14" stroke="#8a6436" stroke-width="2"/><rect x="2" y="-18" width="24" height="18" fill="#d8ab72" stroke="'+INK+'"/><rect x="-22" y="-44" width="26" height="20" fill="#e0b783" stroke="'+INK+'"/><path d="M-9,-44 L-9,-36" stroke="#8a6436" stroke-width="2"/><text x="-9" y="-29" font-size="5.5" text-anchor="middle" fill="#5a3e1f" font-family="Nunito" font-weight="900">KITCHEN</text></g>';}
function heart(x,y,s,c){return '<path transform="translate('+x+','+y+') scale('+s+')" d="M0,6 C-12,-3 -8,-14 0,-8 C8,-14 12,-3 0,6Z" fill="'+(c||'#e0465a')+'" stroke="'+INK+'" stroke-width=".8"/>';}
function redX(x,y,s){return '<g transform="translate('+x+','+y+') scale('+(s||1)+')"><circle r="15" fill="#fff" stroke="#c0392b" stroke-width="3"/><path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/></g>';}
function bubble(x,y,w,h,txt,jag){
  var g='<g transform="translate('+x+','+y+')">';
  if(jag) g+='<path d="M0,'+(h/2)+' L'+(w*.1)+',0 L'+(w*.25)+','+(h*.15)+' L'+(w*.4)+',-4 L'+(w*.55)+','+(h*.12)+' L'+(w*.72)+',-3 L'+(w*.85)+','+(h*.15)+' L'+w+','+(h*.2)+' L'+(w*.92)+','+(h*.5)+' L'+w+','+(h*.85)+' L'+(w*.7)+','+(h*.85)+' L'+(w*.5)+','+(h+4)+' L'+(w*.3)+','+(h*.88)+' L'+(w*.08)+','+(h+2)+' Z" fill="#fff" stroke="'+INK+'" stroke-width="1.4"/>';
  else g+='<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="9" fill="#fff" stroke="'+INK+'" stroke-width="1.4"/><path d="M'+(w*.2)+','+h+' L'+(w*.16)+','+(h+10)+' L'+(w*.34)+','+h+'" fill="#fff" stroke="'+INK+'" stroke-width="1.4"/><path d="M'+(w*.21)+','+(h-1)+' L'+(w*.33)+','+(h-1)+'" stroke="#fff" stroke-width="2"/>';
  if(txt) g+='<text x="'+(w/2)+'" y="'+(h/2+5)+'" text-anchor="middle" font-size="'+(h*.42)+'" font-weight="900" font-family="Nunito,sans-serif" fill="'+INK+'">'+txt+'</text>';
  return g+'</g>';
}
function grave(x,y,s){return '<g transform="translate('+x+','+y+') scale('+s+')"><path d="M-22,0 L-22,-40 Q-22,-58 0,-58 Q22,-58 22,-40 L22,0Z" fill="#a9b1b8" stroke="'+INK+'" stroke-width="1.3"/><path d="M8,-56 Q22,-52 22,-40 L22,0 L10,0 Z" fill="rgba(0,0,0,.12)"/><text x="0" y="-36" font-size="9" text-anchor="middle" font-family="Nunito" font-weight="900" fill="#4a535b">HUERO</text><text x="0" y="-25" font-size="6" text-anchor="middle" font-family="Nunito" font-weight="700" fill="#4a535b">LUNA</text><path d="M-6,-16 L6,-16" stroke="#6d767e" stroke-width="1.4"/><path d="M-12,-8 q4,-3 8,0" stroke="#7a8288" fill="none"/><g transform="translate(-26,0)"><path d="M0,0 L0,-14 M-4,0 L-6,-12 M4,0 L5,-11" stroke="#4f8d4a" stroke-width="1.6"/><circle cx="0" cy="-15" r="3.4" fill="#e2672a"/><circle cx="-6" cy="-13" r="3" fill="#f2c14e"/><circle cx="5" cy="-12" r="3" fill="#e0465a"/></g><g transform="translate(26,0)"><path d="M0,0 L0,-12 M-3,0 L-5,-10" stroke="#4f8d4a" stroke-width="1.6"/><circle cx="0" cy="-13" r="3.2" fill="#fff" stroke="#ddd"/><circle cx="-5" cy="-11" r="3" fill="#f2c14e"/></g></g>';}
function notebook(x,y,s,txt){return '<g transform="translate('+x+','+y+') scale('+s+')"><rect x="-30" y="-22" width="60" height="44" rx="3" fill="#fff" stroke="'+INK+'" stroke-width="1.3"/><line x1="0" y1="-22" x2="0" y2="22" stroke="'+INK+'"/><g stroke="#9fc3e6" stroke-width=".8"><line x1="-26" y1="-10" x2="-4" y2="-10"/><line x1="-26" y1="-2" x2="-4" y2="-2"/><line x1="-26" y1="6" x2="-4" y2="6"/><line x1="-26" y1="14" x2="-4" y2="14"/><line x1="4" y1="-10" x2="26" y2="-10"/><line x1="4" y1="-2" x2="26" y2="-2"/><line x1="4" y1="6" x2="26" y2="6"/></g><text x="-15" y="-13" text-anchor="middle" font-size="6.5" font-weight="900" fill="#2f6db5" font-family="Nunito">'+(txt||'My Hero')+'</text><path d="M-25,-4 q4,-3 8,0 t8,0 M-25,4 q4,-3 8,0 t8,0 M6,-4 q4,-3 8,0 t8,0" stroke="#555" fill="none" stroke-width=".8"/><g transform="translate(24,10) rotate(35)"><rect x="-2.4" y="-22" width="4.8" height="20" fill="#f2c14e" stroke="'+INK+'" stroke-width=".7"/><path d="M-2.4,-2 L0,4 L2.4,-2Z" fill="#e8c9a0" stroke="'+INK+'" stroke-width=".6"/><rect x="-2.4" y="-25" width="4.8" height="3" fill="#e0809a"/></g></g>';}
function lion(){return '<svg viewBox="0 0 40 40"><g><circle cx="20" cy="20" r="17" fill="#c9861f"/><g fill="#b2701a">'+[0,40,80,120,160,200,240,280,320].map(function(a){var r=a*Math.PI/180;return '<circle cx="'+f(20+15*Math.cos(r))+'" cy="'+f(20+15*Math.sin(r))+'" r="5"/>';}).join('')+'</g><circle cx="20" cy="21" r="10.5" fill="#f2c14e" stroke="#7a4d12" stroke-width="1"/><circle cx="16" cy="19" r="1.5" fill="#222"/><circle cx="24" cy="19" r="1.5" fill="#222"/><path d="M18,24 L22,24 L20,26.4Z" fill="#6b3a1e"/><path d="M20,26.4 Q18,28.4 16.4,27.4 M20,26.4 Q22,28.4 23.6,27.4" stroke="#6b3a1e" fill="none" stroke-width=".9"/><circle cx="12.5" cy="12.5" r="2.6" fill="#f2c14e" stroke="#7a4d12" stroke-width=".8"/><circle cx="27.5" cy="12.5" r="2.6" fill="#f2c14e" stroke="#7a4d12" stroke-width=".8"/></g></svg>';}
function wrap(w,h,inner,label){return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+(label||'picture')+'">'+inner+'</svg>';}
function ground(w,h,y,c){return '<rect x="0" y="'+y+'" width="'+w+'" height="'+(h-y)+'" fill="'+c+'"/>';}
function wall(w,h,c){var g='<rect width="'+w+'" height="'+h+'" fill="'+c+'"/>';return g;}
function floor(w,h,y){var g='<rect x="0" y="'+y+'" width="'+w+'" height="'+(h-y)+'" fill="#c9a77a"/>';for(var i=0;i<w;i+=26)g+='<line x1="'+i+'" y1="'+y+'" x2="'+(i-14)+'" y2="'+h+'" stroke="rgba(0,0,0,.1)"/>';return g;}
function window2(x,y,w,h){return '<g><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#bfe3f5" stroke="'+INK+'" stroke-width="1.4"/><line x1="'+(x+w/2)+'" y1="'+y+'" x2="'+(x+w/2)+'" y2="'+(y+h)+'" stroke="'+INK+'"/><line x1="'+x+'" y1="'+(y+h/2)+'" x2="'+(x+w)+'" y2="'+(y+h/2)+'" stroke="'+INK+'"/><path d="M'+(x+4)+','+(y+h-6)+' L'+(x+w/2-4)+','+(y+6)+'" stroke="#fff" stroke-width="2" opacity=".7"/></g>';}
function board(x,y,w,h,txt){return '<g><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#2f5d48" stroke="#7a5233" stroke-width="4"/><text x="'+(x+w/2)+'" y="'+(y+h/2+5)+'" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="13" fill="#e8f0ea">'+(txt||'')+'</text><rect x="'+(x+w-26)+'" y="'+(y+h-2)+'" width="20" height="4" fill="#ddd"/></g>';}

/* ---------------- answer order: shuffled once, stored, no 4-in-a-row ---------------- */
function ensureOrders(){
  var runs={};
  function put(key,n,correct,grp){var run=runs[grp||'x']=runs[grp||'x']||[];
    if(work.ord[key]&&work.ord[key].length===n){ if(correct!=null) run.push(work.ord[key].indexOf(correct)); return; }
    var o, tries=0;
    do{ o=shuffle(Array.from({length:n},function(_,i){return i;})); tries++; }
    while(correct!=null&&run.length>=3&&tries<30&&run.slice(-3).every(function(p){return p===o.indexOf(correct);}));
    work.ord[key]=o; if(correct!=null) run.push(o.indexOf(correct)); dirty=true;
  }
  CH.forEach(function(c){
    put('pred'+c.id,c.pred.o.length,null);
    c.mc.forEach(function(q){put(q.id,q.o.length,0,'mc');});
    var p=c.play;
    if(p.type==='match'||p.type==='pairs'){put('p'+c.id+'L',p.items.length,null);put('p'+c.id+'R',p.items.length,null);}
    if(p.type==='order')put('p'+c.id+'pool',p.items.length,null);
    if(p.type==='faces')p.items.forEach(function(it){put('p'+c.id+':'+it.id,p.faces.length,p.faces.indexOf(it.a),'play');});
    if(p.type==='who')p.items.forEach(function(it){put('p'+c.id+':'+it.id,p.people.length,p.people.indexOf(it.a),'play');});
    if(p.type==='doors')p.items.forEach(function(it){put('p'+c.id+':'+it.id,2,0,'play');});
    if(p.type==='cloze')put('p'+c.id+'bank',clozeWords(p).length,null);
    c.fix.items.forEach(function(it){
      if(c.fix.type==='choose')put('x'+c.id+':'+it.id,it.o.length,0,'fix');
      else Object.keys(it.fx).forEach(function(ix){put('x'+c.id+':'+it.id+':'+ix,fixOpts(it,ix).length,0,'fix');});
    });
  });
  put('aOrder',AFTER.order.length,null); put('aPL',AFTER.people.length,null); put('aPR',AFTER.people.length,null);
}

var SAYAS={'I':'eye','Huero':'Wero','Huero’s':'Weros','Jesus':'Hey-soos','Chago':'Chaw-go','Chago’s':'Chaw-gos','Mitchell':'Mitchell','P.E.':'P E','___':'blank','Thi':'Tee','Bui':'Boo-ee','Bui’s':'Boo-ees'};
function sayForm(tok){var core=tok.replace(/^[“"(]+|[”"),.!?:;]+$/g,'');var rep=SAYAS[core];return rep?tok.replace(core,rep):tok;}
function voice(){var vs=speechSynthesis.getVoices().filter(function(v){return /^en(-|_)US/i.test(v.lang);});return vs.filter(function(v){return /Google|Samantha|Aria|Jenny/i.test(v.name);})[0]||vs[0]||null;}
var reading=null;
var GAP_SENT=420, GAP_PARA=750; /* pauses after a sentence / after a paragraph, in ms */
var speakTok=0;
function speak(text,rate,onEnd){
  if(!('speechSynthesis' in window))return;stopRead();
  var my=++speakTok;
  var parts=String(text).split(/(?<=[.!?][”"’)]?)\s+/).filter(function(x){return x.trim();});
  (function next(i){
    if(my!==speakTok)return;
    if(i>=parts.length){if(onEnd)onEnd();return;}
    var u=new SpeechSynthesisUtterance(parts[i].split(/\s+/).map(sayForm).join(' '));u.lang='en-US';u.rate=rate||0.9;var v=voice();if(v)u.voice=v;
    u.onend=u.onerror=function(){if(my!==speakTok)return;setTimeout(function(){next(i+1);},i<parts.length-1?GAP_SENT:0);};
    speechSynthesis.speak(u);
  })(0);
}
function stopRead(){speakTok++;if(reading){reading.stop=true;clearTimeout(reading.timer);reading=null;}try{speechSynthesis.cancel();}catch(e){}document.querySelectorAll('.w.now').forEach(function(x){x.classList.remove('now');});var b=$('readBtn');if(b){b.classList.remove('on');b.textContent='🔊 Read it to me';}}
function readParas(from,only,rate){
  stopRead();if(!('speechSynthesis' in window))return;
  var paras=Array.prototype.slice.call(document.querySelectorAll('.para'));
  var R=reading={stop:false};var b=$('readBtn');if(b&&!only){b.classList.add('on');b.textContent='⏹ Stop';}
  /* queue of sentences: each is the word spans that share one data-s, plus the pause after it */
  var Q=[];
  paras.forEach(function(p,pi){
    if(pi<(from||0)||(only&&pi!==from))return;
    var groups=[],last=null;
    p.querySelectorAll('.w').forEach(function(s){if(s.dataset.s!==last){groups.push([]);last=s.dataset.s;}groups[groups.length-1].push(s);});
    groups.forEach(function(g,gi){Q.push({p:p,spans:g,gap:gi<groups.length-1?GAP_SENT:GAP_PARA});});
  });
  function one(k){
    if(R.stop)return;
    if(k>=Q.length){stopRead();return;}
    var q=Q[k],spans=q.spans,txt='',offs=[];
    if(k===0||Q[k-1].p!==q.p)q.p.scrollIntoView({block:'nearest',behavior:'smooth'});
    spans.forEach(function(s){offs.push(txt.length);txt+=sayForm(s.textContent)+' ';});
    var u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=rate||0.9;var v=voice();if(v)u.voice=v;
    var got=false,cur=-1;
    function hl(i){if(i===cur)return;if(spans[cur])spans[cur].classList.remove('now');cur=i;if(spans[i])spans[i].classList.add('now');}
    u.onboundary=function(e){if(e.name&&e.name!=='word')return;got=true;var i=0;while(i+1<offs.length&&offs[i+1]<=e.charIndex)i++;hl(i);};
    u.onend=u.onerror=function(){if(R.stop)return;clearTimeout(R.timer);hl(-1);R.timer=setTimeout(function(){one(k+1);},q.gap);};

    var start=Date.now(),per=(60000/(165*(rate||0.9)));
    (function tick(){if(R.stop||got)return;var el=Date.now()-start,acc=0,i=0;for(;i<spans.length;i++){acc+=per*(0.6+spans[i].textContent.length/7);if(acc>el)break;}hl(Math.min(i,spans.length-1));R.timer=setTimeout(tick,120);})();
  }
  one(0);
}

function tokenize(text){
  var out=[],re=/\[\[([^\]]+)\]\]|(\S+)/g,m,s=0;
  var raw=text.replace(/\[\[([^\]]+)\]\](\S*)/g,function(_,a,b){return '[['+a+']]'+(b?'\u0001'+b:'');});
  while((m=re.exec(raw))){
    if(m[1]){var parts=m[1].split(' ');parts.forEach(function(p,i){out.push({t:p,k:m[1],s:s});});}
    else{var t=m[2];if(t.charAt(0)==='\u0001'){out[out.length-1].t+=t.slice(1);}else out.push({t:t,s:s});}
    var last=out[out.length-1];if(last&&/[.!?][”"]?$/.test(last.t)&&!/^(Mr|Mrs|Ms|P\.E)\.$/.test(last.t))s++;
  }
  return out;
}

    toks.forEach(function(t,ix){var key='x'+c.id+':'+it.id+':'+ix,isT=it.fx[ix]!==undefined,ok=work.fix[key]===true,show=ok?it.fx[ix][0]:t,pun=/^[.,]$/.test(show);
      h+='<button type="button" class="tok'+(ok?' fixd':'')+(pun?' punct':'')+(fixSel===key?' pick':'')+'" data-fix="'+it.id+'" data-ix="'+ix+'"'+(ok?' disabled':'')+'>'+esc(show)+'</button>';});
    h+='</div>';
    if(fixSel&&fixSel.indexOf('x'+c.id+':'+it.id+':')===0){var ix=+fixSel.split(':')[2],st=work.fix[fixSel+':f']||{f:[]};
      h+='<div class="fixopts">'+ordered(fixSel,fixOpts(it,ix)).map(function(x){return '<button type="button" class="opt'+(st.f.indexOf(x.i)>=0?' fade':'')+'" data-fo="'+x.i+'"'+(st.f.indexOf(x.i)>=0?' disabled':'')+'>'+esc(x.v)+'</button>';}).join('')+'</div>';}
    if(work.fix['_m'+c.id+it.id])h+=quip(work.fix['_m'+c.id+it.id]);
    h+=(allDone?'<div class="chk" style="margin-top:6px">✓ Fixed! <button class="btn pbtn" type="button" data-say="'+esc(toks.map(function(t,ix){return it.fx[ix]?it.fx[ix][0]:t;}).join(' ').replace(/ ([.,])/g,'$1'))+'">🔊 Hear it</button></div>':'')+'</div>';
  });
  return h+'</div>';
}
function wireFix(c){
  if(c.fix.type==='choose'){wireFlatChoices(c);return;}
  var root=$('screen');
  root.querySelectorAll('[data-fix]').forEach(function(b){b.onclick=function(){
    var it=c.fix.items.filter(function(x){return x.id===b.dataset.fix;})[0],ix=+b.dataset.ix,key='x'+c.id+':'+it.id+':'+ix;
    if(it.fx[ix]===undefined){work.miss['x'+c.id+':'+it.id]=(work.miss['x'+c.id+':'+it.id]||0)+1;work.fix['_m'+c.id+it.id]='That word is OK. Look for a word that needs a fix.';mark();b.classList.remove('wob');void b.offsetWidth;b.classList.add('wob');setTimeout(function(){renderScreen();translateDirs();},450);return;}
    fixSel=key;work.fix['_m'+c.id+it.id]='';renderScreen();translateDirs();};});
  root.querySelectorAll('[data-fo]').forEach(function(b){b.onclick=function(){
    var parts=fixSel.split(':'),it=c.fix.items.filter(function(x){return x.id===parts[1];})[0],i=+b.dataset.fo;
    if(i===0){work.fix[fixSel]=true;fixSel=null;work.fix['_m'+c.id+it.id]='';fireSmall(b);}
    else{var st=work.fix[fixSel+':f']||{f:[]};st.f.push(i);work.fix[fixSel+':f']=st;work.miss[fixSel]=(work.miss[fixSel]||0)+1;work.fix['_m'+c.id+it.id]=FIXHINT[c.fix.kind]||'Try another one.';}
    mark();renderScreen();renderPlates();renderSteps();translateDirs();};});
}

/* ---------- WRITE ---------- */
function writeBox(w,lv,label){
  var q=lv==='B'?w.B:w.A,val=work.wr[w.id];
  if(val==null&&lv==='A')val=w.frameA;
  var ok=wrOk(w.id,w.min),n=(work.wr[w.id]||'').trim()?(work.wr[w.id]||'').trim().split(/\s+/).length:0;
  var h='<div class="q'+(ok?' done':'')+'" translate="no"><div class="qt">'+(label?'<span class="tag">'+label+'</span>':'')+esc(q)+' <button class="btn pbtn" type="button" data-say="'+esc(q)+'">🔊</button> <button class="btn pbtn" type="button" data-tr="'+esc(q)+'">🌐</button></div>';
  if(lv==='A'){h+='<div class="frame">Fill the blanks. Tap a word, or type.</div><div class="bank">'+w.bankA.map(function(b){return '<button type="button" data-bank="'+esc(w.id)+'" data-word="'+esc(b)+'">'+esc(b)+'</button>';}).join('')+'</div>';}
  else h+='<div class="frame">Start like this: '+esc(w.frameB)+'</div>';
  h+='<textarea data-wr="'+esc(w.id)+'" data-min="'+w.min+'" rows="2" spellcheck="true">'+esc(val||'')+'</textarea>';
  h+='<div class="foot"><span class="wc'+(ok?' ok':'')+'" data-wc="'+esc(w.id)+'">'+(ok?'✓ ':'')+n+' words'+(ok?'':' · write '+w.min+' or more'+(/___/.test(val||'')?', fill every blank':''))+'</span><button class="btn pbtn" type="button" data-hear="'+esc(w.id)+'">🔊 Hear my answer</button></div></div>';
  return h;
}
function writeHtml(c){
  var h='<div class="box"><h2>Write</h2>'+dirHtml(work.lv==='A'?'Read the question. Finish the sentence. Use the word bank.':'Read the question. Answer in full sentences. Use the start if you need it.')+'<div class="pic-r">'+ART.W.homework()+'</div><div style="clear:both"></div>';
  c.write.forEach(function(w){h+=writeBox(w,work.lv);});
  return h+'</div>';
}
function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px';}
function wireWrite(){
  document.querySelectorAll('textarea[data-wr]').forEach(function(t){grow(t);t.oninput=function(){work.wr[t.dataset.wr]=t.value;grow(t);mark();updWc(t);};});
  document.querySelectorAll('[data-bank]').forEach(function(b){b.onclick=function(){var t=document.querySelector('textarea[data-wr="'+b.dataset.bank+'"]');var v=t.value,w=b.dataset.word;
    if(/___/.test(v))v=v.replace('___',w);else{var s=t.selectionStart||v.length;v=v.slice(0,s).replace(/\s*$/,' ')+w+' '+v.slice(s).replace(/^\s*/,'');}
    t.value=v;work.wr[t.dataset.wr]=v;grow(t);mark();updWc(t);speak(w,0.85);};});
  document.querySelectorAll('[data-hear]').forEach(function(b){b.onclick=function(){var v=(work.wr[b.dataset.hear]||'').trim();if(v)speak(v.replace(/___/g,'blank'),0.85);};});
}
function updWc(t){var id=t.dataset.wr,min=+t.dataset.min,v=t.value.trim(),n=v?v.split(/\s+/).length:0,ok=wrOk(id,min),el=document.querySelector('[data-wc="'+id+'"]');
  if(el){el.className='wc'+(ok?' ok':'');el.textContent=(ok?'✓ ':'')+n+' words'+(ok?'':' · write '+min+' or more'+(/___/.test(v)?', fill every blank':''));}
  var q=t.closest('.q');if(q)q.classList.toggle('done',ok);renderPlates();renderSteps();}

/* ---------- SAY IT ---------- */
window.SAY_CTL=null;
function sayHtml(c){return '<div class="box"><h2>Say it</h2>'+dirHtml('Listen. Then tap the red button and say it. Tap again to stop.')+'<div class="pic-r">'+ART.W.readto()+'</div><p translate="no" style="font-weight:800">Say three sentences from Chapter '+c.id+', then the key words.</p><div style="clear:both"></div><div id="sayMount" style="--say-accent:#1f4f8f;--say-soft:#e4ecf7;--say-radius:12px"></div></div>';}
function wireSay(c){
  function go(){try{SAY_CTL=Say.mount($('sayMount'),{decks:[{k:'s',name:'Sentences',e:'🗣',items:c.say},{k:'w',name:'Words',e:'🔤',items:c.words.map(function(w){return w.w;})}],setName:'brothers-ch'+c.id,
    student:function(){return me?{email:me.email,name:me.first+' '+me.last,period:me.period}:null;},lang:function(){return lang||'none';},
    translate:function(text,anchor){var r=anchor.getBoundingClientRect();showPop(r.left+r.width/2,r.top,text,{});}});}catch(e){$('sayMount').innerHTML='<p>The recorder did not load. Reload the page.</p>';}}
  if(window.Say&&Say.mount)go();else{var s=document.createElement('script');s.src='/readings/say/say.js';s.onload=go;s.onerror=function(){$('sayMount').innerHTML='<p>The recorder did not load. Reload the page.</p>';};document.head.appendChild(s);}
}

/* ---------- AFTER THE BOOK ---------- */
function afterHtml(){
  var h='<div class="box"><h2>After the book</h2>'+dirHtml('You read the whole book! Put the story in order, match the people, and write about your hero.')+'<div class="pic-r">'+ART.W.walkaway()+'</div>';

  ordered('aOrder',AFTER.order).forEach(function(x){if(work.play['ao'+x.i]===true)return;h+='<button type="button" class="chip'+(sel==='a'+x.i?' sel':'')+'" data-ao="'+x.i+'">'+esc(x.v)+'</button>';});
  h+='</div><div class="slots">';AFTER.order.forEach(function(v,i){var ok=work.play['ao'+i]===true;h+='<button type="button" class="slot'+(ok?' ok':'')+'" data-as="'+i+'"><span class="num">'+(i+1)+'</span>'+(ok?esc(v)+' <span class="chk">✓</span>':'')+'</button>';});
  h+='</div></div>'+(work.play.a_m?quip(work.play.a_m):'')+'</div>';
  h+='<div class="box"><h3>2. Who is it?</h3>'+dirHtml('Tap a person. Then tap the sentence about that person.')+'<div class="tt" translate="no"><div class="col">';
  ordered('aPL',AFTER.people).forEach(function(x){var ok=work.play['ap:'+x.v.id]===true;h+='<button type="button" class="chip'+(ok?' ok':'')+(sel==='p'+x.v.id?' sel':'')+'" data-apl="'+x.v.id+'"'+(ok?' disabled':'')+'>'+esc(x.v.n)+(ok?' <span class="chk">✓</span>':'')+'</button>';});
  h+='</div><div class="col">';ordered('aPR',AFTER.people).forEach(function(x){var ok=work.play['ap:'+x.v.id]===true;h+='<button type="button" class="chip'+(ok?' ok used':'')+'" data-apr="'+x.v.id+'"'+(ok?' disabled':'')+'>'+esc(x.v.d)+'</button>';});
  h+='</div></div>'+(work.play.ap_m?quip(work.play.ap_m):'')+'</div>';
  h+='<div class="box"><h3>Meet the artist</h3>'+dirHtml('Read about the artist. Tap “Read it to me” or tap any word.')+'<div class="pic-r">'+ART.W.artist()+'</div><div class="readctl"><button class="btn or" type="button" id="readArtist">🔊 Read it to me</button></div><div translate="no">'+ARTIST.text.map(function(t,i){return '<div class="para"><button class="pn" type="button" data-pn="'+i+'">'+(i+1)+'</button>'+paraHtml(t)+'</div>';}).join('')+'</div><div class="q" translate="no"><div class="qt"><span class="tag">CONNECT</span>'+esc(ARTIST.talk)+' <button class="btn pbtn" type="button" data-say="'+esc(ARTIST.talk)+'">🔊</button> <button class="btn pbtn" type="button" data-tr="'+esc(ARTIST.talk)+'">🌐</button></div></div></div>';
  h+='<div class="box"><h3>3. My hero</h3>'+dirHtml('Write about your hero. Mr. Toby may show the class hero wall on the board, with first names only.')+'<div class="pic-r">'+ART.W.hero()+'</div><div style="clear:both"></div>'+writeBox(AFTER.hero,work.lv,'CONNECT')+'</div>';
  h+=afterDone()?'<div class="done-banner">🎉 You finished Brothers in Arms! Go to Google Classroom for your next activity, or ask Mr. Toby.</div>':'<div class="box"><div class="foot"><span class="left">Answer '+(afterItems().length-cnt(afterItems()))+' more to finish the book.</span></div></div>';
  return h;
}
function wireAfter(){
  if(locked('after'))return;
  var root=$('screen');function rr(){renderScreen();renderPlates();translateDirs();}
  function wob(el){el.classList.remove('wob');void el.offsetWidth;el.classList.add('wob');}
  root.querySelectorAll('[data-ao]').forEach(function(b){b.onclick=function(){sel='a'+b.dataset.ao;work.play.a_m='';rr();};});
  root.querySelectorAll('[data-as]').forEach(function(s){s.onclick=function(){if(typeof sel!=='string'||sel.charAt(0)!=='a'){wob(s);return;}var i=+s.dataset.as,want=+sel.slice(1);if(work.play['ao'+i]===true)return;
    if(i===want){work.play['ao'+i]=true;sel=null;mark();rr();}else{work.miss['ao'+want]=(work.miss['ao'+want]||0)+1;work.play.a_m='Think about the chapters: 1 is the start, 8 is the end.';mark();wob(s);setTimeout(rr,420);}};});
  root.querySelectorAll('[data-apl]').forEach(function(b){b.onclick=function(){sel='p'+b.dataset.apl;work.play.ap_m='';rr();};});
  root.querySelectorAll('[data-apr]').forEach(function(b){b.onclick=function(){if(typeof sel!=='string'||sel.charAt(0)!=='p'){wob(b);return;}var want=sel.slice(1);
    if(b.dataset.apr===want){work.play['ap:'+want]=true;sel=null;mark();rr();}else{work.miss['ap:'+want]=(work.miss['ap:'+want]||0)+1;work.play.ap_m='Think: how old is the person? What do they do?';mark();wob(b);setTimeout(rr,420);}};});
  wireWrite();
  var ra=$('readArtist');if(ra)ra.onclick=function(){if(reading){stopRead();ra.textContent='🔊 Read it to me';return;}readParas(0,false,0.85);ra.textContent='⏹ Stop';};
  root.querySelectorAll('[data-pn]').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();readParas(+b.dataset.pn,true,0.85);};});
}

/* ---------------- fun ---------------- */
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},3200);}
function fireSmall(b){try{var r=b.getBoundingClientRect();fireworks(r.left+r.width/2,r.top+r.height/2,14);}catch(e){}}
function fireworks(x,y,n){
  var cv=$('fw'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;n=n||90;
  var cols=['#e2672a','#ffd75e','#14706c','#1f4f8f','#e0465a','#1d8448'],ps=[];
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*(n>30?6:3);ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:40+Math.random()*30,c:cols[i%cols.length]});}
  (function step(){ctx.clearRect(0,0,cv.width,cv.height);var alive=0;ps.forEach(function(p){if(p.l<=0)return;alive++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.l--;ctx.globalAlpha=Math.max(0,p.l/60);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);});if(alive)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);})();
}
/* silent browser-translation canary */
setInterval(function(){var c=document.documentElement.className||'';if(/translated-/.test(c)&&!work.bt){work.bt=true;dirty=true;}},3000);
