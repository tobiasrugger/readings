<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arrival &mdash; Final Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1f4d3d;
  --pine-dk:#143528;
  --pine-lt:#e8f0ec;
  --ink:#1b1b1b;
  --rule:#c9ccc8;
  --paper:#ffffff;
  --sepia:#8a6d45;
  --t-asp:#2f6f4f;
  --t-opp:#8c3a2f;
  --t-tra:#1f5f8b;
  --warn:#8a5a1f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);background:#f2f4f2;font-size:17px;line-height:1.65;
}
body.big{font-size:21px}
body.big textarea{min-height:130px}

/* ---------- toolbar ---------- */
#bar{
  position:sticky;top:0;z-index:60;background:var(--pine);color:#fff;
  padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
#bar .brand{font-weight:800;margin-right:6px;font-size:15px}
#bar button,#bar select{
  font-family:inherit;font-size:14px;font-weight:700;
  border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.10);
  color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;
}
#bar button:hover,#bar select:hover{background:rgba(255,255,255,.22)}
#bar select option{color:#111;background:#fff}
#bar .spacer{flex:1}
#who{font-size:13px;font-weight:700;opacity:.9}
#saveNote{font-size:13px;opacity:.85;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.ok{background:#7fe0a8}.dot.wait{background:#ffd36b}.dot.bad{background:#ff8f7a}

/* ---------- chapter tabs ---------- */
#tabs{
  position:sticky;top:45px;z-index:55;background:var(--pine-dk);
  display:flex;gap:2px;overflow-x:auto;padding:0 8px;
  scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
#tabs button{
  font-family:inherit;font-size:14px;font-weight:800;white-space:nowrap;
  background:transparent;color:#b7cdc1;border:0;border-bottom:3px solid transparent;
  padding:9px 13px;cursor:pointer;
}
#tabs button.on{color:#fff;border-bottom-color:#7fe0a8}
#tabs button:hover{color:#fff}

/* ---------- page ---------- */
.sheet{
  max-width:880px;margin:18px auto 70px;background:var(--paper);
  padding:34px 42px 60px;border:1px solid var(--rule);border-radius:4px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
h1.unit{font-size:2.1rem;margin:0;font-weight:800;letter-spacing:-.5px;color:var(--pine-dk)}
.byline{color:#5d6b63;font-weight:700;margin:4px 0 0;font-size:.95rem}
.hr{height:3px;width:70px;background:var(--pine);border-radius:3px;margin:16px 0 26px}

section.pane{display:none}
section.pane.on{display:block}

h2.ch{font-size:1.5rem;margin:0 0 2px;color:var(--pine-dk);font-weight:800}
.chsub{color:#5d6b63;font-weight:700;margin:0 0 22px;font-size:.97rem}

h3.step{
  font-size:1.05rem;margin:32px 0 4px;color:var(--pine-dk);font-weight:800;
  padding-bottom:5px;border-bottom:2px solid var(--pine-lt);
}
h3.step .num{
  display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;
  background:var(--pine);color:#fff;border-radius:50%;font-size:.8rem;margin-right:8px;
}
.how{color:#4a5852;font-size:.94rem;margin:8px 0 12px;font-style:italic}

/* level chips */
.levelbar{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.levelbar span{
  font-size:.78rem;font-weight:800;padding:4px 11px;border-radius:20px;
  border:1.5px solid var(--rule);color:#5d6b63;
}
.levelbar span.on{background:var(--pine);border-color:var(--pine);color:#fff}
.lv{display:none}
.lv.on{display:block}

/* boxes */
.box{
  border:1.5px solid var(--rule);border-left:5px solid var(--pine);
  border-radius:6px;padding:14px 16px;margin:12px 0;background:#fafcfb;
  break-inside:avoid;page-break-inside:avoid;
}
.box.warn{border-left-color:var(--warn);background:#fdf9f2}
.box.note{border-left-color:var(--sepia);background:#fbf8f3}
.box p:first-child{margin-top:0}
.box p:last-child{margin-bottom:0}
textarea{
  width:100%;font-family:inherit;font-size:1rem;line-height:1.6;padding:9px 11px;
  border:1.5px solid var(--rule);border-radius:6px;min-height:78px;resize:vertical;background:#fff;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--pine);outline-offset:1px}
input.line{
  font-family:inherit;font-size:1rem;border:0;border-bottom:2px solid var(--pine);
  background:transparent;padding:2px 4px;min-width:130px;
}
label.q{display:block;font-weight:700;margin:12px 0 5px}

/* caption bank */
ol.caps{list-style:none;counter-reset:cap;padding:0;margin:10px 0}
ol.caps li{
  counter-increment:cap;display:flex;gap:10px;align-items:flex-start;
  padding:7px 9px;border-bottom:1px solid #e6eae7;
}
ol.caps li:nth-child(odd){background:#f7faf8}
ol.caps li::before{
  content:counter(cap);flex:0 0 26px;text-align:center;font-weight:800;
  color:#fff;background:var(--sepia);border-radius:4px;font-size:.82rem;line-height:22px;height:22px;margin-top:3px;
}
ol.caps li .txt{flex:1}
ol.caps li input[type=checkbox]{width:19px;height:19px;accent-color:var(--pine);margin-top:4px;flex:0 0 auto}

/* tables */
table.g{width:100%;border-collapse:collapse;margin:12px 0}
table.g th,table.g td{border:1px solid var(--rule);padding:7px 10px;font-size:.97rem;vertical-align:top}
table.g th{background:var(--pine);color:#fff;font-weight:800;font-size:.88rem;text-align:left}
table.g td.w{font-weight:800;color:var(--pine-dk);width:22%}
table.g td.tr{font-weight:700;width:26%}
table.g td.tr.rtl{direction:rtl;text-align:right}
table.g tr:nth-child(even) td{background:#f7faf8}
table.g tr{break-inside:avoid;page-break-inside:avoid}
table.g td.tfc{width:54px;text-align:center}
table.g td.tfc input{width:19px;height:19px;accent-color:var(--pine)}

/* order + match */
ol.order{list-style:none;padding:0;margin:10px 0;counter-reset:none}
ol.order li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eef1ef}
ol.order li input{
  width:52px;text-align:center;font-family:inherit;font-weight:800;font-size:1rem;
  border:1.5px solid var(--rule);border-radius:6px;padding:6px 4px;
}
ol.order li .ev{flex:1}
select.pick{
  font-family:inherit;font-size:.97rem;font-weight:700;padding:5px 8px;
  border:1.5px solid var(--rule);border-radius:6px;background:#fff;max-width:100%;
}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #eef1ef;flex-wrap:wrap}
.mrow .def{flex:1;min-width:200px}

.mark{font-weight:800;margin-left:8px}
.mark.y{color:#2f6f4f}
.mark.n{color:#a33}
button.check{
  font-family:inherit;font-weight:800;font-size:.92rem;background:var(--pine);color:#fff;
  border:0;border-radius:7px;padding:8px 16px;cursor:pointer;margin-top:10px;
}
button.check:hover{background:var(--pine-dk)}
.score{font-weight:800;margin-left:12px;color:var(--pine-dk)}

/* script */
.script{border:1.5px solid var(--rule);border-radius:6px;padding:4px 0;margin:12px 0;background:#fafcfb}
.script .ln{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid #eef1ef}
.script .ln:last-child{border-bottom:0}
.script .ln .sp{font-weight:800;flex:0 0 30px;color:var(--pine)}
.script .ln.b .sp{color:var(--sepia)}

/* themes */
.themechips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.themechips b{font-size:.85rem;font-weight:800;padding:5px 12px;border-radius:20px;color:#fff}
.themechips b.asp{background:var(--t-asp)}
.themechips b.opp{background:var(--t-opp)}
.themechips b.tra{background:var(--t-tra)}

/* gate */
#gate{
  position:fixed;inset:0;z-index:200;background:rgba(16,28,23,.93);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#gate .card{
  background:#fff;border-radius:12px;padding:28px 26px;max-width:420px;width:100%;
}
#gate h2{margin:0 0 6px;color:var(--pine-dk);font-size:1.35rem}
#gate p{margin:0 0 16px;color:#5d6b63;font-size:.95rem}
#gate input,#gate select{
  width:100%;font-family:inherit;font-size:1rem;padding:10px 12px;margin-bottom:10px;
  border:1.5px solid var(--rule);border-radius:7px;
}
#gate button{
  width:100%;font-family:inherit;font-weight:800;font-size:1rem;background:var(--pine);
  color:#fff;border:0;border-radius:7px;padding:12px;cursor:pointer;
}
#gateErr{color:#a33;font-weight:700;font-size:.9rem;min-height:20px}

footer.pg{max-width:880px;margin:0 auto 60px;text-align:center;color:#5d6b63;font-size:.85rem;font-weight:700}
footer.pg a{color:var(--pine);font-weight:800}

@media (max-width:640px){
  .sheet{padding:22px 18px 44px;margin:10px auto 50px}
  h1.unit{font-size:1.65rem}
  #tabs{top:81px}
}
@media print{
  #bar,#tabs,#gate,button.check,.levelbar{display:none !important}
  body{background:#fff;font-size:12pt}
  .sheet{box-shadow:none;border:0;max-width:100%;padding:0;margin:0}
  section.pane{display:block !important;page-break-before:always}
  section.pane:first-of-type{page-break-before:auto}
  .lv{display:block !important}
  .lv::before{content:attr(data-lvname) ": ";font-weight:800;color:#1f4d3d}
  textarea{min-height:70px}
  .box,table tr,ol.caps li{page-break-inside:avoid}
}

#btn-dir.on,#btn-tap.on{background:#1F4D3D;color:#fff}
.dirtr{display:block;margin-top:4px;color:#2f6f57;font-weight:700}
.dirtr:empty{display:none}
body.tap-on .wt-tap{cursor:pointer;border-bottom:1px dotted #8aa79a}
body.tap-on .wt-tap:hover{background:#eef5f1}
.wt-bub{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:6px;
  background:#1F4D3D;color:#fff;font-size:.85em;font-weight:700}
</style>
</head>
<span id="canary" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden">the quick brown fox jumps over the lazy dog</span>
<body>
<style>

.pcard .ph{background:var(--pine);color:#fff;padding:11px 16px}
.pcard .ph h4{margin:0;font-size:1.08rem;font-weight:800}
.pcard .ph .who{font-size:.82rem;font-weight:700;opacity:.9}
.pcard .pb{padding:14px 16px}
.pcard.alt .ph{background:var(--sepia)}
.model{background:#fbf8f3;border:1.5px dashed var(--sepia);border-radius:6px;padding:13px 15px;margin:10px 0}
.model b.lbl{display:block;color:var(--sepia);font-size:.82rem;margin-bottom:4px}
table.cal th.d{width:78px}
table.rub td{font-size:.9rem}
table.rub th:first-child{width:22%}
ul.tight{margin:8px 0;padding-left:22px}
ul.tight li{margin:4px 0}
</style>

  <span class="brand">The Arrival &mdash; Projects</span>

<script>
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var curLevel = "std";
function ta(id, ph){ return '<textarea data-id="' + id + '" placeholder="' + esc(ph||"") + '"></textarea>'; }
function li(id, ph, w){ return '<input class="line" data-id="' + id + '" placeholder="' + esc(ph||"") + '"' + (w?' style="min-width:'+w+'"':'') + '>'; }
function lvbar(){ return '<div class="levelbar"><span data-lvchip="easy">Easier</span><span data-lvchip="std">Standard</span><span data-lvchip="chal">Challenge</span></div>'; }

/* ---------- rubric builder ---------- */
function rubric(title, rows){
  var h = '<table class="g rub"><tr><th>' + esc(title) + '</th><th>1 &mdash; Starting</th><th>2 &mdash; Growing</th><th>3 &mdash; Got it</th><th>4 &mdash; Strong</th></tr>';
  rows.forEach(function(r){
    h += '<tr><td class="w">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td><td>' + esc(r[4]) + '</td></tr>';
  });
  return h + '</table>';
}

/* ============================================================
   PANE: THE PLAN
   ============================================================ */
function planPane(){
  var cal = [
    ["Day 1","Launch. Look at three student models. Choose your object. Bring it (or a photo, or a drawing) tomorrow."],
    ["Day 2","Object Project: draw the panel. Sepia pencil or pen only, like Shaun Tan. No colour."],
    ["Day 3","Object Project: write the four sentences. Conference with Mr. Toby."],
    ["Day 4","Exhibit label lesson. Read three real museum labels. Write draft 1 of your label."],
    ["Day 5","Choose your second project. Read the handout. Make a plan and a materials list."],
    ["Day 6","Work day 1. Mr. Toby conferences with half the class."],
    ["Day 7","Work day 2. Mr. Toby conferences with the other half."],
    ["Day 8","Peer feedback using the rubric. Revise. Stronger / clearer each time, twice."],
    ["Day 9","Final on-demand write (45 min, no notes). Then mount and label your work."],
    ["Day 10","Museum of Arrival. Families, front office, and two other classes are invited."]
  ];
  var h = '<h2 class="ch">The plan</h2><p class="chsub" translate="yes" data-dir="tendaystwoprojec" data-en="Ten days. Two projects. One exhibition.">Ten days. Two projects. One exhibition.<span class="dirtr"></span></p>';

  h += '<h3 class="step"><span class="num">1</span>What everyone does</h3>';
  h += '<div class="box" translate="no" data-tap="1"><p><b>Everyone</b> makes the <b>Object Project</b>. It is small and it is due first.</p>' +
       '<p><b>Then everyone chooses one more</b> from the five that follow.</p>' +
       '<p><b>All of it goes on the wall</b> at the Museum of Arrival on the last day. That is the real deadline. ' +
       'Real people are coming to look at your work.</p></div>';

  h += '<h3 class="step"><span class="num">2</span>Ten days</h3>';
  h += '<table class="g"><tr><th class="d">Day</th><th>What we do</th></tr>';
  cal.forEach(function(r){ h += '<tr><td class="w">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; });
  h += '</table>';

  h += '<h3 class="step"><span class="num">3</span>Your choice</h3>';
  h += '<p class="how" translate="yes" data-dir="readallfivethend" data-en="Read all five, then decide. Talk to Mr. Toby before you commit.">Read all five, then decide. Talk to Mr. Toby before you commit.<span class="dirtr"></span></p>';
  h += '<label class="q">I am choosing:</label>' +
       '<select class="pick" data-id="pj_choice"><option value="">choose one</option>' +
       '<option>Six-Panel Arrival Story</option><option>Survival Guide to a New Country</option>' +
       '<option>Voice-Over the Silence</option><option>The Untold Chapter</option>' +
       '<option>Someone Else\u2019s Crossing (interview)</option></select>';
  h += '<label class="q">Why did you choose it?</label>' + ta("pj_why","I chose this because ...");
  h += '<label class="q">What will you need? (paper, phone, headphones, help with something)</label>' + ta("pj_needs","");

  h += '<h3 class="step"><span class="num">4</span>A reminder about your own story</h3>';
  h += '<div class="box warn"><p>Every project here can be done about <b>you</b>, about <b>someone in your family</b>, ' +
       'about <b>a character in the book</b>, or about <b>a person you invent</b>. All four get the same grade.</p>' +
       '<p>You never have to put your own life on the wall. If you want to, that is good. If you do not want to, ' +
       'that is also good, and you do not need to give a reason.</p></div>';
  return h;
}

/* ============================================================
   PANE: OBJECT PROJECT
   ============================================================ */
function objectPane(){
  var h = '<h2 class="ch">Project 1 &mdash; The Object</h2>';
  h += '<p class="chsub" translate="yes" data-dir="everyonedoesthis" data-en="Everyone does this one. One drawing, a few sentences, one wall label.">Everyone does this one. One drawing, a few sentences, one wall label.<span class="dirtr"></span></p>';

  h += '<div class="pcard"><div class="ph"><h4>What you make</h4><span class="who">Required &middot; 3 days</span></div><div class="pb">' +
       '<ul class="tight"><li>One drawing of <b>one object</b>, in sepia or pencil, filling half a page.</li>' +
       '<li>A short piece of writing about the object.</li>' +
       '<li>One museum wall label, mounted next to the drawing.</li></ul></div></div>';

  h += '<h3 class="step"><span class="num">1</span>Choose your object</h3>';
  h += '<p class="how">Pick <b>one</b>. Small is better than big. Ordinary is better than expensive.</p>';
  h += '<div class="box" translate="no" data-tap="1"><p>Something you brought with you &middot; something you wish you had brought &middot; ' +
       'something that reminds you of a person &middot; something from your grandmother\u2019s house &middot; ' +
       'the first thing you bought here &middot; a photo &middot; a piece of clothing &middot; a tool &middot; ' +
       'a coin &middot; a plant &middot; a recipe written down.</p></div>';
  h += '<label class="q">My object is:</label>' + li("ob_what","the object", "260px");
  h += '<label class="q">Who does it come from, or where?</label>' + li("ob_who","", "260px");

  h += '<h3 class="step"><span class="num">2</span>Look at the models</h3>';
  h += lvbar();

  h += '<div class="lv" translate="no" data-tap="1" data-lv="easy" data-lvname="Easier"><div class="model"><b class="lbl">Model &mdash; Easier</b>' +
       '<p>This is my grandmother\u2019s spoon.<br>She gave it to me in Guatemala.<br>She used it for many years.<br>' +
       'I put it in my bag when we left.<br>The spoon represents my grandmother.<br>When I see it, I remember her kitchen.</p>' +
       '</div></div>';

  h += '<div class="lv" translate="no" data-tap="1" data-lv="std" data-lvname="Standard"><div class="model"><b class="lbl">Model &mdash; Standard</b>' +
       '<p>These are my grandmother\u2019s scissors. She gave them to me in Guatemala when I was nine years old. ' +
       'She used them for thirty years to cut cloth, and the handles are smooth from her hands. ' +
       'When we left, my mother said I could only bring small things, so I put the scissors inside my shoe. ' +
       'For me, the scissors represent my grandmother\u2019s work. When I see them, I remember that she worked every day ' +
       'so that I could go to school.</p></div></div>';

  h += '<div class="lv" translate="no" data-tap="1" data-lv="chal" data-lvname="Challenge"><div class="model"><b class="lbl">Model &mdash; Challenge</b>' +
       '<p>These are my grandmother\u2019s scissors, and they are the only object in my room that is older than I am. ' +
       'She cut cloth with them for thirty years in a small shop in Quetzaltenango, and the handles have gone smooth ' +
       'and slightly crooked from the shape of her hand. When we left, my mother told me I could bring only small things, ' +
       'so I hid them inside my shoe and walked to the bus that way.</p>' +

  h += '<div class="lv" translate="no" data-tap="1" data-lv="std" data-lvname="Standard">' +
       '<p>Write one paragraph, five to seven sentences. Answer all four:</p>' +

  h += '<div class="lv" translate="no" data-tap="1" data-lv="chal" data-lvname="Challenge">' +
       '<p>Write two paragraphs. In the first, describe the object precisely enough that a reader could draw it. ' +

  h += '<p class="how" translate="yes" data-dir="amuseumlabelissh" data-en="A museum label is short. Title, one line about what it is, three or four sentences. That is all.">A museum label is short. Title, one line about what it is, three or four sentences. That is all.<span class="dirtr"></span></p>';

       'Carried from Quetzaltenango to San Francisco in 2023. The owner\u2019s grandmother used these ' +

    {id:"plan",   label:"The plan",     fn:planPane},
    {id:"object", label:"1 &middot; Object", fn:objectPane},
    {id:"six",    label:"Six panels",   fn:sixPane},
    {id:"guide",  label:"Survival guide",fn:guidePane},
    {id:"voice",  label:"Voice-over",   fn:voicePane},
    {id:"untold", label:"Untold chapter",fn:untoldPane},
    {id:"iview",  label:"Interview",    fn:interviewPane},
    {id:"museum", label:"Museum",       fn:museumPane},
    {id:"rubric", label:"Rubrics",      fn:rubricPane}
  ];
  var tabs = document.getElementById("tabs"), panes = document.getElementById("panes");
  defs.forEach(function(d,i){
    var b = document.createElement("button");
    b.innerHTML = d.label; b.setAttribute("data-pane", d.id);
    if(i === 0) b.className = "on";
    tabs.appendChild(b);
    var s = document.createElement("section");
    s.className = "pane" + (i === 0 ? " on" : ""); s.id = "pane_" + d.id;
    s.innerHTML = d.fn();
    panes.appendChild(s);
  });
  tabs.addEventListener("click", function(e){
    var b = e.target.closest("button[data-pane]"); if(!b) return;
    tabs.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    panes.querySelectorAll("section.pane").forEach(function(x){ x.classList.remove("on"); });
    document.getElementById("pane_" + b.getAttribute("data-pane")).classList.add("on");
    window.scrollTo(0,0);
  });
  setLevel("std");
})();

function setLevel(lv){
  curLevel = lv;
  document.querySelectorAll(".lv").forEach(function(d){ d.classList.toggle("on", d.getAttribute("data-lv") === lv); });
  document.querySelectorAll("[data-lvchip]").forEach(function(s){ s.classList.toggle("on", s.getAttribute("data-lvchip") === lv); });
  document.getElementById("levelSel").value = lv;
}
document.getElementById("levelSel").addEventListener("change", function(){ setLevel(this.value); queueSave(); });
document.addEventListener("click", function(e){
  var chip = e.target.closest("[data-lvchip]");
  if(chip) setLevel(chip.getAttribute("data-lvchip"));
});
document.getElementById("bigBtn").addEventListener("click", function(){ document.body.classList.toggle("big"); });

function readField(id){
  var els = document.querySelectorAll('[data-id="' + id + '"]');
  if(!els.length) return "";
  if(els[0].type === "radio"){ for(var i=0;i<els.length;i++) if(els[i].checked) return els[i].value; return ""; }
  if(els[0].type === "checkbox") return els[0].checked ? "1" : "";
  return (els[0].value || "").trim();
}

function headers(extra){
  var h = { "apikey":SUPA_KEY, "Authorization":"Bearer " + SUPA_KEY, "Content-Type":"application/json" };
  if(extra) for(var k in extra) h[k] = extra[k];
  return h;
}
function setStatus(cls, text){ document.getElementById("saveNote").innerHTML = '<span class="dot ' + cls + '"></span>' + text; }
function timeNow(){ var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h>=12?"PM":"AM"; h=h%12||12; if(m<10)m="0"+m; return h+":"+m+" "+ap; }

function collectPayload(){
  var ans={},answered=0,total=0,seen={};
  document.querySelectorAll("[data-id]").forEach(function(el){
    var id=el.getAttribute("data-id"); if(seen[id])return; seen[id]=1;
    var v=readField(id); ans[id]=v;
    var lv = el.closest ? el.closest(".lv") : null;
    if(lv && lv.getAttribute("data-lv") !== curLevel) return;
    total++; if(v) answered++;
  });
  return { answers:ans, meta:{ answered:answered, total:total, level:curLevel } };
}
function restorePayload(p){
  if(!p||!p.answers) return;
  Object.keys(p.answers).forEach(function(id){
    var v=p.answers[id];
    var els=document.querySelectorAll('[data-id="'+id+'"]');
    if(!els.length) return;
    if(els[0].type==="radio"){ els.forEach(function(r){ r.checked=(r.value===v); }); }
    else if(els[0].type==="checkbox"){ els[0].checked=!!v; }
    else els[0].value=v;
  });
  if(p.meta && p.meta.level) setLevel(p.meta.level);
}

var saving=false,pending=false,saveTimer=null;
function pushRow(markSubmitted, done){
  if(!student) return;
  if(saving){ pending=true; return; }
  saving=true; setStatus("wait","Saving\u2026");
  var pay=collectPayload();
  var row={ email:student.email, student_name:student.name, period:student.period,
    guide_key:GUIDE_KEY, lang:"", level:curLevel, payload:pay,
    answered:pay.meta.answered, total:pay.meta.total, updated_at:new Date().toISOString() };
  if(markSubmitted){ row.submitted=true; row.submitted_at=new Date().toISOString(); }
  fetch(SUPA_URL+"/rest/v1/"+TABLE+"?on_conflict=email,guide_key",{
    method:"POST", headers:headers({"Prefer":"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify([row])
  }).then(function(res){
    saving=false;
    if(res.ok){ setStatus("ok","Saved "+timeNow()); if(done)done(true); }
    else { res.text().then(function(t){ console.warn("Save failed:",res.status,t); });
           setStatus("bad","Not saved \u2014 check internet"); if(done)done(false); }
    if(pending){ pending=false; pushRow(false); }
  }).catch(function(e){
    saving=false; console.warn(e); setStatus("bad","Not saved \u2014 check internet");
    if(done)done(false); if(pending){ pending=false; pushRow(false); }
  });
}
function queueSave(){
  if(!student) return;
  setStatus("wait","Saving\u2026"); clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ pushRow(false); },2500);
}
document.addEventListener("input",function(e){ if(e.target.hasAttribute&&e.target.hasAttribute("data-id")) queueSave(); });
document.addEventListener("change",function(e){ if(e.target.hasAttribute&&e.target.hasAttribute("data-id")) queueSave(); });
window.addEventListener("beforeunload",function(){
  if(!student||!saveTimer) return;
  clearTimeout(saveTimer);
  var pay=collectPayload();
  try{
    fetch(SUPA_URL+"/rest/v1/"+TABLE+"?on_conflict=email,guide_key",{
      method:"POST", keepalive:true,
      headers:headers({"Prefer":"resolution=merge-duplicates,return=minimal"}),
      body:JSON.stringify([{ email:student.email, student_name:student.name, period:student.period,
        guide_key:GUIDE_KEY, lang:"", level:curLevel, payload:pay,
        answered:pay.meta.answered, total:pay.meta.total, updated_at:new Date().toISOString() }])
    });
  }catch(e){}
});
document.getElementById("turninBtn").addEventListener("click",function(){
  if(!student){ alert("Sign in first."); return; }
  var pay=collectPayload();
  if(!confirm("Turn in your project work?\n\nYou filled in "+pay.meta.answered+" of "+pay.meta.total+" boxes.\n\nYou can keep working after you turn it in.")) return;
  clearTimeout(saveTimer);
  pushRow(true,function(ok){ alert(ok?"Turned in. Mr. Toby can see it now.":"It did not send. Check the internet and try again."); });
});

function signedIn(){
  document.getElementById("gate").style.display="none";
  document.getElementById("who").textContent=student.name+" \u00b7 P"+student.period;
  setStatus("ok","Ready");
  fetch(SUPA_URL+"/rest/v1/"+TABLE+"?email=eq."+encodeURIComponent(student.email)+
        "&guide_key=eq."+GUIDE_KEY+"&select=payload",{headers:headers()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ if(rows&&rows.length&&rows[0].payload){ restorePayload(rows[0].payload); setStatus("ok","Your work loaded"); } })
    .catch(function(){});
}

  try{ localStorage.setItem(STU_KEY,JSON.stringify(student)); }catch(e){}
  signedIn();
});

})();

<script>
/* ============ Galileo standard: identity, directions, tap words, canary ============ */
(function(){
  /* some pages in this family define SLUG, some do not */
  var PAGE_SLUG=(typeof SLUG!=='undefined'&&SLUG)?SLUG:'arrival-projects';
  var CANON_DOMAIN='@s.sfusd.edu', ROSTER=[];
  var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
  function ME_(){ return (typeof student!=='undefined'&&student&&student.email)?student:null; }
  window.cleanMail=function(x){ return String(x||'').trim().toLowerCase(); };
  window.localPart=function(e){ return cleanMail(e).split('@')[0]; };
  window.validMail=function(e){ return /^[^@\s]+@(s\.)?sfusd\.edu$/.test(cleanMail(e)); };
  window.canonMail=function(raw){
    var lp=localPart(raw), i;
    for(i=0;i<ROSTER.length;i++){ if(localPart(ROSTER[i].email)===lp) return cleanMail(ROSTER[i].email); }
    return lp+CANON_DOMAIN;
  };
  function head(pref){
    var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
    if(pref) h['Prefer']=pref; return h;
  }
  window.recordAlias=function(alias, canon){
    if(!alias||alias===canon) return;
    fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{
      method:'POST', headers:head('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{alias_email:alias, email:canon}])}).catch(function(){});
  };
  window.seedStudent=function(name,email,period){
    fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{
      method:'POST', headers:head('resolution=ignore-duplicates,return=minimal'),
      body:JSON.stringify([{email:email, name:name, period:period}])}).catch(function(){});
  };
  fetch(SUPA_URL+'/rest/v1/students?select=name,email,period&order=name',{headers:head()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ ROSTER=rows||[]; }).catch(function(){});

  /* prefill from a sign-in anywhere else on the site */
  try{
    var saved=JSON.parse(localStorage.getItem('arrival_student')||'null');
    if(saved&&saved.email){
      if(document.getElementById('gName')) document.getElementById('gName').value=saved.name||'';
      if(document.getElementById('gEmail')) document.getElementById('gEmail').value=saved.email;
      if(saved.period&&document.getElementById('gPeriod')) document.getElementById('gPeriod').value=String(saved.period);
    } else {
      var g=localStorage.getItem('gal_student_email');
      if(g&&document.getElementById('gEmail')) document.getElementById('gEmail').value=g;
    }
  }catch(e){}

  /* ---------- translate through the proxy ---------- */
  var tcache={};
  var C2N={es:'Spanish',zh:'Chinese (Simplified)','zh-CN':'Chinese (Simplified)',ar:'Arabic',
    vi:'Vietnamese',ru:'Russian',ur:'Urdu',tl:'Tagalog',fr:'French',ko:'Korean',hi:'Hindi',
    so:'Somali',ne:'Nepali',th:'Thai'};
  function tr(text, code){
    var lang=(!code||code==='none')?'':(C2N[code]||code);
    var key=text+'|'+lang;
    if(tcache[key]) return Promise.resolve(tcache[key]);
    var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning=&lang='+encodeURIComponent(lang);
    return fetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      tcache[key]=d.translation; return d.translation;
    }).catch(function(){return null;});
  }

  /* ---------- directions in the student's language ---------- */
  var DIR_ON=false, SENT={};
  try{ DIR_ON=localStorage.getItem('song_dir')==='1'; }catch(e){}
  function logReveal(k, lang){
    if(!ME_()) return;
    var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    fetch(SUPA_URL+'/rest/v1/instruction_reveals',{
      method:'POST', headers:head('return=minimal'),
      body:JSON.stringify([{email:ME_().email, set_slug:PAGE_SLUG, activity:k, lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=document.getElementById('langSel').value;
    var list=document.querySelectorAll('[data-dir]');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||'';
      out.textContent='…';
      tr(en, lang).then(function(t){
        out.textContent=t?(t.equiv||t.meaning||''):'';
        if(out.textContent) logReveal(k, lang);
      });
    });
  }
  var dirBtn=document.getElementById('btn-dir');
  if(dirBtn){
    dirBtn.classList.toggle('on', DIR_ON);
    dirBtn.addEventListener('click',function(){
      DIR_ON=!DIR_ON;
      try{ localStorage.setItem('song_dir', DIR_ON?'1':'0'); }catch(e){}
      dirBtn.classList.toggle('on', DIR_ON);
      showDirections();
    });
  }
  var langSel=document.getElementById('langSel');
  if(langSel) langSel.addEventListener('change', function(){ if(DIR_ON) showDirections(); });
  if(DIR_ON) setTimeout(showDirections, 600);

  /* ---------- tap any word ---------- */
  var TAP_ON=false;
  try{ TAP_ON=localStorage.getItem('song_tap')==='1'; }catch(e){}
  function wrapWords(root){
    if(root.getAttribute('data-wrapped')) return;
    root.setAttribute('data-wrapped','1');
    var walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes=[], n;
    while((n=walker.nextNode())) if(n.nodeValue.trim()) nodes.push(n);
    nodes.forEach(function(node){
      if(node.parentNode.closest('textarea,input,button,select,.wt-tap')) return;
      var frag=document.createDocumentFragment();
      node.nodeValue.split(/(\s+)/).forEach(function(piece){
        if(!piece.trim()){ frag.appendChild(document.createTextNode(piece)); return; }
        var s=document.createElement('span');
        s.className='wt-tap'; s.textContent=piece;
        frag.appendChild(s);
      });
      node.parentNode.replaceChild(frag, node);
    });
  }
  function tapTargets(){ return document.querySelectorAll('[data-tap]'); }
  function setTap(on){
    TAP_ON=on;
    try{ localStorage.setItem('song_tap', on?'1':'0'); }catch(e){}
    document.body.classList.toggle('tap-on', on);
    var b=document.getElementById('btn-tap');
    if(b) b.classList.toggle('on', on);
    if(on) Array.prototype.forEach.call(tapTargets(), wrapWords);
  }
  var tapBtn=document.getElementById('btn-tap');
  if(tapBtn) tapBtn.addEventListener('click', function(){ setTap(!TAP_ON); });
  document.addEventListener('click', function(ev){
    if(!TAP_ON) return;
    var s=ev.target.closest('.wt-tap'); if(!s) return;
    var lang=document.getElementById('langSel').value;
    if(!lang){ document.getElementById('langSel').focus(); return; }
    var word=(s.textContent||'').replace(/[^A-Za-zÀ-ÿ'’-]/g,'');
    if(!word) return;
    var old=s.getAttribute('data-shown');
    if(old){ s.removeAttribute('data-shown'); var t=s.querySelector('.wt-bub'); if(t) t.remove(); return; }
    var bub=document.createElement('span'); bub.className='wt-bub'; bub.textContent='…';
    s.appendChild(bub); s.setAttribute('data-shown','1');
    tr(word, lang).then(function(t){ bub.textContent=t?(t.equiv||t.meaning||'?'):'?'; });
  });
  if(TAP_ON) setTimeout(function(){ setTap(true); }, 400);

  /* ---------- quiet browser-translation canary ---------- */
  var CANARY='the quick brown fox jumps over the lazy dog', TR_SENT='';
  function detectTranslation(){
    var c=document.getElementById('canary');
    var got=c?(c.textContent||'').trim().toLowerCase():'';
    var cls=document.documentElement.className||'';
    var drift=(c&&got!==CANARY)?got:'';
    if(!drift&&!/translated|notranslate-off/.test(cls)) return null;
    return {observed:drift, html_lang:document.documentElement.lang||'', html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation();
    if(!d||!ME_()) return;
    var sig=d.observed+'|'+d.html_lang;
    if(sig===TR_SENT) return;
    TR_SENT=sig;
    fetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{
      method:'POST', headers:head('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:ME_().email, set_slug:PAGE_SLUG, translated:true,
        observed:d.observed, html_lang:d.html_lang, html_class:d.html_class,
        updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation, 20000);
  setTimeout(checkTranslation, 4000);
})();
</script>
