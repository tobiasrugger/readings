<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arrival &mdash; Unit Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1f4d3d;
  --pine-dk:#143528;
  --pine-lt:#e8f0ec;
  --ink:#1b1b1b;
  --rule:#c9ccc8;
  --paper:#ffffff;
  --sepia:#8a6d45;
  --t-asp:#2f6f4f;
  --t-opp:#8c3a2f;
  --t-tra:#1f5f8b;
  --warn:#8a5a1f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);background:#f2f4f2;font-size:17px;line-height:1.65;
}
body.big{font-size:21px}
body.big textarea{min-height:130px}

/* ---------- toolbar ---------- */
#bar{
  position:sticky;top:0;z-index:60;background:var(--pine);color:#fff;
  padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
#bar .brand{font-weight:800;margin-right:6px;font-size:15px}
#bar button,#bar select{
  font-family:inherit;font-size:14px;font-weight:700;
  border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.10);
  color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;
}
#bar button:hover,#bar select:hover{background:rgba(255,255,255,.22)}
#bar select option{color:#111;background:#fff}
#bar .spacer{flex:1}
#who{font-size:13px;font-weight:700;opacity:.9}
#saveNote{font-size:13px;opacity:.85;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.ok{background:#7fe0a8}.dot.wait{background:#ffd36b}.dot.bad{background:#ff8f7a}

/* ---------- chapter tabs ---------- */
#tabs{
  position:sticky;top:45px;z-index:55;background:var(--pine-dk);
  display:flex;gap:2px;overflow-x:auto;padding:0 8px;
  scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
#tabs button{
  font-family:inherit;font-size:14px;font-weight:800;white-space:nowrap;
  background:transparent;color:#b7cdc1;border:0;border-bottom:3px solid transparent;
  padding:9px 13px;cursor:pointer;
}
#tabs button.on{color:#fff;border-bottom-color:#7fe0a8}
#tabs button:hover{color:#fff}

/* ---------- page ---------- */
.sheet{
  max-width:880px;margin:18px auto 70px;background:var(--paper);
  padding:34px 42px 60px;border:1px solid var(--rule);border-radius:4px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
h1.unit{font-size:2.1rem;margin:0;font-weight:800;letter-spacing:-.5px;color:var(--pine-dk)}
.byline{color:#5d6b63;font-weight:700;margin:4px 0 0;font-size:.95rem}
.hr{height:3px;width:70px;background:var(--pine);border-radius:3px;margin:16px 0 26px}

section.pane{display:none}
section.pane.on{display:block}

h2.ch{font-size:1.5rem;margin:0 0 2px;color:var(--pine-dk);font-weight:800}
.chsub{color:#5d6b63;font-weight:700;margin:0 0 22px;font-size:.97rem}

h3.step{
  font-size:1.05rem;margin:32px 0 4px;color:var(--pine-dk);font-weight:800;
  padding-bottom:5px;border-bottom:2px solid var(--pine-lt);
}
h3.step .num{
  display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;
  background:var(--pine);color:#fff;border-radius:50%;font-size:.8rem;margin-right:8px;
}
.how{color:#4a5852;font-size:.94rem;margin:8px 0 12px;font-style:italic}

/* level chips */
.levelbar{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.levelbar span{
  font-size:.78rem;font-weight:800;padding:4px 11px;border-radius:20px;
  border:1.5px solid var(--rule);color:#5d6b63;
}
.levelbar span.on{background:var(--pine);border-color:var(--pine);color:#fff}
.lv{display:none}
.lv.on{display:block}

/* boxes */
.box{
  border:1.5px solid var(--rule);border-left:5px solid var(--pine);
  border-radius:6px;padding:14px 16px;margin:12px 0;background:#fafcfb;
  break-inside:avoid;page-break-inside:avoid;
}
.box.warn{border-left-color:var(--warn);background:#fdf9f2}
.box.note{border-left-color:var(--sepia);background:#fbf8f3}
.box p:first-child{margin-top:0}
.box p:last-child{margin-bottom:0}
textarea{
  width:100%;font-family:inherit;font-size:1rem;line-height:1.6;padding:9px 11px;
  border:1.5px solid var(--rule);border-radius:6px;min-height:78px;resize:vertical;background:#fff;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--pine);outline-offset:1px}
input.line{
  font-family:inherit;font-size:1rem;border:0;border-bottom:2px solid var(--pine);
  background:transparent;padding:2px 4px;min-width:130px;
}
label.q{display:block;font-weight:700;margin:12px 0 5px}

/* caption bank */
ol.caps{list-style:none;counter-reset:cap;padding:0;margin:10px 0}
ol.caps li{
  counter-increment:cap;display:flex;gap:10px;align-items:flex-start;
  padding:7px 9px;border-bottom:1px solid #e6eae7;
}
ol.caps li:nth-child(odd){background:#f7faf8}
ol.caps li::before{
  content:counter(cap);flex:0 0 26px;text-align:center;font-weight:800;
  color:#fff;background:var(--sepia);border-radius:4px;font-size:.82rem;line-height:22px;height:22px;margin-top:3px;
}
ol.caps li .txt{flex:1}
ol.caps li input[type=checkbox]{width:19px;height:19px;accent-color:var(--pine);margin-top:4px;flex:0 0 auto}

/* tables */
table.g{width:100%;border-collapse:collapse;margin:12px 0}
table.g th,table.g td{border:1px solid var(--rule);padding:7px 10px;font-size:.97rem;vertical-align:top}
table.g th{background:var(--pine);color:#fff;font-weight:800;font-size:.88rem;text-align:left}
table.g td.w{font-weight:800;color:var(--pine-dk);width:22%}
table.g td.tr{font-weight:700;width:26%}
table.g td.tr.rtl{direction:rtl;text-align:right}
table.g tr:nth-child(even) td{background:#f7faf8}
table.g tr{break-inside:avoid;page-break-inside:avoid}
table.g td.tfc{width:54px;text-align:center}
table.g td.tfc input{width:19px;height:19px;accent-color:var(--pine)}

/* order + match */
ol.order{list-style:none;padding:0;margin:10px 0;counter-reset:none}
ol.order li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eef1ef}
ol.order li input{
  width:52px;text-align:center;font-family:inherit;font-weight:800;font-size:1rem;
  border:1.5px solid var(--rule);border-radius:6px;padding:6px 4px;
}
ol.order li .ev{flex:1}
select.pick.wide{width:100%;max-width:100%;font-weight:600}
.picklab{display:block;font-weight:700;margin:12px 0 5px}
select.pick{
  font-family:inherit;font-size:.97rem;font-weight:700;padding:5px 8px;
  border:1.5px solid var(--rule);border-radius:6px;background:#fff;max-width:100%;
}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #eef1ef;flex-wrap:wrap}
.mrow .def{flex:1;min-width:200px}

.mark{font-weight:800;margin-left:8px}
.mark.y{color:#2f6f4f}
.mark.n{color:#a33}
button.check{
  font-family:inherit;font-weight:800;font-size:.92rem;background:var(--pine);color:#fff;
  border:0;border-radius:7px;padding:8px 16px;cursor:pointer;margin-top:10px;
}
button.check:hover{background:var(--pine-dk)}
.score{font-weight:800;margin-left:12px;color:var(--pine-dk)}

/* script */
.script{border:1.5px solid var(--rule);border-radius:6px;padding:4px 0;margin:12px 0;background:#fafcfb}
.script .ln{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid #eef1ef}
.script .ln:last-child{border-bottom:0}
.script .ln .sp{font-weight:800;flex:0 0 30px;color:var(--pine)}
.script .ln.b .sp{color:var(--sepia)}

/* themes */
.themechips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.themechips b{font-size:.85rem;font-weight:800;padding:5px 12px;border-radius:20px;color:#fff}
.themechips b.asp{background:var(--t-asp)}
.themechips b.opp{background:var(--t-opp)}
.themechips b.tra{background:var(--t-tra)}

/* gate */
#gate{
  position:fixed;inset:0;z-index:200;background:rgba(16,28,23,.93);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#gate .card{
  background:#fff;border-radius:12px;padding:28px 26px;max-width:420px;width:100%;
}
#gate h2{margin:0 0 6px;color:var(--pine-dk);font-size:1.35rem}
#gate p{margin:0 0 16px;color:#5d6b63;font-size:.95rem}
#gate input,#gate select{
  width:100%;font-family:inherit;font-size:1rem;padding:10px 12px;margin-bottom:10px;
  border:1.5px solid var(--rule);border-radius:7px;
}
#gate button{
  width:100%;font-family:inherit;font-weight:800;font-size:1rem;background:var(--pine);
  color:#fff;border:0;border-radius:7px;padding:12px;cursor:pointer;
}
#gateErr{color:#a33;font-weight:700;font-size:.9rem;min-height:20px}

footer.pg{max-width:880px;margin:0 auto 60px;text-align:center;color:#5d6b63;font-size:.85rem;font-weight:700}
footer.pg a{color:var(--pine);font-weight:800}

@media (max-width:640px){
  .sheet{padding:22px 18px 44px;margin:10px auto 50px}
  h1.unit{font-size:1.65rem}
  #tabs{top:81px}
}
@media print{
  #bar,#tabs,#gate,button.check,.levelbar{display:none !important}
  body{background:#fff;font-size:12pt}
  .sheet{box-shadow:none;border:0;max-width:100%;padding:0;margin:0}
  section.pane{display:block !important;page-break-before:always}
  section.pane:first-of-type{page-break-before:auto}
  .lv{display:block !important}
  .lv::before{content:attr(data-lvname) ": ";font-weight:800;color:#1f4d3d}
  textarea{min-height:70px}
  .box,table tr,ol.caps li{page-break-inside:avoid}
}

#btn-dir.on,#btn-tap.on{background:#1F4D3D;color:#fff}
.dirtr{display:block;margin-top:4px;color:#2f6f57;font-weight:700}
.dirtr:empty{display:none}
body.tap-on .wt-tap{cursor:pointer;border-bottom:1px dotted #8aa79a}
body.tap-on .wt-tap:hover{background:#eef5f1}
.wt-bub{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:6px;
  background:#1F4D3D;color:#fff;font-size:.85em;font-weight:700}
</style>
</head>

<script>
/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var PERM = [3,0,5,1,4,2];          /* fixed shuffle so saved answers stay put */
function shuffle6(a){ return PERM.map(function(i){ return a[i]; }); }

var curLang = "";
var curLevel = "std";

function trCell(word){
  return '<td class="tr" data-word="' + esc(word) + '"></td>';
}
function paintTranslations(){
  var rtl = (curLang === "ar");
  document.querySelectorAll("[data-word]").forEach(function(td){
    var e = DICT[td.getAttribute("data-word")];
    td.textContent = (curLang && e) ? e[curLang] : "";
    td.className = "tr" + (rtl ? " rtl" : "");
  });
  document.querySelectorAll(".vhead").forEach(function(th){
    th.textContent = curLang ? LANGNAME[curLang] : "Your language";
  });
}

function wordTable(list){
  var h = '<table class="g"><tr><th>Word</th><th>Simple meaning</th><th class="vhead">Your language</th></tr>';
  list.forEach(function(w){
    var e = DICT[w];
    if(!e) return;
    h += '<tr><td class="w">' + esc(e.en) + '</td><td>' + esc(e.def) + '</td>' + trCell(w) + '</tr>';
  });
  return h + '</table>';
}

function ta(id, ph){
  return '<textarea data-id="' + id + '" placeholder="' + esc(ph || "") + '"></textarea>';
}
function li(id, ph, w){
  return '<input class="line" data-id="' + id + '" placeholder="' + esc(ph || "") + '"' + (w ? ' style="min-width:' + w + '"' : '') + '>';
}
/* Optional page numbers. The book is unpaginated, so this is empty by default.
   If you pencil spread numbers into the classroom copies, fill this in and every
   dropdown in the unit picks up the page automatically:
     PAGES[1] = {1:"2", 2:"3", 5:"6"};    // caption number -> page you wrote
   Anything you leave out just shows the caption with no page. */
var PAGES = {};

function capSelect(c, id){
  var o = '<option value="">choose a picture</option>';
  c.caps.forEach(function(txt, i){
    var num = i + 1;
    var pg = (PAGES[c.n] && PAGES[c.n][num]) ? " (p. " + PAGES[c.n][num] + ")" : "";
    var lab = "#" + num + pg + " \u2014 " + txt;
    o += '<option value="' + esc(lab) + '">' + esc(lab) + '</option>';
  });
  return '<select class="pick wide" data-id="' + id + '">' + o + '</select>';
}

function themeSelect(id){
  return '<select class="pick" data-id="' + id + '">' +
    '<option value="">choose a theme</option>' +
    '<option>aspiration</option><option>oppression</option><option>transition</option></select>';
}

/* ============================================================
   BUILD THE PANES
   ============================================================ */
var ANSWERS = {};   /* auto-scored keys -> correct value */

function startPane(){
  return '' +
  '<h2 class="ch">Start here</h2>' +
  '<p class="chsub" translate="yes" data-dir="readthispagebefo" data-en="Read this page before chapter 1.">Read this page before chapter 1.<span class="dirtr"></span></p>' +

  '<h3 class="step"><span class="num">1</span>A book with no words</h3>' +
  '<p>Shaun Tan drew <i>The Arrival</i> in 2006. It has about 128 pages and zero words. ' +
  'There is no English to read, so nobody in this room is behind. You can see everything on the first day.</p>' +
  '<p>It is the story of a man who leaves his family, travels to a country he does not understand, ' +
  'and slowly builds a life there until his family can join him.</p>' +

  '<h3 class="step"><span class="num">2</span>Three ideas we follow all unit</h3>' +
  '<div class="themechips"><b class="asp">aspiration</b><b class="opp">oppression</b><b class="tra">transition</b></div>' +
  wordTable(["aspiration","oppression","transition","symbol","represent","immigrant"]) +

  '<h3 class="step"><span class="num">3</span>What we do in every chapter</h3>' +
  '<div class="box" translate="no" data-tap="1"><p><b>Look</b> at the pictures. <b>Read</b> the sentences out loud. ' +
  '<b>Order</b> the events. <b>Say</b> what you see. <b>Then</b> say what you think it means.</p>' +
  '<p>Description comes first, always. Before you say what a picture <i>means</i>, ' +
  'you say what is <i>there</i>. Start every answer with <b>I see</b>.</p></div>' +
  '<div class="box note"><p><b>I see</b> &mdash; only what your eyes can find. ' +
  '<i>I see a man. I see a small suitcase.</i></p>' +
  '<p><b>I think</b> &mdash; what it might mean. <i>I think he is going far away.</i></p>' +
  '<p><b>I wonder</b> &mdash; a real question. <i>I wonder if he will come back.</i></p></div>' +

  '<h3 class="step"><span class="num">4</span>Before we begin</h3>' +
  '<div class="box warn"><p>This book shows war, hungry families, dangerous work, and people who had to leave ' +
  'home quickly. Some of it may be close to your own life or your family\u2019s life.</p>' +
  '<p>You never have to share your own story in this class. You can write about the characters instead, ' +
  'or about someone you invent. If a page is hard to look at, you can step out, and you do not need to ' +
  'explain why. Tell me in any language, or just put your hand flat on the desk.</p></div>' +

  '<h3 class="step"><span class="num">5</span>Your first writing (before we read)</h3>' +
  '<p class="how">Write as much as you can in ten minutes. Nobody is grading this. ' +
  'We keep it, and at the end of the unit you will write again and see the difference.</p>' +
  '<label class="q">Tell about a time you moved to a new place, or started at a new school. ' +
  'Where were you? Who was with you? How did you feel?</label>' +
  ta("start_baseline","Write here. Any amount is fine.") +
  '<label class="q">What is one thing you hope for this year?</label>' +
  ta("start_hope","");
}

function wordsPane(){
  var all = Object.keys(DICT);
  return '' +
  '<h2 class="ch">All the words</h2>' +
  '<p class="chsub" translate="yes" data-dir="everywordintheun" data-en="Every word in the unit, in one place. Pick a language in the green bar above.">Every word in the unit, in one place. Pick a language in the green bar above.<span class="dirtr"></span></p>' +
  '<div class="box" translate="no" data-tap="1"><p>You do not need to memorize all of these. Each chapter has twelve. ' +
  'This page is for checking a word when you forget it.</p></div>' +
  wordTable(all) +
  '<h3 class="step"><span class="num">&#10003;</span>Which words do you already know?</h3>' +
  '<label class="q">Write 5 words from the list that you already knew before this unit.</label>' +
  ta("words_known","") +
  '<label class="q">Write 5 words you want to practice this week.</label>' +
  ta("words_target","");
}

function chapterPane(c){
  var n = c.n, h = "";
  h += '<h2 class="ch">Chapter ' + n + ' &mdash; ' + esc(c.title) + '</h2>';
  h += '<p class="chsub">' + esc(c.sub) + '</p>';

  /* 1 before */
  h += '<h3 class="step"><span class="num">1</span>Before you look</h3>';
  h += '<p class="how" translate="yes" data-dir="answerwithapartn" data-en="Answer with a partner first. Talking comes before writing.">Answer with a partner first. Talking comes before writing.<span class="dirtr"></span></p>';
  c.before.forEach(function(q,i){
    h += '<label class="q">' + esc(q) + '</label>' + ta("ch" + n + "_before" + (i+1), "");
  });

  /* 2 words */
  h += '<h3 class="step"><span class="num">2</span>Twelve words for this chapter</h3>';
  h += wordTable(c.words);

  /* 3 captions */
  h += '<h3 class="step"><span class="num">3</span>Read the sentences out loud</h3>';
  h += '<p class="how">These sentences describe the pictures in this chapter. ' +
       'Read each one out loud to your partner, then find the picture it matches in the book. ' +
       'Check the box when you can read the sentence smoothly.</p>';
  h += '<ol class="caps">';
  c.caps.forEach(function(s,i){
    h += '<li><input type="checkbox" data-id="ch' + n + '_cap' + (i+1) + '" aria-label="read aloud">' +
         '<span class="txt">' + esc(s) + '</span></li>';
  });
  h += '</ol>';

  /* 4 order */
  var sh = shuffle6(c.order);
  h += '<h3 class="step"><span class="num">4</span>Put it in order</h3>';
  h += '<p class="how" translate="yes" data-dir="writetonumberhap" data-en="Write 1 to 6. Number 1 happens first.">Write 1 to 6. Number 1 happens first.<span class="dirtr"></span></p>';
  h += '<ol class="order" id="ord' + n + '">';
  sh.forEach(function(s,i){
    var correct = c.order.indexOf(s) + 1;
    var key = "ch" + n + "_order" + (i+1);
    ANSWERS[key] = String(correct);
    h += '<li><input data-id="' + key + '" inputmode="numeric" maxlength="1" aria-label="order number">' +
         '<span class="ev">' + esc(s) + '</span><span class="mark" id="m_' + key + '"></span></li>';
  });
  h += '</ol><button class="check" data-check="order' + n + '">Check my order</button>' +
       '<span class="score" id="sc_order' + n + '"></span>';

  /* 5 true false */
  h += '<h3 class="step"><span class="num">5</span>True or false</h3>';
  h += '<table class="g"><tr><th>Sentence</th><th class="tfc">True</th><th class="tfc">False</th></tr>';
  c.tf.forEach(function(p,i){
    var key = "ch" + n + "_tf" + (i+1);
    ANSWERS[key] = p[1] ? "T" : "F";
    h += '<tr><td>' + esc(p[0]) + '<span class="mark" id="m_' + key + '"></span></td>' +
         '<td class="tfc"><input type="radio" name="' + key + '" value="T" data-id="' + key + '"></td>' +
         '<td class="tfc"><input type="radio" name="' + key + '" value="F" data-id="' + key + '"></td></tr>';
  });
  h += '</table><button class="check" data-check="tf' + n + '">Check true or false</button>' +
       '<span class="score" id="sc_tf' + n + '"></span>';

  /* 6 word match */
  var mw = c.words.slice(0,6);
  var opts = mw.slice().sort();
  var shownDefs = shuffle6(mw);
  h += '<h3 class="step"><span class="num">6</span>Match the word to the meaning</h3>';
  shownDefs.forEach(function(w,i){
    var key = "ch" + n + "_match" + (i+1);
    ANSWERS[key] = w;
    var o = '<option value="">choose</option>';
    opts.forEach(function(x){ o += '<option>' + esc(x) + '</option>'; });
    h += '<div class="mrow"><span class="def">' + esc(DICT[w].def) + '</span>' +
         '<select class="pick" data-id="' + key + '">' + o + '</select>' +
         '<span class="mark" id="m_' + key + '"></span></div>';
  });
  h += '<button class="check" data-check="match' + n + '">Check my matches</button>' +
       '<span class="score" id="sc_match' + n + '"></span>';

  /* 7 see think wonder */
  h += '<h3 class="step"><span class="num">7</span>I see / I think / I wonder</h3>';
  h += '<p class="how">Choose one picture from this chapter, then go in order. ' +
       'Do not skip to <i>I think</i>.</p>';
  h += '<span class="picklab">Which picture?</span>' + capSelect(c, "ch" + n + "_stw_img");
  h += '<label class="q">I see &hellip; <span style="font-weight:400">(three things your eyes can find)</span></label>' +
       ta("ch" + n + "_see","I see ... I see ... I see ...");
  h += '<label class="q">I think &hellip;</label>' + ta("ch" + n + "_think","I think ... because ...");
  h += '<label class="q">I wonder &hellip;</label>' + ta("ch" + n + "_wonder","I wonder ...");

  /* 8 theme search, leveled */
  h += '<h3 class="step"><span class="num">8</span>Theme search</h3>';
  h += '<div class="themechips"><b class="asp">aspiration</b><b class="opp">oppression</b><b class="tra">transition</b></div>';
  h += '<p class="how">Look for: ' + esc(c.hint) + '</p>';
  h += '<div class="levelbar"><span data-lvchip="easy">Easier</span><span data-lvchip="std">Standard</span><span data-lvchip="chal">Challenge</span></div>';

  h += '<div class="lv" translate="no" data-tap="1" data-lv="easy" data-lvname="Easier">' +
       '<span class="picklab">Which picture?</span>' + capSelect(c, "ch" + n + "_th_e_img") +
       '<p><b>Theme:</b> ' + themeSelect("ch" + n + "_th_e_theme") + '</p>' +
       '<p>I see a ' + li("ch" + n + "_th_e_1","what?") + ' .</p>' +
       '<p>The person feels ' + li("ch" + n + "_th_e_2","how?") + ' .</p>' +
       '<p>This picture is about ' + li("ch" + n + "_th_e_3","the theme") + ' because ' + li("ch" + n + "_th_e_4","why?","200px") + ' .</p>' +
       '</div>';

  h += '<div class="lv" translate="no" data-tap="1" data-lv="std" data-lvname="Standard">' +
       '<span class="picklab">Which picture?</span>' + capSelect(c, "ch" + n + "_th_s_img") +
       '<p><b>Theme:</b> ' + themeSelect("ch" + n + "_th_s_theme") + '</p>' +
       '<label class="q">What is happening? Who is there? Where are they?</label>' +
       ta("ch" + n + "_th_s_what","In this picture, ...") +
       '<label class="q">Why does this picture show the theme?</label>' +
       ta("ch" + n + "_th_s_why","This picture represents the theme of ______ because ...") +
       '<label class="q">How well does Shaun Tan show the feeling?</label>' +
       ta("ch" + n + "_th_s_eval","I think Shaun Tan shows the feeling of ______ well / not well because ...") +
       '</div>';

  h += '<div class="lv" translate="no" data-tap="1" data-lv="chal" data-lvname="Challenge">' +
       '<span class="picklab">Which picture?</span>' + capSelect(c, "ch" + n + "_th_c_img") +
       '<p><b>Theme:</b> ' + themeSelect("ch" + n + "_th_c_theme") + '</p>' +
       '<label class="q">Describe the picture, then argue for your theme using two details as evidence.</label>' +
       ta("ch" + n + "_th_c_arg","") +
       '<label class="q">Someone could argue this picture shows a different theme. Which one, and why would they say that?</label>' +
       ta("ch" + n + "_th_c_counter","") +
       '<label class="q">Name one choice the artist made &mdash; colour, size, angle, light, what he left out &mdash; and explain its effect.</label>' +
       ta("ch" + n + "_th_c_craft","") +
       '</div>';

  /* 9 script */
  h += '<h3 class="step"><span class="num">9</span>Talk with a partner</h3>';
  h += '<p class="how">The older partner is A. Read the whole script out loud. ' +
       'Say your answer in the blank &mdash; do not write it.</p>';
  h += '<div class="script">';
  c.script.forEach(function(l){
    h += '<div class="ln' + (l[0] === "B" ? " b" : "") + '"><span class="sp">' + l[0] + '</span><span>' + esc(l[1]) + '</span></div>';
  });
  h += '</div>';
  h += '<label class="q">After you talk: write one good idea you heard from your partner.</label>' +
       ta("ch" + n + "_partner","My partner said ...");

  /* 10 write */
  h += '<h3 class="step"><span class="num">10</span>Write</h3>';
  h += '<div class="levelbar"><span data-lvchip="easy">Easier</span><span data-lvchip="std">Standard</span><span data-lvchip="chal">Challenge</span></div>';
  h += '<div class="lv" translate="no" data-tap="1" data-lv="easy" data-lvname="Easier"><p>' + c.write.easy + '</p>' + ta("ch" + n + "_w_e","") + '</div>';
  h += '<div class="lv" translate="no" data-tap="1" data-lv="std" data-lvname="Standard"><p>' + c.write.std + '</p>' + ta("ch" + n + "_w_s","") + '</div>';
  h += '<div class="lv" translate="no" data-tap="1" data-lv="chal" data-lvname="Challenge"><p>' + c.write.chal + '</p>' + ta("ch" + n + "_w_c","") + '</div>';

  h += '<div class="box note" style="margin-top:26px"><p><b>Keep this.</b> Your theme searches are the evidence ' +
       'for your final project. Do not throw them away &mdash; you will use them in week 7.</p></div>';
  return h;
}

/* render everything */
(function build(){
  var tabs = document.getElementById("tabs");
  var panes = document.getElementById("panes");
  var defs = [{id:"start", label:"Start"},{id:"words", label:"Words"}];
  CH.forEach(function(c){ defs.push({id:"ch" + c.n, label:"Ch " + c.n}); });

  defs.forEach(function(d,i){
    var b = document.createElement("button");
    b.textContent = d.label; b.setAttribute("data-pane", d.id);
    if(i === 0) b.className = "on";
    tabs.appendChild(b);

    var s = document.createElement("section");
    s.className = "pane" + (i === 0 ? " on" : "");
    s.id = "pane_" + d.id;
    if(d.id === "start") s.innerHTML = startPane();
    else if(d.id === "words") s.innerHTML = wordsPane();
    else s.innerHTML = chapterPane(CH[i - 2]);
    panes.appendChild(s);
  });

  tabs.addEventListener("click", function(e){
    var b = e.target.closest("button[data-pane]");
    if(!b) return;
    tabs.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    panes.querySelectorAll("section.pane").forEach(function(x){ x.classList.remove("on"); });
    document.getElementById("pane_" + b.getAttribute("data-pane")).classList.add("on");
    window.scrollTo(0,0);
  });

  setLevel("std");
  paintTranslations();
})();

/* ============================================================
   LEVEL + LANGUAGE + VIEW
   ============================================================ */
function setLevel(lv){
  curLevel = lv;
  document.querySelectorAll(".lv").forEach(function(d){
    d.classList.toggle("on", d.getAttribute("data-lv") === lv);
  });
  document.querySelectorAll("[data-lvchip]").forEach(function(s){
    s.classList.toggle("on", s.getAttribute("data-lvchip") === lv);
  });
  document.getElementById("levelSel").value = lv;
}
document.getElementById("levelSel").addEventListener("change", function(){ setLevel(this.value); queueSave(); });
document.addEventListener("click", function(e){
  var chip = e.target.closest("[data-lvchip]");
  if(chip) setLevel(chip.getAttribute("data-lvchip"));
});
document.getElementById("langSel").addEventListener("change", function(){
  curLang = this.value; paintTranslations(); queueSave();
});
document.getElementById("bigBtn").addEventListener("click", function(){ document.body.classList.toggle("big"); });
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });

/* ============================================================
   AUTO-SCORING
   ============================================================ */
var SCORES = {};
function runCheck(kind, n){
  var prefix = "ch" + n + "_" + (kind === "tf" ? "tf" : kind);
  var got = 0, tot = 0;
  Object.keys(ANSWERS).forEach(function(key){
    if(key.indexOf(prefix) !== 0) return;
    if(!/\d$/.test(key.slice(prefix.length))) return;
    tot++;
    var val = readField(key);
    var ok = val && val.toLowerCase() === ANSWERS[key].toLowerCase();
    if(ok) got++;
    var m = document.getElementById("m_" + key);
    if(m){ m.textContent = val ? (ok ? "\u2713" : "\u2717") : ""; m.className = "mark " + (ok ? "y" : "n"); }
  });
  var el = document.getElementById("sc_" + kind + n);
  if(el) el.textContent = got + " / " + tot;
  SCORES["ch" + n + "_" + kind] = got + "/" + tot;
  queueSave();
}
document.addEventListener("click", function(e){
  var b = e.target.closest("button[data-check]");
  if(!b) return;
  var v = b.getAttribute("data-check");
  var kind = v.replace(/\d+$/,""), n = v.replace(/\D+/g,"");
  runCheck(kind, n);
});

function readField(id){
  var els = document.querySelectorAll('[data-id="' + id + '"]');
  if(!els.length) return "";
  if(els[0].type === "radio"){
    for(var i=0;i<els.length;i++) if(els[i].checked) return els[i].value;
    return "";
  }
  if(els[0].type === "checkbox") return els[0].checked ? "1" : "";
  return (els[0].value || "").trim();
}

var SUPA_URL = "https://lhmwtfyceilgndpygivj.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU";

function headers(extra){
  var h = { "apikey":SUPA_KEY, "Authorization":"Bearer " + SUPA_KEY, "Content-Type":"application/json" };
  if(extra) for(var k in extra) h[k] = extra[k];
  return h;
}
function setStatus(cls, text){
  document.getElementById("saveNote").innerHTML = '<span class="dot ' + cls + '"></span>' + text;
}
function timeNow(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  var ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; if(m < 10) m = "0" + m;
  return h + ":" + m + " " + ap;
}

function countable(el, id){
  if(id.indexOf("_cap") > -1) return false;          /* read-aloud ticks are not questions */
  var lv = el.closest ? el.closest(".lv") : null;     /* only count the level the student is on */
  if(lv && lv.getAttribute("data-lv") !== curLevel) return false;
  return true;
}
function collectPayload(){
  var ans = {}, answered = 0, total = 0, seen = {};
  document.querySelectorAll("[data-id]").forEach(function(el){
    var id = el.getAttribute("data-id");
    if(seen[id]) return; seen[id] = 1;
    var v = readField(id);
    ans[id] = v;
    if(countable(el, id)){ total++; if(v) answered++; }
  });
  return { answers:ans, scores:SCORES, meta:{ answered:answered, total:total, level:curLevel, lang:curLang } };
}
function restorePayload(p){
  if(!p || !p.answers) return;
  Object.keys(p.answers).forEach(function(id){
    var v = p.answers[id];
    var els = document.querySelectorAll('[data-id="' + id + '"]');
    if(!els.length) return;
    if(els[0].type === "radio"){ els.forEach(function(r){ r.checked = (r.value === v); }); }
    else if(els[0].type === "checkbox"){ els[0].checked = !!v; }
    else { els[0].value = v; }
  });
  if(p.scores) SCORES = p.scores;
  if(p.meta){
    if(p.meta.level) setLevel(p.meta.level);
    if(p.meta.lang){ curLang = p.meta.lang; document.getElementById("langSel").value = curLang; paintTranslations(); }
  }
}

var saving = false, pending = false, saveTimer = null;
function pushRow(markSubmitted, done){
  if(!student) return;
  if(saving){ pending = true; return; }
  saving = true; setStatus("wait","Saving\u2026");
  var pay = collectPayload();
  var row = {
    email: student.email, student_name: student.name, period: student.period,
    guide_key: GUIDE_KEY, lang: curLang, level: curLevel, payload: pay,
    answered: pay.meta.answered, total: pay.meta.total,
    updated_at: new Date().toISOString()
  };
  if(markSubmitted){ row.submitted = true; row.submitted_at = new Date().toISOString(); }
  fetch(SUPA_URL + "/rest/v1/" + TABLE + "?on_conflict=email,guide_key", {
    method:"POST", headers: headers({ "Prefer":"resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify([row])
  }).then(function(res){
    saving = false;
    if(res.ok){ setStatus("ok","Saved " + timeNow()); if(done) done(true); }
    else { res.text().then(function(t){ console.warn("Save failed:", res.status, t); });
           setStatus("bad","Not saved \u2014 check internet"); if(done) done(false); }
    if(pending){ pending = false; pushRow(false); }
  }).catch(function(e){
    saving = false; console.warn(e); setStatus("bad","Not saved \u2014 check internet");
    if(done) done(false); if(pending){ pending = false; pushRow(false); }
  });
}
function queueSave(){
  if(!student) return;
  setStatus("wait","Saving\u2026");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ pushRow(false); }, 2500);
}
document.addEventListener("input", function(e){ if(e.target.hasAttribute && e.target.hasAttribute("data-id")) queueSave(); });
document.addEventListener("change", function(e){ if(e.target.hasAttribute && e.target.hasAttribute("data-id")) queueSave(); });
window.addEventListener("beforeunload", function(){
  if(!student || !saveTimer) return;
  clearTimeout(saveTimer);
  var pay = collectPayload();
  try{
    fetch(SUPA_URL + "/rest/v1/" + TABLE + "?on_conflict=email,guide_key", {
      method:"POST", keepalive:true,
      headers: headers({ "Prefer":"resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([{ email:student.email, student_name:student.name, period:student.period,
        guide_key:GUIDE_KEY, lang:curLang, level:curLevel, payload:pay,
        answered:pay.meta.answered, total:pay.meta.total, updated_at:new Date().toISOString() }])
    });
  }catch(e){}
});

/* turn in */
document.getElementById("turninBtn").addEventListener("click", function(){
  if(!student){ alert("Sign in first."); return; }
  var pay = collectPayload();
  if(!confirm("Turn in your work?\n\nYou answered " + pay.meta.answered + " of " + pay.meta.total +
              " questions.\n\nYou can still keep working after you turn it in.")) return;
  clearTimeout(saveTimer);
  pushRow(true, function(ok){ alert(ok ? "Turned in. Mr. Toby can see it now." : "It did not send. Check the internet and try again."); });
});

/* ---------- sign in ---------- */
function signedIn(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("who").textContent = student.name + " \u00b7 P" + student.period;
  setStatus("ok","Ready");
  fetch(SUPA_URL + "/rest/v1/" + TABLE + "?email=eq." + encodeURIComponent(student.email) +

    .then(function(rows){
      if(rows && rows.length && rows[0].payload){ restorePayload(rows[0].payload); setStatus("ok","Your work loaded"); }
    }).catch(function(){});
}
document.getElementById("gBtn").addEventListener("click", function(){
  var name = document.getElementById("gName").value.trim();
  var email = document.getElementById("gEmail").value.trim().toLowerCase();
  var period = document.getElementById("gPeriod").value;

  if(name.length < 2){ err.textContent = "Please write your name."; return; }
  if(!validMail(email)){ err.textContent = "Please use your school email — it ends with @s.sfusd.edu"; return; }

  if(!period){ err.textContent = "Please choose your period."; return; }
  recordAlias(document.getElementById("gEmail").value.trim().toLowerCase(), email);
  seedStudent(name, email, period);
  try{ localStorage.setItem("gal_student_email", email); }catch(e){}
  student = { name:name, email:email, period:period };
  try{ localStorage.setItem(STU_KEY, JSON.stringify(student)); }catch(e){}
  signedIn();
});

    var s = JSON.parse(localStorage.getItem(STU_KEY) || "null");

<script>
/* ============ Galileo standard: identity, directions, tap words, canary ============ */
(function(){
  /* some pages in this family define SLUG, some do not */
  var PAGE_SLUG=(typeof SLUG!=='undefined'&&SLUG)?SLUG:'arrival-index';
  var CANON_DOMAIN='@s.sfusd.edu', ROSTER=[];
  var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
  function ME_(){ return (typeof student!=='undefined'&&student&&student.email)?student:null; }
  window.cleanMail=function(x){ return String(x||'').trim().toLowerCase(); };
  window.localPart=function(e){ return cleanMail(e).split('@')[0]; };
  window.validMail=function(e){ return /^[^@\s]+@(s\.)?sfusd\.edu$/.test(cleanMail(e)); };
  window.canonMail=function(raw){
    var lp=localPart(raw), i;
    for(i=0;i<ROSTER.length;i++){ if(localPart(ROSTER[i].email)===lp) return cleanMail(ROSTER[i].email); }
    return lp+CANON_DOMAIN;
  };
  function head(pref){
    var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
    if(pref) h['Prefer']=pref; return h;
  }
  window.recordAlias=function(alias, canon){
    if(!alias||alias===canon) return;
    fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{
      method:'POST', headers:head('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{alias_email:alias, email:canon}])}).catch(function(){});
  };
  window.seedStudent=function(name,email,period){
    fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{
      method:'POST', headers:head('resolution=ignore-duplicates,return=minimal'),
      body:JSON.stringify([{email:email, name:name, period:period}])}).catch(function(){});
  };
  fetch(SUPA_URL+'/rest/v1/students?select=name,email,period&order=name',{headers:head()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ ROSTER=rows||[]; }).catch(function(){});

  /* prefill from a sign-in anywhere else on the site */
  try{
    var saved=JSON.parse(localStorage.getItem('arrival_student')||'null');
    if(saved&&saved.email){
      if(document.getElementById('gName')) document.getElementById('gName').value=saved.name||'';
      if(document.getElementById('gEmail')) document.getElementById('gEmail').value=saved.email;
      if(saved.period&&document.getElementById('gPeriod')) document.getElementById('gPeriod').value=String(saved.period);
    } else {
      var g=localStorage.getItem('gal_student_email');
      if(g&&document.getElementById('gEmail')) document.getElementById('gEmail').value=g;
    }
  }catch(e){}

  /* ---------- translate through the proxy ---------- */
  var tcache={};
  var C2N={es:'Spanish',zh:'Chinese (Simplified)','zh-CN':'Chinese (Simplified)',ar:'Arabic',
    vi:'Vietnamese',ru:'Russian',ur:'Urdu',tl:'Tagalog',fr:'French',ko:'Korean',hi:'Hindi',
    so:'Somali',ne:'Nepali',th:'Thai'};
  function tr(text, code){
    var lang=(!code||code==='none')?'':(C2N[code]||code);
    var key=text+'|'+lang;
    if(tcache[key]) return Promise.resolve(tcache[key]);
    var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning=&lang='+encodeURIComponent(lang);
    return fetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      tcache[key]=d.translation; return d.translation;
    }).catch(function(){return null;});
  }

  /* ---------- directions in the student's language ---------- */
  var DIR_ON=false, SENT={};
  try{ DIR_ON=localStorage.getItem('song_dir')==='1'; }catch(e){}
  function logReveal(k, lang){
    if(!ME_()) return;
    var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    fetch(SUPA_URL+'/rest/v1/instruction_reveals',{
      method:'POST', headers:head('return=minimal'),
      body:JSON.stringify([{email:ME_().email, set_slug:PAGE_SLUG, activity:k, lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=document.getElementById('langSel').value;
    var list=document.querySelectorAll('[data-dir]');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||'';
      out.textContent='…';
      tr(en, lang).then(function(t){
        out.textContent=t?(t.equiv||t.meaning||''):'';
        if(out.textContent) logReveal(k, lang);
      });
    });
  }
  var dirBtn=document.getElementById('btn-dir');
  if(dirBtn){
    dirBtn.classList.toggle('on', DIR_ON);
    dirBtn.addEventListener('click',function(){
      DIR_ON=!DIR_ON;
      try{ localStorage.setItem('song_dir', DIR_ON?'1':'0'); }catch(e){}
      dirBtn.classList.toggle('on', DIR_ON);
      showDirections();
    });
  }
  var langSel=document.getElementById('langSel');
  if(langSel) langSel.addEventListener('change', function(){ if(DIR_ON) showDirections(); });
  if(DIR_ON) setTimeout(showDirections, 600);

  /* ---------- tap any word ---------- */
  var TAP_ON=false;
  try{ TAP_ON=localStorage.getItem('song_tap')==='1'; }catch(e){}
  function wrapWords(root){
    if(root.getAttribute('data-wrapped')) return;
    root.setAttribute('data-wrapped','1');
    var walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes=[], n;
    while((n=walker.nextNode())) if(n.nodeValue.trim()) nodes.push(n);
    nodes.forEach(function(node){
      if(node.parentNode.closest('textarea,input,button,select,.wt-tap')) return;
      var frag=document.createDocumentFragment();
      node.nodeValue.split(/(\s+)/).forEach(function(piece){
        if(!piece.trim()){ frag.appendChild(document.createTextNode(piece)); return; }
        var s=document.createElement('span');
        s.className='wt-tap'; s.textContent=piece;
        frag.appendChild(s);
      });
      node.parentNode.replaceChild(frag, node);
    });
  }
  function tapTargets(){ return document.querySelectorAll('[data-tap]'); }
  function setTap(on){
    TAP_ON=on;
    try{ localStorage.setItem('song_tap', on?'1':'0'); }catch(e){}
    document.body.classList.toggle('tap-on', on);
    var b=document.getElementById('btn-tap');
    if(b) b.classList.toggle('on', on);
    if(on) Array.prototype.forEach.call(tapTargets(), wrapWords);
  }
  var tapBtn=document.getElementById('btn-tap');
  if(tapBtn) tapBtn.addEventListener('click', function(){ setTap(!TAP_ON); });
  document.addEventListener('click', function(ev){
    if(!TAP_ON) return;
    var s=ev.target.closest('.wt-tap'); if(!s) return;
    var lang=document.getElementById('langSel').value;
    if(!lang){ document.getElementById('langSel').focus(); return; }
    var word=(s.textContent||'').replace(/[^A-Za-zÀ-ÿ'’-]/g,'');
    if(!word) return;
    var old=s.getAttribute('data-shown');
    if(old){ s.removeAttribute('data-shown'); var t=s.querySelector('.wt-bub'); if(t) t.remove(); return; }
    var bub=document.createElement('span'); bub.className='wt-bub'; bub.textContent='…';
    s.appendChild(bub); s.setAttribute('data-shown','1');
    tr(word, lang).then(function(t){ bub.textContent=t?(t.equiv||t.meaning||'?'):'?'; });
  });
  if(TAP_ON) setTimeout(function(){ setTap(true); }, 400);

  /* ---------- quiet browser-translation canary ---------- */
  var CANARY='the quick brown fox jumps over the lazy dog', TR_SENT='';
  function detectTranslation(){
    var c=document.getElementById('canary');
    var got=c?(c.textContent||'').trim().toLowerCase():'';
    var cls=document.documentElement.className||'';
    var drift=(c&&got!==CANARY)?got:'';
    if(!drift&&!/translated|notranslate-off/.test(cls)) return null;
    return {observed:drift, html_lang:document.documentElement.lang||'', html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation();
    if(!d||!ME_()) return;
    var sig=d.observed+'|'+d.html_lang;
    if(sig===TR_SENT) return;
    TR_SENT=sig;
    fetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{
      method:'POST', headers:head('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:ME_().email, set_slug:PAGE_SLUG, translated:true,
        observed:d.observed, html_lang:d.html_lang, html_class:d.html_class,
        updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation, 20000);
  setTimeout(checkTranslation, 4000);
})();
</script>
