 {t:'html',html:'<p>In <b>The Landlady</b> (1959), Billy, 17, is alone in a city at night. He goes into an older woman\u2019s home. She gives him tea and asks about his life.</p><p>In <b>Thank You, Ma\u2019am</b> (1958), Roger, 14 or 15, is alone in a city at night. He goes into an older woman\u2019s home. She gives him dinner and asks about his life.</p><p><b>Same start. Opposite endings.</b> <button class="spk" data-say="Same start. Opposite endings.">🔊</button></p>'}

{id:'authors',chip:'The authors',title:'The two writers',blocks:[
 {t:'html',pic:ART.C.hughes,html:'<h3>Langston Hughes (1901–1967) <button class="spk" data-say="Langston Hughes was a Black American poet. He was born in Missouri and became famous in Harlem, New York. His father left the family and moved to Mexico. Hughes grew up mostly with his grandmother. He wrote about everyday Black life, with respect.">🔊</button></h3><p>Black American poet, born in Missouri, famous in Harlem, New York. His father left the family and moved to Mexico. Hughes grew up mostly with his <b>grandmother</b>. He wrote about everyday Black life, with respect.</p>'},
 {t:'html',pic:ART.C.dahl,html:'<h3>Roald Dahl (1916–1990) <button class="spk" data-say="Roald Dahl was born in Wales, in Britain, to parents from Norway. His father died when he was three years old. He was a fighter pilot in World War Two. He wrote scary stories with a twist for adults, and famous books for children.">🔊</button></h3><p>Born in Wales (Britain) to parents from Norway. His <b>father died when he was three</b>. He was a fighter pilot in World War II. He wrote scary stories with a twist for adults — and famous children\u2019s books like <i>Charlie and the Chocolate Factory</i>.</p>'},
 {t:'mc',id:'au1',tag:'REVIEW',q:'Which writer grew up mostly with his grandmother?',opts:['Langston Hughes','Roald Dahl','both','neither'],ans:0,why:'Hughes\u2019s father left; his grandmother raised him. Mrs. Jones is a little like her — tough, poor and proud.',hint:'Read the first box again.'},
 {t:'mc',id:'au2',tag:'REVIEW',q:'Which writer was a pilot in World War II?',opts:['Roald Dahl','Langston Hughes','both','neither'],ans:0,why:'Dahl flew fighter planes in the war.',hint:'Look at the airplane in the picture.'},
 {t:'mc',id:'au3',tag:'CONNECT',q:'What is the same about both writers\u2019 fathers?',opts:['Both boys grew up without their father at home.','Both fathers were writers.','Both fathers were pilots.','Both fathers were from Norway.'],ans:0,why:'Dahl\u2019s father died; Hughes\u2019s father left. Both writers grew up without a father — and their stories have no fathers either.',hint:'One father died. One father left.'},
 {t:'mc',id:'au4',tag:'REVIEW',q:'How far apart did the two stories come out?',opts:['about one year','about ten years','about fifty years','the same day'],ans:0,why:'Thank You, Ma\u2019am: 1958. The Landlady: 1959.',hint:'1958 and 1959.'}
]},
{id:'deep',chip:'⭐ Going deeper',title:'⭐ Going deeper (extra)',blocks:[
 {t:'html',cls:'extra',html:'<p class="dr">These are extra. Each one you write can raise your grade. None of them can lower it.</p>'},
 {t:'q',id:'k1',extra:true,tag:'FORCE OR SWEET?',q:'Mrs. Jones grabs Roger and drags him home in a half nelson. The landlady is gentle and sweet with Billy. One boy is pulled in by force and comes out better. One is invited in sweetly and never comes out. Why might the rough way be the one that saves a boy?',frame:'The rough way saves Roger because ___. The sweet way is dangerous because ___.'},
 {t:'q',id:'k2',extra:true,tag:'TWO TEACHERS',q:'Billy learned from the big bosses at his company: be brisk, look successful. Roger learned from a woman who works late in a hotel beauty shop: you can be trusted, you can choose. Which lessons kept a boy safe?',frame:'Billy\u2019s lessons ___. Roger\u2019s lessons ___.'},
 {t:'q',id:'k3',extra:true,tag:'WHO LOOKS DANGEROUS?',q:'Most people would think Roger is the dangerous one and Billy is the safe one. Who is really in danger in each story? Who is really dangerous?',frame:'People think ___, but really ___.'},
 {t:'q',id:'k4',extra:true,tag:'THE POLICE',q:'Mrs. Jones never calls the police. Think about a Black teenager arrested in an American city in 1958. What might have happened to Roger? Hughes never says Roger\u2019s race. Why might he leave it unsaid?',frame:'If she called the police, Roger might ___. Hughes does not say his race because ___.'},
 {t:'q',id:'k5',extra:true,tag:'POLITE OR THANKFUL?',q:'Billy is polite all the time. Roger can only say \u201cThank you, ma\u2019am.\u201d Is being polite the same as being thankful?',frame:'Polite means ___. Thankful means ___. ___ is really thankful.'},
 {t:'q',id:'k6',extra:true,tag:'SWAP THE BOYS',q:'Write 5–8 sentences: Billy rings Mrs. Jones\u2019s doorbell. OR: Roger tries to grab the landlady\u2019s purse. What happens?',frame:'Billy rings the bell. Mrs. Jones opens the door and ___.'}
]},
{id:'papa',chip:'⭐ Papaoutai',title:'⭐ Papaoutai: the boy who freezes',blocks:[
 {t:'html',pic:ART.C.couch,html:'<p><b>\u201cPapaoutai\u201d</b> is a 2013 song by Stromae. The title means <b>\u201cDad, where are you?\u201d</b> in French. <button class="spk" data-say="Papaoutai is a 2013 song by Stromae. The title means Dad, where are you, in French.">🔊</button></p><p>Stromae\u2019s mother is from Belgium (white European, like Dahl). His father was from Rwanda (Black African). His father was mostly gone, and he was killed in the 1994 genocide in Rwanda when Stromae was a boy.</p><p>In the video, a father sits stiff and still, like a store mannequin. His son dances and tries everything to make him move. At the end, the boy sits down beside his father — and freezes in the same pose.</p><p><a href="https://www.youtube.com/watch?v=oiKj0Z_Xnjc" target="_blank" rel="noopener">▶ Watch the video (YouTube)</a></p>'},
 {t:'mc',id:'pp1',extra:true,tag:'REVIEW',q:'What does the boy do at the end of the video?',opts:['He sits and freezes just like his father.','He runs away from home.','He makes his father dance.','He calls his mother.'],ans:0,why:'He copies the only thing his father showed him: not moving.',hint:'Look at the picture.'},
 {t:'mc',id:'pp2',extra:true,tag:'CONNECT',q:'In The Landlady, what else is frozen and never moves again?',opts:['the dog and the parrot','the piano','the tea','the guest book'],ans:0,why:'The pets are stuffed. Billy will probably be next. Frozen, like the boy on the couch.',hint:'Billy thinks they are alive at first.'},
 {t:'q',id:'pp3',extra:true,tag:'BIG QUESTION',q:'Billy ends up frozen. The Papaoutai boy ends up frozen. Roger walks out the door, moving. Which adults freeze a boy, and which adult moves him?',frame:'The ___ freezes a boy because ___. Mrs. Jones moves Roger because ___.'},
 {t:'q',id:'pp4',extra:true,tag:'CONNECT',q:'The fathers are missing in both stories. In Papaoutai, the father is right there on the couch — and still missing. How can a father be there and missing at the same time?',frame:'A father can be there and still missing when ___.'}
]},
{id:'sbm',chip:'⭐ Stand By Me',title:'⭐ Stand By Me: the same boys again',blocks:[
 {t:'html',pic:ART.C.tracks,html:'<p>Remember the four boys walking on the railroad tracks? Look at the missing and broken fathers. <button class="spk" data-say="Remember the four boys walking on the railroad tracks? Look at the missing and broken fathers.">🔊</button></p><p><b>Chris</b> comes from a family everyone calls bad. People think he is a thief (the milk money). But he is the kindest boy in the group — like <b>Roger</b>.</p><p><b>Gordie</b> is the good student. His parents are so sad about his dead brother that they do not see him. He is polite and easy to miss — like <b>Billy</b>.</p><p><b>Teddy</b>\u2019s father burned his ear on a stove. Teddy still loves him and fights anyone who says a bad word about him — like the <b>Papaoutai boy</b>, who keeps trying to reach a father who is not there.</p><p>Chris tells Gordie he is a real writer and must not waste it. Chris believes in Gordie the way Mrs. Jones believes in Roger. Gordie grows up to be a writer.</p>'},
 {t:'mc',id:'sb1',extra:true,tag:'CONNECT',q:'Who in Stand By Me is most like Roger?',opts:['Chris','Gordie','Teddy','Vern'],ans:0,why:'Everyone expects Chris to be a thief, but he has a good heart — like Roger.',hint:'The milk money.'},
 {t:'mc',id:'sb2',extra:true,tag:'CONNECT',q:'Who is a \u201cMrs. Jones\u201d for Gordie — the person who believes in him?',opts:['Chris','Gordie\u2019s father','Teddy','Ace'],ans:0,why:'Chris sees what Gordie can be, the way Mrs. Jones sees what Roger can be.',hint:'Who says Gordie should be a writer?'},
 {t:'mc',id:'sb3',extra:true,tag:'INFER',q:'Teddy\u2019s father hurt him badly. How does Teddy feel about his father?',opts:['He still loves him and defends him.','He hates him and never talks about him.','He does not remember him.','He wants to move far away from him.'],ans:0,why:'Like the Papaoutai boy, Teddy keeps reaching for a father who hurts him or is not there.',hint:'What does Teddy do when someone insults his dad?'},
 {t:'q',id:'sb4',extra:true,tag:'BIG QUESTION',q:'Billy, Roger, the Papaoutai boy, Gordie, Chris and Teddy all have a missing or broken father. In these stories, who helps a boy grow up when the father is missing?',frame:'When the father is missing, ___ helps a boy grow up. For example, ___.'}
]},
{id:'cross',chip:'⭐ A poem',title:'⭐ \u201cCross\u201d — a poem by Langston Hughes (1925)',blocks:[
 {t:'html',html:'<p class="dr">Hughes wrote this short poem when he was young. The speaker has a white father and a Black mother. Read it out loud.</p><div class="poem" translate="no">My old man\u2019s a white old man<br>And my old mother\u2019s black.<br>If ever I cursed my white old man<br>I take my curses back.<br><br>If ever I cursed my black old mother<br>And wished she were in hell,<br>I\u2019m sorry for that evil wish<br>And now I wish her well.<br><br>My old man died in a fine big house.<br>My ma died in a shack.<br>I wonder where I\u2019m gonna die,<br>Being neither white nor black?</div><p><button class="spk" data-say="My old man\u2019s a white old man, and my old mother\u2019s black. If ever I cursed my white old man, I take my curses back. If ever I cursed my black old mother, and wished she were in hell, I\u2019m sorry for that evil wish, and now I wish her well. My old man died in a fine big house. My ma died in a shack. I wonder where I\u2019m gonna die, being neither white nor black?">🔊 Hear the poem</button></p>'},
 {t:'mc',id:'cr1',extra:true,tag:'REVIEW',q:'Where does the father die? Where does the mother die?',opts:['the father in a big house, the mother in a shack','both in a big house','both in a shack','the father in a shack, the mother in a big house'],ans:0,why:'The two parents end their lives in two different worlds — rich and poor.',hint:'Read the last stanza.'},
 {t:'mc',id:'cr2',extra:true,tag:'INFER',q:'What does the speaker wonder at the end?',opts:['Where he belongs, because he is both and neither.','How to make money.','Where his father went.','Why his mother was angry.'],ans:0,why:'He is the child of two worlds and does not know which one will take him in.',hint:'Read the last two lines.'},
 {t:'q',id:'cr3',extra:true,tag:'CONNECT',q:'Stromae\u2019s mother is white European and his father was Black African, like the speaker\u2019s parents in \u201cCross\u201d. Both lost their fathers. What do the poem and the song have in common?',frame:'Both the poem and the song ___.'}
]},
{id:'final',chip:'Your paragraph',title:'Your paragraph',blocks:[

 {t:'q',id:'f1',tag:'WRITE',min:30,qe:'Which boy ends up better, Billy or Roger? Why? Give one detail from each story. (5–7 sentences)',q:'Which boy ends up better, Billy or Roger, and why? Use at least one detail from each story, and explain what the woman does that makes the difference.',frame:'Roger ends up better than Billy because ___. In The Landlady, ___. In Thank You, Ma\u2019am, ___. The difference is that ___.'}
]}
]}

function cacheGet(src,lg){return fetch(SUPA+'/rest/v1/song_tr?select=equiv&slug=eq.'+enc(TRSLUG)+'&lang=eq.'+enc(lg)+'&src=eq.'+enc(src),{headers:H()}).then(function(r){return r.ok?r.json():[];}).then(function(j){return (j&&j[0]&&j[0].equiv)||'';}).catch(function(){return '';});}
function cachePut(src,lg,v){try{fetch(SUPA+'/rest/v1/song_tr?on_conflict=slug,lang,src',{method:'POST',headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([{slug:TRSLUG,lang:lg,src:src,equiv:v,meaning:'',note:''}])});}catch(e){}}
var trMem={};
function trVia(src,meaning,mode,cb){var lg=lang();if(!lg||lg==='en'){cb('');return;}var k=lg+'|'+src;if(trMem[k]!=null){cb(trMem[k]);return;}
 cacheGet(src,lg).then(function(c){if(c){trMem[k]=c;cb(c);return;}
  fetch(PROXY+'?action=translate'+(mode?'&mode='+mode:'')+'&idiom='+enc(src)+'&meaning='+enc(meaning||'')+'&lang='+enc(lg)).then(function(r){return r.json();}).then(function(d){var t=d&&d.translation;var v=(t&&typeof t==='object')?(t.equiv||t.meaning||''):(t||'');
   if(v&&v.trim().toLowerCase()===String(src).trim().toLowerCase())v='';  /* English echoed back = a miss */
   trMem[k]=v;if(v)cachePut(src,lg,v);cb(v);}).catch(function(){cb('');});});}
function trText(text,cb){trVia(text,'','sentence',cb);}
function trWord(word,meaning,cb){trVia(word,meaning,'',cb);}

 var src=el.getAttribute('data-src')||el.textContent.trim();if(!src)return;trText(src,function(v){if(!v)return;var d=document.createElement('div');d.className='trl';d.setAttribute('translate','no');d.textContent=v;if(/^ar|^ur|^ary/.test(lang()))d.dir='rtl';el.after(d);});});}

/* ---------- shuffle (stored, no 4-in-a-row same slot) ---------- */
var lastSlots=[];
function orderFor(id,n,ans){var m=S.mc[id]=S.mc[id]||{};if(m.order&&m.order.length===n)return m.order;var o,tries=0;
 do{o=[];for(var i=0;i<n;i++)o.push(i);for(var j=n-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=o[j];o[j]=o[r];o[r]=t;}tries++;}
 while(ans!=null&&tries<20&&lastSlots.length>=3&&lastSlots.slice(-3).every(function(s){return s===o.indexOf(ans);}));
 if(ans!=null)lastSlots.push(o.indexOf(ans));m.order=o;return o;}

var ITEMS=[];  /* {id, sec, kind, core, label, el} */
function itemDone(it){if(it.kind==='mc'){var m=S.mc[it.id];return !!(m&&m.done);} if(it.kind==='q'){var a=String(S.q[it.id]||'').trim();return a.split(/\s+/).filter(Boolean).length>=(it.min||3)&&mstate(it.id)!=='x';} if(it.kind==='rec'){return !!S.rec[it.id];} if(it.kind==='sort'){return !!(S.sort[it.id]&&S.sort[it.id].done);} if(it.kind==='ctl'){return !!S.ctl[it.id];} return false;}
function counts(sec){var d=0,t=0;ITEMS.forEach(function(it){if(sec&&it.sec!==sec)return;if(!it.core)return;if(it.hard&&S.mode==='easy')return;if(it.kind==='sort'){t+=it.n;d+=Math.min(it.n,(S.sort[it.id]&&S.sort[it.id].i)||0);return;}t++;if(itemDone(it))d++;});return {d:d,t:t};}
function scoreAll(){var c=counts(null);var x=0;ITEMS.forEach(function(it){if(!it.core&&it.kind!=='ctl'&&!it.ctl&&itemDone(it))x++;});window.GAL_SCORE=Math.min(c.t,c.d+x);window.GAL_MAX=c.t;return {d:c.d,t:c.t,x:x};}

 var h='';for(var i=P.b[p-1];i<P.b[p];i++){var n=i+1;var sg=S.sig[n]||'';h+='<div class="para hl-'+(S.hl[n]||'none')+'" data-n="'+n+'"><button class="pnum" data-pn="'+n+'" title="tap to colour">'+n+'</button><p translate="no">'+tapify(P.paras[i])+' '+spk(P.paras[i])+'</p><div class="sig"><button class="sg sg-t'+(/t/.test(sg)?' on':'')+'" data-sg="t" data-n="'+n+'" title="tough">✊</button><button class="sg sg-k'+(/k/.test(sg)?' on':'')+'" data-sg="k" data-n="'+n+'" title="kind">☀</button></div></div>';}
 el.innerHTML=h;});}
document.addEventListener('click',function(e){var hb=e.target.closest('[data-hl]');if(hb){var hid=hb.closest('[data-help]').getAttribute('data-help');if(!TV){S.help[hid]=hb.getAttribute('data-hl');changed();}eachQ(function(b){if(b.id===hid)paintHelp(b);});return;}var rb=e.target.closest('[data-rec]');if(rb){recClick(rb.getAttribute('data-rec'),rb);return;}});
document.addEventListener('click',function(e){var pn=e.target.closest('.pnum');if(pn&&!TV){var n=pn.getAttribute('data-pn');var cyc=['none','y','p','b'];var c=S.hl[n]||'none';S.hl[n]=cyc[(cyc.indexOf(c)+1)%4];if(S.hl[n]==='none')delete S.hl[n];pn.parentElement.className='para hl-'+(S.hl[n]||'none');changed();return;}
 var sg=e.target.closest('.sg');if(sg&&!TV){var n2=sg.getAttribute('data-n'),k=sg.getAttribute('data-sg');var v=S.sig[n2]||'';v=v.indexOf(k)>=0?v.replace(k,''):v+k;if(v)S.sig[n2]=v;else delete S.sig[n2];sg.classList.toggle('on');changed();return;}
 var o=e.target.closest('.opt');if(o){var id=o.parentElement.getAttribute('data-mc');clickMC(findMC(id),+o.getAttribute('data-i'));return;}
 var bn=e.target.closest('.bin');if(bn){clickSort(findSort(bn.parentElement.getAttribute('data-bins')),+bn.getAttribute('data-bin'));return;}
 var ch=e.target.closest('.chip');if(ch){if(ch.classList.contains('locked')){flash('🔒 Finish the part before this one first.');return;}show(ch.getAttribute('data-sec'));return;}
 var g=e.target.closest('[data-go]');if(g){var t=g.getAttribute('data-go');var c=$('.chip[data-sec="'+t+'"]');if(c&&c.classList.contains('locked')){flash('Answer a few more first — the line under the chips says what is next.');return;}show(t);window.scrollTo(0,0);return;}
 var md=e.target.closest('[data-mode]');if(md){S.mode=md.getAttribute('data-mode');applyMode();changed();}});
document.addEventListener('input',function(e){var t=e.target;if(t.matches('textarea[data-q]')&&!TV){S.q[t.getAttribute('data-q')]=t.value;wc(t);paintMarks();changed();}});
document.addEventListener('change',function(e){var c=e.target;if(c.matches('input[data-ctl]')&&!TV){var id=c.getAttribute('data-ctl');var v=S.ctl[id]=S.ctl[id]||{k:{}};v.k[c.getAttribute('data-k')]=c.checked;var all=$$('input[data-ctl="'+id+'"]').every(function(x){return x.checked;});if(all)v.done=1;changed();}
 if(c.id==='lang'){try{localStorage.setItem('vocab_lang',c.value);}catch(e){}translateDirs();translateCards();}});
function flash(t){var f=$('#flash');f.textContent=t;f.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(function(){f.hidden=true;},2600);}
function applyMode(){document.body.classList.toggle('mode-easy',S.mode==='easy');document.body.classList.toggle('mode-hard',S.mode!=='easy');$$('[data-mode]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-mode')===S.mode);});}
function show(id){S.sec=id;$$('.sec').forEach(function(s){s.hidden=s.id!=='sec-'+id;});$$('.chip').forEach(function(c){c.classList.toggle('cur',c.getAttribute('data-sec')===id);});refresh();}

/* ---------- chips, locks, progress, next step + green arrow ---------- */
var ARROW='<svg class="nxa" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 4 L20 12 L4 20 L8 12 Z" fill="#1f7a4d"/></svg>';
function refresh(){var prevOk=true;D.sections.forEach(function(s,i){var c=counts(s.id),chip=$('.chip[data-sec="'+s.id+'"]');var full=c.t===0||c.d>=c.t;
  chip.querySelector('.ccount').textContent=c.t?(c.d+'/'+c.t):'';chip.classList.toggle('full',c.t>0&&full);chip.querySelector('.cname').textContent=(full&&c.t?'✓ ':'')+s.chip;
  var lock=!OPEN&&!TV&&!prevOk;chip.classList.toggle('locked',lock);if(lock&&chip.querySelector('.cname').textContent.indexOf('🔒')<0)chip.querySelector('.cname').textContent='🔒 '+s.chip;
  prevOk=prevOk&&(c.t===0||c.d/c.t>=0.7);
  var need=$('#sec-'+s.id+' .need');if(need){var left=Math.max(0,Math.ceil(c.t*0.7)-c.d);need.textContent=left>0?('Answer '+left+' more to continue'):(c.d<c.t?'You can go on — finish the rest later.':'');}});
 var all=scoreAll();$('#bar i').style.width=(all.t?Math.round(100*all.d/all.t):0)+'%';$('#barlab').textContent=all.d+' / '+all.t+(all.x?' · ⭐ '+all.x+' extra':'');
 nextStep();}
function nextStep(){$$('.nxa').forEach(function(a){a.remove();});var line=$('#next');var cur=S.sec;var target=null,txt='';
 for(var i=0;i<ITEMS.length;i++){var it=ITEMS[i];if(it.sec!==cur||(!it.core&&it.kind!=='ctl'))continue;if(it.hard&&S.mode==='easy')continue;if(!itemDone(it)){target=$('[data-item="'+it.id+'"]');txt=it.kind==='ctl'?'Start here — try the tools in the yellow box':it.kind==='q'?'Next: write your answer':it.kind==='sort'?'Next: sort the cards':'Next: answer the question';break;}}
 if(!target){var idx=D.sections.findIndex(function(s){return s.id===cur;});var nx=D.sections[idx+1];var allDone=counts(null);
  if(nx){target=$('#sec-'+cur+' .go');txt='Next: go to '+nx.chip.replace(/<[^>]+>/g,'');}else if(allDone.d<allDone.t){var fs=D.sections.find(function(s){var c=counts(s.id);return c.d<c.t;});target=$('.chip[data-sec="'+fs.id+'"]');txt='Next: finish '+fs.chip;}else{txt='You finished this part.';}}
 line.querySelector('.ntxt').textContent=txt;line.querySelector('.ntxt').setAttribute('data-src',txt);line.querySelector('.ntxt').removeAttribute('data-trd');translateDirs(line);
 if(target){var a=document.createElement('span');a.innerHTML=ARROW;var svgEl=a.firstChild;if(target.classList.contains('go')||target.classList.contains('chip')){target.parentElement.insertBefore(svgEl,target);}else{var hd=target.querySelector('.ihead')||target;hd.insertBefore(svgEl,hd.firstChild);}}}

/* ---------- save / load (load first; never save before load) ---------- */
function payload(){var qs=[];ITEMS.forEach(function(it){if(it.kind==='q')qs.push({id:it.id,a:S.q[it.id]||''});});var sc=scoreAll();
 return {mc:S.mc,q:S.q,sort:S.sort,hl:S.hl,sig:S.sig,ctl:S.ctl,help:S.help,rec:S.rec,mode:S.mode,sec:S.sec,questions:qs,meta:{answered:sc.d,total:sc.t,extra:sc.x,lang:lang()}};}
function row(){var p=payload();return {email:student.email,student_name:student.name,period:student.period,guide_key:D.key,mode:S.mode,lang:lang(),payload:p,answered:p.meta.answered,total:p.meta.total,updated_at:new Date().toISOString()};}
function status(cls,t){var s=$('#save');s.className='save '+cls;s.textContent=t;}
function changed(){refresh();if(!student||TV)return;dirty=true;if(!LOADED)return;status('wait','Saving…');clearTimeout(saveT);saveT=setTimeout(push,900);}
function push(keep){if(!student||!LOADED||TV)return;saveT=null;scoreAll();dirty=false;
 return fetch(SUPA+'/rest/v1/'+TABLE+'?on_conflict=email,guide_key',{method:'POST',keepalive:!!keep,headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([row()])})
 .then(function(r){if(r.ok)status('ok','Saved '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));else{dirty=true;status('bad','Not saved — check internet');}}).catch(function(){dirty=true;status('bad','Not saved — check internet');});}
function flush(){if(saveT||dirty){clearTimeout(saveT);if(student&&LOADED&&!TV)push(true);}}
window.addEventListener('pagehide',flush);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush();});
function lp(e){return String(e||'').trim().toLowerCase().split('@')[0];}
function load(){var l=lp(student.email);status('wait','Loading your work…');
 return fetch(SUPA+'/rest/v1/'+TABLE+'?select=payload,marks,updated_at&guide_key=eq.'+encodeURIComponent(D.key)+'&email=in.('+encodeURIComponent(l+'@s.sfusd.edu')+','+encodeURIComponent(l+'@sfusd.edu')+')&order=updated_at.desc',{headers:H()})
 .then(function(r){if(!r.ok)throw new Error('load '+r.status);return r.json();}).then(function(rows){var p=rows&&rows[0]&&rows[0].payload;MARKS=(rows&&rows[0]&&rows[0].marks)||{};
  if(p){['mc','q','sort','hl','sig','ctl','help','rec'].forEach(function(k){if(p[k]&&typeof p[k]==='object')S[k]=p[k];});if(p.mode)S.mode=p.mode;if(p.sec)S.sec=p.sec;}
  LOADED=true;$('#srv').hidden=true;status('ok','Ready');render();if(dirty)changed();})
 .catch(function(){$('#srv').hidden=false;status('bad','Can’t reach the server');setTimeout(load,5000);});}

/* ---------- sign-in ---------- */
function start(){var f=$('#first').value.trim(),l=$('#last').value.trim(),e=$('#email').value.trim().toLowerCase(),p=$('#period').value,lg=$('#lang').value;var err=$('#gerr');
 if(!f||!l){err.textContent='Type your first and last name.';return;} if(!/^[^@\s]+@(s\.)?sfusd\.edu$/.test(e)){err.textContent='Use your school email (…@s.sfusd.edu).';return;}
 if(!p){err.textContent='Pick your period.';return;} if(!lg){err.textContent='Pick your language.';return;}
 try{localStorage.setItem('vocab_lang',lg);}catch(x){}
 student={name:f+' '+l,email:e,period:p};$('#gate').hidden=true;$('#app').hidden=false;$('#who').textContent=student.name+' · P'+p;load();}
window.TYMA={start:start};
document.addEventListener('DOMContentLoaded',function(){
 $('#gstart').addEventListener('click',start);$('#gate').addEventListener('keydown',function(e){if(e.key==='Enter')start();});
 try{var v=localStorage.getItem('vocab_lang');if(v&&$('#lang').querySelector('option[value="'+v+'"]'))$('#lang').value=v;}catch(e){}
 if(TV&&Q.get('email')){student={name:'(teacher view)',email:Q.get('email'),period:''};$('#gate').hidden=true;$('#app').hidden=false;$('#who').textContent='👀 Teacher view · '+Q.get('email');$('#tvbar').hidden=false;load();}
});
})();
