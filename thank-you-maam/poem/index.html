function payload(){var qs=[];ITEMS.forEach(function(it){if(it.kind==='q')qs.push({id:it.id,a:S.q[it.id]||''});});var sc=scoreAll();
 return {mc:S.mc,q:S.q,sort:S.sort,hl:S.hl,sig:S.sig,ctl:S.ctl,help:S.help,rec:S.rec,mode:S.mode,sec:S.sec,questions:qs,meta:{answered:sc.d,total:sc.t,extra:sc.x,lang:lang()}};}
function row(){var p=payload();return {email:student.email,student_name:student.name,period:student.period,guide_key:D.key,mode:S.mode,lang:lang(),payload:p,answered:p.meta.answered,total:p.meta.total,updated_at:new Date().toISOString()};}
function status(cls,t){var s=$('#save');s.className='save '+cls;s.textContent=t;}
function changed(){refresh();if(!student||TV)return;dirty=true;if(!LOADED)return;status('wait','Saving…');clearTimeout(saveT);saveT=setTimeout(push,900);}
function push(keep){if(!student||!LOADED||TV)return;saveT=null;scoreAll();dirty=false;
 return fetch(SUPA+'/rest/v1/'+TABLE+'?on_conflict=email,guide_key',{method:'POST',keepalive:!!keep,headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([row()])})
 .then(function(r){if(r.ok)status('ok','Saved '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));else{dirty=true;status('bad','Not saved — check internet');}}).catch(function(){dirty=true;status('bad','Not saved — check internet');});}
function flush(){if(saveT||dirty){clearTimeout(saveT);if(student&&LOADED&&!TV)push(true);}}
window.addEventListener('pagehide',flush);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush();});
function lp(e){return String(e||'').trim().toLowerCase().split('@')[0];}
function load(){var l=lp(student.email);status('wait','Loading your work…');
 return fetch(SUPA+'/rest/v1/'+TABLE+'?select=payload,marks,updated_at&guide_key=eq.'+encodeURIComponent(D.key)+'&email=in.('+encodeURIComponent(l+'@s.sfusd.edu')+','+encodeURIComponent(l+'@sfusd.edu')+')&order=updated_at.desc',{headers:H()})
 .then(function(r){if(!r.ok)throw new Error('load '+r.status);return r.json();}).then(function(rows){var p=rows&&rows[0]&&rows[0].payload;MARKS=(rows&&rows[0]&&rows[0].marks)||{};
  if(p){['mc','q','sort','hl','sig','ctl','help','rec'].forEach(function(k){if(p[k]&&typeof p[k]==='object')S[k]=p[k];});if(p.mode)S.mode=p.mode;if(p.sec)S.sec=p.sec;}
  LOADED=true;$('#srv').hidden=true;status('ok','Ready');render();if(dirty)changed();})
 .catch(function(){$('#srv').hidden=false;status('bad','Can’t reach the server');setTimeout(load,5000);});}

/* ---------- sign-in ---------- */
function start(){var f=$('#first').value.trim(),l=$('#last').value.trim(),e=$('#email').value.trim().toLowerCase(),p=$('#period').value,lg=$('#lang').value;var err=$('#gerr');
 if(!f||!l){err.textContent='Type your first and last name.';return;} if(!/^[^@\s]+@(s\.)?sfusd\.edu$/.test(e)){err.textContent='Use your school email (…@s.sfusd.edu).';return;}
 if(!p){err.textContent='Pick your period.';return;} if(!lg){err.textContent='Pick your language.';return;}
 try{localStorage.setItem('vocab_lang',lg);}catch(x){}
 student={name:f+' '+l,email:e,period:p};$('#gate').hidden=true;$('#app').hidden=false;$('#who').textContent=student.name+' · P'+p;load();}
window.TYMA={start:start};
document.addEventListener('DOMContentLoaded',function(){
 $('#gstart').addEventListener('click',start);$('#gate').addEventListener('keydown',function(e){if(e.key==='Enter')start();});
 try{var v=localStorage.getItem('vocab_lang');if(v&&$('#lang').querySelector('option[value="'+v+'"]'))$('#lang').value=v;}catch(e){}
 if(TV&&Q.get('email')){student={name:'(teacher view)',email:Q.get('email'),period:''};$('#gate').hidden=true;$('#app').hidden=false;$('#who').textContent='👀 Teacher view · '+Q.get('email');$('#tvbar').hidden=false;load();}
});
})();
