<style>
:root{--pine:#1b4332;--pine2:#2d6a4f;--moss:#40916c;--sage:#95d5b2;--paper:#faf7f0;

*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px}
.hide{display:none!important}
#bar{position:sticky;top:0;z-index:40;background:var(--pine);color:#fff;padding:9px 14px;
     display:flex;gap:9px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#bar .brand{font-weight:800;margin-right:auto}
#bar .brand small{display:block;font-weight:600;font-size:.68rem;opacity:.75;letter-spacing:.6px}
#bar button,#bar a{font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;background:rgba(255,255,255,.14);
  color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;text-decoration:none}
#bar button:hover,#bar a:hover{background:rgba(255,255,255,.26)}
main{max-width:1280px;margin:0 auto;padding:18px 14px 70px}
.gate{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center}
.gate input{font-family:inherit;font-size:1.05rem;padding:10px 13px;border:1px solid var(--line);border-radius:9px;width:100%;margin:12px 0;text-align:center}
.btn{font-family:inherit;font-size:.88rem;font-weight:800;cursor:pointer;border:none;border-radius:9px;padding:9px 16px;background:var(--pine2);color:#fff;margin:3px 5px 3px 0}
.btn:hover{background:var(--pine)}
.err{color:var(--rust);font-weight:800}
#filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 14px}
#filters label{font-weight:800;font-size:.84rem;color:var(--pine2)}
#filters select,#filters input[type=search]{font-family:inherit;font-size:.9rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.stats{display:flex;gap:11px;flex-wrap:wrap;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 17px;min-width:130px}
.stat b{display:block;font-size:1.7rem;color:var(--pine);line-height:1.15}
.stat span{font-size:.76rem;color:var(--muted);font-weight:700}
.tw{overflow-x:auto;border-radius:11px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);min-width:1100px}
th{background:var(--pine);color:#fff;font-size:.72rem;font-weight:800;padding:8px 6px;text-align:center;white-space:nowrap;cursor:pointer}
th.l,td.l{text-align:left;padding-left:12px}
td{padding:7px 6px;text-align:center;border-top:1px solid var(--line);font-size:.86rem;font-weight:700}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--sky)}
.pct{display:inline-block;min-width:38px;padding:2px 6px;border-radius:12px;font-size:.78rem;font-weight:800}
.p100{background:#d8f0e2;color:#1b4332}.p70{background:#fdf6e3;color:#7a5c00}.p0{background:#fbeae5;color:#8a2f10}.pna{background:#f0f2ef;color:#98a49c}
.stmt{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.72rem;font-weight:800;white-space:nowrap}
.stmt.done{background:#d8f0e2;color:#1b4332}.stmt.wip{background:#fdf6e3;color:#7a5c00}
.name{font-weight:800;color:var(--pine)}
.sub{font-size:.74rem;color:var(--muted);font-weight:600}
#detail{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px 22px;margin-top:16px}
#detail h2{margin:0 0 3px;color:var(--pine)}
#detail h3{margin:20px 0 6px;color:var(--pine2);font-size:1rem;border-bottom:2px solid var(--sage);padding-bottom:3px}
.wrongitem{background:#fdf3f0;border-left:4px solid #e3a58f;border-radius:7px;padding:7px 12px;margin:5px 0;font-size:.88rem}
.wrongitem .gave{color:var(--rust);font-weight:800}.wrongitem .want{color:var(--moss);font-weight:800}
.para{background:#fffef7;border:1px solid var(--line);border-radius:9px;padding:16px 22px;line-height:1.95;font-size:1rem;white-space:pre-wrap;margin:7px 0}
.para .pt{text-align:center;font-weight:800;margin-bottom:11px}
.para .body{text-indent:2.4em}
.mono{font-size:.9rem;white-space:pre-wrap;background:#f6f8f5;border-radius:8px;padding:11px 14px;line-height:1.6}
.notes{border-collapse:collapse;min-width:0;width:100%}
.notes td{text-align:left;font-weight:600;border-top:1px solid var(--line);padding:5px 8px}
.notes td:first-child{color:var(--muted);width:40%}
.caps span{padding:0 1px}
.caps .miss{background:#fbeae5;color:#8a2f10;font-weight:800;border-radius:4px}
.caps .extra{background:#fdf6e3;color:#7a5c00;font-weight:800;border-radius:4px}
.caps .good{color:var(--moss);font-weight:800}
.chk{font-size:.9rem;margin:3px 0}
.legend{font-size:.8rem;color:var(--muted);font-weight:700;margin:8px 0}
</style>

var CAPTEXT='my name is amina hassan, and i was born in hargeisa, somalia. i moved to san francisco in january with my mother and my two brothers. at home we speak somali and arabic, but i study english every morning at galileo academy. my favorite class is biology, and i also like my spanish class. someday i want to be a doctor like doctor yusuf, the woman who took care of my grandmother. last summer my brothers and i went to ocean beach for the first time, and we put our feet in the pacific ocean. it was freezing!';

var CAPIDX=[0,3,4,6,10,11,12,15,16,18,26,30,32,34,36,40,41,42,48,52,54,55,62,63,72,77,80,81,93,94,95];

var PAT=[

 {t:'The corner store opens at seven.',a:0},
 {t:'My aunt calls me every Sunday and sends me pictures.',a:2}
];
var PATO=['SV','SSV','SVV','SSVV'];

var ANDOR=[

];

(function(){
var SUPA_URL = 'https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PASSWORD = 'galileo2026', TABLE = 'eld103_u1';
function $(id){ return document.getElementById(id); }
function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function plain(t){ return String(t || '').replace(/\|/g, ''); }
function words(t){ return String(t || '').trim().split(/\s+/).filter(Boolean).length; }
function hdr(){ return { apikey:SUPA_KEY, Authorization:'Bearer ' + SUPA_KEY }; }
function key(e){ return String(e || '').trim().toLowerCase().split('@')[0]; }

var NOTE_LABELS = ['First name and family name','City and country','Time in the United States','Languages','Who they live with',
  'Classes this year','Free time / what they like','A goal for the future','One surprising thing'];
var TAGW = function(i){ return TAG[i].t.split(' '); };

/* ---------------- sections ---------------- */
function choiceSection(k, title, short, set, opts, off, field){
  return { k:k, title:title, short:short, grade:function(p){
    var got = 0, tot = 0, wrong = [];
    for (var i = 0; i < set.length; i++){
      var g = p.ans[k + i]; if (g === undefined || g === null) continue;
      tot++;
      var want = set[i].a - (off || 0), o = opts || set[i].o;
      if (g === want) got++;
      else wrong.push({ q:plain(set[i][field || 't'] || set[i].q), gave:o[g], want:o[want] });
    }
    return { got:got, tot:tot, of:set.length, wrong:wrong };
  } };
}
var SECTIONS = [
  choiceSection('pol', '1. Polite questions', 'Polite', POLITE, ['OK to ask','Better not to ask'], 0, 'q'),
  choiceSection('frm', '2A. Parts of a paragraph', 'Parts', FORMQ, null, 0, 'q'),
  { k:'bad', title:'2B. What went wrong?', short:'Wrong?', grade:function(p){
      var got = 0, tot = 0, wrong = [], touched = BADQ.some(function(b, i){ return p.ans['bad' + i] !== undefined; });
      if (!touched) return { got:0, tot:0, of:BADQ.length, wrong:[] };
      BADQ.forEach(function(b, i){ tot++; var g = !!p.ans['bad' + i];
        if (g === !!b.a) got++; else wrong.push({ q:b.t, gave:g ? 'checked' : 'not checked', want:b.a ? 'checked (it is a problem)' : 'not checked' }); });
      return { got:got, tot:tot, of:BADQ.length, wrong:wrong };
  } },
  { k:'sn', title:'3. Sentence or fragment?', short:'S / F', grade:function(p){
      var got = 0, tot = 0, wrong = [], SF = ['Sentence','Fragment'];
      SENT.forEach(function(s, i){
        var g = p.ans['sn' + i]; if (g === undefined || g === null) return;
        tot++; if (g === s.a) got++; else wrong.push({ q:s.t, gave:SF[g], want:SF[s.a] });
        if (s.a === 1 && g === 1){
          tot++; var w = p.ans['wy' + i];
          if (w === s.w) got++; else wrong.push({ q:s.t + ' (what is missing?)', gave:w == null ? 'no answer' : WHYO[w], want:WHYO[s.w] });
        }
      });
      return { got:got, tot:tot, of:SENT.length, wrong:wrong };
  } },
  { k:'tg', title:'4. Subjects and verbs', short:'S & V', grade:function(p){
      var got = 0, tot = 0, wrong = [];
      TAG.forEach(function(t, i){
        var ws = TAGW(i), any = false, ok = true, gave = [], want = [];
        ws.forEach(function(w, j){
          var g = p.ans['tg' + i + '_' + j] || '', wnt = t.s.indexOf(j) >= 0 ? 'S' : (t.v.indexOf(j) >= 0 ? 'V' : '');
          if (g) any = true; if (g !== wnt) ok = false;
          gave.push(g ? w + '(' + g + ')' : w); want.push(wnt ? w + '(' + wnt + ')' : w);
        });
        if (!any) return;
        tot++; if (ok) got++; else wrong.push({ q:t.t, gave:gave.join(' '), want:want.join(' ') });
      });
      return { got:got, tot:tot, of:TAG.length, wrong:wrong };
  } },
  choiceSection('vb', '5. Action or linking verb', 'Verbs', VERB, ['Action','Linking']),
  choiceSection('pc', '6. End punctuation', 'Punct.', PUNC, ['.','?','!']),
  choiceSection('cr', '7A. Which capital rule?', 'Cap rule', CAPR, ['Rule 1','Rule 2','Rule 3','Rule 4','Rule 5'], 1),
  { k:'caps', title:'7B. Fix the capitals', short:'Caps', grade:function(p){
      var ws = CAPTEXT.split(' '), caps = p.caps || {}, touched = Object.keys(caps).length > 0;
      if (!touched) return { got:0, tot:0, of:1, wrong:[], found:0 };
      var right = 0, found = 0;
      ws.forEach(function(w, i){ var want = CAPIDX.indexOf(i) >= 0, g = !!caps[i]; if (want === g) right++; if (want && g) found++; });
      var pass = right >= ws.length - 4;
      return { got:pass ? 1 : 0, tot:1, of:1, wrong:[], found:found, pct:Math.round(100 * found / CAPIDX.length) };
  } },
  choiceSection('pt', '8A. Sentence patterns', 'Pattern', PAT, PATO),
  choiceSection('ao', '8B. and / or', 'and/or', ANDOR, ['and','or'])
];

function open(){ $('gate').classList.add('hide'); $('app').classList.remove('hide'); load(); }

/* ---------------- data ---------------- */
var ROWS = [], PERIOD = {}, NAMES = {}, SORT = { k:'name', dir:1 }, OPEN = null;
function load(){
  $('stats').innerHTML = '<div class="stat"><span>Loading&hellip;</span></div>';
  Promise.all([
    fetch(SUPA_URL + '/rest/v1/' + TABLE + '?unit=eq.u1&select=*&order=student_name.asc', { headers:hdr() }).then(function(r){ return r.json(); }),
    fetch(SUPA_URL + '/rest/v1/students?select=*&limit=5000', { headers:hdr() }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
  ]).then(function(res){
    PERIOD = {}; NAMES = {};
    (res[1] || []).forEach(function(s){
      var k = key(s.email);
      if (s.period && !PERIOD[k]) PERIOD[k] = String(s.period);
      var nm = s.name || [s.first_name, s.last_name].filter(Boolean).join(' ');
      if (nm && !NAMES[k]) NAMES[k] = nm;
    });
    ROWS = (Array.isArray(res[0]) ? res[0] : []).map(function(r){
      var p = r.payload || {}; p.ans = p.ans || {}; p.notes = p.notes || {};
      var k = key(r.student_email), sec = {};
      SECTIONS.forEach(function(S){ sec[S.k] = S.grade(p); });
      var notesN = 0; for (var n in p.notes) if ((p.notes[n] || '').trim()) notesN++;
      return { r:r, p:p, k:k, name:r.student_name || NAMES[k] || k, period:PERIOD[k] || '', sec:sec, notes:notesN,
        fw:words(p.free), pw:words(p.para), pct:r.total ? Math.round(100 * r.score / r.total) : 0 };
    });
    render();
    if (!Array.isArray(res[0])) $('stats').innerHTML = '<div class="stat"><span class="err">Could not load ' + TABLE + '. Check the table in Supabase.</span></div>';
  }).catch(function(){ $('stats').innerHTML = '<div class="stat"><span class="err">Could not load. Check your connection.</span></div>'; });
}
function visible(){
  var per = $('fPer').value, q = $('fQ').value.trim().toLowerCase(), turn = $('fTurn').checked;
  return ROWS.filter(function(x){
    if (per && x.period !== per) return false;
    if (turn && !x.r.turned_in) return false;
    if (q && (x.name + ' ' + x.r.student_email).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function pill(s){
  if (!s.tot) return '<span class="pct pna">&mdash;</span>';
  var v = s.k === 'caps' ? s.pct : Math.round(100 * s.got / s.tot);
  return '<span class="pct ' + (v >= 90 ? 'p100' : v >= 60 ? 'p70' : 'p0') + '">' + v + '%</span>';
}
function render(){
  var rows = visible();
  var turned = rows.filter(function(x){ return x.r.turned_in; }).length;
  var avg = rows.length ? Math.round(rows.reduce(function(a, x){ return a + x.pct; }, 0) / rows.length) : 0;
  var paras = rows.filter(function(x){ return x.pw >= 25; }).length;
  $('stats').innerHTML = '<div class="stat"><b>' + rows.length + '</b><span>students started</span></div>'
    + '<div class="stat"><b>' + turned + '</b><span>turned in</span></div>'
    + '<div class="stat"><b>' + avg + '%</b><span>average score</span></div>'
    + '<div class="stat"><b>' + paras + '</b><span>paragraphs of 25+ words</span></div>';
  rows.sort(function(a, b){
    var k = SORT.k, d = SORT.dir, x, y;
    if (k === 'name') return d * a.name.localeCompare(b.name);
    if (k === 'period'){ x = +a.period || 99; y = +b.period || 99; }
    else if (k === 'pct' || k === 'notes' || k === 'fw' || k === 'pw'){ x = a[k]; y = b[k]; }
    else if (k === 'turn'){ x = a.r.turned_in ? 1 : 0; y = b.r.turned_in ? 1 : 0; }
    else if (k === 'upd'){ x = new Date(a.r.updated_at).getTime(); y = new Date(b.r.updated_at).getTime(); }
    else { var sa = a.sec[k], sb = b.sec[k]; x = sa.tot ? sa.got / sa.tot : -1; y = sb.tot ? sb.got / sb.tot : -1; }
    return d * (x - y) || a.name.localeCompare(b.name);
  });
  var h = '<thead><tr><th class="l" data-k="name">Student</th><th data-k="period">Per.</th><th data-k="pct">Score</th>'
    + SECTIONS.map(function(S){ return '<th data-k="' + S.k + '" title="' + esc(S.title) + '">' + esc(S.short) + '</th>'; }).join('')
    + '<th data-k="notes">Notes</th><th data-k="fw">Freewrite</th><th data-k="pw">Paragraph</th><th data-k="turn">Turned in</th><th data-k="upd">Updated</th></tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="' + (8 + SECTIONS.length) + '" class="sub" style="padding:18px">No student work matches.</td></tr>';
  h += rows.map(function(x){
    return '<tr class="row" data-k="' + esc(x.k) + '"><td class="l"><span class="name">' + esc(x.name) + '</span><br><span class="sub">' + esc(x.r.student_email) + '</span></td>'
      + '<td>' + esc(x.period) + '</td><td>' + x.r.score + '/' + x.r.total + '<br><span class="sub">' + x.pct + '%</span></td>'
      + SECTIONS.map(function(S){ var s = x.sec[S.k]; s.k = S.k; return '<td>' + pill(s) + '</td>'; }).join('')
      + '<td>' + x.notes + '/9</td><td>' + x.fw + ' w</td><td>' + x.pw + ' w</td>'
      + '<td>' + (x.r.turned_in ? '<span class="stmt done">&#10003; turned in</span>' : x.pw ? '<span class="stmt wip">writing</span>' : '') + '</td>'
      + '<td class="sub">' + esc(String(x.r.updated_at || '').slice(0, 16).replace('T', ' ')) + '</td></tr>';
  }).join('') + '</tbody>';
  $('tbl').innerHTML = h;
  Array.prototype.forEach.call($('tbl').querySelectorAll('th[data-k]'), function(th){
    th.onclick = function(){ var k = th.getAttribute('data-k'); SORT.dir = SORT.k === k ? -SORT.dir : (k === 'name' || k === 'period' ? 1 : -1); SORT.k = k; render(); };
  });
  Array.prototype.forEach.call($('tbl').querySelectorAll('tr.row'), function(tr){
    tr.onclick = function(){ detail(tr.getAttribute('data-k')); };
  });
  if (OPEN) detail(OPEN, true);
}

/* ---------------- one student ---------------- */
function detail(k, keepScroll){
  var x = ROWS.filter(function(r){ return r.k === k; })[0]; if (!x) return;
  OPEN = k;
  var p = x.p, h = '<h2>' + esc(x.name) + '</h2><div class="sub">' + esc(x.r.student_email) + (x.period ? ' &middot; Period ' + esc(x.period) : '')
    + ' &middot; score ' + x.r.score + '/' + x.r.total + ' (' + x.pct + '%)' + (x.r.turned_in ? ' &middot; turned in' : '') + '</div>';
  /* the writing first: it is the point of the unit */
  h += '<h3>Final paragraph' + (p.prompt >= 0 && PROMPTS[p.prompt] ? ': ' + esc(PROMPTS[p.prompt]) : '') + ' (' + x.pw + ' words)</h3>';
  h += x.pw ? '<div class="para"><div class="pt">' + esc(p.ttl || '(no title)') + '</div><div class="body">' + esc(p.para) + '</div></div>' : '<p class="sub">No paragraph yet.</p>';
  var chk = p.chk || {}, nChk = CHKLIST.filter(function(c, i){ return chk[i]; }).length;
  if (nChk) h += '<div class="sub" style="margin:6px 0">Checklist: ' + nChk + ' of ' + CHKLIST.length + ' checked</div>'
    + CHKLIST.map(function(c, i){ return '<div class="chk">' + (chk[i] ? '&#10003;' : '&#9744;') + ' ' + esc(c) + '</div>'; }).join('');
  h += '<h3>Interview notes (' + x.notes + ' of 9)</h3><table class="notes">' + NOTE_LABELS.map(function(l, i){
    return '<tr><td>' + esc(l) + '</td><td>' + esc(p.notes['n' + (i + 1)] || '') + '</td></tr>'; }).join('') + '</table>';
  if (x.fw) h += '<h3>Freewrite (' + x.fw + ' words)</h3><div class="mono">' + esc(p.free) + '</div>';
  var comb = p.comb || {};
  if (Object.keys(comb).some(function(c){ return (comb[c] || '').trim(); })){
    h += '<h3>Combining sentences</h3>' + COMB.map(function(c, i){
      if (!(comb[i] || '').trim()) return '';
      return '<div class="wrongitem" style="background:#f6f8f5;border-left-color:var(--sage)">' + esc(c.g.join(' ')) + '<br><b>Wrote:</b> ' + esc(comb[i]) + '<br><span class="want">One correct way: ' + esc(c.m) + '</span></div>';
    }).join('');
  }
  SECTIONS.forEach(function(S){
    var s = x.sec[S.k];
    if (S.k === 'caps'){
      if (!s.tot) return;
      var ws = CAPTEXT.split(' '), caps = p.caps || {};
      h += '<h3>' + esc(S.title) + ': found ' + s.found + ' of ' + CAPIDX.length + ' capitals</h3><div class="mono caps">' + ws.map(function(w, i){
        var want = CAPIDX.indexOf(i) >= 0, g = !!caps[i];
        var shown = want ? w.charAt(0).toUpperCase() + w.slice(1) : w;
        return '<span class="' + (want && g ? 'good' : want ? 'miss' : g ? 'extra' : '') + '">' + esc(shown) + '</span>';
      }).join(' ') + '</div><div class="legend"><span class="good">green</span> = found &middot; <span style="color:#8a2f10">red</span> = missed &middot; <span style="color:#7a5c00">gold</span> = capitalized but should not be</div>';
      return;
    }
    if (!s.tot) return;
    h += '<h3>' + esc(S.title) + ': ' + s.got + ' of ' + s.tot + ' right' + (s.tot < s.of ? ' (' + (s.of - s.tot) + ' not answered)' : '') + '</h3>';
    h += s.wrong.length ? s.wrong.map(function(w){
      return '<div class="wrongitem">' + esc(w.q) + '<br>Chose: <span class="gave">' + esc(w.gave) + '</span> &middot; Answer: <span class="want">' + esc(w.want) + '</span></div>';
    }).join('') : '<div class="sub">All correct.</div>';
  });
  $('detail').innerHTML = h; $('detail').classList.remove('hide');
  if (!keepScroll) $('detail').scrollIntoView({ behavior:'smooth', block:'start' });
}

/* ---------------- CSV ---------------- */
$('csvBtn').onclick = function(){
  function q(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  var head = ['name','email','period','score','total','percent'].concat(SECTIONS.map(function(S){ return S.k + '_pct'; }),
    ['notes','freewrite_words','paragraph_words','turned_in','prompt','title','paragraph']);
  var lines = [head.join(',')].concat(visible().map(function(x){
    return [x.name, x.r.student_email, x.period, x.r.score, x.r.total, x.pct].concat(SECTIONS.map(function(S){
      var s = x.sec[S.k]; return s.tot ? (S.k === 'caps' ? s.pct : Math.round(100 * s.got / s.tot)) : '';
    }), [x.notes, x.fw, x.pw, x.r.turned_in ? 1 : 0, PROMPTS[x.p.prompt] || '', x.p.ttl || '', x.p.para || '']).map(q).join(',');
  }));
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type:'text/csv' }));
  a.download = 'eld103-unit1-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
};
['fPer','fTurn'].forEach(function(id){ $(id).onchange = render; });
$('fQ').oninput = render;
$('reload').onclick = load;
})();
</script>
