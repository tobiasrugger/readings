<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELD 103 — Supabase check</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Nunito',system-ui,sans-serif;background:#faf7f0;color:#1f2421;
     max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1{color:#1b4332;margin:0 0 4px}
.sub{color:#5c6b62;margin:0 0 18px;font-size:.92rem}
.t{background:#fff;border:1px solid #dfe4dd;border-left:6px solid #ccc;border-radius:10px;
   padding:12px 16px;margin:10px 0}
.t.pass{border-left-color:#40916c}
.t.fail{border-left-color:#b5451b}
.t.warn{border-left-color:#d4a017}
.t.run{border-left-color:#ccc;opacity:.6}
.t h3{margin:0 0 4px;font-size:1rem}
.t .v{font-size:.9rem;color:#5c6b62}
.t .fix{background:#fdf6e3;border-radius:7px;padding:9px 12px;margin-top:9px;font-size:.88rem;font-weight:700;color:#7a5c00}
code{background:#f0f2ef;padding:1px 5px;border-radius:4px;font-size:.85em}
pre{background:#f6f8f5;border-radius:8px;padding:10px 13px;overflow-x:auto;font-size:.8rem;margin:7px 0 0}
#verdict{border-radius:12px;padding:16px 20px;margin:18px 0;font-weight:800;display:none}
#verdict.show{display:block}
#verdict.ok{background:#e3f4e9;border:2px solid #40916c;color:#1b4332}
#verdict.no{background:#fbeae5;border:2px solid #e07a5f;color:#8a2f10}
button{font-family:inherit;font-size:.9rem;font-weight:800;background:#2d6a4f;color:#fff;
  border:none;border-radius:9px;padding:10px 18px;cursor:pointer}
</style>
</head>
<body>
<h1>ELD 103 — Supabase check</h1>
<p class="sub">Runs seven tests against your project and names whatever is broken. Safe: the one row it writes is deleted at the end.</p>
<button onclick="runAll()">Run the check again</button>
<div id="verdict"></div>
<div id="out"></div>

<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE='eld103_work';
var TESTMAIL='zz-diagnostic@s.sfusd.edu';
var H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
var fails=[];

function card(id,title){
  var d=document.createElement('div'); d.className='t run'; d.id=id;
  d.innerHTML='<h3>'+title+'</h3><div class="v">running…</div>';
  document.getElementById('out').appendChild(d); return d;
}
function set(d,state,msg,fix,raw){
  d.className='t '+state;
  d.innerHTML='<h3>'+d.querySelector('h3').textContent+'</h3><div class="v">'+msg+'</div>'+
    (fix?'<div class="fix">'+fix+'</div>':'')+
    (raw?'<pre>'+String(raw).slice(0,600).replace(/</g,'&lt;')+'</pre>':'');
  if(state==='fail')fails.push(d.querySelector('h3').textContent);
}
function sb(path,opt){
  opt=opt||{}; opt.headers=Object.assign({},H,opt.headers||{});
  return fetch(SUPA_URL+'/rest/v1/'+path,opt).then(function(r){
    return r.text().then(function(t){
      var j=null; try{j=JSON.parse(t)}catch(e){}
      return {ok:r.ok,status:r.status,text:t,json:j};
    });
  });
}

function runAll(){
  fails=[];
  document.getElementById('out').innerHTML='';
  document.getElementById('verdict').className='verdict';
  var c1=card('c1','1. Can I reach the project at all?');
  sb(TABLE+'?select=email&limit=1').then(function(r){
    if(r.status===0) set(c1,'fail','No response.','Check the internet connection on this machine.');
    else set(c1,'pass','Yes. The project is reachable.');
    return sb(TABLE+'?select=*&limit=5');
  }).then(function(r){
    var c2=card('c2','2. Does the table eld103_work exist?');
    if(r.status===404||/schema cache|does not exist|Could not find the table/i.test(r.text)){
      set(c2,'fail','No. Supabase cannot find <code>public.'+TABLE+'</code>.',
        'Open the Supabase SQL editor and run eld103_schema.sql. This is almost certainly your problem.',r.text);
      finish(); return null;
    }
    if(!r.ok){ set(c2,'fail','Error '+r.status+'.','',r.text); finish(); return null; }
    set(c2,'pass','Yes.');

    var c3=card('c3','3. Can the anon key READ the table?');
    if(!Array.isArray(r.json)){
      set(c3,'fail','The response was not a list.','',r.text);
    } else if(r.json.length===0){
      set(c3,'warn','The read worked but returned <b>zero rows</b>.',
        'Either nobody has signed in yet, OR a SELECT policy is missing and RLS is hiding the rows. Test 6 settles which.');
    } else {
      var cols=Object.keys(r.json[0]).join(', ');
      set(c3,'pass','Yes — <b>'+r.json.length+' row(s)</b> visible. Columns: <code>'+cols+'</code>');
    }

    var c4=card('c4','4. Does the table have the email column?');
    var probe=sb(TABLE+'?select=email,name,period,turned_in,score&limit=1');
    return probe.then(function(p){
      if(/column .* does not exist|42703/i.test(p.text)){
        set(c4,'fail','A required column is missing.',
          'You made the older student_name version of the table. Re-run eld103_schema.sql — the ALTER TABLE lines add what is missing.',p.text);
      } else if(!p.ok){ set(c4,'warn','HTTP '+p.status,'',p.text); }
      else set(c4,'pass','Yes — email, name, period, turned_in and score all exist.');
      return sb('students?select=email&limit=3');
    });
  }).then(function(r){
    if(r===null)return null;
    var c5=card('c5','5. Is the students roster reachable?');
    if(!r.ok) set(c5,'warn','No — HTTP '+r.status+'. Not fatal.',
      'Students can still type their email. The dropdown just stays hidden.',r.text);
    else set(c5,'pass',(r.json&&r.json.length?r.json.length+'+ students on the roster.':'Reachable, but empty. The dropdown will hide itself.'));

    var c6=card('c6','6. Can a student actually WRITE a row? (the real test)');
    return sb(TABLE+'?on_conflict=email',{
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify([{email:TESTMAIL,name:'Diagnostic Row',period:'0',unit:'ch1-2',
        slug:'eld103-writing',score:1,max_score:113,turned_in:false,payload:{test:true}}])
    }).then(function(w){
      if(/no unique or exclusion constraint|42P10/i.test(w.text)){
        set(c6,'fail','No. The unique index on <code>email</code> is missing.',
          'The table exists but the upsert has nothing to conflict on, so every save fails. Run this: <br><code>create unique index eld103_work_email_idx on public.eld103_work (email);</code>',w.text);
      } else if(/row-level security|42501/i.test(w.text)){
        set(c6,'fail','No. Row Level Security is blocking the insert.',
          'The policies did not get created. Re-run the create policy lines in eld103_schema.sql.',w.text);
      } else if(/23502/.test(w.text)&&/student_name/.test(w.text)){
        set(c6,'fail','No. The old <code>student_name</code> column is still NOT NULL and is rejecting every save.',
          'The table was built from the first version of the schema. Run fix_now.sql — it retires that column.',w.text);
      } else if(/23502/.test(w.text)){
        set(c6,'fail','No. A column is NOT NULL but nothing is filling it.',
          'Run fix_now.sql, then re-run this check.',w.text);
      } else if(!w.ok){
        set(c6,'fail','No — HTTP '+w.status+'.','',w.text);
      } else {
        set(c6,'pass','Yes. A row was written successfully.');
      }
      // if the write worked, prove the dashboard can see it
      var c6b=card('c6b','6b. Can the dashboard READ back what was just written?');
      return sb(TABLE+'?email=eq.'+encodeURIComponent(TESTMAIL)+'&select=email').then(function(rb){
        if(!w.ok){ set(c6b,'warn','Skipped — the write failed above.'); }
        else if(rb.ok && Array.isArray(rb.json) && rb.json.length){
          set(c6b,'pass','Yes. Written and read back. The pipe works end to end.');
        } else {
          set(c6b,'fail','No. The row saved but cannot be read back.',
            'This is the sneaky one: students ARE saving, but the SELECT policy is missing so RLS hides every row from the dashboard. Run:<br><code>create policy "anon select" on public.eld103_work for select to anon using (true);</code>',rb.text);
        }
        var c7=card('c7','7. Cleaning up the test row');
        return sb(TABLE+'?email=eq.'+encodeURIComponent(TESTMAIL),{method:'DELETE'}).then(function(dl){
        if(dl.ok) set(c7,'pass','Test row deleted. Nothing left behind.');
        else set(c7,'warn','Could not delete it.',
          'Harmless, but you will see a student called "Diagnostic Row" on the dashboard. Remove it in the Supabase table editor.',dl.text);
        finish();
        });
      });
    });
  }).catch(function(e){
    var cx=card('cx','Unexpected error'); set(cx,'fail',String(e.message)); finish();
  });
}
function finish(){
  var v=document.getElementById('verdict');
  if(fails.length){
    v.className='verdict show no';
    v.innerHTML='Found the problem: '+fails.join(' · ')+'<br><span style="font-weight:600">Read the yellow fix box on that test above.</span>';
  } else {
    v.className='verdict show ok';
    v.innerHTML='Everything works. The database is set up correctly.<br>'+
      '<span style="font-weight:600">So if the dashboard is empty, no student has signed in yet. Sign in on the student page yourself with a fake name, wait 20 seconds, then refresh the dashboard.</span>';
  }
}
runAll();
</script>
</body>
</html>
