<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respect reflection: dashboard &mdash; Mr. Toby</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pine:#1b4332;--pine2:#2d6a4f;--moss:#40916c;--paper:#faf7f0;--line:#dfe4dd;--ink:#1f2421;--muted:#5c6b62;--plum:#7b6cc4;--plum2:#efedf9}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
header{background:var(--pine);color:#fff;padding:18px;border-bottom:5px solid var(--plum)}
header h1{margin:0;font-size:1.4rem}
main{max-width:1200px;margin:0 auto;padding:18px}
#gate{max-width:360px;margin:60px auto;background:#fff;padding:24px;border-radius:14px;border:1.5px solid var(--line)}
input,select,button{font:inherit;padding:8px 10px;border-radius:9px;border:1.5px solid #c9d1cb}
button{background:var(--pine2);color:#fff;border:0;font-weight:800;cursor:pointer}
button.alt{background:var(--plum)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 18px}
.sum div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.sum b{display:block;font-size:1.5rem;color:var(--pine)}
.sum span{color:var(--muted);font-weight:700;font-size:.85rem}
.norms{background:var(--plum2);border-radius:12px;padding:12px 16px;margin:0 0 18px;columns:3;column-gap:20px}
.norms div{break-inside:avoid;background:#fff;border-radius:8px;padding:6px 10px;margin:0 0 6px;font-weight:600}
@media(max-width:800px){.norms{columns:1}}
table{width:100%;border-collapse:collapse;background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
th{background:#eef3ee;color:var(--pine);cursor:pointer;white-space:nowrap}
td.n{font-weight:800;white-space:nowrap}
td.r{text-align:center;font-weight:900;font-size:1.05rem}
.done{color:var(--moss);font-weight:900}
.card{background:#fff;border:1.5px solid var(--line);border-left:7px solid var(--plum);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:1.05rem;color:var(--pine)}
.card .meta{color:var(--muted);font-weight:700;font-size:.85rem;margin:0 0 8px}
.card dl{margin:0;display:grid;grid-template-columns:200px 1fr;gap:4px 12px}
.card dt{color:var(--plum);font-weight:800;font-size:.85rem}
.card dd{margin:0;white-space:pre-wrap}
@media(max-width:640px){.card dl{grid-template-columns:1fr}}
.hide{display:none}
</style>
</head>
<body>
<header><h1>Respect reflection &middot; ELD 103 &middot; dashboard</h1></header>
<main>
<div id="gate"><p style="margin:0 0 10px;font-weight:800">Teacher password</p><input id="pw" type="password" style="width:100%"><button id="go" style="width:100%;margin-top:10px">Open</button></div>
<div id="app" class="hide">
  <div class="tools">
    <select id="period"><option value="">All periods</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
    <button id="reload">Reload</button>
    <button id="csv" class="alt">Download CSV</button>
    <button id="view" class="alt">Show full answers</button>
  </div>
  <div class="sum" id="sum"></div>
  <h2 style="font-size:1.1rem;color:var(--pine);margin:0 0 6px">Class norms (anonymous)</h2>
  <div class="norms" id="norms"></div>
  <div id="tbl"></div>
  <div id="cards" class="hide"></div>
</div>
</main>
<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE='eld103_respect', ROWS=[], sortKey='name', sortDir=1;
function head(){return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
var Q=[['understand','Understands poem'],['meaning','Poem meaning'],['agree','Agrees?'],['agree_why','Why agree/disagree'],['looks','Respect looks like'],['sounds','Respect sounds like'],['norm1','Norm 1'],['norm2','Norm 2'],['norm3','Norm 3'],['r_class','Self-rating: class'],['r_class_why','Why (class)'],['breaks','When a norm is broken'],['r_friends','Self-rating: friends'],['r_friends_why','Why (friends)'],['younger','When younger'],['changed','What changed'],['r_family','Self-rating: family'],['r_family_why','Why (family)'],['one_line','Most true line']];
function gate(){if(document.getElementById('pw').value==='galileo2026'){document.getElementById('gate').classList.add('hide');document.getElementById('app').classList.remove('hide');load();}else{document.getElementById('pw').value='';document.getElementById('pw').placeholder='Try again';}}
document.getElementById('go').addEventListener('click',gate);document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')gate();});
function load(){
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=*&order=name',{headers:head()}).then(function(r){return r.json();}).then(function(rows){ROWS=rows||[];draw();});
}
function filtered(){var p=document.getElementById('period').value;return ROWS.filter(function(r){return !p||String(r.period)===p;});}
function avg(rows,k){var v=rows.map(function(r){return +(r.answers||{})[k];}).filter(function(x){return x>0;});return v.length?(v.reduce(function(a,b){return a+b;},0)/v.length).toFixed(1):'–';}
function draw(){
  var rows=filtered();
  var done=rows.filter(function(r){return r.completed;}).length;
  var agree={};rows.forEach(function(r){var a=(r.answers||{}).agree;if(a)agree[a]=(agree[a]||0)+1;});
  document.getElementById('sum').innerHTML=
    '<div><b>'+rows.length+'</b><span>students saved</span></div>'+
    '<div><b>'+done+'</b><span>turned in</span></div>'+
    '<div><b>'+avg(rows,'r_class')+'</b><span>avg self-rating in class</span></div>'+
    '<div><b>'+avg(rows,'r_friends')+'</b><span>avg with friends</span></div>'+
    '<div><b>'+avg(rows,'r_family')+'</b><span>avg with family</span></div>'+
    '<div><b>'+(agree.agree||0)+' / '+(agree.partly||0)+' / '+(agree.disagree||0)+'</b><span>agree / partly / disagree</span></div>';
  var norms=[];rows.forEach(function(r){[r.norm1,r.norm2,r.norm3].forEach(function(n){n=String(n||'').trim();if(n.length>2)norms.push(n);});});
  document.getElementById('norms').innerHTML=norms.length?norms.map(function(n){return '<div>'+esc(n)+'</div>';}).join(''):'<div>No norms yet.</div>';
  rows.sort(function(a,b){var x=sortKey==='name'?String(a.name||''):+(a.answers||{})[sortKey]||0,y=sortKey==='name'?String(b.name||''):+(b.answers||{})[sortKey]||0;return (x>y?1:x<y?-1:0)*sortDir;});
  var h='<table><tr><th data-s="name">Name</th><th>P</th><th data-s="r_class">Class</th><th data-s="r_friends">Friends</th><th data-s="r_family">Family</th><th>Understands</th><th>Agrees</th><th>Younger</th><th>Norm 1</th><th>Turned in</th><th>Last save</th></tr>';
  rows.forEach(function(r){var a=r.answers||{};h+='<tr><td class="n">'+esc(r.name)+'<br><span style="font-weight:400;color:#777;font-size:.8rem">'+esc(r.email)+'</span></td><td>'+esc(r.period)+'</td><td class="r">'+esc(a.r_class||'')+'</td><td class="r">'+esc(a.r_friends||'')+'</td><td class="r">'+esc(a.r_family||'')+'</td><td>'+esc(a.understand||'')+'</td><td>'+esc(a.agree||'')+'</td><td>'+esc(a.younger||'')+'</td><td>'+esc(r.norm1)+'</td><td>'+(r.completed?'<span class="done">✓</span>':'')+'</td><td>'+(r.updated_at?new Date(r.updated_at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'')+'</td></tr>';});
  document.getElementById('tbl').innerHTML=h+'</table>';
  Array.prototype.forEach.call(document.querySelectorAll('th[data-s]'),function(th){th.addEventListener('click',function(){var k=th.getAttribute('data-s');if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=k==='name'?1:-1;}draw();});});
  document.getElementById('cards').innerHTML=rows.map(function(r){var a=r.answers||{};return '<div class="card"><h3>'+esc(r.name)+'</h3><div class="meta">Period '+esc(r.period)+' · '+esc(r.email)+(r.completed?' · turned in':'')+'</div><dl>'+Q.map(function(q){var v=a[q[0]];return v?'<dt>'+q[1]+'</dt><dd>'+esc(v)+'</dd>':'';}).join('')+'</dl></div>';}).join('')||'<p>No students yet.</p>';
}
document.getElementById('period').addEventListener('change',draw);
document.getElementById('reload').addEventListener('click',load);
document.getElementById('view').addEventListener('click',function(){var c=document.getElementById('cards'),t=document.getElementById('tbl');var full=c.classList.toggle('hide');t.classList.toggle('hide',!full);this.textContent=full?'Show full answers':'Show table';});
document.getElementById('csv').addEventListener('click',function(){
  var rows=filtered(),cols=['name','email','period','completed','updated_at'].concat(Q.map(function(q){return q[0];}));
  var out=[cols.join(',')];rows.forEach(function(r){var a=r.answers||{};out.push(cols.map(function(c){var v=c in a?a[c]:r[c];return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(','));});
  var b=new Blob([out.join('\n')],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='eld103_respect.csv';x.click();
});
</script>
</body>
</html>
