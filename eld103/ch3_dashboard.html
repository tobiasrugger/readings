function normApos(s){return String(s||'').trim().toLowerCase().replace(/[\u2019\u02BC`]/g,"'").replace(/\s+/g,' ');}

/* ============ SCORING ============ */
function attempted(o){return o && Object.keys(o).length>0}
function mk(n,d,wrong){return {n:n,d:d,wrong:wrong||[]}}

function scParts(p){
  if(!attempted(p.parts))return null;
  var n=0,wr=[],L={T:'TOPIC',S:'SUPPORTING',C:'CONCLUDING'};
  PARTS.forEach(function(q,i){
    if((p.parts[i]||'')===q[1])n++;
    else wr.push({q:q[0],gave:L[p.parts[i]]||'(blank)',want:L[q[1]]});
  });
  return mk(n,PARTS.length,wr);
}
function scTCI(p){
  if(!attempted(p.tci))return null;
  var n=0,wr=[];
  TCI.forEach(function(q,qi){
    var a=(p.tci||{})[qi]||{},ok=true;
    q.t.split(' ').forEach(function(w,wi){
      var want=q.T.indexOf(wi)>-1?'T':(q.C.indexOf(wi)>-1?'C':'');
      if((a[wi]||'')!==want)ok=false;
    });
    if(ok)n++; else wr.push({q:q.t,gave:'',want:'controlling idea starts at "'+q.t.split(' ')[q.C[0]]+'"'});
  });
  return mk(n,TCI.length,wr);
}
function scPred(p){
  if(!attempted(p.pred))return null;
  var n=0,wr=[];
  PRED.forEach(function(q,qi){
    var got=(p.pred[qi]||[]).slice().sort().join(',');
    var want=q.opts.map(function(o,i){return o[1]?i:-1}).filter(function(i){return i>=0}).join(',');
    if(got===want)n++;
    else{
      var chose=(p.pred[qi]||[]).map(function(i){return q.opts[i]?q.opts[i][0].slice(0,42):'?'});
      wr.push({q:q.ts,gave:chose.join(' / ')||'(nothing)',want:'the three that prove it'});
    }
  });
  return mk(n,PRED.length,wr);
}
function scMC(ans,key,ki,txt){
  if(!attempted(ans))return null;
  var n=0,wr=[];
  key.forEach(function(q,qi){
    if(ans[qi]===q[ki])n++;
    else wr.push({q:String(q[0]).replace(/<[^>]+>/g,''),
      gave:(ans[qi]===undefined?'(blank)':q[1][ans[qi]]),want:q[1][q[ki]]});
  });
  return mk(n,key.length,wr);
}

  PICK.forEach(function(q,qi){

}

  var sents=d.split(/(?=[A-Z])/).length&&d.split(/[.!?]+\s/).filter(function(x){return x.trim().length});

  var norm=function(s){return s.replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()};
  return {
    words:wc(d), title:(p.title||'').trim(), sents:sents.length,
    concSignal:CONCSIGS.some(function(x){return last.indexOf(x)>-1}),
    copied:(sents.length>1 && norm(first)===norm(last)),
    aposBad:(/\bits'/.test(d)||/\b(your|her|their|our)'s\b/i.test(d)),
    lowI:(d.match(/\bi\b/g)||[]).length,
    badStart:sents.filter(function(x){var c=x.trim().charAt(0);return c&&c===c.toLowerCase()&&/[a-z]/.test(c)}).length,
    breaks:/\n\s*\S/.test(d.trim())
  };
}
function outlineFill(p){
  var o=p.outline||{}, ids=['o_ts','o_A','o_A1','o_A2','o_B','o_B1','o_B2','o_C','o_C1','o_C2','o_cs'];
  var f=ids.filter(function(k){return (o[k]||'').trim().length}).length;
  return {n:f,d:ids.length,o:o,ids:ids};
}
function pct(s){return s?Math.round(s.n/s.d*100):null}
function cell(s){
  if(s===null||s===undefined)return '<span class="pct pna">&mdash;</span>';
  var v=pct(s),c=v>=90?'p100':(v>=60?'p70':'p0');
  return '<span class="pct '+c+'" title="'+s.n+' of '+s.d+'">'+v+'%</span>';
}
/* ============ LOAD ============ */
var ROWS=[];
function loadAll(){
  var m=document.getElementById('msg');
  m.innerHTML='<div class="msg info">Loading…</div>';
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=*&order=updated_at.desc',
    {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}})
  .then(function(r){return r.ok?r.json():r.text().then(function(t){throw new Error(t)})})
  .then(function(data){
    ROWS=data.map(function(r){
      var p=r.payload||{};
      return {name:r.name||r.student_name||r.email, email:r.email||'', period:r.period||'',
              when:r.updated_at, turned:r.turned_in?(p.turnedIn||r.updated_at):null, p:p,
        s:{parts:scParts(p),tci:scTCI(p),pred:scPred(p),gen:scMC(p.gen||{},GEN,2),
           pick:scPick(p),unity:scUnity(p),sig:scSig(p),conc:scMC(p.conc||{},CONC,2),
           cont:scCont(p),its:scMC(p.its||{},ITS,2),poss:scPoss(p),num:scMC(p.num||{},NUM,2),
           outline:outlineFill(p),draft:draftStats(p)}};
    });
    m.innerHTML=ROWS.length?'':'<div class="msg info">Nothing here yet. Students appear about 20 seconds after they type their name and start working.</div>';
    render();
  })
  .catch(function(e){
    m.innerHTML='<div class="msg err">Could not read the table.<br><span class="tip">'+
      String(e.message).slice(0,300)+'</span><br><span class="tip">If it says the relation does not exist, run eld103_schema.sql in the Supabase SQL editor first.</span></div>';
  });
}
var PFILTER='';
function setFilter(p){PFILTER=p; render();}
function shown(){return PFILTER?ROWS.filter(function(r){return String(r.period)===PFILTER}):ROWS}
function render(){
  var st=document.getElementById('stats');
  var periods=[];
  ROWS.forEach(function(r){if(r.period&&periods.indexOf(String(r.period))<0)periods.push(String(r.period))});
  periods.sort();
  var fh='<button class="btn '+(PFILTER?'ghost ':'')+'small" onclick="setFilter(\'\')">All periods</button>';
  periods.forEach(function(p){fh+='<button class="btn '+(PFILTER===p?'':'ghost ')+'small" onclick="setFilter(\''+p+'\')">Period '+p+'</button>'});
  document.getElementById('filters').innerHTML=periods.length>1?fh:'';
  // warn about split identities (same username, two domains)
  var seen={},dupes=[];
  ROWS.forEach(function(r){
    var lp=String(r.email||'').split('@')[0];
    if(!lp)return;
    if(seen[lp]&&dupes.indexOf(lp)<0)dupes.push(lp);
    seen[lp]=true;
  });
  var dw=document.getElementById('dupwarn');
  if(dupes.length)dw.innerHTML='<div class="msg err">'+dupes.length+
    ' student'+(dupes.length>1?'s have':' has')+' two rows under different email domains: <b>'+
    dupes.map(esc).join(', ')+'</b>.<br><span class="tip">Run steps A–D at the bottom of eld103_schema.sql to merge them.</span></div>';
  else dw.innerHTML='';
  var ROWS_ALL=ROWS; ROWS=shown();
  renderInner();
  ROWS=ROWS_ALL;
}
function renderInner(){
  var st=document.getElementById('stats');
  var n=ROWS.length;
  var withDraft=ROWS.filter(function(r){return r.s.draft}).length;
  var turned=ROWS.filter(function(r){return r.turned}).length;
  var avg=function(k){var a=ROWS.map(function(r){return pct(r.s[k])}).filter(function(x){return x!==null});
    return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length)+'%':'—';};
  st.innerHTML=
   '<div class="stat"><b>'+n+'</b><span>STUDENTS WORKING</span></div>'+
   '<div class="stat"><b>'+turned+'</b><span>TURNED IN</span></div>'+
   '<div class="stat"><b>'+withDraft+'</b><span>WROTE A PARAGRAPH</span></div>'+
   '<div class="stat"><b>'+avg('tci')+'</b><span>AVG TOPIC + IDEA</span></div>'+
   '<div class="stat"><b>'+avg('unity')+'</b><span>AVG UNITY</span></div>'+
   '<div class="stat"><b>'+avg('poss')+'</b><span>AVG APOSTROPHES</span></div>';

  var h='<table><tr><th class="l">Student</th><th>P</th><th>Status</th>'+
        '<th>1 Parts</th><th>2 Topic</th><th class="opt">3 Belongs</th><th>4 Gen/Spec</th>'+
        '<th class="opt">5 Pick</th><th>6 Unity</th><th class="opt">7a Signals</th><th>7b Concl</th>'+
        '<th class="opt">8a Contr</th><th>8b it\'s</th><th>9a Poss</th><th class="opt">9b Number</th>'+
        '<th class="opt">Outline</th><th>Words</th><th class="opt">Updated</th></tr>';
  ROWS.forEach(function(r,i){
    h+='<tr class="row" onclick="showDetail(\''+esc(r.email||r.name)+'\')"><td class="l name">'+esc(r.name)+
      '<br><span class="tip" style="font-weight:600;font-size:.72rem">'+esc(r.email)+'</span></td>'+
      '<td>'+esc(r.period||'—')+'</td>'+
      '<td><span class="stmt '+(r.turned?'done':'wip')+'">'+(r.turned?'Turned in':'In progress')+'</span>'+
      (r.p.browserTranslated?'<span class="stmt xl" title="Browser translation was running on this student\'s page">translated</span>':'')+'</td>'+
      cellTd(r.s.parts)+cellTd(r.s.tci)+cellTd(r.s.pred,1)+cellTd(r.s.gen)+
      cellTd(r.s.pick,1)+cellTd(r.s.unity)+cellTd(r.s.sig,1)+cellTd(r.s.conc)+
      cellTd(r.s.cont,1)+cellTd(r.s.its)+cellTd(r.s.poss)+cellTd(r.s.num,1)+
      cellTd(r.s.outline,1)+
      '<td>'+(r.s.draft?r.s.draft.words:'—')+'</td>'+
      '<td class="opt" style="font-weight:600;font-size:.76rem">'+when(r.when)+'</td></tr>';
  });
  h+='</table>';
  document.getElementById('roster').innerHTML=ROWS.length?h:'';
}
function cellTd(s,opt){return '<td'+(opt?' class="opt"':'')+'>'+cell(s)+'</td>'}
function when(t){if(!t)return '—';var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+
  d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ============ DETAIL ============ */
function showDetail(id){
  var r=null;
  for(var k=0;k<ROWS.length;k++){if((ROWS[k].email||ROWS[k].name)===id){r=ROWS[k];break;}}
  if(!r)return;
  var p=r.p,s=r.s,d=document.getElementById('detail');
  var h='<h2>'+esc(r.name)+'</h2><div class="tip">'+esc(r.email)+
    (r.period?' · Period '+esc(r.period):'')+'</div><div class="tip">'+
    (r.turned?'Turned in '+when(r.turned)+' · ':'Still working · ')+'last saved '+when(r.when)+'</div>';

  if(r.p.browserTranslated)
    h+='<div class="msg err" style="margin-top:10px">Chrome translation was running on this page while they worked. '+
       'Their English answers may have been auto-translated, so treat the scores with care and have them redo it with translation off.</div>';
  if(s.draft){
    h+='<h3>The paragraph</h3>';
    h+='<div class="para">'+(p.title?'<div class="pt">'+esc(p.title)+'</div>':'<div class="pt tip">(no title)</div>')+
       '<div class="body">'+esc(p.draft)+'</div></div>';
    var f=s.draft,pills='';
    pills+='<span class="pill'+(f.words>=120&&f.words<=230?'':' no')+'">'+f.words+' words</span>';
    pills+='<span class="pill">'+f.sents+' sentences</span>';
    pills+='<span class="pill'+(f.concSignal?'':' no')+'">'+(f.concSignal?'has':'no')+' conclusion signal</span>';
    pills+='<span class="pill'+(f.copied?' no':'')+'">'+(f.copied?'conclusion COPIES topic sentence':'conclusion reworded')+'</span>';
    pills+='<span class="pill'+(f.aposBad?' no':'')+'">'+(f.aposBad?'apostrophe error':'apostrophes ok')+'</span>';
    if(f.lowI)pills+='<span class="pill no">'+f.lowI+' lowercase i</span>';
    if(f.badStart)pills+='<span class="pill no">'+f.badStart+' uncapitalized starts</span>';
    var t=f.title;
    if(!t) pills+='<span class="pill no">no title</span>';
    else if(/\.$/.test(t)) pills+='<span class="pill no">title ends in a period</span>';
    else if(t.charAt(0)!==t.charAt(0).toUpperCase()) pills+='<span class="pill no">title not capitalized</span>';
    if(f.breaks)pills+='<span class="pill no">has line breaks</span>';
    h+=pills;
  } else h+='<h3>The paragraph</h3><div class="tip">Nothing written yet.</div>';

  var ol=s.outline;
  if(ol&&ol.n){
    var LBL={o_ts:'Topic sentence',o_A:'  A. Supporting point',o_A1:'     1. Detail',o_A2:'     2. Detail',
             o_B:'  B. Supporting point',o_B1:'     1. Detail',o_B2:'     2. Detail',
             o_C:'  C. Supporting point',o_C1:'     1. Detail',o_C2:'     2. Detail',
             o_cs:'Concluding sentence'};
    h+='<h3>Their outline ('+ol.n+' of '+ol.d+' filled)</h3><div class="mono">';
    ol.ids.forEach(function(k){
      h+=LBL[k]+': '+(ol.o[k]?esc(ol.o[k]):'—')+'\n';
    });
    h+='</div>';
    if(ol.n<ol.d)h+='<div class="tip">Blank lines mean they skipped planning that part. That usually shows up as a thin paragraph.</div>';
  } else h+='<h3>Their outline</h3><div class="tip">Nothing planned. They went straight to writing.</div>';
  if(p.topic!==null&&p.topic!==undefined){
    h+='<div class="tip" style="margin-top:8px">Topic chosen: <b>'+esc(p.ownTopic||['A place that has changed since I first knew it','Something my first job taught me','A skill that saved me money','Why my neighborhood is misunderstood','A person who changed how I think','(their own)'][p.topic]||'?')+'</b></div>';
  }

  var ck=p.check||{},done=Object.keys(ck).filter(function(k){return ck[k]}).length;
  h+='<h3>Self-editing checklist ('+done+' of 10)</h3>';
  CHECKS.forEach(function(c,ci){h+='<span class="pill'+(ck[ci]?'':' no')+'">'+(ck[ci]?'✓ ':'· ')+c+'</span>'});

  h+='<h3>What they got wrong</h3>';
  var any=false;
  function block(label,sc,fmt){
    if(!sc)return;
    if(sc.wrong&&sc.wrong.length){
      any=true;
      h+='<div style="margin:11px 0"><b>'+label+' — '+sc.n+' of '+sc.d+'</b>';
      sc.wrong.slice(0,12).forEach(function(w){h+=fmt(w)});
      h+='</div>';
    }
  }
  var std=function(w){return '<div class="wrongitem">'+esc(w.q)+
    (w.gave?'<br>wrote <span class="gave">'+esc(w.gave)+'</span>':'')+
    ' · should be <span class="want">'+esc(w.want)+'</span></div>'};
  block('1. Three parts',s.parts,std);
  block('2. Topic + controlling idea',s.tci,std);
  block('3. What belongs',s.pred,std);
  block('4. Too general / too specific',s.gen,std);
  block('5. Best topic sentence',s.pick,std);
  block('6. Unity — the intruder',s.unity,std);
  block('7a. Conclusion signals',s.sig,std);
  block('7b. Best ending',s.conc,std);
  block('8a. Contractions',s.cont,std);
  block("8b. it's / its",s.its,std);
  block('9a. Possessives',s.poss,std);
  block('9b. One owner or more',s.num,std);
  if(!any)h+='<div class="tip">Nothing wrong on any activity they attempted.</div>';

  h+='<div style="margin-top:20px"><button class="btn ghost small" onclick="document.getElementById(\'detail\').classList.remove(\'show\')">Close</button>'+
     '<button class="btn small" onclick="window.print()">Print this student</button></div>';
  d.innerHTML=h; d.classList.add('show');
  if(d.scrollIntoView)d.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ============ CSV ============ */
function exportCSV(){
  var head=['Student','Email','Period','Status','Last saved','ThreeParts','TopicIdea','WhatBelongs',
            'GenSpec','PickTS','Unity','ConcSignals','BestEnding','Contractions','ItsIts','Possessives',
            'OneOrMany','OutlineFilled','DraftWords','ConclusionSignal','ChecklistDone','Title'];
  var lines=[head.join(',')];
  ROWS.forEach(function(r){
    var f=r.s.draft,ck=r.p.check||{};
    var row=[r.name,r.email,r.period,(r.turned?'Turned in':'In progress'),when(r.when),
      pct(r.s.parts),pct(r.s.tci),pct(r.s.pred),pct(r.s.gen),pct(r.s.pick),pct(r.s.unity),
      pct(r.s.sig),pct(r.s.conc),pct(r.s.cont),pct(r.s.its),pct(r.s.poss),pct(r.s.num),
      pct(r.s.outline), f?f.words:'', f?(f.concSignal?'yes':'no'):'',
      Object.keys(ck).filter(function(k){return ck[k]}).length, r.p.title||''];
    lines.push(row.map(function(v){
      v=(v===null||v===undefined)?'':String(v);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
    }).join(','));
  });
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='eld103_ch3_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
</script>
