<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oral Histories &mdash; Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pine:#1f5044;--pine-dark:#163a32;--cream:#fdfbf4;--ink:#22302c;--muted:#6b7a75;--line:#dfe6e2;--ok:#2f7d54;--rose:#b04a3f;--gold:#c98a2e;--sky:#3c6e8f}
*{box-sizing:border-box}body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:16px}
#bar{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#bar h1{font-size:17px;margin:0;font-weight:800;flex:1 1 auto}
.btn{font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);color:#fff;padding:6px 11px;border-radius:8px}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.on{background:#fff;color:var(--pine)}
select,input[type=text]{font-family:inherit;font-size:14px;padding:6px 9px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
#bar select,#bar input{border-color:rgba(255,255,255,.4);background:var(--pine-dark);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(31,80,68,.06)}
h2{font-size:19px;color:var(--pine);margin:0 0 8px}
h3{font-size:15px;color:var(--pine-dark);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{background:var(--pine);color:#fff;text-align:left;padding:8px 9px;font-size:13px;position:sticky;top:46px;cursor:pointer}
td{border-bottom:1px solid var(--line);padding:7px 9px;vertical-align:middle}
tr:hover td{background:#f6faf9}
.bar{height:9px;background:#e9efec;border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--pine)}
.bar.s i{background:var(--sky)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:#e9efec;color:var(--muted)}
.tag.in{background:var(--ok);color:#fff}
.tag.no{background:#f0e2e0;color:var(--rose)}
.stat{display:inline-block;background:#f2f8f6;border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:0 8px 8px 0;font-size:14px}
.stat b{display:block;font-size:22px;color:var(--pine)}
.ansblock{border-left:3px solid var(--line);padding:4px 0 4px 11px;margin:8px 0}
.ansblock .lab{font-size:13.5px;color:var(--muted);font-weight:700}
.ansblock .val{white-space:pre-wrap;font-size:15.5px;margin-top:2px}
.ansblock .val.empty{color:#b9c5c0;font-style:italic}
.ansblock.ok{border-left-color:var(--ok)}
.ansblock.no{border-left-color:var(--rose)}
.ansblock .key{font-size:13px;color:var(--rose);font-weight:700}
.mark{font-weight:800;margin-right:5px}
.mark.ok{color:var(--ok)}.mark.no{color:var(--rose)}
.sechead{background:var(--pine-dark);color:#fff;padding:6px 11px;border-radius:8px;font-weight:800;font-size:14px;margin:18px 0 6px}
.sub{color:var(--muted);font-size:13.5px}
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#1f5044,#0e2b24);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
#gate .box{background:#fff;border-radius:16px;padding:24px;max-width:360px;width:100%}
#gate h2{margin-top:0}
#gate input{width:100%;margin-bottom:10px}
#gate button{width:100%;background:var(--pine);color:#fff;border:none;padding:11px;border-radius:9px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
.pane{display:none}.pane.on{display:block}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.setgrid div{background:#f7faf9;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13.5px}
.setgrid b{color:var(--pine);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
@media print{#bar,#gate,.noprint{display:none!important}.card{box-shadow:none;page-break-inside:avoid}}
</style>
</head>
<body>
<div id="gate"><div class="box">
  <h2>Teacher Dashboard</h2>
  <p class="sub">Oral Histories &amp; the Family Interview</p>
  <input type="text" id="pw" placeholder="Password">
  <button id="pwGo">Open</button>
</div></div>

<div id="bar">
  <h1>Oral Histories &mdash; Dashboard</h1>
  <select id="fPeriod"><option value="">All periods</option></select>
  <input type="text" id="fSearch" placeholder="Search name">
  <button class="btn on" data-p="roster">Roster</button>
  <button class="btn" data-p="key">Answer key</button>
  <button class="btn" id="refresh">Refresh</button>
  <button class="btn" id="csv">CSV</button>
</div>

<div class="wrap">
  <div class="pane on" id="roster">
    <div class="card" id="stats"><span class="sub">Loading&hellip;</span></div>
    <div class="card">
      <table id="tbl">
        <thead><tr>
          <th data-s="name">Student</th><th data-s="period">Period</th>
          <th data-s="pct">Progress</th><th data-s="score">Auto score</th>
          <th data-s="words">Words</th><th data-s="rub">Self rubric</th>
          <th data-s="turned">Turned in</th><th data-s="updated">Last saved</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="pane" id="detail">
    <div class="card">
      <button class="btn" id="back" style="background:var(--pine);border-color:var(--pine);margin-bottom:10px">&larr; Back to roster</button>
      <div id="dHead"></div>
      <div id="dSets" class="setgrid" style="margin:12px 0"></div>
    </div>
    <div id="dBody"></div>
  </div>

  <div class="pane" id="key">
    <div class="card"><h2>Answer key</h2><p class="sub">82 auto-scored items. Answers separated by | are all accepted.</p><div id="keyOut"></div></div>
  </div>
</div>

var ROWS=[],sortBy='name',sortDir=1;

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();}
function isRight(v,k){var g=norm(v);if(!g)return false;var o=String(k).split('|');for(var i=0;i<o.length;i++){if(g===norm(o[i]))return true;}return false;}

function words(d){
  var n=0;['w_intro','w_back','w_story','w_reflect'].forEach(function(k){
    var t=(d[k]||'').trim(); if(t)n+=t.split(/\s+/).length;});
  return n;
}
function rubTotal(d){var t=0;['rf1','rf2','rf3','rf4'].forEach(function(q){t+=parseInt(d[q]||0,10);});return t;}

function load(){
  $('#stats').innerHTML='<span class="sub">Loading&hellip;</span>';
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=*&order=name.asc',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}})
  .then(function(r){return r.json();})
  .then(function(rows){
    if(!rows||rows.length===undefined){$('#stats').innerHTML='<span class="sub">No data yet, or the table does not exist.</span>';return;}
    ROWS=rows.map(function(r){
      var d=r.data||{};
      return {name:r.name||'(no name)',email:r.email,period:r.period||'',data:d,
        pct:d.__pct||0,score:r.score||0,max:r.max_score||0,
        words:words(d),rub:rubTotal(d),turned:!!r.turned_in,updated:r.updated_at||''};
    });
    var ps={};ROWS.forEach(function(r){if(r.period)ps[r.period]=1;});
    var sel=$('#fPeriod'),cur=sel.value;
    sel.innerHTML='<option value="">All periods</option>'+Object.keys(ps).sort().map(function(p){return '<option>'+esc(p)+'</option>';}).join('');
    sel.value=cur;
    render();
  })
  .catch(function(){$('#stats').innerHTML='<span class="sub">Could not load. Check the table name and RLS policy.</span>';});
}

$$('#tbl th[data-s]').forEach(function(th){
  th.addEventListener('click',function(){
    var s=th.getAttribute('data-s');
    if(sortBy===s)sortDir=-sortDir;else{sortBy=s;sortDir=1;}
    render();
  });
});

function filtered(){
  var p=$('#fPeriod').value,q=$('#fSearch').value.toLowerCase().trim();
  return ROWS.filter(function(r){
    if(p&&r.period!==p)return false;
    if(q&&r.name.toLowerCase().indexOf(q)<0&&(r.email||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){
    var x=a[sortBy],y=b[sortBy];
    if(typeof x==='string')return x.localeCompare(y)*sortDir;
    return ((x||0)-(y||0))*sortDir;
  });
}
function render(){
  var rs=filtered();
  var n=rs.length,ti=0,sc=0,mx=0,wd=0;
  rs.forEach(function(r){if(r.turned)ti++;sc+=r.score;mx+=r.max;wd+=r.words;});
  $('#stats').innerHTML=
    '<span class="stat"><b>'+n+'</b>students</span>'+
    '<span class="stat"><b>'+ti+'</b>turned in</span>'+
    '<span class="stat"><b>'+(n?Math.round(sc/n):0)+' / '+(n?Math.round(mx/n):0)+'</b>avg auto score</span>'+
    '<span class="stat"><b>'+(n?Math.round(wd/n):0)+'</b>avg words written</span>';
  var tb=$('#tbl tbody');tb.innerHTML='';
  rs.forEach(function(r,i){
    var pc=r.max?Math.round(r.score/r.max*100):0;
    var tr=document.createElement('tr');
    tr.innerHTML='<td><b>'+esc(r.name)+'</b><br><span class="sub">'+esc(r.email)+'</span></td>'+
      '<td>'+esc(r.period)+'</td>'+
      '<td><div class="bar"><i style="width:'+r.pct+'%"></i></div><span class="sub">'+r.pct+'%</span></td>'+
      '<td><div class="bar s"><i style="width:'+pc+'%"></i></div><span class="sub">'+r.score+' / '+r.max+'</span></td>'+
      '<td>'+r.words+'</td>'+
      '<td>'+(r.rub?r.rub+' / 16':'&mdash;')+'</td>'+
      '<td>'+(r.turned?'<span class="tag in">in</span>':'<span class="tag no">not yet</span>')+'</td>'+
      '<td class="sub">'+(r.updated?new Date(r.updated).toLocaleString():'')+'</td>'+
      '<td><button class="btn" style="background:var(--pine);border-color:var(--pine)">Open</button></td>';
    tr.querySelector('button').addEventListener('click',function(){openStudent(r);});
    tb.appendChild(tr);
  });
}

function openStudent(r){
  $$('.pane').forEach(function(p){p.classList.remove('on');});
  $('#detail').classList.add('on');
  window.scrollTo(0,0);
  var d=r.data||{};
  $('#dHead').innerHTML='<h2>'+esc(r.name)+'</h2><p class="sub">'+esc(r.email)+' &middot; '+esc(r.period)+
    ' &middot; last saved '+(r.updated?new Date(r.updated).toLocaleString():'never')+
    ' &middot; '+(r.turned?'<b style="color:var(--ok)">turned in</b>':'not turned in')+
    ' &middot; '+r.words+' words written</p>';
  var sets=(d.__auto&&d.__auto.sets)||{};
  var sh='';
  Object.keys(SETLABEL).forEach(function(k){
    sh+='<div><b>'+SETLABEL[k]+'</b>'+(sets[k]||'&mdash;')+'</div>';
  });
  sh+='<div><b>Total</b>'+((d.__auto?d.__auto.score+' / '+d.__auto.max:'&mdash;'))+'</div>';
  $('#dSets').innerHTML=sh;

  var html='',sec='',head='';
  FIELDS.forEach(function(f){
    if(f.s!==sec){sec=f.s;html+='<div class="sechead">'+esc(sec)+'</div>';head='';}
    if(f.h!==head){head=f.h;if(head)html+='<h3>'+esc(head)+'</h3>';}
    var v=d[f.q];
    if(f.t==='check')v=v?'\u2714 checked':'';
    if(f.t==='rub')v=v?('level '+v):'';
    var cls='',mark='';
    if(f.k){
      var ok=isRight(v,f.k);
      cls=ok?' ok':' no';
      mark='<span class="mark '+(ok?'ok':'no')+'">'+(ok?'\u2714':'\u2718')+'</span>';
    }
    html+='<div class="ansblock'+cls+'"><div class="lab">'+mark+esc(f.l)+'</div>'+
      '<div class="val'+((v===''||v==null)?' empty':'')+'">'+esc((v===''||v==null)?'(blank)':v)+'</div>'+
      (f.k&&!isRight(v,f.k)?'<div class="key">key: '+esc(f.k.replace(/\|/g,'  /  '))+'</div>':'')+'</div>';
  });
  var gq=d.gq_sel||[];
  if(gq.length){
    html+='<div class="sechead">Interview questions chosen ('+gq.length+')</div><div class="card">'+
      gq.map(function(q){return '<div class="ansblock"><div class="val">'+esc(q)+'</div></div>';}).join('')+'</div>';
  }
  if(d.__sketch){
    html+='<div class="sechead">Drawing: the object that connects me</div><div class="card"><img src="'+d.__sketch+'" style="max-width:100%;border:1px solid #ddd;border-radius:8px"></div>';
  }
  $('#dBody').innerHTML='<div class="card">'+html+'</div>';
}

function renderKey(){
  var h='<table><thead><tr><th>Section</th><th>Item</th><th>Accepted answer(s)</th></tr></thead><tbody>';
  FIELDS.filter(function(f){return f.k;}).forEach(function(f){
    h+='<tr><td class="sub">'+esc(f.s)+'</td><td>'+esc(f.l)+'</td><td><b>'+esc(f.k.replace(/\|/g,'  /  '))+'</b></td></tr>';
  });
  $('#keyOut').innerHTML=h+'</tbody></table>';
}

    var d=r.data||{};
    var row=[r.name,r.email,r.period,r.pct,r.score,r.max,r.words,r.rub,r.turned?'yes':'no',r.updated];
    FIELDS.forEach(function(f){row.push(d[f.q]==null?'':d[f.q]);});
    lines.push(row.map(function(c){return '"'+String(c).replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';}).join(','));
  });
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='oral_histories_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
});
</script>
