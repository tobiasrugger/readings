<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Dashboard — Maus Unit</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --ink-2:#3b3b3b; --ink-3:#6f6f6f;
  --pine:#1F4D3D; --pine-d:#143528; --pine-l:#2f6b56;
  --paper:#fbfaf7; --panel:#ffffff; --gutter:#eceae4;
  --rule:#141414; --hair:#d8d5cd;
  --mark:#c8601f;           /* text-coding highlight */
  --ok:#1F4D3D; --warn:#8a5a00; --no:#8f2f2f;
  --r:4px; --shadow:0 1px 0 #141414;
  --f:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--f);background:var(--paper);color:var(--ink);
  font-size:17px;line-height:1.55;
}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 96px}

/* ---------- panel grammar: this is a comic, so the page is panels + gutters ---------- */
.panel{
  background:var(--panel);border:2px solid var(--rule);border-radius:var(--r);
  padding:18px;margin:16px 0;box-shadow:var(--shadow);
}
.panel.tight{padding:12px 14px}
.panel.quiet{border-width:1px;border-color:var(--hair);box-shadow:none;background:#fff}
.panel > :first-child{margin-top:0}
.panel > :last-child{margin-bottom:0}

/* ---------- masthead ---------- */
.mast{background:var(--ink);color:#fff;border-bottom:4px solid var(--pine)}
.mast .wrap{padding-top:18px;padding-bottom:18px}
.mast h1{font-size:clamp(24px,5vw,34px);line-height:1.1;margin:0 0 4px;font-weight:900;letter-spacing:-.01em}
.mast .sub{color:#cdd6d1;font-size:15px;font-weight:600;margin:0}
.mast a{color:#9ccbb8}
.crumb{display:inline-block;color:#9ccbb8;text-decoration:none;font-weight:800;font-size:14px;margin-bottom:8px}
.crumb:hover{text-decoration:underline}

h2{font-size:22px;margin:28px 0 10px;font-weight:900;line-height:1.2}
h3{font-size:18px;margin:20px 0 8px;font-weight:800}
h2 .n{color:var(--pine);font-variant-numeric:tabular-nums}
p{margin:0 0 12px}
a{color:var(--pine-d)}
hr{border:0;border-top:1px solid var(--hair);margin:22px 0}
small{color:var(--ink-3)}

/* ---------- identity + sticky bar ---------- */
.bar{
  position:sticky;top:0;z-index:40;background:rgba(251,250,247,.97);
  border-bottom:2px solid var(--rule);backdrop-filter:blur(6px);
}
.bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.bar input,.bar select{
  font-family:var(--f);font-size:15px;font-weight:700;padding:6px 8px;
  border:2px solid var(--rule);border-radius:var(--r);background:#fff;min-width:0
}
.bar input{width:150px}
.who{font-weight:800;font-size:14px}
.spacer{flex:1 1 auto}
.saved{font-size:13px;font-weight:800;color:var(--ink-3);white-space:nowrap}
.saved.on{color:var(--pine)}

/* ---------- buttons ---------- */
button,.btn{
  font-family:var(--f);font-weight:800;font-size:15px;cursor:pointer;
  background:#fff;color:var(--ink);border:2px solid var(--rule);border-radius:var(--r);
  padding:7px 12px;box-shadow:var(--shadow);
}
button:hover,.btn:hover{background:#f3f1ec}
button:active,.btn:active{transform:translateY(1px);box-shadow:none}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
[tabindex]:focus-visible{outline:3px solid var(--pine-l);outline-offset:2px}
.btn-go{background:var(--pine);color:#fff;border-color:var(--pine-d)}
.btn-go:hover{background:var(--pine-l)}
.btn-sm{font-size:13px;padding:4px 9px}
button[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- level toggle ---------- */
.levels{display:flex;gap:0;border:2px solid var(--rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.levels button{border:0;border-radius:0;box-shadow:none;padding:6px 12px;font-size:14px;background:#fff}
.levels button + button{border-left:2px solid var(--rule)}
.levels button[aria-pressed="true"]{background:var(--pine);color:#fff}
.lv{display:none}
body[data-level="1"] .lv-1,body[data-level="2"] .lv-2,body[data-level="3"] .lv-3{display:block}
body[data-level="1"] span.lv-1,body[data-level="2"] span.lv-2,body[data-level="3"] span.lv-3{display:inline}

/* ---------- reading roles ---------- */
.role{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;
  border:2px solid var(--rule);border-radius:99px;padding:2px 10px 2px 4px;background:#fff;white-space:nowrap
}
.role .g{
  width:22px;height:22px;border-radius:99px;display:grid;place-items:center;
  background:var(--pine);color:#fff;font-size:12px;line-height:1
}
.role.r-check .g{background:#1F4D3D}
.role.r-infer .g{background:#3a4f8a}
.role.r-connect .g{background:#8a5a00}
.role.r-predict .g{background:#6b3f8a}
.role.r-visual .g{background:#8f2f2f}
.role.r-lang .g{background:#0f6b70}
.role.r-question .g{background:#2b2b2b}

/* ---------- question blocks ---------- */
.q{border-left:5px solid var(--gutter);padding:10px 0 10px 14px;margin:14px 0}
.q.done{border-left-color:var(--pine)}
.q .qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.q .qn{font-weight:900;color:var(--ink-3);font-variant-numeric:tabular-nums}
.q .pg{font-size:13px;font-weight:800;color:var(--ink-3);border:1px dashed var(--hair);padding:1px 7px;border-radius:99px}
.q .prompt{font-weight:700}
textarea,input[type=text]{
  width:100%;font-family:var(--f);font-size:16px;padding:9px 10px;
  border:2px solid var(--hair);border-radius:var(--r);background:#fff;color:var(--ink)
}
textarea{min-height:74px;resize:vertical;line-height:1.5}
textarea:focus,input[type=text]:focus{border-color:var(--pine)}
.starter{
  font-size:14px;font-weight:700;color:var(--pine-d);background:#eef4f1;
  border:1px dashed var(--pine-l);border-radius:var(--r);padding:6px 9px;margin:0 0 6px;display:block
}
.starter b{font-weight:900}

/* ---------- choices ---------- */
.choices{display:grid;gap:6px;margin:6px 0}
.choice{
  display:flex;gap:9px;align-items:flex-start;border:2px solid var(--hair);border-radius:var(--r);
  padding:8px 10px;cursor:pointer;background:#fff;font-weight:600
}
.choice:hover{background:#f6f5f1}
.choice input{margin-top:4px;accent-color:var(--pine);flex:0 0 auto}
.choice.right{border-color:var(--pine);background:#eef4f1}
.choice.wrong{border-color:var(--no);background:#fbefef}
.fb{font-size:14px;font-weight:800;margin-top:5px}
.fb.right{color:var(--pine)}
.fb.wrong{color:var(--no)}

/* ---------- glossary / tap to translate ---------- */
.gl{
  border-bottom:2px dotted var(--pine-l);cursor:pointer;font-weight:800;color:var(--pine-d);
  background:none;border-left:0;border-right:0;border-top:0;padding:0;font-size:inherit;box-shadow:none;
  font-family:inherit
}
.gl:hover{background:#eef4f1}
#glpop{
  position:fixed;z-index:90;max-width:min(340px,92vw);background:#fff;border:2px solid var(--rule);
  border-radius:var(--r);padding:12px 14px;box-shadow:0 6px 0 rgba(20,20,20,.18);display:none
}
#glpop .w{font-weight:900;font-size:18px;margin-bottom:2px}
#glpop .d{font-size:15px;margin-bottom:8px}
#glpop .t{font-size:17px;font-weight:800;color:var(--pine-d);min-height:24px}
#glpop .x{position:absolute;top:4px;right:6px;border:0;box-shadow:none;background:none;font-size:18px;padding:2px 6px}

/* ---------- audio ---------- */
.say{
  border:2px solid var(--rule);background:#fff;border-radius:99px;width:28px;height:28px;
  padding:0;display:inline-grid;place-items:center;font-size:13px;box-shadow:var(--shadow);
  vertical-align:middle;margin-left:4px;flex:0 0 auto
}
.say.playing{background:var(--pine);color:#fff}

/* ---------- misc layout ---------- */
.grid{display:grid;gap:14px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.02em;padding:2px 8px;
     border-radius:99px;border:2px solid var(--rule);background:#fff}
.tag.p{background:var(--pine);color:#fff;border-color:var(--pine-d)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border:1px solid var(--hair);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f2f0ea;font-weight:900}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin-bottom:5px}
.callout{border-left:5px solid var(--pine);background:#eef4f1;padding:12px 14px;border-radius:0 var(--r) var(--r) 0;margin:14px 0}
.callout.care{border-left-color:var(--warn);background:#fbf5e8}
.mono{font-variant-numeric:tabular-nums}

/* ---------- care / opt-out ---------- */
#carebtn{position:fixed;right:12px;bottom:12px;z-index:60;border-radius:99px;padding:9px 14px;
         background:#fff;font-size:14px}
@media print{#carebtn{display:none}}

/* ---------- progress ---------- */
.prog{height:10px;background:var(--gutter);border:2px solid var(--rule);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pine);width:0;transition:width .25s}

/* ---------- print ---------- */
@media print{
  body{background:#fff;font-size:12pt}
  .bar,.noprint,button,.say,#glpop{display:none !important}
  .mast{background:#fff;color:#000;border-bottom:2px solid #000}
  .mast .sub{color:#333}
  .panel{break-inside:avoid;box-shadow:none;border-width:1px}
  .q{break-inside:avoid}
  textarea{border:0;border-bottom:1px solid #999;min-height:0;height:52px}
  .wrap{max-width:none;padding:0}
  a{color:#000;text-decoration:none}
  .lv{display:block !important}
}

.cell{text-align:center;font-weight:900}
.cell.y{background:#eef4f1;color:var(--pine)}
.cell.p{background:#fbf5e8;color:var(--warn)}
.cell.n{background:#fff;color:var(--hair)}
td.nm{font-weight:800;white-space:nowrap}
.flag{border-left:5px solid var(--warn);background:#fbf5e8;padding:10px 12px;margin-bottom:8px;border-radius:0 4px 4px 0}
#login{max-width:400px;margin:60px auto}
.tabs button[aria-pressed="true"]{background:var(--pine);color:#fff}
table.dash{font-size:14px}
table.dash th{position:sticky;top:0;z-index:2}
.scroll{overflow:auto;max-height:70vh;border:2px solid var(--rule);border-radius:4px}
</style>
</head>
<body data-level="2">
<header class="mast"><div class="wrap">
  <a class="crumb" href="index.html">&larr; Maus unit home</a>
  <h1>Teacher Dashboard</h1>
  <p class="sub">Maus · Holocaust · Oral Histories</p>
</div></header>

<main class="wrap">
<div id="login" class="panel">
  <h2 style="margin-top:0">Password</h2>
  <input type="password" id="pw" style="width:100%;font-size:18px;padding:10px;border:2px solid var(--rule);border-radius:4px">
  <button class="btn-go" style="margin-top:10px;width:100%" onclick="login()">Open</button>
  <p id="pwerr" style="color:var(--no);font-weight:800"></p>
</div>

<div id="app" style="display:none">
  <div class="panel" style="border-width:3px">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="font-weight:900">Period</label>
      <select id="per" style="font-family:var(--f);font-weight:800;padding:6px;border:2px solid var(--rule);border-radius:4px">
        <option value="">all</option><option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option><option>7</option>
      </select>
      <div class="levels tabs" id="view">
        <button data-v="grid" aria-pressed="true">Completion</button>
        <button data-v="care" aria-pressed="false">Check-ins</button>
        <button data-v="oral" aria-pressed="false">Oral history</button>
        <button data-v="work" aria-pressed="false">Read work</button>
      </div>
      <span class="spacer"></span>
      <button onclick="load()">Refresh</button>
      <button class="btn-sm" onclick="csv()">CSV</button>
    </div>
    <p style="margin:10px 0 0"><small id="meta"></small></p>
  </div>
  <div id="out"></div>
</div>
</main>

<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co', SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PASS='galileo2026';
var ROWS=[], VIEW='grid';
var ACTS=[['background','Background'],['vocab','Vocab'],['reading','Reading'],
          ['oralhistory','Oral history'],['assessment','Test']];
var CHIDS=['m1c1','m1c2','m1c3','m1c4','m1c5','m1c6','m2c1','m2c2','m2c3','m2c4','m2c5'];
var STAGES=['choose','write','practice','interview','transcribe','translate','detail','story','edit','publish'];

function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function login(){
  if($('#pw').value===PASS){
    $('#login').style.display='none'; $('#app').style.display='block';
    try{sessionStorage.setItem('maus_t','1')}catch(e){}
    load();
  } else { $('#pwerr').textContent='Not that one.' }
}
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
try{ if(sessionStorage.getItem('maus_t')==='1'){
  $('#login').style.display='none';$('#app').style.display='block';
} }catch(e){}

function load(){
  $('#meta').textContent='loading…';
  fetch(SUPA_URL+'/rest/v1/maus_progress?select=*&order=updated_at.desc&limit=2000',
    {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}})
    .then(function(r){return r.json()})
    .then(function(d){
      ROWS=Array.isArray(d)?d:[];
      $('#meta').textContent=ROWS.length+' saved records · '+new Date().toLocaleString();
      render();
    })
    .catch(function(){ $('#meta').textContent='Could not load. Check the table exists.' });
}

function filtered(){
  var p=$('#per').value;
  return ROWS.filter(function(r){ return !p || String(r.class_period)===p });
}
function students(){
  var m={};
  filtered().forEach(function(r){
    var k=r.student_name+'|'+r.class_period;
    if(!m[k]) m[k]={name:r.display_name||r.student_name,per:r.class_period,acts:{}};
    m[k].acts[r.activity]=r;
  });
  return Object.keys(m).sort().map(function(k){return m[k]});
}

function gridView(){
  var ss=students();
  if(!ss.length) return '<div class="panel">Nothing saved yet for this period.</div>';
  var head='<tr><th>Student</th><th>P</th>'+ACTS.map(function(a){return '<th>'+a[1]+'</th>'}).join('')+
           '<th>Chapters done</th><th>Last seen</th></tr>';
  var body=ss.map(function(s){
    var cells=ACTS.map(function(a){
      var r=s.acts[a[0]];
      if(!r) return '<td class="cell n">·</td>';
      if(r.turned_in) return '<td class="cell y">in</td>';
      return '<td class="cell p">started</td>';
    }).join('');
    var rg=s.acts['reading'], n=0;
    if(rg&&rg.answers){
      CHIDS.forEach(function(c){ if(rg.answers[c+'.exit']) n++ });
    }
    var last=Object.keys(s.acts).map(function(k){return s.acts[k].updated_at}).sort().pop();
    return '<tr><td class="nm">'+esc(s.name)+'</td><td>'+esc(s.per)+'</td>'+cells+
      '<td class="cell">'+n+'/11</td><td><small>'+(last?new Date(last).toLocaleDateString():'')+'</small></td></tr>';
  }).join('');
  return '<div class="scroll"><table class="dash">'+head+body+'</table></div>';
}

function careView(){
  var out=[], heavy=[], fast=[];
  filtered().forEach(function(r){
    if(r.activity!=='reading'||!r.answers) return;
    CHIDS.forEach(function(c){
      var m=r.answers[c+'.mood'];
      if(m==='heavy') heavy.push([r.display_name||r.student_name,r.class_period,c,r.answers[c+'.exit']||'']);
      if(m==='fast') fast.push([r.display_name||r.student_name,r.class_period,c]);
    });
  });
  var h='<div class="panel"><h2 style="margin-top:0">Said “this was heavy for me today”</h2>'+
    (heavy.length? heavy.map(function(x){
      return '<div class="flag"><b>'+esc(x[0])+'</b> (P'+esc(x[1])+') · '+esc(x[2])+
             (x[3]?'<br><small>Exit ticket: '+esc(x[3])+'</small>':'')+'</div>';
    }).join('') : '<p>Nobody this week.</p>')+'</div>';
  var f='<div class="panel"><h2 style="margin-top:0">Said “too fast — I need to go over it again”</h2>'+
    (fast.length? '<p>'+fast.map(function(x){return esc(x[0])+' (P'+esc(x[1])+', '+esc(x[2])+')'}).join(' · ')+'</p>'
     : '<p>Nobody this week.</p>')+'</div>';
  return h+f;
}

function oralView(){
  var rows=filtered().filter(function(r){return r.activity==='oralhistory'});
  if(!rows.length) return '<div class="panel">No oral history work saved yet.</div>';
  var head='<tr><th>Student</th><th>P</th><th>Interviewing</th>'+
    STAGES.map(function(s){return '<th title="'+s+'">'+s.slice(0,4)+'</th>'}).join('')+
    '<th>Story words</th><th>Audio</th></tr>';
  var body=rows.sort(function(a,b){return (a.display_name||'').localeCompare(b.display_name||'')})
   .map(function(r){
    var a=r.answers||{};
    var cells=STAGES.map(function(s){
      return '<td class="cell '+(a['oh.stage.'+s]==='1'?'y">✓':'n">·')+'</td>';
    }).join('');
    var w=String(a['oh.story']||'').split(/[^A-Za-z0-9'-]+/).filter(Boolean).length;
    return '<tr><td class="nm">'+esc(r.display_name||r.student_name)+'</td><td>'+esc(r.class_period)+'</td>'+
      '<td><small>'+esc(a['oh.who']||'—')+(a['oh.rel']?' ('+esc(a['oh.rel'])+')':'')+'</small></td>'+cells+
      '<td class="cell">'+w+'</td>'+
      '<td class="cell">'+(a['oh.audio']?'<a href="'+esc(a['oh.audio'])+'" target="_blank">play</a>':'·')+'</td></tr>';
  }).join('');
  var noone=rows.filter(function(r){return !(r.answers||{})['oh.who']}).length;
  return (noone? '<div class="panel"><div class="flag"><b>'+noone+
      ' student(s) have opened the project but not chosen a person yet.</b> '+
      'These are the ones who quietly fall off. Talk to them today.</div></div>':'')+
    '<div class="scroll"><table class="dash">'+head+body+'</table></div>';
}

function workView(){
  var ss=students();
  return ss.map(function(s){
    var blocks=Object.keys(s.acts).map(function(act){
      var a=s.acts[act].answers||{};
      var ks=Object.keys(a).filter(function(k){
        if(typeof a[k]!=='string') return false;
        if(/\.(mood|pick|code\d|stage\.|ed\d|sc\d)/.test(k)) return false;
        if(/^(ch|st|th)\.\d+$/.test(k)) return false;
        if(a[k]==='0'||a[k]==='1') return false;
        return a[k].trim().length>3;
      });
      if(!ks.length) return '';
      return '<h3 style="margin-bottom:6px">'+esc(act)+'</h3>'+
        ks.map(function(k){
          return '<div style="margin-bottom:8px"><small style="color:var(--ink-3)">'+esc(k)+'</small><br>'+
                 esc(a[k])+'</div>';
        }).join('');
    }).join('');
    if(!blocks) return '';
    return '<details class="panel"><summary style="font-weight:900;cursor:pointer">'+
      esc(s.name)+' — P'+esc(s.per)+'</summary>'+blocks+'</details>';
  }).join('') || '<div class="panel">No written work yet.</div>';
}

function render(){
  var v={grid:gridView,care:careView,oral:oralView,work:workView}[VIEW];
  $('#out').innerHTML=v();
}
$$('#view button').forEach(function(b){
  b.addEventListener('click',function(){
    VIEW=b.dataset.v;
    $$('#view button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    render();
  });
});
$('#per').addEventListener('change',render);

function csv(){
  var ss=students();
  var head=['name','period'].concat(ACTS.map(function(a){return a[1]})).concat(['chapters','last']);
  var lines=[head.join(',')];
  ss.forEach(function(s){
    var row=[s.name,s.per];
    ACTS.forEach(function(a){
      var r=s.acts[a[0]]; row.push(!r?'':(r.turned_in?'turned in':'started'));
    });
    var rg=s.acts['reading'],n=0;
    if(rg&&rg.answers) CHIDS.forEach(function(c){if(rg.answers[c+'.exit'])n++});
    row.push(n);
    var last=Object.keys(s.acts).map(function(k){return s.acts[k].updated_at}).sort().pop();
    row.push(last?new Date(last).toLocaleDateString():'');
    lines.push(row.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(','));
  });
  var b=new Blob([lines.join('\\n')],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='maus-progress.csv'; a.click();
}

if($('#app').style.display!=='none') load();
</script>

</body>
