<style>

<script>
window.GAL_META={title:'Question Practice: Find Someone Who (ELD 103)',unit:'ELD 103',skills:['negation-and-questions']};
window.GAL_SCORE=0; window.GAL_MAX=38;

var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
var SET='fsw-103';
var TABLE='question_work', FALLBACK='song_work', useFallback=false;

/* code, label, English name for the proxy, rtl */
var LANGS=[['es','Español','Spanish'],['zh-CN','中文 (普通话)','Mandarin Chinese'],['yue','廣東話 (Cantonese)','Cantonese'],['ar','العربية','Arabic',1],['vi','Tiếng Việt','Vietnamese'],['th','ไทย','Thai'],['ne','नेपाली','Nepali'],['ary','الدارجة (Darija)','Moroccan Arabic (Darija)',1],['ru','Русский','Russian'],['ur','اردو','Urdu',1],['tl','Tagalog','Tagalog'],['fr','Français','French'],['ko','한국어','Korean'],['hi','हिन्दी','Hindi'],['so','Soomaali','Somali']];
var ALIAS={spanish:'es',español:'es',mandarin:'zh-CN',chinese:'zh-CN',zh:'zh-CN',cantonese:'yue',arabic:'ar',vietnamese:'vi',thai:'th',nepali:'ne',darija:'ary',russian:'ru',urdu:'ur',tagalog:'tl',french:'fr',korean:'ko',hindi:'hi',somali:'so'};
function normLang(v){v=String(v||'').trim();if(!v)return '';for(var i=0;i<LANGS.length;i++)if(LANGS[i][0].toLowerCase()===v.toLowerCase())return LANGS[i][0];return ALIAS[v.toLowerCase()]||'';}
function langRow(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i][0]===c)return LANGS[i];return null;}

/* ------------ the 20 prompts, in the order of the paper sheet ------------
   h: helper verbs accepted as the first word
   pp: past participles accepted after "Have you (ever)"
   v: verbs accepted after "Do/Would you (still)"   vBy: per-helper override
   need: words that must appear   keys: content words that must appear (prefix match)   */
var ITEMS=[
 {p:"has lived in more than two cities",m:"Have you ever lived in more than two cities?",h:['have'],pp:['lived'],keys:['cities'],ex:1},
 {p:"would rather be invisible than be able to fly",m:"Would you rather be invisible than be able to fly?",h:['would'],v:['rather'],need:['than'],keys:['invisible','fly']},
 {p:"has tried a food they really hated",m:"Have you ever tried a food you really hated?",h:['have'],pp:['tried','eaten'],keys:['food','hated']},
 {p:"thinks school here is harder than in their home country",m:"Do you think school here is harder than in your home country?",h:['do'],v:['think'],keys:['school','harder','country']},
 {p:"knows a word in their language that has no English translation",m:"Do you know a word in your language that has no English translation?",h:['do'],v:['know'],keys:['word','language','translation']},
 {p:"would choose to live 100 years in the past, not the future",m:"Would you choose to live 100 years in the past, not the future?",h:['would'],v:['choose','rather','want','like'],keys:['past']},
 {p:"has a skill most people in this class don't know about",m:"Do you have a skill most people in this class don't know about?",h:['do'],v:['have'],keys:['skill']},
 {p:"has read a whole book in English",m:"Have you ever read a whole book in English?",h:['have'],pp:['read','finished'],keys:['book','english']},
 {p:"disagrees with a school rule and can explain why",m:"Do you disagree with a school rule, and can you explain why?",h:['do'],v:['disagree'],need:['explain'],keys:['rule']},
 {p:"still remembers a strange dream",m:"Do you still remember a strange dream?",h:['do'],v:['remember'],keys:['dream']},
 {p:"wants a job where they use two languages",m:"Do you want a job where you use two languages?",h:['do'],v:['want'],keys:['job','languages']},
 {p:"thinks AI will make school easier, not harder",m:"Do you think AI will make school easier, not harder?",h:['do'],v:['think'],keys:['ai','easier']},
 {p:"has taught someone how to do something",m:"Have you ever taught someone how to do something?",h:['have'],pp:['taught'],keys:['someone']},
 {p:"feels more confident speaking English now than in August",m:"Do you feel more confident speaking English now than in August?",h:['do','are'],vBy:{'do':['feel'],'are':['more']},keys:['confident','august']},
 {p:"would change one thing about San Francisco",m:"Would you change one thing about San Francisco?",h:['would'],v:['change'],keys:['san','francisco']},
 {p:"has been surprised by something in the U.S.",m:"Have you ever been surprised by something in the U.S.?",h:['have'],pp:['been'],keys:['surprised']},
 {p:"has stayed in a stranger's house or a cheap hotel",m:"Have you ever stayed in a stranger's house or a cheap hotel?",h:['have'],pp:['stayed','slept','lived'],keys:['hotel']},
 {p:"has had a bad feeling about a place or a person",m:"Have you ever had a bad feeling about a place or a person?",h:['have'],pp:['had','felt'],keys:['feeling']},
 {p:"thinks Billy trusts people too easily",m:"Do you think Billy trusts people too easily?",h:['do'],v:['think'],keys:['billy','people']},
 {p:"would leave the Landlady's house right now",m:"Would you leave the Landlady's house right now?",h:['would'],v:['leave'],keys:['landlady','house']}
];
var PP_FIX={live:'lived',lives:'lived',living:'lived',try:'tried',tries:'tried',trying:'tried',eat:'eaten',ate:'eaten',reads:'read',reading:'read',teach:'taught',teaches:'taught',teached:'taught',be:'been',is:'been',are:'been',was:'been',were:'been',stay:'stayed',stays:'stayed',has:'had',have:'had',having:'had',feel:'felt',feels:'felt',sleep:'slept',finish:'finished'};
var SKIP_AFTER_YOU={ever:1,still:1,really:1,already:1,once:1,'actually':1};

/* ---------------- rule checks: return null (correct) or {rule, hint} ---------------- */
function words(s){return (s.toLowerCase().replace(/[’‘]/g,"'").match(/[a-z0-9']+(\.[a-z]\.)?/g)||[]);}
function check(item,raw){
  var s=raw.replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
  if(!s) return {rule:'empty',hint:'Type your question first.'};
  var w=words(s), lo=s.toLowerCase();
  if(/someone who|find someone/.test(lo)) return {rule:'copied',hint:'Don’t copy “Find someone who.” Ask your classmate directly: start with a helper verb and “you”.'};
  var first=w[0]||'';
  if(item.h.indexOf(first)<0){
    var tip=item.h[0]==='have'?'This sentence has “has + a past verb”. Start with “Have you ever…?”':
            item.h[0]==='would'?'This sentence has “would”. Start with “Would you…?”':
            'This sentence has a present verb (knows, thinks, wants…). Start with “Do you…?”';
    if(first==='does') tip='With “you”, use “Do”, not “Does”. '+tip;
    if(first==='you') tip='A question starts with a helper verb, not “you”. '+tip;
    return {rule:'helper',hint:tip};
  }
  if(!/^[A-Z]/.test(s)) return {rule:'capital',hint:'Start your question with a capital letter.'};
  if(w[1]!=='you') return {rule:'you',hint:'After “'+cap(first)+'”, put “you” — you are asking your classmate: “'+cap(first)+' you …?”'};
  var they=w.filter(function(x){return /^(they|their|them|theirs|themselves|they're)$/.test(x);});
  if(they.length) return {rule:'their',hint:'You are talking TO your classmate. Change “'+they[0]+'” → “'+({they:'you',their:'your',them:'you',theirs:'yours',themselves:'yourself',"they're":"you're"}[they[0]])+'”.'};
  var i=2; while(i<w.length&&SKIP_AFTER_YOU[w[i]]) i++;
  var nxt=w[i]||'';
  if(first==='have'){
    if(item.pp.indexOf(nxt)<0){
      if(PP_FIX[nxt]) return {rule:'participle',hint:'After “Have you ever”, use the past participle: “'+PP_FIX[nxt]+'”, not “'+nxt+'”.'};
      return {rule:'participle',hint:'After “Have you ever”, use the past participle from the sentence: “'+item.pp[0]+'”.'};
    }
  } else {
    var ok=(item.vBy&&item.vBy[first])||item.v||[];
    if(ok.indexOf(nxt)<0){
      var base=ok[0];
      if(nxt===base+'s'||nxt===base+'es'||(base==='have'&&nxt==='has')) return {rule:'base',hint:'After “'+cap(first)+' you”, use the base verb: “'+base+'”, not “'+nxt+'”.'};
      if(item.v&&item.v[0]==='rather') return {rule:'rather',hint:'Use the pattern: “Would you rather ___ than ___?”'};
      return {rule:'verb',hint:'After “'+cap(first)+' you”, use the verb from the sentence: “'+base+'”.'};
    }
  }
  if(item.need){for(var n=0;n<item.need.length;n++) if(w.indexOf(item.need[n])<0){
    if(item.need[n]==='than') return {rule:'rather',hint:'Use the pattern: “Would you rather ___ than ___?” — you need “than”.'};
    return {rule:'idea',hint:'Keep the whole idea: add “'+item.need[n]+'”.'};
  }}
  if(/can explain/.test(lo)&&!/can you explain/.test(lo)) return {rule:'you',hint:'The second part is a question too: “…and can you explain why?”'};
  if(/billy trust\b/.test(lo)) return {rule:'billy',hint:'Billy is one person, so keep the -s: “Billy trusts”.'};
  for(var k=0;k<item.keys.length;k++){var key=item.keys[k];if(!w.some(function(x){return x.indexOf(key)===0;}))return {rule:'idea',hint:'Keep the idea from the sentence — your question needs “'+key+'”.'};}
  if(!/\?$/.test(s)) return {rule:'qmark',hint:'End with a question mark (?).'};
  return null;
}
function cap(x){return x.charAt(0).toUpperCase()+x.slice(1);}

/* ---------------- state ---------------- */
var ST={first:'',last:'',name:'',email:'',period:'',lang:'',cur:0,A:{},turnedIn:false};
function rec(i){return ST.A[i]||(ST.A[i]={tries:0,misses:[],final:'',firstTry:false,draft:''});}
function pts(i){var r=ST.A[i];if(!r||!r.final||ITEMS[i].ex)return 0;return r.tries<=1?2:1;}
function total(){var t=0;for(var i=0;i<ITEMS.length;i++)t+=pts(i);return t;}
function doneCount(){var n=0;for(var i=0;i<ITEMS.length;i++)if(ST.A[i]&&ST.A[i].final)n++;return n;}
function updScore(){window.GAL_SCORE=total();$('score').textContent=window.GAL_SCORE+' / '+window.GAL_MAX;}

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------------- speech ---------------- */
function say(t){try{speechSynthesis.cancel();var x=String(t).replace(/\bI\b/g,'eye').replace(/U\.S\./g,'U S').replace(/\bAI\b/g,'A I');var u=new SpeechSynthesisUtterance(x);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}

/* ---------------- translation (directions + hints) ---------------- */
var TRC={};try{TRC=JSON.parse(localStorage.getItem('q_tr_cache')||'{}');}catch(e){}
function trans(text,lang){
  var key=lang+'|'+text; if(TRC[key]) return Promise.resolve(TRC[key]);
  var r=langRow(lang); if(!r) return Promise.resolve('');
  return fetch(PROXY+'?action=translate&mode=sentence&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('Directions for an intermediate English student. Translate plainly.')+'&lang='+encodeURIComponent(r[2]))
   .then(function(x){return x.json();}).then(function(j){var t=(j&&j.translation&&(j.translation.equiv||j.translation.meaning))||'';if(t){TRC[key]=t;try{localStorage.setItem('q_tr_cache',JSON.stringify(TRC));}catch(e){}}return t;}).catch(function(){return '';});
}
function fillTr(el){
  var en=el.getAttribute('data-en'); if(!en) return;
  var tr=el.querySelector('.tr');
  if(!el.getAttribute('data-done')){el.textContent=en;tr=document.createElement('span');tr.className='tr';tr.setAttribute('translate','no');el.appendChild(tr);el.setAttribute('data-done','1');}
  tr.textContent='';
  var lang=ST.lang; if(!lang) return;
  var r=langRow(lang); tr.setAttribute('dir',r&&r[3]?'rtl':'ltr');
  trans(en,lang).then(function(t){if(ST.lang===lang)tr.textContent=t;});
}
function trAll(){var d=document.querySelectorAll('[data-en]');for(var i=0;i<d.length;i++)fillTr(d[i]);}

/* ---------------- render ---------------- */
function renderDots(){
  var h='';
  for(var i=0;i<ITEMS.length;i++){
    var open=i===0||(ST.A[i-1]&&ST.A[i-1].final)||(ST.A[i]&&ST.A[i].final);
    h+='<button class="dot'+(ST.A[i]&&ST.A[i].final?' done':'')+(i===ST.cur?' cur':'')+'" data-i="'+i+'"'+(open?'':' disabled')+' title="'+(i+1)+'">'+(i+1)+'</button>';
  }
  var all=doneCount()===ITEMS.length;
  h+='<button class="dot'+(ST.cur===-1?' cur':'')+'" data-i="-1" style="width:auto;padding:0 12px;border-radius:19px"'+(all?'':' disabled')+'>📋 My questions</button>';
  $('dots').innerHTML=h;
}
function render(){
  renderDots(); updScore();
  if(ST.cur===-1){$('work').classList.add('hidden');$('finalBox').classList.remove('hidden');renderFinal();trAll();return;}
  $('work').classList.remove('hidden');$('finalBox').classList.add('hidden');
  var i=ST.cur,it=ITEMS[i],r=rec(i);
  var h='<div style="font-weight:900;color:#4a5568">Question '+(i+1)+' of '+ITEMS.length+(it.ex?' · Worked example':'')+'</div>';
  h+='<div class="prompt"><span class="fsw">Find someone who…</span>'+esc(it.p)+' <button class="say" data-say="Find someone who '+esc(it.p)+'" aria-label="Listen">🔊</button></div>';
  if(it.ex){
    h+='<div class="ex"><b class="dir" data-en="Worked example: how to change the sentence into a question"></b><ol>'+
       '<li><b>has lived</b> <span class="arrow">→</span> <b>Have you ever lived</b> <span class="dir" data-en="(has + past verb → Have you ever + past verb)"></span></li>'+
       '<li><b>more than two cities</b> <span class="arrow">→</span> <b>more than two cities</b> <span class="dir" data-en="(keep the rest of the idea)"></span></li>'+
       '<li><b>.</b> <span class="arrow">→</span> <b>?</b> <span class="dir" data-en="(end with a question mark)"></span></li></ol>'+
       '<div style="margin-top:8px;font-size:22px;font-weight:900">Have you ever lived in more than two cities? <button class="say" data-say="Have you ever lived in more than two cities?">🔊</button></div>'+
       '<p class="dir" data-en="Now type the example question yourself to start."></p></div>';
  }
  if(r.final){
    h+='<div class="fb ok"><span class="mark">✓</span>'+esc(r.final)+' <button class="say" data-say="'+esc(r.final)+'">🔊</button></div>';
    h+=historyHtml(r);
    h+='<div class="row"><button class="btn g" id="nextBtn">'+(i===ITEMS.length-1?'📋 See all my questions →':'Next →')+'</button><button class="btn w" id="redoBtn">✏️ Change it</button></div>';
  } else {
    h+='<textarea id="ans" rows="2" spellcheck="false" autocomplete="off" placeholder="Type your question…">'+esc(r.draft||'')+'</textarea>';
    h+='<div class="row"><button class="btn" id="checkBtn">Check</button></div>';
    if(r.lastHint){
      h+='<div class="fb bad"><span class="mark">✗</span><span class="dir" data-en="'+esc(r.lastHint)+'"></span></div>';
      if(r.tries>=2) h+='<div class="model"><b class="dir" data-en="Model answer — use it to fix yours:"></b><div style="font-size:21px;font-weight:900;margin-top:4px">'+esc(it.m)+' <button class="say" data-say="'+esc(it.m)+'">🔊</button></div></div>';
    }
    h+=historyHtml(r);
  }
  $('work').innerHTML=h; trAll();
  var a=$('ans'); if(a){a.focus();a.addEventListener('input',function(){rec(ST.cur).draft=a.value;dirty=true;});a.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doCheck();}});}
}
function historyHtml(r){
  if(!r.misses.length) return '';
  return '<div class="history">'+r.misses.map(function(m){return '<div><span class="x">✗</span> '+esc(m.text)+'</div>';}).join('')+(r.final?'<div><span class="v">✓</span> '+esc(r.final)+'</div>':'')+'</div>';
}
function renderFinal(){
  $('finalList').innerHTML=ITEMS.map(function(it,i){var r=ST.A[i]||{};return '<li><span class="p">Find someone who '+esc(it.p)+'</span><b>'+esc(r.final||'—')+'</b> <button class="say noprint" data-say="'+esc(r.final||'')+'">🔊</button></li>';}).join('');
  $('turnMsg').textContent=ST.turnedIn?'Turned in ✓':'';
}

/* ---------------- actions ---------------- */
function doCheck(){
  var i=ST.cur,it=ITEMS[i],r=rec(i),v=$('ans').value;
  var res=check(it,v);
  if(res&&res.rule==='empty'){r.lastHint=res.hint;render();return;}
  r.tries++;
  if(res){r.misses.push({text:v.trim(),rule:res.rule,at:new Date().toISOString()});r.lastHint=res.hint;r.draft=v;}
  else{r.final=v.replace(/\s+/g,' ').trim();r.firstTry=r.tries===1;r.lastHint='';r.draft='';}
  dirty=true; save(); render();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.hasAttribute('data-say')){say(b.getAttribute('data-say'));return;}
  if(b.classList.contains('dot')){ST.cur=+b.getAttribute('data-i');render();window.scrollTo(0,0);return;}
  if(b.id==='checkBtn'){doCheck();return;}
  if(b.id==='nextBtn'){ST.cur=ST.cur===ITEMS.length-1?-1:ST.cur+1;render();return;}
  if(b.id==='redoBtn'){var r=rec(ST.cur);r.draft=r.final;r.final='';dirty=true;render();return;}
  if(b.id==='printBtn'){window.print();return;}
  if(b.id==='turnBtn'){ST.turnedIn=true;dirty=true;save(true);$('turnMsg').textContent='Turned in ✓';return;}
});

/* ---------------- Supabase ---------------- */
function hdr(p){var h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};if(p)h.Prefer=p;return h;}
var dirty=false;
function payload(){return {cur:ST.cur,lang:ST.lang,items:ST.A,done:doneCount(),score:total(),max:window.GAL_MAX};}
function save(force){
  if(!ST.email) return;
  if(!dirty&&!force) return;
  dirty=false; updScore();
  var row=useFallback?
    {email:ST.email,set_slug:'questions-'+SET,name:ST.name,period:String(ST.period),level:'ELD 103',answers:payload(),turned_in:ST.turnedIn,updated_at:new Date().toISOString()}:
    {email:ST.email,set_slug:SET,name:ST.name,period:String(ST.period),lang:ST.lang,answers:payload(),score:total(),max_score:window.GAL_MAX,done:doneCount(),turned_in:ST.turnedIn,updated_at:new Date().toISOString()};
  return fetch(SUPA_URL+'/rest/v1/'+(useFallback?FALLBACK:TABLE)+'?on_conflict=email,set_slug',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([row])})
    .then(function(x){if(!x.ok&&!useFallback&&(x.status===404||x.status===400)){useFallback=true;dirty=true;return save(force);}})
    .catch(function(){dirty=true;});
}
setInterval(function(){save();},20000);
window.addEventListener('beforeunload',function(){save();});
function load(){
  function get(tbl,slug){return fetch(SUPA_URL+'/rest/v1/'+tbl+'?select=answers,turned_in&email=eq.'+encodeURIComponent(ST.email)+'&set_slug=eq.'+encodeURIComponent(slug),{headers:hdr()}).then(function(x){if(!x.ok)throw x.status;return x.json();});}
  return get(TABLE,SET).catch(function(){useFallback=true;return get(FALLBACK,'questions-'+SET);})
   .then(function(rows){var a=rows&&rows[0]&&rows[0].answers;if(a&&a.items){ST.A=a.items;ST.cur=typeof a.cur==='number'?a.cur:0;ST.turnedIn=!!rows[0].turned_in;}})
   .catch(function(){});
}

/* ---------------- sign-in ---------------- */
function canonical(e){e=e.trim().toLowerCase();if(e.indexOf('@')<0)e+='@sfusd.edu';return e.replace(/@s\.sfusd\.edu$/,'@sfusd.edu');}
function setup(){
  var opts=LANGS.map(function(l){return '<option value="'+l[0]+'">'+esc(l[1])+'</option>';}).join('');
  $('inLang').innerHTML='<option value="">Choose…</option>'+opts; $('langSel').innerHTML=opts;
  try{
    $('inFirst').value=localStorage.getItem('gal_student_first')||'';
    $('inLast').value=localStorage.getItem('gal_student_last')||'';
    $('inEmail').value=localStorage.getItem('gal_student_email')||'';
    $('inPer').value=localStorage.getItem('gal_student_period')||'';
    $('inLang').value=normLang(localStorage.getItem('vocab_lang')||localStorage.getItem('gal_student_l1'));
  }catch(e){}
  $('goBtn').addEventListener('click',signIn);
  $('langSel').addEventListener('change',function(){ST.lang=this.value;try{localStorage.setItem('vocab_lang',ST.lang);}catch(e){}trAll();dirty=true;});
}
function signIn(){
  var f=$('inFirst').value.trim(),l=$('inLast').value.trim(),e=$('inEmail').value.trim(),p=$('inPer').value,lg=normLang($('inLang').value)||$('inLang').value;
  if(!f||!l){$('gateErr').textContent='Type your first and last name.';return;}
  if(!/^[^@\s]+(@(s\.)?sfusd\.edu)?$/i.test(e)){$('gateErr').textContent='Use your school email (@s.sfusd.edu).';return;}
  if(!p){$('gateErr').textContent='Choose your period.';return;}
  if(!lg){$('gateErr').textContent='Choose your language.';return;}
  var typed=e.toLowerCase(), canon=canonical(e);
  ST.first=f;ST.last=l;ST.name=f+' '+l;ST.email=canon;ST.period=p;ST.lang=lg;
  try{localStorage.setItem('gal_student_email',canon);localStorage.setItem('gal_student_name',ST.name);localStorage.setItem('gal_student_first',f);localStorage.setItem('gal_student_last',l);localStorage.setItem('gal_student_period',p);localStorage.setItem('vocab_lang',lg);}catch(ex){}
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{email:canon,first_name:f,last_name:l,updated_at:new Date().toISOString()}])}).catch(function(){});
  if(typed.indexOf('@')>0&&typed!==canon) fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:hdr('resolution=ignore-duplicates,return=minimal'),body:JSON.stringify([{alias_email:typed,email:canon}])}).catch(function(){});
  $('langSel').value=lg; $('whoLbl').textContent=ST.name+' · Period '+p;
  load().then(function(){$('gate').classList.add('hidden');render();});
}
setup();
</script>
<script src="/readings/track.js"></script>
</body>
