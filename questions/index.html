var MC=[
 {p:"has lived in more than two cities",o:[["Have you ever lived in more than two cities?"],["Have you ever live in more than two cities?","After Have you ever, use the past participle."],["Do you ever lived in more than two cities?","has + past verb → start with Have."],["Have they ever lived in more than two cities?","Ask the person: you."]]},

 {p:"has tried a food they really hated",o:[["Have you ever tried a food you really hated?"],["Have you ever tried a food they really hated?","Ask the person: they → you."],["Have you ever try a food you really hated?","try → tried."],["Did you ever tried a food you really hated?","Did needs the base verb. For your whole life, start with Have."]]},

 {p:"knows a word in their language that has no English translation",o:[["Do you know a word in your language that has no English translation?"],["Do you know a word in their language that has no English translation?","their → your."],["Does you know a word in your language that has no English translation?","Do you, not Does you."],["Do you knows a word in your language that has no English translation?","After you: know, not knows."]]},
 {p:"would choose to live 100 years in the past, not the future",o:[["Would you choose to live 100 years in the past, not the future?"],["Would you choose live 100 years in the past, not the future?","choose + to + verb."],["Would you chose to live 100 years in the past, not the future?","After would: choose, not chose."],["You would choose to live 100 years in the past, not the future?","Questions start with the helper verb."]]},
 {p:"has a skill most people in this class don’t know about",o:[["Do you have a skill most people in this class don’t know about?"],["Do you has a skill most people in this class don’t know about?","After Do you: have, not has."],["Are you have a skill most people in this class don’t know about?","have is not a helper here. Use Do."],["Do you have a skill most people in this class doesn’t know about?","people = many → don’t."]]},

 {p:"feels more confident speaking English now than in August",o:[["Do you feel more confident speaking English now than in August?"],["Do you feel more confidenter speaking English now than in August?","more confident (no -er)."],["Do you feels more confident speaking English now than in August?","After you: feel, not feels."],["Do you feel more confident speaking English now then in August?","Then = time. Compare with than."]]}
];
var TYPED=[
 {p:"would change one thing about San Francisco",m:"Would you change one thing about San Francisco?",h:['would'],v:['change'],keys:['san','francisco']},
 {p:"has been surprised by something in the U.S.",m:"Have you ever been surprised by something in the U.S.?",h:['have'],pp:['been'],keys:['surprised']},

 {p:"has had a bad feeling about a place or a person",m:"Have you ever had a bad feeling about a place or a person?",h:['have'],pp:['had','felt'],keys:['feeling']},
 {p:"has traveled alone to a new city",m:"Have you ever traveled alone to a new city?",h:['have'],pp:['traveled','travelled','gone','been','moved'],keys:['alone','cit']}
];
var PP_FIX={travel:'traveled',travels:'traveled',traveling:'traveled',go:'gone',went:'gone',move:'moved',live:'lived',lives:'lived',living:'lived',try:'tried',tries:'tried',trying:'tried',eat:'eaten',ate:'eaten',reads:'read',reading:'read',teach:'taught',teaches:'taught',teached:'taught',be:'been',is:'been',are:'been',was:'been',were:'been',stay:'stayed',stays:'stayed',has:'had',have:'had',having:'had',feel:'felt',feels:'felt',sleep:'slept',finish:'finished'};
var SKIP_AFTER_YOU={ever:1,still:1,really:1,already:1,once:1,'actually':1};

/* ---------------- rule checks: return null (correct) or {rule, hint} ---------------- */
function words(s){return (s.toLowerCase().replace(/[’‘]/g,"'").match(/[a-z0-9']+(\.[a-z]\.)?/g)||[]);}
function check(item,raw){
  var s=raw.replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
  if(!s) return {rule:'empty',hint:'Type your question first.'};
  var w=words(s), lo=s.toLowerCase();
  if(/someone who|find someone/.test(lo)) return {rule:'copied',hint:'Don’t copy “Find someone who.” Ask your classmate directly: start with a helper verb and “you”.'};
  var first=w[0]||'';
  if(item.h.indexOf(first)<0){
    var tip=item.h[0]==='have'?'This sentence has “has + a past verb”. Start with “Have you ever…?”':
            item.h[0]==='would'?'This sentence has “would”. Start with “Would you…?”':
            'This sentence has a present verb (knows, thinks, wants…). Start with “Do you…?”';
    if(first==='does') tip='With “you”, use “Do”, not “Does”. '+tip;
    if(first==='you') tip='A question starts with a helper verb, not “you”. '+tip;
    return {rule:'helper',hint:tip};
  }
  if(!/^[A-Z]/.test(s)) return {rule:'capital',hint:'Start your question with a capital letter.'};
  if(w[1]!=='you') return {rule:'you',hint:'After “'+cap(first)+'”, put “you” — you are asking your classmate: “'+cap(first)+' you …?”'};
  var they=w.filter(function(x){return /^(they|their|them|theirs|themselves|they're)$/.test(x);});
  if(they.length) return {rule:'their',hint:'You are talking TO your classmate. Change “'+they[0]+'” → “'+({they:'you',their:'your',them:'you',theirs:'yours',themselves:'yourself',"they're":"you're"}[they[0]])+'”.'};
  var i=2; while(i<w.length&&SKIP_AFTER_YOU[w[i]]) i++;
  var nxt=w[i]||'';
  if(first==='have'){
    if(item.pp.indexOf(nxt)<0){
      if(PP_FIX[nxt]) return {rule:'participle',hint:'After “Have you ever”, use the past participle: “'+PP_FIX[nxt]+'”, not “'+nxt+'”.'};
      return {rule:'participle',hint:'After “Have you ever”, use the past participle from the sentence: “'+item.pp[0]+'”.'};
    }
  } else {
    var ok=(item.vBy&&item.vBy[first])||item.v||[];
    if(ok.indexOf(nxt)<0){
      var base=ok[0];
      if(nxt===base+'s'||nxt===base+'es'||(base==='have'&&nxt==='has')) return {rule:'base',hint:'After “'+cap(first)+' you”, use the base verb: “'+base+'”, not “'+nxt+'”.'};
      if(item.v&&item.v[0]==='rather') return {rule:'rather',hint:'Use the pattern: “Would you rather ___ than ___?”'};
      return {rule:'verb',hint:'After “'+cap(first)+' you”, use the verb from the sentence: “'+base+'”.'};
    }
  }
  if(item.need){for(var n=0;n<item.need.length;n++) if(w.indexOf(item.need[n])<0){
    if(item.need[n]==='than') return {rule:'rather',hint:'Use the pattern: “Would you rather ___ than ___?” — you need “than”.'};
    return {rule:'idea',hint:'Keep the whole idea: add “'+item.need[n]+'”.'};
  }}
  if(/can explain/.test(lo)&&!/can you explain/.test(lo)) return {rule:'you',hint:'The second part is a question too: “…and can you explain why?”'};
  for(var k=0;k<item.keys.length;k++){var key=item.keys[k];if(!w.some(function(x){return x.indexOf(key)===0;}))return {rule:'idea',hint:'Keep the idea from the sentence — your question needs “'+key+'”.'};}
  if(!/\?$/.test(s)) return {rule:'qmark',hint:'End with a question mark (?).'};
  return null;
}
function cap(x){return x.charAt(0).toUpperCase()+x.slice(1);}


var N=MC.length+TYPED.length; window.GAL_MAX=N*2; window.GAL_SCORE=0;

var ST={email:'',name:'',period:'',lang:'',cur:0,A:{},order:{},turnedIn:false};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rec(i){return ST.A[i]||(ST.A[i]={tries:0,misses:[],final:''});}
function pts(i){var r=ST.A[i];return r&&r.final?(r.tries<=1?2:1):0;}
function done(){var n=0;for(var i=0;i<N;i++)if(ST.A[i]&&ST.A[i].final)n++;return n;}
function score(){var t=0;for(var i=0;i<N;i++)t+=pts(i);window.GAL_SCORE=t;return t;}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/U\.S\./g,'U S').replace(/\bAI\b/g,'A I').replace(/\bI\b/g,'eye'));u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}

/* shuffled answer order per student; the right answer never lands in the same slot more than 3 times in a row */
function makeOrders(){
  var last=-1,run=0;
  for(var i=0;i<MC.length;i++){
    var o,pos,tries=0;
    do{o=[0,1,2,3];for(var k=3;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=o[k];o[k]=o[j];o[j]=t;}pos=o.indexOf(0);tries++;}while(pos===last&&run>=3&&tries<50);
    if(pos===last)run++;else{last=pos;run=1;}
    ST.order[i]=o;
  }
}

function render(){
  score();
  var c=$('card');
  if(ST.cur>=N){c.innerHTML=finalHtml();return;}
  var i=ST.cur,r=rec(i),isMC=i<MC.length,it=isMC?MC[i]:TYPED[i-MC.length];
  var h='<div class="top"><span>'+(i+1)+' / '+N+'</span><span>'+(isMC?'Choose the correct question':'Write the question')+'</span></div><div class="bar"><i style="width:'+(done()/N*100)+'%"></i></div>';
  h+='<div class="fsw">Find someone who…</div><div class="prompt">'+esc(it.p)+'</div>';
  if(isMC){
    var o=ST.order[i];
    o.forEach(function(k){var cls=r.final?(k===0?' yes':''):(r.picked&&r.picked.indexOf(k)>-1?' no':'');
      h+='<button class="opt'+cls+'" data-k="'+k+'"'+((r.final||cls)?' disabled':'')+'>'+esc(it.o[k][0])+'</button>';});
    if(!r.final&&r.hint)h+='<div class="hint">✗ '+esc(r.hint)+'</div>';
  }else{
    if(r.final)h+='<div class="ok">✓ '+esc(r.final)+'</div>';
    else{
      h+='<textarea id="ans" rows="2" spellcheck="false" autocomplete="off" placeholder="Type the question…">'+esc(r.draft||'')+'</textarea><div class="row"><button class="btn" id="chk">Check</button></div>';
      if(r.hint)h+='<div class="hint">✗ '+esc(r.hint)+'</div>';
      if(r.tries>=2)h+='<div class="model">Model: '+esc(it.m)+'</div>';
    }
  }
  if(r.final)h+='<div class="row"><button class="btn g" id="next">'+(i===N-1?'See my questions →':'Next →')+'</button><button class="btn w" data-say="'+esc(r.final)+'">🔊</button></div>';

  c.innerHTML=h;
  var a=$('ans');if(a){a.focus();a.oninput=function(){rec(ST.cur).draft=a.value;dirty=true;};a.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();typedCheck();}};}
}
function finalHtml(){
  var h='<h2 style="margin:0 0 4px">Your questions</h2><p style="margin:0 0 6px">Copy them onto your paper. Then press Turn in.</p><ol class="final">';
  for(var i=0;i<N;i++){var r=ST.A[i]||{};h+='<li>'+esc(r.final||'—')+'</li>';}
  h+='</ol><div class="row noprint"><button class="btn w" id="back">← Back</button><button class="btn w" onclick="window.print()">🖨️ Print</button><button class="btn g" id="turn">✅ Turn in</button><b id="tmsg">'+(ST.turnedIn?'Turned in ✓':'')+'</b></div>';
  h+='<div class="row">Score: <b id="score">'+score()+' / '+window.GAL_MAX+'</b></div>';
  return h;
}
function pick(k){
  var i=ST.cur,r=rec(i),it=MC[i];if(r.final)return;
  r.tries++;
  if(k===0){r.final=it.o[0][0];r.hint='';say(r.final);}
  else{(r.picked=r.picked||[]).push(k);r.hint=it.o[k][1];r.misses.push({text:it.o[k][0],at:new Date().toISOString()});}
  dirty=true;save();render();
}
function typedCheck(){
  var i=ST.cur,it=TYPED[i-MC.length],r=rec(i),v=$('ans').value;
  var res=check(it,v);
  if(res&&res.rule==='empty'){r.hint=res.hint;render();return;}
  r.tries++;
  if(res){r.misses.push({text:v.trim(),rule:res.rule,at:new Date().toISOString()});r.hint=res.hint;r.draft=v;}
  else{r.final=v.replace(/\s+/g,' ').trim();r.hint='';r.draft='';say(r.final);}
  dirty=true;save();render();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-say')){say(b.getAttribute('data-say'));return;}
  if(b.classList.contains('opt')){pick(+b.getAttribute('data-k'));return;}
  if(b.id==='chk')typedCheck();
  if(b.id==='next'){ST.cur++;dirty=true;render();window.scrollTo(0,0);}
  if(b.id==='back'){ST.cur=Math.max(0,ST.cur-1);render();}
  if(b.id==='turn'){ST.turnedIn=true;dirty=true;save(true);$('tmsg').textContent='Turned in ✓';}
});

function hdr(p){var h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};if(p)h.Prefer=p;return h;}
var dirty=false;
function payload(){return {v:2,cur:ST.cur,order:ST.order,items:ST.A,done:done(),score:score(),max:window.GAL_MAX};}
function save(force){
  if(!ST.email||(!dirty&&!force))return;dirty=false;
  var row=useFallback?{email:ST.email,set_slug:'questions-'+SET,name:ST.name,period:String(ST.period),level:'ELD 103',answers:payload(),turned_in:ST.turnedIn,updated_at:new Date().toISOString()}
    :{email:ST.email,set_slug:SET,name:ST.name,period:String(ST.period),lang:ST.lang,answers:payload(),score:score(),max_score:window.GAL_MAX,done:done(),turned_in:ST.turnedIn,updated_at:new Date().toISOString()};
  return fetch(SUPA_URL+'/rest/v1/'+(useFallback?FALLBACK:TABLE)+'?on_conflict=email,set_slug',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([row])})
   .then(function(x){if(!x.ok&&!useFallback&&(x.status===404||x.status===400)){useFallback=true;dirty=true;return save(force);}}).catch(function(){dirty=true;});
}
setInterval(function(){save();},20000);
window.addEventListener('beforeunload',function(){save();});
function load(){
  function get(t,s){return fetch(SUPA_URL+'/rest/v1/'+t+'?select=answers,turned_in&email=eq.'+encodeURIComponent(ST.email)+'&set_slug=eq.'+encodeURIComponent(s),{headers:hdr()}).then(function(x){if(!x.ok)throw x.status;return x.json();});}
  return get(TABLE,SET).catch(function(){useFallback=true;return get(FALLBACK,'questions-'+SET);})
   .then(function(rows){var a=rows&&rows[0]&&rows[0].answers;if(a&&a.v===2&&a.items){ST.A=a.items;ST.order=a.order||{};ST.cur=a.cur||0;ST.turnedIn=!!rows[0].turned_in;}}).catch(function(){});
}

/* ---- sign-in ---- */
function canonical(e){e=e.trim().toLowerCase();if(e.indexOf('@')<0)e+='@sfusd.edu';return e.replace(/@s\.sfusd\.edu$/,'@sfusd.edu');}
(function(){
  $('inLang').innerHTML='<option value="">Choose…</option>'+LANGS.map(function(l){return '<option value="'+l[0]+'">'+esc(l[1])+'</option>';}).join('');
  try{$('inFirst').value=localStorage.getItem('gal_student_first')||'';$('inLast').value=localStorage.getItem('gal_student_last')||'';$('inEmail').value=localStorage.getItem('gal_student_email')||'';$('inPer').value=localStorage.getItem('gal_student_period')||'';$('inLang').value=localStorage.getItem('vocab_lang')||'';}catch(e){}
  $('goBtn').onclick=function(){
    var f=$('inFirst').value.trim(),l=$('inLast').value.trim(),e=$('inEmail').value.trim(),p=$('inPer').value,lg=$('inLang').value;
    if(!f||!l){$('gateErr').textContent='Type your first and last name.';return;}
    if(!/^[^@\s]+(@(s\.)?sfusd\.edu)?$/i.test(e)){$('gateErr').textContent='Use your school email (@s.sfusd.edu).';return;}
    if(!p){$('gateErr').textContent='Choose your period.';return;}
    if(!lg){$('gateErr').textContent='Choose your language.';return;}
    var typed=e.toLowerCase(),canon=canonical(e);
    ST.email=canon;ST.name=f+' '+l;ST.period=p;ST.lang=lg;
    try{localStorage.setItem('gal_student_email',canon);localStorage.setItem('gal_student_first',f);localStorage.setItem('gal_student_last',l);localStorage.setItem('gal_student_period',p);localStorage.setItem('vocab_lang',lg);}catch(x){}
    fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:hdr('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{email:canon,first_name:f,last_name:l,updated_at:new Date().toISOString()}])}).catch(function(){});
    if(typed.indexOf('@')>0&&typed!==canon)fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:hdr('resolution=ignore-duplicates,return=minimal'),body:JSON.stringify([{alias_email:typed,email:canon}])}).catch(function(){});
    $('who').textContent=ST.name+' · P'+p;
    load().then(function(){if(!Object.keys(ST.order).length){makeOrders();dirty=true;}$('gate').classList.add('hidden');render();});
  };
})();
</script>
<script src="/readings/track.js"></script>
</body>
