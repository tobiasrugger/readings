<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Vocabulary check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#5B2A6E; --plum-deep:#3D1A4C; --plum-edge:#2E1239;
  --lilac:#EFE7F3; --lilac-2:#E2D3EA; --paper:#FBF9FC;
  --gold:#E3A92B; --ink:#2A2030; --muted:#6E6275; --line:#D9CCE0; --warn:#B3261E;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;-webkit-user-select:none;user-select:none}
input,button,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.bar{background:var(--plum);color:#fff}
.bar .in{max-width:760px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:14px}
.bar h1{margin:0;font-size:1rem;font-weight:600}
.bar .who{margin-left:auto;font-size:.85rem;opacity:.9;text-align:right}
.bar .save{display:block;font-size:.72rem;opacity:.75}
.dots{display:flex;gap:5px;max-width:760px;margin:0 auto;padding:10px 20px 0;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--lilac-2)}
.dots i.done{background:var(--plum)}
.dots i.now{background:var(--gold)}

main{max-width:760px;margin:0 auto;padding:18px 20px 40px}
.panel{background:#fff;border:2px solid var(--line);border-radius:20px;padding:28px;margin:26px auto;max-width:480px}
.panel h2{margin:0 0 8px;font-size:1.5rem;color:var(--plum-deep)}
.panel p{margin:0 0 16px;color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:500;margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;-webkit-user-select:text;user-select:text}
.field input:focus,.field select:focus{outline:none;border-color:var(--plum)}
.err{color:var(--warn);font-size:.92rem;min-height:1.3em;margin-bottom:8px}
.btn{border:0;border-radius:14px;padding:13px 24px;font-weight:600;background:var(--plum);color:#fff;box-shadow:0 5px 0 var(--plum-edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--plum-edge)}
.btn.ghost{background:#fff;color:var(--plum);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}

/* menu */
.menu{display:grid;gap:12px;max-width:560px;margin:0 auto}
.menu a{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit}
.menu a:hover{border-color:var(--plum)}
.menu .e{font-size:2rem;line-height:1}
.menu b{display:block;font-weight:600;color:var(--plum-deep)}
.menu span{color:var(--muted);font-size:.88rem}

/* question */
.qwrap{max-width:520px;margin:0 auto}
.qnum{text-align:center;color:var(--muted);font-size:.9rem;margin:6px 0 4px}
.emoji{
  background:#fff;border:2px solid var(--line);border-radius:24px;
  display:grid;place-items:center;font-size:clamp(88px,26vw,140px);line-height:1.15;
  padding:22px 10px;margin-bottom:18px;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;min-height:58px;cursor:pointer}
.opt:hover{background:var(--paper)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--plum);background:#fff;flex:none}
.opt:has(input:checked){border-color:var(--plum);background:var(--lilac)}
.opt input:checked + .dot{background:var(--plum);box-shadow:inset 0 0 0 4px #fff}
.opt input:focus-visible + .dot{outline:3px solid var(--gold);outline-offset:3px}
/* the words are drawn by CSS so translators and copy-paste cannot reach them */
.opt .w::before{content:attr(data-w);font-size:1.2rem;font-weight:500}
.opt.idk{border-style:dashed}
.opt.idk .w::before{font-size:1rem;font-weight:400;color:var(--muted)}
.qfoot{display:flex;gap:12px;align-items:center;margin-top:18px}
.qfoot .msg{flex:1;color:var(--muted);font-size:.9rem}

.overlay{position:fixed;inset:0;background:rgba(46,18,57,.82);display:grid;place-items:center;z-index:50;padding:20px}
.overlay .box{background:#fff;border-radius:20px;padding:28px;max-width:420px;text-align:center}
.overlay h3{margin:0 0 10px;color:var(--plum-deep)}
.overlay p{margin:0 0 18px;color:var(--muted)}
#canary{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="canary" aria-hidden="true">Good morning, teacher. The dog is happy.</div>

<header class="bar">
  <div class="in">
    <h1 id="barTitle">Vocabulary check</h1>
    <div class="who"><span id="whoName"></span><span class="save" id="saveState"></span></div>
  </div>
</header>
<div class="dots" id="dots"></div>

<main>

  <section id="scrMenu" class="hidden">
    <p style="text-align:center;color:var(--muted)">Choose your vocabulary check.</p>
    <div class="menu" id="menu"></div>
  </section>

  <section id="scrSignin" class="panel hidden">
    <h2 id="signTitle">Sign in</h2>
    <p id="signSub">Mr. Toby</p>
    <div class="field"><label for="inName">Name</label><input id="inName" autocomplete="name"></div>
    <div class="field"><label for="inEmail">School email</label><input id="inEmail" type="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@s.sfusd.edu"></div>
    <div class="field"><label for="inPeriod">Period</label>
      <select id="inPeriod"><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
    </div>
    <div class="err" id="signErr"></div>
    <button class="btn wide" id="btnSignin">Start</button>
  </section>

  <section id="scrTest" class="qwrap hidden">
    <div class="qnum" id="qnum"></div>
    <div class="emoji" id="emoji" aria-hidden="true"></div>
    <div class="opts" id="opts" role="radiogroup" aria-label="Choose the word"></div>
    <div class="qfoot">
      <button class="btn ghost" id="btnBack">Back</button>
      <div class="msg" id="qmsg"></div>
      <button class="btn hidden" id="btnFinish">Finish</button>
    </div>
  </section>

  <section id="scrDone" class="panel hidden">
    <h2>You finished. 🎉</h2>
    <p>Thank you. Mr. Toby will see your answers.</p>
    <button class="btn ghost wide" id="btnAgain">Back to the list</button>
  </section>

</main>

<div class="overlay hidden" id="ovTranslate" role="alertdialog">
  <div class="box">
    <h3>Turn off translate</h3>
    <p>This check is in English only. Turn off translation, then tap Continue. Your answers are saved.</p>
    <button class="btn" id="btnTransOk">Continue</button>
  </div>
</div>

<script src="quizzes.js"></script>
<script>
/* ================= CONFIG ================= */
var SUPA_URL = 'https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE     = 'vocab_preassess';
var ALLOW_IDK = true;   // show "I don't know" under each question
var IDK       = '__idk';

var QUIZ = null;
var S = { email:'', name:'', period:'', items:[], answers:{}, i:0, created:false, translateFlags:0 };

function $(id){ return document.getElementById(id); }
function show(id){ ['scrMenu','scrSignin','scrTest','scrDone'].forEach(function(s){ $(s).classList.toggle('hidden', s !== id); }); window.scrollTo(0,0); }
function shuffle(a){ a=a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function sb(path, opts){
  opts = opts || {};
  return fetch(SUPA_URL + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY, 'Content-Type':'application/json' }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(r.status + ' ' + t); });
    return r.status === 204 ? null : r.text().then(function(t){ return t ? JSON.parse(t) : null; });
  });
}

/* ================= MENU ================= */
function renderMenu(){
  $('menu').innerHTML = (window.QUIZZES || []).map(function(q){
    return '<a href="?q=' + encodeURIComponent(q.id) + '"><span class="e">' + (q.emoji || '📝') + '</span>'
      + '<span><b>' + q.title + '</b><span>' + (q.tag ? q.tag + ' &middot; ' : '') + q.items.length + ' questions</span></span></a>';
  }).join('');
  show('scrMenu');
}

/* ================= SIGN IN ================= */
var EMAIL_RE = /^[^@\s]+@(s\.)?sfusd\.edu$/;

function canonicalEmail(typed){
  var local = typed.split('@')[0], a = local + '@s.sfusd.edu', b = local + '@sfusd.edu';
  return sb('students?select=email&email=in.(' + encodeURIComponent('"'+a+'","'+b+'"') + ')').then(function(rows){
    if (rows && rows.length) return rows.some(function(r){ return r.email === a; }) ? a : rows[0].email;
    return a;
  }).catch(function(){ return a; });
}

$('btnSignin').addEventListener('click', function(){
  var name = $('inName').value.trim(), typed = $('inEmail').value.trim().toLowerCase(), period = $('inPeriod').value, err = $('signErr');
  if (!name){ err.textContent = 'Write your name.'; return; }
  if (!EMAIL_RE.test(typed)){ err.textContent = 'Use your school email. It ends with @s.sfusd.edu'; return; }
  if (!period){ err.textContent = 'Choose your period.'; return; }
  err.textContent = '';
  var btn = this; btn.disabled = true; btn.textContent = 'Just a second…';

  canonicalEmail(typed).then(function(email){
    S.email = email; S.name = name; S.period = period;
    try {
      localStorage.setItem('gal_student_email', email);
      localStorage.setItem('gal_student_name', name);
      localStorage.setItem('gal_student_period', period);
    } catch(e){}
    var jobs = [ sb('students?on_conflict=email', { method:'POST', headers:{ Prefer:'resolution=ignore-duplicates,return=minimal' }, body:[{ email:email, name:name, period:period }] }).catch(function(){}) ];
    if (typed !== email) jobs.push(sb('student_aliases?on_conflict=alias_email', { method:'POST', headers:{ Prefer:'resolution=ignore-duplicates,return=minimal' }, body:[{ alias_email:typed, email:email }] }).catch(function(){}));
    return Promise.all(jobs).then(function(){
      return sb(TABLE + '?select=*&email=eq.' + encodeURIComponent(email) + '&quiz=eq.' + encodeURIComponent(QUIZ.id));
    });
  }).then(function(rows){
    $('whoName').textContent = S.name;
    var row = rows && rows[0];
    if (row && row.turned_in){ show('scrDone'); return; }
    if (row && row.items && row.items.length === QUIZ.items.length){
      S.items = row.items; S.answers = row.answers || {}; S.created = true;
      S.translateFlags = row.translate_flags || 0;
      S.i = firstUnanswered();
    } else {
      buildItems();
    }
    show('scrTest'); render(); save(false);
  }).catch(function(e){
    console.error(e); err.textContent = 'Could not connect. Check the internet and try again.';
  }).finally(function(){ btn.disabled = false; btn.textContent = 'Start'; });
});

function buildItems(){
  S.items = shuffle(QUIZ.items).map(function(it, n){
    return { k:'q' + (n+1) + '_' + it.w.replace(/\s+/g,'-'), w:it.w, e:it.e, opts:shuffle([it.w].concat(it.opts)) };
  });
  S.answers = {}; S.i = 0; S.created = false;
}
function firstUnanswered(){
  for (var i=0;i<S.items.length;i++) if (!S.answers[S.items[i].k]) return i;
  return S.items.length - 1;
}

/* ================= SAVE ================= */
var saving = Promise.resolve();
function tally(){
  var score=0, answered=0, idk=0;
  S.items.forEach(function(it){
    var a = S.answers[it.k]; if (!a) return;
    answered++; if (a === IDK) idk++; else if (a === it.w) score++;
  });
  return { score:score, answered:answered, idk:idk, total:S.items.length };
}
function save(finish){
  var t = tally();
  var body = {
    email:S.email, name:S.name, period:S.period, quiz:QUIZ.id, quiz_title:QUIZ.title,
    answers:S.answers, score:t.score, total:t.total, answered:t.answered, idk:t.idk,
    translate_flags:S.translateFlags, updated_at:new Date().toISOString()
  };
  if (!S.created) body.items = S.items;
  if (finish){ body.turned_in = true; body.turned_in_at = new Date().toISOString(); }
  $('saveState').textContent = 'Saving…';
  saving = saving.then(function(){
    return sb(TABLE + '?on_conflict=email,quiz', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body:[body] });
  }).then(function(){
    S.created = true; $('saveState').textContent = 'Saved';
  }).catch(function(e){
    console.error(e); $('saveState').textContent = 'Not saved. Check internet.';
    if (finish) throw e;
  });
  return saving;
}

/* ================= QUESTION ================= */
function render(){
  var it = S.items[S.i], last = S.i === S.items.length - 1;
  $('qnum').textContent = 'Question ' + (S.i+1) + ' of ' + S.items.length;
  $('emoji').textContent = it.e;
  $('dots').innerHTML = S.items.map(function(x, n){
    return '<i class="' + (n === S.i ? 'now' : (S.answers[x.k] ? 'done' : '')) + '"></i>';
  }).join('');
  var html = it.opts.map(function(o){
    return '<label class="opt"><input type="radio" name="' + it.k + '" value="' + escAttr(o) + '"><span class="dot"></span><span class="w" data-w="' + escAttr(o) + '"></span></label>';
  }).join('');
  if (ALLOW_IDK) html += '<label class="opt idk"><input type="radio" name="' + it.k + '" value="' + IDK + '"><span class="dot"></span><span class="w" data-w="I don&#39;t know"></span></label>';
  $('opts').innerHTML = html;
  $('qmsg').textContent = '';
  $('btnBack').style.visibility = S.i === 0 ? 'hidden' : 'visible';
  $('btnFinish').classList.toggle('hidden', !(last && S.answers[it.k]));

  var prev = S.answers[it.k];
  $('opts').querySelectorAll('input').forEach(function(inp){
    if (prev && inp.value === prev) inp.checked = true;
    inp.addEventListener('change', function(){
      S.answers[it.k] = inp.value;
      save(false);
      if (last){ $('btnFinish').classList.remove('hidden'); return; }
      setTimeout(function(){ S.i++; render(); window.scrollTo(0,0); }, 320);   // move on by itself
    });
  });
}

$('btnBack').addEventListener('click', function(){ if (S.i > 0){ S.i--; render(); } });
$('btnFinish').addEventListener('click', function(){
  var btn = this; btn.disabled = true; btn.textContent = 'Turning in…';
  save(true).then(function(){ show('scrDone'); })
    .catch(function(){ btn.textContent = 'Try again'; })
    .finally(function(){ btn.disabled = false; if (btn.textContent === 'Turning in…') btn.textContent = 'Finish'; });
});
$('btnAgain').addEventListener('click', function(){ location.search = ''; });

/* ================= NO TRANSLATION ================= */
var CANARY = $('canary').textContent, transShown = false;
function isTranslated(){
  var h = document.documentElement;
  if (/translated-(ltr|rtl)/.test(h.className)) return true;
  if (h.lang && h.lang.toLowerCase().slice(0,2) !== 'en') return true;
  if ($('canary').textContent !== CANARY) return true;
  if (document.querySelector('.goog-te-banner-frame, #goog-gt-tt, font[style*="vertical-align"]')) return true;
  return false;
}
function checkTranslate(){
  if (!isTranslated() || transShown) return;
  transShown = true; $('ovTranslate').classList.remove('hidden');
  if (S.email){ S.translateFlags++; save(false); }
}
new MutationObserver(checkTranslate).observe(document.documentElement, { attributes:true, attributeFilter:['class','lang'], childList:true, subtree:true, characterData:true });
setInterval(checkTranslate, 1500);
$('btnTransOk').addEventListener('click', function(){
  if (isTranslated()){ location.reload(); return; }
  transShown = false; $('ovTranslate').classList.add('hidden');
});
document.addEventListener('contextmenu', function(e){ if (!e.target.closest('input')) e.preventDefault(); });

/* ================= START ================= */
(function init(){
  var id = new URLSearchParams(location.search).get('q');
  QUIZ = (window.QUIZZES || []).filter(function(q){ return q.id === id; })[0];
  if (!QUIZ){ renderMenu(); return; }
  $('barTitle').textContent = QUIZ.title;
  $('signTitle').textContent = QUIZ.title;
  $('signSub').textContent = (QUIZ.tag ? QUIZ.tag + '. ' : '') + QUIZ.items.length + ' questions. Look at the picture and choose the word.';
  try {
    var e = localStorage.getItem('gal_student_email'); if (e) $('inEmail').value = e;
    var n = localStorage.getItem('gal_student_name');  if (n) $('inName').value = n;
    var p = localStorage.getItem('gal_student_period');if (p) $('inPeriod').value = p;
  } catch(err){}
  show('scrSignin');
})();
</script>
<script src="/readings/track.js"></script>
</body>
</html>
