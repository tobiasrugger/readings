<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assign Vocabulary &middot; Mr. Toby</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pine:#1F4D3D;--pine-dk:#163a2d;--pine-dp:#0f2a20;--pine-lt:#e7f0ec;--paper:#fbfaf6;--ink:#1d2320;--muted:#5f6b66;--line:#dfe3e0;--line-dk:#c3ccc7;
  --gold:#b8842c;--gold-bg:#fff6e3;--green:#1f7a4d;--green-bg:#e3f4ea;--red:#b5304a;--red-bg:#fbe6ea}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.5}
.hide{display:none!important}
button,select,input,textarea{font:inherit}
.top{background:var(--pine-dk);color:#fff;border-bottom:4px solid var(--pine-dp)}
.top .in{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top h1{margin:0;font-size:1.25rem;font-weight:900;flex:1}
.top a{color:#fff;font-weight:800;font-size:.88rem}
.wrap{max-width:1100px;margin:0 auto;padding:16px 18px 60px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:1.05rem;font-weight:900;color:var(--pine)}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pine);color:#fff;font-size:.82rem;margin-right:6px}
.btn{background:var(--pine);color:#fff;border:0;border-bottom:3px solid var(--pine-dp);border-radius:10px;padding:10px 18px;font-weight:900;cursor:pointer}
.btn:hover{background:var(--pine-dk)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--pine);border:2px solid var(--pine);border-bottom-width:3px}
.btn.sm{padding:5px 11px;font-size:.84rem;border-radius:8px}
.btn.red{background:#fff;color:var(--red);border:2px solid var(--red);border-bottom-width:3px}
.gate{max-width:360px;margin:60px auto;text-align:center}
.gate input{width:100%;padding:10px 12px;border:2px solid var(--line-dk);border-radius:10px;margin:10px 0}
.err{color:var(--red);font-weight:800}
.pers{display:flex;gap:8px;flex-wrap:wrap}
.pers label{display:flex;align-items:center;gap:6px;border:2px solid var(--line-dk);border-radius:10px;padding:6px 12px;font-weight:900;cursor:pointer;background:#fff}
.pers label.on{background:var(--pine);border-color:var(--pine-dp);color:#fff}
.pers input{display:none}
.acts h3{margin:12px 0 6px;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.act{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line-dk);border-radius:11px;padding:8px 10px;font-weight:800;cursor:pointer;text-align:left}
.act:hover{border-color:var(--pine)}
.act.on{border-color:var(--pine);background:var(--pine-lt);box-shadow:0 0 0 3px rgba(31,77,61,.18)}
.act .e{font-size:1.3rem}
.checkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.checkrow select{padding:7px 10px;border:2px solid var(--line-dk);border-radius:9px;max-width:100%}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.opts label{font-weight:800;font-size:.86rem;color:var(--pine);display:block}
.opts input[type=text]{padding:8px 10px;border:2px solid var(--line-dk);border-radius:9px;width:min(420px,90vw)}
.opts .radio{display:flex;gap:12px;font-weight:700}
.summary{font-weight:800;color:var(--muted);margin:10px 0}
.asg{border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.asg .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.asg .per{background:var(--pine);color:#fff;border-radius:8px;padding:2px 10px;font-weight:900}
.asg .t{font-weight:900;color:var(--pine);font-size:1.05rem}
.asg .meta{color:var(--muted);font-size:.84rem;font-weight:700}
.asg .sp{flex:1}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#eef1ef;margin:10px 0 6px}
.bar i{display:block;height:100%}
.counts{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;font-weight:800}
.counts span b{font-size:1rem}
.who{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.who span{border-radius:8px;padding:2px 9px;font-size:.84rem;font-weight:800;border:1px solid var(--line)}
.who .done{background:var(--green-bg);color:var(--green);border-color:#b9dfc8}
.who .low{background:var(--red-bg);color:var(--red);border-color:#f0c2cc}
.who .prog{background:var(--gold-bg);color:#8a5a00;border-color:#f0d9a8}
.who .none{background:#f4f6f5;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pine-dk);color:#fff;font-weight:800;padding:10px 18px;border-radius:12px;z-index:30}
.note{color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>Assign Vocabulary</h1>
  <a href="./">Student page</a>
  <a href="/readings/">Readings hub</a>
</div></header>

<div class="card gate" id="gate">
  <h2>Teacher sign in</h2>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="pwBtn">Open</button>
  <p class="err" id="pwErr"></p>
</div>

<div class="wrap hide" id="app">
  <div class="card">
    <h2><span class="step">1</span>Which periods?</h2>
    <div class="pers" id="pers"></div>
  </div>

  <div class="card acts">
    <h2><span class="step">2</span>Which activity?</h2>
    <div id="acts"></div>
  </div>

  <div class="card">
    <h2><span class="step">3</span>Options</h2>
    <div class="opts">
      <div><label for="note">Note to students (optional)</label><input type="text" id="note" maxlength="120" placeholder="Do this first! Finish before the bell."></div>
      <div><label>How long?</label>
        <div class="radio"><label><input type="radio" name="dur" value="today" checked> Today only</label>
        <label><input type="radio" name="dur" value="open"> Until I clear it</label></div></div>
    </div>
    <p class="summary" id="sum">Choose periods and an activity.</p>
    <button class="btn" id="go" disabled>Assign</button>
    <span class="note">&nbsp; Students see it as their &ldquo;Next up&rdquo; on the vocabulary page. Once they finish, Next up goes back to normal.</span>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0;flex:1">Active assignments</h2>
      <label class="note"><input type="checkbox" id="auto" checked> refresh every 30 seconds</label>
      <button class="btn ghost sm" id="refresh">Refresh now</button>
    </div>
    <div id="active" style="margin-top:12px"><p class="note">Loading&hellip;</p></div>
  </div>
</div>

<script>document.write('<script src="/readings/vocab/pre/quizzes.js?v=' + Math.floor(Date.now() / 3600000) + '"><\/script>');</script>
<script src="/readings/vocab/mywords/words.js"></script>
<script>
(function(){
var PASSWORD = 'galileo2026', esc = MW.esc, LOW = 60, FIX_ITEMS = 6;
function $(id){ return document.getElementById(id); }
function key(e){ return String(e || '').trim().toLowerCase().split('@')[0]; }

/* everything a student can be assigned on the vocabulary page */
var GROUPS = [
  ['Word sets', [['colors/','Colors','\ud83c\udfa8'],['animals/','Animals','\ud83d\udc31'],['foods/','Foods','\ud83c\udf71'],['drinks/','Drinks','\ud83e\udd64'],
                 ['sports/','Sports','\u26bd'],['school-subjects/','School Subjects','\ud83d\udcda']]],
  ['Action verbs', [['verbs-1/','Action Verbs 1','\ud83c\udfc3'],['verbs-2/','Action Verbs 2','\ud83c\udfc3'],['verbs-3/','Action Verbs 3','\ud83c\udfc3'],
                    ['verbs-4/','Action Verbs 4','\ud83c\udfc3'],['verbs-5/','Action Verbs 5','\ud83c\udfc3']]],
  ['Practice and checks', [['mywords/','My Words','\ud83d\udcac'],['pretest-ll12/','Language Launch 1\u20132','\ud83d\udcdd'],['pre/?q=','One Vocabulary Check\u2026','\ud83d\udcdd']]]
];
var TITLE = {}; GROUPS.forEach(function(g){ g[1].forEach(function(a){ TITLE[a[0]] = a[1]; }); });
var PICK = { pers:{}, href:'' };

/* ---------------- sign in ---------------- */
function open(){ $('gate').classList.add('hide'); $('app').classList.remove('hide'); build(); loadActive(); }
$('pwBtn').onclick = function(){
  if ($('pw').value === PASSWORD){ try { sessionStorage.setItem('vassign_ok', '1'); } catch(e){} open(); }
  else $('pwErr').textContent = 'That password is not right.';
};
$('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('pwBtn').click(); });
try { if (sessionStorage.getItem('vassign_ok') === '1') open(); } catch(e){}

/* ---------------- choose ---------------- */
function build(){
  $('pers').innerHTML = ['1','2','3','4','5','6','7','all'].map(function(p){
    return '<label data-p="' + p + '"><input type="checkbox" value="' + p + '">' + (p === 'all' ? 'All periods' : 'Period ' + p) + '</label>';
  }).join('');
  Array.prototype.forEach.call($('pers').querySelectorAll('label'), function(l){
    l.onclick = function(e){
      e.preventDefault();
      var p = l.getAttribute('data-p');
      if (p === 'all'){ var on = !PICK.pers.all; PICK.pers = {}; if (on) PICK.pers.all = true; }
      else { delete PICK.pers.all; PICK.pers[p] = !PICK.pers[p]; }
      Array.prototype.forEach.call($('pers').querySelectorAll('label'), function(x){ x.classList.toggle('on', !!PICK.pers[x.getAttribute('data-p')]); });
      summary();
    };
  });
  var Q = window.QUIZZES || [];
  $('acts').innerHTML = GROUPS.map(function(g){
    return '<h3>' + g[0] + '</h3><div class="grid">' + g[1].map(function(a){
      return '<button class="act" data-h="' + a[0] + '"><span class="e">' + a[2] + '</span>' + esc(a[1]) + '</button>'; }).join('') + '</div>';
  }).join('') + '<div class="checkrow hide" id="qrow"><span class="note">Which check?</span><select id="qsel">'
    + Q.map(function(q){ return '<option value="' + esc(q.id) + '">' + esc(q.title) + (q.tag ? ' (' + esc(q.tag) + ')' : '') + '</option>'; }).join('') + '</select></div>';
  Array.prototype.forEach.call($('acts').querySelectorAll('.act'), function(b){
    b.onclick = function(){
      PICK.href = b.getAttribute('data-h');
      Array.prototype.forEach.call($('acts').querySelectorAll('.act'), function(x){ x.classList.toggle('on', x === b); });
      $('qrow').classList.toggle('hide', PICK.href !== 'pre/?q=');
      summary();
    };
  });
  $('qsel').onchange = summary;
}
function chosen(){
  if (!PICK.href) return null;
  if (PICK.href === 'pre/?q='){
    var id = $('qsel').value, q = (window.QUIZZES || []).filter(function(x){ return x.id === id; })[0];
    return { href:'pre/?q=' + encodeURIComponent(id), title:'Vocabulary Check: ' + (q ? q.title : id) };
  }
  return { href:PICK.href, title:TITLE[PICK.href] };
}
function periods(){ return Object.keys(PICK.pers).filter(function(p){ return PICK.pers[p]; }); }
function summary(){
  var a = chosen(), ps = periods();
  $('go').disabled = !(a && ps.length);
  $('sum').textContent = a && ps.length ? 'Assign "' + a.title + '" to ' + (ps[0] === 'all' ? 'all periods' : 'period' + (ps.length > 1 ? 's ' : ' ') + ps.join(', ')) + '.'
    : 'Choose periods and an activity.';
}
function endOfToday(){ var d = new Date(); d.setHours(23, 59, 0, 0); return d.toISOString(); }
$('go').onclick = function(){
  var a = chosen(), ps = periods(), btn = this; if (!a || !ps.length) return;
  btn.disabled = true;
  var exp = document.querySelector('input[name=dur]:checked').value === 'today' ? endOfToday() : null;
  var rows = ps.map(function(p){ return { area:'vocab', period:p, href:a.href, title:a.title, note:$('note').value.trim() || null, expires_at:exp }; });
  MW.sb('class_assignments', { method:'POST', prefer:'return=minimal', body:rows }).then(function(r){
    toast(r === null ? 'Could not save. Did you run the SQL?' : 'Assigned!');
    btn.disabled = false; loadActive();
  });
};

/* ---------------- active assignments + live progress ---------------- */
var STUDENTS = null;
function loadActive(){
  var now = new Date().toISOString();
  Promise.all([
    MW.sb('class_assignments?area=eq.vocab&or=(expires_at.is.null,expires_at.gt.' + encodeURIComponent(now) + ')&order=created_at.desc&select=*'),
    STUDENTS ? Promise.resolve(STUDENTS) : MW.sb('students?select=*&limit=5000')
  ]).then(function(r){
    if (r[0] === null){ $('active').innerHTML = '<p class="err">Could not load assignments. Run the SQL for class_assignments first.</p>'; return; }
    STUDENTS = r[1] || [];
    /* newest per period wins, like on the student page */
    var seen = {}, list = (r[0] || []).filter(function(a){ if (seen[a.period]) return false; seen[a.period] = true; return true; });
    if (!list.length){ $('active').innerHTML = '<p class="note">Nothing assigned right now. Students see their own Next up.</p>'; return; }
    Promise.all(list.map(progressFor)).then(function(prog){
      $('active').innerHTML = list.map(function(a, i){ return asgHtml(a, prog[i]); }).join('');
      Array.prototype.forEach.call($('active').querySelectorAll('[data-clear]'), function(b){
        b.onclick = function(){
          if (!confirm('Clear this assignment? Students go back to their own Next up.')) return;
          MW.sb('class_assignments?id=eq.' + b.getAttribute('data-clear'), { method:'PATCH', prefer:'return=minimal', body:{ expires_at:new Date().toISOString() } })
            .then(function(){ toast('Cleared.'); loadActive(); });
        };
      });
    });
  });
}
function roster(period){
  var seen = {}, out = [];
  STUDENTS.forEach(function(s){
    var k = key(s.email); if (!k || seen[k]) return;
    if (period !== 'all' && String(s.period || '') !== period) return;
    seen[k] = true;
    out.push({ k:k, name:s.name || [s.first_name, s.last_name].filter(Boolean).join(' ') || k });
  });
  return out.sort(function(a, b){ return a.name.localeCompare(b.name); });
}
/* status per student: done / low / prog / none */
function progressFor(a){
  var href = a.href, slug = href.replace(/\/$/, ''), qid = (href.match(/^pre\/\?q=(.+)$/) || [])[1], st = {};
  var since = a.created_at;
  if (qid){
    return MW.sb('vocab_preassess?quiz=eq.' + encodeURIComponent(decodeURIComponent(qid)) + '&select=email,answers,items,turned_in').then(function(rows){
      (rows || []).forEach(function(r){
        var k = key(r.email), n = r.answers ? Object.keys(r.answers).length : 0; if (!n) return;
        var right = (r.items || []).filter(function(it){ return r.answers[it.k] === it.w; }).length, tot = (r.items || []).length || n;
        var pct = Math.round(100 * right / tot);
        st[k] = r.turned_in || n >= tot ? { s:pct < LOW ? 'low' : 'done', pct:pct } : { s:'prog', pct:Math.round(100 * n / tot) };
      });
      return st;
    });
  }
  if (href === 'pretest-ll12/'){
    return MW.sb('vocab_pretest?form=eq.pre&select=email,score,total,answered,turned_in').then(function(rows){
      (rows || []).forEach(function(r){
        var k = key(r.email), pct = r.total ? Math.round(100 * r.score / r.total) : 0;
        st[k] = r.turned_in ? { s:pct < LOW ? 'low' : 'done', pct:pct } : (r.answered ? { s:'prog', pct:Math.round(100 * r.answered / (r.total || 1)) } : st[k]);
      });
      return st;
    });
  }
  if (href === 'mywords/'){
    return MW.sb('vocab_word_practice?updated_at=gte.' + encodeURIComponent(since) + '&select=email,learned').then(function(rows){
      (rows || []).forEach(function(r){
        var k = key(r.email), o = st[k] = st[k] || { s:'prog', n:0, pct:null };
        if (r.learned) o.n++;
      });
      Object.keys(st).forEach(function(k){ st[k].label = st[k].n + ' learned'; });
      return st;
    });
  }
  return MW.sb('vocab_work?set_slug=eq.' + encodeURIComponent(slug) + '&select=email,scores,turned_in').then(function(rows){
    (rows || []).forEach(function(r){
      var s = r.scores || {}, n = s.total_words || 0; if (!n) return;
      var parts = [s.match / n, s.wordsearch / n, s.mc / n, s.cloze / n, (s.fix || 0) / FIX_ITEMS, s.spell / n];
      var pct = Math.round(100 * parts.reduce(function(x, v){ return x + Math.min(1, v || 0); }, 0) / parts.length);
      var k = key(r.email), cur = st[k];
      var mine = r.turned_in ? { s:pct < LOW ? 'low' : 'done', pct:pct } : (pct >= 100 ? { s:'done', pct:pct } : { s:'prog', pct:pct });
      if (!cur || (mine.s !== 'prog' && cur.s === 'prog') || mine.pct > cur.pct) st[k] = mine;
    });
    return st;
  });
}
function asgHtml(a, st){
  var kids = roster(a.period), c = { done:0, low:0, prog:0, none:0 };
  var chips = kids.map(function(s){
    var x = st[s.k], cls = x ? x.s : 'none'; c[cls]++;
    var lab = x ? (x.label || (x.pct != null ? x.pct + '%' : '')) : '';
    return '<span class="' + cls + '">' + esc(s.name) + (lab ? ' \u00b7 ' + lab : '') + '</span>';
  });
  var n = kids.length || 1;
  var when = a.expires_at ? 'until ' + new Date(a.expires_at).toLocaleString([], { weekday:'short', hour:'numeric', minute:'2-digit' }) : 'until you clear it';
  return '<div class="asg"><div class="h"><span class="per">' + (a.period === 'all' ? 'All periods' : 'Period ' + esc(a.period)) + '</span>'
    + '<span class="t">' + esc(a.title || a.href) + '</span><span class="sp"></span>'
    + '<span class="meta">assigned ' + new Date(a.created_at).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) + ' &middot; ' + when + '</span>'
    + '<button class="btn red sm" data-clear="' + a.id + '">Clear</button></div>'
    + (a.note ? '<div class="meta" style="margin-top:4px">Note: ' + esc(a.note) + '</div>' : '')
    + '<div class="bar"><i style="width:' + (100 * c.done / n) + '%;background:#1f7a4d"></i><i style="width:' + (100 * c.low / n) + '%;background:#b5304a"></i>'
    + '<i style="width:' + (100 * c.prog / n) + '%;background:#e3a92b"></i></div>'
    + '<div class="counts"><span style="color:#1f7a4d"><b>' + c.done + '</b> done</span><span style="color:#b5304a"><b>' + c.low + '</b> done, under ' + LOW + '%</span>'
    + '<span style="color:#8a5a00"><b>' + c.prog + '</b> working</span><span style="color:#5f6b66"><b>' + c.none + '</b> not started</span>'
    + (a.href === 'mywords/' ? '<span class="note">My Words is open-ended: this shows words learned since you assigned it.</span>' : '') + '</div>'
    + '<div class="who">' + (chips.join('') || '<span class="none">No students found for this period.</span>') + '</div></div>';
}
$('refresh').onclick = loadActive;
setInterval(function(){ if ($('auto').checked && !$('app').classList.contains('hide')) loadActive(); }, 30000);
function toast(t){ var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 2200); }
})();
</script>
</body>
</html>
