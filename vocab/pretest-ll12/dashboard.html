<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard: Vocabulary pre-test, Language Launch Units 1–2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#5B2A6E; --plum-deep:#3D1A4C; --plum-edge:#2E1239;
  --lilac:#EFE7F3; --lilac-2:#E2D3EA; --paper:#FBF9FC;
  --gold:#E3A92B; --ink:#2A2030; --muted:#6E6275; --line:#D9CCE0;
  --know:#2F8A5B; --know-bg:#DDF1E5; --miss:#C0453A; --miss-bg:#F8DEDA; --idk:#9C8FA3; --idk-bg:#ECE8EE;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);line-height:1.4;font-size:15px}
input,button,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.bar{background:var(--plum);color:#fff}
.bar .in{max-width:1400px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bar h1{margin:0;font-size:1.1rem;font-weight:600}
.bar .ctl{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select{padding:7px 10px;border-radius:10px;border:0;background:#fff;color:var(--ink)}
.bar .btn{padding:7px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-weight:500}
.bar .btn:hover{background:rgba(255,255,255,.12)}

main{max-width:1400px;margin:0 auto;padding:22px}

.gate{max-width:380px;margin:80px auto;background:#fff;border:2px solid var(--line);border-radius:18px;padding:28px}
.gate h2{margin:0 0 14px;color:var(--plum-deep)}
.gate input{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:12px;margin-bottom:10px}
.gate .err{color:var(--miss);min-height:1.3em;font-size:.9rem;margin-bottom:8px}
.pbtn{border:0;border-radius:12px;padding:11px 20px;font-weight:600;background:var(--plum);color:#fff;box-shadow:0 4px 0 var(--plum-edge)}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum-edge)}
.pbtn.wide{width:100%}
.lbtn{border:2px solid var(--line);border-radius:10px;padding:6px 12px;background:#fff;color:var(--plum);font-weight:500}
.lbtn.danger{color:var(--miss);border-color:var(--miss-bg)}

/* summary strip */
.summary{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 18px;align-items:flex-end}
.summary div{min-width:110px}
.summary strong{display:block;font-size:1.7rem;font-weight:600;color:var(--plum-deep);line-height:1.1}
.summary span{color:var(--muted);font-size:.88rem}

.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--plum-deep);border-color:var(--plum)}
.tabs .note{margin-left:auto;align-self:center;color:var(--muted);font-size:.85rem}

.tablewrap{overflow-x:auto;background:#fff;border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--lilac-2);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.85rem;background:var(--lilac);position:sticky;top:0;cursor:pointer}
th[data-sort]:hover{color:var(--plum-deep)}
tbody tr:hover{background:var(--paper)}
tr.click{cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.meter{display:inline-block;width:110px;height:10px;border-radius:5px;background:var(--lilac-2);vertical-align:middle;overflow:hidden;margin-right:8px}
.meter i{display:block;height:100%;background:var(--plum)}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.8rem;font-weight:500}
.pill.done{background:var(--know-bg);color:var(--know)}
.pill.going{background:#FBEFD2;color:#8A6310}
.flag{color:var(--miss);font-size:.85rem}
.thumb{width:64px;height:48px;object-fit:contain;background:var(--lilac);border-radius:6px;display:block}

/* grid tab */
.matrix td,.matrix th{padding:0;border:1px solid #fff}
.matrix th.word{height:120px;vertical-align:bottom;padding:4px 0;cursor:default;min-width:22px}
.matrix th.word span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.78rem;color:var(--ink);font-weight:400}
.matrix th.unitsep,.matrix td.unitsep{border-left:3px solid var(--plum)}
.matrix td.name,.matrix th.name{position:sticky;left:0;background:#fff;padding:4px 10px;z-index:2;min-width:170px;font-size:.88rem;border-right:2px solid var(--line)}
.matrix th.name{background:var(--lilac);z-index:3}
.matrix td.c{width:22px;height:24px}
.c.k{background:var(--know)}
.c.m{background:var(--miss)}
.c.i{background:var(--idk)}
.c.e{background:#F4F1F5}
.legend{display:flex;gap:16px;align-items:center;margin:0 0 10px;color:var(--muted);font-size:.88rem;flex-wrap:wrap}
.legend b{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:#fff;box-shadow:-8px 0 30px rgba(46,18,57,.2);z-index:40;overflow-y:auto;padding:22px 24px 40px}
.shade{position:fixed;inset:0;background:rgba(46,18,57,.35);z-index:39}
.drawer h2{margin:0 0 4px;color:var(--plum-deep)}
.drawer .sub{color:var(--muted);margin:0 0 16px}
.drawer h3{font-size:1rem;margin:22px 0 10px}
.drawer .top{display:flex;gap:10px;align-items:flex-start}
.drawer .top .x{margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.wc{border:2px solid var(--line);border-radius:10px;padding:6px;font-size:.85rem}
.wc img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--lilac);border-radius:6px;display:block;margin-bottom:5px}
.wc .w{font-weight:600}
.wc .ch{color:var(--miss)}
.wc.idk .ch{color:var(--idk)}
.wc.ok{border-color:var(--know-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--know-bg);color:var(--know);padding:3px 9px;border-radius:9px;font-size:.85rem}
.empty{padding:40px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.filters select{padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:#fff}
</style>
</head>
<body>

<header class="bar">
  <div class="in">
    <h1>Vocabulary pre-test: Language Launch Units 1–2</h1>
    <div class="ctl hidden" id="controls">
      <select id="selForm" aria-label="Test">
        <option value="pre">Pre-test</option>
        <option value="post">Post-test</option>
      </select>
      <select id="selPeriod" aria-label="Period"><option value="">All periods</option></select>
      <button class="btn" id="btnRefresh">Refresh</button>
      <button class="btn" id="btnCsv">Download CSV</button>
    </div>
  </div>
</header>

<main>
  <section class="gate" id="gate">
    <h2>Teacher sign in</h2>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="pwErr"></div>
    <button class="pbtn wide" id="btnPw">Open dashboard</button>
  </section>

  <section id="app" class="hidden">
    <div class="summary" id="summary"></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="students" aria-selected="true">Students</button>
      <button role="tab" data-tab="words" aria-selected="false">Words</button>
      <button role="tab" data-tab="grid" aria-selected="false">Grid</button>
      <span class="note" id="updated"></span>
    </div>
    <div id="tabStudents"></div>
    <div id="tabWords" class="hidden"></div>
    <div id="tabGrid" class="hidden"></div>
  </section>
</main>

<div class="shade hidden" id="shade"></div>
<aside class="drawer hidden" id="drawer" aria-modal="true" role="dialog"></aside>

<script>
var SUPA_URL = 'https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TABLE = 'vocab_pretest';
var PASSWORD = 'galileo2026';
var IDK = '__idk';

var ALL = [];         // every row, both forms
var ROWS = [];        // rows for current form + period, scored
var WORDS = [];       // union of items across rows
var sortState = { students:{ key:'name', dir:1 }, words:{ key:'pct', dir:1 } };
var wordUnit = '';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function sb(path, opts){
  opts = opts || {};
  return fetch(SUPA_URL + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY, 'Content-Type':'application/json' }, opts.headers || {})
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(r.status + ' ' + t); });
    return r.status === 204 ? null : r.text().then(function(t){ return t ? JSON.parse(t) : null; });
  });
}

/* ---------- gate ---------- */
function openApp(){
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); $('controls').classList.remove('hidden');
  load();
}
$('btnPw').addEventListener('click', function(){
  if ($('pw').value === PASSWORD){ try{ sessionStorage.setItem('vpt_ok','1'); }catch(e){} openApp(); }
  else $('pwErr').textContent = 'That password is not right.';
});
$('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('btnPw').click(); });
try { if (sessionStorage.getItem('vpt_ok') === '1') openApp(); } catch(e){}

/* ---------- data ---------- */
function load(){
  $('updated').textContent = 'Loading…';
  sb(TABLE + '?select=*&order=name').then(function(rows){
    ALL = rows || [];
    var periods = {};
    ALL.forEach(function(r){ if (r.period) periods[r.period] = 1; });
    var sel = $('selPeriod'), cur = sel.value;
    sel.innerHTML = '<option value="">All periods</option>' + Object.keys(periods).sort(function(a,b){ return a.localeCompare(b, undefined, {numeric:true}); }).map(function(p){ return '<option value="'+esc(p)+'">Period '+esc(p)+'</option>'; }).join('');
    sel.value = cur;
    build();
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  }).catch(function(e){
    console.error(e);
    $('updated').textContent = '';
    $('tabStudents').innerHTML = '<div class="empty">Could not load results. Check that the vocab_pretest table exists (run schema.sql), then tap Refresh.</div>';
  });
}

function score(row){
  var items = row.items || [], ans = row.answers || {};
  var s = { known:0, missed:0, idk:0, blank:0, total:items.length, byKey:{} };
  items.forEach(function(it){
    var a = ans[it.k];
    var st = !a ? 'e' : a === IDK ? 'i' : a === it.w ? 'k' : 'm';
    s.byKey[it.k] = { st:st, chose:a };
    if (st === 'k') s.known++; else if (st === 'm') s.missed++; else if (st === 'i') s.idk++; else s.blank++;
  });
  s.answered = s.total - s.blank;
  s.pct = s.total ? s.known / s.total : 0;
  return s;
}

function build(){
  var form = $('selForm').value, period = $('selPeriod').value;
  ROWS = ALL.filter(function(r){ return (r.form || 'pre') === form && (!period || r.period === period); })
            .map(function(r){ return Object.assign({}, r, { s:score(r) }); });

  // pre-test % for each email, shown next to post-test results
  var preBy = {};
  ALL.filter(function(r){ return (r.form || 'pre') === 'pre'; }).forEach(function(r){ preBy[r.email] = score(r).pct; });
  ROWS.forEach(function(r){ r.prePct = preBy[r.email]; });

  // word list = union of items (unit, lesson order)
  var map = {};
  ROWS.forEach(function(r){ (r.items || []).forEach(function(it){ if (!map[it.k]) map[it.k] = it; }); });
  WORDS = Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return (a.u - b.u) || ((a.l||0) - (b.l||0)) || a.w.localeCompare(b.w); });

  renderSummary(); renderStudents(); renderWords(); renderGrid();
}

/* ---------- summary ---------- */
function renderSummary(){
  var done = ROWS.filter(function(r){ return r.turned_in; });
  var avg = done.length ? Math.round(100 * done.reduce(function(t,r){ return t + r.s.pct; }, 0) / done.length) : null;
  var knownByAll = 0, knownByNone = 0;
  if (done.length){
    WORDS.forEach(function(w){
      var k = done.filter(function(r){ return r.s.byKey[w.k] && r.s.byKey[w.k].st === 'k'; }).length;
      if (k === done.length) knownByAll++;
      if (k === 0) knownByNone++;
    });
  }
  $('summary').innerHTML =
      '<div><strong>' + ROWS.length + '</strong><span>started</span></div>'
    + '<div><strong>' + done.length + '</strong><span>turned in</span></div>'
    + '<div><strong>' + (avg == null ? '–' : avg + '%') + '</strong><span>average known (turned in)</span></div>'
    + '<div><strong>' + WORDS.length + '</strong><span>words on the test</span></div>'
    + '<div><strong>' + (done.length ? knownByNone : '–') + '</strong><span>words nobody knew</span></div>'
    + '<div><strong>' + (done.length ? knownByAll : '–') + '</strong><span>words everybody knew</span></div>';
}

/* ---------- students ---------- */
function sortRows(list, st, getters){
  var g = getters[st.key];
  return list.slice().sort(function(a,b){
    var x = g(a), y = g(b);
    if (typeof x === 'string') return st.dir * x.localeCompare(y, undefined, { numeric:true });
    return st.dir * ((x == null ? -1 : x) - (y == null ? -1 : y));
  });
}
var studentGetters = {
  name:function(r){ return (r.name || '').toLowerCase(); },
  period:function(r){ return r.period || ''; },
  status:function(r){ return r.turned_in ? 2 : r.s.answered / Math.max(1, r.s.total); },
  pct:function(r){ return r.s.pct; },
  known:function(r){ return r.s.known; },
  idk:function(r){ return r.s.idk; },
  missed:function(r){ return r.s.missed; },
  pre:function(r){ return r.prePct; },
  flags:function(r){ return (r.translate_flags || 0) * 10 + (r.tab_leaves || 0); },
  updated:function(r){ return r.updated_at || ''; }
};

function renderStudents(){
  var box = $('tabStudents');
  if (!ROWS.length){ box.innerHTML = '<div class="empty">No students yet. Share the test link: tobiasrugger.github.io/readings/vocab/pretest-ll12/' + ($('selForm').value === 'post' ? '?form=post' : '') + '</div>'; return; }
  var isPost = $('selForm').value === 'post';
  var list = sortRows(ROWS, sortState.students, studentGetters);
  var cols = [['name','Name'],['period','Period'],['status','Status'],['pct','Known'],['known','Right'],['missed','Wrong'],['idk',"Don't know"]];
  if (isPost) cols.push(['pre','Pre-test']);
  cols.push(['flags','Flags'],['updated','Last active']);
  var h = '<div class="tablewrap"><table><thead><tr>' + cols.map(function(c){ return '<th data-sort="'+c[0]+'">'+c[1]+(sortState.students.key===c[0] ? (sortState.students.dir>0?' ▲':' ▼') : '')+'</th>'; }).join('') + '</tr></thead><tbody>';
  list.forEach(function(r){
    var s = r.s, pct = Math.round(100*s.pct);
    var status = r.turned_in ? '<span class="pill done">Turned in</span>'
      : '<span class="pill going">Page ' + ((r.page||0)+1) + ' of ' + Math.max(1, Math.ceil(s.total/4)) + '</span>';
    var flags = [];
    if (r.translate_flags) flags.push('translate ×' + r.translate_flags);
    if (r.tab_leaves) flags.push('left page ×' + r.tab_leaves);
    h += '<tr class="click" data-email="'+esc(r.email)+'">'
      + '<td>' + esc(r.name) + '<br><span style="color:var(--muted);font-size:.8rem">' + esc(r.email) + '</span></td>'
      + '<td>' + esc(r.period) + '</td>'
      + '<td>' + status + '</td>'
      + '<td><span class="meter"><i style="width:'+pct+'%"></i></span>' + pct + '%</td>'
      + '<td class="num">' + s.known + ' / ' + s.total + '</td>'
      + '<td class="num">' + s.missed + '</td>'
      + '<td class="num">' + s.idk + '</td>'
      + (isPost ? '<td class="num">' + (r.prePct == null ? '–' : Math.round(100*r.prePct) + '%') + '</td>' : '')
      + '<td>' + (flags.length ? '<span class="flag">' + flags.join(', ') + '</span>' : '') + '</td>'
      + '<td>' + (r.updated_at ? new Date(r.updated_at).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '') + '</td>'
      + '</tr>';
  });
  h += '</tbody></table></div>';
  box.innerHTML = h;
  box.querySelectorAll('th[data-sort]').forEach(function(th){
    th.addEventListener('click', function(){
      var k = th.dataset.sort, st = sortState.students;
      st.dir = st.key === k ? -st.dir : 1; st.key = k; renderStudents();
    });
  });
  box.querySelectorAll('tr.click').forEach(function(tr){
    tr.addEventListener('click', function(){ openStudent(tr.dataset.email); });
  });
}

/* ---------- words ---------- */
function wordStats(){
  var done = ROWS.filter(function(r){ return r.s.answered > 0; });
  return WORDS.map(function(w){
    var k=0, m=0, i=0, wrong={}, knewNames=[];
    done.forEach(function(r){
      var b = r.s.byKey[w.k]; if (!b || b.st === 'e') return;
      if (b.st === 'k'){ k++; knewNames.push(r.name); }
      else if (b.st === 'i') i++;
      else { m++; wrong[b.chose] = (wrong[b.chose]||0) + 1; }
    });
    var n = k+m+i;
    var top = Object.keys(wrong).sort(function(a,b){ return wrong[b]-wrong[a]; })[0];
    return { w:w, known:k, missed:m, idk:i, n:n, pct: n ? k/n : null, topWrong: top ? top + ' (' + wrong[top] + ')' : '', knewNames:knewNames };
  });
}
var wordGetters = {
  word:function(x){ return x.w.w.toLowerCase(); },
  lesson:function(x){ return x.w.u*100 + (x.w.l||0); },
  pct:function(x){ return x.pct; },
  known:function(x){ return x.known; },
  missed:function(x){ return x.missed; },
  idk:function(x){ return x.idk; }
};
function renderWords(){
  var box = $('tabWords');
  if (!WORDS.length){ box.innerHTML = '<div class="empty">No answers yet.</div>'; return; }
  var units = {}; WORDS.forEach(function(w){ units[w.u] = 1; });
  var stats = wordStats().filter(function(x){ return !wordUnit || String(x.w.u) === wordUnit; });
  stats = sortRows(stats, sortState.words, wordGetters);
  var h = '<div class="filters"><select id="selUnit"><option value="">All units</option>'
    + Object.keys(units).map(function(u){ return '<option value="'+u+'"'+(wordUnit===u?' selected':'')+'>Unit '+u+'</option>'; }).join('')
    + '</select><span style="color:var(--muted);font-size:.88rem">Sorted lowest first, so the words to teach are at the top. Tap a column to sort.</span></div>';
  var cols = [['','Picture'],['word','Word'],['lesson','Unit / lesson'],['pct','Known'],['known','Right'],['missed','Wrong'],['idk',"Don't know"],['','Most common wrong choice']];
  h += '<div class="tablewrap"><table><thead><tr>' + cols.map(function(c){ return c[0] ? '<th data-sort="'+c[0]+'">'+c[1]+(sortState.words.key===c[0]?(sortState.words.dir>0?' ▲':' ▼'):'')+'</th>' : '<th style="cursor:default">'+c[1]+'</th>'; }).join('') + '</tr></thead><tbody>';
  stats.forEach(function(x){
    var pct = x.pct == null ? null : Math.round(100*x.pct);
    h += '<tr title="' + esc(x.knewNames.length ? 'Knew it: ' + x.knewNames.join(', ') : 'Nobody knew this yet') + '">'
      + '<td><img class="thumb" loading="lazy" alt="" src="'+esc(x.w.img)+'"></td>'
      + '<td><b>' + esc(x.w.w) + '</b></td>'
      + '<td>Unit ' + x.w.u + (x.w.l ? ', lesson ' + x.w.l : '') + (x.w.t ? '<br><span style="color:var(--muted);font-size:.8rem">' + esc(x.w.t) + '</span>' : '') + '</td>'
      + '<td>' + (pct == null ? '–' : '<span class="meter"><i style="width:'+pct+'%"></i></span>' + pct + '%') + '</td>'
      + '<td class="num">' + x.known + ' / ' + x.n + '</td>'
      + '<td class="num">' + x.missed + '</td>'
      + '<td class="num">' + x.idk + '</td>'
      + '<td>' + esc(x.topWrong) + '</td>'
      + '</tr>';
  });
  h += '</tbody></table></div>';
  box.innerHTML = h;
  $('selUnit').addEventListener('change', function(){ wordUnit = this.value; renderWords(); });
  box.querySelectorAll('th[data-sort]').forEach(function(th){
    th.addEventListener('click', function(){
      var k = th.dataset.sort, st = sortState.words;
      st.dir = st.key === k ? -st.dir : 1; st.key = k; renderWords();
    });
  });
}

/* ---------- grid ---------- */
function renderGrid(){
  var box = $('tabGrid');
  if (!ROWS.length || !WORDS.length){ box.innerHTML = '<div class="empty">No answers yet.</div>'; return; }
  var list = sortRows(ROWS, { key:'name', dir:1 }, studentGetters);
  var h = '<div class="legend"><span><b style="background:var(--know)"></b>Right</span><span><b style="background:var(--miss)"></b>Wrong</span><span><b style="background:var(--idk)"></b>Don\'t know</span><span><b style="background:#F4F1F5;border:1px solid var(--line)"></b>Not answered yet</span><span>Words run in unit and lesson order. Hover a square for details.</span></div>';
  h += '<div class="tablewrap"><table class="matrix"><thead><tr><th class="name">Student</th>';
  var prevU = null;
  WORDS.forEach(function(w){
    var sep = prevU !== null && w.u !== prevU ? ' unitsep' : ''; prevU = w.u;
    h += '<th class="word' + sep + '" title="Unit ' + w.u + (w.l ? ', lesson ' + w.l : '') + '"><span>' + esc(w.w) + '</span></th>';
  });
  h += '</tr></thead><tbody>';
  list.forEach(function(r){
    h += '<tr><td class="name">' + esc(r.name) + ' <span style="color:var(--muted)">' + Math.round(100*r.s.pct) + '%</span></td>';
    var pu = null;
    WORDS.forEach(function(w){
      var sep = pu !== null && w.u !== pu ? ' unitsep' : ''; pu = w.u;
      var b = r.s.byKey[w.k] || { st:'e' };
      var tip = r.name + ': ' + w.w + ' - ' + (b.st==='k' ? 'right' : b.st==='i' ? "don't know" : b.st==='m' ? 'chose "' + b.chose + '"' : 'not answered');
      h += '<td class="c ' + b.st + sep + '" title="' + esc(tip) + '"></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  box.innerHTML = h;
}

/* ---------- student drawer ---------- */
function openStudent(email){
  var r = ROWS.filter(function(x){ return x.email === email; })[0]; if (!r) return;
  var s = r.s;
  var byLesson = {};
  var missed = [], idk = [], known = [];
  (r.items || []).forEach(function(it){
    var b = s.byKey[it.k];
    if (b.st === 'k') known.push(it);
    else if (b.st === 'm') missed.push({ it:it, chose:b.chose });
    else if (b.st === 'i') idk.push(it);
  });
  function sortIt(a,b){ var x=a.it||a, y=b.it||b; return (x.u-y.u)||((x.l||0)-(y.l||0))||x.w.localeCompare(y.w); }
  missed.sort(sortIt); idk.sort(sortIt); known.sort(sortIt);

  var h = '<div class="top"><div><h2>' + esc(r.name) + '</h2><p class="sub">' + esc(r.email) + ', period ' + esc(r.period)
    + '. Knew ' + s.known + ' of ' + s.total + ' (' + Math.round(100*s.pct) + '%).'
    + (r.turned_in ? ' Turned in ' + new Date(r.turned_in_at || r.updated_at).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) + '.' : ' Still working.')
    + (r.translate_flags ? ' Translation turned on ' + r.translate_flags + '×.' : '')
    + (r.tab_leaves ? ' Left the page ' + r.tab_leaves + '×.' : '')
    + '</p></div><button class="lbtn x" id="dClose">Close</button></div>';

  h += '<h3>Wrong (' + missed.length + ')</h3>' + (missed.length ? '<div class="cards">' + missed.map(function(x){
    return '<div class="wc"><img loading="lazy" alt="" src="'+esc(x.it.img)+'"><div class="w">'+esc(x.it.w)+'</div><div class="ch">chose '+esc(x.chose)+'</div></div>';
  }).join('') + '</div>' : '<p class="sub">None.</p>');

  h += '<h3>Don\'t know (' + idk.length + ')</h3>' + (idk.length ? '<div class="cards">' + idk.map(function(it){
    return '<div class="wc idk"><img loading="lazy" alt="" src="'+esc(it.img)+'"><div class="w">'+esc(it.w)+'</div></div>';
  }).join('') + '</div>' : '<p class="sub">None.</p>');

  h += '<h3>Right (' + known.length + ')</h3>' + (known.length ? '<div class="chips">' + known.map(function(it){ return '<span>'+esc(it.w)+'</span>'; }).join('') + '</div>' : '<p class="sub">None yet.</p>');

  h += '<h3>Retake</h3><p class="sub">Deletes this student\'s ' + esc(r.form || 'pre') + '-test so they can start over with new questions.</p><button class="lbtn danger" id="dReset">Delete this attempt</button>';

  var d = $('drawer'); d.innerHTML = h; d.classList.remove('hidden'); $('shade').classList.remove('hidden'); d.scrollTop = 0;
  $('dClose').addEventListener('click', closeDrawer);
  $('dReset').addEventListener('click', function(){
    if (!confirm('Delete ' + r.name + "'s " + (r.form||'pre') + '-test? This cannot be undone.')) return;
    sb(TABLE + '?email=eq.' + encodeURIComponent(r.email) + '&form=eq.' + encodeURIComponent(r.form || 'pre'), { method:'DELETE', headers:{ Prefer:'return=minimal' } })
      .then(function(){ closeDrawer(); load(); })
      .catch(function(e){ alert('Could not delete: ' + e.message); });
  });
}
function closeDrawer(){ $('drawer').classList.add('hidden'); $('shade').classList.add('hidden'); }
$('shade').addEventListener('click', closeDrawer);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDrawer(); });

/* ---------- tabs + controls ---------- */
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tabs button').forEach(function(x){ x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    ['students','words','grid'].forEach(function(t){ $('tab' + t[0].toUpperCase() + t.slice(1)).classList.toggle('hidden', t !== b.dataset.tab); });
  });
});
$('selForm').addEventListener('change', build);
$('selPeriod').addEventListener('change', build);
$('btnRefresh').addEventListener('click', load);

$('btnCsv').addEventListener('click', function(){
  var list = sortRows(ROWS, { key:'name', dir:1 }, studentGetters);
  var head = ['name','email','period','form','turned_in','known','wrong','dont_know','total','percent','translate_flags','tab_leaves'].concat(WORDS.map(function(w){ return 'U'+w.u+(w.l?'L'+w.l:'')+' '+w.w; }));
  var lines = [head];
  list.forEach(function(r){
    var s = r.s;
    var row = [r.name, r.email, r.period, r.form, r.turned_in ? 'yes' : 'no', s.known, s.missed, s.idk, s.total, Math.round(100*s.pct), r.translate_flags||0, r.tab_leaves||0];
    WORDS.forEach(function(w){ var b = s.byKey[w.k]; row.push(!b || b.st==='e' ? '' : b.st==='k' ? 1 : b.st==='i' ? '?' : 0); });
    lines.push(row);
  });
  var csv = lines.map(function(l){ return l.map(function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type:'text/csv' }));
  a.download = 'vocab-' + $('selForm').value + 'test-units1-2' + ($('selPeriod').value ? '-p' + $('selPeriod').value : '') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
