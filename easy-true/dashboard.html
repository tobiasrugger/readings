<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Very Easy True Stories · Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1F2E; --paper:#F5EFE2; --paper-deep:#EBE3D2;
  --card:#FFFCF3; --accent:#D94A38; --accent-soft:#F4D2CB;
  --ocean:#2E6B8C; --ocean-soft:#CFE2EE;
  --gold:#D9A441; --gold-soft:#F2E2BD;
  --leaf:#3D7A4C; --leaf-soft:#D2E5D4;
  --muted:#6B6357;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);font-family:'Nunito Sans',sans-serif;min-height:100vh;}

/* HEADER */
.site-header{border-bottom:3px solid var(--ink);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);position:sticky;top:0;z-index:10;}
.site-header h1{font-family:'Fraunces',serif;font-size:18px;font-weight:800;}
.back-link{font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:2px solid var(--muted);padding:5px 10px;margin-right:12px;transition:all .15s;}
.back-link:hover{color:var(--ink);border-color:var(--ink);}
.header-left{display:flex;align-items:center;}

/* LOGIN */
.login-wrap{max-width:400px;margin:60px auto;padding:0 20px;}
.login-box{background:var(--card);border:3px solid var(--ink);box-shadow:var(--shadow);padding:32px 28px;}
.login-box h2{font-family:'Fraunces',serif;font-size:22px;font-weight:800;margin-bottom:8px;}
.login-box p{font-size:14px;color:var(--muted);margin-bottom:20px;}
.login-box input{width:100%;padding:10px 12px;border:2px solid var(--ink);background:var(--paper);font-family:'Nunito Sans',sans-serif;font-size:15px;margin-bottom:12px;outline:none;}
.login-box input:focus{border-color:var(--accent);}
.btn{display:inline-block;font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:11px 22px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;transition:all .15s;text-decoration:none;}
.btn:hover{background:var(--accent);border-color:var(--accent);}
.btn.outline{background:transparent;color:var(--ink);}
.btn.outline:hover{background:var(--paper-deep);}
.login-error{color:var(--accent);font-size:13px;font-weight:700;margin-top:6px;display:none;}

/* MAIN DASHBOARD */
.dash{display:none;padding:24px 20px 60px;max-width:1100px;margin:0 auto;}

/* CONTROLS */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:24px;}
.controls select,.controls input{padding:8px 12px;border:2px solid var(--ink);background:var(--paper);font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;min-width:160px;}
.controls select:focus,.controls input:focus{border-color:var(--accent);}
.pill{display:inline-block;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.04em;}

/* STAT CARDS */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
@media(max-width:700px){.stat-row{grid-template-columns:1fr 1fr;}}
.stat-card{background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow);padding:18px 16px;}
.stat-card .val{font-family:'Fraunces',serif;font-size:36px;font-weight:800;line-height:1;}
.stat-card .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px;}

/* STORY BREAKDOWN */
.section-head{font-family:'Fraunces',serif;font-size:18px;font-weight:800;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:32px;}
.story-card{background:var(--card);border:2px solid var(--ink);padding:16px;}
.story-card .s-title{font-family:'Fraunces',serif;font-size:15px;font-weight:700;margin-bottom:8px;}
.story-card .s-num{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:4px;}
.story-card .bar-wrap{background:var(--paper-deep);height:10px;border:1.5px solid var(--ink);margin:8px 0 4px;}
.story-card .bar-fill{height:100%;background:var(--leaf);transition:width .4s;}
.story-card .bar-fill.mid{background:var(--gold);}
.story-card .bar-fill.low{background:var(--accent);}
.story-card .s-stats{font-size:12px;color:var(--muted);}

/* RESULTS TABLE */
.table-wrap{overflow-x:auto;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--ink);color:var(--paper);font-weight:700;text-align:left;padding:10px 12px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--paper-deep);vertical-align:top;}
tr:nth-child(even) td{background:rgba(0,0,0,.02);}
tr:hover td{background:var(--ocean-soft);}
.score-badge{display:inline-block;font-weight:700;font-size:12px;padding:2px 8px;border-radius:4px;}
.score-badge.high{background:var(--leaf-soft);color:var(--leaf);}
.score-badge.mid{background:var(--gold-soft);color:#8B6A1A;}
.score-badge.low{background:var(--accent-soft);color:var(--accent);}
.empty{text-align:center;padding:40px;color:var(--muted);font-style:italic;}

.logout-btn{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 8px;}
.logout-btn:hover{color:var(--ink);}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <a href="index.html" class="back-link">← Library</a>
    <h1>Very Easy True Stories · Dashboard</h1>
  </div>
  <button class="logout-btn" id="logout-btn" style="display:none" onclick="logout()">Sign Out</button>
</header>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <h2>Teacher Dashboard</h2>
    <p>Enter the dashboard password to view student results.</p>
    <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="login-error" id="pw-error">Incorrect password.</div>
    <button class="btn" onclick="checkPw()">Sign In</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dash">

  <div class="controls">
    <select id="filter-period" onchange="applyFilters()">
      <option value="">All Periods</option>
      <option value="1">Period 1</option>
      <option value="2">Period 2</option>
      <option value="3">Period 3</option>
      <option value="4">Period 4</option>
      <option value="5">Period 5</option>
      <option value="6">Period 6</option>
      <option value="7">Period 7</option>
    </select>
    <select id="filter-story" onchange="applyFilters()">
      <option value="">All Stories</option>
      <option value="story-01">01 Shopping Day</option>
      <option value="story-02">02 Mary Walks Home</option>
      <option value="story-03">03 Elevator Romance</option>
      <option value="story-04">04 A Son for Mr. &amp; Mrs. Aversa?</option>
      <option value="story-05">05 Is There a Face on Mars?</option>
      <option value="story-06">06 Neighbors</option>
      <option value="story-07">07 A Smart Mother</option>
      <option value="story-08">08 Stuck!</option>
      <option value="story-09">09 Binti to the Rescue</option>
      <option value="story-10">10 Where Is Mrs. Zimmer?</option>
      <option value="story-11">11 Fast Money</option>
      <option value="story-12">12 Returning a Favor</option>
      <option value="story-13">13 Help! I Can't Find My Apartment!</option>
      <option value="story-14">14 A Big Tip</option>
    </select>
    <input type="text" id="filter-name" placeholder="Search student name..." oninput="applyFilters()">
    <span class="pill" id="result-count">0 results</span>
    <button class="btn outline" onclick="loadData()">Refresh</button>
  </div>

  <div class="stat-row" id="stat-row">
    <div class="stat-card"><div class="val" id="stat-students">—</div><div class="lbl">Students</div></div>
    <div class="stat-card"><div class="val" id="stat-completions">—</div><div class="lbl">Completions</div></div>
    <div class="stat-card"><div class="val" id="stat-avg">—</div><div class="lbl">Avg Score %</div></div>
    <div class="stat-card"><div class="val" id="stat-stories">—</div><div class="lbl">Stories Done</div></div>
  </div>

  <div class="section-head">By Story</div>
  <div class="story-grid" id="story-grid"></div>

  <div class="section-head">All Results</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Period</th>
          <th>Story</th>
          <th>Score</th>
          <th>%</th>
          <th>Predictions</th>
          <th>Completed</th>
        </tr>
      </thead>
      <tbody id="results-tbody"></tbody>
    </table>
  </div>

</div>

<script>
var SUPA_URL = 'https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PW = 'galileo2026';

var allRows = [];
var filtered = [];

var STORY_NAMES = {
  'story-01':'Shopping Day','story-02':'Mary Walks Home',
  'story-03':'Elevator Romance','story-04':'A Son for Mr. & Mrs. Aversa?',
  'story-05':'Is There a Face on Mars?','story-06':'Neighbors',
  'story-07':'A Smart Mother','story-08':'Stuck!',
  'story-09':'Binti to the Rescue','story-10':'Where Is Mrs. Zimmer?',
  'story-11':'Fast Money','story-12':'Returning a Favor',
  'story-13':"Help! I Can't Find My Apartment!",'story-14':'A Big Tip'
};

function checkPw(){
  var val = document.getElementById('pw-input').value;
  var err = document.getElementById('pw-error');
  if(val === PW){
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    document.getElementById('logout-btn').style.display = 'block';
    sessionStorage.setItem('vets_dash_auth','1');
    loadData();
  } else {
    err.style.display = 'block';
  }
}

function logout(){
  sessionStorage.removeItem('vets_dash_auth');
  document.getElementById('login-wrap').style.display = 'block';
  document.getElementById('dash').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'none';
}

function loadData(){
  var url = SUPA_URL + '/rest/v1/vets_results?select=*&order=completed_at.desc&limit=2000';
  fetch(url, {
    headers:{
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY
    }
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    allRows = data || [];
    applyFilters();
  })
  .catch(function(e){
    console.error(e);
  });
}

function applyFilters(){
  var period = document.getElementById('filter-period').value;
  var story = document.getElementById('filter-story').value;
  var name = document.getElementById('filter-name').value.trim().toLowerCase();

  filtered = allRows.filter(function(r){
    if(period && String(r.period) !== period) return false;
    if(story && r.story !== story) return false;
    if(name && !(r.name || '').toLowerCase().includes(name) && !(r.email || '').toLowerCase().includes(name)) return false;
    return true;
  });

  document.getElementById('result-count').textContent = filtered.length + ' results';
  renderStats();
  renderStoryGrid();
  renderTable();
}

function renderStats(){
  var emails = new Set(filtered.map(function(r){ return r.email; }));
  var stories = new Set(filtered.map(function(r){ return r.story; }));
  var pcts = filtered.map(function(r){ return r.total > 0 ? r.score / r.total : 0; });
  var avg = pcts.length > 0 ? Math.round(pcts.reduce(function(a,b){ return a+b; },0) / pcts.length * 100) : 0;
  document.getElementById('stat-students').textContent = emails.size;
  document.getElementById('stat-completions').textContent = filtered.length;
  document.getElementById('stat-avg').textContent = avg + '%';
  document.getElementById('stat-stories').textContent = stories.size;
}

function renderStoryGrid(){
  var byStory = {};
  filtered.forEach(function(r){
    var s = r.story;
    if(!byStory[s]) byStory[s] = {count:0, scoreSum:0, totalSum:0};
    byStory[s].count++;
    byStory[s].scoreSum += (r.score || 0);
    byStory[s].totalSum += (r.total || 1);
  });

  var html = '';
  Object.keys(STORY_NAMES).forEach(function(slug){
    var d = byStory[slug];
    var num = slug.replace('story-','');
    if(!d){
      html += '<div class="story-card"><div class="s-num">Story ' + num + '</div><div class="s-title">' + STORY_NAMES[slug] + '</div><div class="s-stats" style="color:var(--muted);margin-top:6px">No completions yet</div></div>';
      return;
    }
    var pct = d.totalSum > 0 ? Math.round(d.scoreSum / d.totalSum * 100) : 0;
    var barClass = pct >= 70 ? '' : pct >= 40 ? 'mid' : 'low';
    html += '<div class="story-card">';
    html += '<div class="s-num">Story ' + num + '</div>';
    html += '<div class="s-title">' + STORY_NAMES[slug] + '</div>';
    html += '<div class="bar-wrap"><div class="bar-fill ' + barClass + '" style="width:' + pct + '%"></div></div>';
    html += '<div class="s-stats">' + d.count + ' completion' + (d.count !== 1 ? 's' : '') + ' &nbsp;·&nbsp; avg ' + pct + '%</div>';
    html += '</div>';
  });

  document.getElementById('story-grid').innerHTML = html || '<div class="empty">No data yet.</div>';
}

function renderTable(){
  var html = '';
  if(!filtered.length){
    html = '<tr><td colspan="7" class="empty">No results found.</td></tr>';
  } else {
    filtered.forEach(function(r){
      var pct = r.total > 0 ? Math.round(r.score / r.total * 100) : 0;
      var cls = pct >= 70 ? 'high' : pct >= 40 ? 'mid' : 'low';
      var storyName = STORY_NAMES[r.story] || r.story || '—';
      var num = (r.story || '').replace('story-','');
      var dt = r.completed_at ? new Date(r.completed_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '—';
      html += '<tr>';
      html += '<td>' + (r.name || r.email || '—') + '<br><span style="font-size:11px;color:var(--muted)">' + (r.email || '') + '</span></td>';
      html += '<td>' + (r.period || '—') + '</td>';
      html += '<td><span style="font-size:11px;color:var(--muted)">Story ' + num + '</span><br>' + storyName + '</td>';
      html += '<td><span class="score-badge ' + cls + '">' + r.score + ' / ' + r.total + '</span></td>';
      html += '<td>' + pct + '%</td>';
      html += '<td>' + (r.predictions || 0) + '</td>';
      html += '<td>' + dt + '</td>';
      html += '</tr>';
    });
  }
  document.getElementById('results-tbody').innerHTML = html;
}

// Auto-login if session already set
if(sessionStorage.getItem('vets_dash_auth') === '1'){
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'block';
  loadData();
}

document.getElementById('pw-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter') checkPw();
});
</script>
</body>
</html>
