<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronouns · Mr. Toby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2640; --muted:#5b6784; --bg:#eef2f8; --card:#ffffff; --line:#d3dbe9;
  --i:#7a3f8f;  --i-t:#f4e9f8;
  --s3:#a86400; --s3-b:#f0a52a; --s3-t:#fff0d6;
  --pl:#2c5bc4; --pl-t:#e3ebfd;
  --ok:#1d7f53; --ok-t:#dff3e8; --no:#b93a2e; --no-t:#fbe5e1;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e8ecf5; --muted:#a3adc4; --bg:#141a28; --card:#1e2638; --line:#34405a;
    --i:#d7a6ea; --i-t:#3a2944; --s3:#ffc56a; --s3-b:#f0a52a; --s3-t:#3d2f17;
    --pl:#9dbaff; --pl-t:#20305a; --ok:#6fd6a3; --ok-t:#173a2b; --no:#ff9a8f; --no-t:#44211d;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 Lexend,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--pl);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px 60px}

/* ---------- login ---------- */
#login{max-width:440px;margin:6vh auto;background:var(--card);border-radius:20px;padding:28px 26px;border:1px solid var(--line)}
#login h1{margin:0 0 6px;font-size:40px;font-weight:800;line-height:1.1}
#login h1 .a{color:var(--i)} #login h1 .b{color:var(--s3)} #login h1 .c{color:var(--pl)}
#login p{margin:0 0 18px;color:var(--muted)}
#login label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
#login input,#login select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#login .err{color:var(--no);font-size:15px;min-height:22px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%;margin-top:18px;font-size:19px}

/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.brand{font-weight:800;font-size:20px}
.who{color:var(--muted);font-size:15px}
.spacer{flex:1}
.bar select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:15px}
.allverbs{color:var(--muted);text-decoration:none;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px}
#btn-dir{padding:7px 12px;font-size:15px;box-shadow:none;border-radius:9px}
#btn-dir.on{background:var(--pl);color:var(--card);border-color:var(--pl)}
#dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
#dot.saving{background:var(--s3-b)} #dot.saved{background:var(--ok)} #dot.err{background:var(--no)}

/* ---------- activity nav ---------- */
#acts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.act{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-size:16px;white-space:nowrap}
.act.on{background:var(--pl);border-color:var(--pl);color:var(--card)}
.act .ck{color:var(--ok);font-weight:800;margin-left:4px}
.act.on .ck{color:var(--card)}

/* ---------- stage ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 4px;font-size:26px;font-weight:800}
.lede{margin:0 0 16px;color:var(--muted);font-size:16px}
.dirtr{display:block;font-size:16px;color:var(--ink);margin-top:4px;font-weight:400}
.dirtr[dir=rtl]{text-align:right}
.l1{font-size:17px;line-height:1.45}
.l1 b{font-size:22px;font-weight:800}
[dir=rtl]{text-align:right}

/* families */
.f-i{--fc:var(--i);--ft:var(--i-t)} .f-s3{--fc:var(--s3);--ft:var(--s3-t)} .f-pl{--fc:var(--pl);--ft:var(--pl-t)}

/* learn cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{background:var(--ft);border:2px solid var(--fc);border-radius:18px;padding:16px;text-align:center}
.pc .emo{font-size:64px;line-height:1.1;min-height:72px}
.pc .word{font-size:44px;font-weight:800;color:var(--fc);line-height:1.1;margin:4px 0}
.pc .spk{background:var(--card);border:1.5px solid var(--fc);border-radius:999px;padding:6px 16px;font-size:18px;margin:4px 0 10px}
.pc .l1{margin-top:6px;padding-top:10px;border-top:1px dashed var(--fc);text-align:left}
.pc .ex{margin-top:10px;font-size:17px}
.tr{text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.note{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:16px}
.key{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.key span{border-radius:999px;padding:3px 12px;font-size:14px;background:var(--ft);color:var(--fc);border:1.5px solid var(--fc)}

/* flashcard */
.flip{display:block;width:100%;min-height:290px;background:var(--bg);border:2px solid var(--line);border-radius:20px;padding:22px;text-align:center;transition:transform .15s}
.flip.back{background:var(--ft);border-color:var(--fc)}
.flip .emo{font-size:84px;line-height:1.1}
.flip .cue{font-size:20px;color:var(--muted);margin-top:6px}
.flip .big{font-size:60px;font-weight:800;color:var(--fc);line-height:1.1}
.flip .hint{display:block;font-size:14px;color:var(--muted);margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.cnt{color:var(--muted);font-size:15px;text-align:center;margin-top:8px}

/* quiz */
.scene{font-size:76px;line-height:1.1;text-align:center;margin:6px 0}
.cue{font-size:19px;color:var(--muted);text-align:center}
.cue-l1{display:block;font-size:16px}
.frame{font-size:30px;font-weight:600;text-align:center;margin:10px 0 14px}
.frame .gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);text-align:center;color:var(--fc)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:540px;margin:0 auto}
.opt{background:var(--ft);border:2px solid var(--fc);color:var(--fc);border-radius:14px;padding:14px 6px;font-size:28px;font-weight:800;box-shadow:0 4px 0 var(--fc)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fc)}
.opt.ok{background:var(--ok-t);border-color:var(--ok);color:var(--ok);box-shadow:none}
.opt.no{background:var(--no-t);border-color:var(--no);color:var(--no);box-shadow:none;animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{text-align:center;min-height:60px;margin-top:14px;font-size:20px}
.fb .l1{font-size:16px;color:var(--muted)}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.hint-wrong{margin:12px auto 0;max-width:560px;background:var(--ft);border:1.5px solid var(--fc);border-radius:12px;padding:10px 14px;color:var(--ink);font-size:16px;text-align:left;line-height:1.45}
.hint-wrong b{color:var(--fc)}
.hw-l1{margin-top:6px;padding-top:6px;border-top:1px dashed var(--fc)}
.big-spk{display:block;margin:10px auto;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:14px 34px;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.wrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
#wIn{font:800 30px Lexend,system-ui,sans-serif;width:200px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center}
.whoq{font-size:34px;font-weight:800;text-align:center;margin:14px 0 6px}
.whoq small{display:block;font-size:17px;color:var(--muted);font-weight:400}
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 16px}
.prog i{display:block;height:100%;background:var(--pl);width:0;transition:width .2s}

/* summary */
.summary{text-align:center}
.score{font-size:64px;font-weight:800;color:var(--pl);line-height:1}
.miss{margin:14px auto 0;max-width:460px;text-align:left}
.miss div{padding:8px 10px;border-bottom:1px solid var(--line);font-size:17px}

footer{color:var(--muted);text-align:center;margin-top:30px;font-size:14px}
#pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,92vw);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#pop button{position:absolute;top:6px;right:10px;background:none;border:0;font-size:24px}
#pop .src{font-weight:700;margin-right:30px} #pop .dst{font-size:22px;margin-top:4px} #pop .mean{color:var(--muted);font-size:15px;margin-top:4px}
@media (max-width:520px){ .opts{grid-template-columns:repeat(2,1fr)} .frame{font-size:26px} .pc .word{font-size:38px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

</div>

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function byK(k){ for(var i=0;i<PRON.length;i++) if(PRON[i].k===k) return PRON[i]; return PRON[0]; }

function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    /* a lone "I" makes some voices say "capital I"; "eye" sounds identical */
    if(/^\s*I[.!?,]?\s*$/.test(text)) text='eye';
    var u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
    if(!voice){ var vs=speechSynthesis.getVoices(), i;
      for(i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang) && /female|samantha|zira|aria|jenny|google us english/i.test(vs[i].name)){ voice=vs[i]; break; } }
      if(!voice) for(i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang)){ voice=vs[i]; break; } } }
    if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function cap(s){ return s==='I' ? 'I' : s.charAt(0).toUpperCase()+s.slice(1); }

}
function enMean(k){ return '<div class="l1" style="color:var(--muted);font-size:15px">'+esc(k)+' = '+esc(EN_MEAN[k])+'</div>'; }

/* ---------------- quizzes ---------------- */
var TITLES = {
  choose:['Choose','Look at the picture. Tap the right word.'],
  listen:['Listen','Tap the speaker. Then tap the word you hear.'],
  who:['Who?','Read the name. Which word is it: he, she, we, or they?'],
  write:['Write','Look at the picture. Type the word. Then tap Check.']
};
function genItems(mode){
  var items=[];
  if(mode==='who'){
    shuffle(WHO).slice(0,12).forEach(function(w){ items.push({mode:mode, ans:w[1], who:w[0], e:w[2]}); });
  } else {
    var pool=[]; PRON.forEach(function(p){ pool.push(p); pool.push(p); });
    shuffle(pool).slice(0, mode==='write'?10:12).forEach(function(p){ items.push({mode:mode, ans:p.k, p:p, e:pick(p.emo)}); });
  }
  return items;
}
function startQuiz(mode){ Q={mode:mode, items:genItems(mode), i:0, correct:0, missed:[], answered:false}; renderQ(); }
function renderQ(){
  var it=Q.items[Q.i], m=Q.mode, h='<div class="panel"><h2>'+TITLES[m][0]+'</h2><p class="lede">'+TITLES[m][1]+'</p>'+keyStrip()+
    '<div class="prog"><i style="width:'+Math.round(100*Q.i/Q.items.length)+'%"></i></div>';
  var fam = byK(it.ans).f;
  if(m==='choose' || m==='write'){
    var dd = L1[S.lang];
    h += '<div class="scene">'+it.e+'</div><div class="cue">'+esc(it.p.cue)+(dd?'<span class="cue-l1"'+(RTL.test(S.lang)?' dir="rtl"':'')+'>'+esc(dd[it.ans][1])+'</span>':'')+'</div>'+
      '<div class="frame f-'+fam+'"><span class="gap" id="gap">&nbsp;</span> '+esc(tail(it.p.k, it.p))+'</div>';
  }
  if(m==='listen'){
    h += '<button class="big-spk" data-say="'+esc(it.ans)+'">🔊 Listen</button><div class="cue">Which word do you hear?</div>';
  }
  if(m==='who'){
    h += '<div class="scene">'+it.e+'</div><div class="whoq">'+esc(it.who)+' = ?<small>'+esc(it.who)+' → he, she, we, or they?</small></div>';
  }
  if(m==='write'){
    h += '<div class="wrow"><input id="wIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="?"><button class="btn" data-check="1">Check</button></div>';
  } else {
    var opts = m==='who' ? ['he','she','we','they'] : PRON.map(function(p){ return p.k; });
    h += '<div class="opts">'+opts.map(function(k){ return '<button class="opt f-'+byK(k).f+'" data-opt="'+esc(k)+'">'+esc(cap(k))+'</button>'; }).join('')+'</div>';
  }
  h += '<div class="fb" id="fb"></div><div class="row" id="nextRow"></div><div class="cnt">'+(Q.i+1)+' / '+Q.items.length+'</div></div>';
  $('stage').innerHTML=h;
  if(m==='listen') setTimeout(function(){ speak(it.ans); }, 300);
  if(m==='write'){ var w=$('wIn'); w.focus(); w.addEventListener('keydown', function(e){
    if(e.key!=='Enter' || e.repeat || e.isComposing) return;
    e.preventDefault();
    if(!Q.answered){ var b=document.querySelector('[data-check]'); if(b){ b.click(); checkedAt=Date.now(); } return; }
    /* Enter again = next, but not the same key press that just checked */
    if(Date.now()-checkedAt>600){ var n=document.querySelector('[data-next]'); if(n) n.click(); }
  }); }
}
/* why the tapped word was wrong, in English and in the student's language */
function wrongHint(chosen, it){
  var k = String(chosen||'').trim(); if(k.toLowerCase()!=='i') k=k.toLowerCase(); else k='I';
  if(!VERB[k] || k===it.ans) return '';
  var rtl = RTL.test(S.lang), d = L1[S.lang];
  var h = '<div class="hint-wrong f-'+byK(k).f+'">';
  h += '<div class="hw-en">You tapped <b>'+esc(cap(k))+'</b>. '+esc(cap(k))+' = '+esc(EN_MEAN[k])+'.';
  if(it.p) h += ' '+esc(USE.none.replace('{w}', cap(k)))+' <b>'+esc(sentence(k, it.p))+'</b>'; 
  h += '</div>';
  if(d){
    h += '<div class="hw-l1"'+(rtl?' dir="rtl"':'')+'><b>'+esc(cap(k))+'</b> = '+esc(d[k][0])+' — '+esc(d[k][1])+'.';
    if(it.p) h += ' '+esc((USE[S.lang]||USE.none).replace('{w}', cap(k)))+' <b dir="ltr">'+esc(sentence(k, it.p))+'</b>';
    h += '</div>';
  }
  return h+'</div>';
}
/* a group picture is "we" if you are in it and "they" if you are not — a student who
   sees themself in the group is not wrong, so we/they swap counts on picture tasks */
function it_alt(c){ c=String(c).trim(); return c.toLowerCase()==='i'?'I':c.toLowerCase(); }
function isRight(chosen, it){
  var c = String(chosen||'').trim(); c = c.toLowerCase()==='i' ? 'I' : c.toLowerCase();
  if(c===it.ans) return true;
  if((it.mode==='choose'||it.mode==='write') && ((c==='we'&&it.ans==='they')||(c==='they'&&it.ans==='we'))) return 'alt';
  return false;
}
function answer(ok, chosen){
  var alt = (ok==='alt'); if(alt){ ok=true; chosen=it_alt(chosen); }
  Q.answered=true;
  var it=Q.items[Q.i], fb=$('fb'), ans=it.ans;
  if(ok) Q.correct++; else Q.missed.push({ans:ans, said:chosen, who:it.who||''});
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
    b.disabled=true;
    if(b.getAttribute('data-opt')===ans) b.classList.add('ok');
    else if(b.getAttribute('data-opt')===chosen && !ok) b.classList.add('no');
  });
  var gap=$('gap'); if(gap){ gap.textContent=cap(alt?chosen:ans); }
  var w=$('wIn'); if(w){ w.readOnly=true; w.style.borderColor = ok?'var(--ok)':'var(--no)'; }
  fb.className='fb '+(ok?'ok':'no');
  if(alt){
    fb.innerHTML = '✓ OK! <b>'+esc(sentence(chosen, it.p))+'</b> — '+
      (chosen==='we' ? 'if you are in the group. Not you? Then ' : 'if you are not in the group. Are you in it? Then ')+
      '<b>'+esc(sentence(ans, it.p))+'</b>' + (S.lang==='none' ? enMean(chosen)+enMean(ans) : l1(chosen)+l1(ans));
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){ if(b.getAttribute('data-opt')===chosen) b.classList.add('ok'); });
  } else
  fb.innerHTML = (ok ? '✓ Yes! ' : '✗ ') + '<b>'+esc(cap(ans))+'</b>' + (it.p ? ' '+esc(tail(ans, it.p)) : it.who ? ' — '+esc(it.who) : '') +
    (S.lang==='none' ? enMean(ans) : l1(ans)) + (ok ? '' : wrongHint(chosen, it));
  $('nextRow').innerHTML='<button class="btn" data-next="1">'+(Q.i+1<Q.items.length?'Next →':'Finish')+'</button>';
  speak(it.p ? sentence(alt?chosen:ans, it.p) : it.who ? it.who+' … '+ans : ans);
  if(!w){ var n=document.querySelector('[data-next]'); if(n) n.focus(); }
}
function nextQ(){
  Q.i++; Q.answered=false;
  if(Q.i>=Q.items.length) return showSummary();
  renderQ();
}
function showSummary(){
  var c=Q.correct, t=Q.items.length, pct=c/t;
  var msg = pct===1 ? 'Perfect!' : pct>=0.8 ? 'Great work!' : pct>=0.6 ? 'Good. Try again.' : 'Keep practicing.';
  var h='<div class="panel summary"><h2>'+msg+'</h2><div class="score">'+c+' / '+t+'</div><p class="lede" style="margin:0 auto">correct</p>';
  if(Q.missed.length){
    h += '<div class="miss">'+Q.missed.map(function(m){ return '<div>'+(m.who?esc(m.who)+' → ':'')+'<b>'+esc(cap(m.ans))+'</b>'+(m.said?' <span style="color:var(--muted)">(you said '+esc(m.said)+')</span>':'')+'</div>'; }).join('')+'</div>';
  }
  var idx=0; ACTS.forEach(function(a,i){ if(a.k===Q.mode) idx=i; });
  var nxt = ACTS[idx+1];
  h += '<div class="row"><button class="btn soft" data-again="1">Again</button>'+(nxt?'<button class="btn" data-actk="'+nxt.k+'">'+esc(nxt.t)+' →</button>':'')+'</div></div>';
  $('stage').innerHTML=h;
  saveResult(Q.mode, c, t, Q.missed);
}

/* ---------------- save ---------------- */
var registered=false;
function saveResult(ak, correct, total, missed){
  var key=UNIT+'-'+ak, prev=S.scores[key]||{best:0,attempts:0};
  var rec={best:Math.max(prev.best||0,correct), total:total, correct:correct, attempts:(prev.attempts||0)+1};
  S.scores[key]=rec; persist(); renderNav(); setDot('saving');
  var when=new Date().toISOString();
  var row={email:S.email, name:S.name, period:S.period, activity:key, unit:UNIT, correct:correct, total:total, best:rec.best, attempts:rec.attempts, turned_in:true,
    detail:{lang:S.lang, missed:missed.slice(0,20)}, updated_at:when};
  rawFetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,activity',{method:'POST',headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(row)})
    .then(function(r){ if(r.ok) setDot('saved'); else { setDot('err'); r.text().then(function(t){ console.warn('save failed',r.status,t); }); } })
    .catch(function(e){ setDot('err'); console.warn(e); });
  /* curriculum system: one row per finished task */
  var actT=''; ACTS.forEach(function(a){ if(a.k===ak) actT=a.t; });
  var post=function(path, body, prefer){ return rawFetch(SUPA_URL+'/rest/v1/'+path,{method:'POST',headers:headers({'Prefer':prefer||'return=minimal'}),body:JSON.stringify(body)}).catch(function(){}); };
  var reg = registered ? Promise.resolve() : post('activities?on_conflict=slug',[{slug:SLUG, title:'Pronouns: I, you, he, she, we, they', unit:'Pronouns', url:PAGE_URL, skills:['pronouns'], sort_order:600}],'resolution=merge-duplicates,return=minimal').then(function(){ registered=true; });
  reg.then(function(){
    post('activity_attempts',[{email:S.email, slug:SLUG, score:correct, max_score:total, detail:{path:location.pathname, source:'page', task:ak, task_title:actT, unit:UNIT}, completed_at:when}]);
    post('skill_attempts',[{email:S.email, slug:SLUG, skill:'pronouns', n:correct, d:total, completed_at:when}]);
  });
}
function loadScores(){
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?email=eq.'+encodeURIComponent(S.email)+'&activity=like.'+encodeURIComponent(UNIT+'-%')+'&select=activity,best,total,correct,attempts',{headers:headers()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ (rows||[]).forEach(function(r){ S.scores[r.activity]={best:r.best,total:r.total,correct:r.correct,attempts:r.attempts}; }); })
    .catch(function(){});
}

/* ---------------- tap-to-translate ---------------- */
var trCache={};
function translate(text){
  if(S.lang==='none'){ popup(text,'Choose your language at the top of the page.',''); return; }
  var key=S.lang+'|'+text;
  if(trCache[key]) return popup(text, trCache[key].equiv, trCache[key].meaning);
  popup(text,'…','');
  var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('A very simple English sentence for a beginner. Translate it plainly.')+'&lang='+encodeURIComponent(S.lang);
  rawFetch(url).then(function(r){ return r.json(); }).then(function(d){
    if(d&&d.ok&&d.translation){ trCache[key]=d.translation; popup(text,d.translation.equiv,d.translation.meaning); }
    else popup(text,'Translation is not available right now.','');
  }).catch(function(){ popup(text,'Translation is not available right now.',''); });
}
function popup(src,dst,mean){
  var p=$('pop'); p.classList.remove('hidden'); var rtl=RTL.test(S.lang);
  p.innerHTML='<button aria-label="Close" data-closepop="1">×</button><div class="src">'+esc(src)+'</div><div class="dst" dir="'+(rtl?'rtl':'ltr')+'">'+esc(dst)+'</div>'+(mean?'<div class="mean" dir="'+(rtl?'rtl':'ltr')+'">'+esc(mean)+'</div>':'');
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  var t=e.target.closest ? e.target.closest('button, .tr') : null; if(!t) return;
  var d=function(k){ return t.getAttribute('data-'+k); };
  if(d('closepop')){ $('pop').classList.add('hidden'); return; }
  if(d('say')){ speak(d('say')); return; }
  if(d('tr')){ translate(d('tr')); return; }
  if(d('actk')) return go(d('actk'));
  if(d('again')) return renderStage();
  if(F){
    if(d('flip')){ F.flipped=!F.flipped; return renderFlash(); }
    if(d('fnext')){ F.i=(F.i+1)%F.cards.length; F.flipped=false; return renderFlash(); }
    if(d('fprev')){ F.i=(F.i-1+F.cards.length)%F.cards.length; F.flipped=false; return renderFlash(); }
  }
  if(Q){
    var it=Q.items[Q.i];
    if(d('opt')!=null && !Q.answered) return answer(isRight(d('opt'), it), d('opt'));
    if(d('check') && !Q.answered){ var v=$('wIn').value.trim(); if(!v) return $('wIn').focus(); return answer(isRight(v, it), v); }
    if(d('next')) return nextQ();
  }
});

/* ---------------- boot ---------------- */
(function(){
  var opts=LANGS.map(function(l){ return '<option value="'+l[0]+'">'+esc(l[1])+'</option>'; }).join('');
  $('inLang').innerHTML=opts; $('langSel').innerHTML=opts;
  try{
    var c=JSON.parse(localStorage.getItem(LSKEY)||'null');
    if(c&&c.email){ $('inName').value=c.name||''; $('inEmail').value=c.email; $('inPeriod').value=c.period||''; $('inLang').value=c.lang||'none'; S.scores=c.scores||{}; S.act=c.act||'learn'; }
    else {
      var saved=localStorage.getItem('gal_student_email'); if(saved) $('inEmail').value=saved;
      var sn=localStorage.getItem('gal_student_name'); if(sn) $('inName').value=sn;
      var sp=localStorage.getItem('gal_student_period'); if(sp) $('inPeriod').value=/Period/.test(sp)?sp:'Period '+sp;
      var sl=localStorage.getItem('gal_student_l1'); if(sl && LANGS.some(function(l){ return l[0]===sl; })) $('inLang').value=sl;
    }
  }catch(e){}
  $('btnStart').addEventListener('click', function(){
    var n=$('inName').value.trim(), e=$('inEmail').value.trim().toLowerCase(), p=$('inPeriod').value, err=$('loginErr');
    if(!n) return err.textContent='Please type your name.';
    if(!EMAIL_RE.test(e)) return err.textContent='Use your school email: name@s.sfusd.edu';
    if(!p) return err.textContent='Choose your class period.';
    err.textContent='';
    var canon=canonical(e);
    if(S.email && S.email!==canon) S.scores={};
    S.name=n; S.email=canon; S.period=p; S.lang=$('inLang').value;
    try{ localStorage.setItem('gal_student_email',canon); localStorage.setItem('gal_student_name',n); localStorage.setItem('gal_student_period',p); localStorage.setItem('gal_student_l1',S.lang); }catch(ex){}
    persist(); registerStudent(e);
    $('whoLbl').textContent=n+' · '+p; $('langSel').value=S.lang;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    loadScores().then(function(){ renderNav(); renderStage(); });
    renderNav(); renderStage();
  });
  $('langSel').addEventListener('change', function(){ S.lang=this.value; persist(); try{ localStorage.setItem('gal_student_l1',S.lang); }catch(e){} renderStage(); });
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged=function(){ voice=null; };
})();

/* ============ Galileo standard: directions in L1 + quiet browser-translation canary ============ */
(function(){
  function hd(pref){ var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; if(pref) h['Prefer']=pref; return h; }
  var DIR_ON=true, SENT={}, dcache={};
  try{ DIR_ON = localStorage.getItem('pron_dir')!=='0'; }catch(e){}
  function tr(text, lang){
    var key=lang+'|'+text; if(dcache[key]) return Promise.resolve(dcache[key]);
    var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('Directions for a beginner English student. Translate plainly and simply.')+'&lang='+encodeURIComponent(lang);
    return rawFetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      var t=d.translation.equiv||d.translation.meaning||''; if(t) dcache[key]=t; return t||null;
    }).catch(function(){return null;});
  }
  function logReveal(k, lang){
    if(!S.email) return; var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    rawFetch(SUPA_URL+'/rest/v1/instruction_reveals',{method:'POST',headers:hd('return=minimal'),body:JSON.stringify([{email:S.email, set_slug:SLUG, activity:k, lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=S.lang, list=document.querySelectorAll('#stage .lede');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!p.getAttribute('data-en')){
        var en=(p.textContent||'').replace(out?out.textContent:'','').trim();
        p.setAttribute('data-en',en); p.setAttribute('translate','yes'); p.setAttribute('data-dir',S.act);
      }
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang||lang==='none'){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||''; if(!en) return;
      out.setAttribute('dir', RTL.test(lang)?'rtl':'ltr'); out.textContent='…';
      tr(en,lang).then(function(t){ out.textContent=t||''; if(t) logReveal(k,lang); });
    });
  }
  var dirBtn=$('btn-dir');
  dirBtn.classList.toggle('on',DIR_ON);
  dirBtn.addEventListener('click',function(){ DIR_ON=!DIR_ON; try{ localStorage.setItem('pron_dir',DIR_ON?'1':'0'); }catch(e){} dirBtn.classList.toggle('on',DIR_ON); showDirections(); });
  var pend=null;
  new MutationObserver(function(){ if(pend) return; pend=setTimeout(function(){ pend=null; showDirections(); },120); }).observe($('stage'),{childList:true});

  var EXPECT=(dirBtn.textContent||'').trim(), TR_SENT='';
  function detectTranslation(){
    var got=(dirBtn.textContent||'').trim(), observed=(got&&got!==EXPECT)?got:'';
    var cls=document.documentElement.className||'';
    if(!observed && !/translated/.test(cls)) return null;
    return {observed:observed, html_lang:document.documentElement.lang||'', html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation(); if(!d||!S.email) return;
    var sig=d.observed+'|'+d.html_lang; if(sig===TR_SENT) return; TR_SENT=sig;
    rawFetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{method:'POST',headers:hd('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:S.email, set_slug:SLUG, translated:true, observed:d.observed, html_lang:d.html_lang, html_class:d.html_class, updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation,20000); setTimeout(checkTranslation,4000);
})();
</script>
