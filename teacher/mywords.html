<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Words &middot; Teacher View</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#5a4a8a;--plum-dk:#3d3160;--plum-dp:#2b2244;--plum-lt:#eae7f5;--plum-mid:#8d7fc0;
  --paper:#efebf7;--field:#f6f4fb;--ink:#231d35;--muted:#5d5575;--line:#d5cceb;--line-dk:#bdb0dd;
  --green:#1f7a4d;--green-bg:#d7f0e2;--yellow:#a86b00;--yellow-bg:#fdefd4;
  --red:#b5304a;--red-bg:#fbdde4;--grey:#9a92b5;--grey-bg:#eeebf5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 60px}
h1,h2{margin:0;font-weight:900;color:var(--plum-dk)}
.hide{display:none!important}
a{color:var(--plum)}
.topbar{background:linear-gradient(135deg,var(--plum-dk),var(--plum) 60%,var(--plum-mid));color:#fff;
  border-radius:14px;padding:16px 20px;margin-bottom:14px;border-bottom:5px solid var(--plum-dp);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{color:#fff;font-size:1.4rem}.topbar .sub{opacity:.9;font-size:.88rem;font-weight:700}
.spacer{flex:1}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;
  margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
.btn{background:var(--plum);color:#fff;border:0;border-bottom:3px solid var(--plum-dp);border-radius:10px;
  padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--plum-dk)}.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.sm{padding:6px 12px;font-size:.87rem;border-radius:8px}
.btn.light{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.5)}
input,select{font:inherit;padding:9px 11px;border:2px solid var(--line-dk);border-radius:10px;
  background:var(--field);color:var(--ink)}
input:focus,select:focus{outline:0;border-color:var(--plum);background:#fff}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border:2px solid var(--line-dk);border-radius:999px;padding:7px 15px;
  font-weight:800;cursor:pointer;font-size:.88rem;color:var(--plum-dk)}
.pill.on{background:var(--plum);color:#fff;border-color:var(--plum-dp)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 16px;min-width:104px}
.stat b{display:block;font-size:1.5rem;font-weight:900;color:var(--plum-dk);line-height:1.1}
.stat span{font-size:.74rem;color:var(--muted);font-weight:800;text-transform:uppercase}

/* student block */
.sblock{background:#fff;border:1.5px solid var(--line);border-radius:14px;
  margin-bottom:13px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 16px;background:var(--plum-lt);border-bottom:1.5px solid var(--line)}
.sname{font-weight:900;font-size:1.1rem;color:var(--plum-dk);text-decoration:none}
.sname:hover{text-decoration:underline}
.smeta{font-size:.82rem;color:var(--muted);font-weight:700}
.sbody{padding:13px 16px}
.quiz{margin-bottom:12px}
.qname{font-size:.76rem;font-weight:900;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:6px}
.words{display:flex;flex-wrap:wrap;gap:7px}
.w{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 13px;
  font-weight:800;font-size:.92rem;border:1.5px solid}
.w.got{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.w.work{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow)}
.w.hard{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.w .n{font-size:.76rem;opacity:.85;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;font-weight:700;margin:10px 0 16px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.muted{color:var(--muted)}
.msg{padding:12px 14px;border-radius:10px;font-weight:700;margin-bottom:12px}
.msg.err{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red)}
.msg.info{background:var(--plum-lt);color:var(--plum-dk);border:1.5px solid var(--line-dk)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--plum-lt);color:var(--plum-dk);font-weight:900;font-size:.78rem}
tbody tr:nth-child(even) td{background:#faf9fd}
.bar{display:inline-block;height:9px;border-radius:99px;background:var(--grey-bg);
  width:120px;overflow:hidden;vertical-align:-1px}
.bar i{display:block;height:100%;background:var(--green)}
.gate{max-width:380px;margin:60px auto}
@media print{.noprint{display:none!important}body{background:#fff}.sblock{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">

<div id="gate" class="card gate">
  <h1>My Words</h1>
  <p class="muted" style="font-weight:700">Mr. Toby &middot; Galileo Academy</p>
  <div style="margin:14px 0"><input id="pw" type="password" placeholder="Password" style="width:100%"></div>
  <button class="btn" id="btnPw" style="width:100%">Open</button>
  <p id="pwErr" style="color:var(--red);font-weight:800"></p>
</div>

<div id="app" class="hide">
  <div class="topbar noprint">
    <div><h1>My Words</h1><div class="sub">What every student is practicing</div></div>
    <div class="spacer"></div>
    <button class="btn light sm" onclick="loadAll()">Refresh</button>
    <a class="btn light sm" href="./">Class Data</a>
    <button class="btn light sm" onclick="window.print()">Print</button>
  </div>

  <div id="msg"></div>
  <div class="stats" id="stats"></div>

  <div class="card noprint">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="pills" id="periodPills"></div>
      <div class="spacer"></div>
      <div class="pills">
        <button class="pill on" id="vStudent" onclick="setView('student')">By student</button>
        <button class="pill" id="vWord" onclick="setView('word')">By word</button>
      </div>
      <input id="search" placeholder="Search a name or a word&hellip;" oninput="render()" style="min-width:210px">
    </div>
    <label class="muted" style="display:inline-flex;gap:8px;align-items:center;font-weight:700;margin-top:11px;font-size:.88rem">
      <input type="checkbox" id="hideGot" onchange="render()" style="width:16px;height:16px;padding:0;accent-color:var(--plum)">
      Hide words they already know
    </label>
  </div>

  <div class="legend">
    <span><i style="background:var(--green)"></i>Knows it</span>
    <span><i style="background:var(--yellow)"></i>Still practicing</span>
    <span><i style="background:var(--red)"></i>Getting it wrong a lot</span>
    <span class="muted">&middot; click a name to open that student's page</span>
  </div>

  <div id="out"></div>
</div>
</div>

<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PASSWORD='galileo2026';
var LEARN_CORRECT=3, LEARN_MODES=2;   // same rule My Words itself uses

function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return {apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};}
function sb(p){return fetch(SUPA_URL+'/rest/v1/'+p,{headers:H()})
  .then(function(r){return r.ok?r.json():r.text().then(function(t){throw new Error(t);});});}

$('btnPw').addEventListener('click',function(){
  if($('pw').value===PASSWORD){try{sessionStorage.setItem('dash_ok','1');}catch(e){}openApp();}
  else $('pwErr').textContent='Not the right password.';});
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('btnPw').click();});
try{if(sessionStorage.getItem('dash_ok')==='1')openApp();}catch(e){}
function openApp(){$('gate').classList.add('hide');$('app').classList.remove('hide');loadAll();}

var STUD={}, ROWS=[], QUIZNAME={}, PERIOD='', VIEW='student';

function loadAll(){
  $('msg').innerHTML='<div class="msg info">Loading&hellip;</div>';
  Promise.all([
    sb('students?select=email,first_name,last_name,period').catch(function(){return [];}),
    sb('vocab_word_practice?select=*').catch(function(){return [];}),
    sb('vocab_preassess?select=quiz,quiz_title').catch(function(){return [];})
  ]).then(function(r){build(r[0],r[1],r[2]);})
   .catch(function(e){$('msg').innerHTML='<div class="msg err">Could not load.<br>'+
     esc(String(e.message).slice(0,300))+'</div>';});
}

function key(e){return String(e||'').trim().toLowerCase();}
function learned(p){return (p.correct||0)>=LEARN_CORRECT && (p.modes||[]).length>=LEARN_MODES;}
function state(p){
  if(p.learned||learned(p))return 'got';
  if((p.wrong||0)>=3 && (p.wrong||0)>(p.correct||0))return 'hard';
  return 'work';
}

function build(students,practice,quizzes){
  STUD={};QUIZNAME={};
  (quizzes||[]).forEach(function(q){if(q.quiz)QUIZNAME[q.quiz]=q.quiz_title||q.quiz;});
  (students||[]).forEach(function(s){
    var k=key(s.email); if(!k)return;
    STUD[k]={email:k,name:((s.first_name||'')+' '+(s.last_name||'')).trim()||k.split('@')[0],
             period:s.period||'',words:[]};
  });
  (practice||[]).forEach(function(p){
    var k=key(p.email); if(!k)return;
    if(!STUD[k])STUD[k]={email:k,name:k.split('@')[0],period:'',words:[]};
    STUD[k].words.push(p);
  });
  ROWS=Object.keys(STUD).map(function(k){return STUD[k];})
        .filter(function(s){return s.words.length;});
  ROWS.forEach(function(s){
    s.got=s.words.filter(function(p){return state(p)==='got';}).length;
    s.hard=s.words.filter(function(p){return state(p)==='hard';}).length;
  });
  ROWS.sort(function(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;});
  $('msg').innerHTML=ROWS.length?'':
    '<div class="msg info">No My Words practice saved yet. It appears here once students start practising.</div>';
  buildPeriods();render();
}

function buildPeriods(){
  var ps={};ROWS.forEach(function(r){if(r.period)ps[r.period]=1;});
  var list=Object.keys(ps).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});
  $('periodPills').innerHTML='<button class="pill'+(PERIOD===''?' on':'')+
    '" onclick="setPeriod(\'\')">All periods</button>'+
    list.map(function(p){return '<button class="pill'+(PERIOD===p?' on':'')+
      '" onclick="setPeriod(\''+esc(p)+'\')">Period '+esc(p)+'</button>';}).join('');
}
function setPeriod(p){PERIOD=p;buildPeriods();render();}
function setView(v){VIEW=v;
  $('vStudent').classList.toggle('on',v==='student');
  $('vWord').classList.toggle('on',v==='word');render();}

function shown(){
  var q=($('search').value||'').trim().toLowerCase();
  return ROWS.filter(function(r){
    if(PERIOD&&String(r.period)!==PERIOD)return false;
    if(!q)return true;
    if(r.name.toLowerCase().indexOf(q)>-1||r.email.indexOf(q)>-1)return true;
    return r.words.some(function(p){return String(p.word||'').toLowerCase().indexOf(q)>-1;});
  });
}

function render(){
  var rows=shown(), hideGot=$('hideGot').checked;
  var totalWords=0,totalGot=0,totalHard=0;
  rows.forEach(function(s){
    totalWords+=s.words.length;totalGot+=s.got;totalHard+=s.hard;});
  $('stats').innerHTML=
    stat(rows.length,'students')+
    stat(totalWords,'words being practiced')+
    stat(totalGot,'known')+
    stat(totalHard,'giving trouble');

  $('out').innerHTML = VIEW==='student' ? byStudent(rows,hideGot) : byWord(rows,hideGot);
}
function stat(v,l){return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>';}

function byStudent(rows,hideGot){
  if(!rows.length)return '<p class="muted">Nobody matches.</p>';
  return rows.map(function(s){
    var byQuiz={};
    s.words.forEach(function(p){
      var st=state(p);
      if(hideGot&&st==='got')return;
      (byQuiz[p.quiz]=byQuiz[p.quiz]||[]).push(p);
    });
    var quizKeys=Object.keys(byQuiz).sort();
    var body=quizKeys.length?quizKeys.map(function(q){
      var list=byQuiz[q].slice().sort(function(a,b){
        var o={hard:0,work:1,got:2};return o[state(a)]-o[state(b)];});
      return '<div class="quiz"><div class="qname">'+esc(QUIZNAME[q]||q)+'</div><div class="words">'+
        list.map(function(p){
          return '<span class="w '+state(p)+'">'+esc(p.word)+
            '<span class="n">'+(p.correct||0)+'&#10003; '+(p.wrong||0)+'&#10007;</span></span>';
        }).join('')+'</div></div>';
    }).join(''):'<p class="muted" style="margin:0">Nothing left to show for this student.</p>';

    var pct=s.words.length?Math.round(100*s.got/s.words.length):0;
    return '<div class="sblock"><div class="shead">'+
      '<a class="sname" href="../student/?email='+encodeURIComponent(s.email)+'">'+esc(s.name)+'</a>'+
      '<span class="smeta">'+(s.period?'Period '+esc(s.period)+' &middot; ':'')+
        s.words.length+' words &middot; '+s.got+' known</span>'+
      '<div class="spacer"></div>'+
      '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
      '<span class="smeta">'+pct+'%</span>'+
      '<a class="btn sm noprint" href="../student/?email='+encodeURIComponent(s.email)+'">Open page</a>'+
      '</div><div class="sbody">'+body+'</div></div>';
  }).join('');
}

function byWord(rows,hideGot){
  var W={};
  rows.forEach(function(s){
    s.words.forEach(function(p){
      var st=state(p);
      if(hideGot&&st==='got')return;
      var k=p.quiz+'||'+p.word;
      if(!W[k])W[k]={quiz:p.quiz,word:p.word,n:0,got:0,hard:0,who:[]};
      W[k].n++; if(st==='got')W[k].got++; if(st==='hard'){W[k].hard++;W[k].who.push(s.name);}
    });
  });
  var list=Object.keys(W).map(function(k){return W[k];});
  if(!list.length)return '<p class="muted">Nothing to show.</p>';
  list.sort(function(a,b){
    var ra=a.n?a.got/a.n:1, rb=b.n?b.got/b.n:1;
    if(ra!==rb)return ra-rb;
    return b.n-a.n;});
  return '<div class="card" style="padding:0;overflow:hidden"><table>'+
    '<thead><tr><th>Word</th><th>Set</th><th>Practising</th><th>Know it</th>'+
    '<th>Struggling</th><th>Who is stuck</th></tr></thead><tbody>'+
    list.map(function(w){
      var pct=w.n?Math.round(100*w.got/w.n):0;
      return '<tr><td><b>'+esc(w.word)+'</b></td><td class="muted">'+esc(QUIZNAME[w.quiz]||w.quiz)+'</td>'+
        '<td>'+w.n+'</td>'+
        '<td><span class="bar"><i style="width:'+pct+'%"></i></span> '+pct+'%</td>'+
        '<td>'+(w.hard?'<b style="color:var(--red)">'+w.hard+'</b>':'&mdash;')+'</td>'+
        '<td class="muted">'+esc(w.who.slice(0,6).join(', ')+(w.who.length>6?' +'+(w.who.length-6):''))+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
</script>
</body>
</html>
