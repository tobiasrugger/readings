<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Practice · Mr. Toby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="/readings/group/decks/list.js"></script>
<script>
/* report each deck (or mix of decks) to the gradebook under its own name, before track.js reads it */
(function(){
  var d=(new URLSearchParams(location.search).get('deck')||'').split(/[,+ ]/).filter(Boolean);
  if(!d.length) return;
  if(d.length===1){var hit=(window.GP_DECK_LIST||[]).filter(function(x){return x.slug===d[0];})[0];
    if(hit&&hit.slugKeep){window.GAL_SLUG_KEEP=hit.slugKeep;return;}}
  window.GAL_SLUG_KEEP='group/'+d.join('+');
})();
</script>
</head>
<body>
<script src="/readings/group/engine.js"></script>
<script>GP.boot();</script>
<script src="/readings/track.js"></script>
</body>
</html>
