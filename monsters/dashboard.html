ike a small person."}, {"t": "cloze", "id": "v8", "ch": ["symbol", "symbolize", "symbolizing"], "q": "A white flag ___ peace.", "a": ["symbolizes", "represents"], "hint": "It is a sign for an idea. One flag → add -s."}, {"t": "cloze", "id": "v9", "ch": ["trouble", "charm", "curse"], "q": "The war was a ___. He still has bad dreams.", "a": ["trauma"], "hint": "A very bad experience that hurts the mind for a long time."}, {"t": "cloze", "id": "v10", "ch": ["countless", "named", "namely"], "q": "Nobody knows her name. She is ___.", "a": ["nameless"], "hint": "name + less."}]}]}, {"id": "read", "emoji": "📖", "title": {"A": "What do monsters represent?", "B": "Read: what do monsters represent?"}, "art": "m_shadow", "dir": {"A": "Read it. Tap 🔊 to listen. Tap any word you don't know.", "B": "Read it once. Then read it again and tap the words that are new for you."}, "chunks": [{"title": {"A": "A monster is a symbol", "B": "A monster is a symbol"}, "pic": "m_shadow", "items": [{"t": "p", "text": {"A": "Monsters are symbols. They show what people are afraid of. They represent three things: things we do not know, our biggest fears, and death. Every person dies one day.", "B": "Monsters represent the unknown, our deepest fears, and the eventual death that we all face. Throughout history, there are countless examples of monsters. Some of our most well-known monsters come from an age in which the world was still shrouded in darkness, counting nameless fears in the dark."}}, {"t": "p", "text": {"A": "There are countless monsters in history. Many famous monsters come from long ago. Then, people did not understand the world. The world was dark, and people had fears with no names. So a monster is not only a monster. When we look at a monster, we can see what people were afraid of.", "B": "That is why a monster is never only a monster. It is a symbol. When we look closely at a monster, we can see what the people who told the story were afraid of — and sometimes what we are still afraid of today."}}]}, {"title": {"A": "True or false?", "B": "True or false?"}, "items": [{"t": "tf", "id": "tfa1", "q": "Monsters represent things that people are afraid of.", "a": true, "hint": "Read the first sentence again."}, {"t": "tf", "id": "tfa2", "q": "There are only a few monsters in history.", "a": false, "hint": "What does countless mean?"}, {"t": "tf", "id": "tfa3", "q": "Many famous monsters come from a time when people did not understand much about the world.", "a": true, "hint": "Look for 'shrouded in darkness' / 'the world was dark'."}, {"t": "tf", "id": "tfa4", "q": "A monster can be a symbol of death.", "a": true, "hint": "What three things do monsters represent?"}, {"t": "tf", "id": "tfa5", "q": "We cannot be afraid of the same things as people long ago.", "a": false, "hint": "Read the last sentence again."}]}]}, {"id": "fears", "emoji": "😱", "title": {"A": "Sixteen fears", "B": "Sixteen fears that monsters symbolize"}, "art": "m_fears", "side": "fears", "dir": {"A": "Read the sixteen fears. Tap any word you don't know. The list stays on the side for the next screens.", "B": "Read the sixteen fears. Tap any word you don't know. This list stays beside you on the next screens."}, "chunks": [{"title": "The sixteen fears", "pic": "m_fears", "items": [{"t": "html", "html": "<ol class=\"fearlist\"><li><span class=\"fe\">🧪</span> Fear of medicine and doctors, or science and technology</li><li><span class=\"fe\">😡</span> A scary person who gets mad too much and attacks others</li><li><span class=\"fe\">🎭</span> A person who looks beautiful, young, and good — but is really bad</li><li><span class=\"fe\">💘</span> A beautiful person you like who takes your energy and makes you feel bad</li><li><span class=\"fe\">🧠</span> A scary memory you want to forget but cannot forget</li><li><span class=\"fe\">🏚️</span> A house where bad things happened (abuse, murder)</li><li><span class=\"fe\">👪</span> Family problems and trauma passed from generation to generation</li><li><span class=\"fe\">🔁</span> A memory you want to forget that keeps coming back</li><li><span class=\"fe\">🧸</span> Things you love and think are innocent are secretly bad</li><li><span class=\"fe\">🛏️</span> The world is so dangerous you can't escape — not even in your bedroom</li><li><span class=\"fe\">🍲</span> A person so good at cooking or singing they can charm you and cast a spell</li><li><span class=\"fe\">🤖</span> A person who doesn't think and just acts automatically</li><li><span class=\"fe\">📱</span> Addiction (drugs, a phone, a computer) controls a person</li><li><span class=\"fe\">🦠</span> Fear of disease (COVID, Ebola, AIDS)</li><li><span class=\"fe\">👑</span> Fear of powerful women (or hatred of strong women)</li><li><span class=\"fe\">🌍</span> Fear that a big group of different people will take over and change your world (xenophobia)</li></ol>"}]}, {"title": "Check: which fear?", "items": [{"t": "mc", "id": "f1", "q": "Fear 16 has a special name. What is it?", "o": ["xenophobia", "addiction", "trauma", "technology"], "hint": "Read number 16 to the end."}, {"t": "mc", "id": "f2", "q": "Which fear is about a phone controlling a person?", "o": ["13", "1", "9", "4"], "hint": "Look for addicted / phone."}, {"t": "mc", "id": "f3", "q": "Which fear is about the past coming back again and again?", "o": ["8", "2", "11", "16"], "hint": "Look for 'keeps coming back'."}, {"t": "mc", "id": "f4", "q": "Fear 7 says trauma passes 'from generation to generation.' That means…", "o": ["from grandparents to parents to children", "from one house to another house", "from one country to another", "from a doctor to a patient"], "hint": "A generation = people born around the same time."}]}]}, {"id": "eight", "sideHideA": true, "emoji": "🧛", "title": {"A": "Eight monsters", "B": "Eight monsters: what do they symbolize?"}, "art": "m_vampire", "side": "fears", "dir": {"A": "For each monster, choose one or more of the four fears. Then finish the sentence.", "B": "For each m  — 11 and 15, sometimes 3. <b>Zombie horde</b> — 12, 13, 14, and 16. <b>Frankenstein</b> — 1: a scientist makes life, and it goes wrong.</p>"}]}]}, {"id": "world1", "sideHideA": true, "emoji": "🌎", "title": {"A": "World monsters 1", "B": "Monsters from around the world · 1"}, "art": "m_llorona", "side": "fears", "dir": "Read every story on this screen. If one is from your country, start with that one. Answer the questions under each story.", "chunks": [{"title": "La Llorona — <em>the weeping woman</em> · Mexico and Central America", "pic": "m_llorona", "items": [{"t": "p", "text": {"A": "Long ago, a beautiful young woman named María had two children. Their father left her for another woman. María was so angry and so sad that she lost her mind. She threw her children into the river, and they drowned. The next day she understood what she did. She searched the river, but her children were gone. Soon she died too. Now her spirit walks next to rivers and lakes at night in a long white dress. She wails, \"¡Ay, mis hijos!\" — \"Oh, my children!\" Parents warn their children: if you go near the water at night, La Llorona will take you.", "B": "Long ago, a beautiful young woman named María had two children. Their father left her for another woman. María was so angry and so sad that she lost her mind. She threw her children into the river, and they drowned. The next day she understood what she did. She searched the river, but her children were gone. Soon she died too. Now her spirit walks next to rivers and lakes at night in a long white dress. She wails, \"¡Ay, mis hijos!\" — \"Oh, my children!\" Parents warn their children: if you go near the water at night, La Llorona will take you."}}, {"t": "mc", "id": "sm1", "q": "Why does La Llorona cry?", "o": ["She lost her children, and it was her fault.", "She is lost in the forest.", "Her husband is a werewolf.", "She is hungry."], "hint": "What happened at the river?"}, {"t": "nums", "id": "sf1", "n": 16, "q": "Which fear does La Llorona symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [5, 8, 7, 2], "qA": "Which fear does La Llorona symbolize? Choose one or more."}, {"t": "write", "id": "sw1", "q": "Why? One sentence.", "frame": "La Llorona symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Aswang — <em>the neighbor at night</em> · the Philippines", "pic": "m_aswang", "items": [{"t": "p", "text": {"A": "In the daytime, an aswang looks like a normal person. Maybe she is a quiet neighbor who sells vegetables, or a man who does not talk much. But at night the aswang can shapeshift — it changes into a big black dog, a pig, or a bird. It hunts in the dark and makes a sound, \"tik-tik-tik.\" Strangely, the sound is loud when the aswang is far away and quiet when it is close. Families put salt and garlic by the doors and windows to keep it out. People say that if you look into an aswang's eyes, your picture is upside down.", "B": "In the daytime, an aswang looks like a normal person. Maybe she is a quiet neighbor who sells vegetables, or a man who does not talk much. But at night the aswang can shapeshift — it changes into a big black dog, a pig, or a bird. It hunts in the dark and makes a sound, \"tik-tik-tik.\" Strangely, the sound is loud when the aswang is far away and quiet when it is close. Families put salt and garlic by the doors and windows to keep it out. People say that if you look into an aswang's eyes, your picture is upside down."}}, {"t": "mc", "id": "sm2", "q": "What does an aswang look like in the daytime?", "o": ["A normal person", "A big black dog", "A bird", "A ghost in a white dress"], "hint": "Read the first sentence."}, {"t": "nums", "id": "sf2", "n": 16, "q": "Which fear does Aswang symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [3, 2, 16, 12], "qA": "Which fear does Aswang symbolize? Choose one or more."}, {"t": "write", "id": "sw2", "q": "Why? One sentence.", "frame": "Aswang symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Aisha Qandisha — <em>the woman by the water</em> · Morocco", "pic": "m_aisha", "items": [{"t": "p", "text": {"A": "In Morocco, people tell stories about Aisha Qandisha, a jinniya — a female jinn. She lives near rivers, springs, and the sea. At night she looks like a very beautiful woman, and she calls men by their names. Men who follow her fall under her charm, and some never come back to their families. But she has one secret: under her long dress, her feet are the feet of a goat or a camel. Grandmothers say: if a beautiful woman calls your name by the water at night, look at her feet first — and then run.", "B": "In Morocco, people tell stories about Aisha Qandisha, a jinniya — a female jinn. She lives near rivers, springs, and the sea. At night she looks like a very beautiful woman, and she calls men by their names. Men who follow her fall under her charm, and some never come back to their families. But she has one secret: under her long dress, her feet are the feet of a goat or a camel. Grandmothers say: if a beautiful woman calls your name by the water at night, look at her feet first — and then run."}}, {"t": "mc", "id": "sm3", "q": "What is Aisha Qandisha's secret?", "o": ["She has the feet of a goat or a camel.", "She cannot swim.", "She has no name.", "She is afraid of salt."], "hint": "Look for the word secret."}, {"t": "nums", "id": "sf3", "n": 16, "q": "Which fear does Aisha Qandisha symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [4, 15, 3, 1], "qA": "Which fear does Aisha Qandisha symbolize? Choose one or more."}, {"t": "write", "id": "sw3", "q": "Why? One sentence.", "frame": "Aisha Qandisha symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "The Ghoul — <em>the stranger in the desert</em> · Arabia", "pic": "m_ghoul", "items": [{"t": "p", "text": {"A": "The English word ghoul comes from the Arabic word ghūl. Long before Islam, Arab travelers told stories about the ghūl of the desert. It can shapeshift — it can look like a hyena, an old friend, or a stranger who needs help. It calls to travelers in a kind voice and leads them far from the road, into the empty sand, where it eats them. Later stories say the ghoul also lives in cemeteries and eats the dead. Travelers learned to stay on the road and not to follow a friendly voice in the dark.", "B": "The English word ghoul comes from the Arabic word ghūl. Long before Islam, Arab travelers told stories about the ghūl of the desert. It can shapeshift — it can look like a hyena, an old friend, or a stranger who needs help. It calls to travelers in a kind voice and leads them far from the road, into the empty sand, where it eats them. Later stories say the ghoul also lives in cemeteries and eats the dead. Travelers learned to stay on the road and not to follow a friendly voice in the dark."}}, {"t": "mc", "id": "sm4", "q": "How does the ghoul catch travelers?", "o": ["It looks like a friend or a stranger and leads them away.", "It flies down from the sky.", "It hides in their house.", "It sells them bad food."], "hint": "Read the fourth sentence."}, {"t": "nums", "id": "sf4", "n": 16, "q": "Which fear does The Ghoul symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [3, 16, 10, 8], "qA": "Which fear does The Ghoul symbolize? Choose one or more."}, {"t": "write", "id": "sw4", "q": "Why? One sentence.", "frame": "The Ghoul symbolizes ______ because ______.", "min": 5, "rows": 2}]}]}, {"id": "world2", "sideHideA": true, "emoji": "🌏", "title": {"A": "World monsters 2", "B": "Monsters from around the world · 2"}, "art": "m_gumiho", "side": "fears", "dir": "Read every story on this screen. Answer the questions under each story.", "chunks": [{"title": "Jiangshi — <em>the hopping corpse</em> · China", "pic": "m_jiangshi", "items": [{"t": "p", "text": {"A": "A jiangshi is a dead body that cannot rest. Many stories say it is a person who died far from home and did not have the right funeral. Its body is stiff, so it cannot walk. It hops, with its arms straight out in front. It wears the clothes of an old Qing dynasty official. A jiangshi cannot see, but it can feel your breath. If you meet one, hold your breath and do not move! A Taoist priest can stop a jiangshi with a yellow paper charm on its forehead.", "B": "A jiangshi is a dead body that cannot rest. Many stories say it is a person who died far from home and did not have the right funeral. Its body is stiff, so it cannot walk. It hops, with its arms straight out in front. It wears the clothes of an old Qing dynasty official. A jiangshi cannot see, but it can feel your breath. If you meet one, hold your breath and do not move! A Taoist priest can stop a jiangshi with a yellow paper charm on its forehead."}}, {"t": "mc", "id": "sm5", "q": "How can you hide from a jiangshi?", "o": ["Hold your breath and do not move.", "Run into the river.", "Sing a song.", "Give it candy."], "hint": "What can it feel?"}, {"t": "nums", "id": "sf5", "n": 16, "q": "Which fear does Jiangshi symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [12, 5, 14, 9], "qA": "Which fear does Jiangshi symbolize? Choose one or more."}, {"t": "write", "id": "sw5", "q": "Why? One sentence.", "frame": "Jiangshi symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Gumiho — <em>the nine-tailed fox</em> · Korea", "pic": "m_gumiho", "items": [{"t": "p", "text": {"A": "In Korea, a fox that lives for a thousand years grows nine tails and becomes a gumiho. A gumiho can shapeshift into a beautiful young woman. She is sweet and smart, and men fall in love with her. But she is not human. In many stories, the gumiho wants to become a real woman, and to do that she must eat the livers or hearts of people. In some newer stories and TV dramas, the gumiho is lonely and kind, and she only wants to be human and to be loved.", "B": "In Korea, a fox that lives for a thousand years grows nine tails and becomes a gumiho. A gumiho can shapeshift into a beautiful young woman. She is sweet and smart, and men fall in love with her. But she is not human. In many stories, the gumiho wants to become a real woman, and to do that she must eat the livers or hearts of people. In some newer stories and TV dramas, the gumiho is lonely and kind, and she only wants to be human and to be loved."}}, {"t": "mc", "id": "sm6", "q": "What does the gumiho want in many stories?", "o": ["To become a real human", "To find her children", "To go back to the forest", "To become a bird"], "hint": "Look for 'wants to become'."}, {"t": "nums", "id": "sf6", "n": 16, "q": "Which fear does Gumiho symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [3, 4, 15, 6], "qA": "Which fear does Gumiho symbolize? Choose one or more."}, {"t": "write", "id": "sw6", "q": "Why? One sentence.", "frame": "Gumiho symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Ma Da — <em>the water ghost</em> · Vietnam", "pic": "m_mada", "items": [{"t": "p", "text": {"A": "In Vietnam, when a person drowns, people say their spirit can become a ma da — a water ghost. The ma da is trapped under the water. It is cold and lonely, and it wants to be free. There is only one way out: it must pull another person under the water to take its place. So the ma da waits in rivers and ponds. When a child swims alone, it grabs the child's foot. That is why grandparents say: never swim alone, and never swim at noon or at night.", "B": "In Vietnam, when a person drowns, people say their spirit can become a ma da — a water ghost. The ma da is trapped under the water. It is cold and lonely, and it wants to be free. There is only one way out: it must pull another person under the water to take its place. So the ma da waits in rivers and ponds. When a child swims alone, it grabs the child's foot. That is why grandparents say: never swim alone, and never swim at noon or at night."}}, {"t": "mc", "id": "sm7", "q": "How can a ma da become free?", "o": ["It must pull another person under the water.", "It must find its family.", "It must eat rice.", "It must wait for one hundred years."], "hint": "Look for 'only one way out'."}, {"t": "nums", "id": "sf7", "n": 16, "q": "Which fear does Ma Da symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [10, 5, 2, 13], "qA": "Which fear does Ma Da symbolize? Choose one or more."}, {"t": "write", "id": "sw7", "q": "Why? One sentence.", "frame": "Ma Da symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Mae Nak — <em>the wife who waited</em> · Thailand", "pic": "m_maenak", "items": [{"t": "p", "text": {"A": "Nak lived with her husband, Mak, near Bangkok. She was going to have a baby. Then Mak had to go to war. While he was away, Nak and the baby both died. When Mak came home, Nak was waiting for him at the door with the baby, smiling. Mak was happy. Neighbors tried to tell him, but everyone who spoke was punished. One day, Nak dropped a lime from the kitchen. Her arm grew very long and reached down under the house to pick it up. Then Mak knew — his wife was a ghost. Her love was stronger than death.", "B": "Nak lived with her husband, Mak, near Bangkok. She was going to have a baby. Then Mak had to go to war. While he was away, Nak and the baby both died. When Mak came home, Nak was waiting for him at the door with the baby, smiling. Mak was happy. Neighbors tried to tell him, but everyone who spoke was punished. One day, Nak dropped a lime from the kitchen. Her arm grew very long and reached down under the house to pick it up. Then Mak knew — his wife was a ghost. Her love was stronger than death."}}, {"t": "mc", "id": "sm8", "q": "How did Mak learn the truth?", "o": ["He saw her arm grow very long.", "The neighbors told him and he believed them.", "He found her grave.", "The baby told him."], "hint": "Read about the lime."}, {"t": "nums", "id": "sf8", "n": 16, "q": "Which fear does Mae Nak symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [5, 8, 6, 12], "qA": "Which fear does Mae Nak symbolize? Choose one or more."}, {"t": "write", "id": "sw8", "q": "Why? One sentence.", "frame": "Mae Nak symbolizes ______ because ______.", "min": 5, "rows": 2}]}]}, {"id": "world3", "sideHideA": true, "emoji": "🌍", "title": {"A": "World monsters 3", "B": "Monsters from around the world · 3"}, "art": "m_babayaga", "side": "fears", "dir": "Read every story on this screen. Answer the questions under each story.", "chunks": [{"title": "Baba Yaga — <em>the witch in the forest</em> · Russia and Eastern Europe", "pic": "m_babayaga", "items": [{"t": "p", "text": {"A": "Deep in the forest lives Baba Yaga, an old witch with iron teeth. Her house stands on giant chicken legs and turns around and around. The fence around it is made of bones. She flies through the sky in a big bowl. Children know that Baba Yaga eats people. But she is not only bad. In the story of Vasilisa, a girl goes to Baba Yaga's house to ask for fire. She is brave, she works hard, and she is polite — and Baba Yaga helps her. If you are rude or lazy, she will eat you. If you are brave and kind, she may help you.", "B": "Deep in the forest lives Baba Yaga, an old witch with iron teeth. Her house stands on giant chicken legs and turns around and around. The fence around it is made of bones. She flies through the sky in a big bowl. Children know that Baba Yaga eats people. But she is not only bad. In the story of Vasilisa, a girl goes to Baba Yaga's house to ask for fire. She is brave, she works hard, and she is polite — and Baba Yaga helps her. If you are rude or lazy, she will eat you. If you are brave and kind, she may help you."}}, {"t": "mc", "id": "sm9", "q": "Who does Baba Yaga help?", "o": ["People who are brave and polite", "Rude children", "Lazy children", "Nobody"], "hint": "Read about Vasilisa."}, {"t": "nums", "id": "sf9", "n": 16, "q": "Which fear does Baba Yaga symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [11, 15, 2, 9], "qA": "Which fear does Baba Yaga symbolize? Choose one or more."}, {"t": "write", "id": "sw9", "q": "Why? One sentence.", "frame": "Baba Yaga symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Churel and Kichkandi — <em>the woman in white</em> · India, Pakistan, and Nepal", "pic": "m_churel", "items": [{"t": "p", "text": {"A": "In India and Pakistan, people tell stories about the churel. She was a woman who died unhappily — maybe during childbirth, or because her husband's family treated her badly. Now she comes back for revenge. At night she looks like a beautiful woman, and she calls young men to follow her. But her feet point backward. In Nepal, people tell a similar story about the kichkandi, who waits by the road at night. In both stories, the sign is the same: look at the feet.", "B": "In India and Pakistan, people tell stories about the churel. She was a woman who died unhappily — maybe during childbirth, or because her husband's family treated her badly. Now she comes back for revenge. At night she looks like a beautiful woman, and she calls young men to follow her. But her feet point backward. In Nepal, people tell a similar story about the kichkandi, who waits by the road at night. In both stories, the sign is the same: look at the feet."}}, {"t": "mc", "id": "sm10", "q": "How can you know a churel?", "o": ["Her feet point backward.", "She has nine tails.", "She hops.", "She wears a yellow paper."], "hint": "Read the last sentence."}, {"t": "nums", "id": "sf10", "n": 16, "q": "Which fear does Churel and Kichkandi symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [7, 15, 4, 1], "qA": "Which fear does Churel and Kichkandi symbolize? Choose one or more."}, {"t": "write", "id": "sw10", "q": "Why? One sentence.", "frame": "Churel and Kichkandi symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Dhegdheer — <em>the woman far from town</em> · Somalia", "pic": "m_dhegdheer", "items": [{"t": "p", "text": {"A": "Somali grandmothers tell stories about Dhegdheer — the name means \"long ear.\" She was a powerful woman who lived far away from other people. One of her ears was very long, and she could hear people talking from far, far away. She ate people who came near her house. Dhegdheer had a daughter who was not like her. The daughter was afraid of her mother and ran away to a town. Children are told to be quiet at night — because Dhegdheer can hear everything.", "B": "Somali grandmothers tell stories about Dhegdheer — the name means \"long ear.\" She was a powerful woman who lived far away from other people. One of her ears was very long, and she could hear people talking from far, far away. She ate people who came near her house. Dhegdheer had a daughter who was not like her. The daughter was afraid of her mother and ran away to a town. Children are told to be quiet at night — because Dhegdheer can hear everything."}}, {"t": "mc", "id": "sm11", "q": "What is special about Dhegdheer?", "o": ["She can hear from very far away.", "She can fly.", "She lives in the water.", "She is a fox."], "hint": "What does her name mean?"}, {"t": "nums", "id": "sf11", "n": 16, "q": "Which fear does Dhegdheer symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [2, 15, 16, 10], "qA": "Which fear does Dhegdheer symbolize? Choose one or more."}, {"t": "write", "id": "sw11", "q": "Why? One sentence.", "frame": "Dhegdheer symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Loup-garou — <em>the wolf inside</em> · France, Quebec, Louisiana, and Haiti", "pic": "m_loupgarou", "items": [{"t": "p", "text": {"A": "The loup-garou is a person who turns into a wolf — a werewolf. In old French and Quebec stories, a person who does not go to church for seven years becomes a loup-garou and runs through the forest at night. In Louisiana it is called the rougarou. In Haiti, a lougawou is a person who takes off their skin at night, changes into an animal or a ball of fire, and goes out to hurt people. In the morning, the loup-garou is a normal person again, and nobody knows.", "B": "The loup-garou is a person who turns into a wolf — a werewolf. In old French and Quebec stories, a person who does not go to church for seven years becomes a loup-garou and runs through the forest at night. In Louisiana it is called the rougarou. In Haiti, a lougawou is a person who takes off their skin at night, changes into an animal or a ball of fire, and goes out to hurt people. In the morning, the loup-garou is a normal person again, and nobody knows."}}, {"t": "mc", "id": "sm12", "q": "In the morning, what happens to the loup-garou?", "o": ["It becomes a normal person again.", "It dies.", "It flies away.", "It goes back to the river."], "hint": "Read the last sentence."}, {"t": "nums", "id": "sf12", "n": 16, "q": "Which fear does Loup-garou symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [2, 12, 3, 14], "qA": "Which fear does Loup-garou symbolize? Choose one or more."}, {"t": "write", "id": "sw12", "q": "Why? One sentence.", "frame": "Loup-garou symbolizes ______ because ______.", "min": 5, "rows": 2}]}]}, {"id": "meaning", "emoji": "🔍", "title": {"A": "What do they mean?", "B": "What do these monsters mean?"}, "art": "m_world", "side": "fears", "dir": "Compare the stories. Use the fears list beside you and give evidence from the stories.", "chunks": [{"title": "Water stories", "pic": "m_mada", "items": [{"t": "write", "id": "an_water", "q": "La Llorona and the Ma Da both live in the water. Why do so many parents tell water stories to children?", "frame": "Parents tell water stories because ______. For example, ______.", "min": 15, "rows": 3}]}, {"title": "Women monsters", "pic": "m_babayaga", "items": [{"t": "write", "id": "an_women", "q": "Baba Yaga, Dhegdheer, the Churel, and the Gumiho are all women. Look at fear 15. Why do you think so many monsters are women?", "min": 20, "rows": 4}]}, {"title": "Monsters that look normal", "pic": "m_aswang", "items": [{"t": "write", "id": "an_look", "q": "The Aswang, the Ghoul, and the Gumiho all look like normal people. What are these stories telling us to be careful about?", "min": 15, "rows": 3}]}, {"title": "Your choice", "pic": "m_campfire", "items": [{"t": "write", "id": "an_mine", "q": "Which story is the scariest for you? Why? Is there a lesson in it?", "frame": "The scariest story for me is ______ because ______. The lesson is ______.", "min": 15, "rows": 3}, {"t": "reveal", "id": "others7", "label": "When you finish: see what other people say", "html": "<p><b>La Llorona</b> — 5 and 8: guilt that never ends; also a warning to stay away from the river. <b>Ma Da</b> — a warning about dangerous water. <b>Aswang</b> — 3: your neighbor may not be who you think. <b>Aisha Qandisha</b> — 4 and 15. <b>Ghoul</b> — 3: the stranger in the desert. <b>Jiangshi</b> — 12, and the fear of dying far from home without the right funeral. <b>Gumiho</b> — 3, 4, and 15. <b>Mae Nak</b> — 5 and 8: love that cannot let go. <b>Baba Yaga</b> — 11 and 15, but she also helps people who are brave and polite. <b>Churel</b> — 7 and 15: a woman who was treated badly, and her revenge. <b>Dhegdheer</b> — 2 and 15. <b>Loup-garou</b> — 2: the animal inside a person.</p>"}]}]}, {"id": "grammar", "emoji": "✏️", "title": {"A": "Grammar", "B": "Grammar for talking about symbols"}, "art": "m_grammar", "dir": {"A": "Read the rule box first. Then choose the answer. A wrong answer stays marked — fix it and the ✓ appears beside it.", "B": "Read the rule box first. Then type the answer. A wrong answer stays marked — fix it and the ✓ appears beside it."}, "chunks": [{"title": "A. symbolize / symbolizes", "pic": "m_ghost", "items": [{"t": "html", "html": "<div class=\"rulebox\">One monster → <b>symbolizes</b>. Man
