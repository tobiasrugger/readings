<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monsters as Symbols — Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pine:#2e2b4f;--pine-dk:#1c1a33;--pine-lt:#ecebf4;--ink:#1b1b1b;--rule:#c9ccc8;--marigold:#d98a1f}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',-apple-system,Segoe UI,Roboto,sans-serif;background:#f2f4f2;color:var(--ink);font-size:16px}
#bar{position:sticky;top:0;z-index:50;background:var(--pine);color:#fff;padding:9px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#bar .brand{font-weight:800;margin-right:8px}
#bar button,#bar select{font-family:inherit;font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.10);color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer}
#bar button:hover,#bar select:hover{background:rgba(255,255,255,.22)}
#bar select option{color:#111;background:#fff}
#bar .spacer{flex:1}
#bar .stat{font-size:13px;font-weight:700;opacity:.92}
.wrap{max-width:1180px;margin:18px auto 70px;padding:0 16px}
h1{font-size:1.8rem;color:var(--pine);margin:10px 0 2px}
.sub{color:#5a6660;font-weight:700;margin:0 0 16px;font-size:.95rem}
table.roster{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.08)}
table.roster th,table.roster td{border-bottom:1px solid var(--rule);padding:9px 11px;text-align:left;font-size:.95rem}
table.roster th{background:var(--pine);color:#fff;font-weight:800;font-size:.85rem;cursor:pointer;white-space:nowrap}
table.roster tr:hover td{background:#f7faf8}
table.roster td.nm{font-weight:800;color:var(--pine-dk);cursor:pointer}
table.roster td.nm:hover{text-decoration:underline}
.prog{background:#e2e7e4;border-radius:4px;height:13px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--pine)}
.pill{font-size:.72rem;font-weight:800;border-radius:20px;padding:2px 9px;color:#fff;background:#9aa49f}
.pill.in{background:#2f6f4f}
.pill.easy{background:var(--marigold);color:#1b1b1b}
.sc{font-weight:800}
.sc.low{color:#b3261e}.sc.mid{color:#8a6d1f}.sc.hi{color:#2f6f4f}
#panel{position:fixed;inset:0;background:rgba(20,53,40,.55);display:none;z-index:80;padding:20px;overflow:auto}
#panel .inner{background:#fff;max-width:900px;margin:0 auto;border-radius:12px;padding:24px 28px 34px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#panel h2{margin:0 0 2px;color:var(--pine)}
#panel .meta{color:#5a6660;font-weight:700;margin:0 0 14px;font-size:.92rem}
#panel .close{float:right;font-family:inherit;font-weight:800;border:2px solid var(--pine);background:#fff;color:var(--pine);border-radius:8px;padding:6px 12px;cursor:pointer}
.ans{border-left:5px solid var(--pine-lt);padding:6px 0 6px 12px;margin:10px 0}
.ans .q{font-weight:800;font-size:.9rem;color:var(--pine-dk)}
.ans .a{white-space:pre-wrap;margin-top:3px}
.ans .a.empty{color:#a3ada8;font-style:italic}
.ans.wrongk{border-left-color:#b3261e}
.ans.rightk{border-left-color:#2f6f4f}
h3.sec{margin:22px 0 6px;font-size:1.05rem;color:var(--pine-dk);border-bottom:2px solid var(--pine-lt);padding-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate{max-width:380px;margin:80px auto;background:#fff;padding:26px 28px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.gate h2{margin:0 0 12px;color:var(--pine)}
.gate input{width:100%;font-family:inherit;font-size:1rem;padding:10px;border:2px solid var(--rule);border-radius:8px}
.gate button{width:100%;margin-top:14px;font-family:inherit;font-weight:800;font-size:1rem;background:var(--pine);color:#fff;border:none;border-radius:9px;padding:11px;cursor:pointer}
.gate .err{color:#b3261e;font-weight:700;min-height:1.2em;margin-top:8px;font-size:.9rem}
#classview{display:none;background:#fff;padding:20px 24px;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08)}
.chartrow{margin:8px 0}
.chartrow .cl{font-weight:800;font-size:.9rem;display:flex;justify-content:space-between}
.barout{background:#e2e7e4;border-radius:5px;height:18px;overflow:hidden}
.barin{background:var(--pine);height:100%}
.barin.alt{background:var(--marigold)}
.quotes{columns:2;column-gap:20px}
.quotes p{break-inside:avoid;background:#f7faf8;border-left:4px solid var(--marigold);padding:8px 11px;margin:0 0 10px;font-size:.92rem}
.quotes p b{display:block;font-size:.78rem;color:#5a6660}
@media print{#bar,.close,button{display:none!important}body{background:#fff}#panel{position:static;background:#fff;display:block}}
@media (max-width:760px){.grid2,.quotes{grid-template-columns:1fr;columns:1}}
</style>
</head>
<body>

<div id="gateWrap" class="gate">
  <h2>Teacher dashboard</h2>
  <p style="margin:0 0 12px;color:#5a6660;font-weight:700;font-size:.92rem">Monsters as Symbols</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="off">
  <button id="pwGo" type="button">Open</button>
  <div class="err" id="pwErr"></div>
</div>

<div id="app" style="display:none">
<div id="bar">
  <span class="brand">Monsters unit — dashboard</span>
  <select id="period"><option value="">All periods</option></select>
  <select id="sortBy">
    <option value="name">Sort: name</option>
    <option value="score">Sort: score</option>
    <option value="progress">Sort: progress</option>
    <option value="updated">Sort: last saved</option>
  </select>
  <button id="refresh" type="button">Refresh</button>
  <button id="toggleClass" type="button">Class survey</button>
  <button id="csv" type="button">Download CSV</button>
  <span class="spacer"></span>
  <span class="stat" id="stat"></span>
</div>

<div class="wrap">
  <h1>Monsters as Symbols</h1>
  <p class="sub">Mr. Toby · Galileo Academy · 71 auto-scored points · written answers below each student</p>
  <div id="rosterWrap"></div>
  <div id="classview"></div>
</div>
</div>

<div id="panel"><div class="inner" id="panelInner"></div></div>

<script>
var SUPA_URL="https://lhmwtfyceilgndpygivj.supabase.co";
var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU";
var TABLE="unit_responses", GUIDE_KEY="monsters_v1", PW="galileo2026";
var ROWS=[];

function headers(){return{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"};}

/* ---------- answer key ---------- */
var KEY={
 v1:"haunts",v2:"shroud",v3:"countless",v4:"witch",v5:"addict",v6:"horde",v7:"doll",v8:"symbolizes / represents",v9:"trauma",v10:"nameless",
 tfa1:"T",tfa2:"F",tfa3:"T",tfa4:"T",tfa5:"F",
 sm1:"b",sm2:"b",sm3:"c",sm4:"a",sm5:"c",sm6:"a",sm7:"b",sm8:"b",sm9:"c",sm10:"a",sm11:"b",sm12:"b",
 g1:"symbolizes",g2:"represents",g3:"symbolize",g4:"represent",g5:"symbolizes",g6:"symbolize",
 r1:"who / that",r2:"where",r3:"that",r4:"who / that",r5:"where",r6:"that",r7:"who / that",r8:"where",
 c1a:"go",c1b:"will take",c2a:"swim",c2b:"will pull",c3a:"hears",c3b:"will find",c4a:"are",c4b:"will eat",c5a:"disobeys",c5b:"will come",c6a:"leave",c6b:"will not come in",
 m1:"b",m2:"a",m3:"c",m4:"d",m5:"b",m6:"a",m7:"c",m8:"b",m9:"d",m10:"a",m11:"c",m12:"b"
};
var STORYNAMES=["La Llorona","Aswang","Aisha Qandisha","Ghoul","Jiangshi","Gumiho","Ma Da","Mae Nak","Baba Yaga","Churel","Dhegdheer","Loup-garou"];
var WRITTEN=[
 ["an_water","7 · Why water stories"],["an_women","7 · Why so many monsters are women"],["an_look","7 · Monsters that look normal"],["an_mine","7 · The scariest story for me"],
 ["g_mywarn","Grammar · a warning from my country"],
 ["w_l1","WRITING Level 1"],["w_l2","WRITING Level 2"],["w_l3","WRITING Level 3"],
 ["q_last","Exit · a question I still have"]
];
var MONS=["a ghost","a werewolf","a vampire","a haunted house","a possessed doll","a witch","a zombie horde","Frankenstein"];

/* ---------- load ---------- */
function load(){
  document.getElementById("stat").textContent="Loading…";
  fetch(SUPA_URL+"/rest/v1/"+TABLE+"?select=*&guide_key=eq."+GUIDE_KEY+"&order=student_name.asc",{headers:headers()})
    .then(function(r){return r.json();})
    .then(function(rows){
      ROWS=rows||[];
      var ps={};
      for(var i=0;i<ROWS.length;i++) ps[ROWS[i].period]=1;
      var sel=document.getElementById("period"), cur=sel.value;
      var keys=Object.keys(ps).sort(), h='<option value="">All periods</option>';
      for(var k=0;k<keys.length;k++) h+='<option value="'+keys[k]+'">Period '+keys[k]+"</option>";
      sel.innerHTML=h; sel.value=cur;
      render();
    })
    .catch(function(e){ document.getElementById("stat").textContent="Could not load."; console.warn(e); });
}
function visible(){
  var p=document.getElementById("period").value;
  var r=ROWS.filter(function(x){return !p||String(x.period)===p;});
  var s=document.getElementById("sortBy").value;
  r.sort(function(a,b){
    if(s==="score") return (b.score||0)-(a.score||0);
    if(s==="progress") return (b.answered||0)-(a.answered||0);
    if(s==="updated") return (b.updated_at||"")<(a.updated_at||"")?-1:1;
    return (a.student_name||"").localeCompare(b.student_name||"");
  });
  return r;
}
function when(iso){
  if(!iso) return "";
  var d=new Date(iso), n=new Date();
  var same=d.toDateString()===n.toDateString();
  var h=d.getHours(),m=d.getMinutes(),ap=h>=12?"PM":"AM";h=h%12||12;if(m<10)m="0"+m;
  return (same?"":(d.getMonth()+1)+"/"+d.getDate()+" ")+h+":"+m+" "+ap;
}
function render(){
  var rows=visible(), h="";
  h+='<table class="roster"><thead><tr><th>Student</th><th>Per</th><th>Progress</th><th>Score</th><th>Writing</th><th>Level</th><th>Status</th><th>Last saved</th></tr></thead><tbody>';
  var done=0,sum=0,cnt=0;
  for(var i=0;i<rows.length;i++){
    var r=rows[i], p=r.payload||{}, meta=p.meta||{};
    var pct=meta.total?Math.round(100*(meta.answered||0)/meta.total):0;
    var sc=r.score||0, mx=r.max_score||65;
    var spct=mx?Math.round(100*sc/mx):0;
    var cls=spct>=80?"hi":(spct>=55?"mid":"low");
    if(r.submitted){done++;}
    sum+=spct;cnt++;
    h+='<tr><td class="nm" data-i="'+i+'">'+(r.student_name||r.email)+"</td>"+
       "<td>"+(r.period||"")+"</td>"+
       '<td><span class="prog"><i style="width:'+pct+'%"></i></span> '+(meta.answered||0)+"/"+(meta.total||0)+"</td>"+
       '<td class="sc '+cls+'">'+sc+"/"+mx+"</td>"+
       "<td>"+(meta.words||0)+" w</td>"+
       '<td><span class="pill'+(meta.level==="easy"?" easy":"")+'">'+(meta.level==="easy"?"Easier":"Full")+"</span></td>"+
       '<td>'+(r.submitted?'<span class="pill in">Turned in</span>':'<span class="pill">Working</span>')+"</td>"+
       "<td>"+when(r.updated_at)+"</td></tr>";
  }
  h+="</tbody></table>";
  if(!rows.length) h='<p style="font-weight:700">No students yet for this filter.</p>';
  document.getElementById("rosterWrap").innerHTML=h;
  document.getElementById("stat").textContent=rows.length+" students · "+done+" turned in · class average "+(cnt?Math.round(sum/cnt):0)+"%";
  var nms=document.querySelectorAll("td.nm");
  for(var n=0;n<nms.length;n++) nms[n].addEventListener("click",function(){ openStudent(visible()[+this.getAttribute("data-i")]); });
}

/* ---------- one student ---------- */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function openStudent(r){
  var p=r.payload||{}, f=p.fields||{}, rad=p.radios||{}, chk=p.checks||{}, of=p.ofrenda||{}, meta=p.meta||{};
  var h='<button class="close" type="button" onclick="document.getElementById(\'panel\').style.display=\'none\'">Close</button>';
  h+="<h2>"+esc(r.student_name)+"</h2>";
  h+='<p class="meta">'+esc(r.email)+" · period "+r.period+" · "+(r.score||0)+"/"+(r.max_score||65)+
     " auto-scored · "+(meta.words||0)+" words written · "+(r.submitted?"turned in":"still working")+" · last saved "+when(r.updated_at)+"</p>";

  h+='<h3 class="sec">Survey</h3><div class="grid2">';
  h+=ansBox("Country",f.s_country)+ansBox("Told scary stories?",rad.s_told)+ansBox("Why adults tell them",rad.s_why)+ansBox("Real?",rad.s_believe)+ansBox("A monster from my country",f.s_monster);
  var who=[]; for(var ck in chk){ if(ck.indexOf("s_who_")===0) who.push(chk[ck]); }
  h+=ansBox("Who told them",who.join(", "))+"</div>";
  h+='<h3 class="sec">Auto-scored items</h3><p style="font-size:.9rem;font-weight:700;color:#5a6660">Red = wrong, green = right, grey = blank.</p>';
  h+='<div class="grid2">';
  for(var k in KEY){
    var given = (f[k] !== undefined) ? f[k] : (rad[k] !== undefined ? rad[k] : "");
    var right = norm(given) === norm(KEY[k]);
    var cls = !String(given).trim() ? "" : (right ? "rightk" : "wrongk");
    h+='<div class="ans '+cls+'"><div class="q">'+k+" — key: "+esc(KEY[k])+'</div><div class="a'+(String(given).trim()?"":" empty")+'">'+(esc(String(given))||"(blank)")+"</div></div>";
  }
  h+="</div>";

  h+='<h3 class="sec">Part 5 · Eight monsters</h3><table class="roster"><thead><tr><th>Monster</th><th>Fears</th><th>Symbolizes</th></tr></thead><tbody>';
  for(var mi=0;mi<MONS.length;mi++) h+="<tr><td><b>"+MONS[mi]+"</b></td><td>"+esc(f["mf"+(mi+1)]||"")+"</td><td>"+esc(f["ms"+(mi+1)]||"")+"</td></tr>";
  h+="</tbody></table>";
  var read=[]; for(var si=1;si<=12;si++){ if(rad["sm"+si]) read.push(STORYNAMES[si-1]); }
  h+='<p style="font-weight:700;margin-top:10px">Stories answered ('+read.length+'): '+(read.length?esc(read.join(", ")):"none yet")+"</p>";
  h+='<h3 class="sec">Part 7 · What the monsters mean</h3><table class="roster"><thead><tr><th>Monster</th><th>Fears</th><th>Why</th></tr></thead><tbody>';
  for(var ai=1;ai<=4;ai++) h+="<tr><td>"+esc(f["an_m"+ai]||"")+"</td><td>"+esc(f["an_f"+ai]||"")+"</td><td>"+esc(f["an_w"+ai]||"")+"</td></tr>";
  h+="</tbody></table>";
  h+='<h3 class="sec">Written answers</h3>';
  for(var w=0;w<WRITTEN.length;w++){
    var val=f[WRITTEN[w][0]]||"";
    h+='<div class="ans"><div class="q">'+WRITTEN[w][1]+'</div><div class="a'+(val.trim()?"":" empty")+'">'+(esc(val)||"(blank)")+"</div></div>";
  }
  document.getElementById("panelInner").innerHTML=h;
  document.getElementById("panel").style.display="block";
  document.getElementById("panel").scrollTop=0;
}
function ansBox(q,a){
  a=a||"";
  return '<div class="ans"><div class="q">'+q+'</div><div class="a'+(String(a).trim()?"":" empty")+'">'+(esc(String(a))||"(blank)")+"</div></div>";
}
function norm(s){ return String(s==null?"":s).toLowerCase().trim().replace(/[.,!?;:"']/g,"").replace(/\s+/g," "); }
document.getElementById("panel").addEventListener("click",function(e){ if(e.target===this) this.style.display="none"; });

/* ---------- class survey view ---------- */
function bar(label,n,total,alt){
  var pct=total?Math.round(100*n/total):0;
  return '<div class="chartrow"><div class="cl"><span>'+esc(label)+"</span><span>"+n+" ("+pct+'%)</span></div><div class="barout"><div class="barin'+(alt?" alt":"")+'" style="width:'+pct+'%"></div></div></div>';
}
function renderClass(){
  var rows=visible(), n=rows.length, v=document.getElementById("classview");
  if(!n){ v.innerHTML="<p style='font-weight:700'>No data yet.</p>"; return; }
  function cr(name,val){var c=0;for(var i=0;i<rows.length;i++){var p=rows[i].payload;if(p&&p.radios&&p.radios[name]===val)c++;}return c;}
  function cc(id){var c=0;for(var i=0;i<rows.length;i++){var p=rows[i].payload;if(p&&p.checks&&p.checks[id])c++;}return c;}
  var countries={};
  for(var i=0;i<rows.length;i++){
    var p=rows[i].payload, cy=p&&p.fields&&p.fields.s_country?p.fields.s_country.trim():"";
    if(cy){cy=cy.charAt(0).toUpperCase()+cy.slice(1).toLowerCase();countries[cy]=(countries[cy]||0)+1;}
  }
  var cl=Object.keys(countries).sort(function(a,b){return countries[b]-countries[a];});
  var h="<h2 style='margin-top:0;color:#2e2b4f'>Our class — "+n+" students</h2>";
  h+="<h3 class='sec'>Countries in the room</h3>";
  for(var c=0;c<cl.length;c++) h+=bar(cl[c],countries[cl[c]],n,true);
  h+="<h3 class='sec'>Told scary stories when little?</h3>"+bar("Yes, many",cr("s_told","Many"),n)+bar("Yes, a few",cr("s_told","A few"),n)+bar("No",cr("s_told","No"),n);
  h+="<h3 class='sec'>Who told them</h3>";
  var who=[["A grandparent","s_who_gp"],["Mother or father","s_who_par"],["Brother, sister, cousin","s_who_sib"],["Friends","s_who_fr"],["TV, movies, internet","s_who_tv"]];
  for(var w=0;w<who.length;w++) h+=bar(who[w][0],cc(who[w][1]),n,true);
  h+="<h3 class='sec'>Why adults tell them</h3>"+bar("Keep them safe",cr("s_why","Safe"),n)+bar("Teach a lesson",cr("s_why","Lesson"),n)+bar("For fun",cr("s_why","Fun"),n)+bar("Not sure",cr("s_why","Not sure"),n);
  h+="<h3 class='sec'>Real or only stories?</h3>"+bar("Some are real",cr("s_believe","Yes"),n,true)+bar("Only stories",cr("s_believe","No"),n,true)+bar("Not sure",cr("s_believe","Not sure"),n,true);
  h+="<h3 class='sec'>Which stories students answered</h3>";
  var names=["La Llorona","Aswang","Aisha Qandisha","Ghoul","Jiangshi","Gumiho","Ma Da","Mae Nak","Baba Yaga","Churel","Dhegdheer","Loup-garou"];
  for(var si=0;si<12;si++){ var k=0; for(var ri=0;ri<rows.length;ri++){ var pr=rows[ri].payload; if(pr&&pr.radios&&pr.radios["sm"+(si+1)]) k++; } h+=bar(names[si],k,n); }
  h+="<h3 class='sec'>Monsters from our families</h3><div class='quotes'>";
  for(var q=0;q<rows.length;q++){ var pp=rows[q].payload, nm=pp&&pp.fields?pp.fields.s_monster:""; if(nm&&nm.trim()) h+="<p><b>"+esc(rows[q].student_name)+"</b>"+esc(nm)+(pp.fields.s_country?" ("+esc(pp.fields.s_country)+")":"")+"</p>"; }
  h+="</div><h3 class='sec'>Warnings from home (If you …, … will …)</h3><div class='quotes'>";
  for(var z=0;z<rows.length;z++){ var p2=rows[z].payload, t=p2&&p2.fields?p2.fields.g_mywarn:""; if(t&&t.trim()) h+="<p><b>"+esc(rows[z].student_name)+"</b>"+esc(t)+"</p>"; }
  h+="</div>";
  v.innerHTML=h;
}
document.getElementById("toggleClass").addEventListener("click",function(){
  var v=document.getElementById("classview"), r=document.getElementById("rosterWrap");
  if(v.style.display==="block"){ v.style.display="none"; r.style.display="block"; this.textContent="Class survey"; }
  else { renderClass(); v.style.display="block"; r.style.display="none"; this.textContent="Back to roster"; }
});

/* ---------- CSV ---------- */
document.getElementById("csv").addEventListener("click",function(){
  var rows=visible();
  var cols=["student_name","email","period","score","max_score","answered","total","words","level","submitted","updated_at","country","monster","told","why","believe"];
  var keyIds=Object.keys(KEY);
  var head=cols.concat(keyIds).concat(WRITTEN.map(function(w){return w[0];}));
  var out=[head.join(",")];
  for(var i=0;i<rows.length;i++){
    var r=rows[i], p=r.payload||{}, f=p.fields||{}, rad=p.radios||{}, m=p.meta||{};
    var line=[r.student_name,r.email,r.period,r.score||0,r.max_score||65,m.answered||0,m.total||0,m.words||0,m.level||"",r.submitted?"yes":"no",r.updated_at||"",
              f.s_country||"",f.s_monster||"",rad.s_told||"",rad.s_why||"",rad.s_believe||""];
    for(var k=0;k<keyIds.length;k++){
      var id=keyIds[k];
      line.push(f[id]!==undefined?f[id]:(rad[id]!==undefined?rad[id]:""));
    }
    for(var w=0;w<WRITTEN.length;w++) line.push(f[WRITTEN[w][0]]||"");
    out.push(line.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; }).join(","));
  }
  var b=new Blob([out.join("\n")],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="monsters_unit_"+(document.getElementById("period").value||"all")+".csv";
  a.click();
});

document.getElementById("refresh").addEventListener("click",load);
document.getElementById("period").addEventListener("change",function(){
  if(document.getElementById("classview").style.display==="block") renderClass(); else render();
});
document.getElementById("sortBy").addEventListener("change",render);

document.getElementById("pwGo").addEventListener("click",function(){
  if(document.getElementById("pw").value===PW){
    document.getElementById("gateWrap").style.display="none";
    document.getElementById("app").style.display="block";
    load();
  } else { document.getElementById("pwErr").textContent="Not the password."; }
});
document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("pwGo").click(); });
