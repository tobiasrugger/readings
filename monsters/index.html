<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monsters as Symbols — Mr. Toby's ELD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1d2b;--line:#23202e;--paper:#f6f1e7;--card:#fff;--acc:#2e2b4f;--acc2:#c9822c;--soft:#ecebf4;--good:#2f7d4f;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:18px;line-height:1.55}
body[data-level="A"]{font-size:19px}
button{font-family:inherit;color:inherit}
#bar{position:sticky;top:0;z-index:50;background:var(--acc);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;box-shadow:0 2px 0 var(--line)}
#bar .brand{font-weight:900;font-size:1.05rem;margin-right:4px}
#bar select{font-family:inherit;font-size:.95rem;font-weight:700;border-radius:10px;border:2px solid #fff;padding:5px 8px;background:#fff;color:var(--ink);max-width:190px}
#bar select option{color:#1f1d2b;background:#fff}
.lvwrap{display:flex;border:2px solid #fff;border-radius:999px;overflow:hidden}
.lvb{border:none;background:transparent;color:#fff;font-weight:800;padding:5px 12px;cursor:pointer;font-size:.92rem}
.lvb.on{background:#fff;color:var(--acc)}
#bar .sp{flex:1}
#who{font-weight:700;font-size:.9rem;opacity:.9}
#saveNote{font-size:.82rem;font-weight:700;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.18)}
#saveNote.bad{background:#fde3e1;color:var(--bad)}
#turnIn{background:#fff;color:var(--acc);border:none;border-radius:10px;font-weight:900;padding:6px 12px;cursor:pointer}
#progwrap{height:7px;background:rgba(0,0,0,.12)}
#prog{height:7px;background:var(--acc2);width:0;transition:width .4s}
#tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 10px 0}
#tabs button{min-width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.18)}
#tabs button.on{background:var(--acc);color:#fff}
#main{max-width:980px;margin:0 auto;padding:14px 14px 80px}
.box{display:flow-root;background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 rgba(0,0,0,.2);padding:16px 18px;margin:0 0 20px;position:relative}
.box h3{margin:0 0 10px;font-size:1.25rem;color:var(--acc);font-weight:900}
.pic{float:right;width:min(40%,270px);margin:2px 0 12px 16px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pic svg,.scene svg,.tart svg,.pickpic svg,.wpic svg{display:block;width:100%;height:auto}
.scene{border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:0 auto 14px;max-width:640px}
.bx{display:flow-root}
.dir{font-weight:800;color:#3d3a52;background:var(--soft);border-left:6px solid var(--acc2);border-radius:0 10px 10px 0;padding:8px 12px;margin:0 0 12px}
.dir .dtr{display:block;font-weight:700;color:#5b4a1f;margin-top:4px;font-size:.95em}
.dir .dtr[dir="rtl"]{text-align:right}
.spk{border:2px solid var(--line);background:#fff;border-radius:10px;font-size:.9rem;padding:1px 6px;cursor:pointer;vertical-align:1px;box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.para{margin:0 0 12px}
.frame{font-weight:700;background:#fff8e6;border:2px dashed #c9a14a;border-radius:10px;padding:8px 12px}
.note{color:#5b5870;font-weight:700;font-size:.92em}
.q{border-top:2px dashed #d6d1c4;padding:12px 0 6px;margin-top:6px;clear:none}
.box .bx > .q:first-child{border-top:none}
.qstem{font-weight:800;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.tf .opt{min-width:110px;justify-content:center}
.opt{display:inline-flex;align-items:center;gap:6px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.18);transition:opacity .3s}
.opt:hover:not([disabled]){background:var(--soft)}
.opt.right{background:#e3f5ea;border-color:var(--good);color:#17402a}
.opt.gone{opacity:.32;text-decoration:line-through;box-shadow:none;cursor:default}
.opt.bad{background:#fdecea;border-color:var(--bad);color:#7a1c16}
.opt.chip.on{background:var(--acc);color:#fff}
.opt.sm{padding:5px 10px;font-size:.95rem}
.mk{color:var(--good)} .mk.x{color:var(--bad)} s.was{color:var(--bad);font-weight:700;font-size:.9em}
.fb{min-height:6px;margin-top:6px}
.fb .good{color:var(--good);font-weight:800}
.quip{display:block;font-weight:700;color:#3a3750}
.quip b{color:var(--qc)}
.hint{display:block;font-weight:700;color:#7a5a12;background:#fff4d6;border-radius:8px;padding:4px 10px;margin-top:4px}
.pickpic{max-width:340px;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 10px;background:#fff}
input.blank{font-family:inherit;font-size:1rem;font-weight:700;border:none;border-bottom:2.5px solid var(--line);width:9em;padding:2px 6px;margin:0 4px;background:#fffdf6}
input.blank:disabled{border-color:var(--good);color:#17402a;background:#e3f5ea}
.chk{border:2px solid var(--line);background:var(--acc);color:#fff;border-radius:10px;font-weight:800;padding:3px 10px;cursor:pointer;margin-left:6px}
input.line{width:100%;font-family:inherit;font-size:1rem;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;font-family:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:10px;line-height:1.5}
.wc{text-align:right;font-weight:800;color:#6b6880;font-size:.85rem;margin:2px 0 0}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.bw{border:2px solid var(--line);background:#fff8e6;border-radius:999px;padding:3px 10px;font-weight:800;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.wcard{border:2px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 rgba(0,0,0,.18);background:#fff;padding:0 0 8px;overflow:hidden}
.wpic{border-bottom:2px solid var(--line);cursor:pointer;background:#fbf6ea}
.wline{margin:8px 10px 4px;font-size:.98rem}
.ww{font-size:1.25rem;text-transform:none}
.wtr{margin:0 10px;font-size:1.05rem}
.recrow{display:flex;align-items:center;gap:8px;margin:8px 10px 0;padding-top:8px;border-top:2px dashed #e2ddd0}
.recb{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:2px 2px 0 rgba(0,0,0,.2)}
.recb .dot{width:20px;height:20px;border-radius:50%;background:#dd3b33}
.recb.live{animation:pulse 1s infinite}
.recb.live .dot{border-radius:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(221,59,51,.5)}50%{box-shadow:0 0 0 10px rgba(221,59,51,0)}}
.recmsg{font-weight:700;font-size:.88rem;color:#3a3750;flex:1}
.recplay{border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:900;cursor:pointer;padding:3px 9px}
.wcard.recok{border-color:var(--good)}
.wcard.recok .recmsg{color:var(--good)}
.gap{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--line)}
.filled{color:var(--good);border-bottom:2.5px solid var(--good)}
.trretry{border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:800;cursor:pointer;padding:1px 8px;font-size:.85rem}
.bankw{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;padding:4px 2px;border-bottom:1px dashed #e2ddd0}
.bankw svg{width:52px;height:auto;border:1.5px solid var(--line);border-radius:6px;display:block}
.bankw b{font-size:1rem}
.bankw .bt{display:block;font-size:.8rem;color:#5b4a1f;font-weight:700}
.eq{text-decoration:underline;text-decoration-thickness:2px}
.eq.none{color:#8c8a99}
.sort .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bucket{border:2px solid var(--line);border-radius:12px;min-height:110px;background:#fdfaf2;cursor:pointer}
.bucket .bh{font-weight:900;text-align:center;padding:6px;border-bottom:2px solid var(--line);background:var(--soft);border-radius:10px 10px 0 0}
.bucket.b1 .bh{background:#fff1d2} .bucket.b2 .bh{background:#e9e3f7}
.bin{display:flex;flex-direction:column;gap:6px;padding:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.scard{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer;text-align:left;box-shadow:2px 2px 0 rgba(0,0,0,.18)}
.scard.sel{outline:4px solid var(--acc2)}
.scard.placed{background:#e3f5ea;border-color:var(--good);cursor:default;box-shadow:none}
.scard.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.mrow{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:8px;align-items:start;padding:10px 0;border-top:2px dashed #d6d1c4}
.mrow:first-child{border-top:none}
.mrow .ml{font-weight:800}
.mrow .mopts{display:flex;flex-wrap:wrap;gap:6px}
.mrow .fb{grid-column:1/-1}
.rv{border:2px solid var(--line);background:var(--soft);font-weight:800;border-radius:12px;padding:6px 12px;cursor:pointer;margin-top:8px}
.rvbox{border-left:6px solid var(--acc);background:#faf8ff;padding:8px 14px;margin-top:8px;border-radius:0 10px 10px 0}
.scrhead{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.scrhead h2{margin:0;font-size:1.6rem;font-weight:900}
.snum{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.navb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.2);font-size:1rem}
.navb.next{background:var(--acc);color:#fff}
.fcount{font-weight:800;color:#5b5870}
.homebox h1{margin:0 0 4px;font-size:2rem;font-weight:900;color:var(--acc)}
.homebox .sub{font-weight:700;color:#4a475e;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.tile{position:relative;border:2px solid var(--line);border-radius:16px;background:#fff;padding:0 0 10px;cursor:pointer;text-align:left;box-shadow:4px 4px 0 rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-2px)}
.tile.full{border-color:var(--good)}
.tart{display:block;border-bottom:2px solid var(--line);background:#fbf6ea}
.tname{display:block;font-weight:900;font-size:1.05rem;padding:8px 10px 4px}
.tprog{display:block;height:8px;margin:2px 10px;background:#ece7db;border-radius:6px;overflow:hidden}
.tprog span{display:block;height:8px;background:var(--good)}
.tcount{font-size:.82rem;font-weight:800;color:#6b6880;padding:2px 10px 0}
.tnum{position:absolute;top:8px;left:8px;background:var(--acc);color:#fff;border:2px solid var(--line);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;z-index:2}
.tck{position:absolute;top:8px;right:8px;background:var(--good);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;z-index:2;border:2px solid var(--line)}
.leo{position:absolute;right:8px;bottom:6px;width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;opacity:.85}
.leo svg{width:100%;height:100%}
.donebox{text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:14px;transition:transform .3s;z-index:300;max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.spark{position:fixed;width:10px;height:10px;border-radius:50%;z-index:400;animation:spark 1.3s ease-out forwards;pointer-events:none}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
#gate{position:fixed;inset:0;z-index:500;background:rgba(25,22,40,.94);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
#gate .card{background:#fff;border:3px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:22px 24px;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
#gate .gpic{margin:-4px 0 8px}
#gate h2{margin:0 0 4px;font-size:1.5rem;color:var(--acc)}
#gate label{display:block;font-weight:900;font-size:.88rem;margin:10px 0 3px}
#gate input,#gate select{width:100%;font-family:inherit;font-size:1rem;padding:9px 11px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#gate select option{color:#1f1d2b;background:#fff}
#gGo{margin-top:14px;width:100%;border:2px solid var(--line);background:var(--acc);color:#fff;font-weight:900;font-size:1.1rem;padding:10px;border-radius:12px;cursor:pointer}
#gErr{color:var(--bad);font-weight:800;min-height:1.2em;margin-top:6px}
.hasside{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,34%);grid-template-areas:"h h" "b s";gap:0 16px}
.hasside > h3{grid-area:h}
.hasside > .bx{grid-area:b}
.hasside > .side{grid-area:s;position:sticky;top:110px;align-self:start;max-height:calc(100vh - 130px);overflow:auto;border:2px solid var(--line);border-radius:12px;background:#fbf9ff;padding:10px 12px;font-size:.88rem}

.withside{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.sidep{position:sticky;top:104px;max-height:calc(100vh - 120px);overflow:auto;background:#fff;border:2px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 rgba(0,0,0,.2);padding:10px 12px;font-size:.86rem}
.sidep h4{margin:0 0 6px;color:var(--acc);font-size:1rem}
.sidep ol{margin:0;padding-left:1.7em}
.sidep li{margin:0 0 6px;padding:2px 4px;border-radius:6px}
.sidep li.flash{background:#fff1c2;outline:2px solid var(--acc2)}
.sidep .sclose{display:none}
.sidebtn{display:none}
.numgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;max-width:420px}
.num{border:2px solid var(--line);background:#fff;border-radius:9px;font-weight:900;padding:5px 0;cursor:pointer;box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.num.on{background:var(--acc);color:#fff}
.numsel{font-size:.9rem;margin:6px 0 0;color:#3a3750}
.fear4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.fearpick{display:grid;grid-template-columns:40px 1fr 22px;gap:8px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:.95rem;box-shadow:2px 2px 0 rgba(0,0,0,.18)}
.fearpick .fe4{font-size:1.7rem;line-height:1}
.fearpick .fk4{font-weight:900;color:#fff}
.fearpick.on{background:var(--acc);color:#fff;border-color:var(--line)}
@media (max-width:900px){
  .withside{display:block}
  .sidep{display:none;position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:58vh;z-index:120}
  .sidep.open{display:block}
  .sidep .sclose{display:block;float:right;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:900;cursor:pointer}
  .sidebtn{display:block;position:fixed;right:12px;bottom:14px;z-index:110;border:2px solid var(--line);background:var(--acc2);color:#fff;font-weight:900;border-radius:999px;padding:10px 16px;box-shadow:3px 3px 0 rgba(0,0,0,.3);font-size:1rem}
}
@media (max-width:760px){
  body{font-size:17px}
  .pic{width:42%;margin-left:10px}
  .hasside{display:block}
  .hasside > .side{position:sticky;top:96px;max-height:38vh;margin-bottom:10px;z-index:5}
  .mrow{grid-template-columns:1fr}
  #bar select{max-width:140px}
  .scrhead h2{font-size:1.3rem}
}

.rulebox{border:2px solid var(--line);border-radius:12px;background:#f6f1ff;padding:8px 14px;margin:0 0 10px;font-weight:700;line-height:1.7}
.fearlist{margin:0;padding-left:2em}
.fearlist li{margin:0 0 8px;font-weight:700}
.fearlist .fe{display:inline-block;width:1.6em}
.crow{display:grid;grid-template-columns:minmax(140px,1fr) 2fr 34px;gap:8px;align-items:center;margin:4px 0;font-weight:700}
.cb{height:14px;background:#ece7db;border-radius:8px;overflow:hidden;border:1.5px solid var(--line)}
.cb span{display:block;height:100%;background:var(--acc2)}
.box h3 em{font-weight:700;color:#6f6a86}
</style>
</head>

h": ["herd", "doll", "curse"], "q": "A big, wild group of zombies is a ___.", "a": ["horde"], "hint": "A very big, wild crowd."}, {"t": "cloze", "id": "v7", "ch": ["horde", "witch", "shroud"], "q": "The little girl sleeps with her ___.", "a": ["doll"], "hint": "A toy that looks like a small person."}, {"t": "cloze", "id": "v8", "ch": ["symbol", "symbolize", "symbolizing"], "q": "A white flag ___ peace.", "a": ["symbolizes", "represents"], "hint": "It is a sign for an idea. One flag → add -s."}, {"t": "cloze", "id": "v9", "ch": ["trouble", "charm", "curse"], "q": "The war was a ___. He still has bad dreams.", "a": ["trauma"], "hint": "A very bad experience that hurts the mind for a long time."}, {"t": "cloze", "id": "v10", "ch": ["countless", "named", "namely"], "q": "Nobody knows her name. She is ___.", "a": ["nameless"], "hint": "name + less."}]}]}, {"id": "read", "emoji": "📖", "title": {"A": "What do monsters represent?", "B": "Read: what do monsters represent?"}, "art": "m_shadow", "dir": {"A": "Read it. Tap 🔊 to listen. Tap any word you don't know.", "B": "Read it once. Then read it again and tap the words that are new for you."}, "chunks": [{"title": {"A": "A monster is a symbol", "B": "A monster is a symbol"}, "pic": "m_shadow", "items": [{"t": "p", "text": {"A": "Monsters are symbols. They show what people are afraid of. They represent three things: things we do not know, our biggest fears, and death. Every person dies one day.", "B": "Monsters represent the unknown, our deepest fears, and the eventual death that we all face. Throughout history, there are countless examples of monsters. Some of our most well-known monsters come from an age in which the world was still shrouded in darkness, counting nameless fears in the dark."}}, {"t": "p", "text": {"A": "There are countless monsters in history. Many famous monsters come from long ago. Then, people did not understand the world. The world was dark, and people had fears with no names. So a monster is not only a monster. When we look at a monster, we can see what people were afraid of.", "B": "That is why a monster is never only a monster. It is a symbol. When we look closely at a monster, we can see what the people who told the story were afraid of — and sometimes what we are still afraid of today."}}]}, {"title": {"A": "True or false?", "B": "True or false?"}, "items": [{"t": "tf", "id": "tfa1", "q": "Monsters represent things that people are afraid of.", "a": true, "hint": "Read the first sentence again."}, {"t": "tf", "id": "tfa2", "q": "There are only a few monsters in history.", "a": false, "hint": "What does countless mean?"}, {"t": "tf", "id": "tfa3", "q": "Many famous monsters come from a time when people did not understand much about the world.", "a": true, "hint": "Look for 'shrouded in darkness' / 'the world was dark'."}, {"t": "tf", "id": "tfa4", "q": "A monster can be a symbol of death.", "a": true, "hint": "What three things do monsters represent?"}, {"t": "tf", "id": "tfa5", "q": "We cannot be afraid of the same things as people long ago.", "a": false, "hint": "Read the last sentence again."}]}]}, {"id": "fears", "emoji": "😱", "title": {"A": "Sixteen fears", "B": "Sixteen fears that monsters symbolize"}, "art": "m_fears", "side": "fears", "dir": {"A": "Read the sixteen fears. Tap any word you don't know. The list stays on the side for the next screens.", "B": "Read the sixteen fears. Tap any word you don't know. This list stays beside you on the next screens."}, "chunks": [{"title": "The sixteen fears", "pic": "m_fears", "items": [{"t": "html", "html": "<ol class=\"fearlist\"><li><span class=\"fe\">🧪</span> Fear of medicine and doctors, or science and technology</li><li><span class=\"fe\">😡</span> A scary person who gets mad too much and attacks others</li><li><span class=\"fe\">🎭</span> A person who looks beautiful, young, and good — but is really bad</li><li><span class=\"fe\">💘</span> A beautiful person you like who takes your energy and makes you feel bad</li><li><span class=\"fe\">🧠</span> A scary memory you want to forget but cannot forget</li><li><span class=\"fe\">🏚️</span> A house where bad things happened (abuse, murder)</li><li><span class=\"fe\">👪</span> Family problems and trauma passed from generation to generation</li><li><span class=\"fe\">🔁</span> A memory you want to forget that keeps coming back</li><li><span class=\"fe\">🧸</span> Things you love and think are innocent are secretly bad</li><li><span class=\"fe\">🛏️</span> The world is so dangerous you can't escape — not even in your bedroom</li><li><span class=\"fe\">🍲</span> A person so good at cooking or singing they can charm you and cast a spell</li><li><span class=\"fe\">🤖</span> A person who doesn't think and just acts automatically</li><li><span class=\"fe\">📱</span> Addiction (drugs, a phone, a computer) controls a person</li><li><span class=\"fe\">🦠</span> Fear of disease (COVID, Ebola, AIDS)</li><li><span class=\"fe\">👑</span> Fear of powerful women (or hatred of strong women)</li><li><span class=\"fe\">🌍</span> Fear that a big group of different people will take over and change your world (xenophobia)</li></ol>"}]}, {"title": "Check: which fear?", "items": [{"t": "mc", "id": "f1", "q": "Fear 16 has a special name. What is it?", "o": ["xenophobia", "addiction", "trauma", "technology"], "hint": "Read number 16 to the end."}, {"t": "mc", "id": "f2", "q": "Which fear is about a phone controlling a person?", "o": ["13", "1", "9", "4"], "hint": "Look for addicted / phone."}, {"t": "mc", "id": "f3", "q": "Which fear is about the past coming back again and again?", "o": ["8", "2", "11", "16"], "hint": "Look for 'keeps coming back'."}, {"t": "mc", "id": "f4", "q": "Fear 7 says trauma passes 'from generation to generation.' That means…", "o": ["from grandparents to parents to children", "from one house to another house", "from one country to another", "from a doctor to a patient"], "hint": "A generation = people born around the same time."}]}]}, {"id": "eight", "sideHideA": true, "emoji": "🧛", "title": {"A": "Eight monsters", "B": "Eight monsters: what do they symbolize?"}, "art": "m_vampire", "side": "fears", "dir": {"A": "For each monster, choose one or more of the four fears. Then finish the sentence.", "B": "For each monster, tap one or more fear numbers — the list stays beside you. Then finish the sentence."}, "chunks": [{"title": "A ghost", "pic": "m_ghost", "items": [{"t": "nums", "id": "mf1", "n": 16, "q": "Which fear(s)? Tap the numbers. (The list is beside you.)", "a4": [5, 8, 10, 1], "qA": "Which fear does a ghost symbolize? Choose one or more."}, {"t": "write", "id": "ms1", "q": "What does a ghost symbolize? Why?", "frame": "A ghost symbolizes ______ because ______.", "min": 6, "rows": 2}]}, {"title": "A werewolf", "pic": "m_werewolf", "items": [{"t": "nums", "id": "mf2", "n": 16, "q": "Which fear(s)? Tap the numbers. (The list is beside you.)", "a4": [2, 12, 14, 3], "qA": "Which fear does a werewolf symbolize? Choose one or more."}, {"t": "write", "id": "ms2", "q": "What does a werewolf symbolize? Why?", "frame": "A werewolf symbolizes ______ because ______.", "min": 6, "rows": 2}]}, {"title": "A vampire", "pic": "m_vampire", "items": [{"t": "nums", "id": "mf3", "n": 16, "q": "Which fear(s)? Tap the numbers. (The list is beside you.)", "a4": [4, 13, 14, 7], "qA": "Which fear does a vampire symbolize? Choose one or more."}, {"t": "write", "id": "ms3", "q": "What does a vampire symbolize? Why?", "frame": "A vampire symbolizes ______ because ______.", "min": 6, "rows": 2}]}, {"title": "A haunted house", "pic": "m_house", "items": [{"t": "nums", "id": "mf4", "n": 16, "q": "Which fear(s)? Tap the numbers. (The list is beside you.)", "a4": [6, 7, 10, 1], "qA": "Which fear does a haunted house symbolize? Choose one or more."}, {"t": "write", "id": "ms4", "q": "What does a haunted house symbolize? Why?", "frame": "A haunted house symbolizes ______ because ______.", "min": 6, "rows": 2}]}, {"title": "A possessed doll", "pic": "m_doll", "items": [{"t": "nums", "id": "mf5", "n": 16, "q": "Which fear(s)? Tap the numbers. (The list is beside you.)", "a4": [9, 10, 12, 15], "qA": "Which fear does a possessed doll symbolize? Choose one or more."}, {"t": "write", "id": "ms5", "q": "What does a possessed doll symbolize? Why?", "frame": "A possessed doll symbolizes ______ because ______.", "min": 6, "rows": 2}]}, {"title": "A witch", "pic": "m_witch", "items": [{"t": "nums", "id": "mf6", "n": 16, "q": "Which fear(s)? Tap the numbers. (The list is beside you.)", "a4": [11, 15, 3, 2], "qA": "Which fear does a witch symbolize? Choose one or more."}, {"t": "write", "id": "ms6", "q": "What does a witch symbolize? Why?", "frame": "A witch symbolizes ______ because ______.", "min": 6, "rows": 2}]}, {"title": "A horde of zombies", "pic": "m_zombies", "items": [{"t": "nums", "id": "mf7", "n": 16, "q": "Which fear(s)? Tap the numbers. (The list is beside you.)", "a4": [12, 16, 13, 5], "qA": "Which fear does a horde of zombies symbolize? Choose one or more."}, {"t": "write", "id": "ms7", "q": "What does a horde of zombies symbolize? Why?", "frame": "A horde of zombies symbolizes ______ because ______.", "min": 6, "rows": 2}]}, {"title": "Frankenstein", "pic": "m_frank", "items": [{"t": "nums", "id": "mf8", "n": 16, "q": "Which fear(s)? Tap the numbers. (The list is beside you.)", "a4": [1, 2, 14, 9], "qA": "Which fear does Frankenstein symbolize? Choose one or more."}, {"t": "write", "id": "ms8", "q": "What does Frankenstein symbolize? Why?", "frame": "Frankenstein symbolizes ______ because ______.", "min": 6, "rows": 2}]}, {"title": "What do other people say?", "items": [{"t": "reveal", "id": "others5", "label": "When you finish: see what other people say", "html": "<p>There is no one right answer. Here is what many writers and teachers say. Do you agree?</p><p><b>Ghost</b> — 5 and 8: a memory that will not leave. <b>Werewolf</b> — 2: the angry animal inside a normal person. <b>Vampire</b> — 4, also 13 and 14: someone who drains you, like an addiction or a disease. In the old book <em>Dracula</em>, the vampire is a foreigner who comes to London — so some people say 16. <b>Haunted house</b> — 6 and 7, sometimes 10. <b>Possessed doll</b> — 9 and 10. <b>Witch</b> — 11 and 15, sometimes 3. <b>Zombie horde</b> — 12, 13, 14, and 16. <b>Frankenstein</b> — 1: a scientist makes life, and it goes wrong.</p>"}]}]}, {"id": "world1", "sideHideA": true, "emoji": "🌎", "title": {"A": "World monsters 1", "B": "Monsters from around the world · 1"}, "art": "m_llorona", "side": "fears", "dir": "Read every story on this screen. If one is from your country, start with that one. Answer the questions under each story.", "chunks": [{"title": "La Llorona — <em>the weeping woman</em> · Mexico and Central America", "pic": "m_llorona", "items": [{"t": "p", "text": {"A": "Long ago, a beautiful young woman named María had two children. Their father left her for another woman. María was so angry and so sad that she lost her mind. She threw her children into the river, and they drowned. The next day she understood what she did. She searched the river, but her children were gone. Soon she died too. Now her spirit walks next to rivers and lakes at night in a long white dress. She wails, \"¡Ay, mis hijos!\" — \"Oh, my children!\" Parents warn their children: if you go near the water at night, La Llorona will take you.", "B": "Long ago, a beautiful young woman named María had two children. Their father left her for another woman. María was so angry and so sad that she lost her mind. She threw her children into the river, and they drowned. The next day she understood what she did. She searched the river, but her children were gone. Soon she died too. Now her spirit walks next to rivers and lakes at night in a long white dress. She wails, \"¡Ay, mis hijos!\" — \"Oh, my children!\" Parents warn their children: if you go near the water at night, La Llorona will take you."}}, {"t": "mc", "id": "sm1", "q": "Why does La Llorona cry?", "o": ["She lost her children, and it was her fault.", "She is lost in the forest.", "Her husband is a werewolf.", "She is hungry."], "hint": "What happened at the river?"}, {"t": "nums", "id": "sf1", "n": 16, "q": "Which fear does La Llorona symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [5, 8, 7, 2], "qA": "Which fear does La Llorona symbolize? Choose one or more."}, {"t": "write", "id": "sw1", "q": "Why? One sentence.", "frame": "La Llorona symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Aswang — <em>the neighbor at night</em> · the Philippines", "pic": "m_aswang", "items": [{"t": "p", "text": {"A": "In the daytime, an aswang looks like a normal person. Maybe she is a quiet neighbor who sells vegetables, or a man who does not talk much. But at night the aswang can shapeshift — it changes into a big black dog, a pig, or a bird. It hunts in the dark and makes a sound, \"tik-tik-tik.\" Strangely, the sound is loud when the aswang is far away and quiet when it is close. Families put salt and garlic by the doors and windows to keep it out. People say that if you look into an aswang's eyes, your picture is upside down.", "B": "In the daytime, an aswang looks like a normal person. Maybe she is a quiet neighbor who sells vegetables, or a man who does not talk much. But at night the aswang can shapeshift — it changes into a big black dog, a pig, or a bird. It hunts in the dark and makes a sound, \"tik-tik-tik.\" Strangely, the sound is loud when the aswang is far away and quiet when it is close. Families put salt and garlic by the doors and windows to keep it out. People say that if you look into an aswang's eyes, your picture is upside down."}}, {"t": "mc", "id": "sm2", "q": "What does an aswang look like in the daytime?", "o": ["A normal person", "A big black dog", "A bird", "A ghost in a white dress"], "hint": "Read the first sentence."}, {"t": "nums", "id": "sf2", "n": 16, "q": "Which fear does Aswang symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [3, 2, 16, 12], "qA": "Which fear does Aswang symbolize? Choose one or more."}, {"t": "write", "id": "sw2", "q": "Why? One sentence.", "frame": "Aswang symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Aisha Qandisha — <em>the woman by the water</em> · Morocco", "pic": "m_aisha", "items": [{"t": "p", "text": {"A": "In Morocco, people tell stories about Aisha Qandisha, a jinniya — a female jinn. She lives near rivers, springs, and the sea. At night she looks like a very beautiful woman, and she calls men by their names. Men who follow her fall under her charm, and some never come back to their families. But she has one secret: under her long dress, her feet are the feet of a goat or a camel. Grandmothers say: if a beautiful woman calls your name by the water at night, look at her feet first — and then run.", "B": "In Morocco, people tell stories about Aisha Qandisha, a jinniya — a female jinn. She lives near rivers, springs, and the sea. At night she looks like a very beautiful woman, and she calls men by their names. Men who follow her fall under her charm, and some never come back to their families. But she has one secret: under her long dress, her feet are the feet of a goat or a camel. Grandmothers say: if a beautiful woman calls your name by the water at night, look at her feet first — and then run."}}, {"t": "mc", "id": "sm3", "q": "What is Aisha Qandisha's secret?", "o": ["She has the feet of a goat or a camel.", "She cannot swim.", "She has no name.", "She is afraid of salt."], "hint": "Look for the word secret."}, {"t": "nums", "id": "sf3", "n": 16, "q": "Which fear does Aisha Qandisha symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [4, 15, 3, 1], "qA": "Which fear does Aisha Qandisha symbolize? Choose one or more."}, {"t": "write", "id": "sw3", "q": "Why? One sentence.", "frame": "Aisha Qandisha symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "The Ghoul — <em>the stranger in the desert</em> · Arabia", "pic": "m_ghoul", "items": [{"t": "p", "text": {"A": "The English word ghoul comes from the Arabic word ghūl. Long before Islam, Arab travelers told stories about the ghūl of the desert. It can shapeshift — it can look like a hyena, an old friend, or a stranger who needs help. It calls to travelers in a kind voice and leads them far from the road, into the empty sand, where it eats them. Later stories say the ghoul also lives in cemeteries and eats the dead. Travelers learned to stay on the road and not to follow a friendly voice in the dark.", "B": "The English word ghoul comes from the Arabic word ghūl. Long before Islam, Arab travelers told stories about the ghūl of the desert. It can shapeshift — it can look like a hyena, an old friend, or a stranger who needs help. It calls to travelers in a kind voice and leads them far from the road, into the empty sand, where it eats them. Later stories say the ghoul also lives in cemeteries and eats the dead. Travelers learned to stay on the road and not to follow a friendly voice in the dark."}}, {"t": "mc", "id": "sm4", "q": "How does the ghoul catch travelers?", "o": ["It looks like a friend or a stranger and leads them away.", "It flies down from the sky.", "It hides in their house.", "It sells them bad food."], "hint": "Read the fourth sentence."}, {"t": "nums", "id": "sf4", "n": 16, "q": "Which fear does The Ghoul symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [3, 16, 10, 8], "qA": "Which fear does The Ghoul symbolize? Choose one or more."}, {"t": "write", "id": "sw4", "q": "Why? One sentence.", "frame": "The Ghoul symbolizes ______ because ______.", "min": 5, "rows": 2}]}]}, {"id": "world2", "sideHideA": true, "emoji": "🌏", "title": {"A": "World monsters 2", "B": "Monsters from around the world · 2"}, "art": "m_gumiho", "side": "fears", "dir": "Read every story on this screen. Answer the questions under each story.", "chunks": [{"title": "Jiangshi — <em>the hopping corpse</em> · China", "pic": "m_jiangshi", "items": [{"t": "p", "text": {"A": "A jiangshi is a dead body that cannot rest. Many stories say it is a person who died far from home and did not have the right funeral. Its body is stiff, so it cannot walk. It hops, with its arms straight out in front. It wears the clothes of an old Qing dynasty official. A jiangshi cannot see, but it can feel your breath. If you meet one, hold your breath and do not move! A Taoist priest can stop a jiangshi with a yellow paper charm on its forehead.", "B": "A jiangshi is a dead body that cannot rest. Many stories say it is a person who died far from home and did not have the right funeral. Its body is stiff, so it cannot walk. It hops, with its arms straight out in front. It wears the clothes of an old Qing dynasty official. A jiangshi cannot see, but it can feel your breath. If you meet one, hold your breath and do not move! A Taoist priest can stop a jiangshi with a yellow paper charm on its forehead."}}, {"t": "mc", "id": "sm5", "q": "How can you hide from a jiangshi?", "o": ["Hold your breath and do not move.", "Run into the river.", "Sing a song.", "Give it candy."], "hint": "What can it feel?"}, {"t": "nums", "id": "sf5", "n": 16, "q": "Which fear does Jiangshi symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [12, 5, 14, 9], "qA": "Which fear does Jiangshi symbolize? Choose one or more."}, {"t": "write", "id": "sw5", "q": "Why? One sentence.", "frame": "Jiangshi symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Gumiho — <em>the nine-tailed fox</em> · Korea", "pic": "m_gumiho", "items": [{"t": "p", "text": {"A": "In Korea, a fox that lives for a thousand years grows nine tails and becomes a gumiho. A gumiho can shapeshift into a beautiful young woman. She is sweet and smart, and men fall in love with her. But she is not human. In many stories, the gumiho wants to become a real woman, and to do that she must eat the livers or hearts of people. In some newer stories and TV dramas, the gumiho is lonely and kind, and she only wants to be human and to be loved.", "B": "In Korea, a fox that lives for a thousand years grows nine tails and becomes a gumiho. A gumiho can shapeshift into a beautiful young woman. She is sweet and smart, and men fall in love with her. But she is not human. In many stories, the gumiho wants to become a real woman, and to do that she must eat the livers or hearts of people. In some newer stories and TV dramas, the gumiho is lonely and kind, and she only wants to be human and to be loved."}}, {"t": "mc", "id": "sm6", "q": "What does the gumiho want in many stories?", "o": ["To become a real human", "To find her children", "To go back to the forest", "To become a bird"], "hint": "Look for 'wants to become'."}, {"t": "nums", "id": "sf6", "n": 16, "q": "Which fear does Gumiho symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [3, 4, 15, 6], "qA": "Which fear does Gumiho symbolize? Choose one or more."}, {"t": "write", "id": "sw6", "q": "Why? One sentence.", "frame": "Gumiho symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Ma Da — <em>the water ghost</em> · Vietnam", "pic": "m_mada", "items": [{"t": "p", "text": {"A": "In Vietnam, when a person drowns, people say their spirit can become a ma da — a water ghost. The ma da is trapped under the water. It is cold and lonely, and it wants to be free. There is only one way out: it must pull another person under the water to take its place. So the ma da waits in rivers and ponds. When a child swims alone, it grabs the child's foot. That is why grandparents say: never swim alone, and never swim at noon or at night.", "B": "In Vietnam, when a person drowns, people say their spirit can become a ma da — a water ghost. The ma da is trapped under the water. It is cold and lonely, and it wants to be free. There is only one way out: it must pull another person under the water to take its place. So the ma da waits in rivers and ponds. When a child swims alone, it grabs the child's foot. That is why grandparents say: never swim alone, and never swim at noon or at night."}}, {"t": "mc", "id": "sm7", "q": "How can a ma da become free?", "o": ["It must pull another person under the water.", "It must find its family.", "It must eat rice.", "It must wait for one hundred years."], "hint": "Look for 'only one way out'."}, {"t": "nums", "id": "sf7", "n": 16, "q": "Which fear does Ma Da symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [10, 5, 2, 13], "qA": "Which fear does Ma Da symbolize? Choose one or more."}, {"t": "write", "id": "sw7", "q": "Why? One sentence.", "frame": "Ma Da symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Mae Nak — <em>the wife who waited</em> · Thailand", "pic": "m_maenak", "items": [{"t": "p", "text": {"A": "Nak lived with her husband, Mak, near Bangkok. She was going to have a baby. Then Mak had to go to war. While he was away, Nak and the baby both died. When Mak came home, Nak was waiting for him at the door with the baby, smiling. Mak was happy. Neighbors tried to tell him, but everyone who spoke was punished. One day, Nak dropped a lime from the kitchen. Her arm grew very long and reached down under the house to pick it up. Then Mak knew — his wife was a ghost. Her love was stronger than death.", "B": "Nak lived with her husband, Mak, near Bangkok. She was going to have a baby. Then Mak had to go to war. While he was away, Nak and the baby both died. When Mak came home, Nak was waiting for him at the door with the baby, smiling. Mak was happy. Neighbors tried to tell him, but everyone who spoke was punished. One day, Nak dropped a lime from the kitchen. Her arm grew very long and reached down under the house to pick it up. Then Mak knew — his wife was a ghost. Her love was stronger than death."}}, {"t": "mc", "id": "sm8", "q": "How did Mak learn the truth?", "o": ["He saw her arm grow very long.", "The neighbors told him and he believed them.", "He found her grave.", "The baby told him."], "hint": "Read about the lime."}, {"t": "nums", "id": "sf8", "n": 16, "q": "Which fear does Mae Nak symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [5, 8, 6, 12], "qA": "Which fear does Mae Nak symbolize? Choose one or more."}, {"t": "write", "id": "sw8", "q": "Why? One sentence.", "frame": "Mae Nak symbolizes ______ because ______.", "min": 5, "rows": 2}]}]}, {"id": "world3", "sideHideA": true, "emoji": "🌍", "title": {"A": "World monsters 3", "B": "Monsters from around the world · 3"}, "art": "m_babayaga", "side": "fears", "dir": "Read every story on this screen. Answer the questions under each story.", "chunks": [{"title": "Baba Yaga — <em>the witch in the forest</em> · Russia and Eastern Europe", "pic": "m_babayaga", "items": [{"t": "p", "text": {"A": "Deep in the forest lives Baba Yaga, an old witch with iron teeth. Her house stands on giant chicken legs and turns around and around. The fence around it is made of bones. She flies through the sky in a big bowl. Children know that Baba Yaga eats people. But she is not only bad. In the story of Vasilisa, a girl goes to Baba Yaga's house to ask for fire. She is brave, she works hard, and she is polite — and Baba Yaga helps her. If you are rude or lazy, she will eat you. If you are brave and kind, she may help you.", "B": "Deep in the forest lives Baba Yaga, an old witch with iron teeth. Her house stands on giant chicken legs and turns around and around. The fence around it is made of bones. She flies through the sky in a big bowl. Children know that Baba Yaga eats people. But she is not only bad. In the story of Vasilisa, a girl goes to Baba Yaga's house to ask for fire. She is brave, she works hard, and she is polite — and Baba Yaga helps her. If you are rude or lazy, she will eat you. If you are brave and kind, she may help you."}}, {"t": "mc", "id": "sm9", "q": "Who does Baba Yaga help?", "o": ["People who are brave and polite", "Rude children", "Lazy children", "Nobody"], "hint": "Read about Vasilisa."}, {"t": "nums", "id": "sf9", "n": 16, "q": "Which fear does Baba Yaga symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [11, 15, 2, 9], "qA": "Which fear does Baba Yaga symbolize? Choose one or more."}, {"t": "write", "id": "sw9", "q": "Why? One sentence.", "frame": "Baba Yaga symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Churel and Kichkandi — <em>the woman in white</em> · India, Pakistan, and Nepal", "pic": "m_churel", "items": [{"t": "p", "text": {"A": "In India and Pakistan, people tell stories about the churel. She was a woman who died unhappily — maybe during childbirth, or because her husband's family treated her badly. Now she comes back for revenge. At night she looks like a beautiful woman, and she calls young men to follow her. But her feet point backward. In Nepal, people tell a similar story about the kichkandi, who waits by the road at night. In both stories, the sign is the same: look at the feet.", "B": "In India and Pakistan, people tell stories about the churel. She was a woman who died unhappily — maybe during childbirth, or because her husband's family treated her badly. Now she comes back for revenge. At night she looks like a beautiful woman, and she calls young men to follow her. But her feet point backward. In Nepal, people tell a similar story about the kichkandi, who waits by the road at night. In both stories, the sign is the same: look at the feet."}}, {"t": "mc", "id": "sm10", "q": "How can you know a churel?", "o": ["Her feet point backward.", "She has nine tails.", "She hops.", "She wears a yellow paper."], "hint": "Read the last sentence."}, {"t": "nums", "id": "sf10", "n": 16, "q": "Which fear does Churel and Kichkandi symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [7, 15, 4, 1], "qA": "Which fear does Churel and Kichkandi symbolize? Choose one or more."}, {"t": "write", "id": "sw10", "q": "Why? One sentence.", "frame": "Churel and Kichkandi symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Dhegdheer — <em>the woman far from town</em> · Somalia", "pic": "m_dhegdheer", "items": [{"t": "p", "text": {"A": "Somali grandmothers tell stories about Dhegdheer — the name means \"long ear.\" She was a powerful woman who lived far away from other people. One of her ears was very long, and she could hear people talking from far, far away. She ate people who came near her house. Dhegdheer had a daughter who was not like her. The daughter was afraid of her mother and ran away to a town. Children are told to be quiet at night — because Dhegdheer can hear everything.", "B": "Somali grandmothers tell stories about Dhegdheer — the name means \"long ear.\" She was a powerful woman who lived far away from other people. One of her ears was very long, and she could hear people talking from far, far away. She ate people who came near her house. Dhegdheer had a daughter who was not like her. The daughter was afraid of her mother and ran away to a town. Children are told to be quiet at night — because Dhegdheer can hear everything."}}, {"t": "mc", "id": "sm11", "q": "What is special about Dhegdheer?", "o": ["She can hear from very far away.", "She can fly.", "She lives in the water.", "She is a fox."], "hint": "What does her name mean?"}, {"t": "nums", "id": "sf11", "n": 16, "q": "Which fear does Dhegdheer symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [2, 15, 16, 10], "qA": "Which fear does Dhegdheer symbolize? Choose one or more."}, {"t": "write", "id": "sw11", "q": "Why? One sentence.", "frame": "Dhegdheer symbolizes ______ because ______.", "min": 5, "rows": 2}]}, {"title": "Loup-garou — <em>the wolf inside</em> · France, Quebec, Louisiana, and Haiti", "pic": "m_loupgarou", "items": [{"t": "p", "text": {"A": "The loup-garou is a person who turns into a wolf — a werewolf. In old French and Quebec stories, a person who does not go to church for seven years becomes a loup-garou and runs through the forest at night. In Louisiana it is called the rougarou. In Haiti, a lougawou is a person who takes off their skin at night, changes into an animal or a ball of fire, and goes out to hurt people. In the morning, the loup-garou is a normal person again, and nobody knows.", "B": "The loup-garou is a person who turns into a wolf — a werewolf. In old French and Quebec stories, a person who does not go to church for seven years becomes a loup-garou and runs through the forest at night. In Louisiana it is called the rougarou. In Haiti, a lougawou is a person who takes off their skin at night, changes into an animal or a ball of fire, and goes out to hurt people. In the morning, the loup-garou is a normal person again, and nobody knows."}}, {"t": "mc", "id": "sm12", "q": "In the morning, what happens to the loup-garou?", "o": ["It becomes a normal person again.", "It dies.", "It flies away.", "It goes back to the river."], "hint": "Read the last sentence."}, {"t": "nums", "id": "sf12", "n": 16, "q": "Which fear does Loup-garou symbolize? (The list is beside you. If it's a new fear, write it below.)", "a4": [2, 12, 3, 14], "qA": "Which fear does Loup-garou symbolize? Choose one or more."}, {"t": "write", "id": "sw12", "q": "Why? One sentence.", "frame": "Loup-garou symbolizes ______ because ______.", "min": 5, "rows": 2}]}]}, {"id": "meaning", "emoji": "🔍", "title": {"A": "What do they mean?", "B": "What do these monsters mean?"}, "art": "m_world", "side": "fears", "dir": "Compare the stories. Use the fears list beside you and give evidence from the stories.", "chunks": [{"title": "Water stories", "pic": "m_mada", "items": [{"t": "write", "id": "an_water", "q": "La Llorona and the Ma Da both live in the water. Why do so many parents tell water stories to children?", "frame": "Parents tell water stories because ______. For example, ______.", "min": 15, "rows": 3}]}, {"title": "Women monsters", "pic": "m_babayaga", "items": [{"t": "write", "id": "an_women", "q": "Baba Yaga, Dhegdheer, the Churel, and the Gumiho are all women. Look at fear 15. Why do you think so many monsters are women?", "min": 20, "rows": 4}]}, {"title": "Monsters that look normal", "pic": "m_aswang", "items": [{"t": "write", "id": "an_look", "q": "The Aswang, the Ghoul, and the Gumiho all look like normal people. What are these stories telling us to be careful about?", "min": 15, "rows": 3}]}, {"title": "Your choice", "pic": "m_campfire", "items": [{"t": "write", "id": "an_mine", "q": "Which story is the scariest for you? Why? Is there a lesson in it?", "frame": "The scariest story for me is ______ because ______. The lesson is ______.", "min": 15, "rows": 3}, {"t": "reveal", "id": "others7", "label": "When you finish: see what other people say", "html": "<p><b>La Llorona</b> — 5 and 8: guilt that never ends; also a warning to stay away from the river. <b>Ma Da</b> — a warning about dangerous water. <b>Aswang</b> — 3: your neighbor may not be who you think. <b>Aisha Qandisha</b> — 4 and 15. <b>Ghoul</b> — 3: the stranger in the desert. <b>Jiangshi</b> — 12, and the fear of dying far from home without the right funeral. <b>Gumiho</b> — 3, 4, and 15. <b>Mae Nak</b> — 5 and 8: love that cannot let go. <b>Baba Yaga</b> — 11 and 15, but she also helps people who are brave and polite. <b>Churel</b> — 7 and 15: a woman who was treated badly, and her revenge. <b>Dhegdheer</b> — 2 and 15. <b>Loup-garou</b> — 2: the animal inside a person.</p>"}]}]}, {"id": "grammar", "emoji": "✏️", "title": {"A": "Grammar", "B": "Grammar for talking about symbols"}, "art": "m_grammar", "dir": {"A": "Read the rule box first. Then choose the answer. A wrong answer stays marked — fix it and the ✓ appears beside it.", "B": "Read the rule box first. Then type the answer. A wrong answer stays marked — fix it and the ✓ appears beside it."}, "chunks": [{"title": "A. symbolize / symbolizes", "pic": "m_ghost", "items": [{"t": "html", "html": "<div class=\"rulebox\">One monster → <b>symbolizes</b>. Many monsters → <b>symbolize</b>. After <b>does</b> or <b>do</b> → <b>symbolize</b>.</div>"}, {"t": "cloze", "id": "g1", "ch": ["symbolize", "symbolizing", "symbol"], "q": "A ghost ___ a memory that we cannot forget.", "a": ["symbolizes", "represents"], "hint": "One ghost → add -s."}, {"t": "cloze", "id": "g2", "ch": ["represent", "representing", "representation"], "q": "Frankenstein ___ the fear of science.", "a": ["represents", "symbolizes"], "hint": "One monster → add -s."}, {"t": "cloze", "id": "g3", "ch": ["symbolizes", "symbolizing", "symbolized by"], "q": "Zombies ___ people who act without thinking.", "a": ["symbolize", "represent"], "hint": "Zombies = many → no -s."}, {"t": "cloze", "id": "g4", "ch": ["represents", "representing", "is representing"], "q": "Witches and the Gumiho ___ the fear of powerful women.", "a": ["represent", "symbolize"], "hint": "Two subjects joined by and → plural, no -s."}, {"t": "cloze", "id": "g5", "ch": ["symbolize", "symbolizing", "symbol"], "q": "The Jiangshi ___ the fear of dying far from home.", "a": ["symbolizes", "represents"], "hint": "One monster → add -s."}, {"t": "cloze", "id": "g6", "ch": ["symbolizes", "symbolizing", "symbolized"], "q": "What does a werewolf ___?", "a": ["symbolize", "represent"], "hint": "After does → the base form, no -s."}]}, {"title": "B. who, that, where", "pic": "m_house", "items": [{"t": "html", "html": "<div class=\"rulebox\"><b>who</b> → a person. <b>that</b> → a thing, an animal, or a person. <b>where</b> → a place.</div>"}, {"t": "cloze", "id": "r1", "ch": ["where", "when", "what"], "q": "La Llorona is a woman ___ cries next to the river.", "a": ["who", "that"], "hint": "La Llorona is a person."}, {"t": "cloze", "id": "r2", "ch": ["who", "when", "what"], "q": "A haunted house is a house ___ bad things happened.", "a": ["where"], "hint": "A house is a place."}, {"t": "cloze", "id": "r3", "ch": ["where", "when", "whose"], "q": "A zombie is a monster ___ walks but cannot think.", "a": ["that", "which", "who"], "hint": "A monster is a thing here."}, {"t": "cloze", "id": "r4", "ch": ["where", "when", "what"], "q": "Baba Yaga is a witch ___ lives in the forest.", "a": ["who", "that"], "hint": "A witch is a person."}, {"t": "cloze", "id": "r5", "ch": ["who", "what", "when"], "q": "The forest is the place ___ Baba Yaga lives.", "a": ["where"], "hint": "the place ___ → a place."}, {"t": "cloze", "id": "r6", "ch": ["who", "where", "when"], "q": "A jiangshi is a dead body ___ hops at night.", "a": ["that", "which"], "hint": "A body is a thing here."}, {"t": "cloze", "id": "r7", "ch": ["where", "what", "when"], "q": "A stranger is a person ___ you do not know.", "a": ["who", "that", "whom"], "hint": "A stranger is a person."}, {"t": "cloze", "id": "r8", "ch": ["who", "what", "which"], "q": "Morocco is the country ___ people tell stories about Aisha Qandisha.", "a": ["where"], "hint": "A country is a place."}]}, {"title": "C. Monster warnings: If you …, the monster will …", "pic": "m_llorona", "items": [{"t": "html", "html": "<div class=\"rulebox\"><b>If</b> + present, … <b>will</b> + verb. &nbsp; <em>If you <b>go</b> out at night, La Llorona <b>will take</b> you.</em></div>"}, {"t": "mc", "id": "c1", "q": "If you ___ to the river at night, La Llorona ___ you.", "o": ["go / will take", "will go / take", "goes / will take", "go / take"], "hint": "If + present (no will). The result gets will."}, {"t": "mc", "id": "c2", "q": "If you ___ alone, the Ma Da ___ you under the water.", "o": ["swim / will pull", "will swim / pull", "swims / will pull", "swim / pulls"], "hint": "you → swim (no -s). Result → will."}, {"t": "mc", "id": "c3", "q": "If a jiangshi ___ you breathe, it ___ you.", "o": ["hears / will find", "hear / will find", "will hear / finds", "hears / find"], "hint": "a jiangshi = it → hears."}, {"t": "mc", "id": "c4", "q": "If you ___ rude to Baba Yaga, she ___ you.", "o": ["are / will eat", "will be / eat", "is / will eat", "are / eat"], "hint": "you → are. Result → will."}, {"t": "mc", "id": "c5", "q": "If a child ___ his parents, the monster ___ for him.", "o": ["disobeys / will come", "disobey / will come", "will disobey / comes", "disobeys / come"], "hint": "a child = he → disobeys."}, {"t": "mc", "id": "c6", "q": "If you ___ salt by the door, the aswang ___ in.", "o": ["leave / won't come", "will leave / doesn't come", "leaves / won't come", "leave / not come"], "hint": "you → leave. Negative result → won't."}, {"t": "write", "id": "g_mywarn", "q": "Write a warning that adults in your country tell children. Use If you …, … will …", "min": 8, "rows": 2}]}]}, {"id": "writing", "emoji": "✍️", "title": {"A": "Writing", "B": "Writing"}, "art": "m_write", "dir": "Choose your level. Level A shows Level 1; Level B shows Levels 2 and 3.", "chunks": [{"title": "Level 1 — My monster in six sentences", "level": "A", "pic": "m_write", "items": [{"t": "write", "id": "w_l1", "q": "Write six sentences about a monster.", "frame": "The monster is from ______. Its name is ______. It looks ______. It lives ______. It scares people because ______. I think it symbolizes ______.", "min": 30, "rows": 6}]}, {"title": "Level 2 — One paragraph: a monster from my country or my family", "level": "B", "pic": "m_campfire", "items": [{"t": "write", "id": "w_l2", "q": "Who told you the story? What happens in it? What fear does the monster symbolize? Why do adults tell this story to children?", "min": 80, "rows": 7}]}, {"title": "Level 3 — Two paragraphs: invent a monster for today", "level": "B", "pic": "m_fears", "items": [{"t": "write", "id": "w_l3", "q": "Invent a new monster for a fear people have now — phones, AI, loneliness, climate change, or your own idea. Paragraph /* Glossary words answer instantly. This wrapper is installed before std.js loads, so std.js's
   song_tr cache wraps it: a word in the unit glossary never waits on the Apps Script proxy. */
(function(){
  if(!window.fetch || window.__UNIT_GLOSS_FETCH__) return;
  window.__UNIT_GLOSS_FETCH__ = true;
  var real = window.fetch, ALIAS = { "zh":"zh-CN", "zh-cn":"zh-CN", "zh-tw":"yue", "zh-hk":"yue", "cantonese":"yue" };
  function look(src, lg){
    var G = U.gloss || {}, w = String(src || "").toLowerCase().replace(/[^a-z' -]/g, "").trim(), g = G[w];
    if(!g && /s$/.test(w)) g = G[w.replace(/e?s$/, "")] || G[w.replace(/s$/, "")];
    if(!g && /(ed|ing)$/.test(w)) g = G[w.replace(/(ed|ing)$/, "")] || G[w.replace(/(ed|ing)$/, "e")];
    if(!g || !g.t) return "";
    return g.t[lg] || g.t[ALIAS[String(lg).toLowerCase()]] || "";
  }
  window.fetch = function(input, init){
    var url = (typeof input === "string") ? input : (input && input.url) || "";
    if(url.indexOf("script.google.com") >= 0 && url.indexOf("action=translate") >= 0 && /[?&]mode=word/.test(url)){
      var m = /[?&]idiom=([^&]*)/.exec(url), l = /[?&]lang=([^&]*)/.exec(url);
      if(m && l){
        var v = look(decodeURIComponent(m[1].replace(/\+/g, " ")), decodeURIComponent(l[1]));
        if(v && typeof Response === "function") return Promise.resolve(new Response(JSON.stringify({ ok:true, translation:{ equiv:v, meaning:"", note:"" } }), { status:200, headers:{ "Content-Type":"application/json" } }));
      }
    }
    return real.apply(this, arguments);
  };
})();
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function hdr(extra){ var h = { "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json" }; for(var k in (extra||{})) h[k] = extra[k]; return h; }

function say(text, rate){
  if(!window.speechSynthesis || !text) return;
  var t = strip(String(text)).replace(/_{2,}/g, " blank ").replace(/\bI\b(?![\u2019'])/g, "eye").replace(/[\u{1F1E6}-\u{1F1FF}]/gu,"").replace(/\p{Extended_Pictographic}/gu,"").replace(/[\uFE0F\u200D\u20E3]/g,"").replace(/[✓✗→↔️🟰]/g,"").replace(/\s{2,}/g," ").trim();
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = rate || 0.85;
  try{ var vs = speechSynthesis.getVoices().filter(function(v){ return /^en(-|_)US/i.test(v.lang); }); if(vs.length) u.voice = vs[0]; }catch(e){}
  speechSynthesis.speak(u);
}

/* ---------- translation of directions (proxy, cached, 3 at a time) ---------- */
var TRC = {}, trQ = [], trBusy = 0;
function trCacheLoad(){ try{ TRC = JSON.parse(localStorage.getItem("gal_trc_" + LANG) || "{}"); }catch(e){ TRC = {}; } }
function trCacheSave(){ try{ localStorage.setItem("gal_trc_" + LANG, JSON.stringify(TRC)); }catch(e){} }
var TRFAIL = {}, TRPART = {};
function trGot(d){
  var tr = d && (d.translation != null ? d.translation : (d.equiv || d.result || d.text)), v = "";
  if(tr && typeof tr === "object") v = tr.equiv || tr.meaning || ""; else if(typeof tr === "string") v = tr;
  return String(v || "").trim();
}
function trPump(){
  while(trBusy < 3 && trQ.length){
    (function(job){
      trBusy++; job.n = (job.n || 0) + 1;
      var ctl = window.AbortController ? new AbortController() : null, tm = setTimeout(function(){ if(ctl) ctl.abort(); }, 12000);
      var u = PROXY + "?action=translate&mode=sentence&idiom=" + encodeURIComponent(job.text) + "&meaning=&lang=" + encodeURIComponent(job.lang);
      fetch(u, ctl ? { signal: ctl.signal } : {}).then(function(r){ return r.json(); }).then(function(d){
        var v = trGot(d); if(!v) throw new Error("empty");
        if(job.lang !== LANG) return;
        if(job.part){ TRPART[job.whole] = TRPART[job.whole] || {}; TRPART[job.whole][job.i] = v;
          var done = Object.keys(TRPART[job.whole]).length === job.of;
          if(done){ var out = []; for(var k=0;k<job.of;k++) out.push(TRPART[job.whole][k]); TRC[job.whole] = out.join(" "); trCacheSave(); fillDirs(); } }
        else { TRC[job.text] = v; trCacheSave(); fillDirs(); }
      }).catch(function(){
        if(job.lang !== LANG) return;
        if(job.n < 3){ setTimeout(function(){ trQ.push(job); trPump(); }, 1500 * job.n); return; }
        var parts = job.part ? [] : String(job.text).match(/[^.!?]+[.!?]*/g) || [];
        if(parts.length > 1){ parts.forEach(function(t, i){ trQ.push({ text: t.trim(), lang: job.lang, part: true, whole: job.text, i: i, of: parts.length }); }); trPump(); }
        else { TRFAIL[job.part ? job.whole : job.text] = true; fillDirs(); }
      }).then(function(){ clearTimeout(tm); trBusy--; trPump(); });
    })(trQ.shift());
  }
}
function fillDirs(){
  var ds = document.querySelectorAll(".dir[data-en]");
  for(var i=0;i<ds.length;i++){
    var d = ds[i], en = d.getAttribute("data-en"), box = d.querySelector(".dtr");
    if(LANG === "none"){ if(box) box.remove(); continue; }
    if(!box){ box = document.createElement("span"); box.className = "dtr"; box.setAttribute("translate","no"); d.appendChild(box); }
    if(RTL[LANG]) box.setAttribute("dir","rtl"); else box.removeAttribute("dir");
    if(TRC[en]) box.textContent = TRC[en];
    else if(TRFAIL[en]){ box.innerHTML = '<button type="button" class="trretry">🌐 Translate</button>'; }
    else { box.textContent = "…"; if(!d._q || d._q !== LANG){ d._q = LANG; trQ.push({ text: en, lang: LANG }); } }
  }
  trPump();
}
function dirHTML(text){ var t = L(text); if(!t) return ""; return '<p class="dir" data-en="' + esc(strip(t)) + '"><span class="den">' + t + "</span> " + spk(t) + "</p>"; }

/* ---------- order: shuffle once per student, correct answer never 4x in the same slot ---------- */
var lastPos = [];
function seedHash(s){ var h = 2166136261; for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; } return h; }
function orderFor(id, n){
  if(ST.ord[id] && ST.ord[id].length === n) { lastPos.push(ST.ord[id].indexOf(0)); return ST.ord[id]; }
  var r = seedHash((student ? student.email : "x") + "|" + id), a = [];
  for(var i=0;i<n;i++) a.push(i);
  for(var j=n-1;j>0;j--){ r = (r * 1103515245 + 12345) >>> 0; var k = r % (j+1), t = a[j]; a[j] = a[k]; a[k] = t; }
  var p = a.indexOf(0), L3 = lastPos.slice(-3);
  if(L3.length === 3 && L3[0] === p && L3[1] === p && L3[2] === p){ var q = (p + 1) % n; a[p] = a[q]; a[q] = 0; }
  lastPos.push(a.indexOf(0));
  ST.ord[id] = a; dirty = true;
  return a;
}

/* ---------- scoring ---------- */
function allScored(){
  var out = [];
  U.screens.forEach(function(s){ s.chunks.forEach(function(c){ (c.items||[]).forEach(function(it){
    if(it.t === "mc" || it.t === "tf" || it.t === "pick" || it.t === "cloze") out.push({ id: it.id, s: s.id });
    if(it.t === "cards" && it.rec) it.words.forEach(function(w){ out.push({ id: "rec_" + w, s: s.id, rec: true }); });
    if(it.t === "sort") it.items.forEach(function(x, i){ out.push({ id: it.id + "_" + i, s: s.id }); });
    if(it.t === "match") it.pairs.forEach(function(x, i){ out.push({ id: it.id + "_" + i, s: s.id }); });
  }); }); });
  return out;
}
var SCORED = null;
function writtenIds(){
  var out = [];
  U.screens.forEach(function(s){ s.chunks.forEach(function(c){ (c.items||[]).forEach(function(it){
    if(it.t === "write") out.push({ id: it.id, s: s.id, min: it.min || 3 });
    if(it.t === "nums") out.push({ id: it.id, s: s.id, min: 1, nums: true });
  }); }); });
  return out;
}
function score(){
  var ok = 0, first = 0;
  SCORED.forEach(function(x){ if(x.rec){ var r = (ST.extra.rec || {})[x.id.slice(4)]; if(r && r.ok){ ok++; if(r.tries <= 1) first++; } return; } var a = ST.ans[x.id]; if(a && a.ok){ ok++; if(a.tries === 0) first++; } });
  return { score: ok, max: SCORED.length, first: first };
}
function words(t){ if(Array.isArray(t)) return t.length; return (String(t||"").trim().match(/\S+/g) || []).length; }
function screenProgress(sid){
  var done = 0, tot = 0;
  SCORED.forEach(function(x){ if(x.s === sid){ tot++; if(!x.rec && ST.ans[x.id] && ST.ans[x.id].ok) done++; } });
  writtenIds().forEach(function(x){ if(x.s === sid){ tot++; if(x.nums ? (ST.w[x.id] && ST.w[x.id].length) : words(ST.w[x.id]) >= x.min) done++; } });
  var scr = U.screens.filter(function(s){ return s.id === sid; })[0];
  SCORED.forEach(function(x){ if(x.s === sid && x.rec){ var r = (ST.extra.rec || {})[x.id.slice(4)]; if(r && r.ok) done++; } });
  if(scr && scr.doneWhen && ST.extra[scr.doneWhen]) { tot++; done++; }
  else if(scr && scr.doneWhen){ tot++; }
  if(tot === 0) return { done: ST.seen[sid] ? 1 : 0, tot: 1 };
  return { done: done, tot: tot };
}
function publishScore(){
  var s = score();
  window.GAL_SCORE = s.score; window.GAL_MAX = s.max;
  var p = $("prog"); if(p) p.style.width = (s.max ? Math.round(100 * s.score / s.max) : 0) + "%";
  var n = $("scoreNote"); if(n) n.textContent = s.score + " / " + s.max;
  return s;
}

/* ---------- save / load (Supabase only — student work never goes to localStorage) ---------- */
var saving = false, lastScoreLogged = -1, saveTimer = null;
function setStatus(t, cls){ var e = $("saveNote"); if(e){ e.textContent = t; e.className = cls || ""; } }
function collect(){
  var p = {}; for(var k in oldPayload) p[k] = oldPayload[k];
  var s = score();
  ST.lvl = LVL;
  p.v2 = ST;
  p.meta = { score: s.score, max: s.max, first: s.first, level: LVL, lang: LANG,
             answered: Object.keys(ST.ans).filter(function(k){ return ST.ans[k].ok; }).length + Object.keys(ST.w).filter(function(k){ return words(ST.w[k]) > 0; }).length,
             total: SCORED.length + writtenIds().length,
             words: Object.keys(ST.w).reduce(function(a,k){ return a + words(ST.w[k]); }, 0) };
  return p;
}
function save(submit, cb){
  if(!student || !loaded) { if(cb) cb(false); return; }
  if(saving){ dirty = true; if(cb) cb(false); return; }
  saving = true; dirty = false; setStatus("Saving…", "wait");
  var pay = collect(), s = publishScore();
  var row = { email: student.email, student_name: student.name, period: student.period, guide_key: U.guide, lang: LANG,
              payload: pay, answered: pay.meta.answered, total: pay.meta.total, score: s.score, max_score: s.max,
              updated_at: new Date().toISOString() };
  if(submit){ row.submitted = true; row.submitted_at = new Date().toISOString(); ST.submitted = true; }
  fetch(SUPA_URL + "/rest/v1/" + TABLE + "?on_conflict=email,guide_key", { method:"POST", headers: hdr({ "Prefer":"resolution=merge-duplicates,return=minimal" }), body: JSON.stringify([row]) })
    .then(function(r){
      saving = false;
      if(!r.ok) throw new Error("save " + r.status);
      setStatus("Saved ✓", "ok");
      if(s.score !== lastScoreLogged && window.GAL_logAttempt){ lastScoreLogged = s.score; try{ window.GAL_logAttempt({ score: s.score, max: s.max }); }catch(e){} }
      if(cb) cb(true);
      if(dirty) queueSave();
    }).catch(function(){ saving = false; dirty = true; setStatus("Can't reach the server — your work is still here. Trying again…", "bad"); if(cb) cb(false); });
}
function queueSave(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(function(){ save(false); }, 2500); publishScore(); refreshTiles(); }
setInterval(function(){ if(dirty) save(false); }, 20000);

function altEmail(e){ var lp = e.split("@")[0]; return [lp + "@sfusd.edu", lp + "@s.sfusd.edu"]; }
function load(cb){
  var ems = altEmail(student.email);
  var u = SUPA_URL + "/rest/v1/" + TABLE + "?select=email,payload,updated_at&guide_key=eq." + encodeURIComponent(U.guide) + "&email=in.(" + ems.map(encodeURIComponent).join(",") + ")";
  setStatus("Loading your work…", "wait");
  fetch(u, { headers: hdr() }).then(function(r){ if(!r.ok) throw new Error("load " + r.status); return r.json(); }).then(function(rows){
    rows = rows || [];
    rows.sort(function(a,b){ return String(a.updated_at) < String(b.updated_at) ? -1 : 1; });
    oldPayload = {};
    var merged = fresh();
    rows.forEach(function(r){
      var p = r.payload || {};
      for(var k in p) if(k !== "v2") oldPayload[k] = p[k];
      var v = p.v2; if(!v) return;
      ["ans","ord","w","seen","extra"].forEach(function(k){ for(var x in (v[k]||{})) merged[k][x] = v[k][x]; });
      if(v.egg) merged.egg = v.egg; if(v.lvl) merged.lvl = v.lvl; if(v.submitted) merged.submitted = true;
    });
    ST = merged; LVL = ST.lvl || "A"; loaded = true;
    setStatus(rows.length ? "Welcome back ✓" : "Ready", "ok");
    if(rows.some(function(r){ return r.email !== student.email; })) dirty = true;
    cb();
  }).catch(function(){
    setStatus("Can't reach the server. Trying again in 20 seconds…", "bad");
    setTimeout(function(){ load(cb); }, 20000);
  });
}

/* ---------- sign-in ---------- */
function cleanMail(x){ return String(x||"").trim().toLowerCase(); }
function canon(e){ return cleanMail(e).split("@")[0] + "@sfusd.edu"; }
function signIn(){
  var name = $("gName").value.trim(), raw = cleanMail($("gEmail").value), per = $("gPeriod").value, lg = $("gLang").value, err = $("gErr");
  if(name.split(/\s+/).length < 2){ err.textContent = "Write your first and last name."; return; }

  if(!per){ err.textContent = "Choose your class period."; return; }
  if(!lg){ err.textContent = "Choose your language."; return; }
  var em = canon(raw);
  student = { name: name, email: em, period: per };
  try{ localStorage.setItem(U.slug + "_student", JSON.stringify(student)); localStorage.setItem("gal_student_email", em); localStorage.setItem("vocab_lang", lg); }catch(e){}
  if(raw !== em) fetch(SUPA_URL + "/rest/v1/student_aliases?on_conflict=alias_email", { method:"POST", headers: hdr({ "Prefer":"resolution=merge-duplicates,return=minimal" }), body: JSON.stringify([{ alias_email: raw, email: em }]) }).catch(function(){});
  fetch(SUPA_URL + "/rest/v1/students?on_conflict=email", { method:"POST", headers: hdr({ "Prefer":"resolution=ignore-duplicates,return=minimal" }), body: JSON.stringify([{ email: em, name: name, period: per }]) }).catch(function(){});
  setLang(lg);

  $("who").textContent = name;
  load(function(){ SCORED = allScored(); applyLevel(); go(location.hash.replace("#","") || "home"); publishScore(); });
}

var recCtl = null;
function recWord(btn){
  var w = btn.getAttribute("data-rec"), msg = document.querySelector('[data-recmsg="' + w + '"]'), card = btn.closest(".wcard");
  if(!window.GS || !GS.record){ msg.textContent = "The microphone is still loading. Try again in a moment."; return; }
  if(recCtl){ recCtl.stop(); return; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  btn.classList.add("live"); msg.textContent = "Listening… say: " + w;
  recCtl = GS.record({ maxMs: 5000, onDone: function(res){
    recCtl = null; btn.classList.remove("live");
    if(res.error === "nomic" || res.error === "not-allowed"){ msg.textContent = "The page can't use the microphone. Ask Mr. Toby."; return; }
    var best = GS.bestMatch(res.alts || [], [w]), ok = best.score >= 0.6;
    if(!ok && !GS.canRecognize && res.blob && res.secs > 0.6){ ok = true; best.heard = "(recorded — Mr. Toby will listen)"; }
    ST.extra.rec = ST.extra.rec || {}; var r = ST.extra.rec[w] || { tries: 0 }; r.tries++;
    if(ok) r.ok = true; r.heard = best.heard || ""; r.score = Math.round(best.score * 100) / 100; ST.extra.rec[w] = r;
    if(res.blob){ var pl = document.querySelector('[data-play="' + w + '"]'); if(pl){ pl._url = URL.createObjectURL(res.blob); pl.hidden = false; } }
    msg.innerHTML = ok ? "✓ I heard you say it." : (best.heard ? 'I heard "' + esc(best.heard) + '". Try again — say: <b>' + esc(w) + "</b>" : "I didn't hear you. Tap the red button and say: <b>" + esc(w) + "</b>");
    card.classList.toggle("recok", !!r.ok);
    if(student){
      var row = { activity: U.slug + "-words", item_id: w, email: student.email, speaker_name: student.name, period: student.period, device_email: student.email,
                  target_text: w, said_text: best.heard || "", transcript: (res.alts && res.alts[0] && res.alts[0].t) || "", alternatives: res.alts || [],
                  match_score: best.score, attempt_no: r.tries, accepted: ok, practice: false };
      GS.saveAttempt(row, res.blob);
      if(res.blob){ setTimeout(function(){ /* audio path is set on the row by saveAttempt */ if(row.audio_path){ r.path = row.audio_path; queueSave(); } }, 4000); }
    }
    queueSave(); updateFooter();
  } });
}

/* ---------- finish + turn in ---------- */
function finish(){
  var s = score(), left = U.screens.filter(function(x){ var p = screenProgress(x.id); return p.done < p.tot; });
  var h = '<div class="box donebox">' + art(U.homeArt) + "<h2>" + (left.length ? "Almost there!" : "You did it! 🎉") + "</h2><p>Score: <b>" + s.score + " / " + s.max + "</b></p>";
  if(left.length) h += "<p>Not finished yet:</p><p>" + left.map(function(x){ return '<button type="button" class="navb" data-go="' + x.id + '">' + x.emoji + " " + L(x.title) + "</button>"; }).join(" ") + "</p>";
  h += '<p><button type="button" class="navb next" id="turnIn2">Turn in my work</button></p><p class="note">When you turn it in, go to Google Classroom for the next activity, or ask Mr. Toby.</p></div>';
  $("main").innerHTML = h; cur = "finish"; window.scrollTo(0,0);
  $("turnIn2").addEventListener("click", turnIn);
}
function turnIn(){ save(true, function(ok){ toast(ok ? "Turned in ✓ Go to Google Classroom for the next activity, or ask Mr. Toby." : "It did not send. Check the wifi and try again."); if(ok) fireworks(); }); }

/* ---------- toast + fireworks ---------- */
function toast(m){ var t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 3800); }
function fireworks(){
  var c = ["#f2b134","#e8833a","#d9648a","#9b6bd6","#4f93c9","#3f9e73"];
  for(var i=0;i<46;i++){ var d = document.createElement("i"); d.className = "spark"; d.style.left = (30 + Math.random()*40) + "vw"; d.style.top = (30 + Math.random()*30) + "vh";
    d.style.background = c[i % c.length]; d.style.setProperty("--dx", (Math.random()*60-30) + "vw"); d.style.setProperty("--dy", (Math.random()*50-35) + "vh");
    document.body.appendChild(d); setTimeout(function(x){ return function(){ x.remove(); }; }(d), 1400); }
}

/* ---------- API for widgets ---------- */
var API = { ST: function(){ return ST; }, save: queueSave, saveNow: save, esc: esc, say: say, spk: spk, L: L, art: function(n){ return U.art[n] || ""; },
            student: function(){ return student; }, hdr: hdr, SUPA_URL: SUPA_URL, TABLE: TABLE, lang: function(){ return LANG; }, level: function(){ return LVL; },
            answer: answer, quip: quip, toast: toast, fireworks: fireworks, is101: IS101, fillDirs: function(){ fillDirs(); }, refresh: function(){ refreshTiles(); updateFooter(); } };
window.ENGINE = API;

/* ---------- boot ---------- */
function boot(){
  var sel = $("lang"), gl = $("gLang");
  [sel, gl].forEach(function(s, i){
    var h = i === 0 ? '<option value="none">English only</option>' : '<option value="">Choose your language</option>';
    U.langs.forEach(function(l){ h += '<option value="' + l[0] + '">' + l[1] + "</option>"; });
    s.innerHTML = h;
  });
  try{ var vl = localStorage.getItem("vocab_lang"); if(vl) gl.value = vl; var em = localStorage.getItem("gal_student_email"); if(em) $("gEmail").value = em; }catch(e){}
  sel.addEventListener("change", function(){ setLang(sel.value); queueSave(); });
  $("gGo").addEventListener("click", signIn);
  ["gName","gEmail"].forEach(function(x){ $(x).addEventListener("keydown", function(e){ if(e.key === "Enter") signIn(); }); });
  $("turnIn").addEventListener("click", function(){ if(student) finish(); });
  var tb = "";
  tb += '<button type="button" data-go="home">☰</button>';
  U.screens.forEach(function(s, i){ tb += '<button type="button" data-go="' + s.id + '" title="' + esc(strip(L(s.title))) + '">' + (i+1) + "</button>"; });
  $("tabs").innerHTML = tb;
  SCORED = allScored();
  /* quiet canary: tab titles are translatable and known; drift = an outside translator */
  var EXPECT = U.screens.map(function(s){ return strip(L(s.title)); }), sent = "";
  setInterval(function(){
    if(!student) return;
    var obs = "", ts = document.querySelectorAll(".tname");
    for(var i=0;i<ts.length && i<EXPECT.length;i++){ var got = (ts[i].textContent || "").replace(/^\S+\s/,"").trim(); if(got && got !== EXPECT[i]){ obs = got; break; } }
    var cls = document.documentElement.className || "";
    if(!obs && !/translated/.test(cls)) return;
    var sig = obs + "|" + document.documentElement.lang; if(sig === sent) return; sent = sig;
    fetch(SUPA_URL + "/rest/v1/page_translation?on_conflict=email,set_slug", { method:"POST", headers: hdr({ "Prefer":"resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([{ email: student.email, set_slug: U.slug, translated: true, observed: obs, html_lang: document.documentElement.lang || "", html_class: cls, updated_at: new Date().toISOString() }]) }).catch(function(){});
  }, 15000);
}
boot();
})();
