<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Reel 1: The New Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../reel.css">
</head>
<body>

<header class="top">
  <div>
    <a class="back" href="../" translate="yes" data-canary="All episodes">All episodes</a>
    <p class="ep-num" id="epNum">Episode 1</p>
    <h1 class="ep-title" id="epTitle" translate="no">The New Student</h1>
  </div>
  <div class="opts">

      <button data-l="A" aria-pressed="true" translate="yes" data-canary="Level A">Level A</button>
      <button data-l="B" aria-pressed="false" translate="yes" data-canary="Level B">Level B</button>
    </div>
    <select class="lang" id="lang" title="Translation language" translate="no">
      <option value="">Language</option>
      <option value="es">Espa&ntilde;ol</option>
      <option value="yue">&#24291;&#26481;&#35441; (Cantonese)</option>
      <option value="zh-CN">&#20013;&#25991; (&#26222;&#36890;&#35441;)</option>
      <option value="ar">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</option>
      <option value="ary">&#1575;&#1604;&#1583;&#1575;&#1585;&#1580;&#1577;</option>
      <option value="vi">Ti&#7871;ng Vi&#7879;t</option>
      <option value="ru">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>

      <option value="fr">Fran&ccedil;ais</option>
      <option value="ko">&#54620;&#44397;&#50612;</option>
      <option value="hi">&#2361;&#2367;&#2344;&#2381;&#2342;&#2368;</option>
      <option value="so">Soomaali</option>
      <option value="ne">&#2344;&#2375;&#2346;&#2366;&#2354;&#2368;</option>
      <option value="th">&#3652;&#3607;&#3618;</option>
    </select>
  </div>
</header>

<main class="player" id="player">
  <div class="stageWrap">
    <div id="cam">
      <svg id="stage" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Story scene">
        <g id="gBg"></g><g id="gChars"></g><g id="gTag"></g>
      </svg>
    </div>
    <div class="curtain" id="curtain">
      <button class="bigplay" id="bigPlay" aria-label="Start">▶</button>
      <p id="curtainMsg" translate="yes">Tap to start</p>
      <button class="again" id="again" style="display:none" translate="yes">Start over</button>
    </div>
  </div>

  <div class="qwrap"><div class="qcard" id="qcard" style="display:none"></div></div>

  <div class="cap" id="cap">
    <span class="who" id="who">Narrator</span>
    <p id="line" translate="no" aria-live="polite"></p>
    <div class="capbtns">
      <button class="icon" id="repBtn" title="Hear it again" aria-label="Hear it again">🔁</button>
      <button class="icon" id="trBtn" title="Translate this line" aria-label="Translate this line">🌐</button>
    </div>
    <div id="capTr" translate="no"></div>
  </div>

  <div class="ctrl">
    <button class="cbtn" id="prevBtn" translate="yes" data-canary="Back">Back</button>
    <button class="play" id="playBtn" aria-label="Play">▶</button>
    <button class="cbtn" id="nextBtn" translate="yes" data-canary="Next">Next</button>
    <button class="cbtn" id="slowBtn" aria-pressed="false" translate="yes" data-canary="Slow">Slow</button>
    <button class="cbtn" id="ccBtn" aria-pressed="true" translate="yes" data-canary="Captions">Captions</button>
    <button class="cbtn" id="boardBtn" translate="yes" data-canary="Storyboard">Storyboard</button>
    <button class="cbtn" id="ytBtn" translate="yes" data-canary="Your turn">Your turn</button>
    <button class="cbtn" id="fsBtn" title="Full screen for the projector" translate="yes">⛶</button>
    <div class="dots" id="dots"></div>
    <span id="saved" title="Saved"></span>
  </div>
</main>

<section class="yt" id="yt" style="display:none"><div class="ytbox" id="ytBox"></div></section>

<div class="board" id="board" role="dialog" aria-label="Storyboard">
  <div class="board-in">
    <div class="board-head"><h2 translate="yes">Storyboard</h2><button class="btn alt" id="boardClose" translate="yes">Close</button></div>
    <div class="frames" id="frames"></div>
  </div>
</div>

<div class="gate" id="gate">
  <div class="gate-in">
    <h2 translate="yes">Sign in</h2>
    <p translate="yes" style="margin:0;color:#6d6377">Your answers save to your school account.</p>
    <div id="grosterwrap" style="display:none"><label for="groster" translate="yes">Find your name</label><select class="txt" id="groster"></select></div>
    <label for="gname" translate="yes">First and last name</label><input class="txt" id="gname" autocomplete="name">
    <label for="gmail" translate="yes">School email</label><input class="txt" id="gmail" type="email" placeholder="name@s.sfusd.edu" autocomplete="email">
    <label for="gper" translate="yes">Class period</label>
    <select class="txt" id="gper"><option value=""></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
    <p id="gerr"></p>
    <button class="btn" id="gbtn" translate="yes">Start</button>
  </div>
</div>

<p class="foot">Story Reel by Mr. Toby. Tap any word to hear it and see it in your language.</p>

<script>
/* =================== EPISODE 1: THE NEW STUDENT ===================
   Level A = ELD 101. Level B = more descriptive language.
   Lines: who (cast id or 'narrator'), A, B, focus ('wide' | id | [ids]),
          expr, pose, thought, set:{id:{x,face,expr,pose,hold}}, audio (optional mp3 url).
   Questions: {type:'q', kind:'predict'|'check', id, q:{A,B, Ao:[..], Aa:n, Bo:[..], Ba:n}}
   ================================================================== */
window.EP = {
  id: 'ep01', num: 1, title: 'The New Student',
  vocab: ['tall','short','hair','long','straight','curly','wavy','black','brown','glasses','shy','friendly','loud','quiet',
          'athletic','musical','playful','dramatic','nervous','curious','funny','both','but','outgoing','reserved','hijab','artistic'],
  scenes: [
    { bg: 'hallway', alt: 'The school hallway in the morning',
      chars: [ { id: 'linh', x: -260, face: 1, expr: 'nervous' } ],
      lines: [
        { who: 'narrator', focus: 'wide',
          A: 'This is Galileo High School. It is Monday morning.',
          B: 'It is Monday morning at Galileo High School. The hallway is loud and busy.' },
        { who: 'narrator', focus: 'linh', set: { linh: { x: 760 } },
          A: 'This is Linh. She is new. She is from Vietnam.',
          B: 'This is Linh. She moved here from Vietnam two weeks ago. Today is her first day in ELD class.' },
        { who: 'linh', thought: true, expr: 'nervous',
          A: 'I am nervous.',
          B: 'My hands are cold. I feel so nervous.' },
        { who: 'narrator', focus: 'linh',
          A: 'Linh is short. She has long, straight, black hair.',
          B: 'Linh is short and quiet. She has long, straight, black hair.' }
      ] },

    { bg: 'classroom', alt: 'Linh meets Amira in the classroom',
      board: ['ELD 101', 'Talk to every classmate!'],
      chars: [ { id: 'amira', x: 1060, face: -1, expr: 'smile', hold: 'sketchbook' },
               { id: 'linh', x: -260, face: 1, expr: 'nervous' } ],
      lines: [
        { who: 'narrator', focus: 'wide', set: { linh: { x: 560 } },
          A: 'Linh walks into the classroom.',
          B: 'Linh opens the door and steps inside.' },
        { who: 'amira', pose: 'wave', expr: 'happy', focus: ['linh', 'amira'],
          A: 'Hi! I am Amira. What is your name?',
          B: 'Hi! Welcome! I’m Amira. What’s your name?' },
        { who: 'linh', expr: 'shy',
          A: 'My name is Linh.',
          B: 'Um... my name is Linh.' },
        { who: 'amira', pose: 'idle', expr: 'happy',
          A: 'Nice to meet you, Linh!',
          B: 'Nice to meet you, Linh! I love your name.' },
        { who: 'narrator', focus: 'amira',
          A: 'Amira is from Yemen. She wears a hijab. She is friendly. She is loud!',
          B: 'Amira is from Yemen. She is friendly, outgoing, and a little loud. She is artistic, and she carries a sketchbook everywhere.' },
        { who: 'amira', expr: 'smile', focus: ['linh', 'amira'],
          A: 'Today we talk to every classmate. We ask questions!',
          B: 'Today we’re doing a mingle. We walk around, talk to every classmate, and ask a different question.' },
        { type: 'q', kind: 'predict', id: 'q1',
          q: { A: 'What will Linh do?', B: 'What do you think Linh will do?',
               Ao: ['She will talk to her classmates.', 'She will sit alone.', 'She will go home.'],
               Bo: ['She’ll talk to her classmates, even though she’s nervous.', 'She’ll sit alone and wait.', 'She’ll leave the classroom.'] } }
      ] },

    { bg: 'classroom', alt: 'Linh asks Mateo a question',
      board: ['ELD 101', 'Talk to every classmate!', 'Are you ___ or ___?'],
      chars: [ { id: 'linh', x: 460, face: 1, expr: 'shy' },
               { id: 'mateo', x: 960, face: -1, expr: 'happy', hold: 'ball' } ],
      lines: [
        { who: 'narrator', focus: 'wide',
          A: 'Linh sees a tall boy. He has a soccer ball.',
          B: 'Linh walks up to a very tall boy with a soccer ball.' },
        { who: 'linh', expr: 'shy',
          A: 'Hi. Are you tall or short?',
          B: 'Hi. Um... are you tall or short?' },
        { who: 'mateo', expr: 'happy',
          A: 'I am tall! I am very tall!',
          B: 'Tall! Very tall. Everyone asks me that!' },
        { who: 'mateo', expr: 'smile',
          A: 'My name is Mateo. I am from Guatemala. Are you tall or short?',
          B: 'I’m Mateo, from Guatemala. What about you? Are you tall or short?' },
        { who: 'linh', expr: 'happy',
          A: 'I am short!',
          B: 'I’m short! Very short.' },
        { who: 'narrator', focus: ['linh', 'mateo'],
          A: 'Mateo is tall. He has short, curly, black hair. He is athletic. He plays soccer.',
          B: 'Mateo is the tallest student in the class. He has short, curly, black hair, and he is athletic. He plays soccer every day after school.' },
        { type: 'q', kind: 'check', id: 'q2',
          q: { A: 'Who is tall?', B: 'Which sentence is true?',
               Ao: ['Mateo', 'Linh', 'Amira'], Aa: 0,
               Bo: ['Mateo is tall, and he has curly hair.', 'Mateo is short, and he has straight hair.', 'Linh is tall, and she has curly hair.'], Ba: 0 } }
      ] },

    { bg: 'classroom', alt: 'Linh meets Paolo',
      board: ['ELD 101', 'Talk to every classmate!', 'Are you ___ or ___?'],
      chars: [ { id: 'linh', x: 520, face: 1, expr: 'smile' },
               { id: 'paolo', x: 1020, face: -1, expr: 'smile' } ],
      lines: [
        { who: 'linh', expr: 'smile',
          A: 'Hi. Are you friendly or shy?',
          B: 'Hi! Are you friendly or shy?' },
        { who: 'paolo', pose: 'spin', expr: 'happy',
          A: 'Me? I am friendly! And dramatic!',
          B: 'Me? Friendly! Very friendly. And a little dramatic!' },
        { who: 'narrator', focus: 'paolo', set: { paolo: { pose: 'idle' } },
          A: 'This is Paolo. He is from the Philippines. He has wavy, brown hair. He is playful.',
          B: 'This is Paolo. He is from the Philippines. He has wavy, brown hair. He is playful, and he turns every moment into a show.' },
        { who: 'linh', expr: 'happy',
          A: 'You are funny!',
          B: 'You’re really funny!' }
      ] },

    { bg: 'corner', alt: 'Jun in the music corner',
      chars: [ { id: 'jun', x: 1120, face: -1, expr: 'neutral' },
               { id: 'linh', x: -260, face: 1, expr: 'smile' } ],
      lines: [
        { who: 'narrator', focus: 'jun', set: { linh: { x: 660 } },
          A: 'A boy stands in the corner. He has headphones.',
          B: 'In the corner, a quiet boy is listening to music on his headphones.' },
        { who: 'linh', expr: 'smile', focus: ['linh', 'jun'],
          A: 'Hi. Are you musical?',
          B: 'Hi. Excuse me... are you musical?' },
        { who: 'jun', expr: 'smile',
          A: 'Yes! I play the piano.',
          B: 'Yes! I play the piano. I practice every night.' },
        { who: 'narrator', focus: 'jun',
          A: 'This is Jun. He is from China. He has short, black hair and glasses. He is shy, but he is musical.',
          B: 'This is Jun. He is from Guangzhou, China. He has short, black hair and glasses. He is reserved, but when he talks about music, he lights up.' },
        { type: 'q', kind: 'check', id: 'q3',
          q: { A: 'Who has glasses?', B: 'Which words describe Jun?',
               Ao: ['Jun', 'Mateo', 'Paolo'], Aa: 0,
               Bo: ['shy and musical', 'loud and athletic', 'dramatic and playful'], Ba: 0 } }
      ] },

    { bg: 'classroom', alt: 'Everyone together in the classroom',
      board: ['ELD 101', 'Talk to every classmate!'],
      chars: [ { id: 'mateo', x: 250, face: 1, expr: 'smile' },
               { id: 'linh', x: 520, face: 1, expr: 'smile' },
               { id: 'paolo', x: 780, face: 1, expr: 'smile' },
               { id: 'amira', x: 1060, face: -1, expr: 'smile' },
               { id: 'jun', x: 1340, face: -1, expr: 'neutral' } ],
      lines: [
        { who: 'amira', expr: 'happy', focus: ['linh', 'amira'],
          A: 'Linh! What about you? Are you shy?',
          B: 'Linh, your turn! Are you shy?' },
        { who: 'linh', expr: 'shy',
          A: 'Yes. I am shy. But I am curious.',
          B: 'Yes, I’m shy. But I’m also curious. I like to learn about people.' },
        { who: 'amira', expr: 'happy', pose: 'wave',
          A: 'I am not shy. I am loud!',
          B: 'Well, I’m definitely not shy. I’m loud!' },
        { who: 'narrator', focus: 'wide',
          set: { mateo: { expr: 'happy' }, linh: { expr: 'happy' }, paolo: { expr: 'happy' }, amira: { expr: 'happy', pose: 'idle' }, jun: { expr: 'happy' } },
          A: 'Everyone laughs.',
          B: 'Everyone laughs, even Jun.' }
      ] },

    { bg: 'classroom', alt: 'Linh compares herself with Mateo and Amira',
      board: ['ELD 101', 'Compare!', 'both ... but ...'],
      chars: [ { id: 'linh', x: 560, face: 1, expr: 'smile' },
               { id: 'mateo', x: 880, face: -1, expr: 'smile' },
               { id: 'amira', x: 1220, face: -1, expr: 'smile', hold: 'sketchbook' } ],
      lines: [
        { who: 'narrator', focus: 'wide',
          A: 'Now Linh compares. How are they the same? How are they different?',
          B: 'Now it is time to compare. How are Linh and Mateo the same? How are they different?' },
        { who: 'linh', focus: ['linh', 'mateo'],
          A: 'Mateo and I both have black hair.',
          B: 'Mateo and I both have black hair, and we are both new at Galileo.' },
        { who: 'linh', expr: 'happy',
          A: 'But Mateo is tall, and I am short.',
          B: 'But Mateo is tall and athletic, and I am short and quiet.' },
        { who: 'mateo', expr: 'happy',
          A: 'Do you like soccer?',
          B: 'Do you like soccer, too?' },
        { who: 'linh', expr: 'smile',
          A: 'No! I like drawing.',
          B: 'Not really. I like drawing.' },
        { who: 'amira', expr: 'happy', pose: 'wave', focus: ['linh', 'amira'],
          A: 'Me too! We both like drawing!',
          B: 'Me too! We both love drawing!' },
        { type: 'q', kind: 'check', id: 'q4',
          q: { A: 'Linh and Mateo both have ___.', B: 'Complete the sentence: Linh and Amira both ___.',
               Ao: ['black hair', 'curly hair', 'glasses'], Aa: 0,
               Bo: ['like drawing', 'play soccer', 'are tall'], Ba: 0 } }
      ] },

    { bg: 'hallway', alt: 'After class in the hallway',
      chars: [ { id: 'linh', x: 520, face: 1, expr: 'happy' },
               { id: 'amira', x: 800, face: -1, expr: 'happy', hold: 'sketchbook' },
               { id: 'jun', x: 1720, face: -1, expr: 'neutral' } ],
      lines: [
        { who: 'narrator', focus: 'wide',
          A: 'Class is over. Linh is happy.',
          B: 'The bell rings. Linh walks out with a smile.' },
        { who: 'linh', thought: true, expr: 'happy',
          A: 'I am not nervous now.',
          B: 'I’m not nervous anymore. I have new friends.' },
        { who: 'jun', expr: 'surprised', set: { jun: { x: 1120 } }, focus: 'jun',
          A: 'Wait! Where is my backpack?',
          B: 'Wait... where’s my backpack?!' },
        { who: 'narrator', focus: 'wide', set: { linh: { expr: 'surprised' }, amira: { expr: 'surprised' } },
          A: 'To be continued...',
          B: 'To be continued...' }
      ] }
  ],

  yourTurn: {
    A: {
      intro: 'Write about a classmate. Use the sentence starters.',
      prompts: [
        { ask: 'Describe a classmate. Use is and has.', frame: '___ is tall. He / She has ___ hair.' },
        { ask: 'Compare you and your classmate. Use both and but.', frame: '___ and I both ___. But ___.' },
        { ask: 'Describe a character from the story.', frame: 'Jun is ___. He has ___.' }
      ],
      speak: 'Now read sentence 1 to a partner. Do not say the name. Can your partner guess who it is?'
    },
    B: {
      intro: 'Describe and compare. Add details.',
      prompts: [
        { ask: 'Describe a classmate with three details: how they look, their personality, and something they like.', frame: '___ is ___ and ___. She / He has ___. She / He likes ___.' },
        { ask: 'Compare yourself with that classmate. Use both, but, and also.', frame: '___ and I both ___. I also ___. But ___.' },
        { ask: 'Which character in the story is most like you? Why?', frame: 'I am like ___ because we are both ___.' }
      ],
      speak: 'Read your description aloud without the name. Your partner guesses who it is. Then switch.'
    }
  }
};
window.GAL_META = { title: 'Story Reel 1: The New Student', unit: 'Story Reel', skills: ['listening', 'describing-people', 'compare-contrast'] };
</script>
