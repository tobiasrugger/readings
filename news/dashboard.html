<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This Week's Reading — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pine:#1d4d3f;--paper:#fbfaf6;--ink:#22241f;--rule:#dcd9cf;--ok:#15803d;--no:#b91c1c;--mid:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-size:17px;margin:0;font-weight:800;flex:1;min-width:150px}
select,input{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:7px;border:1px solid var(--rule)}
.bar select{border:0}
.btn{font-family:inherit;font-size:14px;font-weight:700;padding:7px 13px;border-radius:8px;border:0;background:#fff;color:var(--pine);cursor:pointer}
.btn.line{background:#fff;color:var(--pine);border:1.5px solid var(--pine)}
.btn.line:hover{background:var(--pine);color:#fff}
main{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
.gate{max-width:340px;margin:80px auto;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:20px}
.gate input{width:100%;margin:8px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--rule);background:#fff;border-radius:99px;padding:7px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.tabs button.sel{background:var(--pine);color:#fff;border-color:var(--pine)}
.pane{display:none}.pane.sel{display:block}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:24px}.stat span{color:#7a8075;font-size:13px}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule);border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{background:#eceadf;font-size:13px;cursor:pointer}
tr.row{cursor:pointer}tr.row:hover{background:#f6f5ef}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-weight:800;font-size:13px}
.g{background:#dcfce7;color:var(--ok)}.y{background:#fef3c7;color:var(--mid)}.r{background:#fee2e2;color:var(--no)}.n{background:#eee;color:#888}
tr.detail td{white-space:normal;background:#fbfaf6;padding:14px 18px}
.qa{margin:0 0 12px}.qa .q{font-weight:700;color:#4a5048}.qa .a{margin-top:3px;white-space:pre-wrap}
.empty{color:#aaa;font-style:italic}
h4{margin:16px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--pine)}
audio{height:34px;vertical-align:middle}
.muted{color:#7a8075;font-size:14px}
/* matrix */
#mtx th,#mtx td{border:1px solid var(--rule);padding:6px 8px;font-size:14px}
#mtx th.art{white-space:normal;min-width:118px;max-width:150px;font-size:12px;line-height:1.3;vertical-align:bottom}
#mtx td.cell{text-align:center;font-weight:800}
#mtx td.nm{white-space:normal;min-width:150px}
#mtx td.tot{text-align:center;font-weight:800;background:#f4f6f4}
.legend{font-size:13px;color:#6d736b;margin:10px 0 0;line-height:1.7}
.sig{border-bottom:1px solid #999;display:inline-block;width:110px}
@media print{
  @page{size:landscape;margin:12mm}
  .bar,.tabs,.gate,.btn,.muted,.stats{display:none!important}
  body{background:#fff;font-size:11px}
  main{max-width:none;padding:0}
  .pane{display:none!important}
  .pane.sel{display:block!important}
  .wrap{border:0;overflow:visible}
  #mtx th,#mtx td{padding:4px 5px;font-size:10px}
  #mtx th.art{font-size:9px}
  .printhead{display:block!important}
  .legend{display:block!important;font-size:9px}
}
.printhead{display:none;margin-bottom:8px}
.printhead b{font-size:15px}
</style>
</head>
<body>

<div class="bar">
  <h1>This Week's Reading — Dashboard</h1>
  <select id="per"><option value="">All periods</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
  <button class="btn" id="reload">Refresh</button>
  <button class="btn" id="csv">CSV</button>
  <button class="btn" id="print">Print</button>
</div>

<div class="gate" id="gate">
  <b>Teacher password</b>
  <input type="password" id="pw">
  <button class="btn" style="background:var(--pine);color:#fff" id="go">Open</button>
</div>

<main id="main" style="display:none">
  <div class="tabs" id="tabs">
    <button data-p="one" class="sel">One article</button>
    <button data-p="all">All articles</button>
  </div>

  <section class="pane sel" id="p-one">
    <div style="margin-bottom:12px"><select id="art"></select></div>
    <div class="stats" id="stats"></div>
    <div class="wrap"><table id="tbl"></table></div>
    <p class="muted" style="margin-top:10px"><a href="../fluency/dashboard.html">Full fluency dashboard &rarr;</a> &nbsp;·&nbsp; Tap a student to see every answer and play recordings.</p>
  </section>

  <section class="pane" id="p-all">
    <div class="printhead" id="ph"></div>
    <div class="wrap"><table id="mtx"></table></div>
    <p class="legend" id="legend"></p>
    <p class="muted" style="margin-top:10px">Each cell counts five parts: questions, grammar, your turn, talk chart, recording. Tap a column header to sort.</p>
  </section>
</main>

<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var BUCKET='fluency-recordings';
var PW='galileo2026';
var H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};

var ARTS=[],DOCS={},WORK=[],RUNS=[],OVER={},ROWS=[],SORT='name',OPEN='',MSORT='name',VIEW='one';

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function get(p){return fetch(SUPA_URL+'/rest/v1/'+p,{headers:H}).then(function(r){return r.json();});}
function when(t){if(!t)return '';var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate();}
function stamp(t){if(!t)return '';var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}

/* ---------- document parser ---------- */
function parseDoc(txt){
  var out={meta:{},read:[],reads:{},gram:{note:'',bank:[],practice:[],produce:''},talk:{cols:[],rows:[],frames:[]},qs:[],record:''};
  var parts=String(txt||'').split(/^\s*---([A-Z]+)(?::([A-Z]))?---\s*$/m);
  (parts[0]||'').split(/\n/).forEach(function(l){
    var m=l.match(/^([A-Z_]+):\s*(.*)$/); if(m) out.meta[m[1]]=m[2].trim();
  });
  for(var i=1;i<parts.length;i+=3){
    var name=parts[i], lv=parts[i+1]||'', body=(parts[i+2]||'').trim();
    if(name==='READ'){
      out.reads[lv||'B']=body.split(/\n\s*\n/).map(function(s){return s.trim();}).filter(Boolean);
    } else if(name==='GRAMMAR'){
      body.split(/\n/).forEach(function(l){
        var m;
        if(m=l.match(/^NOTE:\s*(.*)/)) out.gram.note+=(out.gram.note?'<br>':'')+m[1];
        else if(m=l.match(/^BANK:\s*(.*)/)) out.gram.bank=m[1].split(/,/).map(function(s){return s.trim();}).filter(Boolean);
        else if(m=l.match(/^PRACTICE:\s*(.*)/)){
          var b=m[1].split('||');
          out.gram.practice.push({s:b[0].trim(),a:(b[1]||'').split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean)});
        }
        else if(m=l.match(/^PRODUCE:\s*(.*)/)) out.gram.produce=m[1];
      });
    } else if(name==='TALK'){
      body.split(/\n/).forEach(function(l){
        var m;
        if(m=l.match(/^COLS:\s*(.*)/)) out.talk.cols=m[1].split('|').map(function(s){return s.trim();});
        else if(m=l.match(/^ROW:\s*(.*)/)) out.talk.rows.push(m[1].split('|').map(function(s){return s.trim();}));
        else if(m=l.match(/^FRAME:\s*(.*)/)) out.talk.frames.push(m[1]);
      });
    } else if(name==='QUESTIONS'){
      body.split(/\n/).forEach(function(l){var m=l.match(/^Q:\s*(.*)/); if(m) out.qs.push(m[1]);});
    } else if(name==='RECORD'){ out.record=body; }
  }
  var lvs=Object.keys(out.reads);
  out.read=out.reads[lvs.indexOf('B')>=0?'B':lvs[0]]||[];
  return out;
}
function plain(s){
  return String(s==null?'':s)
    .replace(/\[\[(.+?)\|.+?\]\]/g,'$1')
    .replace(/\(\((.+?)\)\)/g,'$1')
    .replace(/\{\{([\s\S]+?)\}\}/g,'$1');
}

/* ---------- load ---------- */
$('go').onclick=function(){
  if($('pw').value!==PW){alert('Wrong password.');return;}
  sessionStorage.setItem('news_dash','1');open_();
};
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click();});
if(sessionStorage.getItem('news_dash'))open_();
function open_(){$('gate').style.display='none';$('main').style.display='block';load();}
$('reload').onclick=load;
$('per').onchange=function(){draw();matrix();};
$('art').onchange=function(){OPEN='';draw();};
$('print').onclick=function(){window.print();};
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  VIEW=b.dataset.p;
  [].forEach.call($('tabs').children,function(x){x.classList.remove('sel');});
  b.classList.add('sel');
  [].forEach.call(document.querySelectorAll('.pane'),function(x){x.classList.remove('sel');});
  $('p-'+VIEW).classList.add('sel');
});

function load(){
  $('tbl').innerHTML='<tr><td class="muted">Loading…</td></tr>';
  Promise.all([
    get('news_articles?select=slug,title,week_of,published,doc&order=week_of.asc.nullslast,updated_at.asc'),
    get('news_work?select=*'),
    get('fluency_runs?select=*&passage_slug=like.news-*&order=created_at.asc'),
    get('news_student_level?select=email,level')
  ]).then(function(r){
    ARTS=(r[0]||[]).filter(function(a){return a.published;});
    DOCS={};ARTS.forEach(function(a){DOCS[a.slug]=parseDoc(a.doc);});
    WORK=r[1]||[];RUNS=r[2]||[];
    OVER={};(r[3]||[]).forEach(function(x){OVER[x.email]=x.level;});
    $('art').innerHTML=ARTS.slice().reverse().map(function(a){
      return '<option value="'+esc(a.slug)+'">'+esc(a.title||a.slug)+(a.week_of?' ('+esc(a.week_of)+')':'')+'</option>';
    }).join('');
    build();draw();matrix();
  }).catch(function(){$('tbl').innerHTML='<tr><td class="muted">Could not load.</td></tr>';});
}

/* ---------- people ---------- */
function build(){
  var by={};
  function seed(em,nm,pd){
    if(!by[em]) by[em]={email:em,name:nm||'',period:pd||'',work:{},runs:{},updated:''};
    if(!by[em].name&&nm) by[em].name=nm;
    if(!by[em].period&&pd) by[em].period=pd;
  }
  WORK.forEach(function(w){
    seed(w.email,w.name,w.period);
    by[w.email].work[w.slug]=w;
    if((w.updated_at||'')>by[w.email].updated) by[w.email].updated=w.updated_at||'';
  });
  RUNS.forEach(function(r){
    seed(r.email,r.student_name,r.period);
    var slug=String(r.passage_slug||'').replace(/^news-/,'');
    (by[r.email].runs[slug]=by[r.email].runs[slug]||[]).push(r);
    if((r.created_at||'')>by[r.email].updated) by[r.email].updated=r.created_at||'';
  });
  ROWS=Object.keys(by).map(function(k){return by[k];});
}
function rows(){
  var p=$('per').value;
  return ROWS.filter(function(r){return !p||String(r.period)===p;});
}

/* ---------- completion ---------- */
function parts(person,slug){
  var A=DOCS[slug]; if(!A) return null;
  var w=person.work[slug], a=(w&&w.answers)||{}, runs=person.runs[slug]||[];
  var qTot=A.qs.length, qDone=A.qs.filter(function(_,i){return (a['q'+i]||'').trim().length>2;}).length;
  var cTot=A.gram.practice.length, cDone=A.gram.practice.filter(function(_,i){return (a['c'+i]||'').trim();}).length;
  var cRight=0;
  A.gram.practice.forEach(function(p,i){ if(p.a.indexOf((a['c'+i]||'').trim().toLowerCase())>=0) cRight++; });
  var talk=Object.keys(a).filter(function(k){return /^t\d/.test(k)&&(a[k]||'').trim();}).length;
  var o={qDone:qDone,qTot:qTot,cDone:cDone,cTot:cTot,cRight:cRight,
    prod:(a.produce||'').trim().length>5, talk:talk, runs:runs.length,
    bestWcpm:runs.reduce(function(m,r){return Math.max(m,+r.wcpm||0);},0),
    level:(w&&w.level)||'', turned:a._turnedIn||'', updated:(w&&w.updated_at)||''};
  o.done=(qTot?(qDone/qTot>=0.8?1:0):1)+(cTot?(cDone/cTot>=0.8?1:0):1)+(o.prod?1:0)+(talk?1:0)+(runs.length?1:0);
  o.any=qDone||cDone||o.prod||talk||runs.length;
  return o;
}

/* ---------- view: one article ---------- */
function pill(n,d){
  if(!d)return '<span class="pill n">—</span>';
  var f=n/d,c=f>=0.99?'g':(f>=0.5?'y':'r');
  return '<span class="pill '+c+'">'+n+'/'+d+'</span>';
}
function draw(){
  var slug=$('art').value; if(!slug){$('tbl').innerHTML='<tr><td class="muted">No articles published.</td></tr>';return;}
  var rs=rows().slice();
  rs.sort(function(a,b){
    var pa=parts(a,slug)||{},pb=parts(b,slug)||{};
    if(SORT==='period')return String(a.period).localeCompare(String(b.period))||(a.name||'').localeCompare(b.name||'');
    if(SORT==='wpm')return (pb.bestWcpm||0)-(pa.bestWcpm||0);
    if(SORT==='updated')return String(pb.updated||'').localeCompare(String(pa.updated||''));
    return (a.name||a.email).localeCompare(b.name||b.email);
  });
  var turned=0,withRec=0,wpms=[];
  rs.forEach(function(r){var p=parts(r,slug);if(!p)return;if(p.turned)turned++;if(p.runs){withRec++;wpms.push(p.bestWcpm);}});
  wpms.sort(function(a,b){return a-b;});
  $('stats').innerHTML=
    '<div class="stat"><b>'+rs.length+'</b><span>students</span></div>'+
    '<div class="stat"><b>'+turned+'</b><span>turned in</span></div>'+
    '<div class="stat"><b>'+withRec+'</b><span>sent a recording</span></div>'+
    '<div class="stat"><b>'+(wpms.length?wpms[Math.floor(wpms.length/2)]:'—')+'</b><span>median wcpm</span></div>';
  var h='<tr><th data-s="name">Student</th><th data-s="period">Per.</th><th>Level</th><th>Questions</th><th>Grammar</th>'+
        '<th>Your turn</th><th>Talk chart</th><th data-s="wpm">Recording</th><th>Turned in</th><th data-s="updated">Last active</th></tr>';
  if(!rs.length) h+='<tr><td colspan="10" class="empty">No work yet for this article.</td></tr>';
  rs.forEach(function(r){
    var p=parts(r,slug)||{};
    h+='<tr class="row" data-e="'+esc(r.email)+'"><td><b>'+esc(r.name||'(no name)')+'</b><br><span class="muted">'+esc(r.email)+'</span></td>'+
      '<td>'+esc(r.period)+'</td>'+
      '<td><select class="lvSel" data-e="'+esc(r.email)+'">'+
        ['','A','B','C'].map(function(k){
          var on=(OVER[r.email]||'')===k;
          return '<option value="'+k+'"'+(on?' selected':'')+'>'+(k||(p.level?p.level+' (chose)':'\u2014'))+'</option>';
        }).join('')+'</select></td>'+
      '<td>'+pill(p.qDone||0,p.qTot||0)+'</td>'+
      '<td>'+pill(p.cRight||0,p.cTot||0)+'</td>'+
      '<td>'+(p.prod?'<span class="pill g">done</span>':'<span class="pill r">no</span>')+'</td>'+
      '<td>'+(p.talk?'<span class="pill g">'+p.talk+' cells</span>':'<span class="pill r">empty</span>')+'</td>'+
      '<td>'+(p.runs?'<b>'+p.bestWcpm+'</b> wcpm <span class="muted">\u00d7'+p.runs+'</span>':'<span class="pill n">none</span>')+'</td>'+
      '<td>'+(p.turned?'<span class="pill g">'+stamp(p.turned)+'</span>':'')+'</td>'+
      '<td class="muted">'+stamp(p.updated)+'</td></tr>';
    if(OPEN===r.email) h+='<tr class="detail"><td colspan="10">'+detail(r,slug)+'</td></tr>';
  });
  $('tbl').innerHTML=h;
}
function ans(v){v=(v||'').trim();return v?esc(v):'<span class="empty">(blank)</span>';}
function detail(person,slug){
  var A=DOCS[slug],w=person.work[slug],a=(w&&w.answers)||{},h='';
  h+='<h4>Questions</h4>';
  A.qs.forEach(function(q,i){h+='<div class="qa"><div class="q">'+(i+1)+'. '+esc(plain(q))+'</div><div class="a">'+ans(a['q'+i])+'</div></div>';});
  h+='<h4>Grammar practice</h4>';
  A.gram.practice.forEach(function(p,i){
    var v=(a['c'+i]||'').trim(),ok=p.a.indexOf(v.toLowerCase())>=0;
    h+='<div class="qa">'+esc(plain(p.s)).replace(/_{2,}/,'<b style="color:'+(v?(ok?'var(--ok)':'var(--no)'):'#aaa')+'">'+(v?esc(v):'____')+'</b>')+
       (v&&!ok?' <span class="muted">(expected: '+esc(p.a.join(' / '))+')</span>':'')+'</div>';
  });
  if(A.gram.produce) h+='<h4>Your turn</h4><div class="qa"><div class="q">'+esc(plain(A.gram.produce))+'</div><div class="a">'+ans(a.produce)+'</div></div>';
  var tk=Object.keys(a).filter(function(k){return /^t\d/.test(k)&&(a[k]||'').trim();});
  if(tk.length){
    h+='<h4>Talk chart — what they got from their partner</h4>';
    tk.forEach(function(k){
      var m=k.match(/^t(\d+)_(\d+)$/),row=(A.talk.rows[+m[1]]||[]),col=A.talk.cols[+m[2]]||'';
      h+='<div class="qa"><span class="q">'+esc(row[0]||'')+' \u00b7 '+esc(col)+':</span> '+esc(a[k])+'</div>';
    });
  }
  h+='<h4>Recordings</h4>';
  var runs=person.runs[slug]||[];
  if(!runs.length) h+='<div class="empty">None yet.</div>';
  runs.forEach(function(x){
    h+='<div class="qa"><audio controls preload="none" data-p="'+esc(x.audio_path)+'" src="'+SUPA_URL+'/storage/v1/object/public/'+BUCKET+'/'+esc(x.audio_path)+'"></audio> '+
       '<b>'+(x.wcpm||'?')+' wcpm</b> <span class="muted">'+(x.accuracy||'?')+'% accuracy \u00b7 '+(x.errors||0)+' missed \u00b7 '+
       (x.attempt==='cold'?'first read':'after practice')+' \u00b7 '+stamp(x.created_at)+'</span></div>';
  });
  return h;
}
document.addEventListener('error',function(e){
  var el=e.target;if(el.tagName!=='AUDIO'||el.dataset.signed)return;el.dataset.signed='1';
  fetch(SUPA_URL+'/storage/v1/object/sign/'+BUCKET+'/'+el.dataset.p,{method:'POST',headers:H,body:JSON.stringify({expiresIn:3600})})
  .then(function(r){return r.json();}).then(function(j){if(j.signedURL)el.src=SUPA_URL+'/storage/v1'+j.signedURL;});
},true);
$('tbl').addEventListener('change',function(e){
  var sel=e.target.closest('.lvSel');if(!sel)return;
  var em=sel.dataset.e,lv=sel.value;
  if(lv){
    OVER[em]=lv;
    fetch(SUPA_URL+'/rest/v1/news_student_level?on_conflict=email',{method:'POST',
      headers:Object.assign({},H,{'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify({email:em,level:lv,updated_at:new Date().toISOString()})}).catch(function(){});
  } else {
    delete OVER[em];
    fetch(SUPA_URL+'/rest/v1/news_student_level?email=eq.'+encodeURIComponent(em),{method:'DELETE',headers:H}).catch(function(){});
  }
});
$('tbl').addEventListener('click',function(e){
  if(e.target.closest('.lvSel'))return;
  var th=e.target.closest('th');if(th&&th.dataset.s){SORT=th.dataset.s;draw();return;}
  if(e.target.closest('audio'))return;
  var tr=e.target.closest('tr.row');if(!tr)return;
  OPEN=OPEN===tr.dataset.e?'':tr.dataset.e;draw();
});

/* ---------- view: all articles ---------- */
function cellClass(d){return d>=5?'g':(d>=3?'y':(d>0?'r':'n'));}
function matrix(){
  var rs=rows().slice();
  rs.sort(function(a,b){
    if(MSORT==='period')return String(a.period).localeCompare(String(b.period))||(a.name||'').localeCompare(b.name||'');
    if(MSORT==='total'){
      var ta=0,tb=0;
      ARTS.forEach(function(x){var p=parts(a,x.slug),q=parts(b,x.slug);ta+=p?p.done:0;tb+=q?q.done:0;});
      return tb-ta;
    }
    return (a.name||a.email).localeCompare(b.name||b.email);
  });
  var p=$('per').value;
  $('ph').innerHTML='<b>This Week\u2019s Reading \u2014 completion</b><br>'+
    (p?'Period '+esc(p):'All periods')+' \u00b7 printed '+new Date().toLocaleDateString()+
    ' \u00b7 Checked by: <span class="sig"></span>';
  var h='<tr><th data-m="name">Student</th><th data-m="period">Per.</th>';
  ARTS.forEach(function(a){
    h+='<th class="art">'+esc(a.title||a.slug)+(a.week_of?'<br><span class="muted">'+esc(a.week_of)+'</span>':'')+'</th>';
  });
  h+='<th data-m="total">Total</th><th style="min-width:90px">Grade</th></tr>';
  if(!rs.length) h+='<tr><td colspan="'+(ARTS.length+4)+'" class="empty">Nobody has started yet.</td></tr>';
  rs.forEach(function(r){
    var tot=0;
    h+='<tr><td class="nm"><b>'+esc(r.name||'(no name)')+'</b></td><td>'+esc(r.period)+'</td>';
    ARTS.forEach(function(a){
      var pr=parts(r,a.slug);
      var d=pr?pr.done:0;
      tot+=d;
      h+='<td class="cell"><span class="pill '+cellClass(d)+'">'+d+'/5</span></td>';
    });
    h+='<td class="tot">'+tot+'/'+(ARTS.length*5)+'</td><td></td></tr>';
  });
  $('mtx').innerHTML=h;
  $('legend').innerHTML='Each article is scored out of five parts: questions answered, grammar practice attempted, "your turn" writing, talk chart filled, recording sent. '+
    '<b>5/5</b> complete \u00b7 <b>3\u20134</b> partly done \u00b7 <b>1\u20132</b> barely started \u00b7 <b>0</b> nothing.';
}
$('mtx').addEventListener('click',function(e){
  var th=e.target.closest('th');if(th&&th.dataset.m){MSORT=th.dataset.m;matrix();}
});

/* ---------- csv ---------- */
$('csv').onclick=function(){
  var lines=[];
  if(VIEW==='all'){
    var head=['name','email','period'];
    ARTS.forEach(function(a){head.push((a.title||a.slug)+' (of 5)');});
    head.push('total','possible');
    lines.push(head);
    rows().forEach(function(r){
      var row=[r.name,r.email,r.period],tot=0;
      ARTS.forEach(function(a){var p=parts(r,a.slug),d=p?p.done:0;tot+=d;row.push(d);});
      row.push(tot,ARTS.length*5);
      lines.push(row);
    });
  } else {
    var slug=$('art').value,A=DOCS[slug]||{qs:[]};
    var head=['name','email','period','level','questions_done','grammar_right','your_turn','talk_cells','recordings','best_wcpm','turned_in','last_active'];
    A.qs.forEach(function(_,i){head.push('Q'+(i+1));});
    head.push('your_turn_text');
    lines.push(head);
    rows().forEach(function(r){
      var p=parts(r,slug)||{},w=r.work[slug],a=(w&&w.answers)||{};
      var row=[r.name,r.email,r.period,p.level||'',p.qDone||0,p.cRight||0,p.prod?'yes':'no',p.talk||0,p.runs||0,p.bestWcpm||'',p.turned||'',p.updated||''];
      A.qs.forEach(function(_,i){row.push(a['q'+i]||'');});
      row.push(a.produce||'');
      lines.push(row);
    });
  }
  var csv=lines.map(function(l){return l.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a2=document.createElement('a');
  a2.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a2.download=VIEW==='all'?'news_all_articles.csv':('news_'+$('art').value+'.csv');
  a2.click();
};
</script>
</body>
</html>
