<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher's Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Caveat:wght@600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2016;--green:#2e9a57;--yellow:#e9b928;--red:#e0685f;--line:2px solid #2b2016}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#3a2a1c;min-height:100vh}
h1{font-family:Lora,Georgia,serif;margin:0;font-size:1.35rem}
.top{position:sticky;top:0;z-index:20;background:#1f1610;color:#f3ecd9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px 10px 180px;border-bottom:3px solid #000}
.top .per{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.top button{font:inherit;font-weight:900;border:2px solid #f3ecd9;background:transparent;color:#f3ecd9;border-radius:9px;padding:5px 12px;cursor:pointer}
.top button.on{background:#f3c34a;color:#1f1610;border-color:#f3c34a}
.top .sub{font-size:.85rem;color:#d8ccb4;width:100%}
.desk{margin:16px;min-height:calc(100vh - 120px);border:6px solid #2a1b10;border-radius:18px;box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 8px 0 #22160d;position:relative;padding:22px 18px 60px;
 background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 46px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 9px),
  radial-gradient(ellipse at 30% 20%,#a06b3e 0%,#8a5a32 45%,#6e4526 100%)}
.props{position:absolute;right:18px;top:12px;pointer-events:none;opacity:.95}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 26px;position:relative}
.station{position:relative;padding-top:6px}
.piles{display:flex;gap:16px;justify-content:center;align-items:flex-end;min-height:205px;padding-top:30px}
.pile{position:relative;width:128px;height:176px;cursor:pointer;background:none;border:0;padding:0}
.pile .sh{position:absolute;left:0;top:0;width:118px;height:150px;border:1.5px solid rgba(43,32,22,.55);border-radius:3px;box-shadow:1px 2px 2px rgba(0,0,0,.25)}
.pile .face{position:absolute;left:0;top:0;width:118px;height:150px;border:2px solid #2b2016;border-radius:3px;padding:6px 6px 4px;overflow:hidden;text-align:left;box-shadow:2px 3px 4px rgba(0,0,0,.35)}
.pile .face b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.pile .nm{display:block;font-weight:900;font-size:.86rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 2px #fff}
.pile .cnt{position:absolute;right:-8px;top:-10px;background:#1f1610;color:#fff;border:2px solid #fff;border-radius:999px;font-weight:900;font-size:.9rem;min-width:30px;height:30px;line-height:26px;text-align:center;z-index:5}
.pile.empty .face{background:transparent!important;border-style:dashed;border-color:rgba(255,255,255,.5);color:#f3ecd9}
.pile:hover .face{transform:translateY(-3px)}
.lab{font-size:.74rem;font-weight:900;color:#f3ecd9;text-align:center;margin-top:4px;text-shadow:0 1px 2px #000}
.tape{display:block;margin:8px auto 0;max-width:290px;background:rgba(238,226,190,.93);border-left:3px dashed rgba(0,0,0,.08);border-right:3px dashed rgba(0,0,0,.08);transform:rotate(-1.5deg);padding:5px 12px;font-family:Caveat,cursive;font-weight:700;font-size:1.45rem;line-height:1.1;text-align:center;box-shadow:0 2px 3px rgba(0,0,0,.35);color:#2b2016}
.tape small{display:block;font-family:Nunito,sans-serif;font-size:.72rem;font-weight:800;color:#6b5c46}
.pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:.72rem;font-weight:900;background:#f3c34a;border:2px solid #1f1610;border-radius:6px;padding:0 6px;z-index:6}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:0 0 18px;color:#f3ecd9;font-weight:800;font-size:.9rem}
.legend i{display:inline-block;width:16px;height:20px;border:1.5px solid #2b2016;border-radius:2px;vertical-align:middle;margin-right:5px}
.msg{color:#f3ecd9;font-weight:800;font-size:1.1rem;text-align:center;margin:60px 0}
/* spread */
.ov{position:fixed;inset:0;background:rgba(20,14,9,.88);z-index:50;display:none;overflow:auto;padding:80px 18px 30px}
.ov.on{display:block}
.ovbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;gap:10px;align-items:center;background:#1f1610;color:#f3ecd9;padding:9px 14px 9px 180px;border-bottom:3px solid #000;flex-wrap:wrap}
.ovbar .t{font-family:Lora,serif;font-weight:700;font-size:1.05rem;margin-right:auto}
.btn{font:inherit;font-weight:900;border:2px solid #2b2016;background:#fffaf0;color:#2b2016;border-radius:10px;padding:6px 14px;cursor:pointer}
.btn.dk{background:#f3c34a}
.sheets{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.sheet{width:132px;height:170px;border:2px solid #2b2016;border-radius:3px;box-shadow:3px 4px 6px rgba(0,0,0,.45);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font:inherit;color:#2b2016;
 background-image:repeating-linear-gradient(transparent 0 17px,rgba(0,0,0,.08) 17px 18px)}
.sheet:nth-child(3n){transform:rotate(-2deg)}.sheet:nth-child(3n+1){transform:rotate(1.5deg)}
.sheet:hover{transform:scale(1.05) rotate(0)}
.sheet .n{font-weight:900;font-size:1.15rem;line-height:1.1}
.sheet .p{font-weight:900;font-size:1.6rem}
.sheet .s{font-size:.75rem;font-weight:800}
.grp{width:100%;color:#f3ecd9;font-weight:900;margin:8px 0 0;font-size:1rem}
.c-r{background-color:#f6b8b0}.c-y{background-color:#f7df8a}.c-g{background-color:#a9dfb9}
.t-r{color:#a3241a}.t-y{color:#7a5a00}.t-g{color:#16683a}
/* viewer */
.vw{position:fixed;inset:0;z-index:70;background:#fffaf0;display:none;flex-direction:column}
.vw.on{display:flex}
.vw .ovbar{position:static}
.vw iframe{flex:1;border:0;width:100%;background:#fff}
.chip{display:inline-block;border:2px solid #f3ecd9;border-radius:8px;padding:2px 9px;font-weight:900}
.gate{position:fixed;inset:0;background:rgba(20,14,9,.9);display:flex;align-items:center;justify-content:center;z-index:90}
.gbox{background:#fffaf0;border:3px solid #000;border-radius:14px;padding:18px;max-width:340px;width:100%}
.gbox input{width:100%;font:inherit;padding:8px;border:2px solid #2b2016;border-radius:8px;margin:8px 0}
.err{color:#b0281e;font-weight:800;min-height:1.2em}
@media(max-width:640px){.top,.ovbar{padding-left:14px;padding-top:52px}.stations{grid-template-columns:1fr}}
</style></head><body>
<div class="gate" id="gate"><form class="gbox" id="gform"><h1>Teacher's Desk</h1><input id="pw" type="password" placeholder="Password" autofocus><p class="err" id="perr"></p><button class="btn dk" type="submit" style="width:100%">Open the desk</button></form></div>
<div class="top">
  <h1>🗂️ Teacher's Desk</h1>
  <div class="per" id="per"></div>
  <div class="sub" id="sub">Pick a period. Each strip of tape is one assignment; the piles above it are your students' sheets. Tap a pile to spread it out, tap a sheet to read that student's work.</div>
</div>
<div class="desk" id="desk">
  <svg class="props" width="150" height="90" viewBox="0 0 150 90" aria-hidden="true"><ellipse cx="40" cy="70" rx="30" ry="9" fill="rgba(0,0,0,.25)"/><path d="M18 30 h44 v34 q0 8 -8 8 h-28 q-8 0 -8 -8z" fill="#f3ecd9" stroke="#2b2016" stroke-width="2"/><path d="M62 38 q14 0 12 12 q-2 8 -12 6" fill="none" stroke="#2b2016" stroke-width="3"/><ellipse cx="40" cy="31" rx="22" ry="4" fill="#5a3418"/><text x="40" y="58" font-family="Lora,serif" font-weight="700" font-size="10" text-anchor="middle" fill="#a8261c">ELD</text><g transform="translate(110 40) rotate(-35)"><rect x="-4" y="-34" width="8" height="64" fill="#f3c34a" stroke="#2b2016" stroke-width="1.5"/><path d="M-4 30 l4 10 l4 -10z" fill="#e8c9a0" stroke="#2b2016" stroke-width="1.5"/><rect x="-4" y="-40" width="8" height="7" fill="#e07a8a" stroke="#2b2016" stroke-width="1.5"/></g></svg>
  <div class="legend"><span><i style="background:#f6b8b0"></i>Not finished (under 70%)</span><span><i style="background:#f7df8a"></i>Almost (70%+)</span><span><i style="background:#a9dfb9"></i>Done</span><span>⭐ = you pushed it</span></div>
  <div class="stations" id="stations"><p class="msg">Pick a period above.</p></div>
</div>
<div class="ov" id="ov"><div class="ovbar"><span class="t" id="ovT"></span><button class="btn dk" id="ovBack">← Back to desk</button></div><div class="sheets" id="sheets"></div></div>
<div class="vw" id="vw"><div class="ovbar"><button class="btn dk" id="vwBack">← Back to desk</button><button class="btn" id="vwPile">▦ The pile</button><span class="t" id="vwT"></span><button class="btn" id="vwWork">Their work</button><button class="btn" id="vwPage">My Page</button><button class="btn" id="vwPrev">◀ Prev</button><button class="btn dk" id="vwNext">Next ▶</button></div><iframe id="vwF" title="Student work"></iframe></div>
<script>
/* T-142 v1 — Teacher's Desk v1 (ELD 103 chat c1e00dcf, Oct 27). READ-ONLY: reads students,
   class_assignments and gradebook_best; writes nothing. Pushing from the desk and "extra"
   sheets are v2/v3 (see the task ledger, T-142). */
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PASS='galileo2026', RECENT_DAYS=21, MAX_STATIONS=12;
/* the story guides have their own dashboards that can open one student (?email=&guide=) */
var WORK={'landlady':['landlady/dashboard.html','landlady'],'landlady-easy':['landlady/dashboard.html','landlady_easy'],'landlady-hard':['landlady/dashboard.html','landlady_hard'],
  'landlady/investigate':['landlady/investigate/dashboard.html',''],'telltale':['telltale/dashboard.html','telltale'],'monkeyspaw':['monkeyspaw/dashboard.html','monkeyspaw']};
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(x){var h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};for(var k in x)h[k]=x[k];return h;}
function getAll(path){var out=[],from=0,step=1000;function next(){return fetch(SUPA_URL+'/rest/v1/'+path,{headers:H({Range:from+'-'+(from+step-1),'Range-Unit':'items'})}).then(function(r){return r.ok?r.json():[];}).then(function(rows){out=out.concat(rows||[]);if(rows&&rows.length===step){from+=step;return next();}return out;});}return next();}
function lp(e){return String(e||'').trim().toLowerCase().split('@')[0];}
function slugOf(href){var p=String(href||'').split('?')[0].split('#')[0];return p.replace(/^https?:\/\/[^/]+/,'').replace(/^\/?readings\//,'').replace(/\/index\.html?$/,'').replace(/\.html?$/,'').replace(/\/+$/,'');}
function band(c){ if(!c)return 'r'; var p=c.pct; if(p==null) return c.completion?'g':'y'; p=+p; return p>=100?'g':p>=70?'y':'r'; }
function pctTxt(c){ if(!c)return 'not started'; if(c.pct==null) return c.completion?'done':'started'; return Math.round(+c.pct)+'%'; }

var STU=[], BEST={}, PUSH=[], cur=null, STATIONS=[], ORDER=[], at=0, curSt=null, mode='work';

function gate(){
  try{ if(sessionStorage.getItem('gb_ok')==='1'||sessionStorage.getItem('gal_teacher')==='1'){unlock();return;} }catch(e){}
  $('gform').onsubmit=function(e){e.preventDefault();if($('pw').value===PASS)unlock();else $('perr').textContent='Not right.';};
}
function unlock(){
  /* the story dashboards opened inside the viewer check their own keys — set them so they open straight away */
  try{['gb_ok','gal_teacher','landlady_dash','telltale_dash','monkeyspaw_dash','lli_t'].forEach(function(k){sessionStorage.setItem(k,'1');});}catch(e){}
  $('gate').style.display='none'; load();
}
function load(){
  $('stations').innerHTML='<p class="msg">Laying out the papers…</p>';
  var now=new Date().toISOString();
  Promise.all([
    getAll('students?select=email,first_name,last_name,period'),
    getAll('gradebook_best?select=email,slug,title,pct,attempts,last_at,completion'),
    getAll('class_assignments?area=eq.site&or=(expires_at.is.null,expires_at.gt.'+encodeURIComponent(now)+')&select=period,href,title,created_at&order=created_at.desc')
  ]).then(function(r){
    var seen={};STU=[];
    (r[0]||[]).forEach(function(s){var k=lp(s.email);if(!k||seen[k]||!s.period)return;seen[k]=1;STU.push({k:k,email:k+'@sfusd.edu',first:s.first_name||k,last:s.last_name||'',period:String(s.period)});});
    BEST={};(r[1]||[]).forEach(function(c){var k=lp(c.email);BEST[k]=BEST[k]||{};var o=BEST[k][c.slug];
      if(!o||(+c.pct||0)>(+o.pct||0)||(o.pct==null&&c.pct!=null))BEST[k][c.slug]=c;});
    PUSH=r[2]||[];
    var ps={};STU.forEach(function(s){ps[s.period]=(ps[s.period]||0)+1;});
    var keys=Object.keys(ps).sort(function(a,b){return (+a)-(+b);});
    $('per').innerHTML=keys.map(function(p){return '<button type="button" data-p="'+esc(p)+'">P'+esc(p)+' <small>('+ps[p]+')</small></button>';}).join('');
    var want=(location.hash.match(/^#p(\w+)/)||[])[1];
    if(want&&ps[want])pick(want);else if(keys.length===1)pick(keys[0]);else $('stations').innerHTML='<p class="msg">Pick a period above.</p>';
  }).catch(function(){$('stations').innerHTML='<p class="msg">Could not reach the server. Try Reload.</p>';});
}
function pick(p){
  cur=p; history.replaceState(null,'','#p'+p);
  [].forEach.call(document.querySelectorAll('#per button'),function(b){b.classList.toggle('on',b.dataset.p===p);});
  var kids=STU.filter(function(s){return s.period===p;}).sort(function(a,b){return (a.first+a.last).localeCompare(b.first+b.last);});
  var cutoff=Date.now()-RECENT_DAYS*864e5, list=[], have={};
  /* 1. what you pushed to this period (or to all) */
  PUSH.forEach(function(x){if(String(x.period)!==p&&x.period!=='all')return;var sl=slugOf(x.href);if(!sl||have[sl])return;have[sl]=1;list.push({slug:sl,title:x.title||sl,pushed:true,href:x.href});});
  /* 2. what at least two students in this period worked on recently */
  var cnt={},title={};
  kids.forEach(function(s){var m=BEST[s.k]||{};Object.keys(m).forEach(function(sl){var c=m[sl];if(!c.last_at||Date.parse(c.last_at)<cutoff)return;if(/dashboard|^teacher|^assign|^student$/.test(sl))return;cnt[sl]=(cnt[sl]||0)+1;title[sl]=title[sl]||c.title;});});
  Object.keys(cnt).filter(function(sl){return cnt[sl]>=2&&!have[sl];}).sort(function(a,b){return cnt[b]-cnt[a];}).forEach(function(sl){list.push({slug:sl,title:title[sl]||sl,pushed:false,href:'/readings/'+sl+'/'});});
  list=list.slice(0,MAX_STATIONS);
  STATIONS=list.map(function(a){
    var done=[],un=[];
    kids.forEach(function(s){var c=(BEST[s.k]||{})[a.slug];var b=band(c);var item={s:s,c:c,b:b};(b==='r'?un:done).push(item);});
    done.sort(function(x,y){return x.b===y.b?0:(x.b==='g'?-1:1);});
    return {a:a,done:done,un:un};
  });
  $('sub').textContent='Period '+p+' · '+kids.length+' students · '+STATIONS.length+' assignments on the desk (your pushes, plus anything two or more students worked on in the last '+RECENT_DAYS+' days).';
  if(!STATIONS.length){$('stations').innerHTML='<p class="msg">Nothing on this desk yet — no pushes and no recent work in Period '+esc(p)+'.</p>';return;}
  $('stations').innerHTML=STATIONS.map(function(st,i){return '<div class="station">'+
    '<div class="piles">'+pileHtml(st.un,'r',i,'Not finished')+pileHtml(st.done,'d',i,'Done')+'</div>'+
    '<span class="tape">'+(st.a.pushed?'⭐ ':'')+esc(st.a.title)+'<small>'+(st.a.pushed?'you pushed this · ':'')+''+st.done.length+' of '+(st.done.length+st.un.length)+' at 70%+</small></span></div>';}).join('');
}
function pileHtml(items,kind,i,label){
  var n=items.length,h='',layers=Math.min(n,14);
  for(var j=layers-1;j>=1;j--){var it=items[j%n],col=kind==='r'?'#f6b8b0':(it.b==='g'?'#a9dfb9':'#f7df8a');
    h+='<span class="sh" style="background:'+col+';transform:translate('+(j*0.8)+'px,'+(-j*2.4)+'px) rotate('+(((j*37)%7)-3)*0.5+'deg)"></span>';}
  var top=layers?Math.max(0,layers-1):0;
  var face=n?'<span class="face" style="background:'+(kind==='r'?'#f6b8b0':'#fdf6dc')+';transform:translate('+(top*0.8)+'px,'+(-top*2.4)+'px)"><b>'+label+'</b>'+
    items.slice(0,9).map(function(it){return '<span class="nm t-'+it.b+'">'+esc(it.s.first)+'</span>';}).join('')+(n>9?'<span class="nm">+'+(n-9)+' more</span>':'')+'</span>'
    :'<span class="face"><b>'+label+'</b>nobody yet</span>';
  return '<div><button type="button" class="pile'+(n?'':' empty')+'" data-st="'+i+'" data-k="'+kind+'" aria-label="'+esc(label+': '+n)+'"'+(n?'':' disabled')+'>'+h+face+'<span class="cnt">'+n+'</span></button><div class="lab">'+label+'</div></div>';
}
function spread(i){
  curSt=i;var st=STATIONS[i];ORDER=st.un.concat(st.done);
  $('ovT').textContent=st.a.title+' · Period '+cur;
  var h='';
  if(st.un.length)h+='<p class="grp">Not finished ('+st.un.length+')</p>'+st.un.map(function(it,j){return sheet(it,j);}).join('');
  if(st.done.length)h+='<p class="grp">70% or more ('+st.done.length+')</p>'+st.done.map(function(it,j){return sheet(it,st.un.length+j);}).join('');
  $('sheets').innerHTML=h;$('ov').classList.add('on');$('ov').scrollTop=0;
}
function sheet(it,j){return '<button type="button" class="sheet c-'+it.b+'" data-i="'+j+'"><span class="n">'+esc(it.s.first)+'<br><small>'+esc(it.s.last)+'</small></span><span class="p t-'+it.b+'">'+esc(pctTxt(it.c))+'</span><span class="s">'+(it.c&&it.c.attempts?it.c.attempts+' tr'+(it.c.attempts==1?'y':'ies'):'')+'</span></button>';}
function urlFor(it,a){
  var w=WORK[a.slug];
  if(mode==='work'&&w)return '/readings/'+w[0]+'?email='+encodeURIComponent(it.s.email)+(w[1]?'&guide='+w[1]:'');
  return '/readings/student/?email='+encodeURIComponent(it.s.email);
}
function view(j){
  at=(j+ORDER.length)%ORDER.length;var it=ORDER[at],a=STATIONS[curSt].a,hasWork=!!WORK[a.slug];
  if(!hasWork)mode='page';
  $('vwT').innerHTML='<span class="chip c-'+it.b+'" style="color:#2b2016">'+esc(it.s.first+' '+it.s.last)+' · '+esc(pctTxt(it.c))+'</span> '+esc(a.title)+' <small>('+(at+1)+' of '+ORDER.length+')</small>';
  $('vwWork').style.display=hasWork?'':'none';
  $('vwWork').className='btn'+(mode==='work'?' dk':'');$('vwPage').className='btn'+(mode==='page'?' dk':'');
  $('vwF').src=urlFor(it,a);$('vw').classList.add('on');
}
document.addEventListener('click',function(e){
  var b=e.target.closest('#per button');if(b){pick(b.dataset.p);return;}
  var pl=e.target.closest('.pile');if(pl&&!pl.disabled){spread(+pl.dataset.st);return;}
  var sh=e.target.closest('.sheet');if(sh){mode='work';view(+sh.dataset.i);return;}
});
$('ovBack').onclick=function(){$('ov').classList.remove('on');};
$('vwBack').onclick=function(){$('vw').classList.remove('on');$('ov').classList.remove('on');$('vwF').src='about:blank';};
$('vwPile').onclick=function(){$('vw').classList.remove('on');$('vwF').src='about:blank';};
$('vwNext').onclick=function(){view(at+1);};
$('vwPrev').onclick=function(){view(at-1);};
$('vwWork').onclick=function(){mode='work';view(at);};
$('vwPage').onclick=function(){mode='page';view(at);};
document.addEventListener('keydown',function(e){if(!$('vw').classList.contains('on'))return;if(e.key==='ArrowRight')view(at+1);if(e.key==='ArrowLeft')view(at-1);if(e.key==='Escape')$('vwBack').click();});
gate();
</script>
<script src="/readings/grade04.js"></script>
</body></html>
