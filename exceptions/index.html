}

    --pl:#d7a6ea; --pl-t:#3a2944; --fe:#ffc56a; --fe-b:#f0a52a; --fe-t:#3d2f17;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 Nunito,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--od);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px 60px}
/* ---------- login ---------- */
#login{max-width:440px;margin:6vh auto;background:var(--card);border-radius:20px;padding:28px 26px;border:1px solid var(--line)}
#login h1{margin:0 0 6px;font-size:38px;font-weight:900;line-height:1.1}
#login h1 .a{color:var(--pl)} #login h1 .b{color:var(--fe)} #login h1 .c{color:var(--od)}
#login p{margin:0 0 18px;color:var(--muted)}
#login label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
#login input,#login select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#login .err{color:var(--no);font-size:15px;min-height:22px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%;margin-top:18px;font-size:19px}
/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.brand{font-weight:900;font-size:20px}
.who{color:var(--muted);font-size:15px}
.spacer{flex:1}
.bar select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:15px}
.home{color:var(--muted);text-decoration:none;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px}
#btn-dir{padding:7px 12px;font-size:15px;box-shadow:none;border-radius:9px}
#btn-dir.on{background:var(--od);color:var(--card);border-color:var(--od)}
#dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
#dot.saving{background:var(--fe-b)} #dot.saved{background:var(--ok)} #dot.err{background:var(--no)}
/* ---------- activity nav ---------- */
#acts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.act{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-size:16px;white-space:nowrap}
.act.on{background:var(--od);border-color:var(--od);color:var(--card)}
.act .ck{color:var(--ok);font-weight:900;margin-left:4px}
.act.on .ck{color:var(--card)}
/* ---------- stage ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 4px;font-size:26px;font-weight:900}
.lede{margin:0 0 16px;color:var(--muted);font-size:16px}
.dirtr{display:block;font-size:16px;color:var(--ink);margin-top:4px;font-weight:400}
.dirtr[dir=rtl]{text-align:right}
.l1{font-size:17px;line-height:1.45}
.l1 b{font-size:20px;font-weight:900;text-decoration:underline;text-underline-offset:3px}
.l1 b.en{color:var(--muted)}
[dir=rtl]{text-align:right}
/* families */
.f-pl{--fc:var(--pl);--ft:var(--pl-t)} .f-fe{--fc:var(--fe);--ft:var(--fe-t)} .f-od{--fc:var(--od);--ft:var(--od-t)}
/* learn */
.fam{margin-top:22px}
.fam h3{margin:0 0 4px;font-size:22px;font-weight:900;color:var(--fc)}
.rule{background:var(--ft);border:1.5px solid var(--fc);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:17px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{background:var(--ft);border:2px solid var(--fc);border-radius:18px;padding:16px;text-align:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.pair .half{background:var(--card);border-radius:14px;padding:10px 6px}
.emo{font-size:52px;line-height:1.1;min-height:60px;display:flex;align-items:center;justify-content:center;letter-spacing:-6px}
.emo.big{font-size:84px;min-height:110px}
.emo.sm{font-size:40px;min-height:48px}
.pc .word{font-size:28px;font-weight:900;color:var(--fc);line-height:1.1;margin:4px 0;overflow-wrap:anywhere}
.pc .spk{background:var(--card);border:1.5px solid var(--fc);border-radius:999px;padding:4px 12px;font-size:16px;margin:4px 0 8px}
.pc .l1{margin-top:6px;padding-top:8px;border-top:1px dashed var(--fc);text-align:left;font-size:15px}
.pc .l1 b{font-size:17px}
.pc .ex{margin-top:8px;font-size:16px}
.tr{text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.note{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:16px}
.key{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.key span{border-radius:999px;padding:3px 12px;font-size:14px;background:var(--ft);color:var(--fc);border:1.5px solid var(--fc)}
/* flashcard */
.flip{display:block;width:100%;min-height:290px;background:var(--bg);border:2px solid var(--line);border-radius:20px;padding:22px;text-align:center;transition:transform .15s}
.flip.back{background:var(--ft);border-color:var(--fc)}
.flip .cue{font-size:22px;color:var(--muted);margin-top:6px}
.flip .big{font-size:54px;font-weight:900;color:var(--fc);line-height:1.1;overflow-wrap:anywhere}
.flip .hint{display:block;font-size:14px;color:var(--muted);margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.cnt{color:var(--muted);font-size:15px;text-align:center;margin-top:8px}
/* quiz */
.scene{display:flex;justify-content:center;align-items:center;min-height:120px;margin:6px 0}
.cue{font-size:19px;color:var(--muted);text-align:center}
.frame{font-size:28px;font-weight:700;text-align:center;margin:10px 0 14px;line-height:1.5}
.frame .gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink);text-align:center;color:var(--fc)}
.frame .tok{border:0;background:none;padding:2px 6px;border-radius:10px;font:inherit;font-weight:700}
.frame .tok:hover{background:var(--bg)}
.frame .tok.bad{background:var(--no-t);color:var(--no);text-decoration:line-through}
.frame .tok.fixed{background:var(--ok-t);color:var(--ok)}
.frame .tok:disabled{cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:600px;margin:0 auto}
.opt{background:var(--ft);border:2px solid var(--fc);color:var(--fc);border-radius:14px;padding:14px 8px;font-size:24px;font-weight:900;box-shadow:0 4px 0 var(--fc);transition:transform .08s,box-shadow .08s;overflow-wrap:anywhere}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fc)}
.opt.ok{background:var(--ok-t);border-color:var(--ok);color:var(--ok);box-shadow:none}
.opt.no{background:var(--no-t);border-color:var(--no);color:var(--no);box-shadow:none;animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{text-align:center;min-height:60px;margin-top:14px;font-size:20px}
.fb .l1{font-size:16px;color:var(--muted)}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.hint-wrong{margin:12px auto 0;max-width:560px;background:var(--ft);border:1.5px solid var(--fc);border-radius:12px;padding:10px 14px;color:var(--ink);font-size:16px;text-align:left}
.hint-wrong b{color:var(--fc)}
.big-spk{display:block;margin:10px auto;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:14px 34px;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.wrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
#wIn{font:900 28px Nunito,system-ui,sans-serif;width:240px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center}
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 16px}
.prog i{display:block;height:100%;background:var(--od);width:0;transition:width .2s}
/* summary */
.summary{text-align:center}
.score{font-size:64px;font-weight:900;color:var(--od);line-height:1}
.miss{margin:14px auto 0;max-width:460px;text-align:left}
.miss div{padding:8px 10px;border-bottom:1px solid var(--line);font-size:17px}
footer{color:var(--muted);text-align:center;margin-top:30px;font-size:14px}
#pop{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,92vw);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50}
#pop button{position:absolute;top:6px;right:10px;background:none;border:0;font-size:24px}
#pop .src{font-weight:700;margin-right:30px} #pop .dst{font-size:22px;margin-top:4px} #pop .mean{color:var(--muted);font-size:15px;margin-top:4px}
@media (max-width:520px){ .frame{font-size:24px} .pc .word{font-size:24px} .emo.big{font-size:64px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function headers(extra){ var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; if(extra) for(var k in extra) h[k]=extra[k]; return h; }
function setDot(c){ $('dot').className=c; }
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    /* a lone "I" makes some voices say "capital I"; "eye" sounds identical */
    if(/^\s*I[.!?,]?\s*$/.test(text)) text='eye';
    var u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
    if(!voice){ var vs=speechSynthesis.getVoices(), i;
      for(i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang) && /female|samantha|zira|aria|jenny|google us english/i.test(vs[i].name)){ voice=vs[i]; break; } }
      if(!voice) for(i=0;i<vs.length;i++){ if(/en-US/.test(vs[i].lang)){ voice=vs[i]; break; } } }
    if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function T(text){ return '<button class="tr" data-tr="'+esc(text)+'">'+esc(text)+'</button>'; }
function emo(e, cls){ return '<div class="emo '+(cls||'')+'" aria-hidden="true">'+e+'</div>'; }
function keyStrip(){
  return '<div class="key"><span class="f-pl">one · many</span><span class="f-fe">-ed · -ing</span><span class="f-od">fun · funny · good · well</span></div>';
}
function bestFor(ak){ var r=S.scores[UNIT+'-'+ak]; return r && r.best>=Math.ceil(r.total*0.8) ? r : null; }

/* ---------------- word translations (proxy, cached, filled in after render) ---------------- */
var wCache={}, wSeq=0;
function wordLine(w){
  /* English word + meaning now; the L1 equivalent is fetched and dropped in by id */
  var x=byW(w), mean = x ? x.p.mean[x.s] : '';
  var id='w'+(++wSeq), lang=S.lang, key=lang+'|'+w, rtl=RTL.test(lang);
  var c=wCache[key];
  var top = c ? l1Top(w, c) : '<b class="en">'+esc(w)+'</b> <span style="color:var(--muted)">…</span>';
  if(!c) fetchWord(w, mean, lang, id);
  return '<div class="l1" id="'+id+'"'+(rtl?' dir="rtl"':'')+'><span class="top">'+top+'</span><div style="font-size:15px;color:var(--muted)" dir="ltr">'+esc(w)+' = '+esc(mean)+'</div></div>';
}
function l1Top(w, t){
  if(t && t.equiv) return '<b>'+esc(t.equiv)+'</b>'+(t.meaning?' — '+esc(t.meaning):'');
  return '<b class="en">'+esc(w)+'</b>';
}
function fetchWord(w, mean, lang, id){
  var key=lang+'|'+w;
  var url=PROXY+'?action=translate&mode='+(String(w||'').trim().split(/\s+/).length<=3?'word':((mean)?'':'sentence'))+'&idiom='+encodeURIComponent(w)+'&meaning='+encodeURIComponent(mean)+'&lang='+encodeURIComponent(lang);
  rawFetch(url).then(function(r){ return r.json(); }).then(function(d){
    var t = (d&&d.ok&&d.translation) ? d.translation : {equiv:'',meaning:''};
    wCache[key]=t;
    var el=$(id); if(el && S.lang===lang){ var tp=el.querySelector('.top'); if(tp) tp.innerHTML=l1Top(w,t); }
  }).catch(function(){ var el=$(id); if(el){ var tp=el.querySelector('.top'); if(tp) tp.innerHTML=l1Top(w,null); } });
}

/* ---------------- nav ---------------- */
function renderNav(){
  var h='';
  ACTS.forEach(function(a){
    var b = SCORED.indexOf(a.k)>=0 ? bestFor(a.k) : null;
    h += '<button class="act'+(a.k===S.act?' on':'')+'" data-actk="'+a.k+'">'+a.t+(b?'<span class="ck">✓</span>':'')+'</button>';
  });
  $('acts').innerHTML=h;
}
function go(ak){ S.act=ak; renderNav(); renderStage(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderStage(){
  Q=null; F=null; $('pop').classList.add('hidden');
  var a=S.act;
  if(a==='learn') return renderLearn();
  if(a==='flash') return startFlash();
  return startQuiz(a);
}

/* ---------------- learn ---------------- */
function renderLearn(){
  var h='<div class="panel"><h2>Words that break the rules</h2>'+
    '<p class="lede">Tap the speaker to hear each word. Say it. Tap any underlined sentence to see it in your language.</p>'+keyStrip();
  ['pl','fe','od'].forEach(function(f){
    h += '<div class="fam f-'+f+'"><h3>'+esc(FAM[f].t)+'</h3><div class="rule">'+T(FAM[f].rule)+'</div><div class="cards">';
    PAIRS.forEach(function(p){
      if(p.f!==f) return;
      h += '<div class="pc"><div class="pair">';
      [0,1].forEach(function(s){
        var w=side(p,s);
        h += '<div class="half">'+emo(p.emo[s],'sm')+'<div style="font-size:14px;color:var(--muted)">'+esc(p.cue[s])+'</div><div class="word">'+esc(w)+'</div>'+
          '<button class="spk" data-say="'+esc(w)+'">🔊</button></div>';
      });
      h += '</div>'+wordLine(p.a)+wordLine(p.b)+
        '<div class="ex">'+T(p.ex[0])+'<br>'+T(p.ex[1])+'</div></div>';
    });
    h += '</div></div>';
  });
  h += '</div>';
  $('stage').innerHTML=h;
}

/* ---------------- flashcards ---------------- */
function startFlash(){
  var cards=[]; PAIRS.forEach(function(p){ cards.push({p:p,s:0}); cards.push({p:p,s:1}); });
  F={cards:shuffle(cards), i:0, flipped:false}; renderFlash();
}
function renderFlash(){
  var c=F.cards[F.i], p=c.p, w=side(p,c.s);
  /* picture + cue, then picture + the one word */
  var front=emo(p.emo[c.s],'big')+'<div class="cue">'+esc(p.cue[c.s])+'</div>';
  var back=emo(p.emo[c.s],'big')+'<div class="big">'+esc(w)+'</div>';
  $('stage').innerHTML='<div class="panel f-'+p.f+'"><h2>Flashcards</h2><p class="lede">Look at the picture. Say the word. Tap the card to see it.</p>'+
    '<button class="flip'+(F.flipped?' back':'')+'" data-flip="1">'+(F.flipped?back:front)+'<span class="hint">'+(F.flipped?'':'Tap to turn over')+'</span></button>'+
    '<div class="row"><button class="btn soft" data-fprev="1">← Back</button>'+
    (F.flipped?'<button class="btn soft" data-say="'+esc(w)+'">🔊 Hear it</button>':'')+
    '<button class="btn" data-fnext="1">'+(F.flipped?'Next →':'Show')+'</button></div>'+
    '<div class="cnt">'+(F.i+1)+' / '+F.cards.length+'</div></div>';
  if(F.flipped) speak(w);
}

/* ---------------- quizzes ---------------- */
var TITLES = {
  choose:['Choose','Look at the picture. Tap the right word.'],
  listen:['Listen','Tap the speaker. Then tap the word you hear.'],
  fix:['Fix it','One word is wrong. Tap the wrong word. Then tap the right word.'],
  write:['Write','Look at the picture. Type the missing word. Then tap Check.']
};
function genItems(mode){
  var items=[];
  if(mode==='choose'||mode==='write'){
    shuffle(CHOOSE).slice(0, mode==='write'?10:12).forEach(function(c){ items.push({mode:mode, ans:c[0], emo:c[1], frame:c[2], opts:optsFor(c[0])}); });
  } else if(mode==='listen'){
    var pool=[]; PAIRS.forEach(function(p){ pool.push(p.a); pool.push(p.b); });
    shuffle(pool).slice(0,12).forEach(function(w){ items.push({mode:mode, ans:w, opts:optsFor(w)}); });
  } else if(mode==='fix'){
    shuffle(FIX).slice(0,10).forEach(function(f){ items.push({mode:mode, ans:f.ans, bad:f.bad, emo:f.emo, toks:f.s.split(' '), opts:optsFor(f.ans), found:false}); });
  }
  return items;
}
function startQuiz(mode){ Q={mode:mode, items:genItems(mode), i:0, correct:0, missed:[], answered:false}; renderQ(); }
function fillFrame(frame, inner, fam){ return '<div class="frame f-'+fam+'">'+esc(frame).replace('___', inner)+'</div>'; }
function renderQ(){
  var it=Q.items[Q.i], m=Q.mode, fam=famOf(it.ans);
  var h='<div class="panel"><h2>'+TITLES[m][0]+'</h2><p class="lede">'+TITLES[m][1]+'</p>'+keyStrip()+
    '<div class="prog"><i style="width:'+Math.round(100*Q.i/Q.items.length)+'%"></i></div>';
  if(m==='choose' || m==='write'){
    h += '<div class="scene">'+emo(it.emo,'big')+'</div>'+fillFrame(it.frame, '<span class="gap" id="gap">&nbsp;</span>', fam);
  }
  if(m==='listen'){
    h += '<button class="big-spk" data-say="'+esc(it.ans)+'">🔊 Listen</button><div class="cue">Which word do you hear?</div>';
  }
  if(m==='fix'){
    h += '<div class="scene">'+emo(it.emo,'big')+'</div><div class="frame f-'+fam+'">'+
      it.toks.map(function(t,i){ var bare=t.replace(/[.!?,]/g,''); return '<button class="tok" data-tok="'+i+'" data-bare="'+esc(bare)+'">'+esc(t)+'</button>'; }).join(' ')+'</div>'+
      '<div class="cue" id="fixCue">Which word is wrong?</div><div id="fixOpts"></div>';
  }
  if(m==='write'){
    h += '<div class="wrow"><input id="wIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="?"><button class="btn" data-check="1">Check</button></div>';
  } else if(m!=='fix'){
    h += '<div class="opts">'+it.opts.map(function(k){ return '<button class="opt f-'+famOf(k)+'" data-opt="'+esc(k)+'">'+esc(k)+'</button>'; }).join('')+'</div>';
  }
  h += '<div class="fb" id="fb"></div><div class="row" id="nextRow"></div><div class="cnt">'+(Q.i+1)+' / '+Q.items.length+'</div></div>';
  $('stage').innerHTML=h;
  if(m==='listen') setTimeout(function(){ speak(it.ans); }, 300);
  if(m==='write'){ var w=$('wIn'); w.focus(); w.addEventListener('keydown', function(e){
    if(e.key!=='Enter' || e.repeat || e.isComposing) return;
    e.preventDefault();
    if(!Q.answered){ var b=document.querySelector('[data-check]'); if(b){ b.click(); checkedAt=Date.now(); } return; }
    /* Enter again = next, but not the same key press that just checked */
    if(Date.now()-checkedAt>600){ var n=document.querySelector('[data-next]'); if(n) n.click(); }
  }); }
}
/* Fix it, step 1: the student taps a word */
function tapTok(i){
  var it=Q.items[Q.i], b=document.querySelector('[data-tok="'+i+'"]'); if(!b) return;
  var bare=b.getAttribute('data-bare');
  if(bare!==it.bad){ b.classList.add('no'); setTimeout(function(){ b.classList.remove('no'); },400); $('fixCue').textContent='Not that one. Which word is wrong?'; it.tries=(it.tries||0)+1; return; }
  it.found=true; b.classList.add('bad');
  Array.prototype.forEach.call(document.querySelectorAll('.tok'), function(x){ x.disabled=true; });
  $('fixCue').textContent='Yes, "'+bare+'" is wrong. Which word is right?';
  $('fixOpts').innerHTML='<div class="opts">'+it.opts.map(function(k){ return '<button class="opt f-'+famOf(k)+'" data-opt="'+esc(k)+'">'+esc(k)+'</button>'; }).join('')+'</div>';
}
/* the full correct sentence for an item */
function fullSentence(it){
  if(it.frame) return it.frame.replace('___', it.ans);
  if(it.toks) return it.toks.map(function(t){ return t.replace(/[.!?,]/g,'')===it.bad ? t.replace(it.bad, it.ans) : t; }).join(' ');
  var x=byW(it.ans); return x ? x.p.ex[x.s] : it.ans;
}
/* why the tapped word was wrong */
function wrongHint(chosen, it){
  var k=String(chosen||'').trim().toLowerCase(), x=byW(k), a=byW(it.ans);
  var h='<div class="hint-wrong f-'+famOf(it.ans)+'">';
  if(x){
    h += 'You tapped <b>'+esc(k)+'</b>. '+esc(k)+' = '+esc(x.p.mean[x.s])+'. To use <b>'+esc(k)+'</b>, say: <b>'+esc(x.p.ex[x.s])+'</b>';
  } else {
    h += '<b>'+esc(k)+'</b> is not an English word. ';
    if(a && a.p.f==='pl') h += 'Two or more: <b>'+esc(a.p.b)+'</b>, not '+esc(a.p.a)+'-s.';
  }
  if(a) h += '<div style="margin-top:6px;font-size:15px;color:var(--muted)">'+esc(FAM[a.p.f].rule)+'</div>';
  return h+'</div>';
}
function isRight(chosen, it){ return String(chosen||'').trim().toLowerCase()===it.ans; }
function answer(ok, chosen){
  Q.answered=true;
  var it=Q.items[Q.i], fb=$('fb'), ans=it.ans;
  chosen=String(chosen||'').trim().toLowerCase();
  if(ok) Q.correct++; else Q.missed.push({ans:ans, said:chosen});
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
    b.disabled=true;
    if(b.getAttribute('data-opt')===ans) b.classList.add('ok');
    else if(b.getAttribute('data-opt')===chosen && !ok) b.classList.add('no');
  });
  var gap=$('gap'); if(gap){ gap.textContent=ans; }
  var badTok=document.querySelector('.tok.bad'); if(badTok){ badTok.className='tok fixed'; badTok.textContent=badTok.textContent.replace(it.bad, ans); }
  var w=$('wIn'); if(w){ w.readOnly=true; w.style.borderColor = ok?'var(--ok)':'var(--no)'; }
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML = (ok ? '✓ Yes! ' : '✗ ') + '<b>'+esc(fullSentence(it))+'</b>' + wordLine(ans) + (ok ? '' : wrongHint(chosen, it));
  $('nextRow').innerHTML='<button class="btn" data-next="1">'+(Q.i+1<Q.items.length?'Next →':'Finish')+'</button>';
  speak(fullSentence(it));
  if(!w){ var n=document.querySelector('[data-next]'); if(n) n.focus(); }
}
function nextQ(){
  Q.i++; Q.answered=false;
  if(Q.i>=Q.items.length) return showSummary();
  renderQ();
}
function showSummary(){
  var c=Q.correct, t=Q.items.length, pct=c/t;
  var msg = pct===1 ? 'Perfect!' : pct>=0.8 ? 'Great work!' : pct>=0.6 ? 'Good. Try again.' : 'Keep practicing.';
  var h='<div class="panel summary"><h2>'+msg+'</h2><div class="score">'+c+' / '+t+'</div><p class="lede" style="margin:0 auto">correct</p>';
  if(Q.missed.length){
    h += '<div class="miss">'+Q.missed.map(function(m){ return '<div><b>'+esc(m.ans)+'</b>'+(m.said?' <span style="color:var(--muted)">(you said '+esc(m.said)+')</span>':'')+'</div>'; }).join('')+'</div>';
  }
  var idx=0; ACTS.forEach(function(a,i){ if(a.k===Q.mode) idx=i; });
  var nxt = ACTS[idx+1];
  h += '<div class="row"><button class="btn soft" data-again="1">Again</button>'+(nxt?'<button class="btn" data-actk="'+nxt.k+'">'+esc(nxt.t)+' →</button>':'')+'</div></div>';
  $('stage').innerHTML=h;
  saveResult(Q.mode, c, t, Q.missed);
}

/* ---------------- save ---------------- */
var registered=false;
/* gradebook: the page's score = best of every part finished so far (read by track.js) */
function publishScore(){
  var sc=0, mx=0; SCORED.forEach(function(k){ var r=S.scores[UNIT+'-'+k]; if(r && r.total){ sc+=r.best||0; mx+=r.total; } });
  if(mx){ window.GAL_SCORE=sc; window.GAL_MAX=mx; }
}
function upsert(row){
  setDot('saving');
  return rawFetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,activity',{method:'POST',headers:headers({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(row)})
    .then(function(r){ if(r.ok) setDot('saved'); else { setDot('err'); r.text().then(function(t){ console.warn('save failed',r.status,t); }); } })
    .catch(function(e){ setDot('err'); console.warn(e); });
}
function saveResult(ak, correct, total, missed){
  var key=UNIT+'-'+ak, prev=S.scores[key]||{best:0,attempts:0};
  var rec={best:Math.max(prev.best||0,correct), total:total, correct:correct, attempts:(prev.attempts||0)+1};
  S.scores[key]=rec; renderNav(); publishScore();
  var when=new Date().toISOString();
  upsert({email:S.email, name:S.name, period:S.period, activity:key, unit:UNIT, correct:correct, total:total, best:rec.best, attempts:rec.attempts, turned_in:true,
    detail:{lang:S.lang, missed:missed.slice(0,20)}, updated_at:when});
  /* curriculum system: one row per finished task */
  var actT=''; ACTS.forEach(function(a){ if(a.k===ak) actT=a.t; });
  var post=function(path, body, prefer){ return rawFetch(SUPA_URL+'/rest/v1/'+path,{method:'POST',headers:headers({'Prefer':prefer||'return=minimal'}),body:JSON.stringify(body)}).catch(function(){}); };
  var reg = registered ? Promise.resolve() : post('activities?on_conflict=slug',[{slug:SLUG, title:'Tricky Words: men, bored/boring, fun/funny, good/well', unit:'Tricky Words', url:PAGE_URL, skills:['plurals','adjectives'], sort_order:610}],'resolution=merge-duplicates,return=minimal').then(function(){ registered=true; });
  reg.then(function(){
    post('activity_attempts',[{email:S.email, slug:SLUG, score:correct, max_score:total, detail:{path:location.pathname, source:'page', task:ak, task_title:actT, unit:UNIT}, completed_at:when}]);
    post('skill_attempts',[{email:S.email, slug:SLUG, skill:'plurals', n:correct, d:total, completed_at:when}]);
  });
}
/* autosave every 20 s: an unfinished quiz is upserted as in-progress (turned_in false) */
var lastAuto='';
function autosave(){
  if(!S.email || !Q || !Q.items) return;
  var key=UNIT+'-'+Q.mode, prev=S.scores[key]||{best:0,attempts:0};
  var sig=key+'|'+Q.i+'|'+Q.correct; if(sig===lastAuto) return; lastAuto=sig;
  upsert({email:S.email, name:S.name, period:S.period, activity:key, unit:UNIT, correct:Q.correct, total:Q.items.length, best:prev.best||0, attempts:prev.attempts||0, turned_in:false,
    detail:{lang:S.lang, in_progress:Q.i, missed:Q.missed.slice(0,20)}, updated_at:new Date().toISOString()});
}
setInterval(autosave, 20000);
function loadScores(){
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?email=eq.'+encodeURIComponent(S.email)+'&activity=like.'+encodeURIComponent(UNIT+'-%')+'&turned_in=eq.true&select=activity,best,total,correct,attempts',{headers:headers()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ (rows||[]).forEach(function(r){ S.scores[r.activity]={best:r.best,total:r.total,correct:r.correct,attempts:r.attempts}; }); publishScore(); })
    .catch(function(){});
}

/* ---------------- tap-to-translate ---------------- */
var trCache={};
function translate(text){
  var key=S.lang+'|'+text;
  if(trCache[key]) return popup(text, trCache[key].equiv, trCache[key].meaning);
  popup(text,'…','');
  var url=PROXY+'?action=translate&mode='+(String(text||'').trim().split(/\s+/).length<=3?'word':'sentence')+'&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('A very simple English sentence or rule for a beginner. Translate it plainly.')+'&lang='+encodeURIComponent(S.lang);
  rawFetch(url).then(function(r){ return r.json(); }).then(function(d){
    if(d&&d.ok&&d.translation){ trCache[key]=d.translation; popup(text,d.translation.equiv,d.translation.meaning); }
    else popup(text,'Translation is not available right now.','');
  }).catch(function(){ popup(text,'Translation is not available right now.',''); });
}
function popup(src,dst,mean){
  var p=$('pop'); p.classList.remove('hidden'); var rtl=RTL.test(S.lang);
  p.innerHTML='<button aria-label="Close" data-closepop="1">×</button><div class="src">'+esc(src)+'</div><div class="dst" dir="'+(rtl?'rtl':'ltr')+'">'+esc(dst)+'</div>'+(mean?'<div class="mean" dir="'+(rtl?'rtl':'ltr')+'">'+esc(mean)+'</div>':'');
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  var t=e.target.closest ? e.target.closest('button, .tr') : null; if(!t) return;
  var d=function(k){ return t.getAttribute('data-'+k); };
  if(d('closepop')){ $('pop').classList.add('hidden'); return; }
  if(d('say')){ speak(d('say')); return; }
  if(d('tr')){ translate(d('tr')); return; }
  if(d('actk')) return go(d('actk'));
  if(d('again')) return renderStage();
  if(F){
    if(d('flip')){ F.flipped=!F.flipped; return renderFlash(); }
    if(d('fnext')){ if(!F.flipped){ F.flipped=true; return renderFlash(); } F.i=(F.i+1)%F.cards.length; F.flipped=false; return renderFlash(); }
    if(d('fprev')){ F.i=(F.i-1+F.cards.length)%F.cards.length; F.flipped=false; return renderFlash(); }
  }
  if(Q){
    var it=Q.items[Q.i];
    if(d('tok')!=null && !Q.answered && !it.found) return tapTok(+d('tok'));
    if(d('opt')!=null && !Q.answered) return answer(isRight(d('opt'), it), d('opt'));
    if(d('check') && !Q.answered){ var v=$('wIn').value.trim(); if(!v) return $('wIn').focus(); return answer(isRight(v, it), v); }
    if(d('next')) return nextQ();
  }
});

/* ---------------- boot ---------------- */
(function(){
  var opts='<option value="">Choose…</option>'+LANGS.map(function(l){ return '<option value="'+l[0]+'">'+esc(l[1])+'</option>'; }).join('');
  $('inLang').innerHTML=opts; $('langSel').innerHTML=opts.replace('<option value="">Choose…</option>','');
  try{
    /* sign-in box prefill only — scores live in Supabase */
    var saved=localStorage.getItem('gal_student_email'); if(saved) $('inEmail').value=saved;
    var sf=localStorage.getItem('gal_student_first'), sl2=localStorage.getItem('gal_student_last'), sn=localStorage.getItem('gal_student_name');
    if(sf||sl2){ $('inFirst').value=sf||''; $('inLast').value=sl2||''; }
    else if(sn){ var ps=sn.split(/\s+/); $('inFirst').value=ps[0]||''; $('inLast').value=ps.slice(1).join(' '); }
    var sp=localStorage.getItem('gal_student_period'); if(sp) $('inPeriod').value=/Period/.test(sp)?sp:'Period '+sp;
    var sl=localStorage.getItem('vocab_lang')||localStorage.getItem('gal_student_l1'); if(sl && LANGS.some(function(l){ return l[0]===sl; })) $('inLang').value=sl;
  }catch(e){}
  $('btnStart').addEventListener('click', function(){
    var f=$('inFirst').value.trim(), l=$('inLast').value.trim(), e=$('inEmail').value.trim().toLowerCase(), p=$('inPeriod').value, lg=$('inLang').value, err=$('loginErr');
    if(!f) return err.textContent='Please type your first name.';
    if(!l) return err.textContent='Please type your last name.';
    if(!EMAIL_RE.test(e)) return err.textContent='Use your school email: name@s.sfusd.edu';
    if(!p) return err.textContent='Choose your class period.';
    if(!lg) return err.textContent='Choose your language.';
    err.textContent='';
    var canon=canonical(e);
    if(S.email && S.email!==canon) S.scores={};
    S.first=f; S.last=l; S.name=f+' '+l; S.email=canon; S.period=p; S.lang=lg;
    try{ localStorage.setItem('gal_student_email',canon); localStorage.setItem('gal_student_name',S.name); localStorage.setItem('gal_student_first',f); localStorage.setItem('gal_student_last',l); localStorage.setItem('gal_student_period',p); localStorage.setItem('gal_student_l1',lg); localStorage.setItem('vocab_lang',lg); }catch(ex){}
    registerStudent(e);
    $('whoLbl').textContent=S.name+' · '+p; $('langSel').value=S.lang;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    loadScores().then(function(){ renderNav(); renderStage(); });
    renderNav(); renderStage();
  });
  $('langSel').addEventListener('change', function(){ S.lang=this.value; try{ localStorage.setItem('gal_student_l1',S.lang); localStorage.setItem('vocab_lang',S.lang); }catch(e){} renderStage(); });
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged=function(){ voice=null; };
})();

/* ============ Galileo standard: directions in L1 + quiet browser-translation canary ============ */
(function(){
  function hd(pref){ var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'}; if(pref) h['Prefer']=pref; return h; }
  var DIR_ON=true, SENT={}, dcache={};
  try{ DIR_ON = localStorage.getItem('tricky_dir')!=='0'; }catch(e){}
  function tr(text, lang){
    var key=lang+'|'+text; if(dcache[key]) return Promise.resolve(dcache[key]);
    var url=PROXY+'?action=translate&mode='+(String(text||'').trim().split(/\s+/).length<=3?'word':'sentence')+'&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent('Directions for a beginner English student. Translate plainly and simply.')+'&lang='+encodeURIComponent(lang);
    return rawFetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      var t=d.translation.equiv||d.translation.meaning||''; if(t) dcache[key]=t; return t||null;
    }).catch(function(){return null;});
  }
  function logReveal(k, lang){
    if(!S.email) return; var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    rawFetch(SUPA_URL+'/rest/v1/instruction_reveals',{method:'POST',headers:hd('return=minimal'),body:JSON.stringify([{email:S.email, set_slug:SLUG, activity:k, lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=S.lang, list=document.querySelectorAll('#stage .lede');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!p.getAttribute('data-en')){
        var en=(p.textContent||'').replace(out?out.textContent:'','').trim();
        p.setAttribute('data-en',en); p.setAttribute('translate','yes'); p.setAttribute('data-dir',S.act);
      }
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||''; if(!en) return;
      out.setAttribute('dir', RTL.test(lang)?'rtl':'ltr'); out.textContent='…';
      tr(en,lang).then(function(t){ out.textContent=t||''; if(t) logReveal(k,lang); });
    });
  }
  var dirBtn=$('btn-dir');
  dirBtn.classList.toggle('on',DIR_ON);
  dirBtn.addEventListener('click',function(){ DIR_ON=!DIR_ON; try{ localStorage.setItem('tricky_dir',DIR_ON?'1':'0'); }catch(e){} dirBtn.classList.toggle('on',DIR_ON); showDirections(); });
  var pend=null;
  new MutationObserver(function(){ if(pend) return; pend=setTimeout(function(){ pend=null; showDirections(); },120); }).observe($('stage'),{childList:true});

  var EXPECT=(dirBtn.textContent||'').trim(), TR_SENT='';
  function detectTranslation(){
    var got=(dirBtn.textContent||'').trim(), observed=(got&&got!==EXPECT)?got:'';
    var cls=document.documentElement.className||'';
    if(!observed && !/translated/.test(cls)) return null;
    return {observed:observed, html_lang:document.documentElement.lang||'', html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation(); if(!d||!S.email) return;
    var sig=d.observed+'|'+d.html_lang; if(sig===TR_SENT) return; TR_SENT=sig;
    rawFetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{method:'POST',headers:hd('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:S.email, set_slug:SLUG, translated:true, observed:d.observed, html_lang:d.html_lang, html_class:d.html_class, updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation,20000); setTimeout(checkTranslation,4000);
})();
</script>
