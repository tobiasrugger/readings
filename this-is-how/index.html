<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This Is How We Do It &amp; This Is How I Do It &mdash; Unit</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1f5c4a; --pine-d:#164237; --pine-l:#2e7a63;
  --paper:#fbf8f2; --card:#ffffff; --ink:#1d2a25; --muted:#6b7a73;
  --line:#ddd6c7; --clay:#c2653c; --gold:#d9a440;
  --ok:#2f7d52; --bad:#b23b2e; --sky:#4a7fa5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.55}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em}
a{color:var(--pine)}

/* ---------- toolbar ---------- */
.bar{position:sticky;top:0;z-index:60;background:var(--pine);color:#fff;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.bar .ttl{font-weight:800;font-size:17px;margin-right:auto;letter-spacing:.2px}
.bar .ttl small{display:block;font-weight:600;font-size:12px;opacity:.8}
.btn{background:#fff;color:var(--pine-d);border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{background:#eaf3ef}
.btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.clay{background:var(--clay);color:#fff}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dot{width:11px;height:11px;border-radius:50%;background:#9fb5ab;display:inline-block;margin-right:6px;vertical-align:-1px}
.dot.on{background:#8ce0b0}.dot.err{background:#ff8d7d}
#who{font-size:13px;font-weight:700;opacity:.95}

/* level switch */
.lv{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px;gap:2px}
.lv button{background:transparent;border:0;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer;opacity:.75}
.lv button[aria-pressed="true"]{background:#fff;color:var(--pine-d);opacity:1}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:53px;z-index:55;background:var(--pine-d);display:flex;gap:0;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;background:transparent;border:0;border-bottom:4px solid transparent;color:#cfe3da;font:inherit;font-weight:700;font-size:13.5px;padding:10px 13px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.07)}

/* ---------- layout ---------- */
main{max-width:860px;margin:0 auto;padding:18px 14px 90px}
section.lesson{display:none}
section.lesson.on{display:block}
.hero{background:linear-gradient(180deg,#fff,#f5f1e7);border:1px solid var(--line);border-left:6px solid var(--pine);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.hero h2{font-size:25px;margin-bottom:2px}
.hero .sub{color:var(--muted);font-weight:700;font-size:14px}
.hero .goal{margin-top:10px;font-size:15px}
.hero .goal b{color:var(--pine)}

.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.blk > h3{font-size:18px;color:var(--pine-d);display:flex;align-items:center;gap:8px}
.blk > h3 .num{background:var(--pine);color:#fff;border-radius:8px;font-size:13px;padding:2px 8px;flex:0 0 auto}
.dir{background:#f3f7f4;border:1px dashed var(--pine-l);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:600}
.note{background:#fdf6e6;border:1px solid var(--gold);border-radius:12px;padding:11px 15px;margin-bottom:14px;font-size:15.5px}

label.q{display:block;font-weight:700;margin:10px 0 5px}
textarea,input.short,select.sel{width:100%;font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fffdf8}
textarea{resize:vertical;line-height:2.1;background-image:repeating-linear-gradient(#fffdf8 0 33px,#eee7d8 33px 34px);background-attachment:local}
input.short{max-width:100%}
.frame{color:var(--muted);font-style:italic;font-weight:700;font-size:14.5px;margin:2px 0 4px}
.helper{margin:6px 0 2px}
.helper summary{cursor:pointer;font-weight:700;color:var(--clay);font-size:14px}
.helper .inner{background:#fbf0e9;border:1px solid #efd6c6;border-radius:9px;padding:9px 12px;margin-top:6px;font-size:15px}
.helper .inner ul{margin:4px 0 0;padding-left:18px}

/* vocab chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{background:#eef4f1;border:1px solid #cfe0d8;color:var(--pine-d);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14.5px;cursor:pointer}
.chip:hover{background:#dfeae5}
.gl{background:#fdf6e6;border-bottom:2px dotted var(--gold);cursor:pointer;font-weight:700}

/* mc / match */
.opts{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;background:#fffdf8}
.opt:hover{background:#f4f8f6}
.opt input{margin-top:5px;flex:0 0 auto}
.opt.right{border-color:var(--ok);background:#eefaf2}
.opt.wrong{border-color:var(--bad);background:#fdeeec}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.mrow .lft{font-weight:700}
.fb{font-weight:700;font-size:14.5px;margin-top:6px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}

/* frames block */
.fbox{background:#f7f4ec;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.fbox .line{margin:8px 0;font-weight:700}
.fbox input{width:100%;font:inherit;border:0;border-bottom:2px solid var(--pine-l);background:transparent;padding:4px 2px}

/* canvas */
.draw{border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none;width:100%;display:block}
.drawbar{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 0}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pine)}

/* map */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:12px;background:#eef4f7;overflow:hidden}
svg.world{display:block;width:100%;height:auto}
.land{fill:#dfe8d9;stroke:#b9c7b0;stroke-width:1.2}
.pin{cursor:pointer}
.pin circle{stroke:#fff;stroke-width:2.5}
.pin.we circle{fill:var(--clay)}
.pin.i circle{fill:var(--sky)}
.pin.both circle{fill:var(--pine)}
.pin.done circle{fill:var(--gold)}
.pin text{font-size:13px;font-weight:800;fill:#33423c;paint-order:stroke;stroke:#fff;stroke-width:3.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;margin-top:8px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.passport{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.passport .prow{display:grid;grid-template-columns:130px 1fr 1.3fr;gap:0;border-bottom:1px solid var(--line)}
.passport .prow:last-child{border-bottom:0}
.passport .prow>div{padding:7px 9px;border-right:1px solid var(--line)}
.passport .prow>div:last-child{border-right:0}
.passport .hd{background:#f1f5f2;font-weight:800;font-size:13.5px;color:var(--pine-d)}
.passport input{width:100%;border:0;background:transparent;font:inherit;padding:2px}
.passport .cn{font-weight:800}
.passport .bk{font-size:12px;font-weight:800;color:#fff;border-radius:999px;padding:1px 7px;display:inline-block;margin-left:5px}
.bk.we{background:var(--clay)}.bk.i{background:var(--sky)}.bk.both{background:var(--pine)}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pbar{flex:1;height:11px;background:#e6e0d2;border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pine-l);width:0;transition:width .3s}
.prog span{font-weight:800;font-size:14px;color:var(--muted)}

/* rubric */
table.rub{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}
table.rub th,table.rub td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.rub th{background:#f1f5f2;color:var(--pine-d)}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,30,26,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.mask.on{display:flex}
.sheet{background:#fff;border-radius:16px;max-width:430px;width:100%;padding:22px}
.sheet h2{margin-top:0;color:var(--pine-d)}
.sheet input,.sheet select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px}
.pop{position:fixed;z-index:210;max-width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.2);padding:12px 14px;display:none}
.pop.on{display:block}
.pop .w{font-weight:800;color:var(--pine-d);font-size:17px}
.pop .d{font-size:15px;margin:4px 0 8px}
.pop .t{font-size:16px;font-weight:700;color:var(--clay);min-height:22px}
.pop select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);width:100%}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--pine-d);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}

.pm{display:none;white-space:pre-wrap}

@media (max-width:620px){
  .mrow{grid-template-columns:1fr}
  .passport .prow{grid-template-columns:1fr}
  .passport .prow>div{border-right:0;border-bottom:1px solid #eee}
  nav.tabs{top:96px}
}

/* ---------- print ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:12pt}
  .bar,nav.tabs,.no-print,.mask,.pop,.toast,.helper summary{display:none !important}
  main{max-width:none;padding:0}
  section.lesson{display:none}
  section.lesson.printme{display:block;page-break-after:always}
  .blk,.hero,.dir,.note{break-inside:avoid;box-shadow:none}
  textarea{display:none}
  .pm{display:block;border-bottom:1px solid #000;min-height:1.9em;line-height:1.9;background-image:repeating-linear-gradient(#fff 0 1.85em,#999 1.85em calc(1.85em + 1px))}
  input.short,.fbox input{border:0;border-bottom:1px solid #000;border-radius:0;background:#fff}
  .opt{padding:3px 7px}
  .helper .inner{display:block}
  .draw{max-height:340px}
  a[href]:after{content:""}
}
</style>
</head>

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2200);}
function P(x){ if(x==null) return ''; if(typeof x==='string') return x; return x[state.level]||x.s||x.e||''; }

function glossify(html){
  var keys=Object.keys(GLOSS).sort(function(a,b){return b.length-a.length;});
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    var re=new RegExp('(?![^<]*>)\\b('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');
    html=html.replace(re,function(m){return '<span class="gl" data-w="'+k+'">'+m+'</span>';});
  }
  return html;
}

function blkHTML(b,li){
  var h='';
  if(b.t==='d')  return '<div class="dir">'+glossify(P(b.x))+'</div>';
  if(b.t==='note')return '<div class="note">'+P(b.x)+'</div>';

  if(b.t==='v'){
    h='<div class="blk"><h3>Words for this lesson</h3><p style="margin:0;color:var(--muted);font-weight:600;font-size:14.5px">Tap a word for the meaning and a translation.</p><div class="chips">';
    for(var i=0;i<b.w.length;i++) h+='<button class="chip gl" data-w="'+esc(b.w[i])+'">'+esc(b.w[i])+'</button>';
    return h+'</div></div>';
  }

  if(b.t==='see'||b.t==='short'||b.t==='long'||b.t==='exit'){
    var rows=b.rows||(b.t==='short'?1:4);
    h='<div class="blk"><label class="q" for="'+b.id+'">'+glossify(P(b.p))+'</label>';
    if(b.fr) h+='<div class="frame">'+glossify(b.fr)+'</div>';
    if(b.t==='short'&&!b.rows) h+='<input class="short ans" id="'+b.id+'" data-id="'+b.id+'" type="text"><div class="pm" data-pm="'+b.id+'"></div>';
    else h+='<textarea class="ans" id="'+b.id+'" data-id="'+b.id+'" rows="'+rows+'"></textarea><div class="pm" data-pm="'+b.id+'" style="min-height:'+(rows*1.9)+'em"></div>';
    if(b.help){
      h+='<details class="helper"><summary>Help me start</summary><div class="inner"><b>Sentence starters</b><ul>';
      for(var j=0;j<b.help.length;j++) h+='<li>'+b.help[j]+'</li>';
      h+='</ul></div></details>';
    }
    return h+'</div>';
  }

  if(b.t==='mc'){
    h='<div class="blk" data-mc="'+b.id+'"><label class="q">'+glossify(b.p)+'</label><div class="opts">';

      h+='<label class="opt"><input type="radio" name="'+b.id+'" value="'+m+'" class="ansmc" data-id="'+b.id+'"><span>'+b.o[m]+'</span></label>';

    h='<div class="blk"><h3>'+b.title+'</h3><div class="fbox">';
    for(var f=0;f<b.lines.length;f++)
      h+='<div class="line">'+b.lines[f].l+' <input class="ans" data-id="'+b.id+'_'+f+'" placeholder="'+esc(b.lines[f].ph)+'"></div>';

    return '<div class="blk"><h3>How your writing is scored</h3><table class="rub">'+
    '<tr><th style="width:24%">&nbsp;</th><th>4 &mdash; Strong</th><th>3 &mdash; Getting there</th><th>2 &mdash; Beginning</th></tr>'+
    '<tr><td><b>Ideas</b></td><td>Clear ideas with details from both books and from my own life</td><td>Clear ideas with some details</td><td>Few ideas or details</td></tr>'+
    '<tr><td><b>Sentences</b></td><td>Complete sentences with capitals and periods</td><td>Most sentences complete</td><td>Many pieces of sentences</td></tr>'+

    '<tr><td><b>Words</b></td><td>Uses unit vocabulary naturally</td><td>Uses a few unit words</td><td>Little unit vocabulary</td></tr></table></div>';
  }
  return '';
}

/* ============================================================
   answers, scoring, progress

function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\u00c0-\u024f ]/g,'').replace(/\s+/g,' ').trim();}

function setAns(id,v){ state.ans[id]=v; dirty=true; scheduleSave(); updateProgress(); }

function restore(){
  var els=document.querySelectorAll('.ans');
  for(var i=0;i<els.length;i++){ var id=els[i].dataset.id; if(state.ans[id]!=null) els[i].value=state.ans[id]; }
  var rs=document.querySelectorAll('.ansmc');
  for(var j=0;j<rs.length;j++){ var rid=rs[j].dataset.id; if(state.ans[rid]!=null && String(state.ans[rid])===rs[j].value){ rs[j].checked=true; if(!rs[j].dataset.silent) gradeMC(rid); } }
  var ms=document.querySelectorAll('.ansmt');
  for(var k=0;k<ms.length;k++){ var mid=ms[k].dataset.id+'_'+ms[k].dataset.i; if(state.ans[mid]!=null) ms[k].value=state.ans[mid]; }
  for(var c=0;c<CANV.length;c++){ var d=state.ans['cv_'+CANV[c].id]; if(d) drawDataURL(CANV[c],d); }
  updateProgress(); markMap();
}

function gradeMC(id){
  var box=document.querySelector('[data-mc="'+id+'"]'); if(!box) return;
  var def=findMC(id); if(!def) return;
  var chosen=state.ans[id];
  var opts=box.querySelectorAll('.opt');
  for(var i=0;i<opts.length;i++){ opts[i].classList.remove('right','wrong'); }
  if(chosen==null||chosen==='') return;
  var ci=Number(chosen);
  var fb=box.querySelector('[data-fb="'+id+'"]');
  if(ci===def.k){ opts[ci].classList.add('right'); if(fb){fb.className='fb ok';fb.textContent='Correct.';} }
  else { opts[ci].classList.add('wrong'); opts[def.k].classList.add('right'); if(fb){fb.className='fb no';fb.textContent='Not yet \u2014 the correct answer is highlighted.';} }
}

function findMC(id){
  for(var i=0;i<LESSONS.length;i++){ var bs=LESSONS[i].blocks;
    for(var b=0;b<bs.length;b++){
      if(bs[b].t==='mc'&&bs[b].id===id) return {k:bs[b].k};
      if(bs[b].t==='gram'){ for(var g=0;g<bs[b].items.length;g++) if(bs[b].id+'_'+g===id) return {k:bs[b].items[g].k}; }
    }}
  var mg=/^gym(\d+)_(\d+)$/.exec(id); if(mg) return {k:GYM[+mg[1]].items[+mg[2]].k};
  var mt=/^t(\d+)$/.exec(id); if(mt) return {k:TEST[+mt[1]].k};
  return null;
}

function allScorable(){
  var out=[];
  for(var i=0;i<LESSONS.length;i++){ var bs=LESSONS[i].blocks;
    for(var b=0;b<bs.length;b++){ var x=bs[b];
      if(x.t==='mc') out.push({id:x.id,k:x.k,kind:'mc'});
      if(x.t==='gram') for(var g=0;g<x.items.length;g++) out.push({id:x.id+'_'+g,k:x.items[g].k,kind:'mc'});
      if(x.t==='match') for(var p=0;p<x.pairs.length;p++) out.push({id:x.id+'_'+p,k:x.pairs[p][1],kind:'txt'});
      if(x.t==='short'&&x.k) out.push({id:x.id,k:x.k,kind:'txt'});
    }}
  for(var s=0;s<GYM.length;s++) for(var q=0;q<GYM[s].items.length;q++) out.push({id:'gym'+s+'_'+q,k:GYM[s].items[q].k,kind:'mc'});
  return out;
}

function autoScore(){
  var list=allScorable(),got=0;
  for(var i=0;i<list.length;i++){
    var a=state.ans[list[i].id];
    if(a==null||a==='') continue;
    if(list[i].kind==='mc'){ if(Number(a)===list[i].k) got++; }
    else { if(norm(a)===norm(list[i].k)||norm(a).indexOf(norm(list[i].k))>-1) got++; }
  }
  return {got:got,total:list.length};
}

function testScore(){
  var got=0; for(var i=0;i<TEST.length;i++){ if(Number(state.ans['t'+i])===TEST[i].k) got++; } return got;
}

function allFields(l){
  var ids=[];
  for(var b=0;b<l.blocks.length;b++){ var x=l.blocks[b];
    if(['see','short','long','exit'].indexOf(x.t)>-1) ids.push(x.id);
    if(x.t==='mc') ids.push(x.id);
    if(x.t==='gram') for(var g=0;g<x.items.length;g++) ids.push(x.id+'_'+g);
    if(x.t==='match') for(var p=0;p<x.pairs.length;p++) ids.push(x.id+'_'+p);
    if(x.t==='frames') for(var f=0;f<x.lines.length;f++) ids.push(x.id+'_'+f);
    if(x.t==='draw') ids.push('cv_'+x.id);
    if(x.t==='map') for(var c=0;c<COUNTRIES.length;c++){ ids.push(x.id+'_'+c+'_n'); ids.push(x.id+'_'+c+'_f'); }
  }
  return ids;
}

function updateProgress(){
  for(var i=0;i<LESSONS.length;i++){
    var ids=allFields(LESSONS[i]),done=0;
    for(var j=0;j<ids.length;j++){ var v=state.ans[ids[j]]; if(v!=null&&String(v).trim()!=='') done++; }
    var pct=ids.length?Math.round(done/ids.length*100):0;
    var bar=document.querySelector('[data-bar="'+LESSONS[i].id+'"]'), lab=document.querySelector('[data-pct="'+LESSONS[i].id+'"]');
    if(bar) bar.style.width=pct+'%'; if(lab) lab.textContent=pct+'%';
  }
  markMap();
}

function markMap(){
  for(var c=0;c<COUNTRIES.length;c++){
    var n=state.ans['q109_'+c+'_n'], f=state.ans['q109_'+c+'_f'];
    var pin=document.querySelector('.pin[data-c="'+COUNTRIES[c].c+'"]');
    if(pin) pin.classList.toggle('done', !!(n&&String(n).trim()&&f&&String(f).trim()));
  }
}

var CANV=[];
function initCanvases(){
  CANV=[];
  var cs=document.querySelectorAll('canvas.draw');
  for(var i=0;i<cs.length;i++){
    var cv=cs[i],ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.lineCap='round';ctx.lineJoin='round';
    var o={el:cv,ctx:ctx,id:cv.dataset.id,col:'#1d2a25',w:3,down:false};
    CANV.push(o); wire(o);
  }
}
function pt(o,e){var r=o.el.getBoundingClientRect();var t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*(o.el.width/r.width), y:(t.clientY-r.top)*(o.el.height/r.height)};}
function wire(o){
  function start(e){e.preventDefault();o.down=true;var p=pt(o,e);o.ctx.beginPath();o.ctx.moveTo(p.x,p.y);}
  function move(e){if(!o.down)return;e.preventDefault();var p=pt(o,e);
    o.ctx.strokeStyle=o.col;o.ctx.lineWidth=o.w;o.ctx.lineTo(p.x,p.y);o.ctx.stroke();}
  function end(){if(!o.down)return;o.down=false;setAns('cv_'+o.id,o.el.toDataURL('image/png'));}
  o.el.addEventListener('mousedown',start);o.el.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  o.el.addEventListener('touchstart',start,{passive:false});o.el.addEventListener('touchmove',move,{passive:false});
  o.el.addEventListener('touchend',end);
}
function drawDataURL(o,d){var img=new Image();img.onload=function(){o.ctx.drawImage(img,0,0,o.el.width,o.el.height);};img.src=d;}
function canvById(id){for(var i=0;i<CANV.length;i++) if(CANV[i].id===id) return CANV[i]; return null;}

   ============================================================ */
var TCACHE={};
try{TCACHE=JSON.parse(localStorage.getItem('tih_tcache')||'{}');}catch(e){TCACHE={};}
function translate(text,lang,cb){
  var key=lang+'||'+text;
  if(TCACHE[key]) return cb(TCACHE[key]);
  var url=PROXY+'?text='+encodeURIComponent(text)+'&lang='+encodeURIComponent(lang)+'&target='+encodeURIComponent(lang);
  fetch(url).then(function(r){return r.text();}).then(function(t){
    var out=t;
    try{var j=JSON.parse(t); out=j.translation||j.translated||j.text||j.result||t;}catch(e){}
    TCACHE[key]=out;
    try{localStorage.setItem('tih_tcache',JSON.stringify(TCACHE));}catch(e){}
    cb(out);
  }).catch(function(){cb('Translation is not available right now. Try again in a moment.');});
}

function showPop(word,x,y){
  var d=GLOSS[word.toLowerCase()]||'';
  $('#popW').textContent=word;
  $('#popD').textContent=d;
  $('#popT').textContent='\u2026';
  var pop=$('#pop'); pop.classList.add('on');
  var w=Math.min(300,window.innerWidth-24);
  pop.style.left=Math.max(12,Math.min(x-w/2,window.innerWidth-w-12))+'px';
  pop.style.top=Math.min(y+14,window.innerHeight-230)+'px';
  $('#popL').value=state.lang;
  runTrans(word);
}
function runTrans(word){
  var lang=$('#popL').value; state.lang=lang;
  $('#popT').textContent='\u2026';
  translate(word+' \u2014 '+(GLOSS[word.toLowerCase()]||word),lang,function(t){ $('#popT').textContent=t; });
}

/* ============================================================
   supabase
   ============================================================ */
function hdrs(extra){
  var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function dot(cls){var d=$('#saveDot'); d.className='dot'+(cls?' '+cls:'');}
function scheduleSave(){ saveLocal(); if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(save,2500); }
function saveLocal(){ try{localStorage.setItem(LSKEY,JSON.stringify(state));}catch(e){} }

function save(){
  if(!state.email) return;
  var sc=autoScore();
  var row={email:state.email,name:state.name,period:state.period,level:state.level,
           data:state.ans,auto_score:sc.got,auto_total:sc.total,test_score:testScore(),
           turned_in:state.turned,updated_at:new Date().toISOString()};
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email',{
    method:'POST',
    headers:hdrs({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify(row)
  }).then(function(r){ if(r.ok){dot('on');dirty=false;} else {dot('err');} })
    .catch(function(){dot('err');});
}

function load(){
  if(!state.email) return;
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?email=eq.'+encodeURIComponent(state.email)+'&select=*',{headers:hdrs()})
  .then(function(r){return r.json();})
  .then(function(rows){
    if(rows&&rows.length){
      var r=rows[0];
      if(r.data&&typeof r.data==='object') state.ans=r.data;
      if(r.level) setLevel(r.level);
      state.turned=!!r.turned_in;
      dot('on');
    }
    restore();
  }).catch(function(){ dot('err'); restore(); });
}

/* ============================================================
   events
   ============================================================ */
function setLevel(lv){
  state.level=lv;
  var bs=document.querySelectorAll('#lvSwitch button');
  for(var i=0;i<bs.length;i++) bs[i].setAttribute('aria-pressed', bs[i].dataset.lv===lv?'true':'false');
  var scrollY=window.scrollY, cur=document.querySelector('.lesson.on');
  var curId=cur?cur.id:'l1';
  build(); showTab(curId); restore(); window.scrollTo(0,scrollY);
  saveLocal();
}

function showTab(id){
  var ss=document.querySelectorAll('.lesson');
  for(var i=0;i<ss.length;i++) ss[i].classList.toggle('on',ss[i].id===id);
  var bs=document.querySelectorAll('#tabs button');
  for(var j=0;j<bs.length;j++) bs[j].setAttribute('aria-selected', bs[j].dataset.tab===id?'true':'false');
  window.scrollTo(0,0);
}

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('ans')) setAns(t.dataset.id,t.value);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('ansmc')){ setAns(t.dataset.id,t.value); if(!t.dataset.silent) gradeMC(t.dataset.id); }
  if(t.classList&&t.classList.contains('ansmt')) setAns(t.dataset.id+'_'+t.dataset.i,t.value);
  if(t.id==='popL'){ runTrans($('#popW').textContent); saveLocal(); }
});

document.addEventListener('click',function(e){
  var t=e.target;

  var tab=t.closest?t.closest('#tabs button'):null;
  if(tab){ showTab(tab.dataset.tab); return; }

  var g=t.closest?t.closest('.gl'):null;
  if(g){ showPop(g.dataset.w||g.textContent.trim(), e.clientX, e.clientY); return; }

  var pin=t.closest?t.closest('.pin'):null;
  if(pin){ var row=document.getElementById('pp_'+pin.dataset.c.replace(/\s/g,'_'));
    if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); var inp=row.querySelector('input'); if(inp) setTimeout(function(){inp.focus();},350); }
    return; }

  if(t.dataset&&t.dataset.check){
    var bid=t.dataset.check, def=null;
    for(var i=0;i<LESSONS.length;i++) for(var b=0;b<LESSONS[i].blocks.length;b++)
      if(LESSONS[i].blocks[b].t==='match'&&LESSONS[i].blocks[b].id===bid) def=LESSONS[i].blocks[b];
    if(def){ var got=0;
      for(var p=0;p<def.pairs.length;p++) if(norm(state.ans[bid+'_'+p])===norm(def.pairs[p][1])) got++;
      var fb=document.querySelector('[data-fb="'+bid+'"]');
      fb.className='fb '+(got===def.pairs.length?'ok':'no');
      fb.textContent=got+' out of '+def.pairs.length+' correct.'+(got===def.pairs.length?' All matched.':' Check the ones you are unsure about and try again.');
    }
    return;
  }

  if(t.dataset&&t.dataset.col){
    var o=canvById(t.dataset.cv); if(o){ o.col=t.dataset.col; o.w=3;
      var sw=document.querySelectorAll('[data-cv="'+t.dataset.cv+'"]');
      for(var s=0;s<sw.length;s++) sw[s].setAttribute('aria-pressed', sw[s]===t?'true':'false'); }
    return;
  }
  if(t.dataset&&t.dataset.erase){ var oe=canvById(t.dataset.erase); if(oe){oe.col='#ffffff';oe.w=22;} return; }
  if(t.dataset&&t.dataset.clear){ var oc=canvById(t.dataset.clear);
    if(oc){ oc.ctx.fillStyle='#fff'; oc.ctx.fillRect(0,0,oc.el.width,oc.el.height); setAns('cv_'+oc.id,''); } return; }

  if(t.id==='btnScore'){
    for(var q=0;q<TEST.length;q++) gradeMC('t'+q);
    var sc=testScore();
    var box=$('#testResult'); box.style.display='block';
    box.innerHTML='<b>You scored '+sc+' out of '+TEST.length+'.</b> Your paragraph is read and scored by Mr. Toby with the rubric in Lesson 7.';
    save(); box.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  if(!t.closest || !t.closest('#pop')) $('#pop').classList.remove('on');
});

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('pin')) e.target.click();
  if(e.key==='Escape') $('#pop').classList.remove('on');
});

$('#lvSwitch').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(b) setLevel(b.dataset.lv);
});

$('#btnTurn').addEventListener('click',function(){
  if(!state.email){ $('#login').classList.add('on'); return; }
  state.turned=true; save();
  toast('Turned in. You can still keep working \u2014 changes keep saving.');
});

/* ---------- printing ---------- */
$('#btnPrint').addEventListener('click',function(){
  var cur=document.querySelector('.lesson.on');
  var name=cur?cur.dataset.title:'this page';
  var choice=prompt('Print what?\n\n1 = this page only ('+name+')\n2 = the whole packet\n3 = blank packet (no answers, for handwriting)','1');
  if(!choice) return;
  var ss=document.querySelectorAll('.lesson');
  for(var i=0;i<ss.length;i++) ss[i].classList.remove('printme');
  if(choice==='1'&&cur) cur.classList.add('printme');
  else for(var j=0;j<ss.length;j++) ss[j].classList.add('printme');
  window.__blank = (choice==='3');
  window.print();
});

window.addEventListener('beforeprint',function(){
  var pms=document.querySelectorAll('.pm');
  for(var i=0;i<pms.length;i++){
    var id=pms[i].dataset.pm;
    pms[i].textContent = window.__blank ? '' : (state.ans[id]||'');
  }
  if(window.__blank){
    var ins=document.querySelectorAll('input.short, .fbox input, .passport input');
    for(var j=0;j<ins.length;j++){ ins[j].dataset.keep=ins[j].value; ins[j].value=''; }
    var rs=document.querySelectorAll('.ansmc'); for(var k=0;k<rs.length;k++) rs[k].dataset.keep=rs[k].checked?'1':'';
  }
});
window.addEventListener('afterprint',function(){
  if(window.__blank){
    var ins=document.querySelectorAll('input.short, .fbox input, .passport input');
    for(var j=0;j<ins.length;j++) if(ins[j].dataset.keep!=null) ins[j].value=ins[j].dataset.keep;
  }
  window.__blank=false;
});

window.addEventListener('beforeunload',function(){ if(dirty) save(); });

/* ---------- boot ---------- */
$('#btnLogin').addEventListener('click',function(){
  var n=$('#inName').value.trim(), em=$('#inEmail').value.trim().toLowerCase();
  if(!n||!em){ toast('Please type your name and your email.'); return; }
  state.name=n; state.email=em; state.period=$('#inPeriod').value; state.lang=$('#inLang').value||'Spanish';
  $('#whoName').textContent=n;
  $('#login').classList.remove('on');
  saveLocal(); load();
});

(function boot(){
  try{ var s=JSON.parse(localStorage.getItem(LSKEY)||'null');
       if(s&&s.email){ state=Object.assign(state,s); } }catch(e){}
  build();
  if(state.email){
    $('#whoName').textContent=state.name||state.email;
    setLevel(state.level||'s');
    load();
  } else {
    $('#login').classList.add('on');
  }
})();
</script>
</body>
</html>
