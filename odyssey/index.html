<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Odyssey — ELD Unit | Mr. Toby</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#14532d; --pine-dk:#0b3a1f; --pine-lt:#dcfce7;
  --sea:#1d4f6b; --sea-lt:#e3f0f6;
  --clay:#b4532a; --clay-lt:#fbeade;
  --gold:#b7862b; --gold-lt:#fdf4e0;
  --ink:#1c1917; --mute:#6b6560; --line:#ded8cf;
  --paper:#faf7f1; --card:#ffffff;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:17px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 120px}

/* ---------- toolbar ---------- */
#bar{position:sticky;top:0;z-index:60;background:var(--pine);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#bar .in{max-width:980px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bar b{font-size:18px;letter-spacing:.2px}
#bar .sp{flex:1}
.btn{font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;background:#fff;color:var(--pine);transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn.sm{font-size:13px;padding:5px 11px}
.btn.clay{background:var(--clay);color:#fff}
.btn.sea{background:var(--sea);color:#fff}
.btn:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#dot{width:11px;height:11px;border-radius:50%;background:#94a3b8;display:inline-block;flex:none}
#dot.on{background:#4ade80} #dot.save{background:#fbbf24} #dot.err{background:#f87171}
#who{font-size:13px;opacity:.9}

/* ---------- level switch ---------- */
#levelbar{background:var(--pine-dk);color:#fff}
#levelbar .in{max-width:980px;margin:0 auto;padding:6px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.lvl{border:0;border-radius:999px;padding:5px 13px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff}
.lvl.on{background:#fff;color:var(--pine-dk)}

/* ---------- nav ---------- */
#nav{position:sticky;top:47px;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
#nav .in{max-width:980px;margin:0 auto;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.tab.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.tab .pip{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.tab.on .pip{background:#fff}

/* ---------- sections ---------- */
section{display:none;animation:fade .18s ease-out}
section.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){section{animation:none}}
h1{font-size:30px;line-height:1.2;margin:22px 0 6px}
h2{font-size:23px;margin:28px 0 8px;line-height:1.25}
h3{font-size:19px;margin:20px 0 6px}
.lede{color:var(--mute);margin:0 0 18px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:14px 0}
.card.sea{border-left:5px solid var(--sea);background:var(--sea-lt)}
.card.clay{border-left:5px solid var(--clay);background:var(--clay-lt)}
.card.gold{border-left:5px solid var(--gold);background:var(--gold-lt)}
.card.pine{border-left:5px solid var(--pine);background:var(--pine-lt)}
.kicker{font-weight:800;color:var(--sea);font-size:14px;margin:0 0 4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:230px}
.muted{color:var(--mute);font-size:14.5px}
hr{border:0;border-top:1px solid var(--line);margin:26px 0}

/* ---------- reading text ---------- */
.story{font-size:18.5px;line-height:1.85;max-width:66ch}
.story p{margin:0 0 15px}
.story p.big{font-size:20px}
.gl{border-bottom:2px dotted var(--clay);cursor:pointer;font-weight:600;color:var(--clay)}
.gl:active{background:var(--clay-lt)}
#tip{position:fixed;z-index:200;max-width:300px;background:#231f1c;color:#fff;border-radius:12px;padding:11px 13px;font-size:15px;line-height:1.45;box-shadow:0 8px 28px rgba(0,0,0,.3);display:none}
#tip b{color:#fcd34d}
#tip .tr{display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.2);font-size:15px}
.stopbox{background:var(--gold-lt);border:2px dashed var(--gold);border-radius:var(--r);padding:14px 16px;margin:18px 0}
.stopbox .kicker{color:var(--gold)}

/* ---------- questions ---------- */
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.q .num{font-weight:800;color:var(--pine);margin-right:6px}
.q .prompt{font-weight:600;margin-bottom:8px}
.q textarea{width:100%;min-height:76px;font-family:inherit;font-size:16.5px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fffdf9;resize:vertical}
.q textarea:focus{border-color:var(--sea);background:#fff}
.frames{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.frame{font-size:13px;border:1px dashed var(--sea);color:var(--sea);background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;font-family:inherit}
.frame:hover{background:var(--sea-lt)}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:#fff}
.opt:hover{background:var(--sea-lt)}
.opt.sel{border-color:var(--sea);background:var(--sea-lt)}
.opt.right{border-color:var(--ok);background:#ecfdf5}
.opt.wrong{border-color:var(--bad);background:#fef2f2}
.opt input{margin-top:4px;flex:none}
.fb{font-size:14.5px;margin-top:8px;padding:8px 11px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.good{background:#ecfdf5;color:#065f46} .fb.bad{background:#fef2f2;color:#991b1b}
.hint{font-size:14px;color:var(--mute);margin-top:6px;display:none}
.hint.show{display:block}
.lvl-only{display:none} .lvl-only.show{display:block}

/* ---------- misc widgets ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--pine-lt);border:1px solid #bbf7d0;color:var(--pine-dk);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.chip.drag{cursor:grab;background:#fff;border-color:var(--line);color:var(--ink)}
.chip.drag:active{cursor:grabbing}
.bins{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.bin{flex:1;min-width:190px;border:2px dashed var(--line);border-radius:var(--r);padding:12px;min-height:110px;background:#fff}
.bin.over{border-color:var(--sea);background:var(--sea-lt)}
.bin h4{margin:0 0 8px;font-size:15px;color:var(--sea)}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15.5px}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
th{background:var(--pine-lt);font-weight:800;font-size:14.5px}
.ring{--p:0;width:54px;height:54px;border-radius:50%;flex:none;
  background:conic-gradient(var(--pine) calc(var(--p)*1%), #e7e2d9 0);display:grid;place-items:center}
.ring i{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;color:var(--pine)}
.hero{background:linear-gradient(160deg,#0f3a4d,#1d4f6b 55%,#2d6d84);color:#fff;border-radius:18px;padding:24px;margin:18px 0}
.hero h1{margin:0 0 6px;color:#fff;font-size:34px}
.hero p{margin:0;opacity:.92;max-width:56ch}
.gridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:14px 0}
.gc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;font-family:inherit;font-size:16px}
.gc:hover{border-color:var(--sea);box-shadow:0 3px 14px rgba(0,0,0,.07)}
.gc b{display:block;font-size:17px;margin-bottom:3px}
.gc span{font-size:14px;color:var(--mute)}
.gc .bar{height:6px;background:#eee9e0;border-radius:99px;margin-top:10px;overflow:hidden}
.gc .bar i{display:block;height:100%;background:var(--pine);width:0}
.vid{position:relative;padding-bottom:56.25%;height:0;border-radius:var(--r);overflow:hidden;background:#000;margin:12px 0}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ts{display:inline-block;background:var(--sea);color:#fff;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:800;margin-right:6px}
details{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:9px 0;background:#fff}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:8px}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:5px;padding:1px 7px;margin-right:5px}
.tag.e{background:var(--pine-lt);color:var(--pine-dk)}
.tag.s{background:var(--sea-lt);color:var(--sea)}
.tag.c{background:var(--clay-lt);color:var(--clay)}
.svgart{width:100%;max-width:520px;display:block;margin:16px auto;border:1px solid var(--line);border-radius:var(--r);background:#fffdf7}

/* ---------- login ---------- */
#login{position:fixed;inset:0;background:rgba(20,20,18,.94);z-index:300;display:grid;place-items:center;padding:20px}
#login .box{background:#fff;border-radius:18px;padding:26px;max-width:400px;width:100%}
#login h2{margin:0 0 4px} #login p{margin:0 0 16px;color:var(--mute);font-size:15px}
#login input,#login select{width:100%;font-family:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
#login .btn{width:100%;padding:12px;font-size:16px;background:var(--pine);color:#fff}

#printmenu{display:none;position:fixed;top:52px;right:14px;z-index:90;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 10px 32px rgba(0,0,0,.18);padding:10px;min-width:210px}
#printmenu b{display:block;font-size:13px;color:var(--mute);padding:2px 8px 6px}
#printmenu button{display:block;width:100%;text-align:left;border:0;background:none;font-family:inherit;font-size:15px;
  padding:8px 10px;border-radius:9px;cursor:pointer}
#printmenu button:hover{background:var(--pine-lt)}

/* ---------- footer / print ---------- */
#foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:55}
.byline{text-align:center;color:var(--mute);font-size:13px;margin:36px 0 0}

@media print{
  #bar,#nav,#foot,#login,#levelbar,#tip,.frames,.btn,.no-print{display:none !important}
  body{background:#fff;font-size:12pt}
  .wrap{max-width:none;padding:0}
  section{display:none !important}
  section.printme{display:block !important}
  .card,.q,details{break-inside:avoid;box-shadow:none}
  .q textarea{min-height:70px;border:1px solid #999;background:#fff}
  .gl{border-bottom:1px dotted #666;color:#000}
  .story{max-width:none;font-size:11.5pt;line-height:1.7}
  .hero{background:#fff !important;color:#000;border:2px solid #000}
  .hero h1{color:#000}
  a[href]:after{content:""}
  .printonly{display:block !important}
  h2{page-break-after:avoid}
}
.printonly{display:none}

#btn-dir.on,#btn-tap.on{background:#1F4D3D;color:#fff}
.dirtr{display:block;margin-top:4px;color:#2f6f57;font-weight:700}
.dirtr:empty{display:none}
body.tap-on .wt-tap{cursor:pointer;border-bottom:1px dotted #8aa79a}
body.tap-on .wt-tap:hover{background:#eef5f1}
.wt-bub{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:6px;
  background:#1F4D3D;color:#fff;font-size:.85em;font-weight:700}
</style>

<script>
/* ============ UNIT DATA ============ */
var CH = {};

CH.ch1 = {
  id:"ch1", n:1, title:"The Trojan War", theme:"When is it right to go to war?",
  before:{
    q:"Before you read: Why do people start wars? Write at least two reasons.",
    frames:["People start wars because…","One reason is…","Another reason is…"]
  },
  glossary:[
    {w:"furious", d:"extremely angry"},
    {w:"allies", d:"friends or countries that agree to help each other, especially in war"},
    {w:"obligated", d:"feeling that you must do something, even if you don't want to"},
    {w:"reluctantly", d:"slowly and unhappily, because you don't want to do it"},
    {w:"lay siege", d:"surrounded a city and waited, so no food or help could get in"},
    {w:"surrender", d:"to stop fighting and say the other side has won"},
    {w:"against her will", d:"forced; not what she wanted"},
    {w:"sacrifices", d:"gifts (often animals) given to the gods"},
    {w:"crept", d:"moved very quietly and slowly, so nobody would hear"},
    {w:"launched", d:"sent ships out onto the water; started something"},
    {w:"defeat", d:"to beat someone; to win against someone"},
    {w:"beware", d:"be careful of"}
  ],
  text:{
    e:[
"Long ago in Greece, a king named Menelaus married a woman named Helen. People said Helen was the most beautiful woman in the world. Menelaus was very proud.",
"Across the sea was a city called Troy. A man from Troy named Paris also wanted Helen. Paris sailed to Greece. Menelaus invited him into his home as a guest.",
"One night, Paris left secretly. He took Helen with him to Troy. Nobody knows the truth. Maybe Paris took Helen [[against her will]]. Maybe Helen loved Paris.",
"Menelaus was [[furious]]. He asked the other Greek kings for help. These kings were his [[allies]]. Long ago they promised to help each other, so they felt [[obligated]]. One thousand Greek ships sailed to Troy. People still say Helen had \"the face that [[launched]] a thousand ships.\"",
"One of the kings was Odysseus. He was the king of a small island called Ithaca. Odysseus did not want to go to war. But Menelaus was his ally, so he could not say no. [[Reluctantly]], Odysseus said goodbye to his wife Penelope and his baby son Telemachus. Then he sailed to Troy.",
"The Greeks thought the war would be short — a few months, maybe one year. Troy had a big wall around it. The Greek army [[lay siege]] to the city. They camped outside and waited. They thought the Trojans would run out of food and [[surrender]].",
"But the Trojans were strong. Every day the Trojan soldiers came out and fought. Every evening, nobody had won. The Trojans went back inside the walls.",
"Ten years passed. Many soldiers died. The Greeks were tired. They wanted to go home to their families. They were ready to give up.",
"Then Odysseus had a famous idea. He made a plan to trick the Trojans.",
"One morning, the Trojans looked out. The Greek ships were gone! The Greek soldiers were gone! But on the beach there was a huge wooden horse.",
"The people of Troy argued. Some said it was a monster. A few said it was a trap. But the priests said it was a gift for the gods. They did not want to make the gods angry. So they brought the horse into the city.",
"That night, the Trojans had a big party. They ate, drank, danced, and sang. They made [[sacrifices]] to the gods. Finally they all fell asleep on the floors and tables.",
"When the city was silent, a secret door opened in the horse. A rope came down. Odysseus and ten soldiers climbed out. Ten soldiers could not fight a whole army. So Odysseus [[crept]] to the city gates and opened them. The rest of the Greek army was waiting outside. They ran in.",
"The Greeks won the war. Odysseus was called a hero. People still tell this story. And people still say, \"[[Beware]] of Greeks bearing gifts.\"",
"Helen went back to Menelaus. After ten years, it was time to go home. Odysseus told his men they could see their families again. They sailed for Ithaca. They thought they would arrive in one month."
    ],
    s:[
"This story begins in Greece when one of the Greek kings, Menelaus, married a beautiful woman named Helen. At that time, Helen was said to be \"the most beautiful woman in the world.\" Menelaus felt very proud to have her as his wife.",
"But there was another man in the city of Troy, across the sea from Greece, who wanted Helen for his wife. His name was Paris. So he sailed to Greece and visited King Menelaus, who invited him into his home as a guest. Then one night, Paris secretly left with Helen and returned with her to Troy. No one knows if Helen was taken [[against her will]] or if she had fallen in love with Paris.",
"When Menelaus discovered that his wife was gone, he was [[furious]]. He demanded that all the other Greek kings, his [[allies]], give him an army strong and mighty enough to [[defeat]] Troy and bring Helen home. The other kings had all sworn to defend each other, so they felt [[obligated]] to help Menelaus. A thousand Greek ships set sail for Troy. For this reason, beautiful Helen has come to be remembered as \"the face that [[launched]] a thousand ships.\"",
"Many men set off to fight in the war, and one of them was Odysseus. Odysseus was the king of a Greek island called Ithaca. He did not want to go to war, but Menelaus was his ally, so he could not refuse. [[Reluctantly]] Odysseus said goodbye to his wife Penelope and their young son Telemachus. He and many men from Ithaca boarded ships to sail for Troy.",
"The Greeks, including Odysseus, expected that the war would be short. A few months, perhaps a year. Once they had crossed the sea they reached the city of Troy and [[lay siege]] to it. Troy was a walled city. The Greeks camped outside the walls and waited for the Trojans to run out of food and supplies. Then, they thought, the Trojans would give up and [[surrender]].",
"However, the Trojans turned out to be much tougher than the Greeks had thought. They did not surrender. Every day, the Trojan soldiers came out of their city to fight the Greeks. But every evening, neither army had beaten the other, and the Trojans returned inside the city walls.",
"Ten years later, the Greeks were still fighting the war against the Trojans. Many great and lesser soldiers had died. The remaining soldiers were tired of constant war and wished only to return home to their loved ones. The Greeks were ready to give up and go home, defeated and without Helen.",
"It was then that Odysseus had his brilliant idea, which is still famous today. He made a plan to trick the Trojans and win the war.",
"One morning, the Trojans looked out of their city and saw that all the Greek soldiers and ships were gone. The Trojans thought the Greeks must have given up and gone home. But on the beach outside the city, where the Greeks had been camped, there was now a huge wooden horse standing in front of the city gates. What was it? Why was it there?",
"The people of Troy could not agree about what the horse was. Some thought it was a monster. A few thought it was a trap. But the priests and princes of Troy decided it must be a gift from the Greeks to the gods. The priests did not want to anger the gods, so they decided they must take the horse into the city.",
"The very next day, the people of Troy brought the wooden horse into the city. The next thing they did was to celebrate the end of the war and the defeat of the Greeks, making sure to honor the gods with gifts and [[sacrifices]]. They danced, drank, ate, and sang, and eventually they all lay asleep and exhausted on the floors and tables of the city.",
"Once the city was silent, a secret trap door opened in the horse. A rope dropped down. Odysseus and ten of the best Greek soldiers came down the rope, out of the horse. Of course, ten soldiers could not fight the whole Trojan army. So Odysseus [[crept]] to the city gates and opened them. The rest of the Greek army had returned during the night and was waiting outside the gates. They charged in through the gates.",
"After that, it didn't take long for the Greek army to capture or kill the Trojans and finally win the war against Troy. That day Odysseus was called a hero, and the story of his plan and the Greek victory over the Trojans is still being told. And today there is a very famous saying that comes from this story: \"[[Beware]] of Greeks bearing gifts.\"",
"The Greeks had won and Helen was Menelaus's wife again. After ten long years of war it was finally time for the Greeks to return home. Odysseus stood before his men and told them that they were now able to return to their families. They set sail for Ithaca, expecting to be there in a month or less."

  text:{
    e:[
"Soon after they left Troy, the sky got dark. A big storm started. It did not stop for many days. The storm broke the ships. The men also needed fresh water. On a ship, fresh water is the most important thing.",
"Finally the ships came to an island. Nobody knew this island. Most of the men stayed to [[repair]] the ships. A small group went to [[explore]] and look for water. Odysseus gave them an order: \"Come back to the ships before night, even if you do not find water.\"",

"In the morning, Odysseus took his [[spear]] and his shield. He took another small group to look for the lost men. He did not know that a spear and a shield could not protect him on this island.",

"Then the man stood up. He offered a cup to Odysseus. \"You must drink this. You will lose all your worries. You will feel only pleasure. It is wonderful! Drink!\" he [[urged]]. \"Drink!\"",

    s:[
"Not long after leaving Troy, the sky darkened and a storm began to [[rage]]. The storm went on for days. The ships were damaged and in need of [[repair]]. Odysseus and his men also needed fresh water, which is very important on any ship at sea.",
"Eventually the ships washed up on an unknown island. Most of the men set to work repairing the ships, while a small group of men set out to [[explore]] the island and look for water. Odysseus ordered the men to return to the ships before night, whether or not they had found water.",
"Night fell, but the men did not return. In the morning, Odysseus took up his [[spear]] and shield and led another small group of men to search for the men who were missing. Little did he know that spears and shields would not protect him from the dangers on that island.",
"They [[tracked]] the other men deep into the forest, following their footprints. In the forest they had a strange feeling that they were being watched. They saw leaves move and heard the sound of something in the trees but saw nothing more.",
"After a few hours of searching they came to a grassy opening in the forest. In the middle of the [[meadow]] they saw the lost men lying on the grass sleeping next to empty wooden cups. Odysseus immediately went to the sleeping men and kicked them, ordering them to get on their feet, but the men seemed not to notice him. One man reached out for the empty cups saying, \"More juice! More juice!\"",
"One of the men with Odysseus had studied the geography and history of this part of the world, and now he said to Odysseus, \"I think I know where we are. I thought it was only a sailors' [[legend]], but now I believe we have landed on the island of the Lotus Eaters. A fruit grows here that does not grow anywhere else. A person who drinks the juice of this fruit will feel completely happy and will think only about how to get another cup of juice. They care about nothing else. These men before us have no memory of their families, and even if they did, they would care nothing for them. Drinking the juice makes you always happy, and it has the power to make you forget your worries and everything that makes you unhappy.\"",
"While he was talking, many people wearing masks had come out of the forest. They placed more cups filled with juice on the grass. Seeing the cups, one of the men lying on the grass shouted, \"Give me that!\" Odysseus wanted to see what would happen, so he handed the man the cup. The man drank it in an instant, the juice running down his face. Once he had finished it he fell back onto the grass with a look of [[intense]] happiness and [[satisfaction]]. Then he stood up and offered another cup to Odysseus himself, saying, \"You must drink this. You will lose all your worries and will feel only pleasure. It is wonderful! Drink!\" he [[urged]]. \"Drink!\"",

  text:{
    e:[
"In the fires of Hades, the land of the dead, Odysseus met Tiresias. Tiresias was a blind [[prophet]]. He could see the future.",
"Tiresias told Odysseus what would happen after he left Hades. But he spoke in a [[riddle]]. Odysseus did not understand all of it. He felt worried and did not know why.",
"Odysseus left Hades feeling [[apprehensive]]. He did not tell his men about the riddle. Instead, he sailed back to Circe's island. He asked Circe to help him understand.",
"Circe understood the riddle. But her explanation did not make Odysseus feel better. It made him feel worse.",
"This is what Circe said:",
"\"In a day or two, your ship will come to a [[narrow pass]] between two cliffs. You must go through it. There is no other way home.",
"\"On the right side is a cliff with bare rocks. Below it is a terrible [[whirlpool]]. It pulls in everything that comes close. This whirlpool is the mouth of the monster Charybdis. If you go too close, your ship will be pulled down. You and all your men will die.",
"\"On the left side is another cliff. In that cliff there is a cave. The monster Scylla lives in the cave. Scylla has six heads. She waits in secret. When ships pass close to her, her six heads [[devour]] six men.",
"\"You must choose one danger. Charybdis: everyone dies. Scylla: six men die, and you cannot know which six. But Scylla is your best chance to live.",
"\"Do not tell your men about Scylla. If you tell them, they will be too afraid, and their fear will put everyone in danger. The men will see Charybdis themselves and steer away from her. When they do, they will pass close to Scylla. It is sad to lose six men. But it is the only way to save the [[majority]].\""

    s:[
"In the fires of Hades, Odysseus met Tiresias, the blind [[prophet]]. Tiresias predicted what would happen to Odysseus and his men after they left Hades. But Tiresias spoke in a [[riddle]], and Odysseus did not completely understand his words. He felt worried and anxious without understanding why.",
"Confused and [[apprehensive]], Odysseus left Hades. He did not tell his men what Tiresias had said, but instead returned to Circe's island to ask for her help in [[interpreting]] Tiresias's words. Indeed, Circe was able to explain Tiresias's warnings. But what she told Odysseus about the dangers ahead did not make him feel better. No, he felt worse and more anxious as he and the men set out on the rest of their journey.",
"Here is what Circe explained to Odysseus: \"In a day or two, your ship will come to a [[narrow pass]] between two cliffs. It is necessary that you pass through here. There is no other way home.",
"\"To the right of the pass is a cliff with bare rocks, and below it a terrible [[whirlpool]] that will suck in anything that gets close to it. This whirlpool is the mouth of the monster Charybdis. If you pass too close to this whirlpool, your ship will be sucked into it, and you and all your men will die.",
"\"If you steer close to the other cliff, you face a different danger. In this cliff there is a cave, and in the cave lives the monster Scylla. Scylla has six heads and waits in secret for ships to pass near her as they try to avoid the whirlpool. If you pass close to Scylla, her six heads will suddenly [[devour]] six of your men.",
"\"You must choose one of these dangers. On one side, with Charybdis, all of you will die. On the other side, with Scylla, six of you will die, and you can't know which six it will be. But Scylla is your best chance to survive.",
"\"Don't tell your men about Scylla. If you tell them, they will be too scared and will put all your lives at risk. The men will be able to see the whirlpool Charybdis for themselves, and they will try to avoid her. When they do, they will pass close to where Scylla is. It will be sad to lose six men, but it is the only way to save the [[majority]] of the men.\""

  stop:{

  text2:{
    e:[
"So Odysseus had a very hard choice. Should he tell the men about Scylla and risk their fear? Or should he stay silent, and let six men die by surprise, so most of the men could live? The choice filled him with horror. But he had to decide.",
"Horrified and [[anguished]], Odysseus followed Circe's advice. He decided it was better for a few to die so that most could live. He set a course toward Scylla. He said nothing to his men.",
"The men saw Charybdis clearly and steered away from her. To do that, they passed close to Scylla's cave. They knew nothing about the monster inside. A moment later, Scylla's six heads snapped up six of Odysseus's men. The men screamed as the monster's teeth closed on them.",
"Terrified, Odysseus and the rest of the men steered as fast as they could past the cliffs.",
"Most of his men lived. But Odysseus was sorry he had not told them. He felt he had [[betrayed]] his men. He heard their dying screams in his dreams that night, and many nights after.",

"<i>Do not eat the cattle of Helios. If you harm the cattle in any way, your ship and men will be destroyed, and you will come home late and broken.</i>",
"\"We cannot stop on this island,\" said Odysseus. But his men begged him. They were tired. They were deeply sad about their six dead friends. In the end, Odysseus changed his mind and landed. But he made all the men promise not to touch the cattle. He did not tell them the words of Tiresias.",
"Days passed. The weather was foggy and wet. They could not leave in such bad weather. Odysseus began to worry. Their food was running out. The men were hungry.",
"One day, while Odysseus was sleeping, the men killed the best cows in the [[herd]] and cooked them. They had a great [[feast]].",
"When Odysseus woke up and saw it, he fell to his knees in [[despair]]. \"What have you done?\" he cried. \"Now Helios will have his revenge.\"",
"The next day the weather cleared. The men were happy. Odysseus was not. Still, he set sail.",
"Soon the weather turned bad, then worse. A hurricane hit the ship. Lightning struck it and broke it in two. All the men were thrown into the sea. Only Odysseus caught hold of the ship's [[mast]]. He floated, finally alone, on the wide sea."
    ],
    s:[
"So Odysseus faced a very difficult choice. Should he tell the men about Scylla and risk their fear, which could put everyone in danger? Or should he be silent and not warn them, letting them be surprised when Scylla killed six of them suddenly, because this way most of them would escape? The choice filled Odysseus with horror and anxiety. But he knew he needed to decide.",
"Horrified and [[anguished]], Odysseus chose to follow Circe's advice. He reasoned that it was better for a few to die so that the majority could survive. The death of six men would be sad, but worth it if it meant that all the others would live. He set a course for Scylla and Charybdis and did not tell his men what he knew.",
"The men saw Charybdis clearly and tried to avoid her. To do so, they steered close to Scylla's cave, knowing nothing about the monster who lived there. A moment later, Scylla's six heads snapped up six of Odysseus's men. The men screamed as the monster's teeth closed on them, tearing them limb from limb. Terrified, Odysseus and the surviving men steered as fast as they could past the cliffs and out of Scylla's reach.",
"Although most of his men survived, Odysseus regretted his decision not to tell the men about Scylla. He felt he had [[betrayed]] his men. He heard their dying screams in his nightmares that night and many after.",
"Beyond Scylla and Charybdis was the island of Helios, the sun god. This was the island where the god kept his precious [[cattle]]. Odysseus remembered the words of Tiresias:",
"<i>Do not eat the cattle of Helios. If you harm the cattle in any way, your ship and men will be destroyed, and you will come home late and broken.</i>",
"\"We cannot stop on this island,\" said Odysseus, but his men begged to be able to stop and rest. They were tired and deeply sad after the deaths of their six companions. Eventually Odysseus changed his mind and landed on the island. But he made all the men promise not to touch any of Helios's cattle. He did not tell them about the words of Tiresias.",
"The days passed, and the weather was foggy and wet. They could not leave the island in such bad weather. Odysseus began to worry, for they were running out of food and the men were getting hungry.",
"One day, while Odysseus was sleeping, the men killed the finest cows in the [[herd]] and roasted them. They had a great [[feast]]. When Odysseus awoke and saw what they had done, he fell to his knees in [[despair]]. \"What have you done?\" he cried. \"Now Helios will have his revenge.\"",
"The next day, the weather cleared. The men were delighted, but Odysseus did not share their optimism. Nevertheless, he set sail in the good weather. But sure enough, the weather quickly turned bad and then worse. A hurricane battered the ship. Lightning struck the ship, breaking it in two, and all the men were thrown overboard into the sea. Only Odysseus was able to catch hold of the ship's [[mast]]. He floated, finally alone, on the wide sea."

    body:"The writer does not say Odysseus decided, chose, or wanted. The verb is reasoned — the language of mathematics. Six is a smaller number than all. Put that next to the sentence four lines later: \"He heard their dying screams in his nightmares.\" Reasoning gave him the answer; it did not give him peace. Watch how the chapter separates what is logically correct from what a person can live with."

  text:{
    e:[
"After Odysseus lost his ship and all his men, he [[drifted]] on the sea for nine days. When it rained, he drank the rain. Other than that, he had no food and no water. He was barely alive.",
"Each day he became more [[delirious]]. He began to see and hear things that were not there.",
"His [[hallucinations]] were worst on the tenth day. Then his raft made the sound of hitting a beach. He put out his hand. He felt an island. This was strange. One minute earlier he had looked around and seen no island.",
"Odysseus stepped onto sand and [[collapsed]]. There really was an island. And it was also true that he had not been able to see it before. A strange power hid the island. It belonged to the sea [[nymph]] Kalypso. Her nickname was \"the [[Concealer]].\" She used magic to make her island invisible.",
"While Odysseus lay helpless on the beach, two women came and carried him to Kalypso's cave. There, Kalypso saw Odysseus for the first time. His face was rough and sick, but when she looked at it, love entered her heart.",
"For several days she [[gazed]] at this [[mortal]] man while he slept. Her maids took care of him. Some days later he woke up, confused and hungry. The women brought him food and water. Slowly he came back to life. And slowly he remembered how sad his situation was.",
"\"I am Kalypso, the ruler of this island,\" she told him. \"You are welcome as my guest. I will give you anything you want or need. I want you to be happy here. I hope you will stay as my guest.\"",
"\"Thank you for your [[hospitality]],\" said Odysseus. \"But as soon as I am well, I must return to my wife and son.\"",
"\"Your wife?\" asked Kalypso.",
"\"Yes,\" said Odysseus. \"I have not seen her for many years. I [[yearn]] to hold her in my arms again before it is too late.\"",
"\"That is one wish I cannot help you with,\" said Kalypso. \"But you may love me instead. I will make you happy. I will give you a new home if you become my husband.\"",
"She looked at him as if trying to read his thoughts. She could not. Finally she said: \"Then here is your choice, Odysseus. Either you will learn to love me and be my husband, or you will stay on this island as my guest until the day you die. Think about it. Give me your decision soon.\"",
"So Odysseus was trapped on the island. He was held prisoner by someone who said she loved him.",
"He could have anything he wanted on that beautiful island. But every day he walked down to the beach. He sat and stared out at the sea, hour after hour. His heart ached. Kalypso watched him, hidden in the trees. She wondered what he was thinking about. She guessed he was not thinking about her.",
"Every day, he wanted to go home more. And every day, Kalypso was more [[determined]] to keep him. \"He will learn to love me. I can wait,\" she said to herself.",
"Days passed. Then years. After three years, Kalypso offered Odysseus the gift of [[immortality]] in return for his love. She tried to [[tempt]] him with her beauty that would never fade. She reminded him that Penelope was growing old, but that she, Kalypso, would never grow old.",
"But Odysseus preferred to grow old with Penelope — if he could ever get back to her — than to stay with Kalypso, no matter how beautiful and young she was.",
"More years passed. Kalypso was still waiting. She would have waited until Odysseus died. But finally the goddess Athena stepped in to help.",
"Poseidon was very glad that Odysseus was trapped and sad. Odysseus had blinded Poseidon's son, the Cyclops, and Poseidon wanted revenge. He wanted Odysseus to suffer. But one day Poseidon travelled far away to Ethiopia. Athena used his absence. She sent Hermes, the messenger god, to talk to Kalypso.",
"Hermes talked to Kalypso for hours. Her heart, full of love, did not want to listen to reason. But at last Hermes was able to [[persuade]] her to let Odysseus go. He told her that letting him go would be her greatest act of love.",
"So Kalypso gave Odysseus a boat. It made her happy to see him finally happy. But it hurt her to see that he did not care about leaving her. Odysseus said goodbye. He told her that he had learned to love her in some way — but not in the way she wanted. He was not angry with her. He [[pitied]] her.",
"He sailed away in a small boat. But the end of the journey was not easy. When Poseidon came home from Ethiopia, he was furious to learn that Odysseus was free. He sent a terrible storm that sank the boat. Odysseus was floating in the sea again, desperate and barely able to swim.",
"This time, though, he was close to another island. Not Ithaca — Phaeacia. It was his last stop before home."

    s:[
"After the loss of his ship and men, Odysseus [[drifted]] for nine days on the sea. He drank the rain when it rained, but otherwise he had no water or food. He was barely alive. As each day passed he became more and more [[delirious]] and crazy. He began to see and hear things that were not there.",
"His [[hallucinations]] and craziness were at their worst when, on the tenth day, his raft made the sound of hitting a beach. He put out his hand and felt that there was an island there. This was strange because a minute earlier he had looked around and seen no island.",
"Odysseus stepped onto sandy ground and [[collapsed]]. There really was an island there, but it was true he had not been able to see it before. This was because the island was hidden by a strange power. It belonged to the sea [[nymph]] Kalypso, nicknamed \"the [[Concealer]],\" who used her magic powers to hide the island, making it invisible.",
"While Odysseus's helpless body lay on the beach, two women came and carried him to a cave where Kalypso lived. There, Kalypso saw Odysseus for the first time. When her eyes saw the face of Odysseus, even though it was rough and sickly, love entered her heart. For several days she [[gazed]] upon this [[mortal]] man while he slept deeply, his troubles temporarily forgotten. Her maids took care of him, and some days later he awoke, confused and hungry. The women brought him food and water, and he came slowly back to life. As he did so, he remembered his sad situation.",
"\"I am Kalypso, the ruler of this island,\" the nymph told Odysseus. \"You are most welcome as my guest. I will provide whatever you want or need. I wish you to be happy here and I hope that you will remain here as my guest.\"",
"\"Thank you for your [[hospitality]],\" said Odysseus. \"But as soon as I am well I must return to my wife and son.\"",
"\"Your wife?\" asked Kalypso. \"Yes,\" said Odysseus. \"I have not seen her now for many years and I [[yearn]] to hold her in my arms again before it is too late.\"",
"\"I am afraid that is one desire I cannot help you with,\" said Kalypso. \"Yet you may love me instead. I will make you happy. I will offer you a new home if you will become my husband.\"",
"She looked at Odysseus as if trying to read his thoughts, but she could not. Finally she said, \"Then here is your choice, Odysseus. Either you will learn to love me and be my husband, or you will stay on this island as my guest until the day of your death. Think about it and give me your decision soon.\"",
"So Odysseus found himself trapped on the island, held prisoner by someone who claimed to love him. Although he could have anything he wanted on this beautiful island, each day he walked down to the beach and sat and stared out to sea hour after hour. His heart ached. While he sat, Kalypso watched him, hidden in the trees. She wondered what he was thinking about and guessed he was not thinking about her.",
"With each day that passed, he wanted to go home more, and with each passing day, Kalypso was also more [[determined]] to keep him on her island. \"He will learn to love me. I can wait,\" she said to herself each day.",

"He set sail in a small boat, but the end of the journey was not easy. When Poseidon returned home from Ethiopia, he was furious to learn that Odysseus was free. He sent a terrible storm that sank Odysseus's ship. Odysseus found himself floating in the sea again, desperate and barely able to swim. This time, however, he was close to another island — not Ithaca, but Phaeacia, his last stop before he would reach his home."

  text:{
    e:[
"Finally Odysseus arrived on the shore of Ithaca. Athena met him there.",
"\"Odysseus, welcome home,\" she said. \"But I must warn you. You have been gone for twenty years. Three years ago, a gang of [[suitors]] came to your palace. They demand that Penelope choose one of them to marry. Your son tried to stop them, but he could not. For three years they have lived in your home. They eat your food. They drink your wine. They spend your money. They have [[tormented]] your son and your [[loyal]] servants. Some [[disloyal]] servants have been sleeping with them. Penelope has [[delayed]] them as long as she can. But tomorrow she must choose one of them.\"",
"Odysseus felt desperate. \"Help me, Athena. Give me courage to fight these men and get revenge.\"",
"\"Of course I will be with you,\" said Athena. \"I know you will make the suitors regret stealing from you. Here — I will give you a [[disguise]], so no one will recognize you.\"",
"Then Athena turned Odysseus into an old [[beggar]]. She told him to go to the hut of Eumaeus, an old shepherd who was loyal and could be trusted. \"I will send your son to find you there.\"",
"Disguised as an old beggar, Odysseus went to Eumaeus's hut. Eumaeus gave him food and water. He did not know who the old man was. Soon Telemachus arrived.",
"\"Who is this old beggar?\" Telemachus asked.",
"\"He says he has messages for you and your mother.\"",
"Telemachus invited the beggar outside to talk in private. A moment later he was smiling and hugging the dirty old man. Father and son sat down together. With joy in their hearts at their [[reunion]], they told each other everything that had happened in twenty years. Then they made a plan.",
"Later that day they went to the palace. As soon as they entered the gates, the suitors began to abuse the old beggar. They kicked him, insulted him, and spat on him.",
"At that moment Penelope came out to speak to the suitors. She did not notice the old beggar. She did not guess that it was her lost husband.",
"In a sad voice she said: \"Tomorrow, my lords and princes, I will marry one of you. I have finished [[weaving]] my cloth. But I love none of you, so I cannot choose. Instead I will hold a competition, and I will marry the winner. Here is the competition: you must put the string on Odysseus's [[bow]] and shoot one arrow through twelve [[axes]] lined up in a row. Whoever can do it, I will marry.\"",
"With her head down, she went back inside. Telemachus followed with the beggar. \"This old man has a message for you,\" he told his mother.",
"\"What is your message?\" asked Penelope.",
"\"A message from Odysseus, your husband. He told me to tell you that he is alive and will return soon.\"",
"\"This cannot be!\" cried Penelope. \"How do you know Odysseus?\"",
"\"I met him on my travels,\" said the beggar.",
"Penelope's feelings were confused. She felt sadness and [[dread]] about marrying a suitor — but now, a small hope. \"Old man,\" she said, \"thank you. You have traveled far to tell me. Let my maid Eurycleia give you a bath.\"",
"Eurycleia was an old family servant. She had washed Odysseus when he was a boy. Now, as she washed the beggar, she saw a [[scar]] on his leg — the same scar she remembered. She gasped. Could it be true? The beggar looked at her and put one finger to his lips.",
"Then the axes and the bow were brought into a large room. First the suitors tried to put the string on the bow. It takes huge strength to do this. One by one they tried. One by one they failed.",
"While they were trying, Odysseus spoke quietly to Eumaeus. Eumaeus nodded. He locked all the doors of the room. He took Penelope and the loyal servants to her room and locked them in, too.",
"When the last suitor failed, Telemachus stood up. \"Let the beggar try.\"",
"\"The beggar?!\" said the suitors, looking at the weak old man. \"He can't do it.\"",
"\"Then it won't hurt to let him try,\" said Telemachus.",
"The beggar stepped forward. He took the bow that only Odysseus had ever been able to use. He put the string in one hand, put his weight on the bow, and strung it easily. Then he lifted it and shot an arrow smoothly through all twelve axes. The men watched in shock.",
"Then Odysseus threw off his [[rags]]. Every man saw who he was. \"You suitors have robbed this house long enough!\" he said. \"Now the time has come for my revenge.\"",
"He took another arrow and shot it through the neck of one of the suitors. Telemachus joined the fight. Some suitors panicked. Others fought hard. It was a long, bloody, [[brutal]] battle inside the locked room. Odysseus and his son did not listen to the suitors' cries for [[mercy]]. They killed every man in the room. The floor was a sea of blood.",
"When all the suitors were dead, Odysseus opened the door. The disloyal servants — the women who had slept with the suitors — ran in crying, horrified. Odysseus had no pity on them either. \"Clean up the mess,\" he ordered. After they cleaned the blood, Odysseus ordered these servants to be killed too.",
"And so at last Odysseus was home. His palace was his. His son was his. His wife would soon be his again. He put down his bow, thanked the servants who had been loyal, and made a sacrifice to Athena. Then, with a full heart, he went upstairs to see Penelope."

 {id:"g1", title:"Telling the story: past simple", ch:"Chapter 1",
  rule:{e:"To tell a story about the past, use the past simple.<br>Regular verbs add <b>-ed</b>: <i>walk → walked</i>, <i>want → wanted</i>.<br>Many important verbs are irregular. You must learn them: <i>go → went</i>, <i>take → took</i>, <i>build → built</i>, <i>fight → fought</i>, <i>win → won</i>.",
        s:"Narrative is built on the past simple. Regular verbs take <b>-ed</b>; high-frequency verbs are usually irregular and must be memorised. Negatives use <b>did not + base verb</b> — the <i>-ed</i> disappears: <i>He did not want to go</i>, never <i>He did not wanted</i>.",
        c:"Narrative uses the past simple for completed actions in sequence. Note that after <b>did</b> the verb returns to its base form, because <i>did</i> already carries the tense: <i>He did not refuse</i>. Watch for verbs that look regular but are not: <i>lay siege → laid siege</i>, <i>creep → crept</i>, <i>fall → fell</i>."},

 {id:"g2", title:"Reasons and results: because / so", ch:"Chapters 1–2",
  rule:{e:"Use <b>because</b> before a <u>reason</u>.<br>Use <b>so</b> before a <u>result</u>.<br><i>He was tired <b>because</b> he fought for ten years.</i> (reason)<br><i>He was tired, <b>so</b> he went home.</i> (result)",
        s:"<b>Because</b> introduces the cause; <b>so</b> introduces the effect. The same two facts can go in either order — you just change the connector: <i>Odysseus refused the juice <b>because</b> he loved his family</i> = <i>Odysseus loved his family, <b>so</b> he refused the juice.</i>",
        c:"<b>Because</b> and <b>so</b> reverse the order of cause and effect. In formal writing you will also use <b>since</b>, <b>as</b>, <b>therefore</b>, <b>as a result</b>, and <b>consequently</b>. Note the punctuation: <i>therefore</i> and <i>as a result</i> begin a new sentence or follow a semicolon, while <i>so</i> follows a comma."},
  ex:["The men could not walk <b>because</b> they had drunk the juice.","Odysseus thought about his son, <b>so</b> he threw the cup away."],
  items:[

   {p:"Odysseus tied up his men ______ they wanted more juice.",a:["because"]},

   {p:"Odysseus refused the drink ______ he wanted to see his family.",a:["because"]},

  prod:{p:"Write two sentences about the Lotus Eaters: one with <i>because</i> and one with <i>so</i>.",fr:["Odysseus refused the juice because…","The men drank the juice, so…"]}},

 {id:"g3", title:"Consequences: if + will", ch:"Chapter 3",
  rule:{e:"To talk about a future result, use:<br><b>If</b> + present simple, <b>will</b> + verb.<br><i><b>If</b> you pass close to Charybdis, your ship <b>will sink</b>.</i><br>Remember: no <i>will</i> in the <i>if</i> part!",
        s:"First conditional: <b>If</b> + present simple, <b>will</b> + base verb. The <i>if</i>-clause takes the present even though it points at the future. The two halves can swap: <i>Six men will die if you sail past Scylla.</i> No comma when <i>if</i> comes second.",
        c:"The first conditional presents a real, likely future consequence. Compare the second conditional — <b>If</b> + past simple, <b>would</b> + base verb — which marks the situation as unlikely or imaginary: <i>If Odysseus told his men, they would panic.</i> Circe uses the first conditional because she is stating what <i>will</i> happen, not what might."},
  ex:["<b>If</b> you tell them, they <b>will be</b> too scared.","<b>If</b> you harm the cattle, your ship <b>will be</b> destroyed."],

 {id:"g4", title:"Advice and regret: should / should have", ch:"Chapter 3",
  rule:{e:"<b>should</b> + verb = good advice now.<br><i>He <b>should tell</b> his men.</i><br><b>should have</b> + past participle = something was a mistake in the past.<br><i>He <b>should have told</b> his men.</i> (but he didn't)",
        s:"<b>Should</b> + base verb gives advice about the present or future. <b>Should have</b> + past participle looks back and judges a past action — it always means the person did the opposite. <i>He should have warned them</i> tells you he did not warn them.",
        c:"<b>Should have</b> + past participle carries a built-in counterfactual: the action did not occur. Compare <b>could have</b> (it was possible) and <b>would have</b> (it was the likely result). In an ethics essay, <i>should have</i> is your verb of moral judgment: <i>Odysseus should have told his men, even at the risk of panic.</i>"},

 {id:"g5", title:"Reporting what people said", ch:"Chapter 4",
  rule:{e:"When you report someone's words, the verb usually moves back one tense.<br>\"I <b>am</b> the ruler.\" → She said that she <b>was</b> the ruler.<br>\"I <b>will</b> stay.\" → He said that he <b>would</b> stay.<br>Use <b>told</b> + person: <i>She <b>told him</b> that…</i>",
        s:"In reported speech the tense shifts back: present → past, <i>will</i> → <i>would</i>, <i>can</i> → <i>could</i>. Pronouns shift too: <i>I</i> → <i>he/she</i>, <i>my</i> → <i>his/her</i>. Use <b>said that</b> (no person) or <b>told + person + that</b>.",
        c:"Backshift is the default, though a speaker may keep the present tense when the statement is still true. Reporting verbs carry attitude: <i>claimed</i>, <i>admitted</i>, <i>insisted</i>, <i>warned</i>, and <i>begged</i> all report the same words differently. Choosing the verb is an act of interpretation — useful in essay evidence."},

 {id:"g6", title:"Background in a story: past perfect", ch:"Chapter 5",
  rule:{e:"Use <b>had</b> + past participle for something that happened <u>before</u> the main past story.<br><i>The suitors <b>had lived</b> in his house for three years</i> — before Odysseus arrived.",

 {id:"g7", title:"Opinion and evidence language", ch:"Essay and debate",
  rule:{e:"To give an opinion: <b>I think…</b>, <b>In my opinion…</b><br>To give proof: <b>For example…</b>, <b>The text says…</b><br>To explain: <b>This shows that…</b>, <b>This is important because…</b>",

/* ============ TEXT + GLOSSARY ============ */
function buildGloss(){
  Object.keys(CH).forEach(function(k){
    (CH[k].glossary||[]).forEach(function(g){ GLOSS[g.w.toLowerCase()]=g.d; });
  });
}
function mark(p){
  return p.replace(/\[\[(.+?)\]\]/g, function(_,w){
    return '<span class="gl" data-w="'+esc(w.toLowerCase())+'" tabindex="0" role="button">'+esc(w)+'</span>';
  });
}
function showTip(el){
  var w=el.getAttribute('data-w'), d=GLOSS[w]||'';
  var t=$('#tip');
  t.innerHTML='<b>'+esc(el.textContent)+'</b><br>'+esc(d)+'<span class="tr" id="trline"></span>';
  t.style.display='block';
  var r=el.getBoundingClientRect();
  var top=r.bottom+8, left=Math.max(10,Math.min(r.left, window.innerWidth-320));
  if(top+140>window.innerHeight) top=Math.max(10,r.top-150);
  t.style.top=top+'px'; t.style.left=left+'px';
  var lang=$('#lang').value;
  if(!lang){ $('#trline').textContent=''; return; }
  var key=w+'|'+lang;
  if(TCACHE[key]){ $('#trline').textContent=TCACHE[key]; return; }
  $('#trline').textContent='…';
  translate(el.textContent+' — '+d, lang).then(function(x){
    TCACHE[key]=x; var l=$('#trline'); if(l) l.textContent=x;
  }).catch(function(){ var l=$('#trline'); if(l) l.textContent='(translation unavailable)'; });
}
function translate(text,lang){
  return fetch(TRANS+'?text='+encodeURIComponent(text)+'&lang='+encodeURIComponent(lang))
    .then(function(r){return r.text()})
    .then(function(t){ try{ var j=JSON.parse(t); return j.translation||j.text||t; }catch(e){ return t; } });
}
document.addEventListener('click',function(e){
  var g=e.target.closest ? e.target.closest('.gl') : null;
  if(g){ showTip(g); e.stopPropagation(); return; }
  if(!e.target.closest || !e.target.closest('#tip')) $('#tip').style.display='none';
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') $('#tip').style.display='none';
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('gl')){ e.preventDefault(); showTip(e.target); }
});

/* ============ PROGRESS ============ */
function allQIds(){
  var ids=[];
  Object.keys(CH).forEach(function(k){
    var c=CH[k];
    ids.push(qid(c.id+'_pre',0));
    if(c.stop) ids.push(qid(c.id+'_stop',0));
    c.qs.forEach(function(q,i){ if(showQ(q)) ids.push(qid(c.id,i)); });
  });
  MOVIE.forEach(function(m){ m.qs.forEach(function(q,i){ if(showQ(q)) ids.push(qid(m.id,i)); }); });
  ['happiness','love'].forEach(function(k){
    ETHICS[k].pre.forEach(function(q,i){ ids.push(qid('eth_'+k+'_pre',i)); });
    ETHICS[k].post.forEach(function(q,i){ if(showQ(q)) ids.push(qid('eth_'+k+'_post',i)); });
  });
  GRAM.forEach(function(g){ g.items.forEach(function(x,i){ ids.push('gr_'+g.id+'_'+i); }); ids.push('gr_'+g.id+'_prod'); });
  ESSAY.parts.forEach(function(p){ ids.push('es_'+p.k); });
  TEST.forEach(function(t,i){ ids.push('tst_'+i); });
  return ids;
}
function progress(){
  var ids=allQIds(), done=0;
  ids.forEach(function(i){ var v=S.ans[i]; if(v&&String(v).trim().length>1) done++; });
  Object.keys(S.sorts).forEach(function(k){ if(Object.keys(S.sorts[k]).length) done++; });
  return {done:done, total:ids.length};
}
function updateProgress(){
  var p=progress(), pct = p.total? Math.round(p.done/p.total*100):0;
  $('#progbar').style.width=pct+'%';
  $('#progtxt').textContent = p.done+' of '+p.total+' answered';
  $$('#tabs .tab').forEach(function(t){
    var s=t.getAttribute('data-s'), n=secDone(s);
    var pip=t.querySelector('.pip');
    if(n>0 && !pip){ var i=document.createElement('span'); i.className='pip'; t.appendChild(i); }
    if(n===0 && pip) pip.remove();
  });
}
function secDone(sec){
  var n=0;
  Object.keys(S.ans).forEach(function(k){ if(k.indexOf(sec)===0 && String(S.ans[k]).trim().length>1) n++; });
  return n;
}

function tDraw(){ var m=Math.floor(tLeft/60),s=tLeft%60; var el=$('#tclock'); if(el){el.textContent=m+':'+(s<10?'0':'')+s; el.style.color = tLeft<=15?'var(--bad)':'var(--ink)';} }
function tToggle(){ if(tInt){ clearInterval(tInt); tInt=null; $('#tbtn').textContent='Start'; return; }
  $('#tbtn').textContent='Pause';
  tInt=setInterval(function(){ tLeft--; if(tLeft<=0){ tLeft=0; clearInterval(tInt); tInt=null; $('#tbtn').textContent='Start'; } tDraw(); },1000); }
function tReset(){ if(tInt){clearInterval(tInt);tInt=null;} tLeft=120; $('#tbtn').textContent='Start'; tDraw(); }

function wc(ta,min){

function buildEssay(){

}

function scoreTest(){
  var got=0,tot=0;
  TEST.forEach(function(q,i){
    if(q.t!=='mc') return; tot++;
    var box=document.querySelector('[data-id="tst_'+i+'"]'); if(!box) return;
    var sel=box.querySelector('input:checked');
    $$('.opt',box).forEach(function(o){o.classList.remove('right','wrong')});
    if(sel){ var ok=Number(sel.value)===q.a; if(ok) got++; sel.closest('.opt').classList.add(ok?'right':'wrong'); if(!ok) $$('.opt',box)[q.a].classList.add('right'); }
    else { $$('.opt',box)[q.a].classList.add('right'); }
  });
  S.ans.test_score=got+'/'+tot; mark_dirty();
  $('#testout').innerHTML='<p style="font-size:22px;font-weight:800;margin:0;color:var(--pine)">'+got+' out of '+tot+'</p><p class="muted" style="margin:4px 0 0">Your written answers are scored by Mr. Toby.</p>';
}

<script>
/* ============ Galileo standard: identity, directions, tap words, canary ============ */
(function(){
  /* some pages in this family define SLUG, some do not */
  var PAGE_SLUG=(typeof SLUG!=='undefined'&&SLUG)?SLUG:'odyssey';
  var CANON_DOMAIN='@s.sfusd.edu', ROSTER=[];
  /* some pages in this repo never defined these */
  var SUPA_URL=(typeof window.SUPA_URL!=='undefined')?window.SUPA_URL:'https://lhmwtfyceilgndpygivj.supabase.co';
  var SUPA_KEY=(typeof window.SUPA_KEY!=='undefined')?window.SUPA_KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
  var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
  function ME_(){ return (typeof S!=='undefined'&&S&&S.email)?S:null; }
  window.cleanMail=function(x){ return String(x||'').trim().toLowerCase(); };
  window.localPart=function(e){ return cleanMail(e).split('@')[0]; };
  window.validMail=function(e){ return /^[^@\s]+@(s\.)?sfusd\.edu$/.test(cleanMail(e)); };
  window.canonMail=function(raw){
    var lp=localPart(raw), i;
    for(i=0;i<ROSTER.length;i++){ if(localPart(ROSTER[i].email)===lp) return cleanMail(ROSTER[i].email); }
    return lp+CANON_DOMAIN;
  };
  function head(pref){
    var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
    if(pref) h['Prefer']=pref; return h;
  }
  window.recordAlias=function(alias, canon){
    if(!alias||alias===canon) return;
    fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{
      method:'POST', headers:head('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{alias_email:alias, email:canon}])}).catch(function(){});
  };
  window.seedStudent=function(name,email,period){
    fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{
      method:'POST', headers:head('resolution=ignore-duplicates,return=minimal'),
      body:JSON.stringify([{email:email, name:name, period:period}])}).catch(function(){});
  };
  fetch(SUPA_URL+'/rest/v1/students?select=name,email,period&order=name',{headers:head()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ ROSTER=rows||[]; }).catch(function(){});

  /* prefill from a sign-in anywhere else on the site */
  try{
    var saved=JSON.parse(localStorage.getItem('odyssey_me')||'null');
    if(saved&&saved.email){
      if(document.getElementById('li-name')) document.getElementById('li-name').value=saved.name||'';
      if(document.getElementById('li-email')) document.getElementById('li-email').value=saved.email;
      if(saved.period&&document.getElementById('li-per')) document.getElementById('li-per').value=String(saved.period);
    } else {
      var g=localStorage.getItem('gal_student_email');
      if(g&&document.getElementById('li-email')) document.getElementById('li-email').value=g;
    }
  }catch(e){}

  window.odClean=cleanMail; window.odValid=validMail; window.odCanon=canonMail;
  window.odAlias=recordAlias; window.odSeed=seedStudent;

  /* ---------- translate through the proxy ---------- */
  var tcache={};
  var C2N={es:'Spanish',zh:'Chinese (Simplified)','zh-CN':'Chinese (Simplified)',ar:'Arabic',
    vi:'Vietnamese',ru:'Russian',ur:'Urdu',tl:'Tagalog',fr:'French',ko:'Korean',hi:'Hindi',
    so:'Somali',ne:'Nepali',th:'Thai'};
  function tr(text, code){
    var lang=(!code||code==='none')?'':(C2N[code]||code);
    var key=text+'|'+lang;
    if(tcache[key]) return Promise.resolve(tcache[key]);
    var url=PROXY+'?action=translate&idiom='+encodeURIComponent(text)+'&meaning=&lang='+encodeURIComponent(lang);
    return fetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok||!d.translation) return null;
      tcache[key]=d.translation; return d.translation;
    }).catch(function(){return null;});
  }

  /* ---------- directions in the student's language ---------- */
  var DIR_ON=false, SENT={};
  try{ DIR_ON=localStorage.getItem('song_dir')==='1'; }catch(e){}
  function logReveal(k, lang){
    if(!ME_()) return;
    var sig=k+'|'+lang; if(SENT[sig]) return; SENT[sig]=true;
    fetch(SUPA_URL+'/rest/v1/instruction_reveals',{
      method:'POST', headers:head('return=minimal'),
      body:JSON.stringify([{email:ME_().email, set_slug:PAGE_SLUG, activity:k, lang:lang}])}).catch(function(){});
  }
  function showDirections(){
    var lang=document.getElementById('lang').value;
    var list=document.querySelectorAll('[data-dir]');
    Array.prototype.forEach.call(list,function(p){
      var out=p.querySelector('.dirtr');
      if(!out){ out=document.createElement('span'); out.className='dirtr'; p.appendChild(out); }
      if(!DIR_ON||!lang){ out.textContent=''; return; }
      var k=p.getAttribute('data-dir'), en=p.getAttribute('data-en')||'';
      out.textContent='…';
      tr(en, lang).then(function(t){
        out.textContent=t?(t.equiv||t.meaning||''):'';
        if(out.textContent) logReveal(k, lang);
      });
    });
  }
  var dirBtn=document.getElementById('btn-dir');
  if(dirBtn){
    dirBtn.classList.toggle('on', DIR_ON);
    dirBtn.addEventListener('click',function(){
      DIR_ON=!DIR_ON;
      try{ localStorage.setItem('song_dir', DIR_ON?'1':'0'); }catch(e){}
      dirBtn.classList.toggle('on', DIR_ON);
      showDirections();
    });
  }
  var langSel=document.getElementById('lang');
  if(langSel) langSel.addEventListener('change', function(){ if(DIR_ON) showDirections(); });
  if(DIR_ON) setTimeout(showDirections, 600);

  /* ---------- tap any word ---------- */
  var TAP_ON=false;
  try{ TAP_ON=localStorage.getItem('song_tap')==='1'; }catch(e){}
  function wrapWords(root){
    if(root.getAttribute('data-wrapped')) return;
    root.setAttribute('data-wrapped','1');
    var walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes=[], n;
    while((n=walker.nextNode())) if(n.nodeValue.trim()) nodes.push(n);
    nodes.forEach(function(node){
      if(node.parentNode.closest('textarea,input,button,select,.wt-tap')) return;
      var frag=document.createDocumentFragment();
      node.nodeValue.split(/(\s+)/).forEach(function(piece){
        if(!piece.trim()){ frag.appendChild(document.createTextNode(piece)); return; }
        var s=document.createElement('span');
        s.className='wt-tap'; s.textContent=piece;
        frag.appendChild(s);
      });
      node.parentNode.replaceChild(frag, node);
    });
  }
  function tapTargets(){ return document.querySelectorAll('[data-tap]'); }
  function setTap(on){
    TAP_ON=on;
    try{ localStorage.setItem('song_tap', on?'1':'0'); }catch(e){}
    document.body.classList.toggle('tap-on', on);
    var b=document.getElementById('btn-tap');
    if(b) b.classList.toggle('on', on);
    if(on) Array.prototype.forEach.call(tapTargets(), wrapWords);
  }
  var tapBtn=document.getElementById('btn-tap');
  if(tapBtn) tapBtn.addEventListener('click', function(){ setTap(!TAP_ON); });
  document.addEventListener('click', function(ev){
    if(!TAP_ON) return;
    var s=ev.target.closest('.wt-tap'); if(!s) return;
    var lang=document.getElementById('lang').value;
    if(!lang){ document.getElementById('lang').focus(); return; }
    var word=(s.textContent||'').replace(/[^A-Za-zÀ-ÿ'’-]/g,'');
    if(!word) return;
    var old=s.getAttribute('data-shown');
    if(old){ s.removeAttribute('data-shown'); var t=s.querySelector('.wt-bub'); if(t) t.remove(); return; }
    var bub=document.createElement('span'); bub.className='wt-bub'; bub.textContent='…';
    s.appendChild(bub); s.setAttribute('data-shown','1');
    tr(word, lang).then(function(t){ bub.textContent=t?(t.equiv||t.meaning||'?'):'?'; });
  });
  if(TAP_ON) setTimeout(function(){ setTap(true); }, 400);

  /* ---------- quiet browser-translation canary ---------- */
  var CANARY='the quick brown fox jumps over the lazy dog', TR_SENT='';
  function detectTranslation(){
    var c=document.querySelector('#canary');
    var got=c?(c.textContent||'').trim().toLowerCase():'';
    var cls=document.documentElement.className||'';
    var drift=(c&&got!==CANARY)?got:'';
    if(!drift&&!/translated|notranslate-off/.test(cls)) return null;
    return {observed:drift, html_lang:document.documentElement.lang||'', html_class:cls};
  }
  function checkTranslation(){
    var d=detectTranslation();
    if(!d||!ME_()) return;
    var sig=d.observed+'|'+d.html_lang;
    if(sig===TR_SENT) return;
    TR_SENT=sig;
    fetch(SUPA_URL+'/rest/v1/page_translation?on_conflict=email,set_slug',{
      method:'POST', headers:head('resolution=merge-duplicates,return=minimal'),
      body:JSON.stringify([{email:ME_().email, set_slug:PAGE_SLUG, translated:true,
        observed:d.observed, html_lang:d.html_lang, html_class:d.html_class,
        updated_at:new Date().toISOString()}])}).catch(function(){});
  }
  window.checkTranslation=checkTranslation;
  setInterval(checkTranslation, 20000);
  setTimeout(checkTranslation, 4000);
})();
</script>
