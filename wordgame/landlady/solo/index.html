<style>
:root{--ink:#2b2016;--card:#fffaf0;--red:#b0281e;--green:#2f7a45;--amber:#c8781f;--blue:#2f5a7a;--line:2px solid #2b2016;--shadow:4px 4px 0 rgba(43,32,22,.28)}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);background:#e9dfca;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2{font-family:Lora,Georgia,serif;line-height:1.2;margin:.1em 0 .3em}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#f3ecd9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
.top .ttl{font-family:Lora,serif;font-weight:700;font-size:1.05rem;margin-right:auto}
.top a.back{background:#2f7a45;color:#fff;font-weight:800;text-decoration:none;padding:7px 14px;border-radius:8px;border:2px solid #fff}
.top select{font-size:.95rem;padding:4px;border-radius:6px}
.top .who,.top .saved{font-size:.85rem;color:#e6dcc4}
.top .saved.bad{color:#ffb3a8;font-weight:800}
.wrap{max-width:900px;margin:0 auto;padding:14px 12px 60px}
.box{background:var(--card);border:var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin:0 0 16px;display:flow-root}
.prog{display:flex;gap:10px;align-items:center;font-weight:800;margin:0 0 10px}
.bar{flex:1;height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.pic{border:var(--line);border-radius:12px;overflow:hidden;background:#efe6d6;line-height:0}
.pic svg{width:100%;height:auto;display:block}
.dir{margin:0 0 8px;font-weight:800;font-size:1.15rem}
.dir .tr{display:block;color:var(--blue);font-weight:700;font-size:1rem}
.dir .tr:empty{display:none}
.say{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;font-size:.9rem;vertical-align:middle;line-height:1.4}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.bank button{font-weight:800;font-size:.98rem;border:2px solid var(--ink);border-radius:999px;padding:3px 11px;background:#fff}
.bank button.used{opacity:.4}
.word{font-size:1.9rem;font-weight:900;font-family:Lora,serif}
.def{border:2px solid var(--ink);border-radius:10px;padding:8px 12px;background:#fff8e8;margin:6px 0 10px;font-weight:700}
.equiv{font-weight:800;text-decoration:underline;color:var(--blue)}
.equiv.none{color:#8a8a8a}
input.ans,textarea.ans{width:100%;font-family:inherit;font-size:1.3rem;font-weight:700;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff}
textarea.ans{min-height:4.5em;resize:vertical;font-size:1.15rem}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 18px;font-weight:800;font-size:1.05rem;margin-top:10px}
.btn.green{background:var(--green);border-color:#1a4a28}
.fb{margin-top:10px;font-weight:800;min-height:1.4em}
.miss{color:var(--red)}
.hint{color:#6b4a1a;font-weight:700;margin-top:4px}
.ok{color:var(--green);font-size:1.25rem}
.tries{margin-top:6px;font-size:.92rem}
.tries span{display:inline-block;border:1.5px solid var(--red);color:var(--red);border-radius:6px;padding:0 6px;margin:2px 4px 0 0;font-weight:800}
.tries span.good{border-color:var(--green);color:var(--green)}
.done-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.done-grid div{border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;font-weight:800;text-align:center;font-size:.95rem}
.done-grid svg{width:100%;height:auto;display:block}
.gate{position:fixed;inset:0;background:rgba(34,28,20,.86);display:flex;align-items:center;justify-content:center;z-index:80;padding:14px;overflow:auto}
.gbox{background:var(--card);border:3px solid #000;border-radius:14px;max-width:440px;width:100%;padding:16px 18px;box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.gbox label{display:block;font-weight:800;margin:8px 0 2px}
.gbox input,.gbox select{width:100%;font-size:1rem;padding:8px;border:2px solid var(--ink);border-radius:8px;font-family:inherit}
.gbox .row{display:flex;gap:8px}.gbox .row>div{flex:1}
.gerr{color:var(--red);font-weight:800;min-height:1.2em}
.gpic{line-height:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:8px;background:#efe6d6}
.gpic svg{width:100%;height:auto}
@media (max-width:700px){.card{grid-template-columns:1fr}}
</style>

<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PROXY='https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
var TABLE='landlady_responses',GUIDE_KEY='landlady_words_solo',TR_SLUG='landlady-words-solo';
var LANGS=['Mandarin','Cantonese','Spanish','Arabic','Vietnamese','Thai','Nepali','Russian','Darija','Urdu','Tagalog','French','Korean','Hindi','Somali'];
var RTL=/Arabic|Darija|Urdu/;
var CODES={es:'Spanish',zh:'Mandarin','zh-cn':'Mandarin',yue:'Cantonese','zh-hk':'Cantonese',ar:'Arabic',vi:'Vietnamese',th:'Thai',ne:'Nepali',ru:'Russian',ur:'Urdu',tl:'Tagalog',fr:'French',ko:'Korean',hi:'Hindi',so:'Somali',chinese:'Mandarin'};
function normLang(l){if(!l)return '';var s=String(l).trim();for(var i=0;i<LANGS.length;i++)if(LANGS[i].toLowerCase()===s.toLowerCase())return LANGS[i];return CODES[s.toLowerCase()]||'';}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(prefer){var h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};if(prefer)h.Prefer=prefer;return h;}

/* ---------- the 12 words, read live from the story's own files ---------- */
var FORMS={porter:'porter porters',compulsion:'compulsion compulsions compulsive',peculiar:'peculiar peculiarly',
 neglect:'neglect neglects neglected neglecting neglectful',preserved:'preserve preserves preserved preserving',
 briskly:'briskly brisk',lodgings:'lodgings lodging',dachshund:'dachshund dachshunds',
 'head office':'head office|head offices','big shots':'big shot|big shots',swanky:'swanky',nest:'nest nests nested nesting'};
var WORDS=(window.LL_WORDS||[]).filter(function(x){return window.LL_ART&&LL_ART[x.w];}).map(function(x){
 var f=FORMS[x.w]||x.w;return {w:x.w,def:x.def||'',forms:f.indexOf('|')>=0?f.split('|'):f.split(' ')};});
function W(id){for(var i=0;i<WORDS.length;i++)if(WORDS[i].w===id)return WORDS[i];return null;}
function pic(w){return (LL_ART[w]||'');}

/* ---------- speech ---------- */
var SAYAS={'I':'eye','___':'blank','______':'blank','W.':'W'};
function voice(){var vs=speechSynthesis.getVoices().filter(function(v){return /^en(-|_)(US|GB)/i.test(v.lang);});return vs.filter(function(v){return /Google|Samantha|Aria|Jenny|Daniel/i.test(v.name);})[0]||vs[0]||null;}
function speak(text,rate){
  if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();}catch(e){}
  var plain=String(text).replace(/<[^>]+>/g,'').replace(/[—–]/g,', ').replace(/_{2,}/g,' blank ');
  try{plain=plain.replace(/\p{Extended_Pictographic}|\uFE0F/gu,'');}catch(e){}
  var t=plain.split(/\s+/).map(function(tok){var core=tok.replace(/^[“"(]+|[”"),!?:;.]+$/g,'');var r=SAYAS[core];return r?tok.replace(core,r):tok;}).join(' ');
  var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||0.9;try{var v=voice();if(v)u.voice=v;}catch(e){}
  speechSynthesis.speak(u);
}
function sayBtn(text){return '<button type="button" class="say" data-say="'+esc(text)+'" aria-label="Listen">🔊</button>';}
function trBtn(text){return '<button type="button" class="trb" data-tr="'+esc(text)+'" aria-label="Translate">🌐</button>';}
function line(text){return tapWords(text)+sayBtn(text)+trBtn(text)+'<span class="trline"></span>';}

/* ---------- translation (queued, cached, shared) ---------- */
var shared={},sharedLoaded={},trCache={},queue=[],active=0;
function loadShared(l){if(!l)return Promise.resolve();if(sharedLoaded[l])return sharedLoaded[l];shared[l]={};
  sharedLoaded[l]=fetch(SUPA_URL+'/rest/v1/song_tr?select=src,equiv,meaning,note&slug=eq.'+TR_SLUG+'&lang=eq.'+encodeURIComponent(l),{headers:H()})
   .then(function(r){return r.ok?r.json():[];}).then(function(rows){(rows||[]).forEach(function(x){shared[l][x.src]={equiv:x.equiv,meaning:x.meaning,note:x.note};});}).catch(function(){});
  return sharedLoaded[l];}
function pump(){while(active<3&&queue.length){var j=queue.shift();active++;j().then(function(){active--;pump();},function(){active--;pump();});}}
function tr(text,ctx){
  if(!lang||!text)return Promise.resolve(null);
  var l=lang,src=ctx?text+'|'+ctx:text,key=l+'|'+src;
  if(trCache[key])return trCache[key];
  trCache[key]=loadShared(l).then(function(){
    if(shared[l]&&shared[l][src])return shared[l][src];
    return new Promise(function(res){queue.push(function(){
      var words=String(text).trim().split(/\s+/).length;
      var u=PROXY+'?action=translate&mode='+(words<=3?'word':'sentence')+'&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent(ctx||'')+'&lang='+encodeURIComponent(l);
      return fetch(u).then(function(r){return r.json();}).then(function(j){var t=(j&&j.ok&&j.translation)?j.translation:null;
        if(t&&t.equiv){shared[l][src]=t;fetch(SUPA_URL+'/rest/v1/song_tr?on_conflict=slug,lang,src',{method:'POST',headers:H('resolution=merge-duplicates,return=minimal'),body:JSON.stringify({slug:TR_SLUG,lang:l,src:src,equiv:t.equiv||'',meaning:t.meaning||'',note:t.note||''})}).catch(function(){});}
        res(t);}).catch(function(){delete trCache[key];res(null);});
    });pump();});
  });
  return trCache[key];
}
function dirHtml(text){return '<p class="dir" translate="no" data-dir="'+esc(text)+'"><span class="en">'+esc(text)+'</span>'+sayBtn(text)+'<span class="tr"></span></p>';}
function translateDirs(){
  document.querySelectorAll('.dir').forEach(function(d){var en=d.dataset.dir,t=d.querySelector('.tr');if(!t)return;t.textContent='';t.setAttribute('dir',RTL.test(lang)?'rtl':'auto');
    if(lang&&en)tr(en).then(function(x){if(x&&x.equiv&&d.dataset.dir===en)t.textContent=x.equiv;});});
  document.querySelectorAll('[data-wtr]').forEach(function(s){var w=s.getAttribute('data-wtr');s.innerHTML='';if(!lang)return;
    tr(w,s.getAttribute('data-ctx')||'').then(function(x){s.innerHTML=(x&&x.equiv)?'<span class="equiv">'+esc(x.equiv)+'</span>':'<span class="equiv none">'+esc(w)+'</span>';s.setAttribute('dir',RTL.test(lang)?'rtl':'auto');});});
}
function tapWords(text){return esc(text).split(/(\s+)/).map(function(w){if(/^\s+$/.test(w)||!w)return w;return '<span class="tw" translate="no" data-w="'+w.replace(/[^A-Za-z0-9'’.\-]/g,'').replace(/\.$/,'')+'">'+w+'</span>';}).join('');}


/* ---------- state ---------- */
var me=null,lang='',dirty=false,loaded=false;
var work={order:[],bank:{},items:{},pos:0,part:1,started:null,turnedIn:false};
function key(part,w){return 'p'+part+':'+w;}
function it(k){if(!work.items[k])work.items[k]={tries:[],done:false};return work.items[k];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function doneCount(){var c=0;Object.keys(work.items).forEach(function(k){if(work.items[k].done)c++;});return c;}
function total(){return WORDS.length*2;}
function makeOrder(){
 var have=WORDS.map(function(x){return x.w;});
 if(!work.order.length||work.order.some(function(w){return have.indexOf(w)<0;})||work.order.length!==have.length)work.order=shuffle(have);
 work.order.forEach(function(w){if(!work.bank[w])work.bank[w]=shuffle(have);});
}
function touch(){dirty=true;score();}

/* ---------- score + save (load before save) ---------- */
function score(){window.GAL_SCORE=doneCount();window.GAL_MAX=total();return window.GAL_SCORE;}
function missCount(){var m=0;Object.keys(work.items).forEach(function(k){var s=work.items[k];m+=Math.max(0,s.tries.length-(s.done?1:0));});return m;}
function rowFor(){score();
 var row={email:me.email,student_name:me.first+' '+me.last,period:String(me.period),guide_key:GUIDE_KEY,mode:'solo',lang:lang,
  payload:{work:work,meta:{answered:doneCount(),total:total(),misses:missCount()}},answered:doneCount(),total:total(),updated_at:new Date().toISOString()};
 if(doneCount()===total()&&!work.turnedIn){row.submitted=true;row.submitted_at=new Date().toISOString();}
 return row;}
function setSaved(t,bad){var s=$('saved');s.textContent=t;s.className='saved'+(bad?' bad':'');}
function save(){
 if(!me)return Promise.resolve();
 if(!loaded){setSaved('⚠ Can’t reach the server — your work is not saved yet',true);return Promise.resolve();}
 var row=rowFor();setSaved('Saving…');
 return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,guide_key',{method:'POST',headers:H('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([row])})
  .then(function(r){if(r&&r.ok){dirty=false;if(row.submitted)work.turnedIn=true;setSaved('Saved ✓');}else setSaved('Not saved — will retry',true);})
  .catch(function(){setSaved('Offline — will retry',true);});
}
function loadWork(){
 var both=[me.email,me.alias].filter(function(x,i,a){return x&&a.indexOf(x)===i;}).map(encodeURIComponent).join(',');
 return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=email,payload,submitted,updated_at&guide_key=eq.'+GUIDE_KEY+'&email=in.('+both+')',{headers:H()})
  .then(function(r){if(!r.ok)throw new Error('load '+r.status);return r.json();})
  .then(function(rows){
   rows=(rows||[]).sort(function(a,b){return String(b.updated_at).localeCompare(String(a.updated_at));});
   var r=rows[0];
   if(r&&r.payload&&r.payload.work){var d=r.payload.work;
    Object.keys(d.items||{}).forEach(function(k){var mine=work.items[k],srv=d.items[k];if(!mine||(!mine.done&&(srv.done||(srv.tries||[]).length>=(mine.tries||[]).length)))work.items[k]=srv;});
    if(d.order&&d.order.length)work.order=d.order;
    Object.keys(d.bank||{}).forEach(function(k){work.bank[k]=d.bank[k];});
    if(d.pos!=null)work.pos=d.pos;if(d.part)work.part=d.part;if(d.started)work.started=d.started;
    if(r.submitted)work.turnedIn=true;}
   loaded=true;return true;})
  .catch(function(){setSaved('⚠ Can’t reach the server — your work is not saved yet',true);return false;});
}
var ticking=false;
function startWork(){if(!work.started){work.started=new Date().toISOString();dirty=true;}makeOrder();render();if(!ticking){ticking=true;setInterval(function(){if(dirty&&loaded)save();},20000);}}
function loadUntilOk(first){return loadWork().then(function(ok){if(ok){setSaved('');startWork();return;}
 var a=$('app');if(a&&first)a.innerHTML='<div class="box"><b class="miss">⚠ Can’t reach the server.</b> Your work is not saved yet. This page will keep trying.</div>';
 setTimeout(function(){loadUntilOk(false);},first?3000:15000);});}

/* ---------- checking ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ').trim();}
function words(s){return norm(s).split(' ').filter(Boolean);}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=0;j<=n;j++)d[0][j]=j;
 for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function near(a,b){var k=b.length>=7?2:b.length>=5?1:0;return lev(a,b)<=k;}
function hasForm(raw,forms){var n=' '+norm(raw)+' ',w=words(raw);
 return forms.some(function(f){if(f.indexOf(' ')>=0)return n.indexOf(' '+f+' ')>=0;return w.some(function(x){return x===f||(f.length>=6&&near(x,f));});});}
function sentenceProblem(raw,c){var s=String(raw||'').trim();
 if(words(s).length<5)return 'Write a whole sentence — five words or more.';
 if(!hasForm(s,c.forms))return 'Use the word “'+c.w+'” in your sentence.';
 if(!/^[A-Z]/.test(s))return 'Start with a capital letter.';
 if(!/[.!?]$/.test(s))return 'End with a period ( . )';
 return '';}
function hint(c,n){
 if(n===1)return 'Look at the picture again. Find it in the word bank.';
 if(n===2)return 'It starts with “'+c.w.charAt(0)+'”: '+c.w.split('').map(function(ch,i){return i===0?ch:ch===' '?'\u00a0\u00a0':'_';}).join(' ');
 return 'It is one of these three: '+choices(c).join(' · ');}
function choices(c){var k='ch:'+c.w;if(!work.bank[k]){var o=shuffle(WORDS.filter(function(x){return x.w!==c.w;})).slice(0,2).map(function(x){return x.w;});work.bank[k]=shuffle([c.w].concat(o));}return work.bank[k];}

/* ---------- screens ---------- */
var DIR1='Look at the picture. What could it be? Write the word.';
var DIR2='Use the word in a sentence about the story or your life.';
function dirHtml(text){return '<p class="dir" data-dir="'+esc(text)+'">'+esc(text)+sayBtn(text)+'<span class="tr"></span></p>';}
function render(){
 var a=$('app');makeOrder();
 if(work.pos>=work.order.length){if(work.part===1){work.part=2;work.pos=0;touch();}else return renderDone();}
 var c=W(work.order[work.pos]),k=key(work.part,c.w),s=it(k),n=work.pos+1,N=work.order.length;
 var pct=Math.round(doneCount()/total()*100);
 var h='<div class="prog">Part '+work.part+' of 2 · '+n+' of '+N+'<div class="bar"><i style="width:'+pct+'%"></i></div>'+doneCount()+'/'+total()+'</div>';
 h+='<div class="box"><div class="card"><div class="pic">'+pic(c.w)+'</div><div>';
 if(work.part===1){
  h+=dirHtml(DIR1)+'<div class="bank">'+work.bank[c.w].map(function(w){return '<button type="button" data-fill="'+esc(w)+'">'+esc(w)+'</button>';}).join('')+'</div>'
   +'<input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word" value="'+esc(s.done?s.ans||c.w:'')+'"'+(s.done?' readonly':'')+'>';
 }else{
  h+=dirHtml(DIR2)+'<div class="word">'+esc(c.w)+sayBtn(c.w)+'</div>'
   +'<div class="def">'+esc(c.def)+sayBtn(c.def)+'<div><span data-wtr="'+esc(c.w)+'" data-ctx="'+esc(c.def)+'"></span></div></div>'
   +'<textarea class="ans" id="ans" placeholder="Write your sentence"'+(s.done?' readonly':'')+'>'+esc(s.done?s.ans||'':'')+'</textarea>';
 }
 h+=s.done?'':'<button class="btn" type="button" id="chk">Check</button>';
 h+='<div class="fb" id="fb">'+fbHtml(c,s)+'</div>'+triesHtml(s)+'</div></div>'
  +(s.done?'<div style="text-align:right"><button class="btn green" type="button" id="next">Next →</button></div>':'')+'</div>';
 a.innerHTML=h;translateDirs();
 var inp=$('ans');if(inp&&!s.done){inp.focus();inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!(work.part===2&&e.shiftKey)){e.preventDefault();check();}});}
 score();
}
function fbHtml(c,s){
 if(s.done){var x=work.part===1?'<div class="def" style="margin-top:8px"><b>'+esc(c.w)+'</b> = '+esc(c.def)+'<div><span data-wtr="'+esc(c.w)+'" data-ctx="'+esc(c.def)+'"></span></div></div>':'';
  return '<span class="ok">✓ '+(s.tries.length===1?'Right the first time!':'You got it.')+'</span>'+x;}
 var n=s.tries.length;if(!n)return '';
 return '<span class="miss">✗ Not yet.</span>'+(s.why?' <span class="miss">'+esc(s.why)+'</span>':'')+(work.part===1?'<div class="hint">'+esc(hint(c,n))+'</div>':'');
}
function triesHtml(s){if(!s.tries.length||work.part===2)return '';return '<div class="tries">'+s.tries.map(function(t,i){var good=s.done&&i===s.tries.length-1;return '<span class="'+(good?'good':'')+'">'+(good?'✓ ':'✗ ')+esc(t)+'</span>';}).join('')+'</div>';}
function check(){
 var c=W(work.order[work.pos]),k=key(work.part,c.w),s=it(k),raw=$('ans').value;
 if(!norm(raw)){$('fb').innerHTML='<span class="hint">Type your answer first.</span>';return;}
 if(work.part===1){
  var w=norm(raw),ok=w===c.w||near(w,c.w)||(c.w==='big shots'&&w==='big shot')||(c.w==='lodgings'&&w==='lodging');
  s.tries.push(raw.trim());if(ok){s.done=true;s.ans=c.w;}
 }else{
  var pr=sentenceProblem(raw,c);s.tries.push(raw.trim());
  if(pr)s.why=pr;else{s.done=true;s.ans=raw.trim();delete s.why;}
 }
 touch();render();
 if(s.done){speak(work.part===1?'Yes. '+c.w:'Good sentence.');save();}
}
function renderDone(){
 var h='<div class="box"><h1>Done! '+doneCount()+' / '+total()+'</h1><p>You named all 12 words and used each one in a sentence. Your work is saved for Mr. Toby.</p>'
  +'<div class="done-grid">'+work.order.map(function(w){var s=work.items[key(2,w)]||{};return '<div>'+pic(w)+esc(w)+'</div>';}).join('')+'</div>'
  +'<p style="margin-top:14px"><a class="btn green" style="text-decoration:none;display:inline-block" href="/readings/landlady/">← Back to The Landlady story</a></p></div>'
  +'<div class="box"><h2>My sentences</h2>'+work.order.map(function(w){var s=work.items[key(2,w)]||{};return '<p><b>'+esc(w)+':</b> '+esc(s.ans||'')+'</p>';}).join('')+'</div>';
 $('app').innerHTML=h;score();if(dirty)save();
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-say]');if(b){speak(b.getAttribute('data-say'));return;}
 var f=e.target.closest('[data-fill]');if(f){var i=$('ans');if(i&&!i.readOnly){i.value=f.getAttribute('data-fill');i.focus();}return;}
 if(e.target.id==='chk'){check();return;}
 if(e.target.id==='next'){work.pos++;touch();render();save();window.scrollTo(0,0);return;}
});

/* ---------- sign-in ---------- */
(function(){
 var sel=$('gLang'),top=$('lang');
 LANGS.forEach(function(l){var o=document.createElement('option');o.value=l;o.textContent=l;sel.appendChild(o);top.appendChild(o.cloneNode(true));});
 $('gatePic').innerHTML=pic('lodgings')||'';
 try{var rem=normLang(localStorage.getItem('vocab_lang'));if(rem)sel.value=rem;}catch(e){}
 try{var prev=JSON.parse(localStorage.getItem('eld_signin')||'null');if(prev){$('gFirst').value=prev.first||'';$('gLast').value=prev.last||'';$('gEmail').value=prev.alias||prev.email||'';$('gPeriod').value=prev.period||'';}}catch(e){}
})();
function canonEmail(raw){var e=String(raw||'').trim().toLowerCase();if(!/^[a-z0-9._+-]+@(s\.)?sfusd\.edu$/.test(e))return null;return {canon:e.split('@')[0]+'@sfusd.edu',alias:e.split('@')[0]+'@s.sfusd.edu',typed:e};}
$('gateForm').addEventListener('submit',function(ev){
 ev.preventDefault();
 var first=$('gFirst').value.trim(),last=$('gLast').value.trim(),em=canonEmail($('gEmail').value),per=$('gPeriod').value,lg=$('gLang').value,err=$('gErr');
 err.textContent='';
 if(!first||!last){err.textContent='Type your first and last name.';return;}
 if(!em){err.textContent='Use your school email: name@s.sfusd.edu';return;}
 if(!per){err.textContent='Choose your period.';return;}
 if(!lg){err.textContent='Choose your language.';return;}
 me={first:first,last:last,email:em.canon,alias:em.alias,period:per};
 work={order:[],bank:{},items:{},pos:0,part:1,started:null,turnedIn:false};loaded=false;dirty=false;
 try{localStorage.setItem('eld_signin',JSON.stringify({first:first,last:last,email:em.canon,alias:em.typed,period:per}));localStorage.setItem('gal_student_email',me.email);}catch(e){}
 setLang(lg);
 $('who').textContent=first+' '+last+' · P'+per;
 $('gate').style.display='none';
 fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:H('resolution=ignore-duplicates,return=minimal'),body:JSON.stringify([{email:me.email,first_name:first,last_name:last,period:per}])}).catch(function(){});
 if(em.typed!==em.canon)fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:H('resolution=merge-duplicates,return=minimal'),body:JSON.stringify([{alias_email:em.typed,email:em.canon}])}).catch(function(){});
 loadUntilOk(true);
});
function setLang(l){lang=normLang(l)||l;$('lang').value=lang;$('gLang').value=lang;try{localStorage.setItem('vocab_lang',lang);}catch(e){}loadShared(lang);translateDirs();dirty=true;}
$('lang').addEventListener('change',function(){setLang(this.value);});
window.addEventListener('beforeunload',function(){if(dirty&&me&&loaded)save();});
score();
</script>
