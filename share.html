<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galileo ELD · the year so far</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f4; --card:#ffffff; --ink:#14202b; --muted:#4f5d6b; --faint:#8a96a3; --line:#14202b; --rule:#c9d1d9;
  --c101:#0f6b5c; --c101s:#dcf1ec; --c103:#4a3aa8; --c103s:#e6e2fb; --cboth:#8a5a00; --cboths:#f7ebcc;
  --today:#d1262b; --shadow:0 3px 0 rgba(20,32,43,.18);
  --words:#c2410c; --grammar:#1d4ed8; --reading:#047857; --writing:#7e22ce; --speaking:#be185d; --assessment:#334155; --tools:#6b7280;
  --accent:var(--cboth); --accent-s:var(--cboths); --ontop:#ffffff;
  --lab:#6a3fa0; --try:#b5620c; --ready:#1d7a44; --ret:#7a7166;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0f1720; --card:#17222d; --ink:#e7edf3; --muted:#a9b6c3; --faint:#6f7f8f; --line:#a9b6c3; --rule:#2c3a48;
  --c101:#4fc9b2; --c101s:#123a33; --c103:#a99bff; --c103s:#272152; --cboth:#e8b44a; --cboths:#3a2c0e;
  --today:#ff5a5f; --shadow:0 3px 0 rgba(0,0,0,.5); --ontop:#10161d; --lab:#c4a3f0; --try:#f0a35c; --ready:#5fd38f; --ret:#b8afa3;
  --words:#fb8a4c; --grammar:#6f9bff; --reading:#34c79a; --writing:#c084fc; --speaking:#f472b6; --assessment:#a3b2c4; --tools:#9aa4b0;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0f1720; --card:#17222d; --ink:#e7edf3; --muted:#a9b6c3; --faint:#6f7f8f; --line:#a9b6c3; --rule:#2c3a48;
  --c101:#4fc9b2; --c101s:#123a33; --c103:#a99bff; --c103s:#272152; --cboth:#e8b44a; --cboths:#3a2c0e;
  --today:#ff5a5f; --shadow:0 3px 0 rgba(0,0,0,.5); --ontop:#10161d; --lab:#c4a3f0; --try:#f0a35c; --ready:#5fd38f; --ret:#b8afa3;
  --words:#fb8a4c; --grammar:#6f9bff; --reading:#34c79a; --writing:#c084fc; --speaking:#f472b6; --assessment:#a3b2c4; --tools:#9aa4b0;
}
body.c101{--accent:var(--c101);--accent-s:var(--c101s)}
body.c103{--accent:var(--c103);--accent-s:var(--c103s)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--accent);color:var(--ontop);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--accent)}
.topin{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.back{background:#fff;color:#14202b;font-weight:700;text-decoration:none;border-radius:9px;padding:7px 12px;border:2px solid #14202b;white-space:nowrap}
.top h1{font-size:1.3rem;line-height:1.1;color:var(--ontop)}
.top .sub{font-size:.85rem;opacity:.92}
.ttl{flex:1;min-width:200px}
.sw{display:flex;border:2px solid var(--ontop);border-radius:11px;overflow:hidden;background:rgba(0,0,0,.18)}
.sw button{border:0;background:transparent;color:var(--ontop);padding:7px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.sw button.on{background:var(--ontop);color:var(--accent)}
.tbtn{background:transparent;border:2px solid var(--ontop);color:var(--ontop);border-radius:9px;padding:6px 11px;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.15)}

/* ---------- ribbon: the year as a strip ---------- */
.ribbonwrap{background:var(--card);border-bottom:2px solid var(--line)}
.ribbon{max-width:1360px;margin:0 auto;padding:10px 16px 8px;overflow-x:auto}
.rib{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(64px,1fr);gap:4px;min-width:760px;position:relative}
.wk{border:2px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 5px 5px;cursor:pointer;text-align:left;min-height:66px;display:flex;flex-direction:column;gap:3px}
.wk:hover{background:var(--accent-s)}
.wk .wl{font-weight:700;font-size:.74rem;line-height:1}
.wk .dots{display:flex;flex-wrap:wrap;gap:2px}
.wk .dots i{width:7px;height:7px;border-radius:2px;display:block}
.wk.now{border-color:var(--today);box-shadow:inset 0 -4px 0 var(--today)}
.wk.now .wl{color:var(--today)}
.ribkey{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px;align-items:center}

/* ---------- controls ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:14px 16px 80px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.bar input{flex:1;min-width:200px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 11px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--card)}
.strands{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--sc,var(--line));color:var(--sc,var(--ink));background:var(--card);border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc,var(--ink))}
button.chip{cursor:pointer}
button.chip.off{opacity:.38}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.nav a{border:2px solid var(--line);border-radius:9px;padding:5px 11px;text-decoration:none;font-weight:700;background:var(--card);box-shadow:var(--shadow)}
.nav a:hover{background:var(--accent-s)}
#err{background:#fde3df;color:#7a1d12;border:2px solid #b23a2c;border-radius:10px;padding:9px 13px;font-weight:700;margin-bottom:12px}

/* ---------- boxes ---------- */
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden;display:flow-root}
.boxh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:11px 16px;border-bottom:2px solid var(--line);background:var(--accent-s)}
.boxh h2{font-size:1.25rem}
.boxh h3{font-size:1.08rem}
.boxh .when{font-weight:700;color:var(--accent);font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;white-space:nowrap}
.boxh .n{margin-left:auto;font-size:.82rem;color:var(--muted)}
.intro{padding:10px 16px;color:var(--muted);border-bottom:1px solid var(--rule);margin:0;max-width:85ch}
.monthh{font-size:1.6rem;margin:26px 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.monthh small{overflow-wrap:anywhere;font-family:"Atkinson Hyperlegible",sans-serif;font-size:.95rem;color:var(--muted);font-weight:400;letter-spacing:0}

/* ---------- rows ---------- */
.rows{display:block}
.head,.row{display:grid;grid-template-columns:104px 82px 66px minmax(220px,1.6fr) minmax(150px,1fr) minmax(150px,1fr) var(--tcols,0px);gap:10px;align-items:start;padding:9px 16px}
body.teacher{--tcols:150px}
.head{font-size:.76rem;font-weight:700;color:var(--muted);padding-top:7px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.row{border-bottom:1px solid var(--rule);position:relative}
.row:last-child{border-bottom:0}
.row.kclass{background:linear-gradient(90deg,var(--accent-s) 0 5px,transparent 5px)}
.thumb{width:104px;height:65px;border:2px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg);display:block;cursor:zoom-in;padding:0;position:relative}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.date{font-weight:700;font-size:.92rem;line-height:1.25}
.date .k{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.cpill{display:inline-block;border-radius:7px;padding:1px 7px;font-weight:700;font-size:.8rem;border:2px solid;white-space:nowrap}
.cpill.c101{color:var(--c101);border-color:var(--c101);background:var(--c101s)}
.cpill.c103{color:var(--c103);border-color:var(--c103);background:var(--c103s)}
.cpill.cboth{color:var(--cboth);border-color:var(--cboth);background:var(--cboths)}
.what{min-width:0}
.what .t{font-weight:700;line-height:1.35}
.what .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.book{display:inline-flex;gap:4px;align-items:center;border:2px dashed var(--ink);border-radius:6px;padding:0 7px;font-size:.78rem;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.lk{display:inline-flex;align-items:center;gap:4px;max-width:100%;border:2px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.84rem;text-decoration:none;background:var(--card);overflow-wrap:anywhere}
.lk:hover{background:var(--accent-s)}
.lk .ic{width:14px;height:14px;flex:0 0 14px}
.lk .sh{font-size:.8rem}
.lk .ct{font-size:.74rem;color:var(--muted);font-weight:700}
.none{color:var(--faint);font-style:italic;font-size:.85rem}
.tcol{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.badge{font-size:.8rem;font-weight:700;border:2px solid var(--line);border-radius:7px;padding:0 6px;background:var(--bg);white-space:nowrap}
.badge.lab{border-color:var(--lab);color:var(--lab)}.badge.trying{border-color:var(--try);color:var(--try)}.badge.ready{border-color:var(--ready);color:var(--ready)}.badge.retired{border-color:var(--ret);color:var(--ret)}
.cnt{font-size:.82rem;color:var(--muted)}
.cnt b{color:var(--ink);font-size:.95rem}
.push{border:2px solid var(--accent);background:var(--accent);color:var(--ontop);border-radius:8px;padding:3px 10px;font-weight:700;cursor:pointer;font-size:.85rem}
.push:hover{filter:brightness(1.1)}
.pushmenu{position:absolute;z-index:40;right:16px;top:100%;background:var(--card);border:2px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:200px}
.pushmenu a{padding:5px 8px;border-radius:6px;text-decoration:none;font-weight:700}
.pushmenu a:hover{background:var(--accent-s)}
.today{display:flex;align-items:center;gap:10px;color:var(--today);font-weight:700;padding:6px 16px;font-size:.9rem}
.today::before,.today::after{content:"";height:3px;background:var(--today);flex:1;border-radius:2px}
.empty{padding:12px 16px;color:var(--faint);font-style:italic}

/* ---------- other sections ---------- */
table.grid{width:100%;border-collapse:collapse}
table.grid th,table.grid td{border-bottom:1px solid var(--rule);padding:8px 12px;text-align:left;vertical-align:top}
table.grid th{font-size:.8rem;color:var(--muted)}
table.grid td:first-child{font-weight:700;white-space:nowrap}
table.grid td a{font-weight:700}
.scroll{overflow-x:auto}
.pad{padding:12px 16px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
.plan>div{border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.plan h3{margin-bottom:4px}
ol.flow{margin:0;padding:12px 16px 14px 44px}
ol.flow li{margin:4px 0;max-width:90ch}
.pic{float:right;width:120px;height:96px;margin:0 0 8px 14px}

/* ---------- preview ---------- */
#pv{position:fixed;z-index:60;width:min(660px,94vw);background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;display:none}
#pv .pvh{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--accent-s)}
#pv .pvh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pv .pvh button,#pv .pvh a{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:2px 9px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.85rem}
#pv .pvh button.on{background:var(--ink);color:var(--card)}
#pv .stage{position:relative;aspect-ratio:16/10;background:var(--bg)}
#pv .stage img,#pv .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;object-position:top}
#pv .stage .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;color:var(--muted)}
#pv .stage .msg svg{width:110px;height:110px}
#pv .url{font-size:.75rem;color:var(--muted);padding:5px 10px;overflow-wrap:anywhere;border-top:1px solid var(--rule)}

/* ---------- phones ---------- */
@media (max-width:860px){
  .head{display:none}
  .row{grid-template-columns:96px 1fr;gap:6px 12px}
  .row .thumb{grid-row:span 3;width:96px;height:60px}
  .row .date{grid-column:2}
  .row .cp{grid-column:2;margin-top:-4px}
  .row .what,.row .dig,.row .pap,.row .tcol{grid-column:1 / -1}
  .row .dig::before{content:"Digital";display:block;font-size:.72rem;font-weight:700;color:var(--muted)}
  .row .pap::before{content:"Paper";display:block;font-size:.72rem;font-weight:700;color:var(--muted)}
  .row .tcol{flex-direction:row;flex-wrap:wrap;align-items:center}
  .plan{grid-template-columns:1fr}
  .top h1{font-size:1.1rem}
  .top{position:static}
  html{scroll-padding-top:12px}
  .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--muted:#333;--line:#000;--rule:#999;--shadow:none}
  body{font-size:10.5pt;background:#fff}
  .top,.ribbonwrap,.bar,.nav,#pv,.thumb,.push,.tcol .cnt,#err,.noprint{display:none!important}
  .printhead{display:block!important;margin-bottom:8pt}
  .wrap{padding:0;max-width:none}
  .box{box-shadow:none;break-inside:auto;border-width:1.5px;border-radius:6px;margin-bottom:10pt}
  .boxh{background:#fff!important;break-after:avoid}
  .head,.row{grid-template-columns:62px 44px minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) var(--ptcol,0px);padding:4px 8px;gap:6px}
  body.teacher{--ptcol:70px}
  .head>div:first-child,.row>.thumb{display:none}
  .row{break-inside:avoid}
  .lk{border:1px solid #666;font-size:8.5pt;padding:0 4px}
  .lk::after{content:""}
  .monthh{break-after:avoid;font-size:15pt}
  #scope,#august,#flow,#doors{break-before:page}
  .row.kclass{background:none;border-left:4px solid #000}
  a{text-decoration:none}
}
.printhead{display:none}
</style>
</head>
<body class="cboth share">
<header class="top">
  <div class="topin">
    
    <div class="ttl">
      <h1>The year so far: calendar, scope &amp; sequence</h1>
      <div class="sub" id="sub">Galileo ELD · Aug 17 to today</div>
    </div>
    <div class="sw" role="group" aria-label="Course">
      <button data-c="101">ELD 101</button><button data-c="103">ELD 103</button><button data-c="both" class="on">Both</button>
    </div>
    <button class="tbtn" id="theme" title="Light or dark">◐</button>
    
    <button class="tbtn" id="print">Print</button>
  </div>
</header>

<div id="gate" class="hide" style="max-width:380px;margin:60px auto;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:22px">
  <h2 style="font-size:1.2rem;margin-bottom:6px">Teacher sign-in</h2>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:9px;font:inherit;margin:8px 0;background:var(--card);color:var(--ink)">
  <button id="go" class="push" style="width:100%;padding:9px">Open</button>
  <div id="pwmsg" style="color:#b23a2c;font-size:.85rem;margin-top:6px"></div>
</div>

<div id="app" class="">
  <div class="ribbonwrap noprint"><div class="ribbon"><div class="rib" id="rib"></div>
    <div class="ribkey" id="ribkey"></div></div></div>
  <div class="wrap">
    <div class="printhead"><h1 style="font-size:16pt">Galileo ELD — the year so far</h1><div id="printsub"></div></div>
    <div id="err" class="hide"></div>
    <nav class="nav" aria-label="Sections">
      <a href="#weeks">Week by week</a><a href="#scope">Scope &amp; sequence</a><a href="#august">August plan</a><a href="#flow">Workflow</a><a href="#doors">Teacher front doors</a>
    </nav>
    <div class="bar">
      <input id="q" type="search" placeholder="Search a story, a lesson, a Do Now…" autocomplete="off">
      <div class="seg" role="group" aria-label="Kind"><button data-k="" class="on">All</button><button data-k="class">In class</button><button data-k="site">On the site</button></div>
      <div class="strands" id="strands"></div>
    </div>
    <section id="weeks"></section>
    <section id="scope"></section>
    <section id="august"></section>
    <section id="flow"></section>
    <section id="doors"></section>
    <p style="color:var(--muted);font-size:.85rem" id="foot"></p>
  </div>
</div>

<div id="pv" role="dialog" aria-label="Preview">
  <div class="pvh"><b id="pvt"></b><button id="pvpic" class="on">Picture</button><button id="pvlive">Live</button><a id="pvopen" target="_blank" rel="noopener">Open</a><button id="pvx" aria-label="Close">✕</button></div>
  <div class="stage" id="pvs"></div>
  <div class="url" id="pvu"></div>
</div>

<script src="year.js"></script>
<script>
(function(){
var MODE='share';           /* 'teacher' (index.html) or 'share' (share.html) */
var TEACHER = MODE==='teacher';
var Y=window.YEAR, ROWS=Y.rows;
var SITE='https://tobiasrugger.github.io/readings/';
var STRANDS=[['words','Words'],['grammar','Grammar'],['reading','Reading'],['writing','Writing'],['speaking','Speaking'],['assessment','Assessment'],['tools','Tools & data']];
var COURSE='both', KIND='', Q='', OFF={}, SHELF={}, COUNTS=null, COUNTS_FAILED=false;
var TEACHER_RE=/\/readings\/(dashboards|gradebook|assign|groups|atlas|roadmap|desk|skills|checks|shelves|teacher|reports|audit)\//;
var DEFAULT_SHELF={'/readings/launch-plus/weekend/board.html':'retired','/readings/landlady-easy/':'retired','/readings/landlady-hard/':'retired'};
var SHELF_EMO={lab:'🧪 Lab',trying:'🔧 Trying',ready:'✅ Ready',retired:'📦 Retired'};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function md(s){ return esc(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(m,t,u){return '<a href="'+u+'" target="_blank" rel="noopener" data-pv="'+u+'" data-pvt="'+t+'">'+t+'</a>';}); }

/* ---------- dates ---------- */
var MON=['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
function iso(d){return d.toISOString().slice(0,10);}
function parse(s){return new Date(s+'T12:00:00Z');}
function monday(s){var d=parse(s);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return iso(d);}
function nice(s){var d=parse(s);return MON[d.getUTCMonth()]+' '+d.getUTCDate();}
function addDays(s,n){var d=parse(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);}
var TODAY=(function(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');})();
var TODAYMON=monday(TODAY);
var WEEKTITLE={}; Y.weeks.forEach(function(w){WEEKTITLE[w[0]]=w[1];});
var WEEKS=[]; (function(){var w=Y.start, last=TODAYMON<Y.weeks[Y.weeks.length-1][0]?Y.weeks[Y.weeks.length-1][0]:TODAYMON; while(w<=last){WEEKS.push(w);w=addDays(w,7);} })();

/* ---------- links: digital vs paper, shots, previews ---------- */
function isSite(u){return u.indexOf(SITE)===0;}
function pathOf(u){ /* '/readings/launch-plus/u1-l1/' — the key shelf_status uses */
  var p=u.slice(SITE.length-'readings/'.length-1); p=p.split('#')[0].split('?')[0]; return p; }
function slugOf(u){ /* same rule as track.js */
  var p=pathOf(u).replace(/^\/+/,'').replace(/\.html?$/i,'').replace(/^readings\//,'').replace(/\/index$/,'').replace(/\/$/,''); return p||'home'; }
function shotName(u){
  var p=u.slice(SITE.length).replace(/\/+$/,'');
  if(/\.html$/.test(p)) p=p.replace(/(\/index)?\.html$/,function(m,g){return g?'':'_html';});
  p=p.replace(/[^a-zA-Z0-9-]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase(); return p||'home'; }
function ltype(u){
  if(isSite(u)) return 'site';
  if(/docs\.google\.com\/document/.test(u)) return 'doc';
  if(/docs\.google\.com\/spreadsheets/.test(u)) return 'sheet';
  if(/docs\.google\.com\/presentation/.test(u)) return 'slides';
  if(/drive\.google\.com\/drive\/folders/.test(u)) return 'folder';
  if(/drive\.google\.com\/file/.test(u)) return 'pdf';
  if(/youtube\.com|youtu\.be/.test(u)) return 'video';
  if(/quill\.org/.test(u)) return 'quill';
  if(/github\.com/.test(u)) return 'repo';
  if(/newsela/.test(u)) return 'news';
  return 'web';
}
function embedUrl(u){
  var t=ltype(u), m;
  if(t==='site') return u;
  if(t==='doc'||t==='sheet'||t==='slides'){ m=u.match(/\/d\/([^/]+)/); if(m) return u.split('/d/')[0]+'/d/'+m[1]+'/preview'; }
  if(t==='pdf'){ m=u.match(/\/file\/d\/([^/]+)/); if(m) return 'https://drive.google.com/file/d/'+m[1]+'/preview'; }
  if(t==='folder'){ m=u.match(/folders\/([^/?#]+)/); if(m) return 'https://drive.google.com/embeddedfolderview?id='+m[1]+'#grid'; }
  if(t==='video'){ m=u.match(/[?&]v=([^&]+)/); if(m) return 'https://www.youtube.com/embed/'+m[1]; }
  return null; /* Quill, GitHub, Newsela refuse to be framed */
}

function show(r){

  if(KIND && r.kind!==KIND && !(KIND==='site'&&r.kind==='pre')) return false;

    if(!Q.split(/\s+/).every(function(w){return hay.indexOf(w)>-1;})) return false; }

}

var PV=$('pv'), pvTimer=null, pvUrl=null, pvLive=false, pvPinned=false;
function pvRender(){

}
function pvShow(el,ev,pin){
  var u=el.getAttribute('data-pv'); if(!u) return;
  clearTimeout(pvTimer);
  if(u!==pvUrl){ pvUrl=u; pvLive= ltype(u)!=='site'; $('pvt').textContent=el.getAttribute('data-pvt')||u; pvRender(); }
  PV.style.display='block'; pvPinned=!!pin;
  var r=el.getBoundingClientRect(), w=PV.offsetWidth, h=PV.offsetHeight, vw=innerWidth, vh=innerHeight;
  var x = r.right+14+w<vw ? r.right+14 : (r.left-14-w>0 ? r.left-14-w : Math.max(8,(vw-w)/2));
  var y = Math.min(Math.max(8,r.top-40), vh-h-8);
  if(vw<700){ x=(vw-w)/2; y=Math.max(8,(vh-h)/2); }
  PV.style.left=x+'px'; PV.style.top=Math.max(8,y)+'px';
}
function pvHideSoon(){ if(pvPinned) return; clearTimeout(pvTimer); pvTimer=setTimeout(function(){PV.style.display='none';},260); }
var canHover = matchMedia('(hover:hover)').matches;

document.addEventListener('mouseout',function(e){ if(!canHover) return; var el=e.target.closest('[data-pv],#pv'); if(el && !(e.relatedTarget && el.contains(e.relatedTarget))) pvHideSoon(); });

document.addEventListener('click',function(e){
  var th=e.target.closest('.thumb[data-pv]'); if(th){ pvShow(th,e,true); return; }
  var wk=e.target.closest('.wk'); if(wk){ var t=$('w-'+wk.getAttribute('data-w')); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  var sb=e.target.closest('[data-s]'); if(sb){ var s=sb.getAttribute('data-s'); OFF[s]=!OFF[s]; renderAll(); return; }
  var pb=e.target.closest('[data-push]'); if(pb){ pushFor(pb); return; }
  if(!e.target.closest('.pushmenu')) document.querySelectorAll('.pushmenu').forEach(function(m){m.remove();});
  if(!e.target.closest('#pv') && pvPinned && !e.target.closest('[data-pv]')){ PV.style.display='none'; pvPinned=false; }
});
function pushHref(u){ var p=pathOf(u); return SITE+'assign/?q='+encodeURIComponent(p)+'&pick='+encodeURIComponent(p); }
function pushFor(btn){
  var r=ROWS.filter(function(x){return x.id===btn.getAttribute('data-push');})[0]; if(!r) return;
  var sites=r.digital.filter(function(l){return isSite(l[1]) && !/\/(dashboards|gradebook|assign|groups|atlas|roadmap|desk|skills|checks|shelves)\//.test(l[1]);});
  if(!sites.length) sites=r.digital.filter(function(l){return isSite(l[1]);});
  if(sites.length===1){ window.open(pushHref(sites[0][1]),'_blank','noopener'); return; }
  document.querySelectorAll('.pushmenu').forEach(function(m){m.remove();});
  var m=document.createElement('div'); m.className='pushmenu';
  m.innerHTML='<b style="padding:2px 8px;font-size:.8rem;color:var(--muted)">Push which page?</b>'+sites.map(function(l){return '<a href="'+pushHref(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>';}).join('');
  btn.closest('.row').appendChild(m);
}

/* ---------- controls ---------- */
document.querySelectorAll('.sw [data-c]').forEach(function(b){ b.onclick=function(){ COURSE=b.getAttribute('data-c');
  document.querySelectorAll('.sw [data-c]').forEach(function(x){x.classList.toggle('on',x===b);});
  document.body.classList.remove('c101','c103','cboth'); document.body.classList.add('c'+COURSE); renderAll(); }; });
document.querySelectorAll('.seg [data-k]').forEach(function(b){ b.onclick=function(){ KIND=b.getAttribute('data-k');
  document.querySelectorAll('.seg [data-k]').forEach(function(x){x.classList.toggle('on',x===b);}); renderAll(); }; });
$('q').addEventListener('input',function(){ Q=this.value.trim().toLowerCase(); renderAll(); });
$('print').onclick=function(){ window.print(); };
$('theme').onclick=function(){ var d=document.documentElement, cur=d.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  var nx=cur==='dark'?'light':'dark'; d.setAttribute('data-theme',nx); try{localStorage.setItem('year_theme',nx);}catch(e){} };
try{ var th=localStorage.getItem('year_theme'); if(th) document.documentElement.setAttribute('data-theme',th);}catch(e){}
if($('share')) $('share').onclick=function(){ var u=SITE+'year/share.html'; (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){ $('share').textContent='Link copied'; setTimeout(function(){$('share').textContent='Share link';},1800); },function(){ prompt('Share this link',u); }); };

function loadTeacher(){}
/* ---------- gate ---------- */
function open_(){ $('gate').classList.add('hide'); $('app').classList.remove('hide'); renderAll(); if(TEACHER) loadTeacher();
  if(location.hash){ var t=document.querySelector(location.hash); if(t) setTimeout(function(){t.scrollIntoView();},50); } }
if(TEACHER){
  try{ if(sessionStorage.getItem('gal_teacher')==='1') open_(); }catch(e){}
  $('go').onclick=function(){ if($('pw').value==='galileo2026'){ try{sessionStorage.setItem('gal_teacher','1');['gb_ok','gr_ok','rm_ok','dash_ok','teacher_ok'].forEach(function(k){sessionStorage.setItem(k,'1');});}catch(e){} open_(); } else $('pwmsg').textContent='Not it — try again.'; };
  $('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') $('go').click(); });
} else open_();
window.__YEAR_READY=true;
})();
</script>
