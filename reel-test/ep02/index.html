<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Check 2: The Backpack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2233;--paper:#fff8ec;--card:#fff;--or:#F8981F;--pu:#864D9E;--gr:#1f8a5b;--grl:#e3f6ea;--mut:#6d6377;--line:2px solid #2b2233}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:18px;line-height:1.45}
button{font:inherit;cursor:pointer}
.hide{display:none!important}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--pu);color:#fff;border-bottom:4px solid var(--ink)}
header.top h1{margin:0;font-size:22px;font-weight:900}
header.top .sub{font-size:14px;opacity:.9}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:900;font-size:14px;border:2px solid #fff;margin-left:6px}
.badge.practice{background:var(--gr)}.badge.test{background:#c0392b}
.hdr-r{display:flex;gap:8px;align-items:center}
select.lang{font:inherit;font-size:15px;padding:6px 8px;border-radius:9px;border:2px solid #fff;background:#fff;color:var(--ink)}
#saved{font-size:13px;font-weight:800;min-width:70px;text-align:right}
#netErr{background:#fde2e0;color:#8a1f12;border:2px solid #8a1f12;padding:10px 14px;margin:10px 16px;border-radius:12px;font-weight:800}
main{max-width:1000px;margin:0 auto;padding:14px}
.box{background:var(--card);border:var(--line);border-radius:16px;box-shadow:0 4px 0 rgba(43,34,51,.25);padding:16px;margin:0 0 16px;display:flow-root}
.dir{font-weight:800;margin:0 0 4px}
.dir-tr{color:var(--mut);font-size:16px;margin:0 0 6px;min-height:0}
.pic{float:right;width:46%;max-width:380px;margin:0 0 10px 16px;border:var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pic svg{display:block;width:100%;height:auto}
@media (max-width:640px){.pic{float:none;width:100%;max-width:none;margin:0 0 10px}}
/* menu */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border:var(--line);border-radius:14px;box-shadow:0 4px 0 rgba(43,34,51,.25);padding:0;text-align:left;overflow:hidden;position:relative;color:var(--ink)}
.card .cpic{height:120px;border-bottom:var(--line);background:#f3ecdf}
.card .cpic svg{width:100%;height:100%;display:block}
.card .ctx{padding:10px 12px}
.card b{font-size:19px;display:block}
.card .cnt{font-size:14px;color:var(--mut);font-weight:800}
.card.done{border-color:var(--gr)}
.card.done .cnt{color:var(--gr)}
.card.next{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 rgba(43,34,51,.25)}50%{box-shadow:0 0 0 6px rgba(248,152,31,.55)}}
.card.locked{opacity:.55}
.card .lock{position:absolute;top:8px;right:8px;background:#fff;border:var(--line);border-radius:999px;padding:2px 8px;font-size:14px}
h2.grp{font-size:20px;margin:6px 0 10px;font-weight:900}
.turnin{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--gr);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 18px;font-weight:900;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.or{background:var(--or);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.rec{background:#c0392b}
.btn.rec.on{animation:pulse 1s infinite}
/* section */
.sechead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sechead h2{margin:0;font-size:22px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.dot.cur{background:var(--or)}.dot.ok{background:var(--gr);color:#fff}.dot.ans{background:#cfc6d8}
.stem{font-size:22px;font-weight:800;margin:4px 0 10px}
.qw{cursor:pointer;border-bottom:2px dotted #b9a9c9}
.qw:hover{background:#fff3d6}
.sbtn{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font-size:16px;margin-left:4px;vertical-align:middle}
.trline{color:var(--mut);font-size:17px;margin:-4px 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;clear:both}
.opt{background:#fff;border:var(--line);border-radius:12px;padding:12px 14px;font-weight:800;font-size:19px;text-align:left;box-shadow:0 3px 0 rgba(43,34,51,.3);display:flex;align-items:center;justify-content:space-between;gap:6px}
.opt.sel{background:#fff1d8;border-color:var(--or)}
.opt.ok{background:var(--grl);border-color:var(--gr)}
.opt.fade{opacity:.28;pointer-events:none;text-decoration:line-through}
.opt .hear{font-size:15px}
.tr-eq{font-weight:900;text-decoration:underline}
.tr-none{font-weight:900;text-decoration:underline;color:#8b8494}
.hint{background:#fff7d6;border:2px solid #b8860b;border-radius:12px;padding:8px 12px;margin:10px 0;font-weight:800;display:flex;gap:10px;align-items:center;clear:both}
.hint svg{width:54px;height:54px;flex:none;border-radius:50%;background:#f3ecdf;border:2px solid var(--ink)}
.good{color:var(--gr);font-weight:900;font-size:20px;margin:10px 0;clear:both}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px;clear:both}
input.txt,textarea.txt{font:inherit;font-size:20px;padding:10px 12px;border:var(--line);border-radius:12px;width:100%;background:#fff}
textarea.txt{min-height:140px;font-size:18px}
.wc{font-size:14px;color:var(--mut);font-weight:800}
.boxes{font-size:26px;letter-spacing:6px;font-weight:900;margin:6px 0}
.play{font-size:22px;padding:14px 22px}
.big{font-size:30px;font-weight:900;line-height:1.35;margin:6px 0 14px}
.heard{color:var(--mut);font-size:16px}
.miss{background:#ffe1b8;border-radius:5px;padding:0 3px}
.fixline{font-size:24px;font-weight:800;line-height:2.1;margin:6px 0 10px}
.fw{display:inline-block;border:2px solid transparent;border-radius:8px;padding:0 5px;cursor:pointer}
.fw:hover{border-color:#b9a9c9}
.fw.ed{background:#fff1d8;border-color:var(--or)}
.fw.okfix{background:var(--grl);border-color:var(--gr)}
.fw input{font:inherit;font-size:22px;width:9em;border:2px solid var(--or);border-radius:8px;padding:0 4px}
/* tap-then-tap */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:52px;padding:8px;border:2px dashed var(--ink);border-radius:12px;background:#faf6ef}
.chip{background:#fff;border:var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:17px;box-shadow:0 2px 0 var(--ink)}
.chip.sel{background:var(--or)}
.chip.right{background:var(--grl);border-color:var(--gr)}
.slots{list-style:none;padding:0;margin:8px 0}
.slots li{display:flex;align-items:center;gap:10px;border:var(--line);border-radius:12px;padding:6px 10px;margin:6px 0;min-height:64px;background:#fff;cursor:pointer}
.slots li .n{font-size:24px;font-weight:900;width:34px;text-align:center}
.slots li .thumb{width:90px;height:52px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.slots li .thumb svg{width:100%;height:100%}
.placecard{display:inline-flex;align-items:center;gap:8px;background:#fff;border:var(--line);border-radius:12px;padding:4px 10px 4px 4px;font-weight:800;box-shadow:0 2px 0 var(--ink)}
.placecard .thumb{width:80px;height:46px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.placecard .thumb svg{width:100%;height:100%}
.placecard.sel{background:var(--or)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:8px 0}
.who button{background:#fff;border:var(--line);border-radius:12px;padding:4px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.who button.sel{background:#fff1d8;border-color:var(--or);outline:3px solid var(--or)}
.who svg{width:100%;height:130px;display:block}
.venn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.zone{border:var(--line);border-radius:16px;min-height:150px;padding:8px;background:#fff;cursor:pointer}
.zone h4{margin:0 0 6px;text-align:center;font-size:18px}
.zone.both{background:#fff7e6}
.zone .chip{display:block;margin:4px 0;text-align:center}
@media(max-width:640px){.venn{grid-template-columns:1fr}}
.pairs label{display:inline-flex;gap:6px;align-items:center;border:var(--line);border-radius:12px;padding:6px 12px;margin:4px;font-weight:800;background:#fff}
/* gate */
.gate{position:fixed;inset:0;background:rgba(43,34,51,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.gate-in{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:20px;max-width:460px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.gate-in h2{margin:0 0 6px}
.gate-in label{display:block;font-weight:800;margin:10px 0 4px}
.gate-in .txt{font-size:18px;padding:8px 10px}
.gate-in .row{display:flex;gap:8px}
.gate-in .row>div{flex:1}
#gerr{color:#8a1f12;font-weight:800;min-height:1em}
/* tap popup */
#tip{position:absolute;z-index:60;background:#fff;border:var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.25);max-width:280px;font-size:17px}
#quip{display:none}
.lion{position:absolute;width:34px;height:34px;cursor:pointer;opacity:.9;z-index:5}
.fire{position:fixed;width:8px;height:8px;border-radius:50%;z-index:99;pointer-events:none}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:20px 0}
.score-note{font-weight:800;color:var(--gr)}
.ext-tag{display:inline-block;background:var(--pu);color:#fff;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:900;margin-left:6px}
details.help{border:2px solid var(--ink);border-radius:12px;padding:6px 12px;margin:8px 0;background:#fffdf6}
details.help summary{font-weight:900;cursor:pointer}
</style>
</head>

var VOICE=null;
function pickVoice(){ if(!window.speechSynthesis) return; var v=speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang);}); VOICE=v.filter(function(x){return x.localService&&/en-US/i.test(x.lang);})[0]||v.filter(function(x){return /en-US/i.test(x.lang);})[0]||v[0]||null; }

function speak(text,rate){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var t=String(text).replace(/(^|[^A-Za-z])I([^A-Za-z]|$)/g,'$1eye$2');
  var u=new SpeechSynthesisUtterance(t); u.lang='en-US'; if(VOICE)u.voice=VOICE; u.rate=rate||0.85;
  setTimeout(function(){speechSynthesis.speak(u);},40);
}

/* ======================= TRANSLATION ======================= */
var TRC={};
function translate(text,mode,ctx,cb){
  var lg=ME.lang; if(!lg){cb('');return;}
  var key=lg+'|'+mode+'|'+text+'|'+(ctx||''); if(TRC[key]!==undefined){cb(TRC[key]);return;}
  var u=PROXY+'?action=translate&mode='+mode+'&idiom='+encodeURIComponent(text)+'&meaning='+encodeURIComponent(ctx||'')+'&lang='+encodeURIComponent(lg);
  var done=false,ctl=window.AbortController?new AbortController():null;
  var tm=setTimeout(function(){if(done)return;done=true;try{ctl&&ctl.abort();}catch(e){}cb('');},10000);
  fetch(u,ctl?{signal:ctl.signal}:undefined).then(function(r){return r.text();}).then(function(t){
    if(done)return;done=true;clearTimeout(tm);var d=null;try{d=JSON.parse(t);}catch(e){}
    var tr=d&&d.translation, v=tr?(mode==='word'?(tr.equiv||tr.meaning||''):(tr.meaning||tr.equiv||'')):'';
    TRC[key]=v; cb(v);
  }).catch(function(){if(done)return;done=true;clearTimeout(tm);cb('');});
}
function dirTranslate(root){

/* ======================= SHUFFLE (stored per student; no slot more than 3 in a row) ======================= */
function shuffleAll(){
  var lastSlot=-1,run=0;
  var mcs=[].concat(WORDS_PIC.map(function(x){return {id:x.id,opts:x.opts,a:0};}),WORDS_LANG.map(function(x){return {id:x.id,opts:[0,1,2,3],a:0};}),LISTEN,STORY,GRAM);
  mcs.forEach(function(it){
    if(S.ord[it.id]){ var s0=S.ord[it.id].indexOf(it.a||0); if(s0===lastSlot)run++; else {lastSlot=s0;run=1;} return; }
    var n=it.opts.length, p, slot, tries=0;
    do{ p=[]; for(var i=0;i<n;i++)p.push(i); for(var j=n-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=p[j];p[j]=p[k];p[k]=t;} slot=p.indexOf(it.a||0); tries++; }
    while(slot===lastSlot&&run>=3&&tries<50);
    if(slot===lastSlot)run++; else {lastSlot=slot;run=1;}
    S.ord[it.id]=p;
  });
  /* place banks and chip banks */
  if(!S.ord.places){var pl=[0,1,2,3,4];do{pl.sort(function(){return Math.random()-.5;});}while(pl.join()==='0,1,2,3,4');S.ord.places=pl;}
}

/* ======================= SCORING ======================= */
function itemPts(id){ var a=S.ans[id]; if(!a) return 0; return PRACTICE?(a.first?1:0):(a.ok?1:0); }
function readAuto(r){ if(!r||r.acc==null) return null; return r.acc>=0.9?2:(r.acc>=0.6?1:0); }
function secScore(k){
  var pts=0,max=0,done=0,total=0;
  if(k==='read'){ READ.forEach(function(it){ var r=S.read[it.id]; total++; max+=2; if(r&&r.done){done++; var p=readAuto(r); pts+=p||0;} }); }
  else if(k==='words'){ WORDS_PIC.concat(WORDS_LANG).forEach(function(it){total++;max++;if(S.ans[it.id]&&S.ans[it.id].done){done++;pts+=itemPts(it.id);}}); }
  else if(k==='listen'){ LETTERS.concat(DICT).concat(LISTEN).forEach(function(it){total++;max++;if(S.ans[it.id]&&S.ans[it.id].done){done++;pts+=itemPts(it.id);}}); }
  else if(k==='story'){ STORY.forEach(function(it){total++;max++;if(S.ans[it.id]&&S.ans[it.id].done){done++;pts+=itemPts(it.id);}}); }
  else if(k==='gram'){ GRAM.forEach(function(it){total++;max++;if(S.ans[it.id]&&S.ans[it.id].done){done++;pts+=itemPts(it.id);}}); }
  else if(k==='fix'){ FIX.forEach(function(it){total++;max+=it.errs.length;var a=S.ans[it.id];if(a&&a.done){done++;pts+=(a.pts||0);}}); }
  return {pts:pts,max:max,done:done,total:total};
}
function coreDone(){ return SECTIONS.every(function(s){var x=secScore(s.k);return x.done>=x.total;}); }
function totals(){
  var out={},P=0,M=0; SECTIONS.forEach(function(s){var x=secScore(s.k);out[s.k]={pts:x.pts,max:x.max,done:x.done,total:x.total};P+=x.pts;M+=x.max;});
  out.total=P; out.max=M; out.ext=extScores(); return out;
}
function extScores(){
  var e={},x=S.ext;
  if(x.order&&x.order.checked){ var right=0; (x.order.slots||[]).forEach(function(p,i){if(p===i)right++;}); e.order={auto:right>=5?4:right>=4?3:right>=3?2:right>=1?1:0,right:right}; }
  if(x.summary&&x.summary.text){ e.summary={auto:sumRubric(x.summary.text).score}; }
  if(x.describe&&x.describe.checked){ e.describe={auto:x.describe.auto}; }
  if(x.compare&&x.compare.checked){ e.compare={auto:x.compare.auto}; }
  if(x.retell&&x.retell.done){ e.retell={auto:x.retell.auto}; }
  if(x.talk&&x.talk.done){ e.talk={auto:x.talk.auto}; }
  return e;
}
function setGal(){ var t=totals(); window.GAL_SCORE=t.total; window.GAL_MAX=t.max; window.GAL_COMPLETION={done:SECTIONS.filter(function(s){var x=secScore(s.k);return x.done>=x.total;}).length,total:SECTIONS.length}; }

function showNet(msg){ var n=$('netErr'); if(!msg){n.classList.add('hide');return;} n.innerHTML=msg; n.classList.remove('hide'); }
function load(){
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=work,turned_in&email=eq.'+encodeURIComponent(ME.email)+'&test_key=eq.'+TEST_KEY,{headers:H()})
  .then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,120));}); return r.json(); })
  .then(function(rows){
    if(rows&&rows[0]&&rows[0].work){ var w=rows[0].work; ['ord','ans','read','ext','pos','log'].forEach(function(k){ if(w[k]) S[k]=Object.assign(S[k]||{},w[k]); }); S.turned=!!rows[0].turned_in||!!w.turned; S.startedAt=w.startedAt||S.startedAt; }
    LOADED=true; showNet('');
  }).catch(function(e){ LOADED=false; showNet('Can\u2019t reach the server, so nothing is saving yet. Tell Mr. Toby. <button class="btn alt" id="netRetry">Try again</button> <small>('+esc(e.message)+')</small>'); var b=$('netRetry'); if(b)b.onclick=function(){load().then(afterLoad);}; });
}
function save(turnIn){
  if(!LOADED||!ME.email) return Promise.resolve();
  if(SAVING&&!turnIn) return Promise.resolve();
  SAVING=true; DIRTY=false; setGal(); $('saved').textContent='Saving\u2026';
  var row={email:ME.email,test_key:TEST_KEY,episode:'ep02',mode:MODE,student_name:ME.name,period:ME.period,lang:ME.lang,work:S,scores:totals(),updated_at:new Date().toISOString()};
  if(turnIn) row.turned_in=true;
  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email,test_key',{method:'POST',headers:H({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([row])})
  .then(function(r){ SAVING=false; if(!r.ok) return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,120));}); $('saved').textContent='\u2713 Saved'; })
  .catch(function(e){ SAVING=false; DIRTY=true; $('saved').textContent='Not saved'; showNet('Your last answers did not save ('+esc(e.message)+'). Keep working \u2014 it will try again.'); });
}

function placeLion(){

  if(S.log.lion) return;

  i=n;j=m; while(i>0&&j>0){ if(sim(pw[i-1],tw[j-1])&&dp[i][j]===dp[i-1][j-1]+1){hit[i-1]=1;i--;j--;} else if(dp[i-1][j]>=dp[i][j-1])i--; else j--; }
  var missed=[]; for(i=0;i<n;i++) if(!hit[i]) missed.push(i);
  return {acc:Math.round(Object.keys(hit).length/n*100)/100,missed:missed,n:n};
}

function gotRead(o,box,blob,heard,secs){
  var it=o.it, r=S.read[it.id]||(S.read[it.id]={tries:0});

  var take={heard:heard,acc:(SR&&heard)?al.acc:null,missed:al.missed,secs:Math.round(secs*10)/10,at:new Date().toISOString()};
  r.tries++; r.takes=(r.takes||[]).concat([take]).slice(-4);
  /* keep the best take */
  if(!r.done||take.acc==null||r.acc==null||take.acc>=r.acc){ r.heard=heard; r.acc=take.acc; r.missed=al.missed; r.secs=take.secs; r.best=r.takes.length-1; r.path=null; r.up=null; var keep=true; }
  r.done=true; touch(); rRead(o,box);
  upload(blob,it.id+'_'+r.tries,function(path,err){ var t=r.takes[r.takes.length-1]; t.path=path; if(keep){ r.path=path; r.up=!!path; } if(err)t.err=err; touch(); save(); if(CUR&&CUR.items[CUR.i]===o)rRead(o,box); });
}

  var pl=['library','gym','classroom','cafeteria','music corner','corner'].filter(function(w){return s.indexOf(w)>=0;}).length; if(pl>=3){sc++;why.push('places');}
