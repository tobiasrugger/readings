<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Check 2: The Backpack — Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2233;--pu:#864D9E;--or:#F8981F;--gr:#1f8a5b;--mut:#6d6377}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:#fff8ec;color:var(--ink)}
header{background:var(--pu);color:#fff;padding:14px 16px 14px 160px;border-bottom:4px solid var(--ink)}
header h1{margin:0;font-size:22px}
main{padding:14px;max-width:1400px;margin:0 auto}
.box{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(43,34,51,.25);padding:14px;margin-bottom:14px;display:flow-root}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,button,input{font:inherit}
select,input[type=password]{padding:6px 10px;border:2px solid var(--ink);border-radius:9px}
.btn{background:var(--gr);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:7px 14px;font-weight:900;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink)}
.seg button{border:2px solid var(--ink);background:#fff;padding:6px 12px;font-weight:800;cursor:pointer}
.seg button:first-child{border-radius:9px 0 0 9px}.seg button:last-child{border-radius:0 9px 9px 0;border-left:0}
.seg button.on{background:var(--or)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid #cfc6d8;padding:6px 8px;text-align:center}
th{background:#f3ecdf;position:sticky;top:0}
td.nm{text-align:left;font-weight:800;cursor:pointer;color:var(--pu);text-decoration:underline}
tr.sel td{background:#fff1d8}
.s4{background:#d8f2e0}.s3{background:#eef7d6}.s2{background:#fff3cc}.s1{background:#ffe0cc}.s0{background:#fdd}
.pend{color:#b25b00;font-weight:900}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--gr);font-weight:900}.no{color:#c0392b;font-weight:900}
.rd{display:grid;grid-template-columns:1fr auto;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:10px;margin:8px 0;align-items:center}
.rd .t{font-size:18px;font-weight:800}
.rd .miss{background:#ffe1b8;border-radius:4px;padding:0 2px}
.pts button{border:2px solid var(--ink);background:#fff;width:40px;height:36px;font-weight:900;cursor:pointer}
.pts button.on{background:var(--or)}
.pts button.auto{outline:3px dashed var(--gr)}
audio{height:34px;max-width:100%}
h3{margin:14px 0 6px}
.items{width:100%;font-size:14px}
.items td{text-align:left}
#gate{position:fixed;inset:0;background:rgba(43,34,51,.9);display:flex;align-items:center;justify-content:center;z-index:50}
#gate .in{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:20px}
.ext{border:2px solid var(--ink);border-radius:12px;padding:10px;margin:8px 0}
.ext pre{white-space:pre-wrap;font-family:inherit;background:#faf6ef;border:1px solid #cfc6d8;border-radius:8px;padding:8px;margin:6px 0}
#status{font-weight:800}
.err{color:#8a1f12;font-weight:800}
</style>
</head>
<body>
<div id="gate"><div class="in"><h2 style="margin-top:0">Teacher page</h2><input type="password" id="pw" placeholder="Password"> <button class="btn" id="pwGo">Open</button><p id="pwMsg" class="err"></p></div></div>
<header><h1>Story Check 2: The Backpack &mdash; teacher</h1><div class="mut" style="color:#f3e6ff">Listen to every read-aloud, change any score, see the extras. Your number always wins over the computer&rsquo;s.</div></header>
<main>
  <div class="box ctrl">
    <label>Period <select id="per"><option value="">All</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label>
    <span class="seg" id="modeSeg"><button data-m="practice" class="on">Practice</button><button data-m="test">Test</button></span>
    <button class="btn alt" id="reload">Refresh</button>
    <span id="status"></span>
    <span class="mut" id="links"></span>
  </div>
  <div class="box" style="overflow-x:auto"><table id="tbl"></table></div>
  <div class="box" id="detail"><p class="mut">Tap a name to listen, check answers and change scores.</p></div>
</main>
<script src="content.js"></script>
<script>
(function(){
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var BUCKET='fluency-recordings', PASS='galileo2026';
var MODE='practice', ROWS=[], STUDENTS=[], CUR=null, T=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(x){var h={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};for(var k in x)h[k]=x[k];return h;}
function canon(e){return String(e||'').trim().toLowerCase().replace(/@s\.sfusd\.edu$/,'@sfusd.edu');}
function sb(p){return fetch(SUPA_URL+'/rest/v1/'+p,{headers:H()}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,140));});return r.json();});}
function pref(k,v){try{if(v===undefined)return sessionStorage.getItem('sc2_'+k);sessionStorage.setItem('sc2_'+k,v);}catch(e){return null;}}

$('pwGo').onclick=function(){ if($('pw').value===PASS){pref('ok','1');open();} else $('pwMsg').textContent='Not right \u2014 try again.'; };
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('pwGo').click();});
if(pref('ok')==='1') open();
function open(){ $('gate').style.display='none'; if(pref('per'))$('per').value=pref('per'); if(pref('mode'))MODE=pref('mode'); paintMode(); loadAll(); }
function paintMode(){ document.querySelectorAll('#modeSeg button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-m')===MODE);});
  var base=location.origin+location.pathname.replace(/dashboard\.html$/,'');
  $('links').innerHTML='Student links: <a href="'+base+'" target="_blank">practice</a> \u00b7 <a href="'+base+'?mode=test" target="_blank">test</a>'; }
document.querySelectorAll('#modeSeg button').forEach(function(b){b.onclick=function(){MODE=b.getAttribute('data-m');pref('mode',MODE);paintMode();CUR=null;loadAll();};});
$('per').onchange=function(){pref('per',this.value);CUR=null;loadAll();};
$('reload').onclick=function(){loadAll();};

/* ---------- scoring (mirrors the student page; teacher numbers win) ---------- */
function readAuto(r){ if(!r||r.acc==null) return null; return r.acc>=0.9?2:(r.acc>=0.6?1:0); }
function readPts(row){ var w=row.work||{}, t=row.teacher||{}, tr=t.read||{}, p=0, pend=0;
  READ.forEach(function(it){ var r=(w.read||{})[it.id]; if(tr[it.id]!=null){p+=+tr[it.id];return;} var a=readAuto(r); if(r&&r.done&&a==null)pend++; p+=a||0; });
  return {pts:p,max:READ.length*2,pend:pend}; }
function finalScore(row){ var sc=row.scores||{}, r=readPts(row), tot=r.pts, max=r.max;
  ['words','listen','story','fix','gram'].forEach(function(k){ if(sc[k]){tot+=sc[k].pts;max+=sc[k].max;} });
  return {pts:tot,max:max||1,pct:Math.round(tot/(max||1)*100)}; }
function band(p){ return p>=90?4:p>=80?3:p>=65?2:p>=40?1:0; }
function extVal(row,k){ var t=(row.teacher||{}).ext||{}; if(t[k]!=null) return {v:+t[k],teacher:true}; var e=((row.scores||{}).ext||{})[k]; return e&&e.auto!=null?{v:e.auto,teacher:false}:null; }

function loadAll(){
  $('status').textContent='Loading\u2026';
  var p=$('per').value, jobs=[];
  jobs.push(sb('reel_tests?select=*&test_key=eq.ep02-'+MODE+(p?'&period=eq.'+encodeURIComponent(p):'')).then(function(r){ROWS=r;}));
  jobs.push(sb('students?select=email,first_name,last_name,period'+(p?'&period=eq.'+encodeURIComponent(p):'')).then(function(r){STUDENTS=r;}).catch(function(){STUDENTS=[];}));
  Promise.all(jobs).then(function(){ $('status').textContent=''; draw(); if(CUR){var again=ROWS.filter(function(r){return canon(r.email)===CUR;})[0]; if(again) showDetail(again);} })
  .catch(function(e){ $('status').innerHTML='<span class="err">Could not load: '+esc(e.message)+(String(e.message).indexOf('reel_tests')>=0||/404|42P01/.test(e.message)?' \u2014 the reel_tests SQL has not been run yet.':'')+'</span>'; });
}
function draw(){
  /* one student = one row: merge @s.sfusd.edu / @sfusd.edu */
  var by={};
  ROWS.forEach(function(r){ var k=canon(r.email); if(!by[k]||new Date(r.updated_at)>new Date(by[k].updated_at)) by[k]=r; });
  var list=Object.keys(by).map(function(k){return by[k];});
  var seen={}; list.forEach(function(r){seen[canon(r.email)]=1;});
  var missing=STUDENTS.filter(function(s){return !seen[canon(s.email)];});
  list.sort(function(a,b){return String(a.student_name||'').localeCompare(String(b.student_name||''));});
  var cols=['Read aloud','Words','Listen','Story','Fix it','Grammar'];
  var h='<tr><th style="text-align:left">Student</th><th>P</th>'+cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'<th>Total</th><th>0\u20134</th><th>Extras</th><th>Left page</th><th>Turned in</th><th>Last saved</th></tr>';
  list.forEach(function(r){
    var sc=r.scores||{}, rp=readPts(r), f=finalScore(r), b=band(f.pct);
    function cell(k){ var x=sc[k]; if(!x) return '<td>\u2014</td>'; return '<td>'+x.pts+'/'+x.max+(x.done<x.total?'<div class="mut">'+x.done+' of '+x.total+' done</div>':'')+'</td>'; }
    var ex=EXTS.map(function(e){var v=extVal(r,e.k);return v?e.k.charAt(0).toUpperCase()+v.v:'';}).filter(Boolean).join(' ');
    var lg=(r.work||{}).log||{};
    h+='<tr data-e="'+esc(canon(r.email))+'"'+(CUR===canon(r.email)?' class="sel"':'')+'><td class="nm">'+esc(r.student_name||r.email)+'</td><td>'+esc(r.period||'')+'</td>'+
      '<td>'+rp.pts+'/'+rp.max+(rp.pend?' <span class="pend" title="needs your ear">\u2022'+rp.pend+'</span>':'')+((r.teacher||{}).read&&Object.keys(r.teacher.read).length?'<div class="mut">you scored</div>':'')+'</td>'+
      cell('words')+cell('listen')+cell('story')+cell('fix')+cell('gram')+
      '<td>'+f.pts+'/'+f.max+'<div class="mut">'+f.pct+'%</div></td><td class="s'+b+'"><b>'+b+'</b></td><td>'+(ex||'\u2014')+'</td>'+
      '<td>'+(lg.leaves||0)+(lg.translated?'<div class="mut">browser translate on</div>':'')+'</td><td>'+(r.turned_in?'\u2713':'')+'</td><td class="mut">'+new Date(r.updated_at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</td></tr>';
  });
  missing.sort(function(a,b){return String(a.last_name||'').localeCompare(String(b.last_name||''));}).forEach(function(s){
    h+='<tr><td style="text-align:left" class="mut">'+esc((s.first_name||'')+' '+(s.last_name||''))+'</td><td>'+esc(s.period||'')+'</td><td colspan="12" class="mut">not started</td></tr>';
  });
  $('tbl').innerHTML=h;
  $('tbl').querySelectorAll('tr[data-e]').forEach(function(tr){tr.onclick=function(){var e=tr.getAttribute('data-e');var r=list.filter(function(x){return canon(x.email)===e;})[0];CUR=e;draw();showDetail(r);};});
}
function audioTag(path){ if(!path) return '<span class="mut">no recording</span>'; return '<audio controls preload="none" src="'+SUPA_URL+'/storage/v1/object/public/'+BUCKET+'/'+esc(path)+'" data-p="'+esc(path)+'"></audio>'; }
function showDetail(r){
  T=JSON.parse(JSON.stringify(r.teacher||{})); T.read=T.read||{}; T.ext=T.ext||{};
  var w=r.work||{}, h='<h2 style="margin:0">'+esc(r.student_name||r.email)+' <span class="mut">'+esc(r.email)+' \u00b7 '+(MODE==='test'?'Test':'Practice')+' \u00b7 language '+esc(r.lang||'?')+'</span></h2>';
  h+='<h3>Read aloud <span class="mut">dashed = the computer\u2019s guess; tap a number to set yours</span></h3>';
  READ.forEach(function(it){
    var x=(w.read||{})[it.id], words=it.t.split(' ');
    var txt=x&&x.missed?words.map(function(wd,i){return x.missed.indexOf(i)>=0?'<span class="miss">'+esc(wd)+'</span>':esc(wd);}).join(' '):esc(it.t);
    var auto=readAuto(x), mine=T.read[it.id];
    h+='<div class="rd"><div><div class="t">'+(it.isNew?'<span class="mut">NEW \u00b7 </span>':'')+txt+'</div>'+(x&&x.done?audioTag(x.path)+' <span class="mut">heard: \u201c'+esc(x.heard||'')+'\u201d \u00b7 '+(x.acc!=null?Math.round(x.acc*100)+'%':'no speech recognition')+' \u00b7 '+(x.tries||1)+' tr'+((x.tries||1)>1?'ies':'y')+'</span>'+((x.takes||[]).length>1?'<div class="mut">other takes: '+x.takes.map(function(t,i){return i===x.best?'':(t.path?'<a href="'+SUPA_URL+'/storage/v1/object/public/'+BUCKET+'/'+esc(t.path)+'" target="_blank">take '+(i+1)+'</a>':'');}).filter(Boolean).join(' ')+'</div>':''):'<span class="mut">not read yet</span>')+'</div>'+
      '<div class="pts" data-r="'+it.id+'">'+[0,1,2].map(function(n){return '<button data-n="'+n+'" class="'+(mine===n?'on ':'')+(mine==null&&auto===n?'auto':'')+'">'+n+'</button>';}).join('')+'</div></div>';
  });
  function itemsTable(title,list,fn){ h+='<h3>'+title+'</h3><table class="items"><tr><th>Item</th><th>Answer(s)</th><th>Tries</th><th></th></tr>'; list.forEach(function(it){ var a=(w.ans||{})[it.id]; h+='<tr><td>'+fn(it)+'</td><td>'+(a?esc(answerText(it,a)):'<span class="mut">\u2014</span>')+'</td><td>'+(a?a.tries||0:'')+'</td><td>'+(a&&a.done?(a.ok?'<span class="ok">\u2713'+(MODE==='practice'&&!a.first?' (not first try)':'')+'</span>':'<span class="no">\u2717</span>'):'')+'</td></tr>'; }); h+='</table>'; }
  itemsTable('Words',WORDS_PIC.concat(WORDS_LANG),function(it){return esc(it.a||it.w)+(it.pic?' <span class="mut">(picture)</span>':' <span class="mut">(home language'+(((w.ans||{})[it.id]||{}).fallback?' \u2014 English meanings shown':'')+')</span>');});
  itemsTable('Listen',LETTERS.concat(DICT).concat(LISTEN),function(it){return esc(it.q||it.w||('\u201c'+it.say+'\u201d'))+' <span class="mut">plays: '+(((w.log||{}).plays||{})[it.id]||0)+'</span>';});
  itemsTable('Story questions',STORY,function(it){return esc(it.q);});
  itemsTable('Fix the sentence',FIX,function(it){return esc(it.s)+' <span class="mut">('+it.errs.length+' error'+(it.errs.length>1?'s':'')+')</span>';});
  itemsTable('Grammar',GRAM,function(it){return esc(it.q);});
  h+='<h3>Extra challenges <span class="mut">dashed = the computer\u2019s suggestion</span></h3>';
  var e=w.ext||{};
  EXTS.forEach(function(x){
    var v=extVal(r,x.k), auto=(((r.scores||{}).ext||{})[x.k]||{}).auto, mine=T.ext[x.k], d=e[x.k], body='';
    if(!d){ body='<span class="mut">not tried</span>'; }
    else if(x.k==='order'){ body='Order: '+(d.slots||[]).map(function(p,i){return p==null?'\u2014':'<span class="'+(p===i?'ok':'no')+'">'+(i+1)+'. '+PLACES[p][1]+'</span>';}).join(' \u00b7 ')+' <span class="mut">('+(d.tries||0)+' checks, first check '+(d.first!=null?d.first+'/5':'\u2014')+')</span>'; }
    else if(x.k==='summary'){ body='<pre>'+esc(d.text||'')+'</pre>'; }
    else if(x.k==='describe'){ body='Chose <b>'+esc(CAST_NAME[d.who]||'\u2014')+'</b>. Tapped: '+(d.inBox||[]).map(function(f){var fa=FACTS.filter(function(z){return z[0]===f;})[0];return '<span class="'+(fa&&fa[1].indexOf(d.who)>=0?'ok':'no')+'">'+esc(f)+'</span>';}).join(', ')+'<pre>'+esc(d.text||'')+'</pre>'; }
    else if(x.k==='compare'){ var P=PAIRS.filter(function(p){return p.id===d.pair;})[0]; body=P?('<b>'+CAST_NAME[P.a]+' / '+CAST_NAME[P.b]+'</b>: '+P.chips.map(function(c){var z=(d.place||{})[c[0]];return '<span class="'+(z===c[1]?'ok':'no')+'">'+esc(c[0])+' \u2192 '+(z==='a'?CAST_NAME[P.a]:z==='b'?CAST_NAME[P.b]:z==='both'?'both':'\u2014')+'</span>';}).join(' \u00b7 ')+'<pre>'+esc(d.text||'')+'</pre>'):''; }
    else { body=audioTag(d.path)+' <span class="mut">'+Math.round(d.secs||0)+' s \u00b7 heard: \u201c'+esc(d.heard||'')+'\u201d</span>'; }
    h+='<div class="ext"><b>'+esc(x.t)+'</b> <span class="pts" data-x="'+x.k+'">'+[0,1,2,3,4].map(function(n){return '<button data-n="'+n+'" class="'+(mine===n?'on ':'')+(mine==null&&auto===n?'auto':'')+'">'+n+'</button>';}).join('')+'</span><div>'+body+'</div></div>';
  });
  var lg=w.log||{};
  h+='<p class="mut">Left the page '+(lg.leaves||0)+' time'+((lg.leaves||0)===1?'':'s')+(lg.translated?' \u00b7 browser translation was turned on':'')+' \u00b7 words tapped for translation: '+(lg.tap||0)+' \u00b7 started '+(w.startedAt?new Date(w.startedAt).toLocaleString():'?')+'</p>';
  h+='<p><button class="btn" id="saveT">Save my scores</button> <span id="saveMsg"></span></p>';
  $('detail').innerHTML=h;
  $('detail').querySelectorAll('.pts[data-r] button').forEach(function(b){b.onclick=function(){var id=b.parentNode.getAttribute('data-r'),n=+b.getAttribute('data-n');if(T.read[id]===n)delete T.read[id];else T.read[id]=n;b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',T.read[id]===+x.getAttribute('data-n'));});$('saveMsg').textContent='not saved yet';};});
  $('detail').querySelectorAll('.pts[data-x] button').forEach(function(b){b.onclick=function(){var id=b.parentNode.getAttribute('data-x'),n=+b.getAttribute('data-n');if(T.ext[id]===n)delete T.ext[id];else T.ext[id]=n;b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',T.ext[id]===+x.getAttribute('data-n'));});$('saveMsg').textContent='not saved yet';};});
  $('saveT').onclick=function(){ saveTeacher(r); };
  /* recordings that are not public fall back to a signed link */
  $('detail').querySelectorAll('audio[data-p]').forEach(function(a){ a.addEventListener('error',function(){ if(a.dataset.signed)return; a.dataset.signed=1; fetch(SUPA_URL+'/storage/v1/object/sign/'+BUCKET+'/'+a.dataset.p,{method:'POST',headers:H(),body:JSON.stringify({expiresIn:3600})}).then(function(x){return x.json();}).then(function(j){ if(j&&(j.signedURL||j.signedUrl)) a.src=SUPA_URL+'/storage/v1'+(j.signedURL||j.signedUrl); }).catch(function(){}); },{once:true}); });
}
function answerText(it,a){
  if(a.edits) return Object.keys(a.edits).map(function(k){return it.s.split(' ')[k]+' \u2192 '+a.edits[k];}).join(', ')||'(no change)';
  if(a.vals) return a.vals.join(' / ');
  if(a.val!=null) return a.val;
  var opts=it.opts||(it.w?WORDS_LANG.map(function(x){return x.def;}):[]);
  if(a.pick!=null&&it.opts) return it.opts[a.pick];
  if(a.misses&&a.misses.length) return 'missed first: '+a.misses.join(', ');
  return a.done?(a.ok?'right':'wrong'):'';
}
function saveTeacher(r){
  var row=Object.assign({},r,{teacher:T}); var f=finalScore(row);
  $('saveMsg').textContent='Saving\u2026';
  fetch(SUPA_URL+'/rest/v1/reel_tests?email=eq.'+encodeURIComponent(r.email)+'&test_key=eq.'+encodeURIComponent(r.test_key),{method:'PATCH',headers:H({Prefer:'return=minimal'}),body:JSON.stringify({teacher:T,teacher_at:new Date().toISOString()})})
  .then(function(x){ if(!x.ok) return x.text().then(function(t){throw new Error(x.status+' '+t.slice(0,140));});
    return fetch(SUPA_URL+'/rest/v1/activity_attempts',{method:'POST',headers:H({Prefer:'return=minimal'}),body:JSON.stringify([{email:canon(r.email),slug:'reel-test/ep02-'+MODE,score:f.pts,max_score:f.max,detail:{source:'teacher',read:readPts(row).pts,ext:T.ext},completed_at:new Date().toISOString()}])}).catch(function(){});
  }).then(function(){ r.teacher=T; $('saveMsg').innerHTML='<span class="ok">\u2713 Saved \u2014 '+f.pts+'/'+f.max+' ('+band(f.pct)+')</span>'; draw(); })
  .catch(function(e){ $('saveMsg').innerHTML='<span class="err">Not saved: '+esc(e.message)+'</span>'; });
}
})();
</script>
<script src="/readings/grade04.js"></script>
</body>
</html>
