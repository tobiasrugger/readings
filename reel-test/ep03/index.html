/* ======================= SPEECH ======================= */
/* T-266: Chrome's speech engine can jam (no sound, no error). Every speak now: resume() first; cancel+resume if an old
   utterance is stuck; wait for onstart; if it hasn't started after 1.5 s, cancel and retry ONCE with the browser's default
   voice; if that never starts either, show a friendly "No sound?" line and count it in S.log.nosound. The ▶ Play / 🔊
   button that asked for the sound pulses while it plays. A test-mode play only counts once the sound really started. */
var VOICE=null, VOICE_DEFAULT=false;
var BAD_VOICE=/bad news|bubbles|grandma|grandpa|rocko|albert|bahh|bells|boing|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy|shelley|reed|sandy|flo|eddy|eloquence/i;
function pickVoice(){ if(!window.speechSynthesis) return; var all=speechSynthesis.getVoices()||[];
  var v=all.filter(function(x){return /^en/i.test(x.lang)&&!BAD_VOICE.test(x.name);});
  var by=function(n){return v.filter(function(x){return x.name.indexOf(n)===0;})[0];};
  VOICE=by('Google US English')||by('Samantha')||by('Alex')||v.filter(function(x){return /en[-_]US/i.test(x.lang);})[0]||v[0]||null; }
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}

  var b=SPK_BTN; SPK_BTN=null; if(SPK_ON&&SPK_ON!==b)spkOff(SPK_ON); SPK_ON=b; if(!b) return;
  b.classList.add('speaking'); if((b.id==='playIt'||b.id==='playSlow')&&!b.getAttribute('data-label')){ b.setAttribute('data-label',b.innerHTML); b.innerHTML='\ud83d\udd0a Playing\u2026'; } }

function sayOne(text,rate,o,retried){

  u.lang='en-US'; if(VOICE&&!VOICE_DEFAULT&&!retried){ try{u.voice=VOICE;}catch(e){} } u.rate=rate;
  u.onstart=function(){ if(o.my!==SEQ)return; started=true; if(retried)VOICE_DEFAULT=true; var n=$('nosnd'); if(n)n.classList.add('hide'); if(o.onstart)o.onstart(); };

  u.onend=fin; u.onerror=function(){ if(started)fin(); };
  setTimeout(function(){ if(started||ended||o.my!==SEQ)return; try{speechSynthesis.cancel();}catch(e){}
    if(!retried){ ended=true; sayOne(text,rate,o,true); } else { ended=true; spkUi(false); noSound(); if(o.onfail)o.onfail(); } },1500);
  try{ speechSynthesis.speak(u); }catch(e){}

var SEQ=0;
function speak(text,rate,opt){
  if(!window.speechSynthesis) return; opt=opt||{};

  var t=String(text).replace(/(^|[^A-Za-z])I([^A-Za-z]|$)/g,'$1eye$2');
  var first=true;
  setTimeout(function(){ if(my!==SEQ)return; spkUi(true);
    sayOne(t,rate||0.85,{my:my,onstart:function(){ if(first){first=false; if(opt.onstart)opt.onstart();}
        setTimeout(function(){ if(my===SEQ)spkUi(false); },1500+t.length*110/(rate||0.85)); /* if Chrome drops onend */ },
      onend:function(){ if(my===SEQ)spkUi(false); }}); },40);

/* T-257: say a list of letters one at a time with a real pause between them, so O and L don't blur.
   onStep(k) fires as letter k starts (k=-1 when finished). */
function speakLetters(list,rate,gap,onStep,opt){
  if(!window.speechSynthesis) return; opt=opt||{}; try{speechSynthesis.cancel();}catch(e){} var my=++SEQ, i=0, first=true;
  spkUi(true);
  function next(){
    if(my!==SEQ) return;
    if(i>=list.length){ spkUi(false); if(onStep)onStep(-1); return; }
    var k=i++, done=false;
    function after(){ if(done)return; done=true; setTimeout(next,gap); }
    sayOne(list[k],rate,{my:my,onstart:function(){ if(onStep)onStep(k); if(first){first=false; if(opt.onstart)opt.onstart();} setTimeout(after,2200); /* Chrome sometimes drops onend */ },onend:after,onfail:function(){ done=true; if(onStep)onStep(-1); }});

/* ======================= SHUFFLE (stored per student; no slot more than 3 in a row) ======================= */
function shuffleAll(){
  /* T-196: per section, the correct answer is dealt into slots 1-4 evenly (a shuffled deck of slots),
     never the same slot more than 3 times in a row across the whole page. Orders are stored per student.
     Items a student already answered keep their order; everything else is re-dealt once (ordV 2). */
  var groups=[
    WORDS_PIC.map(function(x){return {id:x.id,n:x.opts.length,a:0};}).concat(WORDS_LANG.map(function(x){return {id:x.id,n:4,a:0};})),
    LISTEN.map(function(x){return {id:x.id,n:x.opts.length,a:x.a};}),
    STORY.map(function(x){return {id:x.id,n:x.opts.length,a:x.a};}),
    GRAM.map(function(x){return {id:x.id,n:x.opts.length,a:x.a};})
  ];
  var redeal=S.ordV!==2;
  function rnd(n){return Math.floor(Math.random()*n);}
  function shuf(arr){for(var j=arr.length-1;j>0;j--){var k=rnd(j+1),t=arr[j];arr[j]=arr[k];arr[k]=t;}return arr;}
  var history=[];  /* correct slots in page order, for the run rule */
  groups.forEach(function(items){
    var keep={}, todo=[];
    items.forEach(function(it){ var done=S.ans[it.id]&&S.ans[it.id].done; if(S.ord[it.id]&&(done||!redeal)) keep[it.id]=1; else todo.push(it); });
    /* a deck of slots, balanced across this section's open items */
    var tries=0, deck, ok;
    do{
      deck=[]; var counts=[0,0,0,0];
      items.forEach(function(it){ if(keep[it.id]) counts[S.ord[it.id].indexOf(it.a)]++; });
      for(var i=0;i<todo.length;i++){ var m=Math.min.apply(null,counts), c=[]; for(var q=0;q<4;q++) if(counts[q]===m) c.push(q); var pick=c[rnd(c.length)]; deck.push(pick); counts[pick]++; }
      shuf(deck);
      /* check the run rule along the page order */
      var seq=history.slice(), d=0; ok=true;
      items.forEach(function(it){ var sl=keep[it.id]?S.ord[it.id].indexOf(it.a):deck[d++]; seq.push(sl); var L=seq.length; if(L>=4&&seq[L-1]===seq[L-2]&&seq[L-2]===seq[L-3]&&seq[L-3]===seq[L-4]) ok=false; });
      tries++;
    }while(!ok&&tries<400);
    var d2=0;
    items.forEach(function(it){
      var slot;
      if(keep[it.id]) slot=S.ord[it.id].indexOf(it.a);
      else {
        slot=deck[d2++];
        var others=[]; for(var i=0;i<it.n;i++) if(i!==it.a) others.push(i); shuf(others);
        var p=[]; for(var k=0,o=0;k<it.n;k++) p.push(k===slot?it.a:others[o++]);
        S.ord[it.id]=p;
      }
      history.push(slot);
    });
  });
  S.ordV=2;
  if(!S.ord.places){var pl=[0,1,2,3,4];do{shuf(pl);}while(pl.join()==='0,1,2,3,4');S.ord.places=pl;}
}
window.__slotCounts=function(){ var out={}; [['words',WORDS_PIC.map(function(x){return {id:x.id,a:0};}).concat(WORDS_LANG.map(function(x){return {id:x.id,a:0};}))],['listen',LISTEN],['story',STORY],['gram',GRAM]].forEach(function(g){ var c=[0,0,0,0],seq=[]; g[1].forEach(function(it){var sl=S.ord[it.id].indexOf(it.a||0);c[sl]++;seq.push(sl+1);}); out[g[0]]={counts:c,seq:seq.join('')}; }); return out; };

/* ======================= SCORING ======================= */
/* T-247 (Nov 3 2026) fair score for PRACTICE: an item solved on any try = 1 (first try is still saved
   as a.first for the dashboard); a fix-it sentence solved = all its errors; a read-aloud done = full 2
   ("one good try is enough"). The TEST keeps one-try scoring and the machine's read-aloud marks. */
function itemPts(id){ var a=S.ans[id]; if(!a) return 0; return a.ok?1:0; }
function readAuto(r){ if(!r||r.acc==null) return null; return r.acc>=0.9?2:(r.acc>=0.6?1:0); }
function secScore(k){
  var pts=0,max=0,done=0,total=0;
  if(k==='read'){ READ.forEach(function(it){ var r=S.read[it.id]; total++; max+=2; if(r&&r.done){done++; var p=PRACTICE?2:readAuto(r); pts+=p||0;} }); }
  else if(k==='words'){ WORDS_PIC.concat(WORDS_LANG).forEach(function(it){total++;max++;if(S.ans[it.id]&&S.ans[it.id].done){done++;pts+=itemPts(it.id);}}); }
  else if(k==='listen'){ LETTERS.concat(DICT).concat(LISTEN).forEach(function(it){total++;max++;if(S.ans[it.id]&&S.ans[it.id].done){done++;pts+=itemPts(it.id);}}); }
  else if(k==='story'){ STORY.forEach(function(it){total++;max++;if(S.ans[it.id]&&S.ans[it.id].done){done++;pts+=itemPts(it.id);}}); }
  else if(k==='gram'){ GRAM.forEach(function(it){total++;max++;if(S.ans[it.id]&&S.ans[it.id].done){done++;pts+=itemPts(it.id);}}); }
  else if(k==='fix'){ FIX.forEach(function(it){total++;max+=it.errs.length;var a=S.ans[it.id];if(a&&a.done){done++;pts+=(PRACTICE&&a.ok)?it.errs.length:(a.pts||0);}}); }
  return {pts:pts,max:max,done:done,total:total};
}

/* T-201: saveguard.js (first line in <head>) reads this student's row under BOTH email spellings and shows a red bar

   This page already loads before it saves (LOADED gate), so its own save path is the guard for writes. */
function jbody(o){ return new Blob([JSON.stringify(o)],{type:'application/json'}); }

  return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=work,turned_in&email=eq.'+encodeURIComponent(ME.email)+'&test_key=eq.'+TEST_KEY,{headers:H()})
  .then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,120));}); return r.json(); })
  .then(function(rows){
    if(rows&&rows[0]&&rows[0].work){ var w=rows[0].work; ['ord','ans','read','ext','pos','log'].forEach(function(k){ if(w[k]) S[k]=Object.assign(S[k]||{},w[k]); }); S.ordV=w.ordV||1; S.turned=!!rows[0].turned_in||!!w.turned; S.startedAt=w.startedAt||S.startedAt; }
    LOADED=true; showNet('');
  }).catch(function(e){ LOADED=false; showNet('Can\u2019t reach the server, so nothing is saving yet. Tell Mr. Toby. <button class="btn alt" id="netRetry">Try again</button> <small>('+esc(e.message)+')</small>'); var b=$('netRetry'); if(b)b.onclick=function(){load().then(afterLoad);}; });

  var row={email:ME.email,test_key:TEST_KEY,episode:CFG.ep,mode:MODE,student_name:ME.name,period:ME.period,lang:ME.lang,work:S,scores:totals(),updated_at:new Date().toISOString()};

  .then(function(r){ SAVING=false; if(DIRTY){ clearTimeout(SOON); SOON=setTimeout(function(){ if(DIRTY) save(); },300); } if(!r.ok) return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,120));}); $('saved').textContent='\u2713 Saved'; })

function wireMc(o,labels,correctIdx,box,rerender){

function speakTask(key,box,prompt,maxS,keys,picKey){

    '<div id="fb">'+(x.done?'<div class="good" style="color:#2b2233">\u2713 Recorded ('+Math.round(x.secs||0)+' seconds).</div>'+(x.up===false?'<p class="dir" style="color:#8a1f12">The recording did not upload. Record again.</p>':''):'')+'</div>'+backRow();
  var tick=null;
  $('recBtn').onclick=function(){
    var b=$('recBtn');
    if(REC&&REC.on){ b.disabled=true; b.textContent='One moment\u2026'; clearInterval(tick); REC.stop(function(blob,heard,secs){
      var s=heard.toLowerCase(), wc=heard?heard.split(/\s+/).length:0, hits=keys.filter(function(k){return s.indexOf(k)>=0;}).length;
      var auto=(!SR||!heard)?null:(key==='retell'?Math.min(4,(wc>=40?1:0)+(hits>=2?1:0)+(hits>=4?1:0)+(hits>=6?1:0)):Math.min(4,(new RegExp(CFG.talk.must).test(s)?1:0)+(hits>=1?1:0)+(hits>=3?1:0)+(wc>=15?1:0)));
      x.tries++; x.heard=heard; x.secs=secs; x.auto=auto; x.done=true; x.up=null; touch();
      upload(blob,key+'_'+x.tries,function(path){ x.path=path; x.up=!!path; touch(); save(); if(CUR&&CUR.k===key)speakTask(key,box,prompt,maxS,keys,picKey); });
      speakTask(key,box,prompt,maxS,keys,picKey);

  };

/* ======================= WHAT'S NEXT: one line + one drawn arrow (T-379) =======================
   Every screen names the next action in plain words (translated like any direction) and a drawn orange arrow
   points at the thing itself. One arrow at a time; it moves when a step is done; when everything on a screen is
   done the arrow goes away and the line says "You finished this part." The arrow bobs 3px, and holds still under
   prefers-reduced-motion. Recomputed from the DOM whenever the page changes, so new screens need no wiring. */
var NX={t:'',el:null};
function nxLine(){ var d=$('nextLine'); if(!d){ d=document.createElement('div'); d.id='nextLine'; d.className='nextline'; d.setAttribute('role','status'); d.innerHTML='<div class="nl-en" translate="no"></div><div class="nl-tr"></div>'; } return d; }
function nxArrow(){ var a=$('nxArrow'); if(!a){ a=document.createElement('div'); a.id='nxArrow'; a.setAttribute('aria-hidden','true');
  /* T-374 rule: the same arrow My Page uses in its "Do this next" band, a solid green \u27a4 drawn as SVG */
  a.innerHTML='<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><path d="M12 6 C 30 18, 40 24, 48 28 C 40 32, 30 38, 12 50 C 17 38, 19 32, 19 28 C 19 24, 17 18, 12 6 Z" fill="#1f7a4d"/></svg>';
  document.body.appendChild(a); } return a; }
function qs(sel,root){ return (root||document).querySelector(sel); }
var FIN='You finished this part.';
function nxExt(k,box){
  var x=S.ext[k]||{};
  if(k==='order'){ var sl=x.slots||[null]; var empty=sl.indexOf(null);
    if(empty>=0) return x.sel!=null?{t:'Now tap a number.',el:qs('[data-slot="'+empty+'"]',box)}:{t:'Tap a card.',el:qs('#pbank .placecard',box)};
    if(!x.checked) return {t:'Tap Check.',el:$('ordGo')};
    if(PRACTICE&&x.right<5) return {t:'Move the cards that are wrong. Then tap Check.',el:$('ordGo')};
    return {t:FIN,el:null}; }
  if(k==='summary'){ var n=(x.text||'').trim()?(x.text||'').trim().split(/\s+/).length:0; return n<25?{t:'Write your summary in the box.',el:$('sumT')}:{t:FIN,el:null}; }
  if(k==='describe'){ if(!x.who) return {t:'Choose one character.',el:qs('.who',box)};
    if(!x.checked) return (x.inBox||[]).length?{t:'Tap Check.',el:$('dGo')}:{t:'Tap the true sentences.',el:qs('.bank',box)};

    if((x.text||'').trim().length<=10) return {t:'Now write about '+CAST_NAME[x.who]+'.',el:$('dT')};
    return {t:FIN,el:null}; }

    if(!x.checked) return {t:'Tap Check.',el:$('cGo')};
    if(PRACTICE&&x.auto<4&&$('cGo')) return {t:'Move the sentences that are wrong. Then tap Check.',el:$('cGo')};
    if(!(x.text||'').trim()) return {t:'Now write one or two sentences.',el:$('cT')};
    return {t:FIN,el:null}; }
  if(REC&&REC.on) return {t:'Talk. Then tap Stop.',el:$('recBtn')};
  return x.done?{t:FIN,el:null}:{t:'Tap Record and talk.',el:$('recBtn')};
}
function nxCompute(){
  if(!$('gate').classList.contains('hide')) return null;
  if(!CUR){
    if(!coreDone()){ var c=qs('#coreGrid .card.next'); if(!c) return null; var nm=(c.querySelector('b')||{}).textContent||''; nm=nm.replace(/\s*\u2713$/,'').replace(/^\d+\.\s*/,'');
      var any=SECTIONS.some(function(s){return secScore(s.k).done>0;}); return {t:(any?'Next: tap ':'Start here \u2014 tap ')+nm+'.',el:c}; }
    if(!S.turned) return {t:'Now tap Turn in.',el:$('turnBtn')};
    var e=null; EXTS.some(function(x){ if(!extDone(x.k)){ e=x; return true; } return false; });
    if(e) return {t:'You finished Part 1! Next: try an extra challenge.',el:qs('#extGrid [data-ext="'+e.k+'"]')};
    return {t:'You finished everything! Great work.',el:null};
  }

  var o=CUR.items[CUR.i]; if(!o) return null;
  if(isDone(o)) return {t:CUR.i>=CUR.items.length-1?'Next: tap Finish this part.':'Next: tap Next.',el:$('nextBtn')};
  var id=o.it.id, a=S.ans[id]||{};

  var plays=S.log.plays||{}, played=!!plays[id]||Object.keys(plays).some(function(k){return k.indexOf(id+'#')===0;});
  if((o.type==='listenmc'||o.type==='letter'||o.type==='dict')&&!played) return {t:'Tap Play and listen.',el:$('playIt')};
  if(o.type==='letter'&&o.it.kind==='name'){ var bx=box.querySelectorAll('.lbox'), full=bx.length&&Array.prototype.every.call(bx,function(x){return x.value;}); return full?{t:'Tap Check.',el:$('typeGo')}:{t:'Type the letters you hear. Tap a box to hear one letter.',el:qs('.lrow',box)}; }
  if(o.type==='letter'||o.type==='dict'){ var ti=$('typeIn'); return (ti&&ti.value.trim())?{t:'Tap Check.',el:$('typeGo')}:{t:'Type what you hear.',el:ti}; }
  if(o.type==='fix'){ if(a.editing!=null) return {t:'Type the right word.',el:$('fixIn')}; if(a.edits&&Object.keys(a.edits).length) return {t:'Tap Check. Or tap another word.',el:$('fixGo')}; return {t:'Tap the word that is wrong.',el:qs('.fixline',box)}; }
  /* the arrow points at the QUESTION, never at an option, so it can't look like a hint */

}

function nxRefresh(){ clearTimeout(NXT); NXT=setTimeout(nxDo,60); }

function nxPlace(){

  else { a.className='up'; a.style.left=Math.round(Math.max(4,r.left+sx+r.width/2-S2/2))+'px'; a.style.top=Math.round(r.top+sy-S2+6)+'px'; }
}
(function(){
  var mo=new MutationObserver(function(list){ for(var i=0;i<list.length;i++){ var t=list[i].target; if(!(t.closest&&t.closest('#nextLine'))&&!(t.parentNode&&t.parentNode.closest&&t.parentNode.closest('#nextLine'))){ nxRefresh(); return; } } });

})();
