<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Ladder · ELD 103</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#3b2a5a;--plum2:#5b4580;--violet:#7c5cbf;--lilac:#d9ccf2;--paper:#f6f4fa;--ink:#241e30;--muted:#665c78;--line:#e1dcea;--gold:#d4a017}
*{box-sizing:border-box}body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
header{background:var(--plum);color:#fff;padding:26px 16px}
header .in,main,footer .in{max-width:860px;margin:0 auto}
header small{font-weight:800;letter-spacing:.08em;font-size:.72rem;opacity:.85}
header h1{margin:4px 0 6px;font-size:1.9rem}header p{margin:0;opacity:.9}
main{padding:18px 16px 60px}
.rungs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.rungs span{font-size:.78rem;font-weight:800;background:#fff;border:2px solid var(--lilac);border-radius:999px;padding:4px 10px;color:var(--plum2)}
.texts{display:grid;gap:12px}
a.t{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05)}
a.t:hover{border-color:var(--violet)}
a.t .e{font-size:2.2rem}a.t h2{margin:0 0 2px;font-size:1.2rem;color:var(--plum)}a.t p{margin:0;color:var(--muted);font-size:.92rem}
a.t.soon{opacity:.55;pointer-events:none}
footer{padding:0 16px 40px}footer .lbl{font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
footer a{display:inline-block;margin:0 10px 6px 0;color:var(--plum2);font-weight:800;font-size:.9rem}
</style>
</head>
<body>
<header><div class="in">
  <small>GALILEO ACADEMY · ELD 103</small>
  <h1>Writing Ladder</h1>
  <p>After you read a story, climb eight rungs: words → sentences → paragraph → essay.</p>
</div></header>
<main>
  <div class="rungs"><span>1 Words</span><span>2 Sentences</span><span>3 Order</span><span>4 Paraphrase</span><span>5 Paragraph</span><span>6 Revise</span><span>7 Essay</span><span>8 Intros &amp; Conclusions</span></div>
  <div class="texts" id="texts"></div>
</main>
<footer><div class="in">
  <div class="lbl">TEACHER</div>
  <a href="dashboard.html">Writing Ladder dashboard</a>
  <a href="../eld103/">ELD 103 hub</a>
  <a href="../">Readings hub</a>
</div></footer>
<script>
/* One line per text. slug = folder under /readings/write/ */
var LADDERS=[
 {slug:'landlady',title:'The Landlady',e:'🏠',story:'/readings/landlady/',blurb:'Roald Dahl. 12 words, 8 rungs, essay: who is responsible?'},
 {slug:'telltale',title:'The Tell-Tale Heart',e:'👁️',story:'/readings/telltale/',blurb:'Edgar Allan Poe. 12 words, 8 rungs, essay: is the narrator mad?'},
 {slug:'omelas',title:'The Ones Who Walk Away from Omelas',e:'🌆',story:'/readings/omelas/',blurb:'Coming later.',soon:true},
 {slug:'thank-you-maam',title:'Thank You, Ma\u2019am',e:'👜',story:'/readings/thank-you-maam/',blurb:'Coming later.',soon:true}
];
document.getElementById('texts').innerHTML=LADDERS.map(function(l){return '<a class="t'+(l.soon?' soon':'')+'" href="'+l.slug+'/"><span class="e">'+l.e+'</span><span><h2>'+l.title+'</h2><p>'+l.blurb+'</p></span></a>';}).join('');
</script>
</body>
</html>
