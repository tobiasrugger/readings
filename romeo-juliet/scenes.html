<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romeo and Juliet — Scene Reading Guides | Mr. Toby</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1d4e3f; --pine-lt:#2f6f57; --ink:#14241f;
  --paper:#f6f3ea; --card:#fffdf7; --line:#ddd6c4;
  --cap:#8c2f2a; --mont:#2a4f7c; --gold:#c8a24a; --muted:#6b6558;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.55}
.bar{position:sticky;top:0;z-index:60;background:var(--pine);color:#fff;padding:8px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.bar h1{font-size:.98rem;margin:0;font-weight:800}
.bar .sp{flex:1}
.bar a,.bar button,.bar select,.bar input{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:8px;padding:5px 10px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:none}
.bar select option{color:#000}
.bar input{cursor:text;font-weight:400;width:120px}
.bar input::placeholder{color:#cfe0d6}
.bar button.on{background:var(--gold);color:#231c06;border-color:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;background:#8aa79a;display:inline-block}
.dot.ok{background:#6ee7a8}.dot.busy{background:var(--gold)}.dot.err{background:#ff8b80}
.prog{height:5px;background:#0e3226}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}

.wrap{max-width:900px;margin:0 auto;padding:16px 14px 90px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.nav button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--muted)}
.nav button.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.nav button.done::after{content:" ✓";color:var(--gold)}
.nav button.on.done::after{color:#ffe9a8}

.scene{display:none}
.scene.on{display:block}
.shead{display:flex;gap:14px;align-items:flex-start;border-bottom:3px solid var(--pine);padding-bottom:10px;margin-bottom:14px}
.shead svg{flex:0 0 62px;width:62px;height:62px}
.shead .t{flex:1}
.shead .act{font-size:.82rem;font-weight:800;color:var(--gold);letter-spacing:.4px}
.shead h2{margin:0;font-family:Lora,Georgia,serif;font-size:1.55rem;font-weight:600;line-height:1.2}
.what{background:#eef3f0;border-left:4px solid var(--pine-lt);padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 16px;font-size:.96rem}
.what b{color:var(--pine)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel > h3{margin:0 0 10px;font-size:.95rem;color:var(--pine);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.panel > h3 .tiny{font-weight:400;color:var(--muted);font-size:.82rem}
.easy p{margin:0 0 10px;font-size:1.05rem;max-width:38em}
.orig{font-family:Lora,Georgia,serif}
.sp{margin:0 0 12px}
.sp .who{font-family:Nunito,sans-serif;font-weight:800;font-size:.78rem;letter-spacing:.6px;display:block;margin-bottom:2px}
.sp .who.cap{color:var(--cap)}.sp .who.mont{color:var(--mont)}.sp .who.neu{color:#8a6d16}
.sp .ln{display:block;padding-left:14px;text-indent:-14px;line-height:1.85;font-size:1.04rem}
.stage{font-style:italic;color:var(--muted);font-size:.92rem;margin:0 0 12px}

.g{background:#fbf1cf;border-bottom:2px dotted #b99524;cursor:pointer;border-radius:3px;padding:0 1px}
.g:hover{background:#f7e5a8}
#tip{position:absolute;z-index:200;max-width:300px;background:#14241f;color:#fff;border-radius:10px;padding:11px 13px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;line-height:1.45}
#tip b{color:var(--gold);font-size:1rem}
#tip .tr{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.22);font-size:1rem}
#tip .lang{font-size:.72rem;color:#9fbdb0;display:block}

.qs{display:grid;gap:12px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;border-left:5px solid var(--pine-lt)}
.q.build{border-left-color:var(--gold)}
.q.stretch{border-left-color:var(--cap)}
.q .tier{font-size:.7rem;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.q .qt{margin:2px 0 8px;font-weight:700}
.opt{display:block;padding:6px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:.95rem}
.opt:hover{background:#f3f7f5}
.opt input{margin-right:8px}
.opt.right{background:#e2f4e9;border-color:#7fbf9b}
.opt.wrong{background:#fbe6e4;border-color:#d99b95}
textarea{width:100%;min-height:66px;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:.97rem;resize:vertical;background:#fffef9}
textarea:focus{outline:2px solid var(--pine-lt);outline-offset:1px}
.frame{font-size:.86rem;color:var(--muted);margin:0 0 6px;font-style:italic}

.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.role{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.role b{display:block;color:var(--pine);font-size:.92rem}
.role i{display:block;color:var(--muted);font-style:normal;font-size:.82rem;margin-bottom:4px}
.role p{margin:0;font-size:.93rem}

.glosslist{display:none}
.btn{background:var(--pine);color:#fff;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pine);border:1px solid var(--pine)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:.88rem;color:var(--muted);margin-top:8px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

@media print{
  .bar,.nav,.prog,.navrow,#tip,.noprint{display:none!important}
  body{background:#fff}
  .scene{display:block!important;page-break-after:always}
  .panel{border:1px solid #999;break-inside:avoid}
  .g{background:none;border-bottom:1px solid #000}
  .glosslist{display:block}
  textarea{min-height:74px;border:1px solid #666;background:#fff}
  .opt{border:1px solid #666}
  .q{break-inside:avoid;border-left:4px solid #333}
  .shead svg{filter:grayscale(1)}
}
</style>
</head>

<div class="bar">
  <h1>R+J · Scenes</h1>
  <span class="dot" id="dot" title="save status"></span>
  <span class="sp"></span>

  <button id="bBoth" onclick="setLevel('both')">Both</button>
  <select id="lang" onchange="saveLocal()">
    <option value="">No translation</option>
    <option value="es">Español</option>
    <option value="zh">中文</option>
    <option value="ar">العربية</option>
    <option value="vi">Tiếng Việt</option>
    <option value="th">ไทย</option>

  </select>
  <button onclick="window.print()">Print</button>
  <button onclick="turnIn()">Turn in</button>
  <a href="index.html">Unit</a>
</div>
<div class="prog"><i id="progbar"></i></div>

<div class="wrap">
  <div class="nav" id="nav"></div>
  <div id="scenes"></div>
  <div class="navrow noprint">
    <button class="btn ghost" onclick="step(-1)">← Previous scene</button>
    <button class="btn" onclick="step(1)">Next scene →</button>
  </div>
  <p class="msg" id="msg"></p>
</div>

<div id="tip"></div>

 id:"a1s1", act:"Act I, Scene 1", title:"A thumb, a sword, a city in the street", icon:"swords",
 what:"Two Capulet servants and two Montague servants meet in the public square. One of them bites his thumb — a rude gesture, like a middle finger today. Within a minute there are swords out. Within five minutes half of Verona is fighting and the Prince has to stop it himself.",
 easy:["It is Sunday morning in Verona. Sampson and Gregory, two Capulet servants, are walking in the square with their swords. They are bored and they want trouble.",
 "Two Montague servants come. Sampson bites his thumb at them. In Verona, this is a very rude insult, but it is not exactly a crime. Sampson is being careful: he wants a fight, but he does not want to start it.",
 "The Montague servants ask, \"Do you bite your thumb at us?\" Sampson answers, \"I bite my thumb, sir.\" He does not say at who. They fight anyway.",
 "Benvolio, a Montague, runs in and tries to stop them. Then Tybalt, a Capulet, arrives. Tybalt sees Benvolio's sword and does not ask any questions. He says he hates peace, and he attacks.",
 "Soon Lord Capulet and Lord Montague are in the street with their swords. Their wives are trying to hold them back. Old men are fighting like boys.",
 "Prince Escalus stops everything. He is angry. This is the third street fight caused by these two families. He makes a new law: the next man who fights in the street will be killed.",
 "After the fight, Romeo's parents ask Benvolio about Romeo. He has been walking alone at night and crying in his room in the day. Benvolio finds him. Romeo says he is in love with a girl named Rosaline, and she does not love him back."],
 orig:[

  {who:"ABRAM",h:"mont",lines:["Do you bite your thumb at us, sir?"]},
  {who:"SAMPSON",h:"cap",lines:["Is the law of our side, if I say ay?"]},
  {who:"GREGORY",h:"cap",lines:["No."]},
  {who:"SAMPSON",h:"cap",lines:["No, sir, I do not bite my thumb at you, sir,","but I bite my thumb, sir."]},
  {st:"They fight. BENVOLIO tries to part them. TYBALT enters."},
  {who:"TYBALT",h:"cap",lines:["What, drawn, and talk of peace! I hate the word,","As I hate hell, all Montagues, and thee:","Have at thee, coward!"]},
  {st:"Citizens join the fight. PRINCE ESCALUS enters."},
  {who:"PRINCE",h:"neu",lines:["Rebellious subjects, enemies to peace,","Profaners of this neighbour-stained steel—","Will they not hear? What, ho! you men, you beasts,","That quench the fire of your pernicious rage","With purple fountains issuing from your veins...","If ever you disturb our streets again,","Your lives shall pay the forfeit of the peace."]}

 id:"a1s3", act:"Act I, Scene 3", title:"Juliet is asked to consider a husband", icon:"door",
 what:"Lady Capulet tells her thirteen-year-old daughter that a rich, handsome man named Paris wants to marry her. She asks Juliet to look at him at the party tonight. Juliet gives an answer so careful that you have to read it twice.",
 easy:["Lady Capulet comes to Juliet's room with the Nurse. She asks Juliet a question: how do you feel about getting married?",
 "Juliet says it is an honor she has not dreamed about. This is a polite way of saying she has not thought about it at all.",
 "Lady Capulet explains: Count Paris wants to marry Juliet. He is rich, handsome, and from a good family. Girls younger than Juliet are already mothers in Verona.",
 "The Nurse is excited. She has taken care of Juliet since she was a baby, and she tells a long, embarrassing story about Juliet as a little girl.",
 "Lady Capulet asks Juliet to look at Paris tonight at the party and decide if she can love him.",
 "Juliet's answer is very careful. She says she will look at him and try to like him — but she will not go further than her parents allow. She does not say yes. She does not say no. She says she will try."],
 orig:[
  {who:"LADY CAPULET",h:"cap",lines:["Tell me, daughter Juliet,","How stands your disposition to be married?"]},
  {who:"JULIET",h:"cap",lines:["It is an honour that I dream not of."]},
  {who:"LADY CAPULET",h:"cap",lines:["Well, think of marriage now; younger than you,","Here in Verona, ladies of esteem,","Are made already mothers..."]},
  {who:"LADY CAPULET",h:"cap",lines:["Speak briefly, can you like of Paris' love?"]},
  {who:"JULIET",h:"cap",lines:["I'll look to like, if looking liking move:","But no more deep will I endart mine eye","Than your consent gives strength to make it fly."]}

 id:"a1s5", act:"Act I, Scene 5", title:"The party: a sonnet built by two people", icon:"mask",
 what:"Romeo sneaks into the Capulet party wearing a mask, hoping to see Rosaline. He sees Juliet instead and forgets Rosaline completely. They meet, and the first fourteen lines they speak to each other form a perfect sonnet — she finishes the poem he starts. Then they find out who the other one is.",
 easy:["Romeo and his friends put on masks and go to the Capulet party without an invitation. Romeo is still sad about Rosaline.",
 "Then Romeo sees Juliet across the room. He forgets Rosaline immediately. He says she teaches the torches to burn brighter — the room got lighter when she walked into it.",
 "Tybalt hears Romeo's voice and knows he is a Montague. He wants to kill him right there. But Lord Capulet says no: Romeo is behaving well, and a fight at the party would be embarrassing. Tybalt is furious and promises himself he will get revenge later.",
 "Romeo touches Juliet's hand. He says his hand is not good enough to touch her, because she is like a holy place and he is like a traveler visiting it. She answers using his own comparison and turns it back on him.",
 "They talk for fourteen lines, and those fourteen lines are a sonnet — a love poem they build together, half each. Then they kiss.",
 "The Nurse calls Juliet away. Romeo asks who her mother is and learns she is a Capulet. Juliet asks the Nurse who the young man was and learns he is a Montague.",
 "Juliet says her only love has come from her only hate. She saw him too early, before she knew who he was, and learned who he was too late."],
 orig:[
  {who:"ROMEO",h:"mont",lines:["O, she doth teach the torches to burn bright!","It seems she hangs upon the cheek of night","Like a rich jewel in an Ethiope's ear;","Beauty too rich for use, for earth too dear!"]},
  {who:"TYBALT",h:"cap",lines:["This, by his voice, should be a Montague.","Fetch me my rapier, boy."]},
  {who:"CAPULET",h:"cap",lines:["Content thee, gentle coz, let him alone...","I would not for the wealth of all the town","Here in my house do him disparagement."]},
  {who:"ROMEO",h:"mont",lines:["If I profane with my unworthiest hand","This holy shrine, the gentle sin is this:","My lips, two blushing pilgrims, ready stand","To smooth that rough touch with a tender kiss."]},
  {who:"JULIET",h:"cap",lines:["Good pilgrim, you do wrong your hand too much,","Which mannerly devotion shows in this;","For saints have hands that pilgrims' hands do touch,","And palm to palm is holy palmers' kiss."]},
  {who:"JULIET",h:"cap",lines:["My only love sprung from my only hate!","Too early seen unknown, and known too late!"]}

 id:"a2s2", act:"Act II, Scene 2", title:"The balcony: 'wherefore' means why", icon:"balcony",
 what:"Romeo climbs the wall into the Capulet orchard at night. Juliet comes out onto her balcony and, thinking she is alone, says out loud that she wishes Romeo were not a Montague. He is standing below, listening. By the end of the scene they have agreed to marry.",
 easy:["After the party, Romeo does not go home. He climbs the wall into the Capulet orchard. If they catch him there, they will kill him.",
 "Juliet comes out on her balcony. Romeo hides and watches. He says she is the sun, rising in the east, and the moon is jealous of her.",
 "Juliet thinks she is alone. She says out loud: O Romeo, Romeo, why are you Romeo? She is not asking where he is. She is asking why he has to be a Montague.",
 "She says a name is only a word. A rose would smell just as sweet with any other name. Romeo is Romeo — the name Montague is not a part of him.",
 "Romeo speaks. Juliet is shocked and afraid. She says he will be killed if her family finds him.",
 "She is also embarrassed, because he heard everything. She says she will not play games. She loves him, and he already knows it, so there is no point pretending.",
 "Romeo starts to swear by the moon. Juliet stops him: the moon changes every night, so do not promise on something that changes.",
 "Juliet says her love is as big as the sea. The more she gives, the more she has, because both are endless.",
 "The Nurse calls her three times. Before Juliet goes in, they agree: Romeo will arrange a marriage, and Juliet will send someone tomorrow at nine to hear the plan."],
 orig:[
  {who:"ROMEO",h:"mont",lines:["But, soft! what light through yonder window breaks?","It is the east, and Juliet is the sun.","Arise, fair sun, and kill the envious moon,","Who is already sick and pale with grief,","That thou her maid art far more fair than she."]},
  {who:"JULIET",h:"cap",lines:["O Romeo, Romeo! wherefore art thou Romeo?","Deny thy father and refuse thy name;","Or, if thou wilt not, be but sworn my love,","And I'll no longer be a Capulet."]},
  {who:"JULIET",h:"cap",lines:["What's in a name? that which we call a rose","By any other name would smell as sweet."]},
  {who:"JULIET",h:"cap",lines:["Do not swear by the moon, the inconstant moon,","That monthly changes in her circled orb,","Lest that thy love prove likewise variable."]},
  {who:"JULIET",h:"cap",lines:["My bounty is as boundless as the sea,","My love as deep; the more I give to thee,","The more I have, for both are infinite."]}

 id:"a2s36", act:"Act II, Scenes 3 & 6", title:"Friar Lawrence makes a plan", icon:"leaf",
 what:"Romeo goes to Friar Lawrence at dawn and asks to be married that same day. The Friar is startled — yesterday Romeo was crying over a different girl. But he agrees, because he thinks a secret marriage might end the feud. He also says, twice, that Romeo is moving too fast.",
 easy:["Early in the morning, Friar Lawrence is in his garden collecting herbs. He talks about how the same plant can be medicine or poison. It depends on how you use it. People are the same way, he says.",
 "Romeo arrives. He has not slept. He tells the Friar he is in love with Juliet Capulet and wants to marry her today.",
 "The Friar is shocked. Yesterday Romeo was crying about Rosaline. He asks how love can change so fast.",
 "Still, the Friar agrees to marry them. He has a reason: if a Montague marries a Capulet, maybe the two families will have to stop fighting.",
 "He warns Romeo twice. He says: go wisely and slowly, because people who run fast fall down.",
 "Later, Juliet arrives at the Friar's cell. Before the wedding, the Friar says something dark: violent joy has a violent end. Love that burns like fire and gunpowder destroys itself when they touch.",
 "He tells them to love moderately, because love that lasts a long time is love that goes slowly.",
 "They do not listen. They are married that afternoon."],
 orig:[
  {who:"FRIAR LAWRENCE",h:"neu",lines:["Within the infant rind of this weak flower","Poison hath residence and medicine power..."]},
  {who:"FRIAR LAWRENCE",h:"neu",lines:["Holy Saint Francis, what a change is here!","Is Rosaline, that thou didst love so dear,","So soon forsaken?"]},
  {who:"FRIAR LAWRENCE",h:"neu",lines:["For this alliance may so happy prove,","To turn your households' rancour to pure love."]},
  {who:"FRIAR LAWRENCE",h:"neu",lines:["Wisely and slow; they stumble that run fast."]},
  {who:"FRIAR LAWRENCE",h:"neu",lines:["These violent delights have violent ends","And in their triumph die, like fire and powder,","Which as they kiss consume... therefore love moderately;","long love doth so."]}

 id:"a3s1", act:"Act III, Scene 1", title:"The hot afternoon everything breaks", icon:"blood",
 what:"Tybalt comes looking for Romeo. Romeo, secretly married to Tybalt's cousin an hour ago, refuses to fight him. Mercutio cannot stand it and fights instead. Romeo steps between them to stop it, and Tybalt stabs Mercutio under Romeo's arm. Within minutes Tybalt is dead too and Romeo is running for his life.",
 easy:["It is a hot afternoon. Benvolio wants to go inside because the heat makes people angry. Mercutio makes jokes and refuses.",
 "Tybalt arrives looking for Romeo. Romeo comes in, just married to Juliet, though nobody knows.",
 "Tybalt calls Romeo a villain. In Verona, that insult means you have to fight.",
 "Romeo refuses. He says he loves Tybalt — because Tybalt is now his family. He cannot explain why. He just walks away from the fight.",
 "Mercutio is disgusted. He thinks Romeo is being a coward. He draws his sword and fights Tybalt himself.",
 "Romeo steps between them to stop the fight. Tybalt reaches under Romeo's arm and stabs Mercutio.",
 "Mercutio does not think it is bad at first. He jokes about it. Then he says the wound is enough, and he curses both families: a plague on both your houses. He says it three times, and then he dies.",
 "Romeo is destroyed. His friend died because he tried to make peace. Tybalt comes back and Romeo kills him.",
 "Benvolio tells him to run. Romeo says he is fortune's fool.",
 "The Prince arrives. He does not kill Romeo. He banishes him instead: Romeo must leave Verona forever, and if he returns he dies."],
 orig:[
  {who:"TYBALT",h:"cap",lines:["Romeo, the love I bear thee can afford","No better term than this: thou art a villain."]},
  {who:"ROMEO",h:"mont",lines:["I do protest, I never injured thee,","But love thee better than thou canst devise..."]},
  {who:"MERCUTIO",h:"neu",lines:["O calm, dishonourable, vile submission!"]},
  {st:"TYBALT stabs MERCUTIO under ROMEO's arm, and flees."},
  {who:"MERCUTIO",h:"neu",lines:["I am hurt.","A plague o' both your houses! I am sped.","...they have made worms' meat of me."]},
  {who:"ROMEO",h:"mont",lines:["O, I am fortune's fool!"]},
  {who:"PRINCE",h:"neu",lines:["And for that offence","Immediately we do exile him hence...","Mercy but murders, pardoning those that kill."]}

 id:"a3s5", act:"Act III, Scene 5", title:"Juliet says no and loses everyone", icon:"door",
 what:"Romeo leaves at dawn for Mantua. Minutes later Juliet's mother arrives with news: she is marrying Paris on Thursday. Juliet refuses. Her father, who three days ago said she was too young and it was her choice, threatens to throw her into the street. Then the Nurse tells her to marry Paris and forget Romeo. By the end of the scene Juliet is completely alone.",
 easy:["It is almost morning. Romeo has to leave before the sun comes up, or he will be killed.",
 "Juliet says it was the nightingale, a night bird. Romeo says it was the lark, a morning bird. They both know the truth. They are arguing with the sun.",
 "Romeo leaves. Juliet looks down at him from the window and says he looks like a dead man in the bottom of a tomb.",
 "Lady Capulet comes in. She thinks Juliet is crying about Tybalt. She has good news: Juliet will marry Paris on Thursday.",
 "Juliet refuses. She says she will not marry, and if she must, she would rather marry Romeo — the man her family hates.",
 "Lord Capulet comes in. He is not kind now. He calls her a disobedient wretch. He says: go to the church on Thursday or never look at my face again. If she refuses, she can go into the street and starve.",

/* ============================================================
   RENDER
   ============================================================ */
var state = {level:'easy', cur:0, ans:{}};
var GKEYS = Object.keys(GLOSS).sort(function(a,b){return b.length-a.length;});
var GRX = new RegExp('\\b(' + GKEYS.join('|') + ')(s|es|ed|ing)?\\b','gi');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function gloss(s){
  return esc(s).replace(GRX, function(m, root, suf){
    var k = root.toLowerCase();
    if(!GLOSS[k]) return m;
    return '<span class="g" data-w="' + k + '">' + m + '</span>';
  });
}

function buildNav(){
  var h = '';
  for(var i=0;i<SCENES.length;i++){
    h += '<button data-i="' + i + '" onclick="go(' + i + ')">' + SCENES[i].act + '</button>';
  }
  document.getElementById('nav').innerHTML = h;
}

function sceneHTML(sc, idx){
  var h = '<div class="scene" id="sc' + idx + '">';
  h += '<div class="shead">' + SVGS[sc.icon] + '<div class="t"><div class="act">' + sc.act + '</div><h2>' + sc.title + '</h2></div></div>';
  h += '<p class="what"><b>What happens.</b> ' + gloss(sc.what) + '</p>';

  h += '<div class="panel easyPanel"><h3>In easier English <span class="tiny">Tap a highlighted word for help.</span></h3><div class="easy">';
  for(var i=0;i<sc.easy.length;i++){ h += '<p>' + gloss(sc.easy[i]) + '</p>'; }
  h += '</div></div>';

  h += '<div class="panel origPanel"><h3>Shakespeare\u2019s words <span class="tiny">Read it out loud. It was written to be heard.</span></h3><div class="orig">';
  for(var j=0;j<sc.orig.length;j++){
    var b = sc.orig[j];
    if(b.st){ h += '<p class="stage">' + gloss(b.st) + '</p>'; continue; }
    h += '<div class="sp"><span class="who ' + b.h + '">' + b.who + '</span>';
    for(var k=0;k<b.lines.length;k++){ h += '<span class="ln">' + gloss(b.lines[k]) + '</span>'; }
    h += '</div>';
  }
  h += '</div></div>';

  h += '<div class="panel"><h3>Your reading group</h3><div class="roles">';
  h += '<div class="role"><b>Summarizer</b><i>first, then, next, finally</i><p>' + esc(sc.roles.s) + '</p></div>';
  h += '<div class="role"><b>Visualizer</b><i>I picture\u2026</i><p>' + esc(sc.roles.v) + '</p></div>';
  h += '<div class="role"><b>Connector</b><i>This reminds me of\u2026</i><p>' + esc(sc.roles.c) + '</p></div>';
  h += '<div class="role"><b>Predictor</b><i>I think next\u2026</i><p>' + esc(sc.roles.p) + '</p></div>';
  h += '</div></div>';

  h += '<div class="panel"><h3>Questions</h3><div class="qs">';
  for(var q=0;q<sc.qs.length;q++){
    var it = sc.qs[q];
    var cls = it.t === 'build' ? 'build' : (it.t === 'stretch' ? 'stretch' : '');
    var label = it.t === 'start' ? 'START' : (it.t === 'build' ? 'BUILD' : 'STRETCH');
    h += '<div class="q ' + cls + '" id="q_' + it.id + '"><div class="tier">' + label + '</div><div class="qt">' + gloss(it.q) + '</div>';
    if(it.type === 'mc'){
      for(var o=0;o<it.o.length;o++){
        h += '<label class="opt" id="o_' + it.id + '_' + o + '"><input type="radio" name="' + it.id + '" value="' + o + '" onchange="pick(\'' + it.id + '\',' + o + ',' + it.a + ')">' + esc(it.o[o]) + '</label>';
      }
    } else {
      if(it.f){ h += '<p class="frame">' + esc(it.f) + '</p>'; }
      h += '<textarea id="t_' + it.id + '" oninput="typed(\'' + it.id + '\')" placeholder="Write your answer here."></textarea>';
    }
    h += '</div>';
  }
  h += '</div></div>';

  h += '<div class="panel glosslist"><h3>Words in this scene</h3><div id="gl_' + idx + '"></div></div>';
  h += '</div>';
  return h;
}

function renderAll(){
  var h = '';
  for(var i=0;i<SCENES.length;i++){ h += sceneHTML(SCENES[i], i); }
  document.getElementById('scenes').innerHTML = h;
  for(var j=0;j<SCENES.length;j++){ buildGlossList(j); }
  document.querySelectorAll('.g').forEach(function(el){
    el.addEventListener('click', function(e){ showTip(e, el); });
  });
  document.addEventListener('click', function(e){
    if(!e.target.classList.contains('g')) document.getElementById('tip').style.display='none';
  });
}

function buildGlossList(idx){
  var host = document.getElementById('sc' + idx);
  var found = {}, nodes = host.querySelectorAll('.g');
  for(var i=0;i<nodes.length;i++){ found[nodes[i].getAttribute('data-w')] = 1; }
  var keys = Object.keys(found).sort();
  var lang = document.getElementById('lang').value;
  var h = '<table style="width:100%;border-collapse:collapse;font-size:.9rem">';
  for(var k=0;k<keys.length;k++){
    var g = GLOSS[keys[k]];
    h += '<tr><td style="border:1px solid #ccc;padding:4px 7px;font-weight:800;width:120px">' + keys[k] + '</td><td style="border:1px solid #ccc;padding:4px 7px">' + esc(g.d) + (lang ? ' &nbsp;·&nbsp; <b>' + esc(g[lang]) + '</b>' : '') + '</td></tr>';
  }
  h += '</table>';
  document.getElementById('gl_' + idx).innerHTML = h;
}

function showTip(e, el){
  e.stopPropagation();
  var k = el.getAttribute('data-w'), g = GLOSS[k], lang = document.getElementById('lang').value;
  var tip = document.getElementById('tip');
  var h = '<b>' + k + '</b><br>' + esc(g.d);
  if(lang){
    var names = {es:'Español',zh:'中文',ar:'العربية',vi:'Tiếng Việt',th:'ไทย',ne:'नेपाली'};
    h += '<div class="tr"><span class="lang">' + names[lang] + '</span>' + esc(g[lang]) + '</div>';
  }
  tip.innerHTML = h;
  tip.style.display = 'block';
  var r = el.getBoundingClientRect();
  var top = r.bottom + window.scrollY + 7;
  var left = Math.min(r.left + window.scrollX, window.innerWidth - 320);
  tip.style.top = top + 'px';
  tip.style.left = Math.max(8, left) + 'px';
}

/* ============================================================
   INTERACTION
   ============================================================ */
function setLevel(l){
  state.level = l;
  document.getElementById('bEasy').className = (l==='easy'?'on':'');
  document.getElementById('bOrig').className = (l==='orig'?'on':'');
  document.getElementById('bBoth').className = (l==='both'?'on':'');
  document.querySelectorAll('.easyPanel').forEach(function(p){ p.style.display = (l==='orig'?'none':'block'); });
  document.querySelectorAll('.origPanel').forEach(function(p){ p.style.display = (l==='easy'?'none':'block'); });
  saveLocal();
}

function go(i){
  state.cur = i;
  document.querySelectorAll('.scene').forEach(function(s,n){ s.className = 'scene' + (n===i?' on':''); });
  document.querySelectorAll('#nav button').forEach(function(b,n){
    b.className = (n===i?'on':'') + (sceneDone(n)?' done':'');
  });
  window.scrollTo(0,0);
  saveLocal();
}
function step(d){ var n = state.cur + d; if(n>=0 && n<SCENES.length) go(n); }

function sceneDone(n){
  var qs = SCENES[n].qs, c = 0;
  for(var i=0;i<qs.length;i++){ if(state.ans[qs[i].id] !== undefined && state.ans[qs[i].id] !== '') c++; }
  return c >= qs.length - 1;
}

function pick(id, choice, correct){
  state.ans[id] = choice;
  var q = document.getElementById('q_' + id);
  var opts = q.querySelectorAll('.opt');
  for(var i=0;i<opts.length;i++){ opts[i].className = 'opt'; }
  document.getElementById('o_' + id + '_' + choice).className = 'opt ' + (choice===correct?'right':'wrong');
  if(choice !== correct){ document.getElementById('o_' + id + '_' + correct).className = 'opt right'; }
  after();
}
function typed(id){ state.ans[id] = document.getElementById('t_' + id).value; after(); }

var timer = null;
function after(){
  updateProgress();
  saveLocal();
  document.querySelectorAll('#nav button').forEach(function(b,n){
    b.className = (n===state.cur?'on':'') + (sceneDone(n)?' done':'');
  });
  if(timer) clearTimeout(timer);
  timer = setTimeout(push, 2500);
}

function total(){ var t=0; for(var i=0;i<SCENES.length;i++) t += SCENES[i].qs.length; return t; }
function answered(){ var c=0; for(var k in state.ans){ if(state.ans[k]!==undefined && state.ans[k]!=='') c++; } return c; }
function updateProgress(){
  var pct = Math.round(answered()/total()*100);
  document.getElementById('progbar').style.width = pct + '%';
}

function autoScore(){
  var right=0, possible=0;
  for(var i=0;i<SCENES.length;i++){
    var qs = SCENES[i].qs;
    for(var j=0;j<qs.length;j++){
      if(qs[j].type === 'mc'){ possible++; if(state.ans[qs[j].id] === qs[j].a) right++; }
    }
  }
  return {right:right, possible:possible};
}

/* ============================================================
   SAVE — localStorage always, Supabase when a name + email exist
   ============================================================ */
function fields(){
  return {
    name:  document.getElementById('sName').value.trim(),
    email: document.getElementById('sEmail').value.trim().toLowerCase(),
    period:document.getElementById('sPeriod').value
  };
}
function saveLocal(){
  var f = fields();
  localStorage.setItem(LSKEY, JSON.stringify({f:f, level:state.level, cur:state.cur, ans:state.ans, lang:document.getElementById('lang').value}));
  for(var j=0;j<SCENES.length;j++){ buildGlossList(j); }
}
function loadLocal(){
  var raw = localStorage.getItem(LSKEY);
  if(!raw) return;
  try{
    var d = JSON.parse(raw);
    if(d.f){
      document.getElementById('sName').value = d.f.name || '';
      document.getElementById('sEmail').value = d.f.email || '';
      document.getElementById('sPeriod').value = d.f.period || '';
    }
    if(d.lang) document.getElementById('lang').value = d.lang;
    state.ans = d.ans || {};
    state.level = d.level || 'easy';
    state.cur = d.cur || 0;
  }catch(e){}
}
function restoreAnswers(){
  for(var i=0;i<SCENES.length;i++){
    var qs = SCENES[i].qs;
    for(var j=0;j<qs.length;j++){
      var it = qs[j], v = state.ans[it.id];
      if(v === undefined || v === '') continue;
      if(it.type === 'mc'){
        var el = document.getElementById('o_' + it.id + '_' + v);
        if(el){ el.querySelector('input').checked = true; pick(it.id, v, it.a); }
      } else {
        var ta = document.getElementById('t_' + it.id);
        if(ta) ta.value = v;
      }
    }
  }
}

function setDot(c){ document.getElementById('dot').className = 'dot ' + c; }

function push(turned){
  var f = fields();
  if(!f.name || !f.email){ setDot(''); return; }
  setDot('busy');
  var body = [{
    email: f.email,
    student_name: f.name,
    period: f.period,
    page: PAGE,
    data: {ans: state.ans, level: state.level},
    score: autoScore().right,
    turned_in: turned === true ? true : undefined,
    updated_at: new Date().toISOString()
  }];
  if(body[0].turned_in === undefined) delete body[0].turned_in;
  fetch(SUPA_URL + '/rest/v1/' + TABLE + '?on_conflict=email,page', {
    method:'POST',
    headers:{
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify(body)
  }).then(function(r){
    if(r.ok){ setDot('ok'); msg('Saved.'); }
    else { setDot('err'); r.text().then(function(t){ msg('Save problem: ' + t); }); }
  }).catch(function(){ setDot('err'); msg('No connection. Your work is saved on this device.'); });
}

function turnIn(){
  var f = fields();
  if(!f.name || !f.email){ alert('Put your name and school email in the top bar first.'); return; }
  var a = answered(), t = total();
  if(a < t - 6 && !confirm('You have answered ' + a + ' of ' + t + ' questions. Turn in anyway?')) return;
  push(true);
  msg('Turned in. You can still keep working — it saves every time you type.');
}
function msg(s){ document.getElementById('msg').textContent = s; }

/* Optional: translate a whole passage on demand through the Apps Script proxy.
   Everything above works without it — the glossary is built into this file. */
var PROXY = 'https://script.google.com/macros/s/AKfycbwbFr3oopIITlxKDhI5wGhEZdomWc3tmB5ZSK6NpBVisPAz-CMA4uKiruXDkCEU3T0Q/exec';
function proxyTranslate(text, langName){
  return fetch(PROXY, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      messages:[{role:'user', content:'Translate into ' + langName + '. Return only the translation.\n\n' + text}]
    })
  }).then(function(r){ return r.json(); }).then(function(d){
    var out = '';
    (d.content || []).forEach(function(b){ if(b.type === 'text') out += b.text; });
    return out;
  });
}

/* ============================================================
   BOOT
   ============================================================ */
loadLocal();
buildNav();
renderAll();
restoreAnswers();
setLevel(state.level);
go(state.cur);
updateProgress();
['sName','sEmail','sPeriod'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){ saveLocal(); push(); });
});
</script>
