<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Describe a Classmate — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--pine:#1d4d3f;--paper:#fbfaf6;--ink:#22241f;--rule:#dcd9cf;--ok:#15803d;--mute:#5b6159}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px}
  .bar{background:var(--pine);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar h1{font-size:17px;margin:0;flex:1}
  .bar select,.bar button{font-family:inherit;font-size:14px;padding:6px 10px;border-radius:7px;border:0}
  main{max-width:1100px;margin:0 auto;padding:16px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
  th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
  th{background:#eef3ef;font-size:13px}
  tr.r{cursor:pointer}tr.r:hover{background:#f6f7f3}
  .b{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:999px;font-weight:700;font-size:12px;background:#eee}
  .b.full{background:#dcfce7;color:var(--ok)}.b.part{background:#fef3c7;color:#92400e}
  .detail{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:16px;margin-top:14px}
  .detail h3{margin:14px 0 6px;font-size:15px;color:var(--pine)}
  .detail .s{margin:3px 0 3px 12px}
  .para{background:#f6f7f3;padding:12px;border-radius:8px;line-height:1.7}
  .gate{max-width:360px;margin:80px auto;background:#fff;padding:22px;border:1px solid var(--rule);border-radius:12px}
  .gate input{width:100%;font-size:16px;padding:9px;border:1px solid var(--rule);border-radius:8px;font-family:inherit}
  .gate button{margin-top:10px;width:100%;font-family:inherit;font-size:15px;font-weight:700;padding:10px;background:var(--pine);color:#fff;border:0;border-radius:8px}
  audio{height:30px}
</style>
</head>
<body>
<div class="bar"><h1>Describe a Classmate · Dashboard</h1><select id="per"><option value="">All periods</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select><button id="reload">Refresh</button><button id="csv">CSV</button></div>
<main id="main"><div class="gate"><b>Teacher password</b><input id="pw" type="password"><button id="go">Open</button></div></main>
<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};
var PW='galileo2026', ROWS=[];
var COLS=[['say0','1.1 Listen'],['say1','1.2 Build'],['say2','1.3 Write'],['because1','3.2 Match'],['because2','3.3 Verbs'],['because3','3.4 Write'],['compare0','4.1 Venn'],['compare1','4.2 Frames'],['compare2','4.3 Leo/Mia'],['compare3','4.4 Me'],['compare4','4.5 Listen/sort']];
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
$('go').onclick=function(){ if($('pw').value===PW){ sessionStorage.setItem('gal_dash','1'); load(); } else alert('Wrong password'); };
$('pw').onkeydown=function(e){ if(e.key==='Enter') $('go').click(); };
if(sessionStorage.getItem('gal_dash')) load();
$('reload').onclick=load; $('per').onchange=table;
function load(){ fetch(SUPA_URL+'/rest/v1/describe_work?select=*&order=period,name',{headers:H}).then(function(r){return r.json();}).then(function(rows){ ROWS=rows||[]; table(); }); }
function badge(sc,k){ var s=sc&&sc[k]; if(!s||!s.total) return '<span class="b">–</span>'; var b=s.best||0; return '<span class="b '+(b>=s.total?'full':b>0?'part':'')+'">'+b+'/'+s.total+'</span>'; }
function ivCount(a){ var n=0; for(var i=1;i<=16;i++){ if(a.iv&&a.iv['q'+i]) n++; } return n; }
function table(){
  var p=$('per').value, rows=ROWS.filter(function(r){return !p||String(r.period)===p;});
  var h='<table><tr><th>Name</th><th>P</th>'+COLS.map(function(c){return '<th>'+c[1]+'</th>';}).join('')+'<th>Interview</th><th>Para</th><th>Updated</th></tr>';
  rows.forEach(function(r,i){ var a=r.answers||{}, sc=r.scores||{};
    h+='<tr class="r" data-i="'+ROWS.indexOf(r)+'"><td><b>'+esc(r.name)+'</b><br><span style="color:var(--mute);font-size:12px">'+esc(r.email)+'</span></td><td>'+esc(r.period)+'</td>'+COLS.map(function(c){return '<td>'+badge(sc,c[0])+'</td>';}).join('')+
      '<td><span class="b '+(ivCount(a)===16?'full':ivCount(a)?'part':'')+'">'+ivCount(a)+'/16</span></td><td>'+(r.completed?'✓':(a.para&&a.para.text?'…':'–'))+'</td><td style="font-size:12px;color:var(--mute)">'+new Date(r.updated_at).toLocaleString()+'</td></tr>'; });
  h+='</table><div id="detail"></div>';
  $('main').innerHTML=h+'<p style="color:var(--mute);font-size:13px">'+rows.length+' students. Click a row for written work.</p>';
  document.querySelectorAll('tr.r').forEach(function(tr){ tr.onclick=function(){ detail(ROWS[parseInt(tr.getAttribute('data-i'))]); }; });
}
function detail(r){ var a=r.answers||{}; var h='<div class="detail"><h2 style="margin:0">'+esc(r.name)+' · Period '+esc(r.period)+'</h2>';
  h+='<h3>Interview (partner: '+esc(a.partner||'—')+', '+esc(a.partnerG||'')+')</h3>';
  for(var i=1;i<=16;i++){ var id='q'+i; if(a.iv&&a.iv[id]||a.ivq&&a.ivq[id]||a.rec&&a.rec[id]){ h+='<div class="s">'+i+'. '+(a.ivq&&a.ivq[id]?'<i>'+esc(a.ivq[id])+'</i> → ':'')+esc(a.iv&&a.iv[id]||'')+(a.rec&&a.rec[id]?' <audio controls src="'+esc(a.rec[id])+'"></audio>':'')+'</div>'; } }
  h+='<h3>1.3 Write sentences</h3>'; Object.keys(a.say2||{}).forEach(function(k){ h+='<div class="s">'+esc(a.say2[k])+'</div>'; });
  h+='<h3>3.4 Because sentences</h3>'; Object.keys(a.b3||{}).forEach(function(k){ h+='<div class="s">'+esc(a.b3[k])+'</div>'; });
  h+='<h3>4.3 Leo & Mia</h3>'; Object.keys(a.c2w||{}).filter(function(k){return !/_ok$/.test(k);}).forEach(function(k){ h+='<div class="s">'+(a.c2w[k+'_ok']?'✓ ':'• ')+esc(a.c2w[k])+'</div>'; });
  h+='<h3>4.4 Me & my classmate</h3>'; Object.keys(a.c3w||{}).forEach(function(k){ h+='<div class="s">'+esc(a.c3w[k])+'</div>'; });
  h+='<h3>5 Paragraph</h3>'+(a.para&&a.para.text?'<div class="para">'+esc(a.para.text)+'</div>':'<div class="s" style="color:var(--mute)">not started</div>');
  h+='</div>'; $('detail').innerHTML=h; $('detail').scrollIntoView({behavior:'smooth'});
}
$('csv').onclick=function(){ var lines=[['name','email','period'].concat(COLS.map(function(c){return c[1];})).concat(['interview','paragraph']).join(',')];
  ROWS.forEach(function(r){ var sc=r.scores||{}, a=r.answers||{}; lines.push([r.name,r.email,r.period].concat(COLS.map(function(c){var s=sc[c[0]];return s?(s.best||0)+'/'+s.total:'';})).concat([ivCount(a)+'/16', JSON.stringify(a.para&&a.para.text||'')]).map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',')); });
  var b=new Blob([lines.join('\n')],{type:'text/csv'}); var u=URL.createObjectURL(b); var x=document.createElement('a'); x.href=u; x.download='describe_classmate.csv'; x.click(); };
</script>
</body>
</html>
