<style>

  .tr{cursor:pointer;border-bottom:2px dotted var(--gloss)}
  .tr:hover{background:#fff4e5}
  .spk{background:#eceadf;border:1px solid var(--rule);border-radius:7px;font-size:15px;padding:3px 8px;cursor:pointer;line-height:1.2;font-family:inherit}

  .opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .opt{font-family:inherit;font-size:16px;font-weight:600;padding:9px 14px;border-radius:10px;border:1.5px solid var(--rule);background:#fff;cursor:pointer}
  .opt:hover{border-color:var(--pine)}
  .opt.sel{border-color:var(--pine);background:var(--soft)}

  .opt.no{border-color:var(--no);background:var(--nobg)}

  .fb{border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:600;display:none}
  .fb.ok{display:block;background:var(--okbg);color:var(--ok)}
  .fb.no{display:block;background:var(--nobg);color:var(--no)}
  .fb.hint{display:block;background:#fff7ed;color:#9a3412}
  .frame{font-size:19px;line-height:1.8;margin:8px 0}

  .frame .slot.no{border-color:var(--no);background:var(--nobg);color:var(--no)}

  .chip.sel{background:var(--pine);color:#fff;border-color:var(--pine)}
  .chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .chip.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
  .chip.ghost{border-style:dashed;color:var(--mute)}
  .chip.ls{cursor:grab;font-size:16px}
  .zone .chip.ls{cursor:pointer}
  .pic{display:flex;justify-content:center;margin:6px 0 10px}
  .pic svg{max-width:100%;height:auto}
  .two{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

  .venn{position:relative;width:100%;max-width:560px;margin:10px auto;aspect-ratio:10/6}
  .venn svg{width:100%;height:100%;position:absolute;inset:0}
  .venn .zone{position:absolute;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;justify-content:center;padding:6px;min-height:40px;cursor:pointer;border-radius:12px}
  .venn .zone.hot{background:rgba(29,77,63,.08)}
  .venn .zone .chip{font-size:13px;padding:4px 8px}
  .venn .lab{position:absolute;font-weight:800;color:var(--pine);font-size:15px}
  .bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
  .note{font-size:15px;color:var(--mute);background:var(--soft);border-left:3px solid var(--pine);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
  .ex{font-style:italic;color:var(--mute)}
  .nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
  .qnum{display:inline-block;background:var(--pine);color:#fff;font-weight:800;border-radius:999px;min-width:28px;text-align:center;padding:2px 8px;margin-right:6px}
  .rec{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;border:1.5px solid var(--rule);background:#fff;padding:5px 10px;cursor:pointer}

  .para{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:16px;font-size:18px;line-height:1.8;text-indent:1.5em}
  .trans{font-family:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--pine);border-radius:8px;padding:5px 8px;color:var(--pine);background:#fff}
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .ovl .box{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:400px}
  .ovl label{display:block;font-weight:700;margin:12px 0 4px}
  .ovl input,.ovl select{width:100%;font-family:inherit;font-size:16px;padding:9px;border:1px solid var(--rule);border-radius:8px}
  .err{color:var(--no);font-weight:700;min-height:22px;margin-top:8px}
  #pop{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;border:2px solid var(--gloss);border-radius:12px;padding:14px 40px 14px 16px;max-width:92vw;width:460px;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  #pop.hidden{display:none}
  #pop button{position:absolute;top:6px;right:8px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--mute)}
  #pop .src{font-weight:700;color:var(--gloss)}
  #pop .dst{font-size:19px;margin-top:4px}
  #pop .mean{font-size:14px;color:var(--mute);margin-top:4px}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--pine);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;z-index:95;font-size:14px}
  @media (max-width:520px){ .frame{font-size:17px} h2{font-size:21px} }
</style>
</head>

   returns a standalone figure inside a viewBox 0 0 120 200 */
function figure(o,size){
  size=size||150;

  s+='<circle cx="25" cy="128" r="7" fill="'+skin+'"/><circle cx="95" cy="128" r="7" fill="'+skin+'"/>';

  if(o.len==='long') s+=hairSide(o,hc,118);

  s+='<ellipse cx="60" cy="42" rx="26" ry="29" fill="'+skin+'"/>';

  s+='</svg>';

function hairCap(o,hc){
  if(o.style==='curly'){
    var c='';
    for(var i=0;i<9;i++){ var ang=Math.PI+i*Math.PI/8; c+='<circle cx="'+(60+28*Math.cos(ang)).toFixed(1)+'" cy="'+(36+26*Math.sin(ang)).toFixed(1)+'" r="8" fill="'+hc+'"/>'; }

  return '<path d="M33 40 Q36 12 60 12 Q84 12 87 40 L86 30 Q60 22 34 30 Z" fill="'+hc+'"/>';
}
function hairSide(o,hc,bottom){
  var w=o.style==='curly'?'q6 12 0 24 q-6 12 0 24':'';

/* ============ SCORING HELPERS ============ */
function scoreKey(){ return SEC+PG[SEC]; }
function bump(key,ok,total){
  var s=SC[key]||{correct:0,total:total,best:0,attempts:0};

  if(ok){ s.correct=(s.correct||0)+1; }

}
function resetRound(key,total){ SC[key]=SC[key]||{correct:0,total:total,best:0,attempts:0}; SC[key].correct=0; SC[key].total=total; dirty=true; }
function scoreLine(key){ var s=SC[key]; if(!s) return ''; return '<span class="score">'+(s.correct||0)+' / '+s.total+(s.best>s.correct?' (best '+s.best+')':'')+'</span>'; }

var voice=null;
function speak(text){
  try{ if(!window.speechSynthesis) return; speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
    if(!voice){ var vs=speechSynthesis.getVoices(), en=vs.filter(function(v){return /^en[-_]US/i.test(v.lang);});
      var pref=['Google US English','Samantha','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Karen','Moira','Tessa','Victoria','Allison','Ava','Susan','Zoe','Female'];
      for(var p=0;p<pref.length&&!voice;p++){ for(var i=0;i<en.length;i++){ if(en[i].name.indexOf(pref[p])>=0){ voice=en[i]; break; } } }
      if(!voice){ for(var j=0;j<en.length;j++){ if(!/David|Mark|Guy|Alex|Daniel|Fred|Male/i.test(en[j].name)){ voice=en[j]; break; } } }
      if(!voice&&en.length) voice=en[0]; }
    if(voice) u.voice=voice; speechSynthesis.speak(u);
  }catch(e){}
}

/* 1.3 Write: type full sentences */
function checkDescSentence(txt,c,cat){
  var t=txt.trim().replace(/\s+/g,' ');
  var subj=c.g==='he'?'he':'she', isHas=HASCATS.indexOf(cat)>=0, ans=trait(c,cat);
  var low=t.toLowerCase().replace(/[.!]+$/,'');
  var r={ok:false,msg:''};
  if(!t) return {ok:false,msg:'Write a sentence.'};
  if(!/^[A-Z]/.test(t)) return {ok:false,msg:'Start with a capital letter.'};
  if(!/[.!]$/.test(t)) return {ok:false,msg:'End with a period.'};
  var words=low.split(' ');
  if(words[0]!==subj && words[0]!==c.name.toLowerCase().split(' ')[0] && low.indexOf(c.name.toLowerCase())!==0) return {ok:false,msg:'Start with "'+(subj==='he'?'He':'She')+'" or the name.'};
  var verb=words.filter(function(w){return ['is','has','have','are','am'].indexOf(w)>=0;})[0];
  if(!verb) return {ok:false,msg:'You need a verb: "is" or "has".'};
  if(verb!==(isHas?'has':'is')) return {ok:false,msg:isHas?'Hair and eyes → use "has".':'Tall, short, young, old → use "is".'};
  if(low.indexOf(ans)<0){ return {ok:false,msg:'Look at the '+(cat==='eyes'?'eyes':cat==='h'?'height':cat==='age'?'age':'hair')+' again. The word you need is on the handout.'}; }
  return {ok:true,msg:'✓ Great sentence.'};
}

  fetch(url).then(function(r){return r.json();}).then(function(d){ if(d&&d.ok&&d.translation){ trCache[key]=d.translation; popup(text,d.translation.equiv,d.translation.meaning); } else popup(text,'Translation is not available right now.',''); }).catch(function(){ popup(text,'Translation is not available right now.',''); });

  var row={email:ME.email,name:ME.name,period:ME.period,lang:ME.lang,answers:A,scores:SC,partner:A.partner||null,paragraph:(A.para&&A.para.text)||null,completed:!!A.completed,updated_at:new Date().toISOString()};
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=email',{method:'POST',headers:Object.assign({},H,{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(row)})
  .then(function(r){ setDot(r.ok?'on':'err'); if(!r.ok) dirty=true; }).catch(function(){ setDot('err'); dirty=true; });
  try{ localStorage.setItem('describe_'+ME.email, JSON.stringify({A:A,SC:SC})); }catch(e){}
}
setInterval(function(){ if(dirty) save(); },20000);
window.addEventListener('beforeunload',function(){ if(dirty) save(); });
function load(){
  try{ var raw=localStorage.getItem('describe_'+ME.email); if(raw){ var o=JSON.parse(raw); A=o.A||{}; SC=o.SC||{}; } }catch(e){}
  fetch(SUPA_URL+'/rest/v1/'+TABLE+'?select=answers,scores&email=eq.'+encodeURIComponent(ME.email),{headers:H}).then(function(r){return r.json();}).then(function(rows){
    if(rows&&rows.length){ A=rows[0].answers||A; SC=rows[0].scores||SC; }
    if(A.pos){ SEC=A.pos.sec||SEC; PG=Object.assign(PG,A.pos.pg||{}); }
    render();
  }).catch(function(){ render(); });
}

/* ============ SIGN-IN ============ */
function langOpts(){ return LANGS.map(function(l){ return '<option value="'+l[0]+'">'+esc(l[1])+(l[0]!=='none'&&l[1]!==l[0]?' ('+l[0]+')':'')+'</option>'; }).join(''); }
$('lang').innerHTML=langOpts(); $('siLang').innerHTML=langOpts();
$('lang').onchange=function(){ ME.lang=this.value; $('siLang').value=ME.lang; localStorage.setItem('gal_student_lang',ME.lang); dirty=true; };
function showSignin(){ $('siName').value=ME.name||localStorage.getItem('gal_student_name')||''; $('siEmail').value=ME.email||localStorage.getItem('gal_student_email')||''; $('siPeriod').value=ME.period||localStorage.getItem('gal_student_period')||''; $('siLang').value=ME.lang||localStorage.getItem('gal_student_lang')||'none'; $('siErr').textContent=''; $('signin').style.display='flex'; }
$('who').onclick=showSignin;
$('siGo').onclick=function(){
  var n=$('siName').value.trim(), raw=$('siEmail').value.trim().toLowerCase(), p=$('siPeriod').value;
  if(!n){ $('siErr').textContent='Type your name.'; return; }
  if(!EMAIL_RE.test(raw)){ $('siErr').textContent='Use your school email (@s.sfusd.edu).'; return; }
  if(!p){ $('siErr').textContent='Choose your period.'; return; }
  var c=canon(raw); ME={email:c,name:n,period:p,lang:$('siLang').value}; $('lang').value=ME.lang;
  localStorage.setItem('gal_student_email',c); localStorage.setItem('gal_student_name',n); localStorage.setItem('gal_student_period',p); localStorage.setItem('gal_student_lang',ME.lang);
  var parts=n.split(/\s+/);
  fetch(SUPA_URL+'/rest/v1/students?on_conflict=email',{method:'POST',headers:Object.assign({},H,{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([{email:c,name:n,first_name:parts[0]||null,last_name:parts.slice(1).join(' ')||null,period:p,updated_at:new Date().toISOString()}])}).catch(function(){});
  if(raw!==c) fetch(SUPA_URL+'/rest/v1/student_aliases?on_conflict=alias_email',{method:'POST',headers:Object.assign({},H,{'Prefer':'resolution=ignore-duplicates,return=minimal'}),body:JSON.stringify([{alias_email:raw,canonical_email:c}])}).catch(function(){});
  $('signin').style.display='none'; $('who').textContent=n.split(' ')[0]+' · P'+p;
  load();
};
(function init(){
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged=function(){ voice=null; };
  var em=localStorage.getItem('gal_student_email'), nm=localStorage.getItem('gal_student_name'), pd=localStorage.getItem('gal_student_period');
  ME.lang=localStorage.getItem('gal_student_lang')||'none'; $('lang').value=ME.lang;
  if(em&&nm&&pd){ ME.email=em; ME.name=nm; ME.period=pd; $('who').textContent=nm.split(' ')[0]+' · P'+pd; load(); }
  else { render(); showSignin(); }
})();
</script>
